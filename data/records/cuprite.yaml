          - source_ref: uniprot_beauveria_oxalate_citrate
            supports: partial
            explanation: UniProtKB:J4KMZ7 (J4KMZ7_BEAB2, BBA_06393) in congeneric Beauveria bassiana reference proteome UP000002762 (NCBITaxon:655819) encodes Malate dehydrogenase (EC 1.1.1.37; GO:0030060 L-malate dehydrogenase (NAD+) activity; GO:0005829 cytosol).
    evidence:
      - source_ref: fomina2005
        supports: support
        explanation: Figure 1B and Results describe full-plate clearing around fungal growth on Cu2O-containing agar. This is the visual solubilization criterion used by the authors, not a complete copper mass balance or measured 100-percent metal recovery. Figure 1A is a fungal biomass tolerance ratio against mineral-free medium, not an extraction yield. Figure 2C shows Cu2O-associated mycelial morphology after three weeks. Figure 3C demonstrates oxalate and citrate production in the separate liquid experiment; Figure 3A shows acids in the mineral-free fungal culture.
      - source_ref: fomina2005
        supports: partial
        explanation: Figure 5B and the Results assign copper oxalate hydrate (moolooite, PDF 21-0297) to products from copper phosphate or cuprite. The displayed trace has a shared substrate caption rather than a separately labelled cuprite trace. It therefore supports the authors' reported product assignment with limited arm-specific traceability, not a quantified cuprite-to-pure-moolooite conversion, hydration measurement or yield. Copper-phosphate-arm electron microscopy, X-ray absorption measurements and biomass copper quantities are not transferred to the Cu2O arm.
      - source_ref: fomina2005
        supports: partial
        explanation: Organic acid production and the reported oxalate product are consistent with the proposed ligand-promoted pathway, but do not separate oxalate, citrate, proton attack and other culture effects. The abiotic oxalic acid dissolution comparison in this paper concerns phosphate substrates, not Cu2O. Neither a Cu(I)-to-Cu(II) electron balance nor a causal enzyme experiment is provided for cuprite. The endpoint of the Figure 1 summary is not explicitly stated beyond the incubation protocol.
      - source_ref: ncbi_caledonica
        supports: context_only
        explanation: The authority verifies the species label and TaxID, not the identity or activity of the unnamed experimental isolate.
      - source_ref: reference_its
        supports: context_only
        explanation: U19043.1 is a historical species reference whose direct-submission entry gives a National Taiwan University address. No specimen-country qualifier is supplied. The study compared its UK isolate to this accession; it did not deposit that isolate under this identifier.
causal_graphs:
  - id: caledonica_oxalate_citrate_cuprite_alteration_graph
    name: Beauveria caledonica oxalic and citric acid excretion, commercial Cu2O agar clearing, and moolooite product assignment
    description: Causal pathway linking congeneric Beauveria pyruvate carboxylase (UniProtKB:J5JXL6), cytosolic malate dehydrogenase (UniProtKB:J4KMZ7), oxaloacetate acetylhydrolase (UniProtKB:J4UKL8), and citrate synthase (UniProtKB:J5JPA1) to oxalic and citric acid excretion in 10 g/L glucose Modified Melin-Norkrans medium, full-plate visual clearing of 7.5 mM commercial Cu2O agar, and XRD assignment of copper oxalate hydrate (moolooite, PDF 21-0297, under a shared copper-phosphate/cuprite caption in Figure 5B) in Beauveria caledonica cultures (Fomina et al., 2005), without isolating oxalate necessity, resolving the Cu(I)-to-Cu(II) redox balance, or transferring copper-phosphate-arm microscopy/XAS/sorption metrics.
