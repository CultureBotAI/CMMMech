id: cmmmech:strontium
name: Strontium
material_kind: element
description: Strontium (Sr), represented as an element distinct from dissolved Sr(II), strontianite or other mineral species, and strontium-bearing commodities or wastes. Laboratory cultures of Bacillus sp. TK2d lowered soluble Sr from a defined saline SrCl2 medium while Sr-bearing carbonate-rich material formed. The EU 2024 critical-raw-material designation names strontium; it is not inherited by every strontium compound or waste.
