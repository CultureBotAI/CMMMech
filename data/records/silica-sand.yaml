id: cmmmech:silica-sand
name: Natural silica-sand feed
material_kind: primary_resource
description: Naturally occurring quartz-rich sand or disaggregated sandstone used as an industrial-mineral feed, represented here by two distinct English quarry samples. Yahaya's Silica 2 was a purple-red Oakamoor/Moneystone rock sample disaggregated to sand-grade powder; Silica 3 was yellow, uncemented Lower Greensand from Grandcourt near King's Lynn. The latter's XRD was dominated by quartz with minor phases assigned as kaolinite and feldspar. These are heterogeneous geological feeds, not the mineral species quartz, elemental silicon, spent foundry sand or a purity-defined silica product. The two samples' compositions and assay outcomes are not pooled. No constituent's criticality designation is transferred to this resource.
sources:
- id: yahaya2012
  title: Yahaya, S. Bacterial removal of iron impurities to increase the quality and value of industrial minerals. Newcastle University PhD thesis, repository issue year 2012; cover and declaration dated September 2011. Complete 297-page official PDF acquired; this claim assessment covers Chapter 2 methods and Chapter 5 silica microcosms, including all its figures and tables. The deposited artifact visibly retains tracked edits, comments and overlapping section/figure numbers. Printed pages and figure subjects below disambiguate locators; this is not a clean journal edition.
  url: https://theses.ncl.ac.uk/jspui/handle/10443/1346
  accessed_on: '2026-10-15'
- id: ncbi_putrefaciens
  title: NCBI Taxonomy 24, Shewanella putrefaciens, current species-level record. This identifier resolves the species name, not a verified genome or the identity of the thesis's particular stored culture.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=24&mode=Info
  accessed_on: '2026-10-15'
- id: jcm_cip8040
  title: RIKEN JCM catalogue, Shewanella putrefaciens JCM 20190T, listing CIP 80.40 among equivalent type-strain collection designations. This corroborates the thesis spelling CIP8040 as a culture designation; it does not verify that the experimental culture was independently sequence-confirmed.
  url: https://www.jcm.riken.jp/cgi-bin/jcm/jcm_number?JCM=20190
  accessed_on: '2026-10-15'
mechanisms:
- id: resting_shewanella_silica_sand_iron_reduction
  name: Resting-cell-associated reduction of iron in natural silica sand
  process: redox_transformation
  description: Washed, viable Shewanella putrefaciens cells designated CIP8040 were associated with increased HCl-extractable Fe(II) in anaerobic silica-sand microcosms relative to the displayed blank. This is consistent with reduction of feed-associated Fe(III), with lactate supplied as an electron donor. It does not establish a particular iron-mineral source, a unique electron-transfer pathway, dissolved-only iron release, isolated iron recovery or industrial deployment.
  context: The accepted core experiment used the source's Silica 3 from Grandcourt, collected in July 2008; its feed identity is distinct from Oakamoor Silica 2. Chapter 2 describes a nongrowth assay with washed stationary-phase cells, 80 mL minimal saline medium containing 0.9% NaCl and normally 10 mM lactate, in sealed, sterilized bottles purged with oxygen-free N2. Working pH was described as approximately 7.1-7.3, with dark incubation and 60 rpm shaking. The cell-density comparison used 2.5 g Silica 3, 3.5 or 7 mL stock suspension and 30 degrees C; the stock concentration was reported as 1.2 plus or minus 0.4 times 10^8 cells or CFU per mL, not the final reactor cell density. Its figure reports standard errors for three replicates. The separate AQDS comparison used 2.4 g Silica 3 and 4 mL stock cells at 30 degrees C, with or without the generally specified 100 micromolar AQDS. These arms are not pooled as identical assays. General methods describe blanks as cell-free or cell-and-donor-free
    without clearly mapping the two formulations to every figure; therefore a fully matched lactate-containing abiotic control is not assumed. For Fe(II) analysis, 1 mL unfiltered sample was mixed with 1 mL 2 M HCl for about 24 hours, filtered at 0.2 micrometres and analyzed using 1,10-phenanthroline at 510 nm. The endpoint includes acid-extractable solid-associated as well as soluble Fe(II). These laboratory microcosms do not establish a complete mass balance or a recovered product yield.
