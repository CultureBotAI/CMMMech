id: cmmmech:polylithionite
name: Polylithionite
material_kind: mineral
description: >-
  Polylithionite is the lithium-bearing mica mineral species listed by
  IMA-CNMNC in September 2026 with formula KLi2AlSi4O10F2 and approved
  status (PDF page 175). Its 1998 s.p. entry denotes a special-procedure
  action, not a modern approval-number CURIE. The Handbook of Mineralogy
  describes monoclinic material and uses the generalized formula
  KLi2AlSi4O10(F,OH)2; its natural specimen analyses and hydroxyl substitution
  are not substituted for the current IMA formula. Documented geological
  occurrence includes late-stage segregations, veinlets and metasomatic
  replacement in syenite pegmatites of the Lovozero alkalic massif.
  This establishes a lithium-bearing geological host, not a universal
  ore grade, present mining status or recovery process. The IMA-approved
  mica nomenclature report defines lepidolite as a series name for
  trioctahedral micas on or near the trilithionite-polylithionite join.
  Lepidolite is therefore not used as an exact synonym for this endmember;
  a lepidolite-labelled mixed feed needs specimen-specific characterization
  before its behavior can be assigned to polylithionite. This species is
  distinct from elemental lithium and a bulk lithium concentrate. No
  microbial mechanism or criticality designation is assigned here.
