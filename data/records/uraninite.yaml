id: cmmmech:uraninite
name: Uraninite
material_kind: mineral
description: >-
  Uraninite is the UO2 mineral species listed with grandfathered status G
  and original-description year 1845 in the September 2026 IMA compilation.
  It is distinct from elemental uranium, uranyl salts, biomass-bound U(IV)
  complexes and uranium-bearing ores. The observation below concerns
  laboratory-formed nanocrystalline UO2 identified as uraninite, not a
  natural ore feed. No criticality designation is inherited from uranium.
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC. The New IMA List of Minerals, September 2026. Uraninite
      row on PDF page 224; column definitions and terms on pages 1-2.
      Retained original rechecked on the access date.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-11'
  - id: marshall2006
    title: >-
      Marshall et al. (2006). c-Type Cytochrome-Dependent Formation of
      U(IV) Nanoparticles by Shewanella oneidensis. PLOS Biology, e268.
      DOI 10.1371/journal.pbio.0040268. Methods, Results, Figures 1-6;
      original Figures S1-S6, Protocol S1 and Tables S1-S3.
    url: https://doi.org/10.1371/journal.pbio.0040268
    accessed_on: '2026-10-11'
  - id: bernier_latmani2010
    title: >-
      Bernier-Latmani et al. (2010). Non-uraninite Products of Microbial
      U(VI) Reduction. Environmental Science & Technology 44, 9456-9462.
      DOI 10.1021/es101675a. Methods, Tables 1-2, Figures 1-2;
