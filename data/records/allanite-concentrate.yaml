id: cmmmech:allanite-concentrate
name: Allanite concentrate
material_kind: primary_resource
description: A geological rare-earth-bearing feed represented by the REE-concentrated crushed allanite ore supplied as Zappall from WRE in Schmitz et al. (2025). The paper also calls this material allanite mineral sand. Its generic allanite designation does not establish a particular allanite species, phase purity, mine of origin or commercial grade. This concentrated primary resource is distinct from an ideal mineral species, elemental rare earths, their commodities and secondary waste. No constituent criticality designation is inherited.
