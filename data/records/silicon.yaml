mechanisms:
  - id: ccmp1335_silicic_acid_utilization
    name: Conditional SIT contribution to diatom silicic-acid uptake and silica incorporation
    process: biomineralization
    description: >-
      Living Thalassiosira pseudonana CCMP1335 cultures depleted silicic acid
      from medium and incorporated a fluorescent silica tracer into their
      frustules. Joint SIT1/SIT2 knockdown delayed solution depletion and
      reduced the silica-associated fluorescence at low silicic-acid supply.
      This supports a conditional contribution to silicon utilization and
      cell-wall biosilicification, without establishing an exclusive
      transporter, a directly demonstrated sensing pathway, or metal recovery.
    context: >-
      Laboratory stock cultures grew in NEPC medium containing 100 micromolar
      Si(OH)4, on an orbital shaker at 18 degrees C under continuous light
      of 100 microeinsteins/m2/s. Exponentially growing cells were harvested
      and deprived of silicic acid before replenishment. Silica-incorporation
      Methods specify 24 h deprivation; Figures 7-8 describe overnight
      starvation. Sodium silicate supplied a nominal 20 micromolar Si(OH)4
      concentration for the selected assays. Silicomolybdate colorimetry of
      centrifuged supernatant measured disappearance, normalized per cell;
      this is a net-depletion proxy for uptake. PDMPO at 100 ng/mL, added
      five minutes before silicate, provided a flow-cytometric proxy for
      newly incorporated silica. A subset of clones was compared at
      200 micromolar supply in a separate incorporation assay. Measured
      assay pH and an abiotic medium-depletion blank are not specified in
      the inspected main methods. No isolated silica mass, crystallographic
      phase, Si(0) product or industrial deployment is established here.
    microbial: true
    organisms:
      - id: NCBITaxon:296543
        label: Thalassiosira pseudonana CCMP1335
    evidence:
      - source_ref: shrestha_2015
        supports: support
        explanation: >-
          Figure 7 compares wild type with RNAi clones R-13, R-14 and R-22
          and antisense clones A-2, A-7 and A-8. Results report that wild type
          depleted the supplied silicic acid by 2 h, whereas the RNAi clones
          required an additional hour; antisense clones showed a similar
          delay. Figure 8A-B shows lower PDMPO fluorescence in the knockdowns
          at 20 micromolar supply. These are different assays and do not
          equate net solution depletion with the amount of solid silica.
      - source_ref: shrestha_2015
        supports: partial
        explanation: >-
          Figure 8C tests wild type, R-13, A-2 and A-7 at 200 micromolar
          supply. The authors report no incorporation difference in this
          comparison; the plotted trajectories are not numerically identical.
          Figures 7-8 state standard deviations with n=3 but do not identify
          independent culture versus technical replication. The captions
          provide no inferential statistical test for the high-supply null
          statement. This limits claims that SIT knockdown universally
          suppresses silicification or that passive diffusion was directly
          demonstrated by this assay.
      - source_ref: shrestha_2015
        supports: partial
        explanation: >-
          Vector design and Figure 6 establish knockdown rather than gene
          deletion. Sequence similarity prevented separate SIT1 and SIT2
          perturbations; the immunoblot antiserum recognized all three SITs.
          No rescue experiment is described in the inspected main article.
          A sensing role is the authors' hypothesis, with an upstream sensor
          retained as an alternative. Supplementary construct/alignment
          files could not be acquired through the checked legitimate routes,
          so their sequences and supplementary predictions were not verified.
