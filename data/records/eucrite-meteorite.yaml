id: cmmmech:eucrite-meteorite
name: Eucrite meteorite
material_kind: primary_resource
description: >-
  Natural basaltic achondritic meteorite material considered as an experimental
  feed, distinct from an L-chondrite, terrestrial basalt, a pure mineral or
  secondary resource. The curated example is the EU specimen in Tonietti
  et al. (2026). Its reported mineral assemblage is dominated by plagioclase
  and pyroxene, with minor olivine and quartz. The paper attributes eucrite
  material to Vesta but gives no exact meteorite name or accession for EU;
  Table 1 says Skylab (US), whereas the acknowledgments thank SkyFall
  Meteorites. The experimental specimen's provenance is therefore incompletely
  resolved. No resource-level criticality designation is inferred from its
  constituent trace metals.
sources:
  - id: tonietti2026
    title: >-
      Tonietti et al. (2026). Bioleaching of critical trace metals by
      Sphingomonas desiccabilis: substrate-driven selectivity in Earth and
      space analogues. Frontiers in Microbiology 17:1741305.
      DOI 10.3389/fmicb.2026.1741305. Complete 14-page publisher PDF and
      full HTML inspected, including Methods sections 2.1-2.10, Tables 1-2,
      Figure 4B and EU-specific Results section 3.4. Supplementary files
      were subsequently authenticated through the NLM open-data version
      PMC13106364.1 and a byte-identical Europe PMC archive.
    url: https://www.frontiersin.org/journals/microbiology/articles/10.3389/fmicb.2026.1741305/full
    accessed_on: '2026-10-21'
  - id: tonietti2026_data
    title: >-
      Tonietti et al. (2026), DOI 10.3389/fmicb.2026.1741305. Data Sheet 1,
      two-sheet bioleaching workbook, NLM PMC13106364.1. All EU raw cells
      and 123 EU summary rows inspected, including distinct culture,
      abiotic and bulk-characterization replicates; unit and negative-value
      processing remain incompletely documented.
    url: https://pmc-oa-opendata.s3.amazonaws.com/PMC13106364.1/Data_Sheet_1.xlsx
    accessed_on: '2026-10-21'
  - id: tonietti2026_si
    title: >-
      Tonietti et al. (2026), DOI 10.3389/fmicb.2026.1741305. Data Sheet 2,
      12-page supplementary information, NLM PMC13106364.1. EU entries in
      Tables S1-S8, Figure S1 and the workbook dictionary inspected.
    url: https://pmc-oa-opendata.s3.amazonaws.com/PMC13106364.1/Data_Sheet_2.pdf
    accessed_on: '2026-10-21'
  - id: ncbi_desiccabilis
    title: >-
      NCBI Taxonomy 429134, Sphingomonas desiccabilis, species. CP1D is the
      study's strain designation; this CURIE identifies the species only.
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=429134
    accessed_on: '2026-10-16'
mechanisms:
  - id: desiccabilis_eucrite_leaching
    name: Sphingomonas-associated trace-metal mobilization from eucrite
    process: bioleaching
    microbial: true
    description: >-
      Living Sphingomonas desiccabilis CP1D was incubated with the EU meteorite
      specimen in glucose-supplemented M9 medium. Element concentrations in
      clarified liquid differed from a single uninoculated control, with
      element-dependent enhancement and inhibition. This supports a narrow
      culture-associated mobilization observation. The experiment does not
      establish a particular molecular dissolution pathway, isolated-product
      recovery or a statistically replicated abiotic comparison.
    context: >-
      Methods sections 2.1-2.4 describe crushed fragments no larger than 1 mm,
      0.15 g in each 25 mL glass tube, dry-heat sterilized at 250 degrees C
      for four hours. Each tube received 15 mL M9 with 2% m/V glucose,
      corresponding to 1% w/v pulp loading. The inoculated starting OD600
      was 0.039 +/- 0.006; cultures were incubated statically for 30 days
      at 25 degrees C. There were three biological replicates and one
      uninoculated control for each rock type, plus rock-free cultures.
      Section 2.8 measured a day-30 liquid aliquot centrifuged at 5000 rpm
      for five minutes; supernatant was acidified to 4% v/v nitric acid for
      ICP-MS/OES. The pellet was not assayed because biomass could not be
      separated reliably from rock. A biomass fraction cited from earlier
      studies was not measured in this experiment. Section 2.9 reports
      fractions of the bulk elemental inventory and biotic/abiotic ratios;
      its arbitrary ratio-at-least-two threshold is not a significance test.
      This was a terrestrial laboratory experiment on a meteorite, with
      no microgravity treatment or industrial deployment.
    organisms:
      - id: NCBITaxon:429134
        label: Sphingomonas desiccabilis
    evidence:
      - source_ref: tonietti2026
        supports: support
        explanation: >-
          Methods and EU-specific Results section 3.4/Figure 4B support the
          experimental culture, substrate and element-dependent liquid-phase
          observations. The text reports EU platinum extraction as
          (8.98 +/- 3.20) x 10^-2% of the bulk-rock platinum inventory,
          and a platinum biotic/abiotic ratio of 2.47 +/- 0.48, with figure
          error bars defined as standard errors. The acquired supplement
          instead reports a platinum ratio of 2.74 +/- 0.48; its underlying
          arithmetic is reproducible, but this is an unresolved source
          discrepancy, not a formal correction. The reported percentage
          is an endpoint summary whose physical inventory normalization
          remains unverified, not a rate or isolated-platinum recovery yield.
      - source_ref: tonietti2026_data
        supports: partial
        explanation: >-
          Raw bioleaching data (ppm) rows 6-8, 9 and 44-46 represent three
          cultured samples, one abiotic control and three bulk-characterization
          samples respectively. The latter are not documented paired culture
          inventories. Platinum cells AT6:AT9 and AT44:AT46 reproduce summary
          G189:H189, a ratio of 2.73908046 +/- 0.48114502, and I189:J189,
          the reported 0.08978626 +/- 0.03204797 percent endpoint. The ratio
          uncertainty uses cultured-sample standard error and the single
          control value; it does not estimate control variability. Both
          source roles are labeled ppm, whereas main section 2.8 describes
          conversion of liquid measurements to absolute chamber amounts.
          Missing dilution and normalization details prevent independent
          verification as mass-balanced inventory fractions. Eight negative
          EU bulk cells for B, Ag and Ni yield the published group summaries
          only after zero substitution; that arithmetic match does not
          establish a documented censoring rule or detection limit.
          Workbook blanks, literal zeros and Inf entries are not inferred
          recoveries or proof of elemental absence.
      - source_ref: tonietti2026_si
        supports: partial
        explanation: >-
          EU platinum entries in Table S5 page 7 and Table S6 page 8 agree
          with the workbook's rounded endpoint and 2.74 +/- 0.48 ratio,
          while the main text prints 2.47 +/- 0.48. EU palladium's
          Table S6 ratio of 1.96 +/- 0.36 remains below the arbitrary
          twofold criterion. Table S5's NA and Table S6's NA/NL categories
          combine different missing or zero conditions; the page 12 data
          dictionary does not resolve negative-value or normalization
          semantics. These are supplements to the same experiment, not
          an independent replication or a resolution of specimen provenance.
      - source_ref: tonietti2026
        supports: partial
        explanation: >-
          Figure 4B and section 3.4 show selective responses, not universal
          enhancement: the EU palladium biotic/abiotic ratio is below two,
          even though palladium is detected in the cultured liquid. One
          abiotic replicate cannot characterize control variability; the
          study's twofold criterion does not supply that missing replication.
          Large cerium and thorium extraction percentages reported for
          Sudbury mine specimens elsewhere in the article do not describe EU.
      - source_ref: tonietti2026
        supports: context_only
        explanation: >-
          Discussion proposes biofilm-associated local complexation and
          ligand-mediated release, but does not directly measure the causal
          ligands or demonstrate specific mineral-phase dissolution for EU.
          Table 2 labels its mineral proportions percent m/V despite the
          Rietveld method; no corrected unit or independent specimen identity
          is inferred here. The acquired supplements leave specimen
          provenance, quantitative normalization and negative-value handling
          unresolved, constraining reuse of the results.
