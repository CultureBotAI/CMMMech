id: cmmmech:bismuthinite
name: Bismuthinite
material_kind: mineral
description: Bismuthinite is the orthorhombic Bi2S3 mineral species, listed with grandfathered status G and original-description year 1832 in the September 2026 IMA list. It is distinct from elemental bismuth, bismuth oxides, bismuth selenides or tellurides, and an uncharacterized material described only by nominal Bi2S3 composition. The experiment below concerns a synthetic phase assigned to bismuthinite by powder XRD, not a natural ore feed. No constituent criticality designation or microbial activity is inferred.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Bismuthinite row, PDF page 26, and page 1 definitions of status G and original-description year. Retained issuing original re-inspected.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: handbook_bismuthinite
  title: Handbook of Mineralogy. Bismuthinite, version 1 (2001-2005). Complete one-page species entry, formula and orthorhombic structure.
  url: https://www.handbookofmineralogy.org/pdfs/bismuthinite.pdf
  accessed_on: '2026-10-14'
- id: carrasco_gonzalez_2024
  title: Carrasco-Gonzalez, Ortega-Amaya, Diaz-Torres, Perez-Guzman and Ortega-Lopez (2024). Low-Temperature Synthesis of Bi2S3 Hierarchical Microstructures via Co-Precipitation and Digestive Process in Aqueous Medium. Materials 17(8), 1818. Complete ten-page original, Experimental Procedures and Results, Figures 1-5; no separate supplement listed in inspected PDF/JATS, and data availability states data are within the article.
  url: https://doi.org/10.3390/ma17081818
  accessed_on: '2026-10-14'
mechanisms:
- id: abiotic_coprecipitation_and_digestion
  name: Abiotic aqueous precipitation and morphological development of synthetic bismuthinite
  process: other
  microbial: false
  description: Aqueous bismuth nitrate, thioglycolic acid and thioacetamide produced solids whose powder diffraction patterns were assigned to orthorhombic bismuthinite. Representative products prepared at 25 and 70 degrees C showed different aggregated morphologies after reaction and digestion. This is laboratory chemical synthesis; it does not demonstrate microbial mineral formation, extraction of bismuth from natural ore or waste, or industrial recovery.
  context: Section 2.1 and Figure 1 describe separate preparation of a 0.1 M thioacetamide stock and bismuth nitrate dissolved in thioglycolic acid, addition of water, 15-minute equilibration at 25 or 70 degrees C, mixing, and 60-minute reaction at the selected temperature. Heating was then stopped for a 24-hour digestion, described in Section 3.2 as occurring at room temperature. The supernatant was poured off, sediment washed to neutral pH and dried at 70 degrees C. No cells or microbial biomass were used. Exact bismuth and thioglycolic-acid quantities and the full composition matrix of the four reported series are not given; a final concentration or complete reproducible recipe is not inferred.
  evidence:
  - source_ref: carrasco_gonzalez_2024
    supports: support
    explanation: Sections 2.2 and 3.1 and Figure 2 show powder XRD for representative BiSTAX samples prepared at 25 degrees C and BiS10X samples prepared at 70 degrees C, compared with bismuthinite reference card 00-006-0333. The authors assigned the detected reflections to bismuthinite and reported no additional crystalline-phase peaks. This supports the source-assigned synthetic phase, not quantitative purity, an amorphous-phase exclusion or a recovery yield; no phase-fraction refinement or detection limit is supplied.
  - source_ref: carrasco_gonzalez_2024
    supports: support
    explanation: Sections 2.2 and 3.1 report a 15-40 nm crystallite-size range estimated using diffraction peak widths and the Scherrer equation. Figures 3-4 show larger aggregated structures by SEM, with sponge-, dandelion- and flower-like forms among the representative samples. The diffraction-derived crystallite estimate is not an independently measured primary-particle size distribution, product mass balance or isolated-bismuth recovery percentage.
  - source_ref: carrasco_gonzalez_2024
    supports: partial
    explanation: Section 3.2 and Figure 5 propose sequential assembly, Ostwald ripening, redissolution and reshaping from selected SEM morphologies. They do not directly track a single structure through those stages or isolate each proposed cause with omission controls. The authors explicitly say thioglycolic acid's directing role is unclear, despite earlier wording attributing morphology differences to its content. Section 2.1 gives a minimum reported reaction time of about 3 minutes, whereas Section 3.2 describes an aliquot taken about 1 minute after precipitation began; these early-time statements are not silently reconciled.
  - source_ref: carrasco_gonzalez_2024
    supports: partial
    explanation: Only representative products from the stated four series are presented; experimental replicate counts and uncertainty for the morphology/size summaries are not specified. Washing and 70-degree drying precede powder characterization, so the final powder alone does not isolate the wet-precipitation morphology. Claims of high purity, high surface area, low toxicity or potential sensing/catalytic usefulness are not adopted as measured purity, surface-area, toxicity or application-performance results. No microbial comparison, natural-feed extraction or industrial deployment is tested.
