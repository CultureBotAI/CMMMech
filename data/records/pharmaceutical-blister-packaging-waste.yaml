  evidence:
  - source_ref: kremser2023
    supports: support
    explanation: Sections 2.5-2.6 and 3.3, Figures 2-4 support aluminium mobilization and separation of polymer-rich residues. The authors report near-complete leaching from transparent and white fractions within seven to nine days in flasks, while silver-coloured material reaches only about 36% at best. Its higher Al inventory, greater pH rise and changed redox potential accompany poorer release; those observations do not isolate the causal contribution of each factor. Later trials exclude the silver fraction.
  - source_ref: kremser2023
    supports: partial
    explanation: Figure 3 and Section 3.3.2 show that commercial and biogenic acid perform similarly at 50 degrees C. Finer shredding did not materially improve the tested outcomes. Figure 4 reports approximately 90% and 81% Al leaching at day 14 for transparent and white material in the 1 L trials, below the flask results. These comparisons refute an unconditional advantage of biogenic acid or of increasing reactor size. Foam-associated Al retention is a proposed explanation, not a quantified inventory balance.
  - source_ref: kremser2023
    supports: partial
    explanation: Reported percentages are retained as the authors' leaching estimates, not recalculated yields. The accessible rendition of Equation 2 places the solid Al inventory above the liquid inventory, opposite the usual released-fraction ratio; the intended calculation is unresolved. Some Figure 2 and 3 bars exceed 100%, and Section 3.3.1 later calls the silver material 63% Al instead of Section 3.1's 67.6%. No raw replicate data or complete solid-liquid Al balance resolves these differences here.
  - source_ref: kremser2023
    supports: partial
    explanation: Biosurfactants and other metabolites are proposed from foam and acid-type differences, without chemical identification or a component-specific intervention. The reagent comparator does not match all medium solutes. Section 3.3.3 proposes hydroxide precipitation using earlier work; it does not supply a blister-specific isolated Al product yield or purity. Polymer reprocessing separately required thermal treatment, with ethyl acetate cleaning and stabilizer comparisons; discoloration persisted. These laboratory tests establish neither industrial deployment nor a process-wide economic or environmental advantage.
  - source_ref: kremser2022_acid
    supports: context_only
    explanation: The cited upstream method uses DSM 504 and DSM 9466 for sulfur oxidation, with aerated, stirred acid production and filtration of withdrawn liquor. This explains the microbial origin of the leaching reagent. It does not authenticate the later blister liquor, assign strain-specific causality, or transfer incineration-slag outcomes to pharmaceutical packaging.
  - source_ref: dsm504
    supports: context_only
    explanation: DSM 504 resolves to the study's A. thiooxidans collection label.
  - source_ref: dsm9466
    supports: context_only
    explanation: DSM 9466 resolves to A. caldus C-SH12, consistent with the paper.
  - source_ref: ncbi_thiooxidans
    supports: context_only
    explanation: The CURIE identifies the species, not DSM 504 or its stock provenance.
  - source_ref: ncbi_caldus
    supports: context_only
    explanation: The CURIE identifies the species, not DSM 9466 or its role in the mixture.
