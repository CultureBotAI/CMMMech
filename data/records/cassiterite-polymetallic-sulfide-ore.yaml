id: cmmmech:cassiterite-polymetallic-sulfide-ore
name: Cassiterite-polymetallic sulfide ore
material_kind: primary_resource
description: A heterogeneous natural tin-bearing geological feed containing cassiterite and sulfide minerals, represented here by the Myanmar ore studied by Wang et al. (2025). The crushed experimental ore contained source-assigned pyrite, cassiterite, quartz, tourmaline and mica. Its mine and deposit are not specified. Crushing does not establish a processing-waste origin. This resource is distinct from cassiterite or pyrrhotite mineral species, elemental tin, a tin commodity and a produced concentrate. The study does not establish extraction from a pure mineral or properties of all ores described by this name. No criticality designation is inherited from tin.
sources:
- id: wang2025
  title: Wang M, Zeng W, Yan Z, Shen L, Yu R, Wu X, Li J, Qiu G, Streit W and Liu Y (2025). The Bio-Desulfurization of Cassiterite-Polymetallic Sulfide Ores Enhanced by a Consortium of Moderately Thermophilic Bacteria. Separations 12(3):61. DOI 10.3390/separations12030061; complete 13-page publisher PDF and XML, Sections 2-5, Figures 1-7 and Tables 1-2.
  url: https://doi.org/10.3390/separations12030061
  accessed_on: '2026-10-12'
- id: ncbi_ferriphilum
  title: NCBI Taxonomy 178606, Leptospirillum ferriphilum, species; official live taxonomy page. Species mapping does not identify the experimental isolate.
