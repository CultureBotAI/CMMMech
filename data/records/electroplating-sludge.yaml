  evidence:
  - source_ref: prabhu2015
    supports: support
    explanation: Methods pp. 1250-1251 and Figures 2-4 support culture-associated acidification and aqueous metal mobilization. The 1% treatment ended at pH 1.17 versus 2.63 in the uninoculated control. Results pp. 1252-1253 report Zn/Ni leaching percentages 96.31/84.40 at 1% solids and 79.03/66.14 at 5% after 20 days; Figure 4 shows substantially smaller nonzero control release. These are source-reported assay percentages, not independently reconstructed mass recoveries.
  - source_ref: prabhu2015
    supports: partial
    explanation: Printed Equation 4 uses (M0−Msoln)/MT although its definitions describe increasing aqueous metal at time t; the solid/liquid normalization and corrections for repeated sampling are not resolved. Thus the percentages retain a calculation limitation. Only the 1% loading has the stated uninoculated control, which also differs by thymol/alcohol; lower pH and mobilization do not isolate a contribution beyond acid leaching. No sequence-based identification, mineral-phase-resolved reaction, purified product, complete mass balance, or industrial deployment is demonstrated.
  - source_ref: prabhu2015
    supports: partial
    explanation: Figures 7-10 and Tables 3-4 are model fits, not independent mechanistic proof. Several Ni regression coefficients in Table 4 disagree with the original plotted labels, and Table 4 gives higher liquid-film than chemical-reaction R² for 2-4% solids. The paper's universal chemical-reaction-control conclusion is therefore not adopted. Table 2 reports organic matter 4.1±0.11%, whereas the prose gives 4.1 mg/kg; the medium prints Ca(CO3)2. These source inconsistencies are not silently corrected or used to infer nutrient or phase mechanisms.
- id: cell_removed_ferric_acid_ultrasound
  name: Ultrasound-assisted leaching with culture-generated ferric acidic liquor
  process: bioleaching
  description: Acidithiobacillus ferrooxidans was used upstream to prepare acidic ferric liquor; after centrifugation, the source-described cell-free reagent leached Cr, Cu and Ni from electroplating sludge. Ultrasound comparisons concern this subsequent chemical leaching stage. They do not demonstrate living-cell contact with sludge or an advantage over chemically equivalent acid and ferric iron.
  context: Kordloo et al. report a feed containing 8.23% Cr, 5.97% Cu and 10.92% Ni; supplier/site and detailed generation history are not given. The culture came from the Soil and Water Research Institute, Karaj, without a strain identifier. Sulfur/ferrous medium was initially acidified to pH 1.8; 100 mL cultures with 10% inoculum were shaken for one week at 34 °C and 140 rpm. The final liquor was reported at pH 1.2, 650 mV ORP and 9 g/L ferric iron, then centrifuged 15 min at 5000 rpm. A 100 mL portion was used in 250 mL three-neck leaching flasks. A 37 kHz, 150 W ultrasonic bath was tested against no ultrasound; OFAT assays varied 300-500 rpm, 10-50 g/L solids and ambient to 75 °C, with triplicate experiments. Initial acid addition and culture-derived iron remain part of the reagent; centrifugation alone is the reported cell-removal step.
