id: cmmmech:heterosite
name: Heterosite
material_kind: mineral
description: Heterosite is the ferric phosphate mineral with ideal formula Fe3+(PO4), listed as grandfathered
  by IMA-CNMNC in September 2026 with original-description year 1826. Natural specimens can contain substantial
  trivalent manganese. It is distinct from lithium-bearing triphylite and Mn3+-dominant purpurite. Eventoff
  et al. (1972) refined a natural Fletcher Quarry, New Hampshire crystal of approximate composition (Fe0.65Mn0.35)PO4
  with an effectively vacant lithium site. The 2023 triphylite-group nomenclature retains heterosite while
  discrediting ferrisicklerite and sicklerite; the historical oxidation experiment already curated under
  cmmmech:triphylite is not counted here as a new experiment. The separate Reich et al. (2024) study concerns
  a synthetic heterosite-structure FePO4 sorbent made from commercial carbon-coated LiFePO4, not mined
  natural heterosite. Its laboratory lithium uptake from pretreated natural geothermal brine and a separate
  synthetic brine does not establish purified lithium recovery, natural-ore extraction, microbial activity
  or industrial deployment. No constituent-element criticality is inherited.
