- finding_id: cmmmech-cycle12-stage4-finding-0001
  status: open
  summary: In data/records/anatase.yaml (cmmmech:anatase, mineral, Ping et al. 2016),
    mechanisms[0].protein_examples[0..1], causal_graphs[0].nodes[0..1].protein_examples[0],
    and causal_graphs[0].edges[0..1] name 'pET28a-INP-silaffin' and state that 'non-engineered
    E. coli controls were not included', contradicting mechanisms[0].context (pET(INP-nR5)
    with n = 1, 3, 5 R5 repeats in E. coli BL21(DE3)) and mechanisms[0].evidence[2]
    (INP-only comparator cells tested in Figures S2 and S4b, while matched cell-free
    precursor and live-vs-killed controls were omitted); additionally, nodes[1,3]
    and edges[0,2] omit proposed-mechanism, 37 C / 80 C / 600 C air-vs-argon, and
    PDF 21-1271/21-1272 qualifications.
- finding_id: cmmmech-cycle12-stage4-finding-0002
  status: open
  summary: 'In data/records/selenium.yaml (cmmmech:selenium, element, Li et al. 2014
    and Klonowska et al. 2005), causal_graphs[0] and protein_examples[0..1] (UniProtKB:P83223
    FccA, UniProtKB:Q8E8S0 CymA) use abbreviated 75-90 char explanations and supports:
    support polarity stating direct periplasmic FccA catalysis and periplasmic/cell-envelope
    Se(0) accumulation, omitting conditional deletion kinetics (0.54 +/- 0.13 vs 1.35
    +/- 0.05 umol/h in Figure 2), absence of complementation or purified-FccA assays,
    substantial residual reduction in delta-cymA (Figure 4; klonowska_2005), and predominantly
    intracellular plus smaller surface particle localization (Figure 5 TEM/EDX and
    48 h Se 3d XPS; Table 1 ICP-AES balance).'
- finding_id: cmmmech-cycle12-stage4-finding-0003
  status: open
  summary: 'In data/records/praseodymium.yaml (cmmmech:praseodymium, element, Diep
    et al. 2026) and data/records/rare-earth-element-commodities.yaml (cmmmech:rare-earth-element-commodities,
    commodity, Mattocks et al. 2023), immobilized-lanmodulin column causal graphs
    retain abbreviated 71-119 char node/edge descriptions and supports: support explanations
    omitting 0.8 mL vs 0.4 mL repeat-column batch variance (Figure 6d vs Extended
    Data Figure 8d in diep2026), Page 92 / Extended Data Figure 6 immobilized-dimer
    minority and bare-agarose control caveats in mattocks_2023, and summed-eluate
    yield denominator / binary molar-share purity qualifications.'
