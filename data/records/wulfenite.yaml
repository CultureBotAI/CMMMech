mechanisms:
- id: abiotic_sulfidization_and_molybdenum_leaching
  name: Abiotic sulfidization and aqueous molybdenum mobilization
  process: other
  microbial: false
  description: In Cai2024, sodium-sulfide treatment of a characterized natural wulfenite preparation released
    molybdenum into the aqueous fraction and produced solid-state signals assigned to PbS alongside residual
    PbMoO4. The authors interpreted the combined leaching, diffraction, Raman, XPS and microscopy evidence
    as interface-coupled dissolution and precipitation with a porous PbS product layer. The reaction sequence
    and diffusion-controlled later stage are mechanistic interpretations; the schematic core-shell model
    is not a direct time-resolved measurement of reaction fronts. At the source's molar Na2S:PbMoO4 ratio
    of 1 and selected 30-minute endpoint, Figure 1b and Section 2.1 report Mo leaching ratios of 59.44%
    at 25 degrees C and 94.43% at 90 degrees C. These are solution-assay fractions of the starting Mo
    inventory, not isolated molybdenum product yields.
  context: Laboratory chemical treatment, with no cells or microbial reagent production. Natural square
    plate-like material from Xinjiang, China was hand selected, dry ground and screened to 38-72 micrometres.
    Table 1 reports 54.64 wt.% Pb and 25.43 wt.% Mo, corresponding to calculated PbMoO4 purities of 96.83%
    and 97.32% on the respective elemental bases; Section 3.1 also reports 0.42 wt.% WO3 and 0.56 wt.%
    CaO. These estimates and the lack of detected impurity diffraction peaks do not prove absolute phase
    purity. Each assay used 0.755 g powder and 20 mL Na2S solution made with analytical Na2S.9H2O in a
    covered 50 mL glass bottle, a thermostated bath and magnetic stirring. The dose series in Figure 1a
    is at 25 degrees C; the temperature series in Figure 1b holds the molar ratio at 1. Section 3.3's
    washed, vacuum-dried solids were treated for 30 minutes at 25 degrees C; those characterizations are
    not automatically the 90-degree leach residue. Untreated material is shown in Figures 2-5. Dissolved
    Mo was assayed by thiocyanate spectrophotometry, with the source's Equation 1 normalizing concentration
    times liquid volume against sample mass and Mo content. The methods do not specify the solid-liquid
    separation cutoff, initial/final pH, agitation speed, replicate number or analytical uncertainty for
    these leaching runs. Figure S1 falls between 30 and 40 minutes; without replicate/error information,
    this does not establish a significant decline or a monotonic approach to equilibrium. The paper contains
    inconsistent statements about PbS solubility; this contradiction is retained as a limit, not used
    to infer a unique kinetic model. Flotation optimization and grinding-assisted leaching are proposed
    implications; neither a flotation campaign nor industrial deployment is demonstrated by this experiment.
  evidence:
  - source_ref: cai2024
    supports: support
    explanation: Sections 2.1-2.4 and Figures 1-5 support aqueous Mo mobilization, PbS-assigned product
      signals and residual wulfenite after chemical treatment. Sections 3.1-3.3 and Table 1 define the
      feed, conditions and assay denominator. Figure 1a's 64.15% endpoint is at a different dose from
      Figure 1b's 59.44% at ratio 1; they are not treated as contradictory measurements of one run.
  - source_ref: cai2024
    supports: partial
    explanation: Section 2.5 and Figure 6 propose coupled dissolution-precipitation and a diffusion-limiting
      product shell; no direct time-resolved reaction-front series or isolated-product mass balance is
      shown. The same section first describes PbS as less soluble than PbMoO4 but later calls it more
      soluble. Figure 3's intermediate optical and Raman panels are both labelled with molar ratio 0.05.
      Solubility ordering, shell transport and industrial implications require additional evidence beyond
      the bounded observation.
  - source_ref: cai2024_supplement
    supports: partial
    explanation: Figure S1 supports a finite sampled time series with the largest plotted value at 30
      minutes and a lower 40-minute value; the main text selects 30 minutes because later leaching does
      not increase significantly, without reported replicate uncertainty. Table S1 contains thermodynamic
      calculations, not observed rates or product yields. Neither artifact establishes a universal optimum,
      a microbial contribution or industrial performance.
