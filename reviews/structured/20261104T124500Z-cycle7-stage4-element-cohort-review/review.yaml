findings:
- finding_id: cmmmech-cycle7-stage4-finding-0002
  issue_key: cmmmech.cycle7-stage3-sulfur-graphs.edge-desc-grammar-and-incomplete-edge-evidence-loci
  title: Nine Cycle 7 Stage 3 sulfur-oxidizing causal graphs have subject-verb number disagreement in edge descriptions and
    7 omit Stage-3-added homolog loci in edges[0].evidence[0].explanation
  severity: minor
  category: graph
  certainty: confirmed
  status: open
  target_ids:
  - cmmmech:copper
  field_paths:
  - causal_graphs[0].edges[0].description
  - causal_graphs[0].edges[0].evidence[0].explanation
  - causal_graphs[0].edges[1].description
  evidence_ids:
  - ev-element-cohort-audit
  - ev-copper-stage3-graph
  description: 'Across the 9 sulfur-oxidizing causal graphs updated in Cycle 7 Stage 3 (PR #915, commit ff4a9841) (1 element:
    copper.yaml; 3 mineral: chalcopyrite.yaml, molybdenite.yaml, skutterudite.yaml; 2 primary_resource: cassiterite-polymetallic-sulfide-ore.yaml,
    chalcopyrite-enargite-concentrate.yaml; 3 secondary_resource: coal-beneficiation-waste.yaml, copper-smelter-flue-dust.yaml,
    pyrite-roasting-cinder.yaml), edges[0] (sqr_reductase -> tth_hydrolase) and edges[1] (tth_hydrolase -> <leach_system>)
    had their pluralized node labels substituted into edge.description while retaining singular verbs (''Sqr ... oxidoreductases
    (...) oxidizes ...'' or ''Sqr ... reductases (...) catalyzes ...'', and ''TetH/Tth tetrathionate hydrolases (...) disproportionates
    ...'' or ''Tth tetrathionate hydrolases (...) disproportionates ...''), and in 7 of those 9 records (cassiterite-polymetallic-sulfide-ore.yaml,
    chalcopyrite.yaml, chalcopyrite-enargite-concentrate.yaml, coal-beneficiation-waste.yaml, copper.yaml, molybdenite.yaml,
    pyrite-roasting-cinder.yaml) edges[0].evidence[0].explanation still lists only the pre-Stage-3 Sqr/TetH/Tth locus subset
    (''(Atc_1705, Atc_1437, Y981_02650) and TetH (Atc_1595)'' or ''Sqr paralogs (AFE_1792, AFE_0267) and Tth (AFE_0029)''),
    omitting the Stage-3-added Sulfobacillus thermosulfidooxidans DSM 9293 Sqr (SAMN00768000_0580), Acidithiobacillus caldus
    ZBY TetH (tetH / BAE30_05680), and Acidithiobacillus ferrooxidans DSM 16523 Tth (DN052_12875) homologs grounded on sqr_reductase
    and tth_hydrolase. In this scope, 1 record(s) (copper) are affected.'
  owner_paths:
  - repository: CultureBotAI/CMMMech
    path: data/records/copper.yaml
    role: maintained_record
actions:
- action_id: act-normalize-stage3-sulfur-graph-edge-descriptions-and-explanations
  finding_ids:
  - cmmmech-cycle7-stage4-finding-0002
  target_ids:
  - cmmmech:copper
  description: Update causal_graphs[0].edges[0].description and causal_graphs[0].edges[1].description across the 9 Cycle 7
    Stage 3 sulfur-oxidizing records so plural subjects take plural verbs ('oxidize'/'catalyze' and 'disproportionate'), and
    update causal_graphs[0].edges[0].evidence[0].explanation in the 7 affected records to list all grounded Sqr and TetH/Tth
    homolog loci during Stage 5 grouped remediation with canonical history provenance.
  owner_paths:
  - repository: CultureBotAI/CMMMech
    path: data/records/copper.yaml
    role: maintained_record
  acceptance_checks:
  - All 9 records use grammatical plural verbs in causal_graphs[0].edges[0..1].description and list all grounded Sqr and TetH/Tth
    loci in edges[0].evidence[0].explanation.
  - Matching EDIT history sidecars exist in history/records/ and pass just check.
