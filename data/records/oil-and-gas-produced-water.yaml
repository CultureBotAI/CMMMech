id: cmmmech:oil-and-gas-produced-water
name: Oil and gas produced water
material_kind: secondary_resource
description: >-
  Water brought to the surface as a byproduct of hydrocarbon production and
  considered here as a secondary feed for constituent recovery. It can contain
  formation water, returned injected fluids, condensed water and mixtures of
  these; its composition and salinity vary by reservoir and operation. This
  record concerns the generated oil-and-gas production stream, not an untouched
  geological brine resource, geothermal extraction feed, individual dissolved
  element or mineral species. Some produced waters are investigated as sources
  of lithium and other constituents, without implying that every sample contains
  economically recoverable quantities. USGS resource research supplies context,
  not a criticality-list designation for this mixture. Microbial treatment and
  recovery mechanisms remain unasserted pending verification of full experimental
  methods, controls and outcomes; no deployment or product yield is claimed.
sources:
  - id: usgs2014_identity
    title: >-
      Engle, Cozzarelli and Smith (2014). USGS Investigations of Water Produced
      During Hydrocarbon Reservoir Development. USGS Fact Sheet 2014-3104,
      November 2014, DOI 10.3133/fs20143104. Page 1 Introduction and page 2
      Definitions of selected terms distinguish produced water from formation
      water and flowback, and describe variable production-stream composition.
    url: https://pubs.usgs.gov/fs/2014/3104/pdf/fs2014-3104.pdf
    accessed_on: '2026-10-11'
  - id: usgs_oilfield_resource
    title: >-
      USGS Mendenhall Research Fellowship Program, opportunity 23-04.
      Evaluation of oilfield brine lithium commodity resources of the Paradox
      and Williston basins. Historical opportunity with application deadline
      1 November 2024, accessed 11 October 2026. Description identifies
      oil-and-gas co-produced waters as a petroleum-industry waste stream and
      discusses proposed resource evaluation, not demonstrated microbial recovery.
    url: https://www.usgs.gov/centers/mendenhall-research-fellowship-program/23-04-evaluation-oilfield-brine-lithium-commodity
    accessed_on: '2026-10-11'
