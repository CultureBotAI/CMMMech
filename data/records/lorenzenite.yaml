id: cmmmech:lorenzenite
name: Lorenzenite
material_kind: mineral
description: Lorenzenite is the sodium titanium silicate mineral with ideal formula Na2Ti2O3(Si2O6), equivalent
  to Na2Ti2Si2O9. The September 2026 IMA-CNMNC list gives grandfathered status G and original description
  year 1901, not an IMA approval number. Ramsayite is a historical name for the same species, not a separate
  material owner. Sundberg, Lehtinen and Kivekas (1987) refined a natural crystal from Helsinki museum
  specimen 4937, labelled from Lovozero on the Kola Peninsula. Their Pbcn model contains pyroxene-type
  silicate chains, distorted TiO6 octahedra and seven-coordinate sodium. The single-crystal refinement
  used 778 selected reflections from 1167 measured independent reflections and reported R=0.026. The chemistry
  cited for that specimen was from earlier work, not a new bulk assay in 1987. Historical cell-setting
  and oxygen-coordinate discrepancies are discussed in the original study. This identity record does not
  assert a dissolution, synthesis or microbial mechanism, a recovery yield, industrial use or criticality
  inherited from titanium.
