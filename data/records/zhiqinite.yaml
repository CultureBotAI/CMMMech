id: cmmmech:zhiqinite
name: Zhiqinite
material_kind: mineral
description: >-
  IMA-approved super-reduced titanium disilicide mineral (IMA 2019-077; status A, Approved
  2019; full description published November 2020; no mineral symbol assigned in the
  September 2026 IMA Master List, PDF p. 240, or in the type description) with ideal
  end-member formula TiSi2 (requiring Ti 46.01 wt%, Si 53.99 wt%, total 100.00 wt%; Xiong
  et al., 2020, European Journal of Mineralogy 32:557-574). Isostructural with synthetic
  orthorhombic C54-type TiSi2 (Laves and Wallbaum, 1939; Jeitschko, 1977) and named in
  honour of Professor Zhiqin Xu (b. 1941), Academician of the Chinese Academy of Sciences
  (1995) at the Institute of Geology, Chinese Academy of Geological Sciences (CAGS),
  Beijing, and Nanjing University, for her contributions to structural geology,
  Continental Scientific Drilling, and Tibetan Plateau tectonics. Discovered with cotype
  badengzhuite (TiP, IMA 2019-076), native silicon (Si), and the unnamed ternary
  intermetallic phases Ti10(Si,P,[])7 (hexagonal P63/mcm, #193, isostructural with
  synthetic Ti5Si3 with P and vacancies on the 4d site, a = 7.40(15) A, c = 5.08(10) A,
  V = 241(10) A3, R(3sigma) = 0.1235) and Ti11(Si,P)10 (tetragonal I4/mmm, #139, Ho11Ge10
  structure type, a = 9.48(19) A, c = 13.97(28) A, V = 1255(57) A3) inside a single 20 um
  intermetallic melt-droplet spheroid enclosed in a corundum grain separated from the
  Cr-11 podiform chromitite orebody (29 deg 11 min N, 92 deg 18 min E; 5300 m elevation),
  Kangjinla district, Luobusa ophiolite, Yarlung Zangbo suture zone, ~200 km
  east-southeast of Lhasa, Tibet, China (inferred to have crystallized at ~1300 deg C from
  trapped Ti-Si-P alloy melts formed by interaction of mantle-derived CH4 + H2 fluids with
  basaltic magmas at ~30-100 km depth and fO2 more than 6 log units below the iron-wustite
  buffer, surrounded by a ~1 um halo of a K-bearing dmisteinbergite-like phase
  KCa3(Al7Si9)O32); the holotype specimen and focused-ion-beam (FIB) TEM foil no. 5358 are
  deposited in the Chinese Geological Museum, Xicheng District, Beijing, China, under
  catalogue number M13817. Occurs as stubby, subhedral, tabular crystals up to ~1.5 x 4 um
  across in FIB foil no. 5358, enclosing submicrometric globules (<=0.5 um) and an oval ~1
  um grain of badengzhuite (TiP); owing to the <=4 um crystal size, direct optical,
  hardness, cleavage, fracture, and experimental powder X-ray diffraction measurements
  could not be performed, with the mineral inferred to be opaque and compared with
  synthetic TiSi2 (iron-grey colour, metallic lustre, brittle tenacity, Mohs hardness 4-5,
  measured density 4.02 or 4.12 g/cm3), while the density calculated from the ab initio 3D
  electron diffraction structure solution is Dcalc = 4.132 g/cm3 (compared with 4.072
  g/cm3 calculated from the structural data of Jeitschko, 1977; Section 5.2, p. 565).
  Standardless energy-dispersive X-ray spectroscopy (EDX, Cliff-Lorimer thin-specimen
  approximation on a Zeiss Libra 120 TEM at 120 kV with a Bruker XFlash6T-60 detector;
  Table 3, n = 2 analyses at points 428 and 429 in foil no. 5358, after excluding Cu from
  the TEM grid; P, O, and other elements were below detection limits) yielded Ti
  45.03(187) wt% (31.83 at.%) and Si 54.97(204) wt% (68.17 at.%) at point 428 and Ti
  45.77(189) wt% (32.45 at.%) and Si 54.23(201) wt% (67.55 at.%) at point 429, with mean
  Ti 45.40 wt% (SD 0.52; mean 32.14 at.%, SD 0.44) and Si 54.60 wt% (SD 0.52; mean 67.86
  at.%, SD 0.44; total 100 wt% / 100 at.%), corresponding on the basis of 3 atoms per
  formula unit to the empirical formula Ti0.964Si2.036. Crystallizes in the orthorhombic
  system, space group Fddd (#70, origin choice 2), with three-dimensional electron
  diffraction (3D ED; 1 deg precession, ASI Timepix single-electron camera, PETS, SIR2014
  direct methods, and JANA2006 dynamical refinement using 65 of 111 tilt patterns at 1 deg
  steps from -55 to +55 deg to R(3sigma) = 0.1301 at point 428) unit-cell parameters a =
  8.18(16) A, b = 4.85(10) A, c = 8.42(17) A, V = 334(12) A3, and Z = 8 (note that the
  Abstract on p. 557 misstates the lattice type as "a primitive orthorhombic cell",
  whereas Section 5.4 and Figure 6 on p. 566 confirm that space group Fddd has an
  F-centered orthorhombic lattice with characteristic chess-board extinctions). In the
  crystal structure (Table 5 and Figure 8), Ti1 at (0.125, 0.125, 0.125) (multiplicity 8,
  refined Uiso = -0.0032(16) A2, slightly negative within 2sigma of zero under dynamical
  electron diffraction refinement) and Si1 at (0.4528(14), 0.125, 0.125) (multiplicity 16,
  Uiso = 0.0028(20) A2) form stacked hexagonal close-packed TiSi2 layers parallel to (001)
  in which each Ti atom is coordinated by six Si atoms within the layer (Ti1-Si1 = 2.71(5)
  A x 2 and 2.78(6) A x 4) and four Si atoms in adjacent layers above and below (Ti1-Si1 =
  2.55(5) A x 4), while Si-Si distances are Si1-Si1 = 2.55(5) A x 2 and 2.78(6) A x 2
  (simulated CuKalpha powder X-ray diffraction pattern reported in Supplement Table S2).
  No biological or microbial interaction data are reported in the type mineralogical
  description.
