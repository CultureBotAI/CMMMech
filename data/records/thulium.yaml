mechanisms:
- id: bsubtilis_powder_tm_biosorption
  name: Thulium biosorption by boiled and freeze-dried Bacillus subtilis cell powders
  process: biosorption
  microbial: true
  organisms:
  - id: NCBITaxon:224308
    label: Bacillus subtilis subsp. subtilis str. 168
  description: >-
    Inactive cell powders from B. subtilis 168 and its LTA-defective RY1604
    derivative removed dissolved thulium from defined chloride solutions. Table 3
    entry 4 reports 90% and 74% removal for WT and LTA-defective powders,
    respectively, at 20 micrograms Tm/mL. Removal persisted in the defective
    preparation, so the comparison does not establish an exclusive
    lipoteichoic-acid-mediated route or quantify its contribution. Nitric acid
    eluted adsorbed rare-earth ions in a separate recovery
    step; the study did not establish a purified thulium-metal product.
  context: >-
    The accepted manuscript describes RY1604 as deletions of yfnI, yqgS and yvgJ
    combined with inducible ltaS, prepared after IPTG removal; Table 1 uses yvyJ
    where the construction methods use yvgJ. Biomass was boiled for 20 minutes,
    washed, freeze-dried, crushed and sieved to 53–100 micrometres. Assays used
    20 mg powder in 20 mL metal solution at pH 3, 25 degrees C, mixed at 10 rpm
    for 30 minutes. Filter paper with nominal 7-micrometre retention and subsequent
    centrifugation separated solids before ICP atomic-emission spectrometry.
    Filter-associated adsorption was reported below 10%, but a blank-correction
    calculation and replicated uncertainty for Table 3 were not specified.
    WT-versus-mutant comparison tests these prepared biomasses, not growing-cell
    metabolism. No complemented-mutant adsorption assay was reported. The fitted
    saturation capacities are not accepted as measured capacities here: the
    deposited manuscript refers to Table 4 but does not include that table.
    The experiments used laboratory synthetic solutions, not ore or field water.
  evidence:
  - source_ref: moriwaki_accepted_manuscript
    supports: support
    explanation: >-
      Preparation and Adsorption test methods (PDF pp. 7–9), Table 3 (PDF p. 21)
      and Figure 2 (PDF p. 23) support rapid Tm solution depletion by both powders.
      The Table 3 concentration header is micrograms/mL in the rendered PDF,
      despite erroneous extracted text. Entry 6 reports lower fractional removal
      at 100 micrograms/mL (35% WT; 29% defective), so the 20-micrograms/mL outcome
      is not a loading-independent performance guarantee.
  - source_ref: moriwaki_accepted_manuscript
    supports: partial
    explanation: >-
      The results on PDF p. 11 describe two 20-mL elutions with 2.7 M nitric acid
      and greater than 94% recovery of adsorbed rare-earth ions for both powders.
      This is stated across La, Eu and Tm, with no element-specific elution table
      or uncertainty; it is not greater than 94% recovery of initial thulium feed.
      Morphology, residual binding in RY1604 and the unquantified LTA/WTA
      abundances prevent assigning an exclusive ligand mechanism. Both Langmuir
      and Freundlich fits were acceptable, and the authors explicitly say these
      fits do not distinguish the adsorption mechanism. No direct Tm speciation
      or site-resolved spectroscopy is supplied.
  - source_ref: moriwaki_2013
    supports: context_only
    explanation: >-
      Publisher metadata and abstract confirm the publication identity and broad
      WT/defective comparison. The full scientific assessment uses the openly
      deposited accepted manuscript; the subscription version and its referenced
      capacity table were not accessed.
