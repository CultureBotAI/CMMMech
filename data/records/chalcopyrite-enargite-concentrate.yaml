  title: Okibe et al. (2022). Bioleaching of Enargite/Pyrite-Rich Dirty Concentrate and Arsenic Immobilization. Minerals 12(4):449, DOI 10.3390/min12040449. Sections 2-3, Table 1 and Figures 1-3; retained complete original inspected in the preceding curation and rechecked here for owner/experiment scope.
  url: https://doi.org/10.3390/min12040449
