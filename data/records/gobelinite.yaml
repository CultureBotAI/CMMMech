id: cmmmech:gobelinite
name: Gobelinite
material_kind: mineral
description: 'IMA-approved monoclinic hydrated cobalt-copper hydroxy-sulfate mineral and Co-dominant
  analogue of ktenasite (IMA 2018-167; status A, Approved; full description published 25 November
  2020; no mineral symbol is printed in the primary paper or in the September 2026 IMA Master
  List, PDF p. 84) with ideal end-member formula CoCu4(SO4)2(OH)6 * 6H2O (written CoCu4(SO4)2(OH)6(H2O)6
  in the September 2026 IMA Master List, PDF p. 84, requiring CuO 44.49 wt%, CoO 10.48 wt%,
  SO3 22.39 wt%, H2O 22.64 wt%, total 100.00 wt%; Mills, Kolitsch, Favreau, Birch, Galea-Clolus,
  and Henrich, 2020, European Journal of Mineralogy 32:637-644). Named for the greenish-blue
  colour of the French type material, reminiscent of "gobelin blue" ("bleu gobelin" in French;
  "gobelinblau" in German) used by the Manufacture des Gobelins tapestry factory in Paris;
  previously reported from Cap Garonne as "ktenasite-Co" by Favreau and Galea-Clolus (2014)
  (Section 1, p. 638). Characterized from two co-type localities (France / Germany in the
  IMA Master List): (1) Pillar 78b in the "fond de mine" area (also found on pillars 78, 79,
  and 80) in the north mine of the Cap Garonne (CG) mine (43 deg 4 min 53 sec N, 6 deg 1 min
  55 sec E), Var, Provence-Alpes-Cote d''Azur, France, where the holotype specimen (collected
  by Valerie Galea-Clolus) is deposited in the mineralogical collections of Geosciences, Museums
  Victoria, Melbourne, Victoria, Australia, under registration number M54565; and (2) dump
  material from the Schlanger und Eichert vein at the Eisenzecher Zug (EZ) mine (50 deg 49
  min 9 sec N, 7 deg 59 min 14 sec E), Eiserfeld, Siegerland, North Rhine-Westphalia, Germany,
  where the cotype specimen (collected by Joseph M. Henrich in 1995) is deposited in the Mineralogical-Petrographical
  Department, Naturhistorisches Museum, Vienna, Austria, under catalogue number O 1045 (Abstract,
  p. 637, and Section 1-2, pp. 638-639). At Cap Garonne, gobelinite formed by post-mining
  oxidation of primary sulfides (chalcocite, djurleite, carrollite, tennantite, covellite)
  in Triassic quartzose conglomerates, associated with brochantite, cyanotrichite-khaidarkanite,
  antlerite, natrojarosite, anglesite, serpierite, devilline, mansfieldite, pharmacoalumite,
  olivenite, and "guarinoite-(Co)"; at Eisenzecher Zug, it formed by alteration of corroded
  alloclasite/cobaltite in quartz gangue, associated with goethite, brochantite, chalcopyrite,
  and malachite (Section 2, pp. 638-639). Occurs as aggregate crusts (CG) or curved radial
  aggregates (EZ) of pale green, bluish green (CG) to bluish-green or greyish-green (EZ) blocky
  to thin lath-like crystals up to 0.1 mm (CG) or 0.5 mm (EZ) long, elongated on [010] and
  flattened on {001} with crystal forms {001}, {031}, and {201} (Abstract, p. 637, and Section
  3, pp. 638-639). Has a white streak with a pale-green cast, vitreous to pearly lustre, translucent
  (CG) to transparent (EZ) diaphaneity, non-fluorescent under UV light, brittle tenacity,
  uneven fracture, Mohs hardness ~2.5, no observed cleavage on CG crystals vs good to perfect
  {001} cleavage on larger EZ crystals, measured density D(meas.) = 2.95(2) g cm-3 (CG, by
  flotation in diluted Clerici solution), and calculated densities D(calc.) = 2.907 g cm-3
  (from the CG empirical formula), 2.958 g cm-3 (from the 100 K CG single-crystal structure
  refinement), and 2.926 g cm-3 (from the 298 K EZ single-crystal structure refinement; Abstract,
  p. 637, and Section 3, p. 639). Optically biaxial negative (-) (determined on CG crystals
  in white light), with alpha = 1.576(2), beta = 1.617(2), gamma = 1.630(2), 2V(meas.) = 58(4)
  deg (universal stage), 2V(calc.) = 57.5 deg, weak r > v dispersion, optical orientation
  Y = b and X approx. c (beta = 95.2 deg), non-pleochroic, and Gladstone-Dale compatibility
  index 1 - (Kp/Kc) = 0.011 (superior, Mandarino, 1981; Section 3, p. 639). Quantitative wavelength-dispersive
  electron-microprobe analyses of Cap Garonne gobelinite (JEOL Superprobe at the University
  of Melbourne; 20 kV, 5 nA, 20 um beam diameter; note that Section 4 text on p. 639 states
  "10 points on two crystals" whereas the Table 1 caption on p. 640 states "n = 9") yielded
  mean CuO 42.45 wt% (range 38.77-45.45, SD 1.84, standard Cu metal Kalpha), CoO 6.58 wt%
  (5.75-7.38, SD 0.57, standard Co metal Kalpha), ZnO 3.14 wt% (2.18-5.12, SD 0.96, standard
  Zn metal Kalpha), NiO 3.37 wt% (3.00-3.57, SD 0.19, standard NiFe Kalpha), Al2O3 0.02 wt%
  (0-0.04, SD 0.01, standard Al2O3 Kalpha; note that Al2O3 0.02 wt% is omitted in the Abstract
  on p. 637 while still reporting Total 100.30 wt%), SO3 22.12 wt% (21.50-22.73, SD 0.40,
  standard SrSO4 Kalpha), stoichiometric H2Ocalc = 22.62 wt% (6 H2O + 6 OH), and Total = 100.30
  wt%, giving the empirical formula (Co0.63Ni0.32Zn0.28Cu3.83)sum=5.06S1.98O20H18.00 on the
  basis of S + M = 7 apfu; quantitative SEM-EDS analyses of Eisenzecher Zug gobelinite (JEOL
  JSM-6610LV + Bruker Quantax 800, 15 kV, 60 s count time, n = 9 spot analyses after excluding
  one outlier; Section 4, pp. 639-640) gave the average empirical formula (Co0.92Ni0.21Mg0.01Cu3.79)sum=4.93(SO4)2.08(OH)6
  * 6H2O. Crystallizes in the monoclinic system, space group P21/c (#14), Z = 2, isostructural
  with ktenasite (Mellini and Merlino, 1978; Nickel-Strunz class 07.DD.20). Synchrotron single-crystal
  X-ray diffraction on Cap Garonne holotype material (Australian Synchrotron MX2 beamline,
  Dectris EigerX 16M detector, lambda = 0.71073 A, T = 100 K, fragment size 10 x 10 x 2 um;
  Section 5.1, p. 640, and Tables 3-4, pp. 641-642) gave unit-cell parameters a = 5.5990(11)
  A, b = 6.0840(12) A, c = 23.676(5) A, beta = 95.22(3) deg, V = 803.2(3) A3, Z = 2, refining
  in SHELXL-2016/6 (with fixed site occupancies Co = Co0.62Ni0.32Zn0.06 and Cu1, Cu2 = Cu0.95Zn0.05)
  to R1 = 0.0310 for 2386 reflections with Fo > 4sigma(Fo) and R1 = 0.0312 for all 2419 data
  (Rint = 0.0315); room-temperature powder X-ray diffraction on CG material (Agilent SuperNova
  diffractometer, Atlas CCD, MoKalpha radiation; Section 5.1 and Table 2, p. 640) gave a =
  5.6098(12) A, b = 6.0981(7) A, c = 23.800(5) A, beta = 95.20(6) deg, V = 810.8(9) A3, Z
  = 2; and room-temperature single-crystal X-ray diffraction on Eisenzecher Zug cotype material
  (Nonius KappaCCD diffractometer, MoKalpha radiation, T = 298 K, crystal fragment dimensions
  printed as "0.05 x 0.05 x 0.13 um" in Section 5.2, p. 640, a typographical unit error for
  mm) gave a = 5.611(1) A, b = 6.103(1) A, c = 23.808(5) A, beta = 95.18(3) deg, V = 811.9(3)
  A3, Z = 2, refining in SHELXL-97 (with fixed site occupancy Co = Co0.92Ni0.08) to R1 = 0.0289
  for 1998 reflections with Fo > 4sigma(Fo) (printed as "R1 = 0.0280" in the Abstract, p.
  637) and R1 = 0.0400 for all 2352 data (Rint = 0.0259). The crystal structure (Section 6,
  pp. 641-642, and Tables 3-4) consists of brucite-like sheets of edge-sharing, Jahn-Teller-distorted
  (4 + 2)-coordinated CuO6 octahedra (<Cu1-O> = 2.094 A [CG] / 2.103 A [EZ], <Cu2-O> = 2.101
  A [CG] / 2.105 A [EZ]) decorated on both sides by corner-sharing SO4 tetrahedra (<S-O> =
  1.478 A [CG] / 1.474 A [EZ]) and linked along c via hydrogen bonds to interstitial isolated
  octahedral Co(H2O)6 groups (<Co-O> = 2.072 A [CG] / 2.082 A [EZ]). The six strongest powder
  X-ray diffraction lines for CG gobelinite marked in bold in Table 2 (p. 640; also listed
  in the Abstract, p. 637) [dobs in A (Iobs, dcalc, hkl)] are 11.870 (100, 11.870, 002), 5.924
  (40, 5.924, 004), 4.825 (15, 4.824, 013), 3.946 (15, 3.946, 006), 2.956 (15, 2.956, 008),
  and 2.663 (20, 2.665, 202) (note that reflection -1 2 3 at dobs = 2.561 A also has Iobs
  = 15 in Table 2, p. 640, but is not typeset in bold). No biological or microbial interaction
  data are reported in the type mineralogical description.'
