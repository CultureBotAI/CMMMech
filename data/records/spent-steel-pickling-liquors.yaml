  evidence:
  - source_ref: qin2016
    supports: support
    explanation: Section 3.1 on p. 1838 and Figure 1 on p. 1839 support substantial Fe(II) oxidation in the 20%, 40% and 60% waste-volume mixtures, with progressively delayed responses relative to inoculated 9K medium. The source reports near-complete oxidation for 20% after about 45 h onward, and 99.9% for 60% at day 17, compared with near-complete oxidation in its 9K comparison by day 4. These are source-reported Fe(II) conversion percentages in mixed media, not fractions of original waste iron isolated or recovered. The 60% curve's prolonged lag is retained despite the abstract's favorable tolerance wording.
  - source_ref: qin2016
    supports: partial
    explanation: Section 3.1 reports no ferrous oxidation after inoculation of 70% and 80% waste mixtures; no corresponding time-course graph is provided. Section 2.3 instead describes a nominal 20/40/60-to-100% mixing sequence. Neither a demonstrated effective undiluted-waste treatment nor an unreported 100% outcome is inferred. Figure 2 and Table 1 support strong inhibition at the tested low-pH settings, but the narrative's pH 1.3 growth threshold is not a separately tested Table 1 level. Oxidation curves do not themselves directly measure viable-cell growth.
  - source_ref: qin2016
    supports: partial
    explanation: Sections 2.1-2.2 print 0.5 g/L FeSO4·7H2O in the culture recipe and raw liquor Fe(II) 250 mg/L, yet section 3.1 assigns 7.13, 5.35 and 3.57 g/L Fe(II) to the 20%, 40% and 60% mixtures. These values are not reconciled by the printed recipe. The raw-liquor Cl 310 mg/L and pH 0 also do not establish a complete consistent acid/ion balance. Table 1 labels chloride-ion concentrations, whereas later text sometimes calls the 200-800 mg/L levels NaCl/KCl concentrations. Figures 3-4 show delayed oxidation relative to 9K despite the conclusion's no-inhibition wording. Table 1 is a single-factor design, so the abstract's combined pH 1.4, Fe(II) 0.04 mol/L and chloride 800 mg/L statement is not adopted as a jointly tested operating point. The 40% discussion says growth resumed after 84 h but reached its endpoint at 80 h, while Figure 1b approaches its plateau later; no precise reconciled kinetic estimate is asserted.
  - source_ref: qin2016
    supports: partial
    explanation: Figures 5-8 on pp. 1840-1842 show SEM morphology, EDS, XRD and FTIR for sediments from the 60% waste/9K arm and comparison material. Section 3.3.1 calls the principal phase potassium jarosite while printing (NH4)Fe3(SO4)2(OH)6; the abstract and conclusion use the ammonium formula. This unresolved name/formula discrepancy and the absence of quantitative phase refinement prevent a phase-pure product claim. FTIR chloride interaction and adaptation are proposed interpretations, not demonstrated covalent binding or causal tolerance mechanisms. No solid-product mass balance, isolated iron yield, acid-reuse performance, cadmium fate, recovered-product purity or industrial treatment is established.
  - source_ref: genbankkf378735
    supports: context_only
    explanation: 'The paper''s KF378735 accession resolves to KF378735.1, a partial 16S sequence assigned to A. ferrooxidans strain XJF-8 with source qualifiers coal mine drainage and China: Shanxi. These differ from the Tianjin factory-outlet isolation in section 2.1. The species label is retained as the authors'' assignment; the experimental culture is not equated with a verified XJF-8 deposit, type strain or whole genome, and sequence provenance does not prove function.'
  - source_ref: ncbi920
    supports: context_only
    explanation: Current NCBI taxonomy confirms the species label Acidithiobacillus ferrooxidans and its historical Thiobacillus ferrooxidans synonym. This resolves nomenclature only, not the study's culture-provenance conflict or causal contribution relative to incompletely described controls.
