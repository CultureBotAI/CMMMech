id: cmmmech:cadmium-telluride-photovoltaic-module-scrap
name: Cadmium telluride photovoltaic module scrap
material_kind: secondary_resource
description: Processing-generated fragments of cadmium telluride (CdTe) thin-film photovoltaic modules
  constitute a composite feed for material recycling. The accepted experiment generated milled fragments
  from manufacturer-sourced modules; their service history and status before laboratory preparation were
  not reported. This record therefore does not establish postconsumer or industrial manufacturing-scrap
  provenance for those samples. The feed is distinct from crystalline-silicon and CIGS modules, a pure
  CdTe compound, and the cadmium or tellurium elements. Constituent criticality designations are not inherited.
mechanisms:
- id: thermal_delamination_and_chemical_etching
  name: Thermal pretreatment and chemical etching of CdTe module fragments
  process: recycling
  microbial: false
  description: Laboratory milling and thermal pretreatment followed by chemical etching change the mass
    and surface composition of CdTe module-derived powder. Surface-sensitive spectroscopy supports partial
    removal and chemical changes of Cd and Te under the tested conditions. The experiment does not establish
    a metal-specific extraction yield, closed mass balance or isolated recovered product.
  context: 'Kuczynska-Lazewska et al. (2021), Section 2: samples of CdTe modules manufactured by Advanced
    Solar Power Hangzhou INC were milled for 10 min at 1500 rpm. No grains exceeded 1 mm and most were
    below 100 micrometres. Powder was heated at 600 degrees C for 3 h with a 10 degrees C/min ramp. Separate
    1 g samples were contacted with 30 mL of 1 M H2SO4, 3 M HNO3 or 30% H2O2 at 30 or 50 degrees C, then
    vacuum-filtered, dried and weighed. Figures 3–5 compare XPS surface measurements before heating, after
    heating, and after 2 h etching at 50 degrees C; that duration is not assigned to every gravimetric
    time point. No organism, inoculum or biological treatment was used. Module count, prior service history
    and independent feed-batch replication were not specified.'
  evidence:
  - source_ref: kuczynska2021
    supports: support
    explanation: Section 3.1 and Figures 1–2 show whole-powder mass-loss curves for the chemical treatments.
      Unheated milled fragments retained laminating material that stuck to mixing components and interfered
      with weighing; this problem was not observed after 600 degrees C/3 h pretreatment. This is a tested
      preparation comparison, not proof that this temperature or pretreatment is universally required.
      Section 3.2 and Figures 3–5 show Cd/Te XPS traces and changed relative surface composition after
      treatment.
  - source_ref: kuczynska2021
    supports: partial
    explanation: Figures 1–2 plot relative whole-powder mass loss, not metal-specific extraction percentages.
      Figure 5 normalizes relative Cd and Te atomic contents estimated by XPS; these bars are not whole-feed
      composition, recovered mass or leachate concentration. EDX could not resolve Cd/Te above its stated
      uncertainty, and the authors explicitly say trace content and surface sensitivity prevent quantifying
      process efficiency. Error bars appear in the gravimetric figures, but their definition and replicate
      count are not stated. No measured solution inventory or closed Cd/Te balance is supplied.
  - source_ref: kuczynska2021
    supports: partial
    explanation: Section 3.2/Figure 4 chemical-state and reaction assignments rely on XPS fitting and
      interpretation; Cd oxide and silicate contributions overlap and proposed species are not independently
      established as isolated crystalline products. The claim of complete CdTe removal is explicitly from
      the sampled surface, while Section 4 describes partial removal of the elements Cd and Te. Neither
      establishes complete bulk extraction. Section 4 leaves solution-metal determination and cadmium
      recovery to future work. Table 1 summarizes other studies; its pilot/industrial labels do not describe
      this laboratory experiment.
sources:
