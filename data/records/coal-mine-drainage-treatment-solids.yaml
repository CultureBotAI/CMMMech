    for Biomining. Minerals 16(9):930, published 11 September 2026.
    DOI 10.3390/min16090930; Methods 2.1-2.5, Results 3.1-3.6, Figures 1-7
    and Discussion. Real treatment solids, laboratory assays and qualified
    physiological interpretations.
  url: https://doi.org/10.3390/min16090930
  accessed_on: '2026-10-11'
