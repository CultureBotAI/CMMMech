mechanisms:
- id: hildenborough_nickel_sulfide_formation
  name: Vaesite-assigned particles in sulfate-reducing No Fe culture products
  process: biomineralization
  description: Hildenborough cultures in the No Fe arm produced a minor vaesite-assigned component within mixed nickel-sulfide solids. The reported abiotic preparations lacked this component, but unmatched bulk chemistry and processing prevent assigning a unique microbial pathway or universal microbial necessity.
  context: 'Mansor2019 Methods pp.3–4: the reported culture is Desulfovibrio vulgaris DSM 644, Hildenborough/ATCC 29579; current authority name is Nitratidesulfovibrio vulgaris str. Hildenborough. Anoxic modified metal toxicity medium contained lactate, sulfate, yeast extract, tryptone and HEPES, initially pH 7.2. NiCl2 and FeSO4 stocks supplied a nominal total of 500 micromolar Ni plus Fe across No Fe, 5:1, 1:1 and 1:5 Ni/Fe arms. No Fe means no intentionally added Fe stock, not a demonstrated trace-Fe-free medium. After 72 h pre-growth at 30 degrees C with shaking, 1% volume inoculum was transferred into 100 mL metal-amended medium; the actual mineral-incubation temperature and shaking rate are not restated separately. Biotic products were sampled after 6–25 days. XRD pellets were rinsed and dried on glass; TEM pellets underwent detergent, lysozyme and proteinase K treatment for 1 h at 45 degrees C, followed by washing, shipping and up to 1 h sonication. The abiotic comparison instead
    titrated 50 mL of 15 mM sodium sulfide at 2 mL/h into 50 mL double-strength medium, aged 5–36 days and harvested solids by filtration. This gives a nominal 7.5 mM final chemically added sulfide, not a measured biotic sulfide concentration. Final bulk pH was approximately 7.1 in biotic arms versus approximately 8.0–8.2 in abiotic arms; the arms are not matched for pH, sulfide delivery, sampling times or harvesting. These are laboratory salt-solution experiments, not treatment of an industrial waste or natural ore.'
  microbial: true
  organisms:
  - id: NCBITaxon:882
    label: Nitratidesulfovibrio vulgaris str. Hildenborough
  evidence:
  - source_ref: mansor2019
    supports: support
    explanation: Results p.5, Table 2, Figure 1 and Figure 4a–b assign vaesite in the biotic No Fe products using small XRD reflections and selected-area electron diffraction of spheroidal and larger euhedral particles. Vaesite was not detected in the source's abiotic or Fe-added arms. This supports conditional culture-associated phase occurrence, not a quantitative fraction or a pure isolated nickel product.
  - source_ref: mansor2019_si
    supports: support
    explanation: Annotated Figure 4b shows reflections near 3.25, 2.01 and 1.62 angstrom consistent with the Table S1 vaesite references; the companion Figure 4a annotation documents a vaesite-containing aggregate. These diffraction observations complement the small XRD features without quantifying the mixed solid or proving a reaction sequence.
  - source_ref: mansor2019
    supports: partial
    explanation: Discussion pp.6–11 describes known abiotic routes to vaesite and proposes an acidic cellular microenvironment in this study. The proposed local pH was not measured, and bulk pH, sulfide addition and recovery procedures differ between the culture and abiotic comparisons. Nondetection in these specific abiotic preparations is not proof that biology is necessary for vaesite formation.
  - source_ref: mansor2019
    supports: partial
    explanation: 'Methods pp.3–4, Table 2 and Figures 2–4: no independent bottle-replicate count or killed-cell, cell-free metabolite, pH-matched or sulfide-flux-matched comparison is reported. Table 2 n values count EDS analyses and the particle-size histograms count individual particles, not independent cultures. EDS is explicitly semi-quantitative; XRD mostly shows poorly crystalline mixtures. No phase-specific yield, isolated product purity, Ni recovery mass balance or long-term stability challenge is demonstrated.'
  - source_ref: mansor2019
    supports: partial
    explanation: 'Discussion pp.8–12 and Figures 9–11 propose acidic cell-surface microenvironments, secreted organics and altered nucleation/growth as explanations. Local pH, specific metabolites and enzymes were not directly measured in this experiment; Figure 9 is a proposed sequence and Figure 10 a literature-derived solubility model, not direct observations of a cell-local pathway. Preparation can affect phase identity: the authors observed later oxidation of some Fe-rich samples and analyzed grids within 24 h. Their short air-drying comparison does not establish that all phase formation preceded harvest. No industrial deployment or universal microbial requirement is inferred.'
  - source_ref: dsm644
    supports: context_only
    explanation: The DSMZ catalogue links DSM 644 to Hildenborough and ATCC 29579 under the current Nitratidesulfovibrio name. Together with NCBI strain entry 882 this grounds the reported strain label; it is not a genomic authentication of the inoculum or a separate precipitation experiment.
