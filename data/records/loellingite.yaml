    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=180
    accessed_on: '2026-10-15'
mechanisms:
  - id: culture_product_associated_flotation
    name: Culture- and supernatant-associated flotation of a loellingite-bearing mixture
    process: separation
    microbial: true
    organisms:
      - id: NCBITaxon:180
        label: Leptospirillum ferrooxidans
    description: >-
      Almojadah and Harmer tested living Leptospirillum ferrooxidans DSM 2705
      cultures and cell-filtered culture supernatants as modifiers of flotation
      in a pyrite-arsenopyrite-loellingite mixture. The source reports distinct
      loellingite phase-partitioning bars and generally depressed flotation of
      the arsenic-bearing phases under selected treatments. Outcomes depended
      on culture substrate, conditioning time and chemical collector. The
      supernatant remained microbial in origin but did not require living cells
      during flotation; its effects are not proof of a specific purified EPS
      component or a loellingite-specific metabolic pathway.
    context: >-
      Sections 2.1-2.5 report a supplier-sourced Chinese arsenopyrite/loellingite
      material assigned by quantitative XRD to about 38.8% arsenopyrite and
      60.6% loellingite, with less than 1% other impurities, alongside a Peruvian
      pyrite material reported as about 97.4% pyrite. The minerals were ground,
      wet-sized and stored under nitrogen at -80 degrees C. The culture was
      grown in modified HH medium at pH 1.8, 30 degrees C and 155 rpm, with
      soluble ferrous sulfate or adaptation to the pyrite or arsenopyrite/
      loellingite material. Culture cycles were about 4, 28 and 70 days,
      respectively. Microflotation used 1 g of a 1:1 mixture of the pyrite and
      arsenopyrite/loellingite materials, conditioning for 6, 8 or 10 hours in
      a 100-mL flask at 30 degrees C and 155 rpm. The article omits the liquid
      charge. Almojadah's earlier thesis links its Chapter 4 flotation tests
      to section 3.3.2.2, which specifies 20 mL during conditioning and topping
      up to 50 mL for flotation. These are attributed thesis methods, not
      independently documented volumes for every journal run. Living-culture
      arms used 1.5 x 10^7 cells/mL. The
      reported free-EPS supernatant was prepared from late-exponential mineral
      cultures by 5-micrometre filtration, centrifugation at 15000 rpm and
      0.2-micrometre filtration; it was not purified or dose-standardized by
      measured EPS composition. Room-temperature flotation in a modified
      Hallimond tube lasted 5 minutes with 0.4 L/min air, with or without
      10^-4 M potassium isopropyl xanthate (PIPX). Abiotic comparisons used HH
      medium at pH 1.8 or Milli-Q water adjusted to pH 9 without cells or
      supernatant. All flotation experiments were reported in triplicate with
      means and standard deviations. Floated and tailing fractions were
      examined by Rietveld quantitative XRD; full patterns, raw replicate data
      and an explicit recovery calculation are not supplied in the article.
      The thesis additionally reports air-drying and weighing both fractions,
      without supplying the run-level masses or phase-recovery equation.
    evidence:
      - source_ref: almojadah2025
        supports: support
        explanation: >-
          Sections 2.1 and 2.4-2.5, Table 1 and Figures 6-8 (pages 2-3 and 6-8)
          identify the mixed feed and show separate pyrite, arsenopyrite and
          loellingite flotation responses. Figure 8b shows strong pyrite
          flotation with low arsenic-phase flotation after pyrite-grown
          supernatant plus PIPX; section 3.3.3 reports 92.9% pyrite recovery at
          10 hours. That number belongs to pyrite, not loellingite or arsenic
          extraction. The result supports selective partitioning in this
          laboratory mixture, not purity or yield of an isolated mineral or
          metal product.
      - source_ref: almojadah2024_thesis
        supports: partial
        explanation: >-
          Sections 3.3.2.2 and 4.2.4 directly link the liquid-volume and
          fraction-handling methods. Chapter 4 separates single-source
          baseline Figure 4.13 from mixed-feed Figures 4.15-4.17; the
          arsenopyrite source itself contains loellingite. Matching feed,
          plotted results and retained numerical XPS rows support an inferred
          shared experiment lineage with the article, not independent
          replication or a formal correction. Tables 4.2-4.6 include two
          additional XPS arms but retain the article's compared values and
          their spectral-denominator limitations. The thesis does not resolve
          a composition-normalized supernatant dose or supply raw recovery
          data. Its 1 mL PIPX addition with a stated 10^-4 M concentration
          leaves stock versus final concentration unclear; its general and
          Chapter 4 methods also differ on UV duration and EPS growth phase.
          These differences prevent treating the thesis as an unqualified
          replacement protocol or accepting a specific causal EPS component.
      - source_ref: almojadah2025
        supports: partial
        explanation: >-
          Figures 6-8 also retain weak or unfavorable arms: alkaline Milli-Q
          controls produced little flotation, and pyrite-grown living cultures
          depressed all three minerals. Arsenopyrite/loellingite-grown
          supernatant with PIPX did not reproduce the strong pyrite separation
          of pyrite-grown supernatant. The alkaline-water comparison changes
          both medium chemistry and pH. Filtered supernatants contain more than
          isolated EPS, and no composition-matched EPS-depleted control is
          reported. These comparisons do not establish universal biological
          improvement or identify a single causal biopolymer.
      - source_ref: almojadah2025
        supports: partial
        explanation: >-
          Sections 2.3 and 3.2 and Figures 3-5 compare prepared SEM surfaces:
          cells/biofilm were more apparent on pyrite at early exposure times,
          while the arsenopyrite/loellingite material showed appreciable
          colonization at 72 hours. Individual imaged grains are not assigned
          independently to loellingite versus arsenopyrite. Fixation, washing,
          dehydration and coating precede imaging; morphology alone does not
          establish viability, an enzymatic attack or phase-specific
          dissolution. Proposed arsenic toxicity and indirect oxidation are
          interpretations, not isolated causal tests.
      - source_ref: almojadah2025
        supports: partial
        explanation: >-
          Sections 3.4-4, Figures 9-11 and Tables 2-6 compare XPS of two
          flotation fractions with different culture products, collector
          addition and exposure times: arsenic-feed-grown culture at 8 hours
          versus pyrite-grown supernatant with PIPX at 10 hours. Surface
          composition is not a bulk dissolution measurement and cannot assign
          a molecular change uniquely to loellingite. Some prose trends also
          differ from the tables: Table 3's HO-C=O component decreases from
          6.9 to 4.4%, and Table 6's elemental-sulfur component from 6.1 to
          3.1%, despite statements grouping these components as increased.
          The component percentages have their own spectral denominators;
          they are not mineral recoveries. No precise molecular mechanism is
          accepted from those comparisons.
