    and CANONICAL_RECORD_KEYS in scripts/new_history.py place 'sources' before 'criticality'.
- finding_id: cmmmech-cycle5-stage4-finding-0002
  issue_key: cmmmech.tetrahedrite-concentrate.tth-hydrolase-label-and-edge-explanation
  review_id: 20261030T201008Z-tetrahedrite-concentrate-cycle5-stage4-record-review
  status: open
  severity: minor
  category: graph
  target_ids:
  - cmmmech:tetrahedrite-concentrate
  summary: In data/records/tetrahedrite-concentrate.yaml (cmmmech:tetrahedrite-concentrate), causal_graphs[0]
    (ferrooxidans_tetrahedrite_bioleaching_graph) node tth_hydrolase (lines 304-307) retains single-species
    label 'Tth tetrathionate hydrolase (tth / AFE_0029)' and generic description without Acidithiobacillus
    ferrivorans tetH (Acife_0037, UniProtKB:A0A060URH6), whereas sibling node sqr_reductase (lines 209-212)
    and edges[0].evidence[0].explanation (line 380) explicitly name both experimental species arms (A.
    ferrooxidans and A. ferrivorans). In addition, edges[0].evidence[0].explanation (line 380) states
    'individual sqr/tth/tetH genes were not mutated', omitting sqr2 (Acife_2586, UniProtKB:G2JTR4).
