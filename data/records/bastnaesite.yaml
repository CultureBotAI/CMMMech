mechanisms:
- id: bt_bastnaesite_dissolution
  name: Culture-associated rare-earth mobilization from a natural bastnaesite separate
  process: bioleaching
  description: Living Bacillus thuringiensis cultures mobilized rare-earth elements from a natural bastnaesite separate in laboratory shaking-flask assays. Culture acidification and organic-acid leaching experiments are consistent with proton- and ligand-promoted dissolution. The necessity of specific metabolites and the independent contribution of direct cell attachment were not established.
  context: The wild isolate, called Bt, originated from the Renju regolith-hosted rare-earth deposit, Guangdong, China; no strain accession or culture deposit is supplied in the inspected main paper and supplement. The paper refers to an earlier isolation/identification study. Exponential-phase cells grown on LB plates were harvested, washed with sterile ultrapure water and resuspended in experimental medium. Mineral grains were selected from bastnaesite-bearing rock from Maoniuping, western Sichuan, China, crushed in agate, sieved to 48-74 micrometres, washed more than ten times and freeze-dried. Semiquantitative XRD assigned approximately 97 wt% bastnaesite and 3 wt% quartz; XRF reported 36.1 wt% CeO2, 30.1 wt% La2O3, 7.40 wt% Nd2O3 and 2.57 wt% Pr6O11. Triplicate 250 mL flasks contained 0.5 g mineral and 100 mL medium, with 100 microlitres of inoculum giving approximately 10^6 CFU/mL. Medium contained, per litre, 1.0 g MgSO4·7H2O, 0.2 g KCl, 1.0 g NH4Cl and 10 g glucose, initially pH
    6; no P-containing reagent was added. Incubation was 30 days at room temperature and 180 rpm; no exact temperature is specified. Unbuffered Exp-Biow was compared with 20 mM MES Buffered-Biow, mineral-containing uninoculated controls and mineral-free cell cultures in both media. Methods call uninoculated arms Exp-Sterile and Buffered-Sterile; Results call them Exp-Control and Buffered-Control. Exp-bags enclosed mineral in a 10 kDa MWCO dialysis bag under otherwise unbuffered conditions. Aqueous elemental measurements used 0.22-micrometre filtration, dilution in 2% HNO3 and ICP-MS; this is an operational filtrate fraction, not a recovered-metal product. Cell counts represent planktonic cells and exclude mineral-attached cells.
