id: cmmmech:hematite
name: Hematite
material_kind: mineral
description: Hematite is the Fe2O3 mineral species listed as approved (A), with 1971 special-procedure
  status, in the IMA-CNMNC September 2026 master list. It is distinct from iron element, iron-ore commodities,
  other Fe2O3 polymorphs and mixed iron-bearing feeds. The experimental author-designated hematite below
  has substantial non-Fe oxide components; its bulk Fe2O3 percentage is not a quantified hematite phase
  abundance. No constituent criticality designation is inherited.
