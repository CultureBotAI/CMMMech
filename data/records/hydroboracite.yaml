id: cmmmech:hydroboracite
name: Hydroboracite
material_kind: mineral
description: >-
  Hydroboracite is the CaMg[B3O4(OH)3]2(H2O)3 species in the September 2026
  IMA-CNMNC list, with grandfathered status G and original-description year
  1834, not a sequential approval identifier. Sabelli and Stoppioni's 1978
  single-crystal study of natural material from Bigadiç, Turkey, refined a
  monoclinic P2/c structure with two formula units per cell. Its hydrogen
  positions were geometrically assigned and not independently refined.
  The mineral is distinct from colemanite, inyoite, ulexite, other borate
  species, elemental boron and the borates commodity. The experimental
  high-pressure label hydroboracite-II below does not assert a separate
  IMA-approved natural species. No commodity criticality or microbial
  activity is inherited.
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC, The New IMA List of Minerals, September 2026: PDF page 97,
      Hydroboracite row; pages 1-2, status and original-description definitions.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-15'
  - id: sabelli1978
    title: >-
      Sabelli and Stoppioni (1978), Refinement of the crystal structure of
      hydroboracite, The Canadian Mineralogist 16, 75-80: natural specimen,
      Table 2 and hydrogen-position limitations, pp. 75-78; Tables 3-8 and
      Figures 1-3. The separately cited CISTI structure-factor deposit was
      not acquired.
    url: https://www.rruff.net/doclib/cm/vol16/CM16_75.pdf
    accessed_on: '2026-10-15'
  - id: demircioglu1973
