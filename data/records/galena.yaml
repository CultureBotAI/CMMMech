    functional_role: Membrane-bound sulfide-quinone reductase (EC 1.8.5.4; AFE_1792) catalyzing oxidation of sulfide to elemental sulfur/polysulfide coupled to quinone reduction during acidophilic sulfur/sulfide bioleaching.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000001362 for Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159).
    evidence:
    - source_ref: pacholewska2004
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 sulfide-quinone reductase (AFE_1792) for reduced-sulfur oxidation during galena concentrate transformation in modified 2K medium in Pacholewska (2004); individual sqr/tth genes were not mutated.
  - uniprot_accession: UniProtKB:B7J3C9
    entry_name: TTH_ACIF2
    protein_name: Tetrathionate hydrolase
    gene_symbol: tth
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:243159
      label: Acidithiobacillus ferrooxidans ATCC 23270
    reference_proteome_id: UP000001362
    ec_numbers:
    - EC:3.12.1.-
    interpro_ids:
    - InterPro:IPR018391
    - InterPro:IPR002372
    - InterPro:IPR011047
    - InterPro:IPR015943
    pfam_ids:
    - Pfam:PF13360
    functional_role: Periplasmic tetrathionate hydrolase (EC 3.12.1.-; tth / AFE_0029) hydrolyzing tetrathionate into thiosulfate, elemental sulfur, and sulfate, generating sulfuric acid protons.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000001362 for Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159).
    evidence:
    - source_ref: pacholewska2004
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 tetrathionate hydrolase (tth / AFE_0029) for polythionate disproportionation and sulfuric-acid generation during galena concentrate transformation in modified 2K medium in Pacholewska (2004); individual sqr/tth genes were not mutated.
  evidence:
  - source_ref: pacholewska2004
    supports: support
    explanation: 'Methods and Table 2 report the culture and comparator. At 288 h, inoculated Fe(II) is reported as 0.00 g/L versus 1.113 g/L in the control, with potentials 560.8 versus 286.5 mV against Ag/AgCl. These printed zeros have no supplied detection limit. Page 286 and Figure 1 identify galena and anglesite in both residues: the source estimates approximately 43% galena and 40% anglesite in the inoculated residue versus 62% and 25% in the control. These are residue phase estimates with unreported quantitative uncertainty, not feed-mass conversion or recovery fractions. Figures 2-3 show altered grain surfaces and cell-like structures assigned to the inoculated culture; microscopy alone does not authenticate the strain or establish a direct enzymatic attack.'
  - source_ref: pacholewska2004
    supports: partial
    explanation: Table 2 reports dissolved Pb of 0.0021 g/L with culture versus 0.0022 g/L in the control at 288 h, and 0.0019 versus 0.0021 g/L at 384 h. Thus greater sulfate-bearing residue formation is not a demonstrated dissolved-Pb advantage. By 384 h both natural-feed arms report Fe(II) as 0.00 g/L. Surface precipitation/passivation is the author's explanation for slowing transformation, not an independently varied coating experiment. The separate synthetic PbS comparator reaches pH 5.4, retains 0.555 g/L Fe(II) and lacks observed bacterial colonies at 384 h; it does not demonstrate equivalent activity on pure PbS under maintained acidic conditions.
  - source_ref: pacholewska2004
    supports: partial
    explanation: Table 3 labels S_SO4/(S_total - S_SO4) as sulfur conversion and prints 47.99% with culture versus 27.25% in the control at 288 h. Those entries are consistent with 100 times residue sulfate-S divided by residue sulfide-S, not the fraction of starting sulfide converted. The sulfate-containing medium and other sulfide phases prevent assigning that ratio specifically to oxidized galena sulfur. The early control rows also contain ratio/value inconsistencies. The abstract's twofold wording is only approximate; 47.99/27.25 is about 1.76. The 384 h inoculated ratio is 49.78%, despite prose describing no further change. No verified PbS conversion percentage, recoverable lead yield or industrial deployment is inferred.
  - source_ref: ncbi_ferrooxidans
    supports: context_only
    explanation: The authority resolves the reported species name to NCBI Taxonomy 920. It does not establish that F3-02 is the type strain or verify the original isolate identification.
