limitations:
- Evidence is one historical laboratory experiment on one process-specific feed; generalization
  to all grinding sludge is unsupported.
- The source lacks matched abiotic leaching controls, authenticated strain identity
  and documented independent flask replication.
- The recovery row and missing solid/liquid inventory information do not permit defensible
  mass-based extraction yields. Fe(II) assay detail and analytical uncertainty are
  not supplied.
- Culture-associated dissolution is not demonstrated microbial necessity, direct attachment/enzyme
  action, an isolated metal product or industrial deployment.
- Correction and conflicting-evidence searches are bounded to the documented returned
  sets. Related symposium and adjacent-study full primaries were not reassessed.
- The original publisher PDF and curator-rendered page pixels were independently read;
  this reviewer did not independently reacquire or rerender the PDF.
notes:
- Original-source preparation preceded canonical inspect; all frozen maintained claims
  were assessed only after inspect captured their exact bytes.
- All four tables and seven figures were inspected, including the companion feed,
  to guard against cross-feed evidence transfer.
- No record correction or corrective issue was warranted within this scope. Structural
  validation does not establish scientific truth.
- Final batch receipts were inspected after all three round28 records froze. This
  target and its canonical context inputs remained byte-identical through the save
  preparation.
