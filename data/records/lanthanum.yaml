mechanisms:
  - id: niger_supernatant_lanthanum_precipitation
    name: Lanthanum precipitation using Aspergillus niger culture supernatant
    process: biomineralization
    microbial: true
    organisms:
      - id: NCBITaxon:380704
        label: Aspergillus niger ATCC 1015
    description: >-
      A. niger ATCC 1015 cultures produced supernatants that precipitated La
      supplied as soluble lanthanum chloride. Recovered crystals included
      lanthanum oxalate decahydrate; higher-La supernatant reactions also
      produced a phosphorus-containing phase. Microbial involvement is the
      prior fungal culture step. Chemical oxalic acid also precipitated La,
      so the experiment does not establish a requirement for living cells
      during precipitation or a unique biological precipitation reaction.
    context: >-
      Laboratory cultures used 100 mL nitrate-containing modified AP1 medium
      in 250 mL flasks, initially adjusted to pH 5.5, with 20 g/L glucose.
      Cultures were incubated for 7 days at 25 degrees C, 125 rpm, in darkness
      and filtered through 63 micrometre nylon mesh. The authors call this
      supernatant biomass-free; this coarse filtration is not a sterility
      demonstration. Harvest pH was 3.41 +/- 0.10. Assays mixed 9 mL supernatant
      with 1 mL LaCl3 solution to give 1-50 mM final La, then rolled for 24 h
      at room temperature, with at least three independent replicates.
      Precipitates were collected, washed three times and dried for weighing;
      remaining supernatant La was measured colorimetrically with Arsenazo III
      after centrifugation. Comparators used 9 mL of 25 mM chemical oxalic
      acid plus 1 mL LaCl3. These were not pH-matched supernatants, and the
      fungal-supernatant oxalate concentration was not directly measured.
      Neither mixed-REE separation, real-waste treatment nor industrial
      operation was demonstrated.
    evidence:
      - source_ref: kang2019
        supports: support
        explanation: >-
          Methods, Lanthanum biotransformation and Crystal yield and La assay,
          and Results, Biomass-free culture supernatant experiments, with
          Figure 7a,c, report 100% aqueous La removal at 1, 3 and 5 mM initial
          La and 49.8% at 15 mM. These are the authors' solution-removal
          percentages, not purified-element yields or independently established
          zero residual La. At 15 mM, the reported maximum dry precipitate
          mass was 23.3 mg per 10 mL reaction; this mass is not elemental La.
          Figures 4, 8 and 9 and the Discussion support oxalate precipitation
          with additional phosphorus-containing material at higher La loading.
      - source_ref: kang2019
        supports: partial
        explanation: >-
          Figure 7b,d and its accompanying results show that chemical oxalic
          acid controls also removed La, maintaining reported 100% removal
          through 11 mM initial La. Their different pH and unverified equivalence
          to the fungal oxalate concentration prevent an efficiency comparison
          normalized to precipitant dose. The article gives inconsistent
          formulas for the higher-La phosphorus phase in the results text
          and Figure 9, so no exact formula is assigned here. Figure 5 identifies
          La2(C2O4)3·10H2O from the separate 1 mM La agar experiment and La2O3
          after heating those crystals to 1000 degrees C; the oxide conversion
          was a subsequent abiotic treatment, not a microbial redox reaction.
