id: cmmmech:chalcopyrite
name: Chalcopyrite
material_kind: mineral
description: Chalcopyrite is the mineral species with IMA-approved formula CuFeS2. The September 2026 IMA list records status G (grandfathered) and the uncertain original-description year 1725 ?. That year is not an IMA approval number. This mineral species is distinct from elemental copper, the copper commodity, and an impure flotation concentrate. The curated bioleaching experiment concerns an Aitik concentrate; its copper-element representation in cmmmech:copper is the same experiment, not an independent replication. No constituent-element criticality is inherited.
