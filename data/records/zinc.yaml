mechanisms:
  - id: ferrooxidans_sphalerite_dissolution
    name: Conditional enhancement of sphalerite-concentrate dissolution
    process: bioleaching
    description: >-
      Living Thiobacillus ferrooxidans FC1, using the paper's historical name,
      increased zinc dissolution relative to matched chemical controls at
      elevated ferrous concentrations after an initial period without an
      advantage. Surface analyses and kinetic modeling support sulfur-layer
      removal as the explanation; they do not establish a specific enzyme or
      direct biological oxidation of the ZnS lattice.
    context: >-
      Gamsberg concentrate, reported as 98% sphalerite by XRD and 53.3% Zn,
      was milled to 45-53 micrometres and washed with 0.5 M sodium sulfide.
      The aerated, stirred laboratory electrolysis cell had a 2 L working
      volume, 5 g concentrate/L, 10% v/v inoculum, pH 1.6, 35 degrees C and
      dissolved oxygen 5.9 mg/L. Redox control maintained dissolved iron
      conditions; 1999 experiments held Fe(III) at 1 g/L while varying Fe(II).
      Zinc was assayed in 0.45-micrometre filtrate by atomic spectrophotometry.
      This is dissolution, not isolated zinc-product recovery or deployment.
      Analytical repeatability replicates do not establish biological
      replication. NCBITaxon:920 maps the published species name, not a
      verified strain accession or modern genomic reassignment of FC1.
    microbial: true
    organisms:
      - id: NCBITaxon:920
        label: Acidithiobacillus ferrooxidans
    evidence:
      - source_ref: fowler_crundwell_1999
        supports: support
        explanation: >-
          Methods and Figures 2-6 compare inoculated and microscopy-checked
          sterile runs. Dissolution diverged after approximately 8-12 h;
          surface comparisons at Fe(II) 4 g/L after 100 h and 8 g/L after 69 h
          support the authors' sulfur-removal interpretation. No recovery
          percentage is inferred from the plots.
      - source_ref: fowler_crundwell_1999
        supports: partial
        explanation: >-
          Figures 2-3 include a 1 g/L Fe(II) series whose paired data
          appear inconsistent with the Discussion's sharp low-ferrous null
          boundary. A universal 1 g/L threshold is therefore not curated.
          Shrinking-core fits and SEM/EDAX are mechanistic support, not enzyme
          assays, sulfur mass balance, or independent process replication.
      - source_ref: fowler_crundwell_1998
        supports: partial
        explanation: >-
          Methods and Figures 4-6 report similar zinc dissolution with FC1 and
          sterile controls when Fe(II) was held at 1 g/L and Fe(III) varied,
          at pH 1.6, 35 degrees C and 5 g concentrate/L. Bacterial iron
          oxidation and surface attachment occurred, but no additional
          dissolution was demonstrated under those conditions. This bounds
          the later enhancement claim; neither study justifies a universal
          direct bacterial leaching mechanism.
