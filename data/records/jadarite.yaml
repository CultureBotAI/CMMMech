id: cmmmech:jadarite
name: Jadarite
material_kind: mineral
description: Jadarite is the LiNaB3SiO7(OH) mineral species in the September 2026 IMA list, with approved status and approval number 2006-036. It is distinct from the lithium and boron elements, their commodity designations, and mixed Jadar Valley sediment. The experiment below is also represented in cmmmech:lithium; this mineral-level representation is not an independent replication. No constituent-element criticality is inherited.
