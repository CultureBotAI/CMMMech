id: cmmmech:chromite-beneficiation-tailings
name: Chromite beneficiation tailings
material_kind: secondary_resource
description: Mixed residual mineral solids from physical beneficiation of chromite-bearing ore. The curated 2018 case is fresh superficial tailings collected in May 2017 at a beneficiation plant in Sukinda valley, Odisha, India, with a separate stockpiled-tailings core used for chemical extraction comparisons. The source describes comminution, desliming and gravity concentration, rather than chromate manufacture. These solids are distinct from the chromite mineral species, unprocessed ore, lateritic overburden, the plant's chromite concentrate and chemically processed chromite ore residues. Reported XRD phases include chromite, goethite, hematite, gibbsite and chlorite; Cr also occurs in nonchromite phases. Table 1 reports 56.7 wt% Fe2O3 and 18.1 wt% Cr2O3 on an XRF oxide-equivalent basis, not quantitative mineral fractions. A separate 2025 fungal study uses two Eti Krom enrichment-tailings feeds labelled olivine and serpentine; both are mixed mineral materials, distinct from the Odisha
  samples and from pure olivine or serpentine minerals. Neither constituent criticality nor industrial microbial processing is inferred from these feeds' compositions or industrial origins.
