id: cmmmech:siderite
name: Siderite
material_kind: mineral
description: Siderite is the ferrous carbonate mineral species Fe(CO3), listed as approved through
  a 1962 special procedure in the September 2026 IMA list. The special-procedure year is not an approval-number
  CURIE. The selected culture experiment identifies siderite alongside dominant vivianite, rather
  than a pure carbonate product. It is distinct from elemental iron, iron-ore commodities and other
  iron-bearing phases. This is the same experiment curated under vivianite, not independent evidence
  or an inherited criticality designation.
