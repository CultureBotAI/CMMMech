mechanisms:
- id: abiotic_gel_synthesis
  name: Hydrothermal crystallization from strontium-vanadium-silicate gels
  process: other
  description: Ito reported diffraction-assigned haradaite after hydrothermal treatment of chemically
    prepared strontium-vanadium-silicate gels. Table 1 run 6 used a mixture approximating the mineral
    composition at 600 degrees C and 35,000 psi for 72 hours, with haradaite the only product listed from
    powder diffraction; the matching run 6 diffraction data are given in Table 4. Other compositions and
    conditions yielded amorphous material or mixtures with quartz, vanadium oxides and strontium silicate.
    The observation supports abiotic laboratory crystallization, not a quantified purity, mineral recovery
    or microbial pathway.
  context: The common method used co-precipitated gels with initial V4+, C.P.-grade starting chemicals,
    drying below 100 degrees C and electrically sealed gold tubing 2-5 mm in diameter. No additional water
    was introduced because the gels retained water. Run 6 combines the V/Si-excess Sr-H-a precursor precipitated
    with NH4OH and the Sr/Si-excess Sr-H-c precursor precipitated with NaOH to approximate haradaite composition.
    Its atmosphere is tabulated as weakly reducing, but the author states precise atmospheric control
    was impossible; no measured oxygen fugacity or complete initial pH is supplied. The post-run liquid
    was slightly alkaline only when liquid remained. Natural-pattern comparison uses Yamato material;
    its preferred orientation changes intensities. The bulk chemical/valence analysis in Table 8 is synthetic
    run 4, not run 6. No organism, biological control, replicate count, quantitative phase fraction or
    isolated product recovery is reported.
  microbial: false
  evidence:
  - source_ref: ito1965
    supports: support
    explanation: Pages 300-304, Table 1 run 6 and footnote 4 specify the mixed precursors, 600 degrees
      C, 35,000 psi, 72 hours and the haradaite assignment. Table 4 specifically labels synthetic haradaite
      No. 6 and compares its powder spacings with natural Yamato haradaite; pages 306-308 discuss preferred
      orientation in the natural sample and index the synthetic orthorhombic cell. This supports the crystalline-product
      identity under this run, rather than transferring an assignment from another species.
  - source_ref: ito1965
    supports: partial
    explanation: Table 1 run 8, the Sr-rich gel at 200 degrees C and 20,000 psi for 24 hours, remained
      amorphous; runs 9-10 at 300 and 400 degrees C under the same pressure/duration list haradaite. Other
      runs contain quartz, V2O3, VO2 or SrSiO3; high-temperature runs and pages 301,313 describe reduced
      crystal quality and unidentified blue acicular material. Table 8 bulk analysis of the V-rich run
      4 reports both VO2 and V2O3 equivalents, with minor V3+ attributed to oxide contamination; it is
      not a site-specific analysis of run 6. The suggestion of slight hydration is not substituted for
      the current ideal formula. The broader 250-750 degrees C stability range and Fig. 5 equilibrium
      diagram are interpretations of sampled products with uncontrolled atmosphere, without reversible
      phase-equilibrium or microbial experiments.
  - source_ref: takeuchi1967
    supports: context_only
    explanation: 'The independent natural-crystal study supports a haradaite structure containing vanadyl-linked
      silicate chains, not a synthetic-run yield. Pages 99-110 consider Amam versus Ama2: higher-level
      reflections were unsatisfactory, only selected reciprocal-space levels were used, some reflections
      were zero-weighted in lower-symmetry refinement, and possible intensity error or disorder remained.
      These limitations prevent treating the historical refinement as proof of perfect composition or
      uniquely resolved local symmetry in every specimen.'
  - source_ref: watanabe1982
    supports: context_only
    explanation: Pages 21-24, Figures 1-5 and Table I distinguish natural Noda-Tamagawa and Yamato material.
      Page 24 identifies the analyzed type material as calcian/barian, deducts Pb, Cu and water as nonessential
      in its empirical formula, and prefers Amam after the earlier structure work. The printed Table I
      instruction deletes the 121 assignment; that entry is not silently used as an accepted reflection.
      Natural mineral association is context, not a controlled crystallization or microbial mechanism
      experiment.
