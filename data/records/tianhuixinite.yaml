id: cmmmech:tianhuixinite
name: Tianhuixinite
material_kind: mineral
description: >-
  IMA-approved hydrous molybdenum trioxide ("molybdic acid") mineral (IMA 2022-081; status
  A, Approved 2022; full description published January 2026; symbol Thx in the Abstract, p.
  39, and Section 1, p. 40, of the primary paper; no separate symbol column is printed in
  the September 2026 IMA Master List, PDF p. 217) with ideal end-member formula
  (MoO3)3*H2O (equivalently MoO3*1/3H2O, requiring MoO3 96.00 wt%, H2O 4.00 wt%, total
  100.00 wt%; Gu, Yang, Marty, Kampf, Thorne, Gibbs, and Downs, 2026, European Journal of
  Mineralogy 38:39-52). Co-described with zhenruite ((MoO3)2*H2O, IMA 2022-050) and named
  in honour of the late Professor Huixin Tian (1933-2015) of the Department of Geology,
  Chengdu University of Technology, Sichuan, China, for his lifelong dedication to teaching
  mineralogy and optical mineralogy (Section 1, p. 40). Discovered on a specimen collected
  by Ray Demark on 18 February 2016 in an unnamed short adit of the Summit group of claims
  (latitude 32 deg 33 min 47 sec N, longitude 107 deg 43 min 48 sec W) near Cookes Peak, at
  the southern end of the Cookes Range, Luna County, New Mexico, USA (hosted in oxidized,
  silicified limestone-jasperoide fluorite-Pb-Zn-Ag ore bodies above a granodiorite stock;
  co-type locality for raydemarkite, virgilluethite, and stunorthropite, associated with
  barite, fluorite, ilsemannite, jordisite, powellite, pyrite, quartz, raydemarkite,
  sidwillite, and virgilluethite; Abstract, p. 39, and Section 2.1, pp. 40-41); the
  holotype specimen is deposited in the University of Arizona Alfie Norville Gem and Mineral
  Museum, Tucson, Arizona, USA (catalogue no. 22719), and the cotype specimen is deposited
  in the RRUFF Project, University of Arizona, USA (catalogue no. R220024) (Section 1, p.
  40). Occurs as dark blue-green nanometric crystal aggregates (10-70 um across) intergrown
  with virgilluethite on a quartz matrix, composed of subhedral hexagonal rod-like crystals
  up to 3 x 1 x 1 um elongated along [001] (observed by field-emission SEM; Figures 2, 4,
  and 5, pp. 41-42); crystals are translucent in transmitted light with lower transparency
  than virgilluethite, raydemarkite, or sidwillite, and have a white streak, vitreous
  lustre, brittle tenacity, Mohs hardness ~2, no observed cleavage or twinning, Gladstone-
  Dale calculated average refractive index n_calc = 1.996 (optical properties could not be
  measured directly because the refractive indices exceed those of available immersion
  liquids), and calculated density Dcalc = 4.131 g/cm3 based on the empirical formula and
  powder X-ray diffraction unit-cell volume V = 361.74(2) A3 (Abstract, p. 39, and Section
  2.2, p. 41), or rho_cal = 4.11 g/cm3 in Table 3 (p. 47) based on the single-crystal X-ray
  diffraction unit-cell volume V = 361.88(9) A3 with Z = 2 (density could not be measured
  directly owing to small crystal size and limited material). Wavelength-dispersive
  electron-microprobe analyses (Shimadzu EPMA-1720 at 15 kV, 10 nA, 2 um beam diameter,
  pure Mo metal standard, n = 8 spot analyses; Section 2.2, pp. 41-42, and Table 1, p. 41)
  yielded mean MoO3 96.81 wt% (SD 2.4 wt%), with stoichiometric H2O* = 4.04 wt% added in
  ideal proportion to measured MoO3, giving a total of 100.85 wt% and an empirical formula
  of (Mo1.00O3)3*H2O on the basis of 10 O atoms per formula unit (note that Table 1
  footnote * on p. 41 labels H2O* = 4.04 wt% as "Added in ideal value", whereas Section 2.2
  on p. 42 states that ideal (MoO3)3*H2O requires MoO3 96.00 wt% and H2O 4.00 wt%; 4.04 wt%
  is the stoichiometric H2O corresponding to 96.81 wt% MoO3, since 96.81 x (4.00 / 96.00) =
  4.034 wt%). Micro-Raman spectroscopy (Thermo Almega, 532 nm laser, 1 um spot; Section 2.3
  and Figure 7, pp. 42-45) showed bands at 3500 and 1609 cm-1 (H2O O-H stretching and H-O-H
  bending), 974, 922, and 897 cm-1 (terminal Mo=O stretching), 687 and 526 cm-1 (bridging
  Mo-O-Mo stretching), and lattice modes below 400 cm-1 (351, 249, 224, 179, 134, 107 cm-1),
  matching synthetic hexagonal (MoO3)3*H2O (Guo et al., 1994; Seguin et al., 1995).
  Crystallizes in the hexagonal system, space group P63/m (#176), as the natural counterpart
  of synthetic hexagonal P63/m (MoO3)3*H2O ("alpha-MoO3*H2O" / hexagonal MoO3 hydrate of
  Rosenheim, 1906, and Zhao et al., 2009), with single-crystal X-ray diffraction unit-cell
  parameters (Rigaku XtaLAB Synergy D/S, CuKalpha radiation, lambda = 1.54184 A, at room
  temperature; Section 2.4, p. 45, and Table 3, p. 47) a = 10.5963(12) A, c = 3.7216(4) A,
  V = 361.88(9) A3, Z = 2, and axial ratio c:a = 0.3512 (powder X-ray diffraction on a
  Rigaku SmartLab diffractometer with CuKalpha1 radiation, lambda = 1.54056 A, at 40 kV and
  30 mA, gave refined unit-cell parameters a = 10.5960(3) A, c = 3.7199(2) A, V = 361.74(2)
  A3; Section 2.4, p. 43). The crystal structure was solved by direct methods (SHELXT) and
  refined on F2 (SHELXL) to R1 = 0.061 and wR2 = 0.171 for 269 observed reflections with I
  > 2sigma(I) (out of 296 independent and 2130 collected reflections, Rint = 0.07, GooF =
  1.137 for 26 parameters; Table 3, p. 47). In the asymmetric unit (Table 4, p. 47), one
  unique Mo site at 6h (0.89489(13), 0.35456(12), 3/4; BVS 6.02 vu in Table 7b, p. 49) is
  coordinated in a strongly distorted MoO6 octahedron (two short terminal Mo=O bonds of
  1.685(11) A to O3 and 1.716(10) A to O1, two intermediate Mo-O2 bonds of 1.958(4) A x 2,
  and two long Mo-O1 bonds of 2.185(10) and 2.328(11) A; Table 6, p. 49), forming double
  chains of edge-sharing MoO6 octahedra along [001] that share O2 corners to build a
  three-dimensional open framework with 5.45 A wide hexagonal tunnels along [001] occupied
  by zeolitic channel H2O molecules at the 2b site O4 (0, 0, 3/4; Uiso = 0.19(3) A2)
  (Sections 3.2-3.3, pp. 47-51). The seven strongest powder X-ray diffraction lines
  [dmeas in A (Imeas, Ical) (hkl); Abstract, p. 39, and Table 2, p. 46] are 9.174 (100.0,
  100.0) (010), 4.586 (26.3, 37.3) (020), 3.456 (94.1, 71.7) (1-30), 3.047 (42.7, 55.6)
  (111), 2.539 (34.2, 36.8) (121), 1.951 (13.8, 16.1) (041), and 1.641 (22.0, 13.4) (1-32)
  (Table 2 on p. 46 also highlights 1.999 A, Imeas = 12.9, Ical = 27.8, hkl = (1-50) in
  bold). No biological or microbial interaction data are reported in the type mineralogical
  description.
