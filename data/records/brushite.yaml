id: cmmmech:brushite
name: Brushite
material_kind: mineral
description: Brushite is the hydrated calcium hydrogen phosphate mineral Ca(PO3OH)(H2O)2, commonly written
  CaHPO4·2H2O. The September 2026 IMA list gives grandfathered status and original-description year 1865,
  not a unique approval accession. It is distinct from anhydrous monetite, apatite minerals, elemental
  phosphorus and mixed phosphate fertilizers. The curated laboratory experiment contains brushite-bearing
  mixtures, including cell-free precipitates, rather than a phase-pure recovered product. No constituent
  criticality is inherited.
