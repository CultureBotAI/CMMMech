  evidence:
  - source_ref: pakostova2023_electroformed
    supports: support
    explanation: Results 3.1-3.3 and Figures 2-4 document rising dissolved Cu, cell counts and high redox potential during inoculated leaching. Reported cumulative Cu solubilization was about 95% for CF3 over 78 days, 99.2% for the consortium flask over 59 days and 99.6% for the adapted reactor over 12 leaching days. Pre-growth precedes those leaching durations. CF3's result is 94.7% in the abstract and 95.2% in Results 3.1; the discrepancy is retained rather than selecting an exact value. The uninoculated control released 5.3% in 75 days and retained predominantly Fe(II), supporting culture-associated ferric regeneration under the tested conditions rather than an exclusive biological dissolution chemistry.
  - source_ref: pakostova2023_electroformed
    supports: partial
    explanation: The control was not matched to the reactor's temperature, aeration or adaptation and did not maintain an equivalent abiotic ferric supply. No independently replicated leaching vessels or inferential statistical comparison are described in Methods 2-3; time-course points and n values for redox readings are not biological replicates. Faster reactor dissolution therefore cannot be assigned specifically to adaptation, community composition, temperature or aeration. CF3 plateaued near 42% before medium replacement; Cu inhibition is an interpretation rather than an isolated dose-response experiment. Fresh medium and continual sulfuric-acid dosing are material process inputs.
  - source_ref: pakostova2023_electroformed
    supports: partial
    explanation: Results 3.2-3.3 and Figure 5 show changes in genus-level sequence-read proportions and cultured isolates resembling A. ferridurans and L. ferriphilum. These observations do not isolate each member's causal contribution or distinguish viable from dead-cell DNA. The abstract gives final Leptospirillum abundance as 59%, whereas Results 3.3 says 50.0%; the discrepancy remains unresolved. Figure 5 is not used to infer an independent exact percentage. No sequence accession is supplied in the inspected main article. The missing supplementary images limit verification of apparatus and abiotic-residue microscopy but do not remove the main-text control data.
  - source_ref: pakostova2023_electroformed
    supports: partial
    explanation: Results 3.5 and Figure 7 show collected Ag-rich residue with local EDS values of 92.6% Ag, 7.2% Cu and 0.2% Fe. This is an incompletely purified residual fraction, not a measured whole-feed Ag recovery yield or evidence of microbial silver reduction. Local EDS and photographs do not establish bulk purity, metal mass balance, product specification or closed-loop manufacturing performance. Laboratory feed manufacture and use do not establish industrial deployment or verified economic and environmental advantage.
  - source_ref: ncbi_cf3_species
    supports: context_only
    explanation: The current NCBI species label and CF3 type-strain annotation support using A. ferruginosus as taxonomic context. The paper's A. ferrooxidans and Table 1 parenthetical ferruginosis are preserved as historical source naming; the species CURIE does not independently identify the exact laboratory stock or establish a consortium member's role.
  - source_ref: ncbi_cf3_biosample
    supports: context_only
    explanation: The public CF3 sample is assigned to A. ferruginosus; its linked project retains an A. ferrooxidans strain CF3 title. This supports a nomenclature distinction and is not a sequence deposit for the leaching experiment.
- id: downstream_copper_electrowinning
  name: Chemical iron removal followed by copper electrowinning
  process: recovery
  description: A separate electrochemical operation deposited copper from selected bioleachates on a copper-foil cathode. Prior iron precipitation improved the reported electrowinning performance but discarded part of the dissolved copper. Neither stage is demonstrated microbial copper biomineralization, and its solution-based yield is not whole-feed recovery.
  context: Methods 2.4 used 200 mL leachate in a stirred beaker at about 22 degrees C and 300 rpm, 20 mA/cm2, a 5 by 5 cm Cu-foil cathode and an IrO2-Ta2O5-coated Ti anode for up to five hours. Unamended liquor at pH 1.9 contained 20 mM Fe; amended liquor was raised to about pH 4 with 1 M KOH and filtered at 0.22 micrometres to remove precipitated iron. The tested leachates contained 13.7-21.7 g/L Cu; these concentrations do not describe every collected fraction. Sampling ICP measurements tracked residual dissolved Cu, and SEM-EDS examined deposited material.
  microbial: false
  evidence:
  - source_ref: pakostova2023_electroformed
    supports: support
    explanation: Results 3.4 and Figure 6 report 89% Cu recovery from unamended liquor in four hours with 60-66% current efficiency, versus near-complete solution depletion in approximately 3.3 hours after iron removal and 80-92% current efficiency during active plating. The source alternates greater-than-99%, 99.9% and 99.99% wording; this record does not turn those rounded statements into a more precise reconstructed yield. Current efficiency subsequently fell as dissolved Cu was depleted.
  - source_ref: pakostova2023_electroformed
    supports: partial
    explanation: Raising pH removed more than 99.99% of iron as reported, but also co-precipitated 6-19% of the already solubilized Cu. Electrowinning recovery is conditional on the remaining liquor and cannot be applied to the original scrap without those losses and other stage balances. Figure 8 and Results 3.5 give local EDS Cu contents of 98.5-99.9% on the recovered sheet. A starting Cu-foil cathode, local elemental measurements and no reported net deposited-mass balance prevent treating these values or the sheet dimensions as a validated bulk product yield or certified purity.
causal_graphs:
- id: iron_oxidizing_culture_leaching_graph
  name: Acidithiobacillus ferruginosus CF3 rus-operon Fe(II) oxidation and ferric-mediated Cu dissolution from defective electroformed Cu/Ag tubes
  description: Causal pathway linking representative Acidithiobacillus ferruginosus CF3 (NCBITaxon:3063951; reference proteome UP001196097) rus-operon ferrous-iron oxidation proteins (outer-membrane Cyc2 HF292_015305, periplasmic rusticyanin HF292_015270, periplasmic diheme Cyc1 HF292_015300, and rus-operon cytochrome-c oxidase subunit II HF292_015290) to aerobic oxidation of 20 mM Fe(II) in basal salts medium (initial pH 1.7 during pre-growth, maintained at pH 1.9 with 1 M H2SO4 during leaching) and ferric-mediated Cu solubilization from defective electroformed Cu/Ag tubes (~500 um Cu walls over a 24-30 um inner Ag layer; 19.64 g in 0.7 L for pure CF3 over 78 days reaching 94.7% Cu solubilization in the abstract vs 95.2% in Results 3.1 after medium replacement, compared with 5.3% in 75 days in the uninoculated Fe(II)-retaining flask control, and 99.2% / 99.6% in the separate mixed-consortium flask / 32 C adapted reactor arms) in Pakostova and Herath (2023).
  scope: REPRESENTATIVE_EXAMPLE
  mechanism_ref: iron_oxidizing_culture_leaching
