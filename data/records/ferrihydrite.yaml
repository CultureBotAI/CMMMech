    label: Desulfovulcanus ferrireducens Ax17 dissimilatory Fe(III)-reducing electron-transport system
    node_type: GENE_OR_PROTEIN
    description: Dissimilatory Fe(III) reduction electron-transport machinery of thermophilic bacterium Desulfovulcanus ferrireducens Ax17 (DSM 111878) coupled to H2 oxidation; marked UNGROUNDED because Sklute et al. (2023) characterized mineral transformation without isolating specific c-type cytochromes or reductase genes, and no reference proteome is available in UniProtKB for NCBITaxon:2831190.
