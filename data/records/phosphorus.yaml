          Major facilitator superfamily plasma-membrane exporter CexA responsible
          for organic acid secretion in Aspergillus niger ATCC 1015 during
          acidogenic growth, supporting extracellular acidification (to pH 2.46)
          and struvite-derived inorganic phosphate mobilization.
        annotation_note: >-
          Grounded to strain-matched reviewed Swiss-Prot entry UniProtKB:G3Y4N5
          (CEXA_ASPNA; locus ASPNIDRAFT_56962) for Aspergillus niger ATCC 1015
          (NCBITaxon:380704).
        evidence:
          - source_ref: kang_2022
            supports: partial
            explanation: >-
              Representative reviewed Swiss-Prot organic acid export transporter
              from the exact experimental strain Aspergillus niger ATCC 1015
              (NCBITaxon:380704); Kang et al. (2022) measured culture pH 2.46,
              26.49 mM oxalic acid, and 51.37 mM soluble Pi without assaying
              individual fungal genes.
