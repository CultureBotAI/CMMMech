id: cmmmech:lopatkaite
name: Lopatkaite
material_kind: mineral
ima_symbol: Lpk
description: >-
  IMA-approved lead-antimony-arsenic sulfosalt mineral (IMA 2012-083; symbol Lpk; status A,
  Approved 2013; full description published April 2026) with ideal end-member formula
  Pb5Sb3AsS11 (Z = 8; written Pb10As2Sb6S22 with Z = 4 in the type description, requiring
  Pb 56.64 wt%, Sb 19.97 wt%, S 19.29 wt%, As 4.10 wt%, total 100.00 wt%), representing the
  ordered As-rich homeotype/isotype of monoclinic boulangerite (MDO1 polytype) in the
  boulangerite homologous series (Topa et al., 2026, European Journal of Mineralogy
  38:217-229). Discovered at the Taylor Pit, Lot 13, Concession XIV, Huntingdon Township,
  Madoc area, Hastings County, Ontario, Canada (collected by Russian-Canadian mineral
  collector Vladimir Lopatka, b. 1957, in 1995), where it occurs in nested sulfosalt
  aggregates >500 um across hosted by Grenvillian Precambrian cipollino (calcite-dolomite)
  marbles, associated with boulangerite (which overgrows and partially replaces lopatkaite),
  veenite, sterryite, calcite, sphalerite, jamesonite, arsenopyrite, and pyrite; the
  holotype polished section is deposited at the Natural History Museum Vienna (NHMW),
  Austria, under catalogue number O 3954 (transferred from the Mineralogical Museum of the
  University of Salzburg, former catalogue number 15008). Forms greyish-black subhedral to
  anhedral grains up to 300 um and aggregates >500 um with a dark-grey streak, metallic
  lustre, opaque diaphaneity, brittle tenacity, irregular fracture, no cleavage or parting,
  Vickers microhardness VHN50 = 189-208 kg/mm2 (mean 200 kg/mm2, corresponding to Mohs
  hardness 3-3.5), and calculated density Dcalc = 6.168 g/cm3 for the empirical formula and
  6.096 g/cm3 for the ideal formula on the single-crystal unit cell. In reflected light it is
  greyish-white with distinct bireflectance, distinct pleochroism, and distinct anisotropy
  showing greyish to brownish-grey rotation tints; Commission on Ore Mineralogy (COM)
  reflectance values in air (Rmin, Rmax in %; Table 1) are 37.0, 39.3% (470 nm), 34.1, 36.9%
  (546 nm), 33.1, 36.2% (589 nm), and 31.3, 34.1% (650 nm). Field-emission electron
  microprobe analysis (JEOL JXA-8530F, 25 kV, 20 nA, 1.5 um beam; Table 2) of the grain used
  for single-crystal X-ray diffraction (Group 5, n = 4 points) yielded Pb 57.81(4) wt%, Sb
  20.03(9) wt%, S 19.08(6) wt%, and As 3.53(8) wt%, total 100.46(22) wt% (arithmetic sum
  100.45 wt%), corresponding on the basis of 40 atoms per formula unit (Me18S22, Z = 4) to
  the empirical formula Pb10.28(3)As1.74(4)Sb6.06(3)S21.92(3) (As/Sb = 0.287, Pb/(Sb+As) =
  1.32), while the most As-enriched domain (Group 6, n = 5 points) yielded Pb 57.36(6) wt%,
  Sb 18.77(13) wt%, S 19.20(1) wt%, and As 4.43(7) wt%, total 99.77(2) wt% (arithmetic sum
  99.76 wt%), giving Pb10.17(1)As2.17(3)Sb5.66(4)S21.99(1) (As/Sb = 0.383, Pb/(Sb+As) =
  1.30). Crystallizes in the monoclinic system, space group P21/c (#14), with single-crystal
  X-ray diffraction unit-cell parameters a = 8.0806(6) A, b = 23.3597(18) A, c = 21.4880(16) A,
  beta = 100.7090(10) deg, V = 3985.4(5) A3, and Z = 4 for Pb10As2Sb6S22 (or Z = 8 for
  Pb5Sb3AsS11; refined to R1 = 0.0412, R(all) = 0.0498, wR(on Fo^2) = 0.0842, and
  GoF = 1.032 for 3569 reflections with Fo > 4sigma(Fo) out of 4241 unique reflections from
  25,691 measured at 300(2) K on a 0.05 x 0.08 x 0.12 mm fragment using MoKalpha radiation,
  Table 4). The structure consists of rod-layers of lozenge-shaped [100] SnS-archetype rods
  composed of three double ribbons (R1, R2, R3) with 18 independent cation sites and 22 S
  sites (Table 5), giving the refined structural formula Pb10.336As1.567Sb6.088S22 (Z = 4,
  cation sum 17.991 apfu), defined by dominant As occupancy at two peripheral ribbon sites,
  (As,Sb)3 (As0.673(16)Sb0.327(16), BVS = 3.263 v.u.) and (As,Sb)8 (As0.581(15)Sb0.419(15),
  BVS = 3.399 v.u.), together with minor As at (Sb,As)4 (Sb0.723(15)As0.277(15),
  BVS = 3.342 v.u.) and (Sb,As)7 (Sb0.955(15)As0.045(15), BVS = 3.307 v.u.), and mixed
  Pb/Sb occupancy at (Pb,Sb)4 (Pb0.922(8)Sb0.078(8), where Table 5 on p. 223 prints the bond
  valence sum without a decimal point as "2128" for 2.128 v.u.), (Sb,Pb)5
  (Sb0.892(9)Pb0.108(9), BVS = 2.912 v.u.), and (Sb,Pb)6 (Sb0.694(9)Pb0.306(9),
  BVS = 2.660 v.u.). The seven strongest calculated powder X-ray diffraction lines (dcalc in
  A (Irel; hkl), CuKalpha, Table 3) are 3.712 (100; 0 3 5), 2.020 (47; -4 0 2), 2.780 (43;
  2 6 0), 2.804 (41; -2 6 1), 3.728 (39; 2 1 1), 2.779 (38; -2 6 2), and 3.653 (35; 0 6 2).
  No biological or microbial interaction data are reported in the type mineralogical
  description.
