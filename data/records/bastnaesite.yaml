  evidence:
  - source_ref: he_2025
    supports: support
    explanation: Sections 2.1-2.3 and 3.2, Figure 5 (postprint p18) and Table 1 support increased aqueous REE in the inoculated mineral assays. At day 30, total REE concentrations were approximately 1698 micrograms/L in the unbuffered culture, 84 micrograms/L in the nominally pH-6 buffered culture, and 490 micrograms/L with mineral in dialysis bags. Unbuffered La and Ce were approximately 643 and 805 micrograms/L. Mineral-containing sterile and mineral-free culture controls were reported close to ICP-MS detection limits; no numerical detection limit is provided. These are solution concentrations, not percentages of mineral extracted or isolated-product yields.
  - source_ref: he_data_v1
    supports: support
    explanation: Data5 day-30 rows reproduce the approximately 1698, 84 and 490 micrograms/L totals by summing La, Ce, Pr, Nd and the other-REE column. Data5 contains means and standard deviations for the three inoculated mineral arms; it does not supply quantitative rows for the sterile or mineral-free controls. The workbook corroborates the reported study and does not constitute an independent experiment.
  - source_ref: he_2025
    supports: partial
    explanation: Figures 2-4 and 6 and Section 2.3.2 support acidification and the plausibility of ligand-promoted dissolution. The chemical assays used 0.1 g mineral in 20 mL HCl or selected organic-acid solutions, initial pH 3, 5 or 6, room temperature and 180 rpm for 96 hours. Their shorter duration and different solution matrix prevent treating them as fully matched 30-day abiotic comparators for the cultures. No metabolite-deletion or equivalent causal test establishes the necessity of a particular acid.
  - source_ref: he_2025_supplement
    supports: partial
    explanation: Text S1 describes internal-standard-normalized UHPLC-MS metabolite annotations; these are relative signals, not calibrated culture molarities. Table S1 lists eight screened acids, seven tested because pelargonic acid was excluded as insoluble, plus additional tartaric and gluconic acids. Chemical leaching activity of an added acid therefore cannot be assigned quantitatively to its measured endogenous concentration.
  - source_ref: he_data_v1
    supports: partial
    explanation: Data6 gives approximately 130.9 and 134.8 micrograms/L total REE after 96 hours with 20 micromolar tartaric and gluconic acid at initial pH 6, respectively, supporting the potential of stronger ligands. The main prose calls release by the seven initially selected acids at pH 6 absent, but Data6 contains low values up to approximately 2.8 micrograms/L and blanks; this is weak or near-background release, not demonstrated exact zero. Blank cells remain missing. The main pH-3 organic-acid range of approximately 1915-2180 micrograms/L also omits the Data6 crotonic-acid mean of approximately 1794 micrograms/L; the source discrepancy is unresolved.
  - source_ref: he_data_v1
    supports: partial
    explanation: Data2 day-30 mean pH values are 3.7567 in Exp-Biow, 5.7567 in Buffered-Biow and 4.44 in Exp-bags. Thus nominally buffered pH 6 was not exactly constant. Section 3.1 describes late unbuffered pH as approximately 3.5, whereas Figure 2, the Figure 8 caption and Data2 are nearer 3.7. Data3 and Figure 2 also show an early unbuffered increase from approximately 1.23 million to 70 million CFU/mL, inconsistent with the Discussion's general statement that growth increments were less than one order of magnitude.
  - source_ref: he_2025
    supports: partial
    explanation: Dialysis-bag cultures still mobilized REE, but had different pH and planktonic cell counts; bag transport may also differ. Their lower aqueous concentrations cannot quantify an isolated direct-contact effect. Figure 7 shows mineral-associated cells, etching and fine REE-bearing surface material. Similar EDS composition does not uniquely identify a new mineral phase; supplementary Figure S2 shows no obvious XRD phase change. Cell sorption and solid reprecipitation were not quantitatively separated, so no closed REE mass balance or isolated recovery is established.
  - source_ref: he_2025
    supports: partial
    explanation: 'Feed estimates are not fully reconciled: Figure 1''s semiquantitative approximately 3 wt% quartz differs from Table 1''s bulk 0.635 wt% SiO2. These method-specific results are preserved without treating the feed as exactly 97% pure or assigning a formal species from its bulk oxides. The proposed retention of released REE by clays in natural weathering profiles is an inference from laboratory dissolution and literature comparisons, not a direct clay-adsorption assay or industrial deployment.'
