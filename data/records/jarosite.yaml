mechanisms:
- id: thiooxidans_sulfur_assisted_dissolution
  name: Culture-associated reductive dissolution with inorganic sulfur donors
  process: redox_transformation
  description: Acidithiobacillus thiooxidans DSM 504 cultures showed greater dissolved-iron release and Fe(II) accumulation from biosynthesized potassium jarosite than uninoculated controls supplied with the same sulfur donor. Sulfite gave the largest reported dissolution, followed by thiosulfate and elemental sulfur. The authors interpret this as dissimilatory iron reduction coupled to sulfur oxidation. The maintained claim is culture-associated reduction and dissolution; direct enzymatic reduction, growth by ferric-iron respiration and an exclusive electron-transfer pathway are not established.
  context: The potassium-jarosite feed was prepared in a separate Acidianus manzaensis culture at 65 degrees C and 180 rpm, using 100 mL basal medium in 250 mL flasks, initially pH 2.0 plus or minus 0.05, with 0.2 M FeSO4 and 0.067 M K2SO4. After approximately six days the precipitate was filtered, washed with deoxygenated ultrapure water and vacuum dried at 30 degrees C. Dissolution assays used 0.5 g feed in 50 mL sterile basal salts medium in 150 mL serum bottles, initial pH 1.94 plus or minus 0.05, and elemental sulfur, Na2S2O3 or Na2SO3 supplied at an equivalent sulfur concentration of 10 g/L. Inoculated bottles began at 4 x 10^8 cells/mL; each donor had an uninoculated sterile control. Bottles were sealed with butyl stoppers and flushed for approximately 20 minutes with N2/CO2 at 80/20 by volume, then shaken at 30 degrees C and 180 rpm for up to 34 days. Assays were in duplicate and sampled every two to four days. These are nominally anaerobic laboratory batches; a measured dissolved-oxygen
    time course, killed-cell control and cell-free culture-filtrate comparison are not reported.
