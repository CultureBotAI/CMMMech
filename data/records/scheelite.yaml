mechanisms:
- id: metallosphaera_scheelite_tungsten_release
  name: Culture-enhanced tungsten release from scheelite concentrate
  process: bioleaching
  description: Aerobic M. sedula cultures released more tungsten into clarified, filtered medium than corresponding uninoculated controls during incubation with an impure scheelite concentrate. This supports a microbial contribution to W mobilization in this system. The actual growth-supporting energy source and the relative contributions of direct mineral contact, microbially altered chemistry and abiotic acid dissolution remain unresolved. No enzyme-specific or tungsten-oxidation mechanism is established.
  context: 'The study used M. sedula DSM5348, represented here by a species-level identifier, in DSMZ88 Sulfolobus medium initially adjusted to pH 2.0 with sulfuric acid and not further adjusted. Aerobic cultures at 73 degrees C received CO2 and 10 g/L scheelite concentrate of average particle size 1 mm from the Serido Scheelite Province, Brazil. The feed was heated at 180 degrees C for at least 24 h and autoclaved at 121 degrees C for 20 min. It was not pure CaWO4: methods report Fe- and Mn-oxide impurities, while Table 1 reports multiple elements. The methods'' 19.0% Fe-oxide statement and Table 1''s 22.6 wt% Fe value are not reconciled; no pure-mineral or feed-normalized yield is inferred. Uninoculated medium with identically sterilized concentrate supplied the abiotic comparison. During the 21-day experiment, centrifuged supernatants were filtered at 0.44 micrometres and analyzed by ICP-OES. Figure 3 reports three biological replicates with standard-deviation error bars. This operational
    filtrate measurement does not identify aqueous W species or count W retained in cells and solids. No isolated product yield or complete tungsten mass balance is reported.'
  microbial: true
