id: cmmmech:hydrozincite
name: Hydrozincite
material_kind: mineral
description: >-
  Hydrozincite is the monoclinic zinc hydroxycarbonate mineral Zn5(CO3)2(OH)6,
  listed by IMA-CNMNC in September 2026 with grandfathered status G and
  original-description year 1853, not a numbered approval. It is distinct from
  smithsonite, zincite, elemental zinc and mixed zinc-bearing sediments. The
  curated evidence concerns hydrozincite-bearing field mats associated with
  photosynthetic microorganisms and a separate sterile precipitation experiment.
  It supports a qualified biological association rather than a pure-culture
  demonstration of microbial necessity, a phase-specific metal recovery yield,
  or industrial deployment. No criticality designation is inherited from zinc.
