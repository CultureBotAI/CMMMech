    description: Adding 1% w/v autoclaved BOF dust after 2 days of precultivation in batch flasks (14 days of dust leaching) or circulating inoculated medium through 1% w/v dust columns at 40 and 80 mL/min (21 days of dust leaching) mobilizes Y, Ce, Nd, Li, Co, Cu, Zn, Al, and Mn.
