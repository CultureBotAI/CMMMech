limitations:
- Accepted natural-occurrence evidence is deliberately source-reported and overlaps
  older 2002/2003 work. This review does not establish a newly independently replicated
  hafnon identification or a pure-phase diffraction refinement.
- The complete original 2003 microanalysis/graphics, 1974 natural description and
  2013 source remain uninspected; numerical chemistry from them is not imported. This
  review does not independently resolve the later 2007 citation inconsistency.
- All 16 pages of the 2004 primary, all nine figures/seven tables, IMA pages 1/88
  and the complete Handbook page were visually inspected. No additional unavailable
  raw analytical dataset or supplement is claimed inspected.
- No independent laboratory measurement, experimental replication or recovery assessment
  was performed. No microbial or criticality claim is inferred from constituent identity.
- Notice and local dedup searches are bounded. The declared local boundary included
  hidden/ignored files and followed symlinks, but missing roots, oversized text files
  and unextracted binaries remain explicit limits.
notes:
- No record, history or source-dossier edits were made by this reviewer. No Git/GitHub/governance
  mutation was performed.
- The complete 2003, 1974 and 2013 originals were not acquired or claimed reviewed.
  Their unavailable measurements are not accepted through later citations.
