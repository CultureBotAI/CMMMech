mechanisms:
- id: abiotic_stepwise_dehydration
  name: Abiotic dehydration and loss of crystalline order during heating
  process: other
  microbial: false
  description: Danisi et al. (2012) followed one natural cavansite crystal by in situ single-crystal
    X-ray diffraction during heating in dry nitrogen. Refined water-site occupancies decreased and
    the framework contracted while remaining indexed in Pnma through 350 degrees C; crystalline order
    was lost at approximately 400 degrees C. The authors interpret successive changes in water positions
    and calcium coordination as dehydration. The recorded temperatures characterize this experiment,
    not universal thermodynamic transition points or an industrial recovery process.
  context: A roughly 0.1 by 0.1 by 0.5 mm crystal from Wagholi quarry, Poona district, India, was
    mounted in an open 0.1 mm quartz-glass capillary and heated with a nitrogen blower. Complete
    diffraction data were collected at 25-degree increments up to 250 degrees C and 50-degree increments
    to 400 degrees C, holding at least 30 minutes at each next temperature before data collection.
    Water loss began in the refined model at 50 degrees C; approximate three-, two- and one-water
    descriptions were assigned at 75, 175 and 350 degrees C. The crystal broke between 150 and 175
    degrees C, limiting subsequent integrated reflections; partly occupied water oxygens used constrained
    common isotropic displacement parameters. The same crystal followed through temperatures is not
    independent specimen replication. Water content here is inferred from a diffraction model, not
    a directly measured water or vanadium recovery mass balance.
  evidence:
  - source_ref: danisi2012
    supports: support
    explanation: Methods page 1875, Tables 1-2, discussion pages 1877-1880 and Figures 2-4 support
      condition-specific water-site changes, contraction and loss of crystalline order. The deposited
      tables and CIFs in the archive are part of the same measurement series. No organism, metal
      extraction assay or isolated product is reported for this experiment.
  - source_ref: danisi2012
    supports: partial
    explanation: The abstract and simplified formulas describe complete loss of O9 water at 75 degrees
      C and O8 water at 350 degrees C, but Table 2b retains O9 occupancy 0.105(8) and Table 2d retains
      O8 occupancy 0.24(4); Figure 3d explicitly omits the residual O8 from the drawing. Thus three-,
      two- and one-water states are approximate model descriptions. Breakage, disorder and constrained
      refinement limit exact hydration assignments. Proposed removal of the last water as the cause
      of collapse is an interpretation. The printed high-temperature CIFs retain room-temperature
      diffraction metadata; experimental temperature attribution follows Table 1 and the described
      runs, not those uncorrected fields. No independent re-refinement was performed.
  - source_ref: ishida2009
    supports: partial
    explanation: Independent powdered Wagholi samples were heated in air at 10 degrees C/min for
      TG-DTA and high-temperature powder diffraction (pages 242-246, Figures 1 and 4). Cavansite
      retained a diffraction pattern after cooling from 400 degrees C, while the text and Figure
      4 describe an amorphous product at the higher heating stage. This differs from the dry-nitrogen
      single-crystal protocol and does not establish one transferable collapse temperature. The abstract
      says no intermediate amorphous phase; its scope is ambiguous alongside the terminal amorphous
      products described on pages 246 and 249, and it is not read as evidence that cavansite never
      becomes amorphous. The oxonium/hydroxyl interpretation is model-based because hydrogen positions
      could not be determined by the authors crystal refinement (page 244).
  - source_ref: danisi2012
    supports: refute
    explanation: The claim refuted is that the 2009 H3O+/OH model is an established necessary structural
      formula for cavansite. Located hydrogen positions, bond-valence interpretation and geometric
      critique of proposed hydrogen bonds on pages 1876-1877 instead support water molecules for
      the studied crystal. This disagreement does not refute the observed abiotic dehydration or
      prove that all natural specimens have identical hydrogen configurations.
  - source_ref: martucci2016_manuscript
    supports: partial
    explanation: The separate dynamic powder study used ground Wagholi crystals heated at 5 K/min
      in air and reports a different water-occupancy sequence, without resolving the split positions
      used by Danisi et al. The manuscript discusses time resolution, crystal dimensions, occupancy/displacement
      correlation and possible time-averaging as alternative explanations; it does not establish
      one model as universally correct. Its diffraction and thermal analyses are separate aliquots,
      and no controlled comparison isolates all protocol factors. The accessible version is an institutional
      preprint with prior referee criticism and author responses, not a checked final publisher version.
      Proposed applications of synthetic analogues are not demonstrated industrial deployment.
