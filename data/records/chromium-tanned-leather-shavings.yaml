  evidence:
  - source_ref: wieczorek2023
    supports: support
    explanation: Methods Biological material, Waste material, Biotransformation process and Determination of the total chromium; Tables 1–2 and Figures 1–4 support laboratory culture-associated transformation. Protease activity and amino-acid concentrations increased in selected culture/feed arms; uninoculated shavings acidified the medium while corresponding yeast treatments became more alkaline. Figure 4 shows a larger supernatant total-Cr concentration and a smaller combined solid-residue contribution for the 1% yeast treatment than for the 1% uninoculated treatment. These operational endpoints support conditional redistribution, not an independently quantified isolated product.
  - source_ref: wieczorek2023
    supports: partial
    explanation: Figure 4 stacks quantities labelled total chromium in g/kg for liquid and solid fractions. Methods digest 0.1 g or 0.1 mL and dilute to 25 mL but do not clearly define a common mass basis, fraction masses, liquid density or complete starting/ending inventory. Stacking these concentrations cannot establish an elemental mass balance or recovery fraction. The Results assign 10.31 g/kg to the 0.1% yeast sample, whereas the plotted value near 10 belongs to the 1% uninoculated supernatant. No exact extraction percentage or corrected numerical assignment is adopted.
  - source_ref: wieczorek2023
    supports: partial
    explanation: The measured solid residue explicitly combines biomass and remaining shavings. The discussion infers little intracellular chromium, but the assay does not separate intracellular uptake from surface sorption, retained feed or abiotic precipitation. Yeast-associated pH shifts also change chromium chemistry; no pH-matched sterile or enzyme-inactivated comparison establishes the contribution of proteases versus alkalinization or other culture products. Proposed chromium hydroxide/oxide chemistry is not direct phase identification.
  - source_ref: wieczorek2023
    supports: partial
    explanation: Supplemental file 2 reports Cr(VI) as not detected in medium, 0.1% and 1% shavings supernatants and corresponding residues, with stated bounds ≤1 mg/L for liquids and ≤1 mg/kg for residues. These censored results are retained as nondetections, not zeros, proof that oxidation never occurred, or a complete chromium-speciation balance. They do not extend to the 4% arm.
  - source_ref: wieczorek2023
    supports: partial
    explanation: Table 1 lists larger 48 h source-labelled degradation rates at 1% shavings than at 4%, contrary to the Results/abstract narrative favoring 4%. Methods say this rate was calculated from biomass concentration but give no explicit equation separating yeast from residual feed; it is not a chromium yield or a demonstrated collagen mass balance. Added yeast extract and the yeast-only amino-acid response prevent attributing all soluble products to the shavings. No universal optimum is accepted.
  - source_ref: wieczorek2023
    supports: context_only
    explanation: Supplemental files 3a and 3b contain sequences for laboratory samples 1304–1306 and a species report assigning sample C/1306 to Yarrowia lipolytica. They do not supply a public IPS21 accession or an explicit sample-number-to-IPS21 crosswalk. The identification report is dated October 2021, while main text describes sequencing in 2022; February 2022 email printouts accompany the sequences. IPS21 remains the paper-reported strain designation, distinct from an independently verified culture accession.
  - source_ref: wieczorek2023
    supports: context_only
    explanation: Figure 5 and the separate short plant assay evaluate diluted supernatants, while supplemental file 5 depicts plate growth around shavings. Neither establishes comprehensive detoxification, safe fertilizer use, industrial deployment or recovered chromium product quality. Those conclusions are not adopted.
  - source_ref: ncbi4952
    supports: context_only
    explanation: The current official species entry resolves Yarrowia lipolytica and taxon 4952. It does not validate the experimental stock, sequence provenance, matrix-specific mechanism or source-level strain identity.
