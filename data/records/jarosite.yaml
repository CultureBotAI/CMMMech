id: cmmmech:jarosite
name: Jarosite
material_kind: mineral
description: Jarosite is the potassium ferric hydroxysulfate mineral with ideal formula KFe3(SO4)2(OH)6, with all three iron atoms ferric. The September 2026 IMA list records the species as redefined, 1987 s.p. This record denotes K-jarosite, not the broader jarosite family, natrojarosite, ammoniojarosite, hydroniumjarosite, elemental iron or an industrial jarosite-bearing waste. The experiment below uses a laboratory biosynthesized potassium-jarosite preparation whose bulk composition differs from the ideal endmember. No constituent-element criticality or commercial recovery status is inferred.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 104, Jarosite row; page 1 explains status and approval/redefinition fields.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: chen2022
  title: Chen et al. (2022). Reductive dissolution of jarosite by inorganic sulfur compounds catalyzed by Acidithiobacillus thiooxidans. Hydrometallurgy 212, 105908. Complete Coventry accepted manuscript, methods sections 2.1-2.4, Table 1, Figures 1-8, and appended Supplementary Figures S1-S4.
  url: https://doi.org/10.1016/j.hydromet.2022.105908
  accessed_on: '2026-10-11'
