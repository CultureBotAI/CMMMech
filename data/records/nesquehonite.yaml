mechanisms:
- id: le1_solid_culture_nesquehonite
  name: Nesquehonite associated with a Desemzia-affiliated solid culture
  process: biomineralization
  description: Nesquehonite was identified by XRD among mixed mineral precipitates recovered from
    solid cultures of the Las Eras isolate LE1, affiliated by partial 16S sequence to Desemzia incerta.
    It was not detected in the study's liquid-culture assemblage. This supports occurrence in the
    tested microbial system; the missing reported control outcomes prevent concluding microbial necessity
    or a measured enhancement.
  context: LE1 was isolated from the uppermost microbial mat at Las Eras, Spain. The paper reports
    794-802-base partial 16S sequences and 99.8% similarity to the Desemzia incerta reference Y17300,
    which ENA identifies as DSM 20581. LE1 is not asserted to be DSM 20581, and the species CURIE
    expresses the reported affiliation only. LE-1 medium contained 1% yeast extract, 0.5% proteose
    peptone, 0.1% glucose and 2% NaCl (weight/volume), calcium and magnesium acetates at stated molar
    Mg/Ca 11, and 20 g/L Bacto-Agar for solid medium. Initial pH was 7.0, adjusted with 0.1 M KOH;
    medium was autoclaved at 121 degrees C for 20 minutes. Isolation plates were incubated aerobically;
    culture Results report mineral precipitation after 15 days at 30 degrees C in solid and liquid
    experiments. Vessel geometry, culture replication and a complete harvest-time series are not
    specified.
  microbial: true
  organisms:
  - id: NCBITaxon:82801
    label: Desemzia incerta
  evidence:
  - source_ref: sanz_montero_2019
    supports: support
    explanation: Culture Results, Table 3 and Figure 5B identify nesquehonite in the solid-culture
      mixture, with several diffraction peaks labeled Nes. The liquid pattern in Figure 5A and its
      Table 3 row lack nesquehonite; huntite instead appears in the liquid arm. Hydromagnesite and
      dypingite are grouped as Hmg and are not reinterpreted as nesquehonite. The accepted outcome
      is a qualitative phase assignment, not a pure-phase yield.
  - source_ref: sanz_montero_2019
    supports: partial
    explanation: Methods say uninoculated medium and medium with autoclaved cells were included in
      all experiments, but their mineral outcomes and matched diffraction traces are not reported
      in the inspected article. Thus control existence is not a demonstrated negative-control result.
      Table 3 is described as average semiquantitative analysis but its liquid and solid rows sum
      to 116 and 133.5 respectively; the nesquehonite cell 35 is not accepted as a normalized mass
      percentage or recovery yield. The text says Mg-calcite occurs only in solid culture, whereas
      the liquid Table 3 row includes it. No silent normalization or correction is applied.
  - source_ref: sanz_montero_2019
    supports: partial
    explanation: Figures 6-7 predominantly characterize Hmg and other associated phases, not a nesquehonite-specific
      cell-surface nucleation sequence. Proposed EPS binding, biomass decay, alkalinity changes and
      Mg dehydration are interpretations, not directly demonstrated molecular steps for nesquehonite.
      Modeled initial bulk undersaturation is not a cell-scale saturation measurement. Field mat-water-interface
      occurrences and isotope mixtures are distinct from this culture assay and do not prove LE1
      causes all natural nesquehonite. The source's stated nesquehonite H2O/Mg ratio of 2 conflicts
      with the total three waters in its formula and the current IMA formula; that ratio is not adopted.
      The modeled culture row in Table 1 uses pH 8.2, whereas the preparation method specifies initial
      pH 7.0; these are not silently treated as the same measured starting state.
  - source_ref: power_2007
    supports: partial
    explanation: In a different six-week laboratory experiment using filtered Atlin wetland water
      at room temperature with sunlight, the abiotic wetland-water control formed nesquehonite, whereas
      cyanobacterial enrichment biofilms formed dypingite and had no detected nesquehonite (Section
      4.3, Figure 5C and Table 2). Nutrient additions were not shown to be matched, and the organisms
      and water chemistry differ from LE1. This counterexample limits any claim that nesquehonite
      requires microbes or universally increases in their presence; it does not refute the narrower
      LE1 culture-associated phase observation.
