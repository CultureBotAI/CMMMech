id: cmmmech:diopside
name: Diopside
material_kind: mineral
description: Diopside is the pyroxene mineral species CaMgSi2O6, listed as approved with the literal 1988
  s.p. entry in the September 2026 IMA list. It is distinct from elemental magnesium or silicon, the pyroxene
  group, and mixed silicate rocks. The reviewed study used natural crystals with reported nonideal composition
  Ca0.99Mg0.98Fe0.02Cr0.01Si2O6 rather than an assumed pure synthetic end member. No constituent criticality
  designation is inherited.
