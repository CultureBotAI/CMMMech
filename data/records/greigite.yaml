  url: https://doi.org/10.1371/journal.pone.0201549
  accessed_on: '2026-10-11'
- id: gorlas2022
  title: Gorlas et al. (2022). Precipitation of greigite and pyrite induced by
    Thermococcales - an advantage to live in Fe- and S-rich environments?
    Environmental Microbiology 24(2), 626-642. Complete archived article,
