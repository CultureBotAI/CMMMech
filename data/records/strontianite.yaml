  evidence:
  - source_ref: natalio2024
    supports: support
    explanation: Experimental Section, Results and Discussion, Figure 3a-c middle panels and Figure 4a-b Sr panels support coating formation, diffraction-based strontianite assignment, carbonate spectroscopy and coating morphology. Reported coating mass is 36 +/- 3 mg by substrate mass difference, and SEM-derived thickness is 45 +/- 6 micrometres. These are coating measurements, not a pure SrCO3 mass balance or recovered-Sr yield. The 18 +/- 2 nm value is a Debye-Scherrer crystallite-size estimate, not a directly measured particle diameter. Calcium-polymer comparisons in Figures 1-2 and their growth curves are separate experiments and are not assigned to Sr.
  - source_ref: natalio2024_si
    supports: support
    explanation: Figure S4 on p. S7 shows washed and dried PLA surfaces after incubation without S. pasteurii but with the respective Ba, Sr or Mg supplementation and 333 mM urea; no coatings were observed. This is a no-cell comparison, not a matched-pH chemical precipitation or urease-inhibition control. Figures S1-S3 concern calcium carbonate and do not establish Sr-phase identity.
  - source_ref: natalio2024
    supports: partial
    explanation: The statement about finding no entrapped cells occurs in the calcium/polymer discussion and is not transferred to the Sr coating. Biomolecule deposition, epitaxy and polymer surface chemistry remain unresolved explanations for coating nucleation. No enzyme knockout, inhibition series or pH-matched cell-free phase comparison establishes the unique causal pathway. No solution-Sr mass balance, quantified phase purity, coating durability or industrial performance is reported. The printed 25 g/L dosing basis remains ambiguous. The Figure 3a caption gives a 0.375 micrometre scale bar for centimetre-scale coupons; the explicit coupon dimensions, not this inconsistent unit, are used here.
  - source_ref: natalio2024
    supports: partial
    explanation: 'Thermal interpretations are excluded from accepted transformation claims: the Experimental Section specifies heating to 800 degrees C, whereas Figure 4c-d and the discussion extend beyond 1000 degrees C. The discussion also invokes a rhombohedral-to-hexagonal transformation despite the diffraction assignment to orthorhombic strontianite. These internal inconsistencies limit the thermal interpretation without erasing the independently reported ambient-condition coating diffraction.'
