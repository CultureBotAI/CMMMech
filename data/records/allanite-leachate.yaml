  evidence:
  - source_ref: lu2026
    supports: support
    explanation: Figure 3b, Results and Precipitation test support dose-associated REE solution depletion by yeast-derived and commercial oxalate. Methods report centrifugation/filtration of precipitates and ICP-OES analysis, but the headline recovery is calculated from residual solution concentrations. The commercial comparator supports similar observed removal in this assay; n=1 does not establish statistical equivalence or replicated performance.
  - source_ref: lu2026_data1
    supports: partial
    explanation: Analysis sheets correct concentrations for cumulative reagent volume and sampling. Row 74 gives over 99% total-REE depletion in all three arms near their nominal 2.7 g/L doses. Dose formulas use a fixed 100 mL denominator even for the 95 mL biological arms; these values are not asserted as actual final reactor concentrations. TREE uses the source's 16-element sum, with Sc included among its light REEs. This is not a closed process mass balance.
  - source_ref: lu2026_data1
    supports: partial
    explanation: Raw feed rows include Th and U; their high-dose zero cells generate 100% apparent removal without stated per-cell detection or censoring limits. This raises possible co-retention, not proof of absence or product purity. Negative apparent removals, especially for Mg and the first biological-A total-REE point, remain source calculation limitations and are not clamped to zero. OAP-A row 74 reports Mn removal about 6.89%, contrary to the text's blanket less-than-6% statement for Ca, Mg, Mn and Zn. Missing cells are not interpreted as zeros. No universal high-purity mixed-REE product claim is made.
  - source_ref: lu2026_supplement
    supports: partial
    explanation: Table 1 and strain-construction methods identify engineered JL04. Figure S8 supplies the separate 22 g/L supernatant real-liquor arm. Table 3 and main Figure 3c identify Nd oxalate decahydrate in a synthetic single-Nd experiment; this does not identify the mixed real-liquor precipitate or establish its phase purity. Single-salt Nd/La/Dy assays are separate from the processed ore.
  - source_ref: lu2026_source_data
    supports: partial
    explanation: Fig.3a and 3b rows 17-28 and 34-45 reproduce the commercial and biological-A real-liquor curves; Fig. S1 to S8 rows 68-79 contain biological B. Fig.2 F11-F12 contain the two 10-day production titers, 38.78 and 40.27 g/L. The 42.70 g/L precipitation reagent is not one of those two values; its batch/time relationship to the displayed production series is not fully resolved and it is not substituted for the 39.53 g/L reported mean.
  - source_ref: lu2026
    supports: context_only
    explanation: Figure 4 and the TEA/LCA methods describe modeled large-scale oxalic-acid production, including assumed co-location and electricity credits. These projections are not demonstrated industrial operation, a validated life-cycle result for this particular leachate train or evidence of field deployment.
causal_graphs:
- id: engineered_kudriavzevii_jl04_oxalate_ree_precipitation_graph
  name: Engineered Issatchenkia orientalis (Pichia kudriavzevii) JL04 bio-oxalic acid biosynthesis and REE precipitation from allanite leachate
  description: Causal pathway for engineered Issatchenkia orientalis (Pichia kudriavzevii) strain JL04 in a two-step bioprocess where fed-batch glucose fermentation produces oxalic acid (19.0 g/L at 0.16 g/L/h) that selectively precipitates rare earth elements from acidic allanite leachate (Lu et al. 2026). Strain JL04 combines heterologous expression of Aspergillus niger oxaloacetate acetylhydrolase oahA (An10g00820; UniProtKB:A2QUT2) and the A. niger dicarboxylate-tricarboxylate carrier dtcA (An08g05400; UniProtKB:A2QPZ7) with overexpression of Saccharomyces cerevisiae pyruvate kinase PYK1 (CDC19; UniProtKB:P00549, selected over evaluated endogenous I. orientalis PYK1 JL09_g4285 / C5L36_0A06840, UniProtKB:A0A1V2LFH0) and endogenous I. orientalis pyruvate carboxylase PYC (JL09_g4901 / C5L36_0A02450; UniProtKB:A0A1V2LT98 in reference proteome UP000249293) plus deletion of endogenous glycerol-3-phosphate dehydrogenase GPD (JL09_g1506 / C5L36_0E02100; UniProtKB:A8W1U0 and reference-proteome
    UniProtKB:A0A2U9RB90).
