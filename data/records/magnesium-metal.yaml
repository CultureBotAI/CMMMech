id: cmmmech:magnesium-metal
name: Magnesium metal
material_kind: commodity
description: >-
  Magnesium in metallic commercial forms, considered as a raw-material commodity.
  The USGS separates the magnesium-metal market from magnesium compounds and
  describes primary and secondary metal production and its use in castings,
  alloy manufacture and metallurgical processing. This commodity is distinct
  from the magnesium element as a chemical identity, dissolved magnesium ions,
  magnesium-bearing minerals and magnesium compounds. Alloy and scrap statistics
  expressed as magnesium content do not make every alloy or waste stream
  synonymous with this commodity. The designation below preserves the original
  EU 2024 strategic-list wording; no universal purity threshold or microbial
  production, extraction or recovery mechanism is asserted.
