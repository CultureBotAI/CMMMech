    node_type: CELLULAR_STRUCTURE
    description: Packed column containing 3 g proprietarily granulated Cladosporium cladosporioides number 1 (NCBITaxon:29917) biomass beads sorbing silver from upward-flowing conditioned fixer (20 min retention time); bead viability, binder matrix fraction, and per-gram-biomass vs per-gram-beads uptake denominators are unresolved in the paper.
    protein_grounding_status: NOT_APPLICABLE
  - id: cyanide_eluted_electrowon_metallic_silver
    label: Abiotically eluted and electrowon metallic silver product (alcoholic cyanide eluent; 0.8 V, 224 mA; 127 mg Ag, 70% reported recovery)
    node_type: MATERIAL_OR_PHASE
    description: Metallic silver (127 mg, 70% reported overall recovery) recovered from loaded C. cladosporioides beads by abiotic alkaline alcoholic cyanide elution (1% ethanol in Section 2.5 vs 10% ethanol in Results) followed by electrowinning at 0.8 V and 224 mA, without independent phase-purity or full mass-balance reconciliation.
    protein_grounding_status: NOT_APPLICABLE
