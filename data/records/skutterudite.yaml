  evidence:
  - source_ref: johnson2020
    supports: support
    explanation: Sections 2.2-2.3 and 3.1, Table 1 and supplementary Figures S1-S2 identify skutterudite as the most abundant concentrate phase by XRD and SEM-EDX, with loellingite, minor silicates, trace cobaltite, bismuth arsenide, calcite and mixed-metal arsenate. Sparse nickelskutterudite grains were also identified. Table 1 reports 91.9 g/kg cobalt in the whole concentrate. These phase and elemental measurements support skutterudite-bearing mixed-feed identity, not an absolutely pure mineral or an initial refined phase mass balance.
  - source_ref: johnson2020
    supports: support
    explanation: 'Section 3.3, printed pages 4-5 and Figure 3, reports 49% of the concentrate cobalt solubilized after 16 days in experiment 4. This is a bulk-feed solution fraction; no isolated cobalt product or phase-specific cobalt balance is presented. Section 3.5 and section 2.6 describe culture-based enumeration with colony 16S identification: Acidithiobacillus thiooxidans and Sulfobacillus thermosulfidooxidans were significant viable members after 16 days. This differs from the genus-level sequencing of the separate Iron Mask ore and does not identify every organism or a strain-specific contribution in the Bou Azzer system.'
  - source_ref: johnson2020
    supports: partial
    explanation: Section 2.5 describes one Bou Azzer bioreactor trial, while Figure 3's caption refers ambiguously to replicate bioreactors and shows one series without replicate uncertainty. Biological replication is therefore unresolved; section 2.8's three ICP measurements per sample are analytical repeats. No matched uninoculated, killed-cell or abiotic leach control is described. The nonsterile concentrate and transferred screening leachate also limit attribution to the originally named inoculum. Ferric-mediated oxidation, sulfur-derived acidity and individual microbial roles remain proposed rather than separately isolated mechanisms in this assay.
  - source_ref: johnson2020_supplement
    supports: partial
    explanation: Supplementary Figure S1 retains skutterudite peaks in leached Bou Azzer material; S2 and S5 show mixed residual arsenides and new iron-arsenate precipitates. No complete skutterudite disappearance or mineral-specific conversion fraction is demonstrated. The supplementary XRD labels use Bou Azzer experiment 1/2, whereas the main methods number its reactor/flask experiments 4/5; this numbering mismatch limits exact label-level crosswalks and is not treated as proof of an additional independent experiment.
  - source_ref: johnson2020
    supports: support
    explanation: Section 2.5 experiment 5 pre-established an active culture with 5% w/v sterile pyrite and 5 mM ferrous sulfate for five days before adding 1% w/v nonsterile concentrate. Sections 3.3-3.4 and Figures 4-7 identify scorodite in the final flask residue using XRD, FTIR and SEM-EDX; it was not identified in the original concentrate or non-pyrite reactor residue by those analyses. The original trace Co-Ni-Ca-rich arsenate was compositionally distinguished from the new iron arsenate, also illustrated in supplementary Figure S5. This is concurrent secondary precipitation during mixed-feed processing, not a separate replication or a purified product yield.
  - source_ref: johnson2020
    supports: partial
    explanation: The pyrite flask and non-pyrite reactor differ in geometry, conditioning and operating conditions, so they do not isolate a pyrite treatment effect. The specific preconditioning recipe does not separately state a zero-valent-sulfur dose. Soluble arsenic and iron decline during the flask experiment, and iron can also derive from added pyrite; the authors therefore cannot calculate total cumulative leaching accurately. Discussion and Figures 8-9 infer arsenic oxidation states from redox chemistry and propose pyrite's catalytic, nucleation and iron-supply roles. Leachate As(III)/As(V) was not directly measured; the separate arsenite/arsenate titration is not a matched leach control. Scorodite stability, detoxification, isolated-metal recovery and industrial deployment were not tested.
