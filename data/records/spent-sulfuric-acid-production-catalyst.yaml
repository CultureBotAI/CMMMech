  evidence:
  - source_ref: mikoda_2020
    supports: support
    explanation: Results 3.2, Figure 7 and Perspectives 3.3 assign day-21 liquid V release of 93% to 1% pulp density and 85.5% to 2%, versus at most 17% in the corresponding uninoculated series. These source percentages normalize filtered-liquid V to the initial feed V inventory; they are not isolated product yields. Lower culture pH and increasing sulfate in Figure 9 support culture-associated acidification, without separating the effects of cells from their evolving solution chemistry.
  - source_ref: mikoda_2020
    supports: partial
    explanation: The abstract instead attributes 93% to 2% pulp density. Results 3.2 also labels both day-28 values, 80% and 74%, as 1%, while Figure 7 distinguishes the two arms. These inconsistencies remain unresolved. The low-loading liquid V inventory declined after day 21. At 5-20% pulp density, Figure 8 shows decreasing liquid V with controls often exceeding inoculated arms; no universal microbial advantage or monotonic extraction is established. Oxygen-transfer limitation and precipitation are proposed explanations, not independently isolated causes.
  - source_ref: mikoda_2020_supplement
    supports: partial
    explanation: Figures S2-S3 show a qualitative sulfur-settling transfer assay and changing solution color. These are activity/speciation clues, not cell counts, quantified survival, or direct measurement of V oxidation state. Figure S1's sieve description conflicts with main Methods. The observed colors cannot independently establish a microbial V(V)-reduction pathway.
  - source_ref: mikoda_2020
    supports: partial
    explanation: Figures 1-2 and Table 3 describe mixed feed and residual phases; disappearance of XRD peaks and lower residual-solid V concentration do not supply residue mass or a complete V balance. Color and the pH/Eh comparison in Figure 6 do not directly identify dissolved V species. Kinetic fits use selected incomplete time series to improve R-squared values (Methods 2.5), so they do not demonstrate a unique rate-controlling mechanism. Separate reagent-grade citric-acid leaching is abiotic, under different temperature, duration and vessel conditions; it is not evidence that DSM 9463 produced citrate.
  - source_ref: mikoda_residues
    supports: context_only
    explanation: This related same-group study explicitly follows the earlier work and repeats its raw/residue oxide compositions. Its 2%-pulp-density 93% claim does not resolve the earlier arm conflict or establish independent replication. The approximately 96% statement compares solid V concentrations, without residue-mass accounting for a recovered yield. The separate SPLP assay (1 g residue, 20 mL pH-4.2 solution, 18 hours) reports bioleached-residue V and Al of 6.4 and 4.8 mg/L in Table 3; residual leachability remains. These observations do not demonstrate a metal-free or universally safe residue, a regulatory determination, validated concrete use, or a recovered vanadium product.
