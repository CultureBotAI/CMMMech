  support: supports
  summary: 'Living Thiobacillus ferrooxidans FC1, using the paper''s historical name, increased zinc dissolution
    relative to matched chemical controls at elevated ferrous concentrations after an initial period without
    an advantage. Surface analyses and kinetic modeling support sulfur-layer removal as the explanation;
    they do not establish a specific enzyme or direct biological oxidation of the ZnS lattice. Substrate-edge
    evidence (fowler_crundwell_1999, supports: partial): Fowler and Crundwell (1999) held Fe(III) constant
    at 1 g/L electrochemically (rather than relying on culture-generated Fe(III) accumulation) and showed
    that A. ferrooxidans FC1 enhances sphalerite dissolution at 4 and 8 g/L Fe(II) after 8–12 h via removal
    of the surface sulfur layer, whereas Fowler and Crundwell (1998) found no bacterial enhancement at
    1 g/L Fe(II). Product-edge evidence (fowler_crundwell_1999, supports: support): Atomic spectrophotometry
    filtrate Zn time series and surface sulfur analyses in Fowler and Crundwell (1999) Figures 2–6 confirm
    increased Zn dissolution and lower surface elemental sulfur in inoculated runs at 4 and 8 g/L Fe(II)
    relative to sterile controls.'
