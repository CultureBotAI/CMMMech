id: cmmmech:holmium
name: Holmium
material_kind: element
description: >-
  The element Ho, distinct from its dissolved ions, experimental nitrate salt, host minerals
  and manufactured materials. The dated US designation concerns the named holmium mineral
  commodity, without transferring criticality to every Ho-bearing substance. The curated laboratory
  experiment documents element in harvested cyanobacterial biomass, not a resolved uptake
  pathway, purified metal recovery or industrial deployment.
