id: cmmmech:margaritasite
name: Margaritasite
material_kind: mineral
description: 'Hydrated cesium-uranyl divanadate mineral of the carnotite group with current
  September 2026 IMA-CNMNC approved formula Cs2(UO2)2(VO4)2·H2O (structural formula Cs2(UO2)2V2O8·H2O),
  status A, and approval number IMA 1980-093. Wenrich, Modreski, Zielinski, and Seeley (1982)
  described the type specimen (deposited at the U.S. National Museum of Natural History, Smithsonian
  Institution, Washington, D.C.) from the Margaritas uranium-molybdenum deposit (site 19 and
  drill hole #33), Sierra Pena Blanca Uranium District, Chihuahua, Mexico, where it occurs
  as 1-3 um yellow tabular plates filling matrix pores and lining leached phenocryst molds
  in altered Oligocene rhyodacitic tuff breccia of the lower Escuadra Formation alongside
  quartz, feldspar, kaolinite, pyrite, and barite. ARL-SEMQ electron-microprobe analysis of
  14 grains (Table 4, p. 1282) yielded an anhydrous mean of UO3 55.4, Cs2O 17.6, V2O5 17.0,
  K2O 1.63, Ca 0.33, Ba 0.19, Si 0.14, Sr 0.07, Al 0.02, sum 91.63 wt% (recalculated with
  2.5 wt% H2O to 100%: UO3 58.9, Cs2O 18.7, V2O5 18.1, K2O 1.73 wt%), while AAS, ICAP-AES,
  and CHN wet-chemical analysis of three ultrasonic-concentrated splits (containing ~11 wt%
  admixed quartz, Table 4) yielded UO3 49.6, Cs2O 17.0, V2O5 15.9, H2O 2.5, K2O 1.20 wt% (recalculated
  quartz-free to 100%: UO3 57.5, Cs2O 19.7, V2O5 18.4, H2O 2.9, K2O 1.39 wt%), corresponding
  to the empirical formula (Cs1.38(H3O)0.35K0.29)Sigma2.02(UO2)1.99(V2O8)1.00·1.07H2O. X-ray
  powder diffraction (Tables 2-3, pp. 1279-1280) refined in monoclinic space group P21/a (Z
  = 2) gave a = 10.514(3), b = 8.425(3), c = 7.252(5) A (7.25 A in abstract), beta = 106.01
  degrees, V = 617.48(44) A3, and Dcalc = 5.41 g/cm3 (5.40 g/cm3 in Table 3; biaxial negative,
  nalpha ~ 1.797 calc, nbeta = 1.925-1.930, ngamma = 1.945-1.950, 2V = 42(5) degrees). Hydrothermal
  CsCl ion-exchange experiments at 200 degrees C converted natural carnotite into margaritasite.
  Distinct from carnotite (K2(UO2)2(VO4)2·3H2O), tyuyamunite, sengierite, and elemental cesium,
  vanadium, or uranium; no criticality designation, microbial mechanism, or industrial recovery
  yield is asserted.'
