      niger (NCBITaxon:5061).
    evidence:
    - source_ref: frank2021
      supports: partial
      explanation: Representative Aspergillus niger citrate exporter CexA for organic-acid excretion during
        transformation of Secondary malachite-bearing weathered copper ore into Transient wheatleyite
        (Na2Cu(C2O4)2·2H2O) and moolooite crystals; CexA was not directly mutated in frank2021.
