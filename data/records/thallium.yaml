id: cmmmech:thallium
name: Thallium
material_kind: element
description: Thallium (Tl) is an element. Its neutral-atom identifier does not denote dissolved Tl(I),
  a thallium mineral or a secondary resource. The curated laboratory study concerns release of aqueous
  thallium from a synthetic, nonideal Tl(I)-bearing jarosite during bacterial ferric-iron reduction. No
  criticality designation or industrial recovery is inferred.
