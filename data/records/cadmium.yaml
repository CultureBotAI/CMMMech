    - InterPro:IPR050214
    - InterPro:IPR001926
    - InterPro:IPR036052
    pfam_ids:
    - Pfam:PF00291
    go_terms:
    - id: GO:0005737
      label: cytoplasm
    - id: GO:0004124
      label: cysteine synthase activity
    - id: GO:0030170
      label: pyridoxal phosphate binding
    - id: GO:0019448
      label: L-cysteine catabolic process
    functional_role: Pyridoxal-phosphate-dependent L-cysteine desulfhydrase Cds1 (EC 4.4.1.1) catalyzing catabolic desulfhydration of L-cysteine to hydrogen sulfide (H2S), pyruvate, and ammonia.
    annotation_note: Grounded to Klebsiella planticola (NCBITaxon:575) reference proteome UP001293169 entry UniProtKB:A0A2X2E5R3 (cds1), representing endogenous amino-acid/cysteine-derived H2S production during anaerobic growth of strain Cd-1 in unamended medium (without added thiosulfate) in Sharma et al. (2000). This unreviewed TrEMBL entry carries specific EC:4.4.1.1 and GO:0019448 (L-cysteine catabolic process) annotations alongside automated GO:0004124 (cysteine synthase activity) projected from its shared PALP (Pfam:PF00291 / InterPro:IPR001926) pyridoxal-phosphate-dependent enzyme fold.
    evidence:
    - source_ref: sharma_2000
      supports: partial
      explanation: Sharma et al. (2000) characterized washed, freeze-dried late-stationary biomass from anaerobic 5 mM CdCl2 synthetic medium without added thiosulfate by S-XANES and Cd-EXAFS (Figures 2-3), demonstrating Cd-S coordination alongside residual Cd-O ligands, without isolating individual desulfhydrase enzymes.
    - source_ref: uniprot_klebsiella_planticola_sulfur
      supports: partial
      explanation: UniProtKB:A0A2X2E5R3 (A0A2X2E5R3_KLEPL, cds1) in Klebsiella planticola reference proteome UP001293169 (NCBITaxon:575) encodes L-cysteine desulfhydrase Cds1 (EC 4.4.1.1; GO:0019448 L-cysteine catabolic process) as a species-level reference-proteome proxy for isolate Cd-1.
