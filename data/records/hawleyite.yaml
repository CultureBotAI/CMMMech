id: cmmmech:hawleyite
name: Hawleyite
material_kind: mineral
description: Hawleyite is the cubic CdS mineral species, distinct from hexagonal greenockite, unspecified cadmium-sulfide nanoparticles, elemental cadmium and secondary wastes. The September 2026 IMA-CNMNC list gives grandfathered status and original-description year 1955; that year is not a unique approval accession. Curated microbial evidence concerns synthetic hawleyite-assigned particles and mixed CdS from a defined X513 experiment. Mineral identity does not make every Cd-S precipitate hawleyite. No constituent criticality designation is inherited.
sources:
- id: ima_2026_09
  title: 'IMA-CNMNC (September 2026). The New IMA List of Minerals. Definitions p.1; Hawleyite row p.90: CdS, G (grandfathered), original-description year 1955.'
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: handbook
  title: Handbook of Mineralogy. Hawleyite. Mineral Data Publishing version 1 (2001–2005); complete one-page identity/structure entry. Historical secondary context, not microbial evidence.
  url: https://www.handbookofmineralogy.org/pdfs/hawleyite.pdf
  accessed_on: '2026-10-14'
- id: handbook_greenockite
  title: Handbook of Mineralogy. Greenockite. Mineral Data Publishing version 1 (2001–2005), Cell Data; secondary structural context for checking Moon2013 lattice labels.
  url: https://www.handbookofmineralogy.org/pdfs/greenockite.pdf
  accessed_on: '2026-10-14'
- id: moon2013
  title: Moon, J.-W. et al. (2013). Scalable economic extracellular synthesis of CdS nanostructured particles by a non-pathogenic thermophile. Journal of Industrial Microbiology and Biotechnology 40(11):1263–1271. DOI 10.1007/s10295-013-1321-3. Complete publisher HTML, Materials and methods, Results, Figures 1–6 and Table 1.
  url: https://doi.org/10.1007/s10295-013-1321-3
  accessed_on: '2026-10-14'
- id: taxonomy_x513
  title: NCBI Taxonomy 573062 — Thermoanaerobacter sp. X513; species-rank X513-labelled entry. Thermoanaerobacter ethanolicus X513 is listed as a misspelling.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=573062&mode=Info
  accessed_on: '2026-10-14'
mechanisms:
- id: x513_cds_formation
  name: X513-associated formation of a hawleyite-assigned CdS component
  process: biomineralization
  description: 'Thermoanaerobacter sp. X513 cultures formed synthetic CdS with a cubic hawleyite-assigned component. In the thiosulfate time course, the initial cubic product was followed by a cubic/hexagonal mixture, while the displayed cysteine preparation was assigned only to the cubic phase. Sulfide generation by the culture and precipitation from cadmium salts are distinguished from a claim of unique biological mineral formation: the separate inorganic sulfide reference also formed cubic CdS.'
  context: 'Moon2013 Materials and methods, Synthesis of CdS NP, and Results, Mechanism of CdS NP formation: the displayed experiments used Thermoanaerobacter sp. X513, not the separately mentioned TOR-39. Anaerobic modified TOR-39 medium at 65 degrees C contained 10 mM glucose, 10 mM thiosulfate or sulfite and normally 2% by volume mid-log culture. Bicarbonate was kept low to limit otavite, but the complete modified medium recipe is not reproduced. The duplicate 10-mL time course used 24 h pre-growth with thiosulfate, then 0.4 mM CdCl2 per day for ten days, sampling from 5 min through 240 h after dosing began. Separate phase comparisons used total nominal Cd doses of 4.45 or 8.90 mM over ten days. These are supplied soluble cadmium salts, not leaching of natural CdS ore. General methods add 24 h after the final dose before harvest; this is not substituted for the explicitly sampled time-course endpoints. XRD samples were repeatedly washed/centrifuged, with cell pellets scraped off, then
    mixed with methanol on a silicon plate. Some suspensions received dithionite during preparation/storage. Live cells are present during production, but washing does not prove a sterile product. NCBITaxon:573062 is the X513-labelled entry at species rank, not a general species-level claim about all Thermoanaerobacter or an authentication assay on this experimental culture.'
  microbial: true
  organisms:
  - id: NCBITaxon:573062
    label: Thermoanaerobacter sp. X513
  evidence:
  - source_ref: moon2013
    supports: support
    explanation: Results, Effect of microbes and sulfur sources, and Figure 1 show XRD patterns plus HRTEM/FFT compatible with cubic hawleyite. The thiosulfate/sulfite products also contain greenockite, whereas the displayed cysteine product and G20-sulfate and sodium-sulfide reference preparations are reported as cubic. Figure 4 and the time-course text describe an initial cubic product followed by a mixture as incubation and dosing continue. Cysteine concentration and the full G20 comparison protocol are not supplied in the main methods, so those comparisons are contextual rather than fully reconstructed independent culture assays. This is the same original experiment represented under greenockite, not a second biological replication.
  - source_ref: moon2013
    supports: partial
    explanation: Materials and methods and Figures 2–3 distinguish an abiotic medium comparison from the separate Cd-salt plus sodium-sulfide reference, which can itself produce cubic CdS. The no-microbe thiosulfate/sulfite controls showed negligible precipitation; the control-method sentence also says the same medium was incubated with X513 for 24 h, leaving preparation/conditioning wording ambiguous. In the room-temperature comparison, 24-h pristine and two-hour-autoclaved cultures gave fluorescence, while 0.2-micrometre filtration removed most protein and roughly half the sulfide. Thus filtration is not a sulfide-matched test of cell-surface catalysis. Dead biomass can support the optical signal; the proposed nucleation role is not an identified enzyme, a uniquely proven pathway, or proof that live metabolism is required at the moment of precipitation.
  - source_ref: moon2013
    supports: partial
    explanation: Characterization and Figure 4 use profile fitting without structural parameters, reference-intensity-ratio semi-quantification, and Scherrer crystallite sizes. They do not provide a structural refinement, raw diffraction dataset or a phase-specific isolated recovery balance. TEM object sizes exceed XRD coherent-domain estimates; the source interprets aggregation, so a universal sub-10-nm particle diameter is not adopted. The prose assigns 0.672 nm to greenockite (002), whereas the Handbook c value 0.6713 nm implies d002 about 0.3357 nm; the printed 28.1-degree (102) assignment is also not treated as an independently validated index. These unresolved labels limit detailed crystallographic interpretation without erasing the broader mixed-phase XRD/FFT observation.
  - source_ref: handbook
    supports: context_only
    explanation: The structure entry establishes cubic hawleyite and its distinction from hexagonal greenockite. It is identity context, not another biosynthesis experiment.
  - source_ref: handbook_greenockite
    supports: context_only
    explanation: Greenockite Cell Data gives c = 6.713 angstrom, permitting the stated check of Moon2013 printed (002) spacing. This secondary structural reference does not independently validate the microbial product.
  - source_ref: moon2013
    supports: partial
    explanation: Table 1 and the scale-up section describe washed, freeze-dried mixed CdS material and tests from 10 mL to two parallel 24-L reactors. The 1-L yield and conversion values concern bulk CdS nanoparticles, not either pure polymorph; reported conversion is not accompanied by a closed dissolved/solid cadmium balance or a detailed analytical calculation. Similar fluorescence across volumes does not establish identical phase fractions or phase purity at every scale. These are controlled experimental scale-up demonstrations, not industrial deployment, an independently audited cost comparison, or recovered elemental cadmium. The source conclusion calls the process near room temperature, but synthesis methods specify 65 degrees C; only the separate nucleation comparison is explicitly at room temperature.
