    material_form: Vanadium-bearing electrolyte. ICP-OES measures total elemental V; the atom identifier
      grounds the element, not neutral atoms in solution or an oxidation-state measurement.
    sampled_fraction: Working-chamber solution filtered at 0.22 micrometres before preservation in 1%
      nitric acid.
    study_arm: abiotic
    result_status: measured
    value: 19.1
    unit: mg/kg
    analyzed_on: '2025-07-03'
    sampled_on: '2025-05-15'
    sampling_source_locator: T2_pH.csv; SampleID=BESVarr_0; Date column
    context: Post-equilibration baseline of the abiotic V run. The concentration differs from the biotic
      run's baseline; these source cells do not define a matched microbial-effect estimate.
  - id: v_abiotic_endpoint
    source_ref: kane_2026_bes
    source_table: T3_AqueousICPOES.csv
    source_sample_id: BESVarr_END
    source_column: V_ppm
    raw_value: '12.2'
    analyte:
      id: CHEBI:27698
      label: vanadium atom
    material_form: Vanadium-bearing electrolyte. ICP-OES measures total elemental V; the atom identifier
      grounds the element, not neutral atoms in solution or an oxidation-state measurement.
    sampled_fraction: Working-chamber solution filtered at 0.22 micrometres before preservation in 1%
      nitric acid.
    study_arm: abiotic
    result_status: measured
    value: 12.2
    unit: mg/kg
    analyzed_on: '2025-07-03'
    sampled_on: '2025-05-21'
    sampling_source_locator: T2_pH.csv; SampleID=BESVarr_END; Date column
    context: Abiotic-run endpoint. Its run duration and pH history differ from the biotic run. This concentration
      cell preserves the abiotic comparison without assigning statistical replication, normalized recovery
      yield or a causal microbial effect.
