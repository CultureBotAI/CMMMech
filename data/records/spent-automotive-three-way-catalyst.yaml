id: cmmmech:spent-automotive-three-way-catalyst
name: Spent automotive three-way catalyst
material_kind: secondary_resource
description: Used automotive three-way catalytic-converter material, represented here by a real vehicle-treatment-centre
  catalyst containing a ceramic support and metal-bearing coating. This use-defined secondary resource
  is distinct from its constituent platinum-group elements, fresh catalyst, refinery hydrocracking or
  hydrodesulfurization catalysts, and automotive wastewater-treatment sludge. The selected cryomilled
  feed does not define every converter formulation. No constituent criticality designation is inherited.
