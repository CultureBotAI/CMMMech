    interpro_ids:
    - InterPro:IPR026045
    - InterPro:IPR006059
    - InterPro:IPR006061
    pfam_ids:
    - Pfam:PF01547
    functional_role: Reference-proteome periplasmic ferric-ion-binding protein FbpA (fbpA / NGO_0217, 100% sequence-identical 331-aa precursor to UniProtKB:Q50964) that binds oxo-bridged polynuclear Hf(IV) clusters within its interdomain metal-binding cleft in vitro.
    annotation_note: Grounded to the Neisseria gonorrhoeae FA 1090 reference-proteome entry UniProtKB:Q5FA17 (UP000000535, NCBITaxon:242231; locus NGO_0217), which shares an identical 331-amino-acid sequence with species-level UniProtKB:Q50964 (NCBITaxon:485).
    evidence:
    - source_ref: alexeev_2003
      supports: partial
      explanation: Alexeev et al. (2003) prepared apo-nFbp with citrate and reacted it with [Hf(NTA)2]2- in 10 mM Tris (pH 7.4) to form a 1.8-A crystal structure of an oxo-bridged multinuclear Hf cluster coordinated by Tyr195 and Tyr196; residue necessity was not tested by mutagenesis.
  evidence:
  - source_ref: alexeev_2003
    supports: support
    explanation: Table 1 and Methods establish retention of Hf with purified apo nFbp. Figures 1-3 and Table 2 resolve differently ordered three- and five-Hf clusters across nine protein molecules in the crystal, with phosphate present in some clusters. Anomalous diffraction supports assignment of the heavy atoms to Hf. These are molecular clusters, not proof of a bulk HfO2 mineral product.
  - source_ref: alexeev_2003
    supports: partial
    explanation: The structural comparison and single-metal holo/apo preparations support binding-site interpretation, but no Hf-specific Tyr-mutant result or matched protein-free cluster-formation outcome is reported. References to loss of iron binding in Tyr mutants do not establish Hf-specific necessity. Some Hf positions are disordered, twinning complicated refinement, and HfO2 geometry supplied refinement restraints. The paper's crystal preparation reports 4.8 Hf per protein whereas its initial feed is stated as four equivalents; these distinct reported quantities are retained without deriving a recovery fraction or resolving the discrepancy.
  - source_ref: pdb_1o7t
    supports: context_only
    explanation: The deposited entry links the same DOI, bacterial protein and Hf cluster components; its current revision history records 2026 metalloprotein remediation involving nonpolymer descriptions and derived coordination information. It is associated structural evidence from the same experiment, not an independent replication or a new microbial extraction study. No coordinate re-refinement or validation of all atomic assignments was performed in curation.
