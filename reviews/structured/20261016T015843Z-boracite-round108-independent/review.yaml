assessments:
- assessment_id: identity
  area: identity
  topic: Species and natural specimens
  outcome: supported
  summary: Current IMA and the original distinguish Mg-rich natural boracite from
    trembathite/congolite. EB is an England specimen of unknown exact locality; S4A/S4B
    are CMN F93-20-4 from New Brunswick evaporites. The museum number is source provenance,
    not an independently verified controlled identifier.
  target_ids:
  - cmmmech:boracite
  evidence_ids:
  - record
  - ima
  - primary
- assessment_id: chemistry
  area: evidence
  topic: Measured versus calculated chemistry
  outcome: supported
  summary: Table 2 uses electron-probe Mg/Fe/Mn/Cl analyses, stoichiometric B2O3 and
    normalization of Mg+Fe+Mn to three. The record retains the 105.39 wt% EB analytical
    total and does not portray calculated boron as an assay. The summary composition
    (Mg2.83Fe0.17)B7O13Cl is reported for the natural EB arm.
  target_ids:
  - cmmmech:boracite
  evidence_ids:
  - record
  - primary
- assessment_id: conditions
  area: evidence
  topic: Distinct optical and diffraction measurements
  outcome: supported
  summary: Approximately 30-micrometre optical sections on a Linkam stage have a stated
    2 °C calibration uncertainty. Separate ground-powder/Si/Pt-strip measurements
    have 10 °C temperature uncertainty and about three-hour scans. Table 3 values
    272±5, 287±3 and 283±2 °C are onset/completion ranges associated with zoning,
    not replicate errors or diffraction calibration uncertainties. Unreported heating
    rate and atmosphere remain unspecified.
  target_ids:
  - cmmmech:boracite
  evidence_ids:
  - record
  - primary
- assessment_id: outcome
  area: evidence
  topic: Solid-state transition rather than extraction
  outcome: supported
  summary: Optical symmetry change and powder unit-cell discontinuities support the
    orthorhombic/cubic transition. Approximate 0.12% EB and 0.06% S4A cell-volume
    increases on cooling are faithfully attributed and are not boron recovery fractions.
    Warm-water host-halite removal was preparation, not an extraction assay.
  target_ids:
  - cmmmech:boracite
  evidence_ids:
  - record
  - primary
- assessment_id: conflicts
  area: consistency
  topic: Model and broader-series limits
  outcome: supported
  summary: Cubic constraints on low-symmetry powder fits, unresolved alternative Landau
    expansions and imperfect agreement of the Fe-rich trend with optical evidence
    remain explicit. The previous-study 264 °C synthetic value and Fe-rich species
    observations are not relabelled as new natural boracite results.
  target_ids:
  - cmmmech:boracite
  evidence_ids:
  - record
  - primary
- assessment_id: scope
  area: scope
  topic: No inherited criticality or biological deployment
  outcome: supported
  summary: The record asserts an abiotic laboratory transformation only. It assigns
