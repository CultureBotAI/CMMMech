id: cmmmech:uranium
name: Uranium
material_kind: element
description: >-
  Uranium (U), represented here as an element distinct from the dissolved
  U(VI) feed and electrode-associated material in a laboratory
  bioelectrochemical separation study. The United States 2025 designation
  applies to the named uranium commodity; it does not identify a uranium
  mineral species or establish the criticality of every uranium compound.
