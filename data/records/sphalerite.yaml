      Environmental Microbiology 64:3570-3575.
      DOI 10.1128/AEM.64.10.3570-3575.1998. Methods; Figures 4-6; Discussion.
    url: https://doi.org/10.1128/AEM.64.10.3570-3575.1998
    accessed_on: '2026-10-11'
