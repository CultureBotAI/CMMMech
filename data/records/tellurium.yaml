    functional_role: Pyridine nucleotide-disulfide oxidoreductase family thioredoxin reductase (ORF RAJCM14343_5433; EC 1.8.1.9) representing intracellular thiol/NAD(P)H-coupled redox systems associated with tellurite reduction in Rhodococcus aetherivorans.
    annotation_note: Grounded to Rhodococcus aetherivorans reference proteome UP000325466 (NCBITaxon:191292; ORF RAJCM14343_5433) as a species-level representative for strain BCP1 (DSM 44980).
    evidence:
    - source_ref: presentato_2018
      supports: partial
      explanation: Presentato et al. (2018) demonstrate resting-cell transformation of K2TeO3/tellurite into intracellular trigonal Te(0) nanorods by Rhodococcus aetherivorans BCP1 (DSM 44980) in 50 mL PBS (pH 7.4, 30 degrees C, 150 rpm, 0.5-16 h), but do not genetically or biochemically isolate a specific tellurite reductase.
  - uniprot_accession: UniProtKB:A0ABQ0YU44
    entry_name: A0ABQ0YU44_9NOCA
    protein_name: Catalase-peroxidase
    gene_symbol: katG
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:191292
      label: Rhodococcus aetherivorans
    reference_proteome_id: UP000325466
    ec_numbers:
    - EC:1.11.1.21
    interpro_ids:
    - InterPro:IPR000763
    - InterPro:IPR002016
    - InterPro:IPR010255
    - InterPro:IPR019794
    - InterPro:IPR019793
    pfam_ids:
    - Pfam:PF00141
    functional_role: Bifunctional catalase-peroxidase KatG (katG / ORF RAJCM14343_5444; EC 1.11.1.21) representing oxidative-stress defense and putative NAD(P)H-coupled oxyanion-reduction capacity in Rhodococcus aetherivorans.
    annotation_note: Grounded to Rhodococcus aetherivorans reference proteome UP000325466 (NCBITaxon:191292; katG / ORF RAJCM14343_5444) as a species-level representative for strain BCP1 (DSM 44980).
    evidence:
    - source_ref: presentato_2018
      supports: partial
      explanation: Representative Rhodococcus aetherivorans oxidative-stress/redox enzyme (katG); Presentato et al. (2018) characterized resting-cell tellurite depletion and intracellular Te nanorod assembly in strain BCP1 without mutating katG or purifying a tellurite reductase.
  evidence:
  - source_ref: presentato_2018
    supports: support
    explanation: 'Figures 1-3 and 5 support solution depletion, intracellular nanostructures, and trigonal-Te diffraction. Figure 1 uses three biological replicates. At 16 h the higher nominal doses showed partial removal: 42 +/- 3% (500) and 28 +/- 4% (1000), not complete conversion. These are reported removal percentages, not recovery yields.'
  - source_ref: presentato_2018_supplement
    supports: support
    explanation: Supplementary methods and Figure S1 caption specify PBS-only and autoclaved-biomass controls at the highest loading; the main text reports no abiotic removal. The assay measures supernatant tellurite by diethyldithiocarbamate absorbance at 340 nm, calibrated with K2TeO3 in PBS. No analytical detection limit is given; apparent complete depletion at the lowest dose cannot establish literal zero.
  - source_ref: presentato_2018
    supports: partial
    explanation: Figure 7 proposes nanorod assembly assisted by amphiphilic biomolecules. The paper does not identify a necessary tellurite reductase or measure an isolated elemental-tellurium mass yield.
