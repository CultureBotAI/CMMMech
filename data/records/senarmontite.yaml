id: cmmmech:senarmontite
name: Senarmontite
material_kind: mineral
description: Senarmontite is the cubic Sb2O3 mineral species, distinct from
  orthorhombic valentinite, mixed-valence antimony oxides, elemental antimony
  and stibnite. The September 2026 IMA list records status Rn (renamed) and
  year 1851. The observations below concern laboratory precipitates formed
  from dissolved potassium antimony(III) tartrate, not extraction of natural
  senarmontite ore or isolated antimony recovery. No criticality designation
  is inherited from the constituent element.
