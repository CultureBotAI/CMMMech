  evidence:
  - source_ref: smeaton2012_chapter2
    supports: support
    explanation: Chapter 2 sections 2.2-2.3 and Figure 2.1 show ferrous iron increasing in inoculated mineral tubes, while sterile mineral controls remain near baseline. The text reports about 197 micromolar Fe(II) at the nominal 768-hour endpoint. Filtered lead peaks early and later falls below the stated 0.09 micromolar instrumental detection limit; this is not zero lead or an extraction percentage. Figure 2.1 error bars are standard errors for three mineral tubes. All tubes share the same inoculum preparation, not three independently prepared cultures.
  - source_ref: smeaton2009_si
    supports: partial
    explanation: SI S2-S3 and Tables S1-S4 constrain interpretation. PIPES masks sulfur release, so sulfate was not an independent dissolution measure. Acidified filtrate may include iron-bearing colloids; saturation indices predict possible secondary phases but do not identify precipitates. Final Table S3 Fe(III) is 1.90 micromolar whereas the chapter text gives 12.4 at a differently labeled endpoint. Methods use 192/408/768 hours while prose also uses 198/400/776; these conflicts are not silently harmonized. Table S3 zero lead is a modeling input in a below-detection context, not a measured absence.
  - source_ref: smeaton2012_chapter2
    supports: partial
    explanation: Figures 2.2-2.3, sections 2.3.2-2.3.3 and supporting microscopy show cell-associated electron-dense material and Pb-enriched granules within prepared cell cross sections. Intracellular phosphate precipitation and ATPase-mediated detoxification are author interpretations; no gene-expression or perturbation experiment establishes them. Viability is an ATP-luminescence proxy, not a direct viable-cell count, and the prose time/value assignments conflict with the plotted series. Neither these images nor aqueous depletion provide a complete solid/liquid lead balance.
  - source_ref: smeaton2009_si
    supports: partial
    explanation: SI S5 explicitly uses 0.1 M phosphate-buffered glutaraldehyde and osmium fixation before TEM. Thus phosphorus in prepared granules alone cannot establish its intracellular metabolic origin or rule out preparation effects; no phosphate-free fixation comparator is reported. Near-immediate SEM supports cell-associated particles before TEM processing, but does not settle their intracellular chemistry. Table S5 spot compositions are local EDS measurements, with non-normalized totals in some cellular spots; they are not bulk mineral stoichiometry. Figures S2-S3 show secondary precipitates in both sterile and inoculated arms; modeled magnetite/green-rust phases and hypothetical ATPase roles remain unconfirmed. This is a qualified laboratory observation, not industrial deployment.
