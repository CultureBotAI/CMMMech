id: cmmmech:kornelite
name: Kornelite
material_kind: mineral
description: Kornelite is a monoclinic ferric sulfate mineral, represented in the September 2026 IMA list as Fe(III)2(SO4)3(H2O)6·1.75H2O. Its additional channel water is variable; historical seven-water formulae are not exact hydration measurements for every specimen. This species is distinct from paracoquimbite, ferricopiapite and undifferentiated ferric-sulfate salts. The evidence below separates abiotic synthesis of a characterized crystalline product from provisional diffraction assignments in mixed bacterial-culture solids. Neither experiment establishes a recovered iron product from ore or waste, industrial deployment or a criticality designation.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026; Kornelite row on PDF page 115 and field definitions on pages 1-2. Fe3+2(SO4)3(H2O)6·1.75H2O; G denotes grandfathered species, and 1888 is an original-description year, not an approval accession.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-15'
- id: handbook_kornelite
  title: Handbook of Mineralogy. Kornelite, version 1 (2001-2005), complete one-page entry; monoclinic P21/n and historical Fe3+2(SO4)3·7-8H2O formula range.
  url: https://handbookofmineralogy.org/pdfs/kornelite.pdf
  accessed_on: '2026-10-15'
- id: ackermann2009
  title: Ackermann, S., Lazic, B., Armbruster, T., Doyle, S., Grevel, K.-D. and Majzlan, J. (2009). Thermodynamic and crystallographic properties of kornelite [Fe2(SO4)3·~7.75H2O] and paracoquimbite [Fe2(SO4)3·9H2O]. American Mineralogist 94, 1620-1628. DOI 10.2138/am.2009.3179. Complete nine-page original; synthesis and Table 1 page 1621, Figure 1a and composition page 1622, hydration/refinement pages 1622-1625, model limits pages 1626-1627.
  url: https://doi.org/10.2138/am.2009.3179
  accessed_on: '2026-10-15'
- id: karnachuk2021
  title: Karnachuk et al. (2021). Desulfovibrio desulfuricans AY5 Isolated from a Patient with Autism Spectrum Disorder Binds Iron in Low-Soluble Greigite and Pyrite. Microorganisms 9, 2558. DOI 10.3390/microorganisms9122558. Complete eleven-page original, methods sections 2.1-2.4, Figures 5-6 and original three-page supplementary Figures S1-S3; only laboratory mineral observations are used, without adopting clinical extrapolations.
  url: https://doi.org/10.3390/microorganisms9122558
  accessed_on: '2026-10-15'
- id: ncbi_desulfuricans
  title: NCBI Taxonomy 876, Desulfovibrio desulfuricans, species rank. This species identifier does not itself authenticate isolate AY5.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=876
  accessed_on: '2026-10-15'
mechanisms:
- id: abiotic-heating-cooling-crystallization
  name: Kornelite crystallization during cooling of a ferric-sulfate preparation
  process: other
  description: An aqueous ferric-sulfate preparation first produced an XRD-assigned ferricopiapite precipitate at 75 degrees C. After further heating, opening the vessel and slow cooling, pale-violet kornelite crystals appeared. Single-crystal and powder diffraction support the final product identity. The sequence does not establish a direct solid-state ferricopiapite-to-kornelite pathway or a mass-balanced iron recovery.
  context: 'Ackermann et al., page 1621: 2.5 g of analytical-grade, X-ray-amorphous ferric sulfate was dissolved in 1.17 mL deionized water. Closed polyethylene flasks were held at 75 degrees C for 48 hours, then nine additional days. The oven was switched off, the vessel lid removed and the contents cooled slowly in the oven to room temperature. Cooling duration, exact final temperature, solution pH, replicate synthesis count and product yield are not reported. This is a chemical laboratory synthesis; no organism or biological treatment is involved. The source also supports the existing paracoquimbite record through a different preparation; two material records do not constitute independent replication.'
  microbial: false
  evidence:
  - source_ref: ackermann2009
    supports: support
    explanation: Page 1621 describes the preparation, and Figure 1a/page 1622 shows the resulting elongated crystals. Table 1 reports a monoclinic P21/n single-crystal refinement at 293 K. The electron microprobe Fe/S ratio, 0.62(5), averages 35 spots rather than 35 independent syntheses; the authors acknowledge measurement difficulty and compare it with theoretical 0.66.
  - source_ref: ackermann2009
    supports: partial
    explanation: Pages 1622-1625 and Tables 2/4 distinguish model-dependent channel water from fixed stoichiometry. Single-crystal models yield 1.71(5) or 1.75(5) channel waters per formula unit, compared with 1.55(2) from powder refinement; thermogravimetry gives total hydration estimates of 7.47 or 7.98 depending on the plateau endpoint. Disordered and incommensurate water arrangements were not distinguished. Deposit AM-09-052 could not be acquired, so detailed-coordinate reproducibility remains unchecked.
  - source_ref: ackermann2009
    supports: partial
    explanation: Figure 6/pages 1626-1627 demonstrates strong sensitivity of calculated phase boundaries to estimated entropies. These are not measured universal stability fields. Table 6 prints a 6.53-water coefficient in the kornelite Hess-cycle expression, inconsistent with the 6.75 implied by its adopted 7.75-water formula and Table 5 reaction; no formation-enthalpy value is adopted here. Thermal-peak labels also do not establish an isolated product or an ore-treatment yield.
- id: ay5-provisional-phase-assignment
  name: Provisional kornelite assignment in mixed AY5 culture precipitates
  process: biomineralization
  description: Karnachuk et al. label some peaks in precipitates from living Desulfovibrio desulfuricans AY5 cultures as kornelite using a powder diffraction database match. This is a provisional culture-associated phase observation, not proof that sulfate-reducing metabolism directly precipitates ferric sulfate. The mineral products are mixed, and neither kornelite abundance nor a recovered iron fraction was measured.
  context: Sections 2.1-2.4 describe glycerol-fed Widdel-Bak medium with sulfate, phosphate, nutrients and reductant; the one-litre bioreactor received 100 mg/L iron as FeSO4 and operated at 28 degrees C, 100 rpm and 25 mL/min nitrogen sparging. Its pH was progressively decreased from 7 using HCl or NaHCO3, with medium replacement and transfers to closed, dark batch bottles at 28 degrees C. Thus the successive pH arms share a reactor history rather than independent fresh inoculations. Solids were centrifuged at 13,100 g for 15 minutes at 15 degrees C and washed in distilled water for 10 minutes before powder XRD. Oxygen exclusion during washing, any drying conditions and an uninoculated mineralogical control are not reported. These are laboratory observations, without clinical or industrial inference.
