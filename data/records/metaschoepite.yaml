id: cmmmech:metaschoepite
name: Metaschoepite
material_kind: mineral
description: >-
  Metaschoepite is a uranyl oxide hydroxide hydrate mineral, distinct
  from schoepite, elemental uranium and the products historically called
  dehydrated schoepite. The September 2026 IMA list gives
  (UO2)8O2(OH)12·10H2O and grandfathered status G; 1960 is the original
  description year, not an approval accession. Historical schoepite II
  terminology is retained only as context. Natural crystals undergoing
  alteration and synthetic metaschoepite exposed to controlled humidity
  are separate evidence populations. The synthetic formula
  [(UO2)4O(OH)6]·5H2O is the same ideal stoichiometry on a four-uranium
  basis. No criticality, microbial activity or industrial recovery is
  inferred from these laboratory mineral transformations.
