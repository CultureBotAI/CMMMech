  accessed_on: '2026-10-15'
mechanisms:
- id: abiotic_crystallization
  name: Abiotic laboratory crystallization of a synthetic zeunerite analogue
  process: other
  microbial: false
  description: Copper, uranyl and arsenate reagents produced crystals or powder assigned to zeunerite
    by diffraction. Slow gel growth and solution precipitation are separate laboratory preparations; neither
    is a microbial process or a demonstrated industrial recovery operation.
  context: Locock and Burns grew zeunerite at room temperature over three weeks by slow diffusion of reported
    0.167 M H5As3O10 and 0.5 M uranyl-nitrate solutions into copper-bearing silica gel. A crystal was
    epoxy-coated to limit dehydration before room-temperature MoK-alpha single-crystal diffraction. Separately,
    MacIver-Jones precipitated material from uranyl nitrate in 0.2 M nitric acid, copper nitrate and arsenic
    acid, matured it for 48 h, filtered and washed it, and dried it at room temperature. Subsequent repeated
    reflux in D2O at 75 degrees C prepared the neutron sample; residual H was detected by FTIR. The zeunerite
    refinement used data collected at 50 degrees C, not an untreated natural crystal. Neither preparation
    supplies a mass-balanced metal recovery yield.
  evidence:
  - source_ref: locock2003
    supports: support
    explanation: Pages 490-492 and Tables 1, 3 and 7 support synthetic twelve-water zeunerite in P4/nnc.
      The refined cell is a = 7.1797(3) and c = 20.857(1) angstrom, with R1 = 1.6% for 468 observed unique
      reflections. Page 498 identifies pseudo-I-centering and argues that observed reflections require
      P-centering, disagreeing with the earlier Hennig et al. I4/mmm model. This is the authors' interpretation
      of their dataset, not an independent re-refinement here.
  - source_ref: locock2003
    supports: partial
    explanation: Hydrogen positions were refined with O-H distance constraints and fixed isotropic displacement
      parameters. Page 497 presumes equivalence to natural zeunerite from compatible cell dimensions;
      natural material was not the measured crystal. The hydrothermal 220-degree-C synthesis and twinning
      refinements belong to metazeunerite and are not zeunerite results. The inaccessible Hennig full
      text and CISTI reflection deposit limit independent adjudication of the competing model.
  - source_ref: maciver_jones_thesis
    supports: support
    explanation: Printed pages 61-65 and 77-82, Figures 3.1-3.3 and Tables 3.1-3.4 support preparation
      and a P4/nnc neutron model of partially deuterated zeunerite at 50 degrees C, with twelve water
      molecules per formula unit. Figures 3.8-3.9 and pages 93-97 propose a split H/D site and hydrogen-bond
      network. The model used soft bond restraints and constrained displacement parameters; AIRSS verification
      was performed only for metatorbernite.
  - source_ref: maciver_jones_thesis
    supports: partial
    explanation: The source calls the sample container stainless steel in Chapter 2 but vanadium in Chapter
      3. Copper occupancy uncertainty is 1.00(2) in prose versus 1.00(3) in Table 3.1; water-angle uncertainties
      also differ between prose and Table 3.3. Appendix 3.2 repeats a zeunerite caption despite phosphorus-labelled
      spectra, so it is not used as a zeunerite assay. The proposed hydrogen-bond explanation for greater
      stability than torbernite remains a hypothesis, with neutron analysis of torbernite requested as
      future work. Raw neutron runs were not reanalysed. No quantitative solubility, microbial mechanism
      or long-term field performance is established by this scoped structural evidence.
