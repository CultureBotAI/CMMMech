id: cmmmech:monteregianite-y
name: Monteregianite-(Y)
material_kind: mineral
description: >-
  Hydrated potassium-sodium-yttrium double-sheet silicate mineral with current
  September 2026 IMA-CNMNC approved formula KNa2YSi8O19·5H2O, status Rn
  (renamed), and special-procedure tag 1987 s.p. (originally approved as
  monteregianite by the IMA Commission on New Minerals and Mineral Names prior
  to publication by Chao 1978, and suffixed Monteregianite-(Y) in 1987; listed
  under 1987 s.p. in the IMA Master List rather than a numbered CURIE). Chao
  (1978, pp. 561–562) described the holotype specimen (preserved at the National
  Museum of Natural Sciences, Ottawa, specimen 37130; formerly known as UK-6 in
  Chao et al. 1967) from miarolitic cavities, thermally metamorphosed
  inclusions, and rheomorphic breccias in nepheline syenite at Mont St-Hilaire,
  Quebec, Canada, where it is usually associated with calcite, pectolite,
  microcline, albite, aegirine, and arfvedsonite and minor amounts of
  phlogopite, fluorite, quartz, ekanite, sepiolite, ashcroftine, lorenzenite,
  narsarsukite, natrolite, harmotome, apophyllite, molybdenite, and pyrite.
  Chemical analysis performed by D.C. Mah on approximately one gram of
  hand-picked colorless material following the procedures of Hounslow & Moore
  (1966), combined with electron-microprobe analysis for Y2O3 and
  thermogravimetric/thermal analysis to 1000 °C for H2O (Chao 1978, Table 3 and
  prose, pp. 561, 563), gave SiO2 60.30, Al2O3 0.50, Y2O3 11.97, CaO 0.65, MgO
  0.15, BaO 0.35, MnO n.d., FeO n.d., Na2O 9.14, K2O 5.36, H2O 11.40, total
  99.82 wt%, corresponding to the empirical formula
  (Na4.50K1.80)(Y1.85Ca0.20Mg0.06Ba0.04)(Si15.87Al0.15)O38·10.02H2O (printed in
  the Abstract on p. 561 with minor rounding/typographical variants Na4.56K1.80,
  Ca0.19, and Al0.16), simplified to (Na,K)6Y2Si16O38·10H2O; a partial
  electron-microprobe analysis of a mauve variety reported in prose on p. 563
  gave 10.67% Y2O3, 1.38% MnO, 5.89% K2O, and 9.37% Na2O. Physical, optical, and
  crystallographic determinations in Chao (1978, pp. 561–563, Table 1 on p. 562,
  and Table 2 on p. 563 comparing monteregianite with the macdonaldite-group
  minerals rhodesite, macdonaldite, and delhayelite) show needle-shaped crystals
  in irregular and radiating clusters (Fig. 1), elongate tabular crystals in
  parallel groups (Fig. 2), or irregular micaceous masses (0.05 to 3 mm, bounded
  by {010}, {001}, and {100} pinacoids and occasional {101} prisms), colorless,
  white, grey, or rarely mauve or pale green color, white streak, vitreous to
  silky lustre, perfect {010}, very good {001}, and good to fair {100}
  cleavages, Mohs hardness ~3½, Dmeas = 2.42(2) g/cm3 (determined by flotation
  in diluted bromoform and by use of a Berman balance), Dcalc = 2.391 g/cm3 (for
  Z = 4 of (Na,K)6Y2Si16O38·10H2O), ready etching by cold 1:1 HCl, HNO3, and
  H2SO4 along cleavage planes (pp. 561–562), and biaxial (+) optics (Na light,
  spindle stage) with alpha = 1.510(1), beta = 1.513(1), gamma = 1.517(1),
  2Vmeas = 87(1)°, 2Vcalc = 82°, orientation X = c, Y = a, Z = b, optic plane
  perpendicular to the axis of elongation (a), and inconspicuous dispersion;
  Weissenberg, precession, and least-squares powder-diffraction refinement
  (Table 1, p. 562; 114.6 mm camera, CuKalpha radiation, lambda = 1.5418 Å, Si
  internal standard; strongest eight lines: 12.00 (100)(020), 7.03 (100)(200),
  6.55 (40)(002), 6.02 (50)(220,040), 4.42 (100)(042), 3.405 (50)(062), 3.026
  (50)(034,440), and 2.873 (80)(044) Å) initially indexed the mineral as
  orthorhombic Bmab or B2ab with a = 14.014(4), b = 23.910(5), c = 13.096(2) Å
  and a pronounced pseudocell with a and c halved in Pmmb, P2mb, or Pm2b. Ghose,
  Sen Gupta, and Campana (1987; spelled montregianite throughout their paper)
  determined and refined the crystal structure by single-crystal MoKalpha X-ray
  diffraction on a 0.34 x 0.32 x 0.34 mm Mont St. Hilaire cleavage fragment
  donated by G.Y. Chao (after an initial orthorhombic Cmca refinement on 2209
  reflections to R = 0.066 showed anomalously large Si–O bond-length standard
  deviations, 13724 reflections were recollected on a Syntex P1 four-circle
  diffractometer to 2theta = 65°, yielding 5669 inequivalent and 4877 observed
  reflections refined to R = 0.059, Rw = 0.061; Tables 1–4, pp. 366–373),
  establishing true monoclinic (pseudo-orthorhombic, 2/m) symmetry in standard
  space group P21/n with a = 9.512(2), b = 23.956(4), c = 9.617(2) Å, beta =
  93.85(1)°, V = 2186.5(6) Å3, Z = 2 for Na4K2Y2Si16O38·10H2O (Z = 4 for
  KNa2YSi8O19·5H2O), Dcalc = 2.41 g/cm3, and mu(MoKalpha) = 35.45 cm-1
  (non-standard pseudo-orthorhombic setting C1121/a: a = 13.973(2), b =
  13.064(2), c = 23.956(4) Å, gamma = 90.62(1)°, V = 4372.8(10) Å3, Z = 4, Table
  1, p. 366). The structure consists of two types of layers alternating along
  [010] parallel to the (010) perfect cleavage (pp. 365, 370–373): (1) an open
  mixed octahedral sheet of isolated [YO6] octahedra (mean Y–O = 2.261(30) Å;
  octahedral Y site refined with 0.60 Y + 0.40 Ce in Table 2, p. 366, and prose,
  p. 370) and three distinct [NaO4(H2O)2] octahedra (Na(1) occupancy 0.95, mean
  Na–O = 2.493(32) Å for 6 bonds or 2.551 Å including a weak 7th O(5B) bond at
  2.900(6) Å; Na(2A) occupancy 0.47, mean 2.416(30) Å; Na(2B) occupancy 0.45,
  mean 2.411(26) Å; Table 2, p. 366, Table 4, p. 368, and prose, p. 371) forming
  elliptical eight-membered octahedral rings, and (2) an apophyllite-type double
  silicate sheet with four- and eight-membered tetrahedral rings (bridging Si(1)
  and Si(4) tetrahedra with mean Si–O = 1.598 Å and Si(1)–O(1)–Si(4) =
  176.5(3)°, and six other tetrahedra with three bridging and one nonbridging
  oxygen and mean Si–O = 1.613 Å; Table 4, pp. 368–369, and prose, pp. 371–373)
  housing split ten-coordinate [KO6(H2O)4] sites (K(1) occupancy 0.62, mean K–O
  = 2.978 Å; K(2) occupancy 0.38, mean K–O = 2.991 Å, separated by 0.34 Å; Table
  2, p. 366, Table 4, p. 368, and prose, p. 372) and six independent water
  positions W(1)–W(6) (W(1) and W(2) fully occupied at 1.0 in the octahedral
  sheet; W(3) occupancy 0.95, W(4) 0.46, W(5) 0.35, and W(6) 0.37 in the
  channels; Table 2, p. 366, and prose, p. 372). The second reference listed in
  the IMA Master List (Journal of Physical Chemistry B 102 (1998), 4379) was not
  inspected in full text and no claims from that 1998 study are asserted here.
  Distinct from macdonaldite-group silicates (rhodesite, macdonaldite,
  delhayelite), apophyllite, ashcroftine-(Y), and elemental yttrium; no
  criticality designation, microbial mechanism, or industrial recovery yield is
  asserted.
