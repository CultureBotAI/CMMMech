id: cmmmech:fluorine
name: Fluorine
material_kind: element
description: >-
  The element F, distinct from fluoride anion, molecular fluorine, individual
  organofluorine compounds, fluorite mineral and the fluorspar commodity.
  Australia's explicitly named Fluorine entry is mapped to the element;
  its comparative footnote about US and EU fluorspar does not establish
  elemental-fluorine criticality in those jurisdictions.
