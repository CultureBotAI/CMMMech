    image2.png) inspected. Four other sheets contain coal-particle evidence, not a synthetic-florencite
    recovery dataset.
  url: https://oaepublishstorage.blob.core.windows.net/020683d7-f854-43cd-b83e-bde768784680/4853-SupplementaryMaterials.xlsx
  accessed_on: '2026-10-15'
mechanisms:
- id: abiotic_synthetic_analogue_and_leaching
  name: Abiotic synthesis and alkaline-acid treatment of a florencite-(Ce) analogue
  process: other
  microbial: false
  description: A reagent-derived cerium aluminium phosphate preparation was assigned to florencite by
    XRD and SEM. Subsequent NaOH treatment increased its solid-phase Ce-to-phosphorus mass ratio, and
    HCl treatment decreased that ratio. The authors interpret these changes as preferential phosphorus
    dissolution during the alkaline stage and preferential REE leaching during the acid stage. Solid-composition
    ratios alone do not measure dissolved inventories, quantitative phase conversion or recovery efficiency.
  context: The official supplementary synthesis image reports Ce(NO3)3·6H2O in 50 mL water, initial pH
    3.85 at 25 degrees C, and dropwise 5 M NaOH to pH 11. After five minutes stirring, the precipitated
    Ce(OH)3 was centrifuged and washed three times, redispersed in 50 mL water, and combined with Al(OH)3
    and 20 mL of 1 M H3PO4. After ten minutes mixing, material was held in a sealed 0.1 L Teflon-lined
    autoclave at 200 degrees C for three months, cooled naturally, washed with water and absolute alcohol,
    and dried overnight at 60 degrees C. The recipe writes the Ce nitrate and Al hydroxide inputs as 0.01
    M and 0.03 M without unambiguously specifying their amounts or final volume basis; those values are
    not silently converted to moles. Main pages 7-8 specify 5 M NaOH at 90 degrees C followed by 1.2 M
    HCl at 90 degrees C for the synthetic preparation. Main page 3 gives two-hour stages and particular
    solid/liquid loadings for coal wastes, but does not explicitly assign those details to the synthetic-mineral
    arm; synthetic-arm loading, duration and independent replicate count remain unspecified. Figure 6B
    compares raw, alkali-treated and alkali-treated plus acid-leached solids; an acid-only synthetic comparator
    is not presented. This is one study and its supplement, not independent replication.
  evidence:
  - source_ref: ima_2026_09
    supports: context_only
    explanation: The exact species row and list definitions establish current name, ideal formula and
      renamed status. The special-procedure date is nomenclatural history, not a critical-mineral-list
      edition or a biological claim.
  - source_ref: handbook_florencite_ce
    supports: context_only
    explanation: The ideal composition and natural Ce-dominant analyses support this species identity.
      Other REE substitutions are possible; a generic florencite or crandallite-group label in a mixed
      coal particle is insufficient to assign this species.
  - source_ref: li2022_si
    supports: support
    explanation: The original embedded synthesis image in sheet 2 explicitly names the Ce nitrate precursor
      and Ce(OH)3 intermediate and gives the product equation CeAl3(PO4)2(OH)6. This provides the Ce-specific
      chemical grounding absent from the article title; no organism or biomass occurs in this protocol.
  - source_ref: li2022
    supports: support
    explanation: PDF pages 6-7, Figure 5 and Figure 6A show rhombohedral particles and a sharp powder
      pattern compared with florencite reference PDF 43-0673. The authors report no other identified crystalline
      minerals. This supports the source-assigned synthetic analogue; no quantitative phase-purity fraction,
      bulk compositional refinement or synthesis yield is reported. Figure 6A is the synthesized-material
      pattern, not proof of phase identity after both leaching stages.
  - source_ref: li2022
    supports: partial
    explanation: PDF pages 7-8 and Figure 6B report solid-composition TREE/P ratios of about 2.1 in raw
      material, 3.5 after 5 M NaOH and 3.0 after subsequent 1.2 M HCl, both at 90 degrees C. The composition
      axis is weight percent and Ce is the plotted REE; these are mass ratios from SEM-EDS rather than
      molar ratios or extraction percentages. Preferential dissolution is the authors' interpretation
      of residue composition; a closed dissolved-plus-residual mass balance, an isolated Ce product and
      an acid-only synthetic control are not provided. The figure includes error bars, but synthetic-arm
      replicate count and their statistical definition are not specified.
  - source_ref: li2022
    supports: partial
    explanation: The generalized crandallite-group formula printed on PDF page 6, RAl3(PO4)(OH)5, differs
      from both the current species formula and the correctly balanced Ce product equation in the official
      supplement. The main text points to Schwab et al. reference 32 (2004 crandallite/woodhouseite) for
      synthesis, while the supplementary synthesis image cites Schwab et al. (1990 rare-earth phosphates).
      These source discrepancies are retained rather than used to redefine the species or to claim the
      older experiments were independently checked.
  - source_ref: li2022_si
    supports: partial
    explanation: The supplement's SEM-EDS procedure selects the highest REE result among several measured
      spots on a particle, so this is selected local composition rather than a representative whole-sample
      assay. It specifies Au/Pd coating, whereas main PDF page 4 specifies Pt/Pd; no resolution is supplied.
      The four coal-particle sheets concern mixed-feed classification and do not supply synthetic-mineral
      leachate inventories. No coal-waste extraction percentage is attributed to florencite-(Ce).
