id: cmmmech:europium
name: Europium
material_kind: element
description: The element Eu, distinct from Eu(III), europium nitrate, oxides, mineral species
  and waste streams. The dated US designation concerns the named europium mineral commodity
  and does not transfer criticality to every Eu-bearing material. Laboratory evidence below
  concerns cyanobacterial culture-associated removal from synthetic solutions; it does not establish
  selective extraction, a purified product or industrial deployment.
