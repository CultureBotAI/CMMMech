      Causal pathway linking PQQ-dependent glucose oxidation in Gluconobacter
      oxydans to gluconic-acid-rich spent-medium biolixiviant generation (220 mM
      gluconic acid, pH 2.1) and rare-earth element mobilization from synthetic
      REE-doped calcium sulfate powders.
