mechanisms:
- id: synthetic_ce_carbonate_phase_transformation
  name: Abiotic transformation of synthetic Ce carbonate phases at 35 °C
  process: other
  microbial: false
  description: >-
    In sealed synthetic-solution experiments at 35 °C, powder X-ray
    diffraction quantified a progression from lanthanite and kozoite-type
    Ce carbonate to cerianite. Table 2 and Figure 2b agree on 66 wt%
    lanthanite and 34 wt% kozoite at 24 h; 7 wt% lanthanite, 86 wt%
    kozoite and 7 wt% cerianite at 192 h; and 100 wt% cerianite among
    the quantified crystalline phases at 865 h. These fitted phase
    fractions are not a mass balance for all dissolved and solid Ce,
    an extraction efficiency or isolated-metal recovery. The authors
    propose dissolution-recrystallization with Ce(III) oxidation;
    the diffraction and microscopy observations do not independently
    establish every molecular step or oxidant source.
  context: >-
    Laboratory abiotic study by Terribili et al. (2025), starting from
    40 mL of 50 mM Ce nitrate solution mixed with 40 mL of 50 mM
    Na2CO3 solution in a glass reactor, pre-equilibrated to 35 °C,
    then sealed and held static at that temperature. Successive 5 mL
    suspension samples were filtered at 0.2 micrometre, rinsed with
    isopropanol and air-dried before XRD; phases were quantified using
    TOPAS Rietveld analysis. Table 2 identifies one reactor for this
    arm; the two ambient-temperature replicas described in Methods
    are not assumed for 35 °C. Temperature and time-series arms are
    comparators, with no inoculum or microbial control experiment.
    At 5 °C, lanthanite alone was reported among crystalline phases
    at the sampled times from 28 to 147 h, so the 35 °C pathway
    is not transferred to all conditions. Table 2 and Figure 2b
    disagree at 526 h (1/71/28 versus 2/71/27 wt% lanthanite/kozoite/
    cerianite); Table 2 and Figure 2c also disagree for the separate
    50 °C, 145 h endpoint (1 wt% kozoite plus 99 wt% cerianite
    versus 100 wt% cerianite). Those disputed endpoints are not used
    as curated outcomes. Uncertainty for the reported phase fractions
    and a controlled oxidant comparison are not supplied. No natural
    ore feed, biological mediation or industrial demonstration is shown.
  evidence:
  - source_ref: terribili2025
    supports: support
    explanation: >-
      Methods page 946 specifies the mixing, static incubation,
      sample processing and diffraction quantification. Table 2
      page 950 and Figure 2b page 949 support the selected 35 °C
      time points; Figure 9 shows cerianite crystals on carbonate
      surfaces at 192 and 360 h. Discussion pages 958-959 proposes
      dissolution-recrystallization and oxidation, rather than
      measuring their complete causal sequence. The cold-arm null
      for cerianite and the unselected endpoint discrepancies limit
      generalization; the paper's practical extraction motivation
      does not itself demonstrate recovery.
