id: cmmmech:brucite
name: Brucite
material_kind: mineral
description: Brucite is the magnesium hydroxide mineral Mg(OH)2. The IMA-CNMNC September 2026 master list
  gives grandfathered status G and the original-description year 1818, not a numbered approval identifier.
  It is distinct from elemental magnesium, magnesium-metal commodity, the brucite mineral group, and chemically
  unspecified magnesium hydroxide products. Field observations at Prony Bay document brucite encrusting
  microbial filaments; they do not establish that microbes are required for brucite formation. No criticality
  designation is inherited from magnesium.
