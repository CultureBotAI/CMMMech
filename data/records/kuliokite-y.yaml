      is closer to crystal 3's 46.14 electrons. This variation is retained,
      without assigning the diffraction crystal to a particular analytical
      row. CSD 2482967 is the deposit cited by the paper; its CIF was not
      acquired at curation, so no independent re-refinement is claimed.
