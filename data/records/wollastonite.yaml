mechanisms:
- id: pseudomonas_live_dead_dissolution_test
  name: Live versus heat-killed Pseudomonas dissolution assay with limited enhancement evidence
  process: bioleaching
  microbial: true
  organisms:
  - id: NCBITaxon:587851
    label: Pseudomonas chlororaphis subsp. aureofaciens
  description: Natural wollastonite released calcium and silica in both live and heat-killed bacterial
    suspensions. The authors interpreted the overall live-cell advantage as small relative to experimental
    uncertainty. This records a tested microbial interaction and its limited outcome, not proof that microbial
    weathering is generally ineffective or that calcium or silicon was recovered as a product.
  context: Pokrovsky et al. used source-named Pseudomonas aureofaciens CNMN PsB-03, a soybean-rhizosphere
    isolate supplied by the Moldovan institute, grown for 48 h at 28 degrees C on sucrose-peptone (SP,
    EPS-rich) or succinate (SA, EPS-poor) medium. Washed live cells were compared with biomass autoclaved
    at 130 degrees C for 30 min in each nutrient medium and in 0.01 M NaCl. Batch assays ran at 25 +/-
    1 degrees C and 120 rpm for up to seven days using sterile 50-100 micrometre mineral powder; eight
    live/dead condition combinations are described, without a clear independent reactor-replicate count.
    Methods give 0.5 g mineral in 250 mL but call this 2.5 g/L, an unresolved arithmetic discrepancy also
    carried into Table 3. Live biomass varied approximately 0.5-4 g wet/L; dead biomass was 1.5 g wet/L.
    Figure 5 pH labels span 7.2-8.2, whereas nutrient SP Figure 6 spans 7.3-6.5 despite Table 3 giving
    7.2-8.2 generally. Calcium and silica were measured in 0.22-micrometre filtrates by atomic absorption
    and molybdate-blue colorimetry. Sterile contamination controls and separate abiotic mixed-flow comparisons
    are described; the plotted matched batch contrasts are live versus dead biomass, not a complete biomass-free
    kinetic series.
  evidence:
  - source_ref: pokrovsky2009
    supports: partial
    explanation: 'Figures 5-6 and Table 3 show dissolution in live and dead suspensions, with some larger
      live-culture silica slopes. The authors conclude that their pooled enhancement is within experimental
      uncertainty. That conclusion is retained as their interpretation, not a uniformly null result: Table
      3 SA-medium log silica rates (-12.08 live versus -12.43 dead) imply a larger ratio than the stated
      55 percent, while the stated 37 percent SP exception also does not match its listed rates. Figure
      6 labels SP silica as ppm and SA silica as mM; no silent unit correction, pooled enhancement estimate,
      exact rate or yield is adopted. Source batch loading, pH and replication limits prevent precise
      cross-arm effect claims.'
  - source_ref: berner2010
    supports: context_only
    explanation: The published comment challenges extending the wollastonite result to basalt weathering
      and general biological control, noting aluminium- and iron-bearing mineral differences and field
      evidence. It does not repeat or invalidate this particular live/dead assay.
  - source_ref: reply2010
    supports: context_only
    explanation: The authors agree that wollastonite is a misleading general proxy for most basic igneous
      rocks and narrow the extrapolation. This record therefore makes no claim that all soil biota, silicates
      or field systems lack enhanced dissolution, and no carbon-sequestration or industrial-recovery claim.
