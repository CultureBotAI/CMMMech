      no independent least-squares re-refinement or exhaustive
      numerical transcription of the deposited factors was performed.
    url: https://msaweb.org/MSA/AmMin/Supplemental_Data/Vol%2060%20p0879%20AM-75-007.pdf
    accessed_on: '2026-10-16'
  - id: xiong2017_boundary
    title: >-
      Xiong, Kirkes, Knox and Marrs (2017), Experimental determination
      of solubilities of sodium polyborates in MgCl2 solutions:
      solubility constant of di-sodium hexaborate tetrahydrate,
      and implications for the diagenetic formation of ameghinite,
      Canadian Mineralogist 55, 1001-1008,
      DOI 10.3749/canmin.1700026. Complete 27-page OSTI manuscript
      SAND2017-12226J inspected: methods pp. 5-6, Table 1 pp. 18-19,
      Figure 1 p. 25, identity/proposed conversion pp. 11-13.
      The distinct-polymorph experiment and model-derived constants
      are not measurements of ameghinite dissolution or conversion.
    url: https://www.osti.gov/servlets/purl/1421624
