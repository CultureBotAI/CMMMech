    relationship: interfacial hydrolysis and condensation of Ti precursor
    description: Surface-displayed R5 repeats in pET(INP-nR5) (n = 1, 3, or 5) are proposed to promote interfacial deposition of a cell-bound amorphous titanium-oxide precursor from TALH in Tris-buffered saline (50 mM Tris-HCl pH 7.0, 300 mM NaCl) over 24 h at 37 degrees C and 24 h at 80 degrees C relative to INP-only comparator cells.
    evidence:
    - source_ref: ping2016
      supports: partial
      explanation: Ping et al. (2016) Main Figures 1-4 and Supporting Figures S2 and S4b show that E. coli BL21(DE3) expressing pET(INP-nR5) (n = 1, 3, or 5) in TALH/TBS formed cell-associated amorphous precursor at 37 degrees C (Figure 1b, S2g) and weak broad 26-degree diffraction features after 80 degrees C (Figure S2h) that retained rod-like morphology after heating, whereas INP-only comparator cells had smoother surfaces (Figure S2) and lost rod morphology after 600 degrees C calcination (Figure S4b); however, electrostatic/hydrogen-bond catalysis (Figures 1d, 3d, 5) is a proposed mechanism and matched cell-free precursor and live-versus-killed controls were omitted.
  - source: amorphous_ti_precursor_shell
    target: calcined_anatase_tio2
    predicate: transforms_into
    relationship: 600 C thermal calcination and crystallization
    description: Abiotic calcination at 600 degrees C for 4 h converts the freeze-dried cell-templated precursor into rod-shaped aggregates of crystalline anatase nanocrystals in air (10 degrees C/min; ~5 nm / 5.8 +/- 0.8 nm in Figure 3) or an anatase-carbon composite in argon (4 degrees C/min).
    evidence:
    - source_ref: ping2016
      supports: partial
      explanation: Ping et al. (2016) Figures 1-4 and Supporting Figures S2, S4-S8 show that crystalline anatase is established after abiotic 600 degrees C (4 h) calcination in air (~5 nm / 5.8 +/- 0.8 nm rod-like aggregates in Figure 3) or argon (anatase-carbon composite), following largely amorphous 37 degrees C (24 h, Figure 1b/S2g) and low-crystallinity 80 degrees C (24 h, weak 26-degree peak in Figure S2h) stages, with a reference-card label discrepancy between main text page 6332 (21-1271) and Figure 2e / Supporting Figure S6 (21-1272) and no reported titanium mass balance or isolated-product yield.
