mechanisms:
- id: natural_studtite_heat_treatment
  name: Abiotic production in a heated natural studtite mixture
  process: other
  microbial: false
  description: >-
    Heating natural studtite-bearing fibers produced a powder pattern
    dominated by metastudtite together with curite. The experiment
    supports a hydrate transformation in a mixed natural specimen;
    it does not establish a phase-pure product or a quantitative yield.
  context: >-
    Deliens and Piret heated yellow studtite fibers with a reddish
    core at 100 degrees C for two hours. Their separately analyzed
    natural metastudtite fibers also contained uranium-lead hydrate
    material in the cores. Natural morphology alone was unreliable:
    historical collection fibers labeled studtite included studtite,
    metastudtite and lepersonnite.
  evidence:
  - source_ref: deliens1983
    supports: support
    explanation: >-
      Page 457 and Table 1 identify metastudtite plus curite after the
      two-hour treatment. Table 1 distinguishes the authors' heated
      natural-studtite pattern from natural metastudtite, a prior
      synthetic preparation and an earlier heated specimen. These
      columns are not replicate measurements of one substrate.
  - source_ref: deliens1983
    supports: partial
    explanation: >-
      Natural fibers gave additional reflections attributed to
      uranium-lead hydrates; neither a pure precursor nor full conversion
      was established. The historical irreversibility statement cites
      earlier work and is not a controlled reversibility test in this
      experiment. The paper's printed calculated-density unit is
      inconsistent with an ordinary mineral density and is not adopted.
- id: synthetic_thermal_decomposition
  name: Abiotic decomposition of metastudtite formed during studtite heating
  process: other
  microbial: false
  description: >-
    Metastudtite formed in situ during heating of synthetic studtite
    subsequently lost crystalline diffraction features and developed
    amorphous uranium-bearing products. Dehydration and peroxide loss
    are supported interpretations; a single pure final oxide and a
    unique molecular pathway were not established.
  context: >-
    Spano et al. synthesized the starting studtite from equal volumes
    of 0.5 M uranyl nitrate and 30 percent H2O2, washed and air-dried
    it, and heated samples from approximately 25 to 250 degrees C.
    PXRD and Raman measurements were in air every 5 degrees C;
    TGA used approximately 25 mg in continuous argon after a
    30-minute equilibration at 25 degrees C. Nominal rates of 1, 2,
    5 and 10 degrees C/min differed from effective PXRD rates
    0.075-0.080 and Raman rates 0.830-3.283 degrees C/min because of
    measurement dwell times. Metastudtite was an intermediate of
    these experiments, not an independently identical pure starting
    powder for every thermal arm.
  evidence:
  - source_ref: spano2020
    supports: support
    explanation: >-
      Proof pages E-I and Figures 3, 7-11 document loss of metastudtite
      diffraction and changes in uranyl/peroxo Raman bands. PXRD
      product-dominant crossovers averaged 144.0 +/- 1.8 degrees C
      under the long-dwell protocol. Raman model-derived crossovers
      ranged from 195.7 to 206.2 degrees C across the nominal rates.
      These method-dependent crossovers are not onset temperatures
      or a universal stability boundary. Table 3's second-order
      kinetic model is a fit to TGA conversion data, not independent
      proof of one elementary chemical reaction.
  - source_ref: spano2020
    supports: partial
    explanation: >-
      Pages G and I and Figures 8 and 11 retain residual peroxide
      spectral contributions and differing mass losses at 250 degrees C.
      No run reached the theoretical 21.4 percent loss expected for
      full conversion of the starting studtite to U2O7. The authors
      explicitly leave final amorphous-product speciation unresolved.
      Starting-material water retention, probe depth, sample amount,
      heating schedule and air-versus-argon conditions limit direct
      comparison of techniques. The paper's Pnma metastudtite model
      is historical evidence, not a newly verified unique structure
      for all natural and synthetic metastudtite.
- id: peroxide_surface_phase_succession
  name: Abiotic early metastudtite formation on peroxide-exposed U3O8
  process: other
  microbial: false
  description: >-
    Metastudtite was the largest identified alteration-phase contribution
    after one day on synthetic U3O8 exposed to peroxide, followed by
    studtite-dominated alteration spectra from day eight onward.
    Dissolution/reprecipitation was proposed; direct reversible solid-state
    hydration of an isolated metastudtite substrate was not tested.
  context: >-
    Chamberlain et al. used separate approximately 50 mg alpha- and
    beta-U3O8 powders in 50 mL solutions with measured initial H2O2
    concentrations 0.16, 0.0030 or 0.000054 M. Water-only U3O8 and
    peroxide-only controls were included. Beakers prepared in ambient
    atmosphere were parafilm-sealed between sampling; pH strips gave
    approximately 6.5 and no numerical incubation temperature was
    specified. Solid aliquots were air-dried for at least four hours
    before analysis. Fifteen Raman spots per aliquot represented
    spatial subsampling rather than independent reaction replicates.
  evidence:
  - source_ref: chamberlain2025
    supports: support
    explanation: >-
      Figure 4 and Tables S-2-S-4 and S-6-S-8 support the surface-phase
      succession in peroxide-added arms, with unaltered U3O8 often
      remaining the largest total component. Metastudtite's fitted
      contribution was reduced rather than uniformly exactly zero
      after day eight. For alpha-U3O8 in 0.16 M H2O2, Table S-2
      gives 0.49734 on day 1 and 0.0225 on day 8; these normalized
      PLSR contributions are not bulk mass fractions or recovery yields.
  - source_ref: chamberlain2025
    supports: partial
    explanation: >-
      Pages 10-11 explicitly limit conclusions to surface alteration.
      Small nonzero alteration components occur in fitted water-control
      spectra, without obvious SEM morphological change. Continuing
      U3O8 reaction, air drying before analysis and reference-spectrum
      selection prevent assigning the later studtite exclusively to
      dissolution of metastudtite or proving solid-state rehydration.
      The authors call for mechanism studies. Their observations limit
      an unconditional irreversibility claim; they do not establish
      reversible equilibrium, bulk conversion rates or a microbial process.
