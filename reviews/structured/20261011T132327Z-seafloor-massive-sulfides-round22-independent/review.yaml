limitations:
- No biological replicate count, detailed sterilization procedure or dynamically chemistry-matched
  control is reported.
- Cell attachment, ferric-mediated dissolution and sulfur oxidation remain proposed
  contributions rather than independently isolated mechanisms.
- Printed Ga concentration, nominal salt units and broad high-loading endpoint statements
  remain internally inconsistent; no numerical correction is inferred.
- Bulk recovery mass balance, raw instrument data, exact collection sites and industrial
  or in situ operation are unavailable or unestablished.
- The seven-page Japanese primary was read directly with its English captions; no
  certified translation or external translator was used.
- Correction/retraction searches are bounded; no exhaustive absence claim or review
  of every earlier referenced assay.
