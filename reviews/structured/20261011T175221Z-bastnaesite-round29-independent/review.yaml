limitations:
- Unnamed wild-isolate authentication remains outside the inspected main/SI; NCBI
  species identity is not a strain certificate.
- Control concentrations are reported only as near detection limits; numeric detection
  limits and control rows are not supplied in the supporting workbook. Main figures
  and workbook summarize means/SD rather than underlying raw biological replicates.
- Metabolomic annotations are relative, normalized and partly imputed. Added-acid
  activity does not quantitatively assign endogenous concentrations or establish acid
  necessity.
- Dialysis changes pH,planktonic counts and potentially transport. No isolated direct-contact
  effect,cell sorption share or secondary precipitate mass balance is measured.
- Semiquantitative97/3phase estimate and0.635wt%SiO2 are unresolved; no formal mineral-member
  assignment is established by bulk oxides. BufferedpH drift,late-pH prose,growth
  andcrotonic-range discrepancies remain in the source and are retained.
- The accepted primary is the complete institutional postprint; the publisher main
  PDF was not independently acquired. Other uncurated sources and the earlier isolation
  study remain outside this scientific review.
- Natural clay retention and weathering budgets are inferred,not direct assays or
  industrial demonstrations. Bounded notice/counterevidence and filesystem searches
  are not exhaustive.
notes:
- Preassessment canonical inspect and final postgate inspect are byte-for-byte identical.
  All four inspected input hashes were independently recomputed; maintained record,history
  andsource dossier were not edited.
- No correction or follow-up defect is invented for scientific limitations already
  accurately represented. Empty findings applies only to this frozen target and declared
  scope.
- Independent workbook extraction and bounded-search receipts remain outside Git under
  /private/tmp/cmm-round29-bastnaesite-independent. Raw originals remain under /private/tmp/cmm-round29-bastnaesite-research/raw
  with acquisition/manifest in the curator dossier.
- Root-executed required batch receipts at /private/tmp/cmm-round29-final-terminal.json
  were independently read and each of their three log hashes verified. Review coverage/provenance
  validation follows saving both independent round29 bundles.
