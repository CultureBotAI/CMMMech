id: cmmmech:powellite
name: Powellite
material_kind: mineral
description: >-
  Powellite is the calcium molybdate mineral species Ca(MoO4), listed
  as grandfathered in the September 2026 IMA-CNMNC list. It is distinct
  from elemental molybdenum, wulfenite and an uncharacterized calcium
  molybdate precipitate. Sidorenko and colleagues (2008) examined black
  Ca-Mo-rich grains from the Bota-Burum Mo-U deposit, South Kazakhstan.
  Powder diffraction and infrared spectroscopy supported crystalline
  powellite in the uranophane-beta-associated material. Chemically
  similar grains from the uramarsite-associated material were optically
  isotropic and X-ray amorphous, with no characteristic powellite infrared
  bands; the authors interpreted these as metamict powellite. That
  interpretation is kept distinct from the directly characterized
  crystalline material. Radiation-induced alteration and the origin of
  the black colour were inferred, without a controlled irradiation test.
  The article's page 29 discussion is internally inconsistent about
  retention versus loss of anisotropy and diffraction in the silicate
  assemblage; the explicit characterization on pages 23-27 anchors this
  limited record. These observations establish neither a microbial
  transformation nor a mineral recovery yield. Criticality is unrecorded.
sources:
