id: cmmmech:tungsten
name: Tungsten
material_kind: element
description: The element W, distinct from tungstate ions, scheelite and wolframite, tungsten carbides, experimental concentrates and mining wastes. The dated US designation concerns the named tungsten mineral commodity rather than every W-bearing material. A laboratory study supports enhanced tungsten release from an impure scheelite concentrate in Metallosphaera sedula cultures; it does not establish an isolated tungsten product, a specific tungsten redox pathway or industrial recovery.
