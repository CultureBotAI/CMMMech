id: cmmmech:batoniite
name: Batoniite
material_kind: mineral
description: IMA-approved hydrated aluminium sulfate mineral containing the octameric [Al8(OH)14(H2O)18]10+
  polyoxocation (IMA 2023-008; status A, Approved 2023; full description published 31 August
  2023; no mineral symbol is printed in the primary paper or in the September 2026 IMA Master
  List, PDF p. 21) with ideal end-member formula [Al8(OH)14(H2O)18](SO4)5 * 5H2O (written
  Al8(SO4)5(OH)14(H2O)18*5H2O in the September 2026 IMA Master List, PDF p. 21, requiring
  SO3 29.68 wt%, Al2O3 30.24 wt%, H2O 40.08 wt%, total 100.00 wt%; Mauro, Biagioni, Sejkora,
  Dolnicek, and Skoda, 2023, European Journal of Mineralogy 35:703-714). Named in honor of
  Italian amateur mineralogist Massimo Batoni (born 6 April 1948), who collected and provided
  the studied specimens in the early 1990s (Section 1, p. 704). Corresponds to the unnamed
  aluminum sulfate mineral coded as UM1987-12-SO:AlH (Smith and Nickel, 2007) from the Cetine
  di Cotorniano Mine previously described by Sabelli and Santucci (1987) with the tentative
  formula Al3(SO4)2(OH)5 * 9H2O and triclinic cell parameters a = 12.118(3) A, b = 20.916(6)
  A, c = 9.193(4) A, alpha = 87.31(4) deg, beta = 86.92(3) deg, gamma = 82.89(3) deg, V =
  2306 A3 (Abstract, p. 703, and Section 1, p. 704). Discovered in the Garibaldi Tunnel, the
  lowest mining level of the Cetine di Cotorniano Mine (43 deg 13 min N, 11 deg 09 min E),
  Chiusdino, Province of Siena, Tuscany, Italy, excavated in Paleozoic metasediments cropping
  out beneath the Upper Triassic evaporitic-dolomitic-brecciated "Calcare Cavernoso" Formation
  (Section 2, p. 704). The holotype specimen is deposited in the mineralogical collection
  of the Museo di Storia Naturale of the University of Pisa, Via Roma 79, Calci (Pisa), Italy,
  under catalogue number 20028 (Section 1, p. 704, and Figure 1, p. 705). Formed as a low-temperature
  secondary supergene phase by reaction of sulfuric acid released during pyrite/marcasite
  oxidation with Al-rich phyllosilicates of the Paleozoic metasedimentary host rocks, directly
  associated with colorless prismatic crystals of gypsum and an orange-brownish resinous poorly
  crystalline undetermined Al-Fe sulfate (Section 2, p. 704). Occurs as hemispherical aggregates
  up to 1 mm in diameter composed of colorless to white tabular crystals flattened on {011},
  with a white streak and a vitreous to greasy luster (Abstract, p. 703, and Section 2, p.
  704). Batoniite is non-fluorescent under both shortwave and longwave ultraviolet light,
  brittle, with perfect cleavage on {011} and flaky fracture, and is slowly soluble in H2O
  at room temperature; Mohs hardness and experimental density could not be measured due to
  small crystal size, scarcity of pure material, and slow solubility in water, while the calculated
  density is Dcalc = 1.949 g cm-3 on the basis of the empirical formula and single-crystal
  X-ray diffraction unit-cell volume (Abstract, p. 703, and Section 2, p. 704). Optically
  biaxial negative (-), with refractive indices measured in monochromatic light at 589 nm
  of alpha = 1.4833(6), beta = 1.4948(6), gamma = 1.5019(5), 2V(meas.) = 71(1) deg (measured
  on a universal stage), and 2V(calc.) = 75.8 deg (calculated using the formula of Wright,
  1951); dispersion was not observed, extinction is inclined (~30 deg), optical orientation
  has X inclined ~60 deg to (011) with Y and Z nearly parallel to (011), and the mineral is
  non-pleochroic in transmitted light, yielding a superior Gladstone-Dale compatibility index
  of 1 - (Kp/Kc) = 0.0022 (Mandarino, 1981; Section 2, p. 704). Micro-Raman spectroscopy (Thermo
  Scientific DXR spectrometer, 532 nm diode-pumped solid-state laser at 6 mW, 100x objective,
  50 um pinhole, 10 s exposure x 100 accumulations, 4000-100 cm-1; Section 3.1, p. 704, and
  Section 4.1 and Figure 2, p. 706) shows a very strong band at 995 cm-1 (nu1 symmetric stretching
  of SO4 groups), a weak band at 1127 cm-1 with a shoulder at 1097 cm-1 (triply degenerate
  nu3 antisymmetric stretching of SO4), bands at 620 and 457 cm-1 (nu4 and nu2 bending of
  SO4), bands at 343 and 250 cm-1 (Al-phi [phi = OH, H2O] and lattice modes), a band at 1629
  cm-1 (nu2 bending of H2O groups), and a broad (O-H)-stretching band from 3750 to 2800 cm-1
  with components near 3623, 3487, and 3230 cm-1 (corresponding to O-H...O hydrogen-bond distances
  of 2.60 to >3.20 A by the empirical relation of Libowitzky, 1999). Quantitative wavelength-dispersive
  electron-microprobe analyses (CAMECA SX 100 at the National Museum, Prague; 15 kV, 8 nA,
  5 um beam diameter on an unpolished crystal surface, PAP matrix correction, average of n
  = 12 spot analyses; Section 3.2 and Table 1, p. 705; Section 4.2, pp. 706-707) yielded mean
  Al2O3 33.48 wt% (range 31.60-36.28, SD 1.17, normalized 30.17 wt%, standard sanidine Al
  Kalpha), Fe2O3 0.05 wt% (0-0.18, SD 0.07, normalized 0.05 wt%, standard hematite Fe Kalpha),
  SO3 33.00 wt% (30.86-36.97, SD 1.55, normalized 29.74 wt%, standard celestine S Kalpha),
  measured Sum = 66.53 wt% (62.46-73.25, SD 2.64), stoichiometric H2O*calc = 44.41 wt% (normalized
  40.04 wt%), unnormalized Total = 110.94 wt%, and normalized Total = 100.00 wt% (the high
  unnormalized analytical total reflects partial dehydration under the high vacuum of the
  electron microprobe). The empirical formula calculated on the basis of (Al + Fe + S) = 13
  apfu is (Al7.98Fe3+0.01)sum=7.99(SO4)5.01(OH)13.95(H2O)18 * 5H2O, with an atomic Al/S ratio
  of 1.59(4) matching the ideal value of 1.60 (Abstract, p. 703, and Section 4.2, pp. 706-707).
  Crystallizes in the triclinic system, space group P-1 (#2), with single-crystal X-ray diffraction
  unit-cell parameters (Bruker D8 Venture diffractometer, Photon III CCD detector, microfocus
  MoKalpha radiation lambda = 0.71073 A, T = 293(2) K, crystal size 0.150 x 0.138 x 0.040
  mm, refined from 9840 reflections above 20sigma(I) with 4.79 deg < 2theta < 54.90 deg; Section
  3.3 and Table 2, pp. 705-706) a = 9.1757(6) A, b = 12.0886(9) A, c = 20.9218(15) A, alpha
  = 82.901(3) deg, beta = 87.334(3) deg, gamma = 86.999(2) deg, V = 2297.8(3) A3, Z = 2, and
  a:b:c = 0.7590:1:1.7307. Structure solution by direct methods (Shelxtl) and anisotropic
  refinement (Shelxl-2018; H atoms refined isotropically with O-H distance restraints) converged
  to R1 = 0.0916 for 8118 reflections with Fo > 4sigma(Fo) and R1 = 0.1096 (wR2 = 0.1837,
  GooF = 1.233) for all 10076 unique reflections out of 65912 measured (2theta_max = 55.10
  deg, Rint = 0.0822, Rsigma = 0.0566) with 811 refined parameters (and 60 restraints reported
  in the Abstract, p. 703, though omitted from Table 2, p. 706) and maximum/minimum residual
  electron density +1.03 (at 1.47 A from O(43)) and -0.69 e A-3 (at 0.87 A from H(19)). The
  crystal structure (Section 4.3, pp. 707-711, Tables 3-4, pp. 707-709, and Table S1, p. 708)
  contains two symmetry-independent centrosymmetric [Al8(OH)14(H2O)18]10+ octameric polyoxocations
  (Al(1)-Al(4) and Al(5)-Al(8) centered at (0, 1/2, 1/2) and (1/2, 0, 0), respectively), each
  formed by a flat brucite-like core of four edge-sharing Alphi6 octahedra — two central Al(OH)6
  (Al(1), Al(5)) and two peripheral Al(OH)5(H2O) (Al(2), Al(6)) — decorated on opposite sides
  by four corner-sharing Al(OH)2(H2O)4 (Al(3), Al(7)) and Al(OH)(H2O)5 (Al(4), Al(8)) octahedra
  (individual Al-O distances 1.825(4)-1.976(4) A, mean <Al-O> = 1.892-1.903 A, bond-valence
  sums 3.04-3.15 vu), linked through an extensive hydrogen-bonding network (O...O = 2.625(6)-3.112(7)
  A in Table 4) to five independent interstitial (SO4)2- tetrahedra (S(1)-S(5), individual
  S-O = 1.441(4)-1.484(4) A, mean <S-O> = 1.456-1.470 A, BVS = 6.08-6.30 vu) and five "free"
  H2O molecules (Ow(1)-Ow(5)). The five strongest X-ray powder diffraction lines collected
  in a Gandolfi-like geometry with CuKalpha radiation (Abstract, p. 703, and Table S2, p.
  709) [dobs in A (Irel, hkl)] are 10.42 (s, 0 0 2), 8.75 (s, 1 0 1), 7.93 (ms, 0 1 2), 4.770
  (m, -1 2 1, 1 2 0), and 4.324 (m, indexed as 2 0 1, -2 0 2, 1 0 4 in the Abstract, p. 703,
  vs 2 0 1, -2 0 2, 1 0 -4 in Table S2, p. 709, where dobs = 9.21 A [1 0 0] and 3.679 A [-1
  0 5] are also rated m [medium]). No biological or microbial interaction data are reported
  in the type mineralogical description.
