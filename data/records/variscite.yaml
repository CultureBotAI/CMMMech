mechanisms:
- id: abiotic_variscite_precursor_crystallization
  name: Abiotic crystallization of variscite in a mixed phosphate assemblage
  process: other
  microbial: false
  description: An amorphous aluminum-phosphate precursor crystallized into a mixed variscite/metavariscite
    assemblage during heating at 100 degrees C. The characterized 21-day solid contains both polymorphs;
    the study does not establish an isolated pure-variscite product or a variscite-specific phosphate-removal
    yield.
  context: Abiotic batch experiments mixed 5 mL of 0.1 M Al(NO3)3·9H2O solution with 5 mL of 0.1 M KH2PO4
    plus 0.09 M KOH. For the 100 degrees C arm, solutions were preheated to 98 degrees C, mixed in preheated
    Teflon-lined reactors, sealed immediately and placed in the oven; reactors were shaken three times
    per day. The reported mixed-fluid pH of about 1.6 was measured at 25 degrees C, not in situ at 100
    degrees C. Samples were quenched to 25 degrees C before analysis; solids were centrifuged, washed
    three times with Milli-Q water and dried at room temperature. There was no inoculated arm, microbial
    taxon or biological control. This was a laboratory precipitation experiment, not demonstrated industrial
    phosphorus recovery.
  evidence:
  - source_ref: roncal2009
    supports: support
    explanation: Methods p.5198; Table 1, Figure 1, Section 3.1 and Figures 3–6 identify the aluminum
      series. XRD Figure 3b and SEM Figure 4a support coexisting variscite and metavariscite after 21
      days. The 12-hour solid at 50 or 100 degrees C remained amorphous, and Figure 5 shows an amorphous
      100 degrees C specimen after 12 days; a phase was not identified solely from Al/P chemistry.
  - source_ref: roncal2009
    supports: partial
    explanation: The 150 degrees C, 12-hour solid comprised berlinite and a hydrous aluminum phosphate;
      the 200 degrees C, 12-hour solid was reported as berlinite. These are different temperature arms,
      not proof of quantitative conversion of an isolated variscite feed. No refined variscite/metavariscite
      phase fractions, phase-specific mass balance or replicate-based recovery uncertainty are reported.
  - source_ref: roncal2009
    supports: partial
    explanation: Tables 2–3 and Section 3.3 distinguish measured aqueous chemistry from PHREEQC saturation
      calculations. The thermodynamic calculation omitted metavariscite and phosphosiderite because data
      were unavailable. Near-variscite saturation therefore does not establish exclusive variscite precipitation,
      pure-phase equilibrium or field control of phosphate. Initial solution depletion into amorphous
      solids is not a crystalline-variscite yield.
  - source_ref: roncal2009_author_copy
    supports: context_only
    explanation: Complete original graphics and methods are available in this author-hosted copy. The
      journal copy and thesis reproduction represent the same experiment, including the distinct iron-phosphate
      arm curated under strengite.
