id: cmmmech:cavansite
name: Cavansite
material_kind: mineral
description: Cavansite is a hydrated calcium vanadyl silicate mineral, Ca(V4+O)(Si4O10)(H2O)4, approved
  as IMA 1967-019 and retained in the September 2026 IMA list. It is a distinct species from pentagonite
  despite their related composition. The primary Oregon description and later natural-crystal work
  support a porous silicate framework containing vanadyl groups, calcium and water. Pcmn in the original
  description and Pnma in the 2012 study are different settings of the same orthorhombic space-group
  type, with the a and c axes interchanged. The 2009 proposed H3O+/OH-bearing formula is disputed
  by the 2012 hydrogen-bond refinement, and is not substituted for the current IMA formula. Natural-crystal
  heating experiments support protocol-dependent abiotic dehydration, without a microbial mechanism,
  mineral-specific recovery yield or industrial deployment. No criticality designation is inherited
  from vanadium or other constituents.
