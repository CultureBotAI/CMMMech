  description: Causal pathway linking representative Acidithiobacillus ferrooxidans rus-operon proteins (Cyc2 AFE_3153/DN052_11975, Swiss-Prot rusticyanin AFE_3146, and Cyc1 AFE_3152 in reference proteomes UP000001362 and UP000248886) for the ferrous-sulfate-grown Bor sulfide-ore isolate (10 mL inoculum in 190 mL sterile basal medium with 2 g Bikita pegmatite spodumene powder [90.1% spodumene LiAlSi2O6, 7.2% quartz, 2.7% albite; labeled 2% w/v though 2 g in 200 mL total liquid is 1% w/v] at static 23 C and stable pH 1.8 for 30 days without supplemental H2SO4 or exogenous Fe/S substrate) to the refractory low-extraction endpoint (6.5 mg/L Li [~1.2%] and 3.3 mg/L Si inoculated versus 5.8 mg/L Li [~1.1%] and 2.4 mg/L Si in the uninoculated control, within the ~10% error bars, with post-leach residue retaining 92.7% spodumene, 5.1% quartz, and 2.2% albite without secondary phases) in Kirk et al. (2024).
