  url: https://handbookofmineralogy.org/pdfs/melanterite.pdf
  accessed_on: '2026-10-15'
- id: peng2023
  title: >-
    Peng, R., Shen, J., Li, S. and Liu, H. (2023; online 2022).
    Sediment-isolated Comamonas terrigena strain HJ-2: a novel
