    node_type: CHEMICAL_ENTITY
    description: Anoxic modified Ravot medium (initial pH 7, 0.05% w/v Na2S.9H2O, supplemented with phosphate) inoculated at 5 x 10^7 cells/mL and challenged with 5 mM FeSO4 at 85 C for up to 160 hours, where cell-derived sulfide/polysulfide flux and iron-phosphate-bearing cell debris/vesicles interact with dissolved Fe(II) (whereas cell-free controls yielded only amorphous FeS).
    protein_grounding_status: NOT_APPLICABLE
  - id: extracellular_greigite_mixed_mineral_assemblage
    label: Extracellular greigite (Fe3S4; IMA:1963-007) in bulk S0 assemblage (41% greigite, 49% pyrite, 11% FeS by 160 h XANES) vs sparse L-cystine nanocrystals (144 h HRTEM/SAED)
    node_type: MATERIAL_OR_PHASE
    description: 'Sulfur-source-dependent extracellular mineral products in Gorlas et al. (2022): in the 1 g/L elemental-sulfur arm, 160-hour bulk Fe K-edge XANES fits 41% greigite, 49% pyrite, and 11% FeS (101% printed sum in Table 1; 98% vs 99.7% confidence-interval label discrepancy); in the 1 g/L L-cystine arm, 144-hour HRTEM and electron diffraction (Figure 3D-F) identify sparse greigite nanocrystals alongside poorly ordered FeS and iron phosphates without pyrite (and below the ~5% 160-hour bulk XANES limit in Figure 2 / Table 1).'
    protein_grounding_status: NOT_APPLICABLE
