  evidence:
  - source_ref: bakhtiari2008
    supports: support
    explanation: Section 2.3 and Table 3 report biological versus sterile-flask copper extractions of 87% versus 39% at 2% wt/vol pulp after 16 days, 88% versus 45% at 4% after 23 days, and 81% versus 47% at 7% after 30 days. These within-condition comparisons support culture-associated enhancement, while the differing durations prevent a simple loading-only comparison. Sterilization procedure, verification of control sterility, replication and uncertainty for these tests are not specified. The source states explicitly that only biological treatments were then run in the reactors, so these flask controls are not matched continuous abiotic comparators.
  - source_ref: bakhtiari2008
    supports: partial
    explanation: Table 4 and section 3.2 report final-stage copper extractions of 89.7% for 2% wt/vol feed at 32 degrees C and 2.7 days overall residence time, 90.3% for 4% feed at 32 degrees C and 4 days, and 86.8% for 7% feed at 34 degrees C and 6 days. Residence time is for the two-stage system, not each vessel. These are source-reported extraction values for the preleached experimental feed, not independently reconstructed total-raw-dust recovery or a purified product yield. Table 4 labels its values maxima; Figure 5 shows higher earlier extraction points in the startup interval, so tabulated maxima and plotted time-course values are not treated as interchangeable. Figure 5 uses solid-residue analyses, and aqueous Cu/Fe were measured by atomic absorption; no full uncertainty or copper mass-balance calculation is supplied.
  - source_ref: bakhtiari2008
    supports: partial
    explanation: Figures 2–4 and section 3.2 preserve important operational limits. At 7% feed, low redox potential and washout prompted longer residence times, a temporary return to batch operation and a 1000 mL pulp exchange between reactors. This intervention is part of the eventual 6-day result. The system lacked condensers for its first 78 days; even afterward the authors estimated about 10% volume loss per reactor and added no continuous-run makeup water. Thus rising dissolved concentrations are not direct measures of extraction efficiency. Reactor solids eventually reached 9% wt/vol despite 7% feed. The early unadapted culture also showed no observed growth at 5% dust, according to section 3.1. Redox potential was used as an activity proxy rather than a species- resolved measure of growth. Tables 1–2 report bulk assays and mineral-associated copper proportions without a reconciled phase-to-element balance; no mineral-specific recovery fraction is inferred from those proportions.
