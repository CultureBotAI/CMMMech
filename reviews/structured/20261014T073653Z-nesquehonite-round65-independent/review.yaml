limitations:
- Matched control mineral results, culture replicate counts, full LE1 strain authentication
  and raw instrument data remain unavailable in the inspected 2019 article.
- Table 3 totals, pH input and hydration-ratio conflicts are retained. No normalized
  phase yield or molecular mechanism is inferred.
- The Power2007 comparison uses different water chemistry and a different microbial
  enrichment; nutrient matching is not demonstrated, and its abiotic result is not
  a direct refutation of LE1-associated occurrence.
- Field-only Figures 1/3 were not separately rendered for this culture-focused review.
  Relevant culture plots, comparison tables and the field/culture separation in the
  original text were inspected.
- The retrieved 2019 XML has no supplementary-material elements; this is a scoped
  observation rather than proof that no supplementary or author-held data exist.
- Literature search was finite; newly surfaced papers are future handoff leads only,
  not a systematic review.
notes:
- No major, blocker, minor or informational curation findings were substantiated;
  no record corrections or curation-history mutations were made by the reviewer. Source
  limitations are already represented in maintained evidence explanations.
- Working-tree target/context hashes were rechecked immediately before authorship
  of this review content. Saving this review does not convert those inputs into committed
  bytes or claim validation proves scientific truth.
- Evidence snapshot hashes identify the retained primary and authority files personally
  inspected. Raw PDFs, renderings and temporary command logs remain outside Git; the
  committed source dossier preserves acquisition provenance.
