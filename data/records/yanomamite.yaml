id: cmmmech:yanomamite
name: Yanomamite
material_kind: mineral
description: >-
  Yanomamite is the hydrated indium arsenate mineral species
  In(AsO4)(H2O)2, approved as IMA 1990-052 in the September 2026
  IMA-CNMNC list. Botelho and colleagues (1994) characterized natural
  crystals from quartz-topaz greisen at the Mangabeira tin deposit,
  Goiás, Brazil, using microscopy, electron-microprobe analysis and
  single-crystal and powder X-ray diffraction. The orthorhombic Pbca
  assignment is supported by natural specimens and a separate synthetic
  comparator; a matching chemical formula alone does not identify the
  mineral. Natural crystals contain minor Fe and Al and occur intergrown
  with or coated by indium-bearing scorodite. Even the three selected
  single crystals retained minor scorodite, whereas the selected powder
  material showed no significant scorodite reflections. Water in the
  reported empirical composition was calculated rather than directly
  measured because of these impurities. The authors considered both
  supergene and hydrothermal origins, favoring a hydrothermal association
  with the main cassiterite stage while explicitly describing the origin
  discussion as speculative. The actual indium source and transport were
  not established. These natural alteration associations do not constitute
  a microbial transformation experiment. This mineral is distinct from
  elemental indium, scorodite, mixed greisen feed and industrial secondary
  resources; geological replacement does not make it processing waste.
  The characterized grains establish neither a bulk resource grade nor
  extraction performance. No microbial mechanism, industrial recovery or
  constituent-derived criticality designation is assigned.
