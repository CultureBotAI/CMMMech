limitations:
- The final journal PDF was not acquired. Complete author dissertation Chapter2 and
  DOI-matched official supplement were inspected; they represent one study, not independent
  replication.
- The assay incubation temperature is not reported separately from32degreesC culture
  growth. Common inoculum and destructive tube replication do not establish independent
  culture reproducibility.
- Filtered concentrations and below-detection Pb do not establish complete dissolution,
  isolated recovery or a closed inventory. Source endpoint times, final Fe(III) and
  luminescence assignments remain unresolved.
- Pb-enriched granules occur in prepared cell sections; phosphate-buffer fixation
  precludes assigning metabolic P origin from these images alone. No confirmed artifact,
  named pure Pb-phosphate or ATPase causal mechanism is established.
- Official SI has visible revision markup, drafting note and duplicated deleted table.
  Source clarification remains useful; no source value was silently repaired.
- Parent disclosed a spacing-only source Markdown update after initial capture. Initial
  inspect remains preserved externally; fresh inspect binds the final dossier while
  target/history hashes remain identical.
- Notice and local-lineage searches were bounded; no absence outside the documented
  scope is asserted.
