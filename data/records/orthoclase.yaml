id: cmmmech:orthoclase
name: Orthoclase
material_kind: mineral
description: Orthoclase is a monoclinic potassium feldspar mineral with ideal formula KAlSi3O8, distinct
  from microcline, the broader potassium-feldspar family, traded feldspar and potash. The September 2026
  IMA list marks it approved by a 1962 special procedure; this is not a numbered approval accession. The
  curated experiment concerns a source-identified natural sodium-bearing orthoclase crystal, not an ideal
  chemically pure endmember. Only abiotic hydrothermal dissolution is accepted here; mineral composition
  does not establish criticality or microbial activity.
