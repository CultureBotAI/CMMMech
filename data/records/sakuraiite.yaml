id: cmmmech:sakuraiite
name: Sakuraiite
material_kind: mineral
description: >-
  Indium-dominant copper-zinc-iron-indium-tin sulfide mineral with current
  September 2026 IMA-CNMNC approved formula (Cu,Zn,Fe)3(In,Sn)S4 and approval
  number IMA 1965-017. Originally described by Kato (1965) from the Kanagase
  vein group of the Ikuno mine, Asago-cho, Hyogo Prefecture, Japan, with a
  tetragonal or pseudotetragonal subcell (a = 5.455, c = 10.91 A, Z = 2) and an
  Ag-rich formula (Cu,Zn,Fe,Ag)3(In,Sn)S4, type material from the Ikuno mine
  (including Kato's 1965 holotype and specimen NSM M-15843 from the Senju-hon
  vein) was chemically re-examined by Shimizu, Kato, and Shiozawa (1986).
  Electron-microprobe analyses (Table 1: 5 sakuraiite analyses SK 1-5, 3
  coexisting indium-bearing stannite/petrukite analyses ST 1-3, and 2 indium-
  bearing kësterite analyses KS 1-2, plus step-scan traverses across zoned grains
  in Figure 3) showed that Kato's 1965 elevated Ag values (3.5-4 wt%) were
  erroneous (actual Ag 0.10-0.15 wt% in sakuraiite) and established the revised
  formula (Cu,Zn,Fe)3(In,Sn)S4 with In:Sn atomic ratios reaching 89:11 (analysis
  SK 2: Cu 1.221, Ag 0.004, Fe 0.436, Zn 1.302, Mn 0.001, Cd 0.032, Sn 0.189,
  In 0.817, S 3.987 on an 8-atom basis) via coupled (Zn,Fe)In-for-CuSn
  substitution toward a hypothetical (Zn,Fe)2CuInS4 end-member. Shimizu et al.
  (1986) did not report new X-ray diffraction measurements, and Kissin and Owens
  (1989, pp. 684-686) subsequently examined Ikuno mine specimens, identified
  orthorhombic Pmn21 petrukite and an unindexed Zn > Fe phase, and noted that
  holotype sakuraiite still required definitive X-ray diffraction
  characterization to resolve its crystal symmetry and structural relationship to
  petrukite. Distinct from petrukite, roquesite, stannite, kësterite, and
  elemental indium or tin; no criticality designation, microbial mechanism, or
  extraction yield is asserted.
