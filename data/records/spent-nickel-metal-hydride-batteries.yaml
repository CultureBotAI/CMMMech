    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000006375 for Gluconobacter oxydans 621H (NCBITaxon:290633; locus GOX0265) as the strain-sequenced reference representative for parent mechanism taxon Gluconobacter oxydans (NCBITaxon:442; strain DSM 3503).
    evidence:
