mechanisms:
- id: fungal_araxa_phosphate_mobilization
  name: Fungal mobilization of phosphate from Araxa rock phosphate with fluoride inhibition
  process: bioleaching
  description: Growth of the source-designated Aspergillus niger FS1 culture was associated with medium
    acidification and soluble phosphorus release from a characterized Araxa rock-phosphate feed. Added-fluoride
    experiments showed decreasing phosphate solubilization under the tested conditions. These observations
    support a bounded fungal mobilization process, without isolating an exclusive acid pathway or establishing
    isolated-product recovery.
  context: Laboratory 125 mL flasks contained 50 mL NBRIP medium and 3 g/L Araxa rock phosphate from Brazil,
    with reported particle size below 75 micrometres. The paper describes the feed as mainly fluorapatite
    with some hydroxyapatite from XRD and chemical analysis, with 13.97% P. Flasks received 1 x 10^6 conidia
    and were incubated at 32 degrees C and 160 rpm. Medium pH was adjusted to 7 before adding the P source;
    the kinetic plot starts around pH 5.5, so these values are not interchangeable. The 10-day kinetics
    used three sampled flasks per time point, 0.45-micrometre filtrates, and uninoculated flasks at the
    beginning and end for dissolved-element determinations. Separate 60-hour fluoride-dose assays used
    either rock phosphate or soluble K2HPO4; their biomass and organic-acid results must not be treated
    as measurements from the rock-fed arm. No strain-level identifier or commercial-product specification
    is inferred.
  microbial: true
  organisms:
  - id: NCBITaxon:5061
    label: Aspergillus niger
  evidence:
  - source_ref: mendes2013
    supports: support
    explanation: Materials and Methods, rock characterization, kinetics, Table 2 footnote and Figure 1
      support the stated feed, assay conditions and solution-phase phosphorus increase. Figure 1 and Results
      show approximately 80 mg/L soluble P at 60 h, followed by non-monotonic concentrations during continued
      incubation; the figure gives three-replicate means and standard deviations. This is mobilized phosphorus
      in filtrate, not recovered phosphorus mass or complete dissolution of the feed.
  - source_ref: mendes2013
    supports: partial
    explanation: The uninoculated comparison is described only at the beginning and end, and Figure 1
      does not display a time-matched abiotic trajectory or acid-matched comparison. In Figure 4a, adding
      NaF over 0-50 mg F/L lowered soluble P after 60 h; the dose design used three replicates at the
      25 mg/L central point rather than declaring every dose triplicated. Methods place biomass and organic-acid
      determinations in the soluble-K2HPO4 arm. Consequently the data do not establish the same organic-acid
      or growth response directly in rock-fed cultures. Reprecipitation discussed for the fluctuating
      dissolved P remains a proposed explanation. Supplementary numerical tables were not acquired as
      usable full text, and no values are imported from them.
