  evidence:
  - source_ref: oloughlin_2019
    supports: support
    explanation: Sections 2.1-2.2 and 3.3, Table 1, Figures 5-6 and Tables 2-3 link formate consumption, acid-extractable Fe(II), rising pH and mineral changes. At day 62 the chloride and sulfate formate arms report respectively 57.6 +/- 0.2 and 55.1 +/- 2.4 mM total Fe(II), versus 0.8 +/- 0.1 and 0.7 +/- 0.1 mM aqueous Fe(II). Total Fe(II) is the 0.75 M HCl, one-week extract measured by ferrozine; aqueous Fe(II) is measured on 0.22 micrometre filtrate. These fractions are not interchangeable. pXRD and Mossbauer analysis identify carbonate green rust and no detected residual lepidocrocite at the endpoint; the sulfate arm also has earlier sulfate-green-rust reflections. Nondetection does not quantify a zero residue or guarantee product purity.
  - source_ref: oloughlin_2019
    supports: partial
    explanation: 'The statement that reduction was complete by day 55 means Fe(II) accumulation had plateaued, not that all starting Fe(III) became Fe(II): green rust retains Fe(III). The separate 72-day survey produced 3.6 mM Fe(II) without an exogenous donor and less than 7 mM with several ineffective donors, so absence of the preferred donor is not an absolute zero. Figure 1 also includes a distinct near-baseline sterile-control curve; no numerical sterile endpoint is adopted, and its unspecified donor/salt conditions prevent treating it as the matched focused-formate control. The H2/Pd/AQDS/carbonate abiotic surrogate produced more Fe(II) than the H2 biological treatments and also carbonate green rust; it is not a chemistry-matched formate control. Product identity alone is therefore not a unique biosignature. AQDS exposure and missing matched cell-free formate controls limit attribution to direct cell-mineral transfer or a specific enzyme. Table 2 fitted spectral areas are not mass-based
      mineral recovery yields. Modeled carbonate activities in Section 2.3 were not measured carbonate concentrations.'
  - source_ref: sklute_2023
    supports: context_only
    explanation: The separate Ax17 study used 55 degrees C, hydrogen and synthetic nanophase lepidocrocite, not the CN32/formate commercial feed. It reports dark nonmagnetic material with amorphous Fe-rich nanospheres but no significant oxalate-extractable Fe(II) increase over controls; lepidocrocite Mossbauer spectra remained nearly unchanged, the main text states bulk XRD was unavailable, and small amounts of green rust could only not be excluded. These analytical and phase limits show that transformation products and recoverable Fe(II) cannot be generalized across organisms, media, feeds or extraction methods; they do not directly refute the CN32 formate result. Supplementary Figure S16 inconsistently names lepidocrocite in its caption while describing akaganeite/NaCl and being assigned to akaganeite in the main text; that ambiguous panel is not treated as measured lepidocrocite XRD evidence.
