  title: IMA-CNMNC. The New IMA List of Minerals, September 2026, Sauconite row, PDF p193. Retained original
    re-inspected on the access date.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
