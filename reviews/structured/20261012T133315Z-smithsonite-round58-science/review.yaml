limitations:
- No independent experimental replication, raw instrument data or wet-state diffraction;
  qualitative source assignment only.
- Detailed culture methods in DOI10.1016/j.jenvman.2023.119868 remain unavailable;
  experimental stock authentication and physical assay temperature are unresolved
  and correctly omitted.
- No matched causal precipitation controls; cell-associated observation does not establish
  urease necessity or cell-surface nucleation.
- No separate SI was identified in the complete primary article and declared landing
  inventory; this is not a universal absence claim. Earlier unavailable natural-biotransformation
  studies were not reassessed.
- Bounded hidden/ignored/followed searches exclude unextracted binaries and unrelated
  filesystem roots; missing cited candidates remain disclosed.
- Independent review concerns smithsonite only; this is not self-review or acceptance
  of this reviewer’s separate spentSCR record.
