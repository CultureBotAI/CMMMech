id: cmmmech:virgilite
name: Virgilite
material_kind: mineral
description: >-
  Virgilite (IMA 1977-009) is an IMA-accepted lithium aluminosilicate framework
  mineral with a stuffed beta-quartz structure, with IMA September 2026 Master
  List formula LiAlSi2O6 and holotype solid-solution composition
  Li0.61(Si2.37Al0.60Fe0.02P0.01)O6 (approximately 61 mol% LiAlSi2O6 and 39 mol%
  SiO2; Table 1, p. 463 holotype NMNH 2143-17 electron microprobe oxides SiO2
  77.29, Al2O3 16.57, FeO 0.64, P2O5 0.57 wt% with Li2O = 4.93 wt% calculated by
  difference, total 100.0 wt%, supported by ~5 wt% Li2O from laser
  spectrographic analysis of sample 2143-3). Described by French, Jezek, and
  Appleman (1978) from the
  Macusani peraluminous rhyolitic volcanic glass (14°S, 70°30'W), Carabaya
  Province, Puno Department, southeastern Peru (holotype NMNH 2143-17), where it
  occurs as colorless euhedral microphenocrysts (up to 50 um across, plus
  fibrous rosette-like overgrowths) with quartz, andalusite, sillimanite,
  and biotite. Hexagonal (space group P6222 or P6422), with a =
  5.132(1) Å, c = 5.454(1) Å, V = 124.41(2) Å3, Z = 1, Dcalc = 2.46 g/cm3,
  Vickers microhardness VHN = 681–722 kg/mm2, and uniaxial (–) optics with n =
  1.520 and birefringence 0.005–0.006.
