id: cmmmech:graulichite-la
name: Graulichite-(La)
material_kind: mineral
description: >-
  IMA-approved lanthanum iron arsenate hydroxide mineral of the dussertite group in the
  alunite supergroup (IMA 2020-093; status A, Approved 2021; full description published June
  2022) with ideal end-member formula LaFe3+3(AsO4)2(OH)6 (requiring As2O5 33.49 wt%, Fe2O3
  34.90 wt%, La2O3 23.74 wt%, H2O 7.88 wt%, total 100.00 wt%; Biagioni et al., 2022, European
  Journal of Mineralogy 34:365-374). Represents the La-dominant analogue of graulichite-(Ce)
  and the Fe3+-dominant analogue of arsenoflorencite-(La) in accordance with Levinson REE
  nomenclature. Discovered on a specimen originally collected in the late 1960s by Jacques
  Emile Dietrich in the active underground workings of the Patte d'Oie mine, Bou Skour
  Cu-hydrothermal mining district, Djebel Saghro mountain range, ~50 km southeast of
  Ouarzazate, Anti-Atlas, Morocco, where it formed by oxidation of primary sulfide-bearing
  quartz veins (chalcopyrite, bornite, chalcocite, galena, and tetrahedrite-group minerals)
  and occurs on malachite grown on iron oxides in association with malachite, agardite-(La),
  conichalcite, and an undetermined synchysite-like REE carbonate; the holotype specimen is
  deposited in the Museo di Storia Naturale, University of Pisa, Calci (Pisa), Italy, under
  catalogue number 19924. Forms yellow rhombohedral crystals up to 0.1 mm in size (internally
  porous and composed of very thin fragile laminae) with a light-yellow streak, resinous
  lustre, transparent diaphaneity, very weak pleochroism from light yellow to yellow,
  non-fluorescence, brittle tenacity, irregular fracture, no observed cleavage or parting,
  estimated Mohs hardness ~3.5, Gladstone-Dale mean refractive index n = 1.889 (Domain #1)
  and 1.928 (Domain #2), and calculated density Dcalc = 3.907 g/cm3 (for Domain #1) and
  3.962 g/cm3 (for Domain #2). Micro-Raman spectroscopy (532 nm laser, 50x objective,
  6.25 mW; Figure 3) displays bands at 846 cm-1 (strongest band, nu1 symmetric stretching of
  (AsO4) groups), 995 and 1092 cm-1 (nu1 and nu3 stretching modes of (SO4) and (PO4) groups),
  714 cm-1 (O-H deformation modes), 466 cm-1 (strongest bending band, nu4 mode of (AsO4)
  groups with a low-wavenumber nu2 (SO4) shoulder), 565 and 618 cm-1 (nu4 modes of (SO4) and
  nu2 modes of (PO4) groups), 330 cm-1 and lower wavenumbers (M-O and lattice vibrations), a
  broad weak O-H stretching band between 2900 and 3800 cm-1, an unattributed sharp feature at
  2906 cm-1, and a band at 1441 cm-1 interpreted as (SO4) overtone modes. Wavelength-
  dispersive electron microprobe analysis (JEOL JXA 8200, 20 kV, 10 nA, 1 um beam on an
  unpolished flat crystal surface due to fragility; Table 1) identified two chemically
  homogeneous domains (n = 4 spot analyses each) with low raw analytical totals due to crystal
  porosity: Domain #1 yielded Fe2O3 22.52(22) wt% (normalized 28.75 wt%), As2O5 18.55(28) wt%
  (norm. 23.68 wt%), La2O3 7.16(18) wt% (norm. 9.14 wt%), Al2O3 5.63(11) wt% (norm. 7.19 wt%),
  Ce2O3 4.28(13) wt% (norm. 5.46 wt%), SO3 3.90(16) wt% (norm. 4.98 wt%), P2O5 3.65(36) wt%
  (norm. 4.66 wt%), CuO 2.06(12) wt% (norm. 2.63 wt%), PbO 1.36(20) wt% (norm. 1.74 wt%), SrO
  0.97(9) wt% (norm. 1.24 wt%), CaO 0.79(2) wt% (norm. 1.01 wt%), K2O 0.25(2) wt% (norm.
  0.32 wt%), and H2Ocalc 7.22 wt% (norm. 9.22 wt%), total 78.34 wt% (norm. printed as
  100.00 wt%, arithmetic sum 100.02 wt%), giving on the basis of 6 cations and 14 O atoms per
  formula unit the empirical formula
  (La0.34Ce0.20Ca0.11Sr0.07Pb0.05K0.04)Sigma0.81(Fe3+2.16Al0.84Cu0.20)Sigma3.20(As1.23P0.39S0.37)Sigma1.99O14H6.13;
  Domain #2 yielded Fe2O3 28.60(128) wt% (norm. 34.19 wt%), As2O5 14.48(73) wt% (norm.
  17.31 wt%), La2O3 8.59(35) wt% (norm. 10.27 wt%), P2O5 4.89(55) wt% (norm. 5.85 wt%), Ce2O3
  4.87(31) wt% (norm. 5.82 wt%), SO3 4.40(56) wt% (norm. 5.26 wt%), Al2O3 3.41(36) wt% (norm.
  4.08 wt%), CuO 2.15(8) wt% (norm. 2.57 wt%), PbO 1.62(34) wt% (norm. 1.94 wt%), SrO
  1.46(30) wt% (norm. 1.75 wt%), CaO 0.69(8) wt% (norm. 0.82 wt%), K2O 0.40(8) wt% (norm.
  0.48 wt%), and H2Ocalc 8.10 wt% (norm. 9.68 wt%), total 83.66 wt% (norm. printed as
  100.00 wt%, arithmetic sum 100.02 wt%), giving
  (La0.38Ce0.22Sr0.10Ca0.09Pb0.05K0.06)Sigma0.90(Fe3+2.60Al0.49Cu0.20)Sigma3.29(As0.91P0.50S0.40)Sigma1.81O14H6.53.
  Crystallizes in the trigonal system, space group R-3m (#166), with single-crystal X-ray
  diffraction unit-cell parameters a = 7.252(13) A, c = 16.77(3) A, V = 764(3) A3, c : a =
  2.3125, and Z = 3 (refined isotropically with fixed Uiso and 7 parameters to R1 = 0.0956 for
  36 reflections with Fo > 4sigma(Fo) and R(all data) = 0.1222, wR(on Fo^2) = 0.2162, Goof =
  1.237 for 47 unique reflections up to 2theta = 31.75 deg from 118 measured on a
  0.040 x 0.035 x 0.030 mm lamina using MoKalpha radiation, Table 3; Gandolfi CuKalpha powder
  data refined from 13 reflections to a = 7.2469(9) A, c = 16.767(2) A, V = 762.59(17) A3).
  The alunite-type hexagonal tungsten bronze (HTB) layered structure (Tables 4-6) comprises
  12-fold-coordinated A sites (<A-O> = 2.78 A, s.o.f. La0.95, BVS = 2.22 v.u.), octahedral B
  sites (<B-O> = 1.98 A, s.o.f. Fe0.94, BVS = 3.20 v.u.), and tetrahedral X sites (<X-O> =
  1.58 A, s.o.f. As0.70, BVS = 5.49 v.u., where an apparent bond-length inversion X-O(1) =
  1.65(9) A vs X-O(2) = 1.56(5) A x 3 is noted by the authors as an artifact of low data
  resolution). The eight strongest observed Gandolfi X-ray powder diffraction lines (dobs in
  A (Iobs; dcalc, Icalc, hkl), CuKalpha, Table 2) are 5.86 (m; 5.88, 60, 1 0 1), 3.045 (s;
  3.042, 100, 1 1 3), 2.511 (mw; 2.513, 17, 0 2 4), 2.239 (m; 2.238, 24, 1 0 7), 1.960 (mw;
  1.960, 24, 0 3 3), 1.813 (mw; 1.813, 23, 2 2 0), 1.689 (mw; 1.686, 5, 2 1 7), and 1.478 (m;
  1.479, 10, 0 2 10). No biological or microbial interaction data are reported in the type
  mineralogical description.
