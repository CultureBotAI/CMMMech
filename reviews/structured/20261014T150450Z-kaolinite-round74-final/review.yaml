    The acquired original does not expand the abbreviation or verify the mesylate
    salt form. The initial owner evidence explanation expanded it to desferrioxamine
    mesylate. Use the literal source-designated DFAM standard and retain the existing
    relative-calibration limitation; do not infer a specific chemical form.
