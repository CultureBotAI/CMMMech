mechanisms:
  - id: abiotic-pressure-transition
    name: Reconstructive pressure-induced transition in natural inderite
    process: other
    description: >-
      Single-crystal diffraction detected a transition from the ambient
      P21/c structure to the P21/n structure labelled inderite-II by
      the authors. They solved and refined the high-pressure structure
      and interpreted a boron coordination increase from three to four
      oxygen neighbours. The experimental label does not establish a
      separately approved natural mineral species. Recovery of the
      starting phase upon decompression is observed in this experiment;
      it does not establish a reversible industrial processing cycle.
    context: >-
      A single approximately 20 x 15 x 10 micrometre crystal from the
      Borax open-pit mine, Boron, California, was compressed in a
      membrane-driven diamond-anvil cell at ESRF ID15b using helium
      and ruby pressure calibration with uncertainty of 0.05 GPa.
      Table 1 reaches 17.04(5) GPa and includes three decompression
      points. The inspected methods do not specify a calibrated
      sample-temperature series. The separate 2024 neutron measurements
      at 280 and 10 K are not high-pressure measurements on this crystal.
      No organism, extraction yield, recovered boron product or concrete
      performance was measured by this pressure experiment.
    microbial: false
    evidence:
      - source_ref: comboni2023
        supports: support
        explanation: >-
          Accepted-manuscript Table 1 and sections 4.1, 4.3 and 5 put
          the last low-pressure point at 6.15(5) GPa and first
          high-pressure point at 6.45(5) GPa. Figure 3 identifies the
          high-pressure diffraction pattern at 6.45(5) GPa. The authors
          report an approximately 7% discontinuity after dividing the
          doubled high-pressure cell volume by two for comparison.
          Table 1 retains the high-pressure cell at 5.43(5) GPa during
          decompression and recovers the starting cell at ambient
          pressure; it does not locate a precise reverse-transition
          pressure. Table 2 reports fitted bulk moduli of 26.5(7) and
          41(5) GPa, respectively, using third-order Birch-Murnaghan fits.
      - source_ref: comboni2023
        supports: partial
        explanation: >-
          The abstract and section 3.1 instead give a 6.45-6.94 GPa
          transition interval, while also identifying the high-pressure
          cell at 6.45 GPa. The manuscript abstract gives 37(4) GPa for
          the high-pressure bulk modulus, conflicting with Table 2 and
          results at 41(5) GPa. Its section 4.3 mentions 17.41(5) GPa,
          beyond the last Table 1 point. These discrepancies remain
          unresolved; the tables are identified explicitly rather than
          silently harmonized into one precise threshold or maximum.
          Hydrogen sites were absent from the starting refinement model,
          and unavailable pressure CIFs/SI limit verification of detailed
          water-site assignments and bond-length changes. The reported
          coordination interpretation is not a directly tracked hydrogen
          mechanism or an oxidation-state change of boron.
      - source_ref: gatta2024
        supports: context_only
        explanation: >-
          Neutron methods and Tables 2-5 independently characterize the
          ambient-pressure structure at 280 and 10 K, locating fifteen
          independent hydrogen sites. A two-position O9w model with
          occupancies 0.60(10) and 0.40(10) was supported at 280 K but
          not at 10 K. Its cause remains unclear, with absorption
          correction limitations noted on p. 10. This is not independent
          replication of the pressure transition. Page 16 repeats the
          disputed 6.45-6.94 GPa interval; its contextual summary does
          not resolve the original paper's internal disagreement.
