- Phase-specific dissolution, Ce redox and pure-product recovery are not directly
  demonstrated.
- Original primary physical pages4-14 were visually inspected and earlier text read;
  no independent instrument, culture, sequence or full statistical reanalysis.
- Prior Madagascar science is unchanged and supported by the cited earlier independent
  review; this reviewer curated that older record and discloses the limited fresh-review
  scope.
