    cubic argentite.
  url: https://handbookofmineralogy.org/pdfs/acanthite.pdf
  accessed_on: '2026-10-14'
- id: klaus1999
  title: Klaus, Joerger, Olsson and Granqvist (1999). Silver-based crystalline
    nanoparticles, microbially fabricated. PNAS 96, 13611-13614. Complete
