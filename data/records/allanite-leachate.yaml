mechanisms:
- id: yeast_supernatant_oxalate_precipitation
  name: Yeast-produced oxalate precipitates REEs from prepared leachate
  process: biomineralization
  description: Oxalate-containing culture supernatant from engineered JL04, derived from source-named Issatchenkia orientalis SD108, induced precipitation and decreased dissolved REE concentrations in a chemically prepared allanite-derived liquor. The REE stage used centrifuged supernatant, not intact yeast or direct microbial ore leaching. The reported over 99% total-REE removal near a source-nominal 2.7 g/L oxalic-acid dose is solution depletion under laboratory conditions, not an ore-to-product or isolated-pure-product yield. Industrial deployment and general superiority over commercial oxalic acid were not established.
  context: 'Halleck Creek ore was density-concentrated, ground to a top size of 150 micrometres and HCl-leached at 75 degrees C, 30% solids by weight and a reported acid-to-solid ratio of 0.3:1 for 2 h. Hydrogen peroxide oxidation and staged NaOH additions removed Fe/silica and Al; REEs were precipitated at pH 8, redissolved using 12 M HCl, diluted to 310 mL and filtered to remove manganese hydroxide. Separately, JL04 glucose-fed SC-URA cultures were produced in 100 mL bioreactors at 30 degrees C, pH 4 and 10% dissolved-oxygen setting. Culture was centrifuged at 8000 x g for 30 min before use. Real-liquor tests compared source-labelled 22.00 and 42.70 g/L oxalate supernatants with 1 M commercial oxalic acid while mixing and maintaining pH 1.5 with 5 M NaOH. The workbook records sequential reagent additions and 1.5 mL withdrawals; initial liquid volumes were 95 mL in biological-reagent arms and 100 mL in the commercial arm. These dose points are not independent replicates: Methods state n=1
    per real-leachate condition. Real-liquor precipitation duration and temperature are not separately specified; overnight room-temperature conditions belong to the synthetic single-salt assays and are not transferred. No matched parental-supernatant or uninoculated-medium real-liquor comparator is documented in the inspected main article and Data 1. Species-level taxonomy does not resolve engineered-strain identity or the effects of the broth matrix.'
