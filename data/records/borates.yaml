id: cmmmech:borates
name: Borates
material_kind: commodity
description: Commercial borate raw materials, encompassing borate ores and refined borate products rather than a single ion or mineral species. USGS distinguishes natural borates such as colemanite and ulexite from refined borax and the associated boric-acid product stream. The commodity is distinct from elemental boron and from the separately qualified metallurgy-grade boron designation. The criticality entry records the named BGS/CMIC assessment, whose cover states that it does not constitute government policy. The microbial experiment below concerns one colemanite-bearing ore, not every borate or a purified product.
