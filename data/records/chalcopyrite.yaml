mechanisms:
- id: acidophile_concentrate_bioleaching
  name: Culture-dependent leaching of chalcopyrite concentrate
  process: bioleaching
  description: Living defined acidophile cultures promoted copper release from chalcopyrite concentrate in laboratory flasks. The initial Acidithiobacillus caldus plus Sulfobacillus thermosulfidooxidans pair gave the largest reported released-copper concentration. Cultures containing the stronger iron oxidizer Leptospirillum ferriphilum reached higher redox potentials, without maximizing copper release. This supports conditional bioleaching of a mineral-bearing feed; it does not establish a purified copper yield, quantitative chalcopyrite-phase conversion, or deployment of the defined consortium.
  context: Aitik-mine flotation concentrate contained 29.5% Cu. The authors report greater than 98% purity from aqua-regia digestion and elemental analysis, and note that bornite accompanies chalcopyrite at the deposit. Elemental analysis does not independently establish single-phase purity. The 50-100 micrometre fraction was washed with 0.1 M EDTA in 0.4 M NaOH, washed three times with acetone, dried overnight at 60 degrees C and heated for 10 h at 120 degrees C under nitrogen. Living A. caldus DSM 8584, S. thermosulfidooxidans DSM 9293 and L. ferriphilum DSM 14647 from separate axenic continuous cultures were tested singly and in every pair and three-species combination, alongside uninoculated controls. Four flasks per treatment contained 100 mL MAC medium initially at pH 1.8 and 2% w/v concentrate in 250 mL flasks, at 38 +/- 2 degrees C and 120 rpm. Inoculation was 10^7 cells/mL per species, so total cell loading differed among mixtures. Inoculated endpoints were 14 days after redox potential
    exceeded 400 mV versus Ag/AgCl, totaling 14-20 elapsed days. The heated HCl slurry-digest/AAS assay counted released copper in dissolved and precipitated fractions. Species identifiers below do not replace the experimental strain designations.
