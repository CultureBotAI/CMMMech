    - source_ref: ferrier2022
      supports: partial
      explanation: Representative strain-matched Aspergillus niger ATCC 1015 citrate exporter CexA for organic-acid excretion during transformation of synthetic Co-birnessite into lindbergite-assigned rosettes in Ferrier et al. (2022); cexA was not directly perturbed in the study.
  evidence:
  - source_ref: ferrier2022
    supports: support
    explanation: Figures 6-7 (page 673) compare fine uninoculated feed particles with rosette-like recovered solids, and EDXA detects Mn, O and Co in both, with C in the transformed material and K no longer detected there. These qualitative spectra do not quantify cobalt incorporation or establish its oxidation state, binding site or chemical phase. Microscopy examples are reported as representative of several examinations, not a quantified transformed-particle fraction.
  - source_ref: ferrier2022
    supports: support
    explanation: Figure 8 (page 674) matches the uninoculated control to birnessite and inoculated recovered solids to lindbergite. The caption heading incorrectly names Nkamouna laterite; its detailed caption, Results, traces and synthetic-arm methods identify Co-birnessite. Replicates were pooled for a subsample. The methods specify Cu-Kalpha XRD of ground powder on PVC slides over 3-60 degrees 2-theta, unlike the Co-radiation, acetone-smear XRPD used for the natural laterite. Reference-pattern agreement supports a source-assigned product, not quantitative phase purity or a detection limit for residual feed.
  - source_ref: ferrier2022
    supports: partial
    explanation: Table 2 reports day-14 surface pH 2.17 +/- 0.03 (n=6) for inoculated Co-birnessite agar, 2.26 +/- 0.02 (n=3) for mineral-free fungal agar, 6.43 +/- 0.04 (n=2) for uninoculated mineral agar and 5.32 +/- 0.02 (n=3) for uninoculated mineral-free agar; uncertainties are reported SD. The discussion's general increased-pH explanation does not match the lower fungal Co-birnessite mean relative to its fungal control. The 94.1% tolerance index is a dry-biomass ratio and 1.47 is a colony-extension-rate ratio, not metal extraction or recovery.
  - source_ref: ferrier2022
    supports: partial
    explanation: Procedures on page 675 recover debris by approximately 70 degrees C water washing followed by at least 48 hours desiccation. Preparation can affect hydration; in-culture phase identity is not independently established. The authors' total-transformation/solubilization wording rests on morphology and recovered diffraction, without dissolved-metal or total product mass balance. No measured oxalate time course, pH-matched acid-only, killed-biomass or cell-free metabolite controls isolate the proposed route. Direct Mn/Co oxidation-state or cobalt-site measurements are absent from the reported analyses; inferred reduction and a mixed oxalate lattice remain mechanistic interpretations.
  - source_ref: atcc1015
    supports: context_only
    explanation: The collection resolves ATCC 1015 as A. niger with strain designation A1144 3528.7 and CBS 113.46. This supports catalogue identity, not authentication of the paper's experimental stock.
  - source_ref: ncbi_niger
    supports: context_only
    explanation: TaxID 5061 resolves the species name, not strain-specific performance.
- id: cobalt_sorption_by_fungal_birnessite_bearing_composite
  name: Cobalt sorption and surface oxidation by a freeze-dried fungal birnessite-bearing composite
  process: biosorption
  description: A laboratory-grown Paraconiothyrium sp. WL-2 culture produced a poorly crystalline Mn-oxide and fungal-tissue composite assigned by the authors primarily to birnessite. After recovery and freeze-drying, this material removed aqueous Co from nitrate solution; surface XPS was interpreted as sorbed Co(III). The microbial designation refers to the origin and retained biomass of the sorbent, not demonstrated active metabolism during cobalt treatment. The downstream experiment used prepared powder, not a growing culture. Neither a pure birnessite phase, intrinsic advantage of biological origin, isolated cobalt product, regeneration yield nor industrial recovery was established.
  context: Sasaki2008 grew the wetland isolate in 150-200 ml PY medium in 500 ml flasks with 150 mg/L initial Mn(II), initial pH 6.6 buffered with PIPES, and 0.5 mg wet fungal inoculum as printed. Cultures were shaken at 100 rpm and 25 +/- 2 degrees C, shielded from light, for up to two weeks. Precipitates were collected on a 5 micrometre filter and rinsed; the next preparation sentence calls the material freeze-dried for 24 hours the filtrate, an unresolved wording ambiguity. The recovered powder was stored at 4 degrees C. Sorption used 0.020 g biogenic or 0.015 g chemically prepared oxide in 0.150 L solution, nominally 1 mmol/L solid Mn, 100 mmol/L KNO3, PIPES-buffered initial pH 6.5, 25 degrees C and 100 rpm shaking. Residual dissolved Co and Mn were measured after 0.2 micrometre filtration; time courses were duplicated. Methods give initial Co up to 175 micromol/L and 100-300 hours, whereas Figure 7 begins near 0.21 mmol/L and extends beyond 300 hours. These are source discrepancies,
    not a reconciled loading or endpoint.
  microbial: true
  organisms:
  - id: NCBITaxon:443224
    label: Paraconiothyrium sp. WL-2
  evidence:
  - source_ref: sasaki2008
    supports: partial
    explanation: Section 3.1 and Figure 1 (pages 606-607) assign the noisy, poorly crystalline biogenic diffraction pattern primarily to birnessite while explicitly calling the assignments potentially indefinite. The reference-pattern formula is not a measured batch formula or a quantified phase fraction. The chemical comparator is assigned to ramsdellite, not abiotic birnessite. Figures 2-5 document retained fungal organics, morphology and porosity differences; reported specific areas are 81.4 versus 11.3 m2/g. Phase, surface area and biomass therefore confound attributing differences solely to microbial origin. No sterile formation time course or enzyme intervention establishes the culture's exclusive precipitation route.
  - source_ref: sasaki2008
    supports: support
    explanation: Figure 7 and section 3.2 (page 609) show declining aqueous Co with both oxide preparations, with slower uptake and a lower final aqueous concentration for the biogenic composite in the displayed experiment. A matched amount of lyophilized fungal tissue alone showed no observed Co uptake. This supports an oxide-associated sorption contribution under these conditions, not a species-wide phenotype or proof that viable cells were needed during sorption.
  - source_ref: sasaki2008
    supports: partial
    explanation: The prose reports 160 versus 28.7 mmol Co per mol solid Mn and a 5.6-fold biogenic advantage. Those normalized values are not readily reproduced from the Figure 7 concentration changes and nominal 1 mmol/L solid Mn, and its initial Co differs from the methods limit. The text also mentions an unshown 0.55 mmol/L initial-Co experiment. No capacity, fold advantage or complete cobalt mass balance is adopted here; the directly displayed qualitative aqueous trend is retained. Methods also print 500 dm3 sorption flasks, unlike the 500 cm3 preparation vessels; the apparent unit error is not silently corrected into a measured vessel volume.
  - source_ref: sasaki2008
    supports: support
    explanation: Figure 10 (pages 610-611) assigns the sorbed-Co XPS signal to Co(III), using Co 2p1/2 because the Co 2p3/2 region overlaps Mn 2s. Peak positions and absence of the expected Co(II) satellite support the authors' surface oxidation interpretation, not a bulk CoOOH mineral assignment, complete oxidation of all removed Co or product purity. Recovered sorption solids were air-dried for one week at 4 degrees C before XPS; no in situ redox time course is provided.
  - source_ref: sasaki2008
    supports: partial
    explanation: Figures 8 and 11 show Mn release even without Co and additional release with Co in the biogenic arm. Figure 11 subtracts the no-Co background; it does not plot total Mn dissolution. The abstract states that Mn(IV) reacts preferentially over Mn(III), whereas the Results and discussion on pages 610-611 infer preferential Mn(III) reaction over Mn(IV). This unresolved source conflict precludes adopting a preferred Mn oxidant or a unique stoichiometric redox pathway. Figure 9 is a surface Mn XPS comparison, not a closed redox or dissolved-metal balance.
  - source_ref: ncbi_wl2
    supports: context_only
    explanation: TaxID 443224 resolves the exact strain-labelled Paraconiothyrium sp. WL-2 node. Although NCBI assigns species rank, it is not a resolved named species or evidence authenticating the experimental stock; no other Paraconiothyrium species is substituted.
  - source_ref: genbank_wl2
    supports: context_only
    explanation: AB303550.1 records strain WL-2, the same taxon cross-reference and Japanese wetland provenance with ribosomal/ITS sequence information. It corroborates the isolate label, not a functional gene assignment, enzyme mechanism or verification of the exact 2008 culture stock.
- id: prepared_fungal_birnessite_cobalt_nickel_selectivity
  name: Competitive cobalt and nickel sorption on a freeze-dried fungal oxide
  process: biosorption
  description: A separately reported 2009 laboratory experiment found preferential cobalt sorption over nickel from defined binary solutions using freeze-dried Mn oxide produced by Paraconiothyrium sp. WL-2 and described by the source as poorly crystalline birnessite. Nickel nevertheless inhibited cobalt uptake. Microbial involvement denotes the material's fungal origin; metabolism or viability during the sorption stage was not demonstrated. This adds mixed-solute evidence to the earlier 2008 cobalt-only study, not an independent replication of material production or a purified cobalt recovery process.
  context: Section 2 (page 2643) used 0.020 g freeze-dried biogenic oxide or 0.015 g freeze-dried chemical oxide in 0.150 L solution, both nominally 1 mmol/L solid Mn, with 100 mmol/L KNO3, PIPES-buffered initial pH 6.5, 25 degrees C and 100 rpm shaking for 300 hours in duplicate. Binary assays nominally fixed Co at 0.3 mmol/L and varied Ni from 0.1 to 1.0 mmol/L; Figures 7-8 and Table 2 give actual initial pairs (Co,Ni) of (0.31,0.10), (0.35,0.35) and (0.34,1.00) mmol/L, plus a Co-only comparator. Filtrates passed a 0.2 micrometre membrane before ICP-MS. The fungal preparation was not demonstrated to be phase-pure, and no new diffraction pattern or culture-production time course is provided in this paper. Its nominal birnessite identity does not identify natural ore or every birnessite polytype.
  microbial: true
  organisms:
  - id: NCBITaxon:443224
    label: Paraconiothyrium sp. WL-2
  evidence:
  - source_ref: sasaki2009
    supports: support
    explanation: Figures 7-8 and Table 2 (pages 2646-2647) show greater fractional cobalt than nickel depletion in the binary biogenic assays and less cobalt uptake at higher nickel loading. Equation 3 defines the dimensionless selectivity coefficient as alpha_Co=(X_Co/C_Co)/(X_Ni/C_Ni), where X and C are mole fractions in sorbed and aqueous phases. For the three listed initial pairs, Table 2 reports alpha_Co 7.92, 7.47 and 17.7 for the biogenic preparation and 5.65, 2.23 and 2.65 for the chemical comparator. These are reported phase-distribution ratios, not removal percentages, isolated-product purities or recovery yields. No replicate-level raw dataset is supplied to independently reproduce the coefficients; the displayed time courses support the narrower preferential-sorption observation.
  - source_ref: sasaki2009
    supports: partial
    explanation: Section 2 identifies the chemical comparator as ramsdellite, with specific area 11.5 m2/g versus 81.4 m2/g for the fungal oxide. Phase, area, composition and retained biomass are not matched. Section 3 (page 2644) reports preliminary cellular-tissue controls with no Co or Ni sorption, but provides no displayed control dataset. No no-sorbent time course or sterile formation series is displayed. Comparative uptake therefore does not isolate a uniquely biological binding mechanism or require living cells. The earlier 2008 characterization remains a related material study, not a newly replicated 2009 mineral-purity measurement.
  - source_ref: sasaki2009
    supports: support
    explanation: Figures 1-4 and 7-8 display Mn release from the fungal preparation, followed by decreases in dissolved Mn, including release without added Co or Ni. Figures 9-11 show ex situ XPS interpreted as predominantly Co(III) and Ni(II) at the recovered solid surfaces. Binary-assay solids were collected on 0.45 micrometre filters and lyophilized overnight before XPS. These observations support sorption-associated surface redox differences, not complete bulk cobalt oxidation, a measured CoOOH mineral yield or a closed dissolved-plus-solid metal balance.
  - source_ref: sasaki2009
    supports: partial
    explanation: Table 1 (page 2644) gives average Mn oxidation states 3.09 and 3.68 for biogenic and synthetic material, whereas the adjoining prose gives 3.17 and 3.70. The prose also invokes a lack of Mn(III) in synthetic oxide although Table 1 reports a Mn(III) mole fraction of 0.296. No single reconciled oxidation-state inventory or uniquely preferred Mn oxidant is adopted. Figure 12 is a proposed binding-site scheme, not direct site occupancy imaging; specific vacancy/edge routes and CoOOH coprecipitation remain interpretations rather than quantified products.
  - source_ref: sasaki2009
    supports: partial
    explanation: Single-solute Figures 1-4 are distinct from the binary assays. Section 2 lists Co up to 1.7 mmol/L and Ni up to 2.11 mmol/L, while Figure 2 includes 2.19 mmol/L Co and Figure 3 includes 2.31 mmol/L Ni. Figures 5-6 are fitted isotherms rather than independent measurements; Figure 5 normalizes sorbed quantities to mass of Mn(III,IV), excluding Mn(II), not total composite mass. No fitted capacity is transferred to a natural feed, and no source-wide mass-normalization advantage is asserted. Different reported post-sorption preparation from the 2008 study also precludes pooling both papers as identical assay replicates.
  - source_ref: ncbi_wl2
    supports: context_only
    explanation: The freshly checked NCBI taxon 443224 retains the exact Paraconiothyrium sp. WL-2 label. Its species rank does not resolve a formally named species or authenticate the 2009 culture stock; no taxonomic reassignment or enzyme-level causality is inferred.
