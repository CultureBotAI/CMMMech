mechanisms:
- id: niue_calcrete_biofilm_association
  name: Field association of hydrotalcite-rich calcrete with source-interpreted biofilms
  process: other
  microbial: true
  description: In a coastal calcrete from Niue Island, powder XRD was assigned predominantly to hydrotalcite
    with magnesian calcite and goethite. Reflected-light petrography shows hydrotalcite-filled fractures
    bordered by material the authors interpret as biofilms. This is a source-defined microbial association
    in a natural mixed rock, not a culture experiment or direct demonstration of microbial mineral synthesis.
    The proposed depositional model involves dolomite dissolution, transport of weathered soil and atmospheric/seawater
    carbon inputs; a contribution from microbial respiration is hypothesized but is not separately measured
    or shown necessary.
  context: A representative hand-sized sample of the rare HT-C coastal calcrete near Vaiea, Niue, was
    investigated alongside a distinct calcite-rich interior calcrete PC-C. The coastal rock is described
    as about 1.1 m long, around 3.2 m above sea level and wave-exposed. No sampling date, formation duration,
    directly measured precipitation temperature, inoculum, strain or experimental mineral loading is established.
    Several grams of representative powdered rock were used for Cu K-alpha XRD, with integrated peak-intensity
    calibration; polished thin sections were examined by reflected-light microscopy and fused powders
    by XRF. Approximately 1 mg powdered aliquots reacted with phosphoric acid at 50°C for isotope analysis;
    this analytical temperature is not a mineral-formation condition. There is no sterile, killed-biomass
    or matched abiotic formation control, no sequence or molecular assay authenticating a microbial taxon,
    and no industrial recovery experiment.
  evidence:
  - source_ref: aharon_2024
    supports: support
    explanation: 'Sections 3.1–3.2 and Figure 4B report the hydrotalcite-bearing phase assemblage: the
      diffraction figure labels 65.3% hydrotalcite, 30% magnesian calcite and 4.7% goethite; the text
      rounds hydrotalcite to 65%. These are source-calibrated bulk phase estimates, not an isolated pure
      product or recovered mass. Figure 6A, explicitly labelled HT-C, shows hydrotalcite-filled fractures
      encased in source-interpreted biofilms. Section 3.2 incorrectly points its HT-C description to Figure
      5, which is instead labelled PC-C; the accepted field association is grounded to Figure 6, not the
      calcite-rich specimen.'
  - source_ref: aharon_2024
    supports: partial
    explanation: The phase assignment comes from a mixed-rock diffraction pattern and integrated peak
      intensities, not a reported phase-specific composition or independent single-crystal refinement.
      Table 1 is bulk XRF chemistry and cannot assign every Mg, Al or Fe atom to hydrotalcite. Optical
      films alone do not establish a living organism, metabolic pathway, precipitation chronology, or
      a biological rate enhancement. Proposed dolomite–seawater formation in Sections 4.2 and 5 is an
      interpretation supported by a separately cited synthesis study, not a new synthesis performed in
      this paper.
  - source_ref: aharon_2024
    supports: partial
    explanation: Section 3.4 and Table 2 report paired bulk HT-C carbon and oxygen isotope measurements,
      not separated hydrotalcite-specific isotope values. The authors state that hydrotalcite fractionation
      factors and the phosphoric-acid oxygen correction are unknown. Atmospheric CO2, seawater bicarbonate,
      dolomite dissolution and microbial respiration therefore remain non-unique possible contributors;
      no fractional microbial carbon contribution or net sequestration rate is curated. The stronger soil-respiration
      argument for the separate PC-C calcite is not transferred to HT-C.
  - source_ref: aharon_2024
    supports: partial
    explanation: The Figure 1 map locates the island in the southern hemisphere while its coordinate caption
      prints north latitude; exact coordinates are not adopted. The source calls some goethite/gibbsite-bearing
      material Mg-Al silicates, although those are not silicate species; that classification is not adopted.
      Suggested Holocene age and depositional history are interpretations rather than direct dates. These
      source inconsistencies do not justify treating the observed calcrete as a demonstrated microbial
      synthesis or an engineered extraction process.
