id: cmmmech:lanthanite-la
name: Lanthanite-(La)
material_kind: mineral
description: >-
  Lanthanite-(La) is the lanthanum-dominant lanthanite mineral, with ideal
  formula La2(CO3)3(H2O)6·2H2O, equivalently La2(CO3)3·8H2O. The September
  2026 IMA list treats it as a renamed species, with year 1987 s.p.; this
  nomenclatural action is not a unique mineral approval number. Nickel
  and Mandarino's 1987 Appendix Table 2 explicitly changes Lanthanite
  to Lanthanite-(La) under the extension of rare-earth suffix nomenclature.
  It does not establish the composition of historical Swedish material.
  Lanthanite-(La) is distinct from elemental lanthanum, the lanthanite group, other carbonate
  hydrates and commercial rare-earth feeds. Historical locality labels
  require caution: the IMA row retains Sweden, whereas Atencio et al.
  (1989) found their Bastnäs specimen B10531 to be Ce-dominant. Their
  reassessment of published Curitiba analyses includes La-dominant and
  Nd-dominant specimens, so neither all Bastnäs material nor all Curitiba
  material can be assigned to this species solely from its locality.
  Haidinger's 1845 entry names Riddarhytta, Sweden, but supplies neither
  a museum accession nor a modern resolved REE analysis. Dal Negro et al.
  (1977) identify their diffraction specimen as NMNH B10530; their
  assumed La/Ce scattering does not establish La dominance. The current
  Smithsonian catalog and SESAR sample registrations distinguish
  B10530-00, labelled Lanthanite, from B10531-00, labelled Lanthanite-(Ce).
  These are distinct catalog entries, without a verified fragment-level
  chain to the analyzed specimens or the 1845 material.
  The original Svisero and Mascarenhas (1981) Curitiba analysis underlies
  Atencio et al.'s La-dominant compiled analysis 7; it is not an additional
  independent 1989 measurement. Atencio (1999) places that material under
  lanthanite-(La), while reporting La/Nd variation within crystals and
  the formal rejection of the earlier unapproved names. This does not
  designate a La type specimen or resolve the Swedish material's identity.
  Atencio (2015) explicitly recommends changing the listed country to
  Brazil. That published recommendation is kept distinct from an adopted
  CNMNC revision; the September 2026 IMA row still retains Sweden.
  The experiment below concerns a separately synthesized La carbonate
  analogue of lanthanite, not dissolution of a natural mixed-REE specimen.
  No jurisdiction-specific criticality designation, microbial process or
  industrial deployment is established by these sources.
