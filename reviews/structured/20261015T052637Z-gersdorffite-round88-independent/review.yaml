limitations:
- Historical mixed-feed mineralogy does not resolve today's gersdorffite polymorph;
  unavailable Wakeman journal original is not accepted as inspected evidence.
- Geological low-temperature/multistage origin is interpretive, not an experimentally
  demonstrated microbial formation pathway.
- Main/CIF small reporting differences do not alter the accepted space group/cell
  dimension, but conflicting temperature/reflection values are excluded.
- Only the cited GFC-related thesis scope was assessed; unrelated gold/NFC process
  yields are not transferred.
- Bounded notices/searches and documentary inspection are not a complete literature
  census or experimental replication.
