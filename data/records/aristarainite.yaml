      Harvard 109679 and occurrence pp. 647-648, Tables 1-3
      p. 649, Table 5 chemistry p. 650, preparation and solubility
      statements p. 651, IR Figure 5 and Table 6 p. 651.
      The optical sign differs between the abstract and Table 4;
      neither is silently selected here. The historical ten-water
      formula is retained as an earlier interpretation, not
      substituted for the current accepted formula.
    url: https://msaweb.org/AmMin/AM59/AM59_647.pdf
    accessed_on: '2026-10-16'
  - id: ghose_wan1977
    title: >-
      Ghose and Wan (1977), Aristarainite:
      Na2Mg[B6O8(OH)4]2·4H2O: a sheet structure with chains of
      hexaborate polyanions, American Mineralogist 62, 979-989.
      Complete eleven-page original: hydration revision p. 979,
      natural Salta crystal and refinement p. 980, atomic sites
      Table 2 p. 981, hydrogen/disorder pp. 984-985, structural
      Figures 1-6 pp. 986-989. R=0.036 for 1941 reflections.
      Table 1's cell-content line prints OH2 inside its bracket,
      unlike the OH4 formula in the title and structural discussion;
      that line is not used to redefine the species. The publisher
      deposit AM-77-052 was acquired as a scanned supplement.
      The polymerization/paragenesis discussion is an interpretation,
      not a demonstrated heating or solution-conversion experiment.
    url: https://msaweb.org/AmMin/AM62/AM62_979.pdf
    accessed_on: '2026-10-16'
  - id: ghose_wan1977_deposit
    title: >-
      Publisher deposit AM-77-052 accompanying Ghose and Wan (1977),
