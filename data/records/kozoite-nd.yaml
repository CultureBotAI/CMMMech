mechanisms:
- id: natural_kozoite_nd_thermal_gas_release
  name: Abiotic thermal dehydration and decarbonation of natural kozoite-(Nd)
  process: other
  microbial: false
  description: >-
    Heating natural mixed-REE kozoite-(Nd) produced two endothermic
    mass-loss events. At the first peak, 485 °C, thermogravimetry
    measured 16.07 wt% loss and simultaneous gas chromatography-mass
    spectrometry detected CO2 and H2O. The authors attribute 11.98 wt%
    to CO2 and 4.09 wt% to H2O from the gas-analysis results. At
    the second peak, 716 °C, the mass loss was 9.89 wt% and only
    CO2 was detected. The observations support dehydration and
    decarbonation under the stated heating conditions. Heated-residue
    phases were not identified, so no particular Nd oxide product,
    isolated-metal recovery or final-product purity is established.
  context: >-
    Miyawaki et al. (2000) used a Rigaku TG-DTA/GC-MS analyzer in
    helium, heating from room temperature to 900 °C at 20 °C/min
    with simultaneous analysis of the exhaust gas. The thermal
    aliquot mass and helium flow are not specified in that paper.
    Miyawaki's 2001 author account reports approximately 15 mg;
    its Figure 1 instrument header gives 14.840 mg, He 130 mL/min,
    20.0 °C/min and a 0.3 s sampling interval. The Figure 2 GC/MS
    header also gives 14.84 mg but labels the sample "direct in
    Air 950C/20", conflicting with the helium conditions and the
    900 °C endpoint reported in 2000. This label conflict is not
    reconciled here. The approximately 5 mg portions belong to
    separate elemental analysis. The two events are within one heating experiment,
    not independent replicated treatments. Estimated total evolved
    CO2 and H2O were 21.87 and 4.09 wt%, respectively, whereas the
    separate elemental analysis in Table 1 gives CO2-equivalent
    21.10 wt% and H2O-equivalent 5.44 wt%. Although the source calls
    these results comparable, their differences and unspecified
    uncertainties are retained here. The 2001 account mentions
    sensitivity correction for gas quantitation but provides no
    numerical calibration factors or propagated uncertainty;
    independent thermal replication remains unspecified.
    No microorganisms, solution
    extraction assay, separated metal product or industrial-scale
    operation was involved.
  evidence:
  - source_ref: miyawaki2000
    supports: support
    explanation: >-
      Thermal methods and first-event results on page 1077, continuation
      on page 1079, and Figure 5 on page 1080 establish the helium
      atmosphere, heating rate, two endotherms, corresponding losses
      and evolved-gas identities. Table 1 supplies the distinct
      elemental-analysis estimates; these are not substituted for
      thermogravimetric measurements. The record preserves the natural
      mixed-REE substrate and does not infer an unmeasured residue
      phase, recovery yield or microbial mechanism.
  - source_ref: miyawaki2001
    supports: partial
    explanation: >-
      Pages 36-38 add aliquot mass and labelled instrument settings
      for the experiment discussed in the 2000 paper, cited as
      reference 5 by both figure captions. They do not constitute
      an independent replicate. The Figure 1 thermal record time
      is 1999/06/14 10:44:03, whereas Figure 2 reports GC/MS
      acquisition on 14 June 1999 at 10:02 am; neither supplies
      a time zone or a reproducible alignment between time origins.
      The incompatible atmosphere/endpoint label, missing numerical
      calibration and uncertainty, and absent matched heated-residue
      characterization prevent reconciliation of the two volatile
      estimates or identification of a recovered oxide product.
