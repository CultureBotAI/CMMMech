  title: 'UniProtKB reference proteome UP000002762 (Beauveria bassiana strain ARSEF 2860, NCBITaxon:655819): Oxaloacetate acetylhydrolase (BBA_06346, UniProtKB:J4UKL8), Pyruvate carboxylase (BBA_04309, UniProtKB:J5JXL6), and Malate dehydrogenase (BBA_06393, UniProtKB:J4KMZ7).'
  url: https://www.uniprot.org/uniprotkb?query=(proteome:UP000002762)+AND+(accession:J4UKL8+OR+accession:J5JXL6+OR+accession:J4KMZ7)
