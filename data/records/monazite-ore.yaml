id: cmmmech:monazite-ore
name: Monazite ore
material_kind: primary_resource
description: 'A heterogeneous geological rare-earth phosphate feed represented by the high-grade
  monazite ore supplied by Lynas Rare Earths, Australia, to van Alin et al. (2023). The reviewed
  study does not establish its precise mine or deposit of origin. XRD, TIMA and elemental analyses
  characterize a mixed feed rather than a pure monazite species: the supplement reports monazite-group
  and other phosphate phases with additional gangue. This resource is distinct from monazite-(Ce),
  monazite-(Nd), elemental rare earths, a rare-earth commodity and secondary processing waste.
  The source''s high-grade description is not an independently certified commercial grade. No
  constituent criticality designation is inherited.'
