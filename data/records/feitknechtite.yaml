id: cmmmech:feitknechtite
name: Feitknechtite
material_kind: mineral
description: Feitknechtite is the manganese(III) oxide hydroxide mineral beta-MnOOH, listed as approved
  with the notation 1968 s.p. in the September 2026 IMA-CNMNC list. That notation is retained as authority
  metadata, not converted into an invented accession. Post et al. (2023) resolve a monoclinic C2/m structure,
  superseding older trigonal descriptions; the species is distinct from manganite and groutite and from
  Mn(II) pyrochroite. The mechanism below concerns a source-assigned transient mixed-phase product.
  No criticality is inherited from manganese.
