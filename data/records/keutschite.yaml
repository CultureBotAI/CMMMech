id: cmmmech:keutschite
name: Keutschite
material_kind: mineral
description: >-
  IMA-approved copper-silver-arsenic sulfosalt mineral of the stannite group (IMA 2014-038;
  status A, Approved 2014; full description published January 2026; no mineral symbol is
  printed in the September 2026 IMA Master List, PDF p. 112, or in the primary type
  description) with ideal end-member formula Cu2AgAsS4 (requiring Cu 29.01 wt%, Ag 24.62
  wt%, As 17.10 wt%, S 29.28 wt%, sum 100.01 wt%, printed as "29.01 Cu, 24,62 Ag, 17.10 As,
  and 29.28 S, for a total of 100.00" with a comma decimal separator in "24,62 Ag" in
  Section 3, p. 3; Topa, Takagi Fredrickson, Stanley, and Dinca, 2026, European Journal of
  Mineralogy 38:1-7). Represents the Ag-As analogue of stannite (Cu2FeSnS4) and is named in
  honour of Frank Keutsch (born 1971) for his significant contributions to the mineralogy of
  the Uchucchacua deposit, who first brought attention to this mineral during his study of
  the alabandite zone and was instrumental in the discovery and description of
  manganoquadratite, menchettiite, agmantinite, spryite, hyrslite, ramosite, and oyonite (and
  first identified argyrodite, billingsleyite, canfieldite, diaphorite, ferdowsiite,
  metastibnite, pirquitasite, smithite, stannite, stephanite, and trechmannite at this site;
  Abstract, p. 1, and Section 1, p. 2). Discovered in a sample extracted from the alabandite
  zone (Socorro section of the mine, characterised by high concentrations of Ag and Mn) of
  the Ag-Pb-Zn polymetallic deposit at Uchucchacua, Oyon District, Catajambo, Lima
  Department, Peru (type locality for seven Mn-bearing sulfides/sulfosalts -- benavidesite,
  uchucchacuaite, manganoquadratite, menchettiite, oyonite, agmantinite, and ramosite -- and
  seven Ag minerals including spryite); the sample utilised for description consists
  predominantly of alabandite and Mn-bearing calcite with associated crystals of
  manganoquadratite, proustite, and billingsleyite, as well as massive diaphorite and
  seligmannite-bournonite, with the alabandite zone also hosting chemically or structurally
  related agmantinite, pirquitasite, stannite, and kesterite, and keutschite having since
  been described at the Clara mine in Germany (Kolitsch et al., 2019) and the Sacaramb ore
  deposit in Romania (Dinca et al., 2025) (Abstract, p. 1; Section 2, p. 2; and Section 5,
  p. 5). The holotype material is deposited in the reference collection of the
  Naturhistorisches Museum Wien, Vienna, Austria (specimen no. N 9736), part of the specimen
  used for the study is deposited in the collection of the Mineralogical & Geological Museum
  Harvard (no. 2017.13.10), and another part (Figure 1, p. 3) is deposited in the Frank
  Keutsch collection (Section 1, p. 2). Occurs as rare metallic, highly lustrous, blocky,
  free-standing crystals measuring up to 3 mm (Figure 1 caption on p. 3 notes a twinned
  crystal 2.5 mm in size on proustite and manganoan calcite; Table 3 on p. 4 lists crystal
  colour Grey and crystal habit Irregular) that exhibit a grey colour with a slight
  green-brassy tint on manganoquadratite and proustite crystals (Abstract, p. 1, and Section
  2, p. 2); crystals are opaque with a grey-black (Abstract, p. 1) / black (Section 2, p. 2)
  streak, non-fluorescent, brittle tenacity, neither fracture nor cleavage observed, Mohs
  hardness 4-5, Vickers micro-indentation hardness VHN25 = 352-380 with a mean of 368 kg
  mm-2, and calculated density Dcalc = 4.663 g cm-3 in Section 2 (p. 2, from the empirical
  formula and single-crystal X-ray data) or 4.66 g cm-3 in Table 3 (p. 4; density could not
  be measured directly owing to limited size and material available). In plane-polarised
  incident light, keutschite is grey-white in colour, with very weak bireflectance and very
  weak pleochroism in greenish-grey to grey tints, and under crossed polars is weakly
  anisotropic with rotation tints in shades of greenish grey to grey and no internal
  reflections (Abstract, p. 1, and Section 2, p. 2); reflectance values (Rmin, Rmax in %)
  measured in air using a Zeiss Axiotron microscope, a Crystal Structures (Lanham)
  superstage, a J&M Tidas diode array spectrometer, a Zeiss WTiC standard, and Cavendish
  Instruments Onyx software from 400 to 700 nm at 0.823 nm intervals (Abstract, p. 1,
  Section 2, pp. 2-3, and Table 1, p. 3) at the four COM standard wavelengths are 25.2, 26.1
  (470 nm), 29.6, 29.4 (546 nm), 29.4, 29.2 (589 nm), and 28.5, 28.6 (650 nm) (reported from
  400 to 700 nm in 20 nm steps in Table 1, p. 3). Wavelength-dispersive field-emission
  electron-microprobe analyses (JEOL "Hyperprobe" JXA 8530F FE-EPMA at the Central Research
  Laboratories of the Natural History Museum, Vienna; 25 kV, 20 nA, 2 um beam diameter, 10 s
  peak / 5 s background; standards synthetic Ag metal for AgLalpha, natural chalcopyrite for
  CuKalpha, synthetic hauerite for MnKalpha, synthetic InAs for AsLalpha, natural stibnite
  for SbLalpha, natural galena for PbMalpha, and natural sphalerite for SKalpha; n = 5
  analyses on one grain; Section 3, p. 3, and Table 2, p. 4) yielded mean Ag 23.46 wt% (range
  23.14-23.94, SD 0.34), Cu 29.53 wt% (range 29.32-29.74, SD 0.18), Mn 0.031 wt% (range
  0.02-0.04, SD 0.01), As 16.09 wt% (range 15.29-16.71, SD 0.67), Sb 1.20 wt% (range
  0.48-2.14, SD 0.84), Pb 0.11 wt% (range 0.04-0.14, SD 0.07), S 29.06 wt% (range 28.80-29.11,
  SD 0.15), and mean of spot totals 99.46 wt% (range 99.12-99.97, SD 0.50; sum of rounded
  element means = 99.481 wt%). Both the Abstract (p. 1) and Section 3 (p. 3) print the
  empirical formula as Cu2.05Ag0.96(As0.95Sb0.04)Sigma0.99S4.00 ("based on eight atoms"),
  whereas Table 2 (p. 4) gives three empirical formula normalizations:
  Cu2.00Ag0.97(As0.95Sb0.04)Sigma1.99S4.03 (SigmaMe = 3.97) on the basis of 8 apfu (4Me +
  4S), Cu1.99Ag0.96(As0.95Sb0.04)Sigma1.99S4.00 (SigmaMe = 3.95) on the basis of 4 S apfu,
  and Cu2.02Ag0.97(As0.96Sb0.04)Sigma2.00S4.05 (SigmaMe = 4) on the basis of 4 Me apfu (where
  Table 2 prints Sigma1.99 instead of Sigma0.99 for 0.95 + 0.04 = 0.99 and Sigma2.00 instead
  of Sigma1.00 for 0.96 + 0.04 = 1.00). Crystallizes in the tetragonal system, space group
  I-42m (#121), with single-crystal X-ray diffraction unit-cell parameters (Oxford
  Diffraction Xcalibur E diffractometer, graphite-monochromatised MoKalpha radiation, lambda
  = 0.71073 A in Table 3, p. 4, misprinted as "lambda = 0.7173 A" in Section 4, p. 3, at T =
  293(2) K on an irregular 0.118 x 0.088 x 0.050 mm crystal fragment) a = 5.5834(15) A, c =
  10.021(3) A, V = 312.40(14) A3, and Z = 2 (note that the Abstract on p. 1 prints the axial
  ratio as "a:b:c = 1:1:0.897", which equals c/(2a) = 0.8974 rather than c/a = 1.7948). The
  crystal structure was solved by charge flipping (SUPERFLIP) and refined on F2 (JANA2006)
  to R = 1.99% and Rw = 4.61% for 286 observed reflections with I > 3sigma(I) (R = 2.17%, Rw
  = 4.78% for all 308 unique reflections out of 1490 measured reflections, Rint [I >
  3sigma(I), all] = 2.62%, 2.63%, S = 1.05 for 15 parameters; Table 3, p. 4). In the
  stannite-derivative structure (Table 4 and Section 5, p. 5), tetrahedrally S-coordinated
  cations occupy Wyckoff positions Cu at 4d (0, 0.5, 0.75; Ueq = 0.024 A2), Ag at 2b (0, 0,
  0.5; Ueq = 0.032 A2), and As at 2a (0, 0, 0; Ueq = 0.009 A2) with S at 8i (0.77733(13),
  0.77733(13), 0.86852(10); Ueq = 0.014 A2), forming alternating (001) cation layers of Cu
  atoms and ordered (Ag + As) atoms. The five strongest powder X-ray diffraction lines
  measured on a Rigaku Rapid II 2D image-plate diffractometer with MoKalpha radiation [dmeas
  in A (Im, Irel, dcalc in A) (hkl); Table 5, p. 5] are 3.09 (vs, 100, 3.1011) (112), 2.79
  (ms, 11.4, 2.7917) (200), 1.966 (s, 20.4, 1.974) (220), 1.864 (s, 34.2, 1.8646) (204), and
  1.659 (s, 27.2, 1.6653) (312) (note that the Abstract on p. 1 prints the five strongest
  lines as "[d in A (intensity) hkl]: 3.101 (100) 110; 2.792 (11) 200; 1.974 (20) 220; 1.665
  (34) 204; and 2.846 (27) 312", misprinting 110 for 112, 1.665 for 1.865 on 204, and 2.846
  for 1.665 on 312). No biological or microbial interaction data are reported in the type
  mineralogical description.
