id: cmmmech:argyrodite
name: Argyrodite
material_kind: mineral
description: >-
  Argyrodite is the silver-germanium sulfide mineral species Ag8GeS6,
  listed by IMA-CNMNC in September 2026 as grandfathered, with 1886 as
  the original-description year rather than an IMA approval number.
  Ono and Sato's 1995 study identified natural argyrodite in fine-grained
  massive black ore from the Ezuri Kuroko deposit, Japan, using reflected-light
  microscopy and electron-microprobe analysis. Figure 3F shows the mineral
  with galena, covellite, chalcopyrite and bornite in barite; Table 2 gives
  a specimen analysis described as close to ideal Ag8GeS6, with minor
  Cu, Fe and As. This specimen observation does not establish uniform
  composition, bulk germanium grade, resource size or recovery yield.
  The authors' fluid-inclusion measurements concern sphalerite and their
  formation-temperature interpretation is not an argyrodite extraction assay.
  This natural species is distinct from synthetic lithium argyrodite
  electrolytes and from the separately recognized alburnite, Ag8GeTe2S4.
  Historical Te-rich argyrodite reports from Roşia Montană are not used
  here as interchangeable composition evidence: the 2014 alburnite
  description explicitly revisits the earlier interpretation.
  Handbook crystallographic citations to synthetic Ag8GeS6 are not
  treated as measurements of the Ezuri specimen. No microbial mechanism,
  industrial recovery performance or inherited constituent-element
  criticality designation is assigned.
