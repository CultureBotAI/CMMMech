mechanisms:
- id: prony_filament_encrustation
  name: Field-associated brucite encrustation of microbial filaments
  process: biomineralization
  description: At the Prony Bay hydrothermal field, brucite-rich mineral crusts occur around carbon-rich
    microbial filaments in young chimney conduits. Laser-microdissected mineralized filaments from ST09
    gave XRD patterns assigned predominantly to brucite with minor hydrotalcite; microscopy and DNA staining
    support microbial sheaths within these structures. Filaments are proposed to provide nucleation surfaces
    during chimney consolidation. This is an observational organomineralization interpretation, not a
    controlled demonstration of microbial necessity or a quantified recovery process.
  context: Natural hydrothermal chimneys sampled during the 2011 HYDROPRONY cruise, New Caledonia; ST09
    is a juvenile active edifice at about 50 m water depth, compared with more mature ST07 and other sites.
    Reduced alkaline fluids derived from serpentinization mix with seawater. This is field occurrence
    studied by laboratory microscopy and diffraction, without a defined culture temperature, exposure
    duration, loading, inoculated isolate or industrial operation. SEM fragments were stored at 4°C; molecular/imaging
    fractions used preservation protocols rather than living precipitation assays. Filament-rich ST09
    material yielded predominantly one uncultivated Firmicutes-affiliated 16S OTU; the nearest cultivated
    relative was only 88% similar, so no named species or metabolic pathway is assigned. Sequence abundance
    in mixed material does not prove that a single taxon precipitated the mineral. The source also recognizes
    abiotic precipitation from supersaturated alkaline fluids. No matched sterile, killed-biomass or pH-controlled
    formation experiment is provided.
  microbial: true
  evidence:
  - source_ref: pisapia_2017
    supports: support
    explanation: Methods p. 5 describes laser microdissection and XRD of individual encrusted ST09 filaments.
      Figures 2 and 3 show mineral-covered carbon-rich filaments, Mg/O-rich crusts and a brucite-dominated
      diffraction pattern; Figure 5 shows DNA-stained cells in microbial sheaths. These observations support
      brucite-associated microbial encrustation, not an independently resolved rate or mass yield. Minor
      hydrotalcite is a co-occurring phase of unresolved origin, not assumed to be microbial brucite conversion.
  - source_ref: pisapia_2017
    supports: partial
    explanation: Discussion p. 11 explicitly states that thermodynamic supersaturation permits abiotic
      brucite precipitation and that high fluid pH already supplies the alkaline conditions. Sheaths as
      nucleation sites are proposed; functional groups, metabolic alkalinization and phase-specific causation
      are not experimentally isolated. Table 1 and pp. 11-14 describe mixed-sample sequence affiliation,
      not cultured strain verification; the paper itself warns that metabolisms cannot reliably be inferred
      from these distant relatives. The micrographs are spatial observations, not time-lapse proof of
      the depicted growth sequence. No magnesium extraction, isolated-product recovery or engineered deployment
      follows.
- id: diatom_associated_brucite_capsules
  name: Brucite-assigned capsules associated with alkalinizing diatom cultures
  process: biomineralization
  microbial: true
  description: Brucite-assigned magnesium-rich mineral capsules were observed around Phaeodactylum tricornutum
    cells and extracellular polymeric material during laboratory culture alkalinization. Mg elemental
    mapping and indexed electron diffraction support the authors' brucite assignment; microscopy distinguishes
    partial and extensive encapsulation in bubbled and static cultures. This supports culture-associated
    precipitation and encapsulation, without establishing that living cells are necessary or that crystal
    nucleation occurs directly on the cell surface. The authors leave nucleation versus capture/chelation
    of previously precipitated material unresolved.
  context: Section 2.1, pages 61-62, describes source-designated P. tricornutum CCMP632 ENS Pt186 in polycarbonate
    bottles containing artificial seawater enriched as f/2, at 16 degrees C with 14 h light/10 h dark,
    with or without air bubbling. The historical stock chain and axenity were not independently verified;
    current catalogue maintenance and later purity-test information are not assay conditions. Bubbled-culture
    samples T1-T5 and static endpoint preparations are distinct. T5 was separately acidified with HCl
    to pH 8. A cell-free enriched-medium control was alkalinized with NaOH to pH 10.5; another living
    culture was held at pH 7.5-8.5 with CO2-enriched air before NaOH adjustment to pH 10. These interventions
    do not form a fully matched control series separating photosynthesis, pH, biomass and surface chemistry.
    Working culture volume, independent replicate count and a Mg mass balance are unresolved; the reported
    50 mL is a microscopy aliquot. Electron microscopy used fixed/prepared material, SEM/AFM preparation
    included SDS treatment, and AFM was performed in air. No isolated brucite mass, magnesium recovery
    yield or industrial operation was demonstrated.
  evidence:
  - source_ref: tesson2008
    supports: support
    explanation: Section 3.2, pages 65-67, and original Figure 3 pair a zero-loss TEM capsule image with
      its Mg map, a magnified layered region and a labelled microdiffraction pattern. The authors index
      this as brucite with preferred [001] orientation. Figures 2, 4 and 6 show cell-associated capsules,
      including partially encased bubbled samples and extensively encased static samples; these are prepared
      specimens, not a time-lapse demonstration of the entire growth sequence. Additional EDX and XRD
      confirmation is stated as data not shown, so no quantitative purity or phase fraction is independently
      accepted from those unavailable data.
  - source_ref: tesson2008
    supports: partial
    explanation: Sections 2.1 and 3.2 report a Mg-containing, amorphous-like precipitate after cell-free
      medium alkalinization to pH 10.5; the control micrograph and raw phase data are not shown. The CO2/NaOH
      living-culture intervention concerns EPS formation and has different pH conditions. These controls
      support a role for solution chemistry and prevent a claim that microbes are required for Mg precipitation.
      Section 4.3, page 72, explicitly cannot distinguish nucleation on cells from precipitation before
      chelation. Carboxylate/sulfate interaction and Mg-mediated polymer stabilization remain interpretations
      rather than isolated molecular mechanisms.
  - source_ref: tesson2008
    supports: partial
    explanation: 'Original Figure 1 labels dissolved silicon in micromolar units and shows its decline
      as pH rises; it is not a dissolved-Mg assay. The text''s silica amount/concentration wording and
      94 versus 96 h T1 timing are retained as unresolved. Acid neutralization is described as dissolving
      much of the shell and returning silica to solution, without a closed Mg or Si balance. Original
      Figures 7-8 provide spectral context: Figure 7c actually spans 1200-800 cm^-1 despite the extracted
      caption''s 800-400 range; Figure 7a labels 550, 1650 and 3698 cm^-1. Band overlap and differing
      sample preparations prevent assigning a unique ligand mechanism or treating relative absorbance
      as a mineral mass yield.'
