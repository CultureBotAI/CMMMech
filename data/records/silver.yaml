    functional_role: Inner-membrane tetraheme c-type menaquinol dehydrogenase CymA (EC 7.1.1.8; SO_4591) transferring electrons from the menaquinol pool to periplasmic and outer-membrane electron-transfer pathways.
    evidence:
    - source_ref: wang_2010
      supports: partial
      explanation: Representative Shewanella oneidensis MR-1 Mtr-pathway cytochrome (cymA) for extracellular electron transfer to Ag(I)-bearing media (nominal 1-400 uM AgNO3 or 100 uM AgCl) with 100 mM lactate in Wang et al. (2010); individual cytochrome genes were not mutated.
  evidence:
  - source_ref: wang_2010
    supports: support
    explanation: Methods (XRD analysis), Results (Analysis of silver precipitates), and Figure 3 compare AgCl/Ag3PO4-containing precipitates without cells with Ag(0) diffraction after culture incubation. No-cell media lacked the culture-associated color change. Figure 4 shows cell-associated electron-dense particles after Ag exposure, absent from the no-Ag control; microscopy alone does not assign the oxidation state of each particle.
  - source_ref: wang_2010
    supports: partial
    explanation: 'Results and Figure 2 show dose-dependent limits: growth was delayed at nominal 100 micromolar Ag(I) and absent at 400 micromolar. Abiotic precipitation means nominal added Ag(I) differs from dissolved exposure. The abstract''s statement that 100 micromolar reduced doubling time conflicts with the Results, which report an increase from about 7.5 to 24 h. Proposed roles for cytochromes or flavins in the Discussion were not tested causally in this experiment; neither solution depletion nor product mass balance was established for the inoculated cultures.'
