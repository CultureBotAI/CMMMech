summary: Nobleite identity and bounded original abiotic precipitation are supported.
  No corrective owner finding; natural chemistry, older secondary solubility and unproved
  interconversion remain separate. A separate dossier-locator finding is addressed
  through its immutable publication review chain.
limitations:
- The 1961 synthesis lacks quantitative phase purity, isolated yield, solution mass
  balance, pH and replicate count; qualitative phase identification is the admitted
  result.
- Nikolaev and Chelishcheva 1940 solubility evidence and the 2004 structure revision
  were not independently acquired for this review; no new claims from their secondary
  summaries are admitted.
- No independent experiment, structure re-refinement or direct demonstration of natural
  weathering causality was performed.
- Shared source acquisition is disclosed. Bounded correction and hidden/ignored dedup
  searches do not establish exhaustive absence.
- Working-tree review at the retained base. Record validation is separate from scientific
  truth; native review-check and committed-head/hosted publication remain separate.
notes:
- No owner/history correction was needed. Dossier-only issue451 was resolved in its
  saved independent successor; the two source-filename strings were corrected and
  context freshly captured. Unavailable originals and retained source conflicts remain
  limitations.
- No self-authored REE record is scientifically reviewed in this observation.
