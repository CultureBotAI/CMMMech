  summary: 'Resolved CMM120-F3 (issue #838): replaced dense Source.title with concise
    bibliographic citation ''Mücke, A., and Strunz, H. (1978) Petscheckite and liandratite,
    two new pegmatite minerals from Madagascar. American Mineralogist, 63, 941-946'';
    separated the three empirical wet-chemical columns in Table 1 (Column I fresh
    petscheckite, Column II brown-black oxypetscheckite, Column III yellow-brown hydroxypetscheckite)
    from theoretical columns IV and V so mixed values from different varieties/theoretical
    columns are no longer conflated; and updated description and mechanisms[0] to
    state that oxy-petscheckite (Fe3+0.67(O0.67OH0.33)) recrystallizes at ~650 °C
    (sharpest at 800 °C) to trigonal P-31m while hydroxy-petscheckite (Fe3+0.33(OH))
    dehydrates above 500 °C and disproportionates at 1000 °C into cubic uranpyrochlore
    (a = 10.36 Å) plus recrystallized oxy-petscheckite.'
