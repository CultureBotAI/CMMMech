id: cmmmech:titanium
name: Titanium
material_kind: element
description: >-
  The element Ti, distinct from titanium dioxide phases, titanium-bearing
  mineral species, alloy formulations and the titanium-metal commodity.
  The United States 2025 Titanium designation is mapped to this element;
  it does not designate every titanium compound or establish microbial
  recovery of metallic titanium. The curated experiment concerns alteration
  of an oxide film on commercially pure titanium laboratory specimens.
