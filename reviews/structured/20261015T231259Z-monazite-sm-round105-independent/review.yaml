- assessment_id: specimen
  area: evidence
  topic: Natural analytical sample, chemistry and diffraction
  outcome: supported
  summary: Methods show WDS electron-microprobe and single-crystal/Gandolfi diffraction.
    Systematic absences are consistent with monoclinic P21/n. The natural species
    contains substantial Gd, Ce, Th and Ca; ideal SmPO4 does not imply pure-endmember
    experimental material.
  target_ids:
  - cmmmech:monazite-sm
  evidence_ids:
  - record
  - primary
- assessment_id: quantities
  area: evidence
  topic: Three-grain average versus separate highest-Sm composition
  outcome: supported
  summary: Table1 footnote identifies column1 as the average of three grains used
    for physical,optical and crystal data, with13.02wt% Sm2O3. Column2 has14.29wt%;
    p1651 says that extreme composition was not on extracted grains. The owner preserves
    this distinction and avoids ore-grade or recovery-yield interpretation. Density
    and hardness could not be measured; density is calculated.
  target_ids:
  - cmmmech:monazite-sm
  evidence_ids:
  - record
  - primary
- assessment_id: mechanism
  area: evidence
  topic: Geological interpretation versus experimentally demonstrated process
  outcome: supported
  summary: Selective complexation is presented as the authors’ proposed explanation.
