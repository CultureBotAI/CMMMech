    relationship: H2-coupled sulfite reduction to sulfide accompanied by black iron-nail encrustation and pH elevation to 8.3
    description: Sulfate respiration in inoculated G20 bottles produces sulfide that blackens the iron finishing nail and shifts medium pH from 7.5 to 8.3 over 10 months at 25 C (versus pH 7.7 and 7.9 in sterile bottles).
