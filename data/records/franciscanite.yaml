id: cmmmech:franciscanite
name: Franciscanite
material_kind: mineral
description: >-
  Franciscanite (IMA 1985-038) is an IMA-accepted manganese-vanadium nesosilicate
  mineral of the welinite group, the V5+ analogue of welinite, with IMA
  September 2026 Master List formula Mn2+6(V5+☐)(SiO4)2O3(OH)3 and empirical
  formula Mn5.96[V0.98[]1.02]Si2.00(O,OH)~14. Described by Dunn et al. (1986)
  from the Pennsylvania manganese mine in the Franciscan Complex, San Antonio
  Valley, Santa Clara County, California, USA (holotype NMNH 163041), where it
  occurs as dark brownish-red grains with gageite, sonolite, hausmannite, and
  barite. Electron microprobe analysis in Table 2 (p. 1523) gives SiO2 18.4, MnO
  64.9, V2O5 13.5, Fe2O3 0.0, MgO 0.0, As2O5 0.0, and H2O 3.4 wt% (calculated
  from the Si:H ratio of type welinite because paucity of franciscanite
  precluded direct water/TGA measurement; thermal analyses in the paper were
  performed on welinite and impure örebroite), total 100.2 wt%.
  Hexagonal/trigonal (space group P3, inferred from possible P3 or P1), with a =
  8.148(1) Å, c = 4.804(1) Å, V = 276.2 Å3, Z = 1, Dmeas = 4.1 g/cm3, Dcalc =
  3.93 g/cm3, Mohs hardness 4, and uniaxial (+) optics with omega = 1.856(3) and
  epsilon = 1.882(3).
