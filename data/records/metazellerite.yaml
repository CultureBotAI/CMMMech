id: cmmmech:metazellerite
name: Metazellerite
material_kind: mineral
description: >-
  Metazellerite (IMA 1965-032) is an IMA-accepted lower-hydrate calcium uranyl
  carbonate mineral with IMA September 2026 Master List formula
  Ca(UO2)(CO3)2·3H2O. Described by Coleman, Ross, and Meyrowitz (1966) from the
  oxidized zone of the Lucky Mc uranium mine, Gas Hills district, Fremont
  County, Wyoming, USA (and recognized in additional western United States
  deposits), where it forms as the chalky yellow dehydration product of
  zellerite (Ca(UO2)(CO3)2·5H2O; Table 2, p. 1571 raw analysis: CaO 10.8, UO3
  56.6, CO2 17.7, H2O+ 13.0, SiO2+insol. 0.5, R2O3 1.0, K2O 0.2, Na2O 0.4, total
  100.2 wt%, with H2O- 6.9 wt% determined separately at 110 ± 5 °C [normalized
  H2O- = 6.6 wt%]) associated with gypsum, limonite, and iron disulfides.
  Orthorhombic (space group Pbn21 or Pbnm), with a = 9.718(5) Å, b = 18.226(9)
  Å, c = 4.965(4) Å, V = 879.5(7) Å3, Z = 4, Dcalc = 3.414 g/cm3, and
  Gladstone-Dale calculated mean refractive index ncalc = 1.626.
identifiers:
