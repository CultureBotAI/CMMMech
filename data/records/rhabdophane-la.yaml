id: cmmmech:rhabdophane-la
name: Rhabdophane-(La)
material_kind: mineral
description: >-
  Rhabdophane-(La) is the lanthanum-dominant hydrated phosphate
  mineral listed by IMA-CNMNC with ideal formula La(PO4)·H2O and
  renamed status Rn, 1987 s.p., in September 2026. This entry does
  not provide a numbered IMA approval identifier. It is distinct
  from elemental lanthanum, mixed rare-earth phosphate material,
  rhabdophane-(Ce) and anhydrous monazite-(La). Ondrejka et al.
  (2018) characterized natural La-dominant members within mixed,
  compositionally zoned rhabdophane-group grains from the Velence
  Hills, Hungary, using electron microprobe and Raman spectroscopy.
  Their analyses include substitutions and mixed end-member
  contributions; neither every grain nor every La-Nd-rich zone is
  pure rhabdophane-(La). Natural-grain hydration is not measured by
  oxide totals alone. The 2019 erratum requires inclusion of Fe in
  formula calculations without recognizing an Fe end-member.
  Shelyug et al. (2018) separately characterized synthetic La
  rhabdophane and its thermal conversion to monazite. Their fitted
  monoclinic model and total-water coefficient 0.804 describe that
  preparation, not a universal species assay or revised IMA formula.
  No microbial mechanism, isolated lanthanum recovery, industrial
  deployment or inherited criticality designation is curated.
