- assessment_id: conditions
  area: scope
  topic: Natural-water arm and biomass state
  outcome: supported
  summary: Growing-cell assay and nutrient-supported laboratory conditions are correctly
    bounded.
  details: 10 microlitres exponential culture, 1 mL seawater, 25 mg tryptone plus
    15 mg yeast extract in 3 kDa dialysis tube, immersed in 1 L natural water; 30
    C, moderate shaking, 48 h, three independent experiments. No U addition described.
    Sampling every 12 h and final cell ICP-MS agree; pH values from separate protocols
    are not imported.
  target_ids:
  - cmmmech:seawater
  evidence_ids:
  - owner
  - article
- assessment_id: controls
  area: evidence
  topic: Comparators and causal scope
  outcome: supported
  summary: Observed cell-associated immobilization is supported without uniquely attributing
    water depletion.
  details: Figure 6b lacks a matched no-cell U trajectory; Figure 6e addresses surface
    fouling only. Nutrient/membrane blanks, full compartment balance, washing/digestion
    and source-water collection remain unresolved. Added nutrients and growing biomass
    prevent treating cells as a fixed-mass passive sorbent.
  target_ids:
  - cmmmech:seawater
  evidence_ids:
  - owner
  - article
  - si
- assessment_id: quantity
  area: quantity
  topic: Mass units and denominators
  outcome: supported
  summary: Reported final dry-cell concentration and water decline remain qualified
    assay outcomes.
  details: 24.33% water immobilization and 213.89 +/- 9.01 mg U/kg final dry cells
    are not isolated-product yield. Table S2 water U is 3.10 micrograms/kg despite
    general mg/kg header. 9456.59/0.00310 = 3050512.9, not reported 625746.40; 213.89/0.00310
    = 68996.77. Initial-culture 9456.59 mg/kg (9.46 mg/g) is excluded as a comparable
    final-biomass capacity. Reviewer arithmetic diagnoses inconsistency, not a replacement
    corrected measurement. No structured observations or additive-element source attribution
    asserted.
  target_ids:
  - cmmmech:seawater
  evidence_ids:
  - owner
  - article
  - si
- assessment_id: mechanism
  area: evidence
  topic: Process classification and molecular inference
  outcome: supported
  summary: Biosorption is acceptable only with the explicit broad-label qualification.
  details: Record says adsorption, intracellular accumulation and other routes were
    not quantitatively partitioned in natural water. Spiked LB/seawater, simulated
    seawater and prepared debris are separate experiments; the 90-second adsorption
    observation is not transferred. Proteinase treatment loses43.69% of the biomass,
    confounding binding attribution. Authors interpret XPS as retained U(VI), not
    U(IV) reduction. Cluster predictions do not demonstrate specific antimicrobial
    production or cause the fouling outcome.
  target_ids:
  - cmmmech:seawater
  evidence_ids:
  - owner
  - article
  - si
