    annotation_note: 'Grounded to reviewed Swiss-Prot entry UniProtKB:Q51548 (PVDA_PSEAE; pvdA / PA2386) in Pseudomonas aeruginosa PAO1 reference proteome UP000002438 (NCBITaxon:208964; UniProtKB organism string: Pseudomonas aeruginosa (strain ATCC 15692 / DSM 22644 / CIP 104116 / JCM 14847 / LMG 12228 / 1C / PRS 101 / PAO1)) as a species-level ortholog proxy for strain CIP 105094 (mechanisms[].organisms[].id NCBITaxon:287) in Yin (2014) / van Hullebusch et al. (2015).'
    evidence:
    - source_ref: yin2014_thesis
      supports: partial
      explanation: Yin (2014) Chapter 8 Section 8.4.3 and schematic Figure 8.9 propose siderophore (pyoverdine) complexation and cell-surface binding to explain enhanced elemental mobilization from granulated Noyelles-Godault lead blast-furnace slag by Pseudomonas aeruginosa CIP 105094 relative to sterile succinate-TRIS medium over 140 days, without directly quantifying siderophores or testing pvdA mutants.
