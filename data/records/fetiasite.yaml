id: cmmmech:fetiasite
name: Fetiasite
material_kind: mineral
description: 'Anhydrous iron(II,III)-titanium pyroarsenite (diarsenite) mineral with current
  September 2026 IMA-CNMNC approved formula (Fe2+,Fe3+,Ti)3O2(As3+2O5), status A, and approval
  number IMA 1991-019. Graeser, Schwander, Demartin, Gramaccioli, Pilati, and Reusser (1994)
  described cotype specimens (deposited in the Natural History Museum, Basel, and the Mineralogical
  Institute, University of Basel) from Alpine fissures in two-mica gneisses of the Monte Leone
  nappe at Pizzo Cervandone (~3000 m, Alpe Devero, Novara Province, Piedmont, Italy; Locality
  A) and the Lercheltini-Zone at Gorb, Binntal (~2000 m, Canton Valais, Switzerland; Localities
  B and C), where it coexists with quartz, magnetite, hematite, rutile, anatase, cafarsite,
  asbecasite, tilasite, and chernovite-(Y). ARL electron-microprobe analyses (Table 3, p.
  999, with Fe2+/Fe3+ = 1.5 fixed by single-crystal charge balance and confirmed by wet-chemical
  KMnO4 titration of FeO) yielded for Locality A (mean of 7 analyses): As2O3 46.95, FeO 23.12,
  Fe2O3 17.13, TiO2 10.09, MnO 1.25, total 98.54 wt%, empirical formula (Fe2+1.38Fe3+0.92Ti0.54Mn0.08)Sigma2.92O2[As2O5];
  and for Locality B (mean of 10 analyses): As2O3 46.76, FeO 24.23, Fe2O3 17.93, TiO2 11.17,
  MnO 0.89, total 100.98 wt%, empirical formula (Fe2+1.40Fe3+0.93Ti0.58Mn0.05)Sigma2.96O2[As2O5]
  (close to ideal Fe2+1.4Fe3+1.0Ti4+0.6O2As2O5). Single-crystal CAD-4 X-ray diffraction refinements
  in monoclinic space group P21/m (Z = 2, Tables 5-8, pp. 999-1001) gave a = 10.614(2), b
  = 3.252(1), c = 8.945(1) A, beta = 108.95(2) degrees, V = 291.9(2) A3, R = 0.029, wR = 0.036
  for 1168 reflections, and Dcalc = 4.74 g/cm3 on Locality A, and a = 10.616(1), b = 3.242(1),
  c = 8.932(1) A, beta = 108.89(2) degrees, V = 290.9(2) A3, R = 0.023, wR = 0.030 for 1200
  reflections, and Dcalc = 4.80 g/cm3 on Locality B (Dmeas = 4.6(1) g/cm3 by pycnometry on
  Locality C; VHN50 = 475 kg/mm2, Mohs hardness ~5), revealing a novel octahedral framework
  of three independent M(1)-M(3) (Fe,Ti)O6 sites linked by corner-sharing trigonal-pyramidal
  [As2O5]4- diarsenite groups with channels hosting As3+ lone-pair electrons. Distinct from
  paulmooreite (Pb2As2O5), schneiderhohnite, cafarsite, and elemental arsenic, titanium, or
  manganese; no criticality designation, microbial mechanism, or industrial recovery yield
  is asserted.'
