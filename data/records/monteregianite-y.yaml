mechanisms:
  - id: abiotic_zeolitic_thermal_dehydration_and_rehydration
    name: >-
      Laboratory reversible zeolitic dehydration-rehydration and high-temperature
      vitrification of natural monteregianite-(Y)
    process: other
    description: >-
      Simultaneous thermogravimetric (TGA) and derivative thermogravimetric
      (DTG) analyses together with DTA (solid) and DTG (dashed) curves recorded
      at a heating rate of 10 °C/min in air (Chao 1978, pp. 563–564, Fig. 3)
      show that dehydration of monteregianite-(Y) begins almost immediately on
      heating and is essentially complete near 400 °C in three distinct stages
      at 25–80 °C, 80–200 °C, and 200–400 °C with weight loss in the approximate
      ratio 1:2:2, and a total weight loss of 11.40 wt% after heating to
      1000 °C. On cooling from 650 °C to room temperature, approximately 99% of
      the lost water is recovered within two hours, and the rehydrated material
      yields an X-ray powder diffraction pattern identical to that of unheated
      monteregianite-(Y), demonstrating the zeolitic nature of the water.
      Material quenched from 750 °C shows signs of melting, and material
      quenched from 1000 °C is amorphous to X-rays. Infrared spectra (Chao
      1978, pp. 563–564, Fig. 4) corroborate three groups of structurally
      distinct water via resolved O–H stretching bands at 3460, 3510, and 3610
      cm-1 alongside H–O–H bending at 1630 cm-1, which Ghose, Sen Gupta, and
      Campana (1987, p. 372, Table 2 on p. 366, and Table 4 on p. 368) assign
      respectively to H-bonded octahedral-sheet water molecules W(1) and W(2)
      (occupancy 1.0, leaving near the 240 °C dehydration peak), weakly
      bifurcated H-bonded channel water W(3) (occupancy 0.95), and non-H-bonded
      channel water molecules W(4) (occupancy 0.46), W(5) (occupancy 0.35), and
      W(6) (occupancy 0.37) leaving at the start of the 80–200 °C stage after
      disordered channel water leaves at 25–80 °C.
    context: >-
      Laboratory simultaneous TGA/DTG, DTA (10 °C/min in air), quenching,
      room-temperature rehydration, X-ray powder diffraction, and infrared
      spectroscopic experiments on natural Mont St-Hilaire monteregianite-(Y)
      reported by Chao (1978, pp. 563–564, Figs. 3–4), structurally correlated
      with octahedral and channel water sites W(1)–W(6) by Ghose, Sen Gupta, and
      Campana (1987, pp. 365–366, 368, 372, Tables 2 and 4).
    microbial: false
    evidence:
      - source_ref: chao_1978_monteregianite
        supports: support
        explanation: >-
          Pages 563–564 and Figures 3–4 document simultaneous TGA and DTG
          analyses and DTA/DTG curves (heating rate 10 °C/min in air) showing
          three-stage dehydration at 25–80 °C, 80–200 °C, and 200–400 °C in an
          approximate 1:2:2 weight-loss ratio, 11.40 wt% total weight loss after
          heating to 1000 °C, ~99% recovery of lost water within two hours on
          cooling from 650 °C with an X-ray powder diffraction pattern identical
          to unheated monteregianite, signs of melting when quenched from
          750 °C, X-ray amorphization when quenched from 1000 °C, and IR water
          bands at 1630 cm-1 (H–O–H bending) and 3460, 3510, and 3610 cm-1 (O–H
          stretching).
      - source_ref: ghose_1987_monteregianite
        supports: support
        explanation: >-
          Pages 365–366, 368, and 372 and Tables 2 and 4 resolve six independent
          water positions in the monoclinic P21/n double-sheet silicate
          structure: two fully occupied octahedral-sheet water molecules W(1)
          and W(2) (occupancy 1.0, bonded to two Na atoms each and H-bonded to
          O(10A)/O(10B) at 2.874 and 3.019 Å, matched to the 3460 cm-1 IR band
          and the 240 °C dehydration peak) and four partially occupied channel
          water sites W(3) (occupancy 0.95, bonded to K at 2.89 Å and H-bonded
          to W(4)/W(5) at 2.984 and 2.987 Å, matched to the 3510 cm-1 band) and
          W(4)–W(6) (occupancies 0.46, 0.35, and 0.37, bonded to K without H
          bonding, matched to the 3610 cm-1 band and the onset of the 80–200 °C
          dehydration stage).
