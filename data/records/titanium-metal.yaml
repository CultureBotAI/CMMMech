mechanisms:
- id: culture_ferric_grinding_of_titanium_sponge
  name: Culture-containing ferric-solution grinding of titanium sponge feeds
  process: other
  microbial: true
  organisms:
  - id: NCBITaxon:920
    label: Acidithiobacillus ferrooxidans
  description: Baranov and colleagues processed titanium sponge and a source-described titanium slag in
    a rotating disintegrator with ferric-sulfate solution containing Thiobacillus ferrooxidans. They obtained
    fine agglomerated powders reported to contain titanium oxides and hydride. This supports a culture-associated
    mechanical and chemical workflow; it does not isolate bacterial causality, demonstrate microbial titanium
    reduction, or establish a pure titanium-metal product.
  context: Figure 1 on page 132 shows sponge feeds labelled 0.1-1 mm and 0.1-3 mm, and a waste feed labelled
    titanium slag, 10-100 mm. The stated research tasks instead refer to titanium cut-offs. Waste provenance,
    grade and initial phase composition are not resolved, so the waste is not equated with a defined smelting
    slag or with sponge. Feed and bacterial solution were mixed 1:1 by mass. Reported product data are
    not assigned to separate sponge sizes or waste arms, and it is unclear whether the feeds were processed
    separately or combined. No strain accession, culture-purity check, inoculum amount, ferric concentration,
    nutrient recipe, pH, temperature, duration, rotation speed, vessel volume or replicate count is provided.
  evidence:
  - source_ref: baranov2013-sponge
    supports: support
    explanation: Pages 132-134 document the feeds, culture-containing dispersing solution, repeated fragment
      collisions and recovered fine solids. The page 133 table reports average relative Ti contents of
      95.84 percent in starting material and 98.14 percent in powder, with Cr, Fe and Ni also listed.
      These four-element compositions are not titanium extraction yields or metallic phase purity. Elvax
      light XRF does not account for oxygen or hydrogen here; the authors explicitly acknowledge missing
      gaseous impurities. No isolated masses or solution/solid mass balance is supplied.
  - source_ref: baranov2013-sponge
    supports: partial
    explanation: The source reports oxide and hydride phases from DRON-4-07 diffraction but displays no
      diffractogram or phase fractions; it says unclear individual peaks prevented crystallite sizing.
      The title and some captions call the material titanium powder, while the results and conclusion
      identify titanium compounds and reserve pure titanium production for future work under an altered
      atmosphere. Neither a named oxide polymorph, hydride stoichiometry nor pure Ti(0) nanoparticle production
      is adopted.
  - source_ref: baranov2013-sponge
    supports: partial
    explanation: Figure 2 SEM images show agglomeration; Figure 3 TEM images follow ultrasonic preparation
      and carry 100 nm and 500 nm scale bars. Figure 3's caption repeats the 2500-fold and 1000-fold labels
      used for Figure 2, so those nominal magnifications are not adopted as calibrated TEM measurements.
      The text estimates an average grain size not exceeding 150-200 nm and the conclusion gives 100-200
      nm, without a counted size distribution, sampling error or yield of that size fraction. These estimates
      do not establish a uniformly nanoscale powder or a bulk crystallite size.
  - source_ref: baranov2013-sponge
    supports: partial
    explanation: Pages 133-134 attribute redox-potential maintenance and acid regeneration to the bacteria,
      but provide no measured redox, acidity, culture-growth or iron-oxidation series. There is no matched
      sterile ferric-solution, acid-only or mechanical-only control. The paper's generic faster-leaching,
      low-cost and waste-free claims are therefore not demonstrated comparisons. Equipment throughput
      and deployment are not established; the proposed inert-atmosphere refinement is future work, not
      an experimentally demonstrated pure-metal recovery stage.
  - source_ref: ncbi-ferrooxidans
    supports: context_only
    explanation: The authority maps the paper's historical species name to Acidithiobacillus ferrooxidans,
      NCBITaxon:920. This does not authenticate an unaccessioned stock or establish that a pure culture
      caused the observed material changes.
