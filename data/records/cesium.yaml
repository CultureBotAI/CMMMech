id: cmmmech:cesium
name: Cesium
material_kind: element
description: Cesium (caesium; Cs), represented as an element distinct from Cs(I) salts, radioactive
  isotopes, pollucite mineral and cesium-bearing commodities or wastes. A laboratory study measured
  Cs retained by washed Bifidobacterium adolescentis biomass after growth in non-radioactive cesium
  chloride. The US 2025 critical-mineral designation names the cesium commodity; it does not designate
  every cesium compound or imply deployment of a microbial recovery process.
