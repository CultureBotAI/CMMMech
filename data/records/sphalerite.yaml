      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 sulfur-oxidation enzyme (AFE_1792) for oxidative removal of the surface sulfur layer on sphalerite in Fowler & Crundwell (1999); individual sqr/tth genes were not mutated.
  - uniprot_accession: UniProtKB:B7J3C9
    entry_name: TTH_ACIF2
    protein_name: Tetrathionate hydrolase
    gene_symbol: tth
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:243159
      label: Acidithiobacillus ferrooxidans ATCC 23270
    reference_proteome_id: UP000001362
    ec_numbers:
    - EC:3.12.1.-
    interpro_ids:
    - InterPro:IPR018391
    - InterPro:IPR002372
    - InterPro:IPR011047
    - InterPro:IPR015943
    pfam_ids:
    - Pfam:PF13360
    functional_role: Periplasmic tetrathionate hydrolase (EC 3.12.1.-; tth / AFE_0029) hydrolyzing tetrathionate into thiosulfate, elemental sulfur, and sulfate, generating sulfuric acid protons.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000001362 for Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159).
    evidence:
    - source_ref: fowler_crundwell_1999
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 sulfur-oxidation enzyme (tth) for oxidative sulfur/acid generation in Fowler & Crundwell (1999); individual sqr/tth genes were not mutated.
  evidence:
  - source_ref: fowler_crundwell_1999
    supports: support
    explanation: Figures 2-3 show later divergence of zinc dissolution after an initial approximately 8-12 h interval with similar dissolution. Figures 5-6 compare surfaces at Fe(II) 4 g/L after 100 h and 8 g/L after 69 h, respectively. SEM/EDAX and shrinking-core fits support the authors' sulfur-layer explanation, without a sulfur mass balance or enzyme assay. These surface endpoints are distinct from the shorter Figure 2 dissolution time course. No recovery percentage is estimated from the figures.
  - source_ref: fowler_crundwell_1999
    supports: partial
    explanation: The 1 g/L Fe(II) series in Figures 2-3 also departs from equal dissolution, in tension with the Discussion's sharp low-ferrous null boundary. A universal 1 g/L threshold is therefore not asserted. Figure 10 reanalyzes earlier 1998 data and is not new independent replication.
  - source_ref: fowler_crundwell_1998
    supports: partial
    explanation: Methods and Figures 4-6 report similar zinc dissolution in inoculated and chemical runs with Fe(II) fixed at 1 g/L and varied Fe(III), despite bacterial growth and attachment. This conditional null limits a universal enhancement claim. Figure 3's illustrative current caption gives different iron concentrations from the Methods; no quantitative current-based claim is taken from that panel.
