mechanisms:
- id: hydrogenoformans_associated_phosphate_crystallization
  name: Culture-associated crystallization of whitlockite-assigned calcium phosphate
  process: biomineralization
  description: An initially abiotic amorphous calcium-phosphate precipitate became crystalline during laboratory culture of C. hydrogenoformans DSM 6008. The dominant granular product was assigned to magnesium whitlockite using diffraction, composition and infrared evidence, but the authors also allow Mg-stabilized beta-TCP. A second nanorod product was only interpreted as hydroxyapatite-like. The experiment supports culture-associated crystallization, not unequivocal pure-whitlockite biosynthesis, a demonstrated molecular mechanism or isolated phosphorus recovery.
  context: Haddad2014 used anaerobic 500 mL bottles containing 200 mL medium and 300 mL initial 100% CO headspace at 1 atm, 70 degrees C and 150 rpm; initial pH was 6.8-7.0. Basal salts in g/L were KCl 0.33, MgCl2.6H2O 0.52, CaCl2.2H2O 0.29, NH4Cl 0.33 and KH2PO4 0.33, with 10 mL/L trace-metal stock. Additions per litre were 20 mL of 5% NaHCO3, 10 mL of 2.5% Na2S.9H2O, 10 mL of 0.5% yeast-extract stock and 1 mL vitamin solution. Exact inoculum amount was not reported. Most phase comparison concerns 30-day material; bulk metal/P composition is from a separate 39-day sample and protein assays from four independent 21-day cultures. Samples were washed and dried at 105 degrees C overnight; some inoculated products were subsequently calcined at 600 degrees C. Sterile and inoculated preparations differed in washing and thermal treatment. Mg-stabilized beta-TCP remains an explicit alternative to whitlockite; neither nanorod morphology nor a reference-pattern match alone proves a pure mineral product.
