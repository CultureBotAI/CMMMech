mechanisms:
- id: cn32_reductive_dissolution
  name: CN32-associated reductive dissolution of synthetic Pb-jarosite
  process: redox_transformation
  description: Washed living CN32 cells were associated with increased filtered ferrous iron during anaerobic exposure to synthetic Pb-jarosite relative to sterile mineral controls. Lead in the filtrate rose transiently and subsequently became very low; electron-dense Pb-enriched particles were observed with cells. These observations support a laboratory reduction and redistribution process. They do not establish complete mineral dissolution, a named pure lead-phosphate product, isolated lead recovery or a demonstrated gene mechanism.
  context: Synthetic Pb-jarosite was prepared in chloride/sulfate solution at about 98 degrees C for 72 hours, washed with hot sodium chloride and water, dried at 110 degrees C and checked by powder diffraction (SI S1/Figure S1). The reduction assay used 0.0500 +/- 0.0013 g mineral with 16 mL modified M1 medium in 20 mL tubes, approximately 0.016 g wet cells per inoculated tube, 24 mM sodium lactate and 20 mM PIPES, initially adjusted to pH 7.3 without added phosphate. Tubes were rotated in a 96% nitrogen/4% hydrogen chamber. Mineral arms were sampled destructively in triplicate through nominal 768 hours; inoculated and sterile medium-only controls were sampled in duplicate. Cultures had been grown aerobically at 32 degrees C; a separate dissolution-incubation temperature is not specified in the inspected methods, so 32 degrees C is not assigned to that assay. Filtrate passed a 0.20 micrometre nylon filter; ICP-OES and ferrozine assays have different fractions and do not measure a recovered
    product.
