id: cmmmech:renierite
name: Renierite
material_kind: mineral
description: >-
  Renierite is the mineral species listed by IMA-CNMNC in September 2026
  with formula (Cu1+,Zn)11Fe4(Ge4+,As5+)2S16 and renamed status, 2007 s.p.
  The special-procedure date is not an IMA approval-number identifier.
  The older Handbook uses the spelling Renierite with an acute accent on
  the second e and describes a tetragonal, pseudocubic sulfide occurring
  in germanium-bearing hydrothermal polymetallic deposits, including
  Kipushi and Tsumeb. Bernstein's 1986 electron-microprobe study supports
  coupled compositional variation between zincian Cu10ZnGe2Fe4S16 and
  arsenian Cu11GeAsFe4S16 within renierite; these compositional endmembers
  are not assigned separate accepted-species records here. Table 3 combines
  newly measured analyses, earlier literature values and ideal formulas,
  and Figure 4 distinguishes those origins. Microscopy shows intergrowths
  with other sulfides, including germanite, rather than identical material
  identity. This record concerns the mineral, not a bulk copper ore,
  germanium element or a traded metal. No microbial extraction mechanism,
  isolated recovery yield, present production or inherited criticality is
  asserted from these mineralogical observations.
