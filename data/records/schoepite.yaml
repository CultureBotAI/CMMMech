id: cmmmech:schoepite
name: Schoepite
material_kind: mineral
description: >-
  Schoepite is a uranyl oxide hydroxide hydrate mineral with the current
  IMA formula (UO2)4O(OH)6·6H2O, distinct from metaschoepite, elemental
  uranium and products historically called dehydrated schoepite. The
  September 2026 IMA list gives approved status A and 1962 s.p.; this
  special-procedure year is not a conventional approval accession or
  the 1923 original-description year. Plášil's 2018 study of natural
  Shinkolobwe crystals supports orthorhombic Pbca, revising the earlier
  P21ca model. For museum specimen RGM2708, Table 2 gives a = 16.7810(5),
  b = 14.7044(4), c = 14.2985(5) angstrom, Z = 8 at 297 K. The
  linked CIF agrees on these cell parameters but prints formula_sum
  H36 O21 U4 and calculated density 4.9865 g/cm3, conflicting with
  the paper's formula, which implies H18 O21 U4, and density 4.918 g/cm3.
  The CIF metadata are not used to redefine the species. The second
  crystal's Table 1 residual 0.0343 also differs from the prose's
  two-to-three-percent wording. No criticality, microbial activity or
  industrial uranium recovery is inferred.
