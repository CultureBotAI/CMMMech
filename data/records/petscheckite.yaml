mechanisms:
  - id: abiotic_metamict_thermal_recrystallization
    name: Abiotic thermal recrystallization and 1000 °C disproportionation of metamict petscheckite
    process: other
    description: >-
      Thermal annealing of X-ray amorphous metamict oxy-petscheckite at red heat
      (~650 °C) restores its trigonal P-31m crystal structure (a = 6.42 Å, c =
      4.02 Å, Z = 1; with specific gravity reported for petscheckite generally
      increasing from 5.0 unheated to 5.5 after heating), whereas heating
      partially hydrated hydroxy-petscheckite at 1000 °C for 24 hours dehydrates
      and disproportionates it into cubic uranpyrochlore U4+(Nb,Ta)2O7 (a =
      10.36 Å) plus oxy-petscheckite.
    context: >-
      Abiotic laboratory furnace annealing at red heat (~650 °C) and 24-hour
      calcination at 1000 °C monitored by X-ray powder diffraction; no
      microbial, enzymatic, or bioleaching mechanism was tested or reported in
      Mücke and Strunz (1978).
    microbial: false
    evidence:
      - source_ref: muecke_1978_petscheckite
        supports: support
        explanation: >-
          Heating X-ray amorphous metamict oxy-petscheckite at red heat (~650
          °C) restores its trigonal P-31m crystal structure (a = 6.42 Å, c =
          4.02 Å, Z = 1, while general petscheckite specific gravity increases
          from 5.0 unheated to 5.5 after heating), whereas heating partially
          hydrated hydroxy-petscheckite for 24 hours at 1000 °C dehydrates and
          disproportionates it into cubic uranpyrochlore U4+(Nb,Ta)2O7 (a =
          10.36 Å) plus oxy-petscheckite (pp. 941–945, Tables 3–4, 6).
