id: cmmmech:childrenite
name: Childrenite
material_kind: mineral
description: Childrenite is the Fe2+-dominant aluminium phosphate mineral with ideal formula Fe2+Al(PO4)(OH)2(H2O),
  distinct from the Mn2+-dominant endmember eosphorite and oxidized related phases. The September 2026
  IMA list records grandfathered status and original-description year 1823. Toupal et al. (2024) characterized
  two natural grains in granite collected on 11 July 2020 from two outcrops near the southern boundary
  of the Homolka granite, Czech Republic. Twenty electron-microprobe spots across those two grains gave
  Fe/(Fe+Mn) from 0.51 to 0.86; these are analytical spots, not twenty independent specimens. Single-crystal
  diffraction and Raman measurements on Grain A support an orthorhombic Cmca childrenite structure with
  divalent-cation bond valence at the mixed Fe site. This is specimen-specific structural evidence, not
  a direct oxidation-state assay of every natural childrenite. It improves on the older Handbook's Bba2
  assignment and possible monoclinic interpretation without treating all historical specimens as identical.
  The crystals show patchy Fe/Mn zoning and probable uraninite inclusions; the inclusions are not independently
  confirmed as a uranium mineral here. Calculated water raises all microprobe totals above 100 wt%, which
  the authors attribute to beam-induced partial dehydration; this is not a controlled dehydration experiment.
  The chemical and structural observations distinguish the investigated grains from a merely compositionally
  similar ferric phase. The official CIF and main Table 2 disagree on temperature, 273(2) versus 293(2)
  K, and measured-reflection count, 5429 versus 5682; neither disputed value is adopted as a resolved
  condition. The CIF's Fe/Ca scattering-site model and formula-sum field are not treated as the measured
  Fe/Mn/Ca chemistry, and its analytical Si0.04 differs from the main formula's approximately Si0.01.
  These source limits do not remove the agreement on the unit cell, Cmca symmetry and the 602 observed
  reflections underlying R1=0.0295. This record establishes natural-mineral identity only, without an
  experimentally demonstrated formation, extraction, microbial transformation or recovery mechanism. No
  criticality designation is inherited from constituent elements.
