id: cmmmech:artinite
name: Artinite
material_kind: mineral
description: Artinite is the hydrated basic magnesium carbonate mineral Mg2(CO3)(OH)2(H2O)3, conventionally
  Mg2(CO3)(OH)2·3H2O. The September 2026 IMA-CNMNC list gives grandfathered status and original-description
  year 1902; that year is not an approval identifier. Artinite is distinct from dypingite, hydromagnesite,
  nesquehonite, magnesium metal and mixed carbonate binders. The curated evidence is laboratory abiotic
  dissolution and precipitation, without inherited constituent criticality or a demonstrated microbial
  recovery mechanism.
sources:
