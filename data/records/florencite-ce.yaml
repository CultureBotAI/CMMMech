id: cmmmech:florencite-ce
name: Florencite-(Ce)
material_kind: mineral
description: Florencite-(Ce) is the cerium-dominant aluminium phosphate mineral CeAl3(PO4)2(OH)6. It is
  distinct from other florencite species, the broader crandallite group, cerium as an element and mixed
  coal wastes containing REE-bearing particles. Li and colleagues (2022) synthesized a cerium phosphate
  preparation assigned to florencite by powder diffraction and morphology, then examined solid composition
  after alkaline treatment and subsequent acid leaching. These are abiotic laboratory experiments on a
  synthetic analogue. Changes in SEM-EDS composition support a qualified preferential-leaching interpretation;
  they do not quantify a mineral-specific extraction or isolated-product yield. The same article's bulk
  coal-waste recovery percentages and particle classifications are not transferred to this mineral. Microbial
  activity, criticality and industrial deployment are unrecorded.
