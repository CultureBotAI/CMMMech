id: cmmmech:albite
name: Albite
material_kind: mineral
description: Albite is the triclinic sodium feldspar mineral with ideal formula NaAlSi3O8. The September
  2026 IMA list marks it grandfathered (G; historical year 1815), not with a numbered approval accession.
  It is distinct from the feldspar commodity, the potassium-feldspar family, other plagioclase compositions
  and mixed ores containing albite. The accepted dissolution evidence concerns source-identified Amelia
  clevelandite under abiotic laboratory conditions; neither microbial activity nor criticality is inferred
  from elemental composition.
