id: cmmmech:karlseifertite
name: Karlseifertite
material_kind: mineral
ima_symbol: Karl
description: >-
  IMA-approved lead-gallium-germanium arsenate hydroxide mineral of the dussertite group in
  the alunite supergroup (IMA 2024-007; Warr symbol Karl in the primary description and Ksf
  in the IMA Master List; status A, Approved 2024; full description published September 2024)
  with ideal end-member formula Pb(Ga2Ge)(AsO4)2(OH)6 (requiring As2O5 28.76 wt%, PbO
  27.93 wt%, Ga2O3 23.46 wt%, GeO2 13.09 wt%, H2O 6.76 wt%, total 100.00 wt%; Kampf et al.,
  2024, European Journal of Mineralogy 36:873-878). Represents the first member of the
  alunite supergroup containing essential Ge and the first member of the dussertite group
  defined by valency-imposed double site occupancy (Ga3+2Ge4+) at the octahedral G site;
  named in honour of German mining engineer Karl Markus Seifert (1911-2000), mining engineer
  for Tsumeb Corporation Ltd. (1963-1967), using the full name karlseifertite to avoid
  homonymy with seifertite (SiO2). Discovered on specimens collected by Karl Seifert from the
  second oxidation zone of the Tsumeb mine, Tsumeb, Namibia (19 deg 15 min S, 17 deg 42 min E),
  where it occurs as a secondary oxidation-zone mineral on fracture surfaces in
  germanite-chalcocite ore; one holotype specimen (catalogue number 76334) and one cotype
  specimen (catalogue number 76335) are deposited in the Natural History Museum of Los
  Angeles County, Los Angeles, California, USA. Occurs in rosettes of thin, transparent,
  yellow hexagonal plates bounded by {001} and {100} up to ~0.2 mm in diameter and <0.01 mm
  thick with a pale-yellow streak, subadamantine lustre, estimated Mohs hardness ~4, brittle
  tenacity, irregular fracture, perfect {001} cleavage, non-fluorescence under long- or
  short-wave ultraviolet light, room-temperature insolubility in dilute HCl, and calculated
  density Dcalc = 4.993 g/cm3 for the empirical formula (or 5.037 g/cm3 for the SREF formula
  Pb0.99Ga3.10As1.92O14H6 in Table 3) on the single-crystal unit cell. Optically uniaxial (+)
  in white light with omega = 1.890(5), spindle-stage Berek-compensator birefringence
  epsilon - omega = 0.004 giving calculated epsilon = 1.894, slight pleochroism with O light
  yellow > E pale yellow, and Gladstone-Dale compatibility index 1 - (Kp/Kc) = -0.001
  (superior). Micro-Raman spectroscopy (532 nm laser; Figure 2) shows a very broad O-H
  stretching band from ~3400 to ~2800 cm-1, nu3 and nu1 AsO4 stretching bands at 942, 855,
  and 767 cm-1, nu4 and nu2 AsO4 bending bands at 577 and 498 cm-1, and lower-wavenumber
  lattice modes at 305, 247, 205, and 140 cm-1. Field-emission electron microprobe analysis
  (8 points, JEOL JXA-iHP200F, 15 kV, 5 nA, 10 um beam; Table 1) yielded PbO 26.80(33) wt%
  (range 26.33-27.46), As2O5 21.05(44) wt% (20.35-21.47), Ga2O3 18.05(24) wt% (17.62-18.42),
  GeO2 8.60(22) wt% (8.36-9.06), Fe2O3 5.53(55) wt% (4.88-6.42), WO3 4.82(25) wt%
  (4.49-5.08), SO3 3.00(22) wt% (2.70-3.31), Al2O3 0.75(3) wt% (0.72-0.78), and structure-
  calculated H2O 6.45 wt% (based on O = 14 and As + S + W = 2), total 95.05 wt% (low total
  due to poor polish and <10 um plate thickness), corresponding on the basis of 14 O atoms
  per formula unit to the empirical formula
  Pb2+0.99(Ga3+1.60Ge4+0.68Fe3+0.57Al3+0.12)Sigma2.97[(As5+0.76S6+0.15W6+0.09)Sigma1.00O4]2(OH0.99)6
  and simplified formula Pb(Ga,Ge,Fe3+,Al)[(As,S,W)O4]2(OH)6 as printed on p. 874 (where the
  subscript 3 on the octahedral G-site group (Ga,Ge,Fe3+,Al)3 corresponding to the
  alunite-supergroup general formula DG3(TX4)2X'6 is omitted in the paper's text). Crystallizes
  in the trigonal
  system, space group R-3m (#166), with single-crystal X-ray diffraction unit-cell parameters
  a = 7.2814(7) A, c = 17.1077(12) A, V = 785.50(15) A3, and Z = 3 (refined to R1 = 0.0591,
  wR2 = 0.1403 for 248 reflections with I > 2sigma(I) and R1(all) = 0.0595, wR2 = 0.1407,
  GoF = 1.276 for 250 unique reflections from 3746 collected at 293(2) K on a 130 x 130 x 5 um
  plate using MoKalpha radiation, Table 3; Gandolfi powder profile refinement gave
  a = 7.280(5) A, c = 17.121(12) A, V = 785.8(12) A3). In the alunite-supergroup structure
  (Tables 4-6), 12-coordinated Pb at (0,0,0) has Pb-O2 = 2.785(7) A x 6 and Pb-O3 = 2.838(4) A
  x 6 (weighted arithmetic mean 2.812 A, printed in Table 5 as <Pb-O> = 2.802 A; BVS =
  2.10 v.u. with a +6.98 e/A3 residual peak 0.83 A along z from 6s2 lone-pair displacement),
  octahedral Ga/Ge at (0.5,0,0.5) has Ga-O2 = 1.959(7) A x 2 and Ga-O3 = 1.965(3) A x 4
  (weighted mean 1.963 A, printed in Table 5 as <Ga-O> = 1.993 A; BVS = 3.26 v.u.), and
  tetrahedral As at (0,0,0.31214(11)) has As-O1 = 1.671(13) A and As-O2 = 1.699(7) A x 3
  (weighted mean 1.692 A, printed in Table 5 as <As-O> = 1.694 A; BVS = 4.91 v.u.), with
  O3-H...O1 hydrogen bonds (D...A = 2.820(9) A; note that in Table 6 the rounded anion BVS
  rows sum to 1.82 v.u. for O1 and 1.94 v.u. for O2 vs printed 1.81 and 1.95 v.u.). The eight
  strongest observed powder X-ray diffraction lines (dobs in A (Iobs; hkl), MoKalpha, Table 2)
  are 3.073 (100; 1 1 3), 5.919 (50; 1 0 1), 3.644 (29; 1 1 0), 2.280 (27; 1 0 7), 1.973 (27;
  0 3 3), 1.821 (23; 2 2 0), 2.853 (19; 0 0 6), and 2.540 (19; 0 2 4). No biological or
  microbial interaction data are reported in the type mineralogical description.
