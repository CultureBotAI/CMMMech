id: cmmmech:high-purity-iron-ore
name: High-purity iron ore
material_kind: commodity
description: >-
  The high-purity iron-ore raw-material category named in Canada's 2024 Critical
  Minerals List for green steelmaking. It covers ore and concentrate supply for
  that use, distinct from elemental iron, high-purity iron metal, steel, or any
  single iron-bearing mineral species. The inspected federal list does not give
  a numerical purity specification. Newfoundland and Labrador's Julienne Lake
  example describes beneficiation of lower-grade ore into a concentrate with
  more than 66% iron and less than 5% silica; those project-specific values are
  not a universal definition of the Canadian category. No microbial upgrading
  or recovery mechanism is asserted here.
