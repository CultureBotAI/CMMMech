mechanisms:
- id: galdieria_yttrium_association
  name: Yttrium association with washed Galdieria ACUF 427 biomass
  process: other
  microbial: true
  organisms:
  - id: NCBITaxon:83373
    label: Galdieria
  description: >-
    Living cultures reported as Galdieria sulphuraria ACUF 427 yielded washed
    biomass containing yttrium after exposure to synthetic Y(III) solutions.
    The measured biomass-associated amount was lower in a quaternary REE
    mixture than in the corresponding single-element treatments. The experiment
    does not separate surface binding from intracellular accumulation or other
    material retained with the biomass.
  context: >-
    ACUF 427 originated from acidic soil in Gunnuhver, Iceland, and was obtained
    from the University of Naples algal collection. The 2022 source calls it
    G. sulphuraria; a 2025 primary study calls ACUF 427 G. daedala. The record
    therefore uses the verified genus identifier and retains the exact strain
    designation, without assigning the former species identifier to a newly
    named taxon. Cultures were prepared in Allen medium, pelleted and washed
    twice before exposure. Living biomass at an initial optical density of
    5 at 550 nm was incubated in 2 mL water-plus-metal solutions in 24-well
    plates, with tilting agitation, at 37 degrees C for 24 h. Chloride salts
    supplied nominally 178 micromol/L of Y alone or each of Y, Ce, Eu and Tb
    in a mixture. The four initial pH values were 2.5, 3.5, 4.5 and 5.5,
    adjusted using sulfuric acid. The methods specify acid adjustment, although
    the abstract calls the solutions buffered. Metal-only and biomass-only
    controls were included; initial metal concentrations were checked by ICP-MS.
    Experiments were performed in triplicate, with mean and standard deviation
    reported. After exposure, supernatant and biomass were separated; the
    supernatant was filtered at 0.2 micrometres, and biomass was washed twice
    with water at the exposure pH before acid digestion and ICP-MS. Reported
    micromol/g values derive from the analyzed biomass fraction and its dry-mass
    denominator. They are not pure-metal yields. No resolved intracellular
    localization, desorption product or industrial operation is demonstrated.
  evidence:
  - source_ref: iovinella2022
    supports: support
    explanation: >-
      Sections 2.1-2.2 and Figures 1b and 3b support the individual-Y comparison:
      at initial pH 2.5 the text reports 22.43 +/- 2.05 micromol Y/g dry biomass
      in the single-element arm and 5.08 micromol/g in the mixed arm. These
      are source-reported biomass-associated amounts from distinct assay arms,
      not an isolated recovery percentage or a general selectivity coefficient.
  - source_ref: iovinella2022
    supports: partial
    explanation: >-
      For ACUF 427, Sections 2.1-2.2 and Figures 2b and 4b report no significant
      Y improvement across the tested pH range, unlike the stronger pH response
      of SAG 107.79. The abstract's broad pH conclusion is not applied uniformly
      to ACUF 427. Matched biomass-free controls and washing improve attribution,
      but the main article does not supply numerical Y control recoveries,
      complete fraction balances or a localization assay for these quoted
      results; its supplementary tables were unavailable in this curation. Binding,
      active uptake and biomass-associated precipitation remain unresolved;
      process other preserves that limitation.
  - source_ref: ciniglia2025_taxonomy
    supports: context_only
    explanation: >-
      Section 2 and its strain comparisons use Galdieria daedala ACUF 427.
      This supports the taxonomy caveat, not a new yttrium experiment or an
      inference that predicted transporters cause the 2022 biomass association.
