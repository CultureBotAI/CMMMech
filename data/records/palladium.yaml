material_kind: element
description: >-
  Palladium (Pd), chemical element with atomic number 46. This record concerns
  laboratory reduction of dissolved Pd(II) to cell-associated elemental Pd(0),
  not extraction from a palladium mineral or an industrial recovery operation.
