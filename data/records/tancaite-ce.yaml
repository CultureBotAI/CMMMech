id: cmmmech:tancaite-ce
name: Tancaite-(Ce)
material_kind: mineral
ima_symbol: Tnc-Ce
description: >-
  IMA-approved iron-cerium hydrated molybdate mineral (IMA 2009-097; symbol Tnc-Ce in the
  September 2026 IMA Master List, PDF p. 211; status A, Approved 2010; full description
  published June 2020) with ideal end-member formula FeCe(MoO4)3*3H2O (requiring MoO3
  59.16 wt%, Ce2O3 22.49 wt%, Fe2O3 10.94 wt%, H2O 7.41 wt%, total 100.00 wt%; Bonaccorsi and
  Orlandi, 2020, European Journal of Mineralogy 32:347-354). Displays a novel expanded-
  perovskite-like framework molybdate structure type (Nickel-Strunz class 7.GB; Dana class 49)
  related to synthetic orthorhombic Fe2(MoO4)3, and is named after Italian amateur
  mineralogist Giuseppe Tanca (b. 1943) who discovered the mineral, with the Levinson suffix
  -(Ce) indicating dominance of Ce3+ among the rare-earth elements. Discovered as a secondary
  mineral in the oxidation zone of a sulfide ore vein within cavities of quartz veins cutting
  granite at Su Seinargiu, Sarroch, Metropolitan City of Cagliari (CA), Sardinia, Italy,
  associated with quartz, muscovite, molybdenite, pyrite, and a mendozavilite-like phase; the
  holotype specimen is deposited in the Natural History Museum, University of Pisa, Italy,
  under catalogue number 18911. Forms small red to pale-brown transparent truncated octahedra
  up to 0.2 mm in size (Figure 1) with a yellow streak, vitreous to adamantine lustre, brittle
  tenacity, conchoidal fracture, no observed cleavage or parting, non-fluorescent behaviour,
  Mohs hardness 4-4.5, weak birefringence with calculated mean refractive index ncalc = 1.90,
  and calculated density Dcalc = 3.834 g/cm3 from the empirical formula (Abstract and Section 2,
  p. 348) vs 3.738 g/cm3 (Mg/m3) from the ideal formula in Table 4 (p. 352). Micro-Raman
  spectroscopy (Figure 2) confirms MoO4 stretching and bending modes below 1000 cm-1 together
  with H2O bending (~1620 cm-1) and O-H stretching (~3430 cm-1) bands. Wavelength-dispersive
  electron microprobe analysis (10 analyses, ARL-SEMQ, 15 kV, 20 nA, 20 um beam; Table 1)
  yielded MoO3 58.62 wt% (range 57.50-59.59), Fe2O3 11.29 wt% (11.04-11.71), Ce2O3 10.35 wt%
  (9.47-11.15), La2O3 5.04 wt% (4.66-5.53), Nd2O3 3.66 wt% (2.50-4.19), ThO2 2.58 wt%
  (1.97-3.44), Pr2O3 1.07 wt% (0.88-1.35), SiO2 0.34 wt% (0.02-1.56), Sm2O3 0.19 wt%
  (0.08-0.34), UO2 0.17 wt% (0.00-0.29), CaO 0.09 wt% (0.03-0.14), SrO 0.02 wt% (0.00-0.07),
  and stoichiometric H2O 7.43 wt% (3 H2O pfu from crystal-structure analysis), total
  100.85 wt%, corresponding on the basis of 15 O atoms per formula unit to the empirical
  formula Fe3+1.03(Ce0.46La0.23Nd0.16Pr0.05Sm0.01U0.01Th0.07)Sigma0.99(Mo2.96Si0.04)Sigma3.00O12*3H2O.
  Single-crystal and powder X-ray diffraction reveal a strong cubic subcell in space group
  Pm-3m (#221) with a = 6.870(1) A, V = 324.2(1) A3, and Z = 1 (average structure refined to
  R1 = 0.0387, wR2 = 0.0792 for 192 reflections with I > 2sigma(I) and R1 = 0.0424, wR2 =
  0.0815, GoF = 1.261 for all 200 independent reflections from 3757 collected on a 0.1 x 0.08
  x 0.08 mm crystal with MoKalpha radiation, Tables 4-6; note that the Abstract on p. 347
  rounds R1 to 0.038 for 192 unique reflections with I > 2sigma(I) whereas Section 5 on p. 350
  states R1 = 0.038 for 200 unique reflections), accompanied by weak superstructure
  reflections indexed on a 48-fold trigonal rhombohedral supercell in space group R-3 (#148)
  with single-crystal parameters a = 19.2901(3) A, c = 47.2510(5) A, V = 15,226.9(7) A3, and
  Z = 48 (reported in Section 4 on p. 349 and in the third column of Table 4 on p. 352, whose
  caption mistakenly attributes the third-column values to X-ray powder diffraction data) and
  Gandolfi CuKalpha powder-diffraction refined parameters a = 19.305(1) A, c = 47.438(5) A,
  and V = 15,311(3) A3 (Section 4 and Table 3, p. 350). In the average Pm-3m structure
  (Tables 5-6), corner-sharing FeO6 octahedra at the origin (Fe-O2 = 1.993(7) A x 6) are
  bridged by 1/4-occupied orientationally disordered MoO4 tetrahedra (Mo-O2 = 1.724(6) A x 2,
  Mo-O1 = 1.799(17) A x 2) around a central [6+3]-coordinated Ce/REE cage (Ce-O1 = 2.553(17) A
  x 6, Ce-H2O = 2.561(17) A x 3). The eight strongest observed powder X-ray diffraction lines
  indexed on the R-3 supercell (dobs in A (Irel; hkl), CuKalpha, Table 3) are 3.42 (100;
  0 4 8), 3.93 (75; 4 0 4), 4.84 (45; 2 2 0), 1.825 (15; 2 8 0), 1.340 (12; 2 10 16), 2.785
  (10; 0 6 0), 1.610 (10; 6 6 0), and 4.12 (8; 0 4 2). No biological or microbial interaction
  data are reported in the type mineralogical description.
