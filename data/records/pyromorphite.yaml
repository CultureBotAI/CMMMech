id: cmmmech:pyromorphite
name: Pyromorphite
material_kind: mineral
description: Pyromorphite is the Pb5(PO4)3Cl mineral species, grandfathered in the September 2026 IMA list with original-description year 1813. It differs from elemental lead, aqueous Pb and lead-bearing soil or ore. The dissolution assay used a characterized synthetic analogue; it is not a field test of long-term remediation. This record reuses the Topolska experiment also represented under lead and does not count it as independent replication. No lead-commodity criticality is inherited.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 180, Pyromorphite row; page 1 column definitions and page 2 distribution terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: topolska_2014
  title: Topolska, Latowski, Kaschabek, Manecki, Merkel and Rakovan (2014; online July 20, 2013). Pb remobilization by bacterially mediated dissolution of pyromorphite Pb5(PO4)3Cl in presence of phosphate-solubilizing Pseudomonas putida. Environmental Science and Pollution Research 21, 1079-1089. DOI 10.1007/s11356-013-1968-3; PMID 23872890; PMC3880484.
  url: https://doi.org/10.1007/s11356-013-1968-3
  accessed_on: '2026-10-11'
- id: kato_2022
  title: Kato et al. (2022). Deposition of Lead Phosphate by Lead-Tolerant Bacteria Isolated from Fresh Water near an Abandoned Mine. International Journal of Molecular Sciences 23(5), 2483. DOI 10.3390/ijms23052483; PMID 35269625; PMC8910126. Distinct deposition context; quantitative conditions and phosphate-phase mapping remain inconsistent.
  url: https://doi.org/10.3390/ijms23052483
  accessed_on: '2026-10-11'
- id: ncbi_putida
  title: 'NCBI Taxonomy 303: Pseudomonas putida, species. This identifier does not resolve IBPRS KKP 1136 at strain level.'
  url: https://api.ncbi.nlm.nih.gov/datasets/v2/taxonomy/taxon/303/dataset_report
  accessed_on: '2026-10-11'
- id: uniprot_pseudomonas_putida_phosphate_starvation
  title: 'UniProtKB reference proteome UP000000556 (Pseudomonas putida KT2440, NCBITaxon:160488): Phosphate-binding protein PstS (pstS / PP_2656, UniProtKB:Q88JJ3), Phosphate import ATP-binding protein PstB 1 (pstB1 / PP_2659, UniProtKB:Q88JJ0), and Phosphate regulon transcriptional regulatory protein PhoB (phoB / PP_5320, UniProtKB:Q88C63).'
  url: https://www.uniprot.org/uniprotkb?query=(proteome:UP000000556)+AND+(accession:Q88JJ3+OR+accession:Q88JJ0+OR+accession:Q88C63)
  accessed_on: '2026-11-10'
mechanisms:
- id: putida_pyromorphite_remobilization
  name: Culture-enhanced lead release from synthetic pyromorphite
  process: bioleaching
  description: Growing Pseudomonas putida IBPRS KKP 1136 cultures increased filtered-solution Pb relative to uninoculated controls during dissolution of synthetic pyromorphite. The effect was greater when the mineral was the only added phosphate source. Nutrient scavenging, metabolites and cell-associated binding are candidate contributors; the experiment does not identify a unique dissolution pathway. This laboratory remobilization observation is not an isolated-metal recovery process or proof of a field remediation outcome.
  context: 'Topolska et al. E.II: 0.05 g synthetic pyromorphite in 100 mL medium in 500 mL flasks, run in triplicate for 305 h at 21 +/- 1 degrees Celsius and 100 rpm. XRD and SEM-EDS characterized the starting mineral; wet chemical analysis gave Pb5.09(PO4)2.96Cl. Mineral portions were heated at 180 degrees Celsius for 3 h before use. Mid-log cells grown to OD600 0.8 were pelleted, resuspended in the experimental solution and inoculated 1:100. The paper identifies the strain by earlier numerical taxonomy; the linked species identifier does not independently verify that strain assignment. MP+ contained 0.5 g/L K2HPO4, disodium succinate, glycerol, salts and FeEDTA; MP- omitted K2HPO4. The source reports FeEDTA as 30 mM, an unusual medium specification retained as reported rather than silently corrected. Initial pH was about 7.3; biotic pH rose toward 9, while abiotic pH stayed near its initial value. Controls included uninoculated mineral suspensions, growth without mineral and chlorapatite
    comparisons. ICP-MS measured total Pb and P after centrifugation and 0.2 micrometre polycarbonate filtration; a separate acid-digestion comparison assessed cell-associated Pb. Feed was a synthetic mineral, not a contaminated soil or industrial ore.'
