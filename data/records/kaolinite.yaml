mechanisms:
- id: aerobic_kaolinite_associated_iron_acquisition
  name: Aerobic acquisition of kaolinite-associated iron with a siderophore response
  process: bioleaching
  description: The source-designated Pseudomonas mendocina isolate grew more in the presence of KGa-1b or KGa-2 than in no-added-iron, mineral-free medium. Under the study's iron-limited design this is indirect evidence of access to specimen-associated iron. A separate KGa-2 experiment detected siderophores and an iron-availability-dependent response. The experiments do not directly quantify iron release from kaolinite, identify the iron-host phase, demonstrate siderophores as the necessary cause, or establish an isolated iron or aluminium recovery product.
  context: Ams2002 used an aerobic holding-pond isolate from the Nevada Test Site without a reported culture accession. Its source identification is retained without claiming modern strain authentication. CMS KGa-1b from Washington County, Georgia, was well ordered with trace halloysite; KGa-2 from Warren County, Georgia, was poorly ordered with trace anatase. Samples were weakly cleaned with 1 M NaCl adjusted to pH 3 and rinsed; this is not evidence of pure endmember or complete accessory-iron removal. Growth assays used 30 mL succinate-based medium in 150 mL Teflon flasks, 0.0571 g KGa-1b or 0.0324 g KGa-2, normalized to 24 square metres per litre, at 22 degrees C in darkness for four days. Triplicate arms included each kaolinite, 30 micromolar Fe-EDTA, Fe-EDTA plus KGa-1b, and a no-added-iron/no-mineral control. Population was estimated from optical density at 600 nm, not enumerated directly at each time point. The distinct siderophore assay used KGa-2, Fe-EDTA and no-added-iron controls
    at 28 degrees C and 50 rpm; sacrificial triplicates were sampled on days 2, 4 and 7, and supernatants were pooled by condition/time for extraction and HPLC. These are laboratory physiological assays, not an industrial kaolin beneficiation demonstration.
