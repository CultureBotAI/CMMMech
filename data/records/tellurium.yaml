    evidence:
    - source_ref: presentato_2018
      supports: partial
      explanation: Aerobic resting-cell tellurite conversion in PBS (pH 7.4, 30 degrees C, 150 rpm, 0.5-16 h) was measured at the whole-cell level without single-gene knockout tests of katG.
  - source: soluble_potassium_tellurite
    target: intracellular_trigonal_te_nanorods
    predicate: transforms_into
    relationship: resting-cell tellurite depletion and intracellular trigonal Te nanorod crystallization
    description: Aerobic incubation of PBS-washed R. aetherivorans BCP1 resting cells in 50 mL PBS (pH 7.4, 30 degrees C, 150 rpm, 0.5-16 h) depletes supernatant tellurite (42 +/- 3% at 500 ug/mL and 28 +/- 4% at 1000 ug/mL at 16 h, n=3) and forms intracellular trigonal Te nanorods (Figures 1-3, 5; proposed surfactant-assisted assembly in Figure 7 remains an interpretation).
    evidence:
    - source_ref: presentato_2018
      supports: support
      explanation: Figures 1-3 and 5 and Supplementary Figure S1 support biotic supernatant tellurite depletion and intracellular trigonal-Te nanorod diffraction, while preserving the K2TeO3 vs tellurite mass-basis ambiguity and distinguishing solution removal from isolated-product recovery.
