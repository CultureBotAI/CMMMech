id: cmmmech:crandallite
name: Crandallite
material_kind: mineral
description: Crandallite is the calcium aluminium phosphate mineral CaAl3(PO4)(PO3OH)(OH)6, distinct from
  strontium-dominant goyazite, the broader crandallite group and mixed phosphorite resources. Primary
  evidence supports laboratory abiotic synthesis and partial thermal dehydroxylation of crandallite-bearing
  preparations. Natural crandallite was also identified in mixed Croatian phosphorite, but the associated
  microbial observations do not establish a crandallite-specific extraction or formation mechanism. No
  mineral criticality, industrial recovery, fertilizer performance or microbial recovery yield is asserted.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026; definitions PDF page 1, Crandallite
    page 50 and Goyazite page 85, both redefined (Rd), 1999 special procedure.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-15'
- id: handbook_crandallite
  title: Handbook of Mineralogy, Crandallite, complete one-page identity entry; ideal formula, diffraction,
