    weathering of uraninite from the Cervena vein, Jachymov
    (Czech Republic): a fingerprint of the primary mineralization
    geochemistry onto the alteration association. Journal of
    Geosciences 59:223-253. DOI 10.3190/jgeosci.171. Complete
    publisher PDF acquired; locality and methods pages 223-225,
    section 4.2.8 pages 234-235, Figure 8, Tables 15-17 and
    interpretation pages 249-250 inspected. Linked uranopilite CIF
    acquired and metadata compared; no structure re-refinement.
    Table 16 and the deposited CIF disagree in refinement counts,
    agreement factors and calculated density. These disagreements
    remain unresolved and neither source is used as a precise
    independent determination of hydrogen content or refinement
    quality. Table 17 also differs from Table 16 in the printed
    uncertainty of beta. The limited natural identity claim is
    retained without selecting a preferred disputed value.
  url: https://doi.org/10.3190/jgeosci.171
