id: cmmmech:pascoite
name: Pascoite
material_kind: mineral
description: Pascoite is a calcium decavanadate mineral with formula [Ca3(H2O)17]V5+10O28 in the September
  2026 IMA list, which assigns grandfathered status G and original-description year 1914. That year is
  not a numbered IMA approval. Hughes and colleagues characterized a natural crystal from Harvard specimen
  91449, Minasragra, Peru, and refined a disordered monoclinic C2/m structure containing [V10O28]6- units
  and hydrated calcium complexes. Disorder gives the Ca1 site possible local coordination by six, seven
  or eight oxygen atoms, averaging seven; hydrogen positions were located in difference maps but subsequently
  restrained, with residual disorder and partial occupancy. The 2005 paper supports this model over its
  tested ordered C2 alternative; it does not provide an unconstrained determination of every local hydrogen
  configuration. The 1966 predecessor's publisher title specifies 16H2O whereas the 2005 reference list
  prints 17H2O; the current identity follows the IMA formula and inspected 2005 original. The 1966 full
  text remains unavailable. The inspected 2005 depository files contain thermal parameters and observed/calculated
  diffraction intensities, but their Table 5/6 labels differ from the article's Table 4/5 deposit references;
  they belong to the same experiment. Pascoite is distinct from the decavanadate ion, the broader mineral
  group and elemental vanadium. These structural observations establish neither microbial extraction nor
  isolated-product recovery or industrial deployment; criticality is not inherited from vanadium.
