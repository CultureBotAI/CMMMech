    title: Schertl, Mills and Maresch, editors (2019 copyright). A Compendium of IMA-Approved Mineral Nomenclature, prepared for IMA2018. PDF pp33-35 reproduce Whitney and Evans (2010), Abbreviations for names of rock-forming minerals, DOI 10.2138/am.2010.3371; Table 1 biotite GROUP row on PDF p34 and GROUP definition on PDF p35. Historical nomenclature source, not a 2019 revision of the 2010 table.
    url: https://cnmnc.units.it/ima_reports/2%20IMA-Nomenclature-e-Booklet-2019-1.pdf
    accessed_on: '2026-10-11'
