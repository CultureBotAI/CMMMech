mechanisms:
- id: engineered_gluconobacter_bioleaching
  name: Culture-generated acidic biolixiviant mobilizes rare earths
  process: bioleaching
  description: Gluconobacter oxydans B58 and engineered derivatives generated acidic biolixiviants that mobilized rare earths from this concentrate in laboratory assays. Clean deletion of pstS combined with the P112 promoter upstream of mgdh increased solution extraction compared with the wild-type culture under the reported conditions. The evidence establishes a genotype-associated leaching difference, not a uniquely demonstrated acid composition, phosphate signaling pathway, pure-mineral dissolution fraction or isolated REE product. Cells are not documented as removed before ore addition; this is not described here as a cell-free supernatant assay. Industrial deployment was not tested.
  context: B58 cultures were grown in yeast-peptone-mannitol medium at 30 degrees C. After saturation and back-dilution, 3 mL culture and 3 mL 40% filter-sterilized glucose were combined in 100 mL flasks, giving a reported final 20% glucose. Methods describe 24 h biolixiviant production at 30 degrees C and 250 rpm, while figure labels report pH at 36 h; this timing discrepancy is unresolved. The usual leaching assay added 500 mg concentrate to 5 mL biolixiviant (10% mass/volume pulp density), followed by 24 h at room temperature and 200 rpm; a separate comparison used reported 1% pulp density. Exact room temperature and ore size distribution are not supplied. Leachates were settled, centrifuged, filtered at 0.45 micrometres, diluted into nitric acid and measured by ICP-MS. The printed 500 mL filtration aliquot conflicts with the preceding 1 mL sample and is retained as an unresolved source unit error, not silently corrected. Main leaching comparisons used triplicates; their preparation includes
    splitting an upstream culture, so independence of biological culture replicates is not established. Wild-type and other mutants were comparators; Data S1 includes no-bacteria controls. A separate Figure S2 comparison used 0.1 g ore in 1 mL lixiviant at 1500 rpm for 24 h and included medium-only and neat nitric acid arms. It must not be pooled with the 200 rpm flask assay.
