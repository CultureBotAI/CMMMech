    entry_name: CEXA_ASPNA
    protein_name: Citrate exporter A
    gene_symbol: cexA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:380704
      label: Aspergillus niger ATCC 1015
    reference_proteome_id: UP000006706
    interpro_ids:
    - InterPro:IPR011701
    - InterPro:IPR020846
    - InterPro:IPR036259
    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA in Aspergillus niger ATCC 1015 that secretes
      intracellularly synthesized citric acid into the extracellular medium, contributing to medium acidification
      during phosphate-mineral transformation.
    annotation_note: Grounded to strain-matched reviewed Swiss-Prot entry UniProtKB:G3Y4N5 (CEXA_ASPNA;
      locus ASPNIDRAFT_56962) for Aspergillus niger ATCC 1015 (NCBITaxon:380704).
    evidence:
    - source_ref: suyamud_2020
      supports: partial
      explanation: Representative Aspergillus niger ATCC 1015 organic-acid exporter CexA for fungal acidification
        during dittmarite solubilization and secondary glushinskite formation; Suyamud et al. (2020) did
        not assay cexA mutants or isolate citric versus oxalic acid contributions.
