id: cmmmech:calcite
name: Calcite
material_kind: mineral
description: Calcium carbonate mineral with ideal formula CaCO3, distinct from its polymorphs vaterite and aragonite, calcium as an element, limestone or marble resources, and manufactured calcium carbonate products. The September 2026 IMA list gives grandfathered status and original-description year 1836, not a new-mineral approval accession. Curated laboratory experiments identify calcite in bacterial-treatment solids; neither metal-removal percentages nor criticality designations are inherited by this mineral from their target metals.
