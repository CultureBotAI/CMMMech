mechanisms:
  - id: abiotic_thermal_dehydration_decarbonation
    name: Laboratory thermal dehydration and partial decarbonation of natural adamsite-(Y)
    process: other
    description: >-
      Heating two powdered samples of natural adamsite-(Y) (10.196 mg and
      10.847 mg) under flowing dry nitrogen produced five resolved DTG weight-
      loss substeps across two major intervals between 80 and 590 degrees C,
      losing 4.334 mg (42.5 wt%) and 4.670 mg (43.1 wt%) for an average total
      loss of 42.8 wt% (versus 42.2 wt% theoretical for 12 H2O + 2 CO2 per
      Na2Y2(CO3)4·12H2O, i.e., 6 H2O + 1 CO2 per NaY(CO3)2·6H2O). Only half of
      the carbonate CO2 (12.9 wt% evolved vs 12.2 wt% ideal) was released up to
      1000 degrees C, leaving an unindexed heated solid residue that effervesced
      in HCl and was interpreted by the authors as an oxycarbonate such as
      YNaO(CO3).
    context: >-
      Thermal analysis in Grice et al. (2000), pp. 1460-1461, Table 1, and
      Figure 2 used two powdered samples (10.196 mg and 10.847 mg) of natural
      Mont Saint-Hilaire adamsite-(Y) heated in a Mettler-Toledo TA8000 / TG50
      thermal system with an M3 microbalance from room temperature to 1000
      degrees C at 5 degrees C/min under dry nitrogen flowing at 200 mL/min.
      Evolved gases were not analyzed spectroscopically, and the X-ray powder
      diffraction pattern of the heated residue could not be matched to known
      phases in the ICDD database.
    microbial: false
    evidence:
      - source_ref: grice_2000_adamsite
        supports: support
        explanation: >-
          Table 1 and Figure 2 (pp. 1460-1461) report two main weight-loss
          intervals subdivided into five DTG steps on the two samples (mean
          total loss 42.8 wt% vs 42.2 wt% calculated for Na2Y2(CO3)4·12H2O):
          Step 1a (80-120 degrees C, 23.0 wt% obs vs 20.0 wt% calc, -8 H2O from
          unbonded interstitial OW21-OW24 and weakly bonded OW17-OW20); Step 1b
          (120-270 degrees C, 4.0 wt% obs vs 5.0 wt% calc, -2 H2O from Na-bonded
          OW13 and OW15; combined 80-270 degrees C loss 27.0 wt%); Step 2a
          (380-480 degrees C, 2.9 wt% obs vs 5.0 wt% calc, -2 H2O from Y- and
          Na-bridging OW14 and OW16); Step 2b (480-540 degrees C, 7.0 wt% obs vs
          6.1 wt% calc, -1 CO2); and Step 2c (540-590 degrees C, 5.9 wt% obs vs
          6.1 wt% calc, -1 CO2; combined 380-590 degrees C loss 15.8 wt%,
          including 12.9 wt% evolved CO2).
      - source_ref: grice_2000_adamsite
        supports: partial
        explanation: >-
          Because half of the carbonate remained in the solid residue above 590
          degrees C (which effervesced in HCl and gave an unindexed XRD pattern),
          the second 12.2 wt% CO2 required for complete NaY(CO3)2·6H2O
          stoichiometry was added theoretically rather than evolved during TGA,
          and the structural assignment of specific OW13-OW24 water sites to
          individual DTG steps is an interpretive correlation.
