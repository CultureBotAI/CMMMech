id: cmmmech:kozoite-la
name: Kozoite-(La)
material_kind: mineral
description: >-
  Kozoite-(La) is the lanthanum-dominant orthorhombic rare-earth hydroxyl
  carbonate mineral with ideal formula La(CO3)(OH), approved as
  IMA 2002-054. It is distinct from elemental lanthanum, other kozoite
  species, hydroxylbastnäsite-(La) and commercial rare-earth feeds. The
  original Mitsukoshi, Japan material consists of minute crystals in
  spherical aggregates with concentric La-dominant and Nd-dominant
  zones. Four La-domain microprobe analyses have average La0.83 and
  Nd0.40 on a two-cation basis, with appreciable Ca0.43; this is not a
  chemically pure La end member. Carbon and hydrogen could not be
  measured in that intergrown material: the reported carbonate,
  hydroxyl and water contents were calculated from an ancylite-type
  formula, while infrared bands support carbonate and OH. The analytical
  total including calculated volatiles is 101.19 wt%. Powder diffraction
  gives Pmcn and a = 4.986(4), b = 8.513(6), c = 7.227(10) Å; no
  single-crystal analysis was possible. Nearly matching diffraction
  patterns of the La and Nd species require chemical discrimination.
  The mechanism below concerns separately synthesized La carbonate,
  not dissolution of the natural zoned specimen. These sources do not
  establish microbial causality, industrial deployment or a
  jurisdiction-specific criticality designation.
