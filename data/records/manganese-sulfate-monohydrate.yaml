id: cmmmech:manganese-sulfate-monohydrate
name: Manganese sulfate monohydrate commodity
material_kind: commodity
description: Manufactured manganese sulfate monohydrate products, nominally MnSO4.H2O.
  The monohydrate commodity is distinct from manganese metal, other sulfate hydration
  states, dissolved manganese in a leachate, and a mineral specimen. Pan Chem supplies
  monohydrate powder for feed and fertilizer applications, and Ihumate publishes the
  monohydrate formula and an agricultural product specification. These sources establish
  a manufactured product family rather than one battery qualification. Walsun separately
  describes high-purity manganese sulfate for lithium-ion cathode precursors, while
  SAMR registers HG/T 4823-2023 for manganese sulfate for batteries; the complete standard
  tables were not inspected. Neither that end use nor this one salt exhausts the broader
  battery-grade manganese family. No universal purity cutoff, criticality designation
  or microbial production of qualified crystals is asserted.
