    functional_role: Inner-membrane multiheme c-type cytochrome ImcH (GSU3259) inferred by analogy from Geobacter sulfurreducens EET genetics as a high-potential (> -0.1 V vs SHE) electron-transfer component during microbial Fe(III) reduction; Cutting et al. (2009) did not perform mutant, proteomic, or transcriptomic assays.
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: Cutting et al. (2009) assayed wild-type Geobacter sulfurreducens PCA reducing synthetic akaganeite in the presence of 10 microM AQDS without genetic, proteomic, or transcriptomic measurements; ImcH (GSU3259) is grounded as a canonical G. sulfurreducens PCA inner-membrane EET proxy rather than a directly assayed study variable.
    annotation_note: Grounded to Geobacter sulfurreducens PCA reference proteome UP000000577 (NCBITaxon:243231, locus GSU3259) as an organism-level EET proxy; Cutting et al. (2009) used unmutated G. sulfurreducens with 10 microM AQDS and did not directly assay ImcH.
