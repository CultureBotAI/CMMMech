id: cmmmech:polydymite
name: Polydymite
material_kind: mineral
description: Polydymite is the cubic nickel thiospinel mineral species, with IMA formula Ni2+Ni3+2S4 (Ni3S4),
  distinct from Fe-bearing violarite, other nickel sulfides, elemental nickel and mixed ores. The September
  2026 IMA-CNMNC list gives grandfathered status and original-description year 1876; that year is not
  a unique approval accession. The curated mechanism concerns a synthetic mineral-assigned component of
  laboratory precipitates. No nickel criticality designation or industrial deployment is inherited.
