    functional_role: Membrane-bound sulfide-quinone reductase paralog (sqr, locus AFE_0267; 375 aa) in Acidithiobacillus ferrooxidans ATCC 23270 oxidizing reduced sulfur species to zero-valent sulfur and polysulfide/polythionate intermediates during acidophilic sulfur/sulfide bioleaching.
    annotation_note: Grounded to second sulfide-quinone reductase paralog (sqr, locus AFE_0267; 375 aa) in reference-proteome entry UP000001362 for type strain Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159), representing strain FC1 (NCBITaxon:920) in Fowler & Crundwell (1999).
    evidence:
    - source_ref: fowler_crundwell_1999
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 sulfide-quinone reductase paralog (sqr, locus AFE_0267) for oxidative sulfur/acid generation during Gamsberg sphalerite dissolution by strain FC1 in fowler_crundwell_1999; individual sqr/tth genes were not mutated.
  - uniprot_accession: UniProtKB:B7J3C9
    entry_name: TTH_ACIF2
    protein_name: Tetrathionate hydrolase
    gene_symbol: tth
