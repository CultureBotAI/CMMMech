id: cmmmech:vivianite
name: Vivianite
material_kind: mineral
description: Vivianite is the hydrated ferrous phosphate mineral species Fe2+3(PO4)2(H2O)8, grandfathered
  in the September 2026 IMA list with original-description year 1817. It is distinct from elemental
  iron or phosphorus and from mixed recovered phosphate products. The bounded culture experiment
  below identifies vivianite as the dominant phase of a vivianite-siderite mixture. The same experiment
  is represented in siderite; these are separate mineral identities, not independent studies or inherited
  criticality designations.
