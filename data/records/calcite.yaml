        supports: partial
        explanation: Sections 2.5, 3.3 and 3.4.3 and Figures 2/5 show rapid supernatant depletion, including strong removal with no added Ca; the reported 98.28% at 10 min is solution removal, not calcite-specific recovery. Figure 7 lacks resolved calcite peaks in the 10 min trace. Section 3.5.1's inference that absent peaks exclude amorphous compounds is not supported by diffraction and conflicts with Section 3.5.2's proposed amorphous mixed Ca-Tb material. Figure 9 cannot identify that phase, and Figure 8 mapping cannot prove crystal-lattice entry. FTIR shifts in Figure 10 do not establish a unique molecular pathway. Tables 1-2 measure heat-pretreated cell viability and urease activity, whereas Figure 3 measures simultaneous hot reaction; these are not matched proof that living cells or active urease are unnecessary.
  - id: brine_calcite_mixed_precipitate
    name: Calcite assigned in ureolytic geothermal-brine treatment solids
    process: biomineralization
    description: Prepared S. pasteurii DSM 33 biomass with urea generated mixed carbonate-bearing solids during treatment of one natural geothermal brine. The authors assigned calcite together with vaterite and magnesite by powder XRD. This mineral-level observation shares the Rehmanji2025 experiment with cmmmech:vaterite and cmmmech:lithium-bearing-geothermal-brine; those records are not independent replications. It does not identify the proportion of Ca, Mg, Mn or Sr entering calcite, demonstrate a pure calcite yield, or recover lithium into a separate product.
    context: 'DSM 33 cells were grown in TSB with 500 mM urea at 28 degrees C and 180 rpm, harvested in mid-log phase at 3200 g for 15 min and PBS-washed. Unsterilized natural brine from an unnamed Cornish geothermal project was treated under reported non-growth conditions: 100 mL in 250 mL flasks, initial OD600 0.05-0.4, 500 mM added urea, 28 degrees C, static for 24 h, in triplicate. The source-designated B. subtilis ATCC-2385 comparator and a separate brine-plus-urea/no-added-cell arm provide treatment comparisons, but no matched-pH chemical or killed-cell phase-control series is reported. The comparator strain designation remains unverified. Section 4.6 sampled 15 mL at 24 h, centrifuged at 3200 g for 15 min and dried the pellet at 60 degrees C for 24 h for XRD; the reported dry-pellet quantity is not a mass-balance mineral yield. Phase assignments concern processed mixed solids, without quantitative refinement or an in situ phase time course. Cow-urine/CaCl2 assays and spent-yeast biomass
      cultivation are separate arms. Laboratory flask treatment and slurry tests do not establish industrial deployment.'
