id: cmmmech:vielleaureite-ce
name: Vielleaureite-(Ce)
material_kind: mineral
description: >-
  Vielleaureite-(Ce) (IMA 2022-134, symbol Vlr-Ce; formerly reported as
  UM2006-15-SiO:AlFHMgMnREE after Cenki-Tok et al. 2006) is an IMA-accepted
  manganese-cerium-magnesium-aluminium fluor-hydroxy disilicate-orthosilicate
  mineral of the dollaseite group within the epidote supergroup with September
  2026 IMA-CNMNC Master List ideal formula Mn2+Ce(MgAlMn2+)(Si2O7)(SiO4)F(OH)
  (PDF p. 228, status A), representing the A1 = Mn2+ analogue of khristovite-(Ce)
  CaCe(MgAlMn2+)(Si2O7)(SiO4)F(OH) and the (A1 = Mn2+, M3 = Mn2+) analogue of
  dollaseite-(Ce) CaCe(MgAlMg)(Si2O7)(SiO4)F(OH), stabilized by the coupled
  heterovalent substitution M1Me3+ + O4O2- = M1Mg2+ + O4F-. Described by Ragu,
  Bindi, Bonazzi, Remusat, and Chopin (2025) from millimeter-thick
  rhodochrosite–sulfide–quartz veinlets crosscutting massive microcrystalline
  rhodochrosite ore in Lower Carboniferous greenschist-facies siliceous
  metasediments (~4 km from the 302–305 Ma Néouvielle granite pluton) collected
  ~10 m from the adit entrance at the Coustou manganese mine above the village of
  Vielle-Aure, Aure valley, Hautes-Pyrénées, France (holotype sample VA2016-5 and
  X-rayed crystal deposited at the Musée de Minéralogie, École des Mines de
  Paris, catalogue no. ENSMP 83943; cotype deposited at the Muséum National
  d'Histoire Naturelle, Paris, catalogue no. MNHN_MIN_223.001, pp. 627–629).
  Occurs as scarce dark-brown to dark reddish-brown anhedral to subhedral
  prismatic grains elongated along [010] up to 200 um across, patchily zoned from
  F-poor, V-rich vanadoandrosite-(Ce)/vanadoakasakaite-(Ce) cores to
  near-endmember vielleaureite-(Ce) overgrowths, associated with rhodochrosite,
  quartz, chalcopyrite, vanadian spessartine (up to 1.7 wt% F in crystal cores),
  friedelite, Mn2+-dominant hellandite-(Y) relics (Mn/(Mn + Ca) = 0.49–0.61),
  monazite-(Ce), baryte, vanadian pyrophanite, minor hübnerite, galena, pyrite,
  ZnS, alabandite, cobaltite, chalcocite, rare skinnerite(?), helvite, welinite,
  manganhumite, and armoured relict inclusions of parisite-(La), fluorite, an
  unidentified Y-silicate, and a BaFCl phase (likely zhangpeishanite) (pp.
  628–630, Fig. 1). Exhibits a reddish-brown streak, translucent diaphaneity,
  vitreous to adamantine lustre, brittle tenacity with uneven fracture, no
  cleavage or parting, no fluorescence under the electron beam, Mohs hardness ~6
  (by analogy with allanite-group minerals), Dcalc = 4.33 g/cm3, and biaxial
  optics (589 nm) with alpha > 1.74 (Gladstone–Dale calculated n = 1.79) and
  strong pleochroism (very light yellow < light brown < brown // b, pp. 629–630).
  Mean of 4 WDS electron-microprobe analyses (Cameca SX Five, 15 kV, 40 nA, 2 um
  beam) on the holotype crystal fragment VA2016-5 (with NanoSIMS 50 verification
  confirming negligible BeO 0.02–0.05 wt% and Li2O 0.01 wt%; Section 4, pp. 627,
  630–631, Table 1) yielded SiO2 28.08 wt% (range 27.19–28.84, esd 0.85), MnOtot
  21.75 (19.76–22.73, esd 1.36; partitioned for electroneutrality on 8 cations
  and 12 anions into MnO 21.57 and Mn2O3 0.20), Ce2O3 17.23 (17.11–17.47, esd
  0.16), Al2O3 8.44 (8.00–8.97, esd 0.43), La2O3 8.36 (8.09–9.03, esd 0.45), MgO
  4.71 (2.02–5.92, esd 1.83), F 2.56 (0.94–3.38, esd 1.11), V2O3 1.63 (0.39–4.00,
  esd 1.63), H2Ocalc 1.43 (for OH = 1.00 apfu), CaO 1.21 (0.57–2.27, esd 0.79),
  Fe2O3 0.70 (0.18–1.73, esd 0.71), Nd2O3 0.57 (0.15–0.81, esd 0.29), Er2O3 0.41
  (0.08–0.77, esd 0.29), Gd2O3 0.05 (0.00–0.19, esd 0.09), Y2O3 0.04 (0.03–0.06,
  esd 0.01), Cl 0.04 (0.02–0.06, esd 0.02), P2O5 0.03 (0.00–0.05, esd 0.02), B2O3
  0.03 (0.00–0.09, esd 0.04), Sm2O3 0.03 (0.00–0.07, esd 0.03), Yb2O3 0.03
  (0.00–0.12, esd 0.06), Na2O 0.03 (0.00–0.06, esd 0.03), Dy2O3 0.02 (0.00–0.06,
  esd 0.03), SrO 0.01 (0.00–0.03, esd 0.01), -O=F,Cl 1.08 (0.41–1.43, esd 0.46),
  total 96.32 wt% (low total due to small unpolished fragment geometry), giving
  on 8 cations pfu the empirical formula A1(Mn2+0.85Ca0.14Na0.01)Sigma1.00
  A2(Ce0.66La0.32Nd0.02Er0.01)Sigma1.00
  M1(Mg0.71V0.14Mn2+0.08Mn3+0.02Fe3+0.06)Sigma1.01 M2Al1.00
  M3(Mn2+0.98Mg0.02)Sigma1.00 T1-3(Si2.94Al0.04B0.01)Sigma2.99
  O11(F0.85Cl0.01O0.14)Sigma1.00(OH) (note that the rounded A2 cation proportions
  sum to 1.01 while printed as Sigma1.00, and Table 5 on p. 633 lists the
  proposed M1 site population with combined Mn0.09). Monoclinic, space group
  P21/m, Z = 2 (Section 5, pp. 630–634, Tables 2–6, Fig. 2): single-crystal
  MoKalpha XRD refinement on a 0.030 x 0.025 x 0.020 mm crystal (Bruker D8
  Venture Photon III, 1565 reflections with Fo > 4sigma(Fo) out of 2224 unique,
  Rint = 0.0747, R1 = 0.0575, R(all) = 0.1002, wR(Fo2) = 0.1168, GoF = 1.028,
  Table 2, p. 632) gives a = 8.8238(13) Å, b = 5.7131(9) Å, c = 10.0034(16) Å,
  beta = 112.823(6)°, V = 464.80(13) Å3, with bond-valence sum 1.17 v.u. at O4
  confirming F- dominance (Table 6, p. 634); CuKalpha powder XRD refinement
  (Oxford Diffraction Excalibur PX Ultra, p. 630) gives a = 8.8123(8) Å, b =
  5.7108(6) Å, c = 10.0048(13) Å, beta = 112.810(9)°, V = 464.13(6) Å3. Distinct
  from khristovite-(Ce), dollaseite-(Ce), vanadoandrosite-(Ce),
  vanadoakasakaite-(Ce), piemontite, and elemental cerium, lanthanum, manganese,
  or vanadium; no criticality designation for vielleaureite-(Ce) itself, no
  microbial or biological mechanism, and no industrial recovery yield are
  asserted.
