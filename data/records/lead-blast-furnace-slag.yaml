id: cmmmech:lead-blast-furnace-slag
name: Lead blast-furnace slag
material_kind: secondary_resource
description: >-
  Partly vitrified residue generated during lead blast-furnace smelting.
  The curated example is granulated slag from the former lead-zinc smelter
  at Noyelles-Godault, northern France, containing a silicate glass matrix,
  crystalline phases and metallic lead droplets. It is a process-defined
  secondary resource, distinct from elemental lead or zinc, a pure mineral,
  copper-smelter slag, steelmaking slag, furnace dust or zinc-leach residue.
  Its composition is sample-specific. No criticality designation is inherited
  from constituent elements.
