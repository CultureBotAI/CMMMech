      label: vanadium atom
    material_form: Vanadium-bearing electrolyte. ICP-OES measures total elemental V; the atom identifier
      grounds the element, not neutral atoms in solution or an oxidation-state measurement.
    sampled_fraction: Working-chamber solution filtered at 0.22 micrometres before preservation in 1%
      nitric acid.
    study_arm: biotic
    result_status: measured
    value: 34
    unit: mg/kg
    analyzed_on: '2025-06-12'
    sampled_on: '2025-05-30'
    sampling_source_locator: T2_pH.csv; SampleID=BESV.brr_END; Date column
    context: Biotic-run endpoint concentration from T3. Its analysis date precedes the separate analysis
      of the stored baseline sample; sampling dates, not analysis order, identify the experiment sequence.
      No recovery percentage, V oxidation state or microbial benefit is calculated from the endpoint.
  - id: v_abiotic_equilibrated
    source_ref: kane_2026_bes
    source_table: T3_AqueousICPOES.csv
    source_sample_id: BESVarr_0
    source_column: V_ppm
