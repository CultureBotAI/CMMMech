id: cmmmech:bixbyite-mn
name: Bixbyite-(Mn)
material_kind: mineral
description: >-
  Bixbyite-(Mn) is the Mn(III)-dominant member of the bixbyite series,
  with ideal formula Mn2O3 under IMA-CNMNC decision 21-H. It is listed
  as redefined by a 2021 special procedure in the September 2026 list.
  It is distinct from the Fe-dominant species bixbyite-(Fe), the broader
  bixbyite structural series, elemental manganese and MnO2 minerals.
  The laboratory culture product below was assigned only as bixbyite-like
  Mn oxide by its authors. Its placement here expresses the Mn-rich
  structural analogy, not a retrospective certification of pure natural
  bixbyite-(Mn). No criticality designation is inherited from manganese.
sources:
