id: cmmmech:heimite
name: Heimite
material_kind: mineral
description: >-
  IMA-approved hydrous basic lead-copper arsenate mineral (IMA 2022-019; status A, Approved
  2022; full description published January 2024; symbol Him used in Section 7.2, p. 163, of
  the primary paper; no separate symbol column is printed in the September 2026 IMA Master
  List, PDF p. 91) with ideal end-member formula PbCu2(AsO4)(OH)3(H2O)2 in the September
  2026 IMA Master List (PDF p. 91) and PbCu2(AsO4)(OH)3*2H2O (or PbCu2(AsO4)(OH)3*2(H2O) in
  Section 4, p. 155, and Table 2, p. 157, requiring CuO 28.40 wt%, PbO 39.84 wt%, As2O5
  20.51 wt%, H2O 11.25 wt%, total 100.00 wt%) in Malcherek, Mihailova, Schlueter, Roth, and
  Meisser (2024, European Journal of Mineralogy 36:153-164). Named in honour of Professor
  Albert Heim (1849-1937), Swiss geologist at ETH Zurich and author of Geologie der Schweiz
  (1919-1922), whose recognition of the Glarus overthrust established the Alpine nappe-
  thrust model in the UNESCO World Heritage Glarus thrust region hosting the type locality
  (Section 1, pp. 153-154). Discovered during systematic EDXS screening of dump material
  collected in 2003 by Philippe Roth at the Grosses Chalttal Cu-(U) deposit, Muertschenalp
  district, Canton Glarus, Switzerland (latitude 47 deg 04 min 09.9 sec N, longitude 9 deg
  11 min 26.5 sec E; hosted in the Permian Verrucano fanglomeratic sernifite breccia of the
  Helvetic nappes, where primary tennantite-(Cu), pyrite, bornite, chalcopyrite, galena,
  uraninite, and brannerite with secondary spionkopite-yarrowite underwent Middle
  Pleistocene interglacial supergene oxidation; associated on the holotype with spherical
  bayldonite aggregates and chrysocolla, and on cotype specimens in decreasing frequency
  with chrysocolla, malachite, azurite, duftite, mimetite, brochantite, euchroite,
  bayldonite, cerussite, wulfenite, cyanotrichite, strashimirite, and parnauite, including
  epitactic overgrowths of prismatic duftite on tabular heimite with (001)_Him || (001)_Dft;
  also reported from four other Swiss Alpine Pb-Cu occurrences: Hochmaettli in Glarus,
  Tieftobel near Schmitten in Grisons, and Collioux Superieur and Termino near Saint-Luc in
  Val d'Anniviers, Valais; Section 2, pp. 154-155, and Section 7, pp. 161-163); the
  holotype specimen is deposited at the Museum der Natur Hamburg - Mineralogie, Leibniz-
  Institut zur Analyse des Biodiversitaetswandels (LIB), Hamburg, Germany (catalogue number
  Ro3701), and the cotype (MGL 094490) and paragenetic study specimens (MGL 087051 to
  087070) are conserved at the Departement de geologie, Museum cantonal des sciences
  naturelles (Natureum), University of Lausanne, Switzerland (Section 1, pp. 153-154).
  Occurs as radial sprays of transparent, light-pistachio-green to pale-blue lath-like
  prismatic crystals up to 450 um long and 40 um wide elongated along [100], dominated by
  {001} and delimited by {010}, {110}, and {100} (some crystals turn blue under the SEM
  electron beam or in situ without measurable EDXS compositional change, attributed to
  partial charge-neutral dehydration of axial H2O ligands converting [4+2] CuO6 octahedra
  locally to [4+1] square pyramids; Section 3, p. 155, and Section 7.2, p. 163). Crystals
  have a pale-green streak, vitreous-to-silky lustre, no observable fluorescence, perfect
  cleavage on {001}, ready solubility in hydrochloric acid, biaxial optical character with
  measured 2V = 87 deg, Gladstone-Dale calculated average refractive index n_av = 1.816,
  faint pleochroism from faint green || [100] to bright green || [010], and calculated
  density Dcalc = 4.708 g/cm3 based on the single-crystal unit cell and empirical formula
  with seven H atoms, or 4.769 g/cm3 based on the ideal formula (Abstract, p. 153; Section
  3, p. 155; and Table 2, p. 157). Wavelength-dispersive electron-microprobe analyses
  (Cameca SX100 at Technische Universitaet Clausthal; 15 kV, 30 nA, 5 um beam diameter;
  standards chalcopyrite for CuO, galena for PbO, calcite for CaO, and arsenopyrite for
  As2O5; n = 11 sample spots; Section 4, p. 155, and Table 1, p. 155) yielded mean CuO
  28.64 wt% (range 27.26-30.68, SD 1.05), PbO 39.89 wt% (range 38.08-41.75, SD 0.93), CaO
  0.25 wt% (range 0.03-0.85, SD 0.26), As2O5 21.73 wt% (range 20.39-23.04, SD 0.72), with
  H2O_calc = 9.49 wt% by difference to 100.00 wt%, yielding on the basis of 9 O apfu the
  empirical formula Pb1.04Ca0.03Cu2.10As1.10H6.14O9 (printed as Pb1.04Ca0.03Cu2.1As1.1H6.14O9
  in Section 4, p. 155), whereas fixing 7 H apfu (3.5 H2O per 9 O, i.e. 5.5 non-H2O O apfu)
  in agreement with the crystal-structure determination gives H2O_calc = 11.64 wt%, total =
  102.15 wt%, and the empirical formula Pb0.97Ca0.02Cu1.95As1.02H7O9 (Section 4, p. 155).
  Single-crystal FTIR transmission spectroscopy on a ~0.01 mm (001) plate (Bruker VERTEX 70
  / HYPERION 2000, 630-7000 cm-1; Section 6 and Figure 5, pp. 160-161) recorded sharp
  absorption bands at 3606 and 3489 cm-1 (hydroxyl O-H stretching of O7-H7...Ox1 and
  O4-H4...O5 / O6-H6...O4), a broad band at 2800-3400 cm-1 (hydrogen-bonded H2O O-H
  stretching of Ox1 and Ox2 around 3093-3140 cm-1), and bands at 1010, 912, and 750 cm-1
  (AsO4 tetrahedral vibrations). Crystallizes in the monoclinic system, pseudo-orthorhombic
  space group P21/n (#14, subgroup of Pnma #62 via symmetry breaking of adjacent hydrogen-
  bonded H2O ligands Ox1 and Ox2 across the pseudo-mirror plane), with single-crystal X-ray
  diffraction unit-cell parameters (Nonius KappaCCD four-circle diffractometer, MoKalpha
  radiation, lambda = 0.7107 A, on a 0.27 x 0.035 x 0.012 mm light-blue two-domain crystal;
  Abstract, p. 153; Section 5, pp. 155-157; and Table 2, p. 157) a = 5.9132(5) A, b =
  7.8478(6) A, c = 16.8158(15) A, beta = 90.007(6) deg, V = 780.33(8) A3 in the Abstract
  (p. 153) or V = 780.33(11) A3 in Table 2 (p. 157), and Z = 4 (Le Bail refinement of the
  Gandolfi-type powder X-ray diffractogram in P21/n with beta = 90 deg gave a = 5.967(5) A,
  b = 7.896(6) A, c = 16.779(16) A, V = 790.5(9) A3; Section 5, pp. 160-161). The crystal
  structure was solved by charge flipping (Superflip) and refined on F2 (Jana2006) in P21/n
  to Robs = 0.0275 for 1869 observed reflections with I > 3sigma(I) and Rall = 0.0359 for
  all 2269 unique reflections out of 26,146 measured reflections (Rint = 0.0566, GooF = 1.11
  for 140 parameters; comparative orthorhombic Pnma refinement with a = 7.8478(6) A, b =
  5.9132(5) A, c = 16.8158(15) A gave Robs = 0.0248 for 1076 observed reflections but an
  unphysical 1.15 A intermolecular H-H contact across the mirror plane that relaxes to 1.83
  A in P21/n; Section 5, pp. 156-157, and Table 2, p. 157). The unique structure type is
  built from chains of edge-sharing, Jahn-Teller-distorted [4+2] Cu1O6 and Cu2O6 octahedra
  (tetragonality factor T = <Cu-O>_eq / <Cu-O>_ax = 0.8, <Cu1-O> = 2.1372 A, <Cu2-O> =
  2.1348 A) running along [100], cross-linked by AsO4 tetrahedra (<As1-O> = 1.6905 A) and
  lone-pair-active six-coordinated trigonal-antiprismatic Pb2+ cations (<Pb1-O> = 2.5920 A)
  into corrugated layers stacked along [001] and linked across the interlayer space by
  OH- and H2O-mediated hydrogen bonds, structurally related to duftite (PbCu(AsO4)(OH)) by
  formal removal of one Cu(OH)2*2H2O unit per formula unit (Tables 3-7, pp. 157-159, and
  Section 7.2, pp. 162-163). The five strongest lines in the calculated powder X-ray
  diffraction pattern [dcalc in A (Icalc; dmeas, Imeas) hkl; Abstract, p. 153, and Table 8,
  p. 160] are 8.425 (100; 8.419, 27) (002), 3.713 (60; 3.729, 30) (014), 3.276 (54; merged
  dmeas = 3.185, Imeas = 100) (120), 3.221 (42; merged with 120 at dmeas = 3.185, Imeas =
  100) (023), and 2.645 (61; 2.642, 53) (016). No biological or microbial interaction data
  are reported in the type mineralogical description.
