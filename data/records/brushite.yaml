- id: ima_2026_09
  title: 'IMA-CNMNC. The New IMA List of Minerals, September 2026; definitions pages 1-2 and Brushite
    row PDF page 32: Ca(PO3OH)(H2O)2, G, 1865. Previously acquired official original re-inspected on 14
    October 2026.'
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: handbook
