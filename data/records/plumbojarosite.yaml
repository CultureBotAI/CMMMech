mechanisms:
- id: cn32_reductive_dissolution
  name: CN32-associated reductive dissolution of synthetic Pb-jarosite
  process: redox_transformation
  microbial: true
  organisms:
  - id: NCBITaxon:319224
    label: Shewanella putrefaciens CN-32
  description: Washed living CN32 cells were associated with increased filtered ferrous iron during anaerobic
    exposure to synthetic Pb-jarosite relative to sterile mineral controls. Lead in the filtrate rose
    transiently and subsequently became very low; electron-dense Pb-enriched particles were observed with
    cells. These observations support a laboratory reduction and redistribution process. They do not establish
    complete mineral dissolution, a named pure lead-phosphate product, isolated lead recovery or a demonstrated
    gene mechanism.
  context: Synthetic Pb-jarosite was prepared in chloride/sulfate solution at about 98 degrees C for 72
    hours, washed with hot sodium chloride and water, dried at 110 degrees C and checked by powder diffraction
    (SI S1/Figure S1). The reduction assay used 0.0500 +/- 0.0013 g mineral with 16 mL modified M1 medium
    in 20 mL tubes, approximately 0.016 g wet cells per inoculated tube, 24 mM sodium lactate and 20 mM
    PIPES, initially adjusted to pH 7.3 without added phosphate. Tubes were rotated in a 96% nitrogen/4%
    hydrogen chamber. Mineral arms were sampled destructively in triplicate through nominal 768 hours;
    inoculated and sterile medium-only controls were sampled in duplicate. Cultures had been grown aerobically
    at 32 degrees C; a separate dissolution-incubation temperature is not specified in the inspected methods,
    so 32 degrees C is not assigned to that assay. Filtrate passed a 0.20 micrometre nylon filter; ICP-OES
    and ferrozine assays have different fractions and do not measure a recovered product.
  evidence:
  - source_ref: smeaton2012_chapter2
    supports: support
    explanation: Chapter 2 sections 2.2-2.3 and Figure 2.1 show ferrous iron increasing in inoculated
      mineral tubes, while sterile mineral controls remain near baseline. The text reports about 197 micromolar
      Fe(II) at the nominal 768-hour endpoint. Filtered lead peaks early and later falls below the stated
      0.09 micromolar instrumental detection limit; this is not zero lead or an extraction percentage.
      Figure 2.1 error bars are standard errors for three mineral tubes. All tubes share the same inoculum
      preparation, not three independently prepared cultures.
  - source_ref: smeaton2009_si
    supports: partial
    explanation: SI S2-S3 and Tables S1-S4 constrain interpretation. PIPES masks sulfur release, so sulfate
      was not an independent dissolution measure. Acidified filtrate may include iron-bearing colloids;
      saturation indices predict possible secondary phases but do not identify precipitates. Final Table
      S3 Fe(III) is 1.90 micromolar whereas the chapter text gives 12.4 at a differently labeled endpoint.
      Methods use 192/408/768 hours while prose also uses 198/400/776; these conflicts are not silently
      harmonized. Table S3 zero lead is a modeling input in a below-detection context, not a measured
      absence.
  - source_ref: smeaton2012_chapter2
    supports: partial
    explanation: Figures 2.2-2.3, sections 2.3.2-2.3.3 and supporting microscopy show cell-associated
      electron-dense material and Pb-enriched granules within prepared cell cross sections. Intracellular
      phosphate precipitation and ATPase-mediated detoxification are author interpretations; no gene-expression
      or perturbation experiment establishes them. Viability is an ATP-luminescence proxy, not a direct
      viable-cell count, and the prose time/value assignments conflict with the plotted series. Neither
      these images nor aqueous depletion provide a complete solid/liquid lead balance.
  - source_ref: smeaton2009_si
    supports: partial
    explanation: SI S5 explicitly uses 0.1 M phosphate-buffered glutaraldehyde and osmium fixation before
      TEM. Thus phosphorus in prepared granules alone cannot establish its intracellular metabolic origin
      or rule out preparation effects; no phosphate-free fixation comparator is reported. Near-immediate
      SEM supports cell-associated particles before TEM processing, but does not settle their intracellular
      chemistry. Table S5 spot compositions are local EDS measurements, with non-normalized totals in
      some cellular spots; they are not bulk mineral stoichiometry. Figures S2-S3 show secondary precipitates
      in both sterile and inoculated arms; modeled magnetite/green-rust phases and hypothetical ATPase
      roles remain unconfirmed. This is a qualified laboratory observation, not industrial deployment.
