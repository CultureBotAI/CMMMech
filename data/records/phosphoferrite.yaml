mechanisms:
- id: air_heating_oxidation
  name: Abiotic heating-associated oxidation of natural phosphoferrite
  process: redox_transformation
  microbial: false
  description: Moore (1971) reports that Hagendorf Sud phosphoferrite heated in air at 240 degrees C for
    five days oxidized to a ferric equivalent while retaining single-crystal and powder diffraction features
    interpreted as isotypic with the initial material, with broadened lines and spots. This establishes
    a qualified thermal oxidation observation for the investigated natural specimen. It does not establish
    a mass-balanced yield of pure kryzhanovskite, a measured hydrogen-production pathway or a microbial
    process. The proposed internal proton-cleavage mechanism was a hypothesis; the author specifically
    proposed anaerobic heating and quantitative hydrogen collection as a future test.
  context: Natural phosphoferrite crystals from Hagendorf Sud, supplied by D. J. Fisher; Table 1 uses
    a historical chemical analysis with Mn and Ca substitution. Crystals of phosphoferrite, vivianite
    and ludlamite were heated separately in open capillaries at 120, 180 and 240 degrees C for five days,
    with a chromel-alumel thermocouple in contact with the crystals. Products were quenched to room temperature,
    dissolved in cold HCl and titrated against potassium dichromate; diffraction was compared with starting
    material. The explicit phosphoferrite outcome is reported at 240 degrees C; lower-temperature phosphoferrite
    outcomes, sample masses, replicate counts, quantitative conversion uncertainty and a mass balance
    are not supplied in this experiment description. Vivianite and ludlamite are different-mineral comparisons,
    not matched oxygen-free phosphoferrite controls. The 1980 study revises the earlier natural kryzhanovskite
    reference data, not this heating experiment, and does not independently replicate its outcome.
  evidence:
  - source_ref: moore1971
    supports: support
    explanation: Page 14 Oxidation Sequences gives the capillary temperatures, five-day duration, air
      atmosphere, thermocouple, HCl/dichromate analysis and qualified ferric/isotypic outcome. Table 1
      page 2 and Figure 7 page 15 distinguish initial P-1, heated P-1-prime and the separate natural K-1
      specimen. Page 16 presents hydrogen release as a proposed mechanism requiring an anaerobic collection
      test, not a measured product.
  - source_ref: moore1980
    supports: partial
    explanation: Page 790 and Tables I-II explicitly revise earlier natural kryzhanovskite cell parameters
      and 14 of 31 indexed powder lines; its c-axis differs by 4.2 percent from the earlier result. Page
      792 retains historical chemical analyses because little type material was available. These corrections
      limit exact structural and compositional inference from Moore (1971), while the 1980 work does not
      report a repeat of the phosphoferrite heating experiment. Its synthetic-endmember comparison draws
      on Moore and Araki (1976), not a new synthesis in 1980.
