mechanisms:
- id: paxillus_muscovite_surface_weathering
  name: Fungal-associated muscovite surface alteration under potassium limitation
  process: bioleaching
  microbial: true
  organisms:
  - id: NCBITaxon:71150
    label: Paxillus involutus
  description: 'After 21 days with Paxillus involutus, muscovite surfaces showed uneven erosion and localized
    removal of surface layers relative to the pre-exposure images. These observations support a bounded
    fungal-weathering interpretation. They do not demonstrate an efficient potassium supply: potassium
    concentration in harvested mycelium was not significantly greater than in the potassium-depleted,
    mineral-free fungal control. Neither surface alteration nor gene-expression associations establish
    a quantified potassium extraction yield or isolated recovery product.'
  context: Pinzari2024 used the source-reported ATCC 200175 strain, with ITS Sanger identity checking
    described in SI S2. SI S3 identifies muscovite NHM specimen BM 1937,454 from a granite pegmatite at
    Jegdalek, Siah Koh, Afghanistan. SEM-EDX and microprobe provided its structural composition; XRD detected
    no associated minerals. Approximately 2 cm2 flakes were ultrasonically cleaned in deionized water
    and autoclaved at 121 degrees C for 15 minutes. Flakes rested on sterile cellophane over 30 mL modified
    Melin–Norkrans agar in 100-by-20 mm Petri dishes. Three 5 mm plugs from the edge of seven-day cultures
    inoculated each dish; incubation was 21 days at 25 degrees C in darkness. The muscovite arm and mineral-free
    negative control omitted KH2PO4, with ammonium phosphate adjusted to balance phosphorus against the
    complete-medium positive control. These recipe changes are not a matched abiotic mineral control or
    proof that every nitrogen-related variable was identical. Residual potassium in agar and cellophane
    means the depleted arm was not potassium-free. Five biological replicates per condition were used
    for elemental analysis; five per condition were sequenced, although ten were initially allocated to
    RNA extraction. The assay lacked plants and is a laboratory fungal system, not demonstrated industrial
    bioleaching or plant nutrient transfer.
  evidence:
  - source_ref: pinzari_2024
    supports: support
    explanation: Methods 2.1–2.3 and Results 3.3, especially Figure 1a1–a3, compare initial muscovite
      surfaces with those exposed to the fungus and document localized alteration. The comparison is before
      versus after exposure, not a matched, aged, fungus-free muscovite treatment. Figures 1b/c concern
      other minerals and do not establish their effects for muscovite.
  - source_ref: pinzari_2024_si
    supports: support
    explanation: Methods S1–S3 and Figure S1 establish the medium, organism verification procedure, separate
      mineral/control arms, specimen provenance and preparation. Muscovite was assigned structural formula
      (Si3.13Al0.87)(Al1.72Mg0.11Fe3+0.19)(Na0.10K0.83)O10(OH)2. Reported lack of XRD-detected accessory
      phases is not proof that all trace contamination is absent. The KCl exchange treatment applies only
      to vermiculite, not muscovite.
  - source_ref: pinzari_2024
    supports: partial
    explanation: 'Table 3 and Results 3.2/3.4 explicitly limit potassium acquisition: mycelial K was 6.80
      ± 0.96 micrograms per gram dry mycelium with muscovite versus 5.52 ± 1.69 in the depleted control
      (means ± SD, n=5); both share statistical group c under the reported ANOVA/Tukey comparison. These
      are concentrations in digested harvested material, not percent release from the mineral or total
      recovered K. Mineral flakes were removed before digestion; carryover and abiotic-aged-mineral contributions
      were not separately mass-balanced. Trace K in agar/cellophane and possible inoculum carryover prevent
      interpreting detected K alone as mineral-derived.'
  - source_ref: pinzari_2024
    supports: partial
    explanation: Table 1 reports initial agar pH 5.6 ± 0.1 and final muscovite-arm pH 2.12 ± 0.19, but
      the depleted control shares a statistical group with the mineral arms. Figures 2–5 and Table 5 show
      transcriptomic responses largely overlapping potassium depletion, with some differential expression.
      Proposed redox or metal-binding weathering pathways are interpretations of expression and morphology,
      not knockout-tested causal mechanisms or direct enzymatic-rate measurements. No significant upregulation
      of the identified potassium-transporter genes versus the depleted control was reported. The earlier
      Pinzari2022 study is cited as related work, not counted here as an independently verified replication.
  - source_ref: ncbi_paxillus
    supports: context_only
    explanation: Taxon 71150 resolves the species name only. ATCC 200175 is retained as reported by the
      primary study; the checked ATCC product URL did not resolve, and no independent authentication of
      the culture stock or strain-specific taxonomy mapping is claimed.
  - source_ref: geo_158973
    supports: context_only
    explanation: The live series metadata links the same five-condition, twenty-five-sample RNA-seq study
      to the publication and taxon 71150. The sequence dataset is a provenance lead, not a new mineral-weathering
      experiment; raw read reanalysis and gene-level supplemental-table validation are outside the accepted
      surface and concentration comparisons.
