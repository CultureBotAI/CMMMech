id: cmmmech:zhenruite
name: Zhenruite
material_kind: mineral
description: >-
  IMA-approved hydrous molybdenum trioxide ("molybdic acid" hemihydrate) mineral (IMA
  2022-050; status A, Approved 2022; full description published January 2026; symbol Zhr in
  the Abstract, p. 39, and Section 1, p. 40, of the primary paper; no separate symbol
  column is printed in the September 2026 IMA Master List, PDF p. 240) with ideal
  end-member formula (MoO3)2(H2O) in the September 2026 IMA Master List (PDF p. 240) and
  (MoO3)2*H2O (equivalently MoO3*1/2H2O, requiring MoO3 94.11 wt%, H2O 5.89 wt%, total
  100.00 wt%) in Gu, Yang, Marty, Kampf, Thorne, Gibbs, and Downs (2026, European Journal
  of Mineralogy 38:39-52). Co-described with tianhuixinite ((MoO3)3*H2O, IMA 2022-081) and
  named in honour of Professor Zhenruilling (Zhenru Ling, b. 1934) of the Department of
  Geology, Chengdu University of Technology, Sichuan, China, for her lifelong dedication to
  teaching mineralogy and X-ray crystallography (Section 1, p. 40). Discovered on a
  specimen collected by Joe Marty on 12 May 2020 from a surface dump at the Freedom #2
  mine, Central Mining District, ~5.6 km north-northeast of Marysvale, Marysvale volcanic
  field, Piute County, Utah, USA (latitude 38 deg 29 min 43 sec N, longitude 112 deg 12 min
  55 sec W; weathered product of primary molybdenum ores in an epithermal U-Mo vein system
  hosted in a 23-18 Ma volcanic/hypabyssal complex of porphyritic quartz monzonite,
  fine-grained granite, and glassy alkali rhyolite; co-type locality for umohoite,
  liangjunite, wangpuite, downsite, vanpeltite, and fanguangite, associated with alunogen,
  anhydrite, coquimbite, fluorite, liangjunite, quartz, and raydemarkite; Abstract, p. 39,
  and Section 2.1, pp. 40-41); the holotype specimen is deposited in the Natural History
  Museum of Los Angeles County, Los Angeles, California, USA (catalogue no. 76253), the
  cotype is in the University of Arizona Alfie Norville Gem and Mineral Museum, Tucson,
  Arizona, USA (catalogue no. 22714), and a second cotype is in the RRUFF Project,
  University of Arizona, USA (catalogue no. R210014) (Section 1, p. 40). Occurs as acicular
  or prismatic crystals up to 60 x 10 x 10 um elongated along [010] (Figures 1 and 3, pp.
  40-42); crystals are colourless in transmitted light and transparent with a white streak,
  vitreous lustre, brittle tenacity, Mohs hardness 1.5-2, perfect cleavage on {001}, no
  observed twinning, Gladstone-Dale calculated average refractive index n_calc = 1.990
  (optical properties could not be measured directly because the refractive indices exceed
  those of available immersion liquids), and calculated density Dcalc = 4.081 g/cm3 based
  on the empirical formula and single-crystal X-ray diffraction unit-cell volume V =
  248.89(2) A3 with Z = 2 (Abstract, p. 39; Section 2.2, p. 41; and Table 3, p. 47; density
  could not be measured directly owing to small crystal size and limited material).
  Wavelength-dispersive electron-microprobe analyses (Shimadzu EPMA-1720 at 15 kV, 10 nA,
  2 um beam diameter, pure Mo metal standard, n = 7 spot analyses; Section 2.2, pp. 41-42,
  and Table 1, p. 41) yielded mean MoO3 93.24 wt% (SD 1.81 wt%), with ideal H2O* = 5.89 wt%
  added, giving a total of 99.13 wt% and an empirical formula of (Mo1.00O3)2*H2O on the
  basis of 7 O atoms per formula unit. Micro-Raman spectroscopy (Thermo Almega, 532 nm
  laser, 1 um spot; Section 2.3 and Figure 6, pp. 42-44) showed bands at 3366 and 3260 cm-1
  (H2O O-H stretching), 1605 cm-1 (H-O-H bending), 974, 960, and 921 cm-1 (terminal Mo=O
  stretching), 877, 686, 650, and 592 cm-1 (bridging Mo-O-Mo stretching), and lattice modes
  below 400 cm-1 (386, 336, 267, 232, 206, 179, 134, 108 cm-1). Crystallizes in the
  monoclinic system, space group P21/m (#11), as the natural counterpart of synthetic
  monoclinic P21/m (MoO3)2*H2O ("alpha-MoO3*1/2H2O" of Fellows et al., 1983, and Benard et
  al., 1994), with single-crystal X-ray diffraction unit-cell parameters (Rigaku XtaLAB
  Synergy D/S, CuKalpha radiation, lambda = 1.54184 A, at room temperature; Section 2.4, p.
  43, and Table 3, p. 47) a = 9.6790(6) A, b = 3.70653(19) A, c = 7.1029(4) A, beta =
  102.391(5) deg, V = 248.89(2) A3, Z = 2, and axial ratio a:b:c = 2.6113:1:1.9163 (powder
  X-ray diffraction on a Rigaku XtaLAB Synergy D/S diffractometer in Gandolfi mode at 50 kV
  and 1 mA gave refined unit-cell parameters a = 9.680(3) A, b = 3.7077(6) A, c =
  7.0992(17) A, beta = 102.385(14) deg, V = 248.85(6) A3; Section 2.4, p. 43; note that
  Table 3 on p. 47 prints Z = 2 for natural zhenruite alongside Z = 4 for synthetic
  (MoO3)2*H2O from Benard et al., 1994, where V = 248.4 A3 and Z = 4 correspond to the
  hemihydrate formula unit MoO3*1/2H2O rather than (MoO3)2*H2O). The crystal structure was
  solved by direct methods (SHELXT) and refined on F2 (SHELXL) to R1 = 0.032 and wR2 =
  0.091 for 582 observed reflections with I > 2sigma(I) (out of 609 independent and 5069
  collected reflections, Rint = 0.054, GooF = 1.073 for 55 parameters; Table 3, p. 47). The
  asymmetric unit (Table 4, p. 47) contains two independent Mo6+ cations (Mo1 and Mo2 at 2e
  special positions with y = 1/4; BVS 6.08 and 5.99 vu in Table 7a, p. 49) and seven O
  sites (O1-O7 at 2e; O1 is the coordinated H2O oxygen with BVS 0.36 vu), forming two
  topologically identical double chains of edge-sharing octahedra along [010] (a type-A
  chain of Mo1O6 octahedra and a type-B chain of Mo2O5(H2O) octahedra, each with two short
  Mo=O bonds of 1.684(4)-1.735(5) A, two intermediate Mo-O bonds of 1.9511(15)-1.9597(15)
  A, and two long Mo-O bonds of 2.248(4)-2.428(5) A; Table 6, p. 49) that alternate via
  shared O6 corners to build corrugated layers parallel to (001) linked along [001] by
  interlayer hydrogen bonds from O1 (O1...O2 = 2.920 A x 2, O1...O4 = 2.936 A, O1...O6 =
  3.160 A, O1...O7 = 3.050 A), topologically identical in layer geometry to anhydrous
  molybdite (MoO3) and raydemarkite (MoO3*H2O) (Sections 3.1 and 3.3, pp. 46-51). The seven
  strongest powder X-ray diffraction lines [dmeas in A (Imeas, Ical) (hkl); Abstract, p.
  39, and Table 2, p. 46] are 6.932 (68.0, 72.6) (001), 4.729 (47.2, 75.3) (200), 3.565
  (24.0, 35.7) (201), 3.183 (100.0, 100.0) (11-1), 3.139 (43.2, 33.4) (20-2), 3.003 (31.2,
  35.3) (111), and 2.281 (20.0, 20.2) (20-3). No biological or microbial interaction data
  are reported in the type mineralogical description.
