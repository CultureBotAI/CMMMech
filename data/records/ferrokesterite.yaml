id: cmmmech:ferrokesterite
name: Ferrokësterite
material_kind: mineral
description: >-
  Tetragonal copper-iron-tin sulfide mineral of the stannite group with current
  September 2026 IMA-CNMNC approved formula Cu2FeSnS4, renamed status Rn, and
  approval number IMA 1985-012. Kissin and Owens (1989) characterized the type
  material from Geological Survey of Canada specimen 14747 (cotypes GSC 65048
  polished section A and British Museum (Natural History) BM 1984, 844 grain
  mount) from a greisen-bordered vein on the 60-m level of the Cligga mine
  (Cligga Head), Perranzabuloe, Cornwall, United Kingdom, corresponding to the
  low-temperature polymorph previously referred to in the literature as
  'isostannite'. Electron-microprobe analysis of the Cligga mine holotype
  (Table 1 analysis 4 and Table 4 analysis 1, pp. 675 and 678) yielded Cu 28.9,
  Fe 8.6, Zn 5.0, Sn 27.0, S 29.5, total 100.9 wt%, corresponding on an 8-atom
  basis to the empirical formula Cu1.99(Fe0.67Zn0.33)Sigma1.00Sn0.99S4.02, with
  Fe > Zn at the divalent B site of the kësterite structure. Precession single-
  crystal and powder X-ray diffraction (Table 6, p. 680) indexed in tetragonal
  space group I-4 (a = 5.433(36), c = 10.884(89) A, Z = 2), distinguishing
  ferrokësterite from its high-temperature polymorph stannite (space group
  I-42m) and from the Zn-dominant end-member kësterite (Cu2ZnSnS4, space group
  I-4). The 1989 characterization used powder and precession photography without
  a new single-crystal site-occupancy refinement on the Cligga mine holotype.
  Distinct from stannite, kësterite, petrukite, sakuraiite, and elemental tin;
  no criticality designation, microbial mechanism, or industrial recovery yield
  is asserted.
