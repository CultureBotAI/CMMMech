    supports: support
    explanation: Sections 2.3 and 3.2-3.3 with Figures 5-7 report increasing supernatant REE signals with declining pH in culture-containing laboratory flasks. Table 1 and XRD Figure 2 support a mixed calcium-sulfate-rich feed; individual REE host phases were not established. The observation does not itself identify the chemical form of released REEs or an isolated recovered product.
  - source_ref: zhang2025
    supports: partial
    explanation: Figure 7 labels the release axis in micrograms/kg while Section 2.3.3 reports micrograms/L, and its plotted maximum is around day 24 rather than the conclusion's approximately day 21. Table 2's feed inventory, the stated liquid-to-solid treatment and the reported 24.67% total extraction lack a reproducible common denominator. The pH experiment compares inoculated acidic arms with an uninoculated pH 6.8 control, without a matched acidified sterile control. Figure error bars lack a stated replicate number or error definition in the inspected article. Organic-acid identities and concentrations were not measured here. Neither the 24.67% total nor 55.67% Nd claim is accepted as a verified recovery yield.
