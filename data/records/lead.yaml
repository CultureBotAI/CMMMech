id: cmmmech:lead
name: Lead
material_kind: element
description: Lead (Pb), represented as an element distinct from dissolved lead, pyromorphite
  mineral and lead-bearing commodities or wastes. Laboratory bacterial cultures enhanced Pb
  release from synthetic pyromorphite, demonstrating that microbial interactions can remobilize
  previously immobilized lead. The United States 2025 designation names the lead commodity;
  it does not designate every lead compound, mineral or secondary resource.
