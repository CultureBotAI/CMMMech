  evidence:
  - source_ref: frueholz_2025
    supports: support
    explanation: Results 3.3 and Figure 7 report pooled 125-g/L cycle means of 68.1 +/- 2.1% Zn and 5.1 +/- 2.1% Fe at day 7, versus 75.2 +/- 5.5% Zn and 9.0 +/- 1.5% Fe at day 14. Error bars are reported standard deviations across six serial cycles. These are the paper's apparent cycle leaching percentages, not independently reconstructed recovery yields. Substantial Zn was already in liquid at the 30-minute day-0 sample; that sample is not an unreacted baseline.
  - source_ref: frueholz_2025
    supports: partial
    explanation: Methods 2.5, Equation 3 subtracts estimated metal carried in the retained 1 L of liquid and normalizes to the metal inventory in newly added dust. It assumes homogeneous solids during withdrawal. Retained solids can continue dissolving, and their contribution is not separately resolved by that liquid subtraction. Individual cycle feed/residue inventories, sampling losses and a complete Zn/Fe balance are not supplied. Published percentages therefore cannot be interpreted as verified extraction from a fresh independent dust charge or whole-process recovered-metal yields.
  - source_ref: frueholz_2025_supplement
    supports: partial
    explanation: The first supplementary table's row labeled 0.42 vvm; Day 7; Zn gives 75.22526% with SD 3.01688%, repeating its day-14 entry. This conflicts with Figure 6 and the second table's pooled day-7 mean 68.05669%; the two listed day-7 subgroup means do not reproduce that pooled mean. The discrepancy remains unresolved. Sequential cycles share retained material, and repeated sampling shares a cycle; the reported two-sample tests do not establish independent reactor replication. No corrected value or independently verified significance claim is assigned here.
  - source_ref: frueholz_2025
    supports: partial
    explanation: Figure 4 reports negligible Zn release in uninoculated medium and some Al release. The control has no matched preacidification or pH trajectory, so it cannot isolate live-cell action from acidic solution history. Figures 5 and 8-9 support acidification and sulfate-associated Zn mobilization; medium sulfate and retained liquor also contribute to the measured sulfate pool. ORP and sulfate are not direct cell counts or a demonstrated gene, adhesion or exopolysaccharide mechanism. The authors explicitly leave contact versus non-contact dissolution unresolved.
  - source_ref: frueholz_2025
    supports: partial
    explanation: Results 3.3 and Figures 6 and 11 show no demonstrated enhancement of Zn extraction when aeration increased from 0.42 to 0.50 vvm. The fitted oxygen-transfer coefficient is about 14 per hour under both settings. Sequential operation confounds aeration with reactor history; the result does not establish that oxygen supply never limits this culture. Fitted transfer parameters are not direct metal-recovery measurements.
  - source_ref: frueholz_2024
    supports: context_only
    explanation: Reference 9 establishes cast-house tapping origin and reports the feed's Fe-rich mixed mineralogy, including iron oxides, zincite and Zn-bearing spinels. Its 0.5-M sulfuric-acid flask experiments also mobilized Zn without a living culture. These are different assays, not matched controls for the 2025 reactor or independent replication of its A. thiooxidans outcomes. Its A. ferrooxidans results are not pooled with the 2025 data and do not identify the later culture's strain.
  - source_ref: frueholz_2025
    supports: partial
    explanation: 'Table 2 compares untreated dust with one selected cycle residue: Fe concentration increases and Zn/S concentrations decrease, but residue mass is not given. Concentration changes and similar SEM particle-size distributions do not close element balances or certify steelmaking reuse. Zinc remains in the residue. Proposed precipitation, solvent extraction, bioelectrochemical recovery and regional annual tonnage projections were not demonstrated process outputs. No isolated Zn product, complete wastewater/sulfur loop, economic demonstration or industrial biological operation was established.'
