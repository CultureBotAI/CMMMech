    url: https://www.dsmz.de/collection/catalogue/details/culture/DSM-33
    accessed_on: '2026-10-11'
  - id: ncbi1474
    title: >-
      NCBI Taxonomy 1474, Sporosarcina pasteurii, species; includes DSM 33 among
