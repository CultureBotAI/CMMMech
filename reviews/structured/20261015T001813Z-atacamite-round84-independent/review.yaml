limitations:
- Joseph 2011 original characterization graphics were not successfully acquired by
  the curator and are not directly accepted here; the 2012 source assignment remains
  qualified.
- No matched sterile copper-mineral or acid-specific causality controls; precise numerical
  room temperature and pH are absent.
- Dose and product-denominator ambiguities preclude accepted numerical recovered-metal
  yields; synthetic starting purity is not independently demonstrated.
- Search coverage is bounded; no claim that all conflicting literature or external
  supplements were exhaustively ruled out.
- This scientific review does not assert hosted CI, queue, merge, branch cleanup or
  deployment completion.
