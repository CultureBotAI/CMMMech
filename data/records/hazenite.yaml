mechanisms:
- id: cyanobacterial_remains_associated_hazenite
  name: Hazenite associated with cyanobacterial remains at Mono Lake
  process: biomineralization
  description: Natural hazenite crystals occurred in or on completely dried or decomposed cyanobacterial
    material on calcium-carbonate tufa. Decomposition supplying phosphate and cell surfaces providing
    nucleation sites were proposed explanations. The accepted evidence supports mineral identity and spatial
    association with microbial remains, not a demonstrated causal requirement for metabolism or an exclusive
    biological pathway.
  context: The studied material came from the south shore of Mono Lake, California, at 37 degrees 56 minutes
    31 seconds N, 119 degrees 1 minute 42 seconds W, on porous substrates described as mainly calcite
    and aragonite. This is an observational field collection followed by laboratory mineral characterization,
    not a controlled culture trial. The original description calls the substrate organisms green algae
    (cyanobacteria) but supplies no taxonomic identification or strain accession for the field remains;
    the Lyngbya sp. culture cited from earlier work is not assigned to these specimens. The source describes
    the lake generally as alkaline and hypersaline from prior literature; those values are not specimen-specific
    measurements or a validated formation window. Time of crystallization, local pore-water pH, biomass
    state during nucleation and seasonal dependence were not established.
  microbial: true
  evidence:
  - source_ref: yang_2011
    supports: partial
    explanation: Occurrence and Methods on page 676 and Figure 1 show or describe tufts of crystals associated
      with dried/decomposed cyanobacterial material. Twenty-point electron-microprobe averages, Raman
      spectroscopy and powder/single-crystal XRD (Tables 1-6 and Figures 2-3, pages 676-679) establish
      the reported mineral and its structure. Water in the empirical chemical analysis was calculated
      by difference to 100%, not independently measured by that analysis. Mineral identity and spatial
      association do not demonstrate that microorganisms caused crystallization.
  - source_ref: yang_2011
    supports: partial
    explanation: Formation on pages 679-680 proposes phosphate release during breakdown of phosphorus-bearing
      organic matter and heterogeneous nucleation on cell membranes, with dissolved lake components supplying
      Na, K and Mg. No matched sterile substrate experiment, killed-versus-live comparison, phosphate-source
      tracer, kinetic series or quantitative recovery mass balance tests those proposals in the field
      material. The abstract and structural discussion suggest an exclusive biological role, which is
      not established by crystal structure or association and is not adopted here. The authors themselves
      leave biological control versus biological induction and seasonal effects unresolved.
  - source_ref: yang_2011
    supports: context_only
    explanation: 'Page 679 recounts an earlier Lyngbya sp. culture discovery cited to Yang and Sun 2004:
      a 1:1 mixture of lake and distilled water solidified with 1.2% agar dried after growth, with crystals
      near dead colonies. That earlier original was not acquired in this curation, so this retrospective
      paragraph is not treated as an independently inspected culture experiment and its missing controls,
      incubation temperature, duration and strain identity are not filled in. Struvite experiments cited
      on page 680 are distinct studies and do not supply matched controls or causal proof for hazenite.'
- id: stappia_3bis2_lake_water_agar_precipitation
  name: Hazenite-assigned crystals in Stappia sp. 3bis2 lake-water agar cultures
  process: biomineralization
  microbial: true
  organisms:
  - id: NCBITaxon:1870903
    label: Stappia sp.
  description: A heterotrophic isolate from a submerged Bagno dell’Acqua microbialite produced crystals
    assigned to potassium-sodium hazenite in supplemented lake-water agar. Diffraction and elemental analysis
    support a hazenite-rich mixed precipitate for Stappia sp. 3bis2. The observation extends the separate
    Mono Lake field association with a controlled laboratory culture, but does not demonstrate exclusive
    microbial formation, the biochemical mechanism or phosphorus recovery from untreated lake water.
  context: Mazzoni et al. isolated bacteria from submerged microbialite site 2, cultured on LB at pH 9
    and 28 degrees C, and used 15-30 microlitre spots of saturated liquid cultures. B4LW contained about
    70 percent(v/v)0.22-micrometre-filtered lake water plus 0.4 percent yeast extract, 0.5 percent dextrose,
    0.3 percent urea and 1.5 percent agar. It was not filtered lake water alone despite the abstract wording.
    Table 4 gives initial pH 9 and 35 days at 28 degrees C for the Stappia sp. 3bis2 material; a pH trajectory
    and independent mineralization-replicate count are not supplied. Crystals for routine XRD were removed
    from colonies, washed repeatedly with distilled water using low-speed centrifugation and air-dried
    at 37 degrees C; selected Figure 6 SEM crystals were lifted directly with a needle. XRD semiquantification
    used peak areas and mineral intensity factors, alongside SEM-EDS morphology/composition. GenBank OR770211.1
    corroborates the 3bis2 partial 16S sequence and unresolved Stappia sp. label. Table 3 reports 96.68
    percent similarity to a nearest Stappia indica sequence; that does not establish species identity.
    The phosphate contributions of lake water, yeast extract, agar and inoculum carryover were not separately
    measured.
  evidence:
  - source_ref: mazzoni2024
    supports: support
    explanation: Results 3.3, Table 4 and Figure 6 assign hazenite to the Stappia sp. 3bis2 B4LW crystals
      after 35 days, with SEM-EDS detecting K, Na, Mg and P. Table 4 reports 86 wt percent hazenite with
      7 percent calcite, 6 percent ankerite and 1 percent kaolinite; prose and abstract describe about
      85 percent. These are semiquantitative proportions of sampled mixed solids, not percent phosphorus
      recovered, a phase-pure product or a whole-plate production yield.
  - source_ref: mazzoni2024_si
    supports: support
    explanation: Figure SM1 shows the original Stappia sp. 3bis2 B4LW 35 day diffraction pattern with
      multiple hazenite-labelled reflections alongside calcite, ankerite and kaolinite. It supports the
      reported phase assignment and mixture, not an independently refined crystal structure or a replicated
      quantitative yield.
  - source_ref: mazzoni2024
    supports: partial
    explanation: Methods 2.4 states that uninoculated plates incubated under the same conditions produced
      no precipitation and that crystals occurred only at inoculation sites. No killed-cell, cell-free
      spent-medium, nutrient-source or phosphate-tracer comparison resolves metabolism versus nucleation
      or reagent/inoculum phosphate contributions. The molecular mechanism is explicitly unresolved in
      Discussion; hypothetical wastewater treatment and fertilizer applications are not demonstrated deployment.
  - source_ref: mazzoni2024_si
    supports: partial
    explanation: The cited Figure SM2 depicts crystals within a Stappia sp. 3bis2 colony on B4CaCl2 at
      pH 8 after 11 days, not the B4LW pH 9/35 day hazenite arm or a displayed uninoculated B4LW plate.
      It therefore does not independently document the exact hazenite-arm blank claimed in Methods.
  - source_ref: mazzoni2024
    supports: partial
    explanation: Figure 7 shows additional source-named Bacillus, Sutcliffiella and Metabacillus isolates
      with similar crystals and selected EDS spectra, but Table 4 and Figure SM1 provide hazenite XRD
      for Stappia 3bis2 only. Those other isolates are not assigned the same diffraction-confirmed phase
      fraction. Figure 7 introductory wording says 35 days for all, whereas panel E explicitly shows 3bis8
      at 100 days. Closest 16S relatives are not confirmed species or causal members of the natural community.
      Hazenite was not reported in the sampled Pantelleria microbialites themselves.
  - source_ref: stappia_3bis2_sequence
    supports: context_only
    explanation: The deposited partial 16S accession identifies source strain 3bis2 as Stappia sp. , agreeing
      with the retained unresolved label; it does not authenticate a whole genome, infer a pathway or
      establish Stappia indica identity.
