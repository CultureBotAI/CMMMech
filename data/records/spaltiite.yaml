id: cmmmech:spaltiite
name: Spaltiite
material_kind: mineral
description: >-
  IMA-approved thallium-copper-arsenic sulfosalt mineral (IMA 2014-012; status A, Approved
  2014; full description published January 2026; symbol Spti in Section 1, p. 28, and
  Figure 3b caption, p. 30, and Spli in Figure 3a caption, p. 30, of the primary paper;
  no separate symbol column is printed in the September 2026 IMA Master List, PDF p. 203)
  with ideal end-member formula Tl2Cu2As2S5 (printed as Tl2Cu2As2S5 in the September 2026
  IMA Master List, p. 203, and in the Title, Abstract, and Section 1, pp. 27-28, and as
  Cu2As2Tl2S5 in Table 4, p. 33, requiring Cu 15.02 wt%, As 17.71 wt%, Tl 48.32 wt%, S
  18.95 wt%, total 100.00 wt%; Graeser et al., 2026, European Journal of Mineralogy
  38:27-37). Named from the laboratory nickname "spalti", derived from the German verb
  "spalten" ("to split"), in allusion to its extremely pronounced cleavage parallel to
  (100) and (010) leading to easy splitting of crystals along their elongation axis [001]
  into thin needle-like fragments (Abstract, p. 27, and Section 1, p. 28). Discovered in
  July 1995 by Mineralische Rohstoffe und Mineralien Studien- und Schürfgemeinschaft in der
  Grube Lengenbach (FGL) on a dump of the Lengenbach quarry, Binntal, Canton Valais,
  Switzerland (latitude 46 deg 21 min 54 sec N, longitude 8 deg 13 min 15 sec E; hosted by
  Triassic dolomitic marble metamorphosed to upper greenschist-lower amphibolite facies at
  ~500 deg C during the Alpine orogeny and mineralized by late-stage hydrothermal solutions
  enriched in As and Tl; Sections 1-2, pp. 28-29); the holotype (and only known) specimen,
  which had to be preserved intact for single-crystal and Gandolfi X-ray diffraction and
  electron-microprobe studies, is deposited in the collections of the Natural History Museum
  Basel, Augustinergasse 2, 4051 Basel, Switzerland, under catalogue number NMB M11408
  (Abstract, p. 27, and Section 1, p. 28). Occurs in a ~1 mm dolomitic cavity as a 2 mm
  group of two subparallel intergrown hypidiomorphic columnar crystals elongated along [001]
  with dominant pinacoid {100} and poorly developed {010}, {210}, and {hk0} prism faces and
  parallel striations along [001], closely intergrown with dufrenoysite (forming an oriented
  syntaxial intergrowth with c_spaltiite = 6.323(3) A parallel to b_dufrenoysite ~ 7.90 A at
  a 4:5 repeat ratio, 4 x 7.90 = 31.60 A vs. 5 x 6.32 = 31.60 A) and realgar, and
  associated with small quantities of pyrite, drechslerite (Tl4(Pb,Sb,As)4S8), and hatchite
  (TlPbAgAs2S5) (Abstract, p. 27; Section 3, pp. 29-30; and Table 2, p. 31). Crystals are
  greyish to lead-grey to black and opaque with a metallic lustre, black streak, brittle
  tenacity, perfect cleavage on {100} and {010} resulting in splintery fracture, Vickers
  micro-indentation hardness VHN15 = 47 kg/mm2 (range 39-57 kg/mm2; printed as "kg mm-2" in
  the Abstract, p. 27, and as "kg mm2" in Section 4, p. 30), corresponding to Mohs hardness
  2-2.5, and calculated density Dcalc = 5.70 g/cm3 (Abstract, p. 27; Section 4, p. 30; and
  Table 4, p. 33; density could not be measured directly because of the scarcity of
  material). Under reflected light in air, spaltiite is grey-white without internal
  reflections, weakly pleochroic (slightly stronger in oil), and distinctly anisotropic with
  bluish-greenish to dark-reddish rotation tints; reflectance values (R1, R2 in %) measured
  in air (Zeiss MPM800 spectrophotometer, SiC standard, 20x objective; Table 1, p. 30) at
  the four COM wavelengths are 29.8, 32.0 (470 nm), 28.0, 29.9 (546 nm), 26.9, 28.9 (589
  nm), and 25.0, 26.8 (650 nm) (full spectrum reported from 400 to 700 nm in 20 nm steps in
  Table 1, p. 30). Wavelength-dispersive electron-microprobe analyses (CAMECA SX50 at 20 kV,
  20 nA, 5 um beam diameter; standards CuFeS2 for Cu, Ag2S for Ag, synt. TlAsS2 for Tl, As,
  and S, and Sb2Se3 for Sb; n = 10 spot analyses on the single polished holotype fragment;
  Section 5, p. 30, and Table 2, p. 31) yielded mean Cu 15.46(12) wt%, Ag 0.15(6) wt%, As
  17.36(14) wt%, Sb 0.41(5) wt%, Tl 47.41(19) wt%, Pb not detected (<0.1 wt%), S 19.20(8)
  wt%, total 99.99(32) wt% (charge balance ch = -1.2%), corresponding on the basis of 11
  atoms per formula unit (Z = 4) in Table 2 (p. 31) to Cu 2.04(1), Ag 0.01(0), As 1.94(1),
  Sb 0.03(0), Tl 1.95(1), S 5.03(1) apfu (note that the Abstract on p. 27 and Section 5 on
  p. 30 print the empirical formula as Tl1.94Cu2.04Ag0.01As1.95Sb0.03S5.03 and
  Cu2.04Ag0.01Tl1.94As1.95Sb0.03S5.03, respectively, swapping the Table 2 apfu coefficients
  of Tl = 1.95(1) and As = 1.94(1), where 47.41 wt% Tl / 204.383 = 0.23197 and 17.36 wt% As
  / 74.9216 = 0.23171 confirm Tl1.95 and As1.94 apfu). Crystallizes in the monoclinic
  system, space group P21/c (#14), with single-crystal X-ray diffraction unit-cell
  parameters (Nonius Kappa CCD diffractometer, MoKalpha radiation, lambda = 0.71073 A, T =
  293 K; Table 4, p. 33) a = 15.791(8) A, b = 10.000(5) A, c = 6.323(3) A, beta = 99.25(8)
  deg, V = 985.5(8) A3, Z = 4, and axial ratio a:b:c = 1.579:1:0.632 (Gandolfi powder X-ray
  diffraction with FeKalpha radiation on a 114.6 mm camera, Table 3 footnote b, p. 32, gave
  a = 15.821(9) A, b = 10.023(6) A, c = 6.334(4) A, beta = 99.21(6) deg). The crystal
  structure was solved by charge flipping and refined on F2 to R1 = 0.1218 for 4753
  observed reflections with Fo > 4sigma(Fo) and R1 = 0.1408 for all 6057 unique reflections
  out of 19,790 measured reflections, with GooF = 1.51 for 101 parameters (CSD-2505991;
  note that Table 4 on p. 33 prints the row label "R1(F): all, observed" alongside the
  values "12.18 %, 14.08 %", transposing the "all" and "observed" labels relative to the
  Abstract on p. 27, which confirms R1 = 12.18 % for the 4753 observed reflections with Fo
  > 4sigma(Fo)). The asymmetric unit (Table 5, p. 33) contains 11 independent fully occupied
  sites: two Tl+ cations (Tl1[7] in a distorted pentagonal bipyramid, BVS 0.968 vu, and
  Tl2[8] in a bicapped pentagonal bipyramid / distorted tetragonal antiprism, BVS 0.965 vu,
  with stereoactive 6s2 lone pairs), two As3+ cations (As1 and As2 forming [As2S5]4-
  diarsenite pyro-groups via shared S22 corners with As1-S22-As2 = 107.6 deg and three
  short As-S bonds of 2.248-2.313 A plus two long As-S contacts of 2.978-3.363 A; BVS 2.938
  and 3.091 vu), two Cu+ cations (Cu1 in slightly pyramidal [3S + 1As] coordination with a
  short Cu1-As1 contact of 2.635(3) A, BVS 0.784 vu, and Cu2 in distorted CuS4 tetrahedra,
  BVS 0.900 vu), and five S2- anions (S11, S12, S21, S22, S23), forming two-dimensional
  {[Cu2As2S5]2-}inf(2) layers parallel to (100) connected across the interlayer space by
  Tl1 and Tl2 polyhedra, with order-disorder (OD) polytypism linking the MDO1 (P21/c) and
  hypothetical orthorhombic MDO2 (Pcnm) polytypes and a modular relationship to wallisite
  (CuPbTlAs2S5) and hatchite (AgPbTlAs2S5) (Section 7, pp. 32-35). The seven strongest
  powder X-ray diffraction lines in the Gandolfi pattern [dobs in A (Irel, Icalc) hkl;
  Table 3, p. 32] are 3.907 (100, 100) (021), 3.643 (80, 34) (-221), 3.484 (30, 45) (311),
  2.980 (50, 63) (510), 2.862 (30, 45) (-511), 2.647 (60, 36) (-331), and 2.506 (50, 29)
  (040) (the Abstract on p. 27 lists eight strong lines including 2.749 (30, 26) (202)). No
  biological or microbial interaction data are reported in the type mineralogical
  description.
