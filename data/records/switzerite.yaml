id: cmmmech:switzerite
name: Switzerite
material_kind: mineral
description: Switzerite is the monoclinic manganese(II) phosphate heptahydrate mineral, ideal Mn3(PO4)2.7H2O,
  written Mn2+3(PO4)2(H2O)5.2H2O in the September 2026 IMA list (redefined status Rd; number 1966-042).
  The tetrahydrate previously called switzerite was renamed metaswitzerite; they are distinct mineral
  species. The microbial evidence is a qualified source assignment in streptomycete cultures, without
  published switzerite diffraction traces or direct hydrate determination for those products. Separate
  primary observations establish air dehydration of a natural Fe-bearing specimen. No criticality designation
  is inherited from manganese or phosphorus.
