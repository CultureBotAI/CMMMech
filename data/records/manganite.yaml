  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Manganite row, PDF page 134; introductory status/date definitions and terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
