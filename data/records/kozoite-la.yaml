mechanisms:
- id: synthetic_la_kozoite_formation_35c
  name: Abiotic formation of synthetic La kozoite during carbonate aging
  process: other
  microbial: false
  description: >-
    In a laboratory La-carbonate suspension aged at 35 °C, powder
    X-ray diffraction identified increasing kozoite alongside decreasing
    lanthanite. Table 1 and Figure 1b agree on 18 wt% kozoite and
    82 wt% lanthanite at 24 h, 54 wt% kozoite and 46 wt% lanthanite
    at 192 h, and 100 wt% kozoite among the quantified crystalline
    phases at 360 h. These are fitted crystalline phase fractions,
    not a La mass balance, isolated-metal yield or recovery efficiency.
    Microscopy at 24 h shows La-kozoite spherulites on lanthanite
    surfaces. Dissolution-recrystallization and spherulitic growth are
    the authors' interpretation of the phase and morphology changes,
    rather than a directly resolved molecular pathway.
  context: >-
    Terribili et al. (2025) mixed 40 mL of 50 mM Na2CO3 with 40 mL
    of 50 mM La-bearing solution prepared from La(NO3)3·6H2O and
    Milli-Q water. Solutions were brought to 35 °C before mixing;
    sealed glass reactors were held static in a preheated oven.
    Periodic 5 mL suspensions were vacuum-filtered through 0.2 µm
    polycarbonate filters, rinsed with isopropanol and air-dried.
    Cu Kα powder diffraction with database pattern identification
    and TOPAS Rietveld refinement supplied crystalline phase
    fractions; amorphous material is not quantified by these values.
    The time series and separate temperature arms supply phase
    comparators. Two replica experiments are described only for the
    ambient-temperature arm; independent replication and phase-fraction
    uncertainties are not specified for this 35 °C arm. The solution
    speciation discussion uses Nd-phase solubility constants because
    La-kozoite data were unavailable, so it is not a direct La-specific
    saturation measurement. Other temperature arms are not pooled
    with this experiment; the separate 80 °C, 72 h values differ
    between Table 1 (93 wt% kozoite, 7 wt% tengerite) and Figure 1d
    (94 wt% kozoite, 6 wt% tengerite), so that endpoint is not used.
    No microorganisms, natural ore feed or industrial-scale operation
    were tested in this arm.
  evidence:
  - source_ref: terribili2025
    supports: support
    explanation: >-
      Methods page 946 defines the solution synthesis and phase analysis;
      Table 1 page 947 and Figure 1b page 948 agree on the three
      reported 35 °C phase fractions. Figure 8b page 955 shows
      La-kozoite on lanthanite after 24 h at 35 °C. Discussion pages
      957-959 proposes the dissolution-recrystallization explanation
      and describes the substituted Nd thermodynamic data. The
      narrower laboratory phase-formation observation is supported;
      molecular causality, metal recovery and quantitative claims
      for the conflicting 80 °C endpoint remain unestablished.
