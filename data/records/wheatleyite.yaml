id: cmmmech:wheatleyite
name: Wheatleyite
material_kind: mineral
description: Wheatleyite is the sodium-copper oxalate dihydrate mineral Na2Cu(C2O4)2(H2O)2, approved as
  IMA 1984-040. It is distinct from moolooite, other copper oxalates, elemental copper and the mixed weathered
  ore used in the experiment below. A laboratory product was assigned to wheatleyite by powder diffraction;
  this does not establish a phase-pure recovered product or a natural ore deposit. No constituent criticality
  designation is inherited.
