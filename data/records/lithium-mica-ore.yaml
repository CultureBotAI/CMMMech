  evidence:
  - source_ref: sedlakova2020
    supports: support
    explanation: Figure 1A, Figure 4 and Li distribution/Bioleaching efficiency report a 0.2% extraction from the feed, combining dissolved and biomass-associated lithium; 77% of that extracted lithium was assigned to the biomass fraction. The 77% is not a fraction of initial ore lithium or an isolated-product yield. Reported uninoculated non-detection and lower culture pH support a culture-associated outcome, subject to the unspecified detection limit and the shared Table 1 versus AAS feed-composition conflict.
  - source_ref: sedlakova2020
    supports: partial
    explanation: Supplementary Figure S1 shows hyphae on and within apparent particle cleavages. Figure S2C includes source-assigned quartz with mica and kaolinite references, which the text interprets as a changed residue. These images do not quantify mechanical dissolution or prove de novo quartz precipitation; no quantitative mineral mass balance or matched sterile residue XRD is supplied. Figure 3 shows acidification but individual organic acids were not measured. Biomass digestion does not distinguish intracellular lithium from surface-bound lithium or fine mineral carryover; no killed-biomass control or localization assay resolves those alternatives. The proposed fungal-then-bacterial sequence and extraction of lithium from biomass were not demonstrated.
- id: beauvoir_yeast_leaching
  name: Yeast culture-associated lithium mobilization and biomass partitioning
  process: bioleaching
  description: R. mucilaginosa cultivation with the Beauvoir mixed ore yielded lithium in solution and in a harvested biomass fraction. The rich medium promoted greater biomass-associated lithium than the poor medium in the authors' account. Solution decline and biomass digestion support partitioning to harvested material but do not alone prove intracellular bioaccumulation, a specific uptake pathway or isolated lithium recovery. Comparisons with the fungal and bacterial assays are confounded by medium, temperature, agitation and duration.
  context: The source identifies CCY 20-1-36, called R. mucilaginosa and formerly R. rubra; the verified NCBI identifier is at species rank. Five-day precultures were added to 200 mL media with 10 g/L ore in 250 mL flasks. Rich medium contained glucose 20, KH2PO4 5, (NH4)2SO4 5, MgSO4 0.34 and yeast extract 7 g/L; poor medium contained glucose 5 and (NH4)2SO4 0.5 g/L. Media started at pH 5.1 and were autoclaved before inoculation. The source states 21 degrees C and duplicate experiments with uninoculated controls. Methods and figure captions specify shaking at 160 rpm, but Methods also says statically; this conflict is unresolved. Sampling is listed through day 59, while plotted comparisons show shorter series. Supernatant was centrifuged and assayed by AAS; harvested biomass was dried, incinerated and acid-digested for lithium measurement.
  microbial: true
  organisms:
  - id: NCBITaxon:5537
    label: Rhodotorula mucilaginosa
  evidence:
  - source_ref: sedlakova2020
    supports: support
    explanation: Figures 1A and 4 and the Li distribution/Bioleaching efficiency sections report early dissolved lithium, followed by a lower liquid concentration, and a total reported extraction of 1.1% from ore in the rich-medium assay. The reported 92% in biomass is a share of the extracted lithium, not 92% extraction from the feed. The text attributes higher total extraction in rich medium to greater biomass formation; the report does not establish equal-condition superiority over another organism.
  - source_ref: sedlakova2020
    supports: partial
    explanation: Centrifugation and digestion of a harvested fraction do not distinguish intracellular uptake from surface retention or entrained solids, particularly without killed-biomass controls. Figure 3's yeast curve rises again at its last plotted point, whereas the prose ends its description near pH 3.5; no exact final pH is selected here. Supplementary Figure S2D shows a changed mixed-residue pattern, but unmatched scales, unquantified phase assignments and missing sterile-residue XRD prevent a species-specific transformation claim. The feed-assay and incubation-description conflicts also limit quantitative comparison. Downstream recovery and sequential microbial processing remain proposals rather than performed operations.
- id: mechanically_activated_community_leaching
  name: Community-associated lithium mobilization from mechanically activated mixed ore
  process: bioleaching
  description: An acidophilic microbial community incubated with mechanically activated mixed lithium-mica feed produced higher dissolved-lithium concentrations than the reported abiotic arm, with the pyrite-supplemented culture highest in the source's comparisons. Grinding and acidic chemical leaching also contributed. The evidence supports a laboratory culture-associated result, without resolving organism-specific action, a pure mica-species response or an isolated lithium product. The authors' combined percentage calculation includes a subsequent hydrochloric-acid extraction of residues and is not a direct biological recovery yield.
  context: Li et al. used lepidolite supplied by Central South University, Changsha, with no reported mine provenance; its initial mixed phase assignments do not identify a pure polylithionite or trilithionite. A separate pyrite feed was added to the eutrophic arm. Ore sieved to 38-74 micrometres was milled in stainless-steel equipment at 200 rpm, ball-to-material mass ratio 20:1, for 0-150 minutes. Three parallel 250 mL flasks per group contained 100 mL 9K basal medium initially at pH 2.0, 10 g/L ore, and either 10 g/L added pyrite in eutrophic cultures or no added pyrite in oligotrophic cultures. Washed mid-log community inocula started at 5 x 10^7 cells/mL; incubation was 45 degrees C, 180 rpm for 14 days, with sampling every two days and daily evaporation replacement. The community came from the Dabaoshan sulfide-mining area and was adapted to lepidolite plus pyrite. Its 16S-based labels, including unclassified Leptospirillum and Acidithiobacillus caldus, do not establish authenticated
    strains or individual causal contributions; no strain or taxon identifier is asserted for this community. Methods describes sterile controls without pyrite, but Figure 2 depicts pyrite in that arm and Figures 9 and S5 label pyrite peaks in its residues. The actual control composition is unresolved.
  microbial: true
  evidence:
  - source_ref: li2025
    supports: support
    explanation: Sections 2.2.3-2.2.4, 3.2 and original Figure 6d show direct leachate lithium concentrations increasing with activation, and higher concentrations in the culture arms than the abiotic arm at corresponding activation durations. The pyrite culture is highest in the plotted comparisons. ICP-OES measures total elemental lithium in the sampled solution, not free-ion speciation. Figures 3-5 document changed particle morphology and diffraction after grinding. These comparisons support the measured laboratory response, without a quantified isolated product, industrial deployment or demonstrated process economics.
  - source_ref: li2025
    supports: partial
    explanation: 'The sterile-arm pyrite discrepancy between Methods and original Figures 2, 9 and S5 prevents assuming a matched pyrite control. Figure 6a also shows markedly different pH histories: initial pH was shared, but acidity was not held equal. No matched-acidity, killed-cell or cell-free metabolite comparison separates the effects of acidification, live cells and added pyrite. Initial feed XRD Figure 1 includes celadonite labels omitted from its accompanying main-phase list; no quantitative phase analysis resolves which mica supplied the lithium. Sample-withdrawal volumes and a complete sampling mass balance are not supplied.'
  - source_ref: li2025
    supports: partial
    explanation: Sections 2.2.6-2.2.7, Equation 1, Figure 7 and original Figure S1 distinguish the initial leachate from freeze-dried residues treated with 1 M HCl for 24 hours. Equation 1 adds direct solution lithium to the difference between acid-treated culture and sterile residues. HCl can dissolve remaining feed as well as associated material, so that difference does not selectively measure EPS-bound or secondary-mineral lithium. The printed denominator defines feed lithium content in mg/L multiplied by ore mass in grams, a dimensionally inconsistent definition that is not silently corrected here. Section 2.1.2 reports 3.20% Li and 5.05% Al by ICP-MS, whereas Equation 1 attributes feed lithium to XRF and Table S1 contains no Li cell and gives 26.35% Al2O3. These unresolved assay and denominator issues prevent an independently reconstructed extraction percentage.
  - source_ref: li2025
    supports: partial
    explanation: Section 3.6 and Figure 11 report 11.3%, 20.8% and 24.9% for sterile, oligotrophic and eutrophic arms after 150-minute activation, whereas Conclusions reports 11.3%, 16.75% and 19.24%. No reconciled percentage is adopted. The Figure 7 bars and adjacent prose also differ for acid-treated sterile and oligotrophic residues. Neither those acid-extraction values nor the combined percentages are presented here as direct microbial recovery. The claimed threefold comparison with the 2020 study also uses a 41-day duration that does not describe its prolonged bacterial arm; unlike feeds, conditions and analytical fractions preclude that pooled performance claim.
  - source_ref: li2025
    supports: partial
    explanation: Figures 8-10, S3-S5 and Tables S2-S3 support cell-associated surfaces, altered mixed residues, community profiles and lithium in an operational thermal extract. Jarosite assignments in eutrophic residues and lithium in the extract do not establish lithium incorporation in a specific mineral lattice, intracellular uptake or a quantitative EPS-binding mechanism. Extraction at 80 degrees C and the source's cell-disruption description do not isolate pure extracellular polymer. Table S3 reports lithium in micrograms per litre, not milligrams per litre. Figure 12 is a proposed mechanism diagram; sequencing shifts, microscopy and FTIR alone do not establish the separate causal steps or a mineral-specific mass balance.
