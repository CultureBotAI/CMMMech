  evidence:
  - source_ref: kang2016
    supports: support
    explanation: Page 210 Figure 7 labels a small feature A as azurite alongside M (malachite), C (calcite) and U (copper carbonate). The SEM and XRD Results explicitly assign these phases. Figure 6 supplies morphology of calcium- and copper-carbonate-associated solids but cannot identify azurite by shape alone. No raw diffraction data, phase-fit uncertainty, quantitative azurite fraction or separately isolated azurite product is provided. The source’s abbreviated formula in prose omits a hydroxyl subscript; this record uses the authority formula and does not interpret that printing inconsistency as evidence for a different species.
  - source_ref: kang2016
    supports: partial
    explanation: Methods p. 208 describe a separate YA assay with 5 microlitres of 12-hour culture added to 45 mL broth in a 100 mL flask, nominally 5 mM urea, 25 mM CaCl2 and 2 mM copper, at 30°C and 200 rpm for 48 h. Controls without added cells are stated for all experiments. Solution removal is calculated from initial and final supernatant ICP-OES concentrations after centrifugation, not from recovered mineral mass. Figure 8 and p. 211 instead describe 72 h and report 61.8% copper removal; the p. 211 dose is printed as 2 M, while the figure’s starting Cu concentration is about 270 mg/L, inconsistent with nominal 2 mM elemental Cu. These values are retained as source inconsistencies, not reconciled or assigned to azurite. Figure 7 uses BPU whereas Figure 8 and the removal protocol use YA.
  - source_ref: kang2016
    supports: partial
    explanation: Figures 1–3 support the authors’ isolate assignment, urease activity and copper tolerance; Figure 8 shows increasing pH in the B-22 culture. However, an azurite-specific uninoculated diffraction comparison, matched-pH chemical control, urease-inhibited treatment and phase-resolved copper mass balance are not shown. The generic statement that controls were included is not equivalent to a reported azurite-specific control result. The distinct sand-column and EPS experiments in Figures 4–5 do not establish an azurite-specific contribution to immobilization.
  - source_ref: genbank_kj485701
    supports: partial
    explanation: The accession cited for B-22 resolves to Sporosarcina soli B7-22 and NCBI taxon 334736, with soil as isolation source. This supports the species label but does not independently authenticate the differently labelled experimental isolate. A submission address is not treated as specimen geography. The paper reports 99% 16S similarity; species-level mapping does not remove the unresolved strain-label mismatch.
