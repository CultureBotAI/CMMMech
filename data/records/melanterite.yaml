id: cmmmech:melanterite
name: Melanterite
material_kind: mineral
description: >-
  Melanterite is the monoclinic ferrous sulfate heptahydrate mineral,
  FeSO4·7H2O, grandfathered in the September 2026 IMA list. It is distinct
  from dissolved ferrous sulfate, other sulfate hydrates and ferric oxides.
  The accepted primary study assigns minor melanterite in a mixed solid
  from a nitrate/Fe(II) microcosm containing Comamonas strain HJ-2. This
  is a qualified culture-associated phase observation, not proof of
  metabolically necessary crystallization, pure-mineral production or
  iron recovery. The strain's species identification is unresolved.
sources:
- id: ima_2026_09
  title: >-
    IMA-CNMNC. The New IMA List of Minerals, September 2026; Melanterite row,
    PDF page 139, and definitions on pages 1-2. Fe(SO4)(H2O)6·H2O,
    status G, year 1850.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-15'
