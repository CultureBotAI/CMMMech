    Dissolution of uranyl-oxide-hydroxy-hydrate minerals. I. Curite.
    Canadian Mineralogist 44:415-431. DOI 10.2113/gscanmin.44.2.415.
    Complete 17-page published PDF acquired from the coauthor's
