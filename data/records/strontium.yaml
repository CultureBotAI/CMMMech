mechanisms:
- id: tk2d_sr_biomineralization
  name: Culture-associated strontium removal into carbonate-rich precipitates
  process: biomineralization
  description: Bacillus sp. TK2d cultures removed Sr from the filtered liquid fraction and produced
    extracellular Sr- and Ca-bearing precipitates. Electron diffraction supported aragonite-like
    carbonate material, while Sr XANES fits supported a changing mixture of SrCl2-like and SrCO3-like
    local environments. Ureolysis and cell-surface association are consistent contributors, but an
    obligatory molecular pathway and a pure strontianite product are not established. The result
    concerns a defined laboratory salt medium, not treatment of radioactive wastewater or an isolated
    strontium product.
  context: 'Horiike et al., Medium and cultivation conditions and Sr removal test: marine broth 2216
    at 3.74 g/L (described as 10% broth), final NaCl 30 g/L, autoclaved then filtered through 0.45
    micrometre pores, supplemented with urea at 20 g/L and 1.0 mM Sr as SrCl2. A 0.5 mL, OD600 0.1
    preculture inoculated 50 mL in a 100 mL flask, incubated at 30 degrees Celsius and 120 rpm in
    triplicate. Parallel salinity tests used source-labelled 0.3%, 3%, 5% and 10% NaCl. The isolation
    plate was set to pH 7.6; the paper does not provide a time-resolved broth pH series or a pH-matched
    abiotic arm. Daily aliquots were centrifuged at 21,000 x g for 5 min; the ICP-AES procedure included
    0.2 micrometre filtration and triplicate analytical readings per sample. The two centrifugation
    descriptions specify 4 and 20 degrees Celsius, respectively; their relationship is not resolved.
    Uninoculated Sr-containing medium was the negative control. Microscopy, diffraction and XANES
    examined collected solids at different times; these are not measurements of one identical final
    sample. Reagent SrCl2 was used with no radionuclide activity stated; the Discussion explicitly
    leaves actual contaminated seawater and 90Sr tests for future work.'
  microbial: true
  organisms:
  - id: NCBITaxon:1630002
    label: Bacillus sp. TK2d
  evidence:
  - source_ref: horiike_2017
    supports: support
    explanation: 'Results, Isolation of a urease-producing microorganism, and Figures 1-2: at 3%
      NaCl the text reports soluble Sr declining from 1.0 mM to 0.13 mM at day 2 and below 1.0e-7
      mol/L after 4 days. The stated bound is retained rather than converted to zero or an exact
      100% recovery. The Methods describe uninoculated controls; the screening Results report little
      decline in the negative control and four other isolates. Figures 1-2 show culture time courses
      rather than overlaid full negative-control curves. Ammonium accumulation accompanies Sr decline
      but is not a urease knockout or inhibition test.'
  - source_ref: horiike_2017
    supports: support
    explanation: Figures 3-5 and the solid-characterization Results report Sr/Ca in precipitates,
      P-containing dense regions associated with cells at day 2, and extracellular mineral material
      at later times. The reported electron-diffraction spacings are consistent with aragonite. Table
      1 gives two-standard XANES fitted SrCO3-like fractions of 52% after 5 days and 87% after 10
      days for the 1 mM starting-Sr cultures; the remaining fitted fractions are SrCl2-like. These
      are model-dependent spectral fractions, not crystalline-phase purities, fractions of total
      initial Sr recovered, or proof that all solid Sr is strontianite.
  - source_ref: horiike_2017
    supports: partial
    explanation: Figure 2 and its Results show much weaker Sr removal at 5-10% NaCl than at 0.3-3%,
      despite growth at some higher salinities. Urease-positive isolates did not all remove Sr effectively.
      The chemical comparison also formed Sr-bearing carbonate without bacteria, using a different
      Na2CO3/CaCl2/SrCl2 recipe; it is not a chemistry-matched control proving microbial necessity
      for precipitation. The data do not establish a specific Mg ion-channel mechanism or universal
      Sr selectivity.
  - source_ref: horiike_2017
    supports: partial
    explanation: Figure 1b shows a modest Mg concentration change although the Results describe no
      decrease; the defensible comparison is much stronger depletion of Sr and Ca, not exact Mg exclusion
      from all phases. EDS nondetection in selected carbonate material has an approximately 0.1%
      weight/weight detection limit and does not establish zero Mg throughout the precipitate. Long-term
      leaching stability, isolated-metal yield and deployment are untested in this study. The linked
      supplement was not acquired after bounded PMC, publisher and Europe PMC attempts; claims here
      rely on the inspected main text, Table 1 and main Figures 1-6, not an independent reassessment
      of supplementary micrographs or chemical-control curves.
