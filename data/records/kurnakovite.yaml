id: cmmmech:kurnakovite
name: Kurnakovite
material_kind: mineral
description: >-
  Kurnakovite is the Mg[B3O3(OH)5](H2O)4·H2O mineral species in the
  September 2026 IMA-CNMNC list, with grandfathered status G and
  original-description year 1940. The year is not an approval identifier.
  Its triclinic P-1 structure distinguishes it from its monoclinic
  dimorph inderite. It is also distinct from elemental boron, the borates
  commodity and a mixed borate-bearing experimental precipitate.
  Gatta et al. characterized natural Kramer Deposit, California,
  material by wet chemistry and neutron diffraction at 293 and 20 K.
  The structural model contains Mg-bound water and an interstitial
  water molecule, with chains connected by hydrogen bonds. Its
  specimen-specific chemistry is not a resource-grade survey: the
  reported water content assumes furnace mass loss is entirely water,
  and minor measured silicon may reflect impurities rather than
  structural substitution. Criticality and microbial activity are not
  inherited from boron content.
