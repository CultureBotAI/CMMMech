id: cmmmech:illite
name: Illite group
material_kind: mineral_group
description: Illite is represented as a mineral group, as designated in the IMA compendium nomenclature table, rather than an ideal single species or an undifferentiated clay commodity. The experimental material is the source-designated IMt-1 illite preparation. Its measured behavior is not transferred from the separate nontronite and montmorillonite studies that reported mixed illite-like transformation products. No phase-pure endmember, universal formula or constituent criticality designation is asserted.
sources:
- id: ima_compendium_2019
  title: Schertl, Mills and Maresch, editors (2019 copyright). A Compendium of IMA-Approved Mineral Nomenclature, prepared for IMA2018. PDF p34 reproduces Whitney and Evans (2010), Abbreviations for names of rock-forming minerals, DOI 10.2138/am.2010.3371; Table 1 marks chlorite and illite GROUP. Historical nomenclature table, not a 2026 species approval.
  url: https://cnmnc.units.it/ima_reports/2%20IMA-Nomenclature-e-Booklet-2019-1.pdf
  accessed_on: '2026-10-14'
- id: jung_2022
  title: Jung, Chung, Ko, Moon, Suh and Kim (2022). A microbial driver of clay mineral weathering and bioavailable Fe source under low-temperature conditions. Frontiers in Microbiology 13:980078. DOI 10.3389/fmicb.2022.980078; PMCID PMC9441888. Complete ten-page original, Methods pp2-3, Figures 1-6 and Tables 1-2.
  url: https://doi.org/10.3389/fmicb.2022.980078
  accessed_on: '2026-10-14'
- id: ncbi_vesiculosa
  title: NCBI Taxonomy 518738, Shewanella vesiculosa, species; current taxonomy XML inspected 14 October 2026. Species mapping does not identify the unnamed experimental isolate as type strain M7.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=518738&mode=Info
  accessed_on: '2026-10-14'
mechanisms:
- id: cold_imt1_reduction
  name: Low-temperature culture-associated reduction and alteration of IMt-1 illite
  process: redox_transformation
  description: Cultures assigned by the authors to Shewanella vesiculosa increased measured iron reduction and operationally dissolved total iron relative to uninoculated IMt-1 controls at low temperature. Diffraction broadening and altered particle surfaces accompany the response. The paper interprets these observations as reductive dissolution and secondary precipitation; exclusive structural-iron provenance and a complete recovery mass balance remain unestablished.
  context: The Clay Minerals Society IMt-1 material was size-separated below 2 micrometres by gravitational settling and freeze-dried. An unnamed Antarctic isolate from the King Sejong Station area was grown in LB at 15 degrees C for seven days, washed three times, and inoculated at approximately 10^7 CFU/mL. Laboratory bottles contained 100 mL nitrogen-purged M1 medium, 4 g/L IMt-1 and nominal 20 mM sodium lactate, buffered with MOPS to pH 6, at 0 or 4 degrees C for up to 24 weeks. No strain accession or sequence-based verification is supplied. Samples were frozen at minus 70 degrees C and thawed before analysis. Acid/HF digestion followed by phenanthroline measured Fe(II)/total Fe; centrifuged, 0.45-micrometre-filtered liquid was analyzed by ICP-AES for total iron, not specifically Fe(II). Triplicate analytical sets are stated, without clear independent-bottle replication.
