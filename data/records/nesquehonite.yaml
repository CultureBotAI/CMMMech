    hydromagnesite page 98, huntite page 97, nesquehonite page 154. Grandfathered description years
    are not approval identifiers.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
