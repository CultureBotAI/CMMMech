id: cmmmech:zirconium
name: Zirconium
material_kind: element
description: >-
  The element Zr, distinct from zirconium salts, zirconia phases, zircon
  mineral and zirconium-metal commodities. The United States 2025
  Zirconium designation is mapped to this element without extending it
  to every host mineral or compound. The curated laboratory preparation
  combines microbial culture with subsequent thermal processing and
  does not establish isolated zirconium-metal recovery.
