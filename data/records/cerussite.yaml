mechanisms:
- id: brown_rot_surface_transformation
  name: Culture-associated lead oxalate formation on cerussite
  process: biomineralization
  description: Brown-rot fungal cultures incubated with a cerussite specimen produced surface crystals assigned to anhydrous lead oxalate. The strongest phase assignments combine powder diffraction and microscopy for Serpula himantioides LE-BIN 1368, Coniophora puteana LE-BIN 1370 and source-named Antrodia xantha LE-BIN 1029. The Serpula lacrymans LE-BIN 1192 comparison has a weaker microscopy-only lead-oxalate assignment. This is a laboratory transformation observation, not a measured lead extraction or isolated recovery yield.
  context: Table 3 identifies the starting specimen as cerussite, Pb(CO3), supplied by the Central Scientific and Research Geological Museum of Academician F. N. Chernyshev in Saint Petersburg. The paper states that starting substrates were examined by PXRD and EDX, but supplies no quantitative starting purity or specimen accession for this feed. No battery-paste identity is inferred. Methods 2.2 describes approximately 1 x 0.5 x 0.5 cm blocks in plastic Petri dishes with 20 mL liquid glucose-peptone medium, initial pH 5.5, room temperature and 30 days, in triplicate. Mycelial fragments came from ten-day cultures on glucose-peptone agar. Inoculum amount, substrate sterilization and a separate complete liquid-medium formulation are not specified. The paper names Antrodia xantha; current NCBI taxonomy and its cited ribosomal accession use Amyloporia xantha for LE-BIN 1029. The organisms list includes the tested comparator S. lacrymans; it does not assert identical mineral formation by every
    listed culture.
  microbial: true
  organisms:
