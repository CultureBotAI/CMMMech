    functional_role: Plasma-membrane MFS citrate exporter CexA that secretes intracellularly synthesized citric acid into the extracellular medium, driving organic-acid acidification and metal mobilization.
    annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:A0A254TZW7 (CEXA_ASPNG) for Aspergillus niger (NCBITaxon:5061).
    evidence:
    - source_ref: zhang2024
      supports: partial
      explanation: Representative Aspergillus niger citrate exporter CexA exporting citric acid (measured at 46.65 g/L in Table S5) into the bioleaching metabolite mixture used on pretreated ion-adsorption REE leach residue in Zhang et al. (2024); cexA was not genetically perturbed in the study.
  evidence:
  - source_ref: zhang2024
    supports: support
    explanation: 'Methods 2.2.1 and Results 3.1 establish the processed feed: 2.5 wt% ammonium sulfate column leaching twice at a reported liquid-to-solid ratio of 5:1, then stirred leaching at 10 mL/g, followed by rinsing and 60-mesh separation. The reported 610.5 mg/kg total rare earths and 261.8 mg/kg exchangeable fraction concern the source''s 60-mesh sieve substrate, not unsieved bulk ore or a regional resource estimate.'
  - source_ref: zhang2024_supplement
    supports: partial
    explanation: Table S3 lists a residual-feed total of 348.7 mg/kg, whereas its displayed individual rare-earth entries sum to 348.8 mg/kg; rounding could account for the difference. Its heading says tailings without ion-unexchangeable REEs, contrary to the main preparation and residual-feed interpretation. This wording conflict is preserved rather than treated as a different feed. Figure S2 supports a heterogeneous multiphase material; mineral classifications and local elemental maps do not establish phase-specific extraction yields.
  - source_ref: zhang2024
    supports: support
    explanation: Section 3.4 and Figure 4 report one-step and two-step leaching ranges of 15.8-24.1% and 18.1-31.4%, respectively, after 20 days. The Figure 4b total bars are below the upper endpoints and have overlapping error bars. The headline 31.4% is therefore retained as the upper extent of the reported range, not asserted as a mean, a statistically established improvement or a percentage of original untreated ore recovered as product. Methods 2.2.3 also describe ammonium-sulfate desorption after leaching; separate liquid, re-adsorbed and final-solid inventories are insufficient to reconstruct a closed rare-earth mass balance.
  - source_ref: zhang2024_supplement
    supports: support
    explanation: Table S5 reports citric acid at 46.65 g/L in the bioleaching metabolite mixture, alongside oxalic, malic, tartaric, succinic and acetic acids. HPLC identification and the Figure 4a pH decrease in the main paper support organic-acid production. The mixture measurement does not show that citric acid alone caused the fungal-arm result or close a carbon balance for the stated cultivation medium.
  - source_ref: zhang2024
    supports: partial
    explanation: Figures 2-3 compare chemical acid conditions, and Figure 5 explicitly characterizes citric-acid leaching by sequential extraction and XPS. These chemical results support a possible acid/ligand explanation but cannot be assigned wholesale to the microbial arm. Sequential extraction fractions are defined by reagents, not unique mineral species. Table 1 compares different local particle spots before and after treatment; their concentrations are not a paired whole-feed mass balance. Cluster-model DFT in Section 3.5 is a proposed explanation, not direct evidence of selective microbial attack on goethite.
  - source_ref: zhang2024_supplement
    supports: partial
    explanation: Figure S1 labels the treated solid after A. niger leaching, whereas main Figure 5 specifies citric-acid treatment. The source's phase interpretation therefore retains arm boundaries. Table S1 reports Fe2O3-equivalent XRF fractions of 4.93 and 1.72 wt%, although the main discussion calls these iron content. They are oxide-equivalent relative compositions, not measured elemental Fe removal fractions. XPS fitted peak areas and DFT model clusters do not quantify bulk goethite abundance.
  - source_ref: zhang2024
    supports: context_only
    explanation: The study is a laboratory investigation of one prepared feed. It supplies neither a fully matched abiotic leaching trajectory nor a purified product, pilot operation, environmental life-cycle assessment or industrial deployment. Claims of general process superiority or transfer to other tailings remain unsupported.
