id: cmmmech:petrukite
name: Petrukite
material_kind: mineral
description: >-
  Indium- and tin-bearing copper-iron-zinc-silver sulfide mineral of the
  stannite group with current September 2026 IMA-CNMNC approved formula
  (Cu,Ag)2(Fe,Zn)(Sn,In)S4 and approval number IMA 1985-052. Kissin and Owens
  (1989) characterized petrukite on cotype specimens (GSC 65049-65052, plus Herb
  claim metatypes AMNH T98797, BM 1987,94, Ecole des Mines T44352, and NMNH
  163779) from three co-type localities: the Herb claim, Cassiar District,
  Turnagain River area, British Columbia, Canada; the Mount Pleasant mine,
  Charlotte County, New Brunswick, Canada; and the Ikuno mine, Hyogo Prefecture,
  Japan. Electron-microprobe analyses across the three localities (Table 5,
  p. 682) yielded a Herb claim mean empirical formula of
  (Cu1.85Fe0.95Zn0.24Ag0.03)Sigma3.07(Sn0.89In0.05)Sigma0.94S3.99 (0.05 apfu In),
  Mount Pleasant compositions with 0.02-0.04 apfu In, and Ikuno mine
  compositions spanning 0.07-0.21 apfu In via the coupled substitution
  Cu+ + Sn4+ <-> In3+ + Zn2+. Precession single-crystal and powder X-ray
  diffraction on Herb claim, Mount Pleasant, and Ikuno grains indexed in
  orthorhombic space group Pmn21 (wurtzite-type superstructure, Table 7,
  pp. 680-683: Herb claim a = 7.6671(81), b = 6.4399(32), c = 6.2605(61) A;
  Ikuno a = 7.7050(27), b = 6.4462(14) [printed 6.4421(14) in text p. 680],
  c = 6.2757(26) A; Mount Pleasant a = 7.6858(101), b = 6.4395(60),
  c = 6.2947(23) A; Z = 2), where ordering of Cu, (Fe,Zn), and (Sn,In) lowers
  the symmetry from the hexagonal P63mc wurtzite subcell. No full atomic-
  coordinate refinement was performed in the 1989 study, and the compositional
  and structural boundary between Sn-dominant orthorhombic petrukite and
  indium-rich sakuraiite remained open to further single-crystal investigation.
  Distinct from sakuraiite, ferrokësterite, kësterite, stannite, and elemental
  indium or tin; no criticality designation, microbial mechanism, or extraction
  yield is asserted.
