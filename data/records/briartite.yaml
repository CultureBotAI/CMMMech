id: cmmmech:briartite
name: Briartite
material_kind: mineral
description: >-
  Briartite is the copper-iron-germanium sulfide mineral species Cu2FeGeS4,
  listed as approved, IMA 1965-018, by IMA-CNMNC in September 2026.
  Francotte and colleagues' 1965 description used the broader historical
  formula Cu2(Fe,Zn)GeS4 and combined polished-section observations,
  powder X-ray diffraction and electron-microprobe analyses of natural
  material from Kipushi, with comparative Tsumeb chemistry. Its Fe-Zn
  variation and uncertain structural interpretation do not establish that
  every historical analysis belongs to the currently delimited Fe species.
  The dated IMA list separately recognizes zincobriartite, Cu2ZnGeS4,
  IMA 2015-094; zinc-rich historical material is not silently reassigned
  to this briartite record. The original describes small grains and
  intergrowths with other sulfides, including chalcopyrite, renierite
  and sphalerite, rather than a pure bulk ore feed. Its Table III column
  labels conflict with the accompanying prose, so individual assay rows
  are not imported as unambiguous specimen measurements. Briartite is
  distinct from germanium element, germanite, renierite and a mixed
  copper-zinc ore. These mineralogical observations establish neither
  a microbial recovery mechanism nor industrial extraction performance;
  no constituent-element criticality designation is inherited.
