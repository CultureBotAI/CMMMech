    functional_role: Diatom silaffin-1 precursor (SIL1) providing the C-terminal cationic peptide mineralization
      domain in the engineered INP-silaffin fusion that nucleates amorphous titanium phosphate/oxide prior
      to calcination into anatase.
    annotation_note: Recombinant INP-silaffin fusion expressed in Escherichia coli BL21(DE3) (NCBITaxon:469008);
      C-terminal silaffin peptide originates from Cylindrotheca fusiformis SIL1 (UniProtKB:Q9SE35, NCBITaxon:2853).
    evidence:
    - source_ref: ping2016
      supports: support
      explanation: Cationic silaffin peptide domain displayed on recombinant E. coli promotes Ti precursor
        hydrolysis and precipitation on the bacterial template before 600 C calcination to anatase TiO2.
