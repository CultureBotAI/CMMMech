  accessed_on: '2026-10-14'
- id: dsm644
  title: DSMZ catalogue DSM 644 — Nitratidesulfovibrio vulgaris, Hildenborough; lists ATCC 29579, NCIMB 8303 and VKM B-1760. Current name and collection equivalence, not an independent authentication of the experimental inoculum.
  url: https://www.dsmz.de/collection/catalogue/details/culture/DSM-644
