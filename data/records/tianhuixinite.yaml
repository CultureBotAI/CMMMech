id: cmmmech:tianhuixinite
name: Tianhuixinite
material_kind: mineral
description: >-
  IMA-approved hydrous molybdenum trioxide ("molybdic acid") mineral (IMA 2022-081; status
  A, Approved 2022; full description published January 2026; no mineral symbol is printed in
  the September 2026 IMA Master List, PDF p. 217, or in the primary type description) with
  ideal end-member formula (MoO3)3*H2O (equivalently MoO3*1/3H2O, requiring MoO3 96.00 wt%,
  H2O 4.00 wt%, total 100.00 wt%; Gu, Yang, Gibbs, and Liu, 2026, European Journal of
  Mineralogy 38:39-52). Co-described with zhenruite ((MoO3)2*H2O, IMA 2022-050) and named in
  honour of the late Chinese mineralogist Prof. Huixin Tian (1933-2015) at Chengdu
  University of Technology, Sichuan Province, China, who graduated from the Changchun
  Institute of Geology in 1956 and from 1960 until her retirement taught crystallography and
  mineralogy, rare metal element mineralogy, and genetic mineralogy, making significant
  contributions to ore mineralogy, ore genesis, and exploration mineralogy (especially Ti-
  and V-bearing magnetite deposits and tin deposits in Sichuan Province and gold-tin
  deposits in Xinjiang Province; Section 1, p. 40). Found on specimens collected from an
  unnamed short adit of the Summit group of claims (latitude 32 deg 33 min 47 sec N,
  longitude 107 deg 43 min 48 sec W) near Cookes Peak, at the southern end of the Cookes
  Range, Luna County, New Mexico, USA (hosted in oxidized, silicified limestone-jasperoid
  fluorite-Pb-Zn-Ag ore bodies localized in limestone units beneath impermeable shale beds
  above a late Eocene-early Oligocene granodiorite stock; co-type locality for raydemarkite,
  virgilluethite, and stunorthropite, associated with barite, fluorite, ilsemannite,
  jordisite, powellite, pyrite, quartz, raydemarkite, sidwillite, and virgilluethite;
  Abstract, p. 39, and Section 2.1, pp. 40-41); parts of the cotype samples are deposited at
  the University of Arizona Alfie Norville Gem and Mineral Museum, Tucson, Arizona, USA
  (catalogue no. 22072), and the RRUFF Project (deposition no. 220024 in Section 1, p. 40,
  printed as R220024 in the Figure 2 caption, p. 41). Occurs as dark blue-green (or
  yellow-green in intergrowths, Figure 4, p. 42) nanometric crystal aggregates (10-70 um in
  size) intergrown with platy virgilluethite on a quartz matrix, showing microcleavages in
  backscattered-electron images (Figures 2, 4, and 5d, pp. 41-43; single-crystal X-ray
  diffraction data were collected from a 10 x 8 x 5 um aggregate fragment, Section 2.4, p.
  45); crystals are translucent in transmitted light with lower transparency than
  virgilluethite, raydemarkite, or sidwillite, are insoluble in water or hydrochloric acid at
  room temperature, and have a white streak, vitreous lustre, brittle tenacity, Mohs hardness
  ~2, no observed macroscopic cleavage or twinning, Gladstone-Dale calculated average
  refractive index n_calc = 1.996 (optical properties could not be measured directly because
  the refractive indices exceed those of available immersion liquids), and calculated density
  Dcalc = 4.131 g cm-3 based on the empirical formula and powder X-ray diffraction unit-cell
  volume V = 361.74(2) A3 (Abstract, p. 39, and Section 2.2, pp. 41-42), or rho_cal = 4.11 g
  cm-3 in Table 3 (p. 47) based on the single-crystal X-ray diffraction unit-cell volume V =
  361.88(9) A3 with Z = 2 (density could not be measured directly owing to small crystal size
  and limited sample). Wavelength-dispersive electron-microprobe analyses (Shimadzu EPMA-1720
  at 15 kV, 10 nA, 2 um beam diameter, pure Mo metal standard, n = 8 spot analyses; Section
  2.2, pp. 41-42, and Table 1, p. 41) yielded mean MoO3 96.81 wt% (SD 2.4 wt%), with
  stoichiometric H2O* = 4.04 wt% added in ideal proportion to measured MoO3, giving a total
  of 100.85 wt% and an empirical formula of (Mo1.00O3)3*H2O on the basis of 10 O atoms per
  formula unit (note that Table 1 footnote * on p. 41 labels H2O* = 4.04 wt% as "Added in
  ideal value", whereas Section 2.2 on p. 42 states that ideal (MoO3)3*H2O requires MoO3
  96.00 wt% and H2O 4.00 wt%; 4.04 wt% is the stoichiometric H2O corresponding to 96.81 wt%
  MoO3, since 96.81 x (4.00 / 96.00) = 4.034 wt%). Micro-Raman spectroscopy (Horiba ARAMIS
  micro-Raman system, 532 nm solid-state laser, thermoelectrically cooled CCD detector, 2
  cm-1 resolution, 1 um spot size; Section 2.3, pp. 42-43, and Figure 7, p. 45) yielded a
  spectrum identical to that of synthetic hexagonal P63/m MoO3*xNH4*yH2O (x + y < 0.67; Lunk
  et al., 2010) and noticeably different from sidwillite, raydemarkite, virgilluethite, and
  synthetic orthorhombic MoO3*0.33H2O (Seguin et al., 1995): characteristic peaks of H2O
  between 2000 and 4000 cm-1 are not detected, tianhuixinite dehydrates to molybdite when
  laser power is increased from 2.5 mW (D1 filter) to 6 mW (0.6 filter), bands at 889, 903,
  and 689 cm-1 are attributed to Mo-O stretching vibrations, bands between 200 and 500 cm-1
  are assigned to Mo-O-Mo and O-Mo-O bending vibrations, and bands below 200 cm-1 correspond
  to rotational and translational modes of MoO6 octahedra and H2O groups as well as lattice
  vibrational modes. Crystallizes in the hexagonal system, space group P63/m (#176), as the
  natural counterpart of synthetic hexagonal P63/m (MoO3)3*H2O, with single-crystal X-ray
  diffraction unit-cell parameters (Rigaku XtaLAB Synergy D/S four-circle diffractometer,
  CuKalpha radiation, lambda = 1.54184 A, at room temperature on a 10 x 8 x 5 um aggregate;
  Section 2.4, p. 45, and Table 3, p. 47) a = 10.5963(12) A, c = 3.7216(4) A, V = 361.88(9)
  A3, Z = 2, and axial ratio c:a = 0.3512 (powder X-ray diffraction on the Rigaku XtaLAB
  Synergy D/S four-circle diffractometer with CuKalpha radiation, lambda = 1.54184 A, in
  Gandolfi mode at 50 kV and 1 mA, refined using Holland and Redfern, 1997, gave unit-cell
  parameters a = 10.5845(3) A, c = 3.7285(1) A, and V = 361.74(2) A3; Section 2.4, p. 43).
  The crystal structure was solved and refined using SHELX2019 (Section 2.4, pp. 44-45) to
  R1 = 0.061 and wR2 = 0.171 for 269 observed reflections with I > 2sigma(I) (out of 296
  independent and 2130 collected reflections, Rint = 0.07, GooF = 1.137 for 26 parameters;
  Table 3, p. 47). In the asymmetric unit (Table 5, p. 48, Table 6, p. 48, and Table 7b, p.
  50), one unique Mo site at 6h (0.89489(13), 0.35456(12), 3/4; BVS = 5.95 v.u. in Table 7b,
  p. 50, with O1 = 2.19, O2 = 1.95, and O3 = 1.80 v.u.) is coordinated in a strongly
  distorted MoO6 octahedron with two short terminal Mo=O bonds shorter than 1.72 A (Mo-O3 =
  1.690(12) A and Mo-O2 = 1.717(10) A), two intermediate bonds of ~1.96 A (Mo-O1 x 2 =
  1.966(3) A), and two long bonds longer than 2.18 A (Mo-O1 = 2.175(11) A and Mo-O2 =
  2.373(10) A; mean <Mo-O> = 1.981 A; Table 6, p. 48), forming double chains of edge-sharing
  (O1-O1) MoO6 octahedra along [001] that share O2 corners to build a three-dimensional open
  framework with hexagonal channels along [001] occupied at the channel centre by channel H2O
  molecules at the 2b site O4 (0, 0, 3/4; Uiso = 0.19(3) A2) (Sections 3.2-3.3, pp. 47-51).
  The seven strongest powder X-ray diffraction lines [dmeas in A (Imeas, Ical) (hkl);
  Abstract, p. 39, and Table 2, p. 46] are 9.174 (100.0, 100.0) (010), 4.586 (26.3, 37.3)
  (020), 3.456 (94.1, 71.7) (1-30), 3.047 (42.7, 55.6) (111), 2.539 (34.2, 36.8) (121),
  1.951 (13.8, 16.1) (041), and 1.641 (22.0, 13.4) (1-32) (Table 2 on p. 46 also highlights
  1.999 A, Imeas = 12.9, Ical = 27.8, hkl = (1-50) in bold). No biological or microbial
  interaction data are reported in the type mineralogical description.
