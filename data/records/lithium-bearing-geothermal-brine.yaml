  evidence:
  - source_ref: rehmanji2025
    supports: support
    explanation: Sections 4.1-4.2 identify the natural Cornish geothermal feed, DSM 33 preparation and flask conditions. Sections 2.1-2.2 and Figure 1 show culture-associated cation depletion with lithium retained; Figure 2 and Section 4.6 support characterization of mixed carbonate-bearing solids. The claim concerns this brine and prepared biomass under the reported conditions.
  - source_ref: rehmanji2025_si
    supports: support
    explanation: Table S1 characterizes the experimental brine, including lithium 75.2 +/- 1.8 mg/L (mean +/- SEM, n = 3); this is not a universal resource specification or an mg/kg observation. Figure S5 (pp. 21-22) compares inoculated brine with brine plus urea and no added cells. Figure S7 (p. 24), rather than the main text's misreferenced Figure S6, contains the authors' XRD assignment to calcite, vaterite and magnesite.
  - source_ref: rehmanji2025
    supports: partial
    explanation: Section 2.1 says initial 10 minutes whereas Figure 1 axes and Section 4.2 sampling schedule use hours. Published Mg/Mn removal percentages do not consistently match the plotted Figure 1 series; its B. subtilis Mn control also declines despite the text's broad no-precipitation statement. No percentage or 10-minute rate is accepted here. Lithium retention does not establish extraction into a separate product; the cow-urine experiment used synthetic CaCl2 solution, distinct from the natural-brine assay.
  - source_ref: rehmanji2025_si
    supports: partial
    explanation: The inoculated Mn/Sr trajectories in Figure S5 differ from Figure 1 and are not pooled as one replicated series. Table S9 labels retained lithium as recovery; this record treats it as aqueous retention. Table S7 reports negative magnesite saturation indices, unlike positive values stated in Section 2.2; model output is not accepted as independent confirmation of phase formation. Mixed-solid XRD identification remains an author assignment without purified phase yields.
