summary: Inyoite species identity and a single-crystal abiotic pressure transition
  are supported; source pressure-volume conflicts, unsolved high-pressure structure
  and absent recovered diffraction are correctly bounded.
limitations:
- The complete accepted Revision_1 manuscript and official linked supplements were
  inspected; the publisher version-of-record PDF was not acquired. Maximum-pressure,
  2.00-GPa volume and file 10 pressure-comment discrepancies remain unresolved.
- The high-pressure atomic structure, boron coordination change and transition reversibility
  are not established; no post-decompression Bragg reflections or isolated product
  yield is shown.
- The historical Mount Blanco specimens and the modern museum crystal are different
  material. Modern specimen collection locality and a new quantitative chemical assay
  are not reported.
- No microbial activity, ore-processing performance, boron recovery, concrete performance
  or commodity criticality is supported by this record. Notice/counterevidence and
  duplicate searches are bounded.
