id: cmmmech:lutetium
name: Lutetium
material_kind: element
description: Lutetium is the element Lu, represented here by its neutral-atom identity, distinct from dissolved Lu(III), chloride feed, host minerals and mixed rare-earth commodities. The United States designation refers to the named element in the Final 2025 List of Critical Minerals. A laboratory mixed-chloride experiment supports lutetium biosorption associated with washed Bacillus subtilis biomass; it does not establish a purified lutetium product or industrial recovery.
