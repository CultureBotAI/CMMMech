limitations:
- Microscopic natural grains have substantial Y/REE substitution. Low analytical totals
  remain uncorrected and their proposed cause was not experimentally isolated.
- The study gives a powder-cell characterization, not a single-crystal structure refinement
  or a measured density.
- Abstract/body ordinary refractive-index values differ (1.715(3) versus1.717(3));
  the owner omits numerical optics and the dossier preserves this discrepancy. No
  correction was independently established.
- No microbial mechanism, recovered-metal yield, industrial deployment or jurisdiction/list/edition
  criticality designation is established or asserted.
- Correction and dedup searches are bounded. Raw source acquisition is shared; this
  is an independent scientific reading, not independent experimental replication.
- Structural validation is not scientific proof. Native saved-review checking and
  exact-head publication/hosted checks are separate later gates.
