mechanisms:
- id: dsm9463_culture_associated_v_leaching
  name: Loading-dependent culture-associated vanadium mobilization
  process: bioleaching
  description: Living Acidithiobacillus thiooxidans DSM 9463 culture with elemental sulfur was associated with increased filtered-liquid vanadium at low catalyst loading, together with acidification and increasing sulfate. Higher-loading experiments lacked the same advantage over uninoculated controls. The evidence supports a conditional laboratory solubilization observation, without establishing direct enzymatic vanadium reduction, isolated vanadium recovery or industrial deployment.
  context: 'Mikoda et al. (2020) studied actual spent catalyst from a copper-smelter sulfuric-acid unit: approximately 10-mm granules were comminuted and sieved. Main Methods name 100- and 200-micrometre sieves, whereas supplementary Figure S1 names a 250-micrometre sieve; the fraction used for each bioleaching arm is not explicitly assigned. Table 3 reports 65.5 wt% SiO2 and 5.50 wt% V2O5 on an oxide-composition basis, not pure vanadium oxide or a universal feed composition. Culture DSM 9463 was supplied by DSMZ, pregrown in mineral medium with 1% w/v sulfur to reported pH 1.7, and added at 2% v/v. Assays used fresh mineral medium initially adjusted to pH 2.5 with sulfuric acid, 2% w/v added elemental sulfur, 28 degrees C and 100 rpm. Materials were autoclaved at 121 degrees C for 15 minutes. The paper names 50-cm3 flasks but does not clearly specify working liquid volume. Pulp densities were 1, 2, 5, 10 and 20%, with at least duplicate biotic and uninoculated batches sampled on days 1,
    7, 14, 21 and 28. Pulp-density percentages are retained as source labels rather than silently assigned an unstated basis. Liquid aliquots were filtered at 0.22 micrometres, diluted and acidified for ICP-MS total-element V analysis; the stated quantification limit was 0.001 mg/L. No pH-trajectory-matched sterile acid control was reported.'
