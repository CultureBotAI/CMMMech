  evidence:
  - source_ref: zhang2019
    supports: support
    explanation: Sections 2.1-2.3 and Figure 1b,d support the culture-associated solution-copper difference under externally controlled acidity. Figure 4d reports ferric iron; Figure 3 shows different residual phases by SR-XRD and Raman. These observations support a bounded specimen-level leaching association, not complete selective bornite conversion or a demonstrated molecular pathway.
  - source_ref: zhang2019
    supports: partial
    explanation: Section 3.1.1 calls final biotic copper extractions greater than 90%, but original Figure 1d peaks near day 12 and ends below 90% at day 14. The discrepancy and decline are unresolved; no single final yield is adopted here. The plotted biomass unit in Figure 4c also differs from the cell-per-mL statement in the discussion and is not converted into a curated biomass measurement. The absence of strong galvanic current in Figure 2 concerns separate graphite/paraffin electrodes, not a measurement of all interparticle currents in the culture. Figure 5 is an interpretive schematic, not evidence of heap deployment.
  - source_ref: zhang2019_correction
    supports: context_only
    explanation: The inspected publisher correction changes an author-name spelling. It does not reconcile the copper endpoint or biomass-unit conflicts.
- id: consortium_biofilm_associated_leaching
  name: Biofilm-associated copper mobilization in a laminar-flow assay
  process: bioleaching
  description: A Chilean ore-derived enrichment containing Leptospirillum spp. and Acidithiobacillus thiooxidans was associated with copper release and attached biofilm on a mixed bornite specimen in a laminar-flow chamber. The authors propose complementary planktonic iron oxidation and attached sulfur oxidation. FISH supports Acidithiobacillus at genus resolution in the biofilm; it does not alone establish a species-specific catalytic role. Unidentified organisms, possibly native to the specimen, also appeared in these nonsterile assays.
  context: Natural hand-picked material from the Universidad de Chile, sieved below 0.044 mm and deliberately not acid-cleaned or autoclaved. Optical mineralogy reports 74.91% bornite and 15.89% source-labelled Cc, plus other phases; QEMSCAN instead detects about 32% bornite with a large unclassified fraction. These estimates are not reconciled into a pure-mineral loading. Mineral was fixed to tape over approximately 1.5 by 1.5 cm. Flow cells recirculated 100-200 mL modified 9K medium at 30 degrees C, with reported velocity 0.02 cm/s and Reynolds number below 10; inoculation was 10^6 cells/g mineral, approximately 3:1 Leptospirillum to the source-labelled sulfur oxidizer. Methods specify 0.7 g/L Fe(II), whereas the screening schematic labels 0.5 g/L; that discrepancy is retained. Screening wells used 8 mL, 150 rpm and ferrous or ferric additions. Flow-cell conditions were triplicated; screening had three to five replicates per condition and time. Although screening methods mention uninoculated
    conditions, bornite control time courses are not separately displayed. Apparatus, volume, specimen orientation and hydrodynamics differ together; the comparison does not isolate biofilm as the sole cause of a rate change.
  microbial: true
  evidence:
  - source_ref: bobadilla2021
    supports: support
    explanation: Methods and Figures 3-5 show copper in solution, ferric-iron profiles, surface-associated material and microbial signals. The authors report about 54% of feed copper released by day 32 in the laminar assay, versus about 30% by day 48 in ferrous-fed screening wells; ferric-fed wells reached about 40% by day 10. These are source-reported feed-level values measured using atomic absorption, not bornite-specific yields or recovered metal products. Figure 3C ends at day 46 while the prose mentions day 48; day 32 is the supported comparison point retained here.
  - source_ref: bobadilla2021
    supports: partial
    explanation: FISH probes are genus-level and native organisms are unresolved. QEMSCAN relative abundances are affected by surface coverage and unclassified material, so loss of a bornite signal is not a mineral mass balance. The proposed idaite pathway, acid production and precipitation control are interpretations without a selective biofilm-removal or species-removal test. Exact solid masses, raw copper denominators and sampling mass corrections are not supplied for independent reconstruction. A laboratory flow-cell analogy to heaps establishes neither pilot nor industrial deployment.
