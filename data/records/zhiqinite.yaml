id: cmmmech:zhiqinite
name: Zhiqinite
material_kind: mineral
description: >-
  IMA-approved super-reduced titanium disilicide mineral (IMA 2019-077; status A, Approved
  2019; full description published November 2020; no mineral symbol assigned in the
  September 2026 IMA Master List, PDF p. 240, or in the type description) with ideal
  end-member formula TiSi2 (requiring Ti 46.01 wt%, Si 53.99 wt%, total 100 wt%; Xiong et
  al., 2020, European Journal of Mineralogy 32:557-574). Isostructural with synthetic
  orthorhombic C54-type TiSi2 (Laves and Wallbaum, 1939; Jeitschko, 1977) and named in
  honour of Professor Xu Zhiqin (b. 1941, Shanghai), structural geologist, graduate of
  Peking University (1964) with a PhD from the University of Montpellier (1987), former
  deputy dean of the Chinese Academy of Geological Sciences (CAGS) and director of the
  Institute of Geology, and Academician of the Chinese Academy of Sciences (1995), under
  whose leadership the Continental Dynamics Key Laboratory of the Ministry of Land and
  Resources was established and discovered a large number of deep mantle minerals (Section
  2, p. 558). Discovered together with badengzhuite (TiP, IMA 2019-076) and a mixture of
  the potentially new ternary intermetallic minerals Ti10(Si,P,[])7 (isostructural with
  Mn5Si3) and Ti11(Si,P)10 (containing up to 2 wt% V, 3 wt% Cr, 2 wt% Mn, and 2 wt% Fe in
  the two ternary phases) inside a single 20 um intermetallic melt-droplet spheroid
  enclosed in a translucent-to-transparent corundum grain (>200 um) separated from the
  Cr-11 podiform chromitite orebody, Luobusa ophiolite, Yarlung Zangbo suture zone, ~200
  km east-southeast of Lhasa, Tibet, China (inferred to have crystallized along the
  peritectic path Ti10(Si,P,[])7 -> Ti11(Si,P)10 -> TiSi2 + TiP over 2130-1330 deg C in the
  Ti-Si binary and 2100-1600 deg C in the Ti-P binary from trapped Ti-Si-P alloy melts
  formed by interaction of mantle-derived CH4 + H2 fluids with basaltic magmas in the
  shallow lithosphere at ~30-100 km depth under oxygen fugacities more than 6 log units
  below the iron-wustite buffer, partly surrounded by a halo of a dmisteinbergite-like
  mineral KCa3(Al7Si9)O32; note that Section 4.1 on pp. 560-563 and Section 6.2 on pp.
  568-569 address the controversy raised by Litasov et al., 2019a,b alleging that the
  Cr-11 corundum grains and enclosed ultra-reduced phases are anthropogenic brown fused
  alumina abrasive, concluding that mineralogical and textural differences between the
  Cr-11 inclusions and fused alumina favour a natural origin); the holotype specimen
  (catalogue number M13817, source of focused-ion-beam TEM foil no. 5358) and FIB foil no.
  5358 are deposited in the Chinese Geological Museum, Xisiyangrouhutong 15th, Xicheng
  District, Beijing, China. Occurs in foil no. 5358 as mostly tabular grains mostly 1 to 2
  um long (with tabular habit possibly resulting from flattening parallel to (110)),
  enclosing globules up to ~0.5 um across and an oval grain nearly 1 um long of
  badengzhuite (TiP), plus a possible second occurrence constituting the entirety of a 25
  x 30 um inclusion (Si/Ti ~ 2 by EDX) in another corundum grain (Section 5.1, p. 565);
  owing to the sub-micrometre to micrometre grain size, direct physical, optical, and
  experimental powder X-ray diffraction measurements could not be performed (both minerals
  are presumably opaque), and zhiqinite is compared with synthetic TiSi2, which is white
  to gray in colour with a metallic lustre (Laves and Wallbaum, 1939; Cotter et al.,
  1956), Mohs hardness 4-5 (Honigschmid, 1906), Vickers hardness VHN load 1 kPa (HV1) =
  870 +/- 15 kg/mm2, and measured density 4.07 g/cm3 (Frommeyer and Rosenkranz, 2004),
  while the density calculated from the ab initio 3D electron diffraction structure
  solution is Dcalc = 4.136 g/cm3 (compared with 3.85 g/cm3 calculated for the metastable
  8-coordinated C49 polymorph of TiSi2; Section 5.2, p. 565, and Section 5.4, p. 566).
  Standardless energy-dispersive X-ray spectroscopy (EDX, Cliff-Lorimer thin-specimen
  approximation on a Zeiss Libra 120 TEM at 120 kV with a Bruker XFlash6T-60 detector;
  Table 3, p. 564, n = 4 analyses at points 428, 429, 430, and 431 in foil no. 5358, after
  excluding Cu from the FIB foil support grid; only a few net counts of C (19-50) and O
  (8-47) were detected alongside Si (1784-2788) and Ti (1187-1839), confirming the absence
  of structural O, H2O, and CO2) yielded: Analysis 428: Si 57.69(1.40) wt% (69.92 at.%),
  Ti 42.31(1.85) wt% (30.08 at.%); Analysis 429: Si 55.21(1.36) wt% (67.75 at.%), Ti
  44.79(1.92) wt% (32.25 at.%); Analysis 430: Si 60.42(1.35) wt% (72.24 at.%), Ti
  39.58(1.71) wt% (27.76 at.%); Analysis 431: Si 57.13(1.31) wt% (69.44 at.%), Ti
  42.87(1.70) wt% (30.56 at.%); with average (n = 4) Si 57.61 wt% (SD 2.15, range
  55.21-60.42 wt%; 69.84 at.%, SD 1.85) and Ti 42.39 wt% (SD 2.15, range 39.58-44.79 wt%;
  30.16 at.%, SD 1.85), sum 100 wt% (100 at.%), corresponding on the basis of 3
  cations/atoms per formula unit to the empirical formula Ti0.905Si2.095 (Abstract, p.
  557, and Section 5.3, p. 565). Crystallizes in the orthorhombic system, space group Fddd
  (#70), with three-dimensional electron diffraction (3D ED; 1 deg beam precession via
  Nanomegas Digistar P1000, ASI Timepix single-electron camera, 150 nm beam diameter, 180
  mm camera length, 0.8 A theoretical resolution, 1 deg angular steps over a total tilt
  range of 80 deg, PETS data reduction, SIR2014 direct methods, and JANA2006 dynamical
  refinement using 65 out of 81 diffraction patterns across an estimated 30-50 nm lamella
  thickness at 0 deg tilt to final residual R(3sigma) = 0.1015 at point 428, Section 4.4,
  p. 564, and Section 5.4, p. 566) unit-cell parameters a = 8.18(16) A, b = 4.85(10) A, c
  = 8.42(17) A, V = 334(12) A3, and Z = 8 (note that the Abstract on p. 557 misstates the
  lattice type as "a primitive orthorhombic cell", whereas Section 5.4 and Figure 6 on p.
  566 confirm that space group Fddd has an F-centered orthorhombic lattice with
  characteristic chess-board extinctions and hk0: h + k = 4n d-glide conditions). In the
  crystal structure (Table 5 and Figure 7, pp. 566-567; essentially identical to C54-type
  synthetic TiSi2 of Jeitschko, 1977 and Li et al., 2013), Ti1 at (0.125, 0.125, 0.125)
  (multiplicity 8, occupancy 1, Uiso = -0.0032(16) A2) and Si1 at (0.4528(14), 0.125,
  0.125) (multiplicity 16, occupancy 1, Uiso = 0.0028(20) A2) have Ti atoms coordinated
  with 10 Si atoms at Ti-Si interatomic distances ranging from 2.51(8) to 2.80(5) A, while
  3D ED at point 429 (Figure 8) revealed (110) twin lamellae rotated around c* exchanging
  (110) and (1-10) (simulated CuKalpha powder X-ray diffraction pattern calculated from
  the 3D ED structure is reported in Supplement Table S2 and Figure S6). No biological or
  microbial interaction data are reported in the type mineralogical description.
