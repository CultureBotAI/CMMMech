      supports: partial
      explanation: Representative Acidithiobacillus thiooxidans ATCC 19377 sulfide-quinone reductase (sqr) for air-lift sulfur oxidation and biogenic sulfuric-acid/polythionate leaching of automotive wastewater-treatment sludge by Acidithiobacillus thiooxidans DSM 11478 in Yagnentkovsky et al. (2009); individual sqr/tth genes were not mutated or directly assayed.
