  description: Causal pathway linking the two multicopper oxidases MnxG (PputGB1_2447, UniProtKB:B0KQT1)
    and McoA (PputGB1_2665, UniProtKB:B0KSN7) and the animal heme peroxidase MopA (PputGB1_3353) in Pseudomonas
    putida GB-1 to oxidation of dissolved Mn(II) into birnessite-like Mn(III/IV) oxides.
  scope: RECORD_SPECIFIC_MECHANISM
  mechanism_ref: gb1_manganese_oxidation
