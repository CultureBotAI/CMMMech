mechanisms:
- id: thermovibrio_chrysotile_dissolution_test
  name: Thermovibrio dissolution assay with no demonstrated magnesium or silicon release advantage
  process: bioleaching
  microbial: true
  organisms:
  - id: NCBITaxon:228745
    label: Thermovibrio ammonificans
  description: Thermovibrio ammonificans cultures containing chrysotile showed silicon associated with
    mapped biomass, interpreted by the authors as biosilicification. The matched mineral-medium controls
    also released magnesium and silicon; the study did not establish enhanced bulk release due to the
    microorganism. This is a tested microbial interaction with a null enhancement result, not evidence
    of effective bioextraction.
  context: Choi et al. used 1 g/L prepared chrysotile, 25 mL Mg/Ca-free modified SME medium, 75 degrees
    C, pH 5.5, 2 wt% NaCl and H2/CO2 (80:20 by volume, 0.2 MPa), with about 20 mM KNO3 as terminal electron
    acceptor. One-week experiments were triplicate, with mineral-free cultures and uninoculated mineral-medium
    controls. Magnesium carried with the inoculum from the original growth medium required correction.
    The cited preparation method uses Balangero chrysotile, wet grinding in 2-propanol, sequential nylon-mesh
    filtration and autoclaving; its nominal 5-20-micrometre fraction is not a verified length interval
    for every fibre. Culture strain provenance and exact batch purity are not independently authenticated.
    Aqueous analyses used centrifuged 0.2-micrometre filtrates; electron microscopy used washed, air-dried
    solids.
  evidence:
  - source_ref: choi2023
    supports: refute
    explanation: Results, Figure 2B and Conclusions explicitly fail to demonstrate the proposed enhancement
      of magnesium and silicon release by this Thermovibrio culture under these conditions. Similar release
      occurs without cells. Figure 3D-F shows altered particle tips in both arms with retained crystallinity;
      it does not show microbial fibre destruction.
  - source_ref: choi2023
    supports: partial
    explanation: Figure 4A shows overlapping Si and biomass-associated C/N maps, compatible with the authors'
      biosilicification interpretation but not a quantified silica product, intracellular uptake or a
      cause of accelerated mineral dissolution. Text concentrations, Figure 2B bars and the described
      inoculum-magnesium correction do not transparently reconcile; Methods additionally describe negative-control
      subtraction without fully specifying its relation to displayed control series. The supplement was
      unavailable, so exact dissolved yields, rates and source-table measurements are not adopted. No
      detoxification or industrial recovery is demonstrated.
  - source_ref: vigliaturo2020
    supports: context_only
    explanation: The preparation method cited by Choi identifies the Balangero origin and processing.
      Its dimensional analysis could not reliably measure chrysotile fibre length because of curvature
      and bundling, so its aspect-ratio preservation is not assumed to be demonstrated for every chrysotile
      fibre. This methods study is not an independent bioleaching experiment.
  - source_ref: pollastri2016
    supports: context_only
    explanation: Table 2 gives the Balangero nonideal composition quoted by Choi; Table 3 records accompanying
      minerals in the characterized source sample. This supports retaining impurity and composition limits,
      without assigning these earlier sample proportions to the exact 2023 experimental batch.
