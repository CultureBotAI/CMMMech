actions: []
limitations:
- Sources use separate spent feeds, so yields are not directly comparable or combinable.
- Russo inspected PDF has early-online A-G pagination; final-page PDF was not acquired,
  although final journal metadata are known.
- Ambiguous ratio definitions, inconsistent A/O optima and unavailable bulk product
  assay prevent a definitive optimized Farhan recovery recipe.
- Source experiments remain laboratory studies; complete product/feed balances, recycling
  performance and industrial economics are not established.
- Bounded notice search cannot establish universal absence of corrections or contrary
  studies.
notes:
- No Git/GitHub changes or author contact were performed by this reviewer.
- Primary bytes were acquired by the curator, then independently read and visually
  inspected by this reviewer.
