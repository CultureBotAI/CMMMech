id: cmmmech:ytterbium
name: Ytterbium
material_kind: element
description: >-
  The element Yb, distinct from its dissolved ions, experimental chloride salt,
  phosphate phases, ores and manufactured materials. The dated US designation
  concerns the named ytterbium mineral commodity. The curated laboratory assay
  documents culture-associated aqueous depletion; it does not establish a
  particular mineral phase, purified product or industrial recovery process.
