mechanisms:
- id: air_heating_oxidation
  name: Abiotic heating-associated oxidation of natural ludlamite
  process: redox_transformation
  microbial: false
  description: >-
    Moore (1971) reports superficial oxidation and unchanged powder diffraction after
    five days at 120 or 180 degrees C in air. At 240 degrees C for five days, the product
    was reported to contain iron only in the ferric state, with diffuse powder lines
    unrelated to the initial ludlamite. The ferric assay and loss of the original
    diffraction pattern support a qualified thermal oxidation observation. They do
    not identify the product mineral, quantify a phase-pure yield or demonstrate the
    proposed structural explanation for instability.
  context: >-
    Natural crystals from the Palermo number 1 mine were heated in open capillaries
    at 120, 180 and 240 degrees C for five days, with a chromel-alumel thermocouple
    touching the crystals. Products were quenched to room temperature, dissolved in
    cold HCl and titrated against potassium dichromate; powder diffraction was compared
    with starting material. The source provides no separate quantitative composition
    for these ludlamite aliquots, sample masses, replicate counts, conversion uncertainty
    or mass balance. The stated starting-pattern comparison is not a displayed matched
    untreated time-course control. Vivianite and phosphoferrite are different-mineral
    comparisons, and no oxygen-free ludlamite arm isolates the role of atmospheric
    oxygen. This is a laboratory observation with no extraction or recovery assay.
  evidence:
  - source_ref: moore1971
    supports: support
    explanation: >-
      Page 14 directly reports the natural-crystal provenance, air/capillary procedure,
      temperatures, five-day duration, quench, HCl/dichromate analysis and distinct
      outcomes for the ludlamite arms. The lower-temperature retention of diffraction
      is preserved alongside the 240 degrees C ferric outcome. Pages 15-16 interpret
      structural instability; the hypothetical oxidized ludlamite formula is not an
      identified product. Figure 7 is a phosphoferrite-kryzhanovskite-reddingite diagram
      and does not supply a quantitative ludlamite result. The proposed hydrogen-release
      test on page 16 concerns phosphoferrite and is not a measured ludlamite pathway.
