id: cmmmech:rhodium
name: Rhodium
material_kind: element
description: Rhodium (Rh). The element is distinct from the Rh(III) chloride hydrate used as experimental feed, monometallic biomass-supported particles and mixed PdRh nanoparticles. The US 2025 list names the rhodium commodity individually; that designation is mapped to the element without extending it to every Rh-bearing compound, mineral or secondary resource. Curated evidence concerns laboratory transformation in synthetic solutions, not extraction from ore, purified-metal recovery or industrial deployment.
