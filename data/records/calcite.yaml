mechanisms:
  - id: dw018_calcite_in_terbium_assay
    name: Calcite formation in a calcium-supplemented DW018 terbium assay
    process: biomineralization
    description: Washed urease-producing Lysinibacillus sp. DW018 biomass produced calcite-assigned diffraction peaks after 2 h in a calcium- and urea-supplemented synthetic Tb(III) solution. SEM-EDS associated Ca and Tb with the cell-bearing product, but does not establish Tb substitution into the calcite lattice, a pure calcite product, or phase-specific Tb uptake. Early solution Tb depletion occurred before the resolved calcite peaks and also without added calcium. Calcite formation therefore does not establish the cause or necessity of the rapid Tb-removal response.
    context: DW018 was isolated from ionic rare-earth tailings in Gannan, China, and assigned by the authors to Lysinibacillus using 16S rRNA analysis; the genus identifier does not identify this strain or establish a species assignment. The experiment used synthetic solution rather than tailings leachate or actual wastewater. Log-phase cells were harvested at 4000 rpm, washed three times in sterile water and resuspended in sterile saline. The standard 30 mL assay had final OD600 1.0, reported 400 micromolar Tb(III), 25 mM CaCl2 and 2% urea, at 37 degrees C; the Tb salt counter-ion and percentage basis for urea are not specified. Each experiment was repeated three times. The adsorption comparator replaced both CaCl2 and urea with water; a separate calcium-dose arm included no added Ca. The final recommended no-added-Ca/0.5% urea recipe is distinct from the standard Ca-supplemented calcite experiment. No matched-pH cell-free or killed-biomass phase-control result is reported. XRD solids were
      centrifuged at 8000 rpm for 10 min, washed, pre-cooled at -20 and -80 degrees C, freeze-dried for 24 h and ground; SEM specimens additionally underwent glutaraldehyde fixation, phosphate buffer washing and ethanol dehydration. Prepared ex situ solids do not establish the unaltered in-solution amorphous precursor or Tb coordination. The supernatant fluorescence assay measured depletion after centrifugation, not a purified Tb product or an industrial recovery operation.
