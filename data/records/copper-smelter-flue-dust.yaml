mechanisms:
- id: adapted_acidophile_dust_bioleaching
  name: Mixed-acidophile leaching of acid-pretreated copper-smelter dust
  process: bioleaching
  description: An adapted, source-identified iron- and sulfur-oxidizing mesophilic consortium was associated with greater copper extraction than source-designated sterile shake flasks. The same culture was used in a two-stage aerated continuous stirred-tank experiment on acid-preleached dust. These observations support a laboratory bioleaching treatment, with chemical acid dissolution and microbial contributions not separately quantified in the continuous system. Proposed preferential oxidation of chalcocite and bornite, and chalcopyrite passivation, are interpretations rather than independently isolated mineral-specific mechanisms or individual-species effects.
  context: The feed first underwent sulfuric-acid preleaching in rolling bottles at pH 1.5 and 10% wt/vol pulp. Section 2.1 reports dissolution of 65% and 80% of the acid-soluble copper fraction after 60 and 120 minutes, respectively; these are not percentages of total feed copper. The subsequent residue contained source-reported copper sulfides and remaining acid-soluble copper. Neither preleach residue mass yield nor a closed combined chemical-and-biological copper balance is given. The mixed culture was isolated from Sarcheshmeh acid mine drainage, identified by reference to an earlier study, and adapted over two months to increasing dust loading, up to 7% wt/vol, and copper up to 20 g/L. No isolate accession, deposit or sequence verification is supplied in this article. Species identifiers resolve reported names only. Adaptation used 200 mL in 500 mL flasks, 9K medium, pH 1.8, 32 degrees C and 150 rpm; those adaptation details do not establish every condition of the separately tabulated
    control tests. The reactor experiment used two 3 L vessels, each with 2.1 L working volume, about 200 rpm stirring and air at 1 L per L per minute. Startup used 2% wt/vol preleached dust, 9K medium and 10% vol/vol adapted inoculum at pH 1.8 and 32 degrees C. Reactor 2 started on day 8; continuous feeding began around day 63. Feed loading, residence time and temperature were changed sequentially during one 180-day campaign. They were not independently replicated factorial treatments. The system required sulfuric acid and was net acid consuming; from day 114 acid was added to the feed tank. No industrial microbial operation or isolated copper product was demonstrated despite the source's use of the term pilot plant.
