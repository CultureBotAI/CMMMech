id: cmmmech:ferrotitanowodginite
name: Ferrotitanowodginite
material_kind: mineral
description: 'Anhydrous iron(II)-titanium-tantalum oxide mineral of the wodginite group with
  current September 2026 IMA-CNMNC approved formula Fe2+TiTa2O8, status A, and approval number
  IMA 1998-028. Galliski, Cerny, Marquez-Zavalia, and Chapman (1999) described the holotype
  specimen (catalog no. 8554, Museum Prof. Manuel Tellechea, IANIGLA-CRICYT-CONICET, Mendoza,
  Argentina) from the San Elias (lepidolite-subtype) granitic pegmatite and additional material
  from the nearby La Viquita (spodumene-subtype) pegmatite in the Sierra de la Estanzuela
  (32 deg 51 min S, 65 deg 06 min W), Chacabuco department, San Luis Province, Argentina,
  where it occurs in complexoxide nodules alongside microlite, ferrowodginite, wodginite,
  titanowodginite, ferrotapiolite, and ferrocolumbite. Cameca SX50 WDS electron-microprobe
  analysis of the San Elias type specimen (mean of 18 analyses, Table 3, p. 775; Fe2+/Fe3+
  partitioned by 16-cation / 32-oxygen stoichiometry) yielded Ta2O5 70.68, FeO 10.26 (printed
  10.27 in the abstract), TiO2 7.10, Nb2O5 6.52, Fe2O3 2.19 (2.18 in abstract), SnO2 1.25,
  MnO 1.05, PbO 0.05, As2O3 0.03, Bi2O3 0.03, WO3 0.02, UO2 0.02, Sb2O3 0.02, ThO2 0.01, MgO
  0.01, CaO 0.01, total 99.25 wt%, corresponding on the basis of 8 O atoms to the empirical
  formula (Fe2+0.869Mn2+0.088[]0.039Mg0.001Ca0.001Sb3+0.001Pb2+0.001)Sigma1.000(Ti4+0.540Ta0.244Fe3+0.166Sn4+0.050)Sigma1.000(Ta1.702Nb0.297)Sigma1.999O8
  (La Viquita mean of 13 analyses: Ta2O5 65.50, FeO 10.74, TiO2 7.21, Nb2O5 8.48, Fe2O3 3.21,
  SnO2 2.41, MnO 1.62, total 99.32 wt%). Philips 1710 powder X-ray diffraction (Table 4, p.
  776) refined in monoclinic space group C2/c (Z = 4) gave a = 9.403(4), b = 11.384(3), c
  = 5.075(1) A, beta = 90.55(2) degrees, V = 543.24(22) A3, and Dcalc = 7.368 g/cm3 for San
  Elias (and a = 9.431(2), b = 11.419(3), c = 5.089(1) A, beta = 90.42(2) degrees, V = 548.10(16)
  A3, Dcalc = 7.147 g/cm3 for La Viquita; Mohs hardness 5.5). Distinct from titanowodginite
  (Mn2+TiTa2O8), ferrowodginite (Fe2+Sn4+Ta2O8), wodginite (Mn2+Sn4+Ta2O8), and elemental
  tantalum, niobium, titanium, or tin; no criticality designation, microbial mechanism, or
  industrial recovery yield is asserted.'
