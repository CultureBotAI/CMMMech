assessments:
- assessment_id: identity
  area: identity
  topic: Species versus experimental concentrate
  outcome: supported
  summary: The species and experimental feed boundary are correctly scoped.
  details: IMA Fe2+Ti4+O3, G,1827 matches. The three placer concentrates are mixed
    ilmenite-like samples, not pure stoichiometric crystals. The separate xenotime
    resource does not duplicate the mineral identity. No jurisdiction/list/edition
    criticality claim or organism identifier is asserted.
  target_ids:
  - cmmmech:ilmenite
  evidence_ids:
  - owner
  - ima
  - primary
  - dedup
- assessment_id: protocol
  area: consistency
  topic: Actual acid-dissolution methods
  outcome: supported
  summary: Selected conditions and analytical fraction agree with original methods.
  details: Section 2.1 describes 35 g grinding batches for 2 min, not digestion charge.
    Section 2.3 gives 38 wt% HCl, approximately 84 °C, 1.5 L flask with reflux/glass-paddle
    stirring, 40 °C acid preheat and 6.12 mol HCl per calculated equivalent FeTiO3.
    Working volume, actual digestion charge, stirrer speed and independent replicates
    are unspecified. Filtered liquor is Al-reduced then cerium-sulfate titrated; no
    microorganism or biomass is involved.
  target_ids:
  - cmmmech:ilmenite
  evidence_ids:
  - owner
  - primary
- assessment_id: outcomes
  area: evidence
  topic: Measured solubilization versus fitted kinetics
  outcome: supported
  summary: Time-dependent solution mobilization and fitted ordering are supported
    without recovery inflation.
  details: Original Figure 3 and Equation 2 show Ti/Fe dissolution trajectories and
    shrinking-sphere fits; BT>TIS>TVP fitted Ti ordering matches. No isolated titanium
    product mass is measured here. No declining dissolved Ti is the authors’ interpretation
    of no hydrolysis, not independent solid-phase proof of zero secondary Ti.
  target_ids:
  - cmmmech:ilmenite
  evidence_ids:
  - owner
  - primary
- assessment_id: causality
  area: evidence
  topic: Mixed-feed association and uncertainty
  outcome: supported
  summary: The owner retains the controls and uncertainty needed to avoid a universal
    causal claim.
  details: Table 1 composition derives from suppliers/earlier BT work, and Figure
    2 shows different inclusions. Iron oxidation co-varies with feed identity; no
    matched-valence manipulation isolates causality. TIS centroid depends on fit constraints
    and is unreliable; kinetic uncertainty is termed SE in 2.4 and SD in 3.3. Exact
    numerical fit precision is not adopted. Molecular reason remains unresolved and
    no hard-rock source was tested.
  target_ids:
  - cmmmech:ilmenite
  evidence_ids:
  - owner
  - primary
- assessment_id: deployment
  area: scope
  topic: Laboratory evidence and deferred microbial leads
  outcome: supported
  summary: Industrial origin and pre-commercialization prose are not transferred into
    tested industrial recovery.
  details: Only the complete 2025 abiotic study supports this accepted mechanism.
    Other microbial and processing leads remain source follow-ups; this reviewer does
    not validate inaccessible methods or add microbial claims. Source methods supplier
    names are the owner context; acknowledgments name different suppliers without
    mapping lots, which remains a provenance limit rather than a demonstrated owner
    error.
  target_ids:
  - cmmmech:ilmenite
  evidence_ids:
  - owner
  - primary
