id: cmmmech:brochantite
name: Brochantite
material_kind: mineral
description: Brochantite is the monoclinic copper hydroxysulfate mineral Cu4(SO4)(OH)6. It is distinct from elemental copper, other copper minerals and mixed corrosion patinas. The laboratory mineral experiment below used a synthetic preparation. No criticality designation is inherited from copper.
