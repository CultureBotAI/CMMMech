id: cmmmech:praseodymium
name: Praseodymium
material_kind: element
description: The element Pr, distinct from dissolved Pr(III), its salts and oxides, Pr-containing magnet
  alloys and ore or waste resources. The US2025 designation applies to the named praseodymium mineral
  commodity. Evidence below concerns cell-free protein chromatography of a synthetic binary solution,
  not microbial growth on an ore or industrial recovery.
