id: cmmmech:chukanovite
name: Chukanovite
material_kind: mineral
description: Chukanovite is the iron(II) hydroxide-carbonate mineral species Fe2(CO3)(OH)2, approved as IMA 2005-039 in the September 2026 IMA-CNMNC list. It is distinct from siderite, mixed-valence green rusts, elemental iron and mixed culture products. The curated experiments concern source-assigned laboratory precipitates, not a pure recovered commodity or an industrial process. No constituent iron criticality designation is inherited.
