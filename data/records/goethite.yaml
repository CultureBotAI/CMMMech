mechanisms:
- id: sulfur_oxidizer_goethite_mobilization
  name: Culture-associated iron mobilization from natural goethite during sulfur oxidation
  process: bioleaching
  description: Separate living Acidithiobacillus thiooxidans DSM 14887 and Acidithiobacillus caldus DSM 8584 cultures increased filtered iron concentrations from a natural goethite feed while acidifying sulfur-containing medium. These laboratory observations support culture-associated mobilization. They do not isolate direct microbial reduction of solid goethite from acid dissolution or chemical reduction by sulfur intermediates.
  context: Series 1 used BGR sample S343 from the Wolf mine, Herdorf, Germany, ground to a fine powder in a mortar. XRD with Rietveld refinement identified goethite as the mineral phase; the source calls it pure goethite, but Table 1 reports 85% Fe2O3 and 2% SiO2 by XRF, so chemical purity is not assumed. The cultures were precultivated for 10 days in HBS-TE medium at initial pH 3 with 1 g/L elemental sulfur and inoculated at 10% v/v into separate flasks containing 0.5% w/v S343 and 1 g/L sulfur. The aerobic five-week experiment used 30 degrees C and 120 rpm for A. thiooxidans and 45 degrees C shake-flask cultivation for A. caldus. Figure 1 shows starting pH near 3 in the dissolution assays. Three inoculated flasks were used per species; Methods 2.3 specifies duplicate uninoculated controls at each temperature, whereas Figure 1 caption describes three parallel assays each. Ferrozine analysis of 0.2 micrometre-filtered liquid measured Fe(II) and Fe(III). These are operationally filtered iron
    concentrations, not an isolated metal product or a whole-feed recovery yield. Species taxonomy identifiers do not independently identify the experimental DSM strains.
