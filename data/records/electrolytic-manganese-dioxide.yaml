id: cmmmech:electrolytic-manganese-dioxide
name: Electrolytic manganese dioxide commodity
material_kind: commodity
description: Manufactured manganese dioxide products obtained by electrolysis. Tosoh identifies
  uses as positive-electrode material in alkaline primary batteries and as feed for lithium-manganate
  cathode materials, with application-specific representative product properties. USGS separately
  reports chemically and electrolytically produced synthetic manganese dioxide, supporting
  the process distinction. This commodity is distinct from manganese metal, the manganese
  element, natural manganese-dioxide ore or a particular mineral species, spent battery material,
  and a finished electrode. The manufacturer reports active oxygen expressed as manganese
  dioxide in one product table; this does not establish a universal crystalline-phase purity
  or grade threshold. The product family does not itself resolve the broader battery-grade
  manganese designation. No inherited criticality designation, unique crystal phase, or microbial
  production of qualified electrolytic manganese dioxide is asserted.
