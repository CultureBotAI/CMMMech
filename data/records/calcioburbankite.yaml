mechanisms:
- id: abiotic_brine_melt_crystallization
  name: Abiotic crystallization of an author-assigned calcioburbankite phase
  process: other
  microbial: false
  description: >-
    In run 8, a charge containing natural bastnaesite, Na2CO3, water and calcite became
    homogeneous at 690 degrees C and an estimated 9.5 kbar. On cooling, the authors observed
    calcite at 660 degrees C, followed by needle-like crystals assigned to calcioburbankite
    at 635 degrees C (Figure 4 panel p8, 8.0 kbar). This is a laboratory crystallization
    observation in a mixed mineral assemblage, not an extraction or isolated-product yield.
  context: >-
    A gold-lined rhenium gasket in a hydrothermal diamond-anvil cell held the charge;
    the natural bastnaesite was from Maoniuping, Sichuan. Mineralization runs were heated
    at 10 degrees C/min and cooled at 5–10 degrees C/min. Run-8 pressures were estimated
    using the calcite Raman peak at 1086 inverse centimetres. Exact run-wise starting
    masses, water volume, replicate counts and final quantitative phase fractions were
    not reported. Run-8 REE concentration was explicitly not determined because carbonate
    contributions from carbocernaite and nyerereite could not be separated. Post-run samples
    were washed with two to three drops of deionized water to remove Na2CO3 hydrates and
    other soluble surface salts, then examined by SEM-EDS; the washed assemblage is not a
    complete product inventory. Representative EDS counts and Raman spectra support the
    authors' phase assignment without establishing a quantitative Ca/REE composition,
    a refined crystal structure or product purity.
  evidence:
  - source_ref: yuan2024
    supports: support
    explanation: >-
      Main Table 1, results pp.4–5, Figure 4 p.6 and methods pp.11–12 support the narrowly
      stated run-8 formation observation. Figure 4 joins cooling photomicrographs to a
      post-run BSE image and representative EDS and Raman spectra assigned to
      calcioburbankite, nyerereite and fluorite. Its EDS ordinate is counts, not a quantitative
      composition assay. Table 1 retains dashes for the run-8 Na2O, REE and REE/Na results;
      measured or inferred solubilities from runs 1–7 are not transferred to this run.
  - source_ref: yuan2024
    supports: context_only
    explanation: >-
      Supplementary Text p.2 and Figure S2 p.9 describe a separate lower-pressure,
      melt–fluid immiscibility experiment with bastnaesite, Na2CO3, water and calcite.
      The run-S2 panel labels show 675 degrees C/3.8 kbar before cooling and
      calcioburbankite-labelled crystals at 620 degrees C/3.3 kbar. Its post-run BSE/EDS
      assemblage contains author-assigned calcioburbankite, nyerereite and villiaumite;
      Figure S2 contains no Raman panel. S2 is not treated as a run-8 replicate or as a
      quantitative recovery balance. The paper's wider geological interpretations are
      not industrial-process or microbial evidence.
