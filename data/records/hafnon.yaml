id: cmmmech:hafnon
name: Hafnon
material_kind: mineral
description: >-
  Hafnon is the hafnium silicate mineral species with ideal formula HfSiO4,
  approved as IMA 1974-018. It is distinct from zircon, elemental hafnium
  and synthetic hafnium-silicate products. The Handbook of Mineralogy
  describes the species as tetragonal but explicitly identifies its cell
  parameters, calculated density and powder pattern as synthetic data;
  those values are not measurements of a natural Brazilian specimen.
  Pereira, Ávila and Neumann (2004), in their study of cassiterite from
  eight concentrate samples in the São João del Rei Pegmatite Province,
  report zirconian hafnon as an inclusion in cassiterite from a pan
  concentrate collected in a stream crossing body E of the Volta Grande
  mine, Minas Gerais, Brazil. Table 2 assigns that occurrence to this
  sample, rather than to every surveyed locality. The study uses
  backscattered-electron imaging and semiquantitative SEM-EDS, and its
  hafnon discussion explicitly cites the overlapping 2002/2003 work.
  This is a qualified source-reported natural occurrence, not a new
  independent replication of the older microanalyses or a pure-phase
  diffraction refinement. Its geological formation interpretation is
  not a controlled transformation experiment. No occurrence-wide grade,
  extraction, microbial mechanism, industrial deployment or inherited
  hafnium criticality designation is assigned.
