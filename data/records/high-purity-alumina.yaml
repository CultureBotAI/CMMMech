id: cmmmech:high-purity-alumina
name: High-purity alumina
material_kind: commodity
description: >-
  Refined aluminium oxide product distinguished by its high purity. Geoscience
  Australia describes HPA as a white crystalline Al2O3 powder characterized by
  purity levels such as 99.99% Al2O3, with uses in lithium-ion batteries,
  electronics and optics. This grade-defined commodity is narrower than broad
  alumina and is distinct from aluminium metal, kaolin feedstock, bauxite and
  aluminium hydroxide. Its Australian designation specifically names high-purity
  alumina; it is not transferred to every aluminium-bearing feed or product.
  No microbial production or purification mechanism is asserted here.
