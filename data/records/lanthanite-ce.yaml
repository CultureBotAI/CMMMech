id: cmmmech:lanthanite-ce
name: Lanthanite-(Ce)
material_kind: mineral
description: >-
  Lanthanite-(Ce) is the cerium-dominant lanthanite mineral, approved
  as IMA 1983-055, with ideal formula Ce2(CO3)3(H2O)6·2H2O,
  equivalently Ce2(CO3)3·8H2O. It is distinct from elemental cerium,
  cerianite, the lanthanite group and rare-earth ores or commodities.
  Bevins et al. (1985) characterized natural plates from oxidized
  copper ore at Britannia Mine, North Wales. Their measured mixed-REE
  composition gave the empirical cation terms Ce0.78La0.55Nd0.55Sm0.09Gd0.05Y0.04
  on the reported 17-oxygen basis, with 7.96H2O; it is not a pure
  Ce end-member or an ore-grade measurement. Water was determined
  thermogravimetrically, carbon dioxide by CHN analysis and rare-earth
  composition by electron microprobe; sample deterioration limited
  analytical totals. Diffraction indicated orthorhombic Pbnb, a
  nonstandard setting of Pccn. Atencio et al. (1989) also found
  their historically labelled Bastnäs lanthanite specimen to be
  Ce-dominant. The mechanism below concerns separately synthesized
  Ce carbonate phases and does not establish microbial weathering
  of these natural specimens, industrial recovery or a dated
  criticality designation.
