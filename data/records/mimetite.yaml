mechanisms:
- id: niger_associated_mimetite_transformation
  name: Fungal transformation of natural mimetite with lead oxalate precipitation
  process: bioleaching
  description: Laboratory cultures of Aspergillus niger ATCC 201373 grown above mimetite-containing agar produced crystals identified as lead oxalate by powder X-ray diffraction and elemental microanalysis. Mobilization followed by oxalate precipitation is the proposed interpretation of the solid-phase transformation; a dissolved-lead time course and a unique metabolic cause were not demonstrated. This observation does not establish a metal recovery yield, complete feed conversion, arsenic detoxification or industrial use.
  context: The natural yellow specimen came from Ojuela mine, Mapimi, Durango, Mexico. Powder between 100 and 150 micrometres was oven-dried at 105 degrees C for 48 hours and added at 0.2% (w/v) to autoclaved Czapek-Dox agar at approximately 50 degrees C before pouring. Experiments used 25 mL agar in 90 mm dishes, sterile 84 mm cellophane membranes and 5 mm mycelial discs from actively growing margins of seven-day cultures. Tests were conducted at least in triplicate at 25 degrees C in the dark; the analyzed endpoint was 12 days. The membrane separated mycelium from agar while allowing nutrient and metabolite passage. The medium contained glucose, nitrate, phosphate and mineral salts, and was adjusted to pH 5.5 before autoclaving; Table 2 gives different uninoculated surface pH values after preparation. Uninoculated mineral-containing medium and mineral-free fungal growth were controls. The species identifier does not itself identify ATCC 201373 at strain level.
  microbial: true
  organisms:
  - id: NCBITaxon:5061
    label: Aspergillus niger
  protein_examples:
  - uniprot_accession: UniProtKB:A0A254TZW7
    entry_name: CEXA_ASPNG
    protein_name: Citrate exporter A
    gene_symbol: cexA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:5061
      label: Aspergillus niger
    interpro_ids:
    - InterPro:IPR011701
    - InterPro:IPR020846
    - InterPro:IPR036259
    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA that secretes intracellularly synthesized citric acid into the extracellular medium, driving organic-acid acidification and metal chelation.
    annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:A0A254TZW7 (CEXA_ASPNG) for Aspergillus niger (NCBITaxon:5061).
    evidence:
    - source_ref: ceci2015
      supports: partial
      explanation: Representative Aspergillus niger citrate exporter CexA for organic-acid excretion during ATCC 201373 bioweathering of natural Mapimi mimetite in Ceci et al. (2015); cexA was not directly assayed.
  evidence:
  - source_ref: ceci2015
    supports: support
    explanation: 'Results, growth on natural mimetite, and Figure 1A-H: control crystals showed mimetite morphology and the feed diffraction matched mimetite, whereas crystals recovered below growing colonies had a diffraction pattern assigned to PbC2O4 using ICDD PDF-14-803. The product''s EDXA spectrum showed Pb, C and O without the As and Cl peaks seen in feed crystals. Figure 1 presents typical observations from several determinations, reported as similar. This supports phase transformation and precipitation, not a quantified whole-feed elemental balance or proof that arsenic disappeared from the complete culture.'
  - source_ref: ceci2015
    supports: partial
    explanation: Methods call the starting specimen pure, but Table 1 reports XRF oxide-equivalent impurities including 6.40% Al2O3 by mass and a reported total of 96.07%, averaged over two determinations. Results identify mimetite as the main XRD component and qualify nondetection of other minerals by detection limits. Table 1's As2O3 reporting convention does not establish arsenic oxidation state. The Methods formula omits the arsenate subscript 3; the record identity follows IMA and the paper's complete formula elsewhere, without adopting the defective expression.
  - source_ref: ceci2015
    supports: partial
    explanation: Crystal purification used water at 80 degrees C followed by vacuum-desiccator drying; diffraction characterizes the recovered preparation. No quantitative mineral phase fraction, isolated product yield, Pb or As mass balance, or measured arsenic fate is reported. No acid-matched, killed-biomass or cell-free-metabolite series separates the proposed causes. Table 2 supports growth-associated acidification, not an exclusive oxalate mechanism; its errors are described as relative standard deviations from more than six measurements across plates, not identified as independent biological replicates.
  - source_ref: ceci2015
    supports: partial
    explanation: 'Results, growth and toxicity assessment: the reported biomass tolerance index of 97% compares treated and control mycelial dry weights and is not a mineral extraction percentage. The authors report no significant growth or dry-weight difference at this loading. Methods name one-way ANOVA on means, while Results name Kruskal-Wallis analysis on ranks and Dunn comparisons; the procedural distinction is unresolved, and extension data are not shown.'
  - source_ref: ceci2015
    supports: context_only
    explanation: Geochemical-model methods, Figure 2 and Figure 3 support an explanatory model rather than additional microbial assays. The 25 mM oxalic-acid input refers to preliminary measurements whose results are not shown. Model activities have inconsistent M versus mM reporting between the figure caption and discussion; Figure 2D depicts calcium phases although its caption names lead oxalate. No modeled fraction, stability boundary, arsenic redox pathway or transformation of another mineral is imported as a measured mimetite-culture outcome.
