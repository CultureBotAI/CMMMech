id: cmmmech:chlorapatite
name: Chlorapatite
material_kind: mineral
description: Chlorapatite is the chlorine-dominant apatite mineral species Ca5(PO4)3Cl, distinct from hydroxylapatite, fluorapatite, pyromorphite, generic apatite and mixed phosphate-rock resources. The September 2026 IMA list marks it renamed with 2010 s.p.; this special-procedure notation is not a new-mineral accession. The accepted experiment used a characterized synthetic analogue as a bacterial nutrient-source comparison. Its findings are not inherited from the pyromorphite dissolution arm or from elemental phosphorus criticality.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Definitions pp 1-2 and Chlorapatite row p43, Rn, 2010 s.p. Official list reopened and retained original row visually inspected 14 October 2026.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: chlorapatite_handbook
  title: Handbook of Mineralogy. Chlorapatite. Complete one-page identity entry; Cl-dominant species and polymorph context, not an exact symmetry assignment to the experimental powder.
  url: https://www.handbookofmineralogy.org/pdfs/chlorapatite.pdf
  accessed_on: '2026-10-14'
- id: topolska_2014
  title: Topolska, Justyna; Latowski, Dariusz; Kaschabek, Stefan; Manecki, Maciej; Merkel, Broder; Rakovan, John (2014; online 20 July 2013). Pb remobilization by bacterially mediated dissolution of pyromorphite Pb5(PO4)3Cl in presence of phosphate-solubilizing Pseudomonas putida. Environmental Science and Pollution Research 21:1079-1089. DOI 10.1007/s11356-013-1968-3; PMC3880484. Complete 11-page retained original re-read with chlorapatite comparisons in Tables 1-3 and Figures 1-2 independently inspected. Same study also represented under lead and pyromorphite.
  url: https://doi.org/10.1007/s11356-013-1968-3
  accessed_on: '2026-10-14'
- id: ncbi_putida
  title: NCBI Taxonomy 303, Pseudomonas putida, species. Official XML rechecked 14 October 2026. Species identity does not independently verify strain IBPRS KKP 1136.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=303
  accessed_on: '2026-10-14'
- id: uniprot_pseudomonas_putida_phosphate_starvation
  title: 'UniProtKB reference proteome UP000000556 (Pseudomonas putida KT2440, NCBITaxon:160488): Phosphate-binding protein PstS (pstS / PP_2656, UniProtKB:Q88JJ3), Phosphate import ATP-binding protein PstB 1 (pstB1 / PP_2659, UniProtKB:Q88JJ0), and Phosphate regulon transcriptional regulatory protein PhoB (phoB / PP_5320, UniProtKB:Q88C63).'
  url: https://www.uniprot.org/uniprotkb?query=(proteome:UP000000556)+AND+(accession:Q88JJ3+OR+accession:Q88JJ0+OR+accession:Q88C63)
  accessed_on: '2026-11-10'
mechanisms:
- id: putida_chlorapatite_nutrient_access
  name: Bacterial growth with chlorapatite as the added phosphate source
  process: other
  description: Pseudomonas putida cultures showed limited growth in phosphate-deficient medium containing synthetic chlorapatite. The observation supports nutrient accessibility in the tested system; it does not quantify bacterial enhancement of chlorapatite dissolution or demonstrate phosphorus recovery.
  context: Topolska et al. synthesized the source-assigned chlorapatite by heating 0.5 g commercial synthetic hydroxylapatite with 0.5 g CaCl2 at 950 degrees C for 12 h. Table 1 diffraction spacings and Figure 1b SEM-EDS support the assigned phase; the reported particle range was 10-80 micrometres. The paper reports pure chlorapatite, but gives neither a quantitative minor-phase detection limit nor a complete chlorapatite wet-chemical analysis; the separately measured Pb5.09(PO4)2.96Cl formula is for pyromorphite only. Portions of 0.05 g were heated at 180 degrees C for 3 h before use; unchanged XRD/SEM-EDS after heating is asserted as data not shown. Experiments used 100 mL medium in 500 mL flasks, triplicates, 21 +/- 1 degrees C, 100 rpm and 305 h. MP+ contained 0.5 g/L K2HPO4, 5 g/L disodium succinate, 6.5 g/L glycerol, salts and source-reported 30 mM FeEDTA; MP- omitted K2HPO4. Initial pH was adjusted to approximately 7.3. The unusual FeEDTA specification is retained as reported, not
    silently corrected. E.I control 2 used source-named P. putida IBPRS KKP 1136, earlier identified by numerical taxonomy. Cells were grown to OD600 0.8, centrifuged, resuspended in the experimental solution and inoculated 1:100. Optical density was measured at 600 nm with settled mineral particles; source controls included no-mineral cultures and pyromorphite-containing cultures in MP+ and MP-. No killed-cell arm or direct phosphorus tracer was reported.
