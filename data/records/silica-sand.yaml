  evidence:
  - source_ref: yahaya2012
    supports: support
    explanation: Chapter 2 sections 2.2.2, 2.4.3-2.4.5 and 2.5.7, printed pages 31-40 (PDF pages 50-59), establish the separate feeds, cell preparation and extraction assay. Chapter 5 cell-density comparison, printed pages 110-111 (PDF pages 129-130; Figure 5.2), shows greater extractable Fe(II) with 7 mL than with 3.5 mL CIP8040 suspension and a lower, nonzero blank. The text reports day-one concentrations of 0.24 and 0.12 mmol/L respectively. These are assay concentrations, not rates or percentages recovered. The differing inoculum volumes and incompletely specified blank composition limit a unique causal interpretation.
  - source_ref: yahaya2012
    supports: partial
    explanation: Chapter 5 printed pages 111-115 (PDF pages 130-134), AQDS-presence comparison Figure 5.3 and the AQDS/NOM/no-shuttle comparison Figure 5.5, show little early AQDS benefit and only modest later differences in Silica 3. The Figure 5.3 text reports 0.224 mmol/L with AQDS and 0.186 mmol/L without it after 15 days. This does not support a universal requirement for, or large enhancement by, the added shuttle. Figure 5.4 is excluded from a feed-specific quantitative inference because its surrounding discussion concerns Silica 3 while its caption says Silica Sand 2. Proposed direct contact, pore accessibility and cell-surface inhibition were not independently established by these comparisons.
  - source_ref: yahaya2012
    supports: partial
    explanation: Chapter 5 printed pages 109-110 (PDF pages 128-129), strain-screen Figure 5.1, instead concerns 2.5 g Oakamoor Silica 2 with 10 mM lactate and 100 micromolar AQDS at a caption-specified 20 degrees C. Its four displayed curves include a much lower response for source-designated S. loihica than for the other tested cultures. This separate screen cannot establish identical behavior across strains or be transferred quantitatively to the Grandcourt 30-degree-C experiment. The generic culture list is not used to invent an additional tested silica strain.
  - source_ref: yahaya2012
    supports: partial
    explanation: Chapter 5 printed pages 121-126 (PDF pages 140-145), Figures 5.10-5.15 and Tables 5.1-5.2, constrain the mineralogical interpretation. Before/ after XRD of Silica 3 did not show an obvious new crystalline product; FTIR changes also occurred in the blank. Local EDX lists Fe in the blank but not the biotreated table, without a detection limit or bulk recovery balance. This is not complete iron removal. SEM images show surface differences but do not identify a uniquely dissolved iron phase. The displayed Mossbauer spectrum is of untreated Silica 3 only, not a measured before/after oxidation-state conversion. None of these observations establishes purified silica quality or a specific genetic mechanism. The deposited document's editorial uncertainties further warrant preserving these narrow interpretations.
