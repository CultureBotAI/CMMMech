id: cmmmech:birnessite
name: Birnessite
material_kind: mineral
description: >-
  Birnessite is a layered manganese oxide mineral, listed as grandfathered
  in the September 2026 IMA-CNMNC list with formula
  (Na,Ca,K)0.6(Mn4+,Mn3+)2O4(H2O)1.5. Its composition and polytype vary.
  It is distinct from elemental manganese, mixed manganese ore and nodules,
  the buserite precursor used to prepare some synthetic analogues, and
  manganese oxalate products. The mechanism below concerns a source-named
  synthetic sodium form, not a natural ore or every birnessite polytype.
  No criticality designation is inherited from manganese.
