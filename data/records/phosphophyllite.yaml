  url: https://msaweb.org/MSA/AmMin/Supplemental_Data/Vol%2062%20p0812%20AM-77-046.pdf
  accessed_on: '2026-10-15'
- id: dunn_norberg1977
  title: >-
    Dunn PJ and Norberg J (1977). Phosphophyllite, variation in
    composition. American Mineralogist 62:818. Complete one-page
    original; fourteen partial electron-microprobe analyses of
    eleven Hagendorf and three Potosi specimens, with water determined
    on one Potosi sample by the Penfield method. The 51:49 Mn:Fe
    value is a weight ratio, not a site-occupancy measurement.
    Individual analyses were available from the authors on request
    and were not included in the published note or acquired here.
  url: https://msaweb.org/AmMin/AM62/AM62_818.pdf
  accessed_on: '2026-10-15'
