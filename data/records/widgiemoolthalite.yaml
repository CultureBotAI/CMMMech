id: cmmmech:widgiemoolthalite
name: Widgiemoolthalite
material_kind: mineral
description: >-
  Widgiemoolthalite (IMA 1992-006) is an IMA-accepted hydrated nickel
  hydroxy-carbonate mineral, the nickel analogue of hydromagnesite, with IMA
  September 2026 Master List formula Ni5(CO3)4(OH)2·4-5H2O and empirical
  formula (Ni4.62Mg0.38)(CO3)4.15(OH)1.70·5.12H2O. Described by Nickel,
  Robinson, and Mumme (1993) from the weathered zone of a nickel sulfide body
  at the 132 North nickel mine, 4 km southwest of Widgiemooltha, Western
  Australia, Australia (holotype Western Australian Museum M.1.1993), where it
  occurs as bluish-green fibrous crusts and spherulites lining cavities in
  weathered gaspeite along with kambaldaite, hellyerite, takovite, retgersite,
  and nickeloan paratacamite. Monoclinic (space group P21/c), with a =
  10.06(17) Å, b = 8.75(5) Å, c = 8.32(4) Å, beta = 114.3(8)°, Z = 2, SGmeas =
  3.13(1), Dcalc = 3.24 g/cm3, and biaxial (+) optics with nmin = 1.630(5) and
  nmax = 1.640(5).
