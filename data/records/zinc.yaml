mechanisms:
- id: ferrooxidans_sphalerite_dissolution
  name: Conditional enhancement of sphalerite-concentrate dissolution
  process: bioleaching
  description: Living Thiobacillus ferrooxidans FC1, using the paper's historical name, increased zinc dissolution relative to matched chemical controls at elevated ferrous concentrations after an initial period without an advantage. Surface analyses and kinetic modeling support sulfur-layer removal as the explanation; they do not establish a specific enzyme or direct biological oxidation of the ZnS lattice.
  context: Gamsberg concentrate, reported as 98% sphalerite by XRD and 53.3% Zn, was milled to 45-53 micrometres and washed with 0.5 M sodium sulfide. The aerated, stirred laboratory electrolysis cell had a 2 L working volume, 5 g concentrate/L, 10% v/v inoculum, pH 1.6, 35 degrees C and dissolved oxygen 5.9 mg/L. Redox control maintained dissolved iron conditions; 1999 experiments held Fe(III) at 1 g/L while varying Fe(II). Zinc was assayed in 0.45-micrometre filtrate by atomic spectrophotometry. This is dissolution, not isolated zinc-product recovery or deployment. Analytical repeatability replicates do not establish biological replication. NCBITaxon:920 maps the published species name, not a verified strain accession or modern genomic reassignment of FC1.
  microbial: true
  organisms:
  - id: NCBITaxon:920
    label: Acidithiobacillus ferrooxidans
  protein_examples:
  - uniprot_accession: UniProtKB:B7JBP8
    entry_name: SQRD_ACIF2
