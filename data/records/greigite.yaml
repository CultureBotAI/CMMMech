id: cmmmech:greigite
name: Greigite
material_kind: mineral
description: Greigite is the mixed-valence iron sulfide mineral Fe2+Fe3+2S4, conventionally written Fe3S4, approved as IMA 1963-007 in the September 2026 IMA list. It is distinct from elemental iron, mackinawite, pyrite, magnetite, and an undifferentiated iron-sulfide precipitate. The observations below concern extracellular greigite formed in mixed laboratory mineral assemblages, not extracted natural ore or a purified recovered product. No criticality status is inferred from a constituent element.
