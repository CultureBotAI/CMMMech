id: cmmmech:hawleyite
name: Hawleyite
material_kind: mineral
description: Hawleyite is the cubic CdS mineral species, distinct from hexagonal greenockite, unspecified cadmium-sulfide nanoparticles, elemental cadmium and secondary wastes. The September 2026 IMA-CNMNC list gives grandfathered status and original-description year 1955; that year is not a unique approval accession. Curated microbial evidence concerns synthetic hawleyite-assigned particles and mixed CdS from a defined X513 experiment. Mineral identity does not make every Cd-S precipitate hawleyite. No constituent criticality designation is inherited.
sources:
  - id: ima_2026_09
    title: 'IMA-CNMNC (September 2026). The New IMA List of Minerals. Definitions p.1; Hawleyite row p.90: CdS, G (grandfathered), original-description year 1955.'
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-14'
  - id: handbook
    title: Handbook of Mineralogy. Hawleyite. Mineral Data Publishing version 1 (2001–2005); complete one-page identity/structure entry. Historical secondary context, not microbial evidence.
    url: https://www.handbookofmineralogy.org/pdfs/hawleyite.pdf
    accessed_on: '2026-10-14'
  - id: handbook_greenockite
    title: Handbook of Mineralogy. Greenockite. Mineral Data Publishing version 1 (2001–2005), Cell Data; secondary structural context for checking Moon2013 lattice labels.
    url: https://www.handbookofmineralogy.org/pdfs/greenockite.pdf
    accessed_on: '2026-10-14'
  - id: moon2013
    title: Moon, J.-W. et al. (2013). Scalable economic extracellular synthesis of CdS nanostructured particles by a non-pathogenic thermophile. Journal of Industrial Microbiology and Biotechnology 40(11):1263–1271. DOI 10.1007/s10295-013-1321-3. Complete publisher HTML, Materials and methods, Results, Figures 1–6 and Table 1.
    url: https://doi.org/10.1007/s10295-013-1321-3
    accessed_on: '2026-10-14'
  - id: taxonomy_x513
    title: NCBI Taxonomy 573062 — Thermoanaerobacter sp. X513; species-rank X513-labelled entry. Thermoanaerobacter ethanolicus X513 is listed as a misspelling.
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=573062&mode=Info
    accessed_on: '2026-10-14'
  - id: uniprot_thermoanaerobacter_cysteine_sulfur
    title: 'UniProtKB reference proteome UP000002156 (Thermoanaerobacter pseudethanolicus strain ATCC 33223 / 39E, NCBITaxon:340099): Cysteine desulfurase IscS (iscS / Teth39_0280, UniProtKB:B0KC13), Cysteine desulfurase (Teth39_1911, UniProtKB:B0KCT7), Cysteine desulfurase (Teth39_0119, UniProtKB:B0KB21), and Cysteine synthase (Teth39_0279, UniProtKB:B0KC12).'
