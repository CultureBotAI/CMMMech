limitations:
- No initial specimen chemistry, quantified purity or polytype refinement.
- No direct fungal metabolite concentration or Mn oxidation-state measurement isolates
  the proposed organic-acid pathway.
- No dissolved-Mn mass balance, quantitative phase fractions, isolated-product yield
  or industrial deployment.
- 23-day microscopy/biomass and25-day pH/clearing are distinct source sampling descriptions.
- Hot-water extraction and vacuum drying may alter hydration; no wet-versus-dried
  phase series.
- No killed-biomass, matched-pH culture or time-matched sterile diffraction comparisons
  establish microbial necessity.
- Serpula-specific diffraction is not transferred to Aspergillus; no retrospective
  falottaite assignment.
- Species IDs do not authenticate ATCC201373 or identify the unaccessioned Serpula
  isolate.
- Bounded notice/SI search is not exhaustive; mirror redistribution license unresolved,
  raw source remains outside Git.
notes:
- No corrective findings and no target/history edits by this reviewer.
- This is the same Wei2012 experiment under a different material view, not independent
  replication.
- Named validation executed by reviewer; cohort tests executed by parent and independently
