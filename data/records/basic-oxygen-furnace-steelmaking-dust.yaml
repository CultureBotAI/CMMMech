- id: kara2024_bos_dust
  title: Tezyapar Kara, Huntington, Simmons, Wagland and Coulon (2024), Extracting metal ions from basic oxygen steelmaking dust by using bio-hydrometallurgy, Heliyon 10(11), e32437; DOI 10.1016/j.heliyon.2024.e32437. Methods 2.1-2.6, Results 3.1-3.2, Tables 1-3 and Figures 1-5.
  url: https://doi.org/10.1016/j.heliyon.2024.e32437
  accessed_on: '2026-10-11'
- id: dsm583
  title: DSMZ catalogue DSM 583, Acidithiobacillus ferrooxidans; collection identity corroborates the paper's named stock, without authenticating its adapted culture.
  url: https://www.dsmz.de/collection/catalogue/details/culture/DSM-583
  accessed_on: '2026-10-11'
- id: ncbi_ferrooxidans
  title: NCBI Taxonomy 920, Acidithiobacillus ferrooxidans, species-level identity.
