mechanisms:
- id: ferrooxidans_associated_copper_release
  name: Culture-associated copper mobilization from a natural bornite specimen
  process: bioleaching
  description: In the source's shaken acidic assays, the source-labelled A. ferrooxidans culture was associated with greater aqueous copper release from the bornite specimen than the uninoculated system. Iron oxidation and ferric-mediated mineral attack are the authors' interpretation; the study does not isolate direct enzymatic attack on bornite. Adding iron-bearing sphalerite called marmatite also accelerated early copper release, and this addition had a stronger effect without bacteria than with them.
  context: Laboratory experiment using a Guangxi geological-museum specimen, ground below 0.074 mm and UV treated for 20 minutes. Table S1 reports 62.301 wt% Cu, 9.982 wt% Fe and 24.222 wt% S. The claimed greater-than-90% purity is based on elemental XRF, not an independently quantified phase fraction. The unaccessioned culture came from Central South University and was pre-grown with ferrous sulfate, collected and rinsed; its species ID does not establish stock identity or exclude residual inoculum iron. Assays used 250 mL flasks, 99 mL sterile 9K basal medium plus 1 mL inoculum, 30 degrees C, 170 rpm and 14 days. Sulfuric acid maintained pH 1.70-1.80. This external pH control does not demonstrate microbial acid production. Pure-bornite and mixed-mineral arms are separately plotted; the methods call their labels mass ratios while Figure 4 labels them in grams, so equal total solid loadings across ratios are not assumed. Sampling losses were replaced with water; cumulative copper accounting
    and the meaning of plotted error bars are not specified. Three microscope counts are described, but independent leaching-flask replication is not established. Copper was measured by ICP-AES. No isolated copper product or industrial operation was demonstrated.
  microbial: true
