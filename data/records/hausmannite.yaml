  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Hausmannite row, PDF page 90; formula, grandfathered status and historical year.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: hausmannite_handbook
