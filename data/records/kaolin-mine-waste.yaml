id: cmmmech:kaolin-mine-waste
name: Kaolin mine waste
material_kind: secondary_resource
description: Kaolin-bearing material discarded into mine waste dumps because iron impurities prevented commercialization, represented by high- and low-iron samples supplied by Caobar SA from Poveda de la Sierra, Guadalajara, Spain. The source describes waste from beds not exploited for sale; it does not establish that this is processing tailings. The mixed kaolinite-rich feed is distinct from a kaolinite mineral species, natural kaolin resource, elemental iron or an isolated recovered product. Secondary-resource scope follows its mine-discard status, not the source's conflicting descriptions of primary versus secondary geological origin. No criticality designation is inferred from constituents.
sources:
- id: sanchez_palencia_2022
  title: Sanchez-Palencia et al. (2022). Iron Removal from Kaolin Waste Dumps by Chemical (Oxalic and Citric Acids) and Biological (Bacillus Strain) Leaching. Clays and Clay Minerals 70(3):386-404. DOI 10.1007/s42860-022-00192-7. Original Springer version published 7 July 2022; complete 19-page PDF, Tables 1-4 and Figures 1-12 inspected. The later Cambridge/Crossref online date is not a separate experiment.
  url: https://doi.org/10.1007/s42860-022-00192-7
  accessed_on: '2026-10-11'
- id: sanchez_palencia_2022_esm
  title: Sanchez-Palencia et al. (2022), original ESM 1 DOCX. Complete geological description and original images for Figures S1-S3 inspected; S3 is a photograph partway through the 218-day chemical experiment, not a final recovery measurement.
  url: https://media.springernature.com/original/springer-static/esm/art%3A10.1007%2Fs42860-022-00192-7/MediaObjects/42860_2022_192_MOESM1_ESM.docx
  accessed_on: '2026-10-11'
