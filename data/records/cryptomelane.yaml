mechanisms:
- id: abiotic-thermal-transformation-nickel-retention
  name: Abiotic thermal formation of cryptomelane-assigned material and slower nickel release in
    acid
  process: other
  microbial: false
  description: Heating aged synthetic potassium-bearing birnessites produced solids assigned to cryptomelane
    by diffraction and microscopy. The nickel-bearing 500-degree-C product subsequently released
    nickel much more slowly in hydrochloric acid than its unheated precursor, but ultimately dissolved.
    Phase, crystallinity, particle size and nickel environment changed together. Framework nickel
    incorporation is the authors' interpretation rather than a uniquely demonstrated cause or proof
    that every nickel atom occupied cryptomelane lattice sites.
  context: Yin et al. used Ni-free HB and Ni-doped Ni10 powders originally made by boiling KMnO4/HCl,
    with NiCl2 present for Ni10. Section 2.1 reports precursor K contents of 8.4 and 3.8 wt%, respectively,
    and 6.1 wt% Ni in Ni10; the synthesis feed Ni/Mn ratio of 0.10 differs from the reported solid
    ratio of 0.13. Washed powders were dried at 40 degrees C, ground below 100 mesh, and stored in
    sealed polystyrene tubes in the dark at room temperature for up to eight years. Eight-year samples
    were heated in air in ceramic crucibles, about 0.1 g per sample, ramping 10 degrees C/min and
    holding each selected temperature for 2 h before cooling. The series spans 50-500 degrees C.
    Separate dissolution assays used 0.0400 g solid in 250 mL 2 M HCl at 37 degrees C with stirring;
    5-mL aliquots were filtered at 0.22 micrometres and measured by AAS. Dissolved fractions were
    normalized to the final concentration after complete dissolution, not to an independently measured
    isolated-product yield. This is a reagent-powder laboratory study with no cells, biomass, industrial
    deployment, or tested biological bioavailability endpoint.
  evidence:
  - source_ref: yin2022
    supports: support
    explanation: Sections 3.1 and 3.3, Figure 1 and Figure 3 support conversion of HB_8y at 400 degrees
      C and predominantly cryptomelane-assigned Ni10_8y at 500 degrees C. The Ni-bearing product
      also contains a minor NiMnO3 impurity, so it is not a pure cryptomelane product. HAADF-STEM/FFT
      shows a 2-by-2 tunnel framework in an examined Ni10_8y_500 crystal. The unheated five/eight-year
      powders retain birnessite signatures; Ni10_8y_400 retains substantial birnessite. These controls
      establish condition dependence, not a universal conversion threshold for natural minerals.
  - source_ref: yin2022
    supports: support
    explanation: Section 3.7 and Figure 9 show nonconcurrent Ni/Mn release from the 500-degree-C
      product and much longer dissolution than for unheated or 200-degree-C Ni10_8y. The source reports
      complete dissolution after about 50 days for the 500-degree-C product. The headline 396-fold
      comparison derives from fitted Kabai kinetic coefficients; it is not a measured recovery fraction
      or a constant instantaneous-rate ratio. The record accepts slower release under this acid assay
      without interpreting it as permanent immobilization, organism uptake, or actual treatment performance.
  - source_ref: yin2022
    supports: partial
    explanation: The phase change, particle growth and crystallinity change co-vary, preventing isolation
      of nickel coordination as the sole cause. Table 2's Ni K-edge fits end at 400 degrees C and
      do not quantify the 500-degree-C product's phase-specific nickel distribution. Microscopy contrast
      plus acid-release behavior supports the proposed incorporation interpretation but does not
      independently allocate all nickel between cryptomelane and the NiMnO3 impurity. Replication
      for dissolution and independently prepared heat-treatment batches, and an acid-only analytical
      blank, are not specified in the inspected manuscript or supplement; Figure 2 separately states
      2-3 TGA measurements with standard errors. Fit uncertainty is not automatically synthesis replication.
  - source_ref: yin2022_si
    supports: partial
    explanation: 'Table S2 qualifies the main text''s description of HB_8y_400 as fully transformed:
      its Mn K-edge linear-combination fit assigns 0.91 cryptomelane and 0.09 birnessite, with stated
      fraction error 0.01. These spectral-fit coefficients use HB_8y_500 and Ni10_8y_300 reference
      spectra; they are not measured gravimetric product yields or independent confirmation of absolute
      phase purity. The same table assigns Ni10_8y_400 only 0.13 cryptomelane. Figure S5 maps Ni10_8y_200,
      not the 500-degree-C product, so it cannot settle nickel allocation in the latter. Table S1''s
      printed HB_8y_300 Mn(IV) total differs from the sum of its three listed Mn(IV) components;
      this record does not import that unresolved oxidation-state estimate.'
  - source_ref: grangeon2015
    supports: context_only
    explanation: An independent dry-aging experiment used sodium-rich synthetic delta-MnO2, pre-equilibrated
      at pH 3, 4, 8 or 10 and aged ten years at room temperature in the dark. Figures 1 and 8-11
      show minor cryptomelane-like tunnel domains in low-pH samples, with heterogeneous tunnel sizes;
      pH 8/10 comparators retain layered structures. This establishes structural-analogue context,
      not compositional confirmation of potassium-dominant mineral cryptomelane or a microbial product.
      Type-2/3 intermediate crystals were not isolated for selected-area diffraction; their role
      in the proposed sequence remains inferred. The study's low-pH, small-crystal precursor differs
      from Yin's more ordered potassium-bearing powders, so the contrasting room-temperature outcomes
      are conditional rather than a direct refutation.
