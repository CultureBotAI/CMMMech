      and metal chelation.
    annotation_note: Grounded to strain-matched reviewed Swiss-Prot entry UniProtKB:G3Y4N5 (CEXA_ASPNA;
      locus ASPNIDRAFT_56962) for Aspergillus niger ATCC 1015 (NCBITaxon:380704).
    evidence:
    - source_ref: kang_2022
      supports: partial
      explanation: Representative Aspergillus niger ATCC 1015 citrate exporter CexA for organic-acid excretion;
        Kang et al. (2022) measured organic acids in cell-free spent medium and precipitated CePO4·H2O
