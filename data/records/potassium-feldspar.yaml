id: cmmmech:potassium-feldspar
name: Potassium feldspar family
material_kind: mineral_group
description: Potassium feldspar (K-feldspar) is an informal family of potassium-rich alkali feldspars,
  including the microcline, orthoclase and sanidine structural forms; it is represented by the mineral_group
  kind without claiming an IMA-approved group name or a single mineral species. Whitney and Evans (2010),
  reproduced in the IMA-hosted nomenclature compendium, explicitly labels K-feldspar informal. Freeman
  et al. (2008) distinguishes these structural forms and the compositional end-member notation from an
  individual orthoclase phase. This family is distinct from the traded feldspar commodity and potash.
  The experimental feed below is only author-designated potassium feldspar; bulk oxide composition does
  not resolve its member species or phase proportions. No criticality designation is inherited.
sources:
