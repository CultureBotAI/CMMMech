id: cmmmech:rhenium
name: Rhenium
material_kind: element
description: Rhenium (Re), represented as an element distinct from its ions, compounds, isotopes, host minerals, alloys and commodity streams. The US 2025 designation names the rhenium commodity and does not designate every compound or host material. A laboratory batch study tested inactive brewer's yeast biomass for rhenium association from synthetic perrhenate solutions. This biosorption record does not assert microbial rhenium reduction or isolated-metal recovery.
