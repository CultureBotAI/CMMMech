id: cmmmech:violarite
name: Violarite
material_kind: mineral
description: Violarite is the cubic iron-nickel thiospinel mineral with ideal formula FeNi2S4. The September
  2026 IMA list records grandfathered status and original-description year 1924, not a numbered approval.
  It is distinct from pentlandite, polydymite, greigite, elemental nickel and mixed ores. The accepted
  study uses violarite broadly for intermediate Fe–Ni thiospinel compositions rather than proving an ideal
  FeNi2S4 product. Its experiments were abiotic and do not inherit constituent criticality or demonstrate
  microbial production.
