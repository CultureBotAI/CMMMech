id: cmmmech:phosphophyllite
name: Phosphophyllite
material_kind: mineral
description: >-
  Phosphophyllite is a grandfathered monoclinic zinc-ferrous phosphate
  mineral, represented in the September 2026 IMA list as
  Zn2Fe(II)(PO4)2(H2O)4 with historical year 1920. It is a mineral species,
  distinct from elemental zinc, a zinc commodity and the related minerals
  hopeite and parahopeite. Hill (1977) refined the structure of a natural
  Potosi, Bolivia crystal in P21/c using three-dimensional X-ray data,
  resolving competing earlier structural models. Zinc/phosphate
  tetrahedral sheets are linked through Fe-bearing octahedra; the
  Potosi result is not a universal assay of every locality. Dunn and
  Norberg (1977) partially analyzed eleven Hagendorf and three Potosi
  specimens, finding variable Mn substitution for Fe in the Hagendorf
  material and very little Mn in the Potosi material. One borderline
  Hagendorf Mn:Fe weight ratio of 51:49 was explicitly insufficient,
  given analytical uncertainty, to establish a separate Mn-dominant
  species. Their unpublished specimen-by-specimen analytical table
  was not acquired. These natural-crystal studies support identity
  and composition variability, without establishing microbial
  extraction, a recovery yield or industrial deployment. No criticality
  designation is inherited from zinc, iron or phosphorus.
sources:
