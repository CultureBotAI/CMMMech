    evidence:
      - source_ref: liang2016
        supports: support
        explanation: Figure 2f shows precipitates associated with K. lactis after 120-h growth in the uranium/G2P medium; panels 2d-e show the separate water-control and post-growth uranium-exposure arms. Figure 3b overlays the K. lactis diffraction trace with patterns labelled meta-ankoleite, chernikovite, bassetite and uramphite. Table 5 reports the same mineral assignments. Methods specify uninoculated controls and report no significant precipitation from organic phosphorus substrates plus uranyl nitrate without yeasts. These observations support culture-associated uranyl phosphate precipitation with the reported phase assignment, rather than a pure meta-ankoleite product.
      - source_ref: liang2016
        supports: partial
        explanation: The source reports reference-pattern matching, without a refined phase fraction, resolved interlayer composition or direct water determination. Table 5 lists C, O, Al, P, S and U for the selected K. lactis G2P/1 mM uranium arm, without K or Fe; therefore its elemental analysis does not independently establish potassium meta-ankoleite or the co-assigned iron phase. The XRD row spans treatment columns, but Figure 3 expressly binds its trace to the 1 mM uranium/G2P growth arm; it is not transferred to every loading, phytic-acid condition or post-growth exposure. Table 4 gives a biomass tolerance index of 75.0% for this arm relative to its uranium-free G2P control, showing growth inhibition. That percentage and the phosphate-release assay are not uranium removal or mineral-recovery yields. Phosphatase involvement is inferred without enzyme inhibition, purified-enzyme or genetic tests. No mineral-specific uranium balance, isolated-product recovery, long-term retention test
          or industrial deployment is demonstrated.
      - source_ref: liang2015
        supports: context_only
        explanation: This separate filamentous-fungus experiment explicitly states on pages 2067 and 2071 that related uranyl phosphates can have nearly identical diffraction patterns, so XRPD alone cannot unequivocally identify potassium uranyl phosphate or determine whether one or several phases occur; Figure 5 illustrates the overlapping matches. It supports retaining this identification limitation, not reassigning the 2016 yeast product or counting the earlier experiment as confirmation of an exact mineral yield.
