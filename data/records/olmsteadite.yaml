id: cmmmech:olmsteadite
name: Olmsteadite
material_kind: mineral
description: >-
  Olmsteadite (IMA 1974-034) is an IMA-accepted hydrated potassium-iron-niobium
  phosphate mineral with IMA September 2026 Master List formula
  KFe2+2NbO2(PO4)2(H2O)2 and structural formula
  K2Fe2+2[Fe2+2(Nb,Ta)5+2O4(H2O)4(PO4)4] (with site-refined Nb0.709(5)Ta0.291(5)
  in the Big Chief holotype). Described by Moore et al. (1976) from the Big
  Chief pegmatite, near Glendale, Pennington County, South Dakota, USA (holotype),
  and the Hesnard pegmatite, near Custer, Custer County, South Dakota, USA,
  where it forms deep brown to black prismatic crystals associated with
  siderite, quartz, and rockbridgeite during late hydrothermal
  alteration of triphylite-lithiophilite. Orthorhombic (space group Pb21m;
  refined to R = 0.037 for 1846
  reflections), with a = 7.512(1) Å, b = 10.000(3) Å, c = 6.492(2) Å, Z = 1 (for
  the structural formula above), SGmeas = 3.31(1) (Big Chief) and 3.36(1)
  (Hesnard), Mohs hardness 4, and biaxial (+) optics with alpha = 1.725(5), beta
  = 1.755(5), gamma = 1.815(5) (Big Chief; Hesnard alpha = 1.765(4), beta =
  1.775(4), gamma = 1.835(4)); 2V ~ 60° for Big Chief material.
