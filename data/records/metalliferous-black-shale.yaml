- id: heap1_acid_leaching_comparison_graph
  name: Acidithiobacillus ferrooxidans Heap-1 rus-operon Fe(II) oxidation and pH/FeSO4-dependent metal solubilization from M-921 Turbella black shale
  description: 'Causal pathway linking representative Acidithiobacillus ferrooxidans rus-operon proteins (Cyc2 AFE_3153/DN052_11975, Swiss-Prot rusticyanin AFE_3146, and Cyc1 AFE_3152 in reference proteomes UP000001362 and UP000248886) for Pakistani hard-coal isolate A. ferrooxidans Heap-1 (5 cm3 inoculum in 100 cm3 of 0.5 N H2SO4 medium with 1% w/v [<=200 mesh] M-921 Turbella yellow-trap black shale in 250-mL flasks at 30 +/- 1 C and 100 rpm for 20 days across initial pH 1.5, 2.0, and 2.5 with and without 160 mM FeSO4, paired against 2% thymol-in-methanol sterilized controls) to Table 3 day-20 dissolved metal outcomes (with 160 mM FeSO4: Mn 25.3 vs 19.5 mg/dm3 at pH 2.0, 26.8 vs 24.0 mg/dm3 at pH 1.5, and 15.8 vs 17.85 mg/dm3 at pH 2.5; Cu 1.75 vs 0.00 mg/dm3 in all three Fe-supplemented arms; without added FeSO4: Fe 103.00 vs 74.25 mg/dm3 at pH 1.5, 65.00 vs 65.50 mg/dm3 at pH 2.0, and 45.35 vs 53.30 mg/dm3 at pH 2.5; Co 0.00 mg/dm3 across all Table 3 rows despite abstract/conclusion percentage
    claims) in Anjum et al. (2009).'
