mechanisms:
- id: beauvoir_acidophile_leaching
  name: Medium-dependent acidophile-associated lithium mobilization from mixed ore
  process: bioleaching
  description: A consortium cultured with sulfur in nutrient-poor acidic medium mobilized lithium from the Beauvoir feed over a prolonged laboratory incubation. The nutrient-rich bacterial treatment showed no lithium bioleaching in the authors' account. Acidification is consistent with an indirect acid-leaching contribution, but the experiment does not resolve each organism's causal role or establish exclusive proton control. Dissolved lithium and altered residue diffraction patterns do not demonstrate an isolated lithium product or selective dissolution of a single mineral species.
  context: The source names A. ferrooxidans SmolnikLC and A. thiooxidans SmolnikF, isolated from Smolnik copper-mine drainage; the taxon IDs identify species, not those strains. Cultures were adapted to ore for two months. Ball-milled feed was sieved below 150 micrometres, with approximately 75% below 100 micrometres, and loaded at 10 g/L. Duplicate 250 mL flasks contained 190 mL medium plus 10 mL adapted inoculum, at 30 degrees C without shaking. Poor medium was sulfuric acid initially at pH 3 with 5 g/L elemental sulfur; ore was added after culture acidification to pH 1.5. Rich medium contained inorganic nutrients, 44.2 g/L FeSO4.7H2O and 4 g/L sulfur. Same-medium uninoculated controls were reported, but pH trajectories were not held equal. Filtered 0.2 micrometre samples were assayed for lithium by AAS. Results and Figure 1B use an endpoint around 336 days, whereas Methods lists day 366 as the final sampling day; an exact reconciled duration is unavailable.
