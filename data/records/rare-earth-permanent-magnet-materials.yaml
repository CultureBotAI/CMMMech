id: cmmmech:rare-earth-permanent-magnet-materials
name: Rare-earth materials for permanent magnets, EU list scope
material_kind: commodity
description: >-
  This end-use commodity family follows the seven-member entry in EU 2024
  Annex I: neodymium, praseodymium, terbium, dysprosium, gadolinium, samarium
  and cerium for permanent magnets. The qualification for permanent magnets
  is part of the identity and designation. This record does not identify a
  finished magnet, a single alloy composition, a numeric purity grade, or
  every use of those elements. It overlaps the broader rare-earth commodity
  family and both EU light and heavy rare-earth subgroups, while remaining
  distinct from each individual element and from magnet-bearing waste.
  No microbial recovery mechanism or performance for a magnet feedstock is
  inferred from an assay of synthetic dissolved rare-earth ions.
