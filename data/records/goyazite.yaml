mechanisms:
- id: abiotic_synthesis_and_thermal_dehydroxylation
  name: Abiotic synthesis and thermal dehydroxylation of goyazite-bearing solids
  process: other
  microbial: false
  description: Replacing calcium chloride with strontium chloride in the reagent synthesis produced a
    goyazite-bearing nominal strontium endmember and intermediate compositions. Heating caused structural-water
    loss. This is an abiotic laboratory transformation of synthetic preparations, not biological strontium
    immobilization or recovery from a real feed.
  context: Gilkes1983 Materials and methods (page 221, PDF page 1) crystallized gels made from sodium
    aluminate, calcium chloride and phosphoric acid, substituting strontium chloride for calcium chloride
    across the series. Gels were held for two weeks at 200 degrees C and 1.5 million N/m2 in a stainless-steel
    pressure vessel with a glass insert. Powder XRD used a quartz internal standard. TGA and differentiated
    TGA used 10 mg samples in flowing air at 10 degrees C/min; DTA used 100 mg under the same stated heating
    conditions. Exact starting reagent amounts, independent synthesis replicates and an isolated-product
    yield are not reported in this article. This is the same experimental series curated in the companion
    mineral record, not independent replication.
  evidence:
  - source_ref: ima_2026_09
    supports: context_only
    explanation: The exact Goyazite row gives SrAl3(PO4)(PO3OH)(OH)6 and status Rd, 1999 s.p.; list definitions
      identify a redefined mineral. The entry confers no jurisdictional criticality designation.
  - source_ref: handbook_goyazite
    supports: context_only
    explanation: The complete entry supports the ideal strontium endmember, natural diffraction and variable
      Ca/Ba/F-bearing compositions. Natural substitutions should not be confused with the nominal composition
      of a synthetic starting gel.
  - source_ref: kato1987
    supports: context_only
    explanation: Experimental section and Tables 1-3 (pages 390-393, PDF pages 1-4) report a natural crystal
      from the North Groton, New Hampshire specimen supplied by the Smithsonian, NMNH 141049. Single-crystal
      refinement used 417 independent reflections with R=0.039 and reported a=7.015(3), c=16.558(6) angstrom
      and R-3m symmetry. Figures 1-2 (pages 394-395, PDF pages 5-6) depict the structural arrangement
      and hydrogen-related difference-Fourier section. This is direct natural-mineral structural evidence,
      not a synthesis or leaching experiment; the older 1971 study is the same locality/refinement lineage,
      not independent biological evidence.
  - source_ref: gilkes1983
    supports: support
    explanation: Pages 221-224, Table II and Figure 1 report the nominal strontium endmember as goyazite
      with a=7.013 and c=16.650 angstrom, and approximately linear lattice changes with the starting-gel
      Sr proportion. The larger synthetic c parameter differs from natural goyazite measurements; authors
      propose natural cation substitution as an explanation, not a direct occupancy measurement in these
      preparations.
  - source_ref: gilkes1983
    supports: partial
    explanation: Pages 221-223, Figure 1 and Table II identify crandallite-goyazite as the major series
      phases but explicitly report minor boehmite and strontium-substituted hydroxylapatites. The composition
      axis is mole percent Sr in the original gel, not a measured phase-specific Sr occupancy. Unit-cell
      estimates use only the well-resolved 303 and 220 reflections because other assignments are uncertain.
      Neither a pure endmember recovery yield nor a quantitative phase fraction follows from these measurements.
  - source_ref: gilkes1983
    supports: support
    explanation: Pages 225-226 and Figures 5-6 show multiple thermal-water-loss features for goyazite-bearing
      material. The major DTGA feature is approximately 440 degrees C in the nominal strontium endmember;
      its corresponding DTA peak is appreciably higher. The weak high-temperature feature around 550 degrees
      C is attributed to boehmite. Thus a single universal goyazite decomposition temperature is not established.
  - source_ref: gilkes1983
    supports: partial
    explanation: Pages 225-226 and Figures 5-6 distinguish DTA from DTGA peak temperatures; DTA peaks
      are systematically higher, possibly because its larger sample slows water escape. The highest-temperature
      feature is assigned to boehmite impurity, not the phosphate mineral. Differences in crystal size
      also confound a composition-only explanation. Table I compiles earlier literature, including substituted
      or mixed natural specimens; those entries are not new experiments or universal decomposition thresholds.
      The six-hour furnace series and residual-cell changes in Figure 7 were performed on crandallite,
      not goyazite; those transformation fractions and cell changes are not transferred to this owner.
