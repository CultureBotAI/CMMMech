  accessed_on: '2026-10-15'
- id: maciver_jones_thesis
  title: MacIver-Jones F. The Structure, Stability, and Synthesis of Copper Autunite Minerals with Implications
    for Uranium Remediation. PhD thesis, University of Edinburgh. Institutional item 1842/40395, DOI 10.7488/era/3163,
    issued 2023-03-13 as MacIver-JonesF_2023.pdf; title page says 2021. Complete 272-page deposited PDF
    acquired; Chapters 2-3 (printed pages 61-107), including Figures 3.1-3.14, Tables 3.1-3.12 and Appendices
    3.1-3.3 inspected. Zeunerite neutron results are thesis evidence; the linked 2021 IUCrJ paper and
    AIRSS calculations concern metatorbernite.
