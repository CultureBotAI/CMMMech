id: cmmmech:kaliborite
name: Kaliborite
material_kind: mineral
description: >-
  Kaliborite is the grandfathered potassium-magnesium borate species
  KHMg2B12O16(OH)10(H2O)4 in the September 2026 IMA-CNMNC list.
  Its 1889 entry is an original-description year, not an approval
  identifier. Burns and Hawthorne studied a natural Kazakhstan crystal
  from Canadian Museum of Nature specimen 53372 and refined a monoclinic
  C2/c structure with borate chains parallel to b. Their 1994 study
  located hydrogen by difference-Fourier analysis with O-H distance
  restraints. The apparently symmetric hydrogen bond was interpreted
  as dynamically disordered from structural and bond-valence arguments;
  this was not a direct measurement of hydrogen motion. The paper did
  not provide a new bulk chemical analysis of that crystal. A separate
  museum material supplied the thermal experiments below. This mineral
  is distinct from elemental boron and the borates commodity; neither
  criticality, microbial activity nor industrial recovery is inferred.
sources:
