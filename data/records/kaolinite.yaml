- id: mendocina_siderophore_kaolinite_associated_fe_acquisition_graph
  name: Ectopseudomonas mendocina siderophore export, specimen-associated iron acquisition from KGa-1b/KGa-2 kaolinite, and enhanced aerobic growth
  description: Causal pathway linking Ectopseudomonas mendocina pyoverdine export transporter PvdT (UniProtKB:A0ABZ2RID1), outer-membrane TonB-dependent siderophore receptor (UniProtKB:A0ABZ2RGC8), and energy transducer TonB (UniProtKB:A0ABZ2RK72) in species reference proteome UP001476583 to iron-availability-dependent extracellular siderophore accumulation (assayed in pooled KGa-2, Fe-EDTA, and no-added-iron supernatants against source-designated DFAM in Figures 3-5) and enhanced OD600 aerobic growth in the presence of weakly acid-washed CMS KGa-1b and KGa-2 kaolinite (normalized to 24 m2/L) relative to no-added-iron controls (Figures 1-2 of Ams et al., 2002), while preserving unresolved iron host phases (lattice substitution vs accessory phases vs surface Fe), relative DFAM calibration, pH divergence, and lack of direct iron-release quantification.
  scope: REPRESENTATIVE_EXAMPLE
  mechanism_ref: aerobic_kaolinite_associated_iron_acquisition
