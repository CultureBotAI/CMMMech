mechanisms:
- id: abiotic_microwave_phosphate_conversion
  name: Abiotic microwave-assisted formation of synthetic La monazite
  process: other
  microbial: false
  description: >-
    Synthetic La rhabdophane was treated in 1 M phosphoric acid
    at 210 degrees C for one hour using microwave-assisted
    hydrothermal heating, producing a powder assigned to monazite
    by X-ray diffraction. Separate reagent routes using LaCl3
    or LaF3 at 230 degrees C for one hour also produced source-assigned
    monazite powders. These are laboratory preparation and mineral
    transformation experiments; neither an isolated-lanthanum
    recovery yield nor performance with real nuclear waste was measured.
  context: >-
    The series used a CEM Discover 2.0 instrument, an infrared
    temperature sensor, stirring and 35-mL Pyrex tubes. The initial
    La oxide reagent was supplied as 99.9% La2O3. The rhabdophane
    preparation used 8 mL of 1 M H3PO4 at 100 degrees C for
    30 minutes; the subsequent monazite preparation used 210 degrees C
    for one hour. The methods also describe direct monazite preparation
    from starting reagents, but Figure 4B specifically labels the
    precursor-conversion series. Figure S7 shows the separate
    LaCl3 and LaF3 routes, whose methods specify 8 mL of 1 M H3PO4
    and 230 degrees C for one hour. Products were filtered and
    washed with water and acetone. PXRD used Cu Kalpha radiation
    over 5-65 degrees 2theta. La starting amounts, independent
    replicate counts and quantitative La phase-purity or product
    yields are not specified. The diffraction assignment does not
    prove complete purity below analytical detection. No matched
    La acid-free, conventionally heated or pH-series comparison is
    reported in the acquired source. The detailed proton-assisted
    pathway, low-temperature onset and chemical-durability tests
    concern Nd material and are not transferred to La.
  evidence:
  - source_ref: zhoujin2025
    supports: support
    explanation: >-
      The La-labeled powder trace in Figure 4B and its caption
      support conversion of synthetic La rhabdophane in 1 M H3PO4
      at 210 degrees C for one hour. Figure S2 identifies the
      La precursor preparation; Figure S7 and the microwave
      methods independently identify the two starting-salt routes
      at 230 degrees C. These are distinct arms of one study,
      not independent replications.
  - source_ref: zhoujin2025
    supports: partial
    explanation: >-
      Methods do not give a La-specific starting mass or a
      mass-balanced yield. The 100-mg loading, HCl pH series and
      fitted phase fractions belong to Nd rhabdophane. Supplement
      Table S4 lists pH 0.83 where Figure S11 says 0.65, and
      Figures S18-S20 repeat a 6.38 caption despite different
      patterns; these unresolved labels are not used to construct
      a La pH response. The study's in-situ Nd observations and
      proposed proton pathway are not direct proof of a La
      molecular mechanism. Chemical durability of Nd powder
      does not establish La or transuranic waste-form performance.
