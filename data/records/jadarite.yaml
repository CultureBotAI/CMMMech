  evidence:
  - source_ref: kirk2024
    supports: support
    explanation: Sections 2.1-2.3 and 3.1-3.2, Fig. 1 and Table 1 support the scoped ICP-OES dissolved-Li comparison and mixed substrate identity. Acid leaching contributed substantially in all treatments.
  - source_ref: kirk2024
    supports: partial
    explanation: 'Section 3.2 limits the advantage to a transient comparison: by day 30 the uninoculated control was similar, and acid-only leaching remained higher. Sections 3.3-3.4 and Figs. 4-5 report no material microbial enhancement for the tested spodumene- and lepidolite-bearing samples. The lepidolite sample name is retained without treating it as a unique mineral species. The result cannot be generalized to all Li ores.'
  - source_ref: kirk2024_data_v1
    supports: partial
    explanation: The eight-file version 1 deposit was acquired and its issuing hashes verified. Jadarite day-30 values are consistent with the reported control convergence and higher acid-only result, but quantitative verification remains limited. Bioleaching workbook headers use mg/kg rather than the paper's mg/L; mineral-digestion units also require reconciliation. In Jadarite bioleaching results from ICP-OES.xlsx, Jadarite!F5 and F7 do not equal the arithmetic means of the labelled replicate cells C:E. Standalone spodumene and lepidolite workbooks contain identical Li replicate blocks at Sheet1!C3:E12, requiring provenance clarification before independent comparison. These are unresolved mappings and inconsistencies, not identified corrections or specific refutations of the paper's qualitative comparisons. The files provide no loading or per-flask acid-dose ledger to resolve the published contradictions. No deposited number was corrected or imported as a normalized yield or quantitative
      benchmark.
  - source_ref: kirk2024
    supports: partial
    explanation: Sections 2.4-2.5 and 3.2, Figures 2-3 associate inoculation with biofilm-like material and loss of jadarite, dolomite and probertite peaks. Some lower-intensity jadarite peaks remained in the uninoculated control. A new peak near 2-theta 27.9 degrees occurred in both conditions; the authors' boric-acid interpretation is not treated as an unambiguous phase identification or a recovered-product measurement. Table 1 omits the hydroxyl group from its jadarite formula; mineral identity here follows the IMA formula, not that incomplete experimental table notation.
causal_graphs:
- id: acidophile_jadarite_bearing_material_leaching_graph
  name: Acidithiobacillus ferrooxidans inoculation and sulfuric-acid-dominated dissolution of Jadar Basin jadarite-bearing feed
  description: Causal pathway linking representative Acidithiobacillus ferrooxidans rus-operon proteins (Cyc2 AFE_3153/DN052_11975, Swiss-Prot rusticyanin AFE_3146, and Cyc1 AFE_3152 in reference proteomes UP000001362 and UP000248886) for the ferrous-sulfate-grown Bor sulfide-ore isolate (10 mL inoculum in 190 mL sterile basal medium with 2 g jadarite-bearing powder [76.5% jadarite, 13.8% dolomite, 6.9% calcite, 2.8% probertite; labeled 2% w/v though 2 g in 200 mL total liquid is 1% w/v] at static 23 C for 30 days) and repeated 0.5 M (1 N) H2SO4 additions (13.5 mL cumulative in kirk2024_data_v1 to counteract carbonate/borate buffering toward target pH 1.8) to congruent jadarite dissolution (day-30 190 mg/L Li [~42%] and 800 mg/L B [~45%] in the inoculated arm versus 210 mg/L Li [~46%] and 860 mg/L B [~48%] in the uninoculated acid control, leaving a residue modeled as 82.6% boric acid and 17.4% amorphous silica with no XRD-detectable jadarite) in Kirk et al. (2024).
  scope: REPRESENTATIVE_EXAMPLE
  mechanism_ref: acidophile_jadarite_bearing_material_leaching
