id: cmmmech:burbankite
name: Burbankite
material_kind: mineral
description: A natural anhydrous carbonate mineral with the IMA-CNMNC September 2026 formula
  (Na,Ca)3(Sr,Ba,Ce)3(CO3)5. It is grandfathered; the listed 1953 value is an original-description
  year, not an IMA approval accession. This record denotes the mineral species, not the
  entire burbankite group, its constituent elements, or a carbonatite ore. Pecora and Kerr
  (1953) characterized natural hexagonal burbankite from calcite-rich veins at the Vermiculite
  Prospects, Big Sandy Creek, Bearpaw Mountains, Montana. Powder and single-crystal diffraction
  support the mineral characterization. Their chemical preparation remained about 96 percent
  burbankite by grain count, with about 3 percent ancylite and 1 percent other minerals;
  Table 2 separately gives the impure analysis and an impurity-adjusted calculation. The
  corrected chemistry is not a direct pure-phase measurement. The authors reported vigorous
  effervescence in cold dilute (1:5) HCl, but did not establish a leaching yield, rate or
  isolated rare-earth product. Observed weathering assemblages contained several minerals
  and do not resolve a unique reaction pathway. A later synthetic Na-Ca-La carbonate with
  burbankite structure is treated below as an experimental analogue, not as the measured
  composition of these natural specimens. No dated criticality designation or microbial
  mechanism is asserted.
