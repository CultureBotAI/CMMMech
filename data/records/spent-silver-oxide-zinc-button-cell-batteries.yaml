    entry_name: CEXA_ASPNG
    protein_name: Citrate exporter A
    gene_symbol: cexA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:5061
      label: Aspergillus niger
    interpro_ids:
    - InterPro:IPR011701
    - InterPro:IPR020846
    - InterPro:IPR036259
    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA that secretes intracellularly synthesized citric acid into the extracellular medium, driving organic-acid acidification and metal mobilization.
    annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:A0A254TZW7 (CEXA_ASPNG) for Aspergillus niger (NCBITaxon:5061).
    evidence:
    - source_ref: jadhav_2018
      supports: partial
      explanation: Representative Aspergillus niger citrate exporter CexA exporting citric acid into the filtered spent medium used to mobilize Zn and Ag from waste silver-oxide-zinc button-cell powder in Jadhav et al. (2018); cexA was not genetically perturbed in the study.
  evidence:
  - source_ref: jadhav_2018
    supports: support
    explanation: Sections 2.1–2.5 and Figure 1 support the feed preparation and filtrate-leaching observation. At six hours in the 30 degrees C time-series arm, the Results report approximately 80% Zn and 41% Ag extraction, but only 2% Hg; Figure 1 shows little additional release at eight hours. These are the paper's solution-based extraction estimates, not independently reconciled yields or recovered-product masses. The incomplete mercury release is preserved rather than claiming comprehensive metal removal or detoxification.
  - source_ref: jadhav_2018
    supports: partial
    explanation: Figure 4 and the conclusion report 100% Zn and Ag with 0.10 g powder and 15 mL filtrate at 60 degrees C, 100 rpm and six hours. However, Section 2.4 specifies 150 rpm and eight hours for the volume series, and eight hours for the agitation series whereas Figures 3–4 say six. Figure 2 shows 100% Zn and Ag at 60 degrees C, 150 rpm and six hours, while Figure 3 shows roughly 70% at the same nominal temperature, speed, time and 100 mL volume. The Results' claimed temperature range of 20–60 degrees C and shaking range of 50–200 rpm also differ from the displayed 30–60 degrees C and 0–150 rpm series. These conflicts preclude treating the combined optimum as a verified reproducible protocol. Low mercury release persists in these arms. No reconciled quantitative observation is imported.
  - source_ref: jadhav_2018
    supports: partial
    explanation: The source attributes leaching to citric acid and contrasts it with ferric supernatant in an earlier 2013 study, but neither a matched acid comparison nor a fresh assay of that earlier bacterial arm is presented here. The prior study's Table 2 summary is not independent replication or proof that oxidized zinc can never dissolve in an acidic ferric medium. No source-supported industrial scale, life-cycle advantage, isolated product purity or criticality designation follows from this experiment.
  - source_ref: ncbi_5061
    supports: context_only
    explanation: The current authority resolves the source's species name to NCBITaxon:5061. It does not identify the experimental stock, its metabolites or a species-wide leaching phenotype.
