        analyte:
          id: CHEBI:27214
          label: uranium atom
        material_form: >-
          Uranium-bearing electrolyte. ICP-OES measures total elemental U;
          the atom identifier grounds the element, not neutral atoms in solution
          or an oxidation-state measurement.
        sampled_fraction: >-
          Working-chamber solution filtered at 0.22 micrometres before
          preservation in 1% nitric acid.
        study_arm: biotic
        result_status: below_detection
        detection_limit: 0.1
        unit: mg/kg
        analyzed_on: '2024-10-29'
        sampled_on: '2024-09-27'
        sampling_source_locator: 'T2_pH.csv; SampleID=BESU.8Vb_W.END; Date column'
        context: >-
          Original biotic-run endpoint. T1 and metadata step 8 define the
          negative source token as below detection: U is less than 0.1 mg/kg.
          No measured value or zero is assigned. Analytical and sample dates
          are separate, and this endpoint is not a mass-balanced recovery yield.
      - id: u_abiotic_t0
        source_ref: kane_2026_bes
        source_table: T3_AqueousICPOES.csv
        source_sample_id: BESU.8Va_W.t0
        source_column: U_ppm
