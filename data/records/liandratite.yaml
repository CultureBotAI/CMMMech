id: cmmmech:liandratite
name: Liandratite
material_kind: mineral
description: Hexavalent uranium niobate-tantalate mineral with current September 2026 IMA-CNMNC
  approved end-member formula U6+Nb2O8 (natural solid-solution formula U6+(Nb,Ta)2O8 with
  Nb:Ta ~ 5:1), status A, and approval number IMA 1975-039. Mucke and Strunz (1978) described
  the type material from the giant-grained beryl-columbite-petscheckite zone B of the Antsakoa
  I granitic pegmatite near Berere, ~40 km northeast of Tsaratanana, Madagascar, where liandratite
  forms 1-2 mm yellow to yellow-brown glassy, conchoidally fracturing metamict crusts epitaxially
  coating oxidized petscheckite (U4+Fe2+(Nb,Ta)2O8) crystals embedded in quartz. Cameca MS-46
  electron-microprobe and microchemical analysis (Table 2, p. 944) yielded ~50 wt% UO2 (present
  in the hexavalent U6+ oxidation state, corresponding to 48.73 wt% UO3 in the theoretical
  Nb:Ta = 5:1 formula), ~50 wt% combined Nb2O5 + Ta2O5 with atomic ratio Nb:Ta ~ 5:1 (theoretical
  Nb2O5 36.22, Ta2O5 15.05 wt%), ~0.5 wt% H2O, and trace Fe, Mn, Th, and Pb. Unheated natural
  liandratite is completely X-ray amorphous (metamict) with isotropic refractive index n =
  1.83, reflectance ~8.6% in air, Mohs hardness ~3.5, and measured density ~6.8 g/cm3. Heating
  metamict liandratite at red heat (~650 degrees C) and for 24 hours at 1000 degrees C recrystallized
  it as a single trigonal/hexagonal phase in space group P-31m (D3d^1) with a = 6.36, c =
  4.01 A, c/a = 0.6305, Z = 1, Dmeas = 7.0 g/cm3, and Dcalc = 7.11 g/cm3 (for Nb:Ta = 5:1;
  Dcalc = 6.80 g/cm3 for pure UNb2O8 and 9.01 g/cm3 for UTa2O8), isostructural with synthetic
  hexagonal UTa2O8. Distinct from petscheckite (U4+Fe2+(Nb,Ta)2O8), oxyuranobetafite, samarskite-(Y),
  and elemental uranium, niobium, or tantalum; no criticality designation, microbial mechanism,
  or industrial recovery yield is asserted.
