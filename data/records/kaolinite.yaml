  title: IMA-CNMNC. The New IMA List of Minerals, September 2026; definitions pp.1–2 and Kaolinite row PDF p.109, Al2Si2O5(OH)4, A, 1980 s.p. Retained official original re-inspected 14 October 2026.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: kaolinite_handbook
  title: 'Handbook of Mineralogy: Kaolinite, 2001 version 1.2; complete two-page entry, triclinic mineral identity and composition.'
