id: cmmmech:manganoschafarzikite
name: Manganoschafarzikite
material_kind: mineral
ima_symbol: Msfz
description: >-
  IMA-approved manganese(II) antimony(III) oxide mineral (IMA 2022-129; symbol Msfz; status
  A, Approved 2023) with ideal end-member formula Mn2+Sb3+2O4 (requiring MnO 19.57 wt%,
  Sb2O3 80.43 wt%, total 100 wt%), representing the Mn2+ analogue of schafarzikite
  (Fe2+Sb3+2O4) in the newly established minium group (MX2O4; Holtstam et al., 2024,
  European Journal of Mineralogy 36:311-322). Discovered at the Hindenburg working (~150 m
  level) of the Langban Fe-Mn skarn deposit (59.85 deg N, 14.26 deg E), Filipstad district,
  Varmland Province, Sweden, where it occurs in late-stage ("period D") open fractures cutting
  banded fine-grained hematite-andradite skarn, associated with calcite, native lead,
  hydrocerussite, nadorite, Pb-bearing rhodochrosite, mimetite, and a serpentine-group
  mineral; the holotype specimen is deposited at the Department of Geosciences, Swedish
  Museum of Natural History, Stockholm (catalogue no. GEO-NRM 19339699), and a crystal
  fragment is deposited at the Natural History Museum, University of Oslo (catalogue no.
  KNR 44410). Forms dark reddish-brown to black platy, subhedral crystals in subparallel
  aggregates up to 5 mm across (locally showing an iridescent "peacock" tarnish) with a
  yellowish-brown to dark-brown streak, submetallic lustre, translucent diaphaneity in thin
  fragments, distinct {110} cleavage, brittle tenacity, uneven to conchoidal fracture,
  estimated Mohs hardness 3-4, non-fluorescence under ultraviolet light, and calculated
  density Dcalc = 5.37(2) g/cm3 from the empirical formula and single-crystal unit-cell
  volume. In reflected light it is greyish-white, weakly bireflectant, nonpleochroic, and
  weakly anisotropic with abundant dark-brown to red internal reflections; Commission on Ore
  Mineralogy (COM) reflectance values in air (R2, R1 in %; Table 2; note Section 3 on p. 313
  prints the spectral window as "400-70 nm range" for 400-700 nm) are 15.4, 14.1% (470 nm),
  14.7, 13.6% (546 nm), 14.4, 13.4% (589 nm), and 14.1, 13.2% (650 nm). Micro-Raman
  spectroscopy (532 nm laser; Section 6.1, Fig. 3) shows bands at 669 cm-1 (strongest,
  symmetric Sb-O stretching of SbO3 pyramids), 543 cm-1 (very weak, Mn-O stretch), 522 cm-1
  (weak, antisymmetric Sb-O stretch), 460 cm-1 (strong, Mn-O stretch or Sb-O-Sb bending),
  402 cm-1 on p. 315 vs 405 cm-1 on p. 316 and Fig. 3 (weak, Sb-O-Sb bending), 348 cm-1
  (very weak), 290 cm-1 (strong, Sb-O-Sb bending), and 220 cm-1 (medium, Sb-O-Sb bending).
  Electron microprobe analysis (7 point analyses, CAMECA SX100, 15 kV, 10 nA, 2-10 um beam;
  Table 3) yielded Sb2O3 80.15 wt% (2sigma = 0.38), MnO 12.72 wt% (2sigma = 0.42), FeO
  4.98 wt% (2sigma = 0.23), As2O3 0.96 wt% (2sigma = 0.10), PbO 0.92 wt% (2sigma = 0.24),
  and MgO 0.89 wt% (2sigma = 0.10), with Bi and Zn not detected and total 100.62 wt%,
  corresponding on the basis of 4 O atoms per formula unit to the empirical formula
  (Mn2+0.64Fe2+0.25Mg0.08)Sigma=0.97(Sb3+1.97As3+0.03Pb0.01)Sigma=2.01O4. Crystallizes in the
  tetragonal system, space group P42/mbc (#135), with single-crystal X-ray diffraction
  unit-cell parameters a = 8.65159(8) A, c = 5.97175(9) A, V = 446.986(11) A3, and Z = 4
  (refined to R1 = 1.51%, R1(all) = 1.57%, wR2 = 3.74%, and GoF = 1.233 for 462 reflections
  with Fo > 4sigma(Fo) out of 475 unique reflections from 31,859 measured on a 0.040 x 0.060
  x 0.110 mm crystal using MoKalpha radiation, where Section 5.1 on p. 314 prints the
  wavelength as "lambda = 0.71703 A" for 0.71073 A). The structure consists of infinite
  [001] rutile-like chains of edge-sharing MnO6 octahedra at the 4d site (refined site
  occupancy Mn0.969(4), Mn-O1 = 2.196(2) A x 2, Mn-O2 = 2.1218(16) A x 4, BVS = 2.28 v.u.;
  mean bond distance printed as 2.147 A in Table 10 vs 2.146 A in Section 7.1 prose, exact
  mean 2.1465 A) cross-linked via corner-sharing with chains of SbO3 trigonal pyramids at the
  8h site (Sb1.00, Sb-O1 = 1.9987(11) A x 2, Sb-O2 = 1.932(2) A, mean 1.976 A, BVS = 2.72
  v.u.) whose stereoactive 5s2 lone-pair electrons project into empty [001] channels.
  Gandolfi powder X-ray diffraction (CuKalpha, 23 reflections; Section 5.2, Table 11) gives
  refined cell parameters a = 8.6273(5) A and c = 5.9683(5) A (with unit-cell volume printed
  as V = 442.23(5) A3 on p. 315 via a digit typo for a^2 * c = 444.22(5) A3), and the
  strongest observed reflections (dmeas in A (Imeas; hkl)) are 3.24 (100; 2 1 1), 1.976
  (28; 4 1 1), 2.72 (26; 3 1 0), 4.30 (22; 2 0 0), 2.45 (20; 2 0 2), 1.680 (18; 3 3 2),
  1.767 (17; 2 1 3), 1.441 (15; 4 1 3), and 2.98 (14; 0 0 2). No biological or microbial
  interaction data are reported in the type mineralogical description.
