- id: kod1_sulfur_source_comparison_graph
  name: Thermococcus kodakarensis KOD1 sulfur-source-dependent sulfide/H2 metabolism and extracellular greigite (Fe3S4) biomineralization
  description: 'Causal pathway linking strain-matched Thermococcus kodakarensis KOD1 (JCM 12380; NCBITaxon:69014; reference proteome UP000000536) sulfur-reducing and hydrogen-evolving enzymes — reviewed Swiss-Prot CoA-dependent NAD(P)H sulfur oxidoreductase NSR (TK1299, UniProtKB:Q5JGP4; EC:1.8.1.18, EC:1.6.3.2), cytosolic sulfhydrogenase subunits (TK2069 UniProtKB:A0ACM8PXE3, hydA UniProtKB:Q8NKS2, TK2070 UniProtKB:Q8NKS3, TK2071 UniProtKB:Q8NKS4, TK2072 UniProtKB:Q8NKS5), and membrane-bound NiFe-hydrogenase large subunit (TK2090 UniProtKB:Q5JIL4) — to sulfur-source-dependent extracellular iron-sulfide mineralization when early-stationary-phase cells (5 x 10^7 cells/mL in anoxic modified Ravot medium at pH 7 with phosphate and 0.05% w/v Na2S.9H2O) grown on 1 g/L elemental sulfur (S0) or 1 g/L L-cystine are exposed to 5 mM FeSO4 at 85 C in Gorlas et al. (2022): S0-grown cultures produce a 160-hour bulk Fe K-edge XANES assemblage fitted at 41% greigite (Fe3S4), 49% pyrite (FeS2), and 11%
    poorly ordered FeS (summing to 101% as printed in Table 1), whereas L-cystine-grown cultures form sparse extracellular greigite nanocrystals detected by 144-hour HRTEM/electron diffraction (Figure 3D-F) within poorly ordered FeS and iron-phosphate-rich cellular debris (below the ~5% 160-hour bulk XANES limit and without pyrite). Note: the companion 2018 Thermococcus prieurii mechanism (prieurii_extracellular_greigite, gorlas2018) remains ungrounded at the protein level because gorlas2018 does not supply an authenticated strain accession.'
  scope: REPRESENTATIVE_EXAMPLE
  mechanism_ref: kod1_sulfur_source_comparison
