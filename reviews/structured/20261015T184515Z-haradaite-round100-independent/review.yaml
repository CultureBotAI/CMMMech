- assessment_id: outcome
  area: evidence
  topic: Positive, mixed and null products with valence limits
  outcome: supported
  summary: Source-scoped laboratory formation is supported with contrary outcomes
    retained.
  details: Run6 lists haradaite as the only diffraction-assigned product, without
    quantified purity. Run8 at200 C/20000 psi/24 h is amorphous; runs9-10 at300/400
    C form haradaite. Other products include quartz, V oxides and strontium silicate;
    high-temperature blue acicular phase is unidentified. No4 bulk VO2/V2O3 equivalents
    and impurity inference cannot establish No6 site valence. p314 explicitly reads
    tetravalent; broad250-750 C stability and Fig5 are interpretations, not reversible
    phase boundaries.
  target_ids:
  - cmmmech:haradaite
  evidence_ids:
  - owner
  - ito
- assessment_id: structure
  area: evidence
  topic: Historical refinement and printed powder correction
  outcome: supported
  summary: Natural structure descriptions retain their methodological and specimen
    limits.
  details: Takeuchi/Joswig prefer Amam despite lower Ama2 residual because the latter
    gives problematic bond distances and correlated parameters; selected0kl/hk1/hk2
    levels, inadequate higher levels and zero-weighted reflections limit inference.
    Watanabe TableI explicitly deletes121; the record preserves that instruction.
    Pb/Cu/water were deducted as nonessential in the Yamato formula. No universal
    reassessment of later refinements is claimed.
  target_ids:
