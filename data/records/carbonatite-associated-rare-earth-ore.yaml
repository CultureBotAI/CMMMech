mechanisms:
  - id: culture_pretreatment_acid_leach_association
    name: Culture-pretreatment-associated increase in subsequent acid leaching
    process: bioleaching
    microbial: true
    organisms:
      - id: NCBITaxon:36861
        label: Thiobacillus denitrificans
      - id: NCBITaxon:1396
        label: Bacillus cereus
    description: >-
      A source-labelled Tmix culture pretreatment was followed by higher
      dissolved rare-earth signals during subsequent sulfuric-acid treatment
      than direct acid leaching of untreated ore. The experiment included
      microbial cultures, but no matched sterile-medium pretreatment isolates
      their contribution from acidic, iron- and sulfate-bearing medium chemistry.
      Mineral and surface changes were observed; cooperative microbial action,
      organic-acid production and the precise dissolution pathway remain
      hypotheses. The final acid-leaching stage is chemical, not demonstrated
      microbial recovery of a separated product.
    context: >-
      Section 2.1.1 sampled the Mushgia Khudag deposit in Tsogt-Ovoo soum,
      Omnogovi province, Mongolia; ore was crushed below 12.5 mm and ground
      below 0.074 mm. Section 2.1.2 reports Tmix grown in 9K medium from
      chalcopyrite-ore isolates and names the two sequence accessions above.
      ENA labels those sequences as strains 2mn and 1mn; their presence does
      not establish exhaustive community composition or separate causal roles.
      A separate ore-derived, source-labelled Bacillus sp. culture in NBRIP
      medium was also tested. Its printed identifier 4TH0UUSC016 could not be
      resolved and is not mapped to either Tmix member. Section 2.1.3 used 40 g
      ore with 80 mL of each culture in separate 250 mL flasks, 30 degrees C,
      200 rpm for 7 days. Solids were filtered, rinsed twice and dried at
      60 degrees C before 1.0 M sulfuric-acid leaching at solid/liquid ratio
      1:6, 30 degrees C, 200 rpm for 20 h. Experiments were duplicates with
      standard deviations reported. ICP-OES measured total-element leachate
      concentrations; XRD, FTIR, pH, ORP and zeta potential characterized
      associated changes. No purified REE product was isolated.
    evidence:
      - source_ref: bayarsaikhan2025
        supports: support
        explanation: >-
          Sections 2.1.1-2.2.4 and 3.1-3.3, Table 1 and Figures 2-8 support
          the mixed-ore identity and treatment-associated observation.
          Figure 3 labels TREE leaching as 27.29% for acid alone, 38.74% for
          Tmix plus acid and 29.09% for the separate Bacillus-labelled culture
          plus acid, versus 2.40% and 0.003% for the respective culture-only
          contacts. These are the article's reported solution-based extraction
          percentages, not independently reconciled whole-process yields or
          isolated-product recovery. Weak culture-only release is preserved;
          the abstract's implication of no direct REE dissolution is too broad.
      - source_ref: bayarsaikhan2025
        supports: partial
        explanation: >-
          Methods do not specify a matched sterile 9K/NBRIP pretreatment or
          a killed-cell control. They do not present a complete balance across
          pretreatment liquid, rinses, dried residue and acid leachate; the
          percentage equation uses initial ore mass without fully resolving
          interstage losses. Figure 5's initial pretreatment pH values do not
          match the later prose values of 1.6 and 4.0, so neither pair is
          promoted to a resolved initial-pH condition. The separate culture's
          Gram-negative description and unresolved printed identifier further
          limit its taxonomy. No measured organic-acid profile, oxygen uptake
          or direct cell-mineral localization establishes the proposed
          mechanism. Zeta potential was measured in filtered suspensions,
          not as a direct assay of mineral-specific attachment or metabolism.
          Reduced acid consumption, environmental benefit and industrial
          feasibility are not demonstrated by these batch measurements.
      - source_ref: thiobacillus_sequence
        supports: context_only
        explanation: >-
          The exact accession cited for Tmix resolves to the deposited
          Thiobacillus denitrificans strain 2mn partial 16S sequence and
          taxon cross-reference 36861; this is sequence provenance, not
          experimental proof of the member's metabolic contribution.
      - source_ref: bacillus_sequence
        supports: context_only
        explanation: >-
          The exact accession cited for Tmix resolves to the deposited
          Bacillus cereus strain 1mn partial 16S sequence and taxon
          cross-reference 1396. It does not resolve the separate
          Bacillus-labelled NBRIP culture or demonstrate strain purity.
      - source_ref: bayarsaikhan2025_comparative
        supports: context_only
        explanation: >-
          Sections 2.1-2.3 and 3.1-3.2, Tables 1-2 and Figures 2-6 of the
          publisher-linked manuscript compare Mushgia Khudag and Lugiin Gol
          ores with the same Tmix accessions but different particle-size and
          loading conditions. Reported ore chemistry also differs. Shared
          investigators, culture accessions and sites prevent treating this
          as independent replication; no sample-lot equivalence is proven.
          Its culture comparisons and particle-size trends are not transferred
          into the RSC pretreatment assay, and they do not supply its missing
          sterile-medium control or validate a universal microbial advantage.
