id: cmmmech:fengruiite
name: Fengruiite
material_kind: mineral
description: >-
  Fengruiite (IMA 2024-045) is an IMA-accepted silver–copper–antimony–tellurium
  sulfosalt mineral of the pearceite–polybasite group with September 2026
  IMA-CNMNC Master List ideal formula [Ag6Sb2S7][Ag9CuS2Te2] (PDF p. 68, status
  A; IMA symbol Fru, printed as "Frui" in the Fig. 3 caption on p. 523; ideal
  composition Ag 67.20 wt%, S 12.84 wt%, Sb 10.11 wt%, Te 7.21 wt%, Cu 2.64 wt%,
  total 100 wt%), representing the first tellurium-bearing member of the
  polybasite subgroup with a Te-dominant crystallographic site in the
  [(Ag9CuS2Te2)3-] B-layer module and the polybasite-Tac (111 polytype) unit-cell
  topology. Described by Tian, Li, Fan, Bindi, Gu, Wang, Gao, Zhao, Wang, and Fan
  (2026) from a single dolomite–ankerite–quartz–sulfide vein sample at the 380 m
  level of the H5 polymetallic sulfide orebody in the Haopinggou Ag–Pb–Zn–Au
  deposit (34°10'54" N, 111°16'55" E), Xiayu orefield, ~60 km southwest of
  Luoning County, Henan Province, eastern Qinling, China (named after Canadian
  Chinese economic geologist Rui Feng, b. 1963; holotype polished section and the
  X-ray-studied single crystal deposited in the Geological Museum of China,
  Beijing, under catalogue no. GMCTM2024004, pp. 519–522). Occurs as irregular
  strip-like grains less than 20 x 80 um at boundaries between galena and
  sphalerite in Stage II Au–Ag-rich polymetallic sulfide veins (~220–265 °C,
  moderate sulfidation/telluridation), closely associated with pyrite, galena,
  sphalerite, chalcopyrite, tetrahedrite-(Zn), freibergite, stephanite, acanthite,
  cervelleite, hessite, petzite, electrum, quartz, and ankerite (pp. 520–523,
  Figs. 1–3). Macroscopically black-gray ("gray" in Abstract, p. 519) with a
  steel-gray to iron-black streak and metallic luster, brittle with uneven
  fracture, no cleavage or parting, Mohs hardness 3–4, non-fluorescent and
  nonmagnetic, and Dcalc = 6.62 g/cm3 from the empirical formula and
  single-crystal unit-cell volume (Section 4.1, p. 522); in reflected light it is
  opaque, gray with a bluish tint, with no observable pleochroism, anisotropy,
  bireflectance, or internal reflections, and reflectance values in air (400–700
  nm, 20 nm steps, Section 4.1, p. 522, Fig. 4, Supplement Table S1) spanning
  Rmax = 32.358%–44.680% and Rmin = 30.657%–36.184%. Micro-Raman spectroscopy
  (523 nm laser, 3 mW, Section 3, p. 521, and Section 4.3, p. 525, Fig. 8) shows
  bands at 144 cm-1 (coupled Ag–S/Ag–Te lattice vibrations and SbS3 pyramidal
  bending), 764 and 937 cm-1 (combination/overtone modes of pyramidally
  coordinated SbS3 groups), and 1474 and 1564 cm-1 (broad features likely
  arising from fluorescence, trace carbonaceous contamination, or epoxy resin).
  Mean of 11 WDS electron-microprobe point analyses on 2 crystals (JEOL JXA-8230,
  20 kV, 10 nA, 3–5 um beam, corroborated by 4 additional analyses with an 8 um
  beam; Section 3, p. 521, and Section 4.2, p. 522, Table 1) yielded Ag 66.92 wt%
  (range 65.89–68.63, SD 0.84), S 12.88 (12.56–13.11, SD 0.17), Sb 9.61
  (9.14–10.13, SD 0.33), Te 6.80 (6.34–7.56, SD 0.34), Cu 3.43 (3.26–3.76, SD
  0.17), As 0.10 (0.01–0.29, SD 0.09), total 99.74 wt%, corresponding on 29 apfu
  to the modular empirical formula
  [(Ag5.87Cu0.29)Sigma6.16(Sb1.89As0.03)Sigma1.92S7][Ag9CuS2(Te1.28S0.63)Sigma1.91]
  (printed in Abstract, p. 519, and Section 4.2, p. 522, with a typographical
  "S1.91" in place of "Sigma1.91" after "(Te1.28S0.63)") and simplified formula
  [(Ag,Cu)6Sb2S7][Ag9CuS2(Te,S)2]. Trigonal, space group P-3m1 (no. 164), Z = 1
  (Section 4.3, pp. 522–526, Tables 2–5, Figs. 5–7): single-crystal MoKalpha XRD
  refinement on a 0.02 x 0.02 x 0.01 mm crystal (Rigaku XtaLAB AFC12 (RINC) Kappa
  single diffractometer, 548 observed reflections with I > 2sigma(I) out of 626
  independent, 3288 measured, Rint = 0.050, R1 = 0.0667 in text / 0.067 in Table
  2, wR2 = 0.109, S = 1.29, refined formula Ag15CuSb2S9.64Te1.36, Mr = 2407.68)
  gives a = 7.6087(9) Å, c = 11.970(2) Å, V = 600.13(17) Å3, with alternating
  [(Ag6Sb2S7)2+] A-layer modules (isolated trigonal-pyramidal SbS3 groups with
  Sb–S3 = 2.429(3) Å x 3 and Sb–S4 = 2.762(5) Å, plus split Ag1/Ag2 sites at 6i
  with occupancies 0.78(4)/0.21(4)) and [(Ag9CuS2(Te,S)2)2-] B-layer modules
  (linear [S2–Cu–S2] dumbbells with Cu–S2 = 2.275(8) Å x 2, disordered Ag3/Ag4/Ag5
  sites at 12j, and a Te-dominant mixed 2d site Te1/S1 with occupancy
  Te0.680(12)S0.320(12)); X-ray powder diffraction on the same crystal (Rigaku
  XtaLAB Synergy-DW, CuKalpha radiation, 40 kV, 30 mA, Section 3, p. 521, and
  Section 4.3, p. 524, Table 4) refines to a = 7.6087(11) Å, c = 11.9700(7) Å, V
  = 600.13(21) Å3, with eight strongest reflections [dobs in Å (Iobs; hkl)] at
  3.030 (100; 2-12), 2.905 (79; 112), 2.553 (48; 203), 1.903 (43; 4-20), 2.427
  (39; 2-14), 2.212 (36; 2-15), 2.992 (34; 004), and 1.716 (29; 007). Distinct
  from polybasite, cupropolybasite, selenopolybasite, benleonardite, and
  cervelleite; no criticality designation for fengruiite itself, no microbial or
  biological mechanism, and no industrial recovery yield are asserted.
