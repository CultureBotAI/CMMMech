limitations:
- CuO assignment applies to the characterized heated product; unheated phase identity
  and necessity of fungal conditioning remain unknown.
- Source peak-list/range discrepancies, sulfur-rich EDX andCuI/CuII surface fits prevent
  pure-product and precisephasefraction assertions.
- Centrifugation-derived biomass-free filtrate is source-reported; sterility is not
  experimentally demonstrated.
- The21-page original and fullXML were available. XML contains no supplementary-material
  node; the live MDPI landing-page open failed, so comprehensive current supplement
  discovery is not claimed.
- Insecticidal and wheat experiments were not scientifically re-reviewed or imported
  into this mineral formation record.
- Bounded notice screening is not proof that all corrections or counterevidence have
  been found. Structural validation does not prove scientific truth.
notes:
- No owner or history edits by this reviewer. Each primary, authority and database
  evidence row binds a nonempty exact local artifact and SHA256.
- Source labels and experimental phase assignments retain their stated limits; no
  inherited elemental criticality or industrial deployment is asserted.
