id: cmmmech:chalcopyrite-enargite-concentrate
name: Chalcopyrite-enargite concentrate
material_kind: primary_resource
description: Mixed copper-sulfide mineral concentrates represented by the D3, Eb and Ea feeds in Oyama et al. (2021), distinct from the constituent chalcopyrite and enargite mineral species, the nearly pure model chalcopyrite tested separately in that paper, and the DC-I/DC-II/DC-III enargite-pyrite concentrates examined in Okibe et al. (2022). Figure 1 reports chalcopyrite/enargite/pyrite contents of 12/21/30 wt% for D3, 17/6.7/36 wt% for Eb and 8/24/10 wt% for Ea; bornite, chalcocite, geerite and other phases also occur. The displayed Ea phase labels total 97%, so the figure is not treated as a closed compositional balance. Mine, batch and beneficiation details are not established; the acknowledgments identify an academic supplier for Ea. This owner denotes concentrated geological feed, not a documented discarded residue, a pure phase or a traded product specification. No mineral identifier or constituent criticality designation is inherited.
sources:
- id: oyama_2021
  title: Oyama K, Takamatsu K, Hayashi K, Aoki Y, Kuroiwa S, Hirajima T and Okibe N (2021). Carbon-Assisted Bioleaching of Chalcopyrite and Three Chalcopyrite/Enargite-Bearing Complex Concentrates. Minerals 11(4):432, DOI 10.3390/min11040432. Complete official v2 PDF, 13 pages, Figures 1-6; original three-page supplement, Figures S1-S4. Sections 2.1-2.5 and 3.2 support the mixed-feed assays; model-mineral experiments are separate.
  url: https://doi.org/10.3390/min11040432
  accessed_on: '2026-10-12'
