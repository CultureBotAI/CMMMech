id: cmmmech:skogbyite
name: Skogbyite
material_kind: mineral
ima_symbol: Skb
description: >-
  IMA-approved zirconium-magnesium-manganese oxy-orthosilicate mineral of the braunite group
  (IMA 2023-085; symbol Skb in the primary description and Skg in the IMA Master List; status
  A, Approved 2024; full description published April 2025) with ideal end-member formula
  Zr(Mg2Mn3+4)SiO12 (written Zr(Mg2Mn3+4)O8(SiO4) in the September 2026 IMA Master List, PDF
  p. 201; requiring Mn2O3 54.46 wt%, ZrO2 21.26 wt%, MgO 13.91 wt%, SiO2 10.37 wt%, total
  100.00 wt%; Jonsson et al., 2025, European Journal of Mineralogy 37:269-277). Represents
  the Mg-dominant analogue of gatedalite, Zr(Mn2+2Mn3+4)SiO12, via the homovalent
  substitution Mn2+ <-> Mg2+, and is named after Swedish mineralogist Henrik Skogby (b. 1956)
  of the Swedish Museum of Natural History, Stockholm. Discovered in a complex regionally
  metamorphosed (Svecokarelian, ca. 1.87-1.80 Ga, 3-4 kbar, 550-600 degC) carbonate-silicate
  assemblage collected from the mine dumps of the Langban Fe-Mn oxide deposit, Filipstad
  Municipality, Varmland County, Bergslagen ore province, Sweden (59.86 deg N, 14.27 deg E),
  where it occurs as isolated microblasts in a Mn-bearing phlogopite, calcite, and dolomite
  groundmass and as inclusions within poikiloblastic pinakiolite, associated with
  hausmannite, jacobsite, macedonite, sparse baddeleyite, and late fracture-filling native
  lead, litharge, and hedyphane; holotype material (rock sample, polished thick and thin
  sections, and the mounted single crystal) is deposited at the Swedish Museum of Natural
  History (Naturhistoriska riksmuseet), Stockholm, Sweden, under catalogue number
  GEO-NRM20230033. Forms sparse, variably zoned, rounded to subhedral bluish-grey crystals
  mostly <=60 um (up to ~120 um) with a brownish-grey streak, sub-metallic lustre, opaque
  diaphaneity, brittle tenacity, no observed cleavage, parting, or twinning, estimated Mohs
  hardness 6-6.5 (by analogy with braunite and relative polishing hardness), calculated
  density Dcalc = 4.821 g/cm3 from the empirical formula and single-crystal unit cell, and
  axial ratio reported on p. 271 as "c : a = 0.4999" (which is the inverted ratio a : c =
  9.4914 / 18.9875 = 0.49988, whereas true c : a = 2.0005). In plane-polarized reflected
  light it is bluish-grey with moderate reflectance (estimated ~17-21% in air by analogy with
  gatedalite), weak bireflectance, weak anisotropy, no pleochroism, and no internal
  reflections. Attenuated total reflectance Fourier-transform infrared (FTIR-ATR)
  spectroscopy (650-4000 cm-1; Figure 2) displays a strong Si-O stretching band at 904 cm-1
  (shifted to lower energy compared with ~945 cm-1 in braunite due to Zr4+ replacing Mn2+ at
  M(1)). Wavelength-dispersive electron microprobe analysis (19 point analyses, JEOL
  JXA-8530F Hyperprobe, 15 kV, 20 nA, 1 um beam; Table 1) yielded Mn2O3 56.02(212) wt% (range
  54.80-62.52), ZrO2 14.24(91) wt% (11.43-15.88), SiO2 10.51(59) wt% (10.27-11.15), MgO
  9.86(146) wt% (7.79-11.02), Fe2O3 3.78(26) wt% (3.52-5.57), Ce2O3 2.80(113) wt% (0.51-4.39),
  Al2O3 0.79(19) wt% (0.65-1.08), ZnO 0.09(3) wt% (0.05-0.14), CaO 0.06(7) wt% (with printed
  range 0.02-0.05 wt% below the printed mean 0.06 wt%), PbO 0.04(5) wt% (0-0.17), La2O3
  0.01(1) wt% (0-0.08), and Na2O 0.01(1) wt% (0.00-0.02), with Table 1 printing Total =
  98.42 wt% whereas the arithmetic sum of the 12 printed mean oxides is 98.21 wt% (a 0.21 wt%
  tabulation discrepancy). Combined with single-crystal site-scattering optimization on the
  basis of 12 O atoms per formula unit, the empirical crystal-chemical formula is
  M(1)(Zr4+0.69Ce3+0.10Mg0.06Ca0.01Zn0.01Pb0.01)Sigma0.87M(2)(Mn3+1.56Mg0.35Al0.09)Sigma2.00M(3)(Mn3+1.17Mg0.55Fe3+0.28)Sigma2.00M(4)(Mn3+1.50Mg0.50)Sigma2.00Si1.04O12
  (or merged as (Zr4+0.69Ce3+0.10Mg0.06Ca0.01Zn0.01Pb0.01)Sigma0.87(Mn3+4.23Mg1.40Fe3+0.28Al0.09)Sigma6.00Si1.04O12,
  where the rounded M(1) cation subscripts sum to 0.88 apfu vs printed Sigma0.87).
  Crystallizes in the tetragonal system, space group I41/acd (#142), with single-crystal
  X-ray diffraction unit-cell parameters a = 9.4914(4) A, c = 18.9875(10) A,
  V = 1710.52(17) A3, and Z = 8 (refined to R1 = 0.0460, R1(all) = 0.0675, wR2 = 0.1154, and
  GoF = 1.110 out of 903 unique reflections from 10,422 measured on a 0.08 x 0.08 x 0.09 mm
  crystal with MoKalpha radiation, with the Abstract on p. 269 stating 648 unique reflections
  with I > 2sigma(I) whereas Section 6.2 on p. 273 and Table 3 on p. 274 report 658 unique
  reflections with I > 2sigma(I)). The braunite-type structure (Tables 4-6) consists of
  eight-coordinated M(1) distorted cubes (<M(1)-O> = 2.292 A, refined s.o. Zr0.944(7), BVS =
  2.97 v.u.), three Jahn-Teller-distorted octahedra M(2) (<M(2)-O> = 2.056 A, BVS = 2.58 v.u.),
  M(3) (<M(3)-O> = 2.079 A, BVS printed as 2.34 v.u. vs unrounded sum 2.32 v.u.), and M(4)
  (<M(4)-O> = 2.068 A, BVS printed as 2.43 v.u. vs unrounded sum 2.44 v.u.), and regular SiO4
  tetrahedra (Si-O(3) = 1.636(3) A x 4, BVS = 3.88 v.u.). The seven strongest simulated
  powder X-ray diffraction lines (dcalc in A (Icalc; hkl), CuKalpha, Table 2) are 2.740 (100;
  2 2 4), 1.678 (31; 0 4 8), 1.431 (16; 2 6 4), 1.678 (13; 4 4 0), 5.480 (12; 1 1 2), 2.373
  (11; 0 4 0), and 1.431 (10; 2 2 12). No biological or microbial interaction data are
  reported in the type mineralogical description.
