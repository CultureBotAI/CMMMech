  accessed_on: '2026-10-16'
- id: botto2002
  title: >-
    Botto IL, Barone VL, Sanchez MA (2002). Spectroscopic and
    thermal contribution to the structural characterization of
    vandenbrandeite. Journal of Materials Science 37:177-183.
    DOI 10.1023/A:1013182917829. Complete published seven-page
    article acquired from the University of La Plata repository.
    Specimen preparation and furnace methods pages 177-178;
    thermal results pages 180-181; original Figures 4-6 pages
