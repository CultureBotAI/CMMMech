      explanation: Placed under the P112 promoter in the combined B58 delta-pstS, P112:mgdh strain in Schmitz et al. (2025), increasing dissolved REE extraction from Zappall allanite concentrate by 53.1% (10% w/v) and 73.1% (1% w/v) relative to wild-type B58 (relative improvements over wild-type rather than absolute ore recovery), while Discussion leaves unresolved whether engineering changed biolixiviant concentration or composition and UniProtKB:P27175 is a 621H proteome proxy.
  evidence:
  - source_ref: schmitz2025
    supports: support
    explanation: Figures 1-3 and Results support increased solution extraction for selected engineered cultures relative to wild-type, with the combined pstS deletion and P112:mgdh strain performing best among those tested. The reported 53.1% improvement at 10% pulp density and 73.1% at 1% are relative increases over wild-type, not absolute ore recovery percentages. Figure 3 displays much smaller extraction fractions. No isolated product, closed process mass balance or industrial performance was established.
  - source_ref: schmitz2025_data1
    supports: partial
    explanation: All Data rows 23-25 contain no-bacteria controls with much higher pH and lower dissolved REE totals than the cultures. They support a culture-associated effect but do not isolate acidity, secreted composition and cell contact using matched-pH or matched-metabolite controls. Figure 1 does not plot these rows.
  - source_ref: schmitz2025_data2
    supports: support
    explanation: Figures 2A and 2B rows 2-4 and 20-22 record the wild-type and combined-mutant triplicates. Cell S22 calculates fractional improvement relative to the wild-type mean; this confirms the relative denominator. Other promoter and deletion combinations have smaller or absent additional effects. Leachate composition similarities in Figure 2C do not demonstrate selective separation of rare earths from all co-leached elements.
  - source_ref: schmitz2025_data3
    supports: partial
    explanation: Figure 3 sheet compares source-labelled 1% and 10% arms and calculates extraction using its mineral-sand row 21 as denominator. Its total omits Er and Sc, whereas other datasets include different element sets; it is not a universal total-REE definition. Calculation sheets also contain other pulp-density and volume combinations whose mapping to the main plotted arm is not fully explained. Absolute yields and new normalized measurements are therefore not promoted to structured observations.
  - source_ref: schmitz2025_supplement
    supports: partial
    explanation: Figure S1 records longer lag phases of pst deletion mutants in a separate plate growth assay. Figure S2 shows substantially greater REE extraction by neat nitric acid than by the engineered biolixiviant under its own vortexer conditions. This is counterevidence to general superiority over chemical leaching, not refutation of the narrower genotype comparison. Figures S3-S4 are qualitative sausage exposure demonstrations, not toxicological validation or a process life-cycle assessment.
  - source_ref: schmitz2025_data6
    supports: partial
    explanation: Figure S2 source sheets contain four rows per treatment, distinct from the main-text triplicates. They include medium-only, wild-type, combined-mutant and nitric-acid arms. The Panel B genotype label omits the pstS deletion while the corresponding Panel A label includes it; the main figure identifies the combined mutant. The discrepancy is retained, and no pooled quantitative selectivity or product-purity claim is made.
  - source_ref: schmitz2025
    supports: context_only
    explanation: The Discussion explicitly leaves unresolved whether engineering changed biolixiviant concentration or composition and presents pho regulation and oxygen-transfer explanations as hypotheses. Prior-study phosphor/catalyst economics and author commercialization interests are not deployment evidence for this allanite feed. The related 2023 preprint represents the same study, not independent replication.
