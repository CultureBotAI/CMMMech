id: cmmmech:studtite
name: Studtite
material_kind: mineral
description: >-
  Studtite is the uranyl peroxide hydrate mineral
  (UO2)(O2)(H2O)2·2H2O, distinct from the lower hydrate metastudtite,
  elemental uranium, uranyl oxide hydrates and uranium commodities.
  The September 2026 IMA list gives grandfathered status G; 1947
  denotes the original-description year, not an approval accession.
  Burns and Hughes determined the monoclinic C2/c structure using
  natural Krunkelbach material from museum specimen RC4372. The
  peroxide-linked uranyl chains contain coordinated water and are
  connected through hydrogen bonding involving interstitial water.
  Natural identity, synthetic thermal treatment and surface alteration
  of synthetic U3O8 are separate evidence populations. No criticality,
  microbial involvement or industrial deployment is inferred.
