    description: Bioleaching at 5 g/L increases mobilized Fe from 421 to 1234 mg/kg tailings (~631 mg/kg at 10 g/L; ~150-213 mg/kg at 30 g/L) alongside Ni, Mn, and Al release, whereas dissolved Cr peaks early (up to ~2.2 mg Cr(VI)/kg, <0.25% total Cr) and then declines.
