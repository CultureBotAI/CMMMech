- id: tenailleau2006
  title: Tenailleau, C., Pring, A., Etschmann, B., Brugger, J., Grguric, B. and Putnis, A. (2006). Transformation
    of pentlandite to violarite under mild hydrothermal conditions. American Mineralogist 91:706–709.
    DOI 10.2138/am.2006.2131; complete four-page letter, Methods, Results, Discussion and Figures 1–4.
  url: https://doi.org/10.2138/am.2006.2131
