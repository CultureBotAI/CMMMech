id: cmmmech:zippeite
name: Zippeite
material_kind: mineral
description: >-
  Zippeite is the potassium uranyl sulfate hydroxide hydrate mineral
  with the September 2026 IMA formula K2[(UO2)4(SO4)2O2(OH)2](H2O)4,
  redefined status Rd and entry 1971-029a. It is a mineral species,
  distinct from the zippeite group, other cation-dominant group members,
  elemental uranium and a uranium commodity. The natural species must
  not be equated without qualification to the K3, three-water synthetic
  compound called zippeite by Burns and colleagues in 2003. The latter
  was refined in C2; the natural material discussed by Plasil and
  colleagues in 2014 was indexed in C2/m. Their original powder-XRD
  result for fine-grained zippeite II from the Cervena vein, Jachymov,
  Czech Republic gave a = 8.844(1), b = 14.115(2), c = 8.856(1)
  angstrom, beta = 104.785(8) degrees and V = 1068.9(3) cubic angstrom
  (Table 29). This is distinct from the zippeite I single-crystal
  values reproduced from their earlier 2011 study. Figures 13-14 show
  crystalline aggregates and powdery coatings in the natural weathering
  assemblage. The proposed later precipitation of the powdery material
  is a petrographic interpretation, not a timed or controlled conversion.
  Formation pH, temperature, aqueous composition and uranium mass balance
  were not directly established for that event. This record accepts
  natural identity and occurrence evidence; no criticality designation,
  microbial process, extraction yield or industrial recovery is inferred.
