id: cmmmech:nickel-sulfate-hexahydrate
name: Nickel sulfate hexahydrate commodity
material_kind: commodity
description: Manufactured crystalline nickel sulfate hexahydrate products with nominal
  formula NiSO4.6H2O. This commodity is distinct from nickel metal, other sulfate hydrates,
  aqueous nickel-bearing leachates and a naturally occurring mineral specimen. Primobius
  identifies a hexahydrate product for lithium-ion cathode precursors and publishes
  a minimum nickel content of 22.0 wt%; Coremax version 8 specifies more than 22.3 wt%
  Ni for its battery-labelled product and permits customer-specific requirements. These
  examples establish a traded product form, not one universal battery-grade composition
  or evidence that every nickel sulfate product meets cathode requirements. Coremax
  also lists electroplating use. No criticality designation or microbial production
  of qualified sulfate crystals is asserted here.
