id: cmmmech:coal-beneficiation-waste
name: Coal beneficiation waste
material_kind: secondary_resource
description: >-
  Heterogeneous discarded material generated by coal beneficiation, represented
  by gravity/flotation processing dumps of the Lviv-Volyn coal basin and the
  Chervonogradska central concentrating factory. This secondary resource is
  distinct from natural coal, coal combustion ash, mine-drainage treatment
  solids, a particular germanium mineral and elemental germanium. The studies
  describe native-community-associated laboratory leaching of selected dump
  samples; their compositions and outcomes are not universal waste properties.
  Constituent criticality, selective metal products and industrial deployment
  are not inferred.
sources:
- id: blayda2012
  title: >-
    Blayda, Baranov, Vasyleva, Vasyleva, Nemertsalov, Slyusarenko and
    Kamskaya (2012). Complex Assessment of the Waste Coal Beneficiation
    in Terms of Their Phytotoxicity, the Possibility of Recycling and
    Detoxification. Energotekhnologii i Resursosberezhenie 2:37-43.
    Complete original Russian article, Methods p39, Tables 1-2 and Figures 1-3.
    University repository item and original seven-page PDF; no DOI asserted.
  url: https://dspace.onu.edu.ua/items/1db891e3-f8fc-4e42-862f-520085833a0f
  accessed_on: '2026-10-12'
- id: vasyleva2016
  title: >-
    Vasylieva, Blayda, Sliusarenko, Vasylieva and Chitrich (2016).
    Bacterial Leaching of the Metals from Waste Flotation of Coals with
    the Participation of Thiosulfate, Ferrous and Ferric Iron.
    Microbiology and Biotechnology 3(35):43-56, published 22 September 2016.
    DOI 10.18524/2307-4663.2016.3(35).77956; complete original article,
    Methods pp44-45, Table 1, Figures 1-4 and discussion pp50-52.
  url: https://doi.org/10.18524/2307-4663.2016.3(35).77956
  accessed_on: '2026-10-12'
mechanisms:
- id: native_community_associated_acid_leaching
  name: Native-community-associated leaching of coal beneficiation dumps
  process: bioleaching
  microbial: true
  description: >-
    Blayda and colleagues treated dump material containing an indigenous
    acidophilic sulfur-oxidizing community with acidic mineral media and
    different added substrates. The reported transfer of germanium and
    other metals into solution supports a community-associated leaching
    observation. Acid dissolution and reagent chemistry were not separated
    from biological contributions, and the study does not establish a
    particular organism, enzyme or microbial enhancement.
  context: >-
    The 2012 feed came from dumps of the Lviv Coal Company central
    beneficiation factory, generated by gravity and flotation processing
    of coal from the Lviv-Volyn basin. Table 1 reports 25.8 mg/kg Ge and
    12.1 mg/kg Ga in the selected waste. Leaching used 0.5 L flasks at
    30.0 plus or minus 2.0 degrees C, solid:liquid ratio 1:10 and pH about
    1.8 maintained by addition of 0.5 mol/L sulfuric-acid reagent; that
    concentration is not the final slurry acid concentration. Medium 9K
    without an added energy source was solution 1; solutions 2-5 added
    Fe(II), sodium thiosulfate, thiourea and sulfur, respectively. The
    paper does not specify their doses, leaching endpoint duration,
    working liquid volume, agitation, particle pretreatment, biological
    replicate count or a strain accession. The native community is not
    an authenticated pure culture. Solid analyses used emission
    spectrometry; solution Ge used extraction-photometry as a
    germanomolybdate complex with prior impurity separation. Other
    dissolved metals were measured by atomic absorption.
  evidence:
  - source_ref: blayda2012
    supports: support
    explanation: >-
      Table 2 labels its values as percentages transferred from dump
      material into solution. It reports 99.9 percent Ge for the basal,
      Fe(II), thiourea and sulfur treatments, versus 55.0 percent for
      thiosulfate. Ga is reported as 99.9 percent for basal and Fe(II),
      90.5 percent for thiosulfate and thiourea, and 70.6 percent for
      sulfur. These are reported leaching fractions, not isolated-metal
      yields. Ge already reaches the same reported value without an added
      energy source; the table does not demonstrate a Ge advantage from
      adding Fe(II), thiourea or sulfur.
  - source_ref: blayda2012
    supports: partial
    explanation: >-
      The basal medium treatment contains the native community and is
      not a sterile abiotic control. No matched sterilized feed, killed
      biomass or acidity-matched cell-free leach is displayed. The paper
      provides neither a calculation formula nor a closed solution/residue
      mass balance for the percentages, and supplies no leaching error
      bars or biological replicate count. Repeated 99.9 values are not
      evidence of complete recovery beyond their reported precision.
      Introduction-level mineral proportions are not a phase analysis of
      each treated aliquot, and no germanium host phase or dissolved
      oxidation state is demonstrated.
  - source_ref: blayda2012
    supports: partial
    explanation: >-
      Figures 1 and 3 concern a separate three-day wheat germination assay,
      not the leaching duration or a microbial control. Figure 3 plots
      values above 100 on an axis labelled seed germination percent and
      differs from Figure 1 for untreated dump material. The text does
      not resolve that normalization. Table 1's Mn value also differs
      markedly from the introductory bulk MnO description. The broad
      detoxification and economic claims are therefore not adopted as
      verified safety, field restoration or commercial feasibility.
- id: native_community_reagent_comparison
  name: Reagent-dependent leaching in native-community flotation waste assays
  process: bioleaching
  microbial: true
  description: >-
    The separate 2016 study compared iron and sulfur-reagent treatments
    of coal-flotation dump material containing a mesophilic acidophilic
    chemolithotrophic community. Germanium appeared in the leach liquor
    with different time courses. Greater reported dissolved Ge in the
    higher-ferric treatment coincided with little or no reported liquid
    culture growth, whereas ferrous treatment supported much greater
    growth. This contrast does not establish that microbial growth caused
    the higher Ge release or that a direct-contact pathway operated.
  context: >-
    The source identifies Chervonogradska central concentrating factory
    flotation waste from the Lviv-Volyn basin; Table 1 reports Ge
    26.0 plus or minus 0.1 mg/kg. Waste was crushed to 1-3 mm. Leaching
    used a 9K mineral background, 0.5 L laboratory vessels and reported
    solid:liquid ratio 1:10. Methods specify pH at or below 2.0 and
    one to four weeks; displayed time courses span seven days and show
    pH rising above 2.0. The nominal ferrous-salt treatment is given as
    44.5 g/L in Methods but 44.4 g/L in captions, with 8.96 g/L Fe(II)
    stated in Methods. Ferric-sulfate additions were nominally 3, 6, 9
    and 15 g/L; the sulfur-reagent treatment was 5 g/L. Salt hydration
    and the source's parenthetical elemental-iron equivalents are not
    independently reconciled. The medium's calcium-nitrate dose,
    incubation temperature, mixing rate, inoculum preparation and
    biological replication are not supplied. The community is described
    by microscopy and dilution counts without a taxon or strain accession.
    Solution metals were measured by atomic absorption.
  evidence:
  - source_ref: vasyleva2016
    supports: support
    explanation: >-
      Figure 2 shows approximately 1.5 mg/L Ge after seven days for
      nominal 15 g/L ferric sulfate, versus approximately 0.5 mg/L for
      the ferrous treatment. These are approximate plotted solution
      concentrations, not recovery percentages. The lower ferric
      additions produce different trajectories. Page 50 reports strong
      growth with ferrous iron but no observed growth in the ferric
      liquid phase, despite reporting nonzero cell counts. The latter
      is not a sterile arm or proof that cells attached to mineral surfaces.
  - source_ref: vasyleva2016
    supports: partial
    explanation: >-
      No matched sterile ferric, ferrous, sulfur-reagent or acid-only
      time course isolates a microbial effect. The authors describe
      mechanisms as disputed and not finally established. Proposed
      contact, sulfur-inclusion, iron-redox and mineral-destruction
      explanations are not direct measurements of causality or
      germanium phase conversion. Ferric chemistry, acidity and matrix
      effects remain alternatives. No purified germanium product,
      sampling-corrected mass balance or industrial operation is shown.
  - source_ref: vasyleva2016
    supports: partial
    explanation: >-
      The abstract prints Na2S2O5, Figure 1 labels Na2S2O3 and the
      Figure 2 caption prints Na2S3O5 while the prose calls the reagent
      thiosulfate. Figure 2's sulfur-labelled curve eventually exceeds
      the ferrous curve despite the broad low-efficiency sulfur claim.
      The reported 15.0 percent extraction statement on page 48 is not
      reconciled with the displayed concentration trajectories and
      Figure 1 percentage comparisons. Eh axes and prose use mV for
      values around 0.25-0.65, without a resolved reference or unit
      correction; initial pH and Eh prose also differ from the graphs.
      No unified extraction percentage, corrected reagent formula or
      calibrated redox potential is inferred from these conflicts.
  - source_ref: blayda2012
    supports: context_only
    explanation: >-
      The earlier paper concerns the same regional waste family and
      overlapping authors, but different reported feed compositions,
      treatment sets and incompletely specified endpoints. Its 99.9
      percent Ge results cannot be pooled with or used to calibrate the
      2016 concentration graphs. Sample identities and independence of
      the feed batches are unresolved; these papers are not presented
      as independent replication of a uniform process yield.
