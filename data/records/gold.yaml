    annotation_note: 'Grounded to parental Cupriavidus metallidurans CH34 reference proteome UP000002429 (NCBITaxon:266264; UniProtKB organism string: Cupriavidus metallidurans (strain ATCC 43123 / DSM 2839 / NBRC 102507 / CH34); chromosomal locus Rmet_0262 retained in plasmid-free derivative AE104) while mechanism organism is species-level NCBITaxon:119219.'
    evidence:
    - source_ref: hirth_2024
      supports: partial
      explanation: Hirth et al. (2024) Discussion proposes respiratory-chain interactions and stock-dependent Au(III) chloride/hydroxide speciation to explain why 50 uM aqua-regia-prepared Au(III) stock yielded periplasmic particles at 72 h (Figure 2A) whereas commercial TraceCERT HAuCl4 (50 uM for 70 h, 15 uM for 21 h, 50 uM for 30 min; Figure 2B-D) caused cell damage or no visible particles; direct coxA catalysis was not experimentally tested.
  evidence:
  - source_ref: hirth_2024
    supports: support
    explanation: 'Results, No appearance of gold nanoparticles in the periplasm; Figure 2A and its caption; Methods, Bacterial strains and growth conditions and Transmission electron microscopy: the previous stock gave source-assigned periplasmic particles after 72 h. The original Figure 2 was inspected. The figure is microscopy evidence with an author-assigned particle identity, not a new phase-resolved product-purity or bulk mass-balance measurement.'
  - source_ref: hirth_2024
    supports: partial
    explanation: 'Figure 2B-D and the same Results subsection retain the negative commercial-stock outcome: long exposures damaged cells, whereas the short-exposure panel showed cells without the reported particles. The authors discuss alternative directions of causality between toxicity and failed particle formation. The 70-h figure label differs from the general 72-h protocol and the prose description of three days. The figure does not quantify the fraction of all cells forming particles, a detection limit, or a conversion yield.'
  - source_ref: hirth_2024
    supports: partial
    explanation: Discussion, The procedure used to produce Au(III) solutions has biological consequences, and Conclusion propose stock-speciation, respiratory-chain and copper-homeostasis explanations. The specific chloride/hydroxide species and chlorine-manufacturing route are hypotheses here, not directly measured stock compositions or a demonstrated exclusive pathway. This microscopy comparison supplies no matched cell-free or killed-cell series establishing metabolic necessity. Laboratory particle association does not demonstrate permanent environmental immobilization, isolated gold recovery, or industrial deployment.
  - source_ref: hirth_2024_si
    supports: context_only
    explanation: Supplementary Table S4 (PDF page 6) explicitly identifies AE104 as a plasmid-free derivative of CH34 and lists the genetic derivatives used elsewhere in the paper. These genotypes are not transferred to the parental AE104 microscopy panels; neither the strain table nor the species identifier proves a particular molecular mechanism.
