  summary: Figures2–4 sharp culture peaks versus sterile amorphoushump support crystallization.
    Figures5/6/8 corroborate phosphate/Mg/association/fringes, but Mg also occurs
    in sterile material and is not unique phase proof. Figure3 comparator and p12
    text preserve Mg-stabilizedbetaTCP; calcined FTIR and Table2bulkCa/P do not resolve
    hydrogen-site identity. Nanorods only HAP-like. Relative91.7/100percent crystallinity
    againstbetaTCP is not phase purity or recovery.
