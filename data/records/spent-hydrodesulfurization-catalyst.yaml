  evidence:
  - source_ref: ferreira_2017
    supports: support
    explanation: Methods pp. 120-122 establish the diesel HDS origin, raw feed, strain provenance and separate culture/leach stages. Figures 1-3 show culture-associated acidification and sulfur-dependent activity. Table 2 reports seven-day Mo release of 39 +/-4% without added elemental sulfur and 37 +/-3% with it; Table 3 reports two-stage Mo release of 55 +/-6% at 5 g/L and 39 +/-3% at 50 g/L. These are the source’s mass-normalized leaching percentages based on feed composition and liquid analysis, not isolated-product yields. Table 3 reports low Co, Cu and Ni release rather than universal extraction of every catalyst metal.
  - source_ref: ferreira_2017
    supports: partial
    explanation: Table 2 gives seven-day commercial-acid Mo release of 65 +/-5%, exceeding both culture arms, despite the text calling the processes equivalent. For two-stage Mo, Table 3 pairs 55 +/-6% biological versus 54 +/-4% chemical at 5 g/L, and 39 +/-3% versus 41 +/-4% at 50 g/L; corresponding entries share the source’s non-significance letters. Al and V also show acid-only comparability. Uninoculated medium metal release is stated as below 0.5% but underlying data are not shown; that medium control is distinct from the stronger commercial-acid comparison. No biosurfactant production was measured, no enzyme causality was established, and nominal acid matching does not prove identical full medium chemistry or pH trajectories.
  - source_ref: ferreira_2017
    supports: partial
    explanation: Quantitative inconsistencies remain unresolved. At 50 g/L, Table 3 Al is 24 +/-2%, whereas the abstract gives 26%. The conclusion’s Ni below-5% statement conflicts with Table 2 day-seven 5 +/-2%. Figure 2 text describes 3.1 x 10^6 cells/mL as nearly unchanged although the caption specifies initial 10^5 cells/mL; Figure 3 starts nearer 10^6, preventing a confident shared inoculum/biomass trajectory. The p. 126 mass-recovery sentence reports 31.3 g/L Al, 54.6 g/L Mo and another 30.4 g/L Mo, incompatible with Table 1 feed contents at 50 g/L and with its own repeated analyte label. These numbers are not silently corrected or accepted as measured recovered concentrations. Missing Table 3 endpoint and final acid concentration prevent a fully specified optimum claim.
  - source_ref: ferreira_2017
    supports: partial
    explanation: Table 4 and Figure 4 concern local surface EDS composition and morphology; they do not establish bulk mass balance, a named crystalline product, intracellular uptake, or organic deposition merely from increased oxygen signal. Table 1 feed digestion and filtered-liquid AAS do not provide an isolated-product recovery accounting. The source’s economic and environmental advantages are proposals, not a measured cost study or deployment evidence.
  - source_ref: ferreira_2015
    supports: context_only
    explanation: This related same-group FG-01 diesel HDS paper is retained as context rather than independent replication or an additional accepted yield. Its 27.5 g/L, nominal 20 g/L sulfuric-acid, four-day protocol differs from the 2017 arms and reports chemical/biological comparability. The abstract gives about 65% Al and 25% Mo, whereas the body/conclusion give about 24-28% Al and 46% Mo. Methods say culture broth was filtered at 0.22 micrometres before leaching, but the SEM discussion assigns attached cells; the biomass state remains unresolved. Complete author-hosted text and figure captions were inspected, but full-resolution figures were not acquired in this curation. The two publications’ similar feed composition and shared strain do not establish independent feed batches.
