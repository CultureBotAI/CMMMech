id: cmmmech:boron
name: Boron
material_kind: element
description: >-
  The element B, distinct from boric acid, borate ions, borate mineral species
  and commercial borates. The unqualified boron entry in Annex II of the
  original EU 2024 critical-raw-materials regulation is mapped to this element;
  the separately metallurgy-qualified strategic entry is not broadened here.
