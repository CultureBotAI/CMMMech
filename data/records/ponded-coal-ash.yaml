id: cmmmech:ponded-coal-ash
name: Ponded mixed coal ash
material_kind: secondary_resource
description: Mixed fly and bottom ash deposited in coal-combustion ash ponds, represented here by a sample from a Philippine circulating-fluidized-bed power plant burning local and imported coal. The mixture is a distinct secondary resource from separately collected coal fly ash, pure coal bottom ash and coal-gasification slag. Its fly-to-bottom ratio, residence time and plant identity are unreported. A laboratory mixed-culture study supports qualified metal mobilization from the mixed feed; it does not resolve either ash component's individual response or establish an isolated metal product, criticality designation or industrial deployment.
sources:
- id: pangayao_2015
  title: Pangayao, van Hullebusch, Gallardo and Bacani (2015). Bioleaching of trace metals from coal ash using mixed culture of Acidithiobacillus albertensis and Acidithiobacillus thiooxidans. Journal of Engineering Science and Technology, Special Issue on SOMCHE 2014 and RSCE 2014 Conference, 36-45. Sections 2.1-2.5, Figures 1-2, Tables 1-5 and Sections 3.1-3.5; complete 10-page original.
  url: https://jestec.taylors.edu.my/Special%20Issue%208_SOMCHE_2014/SOMCHE%202014_8_2015_036_045.pdf
  accessed_on: '2026-10-15'
