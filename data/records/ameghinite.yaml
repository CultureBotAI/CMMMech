mechanisms:
  - id: abiotic-thermal-alteration
    name: Laboratory thermal alteration of natural ameghinite
    process: other
    description: >-
      Heating natural ameghinite produced an amorphous material,
      followed by a crystalline phase and melting. The original
      authors interpreted the initial major endotherm as water
      loss and the later exotherm as crystallization. These are
      specimen-specific thermal observations with partly unresolved
      product identities, not a measured boron recovery yield.
    context: >-
      Aristarain and Hurlbut studied natural Tincalayu material.
      Differential thermal analysis ran in air at one atmosphere
      from 40 to 1000 degrees C. Figure 5 specifies a heating rate
      of 25 degrees C per minute, a Pt/Pt-13%Rh thermocouple and
      Al2O3 reference. Thermal sample mass, replicate count and
      quantified purity are not reported. The approximately two
      percent tincalconite estimate pertains to the chemical-analysis
      sample and is not assigned as a measured purity of every
      thermal aliquot. The separate 850-degree, 12-hour heating
      and air-quench experiment is not the same temperature program.
      No microorganisms, processing pilot or isolated boron product
      were tested.
    microbial: false
    evidence:
      - source_ref: aristarain_hurlbut1967
        supports: support
        explanation: >-
          Figure 5 and pp. 942-943 report a major endothermic peak
          at 245 degrees C, interpreted as water loss, after which
          the material was amorphous. An exotherm at 635 degrees C
          accompanied a crystalline phase characterized by optical
          observations and listed powder-diffraction peaks. The
          reported melting endotherm peaked at 780 degrees C,
          beginning at 740 and ending at 790 degrees C. These
          temperatures describe this heating experiment, not
          demonstrated equilibrium boundaries or quantitative
          fractions of transformed material.
      - source_ref: aristarain_hurlbut1967
        supports: partial
        explanation: >-
          Minor endotherms at 165 and 190 degrees C were suggested
          to represent intermediate water-loss steps, but powder
          patterns showed only minor intensity changes. The authors
          assigned the 635-degree product to Na2O·3B2O3 while noting
          its refractive indices differed from an earlier synthetic
          compound; that assignment is not a new product-composition
          assay. A proposed phase associated with the 700-degree
          event was not found. The separate 850-degree, 12-hour
          experiment left two small crystalline phases in glass,
          too scarce for X-ray photographs or complete optical
          identification. Their proposed formulas remain tentative.
          Earlier melting values cited by this paper differ; those
          underlying historical experiments were not independently
          verified here. No mass balance or extraction efficiency
          is supplied.
