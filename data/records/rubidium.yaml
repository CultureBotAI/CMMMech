    functional_role: Photosynthetic reaction center L subunit PufL (pufL / RHOS4_18610) in Cereibacter sphaeroides strain 2.4.1 initiating light-driven cyclic electron transfer and trans-membrane electrical potential (Delta-psi) generation coupled to Rb+ uptake.
    annotation_note: 'Grounded to reviewed Swiss-Prot entry UniProtKB:Q3J1A5 (RCEL_CERS4; pufL / RHOS4_18610) in reference proteome UP000002703 for the exact experimental strain Rhodopseudomonas (= Cereibacter) sphaeroides 2.4.1 (NCBITaxon:272943; UniProtKB organism string: Cereibacter sphaeroides (strain ATCC 17023 / DSM 158 / JCM 6121 / CCUG 31486 / LMG 2827 / NBRC 12203 / NCIMB 8253 / ATH 2.4.1.)) while mechanisms[].organisms[].id is species-level NCBITaxon:1063.'
    evidence:
    - source_ref: primary
      supports: partial
      explanation: Hellingwerf et al. (1982) assayed light-dependent Rb-86 chloride uptake by intact Rhodopseudomonas (= Cereibacter) sphaeroides strain 2.4.1 cells in automated flow dialysis (Figures 4-5) driven by photosynthetic cyclic electron transport and proton-motive force, without mutating pufL.
