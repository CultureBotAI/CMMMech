assessments:
- assessment_id: identity
  area: identity
  topic: Material identity and study boundaries
  outcome: supported
  summary: Mining-generated liquid is correctly scoped as a secondary resource.
  details: The Brazilian copper-mine and Mpumalanga samples have separate source-specific
    compositions. Natural ore, elemental copper, mining solids and the covellite product
    are not merged. The record explicitly identifies the Silva2019 experiment already
    represented in covellite, preventing false independent replication.
  target_ids:
  - cmmmech:acid-mine-drainage
  evidence_ids:
  - owner
  - silva
  - akinpelu
  - search
- assessment_id: conditions
  area: scope
  topic: Biomass, substrate and conditions
  outcome: supported
  summary: Upstream biological gas generation and downstream precipitation remain
    separate.
  details: 'Silva2019: separate 1 L real-water bottles, pH 5.1, Cu 325 mg/L, 48/96
    h, filtration and 60 C overnight drying; upstream 2.3 L mixed acidophilic consortium,
    pH 4.5, 30 C, 40 rpm, 150 mL/min N2/CO2 70/30, Cu-free synthetic feed. These reactor
    settings are not assigned to the bottles. Akinpelu2021: screened stored drainage,
    Postgate enrichment, 21 d adaptation at 35 C/250 rpm, weekly 70% broth replacement,
    daily 100 mL additions for seven days then 14 d static batch. Incomplete volume
    and effluent accounting remains explicit.'
  target_ids:
  - cmmmech:acid-mine-drainage
  evidence_ids:
  - owner
  - silva
  - akinpelu
- assessment_id: quantity
  area: quantity
  topic: Concentration and product denominators
  outcome: supported
  summary: Reported concentrations are not promoted to isolated-product recovery or
    purity.
  details: Silva Table 3 Cu/S wt% pairs sum to 161.66 and 177.05%, and the mass-entry
    ratios are labeled molar elsewhere; no corrected numbers are substituted. No final
    aqueous Cu or collected solid mass closes a balance. Akinpelu Table 5 raw/post
    Cu 0.46 +/- 0.05 versus 0.04 +/- 0.001 mg/L and Fe 2308 +/- 5.51 versus 260.3
    +/- 2.78 mg/L agree with the source. Exact day/fraction and meaning of uncertainty
    remain unresolved. ICP-OES does not establish ionic valence; media, dilution and
    losses confound mass recovery.
  target_ids:
  - cmmmech:acid-mine-drainage
  evidence_ids:
  - owner
  - silva
  - akinpelu
- assessment_id: controls
  area: evidence
  topic: Controls and causal specificity
  outcome: supported
  summary: Mechanism scope matches what the controls and assays support.
  details: No matched chemical-H2S comparison establishes a unique microbial necessity
    in the Silva study. The Akinpelu consortium-free control is mentioned without
    numerical outcomes in inspected main figures/tables or Table S1. Triplicate measurements
    do not demonstrate independent biological reactors. Community abundance, pooled
    biochemical tests and proposed aminopeptidase roles do not identify a causal strain/enzyme
    or mineral product. The process labels separation and other are conservative and
    justified by the explicit text.
  target_ids:
  - cmmmech:acid-mine-drainage
  evidence_ids:
  - owner
  - silva
  - akinpelu
  - si
  - ena
