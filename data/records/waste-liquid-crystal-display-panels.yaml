  evidence:
  - source_ref: willner2018
    supports: support
    explanation: 'Section 2 and Figure 1 establish the actual waste-panel feed. Section 3.2, Figure 4A and Table 2 support increased indium in the inoculated 9K filtrate: day-35 concentrations are 13.90 versus 0.82 mg/dm3 in the sterile control. The authors report 55.6% extraction in the inoculated system relative to the feed inventory; this is a reported solution-based endpoint, not isolated indium yield or recovery from whole phones. Figure 2 shows different chemical trajectories, limiting causal interpretation of the contrast.'
  - source_ref: willner2018
    supports: partial
    explanation: 'Figure 4B and Table 2 limit any general microbial advantage: at day 35 the 9K inoculated and sterile filtrates contain 3.15 and 4.59 mg/dm3 Sn, respectively. The author-reported maxima of 90.2% and 93.4% occur on different days, 14 and 21. Concentrations then decline. The text''s peak tin concentration and percentage do not exactly agree with the nominal feed inventory, and its common 3.4% indium-control statement does not reconcile both control concentrations in Table 2. These are unresolved source quantities, not a basis for corrected or pooled yields.'
  - source_ref: willner2018
    supports: partial
    explanation: Sections 3.1-3.2, Figure 3 and Table 1 provide SEM-EDS and solution measurements, not definitive crystalline jarosite or tin precipitate identification, metal-valence measurements or proof of an exclusive Fe-mediated pathway. Proposed reprecipitation, indium oxidation and separation remain interpretations. The EDS spectrum is labelled pt1 whereas Table 1 names pt2. Neither isolated metal product, closed mass balance nor industrial deployment was demonstrated.
