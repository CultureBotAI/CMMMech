id: cmmmech:phosphogypsum
name: Phosphogypsum
material_kind: secondary_resource
description: A heterogeneous calcium-sulfate-rich residue generated during wet-process phosphoric acid manufacture from phosphate rock. It is distinct from natural gypsum mineral, phosphate-rock commodity and individual rare-earth elements. Curated laboratory evidence separates synthetic single-REE-doped model powders from an industrial residue sample. Neither experiment establishes industrial recovery, and constituent-element criticality is not inherited by the residue.
sources:
- id: antonick2019
  title: Antonick et al. (2019). Bio- and mineral acid leaching of rare earth elements from synthetic phosphogypsum. Journal of Chemical Thermodynamics 132:491-496. DOI 10.1016/j.jct.2018.12.034; Sections 2.1-2.4, 3.1-3.3 and 4.1-4.3, Tables 1-2 and Figures 1-3.
  url: https://doi.org/10.1016/j.jct.2018.12.034
  accessed_on: '2026-10-11'
- id: antonick_osti_copy
  title: OSTI 1862749, LLNL-JRNL-820031 repository manuscript of Antonick et al. (2019); PDF pages 3-8, manuscript pages 1-6. Repository cover dated 1 March 2021; this is the same experiment, not a new 2021 study.
  url: https://www.osti.gov/servlets/purl/1862749
  accessed_on: '2026-10-11'
- id: zhang2025
  title: Zhang, Qi, He, Zhang, Zhang and Su (2025). Study on the Extraction of Rare Earth Elements (REEs) from Phosphogypsum Using Gluconobacter oxydans Culture Solution. Molecules 30(3):674. DOI 10.3390/molecules30030674; Sections 2.1-2.4 and 3.1-3.3, Tables 1-2 and 4, Figures 5-8.
  url: https://doi.org/10.3390/molecules30030674
  accessed_on: '2026-10-11'
- id: ncbi_gluconobacter
  title: NCBI Taxonomy 442 - Gluconobacter oxydans; species
  url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=442&retmode=xml
  accessed_on: '2026-10-11'
mechanisms:
- id: spent_medium_synthetic_pg_leaching
  name: Gluconobacter spent-medium leaching of synthetic phosphogypsum models
  process: bioleaching
  description: Spent medium from Gluconobacter oxydans NRRL B58 mobilized rare-earth elements from separately synthesized single-REE-doped calcium-sulfate powders. The tested agent was a microbial culture-derived lixiviant; the experiment does not demonstrate a requirement for direct living-cell contact. Organic-acid complexation and kinetic effects were proposed, without resolving the full lixiviant composition or a unique pathway.
  context: The six separate synthetic feeds were doped with Y, Ce, Nd, Sm, Eu or Yb; they were not industrial phosphogypsum or a mixed-REE waste. Powders were synthesized from calcium/REE nitrate and sulfate/phosphate solutions, aged at 80 degrees C and dried at 90 degrees C; empirical hydration states in Table 1 were approximately 0.54-0.56 waters per formula unit, so a gypsum-dihydrate identity is not imposed on them. Section 2.2 describes glucose-grown B58 culture in a bioreactor by reference to prior methods; cell-removal preparation is not explicit in this paper. HPLC measured 220 mM gluconic acid and pH was 2.1. Triplicate leaching assays used 20 mg powder in 1 mL lixiviant at 25 degrees C for 24 h and 150 rpm. Filtered leachates were measured by ICP-OES; the repository manuscript prints a 0.22 mm filter unit, whose intended unit is not independently resolved here. Comparators were deionized water, commercial gluconic acid, sulfuric acid and phosphoric acid, with separate equal-pH
    and equal-molarity comparisons.
