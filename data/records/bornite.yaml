  title: 'Bobadilla-Fazzini and Poblete-Castro (2021). Biofilm Formation Is Crucial for Efficient Copper Bioleaching From Bornite Under Mesophilic Conditions: Unveiling the Lifestyle and Catalytic Role of Sulfur-Oxidizing Bacteria. Frontiers in Microbiology 12, 761997. Methods and Figures 1-6, especially bornite Figures 3-5 and the proposed mechanism in Figure 6.'
