    evidence:
      - source_ref: rehmanji2025
        supports: support
        explanation: Sections 2.1-2.2, 4.1-4.2 and 4.5-4.7 and Figures 1-2 support prepared biomass, the natural-brine experiment, carbonate-bearing solids and ex situ characterization. The narrow claim is calcite's source-assigned presence in the mixed treatment product.
      - source_ref: rehmanji2025_si
        supports: support
        explanation: Figure S7 (p. 24) explicitly labels calcite as phase 2 alongside vaterite and magnesite. Table S1 describes the brine composition; the XRD operating table is on p. 5 with its S5 caption on p. 6. Figure S5 (pp. 21-22) is the separate no-added-cell comparison. These observations are not pure-phase mineral yields.
      - source_ref: rehmanji2025
        supports: partial
        explanation: The main text misreferences the XRD plot as S6, which actually shows growth and pH. Its initial 10-minute claim conflicts with Figure 1's hour axis and Section 4.2's hour sampling schedule. Mg/Mn percentage claims do not consistently match Figure 1, whose B. subtilis Mn series also declines. No removal percentage or ten-minute rate is assigned to calcite. Section 4.4 does not clearly specify solid/liquid separation for each ICP-OES metal aliquot, preventing a stronger dissolved-only interpretation.
      - source_ref: rehmanji2025_si
        supports: partial
        explanation: Figure S5's inoculated Mn/Sr series differs from Figure 1 and is not pooled with it. Table S7 saturation indices differ from the ranges quoted in Section 2.2, including negative magnesite entries; modeled saturation cannot confirm a mineral phase. Table S2 omits the Li wavelength and S9 labels aqueous Li retention as recovery. No lithium product, mineral-specific incorporation or conversion between mg/L and mg/kg is inferred.
