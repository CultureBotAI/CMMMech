limitations:
- Natural-water uranium fate is not a closed compartment mass balance; no matched
  no-cell uranium timecourse is shown.
- Initial-culture normalization and Table S2 ratio disagree; no corrected value or
  full culture/media accounting is established.
- Paper and WGS disagree about strain isolation source; neither establishes assay-water
  collection site/date.
- Complete published XML and nine-page supplement were inspected; a publisher PDF
  was not accessible. No experiment, species delimitation or primary analytical data
  were independently replicated.
