id: cmmmech:schwertmannite
name: Schwertmannite
material_kind: mineral
description: Schwertmannite is an iron(III) oxyhydroxysulfate mineral listed as approved under IMA 1990-006 in the September 2026 IMA compilation. It is distinct from elemental iron, dissolved ferrous sulfate, jarosite and an unspecified iron precipitate. The evidence below concerns laboratory synthesis from dissolved reagents and subsequent testing of the collected material, not extraction from a natural ore or industrial mineral recovery. No criticality designation is inherited from a constituent element.
identifiers:
- id: IMA:1990-006
  label: Schwertmannite
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Schwertmannite row, PDF page 195; introductory column definitions and distribution terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: song2018
  title: Song, Liu and Wang (2018). Comparison of the Biological and Chemical Synthesis of Schwertmannite at a Consistent Fe2+ Oxidation Efficiency and the Effect of Extracellular Polymeric Substances of Acidithiobacillus ferrooxidans on Biomineralization. Materials 11(9):1739. Sections 2-3, Figures 1-7 and Table 1; complete 13-page primary article.
  url: https://doi.org/10.3390/ma11091739
  accessed_on: '2026-10-11'
