    entry_name: SQRD_ACIF2
    protein_name: Sulfide-quinone reductase
    gene_symbol: AFE_1792
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:243159
      label: Acidithiobacillus ferrooxidans ATCC 23270
    reference_proteome_id: UP000001362
    ec_numbers:
