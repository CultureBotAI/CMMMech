id: cmmmech:lemoynite
name: Lemoynite
material_kind: mineral
description: 'Hydrated sodium-calcium-zirconium phyllo/tectosilicate mineral of the lemoynite
  group with current September 2026 IMA-CNMNC approved formula Na2CaZr2Si10O26(H2O)5-6, status
  A, and approval number IMA 1968-013. Perrault, Semenov, Bikova, and Capitonova (1969) originally
  described lemoynite from pegmatites of the Mont Saint-Hilaire alkaline intrusion, Rouville
  County, Quebec, Canada, reporting a classical wet-chemical analysis (Table 2, p. 591: SiO2
  47.32, ZrO2 23.23, TiO2 0.43, Nb2O5 2.18, RE2O3 1.18, Fe2O3 1.62, MnO 0.10, CaO 5.06, SrO
  0.05, Na2O 4.75, H2O 13.33, total 99.25 wt%) and monoclinic symmetry (a = 10.48, b = 16.20,
  c = 9.07 A, beta = 105 degrees 20 minutes). Le Page and Perrault (1976) re-analyzed Mont
  Saint-Hilaire lemoynite by XRF and atomic absorption (Table 1, p. 133: SiO2 55.40, Al2O3
  0.22, ZrO2 20.30, Nb2O5 0.87, TiO2 0.49, CaO 4.40, MnO 0.04, Fe2O3 0.57, TR2O3 <1, ZnO 0.19,
  CuO 0.08, SrO 0.07, MgO 0.16, K2O 3.70, Na2O 3.02, Rb2O 0.03, H2O 9.50, total 99.04 wt%,
  showing that the 1969 analysis had underestimated SiO2 and missed K2O) and solved the crystal
  structure in monoclinic space group C2/c with doubled c axis (a = 10.384(3), b = 15.947(7),
  c = 18.601(6) A, beta = 104.59(3) degrees, Z = 4, R = 7.9% for 4200 intensities; C2/m pseudocell
  with c'' = c/2 = 9.300 A), revealing a rigid open [ZrSi5O13]2- framework of 7-A-thick hexagonal-ring
  silicate sheets linked by 6-coordinated [ZrO6] octahedra and pervaded by wide tunnels containing
  disordered Na+, K+, Ca2+, and H2O molecules. Distinct from natrolemoynite, armstrongite,
  elpidite, and elemental zirconium; no criticality designation, microbial mechanism, or industrial
  recovery yield is asserted.'
