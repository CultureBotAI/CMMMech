    evidence:
      - source_ref: han2022
        supports: support
        explanation: Section 2.2, Figure 2 and Table 1 support the specified Mg/Ca 7 and 9 time courses. Section 5.3 gives the mineralization recipe and triplicate sterile-water comparator. Figures 5 and 8 provide complementary morphology and thermal characterization; the selected phase claim is based on diffraction, not shape alone. Figure 1 records separate growth/pH/ammonium/enzyme measurements; their correlation does not prove a uniquely necessary molecular pathway in each mineralization flask.
      - source_ref: han2022_si
        supports: support
        explanation: Figure S6 panels d2/e1/e2 fit 100% monohydrocalcite among the modeled crystalline phases, while d3/e3 include hydromagnesite. Figure S5 and Table S1 provide FTIR assignments. Figure S4 shows control flasks at 0, 1, 7 and 14 days; it does not supply a 140-day control image or quantitative detection limit. The main text reports no minerals in controls, a broader assertion than this illustrated time window. Fitted percentages are not recovered mineral yields or proof of absence of amorphous material.
      - source_ref: han2022
        supports: partial
        explanation: Section 5.3 lists the lowest Mg2+ concentration as 0.01 M while Figure 2/Table 1 label the lowest Mg/Ca arm as 0 at Ca2+ 0.01 M; that inconsistency is not repaired by assuming a zero recipe. At Mg/Ca 5 and 140 days, Section 2.3 calls some morphologies MHC, whereas Table 1, Figure 2 and SI Figure S6c3 assign aragonite and hydromagnesite. This disputed arm is not used as proof of MHC persistence. The measured phase series alone cannot distinguish direct solid-state conversion from dissolution and new precipitation. Figure 9's selected ultrathin-section diffraction is interpreted by the authors as intracellular/cell-associated MHC, but does not independently authenticate WMS2 or establish a transport pathway.
      - source_ref: genbank_wms2
        supports: partial
        explanation: The accession resolves and names WMS2, but its current uncultured-Halomonas clone/environmental-sample annotation does not verify the paper's H. utahensis species and cultured-strain assignment. The experimental phenotype remains explicitly attributed to the source-designated WMS2 material.
causal_graphs:
  - id: wms2_halomonas_mg_ca_monohydrocalcite_precipitation_graph
    name: Halomonas WMS2 carbonic anhydrase, amino-acid deamination alkalinization, and Mg/Ca-dependent monohydrocalcite precipitation
    description: Causal pathway linking congeneric Halomonas carbonic anhydrase Can (UniProtKB:E1VCW5) and amino-acid deaminating enzymes SdaA (UniProtKB:E1V6X3), DadA (UniProtKB:E1VB74), and reviewed Swiss-Prot Ald (UniProtKB:E1V931) to CO2 hydration, ammonium release, and pH elevation in beef-extract/tryptone medium (with pre-added Na2CO3/NaHCO3), driving monohydrocalcite (CaCO3.H2O) formation at nominal Mg/Ca ratios 7 (100% fitted crystalline phase at 27 days) and 9 (100% fitted crystalline phase at 14 and 27 days) before monohydrocalcite/hydromagnesite mixtures appear at 140 days in WMS2 cultures (Han et al., 2022), while preserving the ON000249.1 uncultured-clone annotation conflict, Mg/Ca 0 vs 0.01 M recipe discrepancy, Mg/Ca 5 phase contradiction, and lack of matched-pH or killed-cell controls.
