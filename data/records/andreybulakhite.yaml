mechanisms:
  - id: lichen_apothecia_nickel_oxalate_biomineralization
    name: >-
      Natural biomineralization of andreybulakhite in Lecanora cf. polytropa
      apothecia coupled with oxidative Ni2+/Fe3+ weathering fractionation
    process: biomineralization
    description: >-
      Vereshchagin et al. (2025, pp. 63–65, 71–72, Figs. 1–2, Table 1) document
      that natural andreybulakhite crystallizes in the upper part of the
      fruiting bodies (apothecia) of the crustose saxicolous lichen Lecanora cf.
      polytropa overgrowing weathered pyrrhotite–pentlandite–chalcopyrite
      veinlets at the Nyud-II deposit. Oxalic acid excreted by the lichen
      mycobiont reacts with divalent cations (Ni2+, Cu2+, Mg2+, Co2+) released
      during oxidative weathering of primary sulfides and transient secondary
      sulfates (morenosite and nickelhexahydrite), precipitating platy to
      prismatic and hopper-like (Ni0.63Cu0.27Mg0.08Co0.02)(C2O4)·2H2O crystals
      intergrown with fungal hyphae. Despite growing directly on Fe-rich
      pyrrhotite (~85 vol% of the sulfide veinlets), andreybulakhite contains no
      detectable Fe (0.00 wt% across all 5 EDX analyses in Table 1, p. 65),
      which the authors attribute to natural geochemical fractionation during
      acidic sulfide oxidation (pH < 4): Fe2+ oxidizes to Fe3+ and either
      hydrolyzes as insoluble ferric oxyhydroxides or forms stable soluble
      ferric tris-oxalate complexes [Fe(C2O4)3]3-, whereas Ni2+ remains mobile
      as aquo/sulfate species until precipitating as nickel oxalate at higher pH
      within the lichen apothecia.
    context: >-
      Field and mineralogical observation of holotype specimen ML OF-978 from
      the Nyud-II Cu–Ni sulfide deposit, Monchegorsk pluton, Kola Peninsula,
      Russia (Vereshchagin et al. 2025, pp. 63–65, 71–72). The host lichen was
      identified morphologically as Lecanora cf. polytropa (open nomenclature
      cf., without molecular barcoding or isolate accession, so no species-level
      NCBITaxon CURIE is assigned), and no bulk nickel recovery yield or
      engineered bioleaching rate is reported.
    microbial: true
    evidence:
      - source_ref: vereshchagin_2025_andreybulakhite
        supports: support
        explanation: >-
          Pages 63–65 and 71–72, Figures 1–2, and Table 1 document the occurrence
          of (Ni0.63Cu0.27Mg0.08Co0.02)(C2O4)·2H2O crystal aggregates (up to 40
          x 30 x 30 um) intergrown with fungal hyphae in the upper part of
          Lecanora cf. polytropa apothecia on oxidized pyrrhotite–pentlandite–
          chalcopyrite ore, complete exclusion of Fe below EDX detection limits,
          and the oxidative Ni2+/Fe3+ fractionation and oxalate precipitation
          pathway.
  - id: abiotic_anthropotype_nickel_oxalate_precipitation
    name: >-
      Laboratory aqueous precipitation of the synthetic alpha-Ni(C2O4)·2H2O
      anthropotype of andreybulakhite
    process: other
    description: >-
      To obtain a single-phase structural and spectroscopic reference standard
      ("anthropotype") for andreybulakhite, Vereshchagin et al. (2025, pp.
      66–71, Tables 3–5, Figs. 4–5) synthesized monoclinic alpha-Ni(C2O4)·2H2O
      by aqueous precipitation at room temperature (23–25 °C) and pH 6.0–7.2
      (adjusted with NaOH) from 500 mL distilled water containing dissolved
      NiCl2·6H2O and Na2C2O4 (atomic ratio Ni/C2O4 varied from 1:1 to 5:1,
      oxalate concentration 0.01 M). After aging the solution with precipitate
      for 5 days, filtering, washing with distilled water, and drying at room
      temperature, powder X-ray diffraction (Table 5, p. 69) confirmed pure
      monoclinic C2/c alpha-Ni(C2O4)·2H2O with a = 11.837(6) Å, b = 5.343(1) Å,
      c = 9.914(3) Å, beta = 127.14(4)°, and V = 499.9(3) Å3, matching the
      PXRD, Raman (Table 3, p. 70), and FTIR (Table 4, p. 70) spectra of natural
      andreybulakhite.
    context: >-
      Abiotic laboratory synthesis in 500 mL aqueous NiCl2·6H2O + Na2C2O4
      solutions at 23–25 °C and pH 6.0–7.2 over 5 days reported by Vereshchagin
      et al. (2025, pp. 66–71, Tables 3–5).
    microbial: false
    evidence:
      - source_ref: vereshchagin_2025_andreybulakhite
        supports: support
        explanation: >-
          Pages 66–71 and Tables 3–5 report the room-temperature aqueous
          synthesis protocol (NiCl2·6H2O + Na2C2O4 in 500 mL distilled water at
          23–25 °C, pH 6.0–7.2, 5 days aging) and the resulting monoclinic C2/c
          unit cell (a = 11.837(6) Å, b = 5.343(1) Å, c = 9.914(3) Å, beta =
          127.14(4)°, V = 499.9(3) Å3), Raman bands, and FTIR bands of the
          synthetic anthropotype.
