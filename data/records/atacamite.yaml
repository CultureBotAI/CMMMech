- id: bassiana_oxalate_synthetic_atacamite_transformation_graph
  name: Beauveria bassiana oxalic acid secretion and copper oxalate assignment on synthetic atacamite agar
  description: Causal pathway linking Beauveria bassiana pyruvate carboxylase (UniProtKB:J5JXL6), cytosolic malate dehydrogenase (UniProtKB:J4KMZ7), and oxaloacetate acetylhydrolase (UniProtKB:J4UKL8) in species reference proteome UP000002762 to oxalic acid secretion (assayed in separate mineral-free malt agar in Figure 3) and culture-associated formation of copper oxalate hydrate (moolooite, CuC2O4.nH2O) on synthetic atacamite malt agar at labelled 10 and 20 g/L loadings (with complete fungal growth inhibition at 50 g/L in Figure 1A-B of Joseph et al., 2012), while preserving unresolved compound vs Cu(II) loading labels, ambiguous Figure 1B XRD percentage denominators, uninspected 2011 raw diffraction graphics, and absence of matched sterile/killed-cell mineral controls.
