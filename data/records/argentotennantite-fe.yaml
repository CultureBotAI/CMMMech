id: cmmmech:argentotennantite-fe
name: Argentotennantite-(Fe)
material_kind: mineral
ima_symbol: Atnt-Fe
description: >-
  IMA-approved silver-copper-iron arsenic sulfosalt mineral of the arsenofreibergite series
  within the tetrahedrite group (IMA 2023-126; symbol Atnt-Fe; status A, Approved 2024; full
  description published June 2026) with ideal end-member formula Ag6(Cu4Fe2)As4S13 (reported
  on p. 329 as requiring Ag 37.42 wt%, S 24.10 wt%, As 17.33 wt%, Cu 14.70 wt%, and Fe
  6.46 wt% for a printed total of 100.00 wt%, where the five rounded values sum to 100.01 wt%;
  Sejkora et al., 2026, European Journal of Mineralogy 38:325-336). Represents the Fe2+-
  dominant C-site member of the arsenofreibergite series (the Fe2+ analogue of
  argentotennantite-(Zn), the As analogue of argentotetrahedrite-(Fe), and the S(2)-occupied
  counterpart of kenoargentotennantite-(Fe)). Discovered in hydrothermal Ag-sulfosalt-bearing
  quartz-siderite-baryte vein gangue from the central part of the San Genaro mine (13 deg 11
  min 37 sec S, 75 deg 08 min 57 sec W; 4750-5000 m a.s.l.), Castrovirreyna Province,
  Huancavelica Department, Peru (hosted in late Miocene 11-12 Ma andesite to rhyolite rocks;
  also previously documented in compositional data from the Kremnica Au-Ag epithermal deposit,
  Slovakia, and Grube Clara, Germany), associated with argentotetrahedrite-(Zn), Ag-rich
  tennantite-(Fe), pyrargyrite, galena, acanthite, quartz, siderite, and baryte; the holotype
  polished section is deposited in the Department of Mineralogy and Petrology, National Museum
  in Prague, Czech Republic (catalogue number P1P 52/2023), and the single-crystal X-ray
  diffraction grain is kept in the Museo di Storia Naturale of the Universita di Pisa, Calci
  (PI), Italy (catalogue number 20070). Occurs as anhedral grains up to 100 um in size and
  more commonly as micrometre-sized late-stage rims and cavity/fissure replacements around
  argentotetrahedrite-(Zn) crystals (Figures 2-4), exhibiting a dark grey colour, black
  streak, metallic lustre, opaque diaphaneity, estimated Mohs hardness ~4, brittle tenacity,
  conchoidal fracture, indistinct cleavage, and calculated density Dcalc = 4.922 g/cm3 from
  the empirical formula and single-crystal unit cell. In reflected light it is isotropic and
  pale grey with a brownish shade and no internal reflections; Commission on Ore Mineralogy
  (COM) reflectance values measured in air (Table 1) are 29.9% (470 nm), 30.1% (546 nm), 29.8%
  (589 nm), and 28.9% (650 nm). Wavelength-dispersive electron microprobe analysis of the
  holotype SCXRD grain (n = 5 spot analyses, Cameca SX100, 25 kV, 20 nA, 0.7 um beam; Table 2)
  yielded Cu 25.34(52) wt% (range 24.98-26.25), S 24.28(27) wt% (24.07-24.75), Ag
  21.38(45) wt% (20.65-21.78), Sb 11.90(153) wt% (9.31-13.20), As 10.12(111) wt% (9.24-11.99),
  Fe 6.20(8) wt% (6.08-6.29), and Zn 0.27(3) wt% (0.23-0.29), total 99.49(16) wt% (range
  99.22-99.65), corresponding on the basis of SigmaMe = 16 apfu to the empirical formula
  M(2)(Ag3.36Cu2.70)Sigma6.06M(1)(Cu4.05Fe1.88Zn0.07)Sigma6.00X(3)(As2.29Sb1.66)Sigma3.95S12.82
  (with partial Sb-for-As substitution stabilizing the structure against steric strain).
  Crystallizes in the cubic system, space group I-43m (#217), with single-crystal X-ray
  diffraction unit-cell parameters a = 10.4365(5) A, V = 1136.75(17) A3, and Z = 2 (refined
  with racemic twinning to R1 = 0.0384 for 246 reflections with F > 4sigma(F) and R1(all) =
  0.0476, wR(F2) = 0.0984, GoF = 1.162, Flack parameter -0.04(13) for 284 unique reflections
  from 2145 measured at 293(2) K on a 0.035 x 0.030 x 0.025 mm grain using MoKalpha
  radiation, Table 3). In the tetrahedrite-type crystal structure (Tables 4-6 and 8),
  triangular planar M(2) (refined s.o. Ag0.53(4)Cu0.47(4), MAN = 38.54 e-, Ueq = 0.076(2) A2)
  has M(2)-S(2) = 2.242(6) A and M(2)-S(1) = 2.392(5) A x 2 (<M(2)-S> = 2.342 A, BVS = 1.36
  v.u.), tetrahedral M(1) (fixed s.o. Cu0.67Fe0.33) has M(1)-S(1) = 2.328(3) A x 4 in Tables 5
  and 8 (referred to as "2.329 A" in Section 4.2 on p. 332; BVS = 1.60 v.u.), trigonal
  pyramidal X(3) (refined s.o. As0.53(3)Sb0.47(3)) has X(3)-S(1) = 2.340(5) A x 3 (BVS = 3.18
  v.u.), and S(2) at (0,0,0) is fully occupied (Ueq = 0.123(14) A2, S(2)M(2)6 octahedron
  volume 15.0 A3). The five strongest calculated powder X-ray diffraction lines (dcalc in A
  (Icalc; hkl), Table 7; note that Section 3.2 on p. 329 cites PowderCell 2.3 whereas the
  Table 7 caption on p. 331 cites PowderCell 2.4) are 3.013 (100; 2 2 2), 1.845 (39; 4 4 0),
  1.573 (21; 6 2 2), 2.609 (20; 4 0 0), and 7.380 (9; 1 1 0). No biological or microbial
  interaction data are reported in the type mineralogical description.
