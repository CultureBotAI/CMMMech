    name: Priestia aryabhattai C4-10 organic-acid metabolism, medium acidification, and biotite Fe/Si mobilization
    description: 'Causal pathway linking Priestia aryabhattai organic-acid metabolism enzymes upregulated in the 8-h biotite transcriptome (Table 1 of Sheng et al., 2026: Citrate synthase citA Gene03098 / UniProtKB:A0A7W3RFI1, 169-fold; Phosphoenolpyruvate carboxykinase pckA Gene04826 / UniProtKB:A0A1S2C101, 46.49-fold; Malate synthase G glcB Gene02911 / UniProtKB:A0A7W3RDZ1, 11.98-fold; Acetate-CoA ligase acsA_2 Gene04776 / UniProtKB:A0A7W3NBV8, 6.14-fold) and the co-localized TCA-cycle Malate dehydrogenase (mdh HNP21_003257 / UniProtKB:A0A0J6SZC4) to organic-acid secretion (malic acid 245-598 uM, acetic acid 123-250 uM, oxalic acid 327-649 uM in Fig. S3B-D), culture acidification (pH 6.21 to 4.52 in Figure 1B), and increased ICP-OES Fe (0.99-29.5 uM, 4-48 h) and Si (24.4-35.3 uM, 12-48 h) from 0.6 g biotite (75-150 um) in 60 mL BHm (Figure 1A), while preserving that the 0.5-mL transcriptome arm is distinct from the 1.5-mL dissolution time course and gene necessity is untested. In addition
      to the 8-h biotite transcriptome in Table 1 (PRJNA1312293, 0.5-mL inoculum), Sheng et al. (2026) directly assayed 7 selected Table 1 DEGs—including Acid-metabolism genes lutA_2 (Gene02671 / ABDD91_RS13400, 9.96-fold in Table 1) and actP (Gene00930 / ABDD91_RS04670, 3.73-fold in Table 1) plus glgC (ABDD91_RS24435), gtaB_3 (ABDD91_RS07585), 02676 (ABDD91_RS13425), levE (ABDD91_RS07970), and glnQ (ABDD91_RS01610)—by RT-qPCR (Table 2, 1.5-mL inoculum) during biotite dissolution (5-9 h, Fig. 4; 0.51- to 40.1-fold at 6 h and 0.58- to 9.4-fold at 8 h vs mineral-free BHm in Fig. S6B; correlating positively with 3.12-5.43 uM dissolved Fe at R^2 = 0.8213-0.9706, P = 0.0022-0.0340 in Fig. 6 and Fig. S6A).'
