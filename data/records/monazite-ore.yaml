mechanisms:
- id: klebsiella_surface_colonization
  name: Biofilm formation and qualitative surface alteration under bioleaching conditions
  process: bioleaching
  description: Klebsiella aerogenes ATCC 13048 attached to the mixed monazite ore and formed surface biofilms in laboratory phosphate-free medium. Microscopy showed preferential localization at physical surface imperfections and no detected preference for particular grain chemistry in the examined fields. Representative day-14 images show more eroded surfaces in the biotic arm than in abiotic controls, supporting a qualitative association with microbial surface alteration. This study does not provide a new quantitative rare-earth dissolution yield, a demonstrated molecular dissolution pathway, an isolated product or industrial deployment.
  context: The ore was reported as sized to 50-200 micrometres and gamma irradiated at 50 kGy for 11 h. The subsequent biofilm Methods collectively describe the ore and two separate crystal substrates as 0.5-2 mm; this size-description discrepancy is unresolved. Cells were pregrown aerobically for 3-5 days at 30 degrees C and 120 rpm in NBRIP with 30 g/L glucose and 1 g/L each KH2PO4 and K2HPO4. Ore and separate crystal specimens were mounted on glass using E6000 adhesive, treated with 70% ethanol for 10 min and UV for 1 h per side, then incubated in 100 mL phosphate-free NBRIP at initial pH 6.2 +/- 0.4, 30 degrees C and 140 rpm. Initial inoculum was approximately 1e7 cells/mL by flow cytometry, not CFU. Glutaraldehyde fixation applied to enumeration aliquots, not the whole bioleaching inoculum. The ore was described as the sole phosphate source, but inoculum washing and an ore-free phosphorus-limited growth control are not documented; growth dependence on ore phosphorus is therefore not
    established. Mounted specimens were collected at 4, 8, 16 and 24 h and days 2, 3, 5, 8, 11 and 14, repeatedly washed, and stained for CLSM or prepared for SEM/FIB. Separate live-imaging assays used a reported 1% monazite slurry and continued observations through days 20-70; their images are not pooled with mounted-slide measurements. Sterile NBRIP and Milli-Q-water controls assessed abiotic surface appearance and autofluorescence. One Methods passage specifies control pH 6, 5 and 4, whereas the live-imaging passage and Figure S6 specify 7, 5 and 4. A matched pH trajectory, replicate counts and quantitative erosion statistics are not supplied.
