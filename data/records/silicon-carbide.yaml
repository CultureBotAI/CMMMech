id: cmmmech:silicon-carbide
name: Silicon carbide
material_kind: commodity
description: >-
  Manufactured silicon carbide (SiC) considered as an industrial and wide-bandgap
  semiconductor/abrasive commodity, distinct from elemental silicon
  (cmmmech:silicon), natural silica feedstocks, and the rare natural meteoritic
  or terrestrial mineral species moissanite. The 2023 US Department of Energy
  Final Critical Materials List (88 FR 51792-51798) designates silicon carbide
  as a critical material for energy on the basis of supply risk for wide-bandgap
  power-electronics wafers in electric vehicles and clean energy systems. USGS
  Mineral Commodity Summaries 2026 covers manufactured silicon carbide in its
  Abrasives (Manufactured) chapter (printed pp. 26-27, chapter PDF pp. 1-2;
  HTS 2849.20.1000 crude and 2849.20.2000 grain) and notes in its Silicon
  chapter (printed p. 171) that silicon carbide can substitute for ferrosilicon
  in some metallurgical applications. Trade and production statistics in the
  USGS abrasives chapter do not disaggregate semiconductor-wafer-grade boules
  from abrasive or metallurgical grades; this grade boundary is retained rather
  than conflated. No microbial synthesis, bioleaching, or biological recovery
  mechanism is asserted.
