id: cmmmech:felsobanyaite
name: Felsőbányaite
material_kind: mineral
description: Felsőbányaite is the hydrated aluminium hydroxysulfate mineral with ideal formula
  Al4(SO4)(OH)10·4H2O. The September 2026 IMA list records it as grandfathered, with 1854
  in the original-description year column. This owner denotes the mineral species, not elemental
  aluminium, a bulk mine-water precipitate, or the separately listed hydrobasaluminite. Farkas
  and Pertlik (1997) characterized natural type-locality felsőbányaite and a Sussex specimen
  called basaluminite by chemistry and single-crystal diffraction, interpreting the latter
  as a microcrystalline variety of the former. Their reported monoclinic P21 structure contains
  aluminium-oxygen layers; beam-induced dehydration reduced structural accuracy, and hydrogen
  positions were not determined. Later work questions whether poorly ordered materials called
  basaluminite in acid-mine-drainage studies are structurally equivalent to the crystalline
  mineral. The 2017 Carrero article's accessible abstract flags this uncertainty; its detailed
  measurements are not curated here. Nomenclatural synonymy alone therefore does not transfer
  every basaluminite experiment to this owner. Microbial precipitation, extraction, recovery
  and industrial deployment are unassessed for this record. No criticality designation is
  inherited from aluminium.
