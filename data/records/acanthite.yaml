id: cmmmech:acanthite
name: Acanthite
material_kind: mineral
description: Acanthite is the monoclinic silver sulfide mineral Ag2S, listed as
  grandfathered with original-description year 1855 in the September 2026 IMA
  master list. It is distinct from elemental silver, generic silver-containing
  nanoparticles and the high-temperature cubic Ag2S form commonly called
  argentite. A laboratory bacterial study identifies acanthite as a minority
  particle type within a mixed silver-containing population. No criticality
  designation is inherited from silver.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 3,
    Acanthite row; page 1 explains grandfathered status and original-description
    years. Retained original rechecked.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: handbook_acanthite
  title: Handbook of Mineralogy. Acanthite, version 1 (2001-2005), one-page
