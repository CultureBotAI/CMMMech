    - Pfam:PF00082
    functional_role: Extracellular alkaline serine protease subtilisin (AprE) secreted by Bacillus spizizenii ATCC 6633, catalyzing proteolytic hydrolysis of gelatin emulsion proteins on waste radiographic films.
    annotation_note: Grounded to strain-matched TrEMBL entry UniProtKB:F1DKR8 (F1DKR8_BACSC; gene aprE) for Bacillus spizizenii ATCC 6633 = JCM 2499 (NCBITaxon:703612).
    evidence:
    - source_ref: nakiboglu2001
      supports: partial
      explanation: Nakiboglu et al. (2001) stripped waste X-ray film gelatin with crude cell-free alkaline protease extract from ATCC 6633 (22.35 U/mL casein activity at pH 8) without isolating aprE or testing aprE deletion mutants.
  evidence:
  - source_ref: nakiboglu2001
    supports: support
    explanation: Experimental pp.350-351 and Results p.352 distinguish the upstream biological preparation from thermal recovery. The authors report 0.4013 g silver product and potentiometric purity 99.16 plus or minus 0.11%, specified as a 95% confidence level with N=5. This is product composition, not 99.16% recovery of the feed silver or five independent process replicates. Table 2 separately measures eleven trace impurities by ICP-MS; it is not a complete impurity mass balance or proof of semiconductor-grade silver.
  - source_ref: nakiboglu2001
    supports: partial
    explanation: Figure 1 tests the pH response at 30 and 40 degrees C, while the recovery run uses 50 degrees C. Table 1 reports declining capacity at 60 degrees C, but its speed/capacity denominators cannot be reconciled directly with the stated 4-by-4-cm pieces and 100-mL run; those numerical capacities are not adopted. The 0.36 mg/cm2 value is calculated from the recovered product, not a separate starting-film silver assay. No total-inventory extraction yield, exclusive enzyme causality, industrial operation or environmental superiority is established; the authors themselves retain the high-temperature burning step as a disadvantage.
  - source_ref: atcc6633
    supports: context_only
    explanation: The current collection entry identifies ATCC 6633 as Bacillus spizizenii strain NRS 231, deposited as Bacillus subtilis. This nomenclatural mapping supports the linked organism label; collection metadata and later genome sequencing are not evidence that the historical assay stock was independently authenticated.
