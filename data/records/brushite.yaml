  url: https://www.handbookofmineralogy.org/pdfs/brushite.pdf
  accessed_on: '2026-10-14'
- id: heveran2019
  title: Heveran et al. (2019). Engineered Ureolytic Microorganisms Can Tailor the Morphology and Nanomechanical
