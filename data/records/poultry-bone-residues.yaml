mechanisms:
- id: bacterial_column_phosphorus_mobilization
  name: Culture-associated phosphorus elution from bone-amended soil columns
  process: bioleaching
  microbial: true
  description: Bacillus megaterium PCM 1855, currently named Priestia megaterium, was associated with
    greater reported phosphorus elution from soil columns amended with cooked poultry-bone material. Adding
    concentrated growth medium increased the reported elution further. These comparisons combine inoculation
    with added phosphorus and nutrients, so they do not isolate a bacterial contribution or a bone-specific
    recovery yield.
  context: The source describes 30 mL glass columns containing 10 g total soil and ground bone feed, at
    nominal 1%, 5% or 10% bone by mass. Inoculated columns received 10 mL logarithmic-phase culture; uninoculated
    comparators received 10 mL distilled water. Table 1 assigns an additional 6.08 mg P2O5-equivalent
    phosphorus to the bacterial suspension and also counts phosphorus already present in soil. The culture
    medium contained glucose, ammonium sulfate, NaCl, MgSO4, KCl, MnSO4, FeSO4 and yeast extract. Inoculum
    preparation was at 34 degrees C and 120 rpm; these are not verified column-incubation conditions.
    Water was applied from above, with four nominal 3 mL eluent collections per day, followed by paper
    filtration and colorimetric vanadophosphomolybdate assay expressed as P2O5. A second poultry-bone
    experiment used tenfold concentrated medium as eluent in both inoculated and control columns. Methods
    state 28 days, whereas Figures 2-3 and crossing-time discussions use minutes; exact elapsed time and
    rates are unresolved. Soil provenance, sterilization, column temperature and independent biological
    replication are not specified. No sterile-medium-matched or pH-matched control is described.
  organisms:
  - id: NCBITaxon:1404
    label: Priestia megaterium
  evidence:
  - source_ref: wyciszkiewicz_2017_columns
    supports: support
    explanation: Sections 2.1-2.4 and 3.1-3.2, Tables 1-2 and Figures 1-3 establish feed preparation and
      the treatment-associated elution pattern. Figure 2A and Table 2 report 47.3 versus 23.5 mg P2O5-equivalent
      phosphorus removed in the 10% inoculated and uninoculated poultry-bone arms; the figure establishes
      the amount unit omitted from Table 2. Figure 3 and Table 2 report greater elution in the medium-fed
      follow-up, including 153.5 versus 30.3 mg for the 10% arms. These are reported total-column elution
      amounts, not isolated product masses or phosphorus attributable solely to bone.
  - source_ref: wyciszkiewicz_2017_columns
    supports: partial
    explanation: Table 1 shows unequal initial phosphorus inventories because only inoculated arms received
      the culture suspension. At 1% poultry bone, the reported elution difference of 15.2 versus 9.32
      mg P2O5-equivalent is smaller than the 6.08 mg supplied with inoculum; a net bone-mobilization benefit
      is therefore not established by that difference alone. The source does not resolve phosphate from
      soil, inoculum and bone separately. The reported solubilization percentages and curve-crossing times
      are not adopted as recovery yields or rates. Soil sterility is not established by describing the
      comparator as without bacteria. The empirical pH model does not identify a particular organic acid
      or demonstrate an exclusive molecular mechanism.
  - source_ref: wyciszkiewicz_2017_columns
    supports: partial
    explanation: The 28-day Methods description conflicts with the minute axes of Figures 2-3. Replicate
      counts, raw replicate data and a complete sampling/mass-balance calculation are unavailable in the
      inspected article. Table 3 gives several dose-slope p-values above 0.05 despite broad significance
      wording, and Table 4 labels some fitted maxima below its minima. No universal statistically demonstrated
      dose effect, fitted kinetic constant, agricultural efficacy, fertilizer safety or industrial deployment
      is inferred from this column study.
  - source_ref: ncbi_1404
    supports: context_only
    explanation: The current authority resolves Priestia megaterium and the historical Bacillus megaterium
      synonym. PCM 1855 provenance is reported by the study as the Polish Collection of Microorganisms;
      the species identifier does not independently authenticate that culture or establish a genome mapping.
- id: acidophile_broth_phosphorus_mobilization
  name: Acidophile-culture-associated phosphorus mobilization in bone-containing broth
  process: bioleaching
  microbial: true
  description: In acidophile-inoculated flasks containing ground poultry-bone feed, liquid-phase phosphorus
    increased while pH fell. The response at the highest nominal dose was below that at 10 g/L. The proposed
    sulfuric-acid-mediated dissolution remains consistent with the culture conditions, but chemical acid
    and phosphate were already present and no matched abiotic control isolates microbial necessity.
  context: The source-designated living Acidithiobacillus ferrooxidans F7-01 was reported to have been
    isolated from the Iron Bridge tailings impoundment, Poland. A 10% v/v inoculum of 72-hour culture
    was used in 9K medium containing 44.2 g/L FeSO4.7H2O, 0.8 g/L elemental sulfur and 0.5 g/L K2HPO4,
    with initial pH adjusted to 2.5 using H2SO4. Methods describe a seven-day precursor cultivation at
    30 degrees C, followed by addition of ground bones to 250 mL medium and 12-day shaken cultivation
    at 34 degrees C; shaker speed and filtration cutoff are not specified. Bone doses are given as 2,
    4, 10 and 20 g/L, but Figures 1a and 2a label the highest poultry dose 40 g/L. Samples are reported
    as triplicate means. Permeates underwent nitric-acid digestion and ICP-OES, with elemental phosphorus
    expressed as P2O5 equivalent; this does not establish dissolved orthophosphate speciation. All reported
    feed-dose arms were inoculated; no matched sterile, no-cell or acid-only arm is presented. The precursor
    timeline is also internally inconsistent between Methods and Figure 3.
  organisms:
  - id: NCBITaxon:920
    label: Acidithiobacillus ferrooxidans
  evidence:
  - source_ref: wyciszkiewicz_2017_acidophile
    supports: support
    explanation: Sections 2.1-2.3 and 3.1-3.3, Table 1 and Figures 1a/2a show culture-associated phosphorus
      release and lower final pH in poultry-bone-containing flasks. The lower liquid response at the highest
      nominal dose is retained; inhibition by bone-derived compounds is a proposed explanation rather
      than a demonstrated cause.
  - source_ref: wyciszkiewicz_2017_acidophile
    supports: partial
    explanation: The medium supplied phosphate, ferrous sulfate, sulfur and sulfuric acid before bone
      addition. The paper does not establish complete blank correction or a closed phosphorus mass balance,
      and precursor cultivation does not prove that added chemical acid ceased contributing. Model-derived
      concentrations in mg/L conflict with the article's percent-concentration wording, and reported solubilization
      percentages are not adopted as recovery yields. Figure/model/dose inconsistencies prevent confident
      quantitative optimization. Table 4 and historical fertilizer-limit discussion do not establish current
      legal compliance, comprehensive safety, agronomic efficacy or industrial deployment. No purified
      phosphorus product was isolated.
  - source_ref: ncbi_920
    supports: context_only
    explanation: The authority resolves the species name Acidithiobacillus ferrooxidans, but does not
      independently authenticate F7-01 or connect the experimental isolate to a strain-specific accession.
