limitations:
- The factory and contributing production processes are not identified; no electroplating-specific
  identity or mineral phase is invented.
- No sterile or acid-only control is reported; microbial superiority over matched
  chemical acid is not established. Biofilm attachment was inferred, and cell-free
  lixiviant preparation is unreported.
- Figure3 graph percentages are not accepted exact product yields or numeric-table
  observations. Undefined error bars, missing endpoint/temperature, acid-unit ambiguity
  and sulfur/dilution wording conflicts limit quantitative transfer.
- Single-feed laboratory mobilization does not establish isolated recovery, cost advantage,
  industrial deployment or universal automotive-sludge behavior.
- Correction/conflict searches and supplement checks are bounded; absence of further
  evidence is not proved.
