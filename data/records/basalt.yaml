id: cmmmech:basalt
name: Basaltic rock
material_kind: primary_resource
description: >-
  Naturally occurring basaltic geological material, represented here by six
  heterogeneous drill-core specimens from ICDP HSDP2, Hilo, Hawaii: basaltic
  flows, basaltic hyaloclastites and pillow basalts. This resource is not a
  single mineral species, pure basaltic glass, an elemental metal or a recovered
  commodity. The specimens contain different proportions of glass, primary
  silicates and secondary alteration phases. The source's manufactured BAS
  glasses are experimental analogues and are not the natural feed represented
  by this record. No constituent criticality designation is inherited.
