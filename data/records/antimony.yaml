id: cmmmech:antimony
name: Antimony
material_kind: element
description: >-
  Antimony (Sb), represented as an element distinct from antimonate feed,
  sorbed antimonite and sulfide-bearing products. A sediment-inoculated
  laboratory experiment supports transformation through coupled microbial
  and chemical reactions under sulfidogenic conditions. The United States
  2025 critical-mineral designation names the antimony commodity; it does
  not designate every Sb compound, host mineral or secondary resource.
