mechanisms:
- id: abiotic_thermal_dehydration_and_decarbonation
  name: Laboratory two-stage thermal dehydration and decarbonation of natural kimuraite-(Y)
  process: other
  description: 'Simultaneous DTA-TGA heating of natural Kirigo kimuraite-(Y) from 60 to 1000
    degrees C combined with FTIR spectra of aliquots heated at 300, 550, and 1000 degrees
    C demonstrated a two-stage thermal decomposition: (1) complete loss of crystallization
    water between 60 and 400 degrees C (marked by a strong DTA endotherm at 160 degrees C
    and the disappearance of the 3400 cm-1 O-H stretching and 1640 cm-1 H-O-H bending FTIR
    bands by 300 degrees C), followed by (2) multistep decarbonation of the anhydrous carbonate
    between 400 and 750 degrees C (four DTA endothermic peaks between 500 and 750 degrees
    C and progressive loss of the 1500/1400 cm-1 carbonate FTIR bands across 550-1000 degrees
    C) yielding rare-earth oxides plus residual trace CaCO3.'
  context: Thermal and spectroscopic experiments reported by Nagashima et al. (1986), pp.
    1030-1031 and Figures 5-6, complemented by independent gravimetric determination of 18.32
    wt% H2O and 29.13 wt% CO2 (47.45 wt% combined volatiles, matching the ~48% total TGA weight
    loss in Figure 5).
  microbial: false
  evidence:
  - source_ref: nagashima_1986_kimuraite
    supports: support
    explanation: Pages 1030-1031 and Figures 5-6 show that DTA-TGA records continuous dehydration
      from 60 to 400 degrees C (160 degrees C endotherm) and decarbonation from 400 to 750
      degrees C (four endotherms between 500 and 750 degrees C), while FTIR spectra at 20,
      300, 550, and 1000 degrees C confirm loss of H2O bands at 300 degrees C and conversion
      to rare-earth oxides at 550-1000 degrees C.
  - source_ref: nagashima_1986_kimuraite
    supports: partial
    explanation: Figure 6 and p. 1031 note that weak carbonate absorption bands (assigned
      to trace residual CaCO3) persist in the FTIR spectrum at 550-1000 degrees C, and no
      single-crystal structure of the intermediate 300 degrees C anhydrous carbonate phase
      was obtained.
