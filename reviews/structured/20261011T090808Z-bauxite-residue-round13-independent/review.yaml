  outcome: supported
  summary: The heterogeneous residue from alkaline Bayer processing of bauxite for
    alumina production, commonly called red mud. It is distinct from bauxite ore,
    alumina commodity, aluminium element and any single mineral species. The curated
    assay used material collected from the Ajka spill site; its composition and treatment
    response do not define every bauxite residue. No criticality designation is inherited
    from constituent elements.
