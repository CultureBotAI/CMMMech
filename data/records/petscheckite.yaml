id: cmmmech:petscheckite
name: Petscheckite
material_kind: mineral
description: >-
  Petscheckite (IMA 1975-038) is an IMA-accepted uranium-iron-niobium-tantalum
  oxide mineral with IMA September 2026 Master List formula U4+Fe2+Nb2O8 and
  general formula U4+Fe2+(Nb,Ta)2O8 (occurring in oxidized/hydrated metamict
  varieties oxy-petscheckite U4+(Fe3+2/3[]1/3)(Nb,Ta)2O8 and
  hydroxy-petscheckite U4+(Fe3+<1/3[]>2/3)(Nb,Ta)2O7(O,OH)). Described by Mücke
  and Strunz (1978) from the Antsakoa I pegmatite in the Berere pegmatite field,
  near Tsaratanana, Madagascar, where it occurs with columbite, strüverite,
  monazite, ilmenite, garnet, and tourmaline, sheathed by liandratite. Table 1
  (p. 942) reports a wet-chemical analysis by W. Napiontek (UO2 40.5, combined
  Nb2O5 + Ta2O5 = 45.99, Fe2O3 10.01, FeO 0.10, MnO 1.32, ZrO2 0.42, Al2O3 0.71,
  CaO 0.49, K2O 0.05, total 99.59 wt%, identified on p. 944 as heated oxy- and
  hydroxy-petscheckite in approximately 1:1 proportion). Metamict when unheated;
  trigonal/hexagonal (space group P-31m) after recrystallization at ~650 °C,
  with a = 6.42 Å, c = 4.02 Å, Z = 1, SGmeas = 5.0 (unheated) to 5.5 (heated,
  reported for petscheckite generally), Dcalc = 7.2 g/cm3 (oxy-petscheckite) and
  6.6 g/cm3 (hydroxy-petscheckite), and Mohs hardness ~5 (oxy-petscheckite) to
  3.5 (hydroxy-petscheckite).
