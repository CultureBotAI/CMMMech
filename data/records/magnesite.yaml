id: cmmmech:magnesite
name: Magnesite commodity
material_kind: commodity
description: The industrial magnesite commodity scope used in the BGS/CMIC UK 2024 assessment.
  Its commodity HS-code table groups natural magnesium carbonate with magnesium oxide and dead-burned
  or fused magnesia. This source-defined industrial category therefore includes processed forms
  and is broader than the mineral species magnesite, MgCO3; it is not elemental magnesium or every
  magnesium compound. The criticality entry applies to that assessment category, with no transfer
  of a mineral-only identifier. OR/24/059 explicitly does not constitute government policy. Formation
  of MgCO3 in a microbial laboratory system alone does not demonstrate production of this industrial
  commodity or its grades, and no microbial mechanism is asserted.
