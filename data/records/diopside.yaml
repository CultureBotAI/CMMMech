mechanisms:
- id: pseudomonas_diopside_dissolution_test
  name: Pseudomonas flow-through dissolution assay and proposed surface passivation
  process: bioleaching
  microbial: true
  organisms:
  - id: NCBITaxon:117680
    label: Pseudomonas reactans
  description: Pseudomonas reactans exposure did not establish a consistent substantial increase in diopside
    constituent release relative to bacteria-free comparisons. Microscopy showed attached cells and biofilm-like
    coverage, and the authors proposed passivation from declining outlet concentrations. Baseline evolution
    and inconsistent source summaries prevent a universal inhibition factor or a demonstrated molecular
    passivation mechanism.
  context: Natural ultrasonically cleaned 100-200 micrometre diopside (fresh BET area 1045 +/- 50 cm2/g)
    was tested in 25 mL stirred Teflon flow-through reactors at 25 +/- 0.5 degrees C and 0.018-0.022 mL/min.
    Stationary-phase cells were washed and starved for two days, then supplied at 0.54 or 3.85 g wet/L
    in 0.1 M NaCl with 10 mM MES or bicarbonate, with or without 10 percent nutrient broth. The sequence
    was bacteria-free, low biomass, high biomass, then bacteria-free again; successive stages used the
    same mineral. Table 1 reports pH 6.05-9.07 overall, including nutrient MES runs at 7.80-8.05 although
    Figure 2A groups them as pH about 6.1. Outlet samples passed 20-micrometre reactor filters and then
    0.45-micrometre analytical filters; Ca/Mg used atomic absorption, Si molybdate-blue analysis. Rates
    were calculated from inlet-outlet concentration differences and fresh mineral surface area. No experimental
    strain accession is assigned beyond the source species name. Separate AFM cleavage-surface assays
    used about 1 g wet/L cells; their surface coverage is not a direct mass-balance assay.
  evidence:
  - source_ref: pokrovsky2021
    supports: partial
    explanation: 'Results, Table 1 and Figures 1-2 support limited or unresolved enhancement under the
      tested conditions, with appreciable scatter. The source comparison is not uniformly pH matched:
      the nutrient MES rows are near pH 8 despite the pH 6 panel label. Its claim of a universal three-
      to five-fold start/end decrease also does not reconcile with Table 1 D3 and D4 endpoint rates. Figure
      4 documents surface-associated material but does not identify an inhibitory molecule or prove that
      biofilm caused the rate changes. Methods give both 4-5 days for five reactor-volume renewals and
      a later 24 h steady-state statement; exact timing remains inconsistent. No rates, inhibition percentage
      or mineral-product recovery is adopted.'
  - source_ref: pokrovsky2021_si
    supports: partial
    explanation: Figure S1 shows time-dependent outlet Si concentrations through sequential bacterial
      and bacteria-free stages. Early declines and persistent changes are compatible with several causes;
      the sequence lacks a simultaneously aging bacteria-free reactor shown in this supplement. Its pH
      labels do not resolve the Table 1 discrepancy. These plots support documenting baseline drift and
      the authors' passivation proposal, not a uniquely demonstrated microbial cause or a uniform suppression
      factor.
- id: chaetomium_diopside_dissolution_test
  name: Live and heat-killed fungal comparison with modest element-dependent effects
  process: bioleaching
  microbial: true
  description: The source-named Chaetomium brasiliense F-3649 produced slightly higher fitted silica-release
    rates than heat-killed biomass, without a matching magnesium increase and with variable calcium results.
    Fungal hyphae attached to mineral grains. The authors regarded the overall effect as weak or unresolved
    relative to their uncertainty; that does not erase the reported silica difference or surface changes.
  context: Washed fungal biomass grown in Czapek medium was starved for two days; heat-killed biomass
    was autoclaved for one hour at 132 degrees C and washed. Six batch reactors comprised duplicate dead-biomass,
    live nutrient-free and live plus 1 percent Czapek-medium conditions. The dead arm did not have a corresponding
    nutrient-added treatment. The assay used 1.3 g of 100-200 micrometre natural diopside in 250 mL of
    0.1 M NaCl at 25 +/- 1 degrees C, 120 rpm, for 19 days. Table 2 gives pH 6.13-6.50 and 4.46-5.6 g
    wet/L biomass; Methods and Figure S2 also mention 4.2 g wet/L, so an exact constant live/dead biomass
    match is not assumed. Ca/Mg/Si were measured in 0.45-micrometre filtrates. SEM solids were rinsed,
    freeze-dried and carbon coated. VKM corroborates the F-3649 name; no unverified current taxon or genome
    identifier is assigned.
  evidence:
  - source_ref: pokrovsky2021
    supports: partial
    explanation: Table 2 and Figure 3 show the modest, element-dependent live/dead differences and duplicate-reactor
      variation. The source reports higher live-fungus silica rates yet concludes effects are weak at
      its stated uncertainty; no uniform null or robust enhancement factor is substituted. Figure 5 and
      Results describe rounded or etched grain edges, but Discussion later broadly says no dissolution
      sites; panel a is described as dead-fungus material in Results and sterile/no-fungus in the caption
      and image. Therefore microscopy is used for attachment and qualified surface-alteration context,
      not definitive causal control evidence. No isolated Ca, Mg or Si product, field rate or industrial
      recovery is demonstrated.
  - source_ref: pokrovsky2021_si
    supports: partial
    explanation: Figure S2 illustrates rising dissolved silica in one example from each fungal treatment.
      It is not a raw replicate dataset, and plotted biomass labels differ slightly from Table 2. The
      supplement supports the time-course context but does not resolve treatment comparability or source
      inconsistencies.
