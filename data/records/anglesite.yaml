id: cmmmech:anglesite
name: Anglesite
material_kind: mineral
description: Anglesite is the Pb(SO4) mineral species listed with grandfathered status G and original-description year 1832 in the September 2026 IMA compilation. It is distinct from elemental lead, galena, dissolved lead and a mixed lead-bearing concentrate or battery paste. The observation below concerns a laboratory reaction product identified in leached galena-concentrate residues. It does not establish the identity of every lead-sulfate reagent or inherit a criticality designation from lead.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Anglesite row on original PDF page 11; definitions and terms on pages 1-2. Previously acquired dated original rechecked on the access date.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: pacholewska2004
  title: Pacholewska, M. (2004). Bioleaching of galena flotation concentrate. Physicochemical Problems of Mineral Processing 38, 281-290. Experimental methods pp. 282-284, Tables 1-3, phase analysis p. 286 and original Figures 1-3. Complete publisher PDF; no DOI verified.
  url: https://www.journalssystem.com/ppmp/Bioleaching-of-galena-flotation-concentrate,79494,0,2.html
  accessed_on: '2026-10-11'
- id: ncbi_aferrooxidans
  title: NCBI Taxonomy 920, Acidithiobacillus ferrooxidans, species node. Current official taxonomy response; not an identifier for isolate F3-02.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920
  accessed_on: '2026-10-11'
mechanisms:
- id: culture_associated_anglesite_formation_from_galena
  name: Culture-associated anglesite formation in a galena-concentrate residue
  process: biomineralization
  description: Leaching a natural galena-rich concentrate with a living F3-02 culture produced a residue containing X-ray-diffraction-identified anglesite. The source reports a higher relative anglesite proportion in the inoculated residue than in its sterile-labelled control, which also contains anglesite. This supports culture-associated formation in a mixed reaction system, not a requirement for cells to precipitate lead sulfate or direct enzymatic crystallization. The proposed iron/sulfur oxidation and passivating-film explanations remain interpretations. The product is a component of a laboratory residue, not an isolated anglesite or lead recovery yield. This is the same experiment represented from the substrate perspective in the galena record, not an independent replication.
  context: The ZGH Boleslaw flotation feed was reported as approximately 80% galena with hydrocerussite, marcasite, sphalerite, pyrite, gypsum and quartz; the approximate listed phase percentages total about 101%. Table 1 gives 69.3% Pb. The source-labelled F3-02 isolate came from ferruginous mineral water at Piwniczna-Lomnica and was grown in modified sulfate-containing 2K medium without prior lead adaptation. Assays used 300 mL flasks, a reported 5% weight/volume concentrate loading, 100 mL solution and 10 mL culture, 25 degrees C and 130 rpm. The final-volume basis of that loading is not fully specified. Nominal initial pH 2 and Fe(II) 2.0 g/L differ from Table 2's initial pH 2.2 and Fe(II) 2.159 g/L. Sampling extended through 384 h; the reported residue phase comparison is at 288 h. Cu-Kalpha XRD with a Philips PW3710 supports bulk phase identification. SEM specimens were dried on a filter in ambient air and gold-coated. Sterilization details, biological replicate counts and phase-fraction
    uncertainties are not supplied. The cultures and controls developed different pH and redox trajectories, so they do not isolate a biological effect at matched solution chemistry.
