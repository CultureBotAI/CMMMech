  evidence:
  - source_ref: sheng_2026
    supports: support
    explanation: Results and Figure 2A show higher Mg and Si in C4-10-inoculated lizardite medium than uninoculated controls from 8 to 48 hours; Figure 2 caption gives n=3 and error bars as one standard deviation. Figure 2B shows culture acidification relative to controls, and Figure 2E compares stained cells on the mineral after 24 hours. These observations support conditional culture-associated dissolution, without requiring a gene-specific causal assignment.
  - source_ref: sheng_2026
    supports: partial
    explanation: There is no pH-matched abiotic comparison separating acid dissolution from other cellular effects. The text describes decreasing culture pH over 4-48 hours, whereas Figure 2B shows a dip followed by partial rebound; this record preserves the figure-level pattern rather than a monotonic decline. Supplemental methods classify siderophore units below 10% as negative, although Figure 2D displays some such values; a positive siderophore mechanism is therefore not assigned to every time point. Feed phase purity and an isolated recovery yield remain unresolved. Surface staining and gene correlations do not prove intracellular uptake or gene necessity, and no industrial deployment is demonstrated.
causal_graphs:
- id: c4_10_lizardite_dissolution_graph
  name: Priestia aryabhattai C4-10 culture acidification, surface colonization, and lizardite Mg/Si mobilization
  description: Causal pathway linking representative Priestia aryabhattai acid-metabolism enzymes (Citrate synthase UniProtKB:A0A7W3RFI1, Phosphoenolpyruvate carboxykinase PckA UniProtKB:A0A1S2C101, Malate synthase G GlcB UniProtKB:A0A7W3RDZ1, and acetate--CoA ligase UniProtKB:A0A7W3NBV8, identified in the separate Table 1 biotite transcriptome of strain C4-10) to culture acidification (Figure 2B dip and partial rebound relative to pH ~7.6 uninoculated lizardite controls), EPS/biofilm formation (3.52-5.15 g/L EPS, Figure 2D-E), and increased ICP-OES Mg (1.80-2.60 mM) and Si (0.82-1.27 mM) concentrations from 8 to 48 h in MgSO4-free BHm supplemented with 0.6 g lizardite (Sheng et al., 2026, Figure 2A), without pooling the separate biotite transcriptome as a direct lizardite expression measurement or claiming gene necessity.
