id: cmmmech:anorthite
name: Anorthite
material_kind: mineral
description: Anorthite is the calcium-rich plagioclase feldspar species with ideal endmember formula
  Ca(Al2Si2O8), grandfathered in the September 2026 IMA list with original-description year 1823.
  It is distinct from elemental calcium, aluminium or silicon, generic feldspar and mixed rock resources.
  The bacterial experiment used natural plagioclase reported as approximately An90; the separate fungal
  experiment used a purchased, source-assigned anorthite feed with unresolved bulk-composition and phase-purity
  limitations. Neither feed is assumed to be the pure endmember. No constituent criticality is inherited.
