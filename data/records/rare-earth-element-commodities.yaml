criticality:
  - jurisdiction: Australia
    list_name: Australia's Critical Minerals List; rare-earth-elements group, footnote 17
    edition: '20 February 2024 update, following the 16 February 2024 ministerial decision'
    classification: critical
    source_ref: australia_2024
mechanisms:
  - id: hans_lanmodulin_r100k_nd_dy_separation
    name: Synthetic neodymium/dysprosium separation using immobilized Hans-LanM R100K
    process: separation
    microbial: true
    organisms:
      - id: NCBITaxon:2528245
        label: Hansschlegelia quercus
    description: >-
      Purified R100K lanmodulin derived from H. quercus and immobilized through
      a terminal cysteine on maleimide-functionalized agarose retained Nd(III)
      more strongly than Dy(III) during malonate elution. Subsequent acid
      elution released Nd(III). Microbial involvement denotes the bacterial
      protein's origin and recombinant production in Escherichia coli; the
      separation itself was cell-free. This is an engineered protein
      separation, not metabolism or an assay of living H. quercus.
    context: >-
      Figure 4d uses a 0.7 mL bed and a synthetic 95:5 Nd/Dy mixture made from
      rare-earth chloride salts. The supplementary protocol conditions the
      column with 10 mM homopiperazine-1,4-bis(2-ethanesulfonic acid) at pH 5,
      specifies 0.5 mL/min unless otherwise stated, and a five-bed-volume
      water wash before desorption. The elution steps use 30, 50 and 90 mM
      malonate followed by pH 1.5 HCl. Table S16 reports mean feed concentrations
      of 344.2 micromolar Nd and 18.5 micromolar Dy; mixed-ion fractions were
      measured by ICP-MS. Wild-type immobilized Hans-LanM in Extended Data
      Figure 6 is a protein comparator, not a protein-necessity control.
      Column-run replication and operating temperature are not explicitly
      established for Figure 4d; no matched bare-agarose separation control
      was located in the inspected paper and supplement. No complex feed
      contaminants, isolated metal product or industrial deployment were tested
      in this binary experiment.
    evidence:
      - source_ref: mattocks_2023
        supports: support
        explanation: >-
          Figure 4d (printed page 91) reports Dy purity 98.1% and yield 99.3%,
          and Nd purity 99.9% and yield 99.8% in the selected aqueous fractions.
          Extended Data Figure 6 reports wild-type values of 83.6% purity and
          98.1% yield for Dy, and 99.8% purity and 98.5% yield for Nd. These
          are conditional binary-separation results. Purity is the molar share
          of Nd or Dy within the measured Nd-plus-Dy pair, not total chemical
          purity. The comparison supports better Dy enrichment by this R100K
          preparation under the tested protocol, without proving a cellular
          mechanism or applicability to all rare earths.
      - source_ref: mattocks_2023
        supports: partial
        explanation: >-
          Page 92 and Extended Data Figure 6 explicitly distinguish solution
          dimerization from column behavior: functional dimers may occur in
          only a minority of immobilized protein units. Thus the column's
          improved separation is not direct proof that dimerization caused
          the improvement. The paper's synthetic model mixture is not an
          experimentally processed electronic-waste feed.
      - source_ref: mattocks_2023_si
        supports: support
        explanation: >-
          Supplementary printed page 3 specifies synthetic chloride stock
          preparation, buffer, default flow and washing; page 4 identifies
          ICP-MS for mixed-ion fractions. Table S16 on printed page 53 gives
          the binary feed concentrations. These methods constrain the claim
          to aqueous synthetic-ion chromatography.
      - source_ref: mattocks_2023_fig4_data
        supports: partial
        explanation: >-
          Fig4d cells L33 and K45 calculate molar purity from the selected
          fractions. Dy yield O33 divides SUM(H32:H43) by SUM(H32:H51), and
          Nd yield N45 divides SUM(G44:G51) by SUM(G32:G51): the denominators
          are summed tabulated eluate, not an independently measured input
          mass balance. O33 is 99.3964%, whereas the figure prints 99.3%; the
          figure values are retained as reported. Source data also map
          not-detected cells to zero and include negative analytical values.
          Table S16's Nd standard deviation of 4.4 differs from the workbook's
          approximately 15.1942. These ambiguities are retained in the research
          dossier; no concentration observations or corrected yield values
          are imported.
