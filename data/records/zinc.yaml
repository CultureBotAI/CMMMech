    predicate: dissolves
    relationship: Constant-redox Fe(III) (1 g/L) and A. ferrooxidans FC1 sulfur-layer oxidation dissolve sphalerite at elevated Fe(II)
    description: In a 2 L electrolysis cell holding Fe(III) at 1 g/L, pH 1.6, and 35 degrees C with varied Fe(II), Fe(III) oxidizes sphalerite (ZnS) while A. ferrooxidans FC1 oxidizes the accumulating surface elemental-sulfur product layer at 4–8 g/L Fe(II).
