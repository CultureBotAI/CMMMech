limitations:
- No raw-metal assay reanalysis, experimental replication or sequence reclassification
  was performed.
- Source lacks usable metal fraction/denominator, full input/output balance and matched
  metal controls; qualified residual concentration observations do not prove removal,
  biosorption or recovery.
- Original full HTML was usable although PDF routes returned HTML/challenges. Ahmadi
  ESM is an earlier wastewater paper; Hentati context is not independent replication
  of the metal comparison.
- Exact nucleotide browser/efetch tool access failed during independent review; retained
  official efetch bytes and their acquisition metadata were inspected directly. Manufacturer
  direct page returned403.
- Correction/retraction and related-evidence search was bounded to the recorded queries;
  no exhaustive absence claim. No industrial deployment or economic recoverability
  is demonstrated.
- This successor confirms the narrower final record, not the unresolved metal methods
  in the primary study; issue360 source gap remains separate from resolved accession
  issue361.
