  title: Kirk et al. (2024). Bioleaching of lithium from jadarite, spodumene and lepidolite using Acidiothiobacillus ferrooxidans. Mendeley Data, version 1, published 14 November 2024; CC BY 4.0. Published genus spelling retained.
  url: https://doi.org/10.17632/djkf7tkm8d.1
  accessed_on: '2026-10-11'
