id: cmmmech:pyrite
name: Pyrite
material_kind: mineral
description: Pyrite is the FeS2 mineral species listed with grandfathered status G
  in the September 2026 IMA compilation. Its row does not provide an approval
  identifier or a known original-description year. The species is distinct from
  iron, sulfur, marcasite, pyrrhotite, nickel-bearing substituted experimental
  phases and mixed ores. Natural specimen material and synthesized FeS2 used in
  the experiment below are separate assay substrates. No constituent-element
  criticality designation is inherited.
sources:
  - id: ima_2026_09
    title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 179,
      Pyrite row; pages 1-2, column definitions and distribution terms.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-11'
  - id: payne2021
    title: 'Payne, Spietz and Boyd (2021). Reductive dissolution of pyrite by
      methanogenic archaea. The ISME Journal 15:3498-3507. DOI
      10.1038/s41396-021-01028-3. Materials and methods, Results and discussion,
      Figures 1-4; original supplementary Figures S1-S8, Tables S1-S3 and Data Set 1.'
    url: https://doi.org/10.1038/s41396-021-01028-3
    accessed_on: '2026-10-11'
  - id: ncbi_voltae_a3
    title: NCBI Taxonomy 456320, Methanococcus voltae A3, strain node.
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=456320
    accessed_on: '2026-10-11'
  - id: atcc_baa1334
    title: ATCC BAA-1334, Methanococcus voltae; strain designation A3.
    url: https://www.atcc.org/products/baa-1334
    accessed_on: '2026-10-11'
  - id: atcc_baa2329
    title: ATCC BAA-2329, Methanosarcina barkeri; strain designation Fusaro,
