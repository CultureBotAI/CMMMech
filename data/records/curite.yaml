mechanisms:
- id: abiotic_surface_dissolution
  name: Abiotic dissolution-associated surface alteration of synthetic curite
  process: other
  microbial: false
  description: >-
    Exsitu AFM showed etch pits after water and acidic treatments,
    with lower relief and greater lateral extent in the more acidic
    non-strontium arms. Strontium-bearing acid treatment produced
    differently shaped, more symmetrical pits. Alkaline carbonate
    treatment produced hillocks without observed etch pits; swelling
    and precipitation could not be distinguished. These are laboratory
    surface observations, not bulk uranium extraction yields,
    time-resolved dissolution rates or demonstrated radionuclide
    immobilization.
  context: >-
    Synthetic crystals were prepared from 20 mL each of 0.1 mol/L
    uranyl acetate and Pb(NO3)2 solutions at 220 degrees C for two
    weeks; powder XRD detected no other phase. The dissolution
    methods describe 70 mg of crystals with 50 mL doubly distilled
    water or HCl-adjusted solutions at pH 3.5 and 2.1, and a separate
    70 mg/50 mL arm with 0.1 mol/L Na2CO3 at pH 10.5.
    Strontium arms instead used 70 mg with 70 mL of 0.50 mol/L
    SrCl2, initially pH 5.5 or HCl-adjusted to pH 2.7. Methods
    prescribe 60 degrees C for 24 hours in Teflon Parr bombs,
    followed by water washing, air drying and contact-mode AFM
    in air on the (100) face in the 2006 paper's axis convention.
    Initial acid pH uncertainty was 0.1; final pH differed by at
    most 0.5 according to the authors. The pH 3.5 result separately
    says 12 hours, and the weakly acidic Sr result says pH 5.8;
    those discrepancies are unresolved. Replicate counts per arm
    and bulk dissolved uranium concentrations were not reported.
  evidence:
  - source_ref: schindler2006
    supports: support
    explanation: >-
      Figures 4-6 show water and HCl etch-pit morphology and cross
      sections. Figure 7 shows the pH 2.7 SrCl2 pits; page 423
      reports only three pits on the crystal examined after the
      weakly acidic Sr treatment. Figure 8 and page 423 show
      carbonate-associated hillocks and explicitly no observed pits.
      Absence of pits is not evidence that all dissolution ceased.
  - source_ref: schindler2006
    supports: partial
    explanation: >-
      Pages 424-429 interpret pit geometry using edge protonation,
      bond-valence models and possible nonstoichiometric detachment
      or Sr adsorption. These molecular explanations were inferred,
      not directly measured. Pit depth is relief relative to an
      evolving surrounding surface, so Figure 9 is not a calibrated
      dissolution-rate dataset. The authors leave swelling versus
      precipitation unresolved and acknowledge undersaturation as
      an alternative contributor to increased acid pit density.
  - source_ref: schindler2006
    supports: context_only
    explanation: >-
      Page 419 gives 24 hours for all treatments, but page 421
      describes 12 hours for the pH 3.5 image. Methods and abstract
      give weakly acidic Sr pH 5.5, while page 423 gives 5.8.
      The abstract lists [110] among observed edges whereas the
      body and Figures 4-8 generally use [011]; disputed indices
      are not transferred as quantitative observations. The
      synthetic Sr analogue discussed as background is not the
      starting curite used in these dissolution experiments.
