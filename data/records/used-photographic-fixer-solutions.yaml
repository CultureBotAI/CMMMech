id: cmmmech:used-photographic-fixer-solutions
name: Used photographic fixer solutions
material_kind: secondary_resource
description: Silver-bearing liquid discarded after photographic fixing, represented here by used black-and-white film fixer collected from a local processing unit. This secondary feed is distinct from discarded solid films, unused fixer, developer solutions and prepared silver salts. Its composition is source-specific; constituent criticality is not inherited.
sources:
- id: pethkar2003
  title: Pethkar and Paknikar (2003). Thiosulfate biodegradation-silver biosorption process for the treatment of photofilm processing wastewater. Process Biochemistry 38:855-860. DOI 10.1016/S0032-9592(02)00054-7; complete original text read through the author-shared six-page PDF web rendition, with Table 1 and all six original publisher figures separately checked.
  url: https://doi.org/10.1016/S0032-9592(02)00054-7
  accessed_on: '2026-10-14'
- id: ncbi_thioparus
  title: 'NCBI Taxonomy 931: Thiobacillus thioparus, species; does not identify MCM B-39'
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=931
  accessed_on: '2026-10-14'
- id: ncbi_cladosporioides
  title: 'NCBI Taxonomy 29917: Cladosporium cladosporioides, species; does not authenticate strain number 1'
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=29917
  accessed_on: '2026-10-14'
mechanisms:
- id: thiosulfate_oxidation_biosorption_then_electrowinning
  name: Bacterial conditioning and fungal biosorption before chemical silver recovery
  process: recovery
  description: Thiobacillus thioparus MCM B-39 treated diluted fixer before silver sorption onto harvested Cladosporium cladosporioides number 1 biomass beads. Chemical elution and electrowinning followed; the final metallic product was not produced by microbial reduction. Bead viability and matrix composition are unresolved in this paper.
  context: Sections 2.1-2.4 describe 25 mL bacterial inoculum at 10^7 cells/mL added to 250 mL nominally 1:10 diluted fixer, pH 6.5, approximately 25 degrees C and 120 rpm for four days. Centrifugation and filtration preceded sorption. Section 2.7 then diluted treated liquid to nominal 100 mg Ag/L and passed it upwards through 3 g beads in a 10 cm by 1 cm internal-diameter column with 20 min retention. The fungal biomass was grown separately, washed and granulated by a proprietary process. Alcoholic cyanide elution and electrolysis at 0.8 V and 224 mA completed the laboratory sequence; scale-up and economics were not established.
  microbial: true
  organisms:
  - id: NCBITaxon:931
    label: Thiobacillus thioparus
  - id: NCBITaxon:29917
    label: Cladosporium cladosporioides
  protein_examples:
  - uniprot_accession: UniProtKB:U5TVQ7
    entry_name: U5TVQ7_THITI
    protein_name: Sulfate thioesterase/sulfate thiohydrolase
    gene_symbol: soxB
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:931
      label: Thiobacillus thioparus
    interpro_ids:
    - InterPro:IPR036907
    - InterPro:IPR006179
    - InterPro:IPR029052
    functional_role: Periplasmic thiosulfohydrolase SoxB (soxB; Sulfate thioesterase/sulfate thiohydrolase; InterPro:IPR036907, InterPro:IPR006179) in the sulfur-oxidizing (Sox) multienzyme complex of Thiobacillus thioparus hydrolyzing S-sulfosulfanyl-L-cysteine to sulfate during thiosulfate oxidation.
    annotation_note: Grounded to species-level UniProtKB entry U5TVQ7 (U5TVQ7_THITI; NCBITaxon:931; ncbi_thioparus) as a representative thiosulfate-oxidation enzyme for Thiobacillus thioparus MCM B-39 in Stage 1 conditioning of 1:10 diluted used photographic fixer (pH 6.5, ~25 C, 120 rpm, 4 days) in Pethkar and Paknikar (2003). Stage 2 silver biosorption used proprietarily granulated Cladosporium cladosporioides strain 1 (NCBITaxon:29917) biomass beads, for which no silver-binding protein entry exists in UniProtKB.
    evidence:
    - source_ref: pethkar2003
      supports: partial
      explanation: Representative Thiobacillus thioparus (NCBITaxon:931) thiosulfate-oxidizing SoxB protein (soxB; UniProtKB:U5TVQ7; InterPro:IPR036907, InterPro:IPR006179) supporting Stage 1 aerobic biodegradation of complexing thiosulfate in 1:10 diluted used photographic fixer by T. thioparus MCM B-39 (25 mL inoculum at 10^7 cells/mL in 250 mL diluted fixer, pH 6.5, ~25 C, 120 rpm for 4 days, converting thiosulfate to elemental sulfur and 32.25 g/L sulfate in Table 1 [31.16 g/L in Results / 31.2 g/L in abstract]) prior to Cladosporium cladosporioides biomass-bead silver biosorption in Pethkar and Paknikar (2003); strain MCM B-39 lacks a strain-specific proteome and Sox enzymes were not directly assayed.
  evidence:
  - source_ref: pethkar2003
    supports: support
    explanation: Sections 2.2-2.4, Table 1 and Results pp.857-859 support real-waste origin, thiosulfate depletion with sulfur/sulfate production and subsequent silver recovery. The authors report 127 mg metallic silver and 70% overall recovery. These are source-reported process outcomes, not independently reconciled yields or product-purity measurements. The bacterial step alone did not substantially remove silver.
  - source_ref: pethkar2003
    supports: partial
    explanation: Section 2.2 assigns 2.8 g Ag/L and 18.5 g thiosulfate/L before dilution, while Table 1 labels those concentrations as 1:10 diluted; Section 2.7 instead gives about 280 mg Ag/L after bacterial treatment. Sulfate is 32.25 g/L in Table 1 versus 31.16 in Results and 31.2 in the abstract. No repaired inventory or detection-limit-derived zero is inferred. Section 2.5 gives 1% ethanol in the eluent but Results gives 10%; the recipe remains unresolved. Cumulative column uptake is expressed per gram biomass in Results versus per gram beads in Methods; bead biomass fraction is unspecified.
  - source_ref: pethkar2003
    supports: partial
    explanation: An uninoculated fixer control is specified, but its separate endpoint results are not presented. No matched untreated-fixer column, matrix-only control or independent replicate count is reported. Figures 1-6 concern prepared silver solutions, not real-feed recovery; plotted dose/time ranges and plateaus differ from some textual optimization claims. Fitted monolayer capacity is not cumulative column uptake, and model agreement does not establish a molecular binding mechanism. A complete process mass balance and phase/purity characterization of the recovered metal are unavailable.
causal_graphs:
- id: thiosulfate_oxidation_biosorption_then_electrowinning_graph
  name: Thiobacillus thioparus Sox-mediated thiosulfate biodegradation, Cladosporium cladosporioides bead biosorption, and chemical elution/electrowinning of silver from used fixer
  description: Causal pathway linking representative Thiobacillus thioparus (NCBITaxon:931) periplasmic thiosulfohydrolase SoxB (soxB, UniProtKB:U5TVQ7) in Stage 1 bacterial conditioning (25 mL T. thioparus MCM B-39 inoculum at 10^7 cells/mL in 250 mL nominally 1:10 diluted used photographic fixer at pH 6.5, ~25 C, and 120 rpm for 4 days, depleting complexing thiosulfate to elemental sulfur and 32.25 g/L sulfate in Table 1 [vs 31.16 g/L in Results and 31.2 g/L in abstract] without precipitating silver) to Stage 2 packed-column silver biosorption onto 3 g proprietarily granulated Cladosporium cladosporioides strain 1 (NCBITaxon:29917) biomass beads (10 cm x 1 cm ID column, 20 min retention, feed diluted to nominal 100 mg Ag/L) and Stage 3 abiotic alkaline alcoholic cyanide elution (1% ethanol in Section 2.5 vs 10% in Results) and electrowinning (0.8 V, 224 mA, yielding 127 mg metallic Ag and 70% reported overall recovery) in Pethkar and Paknikar (2003), while preserving the Table 1 vs Section
    2.2/2.7 dilution-factor conflict (2.8 g Ag/L and 18.5 g thiosulfate/L vs ~280 mg Ag/L) and absence of matched uninoculated fixer endpoint controls.
  scope: REPRESENTATIVE_EXAMPLE
  mechanism_ref: thiosulfate_oxidation_biosorption_then_electrowinning
