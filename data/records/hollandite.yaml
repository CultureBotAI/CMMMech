mechanisms:
- id: brown_rot_surface_transformation
  name: Culture-associated manganese oxalate formation on a hollandite-labelled specimen
  process: biomineralization
  description: Three brown-rot fungal cultures incubated with a source-identified hollandite specimen produced surface solids assigned to manganese oxalate phases. The experiment supports culture-associated secondary crystallization on this feed. Source phase assignments, especially the Coniophora puteana dihydrate assignment, have method-dependent limits. It does not establish a measured manganese reduction pathway, complete hollandite conversion, barium recovery or an isolated oxalate yield.
  context: Table 3 describes entangled fibrous, reniform hollandite aggregates from the U. M. Bronzova collection, with possible Fe impurity no greater than 1.35 wt% FeO. Its formula Ba(Mn2+,Mn4+)8O16 differs from the current IMA species formula Ba(Mn4+6Mn3+2)O16. The paper reports starting-material PXRD/EDX but no specimen-specific valence or site-occupancy refinement. The assay feed therefore remains source-identified hollandite, not independently demonstrated ideal endmember material. Methods 2.2 describes approximately 1 x 0.5 x 0.5 cm blocks in plastic Petri dishes with 20 mL liquid glucose-peptone medium, initial pH 5.5, room temperature and 30 days, in triplicate. Mycelial fragments came from ten-day cultures on glucose-peptone agar. Inoculum amount, substrate sterilization and a separate complete liquid-medium formulation are not specified. The paper names Antrodia xantha; current NCBI taxonomy and its cited ribosomal accession use Amyloporia xantha for LE-BIN 1029. The organisms
    list includes the tested comparator S. lacrymans; it does not assert identical mineral formation by every listed culture.
  microbial: true
