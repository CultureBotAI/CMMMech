id: cmmmech:saponite
name: Saponite
material_kind: mineral
description: Saponite is an IMA-listed smectite-group mineral with variable Mg-Fe-Al composition, written (Ca,Na)0.3(Mg,Fe)3(Si,Al)4O10(OH)2.4H2O
  in the September 2026 list. It has grandfathered status G and original-description year 1840, not a unique
  approval accession. The laboratory material below is the authors' saponite assignment for poorly ordered
  Mg-Al silicate associated with mixed microbial cultures. Its diffuse electron diffraction and lack of resolved
  bulk XRD peaks do not independently establish a well-crystallized, phase-pure saponite product. This owner
  is distinct from the smectite group and from co-precipitated carbonates; no constituent criticality designation
  is inherited.
