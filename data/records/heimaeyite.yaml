id: cmmmech:heimaeyite
name: Heimaeyite
material_kind: mineral
description: >-
  IMA-approved anhydrous sodium-aluminium sulfate mineral (IMA 2023-127a; status A, Approved
  2024 in CNMNC Newsletter 81, Bosi et al., 2024; full description published 13 February
  2025; no mineral symbol is reported in the primary paper or in the September 2026 IMA
  Master List, PDF p. 91) with ideal end-member formula Na3Al(SO4)3 (also written Na3AlS3O12
  in Section 3, p. 81, requiring Na2O 24.20 wt%, Al2O3 13.27 wt%, SO3 62.53 wt%, total
  100.00 wt%, with 10% to 25% replacement of Al by Fe in the natural sample and single-crystal
  structure refinement formula Na3Al0.93Fe0.07S3O12 in Table 3, p. 84; Balic-Zunic,
  Garavelli, Mitolo, Nestola, Pamato, Rasmussen, and Jolnaes, 2025, European Journal of
  Mineralogy 37:79-89). Named after the Icelandic island of Heimaey (hosting the largest
  Icelandic fishing harbour of the same name), on which Eldfell volcano (63 deg 25 min 50 sec
  N, 20 deg 14 min 48 sec W) is situated (Abstract and Section 1, p. 79; Section 7, p. 88).
  Collected in 2009 on Eldfell volcano by a team of geologists from the University of
  Copenhagen led by the late Sveinn P. Jakobsson from the Icelandic Institute of Natural
  History, corresponding to the fumarolic phase with powder X-ray diffraction characteristics
  similar to the unnamed mineral previously given the two-letter label "EN" by Jakobsson et
  al. (2008) (Section 1, p. 79; Section 5.2, pp. 87-88). The holotype specimen is deposited
  in the mineral collection of the Icelandic Institute of Natural History in Gardabaer,
  Iceland, under sample number NI-30218 (Section 1, p. 80). Formed in a tube (where the
  measured fumarolic temperature at collection was between 200 and 300 deg C) inside red
  scoria consisting mostly of a mixture of anhydrite, hematite, and cristobalite through
  which fumarolic gases percolated, producing a ceramic-like white-yellow-reddish mass that
  consists of an intimate micrometre-scale porous mixture of heimaeyite, acicular koryakite
  ((Na,K)MgAl(SO4)3 in Section 2, p. 80; written NaKMg2Al2(SO4)6 in Section 3, p. 81),
  acicular crystals of the still-undescribed new mineral labelled "EA" (NaMgAl(SO4)3), and
  products of their hydration: tamarugite, hexahydrite, and loweite plus some langbeinite
  (Abstract, p. 79; Section 2 and Figure 1, p. 80; Figure 2, p. 81). Occurs as microscopic
  rounded or globular aggregates (<50 um) of platy crystals and individual rounded isometric
  grains (<10 um; the largest grain found had a longest diameter of ~70 um and was used for
  single-crystal XRD structure analysis; Abstract, p. 79, and Section 2, p. 80). Natural
  Fe-bearing heimaeyite is orange in colour (observed on the 0.07 x 0.05 x 0.015 mm orange
  plate used for single-crystal XRD; Section 2, p. 80, and Table 3, p. 84), translucent, with
  a vitreous lustre and a yellow streak (described as "yellowish streak" in the Abstract, p.
  79, and "yellow" in Section 2, p. 80; pure synthetic Na3Al(SO4)3 is colourless with a white
  streak). Cleavage was not observed and is not expected as no preferred orientation could be
  registered on PXRD diagrams; all observed fragments show uneven fractures; heimaeyite is
  soluble in water (Section 3, p. 81); magnetism was not observed; fluorescence, hardness,
  tenacity, and experimental optical properties could not be measured due to small grain size
  and admixture with other minerals (Section 2, p. 80). Density could not be measured; the
  calculated density is 2.783 g cm-3 on the basis of the empirical chemical analysis and
  single-crystal XRD unit-cell dimensions (Abstract, p. 79, and Section 2, p. 80), 2.747 g
  cm-3 calculated from the results of the crystal structure analysis in Section 2 (p. 80),
  and 2.7411 in Table 3 (p. 84, where the row header prints a typographical unit error
  "Calculated density (g cm-1)" instead of "g cm-3"). The calculated mean refractive index
  from the Gladstone-Dale relationship (Mandarino, 1976) is 1.5222 (Section 2, p. 80). After
  preliminary qualitative SEM-EDS analysis on a Cambridge S 360 SEM coupled with an Oxford
  Link Ge ISIS EDS equipped with a Super Atmosphere Thin Window, quantitative wavelength-dispersive
  electron-microprobe analyses (JEOL JXA-8200; 15 kV, 5 nA, 10 um spot size, 10 s peak and 5
  s background counting times on a diamond-polished, 30 nm carbon-sputtered epoxy mount;
  average of n = 11 analyses selected for the smallest contribution of impurities; Section 3,
  pp. 80-81, and Table 1, p. 80) yielded mean Fe2O3 4.18 wt% (range 3.38-5.35, SD 0.58,
  standard Hematite), MnO 0.43 wt% (0.14-0.71, SD 0.16, standard MnTiO3), K2O 0.98 wt%
  (0.69-1.17, SD 0.14, standard Orthoclase), SO3 56.72 wt% (53.28-58.53, SD 1.40, standard
  Barite), SiO2 0.10 wt% (0.01-0.22, SD 0.07, standard Orthoclase), Al2O3 10.10 wt%
  (9.05-11.12, SD 0.57, standard Corundum), MgO 1.00 wt% (0.74-1.21, SD 0.12, standard
  Olivine), Na2O 19.39 wt% (17.53-20.31, SD 0.79, standard Albite), with printed Total 92.89
  wt% (note that the exact sum of the eight rounded mean wt% values is 4.18 + 0.43 + 0.98 +
  56.72 + 0.10 + 10.10 + 1.00 + 19.39 = 92.90 wt%, a 0.01 wt% rounding difference; the low
  total is explained by high micrometre-scale sample porosity incorporating epoxy and
  embedded polishing diamond grains). The total unsubtracted composition corresponds to
  K0.10Na2.95Mn0.03Mg0.12Fe0.25Al0.94Si0.01S3.35O13.5; after removing the Mn and Si
  impurities and the contributions of admixed acicular koryakite (NaKMg2Al2(SO4)6) and "EA"
  (NaMgAl(SO4)3) by subtracting Al' = Mg, Na' = Mg - K, and S' = 3 x Mg, the resulting
  empirical formula of heimaeyite is Na2.93Al0.82Fe0.25S2.99O12.05 (Abstract, p. 79, and
  Section 3, p. 81). Crystallizes in the trigonal system, space group R-3 (#148), with
  single-crystal X-ray diffraction unit-cell parameters (Rigaku Oxford Diffraction Supernova
  diffractometer, microfocus Mo X-ray source, lambda = 0.71073 A, PILATUS DECTRIS 200K area
  detector, T = 293 K, 2321 reflections for unit-cell refinement, multi-scan absorption
  correction; Section 4.2, pp. 82-83, and Table 3, p. 84) a = 13.4326(9) A, c = 8.9818(7) A,
  V = 1403.5(2) A3, Z = 6, and c:a ratio = 0.6687 (Section 7, p. 88). Powder X-ray
  diffraction (Bruker AXS D8 ADVANCE diffractometer, Bragg-Brentano geometry, primary Ge111
  monochromator, CuKalpha1 radiation lambda = 1.54059 A, LYNXEYE silicon-strip detector;
  Section 4.1, p. 81, and Figure 3, p. 83) on a multiphase sample reported as containing 41
  wt% heimaeyite, 18 wt% tamarugite, 15 wt% koryakite, 11 wt% langbeinite, 9 wt% EA, and 7
  wt% hexahydrite (note that the rounded integer percentages sum to 41 + 18 + 15 + 11 + 9 +
  7 = 101 wt%) yielded refined trigonal unit-cell parameters a = 13.3872(4) A, c = 8.9411(4)
  A, V = 1387.7(1) A3. Structure solution by charge flipping (SUPERFLIP) and anisotropic
  refinement in Jana2006 (with Al2/Fe2 occupancy sum constrained to 1 and shared ADP)
  converged to R1 = 4.42% for 550 observed reflections with I > 3sigma(I) and R1 = 10.87%
  (wR = 5.64%, GoF = 1.3031) for all 998 reflections (Rint = 0.104) and 60 refined parameters
  (Section 4.2, p. 83, and Table 3, p. 84). Heimaeyite is isostructural with Na3V(SO4)3 (PDF
  39-0243; Boghosian et al., 1994) and high-temperature Na3Fe(SO4)3 (Scordari et al., 2011)
  in the K7Nb(SO4)6-K7Ta(SO4)6 structure type (Borup et al., 1990): chains parallel to [001]
  are formed by two symmetry-independent [AlO6] octahedra sitting on 3-bar inversion centres
  and rotated by ~180 deg relative to each other in a "pin-wheel" configuration bridged by
  three [S1O4] sulfate tetrahedra (S1-O4 = 1.446(4) A, S1-O1 = 1.454(2) A, S1-O3 = 1.473(3)
  A, S1-O2 = 1.480(3) A, mean <d> = 1.463 A, BVS = 6.2 vu, Vp = 1.602(8) A3), namely a
  smaller pure-Al site Al1 at (0, 0, 0) (occupancy 1, Al1-O2 x 6 = 1.877(2) A, BVS = 3.3 vu,
  Vp = 8.79(2) A3, volume distortion vd = 0.0029) and a significantly larger mixed site
  Al2/Fe2 at (1/3, 2/3, 1/6) (occupancy 0.853(10) Al + 0.147(10) Fe, Al2/Fe2-O3 x 6 =
  2.055(4) A, BVS = 2.1 vu, Vp = 11.47(4) A3, vd = 0.0093), while triplets of chains are
  interconnected into a 3D framework by 6-coordinated [Na1O6] distorted trigonal prisms
  (Na1-O = 2.342(3)-2.799(3) A, mean <d> = 2.518 A, BVS = 0.9 vu, Vp = 16.42(4) A3, vd =
  0.2128; Section 5.1-5.2, pp. 83-86, and Tables 4-6, pp. 85-86). Pure synthetic Na3Al(SO4)3
  (95 wt% with 5 wt% synthetic metathenardite Na2SO4), prepared by heating stoichiometric
  powders of Na2SO4 and aluminium sulfate hydrate (printed as "Al3(SO4)2(H2O)17" in Section
  6, p. 87, a typographical transposition of subscripts for Al2(SO4)3*17H2O) in a platinum
  crucible for 1 month at 550 deg C, yielded Rietveld-refined PXRD parameters a =
  13.33936(8) A, c = 8.90165(6) A (Rwp = 9.65%, Rp = 6.70%, RBragg = 2.00%; Al1-O2 x 6 =
  1.873(4) A, Al2-O3 x 6 = 1.893(4) A, and 7-coordinated Na1-O = 2.299(5)-2.968(4) A;
  Section 6 and Tables 7-8, p. 87). The eight strongest powder X-ray diffraction maxima
  highlighted in bold in Table 2 [dmeas in A (Imeas, dcalc in A) hkl; p. 82] are 6.68 (40,
  6.69) (2 -1 0), 4.16 (17, 4.17) (1 0 -2), 3.93 (32, 3.93) (3 -1 1, 3 -2 -1), 3.13 (100,
  3.13) (3 -2 2 + L, 3 -1 -2), 3.02 (55, 3.03) (4 -1 -1, 4 -3 1), 2.72 (10, 2.72) (2 -1 -3,
  2 -1 3), 2.55 (11, 2.55) (5 -3 -1, 5 -2 1), and 2.026 (10, 2.028) (6 -1 1, 6 -5 -1). No
  biological or microbial interaction data are reported in the type mineralogical
  description.
