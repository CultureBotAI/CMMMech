id: cmmmech:whewellite
name: Whewellite
material_kind: mineral
description: Whewellite is the monoclinic calcium oxalate monohydrate mineral species Ca(C2O4)(H2O), distinct
  from weddellite, caoxite, calcium or phosphorus elements, and apatite-nepheline ore as a mixed resource.
  The September 2026 IMA list marks it approved with 1967 s.p.; that special-procedure notation is not
  a new-mineral accession. This record covers culture-associated whewellite and separate field-associated
  calcium oxalates from one 2019 study, without a recovery yield, industrial deployment or inherited constituent
  criticality.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Definitions pages 1-2; whewellite row
    page 234, A, 1967 s.p. Official list reopened and retained original row visually re-inspected on 14
    October 2026.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
