    nodules, cobalt-rich ferromanganese crusts and phosphorite minerals. Asterisks refer to the U.S. 2022
    constituent list, not a criticality designation for this geological resource.
  url: https://pubs.usgs.gov/fs/2025/3017/fs20253017.pdf
  accessed_on: '2026-10-11'
