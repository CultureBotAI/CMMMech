id: cmmmech:wollastonite
name: Wollastonite
material_kind: mineral
description: Wollastonite is the calcium silicate mineral species CaSiO3, listed as approved with the
  literal 1962 s.p. entry in the September 2026 IMA list. It is distinct from elemental silicon or calcium,
  a calcium-silicate commodity, and mixed rock or waste feed. The experimental natural crystals are source-assigned
  wollastonite; the study does not establish an exact polytype or complete phase purity for the bacterial-assay
  batch. No constituent criticality is inherited.
