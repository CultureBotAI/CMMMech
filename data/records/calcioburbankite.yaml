id: cmmmech:calcioburbankite
name: Calcioburbankite
material_kind: mineral
description: >-
  A natural REE-bearing carbonate mineral, distinct from burbankite and the burbankite group. The
  September 2026 IMA list gives Na3(Ca,Ce,Sr,La)3(CO3)5 and approval 1993-001. The 1995 original
  description concerns a Mont Saint-Hilaire holotype, Canadian Museum of Nature catalogue 50804;
  its precise quarry and geological setting were uncertain. Its surface was partly altered, and a
  separately encountered La-rich specimen was not pooled with the holotype. Three analyses on
  three grains support Ca-dominant chemistry. Carbon was detected separately, but the CO2 amount
  was calculated stoichiometrically, not independently measured. Infrared analysis did not detect
  OH or water. Powder and precession diffraction established hexagonal symmetry but left three
  possible space groups; the 1995 paper did not resolve an atomic structure. It cautions that
  diffraction alone is insufficient to distinguish related species. Table 2 contains inconsistent
  mean/range entries, including Pr2O3, and a Ca atomic-proportion range apparently duplicated from
  Na; no disputed range is adopted. Rapid dissolution in 10 percent HCl was a qualitative
  identification observation without reported time, temperature, loading, yield or isolated
  product. It is not curated as a recovery mechanism. The later 2001 structure study and a 2024
  experimental formation lead remain outside this record's accepted evidence. No criticality
  designation, microbial activity or industrial deployment is asserted.
