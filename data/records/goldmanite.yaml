mechanisms:
- id: abiotic_gel_synthesis
  name: Hydrothermal crystallization from chemically prepared gels
  process: other
  description: Ito obtained products with powder-diffraction lines assigned to goldmanite from chemically
    prepared calcium-vanadium-silicate mixtures. Table 2 run 6, using the nominal goldmanite composition
    and added ascorbic acid, lists goldmanite as the only identified crystalline product after 24 hours
    at 760 degrees C and 15,000 psi. Other recipes produced mixed phases or no assigned goldmanite. This
    is abiotic laboratory synthesis from reagents, without a quantified phase-purity percentage, vanadium
    extraction balance or isolated-metal recovery.
  context: Starting mixtures were co-precipitated gels prepared from C.P.-grade chemicals with vanadium
    initially in the V4+ form. Table 2 identifies the run 6 G-c precursor as precipitated with NH4OH and
    (NH4)2CO3 at the nominal goldmanite composition. The common method used electrically sealed gold tubing,
    2-5 mm diameter, with no additional water because the precursors retained water; precursors were dried
    below 100 degrees C. Precise atmosphere control was explicitly impossible. Residual organic/reducing
    material and added ascorbic acid affected oxygen conditions; no measured oxygen fugacity, initial
    pH, replicate count or quantitative phase yield is supplied for run 6. Slightly alkaline residual
    liquid was reported only when liquid remained after some runs. Figure 3 shows synthetic isometric
    grains, but does not establish a run 6-specific size distribution. Table 5 diffraction concerns run
    2 and Table 8 bulk valence analysis concerns run 5, not run 6. The haradaite and roscoelite arms of
    this same paper must not be transferred to this garnet.
  microbial: false
  evidence:
  - source_ref: ito1965
    supports: support
    explanation: Pages 300-304 and Table 2 identify the preparation, actual run settings and X-ray-assigned
      products; run 6 is 760 degrees C, 15,000 psi, 24 hours, ascorbic acid, with goldmanite listed. Pages
      304-310 and Table 5 compare a different synthetic run 2 with natural garnet powder patterns. This
      supports formation of a goldmanite-type crystalline product under specified laboratory conditions,
      not phase-pure or industrial recovery.
  - source_ref: ito1965
    supports: partial
    explanation: Table 2 run 1 at 400 degrees C, 20,000 psi for 24 hours lists hydrated calcium silicate
      and VO2 without goldmanite; V-rich and Ca-rich runs contain quartz, vanadium oxides, cristobalite
      or wollastonite alongside goldmanite. Table 5 uses run 2, whose Table 2 product also contains quartz
      and V2O3. Table 8 analyzes run 5 and reports both V2O3 and VO2 equivalents; the authors attribute
      minor V4+ to oxide impurities rather than proving its absence from every garnet site. Bulk redox
      titration and diffraction on different runs do not establish run 6 site-specific valence or perfect
      purity. The proposed equilibrium/paragenetic relations on pages 313-315 were inferred from these
      products with uncontrolled atmosphere, not reversible equilibrium experiments.
- id: abiotic_buffered_glass_synthesis
  name: Hydrothermal garnet synthesis from glass under a stated redox buffer
  process: other
  description: Strens separately reported hydrothermal preparation of calcium-vanadium garnet from glass
    at 530 degrees C and 3.0 kilobars for 30 days under the stated hematite-magnetite oxygen buffer. The
    dark-green equigranular product had a reported refractive index and cell edge consistent with a synthetic
    goldmanite endmember. This is a distinct abiotic laboratory experiment, not a repetition of Ito run
    6 and not recovery from ore.
  context: The starting glass had a Ca:V ratio of 3:2 and excess silica, intended to suppress hydroxyl
    substitution for silicate. The one-page note does not provide a full glass recipe, sample loading,
    water addition, apparatus, replication, complete diffraction pattern, direct valence measurement or
    phase-resolved mass accounting. The author reports theoretical yield without a measured mass denominator
    or uncertainty; no numerical recovery fraction is curated. The reported cell edge of 12.070 +/- 0.005
    angstrom and refractive index of 1.834 +/- 0.003 are distinguished from properties extrapolated by
    correcting the composition of the natural Laguna specimen.
  microbial: false
  evidence:
  - source_ref: strens1965
    supports: support
    explanation: Page 260 synthesis paragraph gives the glass Ca:V ratio, excess silica, 530 degrees C,
      3.0 kilobars, 30-day duration and hematite-magnetite buffer, followed by product morphology, refractive
      index and cell edge. This independently supports a synthetic calcium-vanadium garnet product under
      that protocol.
  - source_ref: strens1965
    supports: partial
    explanation: The same short note calls the yield theoretical but gives no mass balance, phase-quantification
      method or measurement uncertainty for that claim. Its later refractive-index and cell-edge values
      corrected from natural mixed garnet are calculations, not additional synthetic measurements. No
      extraction, microbial effect or industrial deployment is tested.
