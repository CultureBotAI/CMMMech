    description: Hardmetal scrap workpieces comprising WC with cobalt binder (cutting tips) or cobalt-nickel binder (rolling-mill rollers, ~85% WC initially) contacted at a 1:1 solid-to-solution volume ratio under continuous mixing for 168 h without further acidification during the leach stage.
    protein_grounding_status: NOT_APPLICABLE
  - id: cobalt_nickel_pregnant_liquor_and_wc_enriched_residue
    label: Co/Ni-enriched spent ferrous liquor (~90% binder extraction reported in prose; rising pH and declining Fe3+/Fe2+ ratio over 168 h, Figure 1) and hexagonal-WC-enriched solid residue (~98% WC reported before downstream chemical/thermal steps)
    node_type: MATERIAL_OR_PHASE
