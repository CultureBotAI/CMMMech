    target: fe2_preexposed_am13_biomass_and_sulfide
    predicate: produces
    relationship: biogenic sulfide production in Fe(II)-containing live AM13 cultures
    description: Live AM13 cells reduce sulfite to dissolved sulfide in 50 mL anoxic marine medium containing 3.81 +/- 0.17 mM Fe(II) at 35 C (whereas gamma-inactivated AM13 controls produce no sulfide and receive reagent Na2S after two weeks in Fe medium).
    evidence:
    - source_ref: picard2018
      supports: support
      explanation: Sections 2.1-2.5, Tables 1-2, and Figures 1-2 document biogenic sulfide production and Fe(II) precipitation in live AM13 cultures alongside gamma-inactivated, cell-free, and post-growth Fe-addition comparators.
  - source: fe2_preexposed_am13_biomass_and_sulfide
    target: mackinawite_fes_precipitate_with_enlarged_domains
    predicate: nucleates
    relationship: precipitation of mackinawite (FeS) with larger Scherrer crystalline domains on Fe(II)-contacted microbial biomass
    description: Reaction of Fe(II) with sulfide precipitates powder-XRD-confirmed mackinawite (FeS) across all arms, with larger Scherrer crystalline domains when live or gamma-inactivated AM13 cells contacted Fe(II) prior to sulfide exposure than in cell-free Na2S or post-growth Fe-addition treatments.
    evidence:
    - source_ref: picard2018
      supports: support
      explanation: Section 3.2, Table 3, and Figures 2-7 show powder-XRD mackinawite formation across arms and larger Scherrer-derived crystalline domains in live-cell and gamma-inactivated-cell treatments than in cell-free and post-growth Fe-addition treatments.
    - source_ref: picard2018
      supports: partial
      explanation: Table 2, Table 3, Section 3.2, and Figure 2C retain unmatched final pH (7.06 live vs 7.30 abiotic vs 7.37 inactive), vivianite co-precipitation in inactive/abiotic arms, the 18.5 vs 18.7 nm c-axis domain discrepancy, and conditional 5-to-11-month partial greigite evolution.
