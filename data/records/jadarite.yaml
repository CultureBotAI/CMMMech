  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 103, Jadarite row; page 1, column definitions; page 2, distribution terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: kirk2024
  title: Kirk et al. (2024). Bioleaching of lithium from jadarite, spodumene, and lepidolite using Acidiothiobacillus ferrooxidans. Frontiers in Microbiology 15:1467408. The genus spelling is retained from the published title.
