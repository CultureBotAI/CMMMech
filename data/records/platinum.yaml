id: cmmmech:platinum
name: Platinum
material_kind: element
description: Platinum (Pt). The element is distinct from its experimental dissolved chloro-complexes, the potassium salts used to prepare them, and platinum-bearing minerals or wastes. The US 2025 designation names the platinum commodity individually; it is mapped here to the element without designating every platinum compound or secondary resource as critical. Curated evidence concerns laboratory transformation in the presence of bacterial biomass, with substantial abiotic reduction and no demonstrated isolated-metal yield or industrial use.
