id: cmmmech:dysprosium
name: Dysprosium
material_kind: element
description: >-
  The element Dy, distinct from its dissolved ions, salts, magnets, minerals
  and waste streams. The dated US designation concerns the named dysprosium
  mineral commodity, without assigning criticality to every Dy-bearing
  material. The mechanism records a laboratory study of dried brewing-yeast
  biomass with synthetic Dy solutions; it does not establish recovery from
  actual industrial effluent or a purified dysprosium product.
