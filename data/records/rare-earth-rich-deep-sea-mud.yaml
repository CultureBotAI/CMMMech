  url: https://doi.org/10.1038/s43247-025-03100-8
  accessed_on: '2026-10-11'
- id: wang2026data
  title: Wang, Pengcong (2025). Microbial iron cycling illuminates the biological contribution and potential
    climate drivers of deep-sea rare earth element enrichment. Zenodo record 17684759, displayed version
    v4, published 23 November 2025, DOI 10.5281/zenodo.17684759; Data.xlsx. Seven inspected sheets are
