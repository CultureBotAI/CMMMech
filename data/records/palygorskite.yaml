id: cmmmech:palygorskite
name: Palygorskite
material_kind: mineral
description: Palygorskite is the fibrous hydrated magnesium-aluminium silicate listed by IMA as (Mg,Al)2Si4O10(OH).4H2O,
  grandfathered status G, original-description year 1862. That year is not an approval accession. This mineral
  owner is distinct from a commercial attapulgite clay commodity, the smectite group and other clay specimens
  in the same experiment. The accepted primary evidence concerns size-separated, chemically cleaned PFl-1 material,
  not an untreated natural assemblage or an industrial recovery feed. No constituent criticality designation
  is inherited.
