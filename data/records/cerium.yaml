id: cmmmech:cerium
name: Cerium
material_kind: element
description: >-
  Cerium (Ce), a lanthanoid chemical element. The United States' named cerium
  commodity designation is mapped to this element without extending it to
  every cerium compound. The experiment uses soluble CeCl3 and yields
  cerium-bearing phosphate/oxalate solids, not elemental cerium metal.
