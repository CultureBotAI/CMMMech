id: cmmmech:feldspar
name: Feldspar commodity
material_kind: commodity
description: 'Feldspar traded as an industrial raw material, including mined and beneficiated
  material ground for glassmaking, ceramics and fillers. The constituent feldspars are aluminosilicate
  minerals containing potassium, sodium or calcium; this commodity is distinct from the feldspar
  mineral group and its individual species. The shared USGS chapter does not make nepheline syenite
  part of this record: it reports feldspar and nepheline syenite separately. The original EU 2024
  Annex II(k) designation is mapped to industrial feldspar. Potassium release from an experimental
  feldspar powder does not establish manufacture of a commercial feldspar product or potash. No
  microbial mechanism is asserted.'
