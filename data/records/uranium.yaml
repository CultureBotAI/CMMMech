mechanisms:
- id: oneidensis_bes_uranium_separation
  name: Uranium separation in an MR-1-inoculated electrochemical system
  process: separation
  description: A laboratory electrochemical system inoculated with Shewanella oneidensis MR-1 showed aqueous uranium depletion and uranium associated with the carbon-felt working electrode. Abiotic systems also removed uranium. This supports separation in the combined biological and electrical system, with partial evidence for a microbial mechanism; microbial necessity, a specific electron-transfer pathway and a purified uranium product are not established by this record.
  context: 'Defined electrolyte, not ore or industrial waste: 100 mL working and counter chambers separated by Nafion 117, with carbon-felt electrodes. The working solution contained 30 mM bicarbonate, 10 mM PIPES, 30 mM ammonium acetate, 40 mM NaCl, and Wolfe''s vitamins and trace metals. Dissolved U(VI) was prepared from U metal in HCl and hydrogen peroxide. Chambers were purged with nitrogen containing 400 ppm CO2. After equilibration and the second solution sample, the biotic system was inoculated and the working electrode poised at -800 mV versus saturated Ag/AgCl. The metadata specifies ambient-temperature equilibration and experiments lasting 72-574 h, with a shorter abiotic U repeat; it does not provide an exact controlled assay temperature or inoculum density/preparation. The original biotic U series has recorded pH values of 7.01-8.21 after inoculation, so this was not a constant-pH assay. Filtered samples were measured by ICP-OES. Electrode material underwent carbonate extraction
    followed by concentrated acid extraction. Independent replicate counts and a statistical microbial-effect estimate are not assigned here. Neither stable mineral identity nor industrial deployment is claimed.'
  microbial: true
