mechanisms:
- id: fungal-colemanite-leaching
  name: Fungal leaching of a colemanite-bearing borate ore
  process: bioleaching
  description: Aspergillus niger cultures released soluble boron from a colemanite-bearing ore while producing organic acids. This laboratory observation supports fermentation-associated leaching; it does not establish an exclusive molecular cause, an isolated boric-acid product or industrial performance.
  context: Bayat et al. used growing A. niger, reported as ATCC 11414, and mixed Kütahya-Emet ore reported as 28.05 wt% B2O3-equivalent. Nominal particle size was below 0.075 mm. Methods specify autoclaved ore and sucrose medium, 150 mL in 250-mL flasks, 1 mL of a 3 x 10^7 spores/mL suspension, 150 rpm and 30 +/- 2 C; 1-10% w/v pulp densities were followed for 21 days. Abstract/optimum-condition text instead gives 25 +/- 2 C, and initial pH is inconsistently stated as 5.5 or about 7. Boron was assayed volumetrically in filtrate and acids by HPLC. Replication was at least duplicate. These reporting conflicts prevent treating the protocol as an unambiguous optimum.
  microbial: true
  organisms:
  - id: NCBITaxon:5061
    label: Aspergillus niger
  protein_examples:
  - uniprot_accession: UniProtKB:A0A254TZW7
    entry_name: CEXA_ASPNG
    protein_name: Citrate exporter A
    gene_symbol: cexA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:5061
      label: Aspergillus niger
    interpro_ids:
    - InterPro:IPR011701
    - InterPro:IPR020846
    - InterPro:IPR036259
    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA that secretes intracellularly synthesized citric acid into the extracellular medium, driving organic-acid acidification and metal mobilization.
    annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:A0A254TZW7 (CEXA_ASPNG) for Aspergillus niger (NCBITaxon:5061).
    evidence:
    - source_ref: bayat2011-colemanite
      supports: partial
      explanation: Representative Aspergillus niger citrate exporter CexA for citric/gluconic/oxalic acid secretion during bioleaching of colemanite-bearing borate ore in Bayat et al. (2011); cexA was not directly mutated in the study.
  evidence:
  - source_ref: bayat2011-colemanite
    supports: support
    explanation: Methods pp. 3-4, Table 3 and Figures 1-3 support soluble-boron release during culture, acid production and culture-associated acidification relative to the stated no-microorganism control. The species identifier does not independently authenticate the reported strain.
  - source_ref: bayat2011-colemanite
    supports: partial
    explanation: Table 1 reports twelve oxide wt% cells that sum to 126.8%, leaving the bulk composition unresolved. The reported 28.05 wt% B2O3 cell is not normalized or treated as a validated recovery denominator. Table 3 gives no corresponding abiotic boron-release series, so the microbial increment in dissolution is unresolved. Its 5% endpoint pH differs from the Results and optimum-condition text. Figure 4's fitted slope differs from the kinetic coefficient reported in the text. Extraction percentages and kinetic constants are not adopted. The chemical comparison used a different temperature and duration; no isolated-product purity or recovery mass balance was demonstrated.
