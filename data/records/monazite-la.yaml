- id: zhoujin2025
  title: >-
    Zhoujin Y, Tisdale HB, Keerthisinghe N, Morrison G, Smith MD,
    Hadermann J, Besmann TM, Amoroso J and zur Loye HC (2025).
    A low-temperature, one-step synthesis for monazite can transform
    monazite into a readily usable advanced nuclear waste form.
    Science Advances 11:eadt3518. DOI 10.1126/sciadv.adt3518.
    Complete original XML, original figures and supplementary
    Tables S1-S11/Figures S1-S29 acquired. La-specific evidence:
    Figure 4B, Figure S2, Figure S7 and Materials and Methods,
    Reagents/Microwave-assisted reaction/Powder XRD. The detailed
    pH, time, in-situ transition and durability studies use NdPO4.
  url: https://doi.org/10.1126/sciadv.adt3518
