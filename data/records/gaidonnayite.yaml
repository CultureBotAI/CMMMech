id: cmmmech:gaidonnayite
name: Gaidonnayite
material_kind: mineral
description: Hydrated sodium-zirconium silicate mineral with current September 2026 IMA-CNMNC
  approved formula Na2ZrSi3O9(H2O)2, status A, and approval number IMA 1973-008. Chao and
  Watkinson (1974) described the cotype specimens (National Museum of Natural Sciences, Ottawa,
  T73/2-1 and T73/2-2) from nepheline syenite pegmatites at Mont Saint-Hilaire, Rouville County,
  Quebec, Canada, as an orthorhombic dimorph of catapleiite associated with hilairite, analcime,
  nenadkevichite, and epididymite. Electron-microprobe WDS analysis combined with thermogravimetric
  H2O determination (Table 3, p. 318) yielded SiO2 42.51, ZrO2 30.21, Nb2O5 3.00, TiO2 0.42,
  Na2O 13.11, K2O 2.20, H2O 9.25, total 100.70 wt%, corresponding on the basis of 9 anhydrous
  O atoms to the empirical formula (Na1.72K0.19)Sigma1.91(Zr1.00Nb0.09Ti0.02)Sigma1.11Si2.88O9·2.10H2O.
  Chao (1985) solved the crystal structure in acentric orthorhombic space group P21nb (a =
  11.740(3), b = 12.820(3), c = 6.691(1) A, V = 1007.03 A3, Z = 4, R = 3.92%, Rw = 3.60% for
  1211 observed reflections with I > 3sigma(I) out of 1280 unique reflections), demonstrating
  sinuous [Si3O9]n6n- chains along [101] cross-linked by isolated [ZrO6] octahedra and two
  distorted [NaO4(H2O)2] and [NaO3(H2O)3] octahedra. Donnay and Chao (1986) corrected a typographical
  error in Table 2 of Chao (1985) for the O(5) y coordinate (0.0149 rather than 0.1940, giving
  Si(2)-O(5) = 1.594(5) A instead of 2.660 A) and established double-donor hydrogen bonding
  of both H2O molecules OW(10) and OW(11). Distinct from catapleiite, georgechaoite (NaKZrSi3O9·2H2O),
  hilairite, and elemental zirconium; no criticality designation, microbial mechanism, or
  industrial recovery yield is asserted.
