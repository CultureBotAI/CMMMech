mechanisms:
- id: cn32_goethite_associated_chukanovite
  name: Chukanovite-assigned secondary solids during culture-associated goethite reduction
  process: biomineralization
  description: Cultures reported as Shewanella putrefaciens CN32 accumulated acid-extractable Fe(II) during long-term incubation with synthetic goethite and formate. Selected solids from cultures with no added phosphate, with or without AQDS, were assigned to mixtures of residual goethite and chukanovite by fitted Mossbauer spectra, with limited diffraction and morphological support. This supports conditional culture-associated formation of an iron(II) carbonate phase. It does not establish a unique biological precipitation pathway, universal production by the strain, pure-product yield or isolated iron recovery.
  context: O'Loughlin2021 Section 2.1 synthesized goethite by aging ferrihydrite under alkaline conditions at 70 degrees C for 60 hours, followed by repeated washing, drying at 60 degrees C and grinding through a 200-mesh sieve; pXRD checked starting phase identity. Duplicate 160 mL serum bottles contained 100 mL defined mineral medium, 80 mM Fe(III) as goethite and 75 mM formate. The basal medium was adjusted to pH 7.5 before sterilization; this is not a constant-pH experiment. Bottles were argon-sparged and late-log cells added to approximately 5 x 10^9 cells/mL as printed, then rolled at 30 degrees C in darkness. Complete basal-medium and inoculum recipes are delegated to earlier references and were not reconstructed. Arms were no added phosphate without or with 100 micromolar AQDS, and 500 micromolar phosphate with 100 micromolar AQDS; there was no phosphate-amended, AQDS-free comparator. Table 2 and Figure 7 associate final phosphate-free observations with day 1060 and the phosphate
    arm with day 744, not a common endpoint. Suspension Fe(II) was measured after one-week HCl extraction by ferrozine and is not dissolved Fe(II) alone. Filtered solids were protected with Kapton for ambient pXRD; SEM samples were dried anoxically and briefly exposed during transfer. Mossbauer analyses used protected samples and fitted spectral components. Figure 7 includes a sterile-control diffraction trace, but does not supply a matched sterile time series and full amendment/harvest details for each culture arm. Both papers print ATCC BAA-543 beside CN32, whereas the authority assigns CN-32 to BAA-453 and BAA-543 to Cellulomonas sp. ES5. The organism identifier records the reported strain name; the actual experimental stock remains unauthenticated.
