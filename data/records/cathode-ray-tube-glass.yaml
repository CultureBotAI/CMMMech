    22 March 2021. Complete 12-page original, including Figures 1–8 and Tables
    1–4, inspected; EuropePMC PMC8004233 full-text XML corroborates text. No
    supplementary-material link was identified in these inspected originals.
  url: https://doi.org/10.3390/ma14061546
  accessed_on: '2026-10-14'
