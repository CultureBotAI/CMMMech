    annotation_note: 'Grounded to reviewed Swiss-Prot entry UniProtKB:Q9F8A8 (COOS2_CARHZ; cooS2 / CHY_0085) in reference proteome UP000002706 for the exact experimental type strain Carboxydothermus hydrogenoformans DSM 6008 (= ATCC BAA-161 = Z-2901, NCBITaxon:246194; UniProtKB organism string: Carboxydothermus hydrogenoformans (strain ATCC BAA-161 / DSM 6008 / Z-2901)) while mechanisms[].organisms[].id is species-level NCBITaxon:129958.'
    evidence:
    - source_ref: haddad2014
      supports: partial
      explanation: Representative Swiss-Prot carbon monoxide dehydrogenase II (cooS2 / CHY_0085) in strain DSM 6008; Haddad et al. (2014) demonstrated that live CO-fed cultures at 70 degrees C promoted cell/EPS-associated crystallization of whitlockite (or alternative Mg-stabilized beta-TCP model) without mutating individual cooS genes.
  evidence:
  - source_ref: haddad2014
    supports: support
    explanation: Figures 2-4 compare dried 30-day inoculated material, its calcined counterpart, commercial beta-TCP and reference whitlockite (JCPDS 01-070-1786) with a dried 30-day sterile control. The inoculated solid has sharp peaks matching the whitlockite reference, whereas the sterile solid remains amorphous by XRD. Figure 5 shows phosphate-band differences for calcined inoculated versus dried sterile material. Figures 6 and 8 show Mg-bearing granules, association with biofilm and lattice fringes. Together these support the source-assigned crystalline product and the culture-associated contrast, subject to the explicit phase ambiguity.
  - source_ref: haddad2014
    supports: partial
    explanation: Results/Discussion page 12 explicitly describes the dominant product as whitlockite or Mg-stabilized beta-TCP. XRD profiles of these phases are similar; infrared characterization uses calcined material, and bulk Table 2 composition is not a phase-specific stoichiometric analysis. The authors report TOPAS profile fitting, lattice parameters and crystallite sizes, but not refined phase fractions or a hydrogen-site determination for the culture product; no independent re-refinement was performed here. Nanorods in Figures 9-11 are interpreted as hydroxyapatite-like, not verified pure hydroxylapatite. Reported 91.7% and 100% values are relative crystallinity estimates against a beta-TCP reference, not mineral purity, conversion yield or recovered phosphorus.
  - source_ref: haddad2014
    supports: partial
    explanation: Figure 1 and Results show initial precipitation and phosphate depletion in both sterile and inoculated medium after NaHCO3 addition. Suspended-solid concentration after 30 days was reported as comparable to that within two hours in either arm. Therefore initial precipitation is not a microbial effect or additional net product yield. Later transient phosphate changes do not close a phase-specific mass balance.
  - source_ref: haddad2014
    supports: support
    explanation: The 30-day sterile medium did not develop the observed crystalline product. A separate control incubated sterile amorphous precipitate for 15 days at 70 degrees C in filtered previously inoculated medium and remained amorphous by XRD. Modified medium with lower Ca/Mg/phosphate/bicarbonate formed no detectable precipitate with or without live culture over 30 days. These are useful conditional controls, not demonstrations of a particular enzyme or a universal biological requirement for whitlockite formation.
  - source_ref: haddad2014
    supports: partial
    explanation: Biofilm-mediated dissolution/reprecipitation and Mg chelation are proposed explanations, not directly measured molecular causes. Biomolecular analyses were negative. No matched killed-cell series is described. Inoculated products were generally washed three times and sterile material once because it dissolved readily; the 39-day chemical assay instead reports two washes. Methods give 600 degrees C for two hours, while Results describe one hour. These treatment differences and conflicting duration are retained rather than equated. General replicate counts and error-bar definitions for phase/time-course comparisons are not clearly specified; the four independent cultures apply specifically to protein assays.
  - source_ref: izatulina2019
    supports: context_only
    explanation: A different 37 degrees C, approximately one-day model-urine experiment reports whitlockite in no-additive chemical syntheses, with the reported phase fields shown in Figure 3 and Section 3.2. This limits any claim that microorganisms are universally necessary. The article provides phase-summary charts rather than the raw whitlockite diffraction patterns, and its medium, pH and organism arms are not replication of the 70 degrees C DSM6008 experiment. No mineral-purity or microbial recovery yield is transferred from it.
  - source_ref: ncbi_hydrogenoformans
    supports: context_only
    explanation: The species identifier and name are verified independently; the DSM6008 inoculum provenance is reported by the primary paper, not established by the species TaxID.
  - source_ref: haddad2014
    supports: partial
    explanation: The recovered analytical pellet contained biomass and mixed calcium-phosphate material that could not be physically separated before characterization. Laboratory precipitation and proposed bioceramic applications do not establish purified-whitlockite recovery, clinical performance or industrial deployment.
