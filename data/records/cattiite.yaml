mechanisms:
- id: abiotic_partial_dehydration
  name: Qualitative partial dehydration of natural cattiite
  process: other
  microbial: false
  description: The original mineral-description study reported partial dehydration of natural cattiite
    during heating, yielding white powder with diffraction similar to bobierrite. This is a qualitative
    abiotic transformation observation, not confirmation of a pure bobierrite product, a kinetic law or
    a microbial recovery process.
  context: Britvin et al. studied cavity-filling material from a dolomite-carbonatite vein at the Zhelezny
    Mine in the Kovdor massif, Russia. Wet analysis of243.5mg, water loss at 1000 degrees C, IR and powder/single-crystal
    diffraction established the highly hydrated mineral. The authors observed partial dehydration starting
    at 40-60 degrees C, with relative humidity proposed as a cause of the variable onset; heating duration,
    controlled humidity series, replicate count and product phase fraction were not reported. Vacuum exposure
    during electron-microprobe work also caused water loss. The chemical-analysis ignition temperature
    is a water-determination procedure, not the dehydration-onset temperature.
  evidence:
  - source_ref: britvin2002
    supports: partial
    explanation: Printedp163 reports 40-60 degrees C partial dehydration and an XRD pattern similar to
      bobierrite. The cited prior synthetic study gives a higher onset above70 degrees C; different material
      and unspecified conditions prevent treating these as interchangeable values or a universal stability
      threshold. The complete original does not provide a time-resolved dehydration curve or quantitative
      phase-conversion yield.
  - source_ref: britvin2002
    supports: partial
    explanation: Printedpp164-166 and Table 1 compare natural and synthetic polytypes. Single-crystal
      cell data support assignment to 1A2, while powder patterns alone are difficult to distinguish. A
      weak4.83 angstrom reflection, varying with water-versus-ethanol grinding, was tentatively attributed
      to preparation-induced1A1 material. The authors did not repeat a full structure refinement because
      the natural crystals diffracted poorly and lost water. Thus exact polytype purity and handling-invariant
      composition are not asserted.
  - source_ref: britvin2002
    supports: context_only
    explanation: Printedpp161-163 and 166 describe natural occurrence and propose formation from cold
      Mg-rich phosphate solutions in a post-hydrothermal stage. Earlier synthetic preparation conditions
      are cited rather than newly tested here. Neither the proposed geological origin nor absence of microbial
      experiments establishes a biological formation pathway or its universal absence.
