id: cmmmech:badengzhuite
name: Badengzhuite
material_kind: mineral
ima_symbol: Bdz
description: >-
  IMA-approved super-reduced titanium phosphide mineral (IMA 2019-076; symbol Bdz in the
  September 2026 IMA Master List, PDF p. 19; status A, Approved 2019; full description
  published November 2020) with ideal end-member formula TiP (requiring Ti 60.71 wt%, P
  39.29 wt%, total 100.00 wt%; Xiong et al., 2020, European Journal of Mineralogy 32:557-574).
  Isostructural with synthetic hexagonal TiP (Snell, 1967) and named in honour of Tibetan
  geologist Badengzhu (b. 1939) of the Tibet Ore Industry Co., Ltd., Lhasa, who discovered the
  chromite orebodies in the Luobusa ophiolite in 1966. Discovered with cotype zhiqinite
  (TiSi2, IMA 2019-077) and the unnamed ternary intermetallic phases Ti10(Si,P,[])7 and
  Ti11(Si,P)10 inside a single 20 um intermetallic melt-droplet spheroid enclosed in a
  corundum grain separated from the Cr-11 podiform chromitite orebody (29 deg 11 min N, 92 deg
  18 min E; 5300 m elevation), Kangjinla district, Luobusa ophiolite, Yarlung Zangbo suture
  zone, ~200 km east-southeast of Lhasa, Tibet, China (inferred to have crystallized from
  trapped Ti-Si-P alloy melts formed by interaction of mantle-derived CH4 + H2 fluids with
  basaltic magmas at ~30-100 km depth and fO2 more than 6 log units below the iron-wustite
  buffer, surrounded by a halo of a K-bearing dmisteinbergite-like phase KCa3(Al7Si9)O32);
  the holotype specimen and FIB TEM foil no. 5358 are deposited in the Chinese Geological
  Museum, Xicheng District, Beijing, China, under catalogue number M13817. Occurs as
  submicrometric globules up to ~0.5 um across and an oval grain nearly 1 um long enclosed in
  tabular zhiqinite (TiSi2) within FIB foil no. 5358; owing to the <=1 um grain size, direct
  optical, hardness, cleavage, fracture, and experimental powder X-ray diffraction
  measurements could not be performed, with the mineral inferred to be opaque and compared
  with synthetic TiP (grey to black, metallic lustre, brittle tenacity, measured density
  3.95-4.08 g/cm3), while the density calculated from the ab initio 3D electron diffraction
  structure solution is Dcalc = 4.233 g/cm3 (Section 5.2, p. 565). Standardless energy-
  dispersive X-ray spectroscopy (EDX, Cliff-Lorimer thin-specimen approximation on a Zeiss
  Libra 120 TEM at 120 kV with a Bruker XFlash6T-60 detector; Table 2, n = 2 analyses at
  points 426 and 427 in foil no. 5358, after excluding Cu from the TEM grid and 105-310 net
  counts of Si attributed to overlap with surrounding zhiqinite) yielded Ti 60.56(250) wt% and
  P 39.44(174) wt% (point 426: Ti 49.83 at.%, P 50.17 at.%) and Ti 62.74(256) wt% and P
  37.26(167) wt% (point 427: Ti 52.14 at.%, P 47.86 at.%), with mean Ti 61.65 wt% (SD 1.54;
  mean 50.99 at.%, SD 1.63) and P 38.35 wt% (SD 1.54; mean 49.02 at.%, SD 1.63; note that the
  two rounded mean atomic percentages sum to 100.01 at.% vs printed Sum = 100), corresponding
  on the basis of 2 atoms per formula unit to the empirical formula Ti1.020P0.980.
  Crystallizes in the hexagonal system, space group P63/mmc (#194), with three-dimensional
  electron diffraction (3D ED; 1 deg precession, ASI Timepix single-electron camera, PETS,
  SIR2014 direct methods, and JANA2006 dynamical refinement using 55 of 74 tilt patterns to
  R(3sigma) = 0.0951 at point 426) unit-cell parameters reported as a = 3.49(7) A, c =
  11.70(23) A (rounded to c = 11.7(2) A in Section 5.4 on p. 566), V = 124(4) A3, and Z = 4.
  In the crystal structure (Table 4 and Figure 5), Ti1 at (1/3, 2/3, 0.1170(3)) (multiplicity
  4, Uiso = 0.0055(11) A2) is octahedrally coordinated by six P atoms (P1 at (0,0,0),
  multiplicity 2, Uiso = 0.0076(15) A2; P2 at (2/3, 1/3, 1/4), multiplicity 2, Uiso =
  0.0124(17) A2) with Ti-P1 = 2.44(5-10) A and Ti-P2 = 2.55(5-10) A, forming pairs of
  face-sharing TiP6 octahedra linked by edge sharing into a kinked hexagonal close-packed
  stacking along c (simulated CuKalpha powder X-ray diffraction pattern reported in Supplement
  Table S1). No biological or microbial interaction data are reported in the type
  mineralogical description.
