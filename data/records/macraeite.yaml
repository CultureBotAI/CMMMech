id: cmmmech:macraeite
name: Macraeite
material_kind: mineral
description: >-
  IMA-approved monoclinic paulkerrite-group hydrated potassium manganese iron-titanium
  oxyhydroxyphosphate mineral (IMA 2023-065; status A, Approved 2023; full description
  published March 2024; no mineral symbol assigned in the September 2026 IMA Master List,
  PDF p. 130, or in the type description) with ideal end-member formula
  [(H2O)K]Mn2(Fe2Ti)(PO4)4[O(OH)](H2O)10*4H2O (written
  [K(H2O)]Mn2(Fe2Ti)(PO4)4[O(OH)](H2O)10*4H2O in the IMA Master List and misprinted as
  [(H2O)K]Mn2(Fe2Ti)(PO4)4[(O(OH)]2(H2O)10*4H2O in Table 7 on p. 277; requiring K2O 4.75
  wt%, MnO 14.31 wt%, Fe2O3 16.11 wt%, TiO2 8.06 wt%, P2O5 28.63 wt%, and H2O 28.14 wt%,
  total 100 wt%; Grey et al., 2024, European Journal of Mineralogy 36:267-278).
  Represents the Fe3+-dominant analogue of rewitzerite
  (K(H2O)Mn2(Al2Ti)(PO4)4[O(OH)](H2O)10*4H2O, IMA 2022-144) and the OH-dominant analogue
  of fluormacraeite (IMA 2024-054), and is named in honour of Colin MacRae (b. 1961),
  head of the Microbeam Laboratory at CSIRO Mineral Resources, Clayton, Victoria,
  Australia, for his development of liquid-nitrogen cold-stage electron microprobe
  techniques and water-inclusive matrix-correction software used to characterize 40
  approved new mineral species since 2010. Discovered in phosphate nodules of weathered
  triplite, heterosite, and lithiophilite collected in 1984 on the dumps of the Chao do
  Castanheiro mining concession at the Cubos-Mesquitela-Mangualde pegmatite (40 deg 35
  min 13.7 sec N, 7 deg 45 min 04.3 sec W), near Mesquitela and Mangualde, Viseu
  district, Portugal, associated with deep reddish-purple strengite, tan deeply etched
  triplite, reddish-brown bermanite, inky-blue phosphosiderite, and occasional
  switzerite; the holotype specimen is housed in the Natural History Museum of Los
  Angeles County, USA, under catalogue number 76293, and a cotype specimen is housed in
  the Bavarian State Collection for Mineralogy (SNSB), Munich, Germany, under
  registration number MSM 38050. Forms colourless to light-greenish-yellow equant,
  pseudo-rhombic dodecahedral crystals (sub-100 to ~150 um individually and in complex
  intergrowths up to 0.5 mm) displaying forms {010}, {001}, {111}, and {11-1}, with
  calculated density Dcalc = 2.39 g/cm3 (from the empirical formula and single-crystal
  unit-cell volume), biaxial positive (+) optics with alpha = 1.605(3), beta = 1.611(3),
  gamma = 1.646(3) (white light), 2Vmeas = 45(3) deg (EXCALIBR) and 2Vcalc = 25.8 deg,
  strong r < v dispersion, optical orientation X = b, Y = c, Z = a, and an excellent
  Gladstone-Dale compatibility index of 0.020. Micro-Raman spectroscopy (532 nm diode
  laser at 4 mW, Horiba XploRA PLUS spectrometer with 200 um slit, 1800 grooves/mm
  grating, and 100x objective; Figure 5, Section 5, p. 270) shows a broad O-H stretching
  band centred at 3460 cm-1 with shoulders reported at 3580, 3460 (printed twice in
  Section 5), and 3250 cm-1, water H-O-H bending at 1645 cm-1, symmetric PO4 stretching
  at 955 cm-1 (shoulders at 1005 and 980 cm-1), antisymmetric PO4 stretching at 1125 and
  1077 cm-1, intense Ti-O/M2-O stretching bands at 830 and 780 cm-1 from linear M2-M3-M2
  octahedral trimers, and PO4 bending bands at 595, 465, and 450 cm-1.
  Wavelength-dispersive electron microprobe analysis (n = 17 analyses on 17 crystals,
  JEOL JXA-8500F Hyperprobe, 15 kV, 2.2 nA, 10 um defocused beam; Table 1) yielded P2O5
  29.55 wt% (range 26.20-32.01, SD 2.20), MnO 14.63 wt% (13.33-15.91, SD 0.86), Fe2O3
  11.80 wt% (10.24-13.66, SD 0.86), TiO2 9.85 wt% (8.65-11.10, SD 0.83), K2O 4.14 wt%
  (3.70-4.89, SD 0.37), Al2O3 1.65 wt% (0.23-3.68, SD 0.96), F 1.04 wt% (0.39-2.03, SD
  0.47), MgO 0.35 wt% (0.21-0.55, SD 0.12), H2Ocalc 28.90 wt%, and -O=F -0.44 wt%, for a
  mean total of 101.47 wt% (individual totals 96.4-108.8 wt% due to vacuum dehydration
  and parallel crystal cracking). Normalized to 4 P and 34 (K + O + F), the bulk
  empirical formula is K0.84Mn1.98Mg0.08Al0.31Fe3+1.42Ti4+1.18P4.00F0.53O32.63H30.92,
  while combining OccQP M-site optimization with the refined A-site occupancies gives the
  structural empirical formula
  A1[(H2O)0.83K0.17]Sigma1.00A2[K0.65(H2O)0.35]Sigma1.00M1(Mn2+1.98[]0.02)Sigma2.00M2(Fe3+1.09Al0.31Ti4+0.52Mg0.08)Sigma2.00M3(Ti4+0.66Fe3+0.34)Sigma1.00(PO4)4X[O0.87F0.53(OH)0.60]Sigma2.00(H2O)10*4H2O
  (where K sums to 0.82 apfu and Fe3+ sums to 1.43 apfu vs 0.84 K and 1.42 Fe3+ in the
  bulk formula). Crystallizes in the monoclinic system, space group P21/c (#14), with
  synchrotron single-crystal X-ray diffraction unit-cell parameters at 100 K (Australian
  Synchrotron MX2 beamline, 0.10 x 0.10 x 0.02 mm crystal, twin volumes 0.367(3) and
  0.633 by two-fold rotation about c; Table 3) of a = 10.562(2) A, b = 20.725(4) A, c =
  12.416(2) A, beta = 90.09(3) deg, V = 2717.8(9) A3, and Z = 4 (note that the Abstract
  on p. 267 reports wRobs = 0.065 for 4990 reflections with I > 3sigma(I), Section 6.2 on
  pp. 270 and 272 reports wavelength 0.7109 A and Robs = 0.047 for 4979 reflections with
  I > 3sigma(I), and Table 3 on p. 273 reports wavelength 0.7107 A, 4990 reflections with
  Io > 3sigma(I), Robs = 0.047, wRobs = 0.063, and all-data Robs = 0.049, wRobs = 0.064
  for 5296 independent reflections from 49,554 measured; room-temperature 300 K XtaLAB
  Synergy MoKalpha single-crystal data in Section 6.3 gave a = 10.5383(4) A, b =
  20.7316(7) A, c = 12.4658(5) A, beta = 90.144(5) deg, Robs = 0.078 for 3163
  reflections; and Gandolfi-like MoKalpha powder X-ray diffraction on a Rigaku R-Axis
  Rapid II microdiffractometer in Section 6.1 and Table 2 gave a = 10.56(3) A, b =
  20.70(3) A, c = 12.39(3) A, beta = 90.1(5) deg, V = 2708(11) A3). The seven strongest
  observed powder X-ray diffraction lines (dobs in A (Iobs; hkl), Table 2) are 3.150
  (100; 2 5 1), 10.38 (94; 0 2 0), 6.25 (75; 0 0 2), 3.736 (69; -2 2 2), 2.901 (67; 3 2 2,
  2 6 0), 7.51 (64; 1 1 1), and 5.24 (50; -1 3 1). No biological or microbial interaction
  data are reported in the type mineralogical description.
