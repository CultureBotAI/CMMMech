  evidence:
  - source_ref: topolska_2014
    supports: support
    explanation: Table 2 E.I and Figure 2b-c show growth with chlorapatite in MP-, whereas the no-mineral MP- comparison showed no sustained culture growth. Growth remained much lower than nutrient-rich cultures. The accepted result is the optical-density phenotype, without converting it to viable counts, biomass yield or a phase-specific phosphorus extraction percentage.
  - source_ref: topolska_2014
    supports: partial
    explanation: Figure 2a shows no apparent mineral-dependent growth advantage in phosphate-rich MP+ within reported triplicate variability. The chlorapatite comparison therefore concerns phosphate limitation and does not establish a general microbial growth benefit.
  - source_ref: topolska_2014
    supports: partial
    explanation: Table 2 E.II and Table 3 provide solution-chemistry results for chlorapatite only in uninoculated controls. The biotic phosphate and Pb release series and rising-pH observations in Figures 3-5 concern pyromorphite. They cannot be relabeled as a chlorapatite biotic dissolution series. Abiotic phosphorus release can supply the nutrient used by the cultures; enhanced chlorapatite dissolution, acidification and a specific enzyme or chelator are not established.
  - source_ref: topolska_2014
    supports: partial
    explanation: The two mineral substrates differed in composition and particle-size range and were not matched by surface area. Their culture-growth contrast is not a normalized dissolution-rate comparison. The study was a laboratory synthetic-mineral experiment and does not measure soil performance, isolated product recovery or long-term stability.
  - source_ref: ncbi_putida
    supports: context_only
    explanation: NCBI 303 verifies the species label only; it does not authenticate the numerical-taxonomy assignment or stock identity of IBPRS KKP 1136.
- id: chlorapatite_abiotic_phosphate_release
  name: Abiotic phosphate release in nutrient-medium controls
  process: other
  description: Synthetic chlorapatite released phosphorus into the phosphate-deficient abiotic control. This explicitly nonmicrobial observation provides an alternative supply pathway for the growth experiment.
  context: Topolska et al. synthesized the source-assigned chlorapatite by heating 0.5 g commercial synthetic hydroxylapatite with 0.5 g CaCl2 at 950 degrees C for 12 h. Table 1 diffraction spacings and Figure 1b SEM-EDS support the assigned phase; the reported particle range was 10-80 micrometres. The paper reports pure chlorapatite, but gives neither a quantitative minor-phase detection limit nor a complete chlorapatite wet-chemical analysis; the separately measured Pb5.09(PO4)2.96Cl formula is for pyromorphite only. Portions of 0.05 g were heated at 180 degrees C for 3 h before use; unchanged XRD/SEM-EDS after heating is asserted as data not shown. Experiments used 100 mL medium in 500 mL flasks, triplicates, 21 +/- 1 degrees C, 100 rpm and 305 h. MP+ contained 0.5 g/L K2HPO4, 5 g/L disodium succinate, 6.5 g/L glycerol, salts and source-reported 30 mM FeEDTA; MP- omitted K2HPO4. Initial pH was adjusted to approximately 7.3. The unusual FeEDTA specification is retained as reported, not
    silently corrected. E.II control 2 contained no added bacteria. Solution samples were centrifuged and 0.2-micrometre filtered before ICP-MS analysis. Phosphate-rich controls already contained dissolved phosphate; their final total P is not all mineral-derived.
  microbial: false
  evidence:
  - source_ref: topolska_2014
    supports: support
    explanation: Table 3 gives final total filtered-solution P of 119 +/- 10.7 micromolar in abiotic MP- with chlorapatite and 2796 +/- 9 micromolar in abiotic MP+ with chlorapatite, reported as triplicate standard deviations. These are endpoint solution concentrations after 305 h, not bacterial release measurements, mineral conversion fractions or isolated P-product yields.
  - source_ref: topolska_2014
    supports: partial
    explanation: Starting phosphate in MP+ contributes to its final P concentration. The study does not report a complete chlorapatite Ca/P mass balance or isolate a recovered phosphorus product. Table 3 is part of the same experiment used under lead and pyromorphite, not independent replication.
