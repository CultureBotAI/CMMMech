  evidence:
  - source_ref: jung_2022
    supports: support
    explanation: Figures 1-2 distinguish inoculated 0/4-degree treatments from no-cell controls. The 4-degree reduction trajectory peaks early and then decreases before recovering; both biotic trajectories end near the source-reported 3.1% reduction at 24 weeks. Dissolved total iron rises through eight weeks and subsequently decreases, so the result is not monotonic accumulation. These conditional assay results establish culture-associated redox/mobilization, not a purified iron product or measured biological uptake.
  - source_ref: jung_2022
    supports: partial
    explanation: Figures 3-5 and Table 2 support broadened illite peaks, changed morphology and source-assigned vivianite in the 4-degree biotic residue after 24 weeks. Limited diffraction peaks plus Fe-P-O EDS do not establish phase purity, quantitative conversion or exclusive origin of product iron. The medium contains phosphate and a metal supplement, and the paper does not provide phase-resolved Fe accounting or a complete recipe. Its claim that IMt-1 is the sole electron acceptor is retained as source design, not experimentally proved exclusivity; Table 1 additionally lists selenate. Proposed electron transfer in Figure 6 is a schematic, not a direct measurement.
  - source_ref: jung_2022
    supports: partial
    explanation: Dithionite produced more operational Fe reduction and dissolved iron than the microbial treatments, but its two-hour duration is not time-matched to the multiweek cultures. Table 1 marks clay and dithionite without medium for that arm, whereas Methods say it was prepared similarly except for cells. The same table lists 2 M lactate/formate without clarifying stock versus final concentrations, in conflict with the prose nominal 20 mM lactate. Figure 4 labels K/(K+Ca), whereas Results use K/(K+2Ca); both chemical and biotic panels show the same final ratio, despite Discussion claiming greater biotic K enrichment. No differential K enrichment, exact complete medium recipe, pure-illite Fe yield or ocean/industrial-scale performance is inferred.
