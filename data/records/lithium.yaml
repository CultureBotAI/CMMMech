    annotation_note: Grounded to type-strain reference proteome UP000001362 (Acidithiobacillus ferrooxidans ATCC 23270 / DSM 14882 / NCIMB 8455; NCBITaxon:243159) as a representative strain-level entry for species-level mechanism organism Acidithiobacillus ferrooxidans (NCBITaxon:920). Represents the unsequenced Bor sulfide-ore Acidithiobacillus ferrooxidans isolate inoculated into jadarite-bearing and spodumene-bearing lithium silicate leaching flasks in Kirk et al. (2024).
    evidence:
    - source_ref: kirk2024
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans rus-operon Fe(II)-oxidation protein for the Bor sulfide-ore isolate maintained on ferrous sulfate and inoculated (10 mL into 190 mL basal medium with 2 g Jadar Basin jadarite-bearing feed or Bikita spodumene feed at static 23 C for 30 days) in Kirk et al. (2024); neither mineral feed showed a statistically resolved positive microbial lithium-leaching increment over uninoculated pH-1.8 acid controls (190 vs 210 mg/L Li for jadarite with 13.5 mL cumulative 0.5 M H2SO4 additions; 6.5 vs 5.8 mg/L Li for refractory spodumene).
