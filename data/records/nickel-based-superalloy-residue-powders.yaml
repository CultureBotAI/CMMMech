  evidence:
  - source_ref: constantin_2025
    supports: support
    explanation: Sections 2.1–2.4, Figures 1–5 and Tables 1–2 establish the three feed stocks, culture-filtrate preparation and observed Ni/Co release. A. thiooxidans is assigned only to the Bio-acid arm; the organism entry does not identify or causally assign the consortium arms. Bio-acid and combined media outperformed ferric-only medium under different initial acidities, especially for SAR-In 32083. Figure 5d shows only partial ferric reduction in that stock's ferric-only arm, contrary to the adjacent blanket statement of complete reduction for all three stocks. Acidolysis, passivation and secondary precipitation remain interpretations, not directly demonstrated surface phases or molecular pathways.
  - source_ref: constantin_2025
    supports: partial
    explanation: Section 3.1 acknowledges incomplete aqua-regia feed digestion, and Figure 2 confirms residual material. Equation 3 normalizes extraction using that digested feed concentration. Table 1's listed elemental means also sum above 1000 g/kg for SAR-Ni 30167 and SAR-Re 30168, so they are not a closed total-feed mass balance. These limitations prevent interpreting the source percentages as verified fractions of the entire original feed. XRF labels do not establish mineral species, alloy-grade identity or quantitative phase purity.
  - source_ref: constantin_2025
    supports: support
    explanation: 'Figure 6 and Section 3.3 support faster early mobilization at 270 rpm for SAR-Ni 30167 and SAR-Re 30168: the source reports about 60% Ni and 70% Co after one day for the first stock, and about 60% Ni and 50% Co after two days for the second, on its own extraction denominator. This is not a universal endpoint advantage: SAR-In nickel performs worse at 270 rpm than 130 rpm by day seven, and SAR-Re cobalt at 130 rpm overtakes the faster-mixed arm later. The paper''s broader statement that lower speed overtakes for both metals is not supported across every Figure 6 panel. The cited conversion of a ten-percentage-point SAR-Re cobalt increase to approximately 7.45 g/kg does not follow from Table 1''s 65.30 g/kg cobalt inventory; it is not imported.'
  - source_ref: constantin_2025
    supports: partial
    explanation: Figure 9 compares no-added-peroxide Bio-acid with 1, 3, 5 and 7 mL additions of nominal 30% peroxide at 270 rpm. Nickel release was not improved across the tested stocks, and SAR-Re cobalt also showed no general benefit. Some early cobalt values for the other stocks increased, without a consistent final advantage. Section 2.3 describes ten days but Figure 9 ends at seven; Section 3.4 mentions a 2 mL SAR-In condition absent from the specified and plotted series. The paper's volume-to-millimolar equivalence is not treated as a verified concentration conversion. No optimized peroxide recipe or general passivation-removal mechanism is accepted from these inconsistencies. No purified product, full economic/life-cycle assessment or industrial demonstration is reported; Section 3.5's favorable deployment claims remain proposals. Table 3 summarizes other studies, not independent controls for these feeds.
  - source_ref: ncbi_930
    supports: context_only
    explanation: The authority confirms the species-level name and identifier used for the Bio-acid culture. It does not authenticate that stock, identify the separate consortium or establish the mechanism for every member of the species.
