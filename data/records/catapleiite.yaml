id: cmmmech:catapleiite
name: Catapleiite
material_kind: mineral
description: >-
  Catapleiite is the sodium-zirconium silicate mineral species with ideal
  formula Na2Zr(Si3O9)(H2O)2. The September 2026 IMA-CNMNC list records
  grandfathered status and the year 1850, not a numbered approval
  accession. It is distinct from calciocatapleiite, elpidite, elemental
  zirconium and mixed zirconium-bearing rocks. An ideal species formula
  does not establish the composition or symmetry of every natural grain.
  Cegiełka and colleagues (2022) assigned catapleiite from microscopy
  and electron-microprobe data in a loose Dyrnaes River block that they
  attributed to the Ilímaussaq Green Granite, south Greenland.
  Figure 3B, Figure 6 and Table 5 document their catapleiite assignment
  in zircon-bearing aggregates associated with elpidite. This is the
  same heterogeneous block already described in the elpidite record,
  not independent sampling or a pure catapleiite feed. The paper does
  not provide sample-specific diffraction confirmation. Its proposed
  late-magmatic formation and subsequent hydrothermal sodium loss
  are geological interpretations, not controlled transformation assays.
  The detailed analytical appendix and Supplementary Table 1 remain
  unavailable. Figure 3C labels material SZR while its caption calls
  it catapleiite; Table 4 and Table 6 repeat IL-356 under different
  material headings. Main-text and Table 5 sodium ranges also disagree.
  These unresolved source differences are retained without importing
  whole-dataset composition ranges or calculating alteration yields.
  Zubkova and colleagues (2020) distinguish natural catapleiite from
  the zirconosilicate produced by annealing it at 1000 degrees C.
  Their silver-exchange experiment used that thermally transformed
  derivative, whose framework differs from hydrated catapleiite.
  Its silver-bearing product is not a demonstrated exchange product
  of the unheated mineral. Figure 1 reuses earlier structural models
  for the starting mineral and thermal derivative; the new structure
  determination concerns the silver-exchanged derivative. This study
  supplies material-boundary context, not a catapleiite recovery yield.
  No microbial mechanism, industrial recovery or constituent-derived
  criticality designation is assigned.
