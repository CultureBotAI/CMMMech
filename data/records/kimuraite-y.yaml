id: cmmmech:kimuraite-y
name: Kimuraite-(Y)
material_kind: mineral
description: Hydrated calcium-yttrium carbonate mineral with current September 2026 IMA-CNMNC
  approved formula CaY2(CO3)4·6H2O, status A, and approval number IMA 1984-073. Nagashima,
  Miyawaki, Takase, Nakai, Sakurai, Matsubara, Kato, and Iwano (1986) described the type specimens
  (deposited in the National Science Museum and the Sakurai Museum, Tokyo, Japan) from fissures
  in alkali olivine basalt (trachybasalt) at Kirigo, Hizen-cho, Higashi Matsuura-gun, Saga
  Prefecture, Kyushu, Japan, where it coexists with lanthanite-(Nd) and lokkaite-(Y) (CaY4(CO3)7·9H2O).
  Inductively coupled plasma atomic emission spectrometry (ICP-AES) for Ca and individual
  rare earths combined with gravimetric H2O (magnesium perchlorate absorption) and CO2 (soda-lime
  absorption) analysis (Table 1, p. 1029) yielded CaO 9.23, Y2O3 29.41, La2O3 0.50, Ce2O3
  0.02, Pr2O3 0.37, Nd2O3 2.97, Sm2O3 0.95, Eu2O3 0.39, Gd2O3 2.49, Tb2O3 0.36, Dy2O3 2.44,
  Ho2O3 0.62, Er2O3 1.69, Tm2O3 0.17, Yb2O3 0.56, Lu2O3 0.06 (SigmaRE2O3 = 43.00 wt%, exhibiting
  a strong negative Ce anomaly attributed to oxidative Ce4+ fractionation during basaltic
  weathering), CO2 29.13, H2O 18.32, total 99.68 wt%, corresponding on the basis of 12 carbonate
  oxygens (O = 18 including water) to the empirical formula Ca0.99(Y1.57Nd0.11Gd0.08Dy0.08Er0.05Sm0.03Ho0.02Yb0.02La0.02Eu0.01Pr0.01Tb0.01Tm0.01)Sigma2.02(CO3)3.99·6.12H2O.
  Weissenberg, oscillation, and diffractometer powder X-ray diffraction (Table 3, p. 1031)
  established an orthorhombic body-centered unit cell (space group Imm2, Immm, I222, or I212121)
  with a = 9.2545(8), b = 23.976(4), c = 6.0433(7) A, V = 1340.9(3) A3, Z = 4, Dmeas = 2.6(1)
  g/cm3 (low due to flaky cleavage interspaces), and Dcalc = 2.98 g/cm3 (biaxial negative,
  alpha = 1.584(2), beta = 1.612(2), gamma = 1.626(2), 2V = 70(5) degrees, Mohs hardness ~2.5;
  dissolves with effervescence in dilute acids). Coupled DTA-TGA and heated-sample FTIR spectroscopy
  demonstrated two-stage thermal decomposition via dehydration at 60-400 degrees C and decarbonation
  at 400-750 degrees C. Distinct from lokkaite-(Y) (CaY4(CO3)7·9H2O), kamphaugite-(Y), tengerite-(Y),
  lanthanite-(Nd), and elemental yttrium or neodymium; no criticality designation, microbial
  mechanism, or industrial recovery yield is asserted.
