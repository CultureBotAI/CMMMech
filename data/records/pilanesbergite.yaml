id: cmmmech:pilanesbergite
name: Pilanesbergite
material_kind: mineral
ima_symbol: Pbg
description: >-
  IMA-approved sodium-calcium-iron-titanium oxy-fluor-disilicate mineral of the wohlerite group
  (IMA 2023-007; symbol Pbg in the September 2026 IMA Master List, PDF p. 173, and Pbt in
  Figure 2 of the type description; status A, Approved 2023; full description published
  January 2024) with ideal end-member formula Na2Ca2Fe2Ti2(Si2O7)2O2F2 (written
  Na2Ca2Fe2+2Ti2(Si2O7)2O2F2 in the IMA Master List; requiring Na2O 8.38 wt%, CaO 15.16 wt%,
  FeO 19.42 wt%, TiO2 21.60 wt%, SiO2 32.48 wt%, F 5.14 wt%, and -F=O 2.16 wt% for a printed
  total of 100 wt%, arithmetic sum 100.02 wt%; Dal Bo et al., 2024, European Journal of
  Mineralogy 36:73-85). Represents the Fe2+- and Ti4+-dominant member of the wohlerite group
  (isomorphic with lavenite Na2Ca2Mn2Zr2(Si2O7)2O2F2, normandite Na2Ca2Mn2Ti2(Si2O7)2O2F2, and
  madeiraite Na2Ca2Fe2Zr2(Si2O7)2O2F2 via the homovalent substitutions Mn2+ <-> Fe2+ on X3 and
  Zr4+ <-> Ti4+ on X1), and is named after its type locality in the 1395 +/- 10 Ma Pilanesberg
  Alkaline Complex (LA-ICP-MS U-Pb titanite age; Elburg and Cawthorn, 2017), North West
  Province, South Africa. Discovered in a river gulley near the southern margin of the
  Pilanesberg Complex (25.3463 deg S, 27.0658 deg E; sample MEPB62, (Na + K)/Al = 1.24, femic
  CIPW-normative minerals summing to 16.95 wt%), where it occurs as a late magmatic
  rock-forming mineral in medium-grained nepheline syenite (locally known as green foyaite)
  showing flow foliation defined by alkali feldspar crystals completely exsolved to end-member
  albite and microcline. Occurs interstitially to feldspar (post-dating alkali feldspar,
  nepheline, and sodalite) associated and partly intergrown with aegirine (sharing inclusions
  of euhedral nepheline, titanite, and minor sodalite) and in stable grain contacts with
  arfvedsonite, apatite, and lamprophyllite, accompanied by eudialyte, minor pyrrhotite and
  Fe-Mn-Ti oxide minerals, aenigmatite, scarce lorenzenite, late-crystallized natrolite, and an
  undescribed fibrous Ti-Zr silicate mineral; cotype specimens are deposited at the Natural
  History Museum, University of Oslo, Norway (catalogue number KNR 44406; sample used for EPMA,
  SCXRD structural refinement, and petrographic description) and the Laboratoire de Mineralogie,
  University of Liege, Belgium (catalogue number 21980; sample used for PXRD, optical
  properties, and density measurement). Forms translucent brown-orange grains and blocky
  crystals with a brownish streak, vitreous lustre, brittle tenacity, no observed cleavage,
  estimated Mohs hardness 5-6 (by comparison with lavenite), and measured density Dmeas = 3.47
  g/cm3 (Berman balance in toluene) vs calculated density Dcalc = 3.40 g/cm3 in the Abstract
  and Section 3 (p. 74) and 3.49 g/cm3 in Table 3 (p. 79). Optically biaxial positive (+) with
  alpha = 1.743(3), beta = 1.768(3), gamma = 1.795(5) (determined by the immersion method in
  Cargille refractive index liquids under 589 nm sodium light) and a 2V angle close to 90 deg
  (2Vcalc = 88 deg; Table 8), with strong pleochroism in thin section between straw yellow and
  orange red and in immersion between light yellow (alpha) and yellowish orange (gamma);
  optical orientation was not determined because the crystals could not be oriented under the
  polarizing microscope due to the absence of cleavage planes, and the Gladstone-Dale
  compatibility index 1 - (Kp/Kc) = 0.037 corresponds to the excellent category (Mandarino,
  1981). Wavelength-dispersive electron microprobe analysis (n = 15 analyses, CAMECA SX100 with
  four spectrometers at the University of Johannesburg, 15 kV, 15 nA, 5 um beam diameter; Table
  1) yielded SiO2 32.28 wt% (range 31.88-32.62, 2sigma SD 0.37), TiO2 18.33 wt% (17.63-19.12,
  SD 0.94), CaO 16.87 wt% (16.27-17.64, SD 0.79), FeO 9.70 wt% (8.54-10.26, SD 0.98), Na2O
  9.43 wt% (9.23-9.60, SD 0.20), F 5.54 wt% (5.42-5.63, SD 0.11), MnO 4.96 wt% (4.62-5.52, SD
  0.52), ZrO2 2.95 wt% (2.19-4.16, SD 1.10), Nb2O5 1.36 wt% (1.06-1.76, SD 0.39), MgO 0.49 wt%
  (0.39-0.63, SD 0.14), SrO 0.18 wt% (0.11-0.22, SD 0.06), Al2O3 0.03 wt% (0.01-0.04, SD 0.02),
  Ce2O3 0.02 wt% (0.00-0.08, SD 0.05), and K2O 0.01 wt% (0.00-0.02, SD 0.01), with Table 1
  printing Total = 102.13 wt%, O=F = 2.33 wt%, and net Total = 99.80 wt% whereas the exact
  arithmetic sum of the 14 printed mean constituents is 102.15 wt% and 99.82 wt% after -O=F (a
  0.02 wt% rounding difference). Normalized to 18 (O + F) anions per formula unit, the
  empirical formula is Na2.00(Ca1.74Na0.26)Sigma2.00(Fe1.00Mn0.52Ca0.49Zr0.05)Sigma2.06(Ti1.69Zr0.14Mg0.09Nb0.08)Sigma2.00(Si2O7)2.00O1.84F2.16.
  Crystallizes in the monoclinic system, non-standard wohlerite-group space group P21/a (#14),
  with single-crystal X-ray diffraction unit-cell parameters a = 10.7811(2) A, b = 9.7836(1) A,
  c = 7.0348(1) A, beta = 108.072(2) deg, V = 705.41(2) A3, and Z = 2 (refined to R1 = 0.0206,
  wR = 0.0250 for 3214 observed reflections with I > 3sigma(I) and R2 = 0.0767, wR2 = 0.0798,
  GoF = 1.04/1.08 for all 3692 unique reflections from 34,780 measured at 293 K on a 0.065 x
  0.043 x 0.025 mm orange blocky crystal using MoKalpha radiation on a Rigaku Synergy-S
  diffractometer, Table 3; powder unit-cell parameters refined in P21/a using LCLSQ8N from
  step-scan data collected on a Bruker D8 Advance ECO diffractometer with CuKalpha radiation,
  2theta 2-70 deg, step size 0.02 deg, Table 2, are a = 10.761(7) A, b = 9.756(7) A, c =
  7.020(4) A, beta = 108.23(5) deg, V = 700.0(5) A3). The refined structural formula (Tables
  4-7) is X4(Na)2X2(Ca0.85Na0.15)2X3(Fe0.48Mn0.25Ca0.25Zr0.02)2X1(Ti0.85Zr0.07Nb0.04Mg0.04)2(Si2O7)2(F2.16O1.84)
  (note that Section 6.1 on p. 77 mislabels site W1 as "W1 (O4)" whereas Tables 4 and 7
  correctly identify it as O8 (W1), and Table 4 on p. 80 misprints Ueq for X3 (Fe) as
  "0.349(4)" A2 instead of ~0.0135 A2). The six strongest observed powder X-ray diffraction
  lines (dmeas in A (Imeas; hkl), Table 2) are 2.851 (100; 1 2 -2), 3.219 (60; 3 1 0), 2.802
  (51; 3 2 0), 2.743 (27; 2 2 -2 / 2 3 0), 2.423 (19; 4 0 -2) and 1.723 (19; 4 4 -2), and
  2.366 (18; 3 2 1). No biological or microbial interaction data are reported in the type
  mineralogical description.
