- id: pisapia_2017
  title: Pisapia et al. (2017), Mineralizing Filamentous Bacteria from the Prony Bay Hydrothermal Field Give New Insights into the Functioning of Serpentinization-Based Subseafloor Ecosystems; Methods and Results pp. 3-14, Figures 2-5 and Table 1
  url: https://doi.org/10.3389/fmicb.2017.00057
