id: cmmmech:feroxyhyte
name: Feroxyhyte
material_kind: mineral
description: Feroxyhyte is the iron(III) oxyhydroxide mineral species Fe3+O(OH), listed as approved with IMA number 1975-032 in the September 2026 IMA-CNMNC list. The curated experiment used chemically synthesized feroxyhyte, described as delta-prime FeOOH, rather than a natural ore. This mineral identity is distinct from other FeOOH polymorphs, elemental iron and the mixed secondary solids formed during the experiment. No constituent-element criticality or industrial recovery is inferred.
