mechanisms:
  - id: acidophile_jadarite_bearing_material_leaching
    name: Transient microbial enhancement of Li release from jadarite-bearing material
    process: bioleaching
    microbial: true
    organisms:
      - id: NCBITaxon:920
        label: Acidithiobacillus ferrooxidans
    description: >-
      Inoculation accelerated Li solubilization from a jadarite-bearing sample
      relative to uninoculated acidic medium during part of a laboratory time
      course. The uninoculated control reached similar dissolved Li by day 30,
      and sulfuric-acid-only leaching released more Li. Biofilm involvement was
      suggested, without establishing a unique molecular cause.
    context: >-
      Live in-lab ore-derived culture was reported as At. ferrooxidans, without
      a strain accession. The species identifier normalizes the reported name
      to Acidithiobacillus ferrooxidans; the title and abstract spell the genus
      Acidiothiobacillus. This mapping does not independently identify the culture.
      Ground Jadar Valley material contained jadarite, dolomite and probertite,
      with possible unidentified Li-bearing phases. Triplicate biotic flasks
      ran statically at 23 degrees C for 30 days, targeting pH 1.8; addition of
      jadarite raised pH immediately and required repeated sulfuric acid doses.
      Acid additions differed between treatments, limiting attribution of the
      observed difference solely to biology. Methods state 2 g powder,
      190 mL basal medium and 10 mL inoculum but label this 2% w/v; those amounts
      imply 1% w/v. The discrepancy is unresolved and no normalized yield is
      curated. No purified Li product or industrial heap operation was demonstrated.
    evidence:
      - source_ref: kirk2024
        supports: support
        explanation: >-
          Sections 2.1-2.3 and 3.1-3.2, Fig. 1 and Table 1 support the scoped
          ICP-OES dissolved-Li comparison and mixed substrate identity.
          Acid leaching contributed substantially in all treatments.
      - source_ref: kirk2024
        supports: partial
        explanation: >-
          Section 3.2 limits the advantage to a transient comparison: by day 30
          the uninoculated control was similar, and acid-only leaching remained
          higher. Sections 3.3-3.4 and Figs. 4-5 report no material microbial
          enhancement for the tested spodumene- and lepidolite-bearing samples.
          The lepidolite sample name is retained without treating it as a unique
          mineral species. The result cannot be generalized to all Li ores.
