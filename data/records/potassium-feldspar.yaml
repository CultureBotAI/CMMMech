id: cmmmech:potassium-feldspar
name: Potassium feldspar family
material_kind: mineral_group
description: Potassium feldspar (K-feldspar) is an informal family of potassium-rich alkali feldspars, including the microcline, orthoclase and sanidine structural forms; it is represented by the mineral_group kind without claiming an IMA-approved group name or a single mineral species. Whitney and Evans (2010), reproduced in the IMA-hosted nomenclature compendium, explicitly labels K-feldspar informal. Freeman et al. (2008) distinguishes these structural forms and the compositional end-member notation from an individual orthoclase phase. This family is distinct from the traded feldspar commodity and potash. The experimental feed below is only author-designated potassium feldspar; bulk oxide composition does not resolve its member species or phase proportions. No criticality designation is inherited.
sources:
  - id: ima_compendium_2019
    title: 'Schertl, Mills and Maresch, editors (2019 copyright). A Compendium of IMA-Approved Mineral Nomenclature, prepared for IMA2018. PDF p34 reproduces Whitney and Evans (2010), DOI 10.2138/am.2010.3371, Table 1: K-feldspar is labeled informal, while alkali feldspar and feldspar are GROUP. Historical nomenclature evidence, not a new 2019 classification.'
    url: https://cnmnc.units.it/ima_reports/2%20IMA-Nomenclature-e-Booklet-2019-1.pdf
    accessed_on: '2026-10-11'
  - id: freeman_2008
    title: Freeman, Wang, Kuebler, Jolliff and Haskin (2008). Characterization of natural feldspars by Raman spectroscopy for future planetary exploration. Canadian Mineralogist 46:1477-1500. DOI 10.3749/canmin.46.6.1477; pp1482 and 1488-1489, Figure 5, distinguish structural forms and compositional notation. The author-hosted filename says 2009, but the article is dated 2008.
    url: https://doi.org/10.3749/canmin.46.6.1477
    accessed_on: '2026-10-11'
  - id: dong_2026
    title: 'Dong, Zhang, Yu, Sheng, He and Sheng (2026). Genomic traits, transcriptional responses, and metabolic activities determine functional divergence in mineral dissolution between Priestia megaterium PMA2-2 and Priestia flexa PMD1-1. Applied and Environmental Microbiology 92(9):e01201-26. DOI 10.1128/aem.01201-26; Methods: Bacterial strains, minerals, and media; Biotite dissolution experiment; Dissolution of other minerals and gene expression analysis; Results: Generalizability; Figure 5; supplement Tables S6-S7 (pp11-12).'
    url: https://doi.org/10.1128/aem.01201-26
    accessed_on: '2026-10-11'
  - id: ncbi_pma2_2
    title: NCBI GenBank CM125967.1, Priestia megaterium strain PMA2-2 chromosome; source feature and BioSample SAMN50659134 link inspected 11 October 2026. The species identifier does not identify the strain by itself.
