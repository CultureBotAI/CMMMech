    annotation_note: Grounded to reference proteome UP000000556 for Pseudomonas putida KT2440 (NCBITaxon:160488; catC / PP_3714, UniProtKB:Q88GK7), co-encoded in the catBCA operon (PP_3713-PP_3715) representing catechol catabolism in Pseudomonas putida ATCC 33015 (NCBITaxon:303) in Chmielowski and Klapcinska (1986) and Klapcinska and Chmielowski (1986).
    evidence:
    - source_ref: klapcinska1986
      supports: partial
      explanation: Klapcinska and Chmielowski (1986) Table 1 showed that after 12 h at 10 mM GeO2 (pH 7.3, 30 C), Pseudomonas putida ATCC 33015 accumulated 2.46 mg Ge/g dry cells with 4 mM catechol versus 0.81 mg Ge/g dry cells with 10 mM acetate (with 83.4% vs 58.0% of accumulated Ge in the intracellular soluble fraction); catC was not directly assayed.
    - source_ref: uniprot_pseudomonas_putida_catechol_pathway
      supports: partial
      explanation: UniProtKB:Q88GK7 (Q88GK7_PSEPK, catC / PP_3714) in Pseudomonas putida KT2440 reference proteome UP000000556 (NCBITaxon:160488) encodes Muconolactone Delta-isomerase (EC:5.3.3.4; GO:0016159; GO:0042952).
  evidence:
  - source_ref: chmielowski1986
    supports: support
    explanation: Pages 1100-1103 and Figures 1-4 report approximately 22 micromol Ge/g dry cells with catechol versus an approximately 10 micromol/g acetate plateau. Mixed substrates delayed the second accumulation phase. Medium germanium decreased only about 5%, despite catechol consumption; this is not efficient solution depletion or a recovery yield.
  - source_ref: chmielowski1986
    supports: partial
    explanation: The kinetic association supports substrate-dependent uptake but does not identify a transporter experimentally. The methods report two separate 4 mL aliquots of each sonicated suspension for scintillation counting; biological-replicate counts, statistical uncertainty and matched killed-cell or cell-free controls are not reported. Surface binding also contributes to the pellet signal.
  - source_ref: klapcinska1986
    supports: support
    explanation: 'Table 1 reports 2.46 versus 0.81 mg Ge/g dry cells with catechol versus acetate, respectively, and 83.4% versus 58.0% of accumulated Ge in the soluble fraction. Figures 1-3 compare Ge-free controls with loaded cells: envelope contrast and catechol-associated cytoplasmic deposits support localization. The 10 mM assay is distinct from the companion 2 mM kinetic experiment.'
  - source_ref: klapcinska1986
    supports: partial
    explanation: Fractionation and microscopy support intracellular accumulation, but electron contrast does not identify a germanium mineral phase or oxidation state. Replication and uncertainty are not reported. Neither study establishes transporter causality, selective product isolation, a full mass balance or industrial deployment.
