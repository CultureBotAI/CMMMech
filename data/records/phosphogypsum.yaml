      id: NCBITaxon:290633
      label: Gluconobacter oxydans 621H
    reference_proteome_id: UP000006375
    ec_numbers:
    - EC:1.3.3.11
    interpro_ids:
    - InterPro:IPR016084
    - InterPro:IPR011845
    - InterPro:IPR039068
    - InterPro:IPR004305
    pfam_ids:
    - Pfam:PF03070
    functional_role: Pyrroloquinoline-quinone synthase (EC 1.3.3.11) catalyzing the final ring-closure and oxidation steps of PQQ cofactor biosynthesis required for holo-Gdh activity and gluconic acid biolixiviant production in Gluconobacter oxydans.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000006375 for Gluconobacter oxydans 621H (NCBITaxon:290633; locus GOX0985) as the strain-sequenced reference representative for parent mechanism taxon Gluconobacter oxydans (NCBITaxon:442; strain NRRL B-58).
    evidence:
    - source_ref: antonick2019
      supports: partial
      explanation: Reviewed Swiss-Prot PQQ synthase from Gluconobacter oxydans 621H (pqqC, GOX0985) supporting the PQQ-dependent glucose oxidation pathway that generates the 220 mM gluconic acid spent medium used in Antonick et al. (2019).
  evidence:
  - source_ref: antonick2019
    supports: support
    explanation: Sections 2.2-2.4 and 3.1-3.2, Table 2 and Figures 2-3 establish REE release into the lixiviant in these model assays. Reported percent-dissolved values were higher for spent medium than commercial gluconic acid, but the small Ce/Nd differences and overlapping uncertainty do not establish a uniformly significant advantage. Table 2 defines errors as 95% confidence intervals from triplicates. Mineral acids adjusted to pH 2.1 and water controls yielded no detectable REEs according to Section 3.1; numerical detection limits and individual null data were not supplied.
  - source_ref: antonick2019
    supports: partial
    explanation: At equal 220 mM concentration, sulfuric acid generally performed better than spent medium; Y was an exception with broadly similar comparator behavior. Equal acid molarity does not mean matched pH. Table 2's Ce leachate concentration and percent-dissolved ordering differ between the two organic lixiviants, limiting a simple concentration-based superiority claim. Section 4.3 explicitly warns that approximately 1 wt% REE synthetic feeds differ from more dilute, mixed industrial residues. Thermodynamic simulations omit kinetic and mass-transfer effects and do not prove the proposed mechanism. Dissolved fractions are not separated products or whole-process yields.
- id: culture_associated_xifeng_pg_release
  name: Gluconobacter culture-associated release from Xifeng phosphogypsum
  process: bioleaching
  description: A supplier-labelled Gluconobacter oxydans culture was associated with rare-earth release and declining pH during treatment of an industrial phosphogypsum sample. Source inconsistencies and unmatched controls limit this to qualitative culture-associated mobilization; no accepted extraction percentage or demonstrated microbial advantage is assigned.
  context: Zhang et al. used Xifeng, Guizhou material ground through 200 mesh and dried. No strain accession or independent taxonomic authentication was supplied. Culture medium started at pH 6.8; Table 4 reports glucose, calcium carbonate and yeast extract at 0.1, 0.02 and 0.01 g/L. The protocol describes 250 mL flasks, 28 degrees C, 150 rpm and nutrient addition in 100 mL then 50 mL stages. Exact timing and liquid/solid accounting are unclear. Liquid-to-solid ratios 2:1, 4:1, 8:1 and 16:1 were compared; the ratio's units and handling of changing volume were not explicit. Samples were centrifuged and supernatants measured by ICP-MS. Culture removal before contact was not reported; this is not assumed to be a cell-free lixiviant assay.
