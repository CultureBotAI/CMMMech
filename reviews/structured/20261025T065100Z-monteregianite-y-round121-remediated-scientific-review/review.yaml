    Y2O3, 1.38% MnO, 5.89% K2O, 9.37% Na2O), powder XRD in Table 1 (p. 562; strongest
    8 lines 12.00, 7.03, 6.55, 6.02, 4.42, 3.405, 3.026, 2.873 Å), physical/optical
    and macdonaldite-group comparison data in Table 2 (p. 563; Dmeas = 2.42(2) g/cm3
    by flotation in diluted bromoform and Berman balance, Dcalc = 2.391 g/cm3, cleavages
    perfect {010}, very good {001}, good to fair {100}, readily etched by cold 1:1
    HCl, HNO3, and H2SO4 along cleavage planes, alpha = 1.510(1), beta = 1.513(1),
    gamma = 1.517(1), 2Vmeas = 87(1)°, 2Vcalc = 82°, X = c, Y = a, Z = b), and simultaneous
    TGA/DTG + DTA/DTG (10 °C/min in air, Fig. 3) three-stage dehydration (25-80, 80-200,
    200-400 °C in ~1:2:2 ratio; 11.40 wt% total loss to 1000 °C; ~99% water recovery
    within 2 h on cooling from 650 °C with identical powder XRD pattern; signs of
    melting quenched from 750 °C; X-ray amorphous quenched from 1000 °C) and IR water
    bands (Fig. 4, 1630 cm-1 and 3460, 3510, 3610 cm-1).'
