limitations:
- Sequential bacterial exposure and baseline aging are not equivalent to simultaneous
  matched controls.
- Table/panel pH, endpoint factors, steady-state timing, biomass and Figure5 label
  discrepancies remain explicit rather than numerically reconciled.
- Fungal nutrient/dead controls are incomplete; modest silica differences do not establish
  a consistent multi-element enhancement.
- Microscopy does not identify the inhibitory molecule or establish a unique passivation
  mechanism; no product recovery or deployment is shown.
- Live browser retrieval failed for the Nature page and NCBI117680; the complete publisher
  PDF/SI and retained official XML were independently inspected.
notes:
- No supported corrective finding on the inspected frozen state.
- Bounded search does not certify absence of all other papers or corrections.
- Raw source artifacts remain outside Git; schema validation is not independent experimental
  replication.
