id: cmmmech:baddeleyite
name: Baddeleyite
material_kind: mineral
description: >-
  Baddeleyite is the natural monoclinic zirconium oxide mineral species ZrO2,
  listed as grandfathered in the September 2026 IMA-CNMNC list. It is distinct
  from elemental zirconium, zircon (ZrSiO4), synthetic zirconia products and
  other ZrO2 polymorphs. Huraiová, Hurai and Konečný (2011) characterized
  baddeleyite associated with a zoned zircon crystal separated from redeposited
  sediments of the Hajnáčka-Kostná dolina basaltic maar, southern Slovakia.
  Cathodoluminescence and backscattered-electron images show baddeleyite in
  melt pockets and in a reaction rim intergrown with sanidine and anorthoclase.
  Their Table 2 reports six representative baddeleyite microprobe analyses
  containing 96.65-98.27 wt.% ZrO2 and 0.99-1.06 wt.% HfO2, alongside analyses
  of the distinct host zircon. These oxide-equivalent specimen compositions
  are not elemental-metal percentages, mineral-wide purity or resource grades.
  The study uses microscopy and electron microprobe chemistry; it does not
  report a new diffraction refinement. Formation by reaction of zircon with
  Si-poor, Al-rich melt is the authors' geological interpretation, not a
  controlled transformation experiment. The reported absence of light rare
  earth elements is bounded by analytical detection limits, not proof of zero
  concentration. This identity and natural-occurrence evidence does not
  establish microbial extraction, recovery, industrial deployment or a dated
  criticality designation for the mineral.
sources:
