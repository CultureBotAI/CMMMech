id: cmmmech:dzhalindite
name: Dzhalindite
material_kind: mineral
description: >-
  Dzhalindite is the indium hydroxide mineral species In(OH)3, listed as
  approved in the September 2026 IMA-CNMNC list with the special-procedure
  year 1967. It is distinct from elemental indium, indite (FeIn2S4),
  mixed ores and synthetic indium hydroxide products considered only by
  formula. Kiseleva and colleagues (2008) report a natural occurrence
  in one quartz-sulfide vein section from 50 metres below the surface
  at the Bugdaya deposit, eastern Transbaikalia, Russia. They describe
  30-94 micrometre crystals in late quartz and zoned In-bearing grains
  examined by optical microscopy, backscattered-electron imaging and
  energy-dispersive elemental analysis. Their dzhalindite assignment
  rests on composition, optical properties and apparent crystal symmetry;
  X-ray diffraction was unsuccessful because the segregations were too
  small. Observed Fe zoning does not establish iron speciation or prove
  substitution within the mineral lattice. The suggested hypogene origin
  and precipitation from fluids that corroded sphalerite are interpretations,
  not demonstrated reaction pathways. Temperatures inferred from other
  phases or analogous veins are not direct measurements on these crystals.
  This particular occurrence does not establish a universal origin,
  a bulk resource grade, or an extraction yield. No microbial mechanism,
  industrial recovery or constituent-derived criticality is assigned.
