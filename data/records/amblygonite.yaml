id: cmmmech:amblygonite
name: Amblygonite
material_kind: mineral
description: Amblygonite is the fluorine-dominant lithium aluminium phosphate mineral with ideal formula
  LiAl(PO4)F, distinct from hydroxyl-dominant montebrasite and from lithium as an element. Natural crystals
  form a substituted F/OH series rather than necessarily pure endmembers. Groat2003 provides primary neutron-diffraction
  and NMR evidence for this series, including F-rich natural specimens. Triclinic P-1 and the centered
  C-1 convention describe settings of the same structure. A separate thesis reports heating of a natural
  specimen labelled amblygonite, but its mixed starting material and conflicting fluorine estimates straddle
  the species boundary. The thermal observation is retained only for that author-assigned specimen, not
  as a universal amblygonite decomposition threshold, microbial mechanism or lithium recovery yield.
