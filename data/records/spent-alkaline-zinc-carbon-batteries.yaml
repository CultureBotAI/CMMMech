      explanation: Representative Acidithiobacillus thiooxidans ATCC 19377 tetrathionate hydrolase (tth) for air-lift sulfur oxidation and biogenic sulfuric-acid/polythionate leaching of Zn and Mn from spent AA battery powder by Acidithiobacillus thiooxidans DSM 11478 in Falco et al. (2014); individual sqr/tth genes were not mutated or directly assayed.
  evidence:
  - source_ref: falco2014
    supports: support
    explanation: Figures 1–4 and Methods II.B–C distinguish culture-based acid production from subsequent powder treatment. Figure 4 reports protons, sulfate, polythionates and free cells during the reactor time course. Results III.B, p.127 and Figure 6 report 100% Zn and 65% Mn extraction after two fresh-medium loads. These are source-reported percentages for prepared powder, not isolated-product or whole-battery yields. Figure 6 plots metal-extracted percent despite its concentration caption; the first- and second-load bars are not summed here, and cumulative accounting is not independently reconstructed. The abstract instead reports 67% Mn, an unresolved difference retained without harmonization.
  - source_ref: falco2014
    supports: partial
    explanation: Methods II.F and Results III.B describe S1 commercial sulfuric acid and S2 biological medium at the same stated acid concentration. The prose reports 60% more extracted Mn and 40% more Zn in S2 relative to S1, but does not supply the underlying numerical series, uncertainty, matched evolving pH/composition or a sterile sulfur-reactor control. These relative increases are not extraction percentages or evidence that live-cell contact was necessary. Equation 6 is a proposed generalized polythionate reaction, not a separately tested molecular pathway. Reactor productivity errors elsewhere refer to successive steps rather than independent battery-leaching replicates.
  - source_ref: falco2014
    supports: partial
    explanation: Table 1 and Figure 5 establish heterogeneous Zn/Mn-containing feed, including residual K in the EDS spectrum despite electrolyte washing. Results III.B characterize remaining solid as Mn/O-rich; the reported Mn2O3 diffraction assignment concerns material calcined at 500 degrees C, not a directly established as-leached crystalline phase. Partial Mn extraction remains explicit. Figure 4 also shows free-cell counts declining late in the acid-production run; acid production is not evidence of unrestricted culture tolerance or indefinite performance.
  - source_ref: dsm11478
    supports: context_only
    explanation: The current DSMZ record assigns DSM 11478/Tth04 to Acidithiobacillus thiooxidans and records mine-drainage provenance. This corroborates the reported culture-collection label, without independent authentication of cells used in the 2014 experiment.
  - source_ref: ncbi930
    supports: context_only
    explanation: The species-level NCBI identifier identifies A. thiooxidans; it does not encode the experimental strain or prove its causal contribution.
- id: downstream_leachate_electrolysis
  name: Separate electrolysis of the biologically generated leachate
  process: recovery
  description: An externally powered electrolysis stage deposited a source-assigned metallic Zn cathodic solid and a Mn-oxide anodic solid from an aliquot of the preceding leachate. This stage is electrochemical, not demonstrated microbial electrodeposition. Deposits and source-reported leachate recovery are documented, but the experiment does not establish a closed whole-battery recovery yield, battery-grade products or commercial production.
  context: Methods II.G–H, p.125 used 6.5 L leaching liquor, two stainless-steel electrodes separated by 25 cm, average current density 100 A/m2, atmospheric pressure and room temperature. Bath samples were analyzed by atomic absorption and pH, and end-of-run solids by acid digestion/atomic absorption, SEM-EDS, diffraction and BET methods. The article does not provide a complete deposit-mass and metal-inventory reconciliation across washing, leaching, liquid replacement, sampling and electrolysis.
  microbial: false
  evidence:
  - source_ref: falco2014
    supports: support
    explanation: Results III.C, pp.127–128 reports 36% Mn and 66% Zn recovery from leaching solution after 68 hours, with metallic Zn described at the cathode and brown Mn oxide at the anode. These leachate-stage percentages are not multiplied by leaching percentages to infer overall recovery. Figure 7 shows the anodic solid's laminar morphology, not a quantitative purity or phase determination.
  - source_ref: falco2014
    supports: partial
    explanation: Current efficiency for both deposits was below 10%. The bath became green and the anode lost mass; the authors attribute the principal Fe impurity to electrode corrosion. The reported Zn deposit purity is 90%; Mn-oxide purity is 82% in Results and 85% in Conclusions. The final electrolysis pH is described as 1.8 and later 1.5. These unresolved differences and low efficiencies are preserved. The Mn2O3 assignment again follows 500-degree-C calcination; it cannot establish an identical crystalline phase in the untreated anodic deposit. Claimed economic and ecological advantages were not a demonstrated full process cost or life-cycle assessment.
