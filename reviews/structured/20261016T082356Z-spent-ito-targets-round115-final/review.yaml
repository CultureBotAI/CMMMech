assessments:
- assessment_id: identity
  area: identity
  topic: Solid spent target versus neighboring resources
  outcome: supported
  summary: The secondary-resource identity and source-designated spent provenance
    are properly bounded.
  details: Main Section 2.1 names Wako spent ITO material but lacks service history.
    It is distinct from LCD panels, virgin ITO, dissolved etching wastewater and elemental
    In/Sn. The owner preserves author-designated spent status without inventing provenance
    or a universal mixed-oxide composition; no inherited criticality or microbe.
  target_ids:
  - cmmmech:spent-ito-targets
  evidence_ids:
  - owner
  - primary
  - dedup
- assessment_id: conditions
  area: consistency
  topic: Actual gram-scale process conditions
  outcome: supported
  summary: The accepted sequence and numerical conditions agree with main methods
    and results.
  details: Chosen 5 mol/L HCl, 10 g/L, 40 C, 500 rpm, 120 min are in 3.1/Figure 1;
    rotary evaporation at 90 C oil bath, 2 h, reported 0.09 MPa vacuum in 2.3. The
    pressure basis remains ambiguous. SOCl2/hydrate 1.2 mL/g, reflux 75 C/2 h and
    Vigreux fractionation are direct methods. Table 3 has 5.079, 5.018, 5.027 g feed
    charges and three parallel runs; Table 4 normalizes comparisons to 1 kg, not a
    demonstrated 1 kg operation.
  target_ids:
  - cmmmech:spent-ito-targets
  evidence_ids:
  - owner
  - primary
- assessment_id: outcome
  area: evidence
  topic: Separated products versus solution-only removal
  outcome: supported
  summary: Original Figure 4 and Table 3 support product separation without verified
    yield/purity.
  details: Figure 4 compares isolated white solid with anhydrous InCl3; Table 3 reports
    distinct InCl3/SnCl4 fractions. Different volatility/solubility supports the stated
    chemical process. The article labels Figure 3 liquid–liquid while its graphic
    shows gas/liquid curves; no phase-model precision or independently reproduced
    fractionation is claimed. Product identity does not prove 99.8% purity.
  target_ids:
  - cmmmech:spent-ito-targets
  evidence_ids:
  - owner
  - primary
- assessment_id: uncertainty
  area: evidence
  topic: Missing SI and contradictory quantitative accounting
  outcome: supported
  summary: Withholding exact recovery, purity and composition is scientifically justified.
  details: Table 1 oxide XRF versus ICP ion labels nearly sum to 100 on incompatible
    apparent basis; unavailable Table S1 needed. Tin recovery abstract 98.0%, section
    3.3 ~98.5%, conclusion 98.6%; no number silently selected. Table S5 purity and
    S3/S6–S8 comparison inputs uninspected. Table 4 kW energy label is not silently
    converted. Main Table 2 reports ppm without complete basis, so no native concentration
    observations derived.
  target_ids:
  - cmmmech:spent-ito-targets
  evidence_ids:
  - owner
  - primary
- assessment_id: deployment
  area: scope
  topic: Microbial and industrial boundaries
  outcome: supported
  summary: Gram-scale recovery is not an established sustainable industrial or closed-loop
    process.
  details: No biology is included in the accepted experiment. Introduction mentions
    Shewanella biosorption only as other literature, not a target-material mechanism.
    Scheme recycle arrows and author comparisons do not establish tested reagent reuse,
    LCA, economic superiority or scale-up. These limitations are retained in the record.
  target_ids:
  - cmmmech:spent-ito-targets
  evidence_ids:
  - owner
  - primary
  - notices
- assessment_id: provenance
  area: provenance
  topic: Exact current inputs and completed checks
  outcome: supported
  summary: Frozen record/history/schema/dossier and completed checks are verified
    for this owner.
  details: Actual inline CREATE and linked canonical CREATE metadata, timestamps and
    target are coherent. Reviewer did not mutate target/history. Named records/history
    and root four-command batch all pass with current hash/log binding. The final
    scientific review is limited to this assigned owner, not the entire corpus.
  target_ids:
  - cmmmech:spent-ito-targets
