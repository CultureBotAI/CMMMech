limitations:
- Only the named factory waste and the described laboratory chemical route are verified;
  no universal composition, microbial route or plant deployment is established.
- The recovery stage lacks reported replicate count, uncertainty, complete liquid
  volumes, batch mass, matched omission controls and closed element mass balance.
  Approximate yield remains explicitly author-reported.
- The isolated product retains lanthanum and minor components; a ceria-type diffraction
  phase does not prove chemical purity.
- Original recovery-relevant pages1-5, Table1 and Figures1-3 were visually inspected.
  Later degradation-performance pages6-8 were not fully visually reviewed because
  those endpoints are not curated; the appended advertisement is outside scientific
  scope.
- Correction/contrary-evidence searches were bounded to first returned sets; no exhaustive
  assurance against future or unindexed notices is made.
