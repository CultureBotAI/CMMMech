    - Pfam:PF13360
    functional_role: Periplasmic tetrathionate hydrolase (EC 3.12.1.-; tth / AFE_0029) hydrolyzing tetrathionate into thiosulfate, elemental sulfur, and sulfate, generating sulfuric acid protons.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000001362 for Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159).
    evidence:
    - source_ref: liu2019
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 tetrathionate hydrolase (tth / AFE_0029) for polythionate disproportionation and sulfuric-acid generation during inoculated bioleaching of Yaogangxian natural arsenopyrite (FeAsS) in Liu et al. (2019); individual sqr/tth genes were not mutated.
  evidence:
  - source_ref: liu2019
    supports: support
    explanation: Sections 3.3 and 4.1.1 and Figure 1a report arsenic measured by ICP-AES and an As leaching ratio of 30.4%, corresponding to reported total dissolved As of 1.3 g/L after 19 days, followed by a plateau. This percentage is the authors' As leaching ratio, not a measured percentage of the whole mineral destroyed or a recovered-product yield. A calculation formula and sampling-volume correction are not given, so no independent mass-normalized yield is reconstructed. The plotted time course supports the plateau; its earlier rate is not treated as an exact constant even though the prose calls it nearly linear.
  - source_ref: liu2019
    supports: partial
    explanation: Figures 1b-1d show an early increase in suspended cell count and Fe(III), depletion of Fe(II), an initial pH rise followed by decline, and changing solution potential reported versus SHE. The medium already supplied substantial iron, so dissolved iron cannot be assigned solely to the mineral. No uninoculated or matched-pH kinetic series is presented. These observations are compatible with the authors' ferric-regeneration model but do not quantify the microbial increment above abiotic dissolution or prove a particular enzymatic mineral-attack pathway.
  - source_ref: liu2019
    supports: support
    explanation: Sections 3.2-3.3 and 4.1.2 and Figure 2 identify arsenopyrite and newly detected realgar, orpiment, elemental sulfur and jarosite in washed particle residues by XRD and Rietveld quantitative phase analysis. Figure 2b shows relative phase weight fractions in the recovered solids, not an absolute arsenic balance or dissolution percentage. The paper writes realgar as As2S2; that source notation does not supply a separate mineral identifier. Jarosite becomes prominent later, while early arsenic/sulfur phases decline in relative abundance. Secondary-solid formation prevents equating arsenic in solution with total oxidative destruction of FeAsS.
  - source_ref: liu2019
    supports: partial
    explanation: Figures 4-5 and Table 1 distinguish a dense surface film on polished cubes at 36 and 120 h from loose, porous jarosite-like deposits at 8 days. EDS spots on the dense film were enriched in As and S relative to Fe compared with the underlying mineral. Together with the separate particle XRD results, the authors infer an early realgar/orpiment/sulfur-rich passivating film; EDS alone does not identify those molecular phases or establish each phase's causal contribution. The source attributes visible film cracks to drying. Cubes were polished, ultrasonically cleaned in alternating 5 M HCl, methanol and water baths, then fixed, rinsed and dehydrated after incubation. This preparation and the different particle/cube geometries limit direct quantitative transfer between assays.
  - source_ref: liu2019
    supports: partial
    explanation: Section 4.2 argues that the later porous jarosite overlayer is unlikely to be the principal passivating film in this particular system. Section 4.1.1 first notes that the nearly linear As release lacks an obvious kinetic sign of passivation, then infers inhibition from its weak response to increasing cell numbers and ferric iron. The early-film interpretation is therefore retained as proposed, not proven by a selective removal experiment. Figure 3 and Table 2 are thermodynamic predictions and possible reactions, calculated at 25 degrees C and 1 atm rather than the 30-degree culture temperature. The authors explicitly note disagreement between equilibrium predictions and early residue phases. No universal passivating role of jarosite, sulfur or an arsenic phase is asserted.
