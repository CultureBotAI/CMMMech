mechanisms:
- id: filtered_biogenic_acid_zinc_leaching
  name: Zinc mobilization by sulfur-oxidizing culture-derived acid
  process: bioleaching
  description: Acidithiobacillus thiooxidans DSM 504 produced an acidic sulfur-containing culture liquid that was filtered before contact with the EAF dusts. The evidence supports indirect biogenic-acid dissolution of zinc under specified laboratory conditions. The organism generated the lixiviant; living cells were not intentionally retained in the leaching stage. Preferential zinc mobilization over iron was strongly feed- and condition-dependent and is not an isolated-metal recovery yield.
  context: Methods 2.1-2.3 describe two EAF dusts from a steelmaking company, without naming its location or defining their mineral phases. Table 4 reports 99.8% dry mass in both, with Zn 161000 and 390000 mg/kg dry mass in Dusts 1 and 2 respectively. Drying at 105 degrees C refers to dry-mass characterization; whole-feed sterilization or pretreatment is not stated. The named culture was grown in basal salts, elemental sulfur and 0.02 g/L yeast extract. Acid production used a 3-L working-volume stirred reactor at 30 degrees C, 160 rpm and 75 L/h air, with 20 g/L sulfur and 100 mL inoculum. After each two-week production cycle, fresh medium and sulfur replaced the contents and 100 mL from the previous culture reinoculated the next cycle. The authors call this fed-batch operation. Culture liquid passed through a 0.22-micrometre filter before duplicate 50-mL leaching assays. Assays varied 50-100 g/L dust, 30-50 degrees C and 2 minutes to 24 hours; leaching mixing speed is not given. The reactor's
    160 rpm is not assigned to these separate leaching assays.
