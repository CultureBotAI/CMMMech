assessments:
- assessment_id: identity
  area: identity
  topic: Accepted species versus historical and laboratory specimens
  outcome: supported
  summary: Species identity and sample provenance remain distinct.
  details: IMA lists CaB3O3(OH)5(H2O)3·H2O, G status and 1914 description year. The
    independent 1916 investigation supports Mount Blanco near Death Valley and inferred
    meyerhofferite alteration; its very small chemical analysis did not directly measure
    boron. The 2022 introduction attributes Kramer to Schaller, but the new pressure
    crystal has unreported collection locality. These localities are not substituted
    for one another. Inyoite-II is an experimental label, not another asserted natural
    approved species.
  target_ids:
  - cmmmech:inyoite
  evidence_ids:
  - owner
  - ima
  - schaller
  - comboni
- assessment_id: protocol
  area: scope
  topic: Measured pressure transition and sampling bracket
  outcome: supported
  summary: The record supports a narrow abiotic laboratory observation.
  details: One approximately 20 x 15 x 10 micrometre museum crystal was characterized
    by single-crystal diffraction and compressed in a membrane-driven DAC at ESRF
    ID15B with helium medium and ruby calibration, uncertainty 0.05 GPa; CIFs record
    approximately 293 K. Table 1 and Figures 2-3 bracket the change between 8.25(5)
    and 8.86(5) GPa, with volumes 824.75(6) and 762(2) cubic angstroms. The approximately
    7.6% sampled volume drop is not an equilibrium transition pressure, replicate
    statistic or recovery yield.
  target_ids:
  - cmmmech:inyoite
  evidence_ids:
  - owner
  - comboni
  - supplements
- assessment_id: model
  area: evidence
  topic: High-pressure phase and structural interpretation
  outcome: supported
  summary: Unsolved structure and non-recovery are correctly retained.
  details: Too few sufficiently intense reflections prevent solving inyoite-II. Monoclinic
    metrics and extinctions suggest P21/n but do not determine its atomic structure.
    Starting-phase non-hydrogen refinements and O-O distances support deformation
    interpretation; H positions were not located. Boron three-to-four coordination
    is an analogy-based hypothesis. Repeated ambient-pressure measurements after decompression
    produced no reflections, so reversibility or a recovered crystalline product is
    not established.
  target_ids:
  - cmmmech:inyoite
  evidence_ids:
  - owner
  - comboni
  - supplements
- assessment_id: conflict
  area: evidence
  topic: Pressure-volume inconsistencies and access limits
  outcome: supported
  summary: The owner preserves material source conflicts without fabricated corrections.
  details: Abstract 19.80(5) GPa disagrees with body 18.9 and Table 1 endpoint 18.91(5);
    Table 1 at 2.00 GPa, 944.0(1) disagrees with matching CIF 923.96(11). File 10
    starts with a 7.23-GPa comment but its cell volume 864.61(10) matches the manuscript
    5.19-GPa row; dossier and follow-up retain this extra deposit metadata conflict.
    The owner imports no reconciled dataset or fitted high-pressure structure. Publisher
    final PDF was not acquired; institutional Revision_1 and official supplements
    are the actual assessed versions.
  target_ids:
  - cmmmech:inyoite
  evidence_ids:
  - owner
  - dossier
  - comboni
  - supplements
