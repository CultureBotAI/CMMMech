- id: g20_baricite_assignment_graph
  name: Oleidesulfovibrio alaskensis G20 H2-fed sulfate reduction, medium alkalinization, and barićite-assigned phosphate precipitation
  description: Causal pathway linking representative Oleidesulfovibrio alaskensis G20 (NCBITaxon:207559; reference proteome UP000002710) dissimilatory sulfate-reduction enzymes (Sat Dde_2265, AprBA Dde_1109-Dde_1110, and DsrAB-DsrC Dde_0526-Dde_0527 / Dde_0762) to H2-dependent sulfate reduction in acetate-amended synthetic marine pore-water medium (22.3 mM sulfate, 47 mM acetate, 50.7 mM MgCl2.6H2O, 8.22 mM Ca, 10.58 mM NH4+, 0.89 mM Na2HPO4 in Main Table 1 vs 0.089 mM in SI Table 1, plus an iron finishing nail; 10 months at 25 C), driving sulfide crust formation on the iron nail and pH elevation from 7.5 to 8.3 (versus 7.7 and 7.9 in sterile controls) and yielding recovered solids with Rietveld XRD assignments of 30.6 and 27.8 wt% barićite in samples 1_103 and 2_35 alongside a magnesium-phosphate decahydrate, calcite, and elemental sulfur in Han et al. (2016).
