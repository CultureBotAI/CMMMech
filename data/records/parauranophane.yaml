id: cmmmech:parauranophane
name: Parauranophane
material_kind: mineral
description: >-
  Parauranophane is the calcium uranyl silicate hydrate mineral
  Ca(UO2)2(SiO3OH)2(H2O)4·H2O listed by IMA in September 2026. It is the
  historical beta-uranophane or uranophane-beta, renamed by CNMNC in August
  2022. Rn, 2022 s.p. denotes that nomenclature action, not a unique approval
  accession. The alpha polymorph is the separate species uranophane;
  identical ideal composition does not make their experiments interchangeable.
  Cesbron and colleagues characterized natural beta material from Nopal I,
  Sierra Peña Blanca, Chihuahua, Mexico, by morphology and powder X-ray
  diffraction, including a refined monoclinic cell with space group P21/a
  in the reported setting. Their synthesis campaign produced uranophane
  but no beta polymorph under the tested conditions; its stability field
  remained unresolved. No criticality, microbial activity, extraction yield
  or industrial deployment is inferred from these mineralogical studies.
