  evidence:
  - source_ref: xie_2026
    supports: support
    explanation: Figure 1d and Results 3.1.2 support faster and greater Rh depletion in the cell-containing mixture than in its no-cell control. Figures 2 and 5b and Results 3.5.2 combine an intermediate lattice spacing and Pd/Rh co-localization to support the authors' alloy assignment. The XRD/Vegard-law estimate of Pd71/Rh29 and EDS estimates near Pd60/Rh40 are method-dependent estimates, not one exact uniform particle composition; Figure 5 labels field averages.
  - source_ref: xie_2026
    supports: partial
    explanation: Figure 3 and Table 1 fit the bimetallic surface Rh signal as 81% Rh(0) and 19% Rh(III). These are fitted surface proportions, not whole-feed reduction yields. The partial abiotic Rh removal and unknown donor-free outcomes preclude assigning all Rh depletion to metabolism. Proposed changes in complex speciation, reduction potential and cytochrome mediation were not directly resolved in this assay; no specific microbial enzyme is established.
  - source_ref: xie_2026
    supports: context_only
    explanation: Methods 2.4, Results 3.6, Figure 6 and supplementary Table S1 concern subsequent NaBH4-driven 4-nitrophenol catalysis at room temperature, normalized to 4 mol% total metal relative to the initial organic substrate. Bio-PdRh performed better than monometallic bio-Rh in this benchmark, while bio-Pd had the fastest initial rate. These catalyst results are not Rh recovery percentages or demonstrations of microbial metabolism during the catalytic test.
