limitations:
- Mixed substrate and unmatched acid exposures limit mineral-specific and biological
  attribution. Source formula, loading and dataset inconsistencies remain disclosed.
- 'Kirk Supplementary Data Sheet 1 was not acquired in this review: publisher HTML
  names the DOCX without an accessible download link; PMC returned a browser challenge.
  Supplement-dependent acid-dose numbers or independent quantitative reproduction
  are not certified.'
- Full record coverage is not exhaustive literature coverage or a new independent
  laboratory replication. Raw PDFs and workbook receipts remain outside Git at the
  documented temporary paths.
- Dated IMA edition is the identity authority used here; no timeless criticality or
  ideal-purity identity is inferred. Root owns shared batch validation; receipt reuse
  does not imply this reviewer executed it.
