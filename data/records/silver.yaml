mechanisms:
  - id: mr1_silver_reduction
    name: Anaerobic culture-associated formation of elemental silver
    process: redox_transformation
    description: >-
      Growing Shewanella oneidensis MR-1 cultures transformed Ag(I)-bearing
      material to precipitates containing XRD-identified elemental Ag(0).
      This laboratory observation does not establish an isolated-product
      yield, complete conversion, or industrial recovery process.
    context: >-
      Defined chloride/phosphate-containing medium with 100 mM lactate and
      20 mM fumarate, adjusted to pH 7.6 before sterilization; anaerobic
      incubation at 30 degrees C in the dark. General exposure methods add
      AgNO3 at nominal 1-400 micromolar Ag(I), with 10 mL inoculum added to
      80 mL medium, and state six biological replicates. The separate XRD
      protocol specifies 1 L medium with 100 micromolar AgCl, no agitation,
      and 24 h incubation. This difference in stated starting salt is
      retained, not resolved by treating all added Ag as dissolved AgNO3.
      XRD samples were centrifuged, water-washed, and dried anaerobically.
    microbial: true
    organisms:
      - id: NCBITaxon:211586
        label: Shewanella oneidensis MR-1
    evidence:
      - source_ref: wang_2010
        supports: support
        explanation: >-
          Methods (XRD analysis), Results (Analysis of silver precipitates),
          and Figure 3 compare AgCl/Ag3PO4-containing precipitates without
          cells with Ag(0) diffraction after culture incubation. No-cell
          media lacked the culture-associated color change. Figure 4 shows
          cell-associated electron-dense particles after Ag exposure,
          absent from the no-Ag control; microscopy alone does not assign
          the oxidation state of each particle.
      - source_ref: wang_2010
        supports: partial
        explanation: >-
          Results and Figure 2 show dose-dependent limits: growth was
          delayed at nominal 100 micromolar Ag(I) and absent at 400
          micromolar. Abiotic precipitation means nominal added Ag(I)
          differs from dissolved exposure. The abstract's statement that
          100 micromolar reduced doubling time conflicts with the Results,
          which report an increase from about 7.5 to 24 h. Proposed roles
          for cytochromes or flavins in the Discussion were not tested
          causally in this experiment; neither solution depletion nor
          product mass balance was established for the inoculated cultures.
