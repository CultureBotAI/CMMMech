- id: ncbi-ferrooxidans
  title: NCBI Taxonomy 920, Acidithiobacillus ferrooxidans; Thiobacillus ferrooxidans is a homotypic synonym.
    Species nomenclature only, not authentication of the experimental stock.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920&mode=Info
