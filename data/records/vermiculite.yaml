id: cmmmech:vermiculite
name: Vermiculite
material_kind: mineral_group
description: Vermiculite denotes compositionally variable hydrated layer silicates, represented here at
  mineral-group scope rather than as a particular ideal endmember or traded exfoliated product. The Handbook
  of Mineralogy explicitly calls vermiculite a group name with unspecified individual minerals; the September
  2026 IMA list also retains Vermiculite as a grandfathered name, dated 1824, with generalized formula
  Mg0.7(Mg,Fe,Al)6(Si,Al)8O20(OH)4·8H2O. These nomenclature treatments are both retained. The experiment
  below concerns one characterized natural specimen deliberately exchanged with potassium before fungal
  exposure, not all vermiculite ores or naturally potassium-rich material. No constituent criticality
  designation is inherited.
