  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 104, Jarosite row; page 1 explains status and approval/redefinition fields.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
