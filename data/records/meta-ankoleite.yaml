id: cmmmech:meta-ankoleite
name: Meta-ankoleite
material_kind: mineral
description: Meta-ankoleite is an IMA-approved potassium uranyl phosphate mineral, K(UO2)(PO4)·3H2O, approval 1963-013. The doubled formula K2(UO2)2(PO4)2·6H2O describes the same ideal composition. It is distinct from calcium meta-autunite, hydronium chernikovite, ammonium uramphite, dissolved uranium salts and elemental uranium. The laboratory evidence below is a source-assigned meta-ankoleite component of yeast-associated uranyl phosphate precipitates; overlapping diffraction matches and incomplete cation/hydration characterization prevent an unequivocal pure-species assignment. No uranium criticality designation is inherited.
