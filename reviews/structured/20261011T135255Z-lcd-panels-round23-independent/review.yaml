limitations:
- Controls do not isolate ferric chemistry from acidity or identify a necessary organism;
  conclusions remain culture-associated.
- Missing working volume, exact sulfur accounting, sample replacement, independent
  replicate counts and raw analytical uncertainty preclude a fully closed/reproduced
  metal balance.
- Source percentages and concentrations are not entirely consistent; graph curves
  were visually assessed, not digitized into invented precision.
- SEM-EDS does not uniquely identify crystalline jarosite or a particular tin precipitate;
  no isolated recovered metal product established.
- Live correction/duplicate searches were bounded; curator-acquired PDF and parent-executed
  batch checks are disclosed. Deferred 2022 evidence is not accepted or independently
  fully reviewed here.
notes:
- Scientific assessment began after canonical inspect captured exact uncommitted inputs.
  This reviewer made no LCD source, history or record edits.
- No issue was manufactured because no actionable record finding was observed. The
  source-paper limitations are already explicitly represented.
- Structured review gate is performed after saving this immutable bundle; this review
