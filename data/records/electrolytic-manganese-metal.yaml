id: cmmmech:electrolytic-manganese-metal
name: Electrolytic manganese metal commodity
material_kind: commodity
description: Manufactured manganese metal obtained by electrolytic deposition, supplied in
  forms including flake and powder. MMC describes purified manganese solution deposited on
  cathodes, followed by stripping and product preparation; its separate low-hydrogen and low-oxygen
  products illustrate variation within this family. Tosoh identifies alloy-addition applications.
  This process-defined commodity is distinct from the manganese element, manganese ores, dissolved
  manganese, manganese dioxide, sulfate salts and mixed manganese-aluminium briquettes. Producer
  specifications are examples, not universal purity or battery-qualification rules. MMC distinguishes
  total manganese from a metallic-manganese calculation excluding nonmetallic components;
  its product page and linked 2017 low-oxygen sheet disagree on the oxygen maximum, so no
  numerical grade boundary is assigned. No criticality designation or microbial production
  of this qualified metal product is asserted.
