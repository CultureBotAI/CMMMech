id: cmmmech:sepiolite
name: Sepiolite
material_kind: mineral
description: Sepiolite is the hydrated magnesium silicate mineral Mg4Si6O15(OH)2(H2O)2·4H2O, an orthorhombic
  ribbon-like clay mineral. It is distinct from elemental magnesium, magnesium commodities, the biotite
  mineral group and phlogopite. The September 2026 IMA list gives grandfathered status and original-description
  year 1847, not a unique approval accession. The accepted experiments concern laboratory abiotic dissolution
  of source-characterized, Mg-deficient sepiolite. No constituent criticality, microbial mechanism, recovered
  magnesium product or industrial deployment is inferred.
