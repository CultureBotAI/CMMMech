limitations:
- No spectral refitting, raw analytical calibration audit or full Ru mass balance;
  evidence supports the authors' bounded phase interpretation, not an independently
  proven unique Ru phase.
- Cell-free/killed-cell/H2-free Ru deposition outcomes, replication count, sustained
  viability and a necessary microbial enzyme remain unestablished in the inspected
  article and complete supplement.
- ChEBI live fetch/API retries failed. Identity was independently verified from the
  complete official retained HTML with matching acquisition hash; this is not claimed
  as successful live resolution.
- E. coli context was checked against full-text methods and bulk spectral results/Table
  3; its entire supplementary-image corpus was not re-reviewed and no new E. coli
  mechanism is admitted.
- Correction/retraction and conflicting-evidence searches were bounded first-result
  sets; no complete citation-network, proprietary database or author-contact audit.
  A clean result applies only to this frozen target state.
