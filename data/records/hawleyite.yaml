            annotation_note: Grounded to congeneric Thermoanaerobacter pseudethanolicus ATCC 33223 / 39E reference proteome UP000002156 (NCBITaxon:340099; Teth39_0119, UniProtKB:B0KB21), representing the second NifS/SufS-like cysteine desulfurase paralog alongside IscS (Teth39_0280, UniProtKB:B0KC13) and Teth39_1911 (UniProtKB:B0KCT7) in genus Thermoanaerobacter for strain X513 (NCBITaxon:573062) in Moon et al. (2013).
            evidence:
              - source_ref: moon2013
                supports: partial
                explanation: Figure 1 of Moon et al. (2013) demonstrates CdS nanoparticle formation by Thermoanaerobacter sp. X513 supplied with cysteine (producing cubic hawleyite-assigned CdS) or thiosulfate/sulfite (producing mixed hawleyite and greenockite), without identifying the specific desulfurase paralogs or thiosulfate/sulfite reductase loci in strain X513.
              - source_ref: uniprot_thermoanaerobacter_cysteine_sulfur
                supports: partial
                explanation: UniProtKB:B0KB21 (B0KB21_THEP3, Teth39_0119) in Thermoanaerobacter pseudethanolicus reference proteome UP000002156 (NCBITaxon:340099) encodes Cysteine desulfurase (EC 2.8.1.7; GO:0031071 cysteine desulfurase activity; GO:0019448 L-cysteine catabolic process).
