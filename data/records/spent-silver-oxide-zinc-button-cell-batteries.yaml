id: cmmmech:spent-silver-oxide-zinc-button-cell-batteries
name: Spent silver-oxide–zinc button-cell batteries
material_kind: secondary_resource
description: Discarded button cells identified by the primary source as silver-oxide–zinc batteries, distinct from zinc–manganese button cells, other battery chemistries, elemental silver or zinc and isolated recovered products. The accepted experiment used powder manually removed from market-collected waste cells, not intact batteries or an authenticated pure oxide feed. It supports laboratory metal mobilization with a filtered fungal culture medium, with unresolved experimental-condition and yield conflicts.
sources:
- id: jadhav_2018
  title: Jadhav U, Su C-H, Chakankar M, Hocheng H (2018). Leaching of Metals from Waste Silver Oxide-Zinc Button Cell Batteries by Aspergillus niger. Batteries 4(4):51. DOI 10.3390/batteries4040051; complete seven-page original, Sections 2–4, Tables 1–2 and Figures 1–4.
  url: https://doi.org/10.3390/batteries4040051
  accessed_on: '2026-10-14'
- id: ncbi_5061
  title: NCBI Taxonomy 5061, current species name Aspergillus niger. Species-level name context only; not authentication of the unnamed FIRDI culture used in the experiment.
  url: https://www.ncbi.nlm.nih.gov/datasets/taxonomy/5061/
  accessed_on: '2026-10-14'
mechanisms:
- id: fungal_filtrate_metal_mobilization
  name: Metal mobilization by an Aspergillus niger culture filtrate
  process: bioleaching
  description: Filtered spent medium from a source-named Aspergillus niger culture mobilized zinc, silver and a much smaller fraction of mercury from waste-cell powder. Organic-acid action is the authors' explanation, but this experiment does not isolate citric acid from other medium constituents or demonstrate a microbial increment over a matched sterile-medium or chemical-acid control. Cells were removed before leaching; this is not evidence of fungal growth at the leaching temperatures or of a live-cell uptake mechanism. Solution analysis does not establish purified-metal recovery.
  context: The culture came from FIRDI, Hsinchu, Taiwan, without a strain accession. The referenced earlier tin-removal paper's 34770 strain is not assigned to this assay. Sucrose medium contained 100 g/L sucrose plus nitrate, phosphate, magnesium sulfate, potassium chloride and yeast extract. Section 2.3 describes both 30 and 25 degrees C cultivation at 120 rpm for ten days, then 0.22 micrometre filtration. It reports pH 1.97 and 20 g/L citric acid while citing an earlier study; no independent metabolite assay is described here. Collected cells were manually dismantled and their powder dried at 60 degrees C. Brand, battery model, discharge state, particle-size distribution and phase authentication are not supplied. Aqua-regia digestion and ICP-OES provide the Table 1 feed assay, including Zn 290 mg/g and Ag 35.86 mg/g; these are digested elemental concentrations, not phase abundances or whole-device inventories. The time series used 0.10 g powder in 100 mL filtrate in 250 mL flasks at 30
    degrees C and 150 rpm for up to eight hours. Separate temperature, agitation and filtrate-volume series varied these conditions. Experiments were triplicate and leachates were analyzed by ICP-OES; sample-volume correction, complete mass balances and the meaning of plotted error bars are not specified. Laboratory assays alone are documented.
  microbial: true
  organisms:
