  - id: NCBITaxon:243231
    label: Geobacter sulfurreducens PCA
  protein_examples:
  - uniprot_accession: UniProtKB:Q747K6
    entry_name: IMCH_GEOSL
    protein_name: Cytochrome c-type protein ImcH
    gene_symbol: imcH
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:243231
      label: Geobacter sulfurreducens PCA
    reference_proteome_id: UP000000577
    interpro_ids:
    - InterPro:IPR051174
    - InterPro:IPR036280
    - InterPro:IPR005126
    - InterPro:IPR038266
    pfam_ids:
    - Pfam:PF03264
    functional_role: Inner-membrane multiheme c-type cytochrome ImcH (GSU3259) associated by deletion-mutant phenotypes with condition-dependent extracellular electron transfer to synthetic akaganeite at higher effective redox potential (pH 6.8 vs 6.3 and 121 degrees C autoclaving in Levar et al. 2017; direct mineral redox potential and purified-ImcH quinone oxidoreductase activity were not measured).
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: In Levar et al. (2017) Figure 2, deleting imcH (GSU3259) in Geobacter sulfurreducens PCA caused an ~7-day lag before akaganeite reduction approached the wild-type endpoint at pH 6.8 (shortened by 121 degrees C autoclaving) and strongly suppressed reduction at pH 6.3, while mineral redox potential was inferred from soluble Fe(III)-citrate comparisons (Figure 1) rather than directly measured and complementation was cited from prior work.
    annotation_note: Grounded to Geobacter sulfurreducens PCA reference proteome UP000000577 (NCBITaxon:243231, locus GSU3259); Levar et al. (2017) tested the delta-imcH deletion mutant in strain PCA and cited complementation from earlier work rather than repeating complementation in Figure 2.
  - uniprot_accession: UniProtKB:Q74GH2
    entry_name: Q74GH2_GEOSL
    protein_name: Cytochrome c, and cytochrome b
    gene_symbol: cbcL
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:243231
      label: Geobacter sulfurreducens PCA
    reference_proteome_id: UP000000577
    interpro_ids:
    - InterPro:IPR036280
    - InterPro:IPR012286
    pfam_ids:
    - Pfam:PF14537
    functional_role: Inner-membrane b/c-type cytochrome CbcL (GSU0274) associated by deletion-mutant phenotypes with sustaining akaganeite reduction to the full wild-type 0.5 N HCl-extractable Fe(II) endpoint in Levar et al. (2017), without direct mineral redox-potential measurement or purified-protein assays.
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: In Levar et al. (2017) Figure 2, deleting cbcL (GSU0274) in Geobacter sulfurreducens PCA allowed initial akaganeite reduction without the delta-imcH lag but stalled below the wild-type 0.5 N HCl-extractable Fe(II) endpoint across pH 6.8 and 6.3 regimes, while mineral redox potential was not directly measured and complementation was cited from prior work.
    annotation_note: Grounded to Geobacter sulfurreducens PCA reference proteome UP000000577 (NCBITaxon:243231, locus GSU0274); Levar et al. (2017) tested the delta-cbcL deletion mutant in strain PCA and cited complementation from earlier work rather than repeating complementation in Figure 2.
  evidence:
  - source_ref: levar_2017
    supports: support
    explanation: Methods and Results, Evidence that the electron transfer pathway changes even in the absence of XRD pattern changes, plus Figure 2 show wild-type reduction at pH 6.8 and no observable reduction in the reported 14-day cell-free controls. Delta-cbcL starts reducing but stalls below wild type; fresh-medium delta-imcH has a roughly seven-day lag before approaching the wild-type endpoint. Autoclaving at pH 6.8 shortens that lag. At pH 6.3, delta-imcH reduction is strongly suppressed and autoclaving does not restore it. Table 1 fumarate-growth comparisons help exclude a gross pH-dependent growth defect. These are condition-specific phenotypes, not universal knockout inability.
  - source_ref: levar_2017
    supports: partial
    explanation: The discussion explicitly states that mineral redox potentials cannot be directly measured in these experiments; quantitative voltage measurements in Figure 1 concern soluble Fe(III)-citrate, not akaganeite. Similar powder XRD before/after autoclaving does not exclude changes in aggregation, short-range order or surface properties. Direct ImcH/CbcL electron movement from the quinone pool is not demonstrated, and complementation is cited from earlier studies rather than performed as a Figure 2 control. The record therefore retains pathway association and inferred redox interpretation without treating a particular mineral voltage, direct protein mechanism, complete feed conversion, isolated recovery or industrial deployment as demonstrated.
  - source_ref: sklute_2023
    supports: context_only
    explanation: A separate 55 degrees C hydrogen-fed Ax17 experiment on synthetic nanophase akaganeite gave a dark nonmagnetic product with amorphous iron-rich nanospheres; oxalate-extractable Fe(II) was not significantly different from controls, while temperature-dependent Mossbauer analysis detected new ferric and ferrous components with nonunique phase fits. Heated abiotic controls also changed. That different organism, medium and analytical extraction is not a direct replication or refutation of PCA reduction, and cautions against assuming a universal crystalline recovery product or equating an extraction null with no transformation.
