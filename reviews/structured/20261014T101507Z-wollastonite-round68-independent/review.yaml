summary: Wollastonite is the mineral CaSiO3, distinct from elemental calcium/silicon,
  commodities, rocks and secondary feeds. IMA special-procedure notation does not
  identify a polytype of the assayed natural material. Live/dead bacterial dissolution
  is supported as a tested interaction with limited and uncertain effects. The source
  interpretation is qualified by conflicting rate summaries and unlike conditions;
  it is not generalized to all silicates or field biota.
