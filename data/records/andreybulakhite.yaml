id: cmmmech:andreybulakhite
name: Andreybulakhite
material_kind: mineral
ima_symbol: Adb
description: >-
  Andreybulakhite (IMA 2023-037, symbol Adb) is an IMA-accepted hydrated nickel
  oxalate mineral of the humboldtine group, the first natural nickel oxalate,
  with September 2026 IMA Master List ideal formula Ni(C2O4)(H2O)2 (status A,
  PDF p. 11; written Ni(C2O4)·2H2O in Vereshchagin et al. 2025, p. 63) and
  holotype empirical formula (Ni0.63Cu0.27Mg0.08Co0.02)Sigma1.00(C2O4)·2H2O on
  the basis of (Ni + Cu + Mg + Co) = 1 apfu (Table 1, p. 65). Energy-dispersive
  X-ray microprobe analysis (5 spots at 20 kV, 0.5 nA, defocused 5 um spot;
  Table 1, p. 65) gave NiO 26.21 (range 24.87–27.09), CuO 11.99 (9.69–13.74),
  MgO 1.86 (0.96–2.42), CoO 0.72 (0.46–1.00), stoichiometric C2O3 40.15
  (39.67–40.48), stoichiometric H2O 20.09 (19.85–20.25), total 101.03 wt%
  (100.37–102.07 wt%), with Fe below the detection limit in all analyses (ideal
  Ni(C2O4)·2H2O: NiO 40.88, C2O3 39.42, H2O 19.70, total 100.00 wt%). Described
  by Vereshchagin, Britvin, Pankin, Zelenskaya, Krzhizhanovskaya, Kuz'mina,
  Vlasenko, and Frank-Kamenetskaya (2025) from the Nyud-II (Nud-II) magmatic
  Cu–Ni sulfide deposit, Monchegorsk layered mafic–ultramafic pluton
  (Monchepluton), Kola Peninsula, Russia (67°53'14" N, 32°54'4" E; holotype
  deposited at the Mineralogical Museum of the Department of Mineralogy, Saint
  Petersburg State University, catalogue number ML OF-978), where it occurs in
  the upper part of the fruiting bodies (apothecia) of the saxicolous crustose
  lichen Lecanora cf. polytropa overgrowing heavily weathered, millimeter-scale
  sulfide veinlets (~85 vol% pyrrhotite, 10 vol% pentlandite, 5 vol%
  chalcopyrite) hosted in orthopyroxenite/norite (~70 vol% plagioclase/anorthite
  and 30 vol% enstatite–ferrosilite pyroxene) together with secondary nickel
  sulfates morenosite (NiSO4·7H2O) and nickelhexahydrite (NiSO4·6H2O) (pp.
  63–65, Fig. 1). Named in honor of Russian mineralogist Prof. Andrey Glebovich
  Bulakh (1933–2020). Forms tiny colorless to pale green, transparent platy to
  prismatic (including box-shaped / hopper-like) crystals up to 2 x 1 x 1 um in
  aggregates up to 40 x 30 x 30 um intergrown with fungal hyphae inside the
  lichen apothecia (Fig. 2), with vitreous lustre, no UV fluorescence, estimated
  Mohs hardness ~1.5–2 by analogy with humboldtine-group oxalates, Dcalc = 2.420
  g/cm3 (for the empirical formula), and calculated Gladstone–Dale mean
  refractive index 1.594 (p. 65). Monoclinic, space group C2/c (Z = 4,
  alpha-Ni(C2O4)·2H2O structure type with chain layers along [010] of
  [NiO4(H2O)2] octahedra cross-linked by planar [C2O4]2- ions and hydrogen
  bonds; Fig. 3, p. 69); powder X-ray diffraction on the natural holotype
  (CoKalpha, lambda = 1.79021 Å; Table 2, p. 65, and Table 5, p. 69) gives a =
  11.8392(5) Å in the abstract and text (printed as 11.8393 in Table 5, p. 69),
  b = 5.3312(2) Å, c = 9.8357(7) Å, beta = 126.723(5)°, V = 497.59(3) Å3, with
  three strongest diffraction lines [d in Å (I%) (hkl)] at 4.743 (100)(-200,
  -202), 3.946 (24)(002), and 2.954 (29)(-402). Characteristic Raman bands
  (Table 3, pp. 63–64, 69–70; 532 nm laser) occur at 3391 (O–H stretching), 1701
  (nu_s(C=O)), 1621 (nu_as(C=O)), 1454 (nu_s(C–O) + nu(C–C)), 924 (nu_s(C–O) +
  delta(O–C=O)), 597 (H2O librations), 550 (delta(O–C=O)), 307, and 226 cm-1
  (Ni–O stretching/bending), and FTIR absorption bands (Table 4, pp. 64, 70–71)
  occur at 3389, 1640, 1357, 1315, and 818 cm-1. Distinct from humboldtine
  (Fe(C2O4)·2H2O), moolooite (Cu(C2O4)·nH2O), glushinskite (Mg(C2O4)·2H2O),
  lindbergite (Mn(C2O4)·2H2O), katsarosite (Zn(C2O4)·2H2O), and elemental
  nickel; no criticality designation or industrial recovery yield is asserted.
