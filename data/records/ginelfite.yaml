id: cmmmech:ginelfite
name: Ginelfite
material_kind: mineral
ima_symbol: Glf
description: >-
  IMA-approved complex silver-thallium-lead-antimony-arsenic sulfosalt mineral (IMA 2022-110;
  symbol Glf; status A, Approved 2023; full description published May 2025) with ideal
  end-member formula Ag2(Ag0.5Fe2+0.5)TlPb24.5(Sb,As)32.5S75.5 reported in the primary type
  description (Biagioni et al., 2025, European Journal of Mineralogy 37:319-335; listed in
  the September 2026 IMA-CNMNC Master List, PDF p. 82, under the pre-refinement formula
  Ag2(Ag0.5Fe2+0.5)TlPb23.5(Sb,As)33.5S76 prior to recognizing the half-occupancy of the S(71)
  site and final Pb/(Sb,As) site assignments). Discovered in historical samples collected in
  the 1960s from the Jas Roux hydrothermal deposit, La Chapelle-en-Valgaudemar, Gap,
  Hautes-Alpes, Provence-Alpes-Cote d'Azur, France (formerly corresponded to the unnamed
  phase "mineral Ao" of Mantienne, 1974 and UM2000-44-S:AgAsPbSb of Smith and Nickel, 2007;
  named after the abbreviation G.I.N.E.L.F. for the Groupe d'Etude sur la Mineralogie de Jas
  Roux created by French geologists Francois Permingeat, Roland Pierrot,Paul Picot, and
  Johan Zdenek), where it occurs in cavities of baryte + quartz gangue within Triassic
  hydrothermally altered calcareous-dolomitic sedimentary rocks along the east-west
  pre-Triassic Rif du Sap fault, intimately associated with Fe-bearing sphalerite and
  lopatkaite (which forms 100 um thick replacement rims around ginelfite); holotype material
  is deposited in the Museo di Storia Naturale of the Universita di Pisa, Calci (PI), Italy
  (catalogue number 20023) and in the Department of Mineralogy and Petrology, National Museum,
  Prague, Czech Republic (catalogue number P1P 56/2022). Forms dark-grey to black acicular to
  striated prismatic crystals up to 0.5 mm long with a black streak, metallic lustre, opaque
  diaphaneity, brittle tenacity, conchoidal fracture, indistinct cleavage, calculated density
  Dcalc = 5.656 g/cm3 from the empirical formula and single-crystal unit cell, and historical
  Vickers microhardness VHN25 = 136-163 kg/mm2 (Mantienne, 1974; corresponding to Mohs
  hardness ~3.5). In reflected light it is light grey with weak bireflectance, non-pleochroic
  character, and weak anisotropy with greenish and brownish rotation tints and no internal
  reflections; Commission on Ore Mineralogy (COM) reflectance values in air (Rmin, Rmax in %;
  Table 1) are 36.2, 38.0% (470 nm), 34.9, 36.7% (546 nm), 34.0, 35.9% (589 nm), and 32.1,
  33.9% (650 nm). Wavelength-dispersive electron microprobe analysis (35 spot analyses,
  Cameca SX100, 25 kV, 20 nA, 2 um beam; Table 2) yielded Pb 45.44 wt% (range 44.81-45.83,
  e.s.d. 0.21), Sb 23.46 wt% (23.10-23.94, e.s.d. 0.19), S 21.07 wt% (20.62-21.32, e.s.d.
  0.14), As 6.17 wt% (5.84-6.48, e.s.d. 0.17), Ag 2.34 wt% (2.20-2.42, e.s.d. 0.05), Tl
  1.14 wt% (0.98-1.34, e.s.d. 0.09), Fe 0.22 wt% (0.20-0.25, e.s.d. 0.01), and Cu 0.07 wt%
  (0.00-0.09, e.s.d. 0.02), total 99.91 wt% (range 99.21-100.59, e.s.d. 0.32), corresponding
  on the basis of SigmaMe = 61 atoms per formula unit to the empirical formula
  Cu0.12(4)Ag2.51(5)Fe0.46(3)Tl0.65(5)Pb25.40(14)Sb22.32(18)As9.54(24)S76.12(74) (Sb + As =
  31.86(12) apfu, Sb/(Sb + As) = 0.701(7), and valence equilibrium error Ev(%) = -1.1(1.0)%,
  with Table 2 printing the Ev(%) range as -2.3 to +1.7% whereas the prose on p. 323
  misprints the upper bound sign as "-1.7%"). Crystallizes in the triclinic system, space
  group P-1 (#2), with single-crystal X-ray diffraction unit-cell parameters a = 8.3635(6) A,
  b = 27.5481(19) A, c = 29.199(2) A, alpha = 95.335(3) deg, beta = 94.123(3) deg,
  gamma = 94.367(3) deg, V = 6657.7(8) A3, and Z = 2 (refined with twin ratio 62.2 : 37.8(2)
  around [100] to R1 = 0.0876, R(all) = 0.1131, wR2 = 0.1764, and GoF = 1.221 for 23,779
  reflections with Fo > 4sigma(Fo) out of 30,492 unique reflections from 291,055 measured at
  293(2) K using MoKalpha radiation, Table 4). The chabourneite-related modular sulfosalt
  structure contains 61 independent cation sites (two Ag sites Ag(1) and Ag(2), one mixed
  tetrahedral (Ag0.54Fe0.46) site M(23) with <M(23)-S> = 2.48 A, 18 Pb sites, one mixed
  ninefold tricapped trigonal prismatic Tl(20) site Tl0.65Pb0.35 with <Tl(20)-S> = 3.29 A and
  BVS = 1.30 v.u., 12 mixed Pb/Sb sites, 24 mixed Sb/As sites, and 3 pure As sites) and 76
  independent S sites (including half-occupied S(71), occupancy 0.50; Tables 5-6), built from
  five-octahedra-thick SnS-like rods (A and B) and PbS-like rods (C) alternating along c. The
  eight strongest observed Gandolfi powder X-ray diffraction lines (dobs in A (Iobs; hkl),
  CuKalpha, Table 3) are 3.383 (vs; 0 -8 1, 2 4 3, 2 -4 4), 2.104 (vs; 0 8 10, 0 -8 11,
  4 0 0), 3.854 (ms; 2 -2 2), 3.635 (ms; -2 2 3, 0 5 6), 3.470 (ms; 0 -6 6, -2 4 1, -2 -1 5),
  2.982 (ms; -2 -4 5, -2 3 6, 0 -9 2), 2.863 (ms; 0 9 3, 2 -1 7, 2 -7 1), and 2.752 (ms;
  0 -5 9, -2 -6 1, 0 -10 0). No biological or microbial interaction data are reported in the
  type mineralogical description.
