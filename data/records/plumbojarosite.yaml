id: cmmmech:plumbojarosite
name: Plumbojarosite
material_kind: mineral
description: Plumbojarosite is a lead ferric hydroxysulfate mineral with ideal formula Pb0.5Fe3(SO4)2(OH)6, equivalently PbFe6(SO4)4(OH)12, with ferric iron. The September 2026 IMA list marks the species redefined (1987 s.p.). It is distinct from potassium jarosite, natrojarosite and mixed industrial jarosite residues. The curated experiment used an X-ray-diffraction-characterized synthetic analogue, not a natural ore or industrial waste. No constituent-element criticality or industrial deployment is inferred.
