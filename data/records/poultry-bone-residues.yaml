id: cmmmech:poultry-bone-residues
name: Poultry-bone residues
material_kind: secondary_resource
description: Phosphorus-bearing poultry-bone residues investigated as a secondary feed for nutrient reuse, represented by cooked or boiled poultry bones ground and sieved to below 1 mm in the selected laboratory studies. The organic-mineral feed is distinct from elemental phosphorus, purified hydroxyapatite, phosphate rock, manure and bone-incineration ash. The animal species, supplier and exact cooking procedure are not reported; poultry is not silently narrowed to chicken. Material composition and treatment effects remain specimen-specific; no constituent criticality designation is inherited.
sources:
- id: wyciszkiewicz_2017_columns
  title: Wyciszkiewicz, Saeid and Chojnacka (2017). In situ solubilization of phosphorus-bearing raw materials by Bacillus megaterium. Engineering in Life Sciences 17:749-758. DOI 10.1002/elsc.201600191; PMCID PMC6999332. Complete official PMC HTML, Tables 1-4 and original Figures 1-5 inspected; publisher PDF unavailable, and the PMC PDF route returned HTML rather than a PDF. No separate supplement is announced in the inspected original.
  url: https://doi.org/10.1002/elsc.201600191
  accessed_on: '2026-10-15'
