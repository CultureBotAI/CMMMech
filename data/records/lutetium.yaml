mechanisms:
- id: bsubtilis_acidic_mixture_biosorption
  name: Lutetium biosorption by washed Bacillus subtilis biomass in an acidic mixed-REE solution
  process: biosorption
  description: Washed, non-autoclaved B. subtilis ATCC 7003 biomass lowered the lutetium concentration of a synthetic eight-REE solution relative to simultaneous no-biomass controls. The eight-element arm in supplementary Table S1 reports 74% relative lutetium biosorption at both two and four hours. This percentage uses the contemporaneous control concentration as its denominator, not an isolated-product recovery or a fraction proven to be intracellular.
  context: Table 1 identifies ATCC 7003, grown in FP medium at 30 degrees C and 120 rpm for two to four days. Section 2.2 reports harvested biomass washed twice in acidified water, then exposed at room temperature and pH 2.5 (HCl) to chloride salts of La, Ce, Nd, Gd, Dy, Er, Yb and Lu, each initially 15 micromol/L, with 5 g dry biomass/L. Samples were centrifuged and filtered through 0.2-micrometre nylon before ICP-MS. Assays and no-biomass controls were duplicated; independent culture derivation is unspecified. Control-relative depletion corrects for losses present without biomass, but cannot distinguish cell-surface adsorption, intracellular uptake and cell-associated precipitation. The authors call the untreated biomass living; viability during the acidic assay was not established here. The separate 4 g/L live-versus-autoclaved comparison is not the Table S1 condition. No Lu-specific desorption, purified product or industrial operation is demonstrated by this accepted arm.
  microbial: true
