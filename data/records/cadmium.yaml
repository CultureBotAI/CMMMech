id: cmmmech:cadmium
name: Cadmium
material_kind: element
description: >-
  Cadmium (Cd), atomic number 48. The neutral-atom identifier grounds the
  element, not Cd(II), cadmium chloride, cadmium sulfide, or a mineral species.
  India's June 2023 committee list names the cadmium material; that dated
  designation is mapped to this element without extending it to its compounds.
  This is the 30-material committee assessment, not a claim about the separate
  statutory critical/strategic schedule or current law. Curated laboratory
  evidence concerns culture-associated cadmium-sulfide formation.
