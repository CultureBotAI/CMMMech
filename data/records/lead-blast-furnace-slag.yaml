id: cmmmech:lead-blast-furnace-slag
name: Lead blast-furnace slag
material_kind: secondary_resource
description: Partly vitrified residue generated during lead blast-furnace smelting. The curated example is granulated slag from the former lead-zinc smelter at Noyelles-Godault, northern France, containing a silicate glass matrix, crystalline phases and metallic lead droplets. It is a process-defined secondary resource, distinct from elemental lead or zinc, a pure mineral, copper-smelter slag, steelmaking slag, furnace dust or zinc-leach residue. Its composition is sample-specific. No criticality designation is inherited from constituent elements.
sources:
- id: yin2014_thesis
  title: 'Yin NH (2014). Weathering of metallurgical slags: a comprehensive study on the importance of chemical and biological contributions. Doctoral thesis, Universite Paris-Est; defended 2 December 2014, NNT 2014PEST1125. HAL tel-01154324v1. Complete 200-page deposited PDF inspected for Section 4.1.2 (printed p.84; PDF p.85) and Chapter 8 (printed pp.171-186; PDF pp.172-187), including relevant original tables and figures. Chapter 8 identifies its associated journal article DOI 10.1016/j.jenvman.2014.09.018. The thesis is the full-text version inspected here; it is not an independent replication of that article.'
  url: https://theses.hal.science/tel-01154324v1
  accessed_on: '2026-10-16'
- id: vanhullebusch2015
  title: van Hullebusch ED, Yin NH, Seignez N, Labanowski J, Gauthier A, Lens PNL, Avril C and Sivry Y (2015). Bio-alteration of metallurgical wastes by Pseudomonas aeruginosa in a semi flow-through reactor. Journal of Environmental Management 147:297-305. DOI 10.1016/j.jenvman.2014.09.018; PMID 25277127. Publisher abstract and bibliographic metadata checked; full publisher article not acquired. Experimental details below are grounded to the deposited thesis chapter, without assuming version-identical prose.
  url: https://doi.org/10.1016/j.jenvman.2014.09.018
  accessed_on: '2026-10-16'
