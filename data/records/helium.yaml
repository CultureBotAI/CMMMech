id: cmmmech:helium
name: Helium
material_kind: element
description: >-
  Helium (He), grounded by the neutral-atom ChEBI identifier. This element
  record is distinct from isotope-specific preparations, commercial purity
  grades and helium-bearing gas resources. The original EU 2024 act lists
  helium as a critical raw material; this does not designate every helium-bearing
  resource. No microbial extraction, transformation or recovery mechanism is
  admitted in this record. The bounded literature assessment in the round-11
  helium dossier separates helium used as a tracer or analytical/plasma gas
  from helium as a microbial recovery target; this is not a universal absence
  claim about biological interactions with helium.
