id: cmmmech:humboldtine
name: Humboldtine
material_kind: mineral
description: Humboldtine is the iron(II) oxalate dihydrate mineral Fe(C2O4).2H2O, listed as a grandfathered species, with original-description year 1821, in the September 2026 IMA compilation. It is distinct from elemental iron, dissolved iron-oxalate complexes, other metal oxalates and the heterogeneous siderite- and pyrrhotite-bearing experimental feeds. No criticality designation is inherited from iron.
