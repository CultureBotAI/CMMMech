id: cmmmech:iridium
name: Iridium
material_kind: element
description: >-
  Iridium (Ir), distinct from experimental hexachloroiridate(IV), metallic
  alloys and iridium-bearing ores or waste streams. The US 2025 list names
  iridium individually; this designation is mapped to the element without
  extending it to every Ir-bearing material. Curated evidence concerns
  laboratory adsorption and desorption using lyophilized unicellular algal
  biomass in synthetic solutions, not reduction to Ir metal or deployment.
