mechanisms:
- id: heterotrophic_culture_metabolite_leaching
  name: Conditional metal solubilization by heterotrophic culture metabolites
  process: bioleaching
  microbial: true
  description: >-
    Gluconobacter oxydans DSM 3503 produced a gluconic-acid-containing culture
    liquid associated with metal solubilization from spent NiMH battery powder
    in two-step and spent-medium assays. Simultaneous inoculation and powder
    addition failed under the tested conditions. Streptomyces pilosus DSM 40097
    treatments also lacked appreciable leaching. These observations concern
    filtered-liquid metals in laboratory flasks, not isolated products or
    industrial recovery. The spent-medium arm used microbial metabolites after
    cell removal rather than requiring live cells during dissolution.
  context: >-
    Rasoulnia et al. used actual spent NiMH battery powder from AkkuSer Oy,
    Finland, homogenized and screened through 630-micrometre mesh. The powder
    was autoclaved for one hour at 121 degrees C under nitrogen; unchanged
    mineralogy after sterilization was not independently demonstrated. Assays
    used 1% w/v powder in 250-mL Erlenmeyer flasks with 100-mL initial working
    volume, 1% v/v inoculum, 27 +/- 1 degrees C and 150 rpm. Modified PVK
    medium contained 10 g/L glucose and either 2.7 mM K2HPO4 for G. oxydans or
    27 mM for S. pilosus; insoluble calcium phosphate was replaced and
    0.3 mM CaCl2 was supplied. Thus the two species were tested in different
    media. One-step addition was simultaneous; Methods and Figure 3 specify
    powder addition after one day for G. oxydans and two for S. pilosus in
    two-step assays. Spent medium was obtained after six days of growth by
    centrifugation at 10000 rpm for ten minutes, described as cell-free by
    the authors; residual viable cells were not independently quantified.
    Methods specify a 14-day leaching phase, while Table 3 labels the
    G. oxydans two-step treatment as two days of growth plus fourteen days
    of leaching, inconsistent with the one-day addition described elsewhere.
    All bioleaching experiments were triplicate. Controls included respective
    sterile media with and without powder and cultures without powder.
    Aliquots were filtered at 0.2 micrometres for ICP-MS total-element analysis;
    organic acids were analyzed by HPLC. No matched pure-gluconic-acid or
    pH-trajectory control isolated a unique molecular dissolution pathway.
  organisms:
  - id: NCBITaxon:442
