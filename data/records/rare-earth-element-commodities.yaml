id: cmmmech:rare-earth-element-commodities
name: Rare-earth-element commodities, Australian list scope
material_kind: commodity
description: >-
  This collective commodity family follows Australia's 20 February 2024
  rare-earth-elements entry: yttrium and all fifteen lanthanides, including
  promethium. Scandium has a separate entry in that list. This sixteen-member
  economic grouping differs from the broader seventeen-element chemical
  definition, which also includes scandium, and from the EU 2020 assessment's
  fifteen-member light/heavy split, which excludes both scandium and
  promethium. Inclusion of promethium preserves the Australian source's
  stated membership and does not assert an ordinary mined promethium supply.
  This family overlaps individual element records and narrower rare-earth
  commodity groups; it is not one mineral, alloy or fixed mixture. The
  mechanism below concerns only a synthetic neodymium/dysprosium solution
  and does not establish recovery of every family member or treatment of ore,
  magnets or industrial waste.
sources:
