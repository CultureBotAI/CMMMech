mechanisms:
- id: thiooxidans_laterite_bioleaching
  name: Conditional nickel bioleaching from Brazilian laterites
  process: bioleaching
  description: A living six-strain Acidithiobacillus thiooxidans mixture mobilized nickel from selected laterites under aerobic laboratory conditions. Sulfur oxidation supplied acidity; additional reductive dissolution is inferred for some feeds, without establishing its molecular route. Performance depended strongly on the particular ore sample.
  context: DSM 14887T, DSM 504, DSM 622, DSM 103717, DSM 9463 and BGR isolate RAM8 were mixed in equal culture volumes; the taxon ID identifies the species, not this mixture or any individual strain's contribution. Homogenized, sieved (<2 mm), unwashed laterite was added at 10% w/v after four days of growth with 10% v/v inoculum in 2-L stirred, air-supplied reactors containing 1.5 L salts medium, initially pH 3.0, with 1% w/v elemental sulfur at 30 degrees C. Methods describe 3 mM ferrous iron in the medium and 3 mM ferrous sulfate before ore addition; the cumulative dose is not resolved here. Leaching pH was maintained at 1.5 or allowed to change; uninoculated controls were adjusted to the corresponding biotic pH trajectories. BaSt and 1P5 were assayed for 15 days, BaC for 20 days, Jacare samples for 24 days and Piaui for 15 days. Dissolved metals were measured by ICP-OES after 0.2-micrometer filtration and acid stabilization.
