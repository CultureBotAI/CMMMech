id: cmmmech:otavite
name: Otavite
material_kind: mineral
description: Otavite is the cadmium carbonate mineral CdCO3 in the calcite group, distinct from elemental cadmium, dissolved Cd ions, cadmium sulfides and unspecified cadmium-bearing precipitates. The September 2026 IMA list gives grandfathered status and original-description year 1906, not a unique approval accession. The curated laboratory study tentatively assigns a cell-associated synthetic precipitate to otavite; it does not establish a pure mineral product or the origin of natural otavite. No cadmium criticality designation is inherited.
sources:
  - id: ima_2026_09
    title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Otavite row, PDF page 161; page 1 defines grandfathered status and original-description years. Retained complete original rechecked.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-14'
  - id: handbook_otavite
    title: Handbook of Mineralogy. Otavite, version 1 (2001-2005), complete one-page species entry, crystal data, synthetic powder pattern and calcite group assignment. Identity context, not a microbial experiment.
    url: https://www.handbookofmineralogy.org/pdfs/otavite.pdf
    accessed_on: '2026-10-14'
  - id: yang2026
    title: Yang, Q., Li, X., Cao, J., He, S., He, C., Tu, C., Zhou, K., Liang, X. and Zhan, F. (2026). Urea-Mediated Biomineralization and Adsorption of Heavy-Metal Ions in Solution by the Urease-Producing Bacteria C7-12. Microorganisms 14(1), 171. Complete 17-page original, Figures 1-11, Tables 1-2, and official two-page supplement with Table S1 and Figures S1-S5.
    url: https://doi.org/10.3390/microorganisms14010171
    accessed_on: '2026-10-14'
  - id: ncbi_serratia
    title: NCBI Taxonomy 615. Serratia marcescens, species-rank entry. This mapping does not identify or independently authenticate experimental strain C7-12.
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=615&mode=Info
    accessed_on: '2026-10-14'
  - id: uniprot_serratia_ureilytica_ureabc
    title: 'UniProtKB reference proteome UP001177872 (Serratia ureilytica, NCBITaxon:300181): Urease subunits alpha (ureC, UniProtKB:A0ABU0VDC7), beta (ureB, UniProtKB:A0ABU0VDC2), and gamma (ureA, UniProtKB:A0A9X9BY98), and Urease accessory protein UreG (ureG, ORF Q6237_00195, UniProtKB:A0ABU0VEJ2).'
    url: https://www.uniprot.org/uniprotkb?query=(proteome:UP001177872)+AND+(ureA+OR+ureB+OR+ureC+OR+ureG)
    accessed_on: '2026-11-09'
mechanisms:
  - id: c7_12_tentative_otavite_precipitation
    name: Tentative otavite formation associated with a ureolytic bacterial culture
    process: biomineralization
    description: Urease-producing strain C7-12 removed dissolved cadmium from laboratory broth and developed cell-associated particles whose XRD signal the authors considered most likely otavite. Urea consumption, increasing pH and operational cadmium fractions are consistent with carbonate precipitation occurring alongside adsorption. The phase assignment remains tentative, and neither microbial necessity nor a phase-specific recovery yield was established.
    context: Yang2026 Sections 2.1-2.8 and 3.1 describe C7-12 isolated among urease-producing bacteria from maize rhizosphere soil in a lead-zinc mining area. The authors assigned Serratia marcescens from a 100% 16S sequence match and reported deposit GDMCC65568; the complete article and supplement supply no sequence accession, and the deposit is retained as author-reported. NCBITaxon:615 maps the species name, not the strain or deposit. LB contained 5 g/L yeast extract, 10 g/L peptone and 5 g/L NaCl. The initial screening used 100 mL broth with 30 g/L urea, 2% inoculum, 30 degrees C and 160 rpm for 48 hours. One-factor-at-a-time experiments then selected the separate Table 2 conditions of 1 mg/L initial Cd, 20 g/L urea, 2% inoculum, initial pH 6, 30 degrees C and 48 hours. Experiments were described as triplicated. These are supplied soluble-Cd laboratory cultures, not natural otavite dissolution or ore extraction. The main text does not identify the Cd stock salt or fully describe XRD
      sample preparation; Section 2.8 identifies a Rigaku Ultima IV instrument. The separate soil-extract experiments are not the phase-specific basis of this mechanism.
