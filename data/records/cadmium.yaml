mechanisms:
- id: cd1_cadmium_sulfide
  name: Culture-associated cadmium-sulfide formation
  process: biomineralization
  description: Living Klebsiella planticola Cd-1 cultures formed CdS-associated solids. This supports laboratory immobilization, not elemental-cadmium reduction, purified-product recovery or industrial deployment.
  context: Anaerobic synthetic CdCl2 medium used pyruvate/glucose and Trizma buffer, initially around pH 7.1. Washed, freeze-dried late-stationary biomass from 5 mM Cd(II) cultures was characterized spectroscopically. A separate thiosulfate-amended assay used 5 mM Cd(II) and 5 or 10 mM thiosulfate. Exact precipitation incubation temperature, elapsed harvest time and vessel volume are not explicit. NCBITaxon:575 identifies the published species, not a verified Cd-1 strain accession.
  microbial: true
  organisms:
  - id: NCBITaxon:575
    label: Klebsiella planticola
  protein_examples:
  - uniprot_accession: UniProtKB:A0A443VK69
    entry_name: A0A443VK69_KLEPL
    protein_name: Thiosulfate sulfurtransferase GlpE
    gene_symbol: glpE
    entry_status: TREMBL
    target_organism:
