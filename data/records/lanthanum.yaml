    interpro_ids:
    - InterPro:IPR011701
    - InterPro:IPR020846
    - InterPro:IPR036259
    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA in Aspergillus niger ATCC 1015 that secretes intracellularly synthesized citric acid into the extracellular medium, driving organic-acid acidification and metal chelation/oxalate co-precipitation.
    annotation_note: Grounded to strain-matched reviewed Swiss-Prot entry UniProtKB:G3Y4N5 (CEXA_ASPNA; locus ASPNIDRAFT_56962) for Aspergillus niger ATCC 1015 (NCBITaxon:380704; reference proteome UP000006706). Mechanism taxon is strain-specific Aspergillus niger ATCC 1015 (NCBITaxon:380704).
    evidence:
    - source_ref: kang2019
      supports: partial
      explanation: Representative strain-matched Aspergillus niger ATCC 1015 citrate exporter CexA for organic-acid excretion during culture supernatant preparation for La(III) precipitation in Kang et al. (2019); cexA was not directly mutated in the study.
  evidence:
  - source_ref: kang2019
    supports: support
    explanation: Methods, Lanthanum biotransformation and Crystal yield and La assay, and Results, Biomass-free culture supernatant experiments, with Figure 7a,c, report 100% aqueous La removal at 1, 3 and 5 mM initial La and 49.8% at 15 mM. These are the authors' solution-removal percentages, not purified-element yields or independently established zero residual La. At 15 mM, the reported maximum dry precipitate mass was 23.3 mg per 10 mL reaction; this mass is not elemental La. Figures 4, 8 and 9 and the Discussion support oxalate precipitation with additional phosphorus-containing material at higher La loading.
  - source_ref: kang2019
    supports: partial
    explanation: Figure 7b,d and its accompanying results show that chemical oxalic acid controls also removed La, maintaining reported 100% removal through 11 mM initial La. Their different pH and unverified equivalence to the fungal oxalate concentration prevent an efficiency comparison normalized to precipitant dose. The article gives inconsistent formulas for the higher-La phosphorus phase in the results text and Figure 9, so no exact formula is assigned here. Figure 5 identifies La2(C2O4)3·10H2O from the separate 1 mM La agar experiment and La2O3 after heating those crystals to 1000 degrees C; the oxide conversion was a subsequent abiotic treatment, not a microbial redox reaction.
