id: cmmmech:goldmanite
name: Goldmanite
material_kind: mineral
description: Goldmanite is the calcium-vanadium garnet mineral with ideal formula Ca3V3+2(SiO4)3, status
  A and approval 1963-003 in the September 2026 IMA list. It is distinct from elemental vanadium, generic
  vanadium-bearing garnet and mixed uranium-vanadium ore. Moench and Meyrowitz described fine natural
  grains from a prospect pit in the Sandy mine area, Laguna district, New Mexico. The chemically analyzed
  separate was a substituted garnet, calculated as 59.8 mole percent goldmanite endmember with grossular,
  andradite, pyrope and spessartite components; this is a composition calculation, not a phase fraction
  or recovery yield. Its total vanadium was reported as V2O3, but the authors explicitly could not determine
  vanadium and iron valences chemically and inferred trivalence from crystal chemistry. Earlier unusually
  high vanadium assays may have included spinel contamination. The ideal species formula therefore does
  not describe every natural grain as a pure endmember. Abiotic laboratory syntheses are documented below.
  No criticality designation is inherited from vanadium, and these studies do not establish microbial
  extraction or industrial recovery.
