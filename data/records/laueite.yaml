    Laueite row, PDF page 121: Mn2+Fe3+2(PO4)2(OH)2(H2O)6·2H2O,
    G, historical year 1954, Germany. Status definitions pages 1-2;
    G means grandfathered, not a numbered modern approval.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-15'
- id: moore1965
  title: >-
    Moore PB (1965). The crystal structure of laueite,
    Mn2+Fe3+2(OH)2(PO4)2(H2O)6·2H2O.
    American Mineralogist 50:1884-1892. Complete original;
    Palermo crystal and methods page 1885; Tables 1-3,
    structure refinement pages 1886-1887 and Figure 2 page 1888.
    Page 1889 explicitly states that hydrogen atoms were not located.
    Proposed stewartite/strunzite structures and other-mineral heating
    discussion are not direct laueite transformation experiments.
  url: https://msaweb.org/AmMin/AM50/AM50_1884.pdf
  accessed_on: '2026-10-15'
- id: baur1969
  title: >-
    Baur WH (1969). A comparison of the crystal structures of
    pseudolaueite and laueite. American Mineralogist 54:1312-1323.
    Complete original; laueite calculations reuse Moore (1965)
    coordinates (Table 3), rather than a new laueite diffraction
    dataset. Pages 1321-1322 propose partial Mn(III) occupancy from
    bond lengths and discuss alternative smaller substituents.
    This hypothesis does not replace the current IMA ideal formula.
  url: https://www.rruff.net/doclib/am/vol54/AM54_1312.pdf
  accessed_on: '2026-10-15'
- id: grey2025
  title: >-
    Grey IE, Keck E, Gable RW, Mumme WG, Hochleitner R and Glenn AM
    (2025). Laueite/stewartite epitaxy - a single-crystal diffraction
    study. Mineralogical Magazine 89:234-241.
    DOI 10.1180/mgm.2025.21. Complete original, Figures 1-6 and
    Tables 1-5: specimen/EDS page 235; mixed rhomb, diffraction
    extraction and weak minor-stewartite dataset page 236;
    refinement and epitaxy pages 237-239; proposed paragenesis
    pages 239-240. EDS composition, refined scattering occupancy
    and charge-balanced inferred formula are different quantities.
  url: https://doi.org/10.1180/mgm.2025.21
  accessed_on: '2026-10-15'
- id: grey2025_laueite_check
  title: >-
    Grey et al. (2025), supplementary material 1, six-page deposited
    laueite checkCIF/PLATON report. Pages 1-3 report missing
    structure factors for these checks, three A-level displacement
    alerts, missing H sites, formula/Z reporting alerts,
    Rint 0.149 and goodness of fit 3.36. These are unresolved
    model-quality qualifications, not proof that the mineral
    identity or observed epitaxial orientation is false.
    The associated CIF and stewartite report/CIF were also inspected;
    no diffraction re-refinement was performed.
  url: https://static.cambridge.org/content/id/urn:cambridge.org:id:article:S0026461X25000210/resource/name/S0026461X25000210sup001.pdf
  accessed_on: '2026-10-15'
