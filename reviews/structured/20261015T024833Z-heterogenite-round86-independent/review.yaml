- assessment_id: identity
  area: identity
  topic: Mineral, polytype and feed boundary
  outcome: supported
  summary: IMA and Handbook support Co(III)O(OH) heterogenite as a mineral. The experimental
    material is mixed DRC copper-cobalt oxide ore assigned by QEMSCAN, with neither
    pure-phase abundance nor a polytype proved. Distinct from elemental cobalt and
    the whole ore; no inherited criticality.
  target_ids:
  - cmmmech:heterogenite
  evidence_ids:
  - owner
  - main
  - ima
  - handbook
- assessment_id: conditions
  area: evidence
  topic: Chemical treatments and arm accounting
  outcome: supported
  summary: 100% below25mm ore was divided into30kg batches, not a reported30kg loading
    per column. Six1m/160mm columns at25°C used8% agglomeration moisture and24kgH2SO4/t.
    Table1 doses0/0.5/1/5kgSO3/t are not kgNa2SO3/t. Open C1–4, recycled-raffinate
    C5 and seven-day-curing C6 remain distinct. No microbial treatment was used.
  target_ids:
  - cmmmech:heterogenite
  evidence_ids:
  - owner
  - main
- assessment_id: outcome
  area: quantity
  topic: Elemental dissolution denominator
  outcome: supported
  summary: Table4 Co43.1/50.6/54.0/60.8/79.4/62.8% for C1–6 uses recalculated elemental
    head accounting through leach/wash/drain-down. It is not a heterogenite dissolution
    fraction or purified recovery. C5 negative transient follows subtraction of cobalt-bearing
    return raffinate; it is not precipitation evidence. Cu90.3–94.6% across arms prevents
    a blanket copper-benefit inference.
  target_ids:
  - cmmmech:heterogenite
  evidence_ids:
  - owner
