  evidence:
  - source_ref: fecko1996_tatra
    supports: support
    explanation: Pages 388-389 identify the grinding-derived feed and the inoculated experiment. Figures 1-3 show the original particles, an iron globule and the altered post-incubation material. The text reports persistence of Fe and Fe3O4 after treatment. Table 1 gives before/after elemental contents, while Table 3 reports increasing Fe(II) in solution and increasing MPN estimates across the four weeks. These are distinct analytical observations, not a single measurement of recovered metal.
  - source_ref: fecko1996_tatra
    supports: partial
    explanation: No matched uninoculated leaching arm is reported in the complete article. Acid dissolution, inoculum chemistry and changes in solid mass therefore remain alternative or additional explanations for the observations. Sterilized flasks do not establish a sterile waste feed. The MPN procedure uses five parallel dilution arrays and a two-week incubation at 30 degrees C, with iron-oxidation-associated color scoring; this is an analytical growth assay, not five replicated leaching flasks or direct proof of a particular in-flask dissolution pathway. It does not authenticate the experimental strain or independently establish attachment, enzyme action or microbial necessity.
  - source_ref: fecko1996_tatra
    supports: partial
    explanation: Table 1 labels a row as recovery into the leach, but no recovery equation or residue-mass denominator is provided. Its Pb, Mn and Fe percentages do not equal simple depletion calculated from the listed before/after concentrations. Such a calculation would itself not be a mass-based recovery yield. The discrepancy is retained without correcting the source or adopting those percentages. Increased relative Ti and Al contents do not establish net uptake or production of these elements. The abstract and results also highlight different sets of best-leached elements; no performance ranking is inferred here.
  - source_ref: fecko1996_tatra
    supports: partial
    explanation: The study's suggestion that adaptation or longer incubation could improve results is not demonstrated by an adapted-culture or duration comparison. Culture survival and changed residues do not establish economic suitability, isolated-metal recovery or industrial deployment. The separate coal-cinder/slag experiment in Tables 2 and 4 and Figures 4-7 supplies no grinding-sludge controls or additional replicates; its phase descriptions, production tonnage and outcomes are not transferred to this resource.
  - source_ref: ncbi_ferrooxidans
    supports: context_only
    explanation: The live NCBI species record lists Thiobacillus ferrooxidans as a homotypic synonym of Acidithiobacillus ferrooxidans, consistent with the historical paper name. NCBITaxon:920 is a species identifier, not a strain accession or independent evidence of the mechanism.
causal_graphs:
- id: culture_associated_grinding_sludge_leaching_graph
  name: Acidithiobacillus ferrooxidans rus-operon Fe(II) oxidation and culture-associated leaching of Tatra metal-grinding sludge
  description: Causal pathway linking representative Acidithiobacillus ferrooxidans rus-operon proteins (outer-membrane Cyc2 AFE_3153/DN052_11975, rusticyanin AFE_3146/DN052_11940, and periplasmic Cyc1 AFE_3152 in reference proteomes UP000001362 and UP000248886) to iron-dependent acidophile activity in 180 mL FeSO4-free 9K medium inoculated with 20 mL T. ferrooxidans suspension and 10 g Tatra Koprivnice metal-grinding sludge (maintained at pH 1.8-2.0 and 26-30 C for 28 days, accompanied by rising solution Fe(II) and increasing MPN cell counts in Table 3) and morphological/elemental alteration of the sludge (Figures 1-3 and Table 1) in Fecko and Kucerova (1996), while preserving the absence of a matched uninoculated acid control, persistence of metallic Fe and Fe3O4 in treated solids, and Table 1 recovery-row accounting discrepancies.
  scope: REPRESENTATIVE_EXAMPLE
  mechanism_ref: culture_associated_grinding_sludge_leaching
