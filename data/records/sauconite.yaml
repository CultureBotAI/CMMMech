mechanisms:
- id: hydrothermal_gel_crystallization
  name: Abiotic hydrothermal formation of source-assigned sauconite from a Zn-Al-Si gel
  process: other
  microbial: false
  description: Hydrothermal treatment of a homogeneous Zn-Al-Si gel produced a Zn-rich expandable trioctahedral
    smectite assigned to sauconite. At 100 degrees C the reported XRD patterns contained no detected crystalline
    impurity phases; higher-temperature treatments also produced hemimorphite and, in the 200-degree seven-day
    product, willemite. This is an abiotic phase-formation experiment, not microbial extraction or recovery
    from waste.
  context: 'Experimental section, Table 1 and Figures 1-2: tetraethyl orthosilicate, zinc chloride and aluminium
    chloride supplied the gel; sodium hydroxide adjusted pH to 10, followed by washing, redispersion with further
    sodium hydroxide and overnight aging. A Teflon-lined steel vessel operated at autogenous pressure. Table
    1 reports 100 and 150 degrees C at 1, 3, 7 and 14 days, and 200 degrees C at 1, 3 and 7 days. Washed products
    were freeze-dried for more than two days before analysis. No microorganisms, natural ore feed or spent-material
    feed were used.'
  evidence:
  - source_ref: yokoyama_2006
    supports: support
    explanation: Table 1 and Figures 1-2 show sauconite without XRD-detected impurities for the reported 100-degree
      treatments, hemimorphite in the 150-degree series, and hemimorphite plus willemite after seven days at
      200 degrees. No detection limit, refined phase fraction or complete conversion yield is provided; the
      reported single-phase assignment does not exclude undetected or amorphous components.
  - source_ref: yokoyama_2006
    supports: support
    explanation: Figures 1-6 and Tables 2-3 support the assignment using ethylene-glycol expansion to about
      17 angstrom, a 060 spacing of 1.53-1.54 angstrom, flaky/turbostratic texture, FTIR and XPS. The S10 analytical
      sample is the 100-degree, 14-day product. Elemental composition and Zn coordination support a Zn-rich
      smectite, not an independently measured zinc-recovery efficiency.
  - source_ref: yokoyama_2006
    supports: partial
    explanation: Discussion attributes excess Zn and Na relative to ideal composition partly to interlayer
      or surface adsorption; not all Zn is demonstrated to occupy structural sites. The printed doubled ideal
      formula has an inconsistent hydroxyl normalization, so the authority formula is used for identity. Comparison
      with an earlier different-gel synthesis that produced little or no sauconite at 100 degrees makes the
      successful temperature recipe-specific. No catalytic-performance measurement, waste-recovery mass balance,
      microbial necessity or industrial deployment is demonstrated.
