id: cmmmech:metazeunerite
name: Metazeunerite
material_kind: mineral
description: Metazeunerite is the copper uranyl arsenate mineral Cu(UO2)2(AsO4)2(H2O)4·4H2O in the September
  2026 IMA list, with grandfathered status G. The year 1937 is a historical description year, not a numbered
  IMA approval. Its ideal eight-water composition is distinct from twelve-water zeunerite, phosphate metatorbernite,
  calcium meta-autunite and elemental uranium, arsenic or copper. Locock and Burns synthesized its analogue
  hydrothermally at 220(1) degrees C for 24 h after controlled heating, then refined an epoxy-coated,
  twinned crystal in P4/n at room temperature. The hydrogen model was constrained; metatorbernite copper
  deficiency is not a metazeunerite result. A later natural German specimen gave a preferred P4/nmm model
  with a smaller c repeat, while synthetic low-temperature powder data were indexed orthorhombically.
  These specimen- and condition-specific models are preserved rather than merged. The thermal evidence
  is laboratory and abiotic; no criticality, microbial mechanism, isolated-product recovery or industrial
  deployment is inherited from composition.
