mechanisms:
- id: conditional_carbon_assisted_bioleaching
  name: Feed-dependent carbon-assisted mixed-culture copper dissolution
  process: bioleaching
  description: Laboratory inoculated concentrate assays showed feed-dependent associations between activated-carbon dose, solution redox trajectory and dissolved copper. For Eb, Section 3.2.1 reports day-30 soluble-copper fractions of 74%, 92% and 100% without carbon, with 0.05% w/v carbon and with 0.3% w/v carbon, respectively. For D3, the carbon-free curve plateaued just above 60%, whereas 0.05% carbon approached complete dissolution by day 35. For Ea, the carbon-free endpoint was reported as 54%; 0.3% carbon improved early dissolution but 0.05% gave the higher final soluble-copper outcome. These are source-reported mixed-feed dissolved fractions, referenced to copper in each feed, not isolated-metal yields or measured extraction of individual mineral phases. Parallel no-added-cell comparisons and evolving redox/pH profiles constrain the interpretation; the experiment does not establish a universal carbon optimum or a causal effect of the chalcopyrite/enargite ratio alone.
  context: D3, Eb and Ea were used as received without washing or sterilization, with reported D50 values of 39, 81 and 49 micrometres. Duplicate 500 mL flasks contained 200 mL heterotrophic basal salts medium, 1% w/v feed, 5 mM ferrous iron supplied as ferrous sulfate, 0.01% w/v elemental sulfur and 0.01% w/v yeast extract. Initial medium pH was 1.5; sulfuric acid readjustment to 1.5 occurred on days 2 and 3 for D3 and day 4 for Eb, with no readjustment for Ea. Cultures were shaken aerobically at 45 degrees C and 150 rpm. Four source-labelled early-stationary-phase cultures, Acidiplasma sp. Fv-Ap, Acidimicrobium ferrooxidans ICP (DSM 10331), Sulfobacillus sibiricus N1 (DSM 17363) and Acidithiobacillus caldus KU (DSM 8584), were harvested, washed and introduced at 10^7 cells/mL each, 4 x 10^7 cells/mL total. The structured taxon names one verified species member only; no terminal community or member-specific causal census was performed. Powdered Wako activated carbon was reported as 46.5
    micrometres and 1400 square metres/g; D3 received 0 or 0.05% w/v, and Eb/Ea 0, 0.05 or 0.3% w/v. Figure 6 covers approximately 30-35 days depending on feed, rather than a shared endpoint across all feeds. ICP-OES measured total soluble Cu, As and Fe; ferrous iron was measured separately and planktonic cells counted directly. Source-derived percentages are not an independently reconstructed sampling-corrected mass balance. Added iron and sulfur, variable phase assemblages, size, acid dosing and possible unmeasured reagent carryover limit cross-feed comparisons.
