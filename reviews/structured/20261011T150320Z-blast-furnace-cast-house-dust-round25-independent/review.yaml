limitations:
- Experimental strain/stock provenance is unresolved despite correct species-level
  identity.
- Six serial reactor cycles share retained liquor and solids; they do not establish
  six independent reactors or an independently valid significance test.
- The supplement day-7 Zn value conflicts with its pooled table and main figure. No
  raw data or corrected value is available.
- Equation 3 carryover subtraction does not isolate fresh-feed dissolution from retained
  solids or close sampling/residue inventories; percentages remain source-reported
  apparent cycle values.
- Uninoculated medium controls differ in geometry, acidity and culture history. No
  unique cellular adhesion, enzyme, EPS or oxygen-limitation mechanism is demonstrated.
- Selected solid concentrations and SEM distributions do not yield a full element
  balance, isolated Zn product or validated residue reuse. Scale is laboratory, despite
  industrial feed origin.
- Correction and duplicate searches were bounded. Reviewer used curator-acquired primary
  files and root-executed terminal batch checks, and independently executed named
  validation.
notes:
- Record and dossier orientation preceded canonical inspect; detailed scientific assessment
  followed exact-state capture.
- All main Figures 1–11 and Tables 1–3 were visually checked, as were both complete
  SI tables. Context paper Table 1 and Figures 2–4 were visually checked; unrelated
  biological outcomes were not audited for import.
- No corrective finding or issue is invented for source limitations that the record
  already preserves. A final whole-bundle review check will follow saving by the coordinating
  agent.
