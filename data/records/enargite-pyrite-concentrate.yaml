  evidence:
  - source_ref: okibe_2022
    supports: support
    explanation: Sections 2.1-2.3, Table 1, Figures 1-3 and Figure S1 support feed identity, the specified inoculated comparison and reported copper endpoints. DC-I carbon lowered redox potential and copper dissolution; DC-II showed only a modest difference; DC-III carbon raised redox potential and copper dissolution. Proposed inhibition by residual flotation chemicals, carbon-assisted detoxification, cell attachment and particular iron-redox mechanisms are explanations, not directly isolated causes in this experiment. pH was not held equal between arms.
  - source_ref: okibe_2022
    supports: partial
    explanation: Section 3.2.1 and Figure 3a report dissolved arsenic of 6.5% without carbon versus 1.0% with carbon in DC-I. The abstract's lowest-arsenic wording for the highest-copper DC-I carbon-free condition is therefore not adopted as an ordering across all arms. For DC-II, Section 3.2.2 reports 5.0% dissolved arsenic without carbon whereas Figure 3c labels that arsenic endpoint 6.6%; its 5.0% label belongs to iron. This disagreement remains unresolved. The 9.9% arsenic endpoint with carbon is reported consistently in that paragraph and figure. DC-III with carbon reaches 24% dissolved arsenic. These are liquid-phase fractions of feed arsenic, not measured arsenic-immobilization yields.
  - source_ref: okibe_2022
    supports: partial
    explanation: Section 3.3, Figure 4, Figures 5-6, Table 2 and Figure S2 support association of As/Fe/O/Cu/S-bearing secondary material with residual sulfide grains, while XRD did not identify a crystalline arsenic precipitate. The proposed mixture of amorphous ferric arsenate, cupric arsenate, basic ferric sulfate and sulfur is tentative; neither pure scorodite nor long-term arsenic stability is demonstrated. Figure 5 examines DC-I without carbon, Figure 6 DC-II with 0.05% carbon, and Table 2 DC-III without carbon, all after 60 days; these observations are not interchangeable assay replicates. Section 3.3 calls spot 12 both enargite-like and gel-like secondary material, while Table 2 assigns spot 12 to enargite and spot 11 to secondary precipitates. No exact spot-based mineral formula is adopted. Figure 4 uses the same solution time series and does not supply an independent precipitation experiment or a closed arsenic balance.
  - source_ref: oyama_2021
    supports: context_only
    explanation: The earlier D3, Eb and Ea assays used different mixed mineral compositions at 1% w/v pulp, four introduced acidophiles, external iron and sulfur, and feed-dependent acid adjustment. Their outcomes are not pooled with the 2022 20% assays or treated as independent replication of the same feed experiment. The 2021 introduction also cites a separate 2020 concentrate with 37.4% enargite and 47.3% pyrite, matching the nominal 2022 DC-II composition; this is a possible material-provenance connection, not proof of identical batches or independent experimental replication. Those 2020 results are not imported here.
  - source_ref: ncbi_sulfobacillus
    supports: context_only
    explanation: Verifies the one asserted species identifier and reported type-strain aliases, without establishing the identity, abundance or causal role of cells present after repeated mixed-culture pre-growth.
