id: cmmmech:allanite-leachate
name: Allanite-derived rare-earth leachate
material_kind: secondary_resource
description: A rare-earth-bearing processing liquor generated from allanite ore, represented here by the chemically purified and reconstituted Halleck Creek, Wyoming feed used by Lu et al. (2026). Acid leaching, impurity precipitation, REE hydroxide precipitation and hydrochloric-acid redissolution precede the biological-reagent experiment. This processing intermediate is distinct from geological ore, beneficiated allanite concentrate, a pure allanite species and an isolated REE product. Its classification reflects chemical processing, not extraction alone. No criticality designation is inherited from its constituents.
