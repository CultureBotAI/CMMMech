limitations:
- Natural field textures do not establish microbial causality, reaction kinetics or
  controlled formation; no extraction/recovery assay is accepted.
- Substituted natural grains and calculated water are not demonstrated pure ideal
  endmembers.
- Inferred stability boundary depends on assumed solution composition and hydroxyapatite
  treatment that omits fluoride/chloride effects.
- Shared field study is not independent replication between the two species records.
- Bounded notice/search coverage is not universal absence; no independent laboratory
  measurement or crystallographic re-refinement was performed.
- Historical single wet analysis and geometrical/optical measurements are not a modern
  structural refinement.
