  support: supports
  summary: 'Baranov and colleagues processed titanium sponge and a source-described titanium slag in a
    rotating disintegrator with ferric-sulfate solution containing Thiobacillus ferrooxidans. They obtained
    fine agglomerated powders reported to contain titanium oxides and hydride. This supports a culture-associated
    mechanical and chemical workflow; it does not isolate bacterial causality, demonstrate microbial titanium
    reduction, or establish a pure titanium-metal product. Substrate-edge evidence (baranov2013-sponge,
    supports: partial): Baranov et al. (2013) contacted and co-milled titanium sponge and waste feeds
    with A. ferrooxidans ferric-sulfate solution in a mechanical disintegrator without sterile-medium
    or dry mechanical-only controls. Product-edge evidence (baranov2013-sponge, supports: partial): Baranov
    et al. (2013) report disintegration into fine agglomerated powder with reported titanium oxides and
    hydride, without published XRD patterns or abiotic controls.'
