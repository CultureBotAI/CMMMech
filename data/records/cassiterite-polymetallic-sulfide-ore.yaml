  evidence:
  - source_ref: wang2025
    supports: support
    explanation: Sections 2.1-2.3 and 3.1, Figures 1-5 and Table 1 support culture-associated iron mobilization and alteration of the mixed ore. The mixed culture and the two iron-oxidizing single cultures have substantially higher iron signals than the control and the Acidithiobacillus caldus single culture. SEM and XRD show altered residues and decreased pyrite signals. The caldus-only arm has little iron mobilization and less evident residue alteration; its presence in the mixed inoculum alone does not demonstrate its independent causal contribution. Figure 2 shows an early mixed-culture advantage, subsequent convergence of the iron-oxidizing cultures and declining late iron signals.
  - source_ref: wang2025
    supports: partial
    explanation: The abstract and conclusion report a 90% proxy value within ten days, whereas Section 3.1 describes the mixed-culture maximum iron signal at day 12. These refer to a threshold and a maximum and are not treated as identical endpoints. Section 3.1 says single cultures reached the same percentage at day 14, but the conclusion says six additional days after the ten-day mixed endpoint. Figure 1 also places the mixed cell-count peak later than the day-8 peak stated in the prose. These conflicts, changing pH, secondary precipitation and incompletely specified concentration normalization prevent adoption of an exact biological desulfurization yield or validated kinetic advantage.
  - source_ref: wang2025
    supports: partial
    explanation: Original Figure 5 and Tables 1-2 support a changed residue composition but contain unreconciled quantitative problems. Table 1's control phase percentages sum to 115.37%; its mixed residue has 5.74% jarosite, whereas Table 2 lists only 0.005% total Fe for that residue. The source's cassiterite phase percentages and elemental Sn percentages are also inconsistent with one another on a common whole-residue basis. The prose claims single-culture jarosite exceeds 6.43%, but Table 1 lists 6.34% and 5.86%. Reported zero pyrite values lack a stated detection limit and do not prove absolute removal. Table 2's Sn change from 3.66% in the control to 4.781% in mixed-culture residue is relative composition, not recovered Sn mass or retention yield. No table is silently repaired or converted into a closed phase, iron, sulfur or tin balance.
  - source_ref: wang2025
    supports: context_only
    explanation: Figure 6 reports community and extracted extracellular-polymer patterns, while Figure 7 is a proposed mechanism diagram. Community proportions, electron-transfer proteins, sulfur intermediates and extracellular-polysaccharide explanations do not independently establish molecular causality in this experiment. The sequencing Methods describe a V4 target but list 27F/1492R primers and provide no sequence accession. The source's abstract claims a 30-50% caldus proportion, which does not describe all Figure 6A time points. Section 4.2 and the Conclusions place flotation and practical application in future work. No downstream flotation result, isolated tin product, product-grade assay or industrial deployment is demonstrated.
