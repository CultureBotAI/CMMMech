id: cmmmech:rozenite
name: Rozenite
material_kind: mineral
description: >-
  Rozenite is the monoclinic ferrous sulfate tetrahydrate mineral,
  Fe(II)(SO4)·4H2O, distinct from heptahydrate melanterite and
  monohydrate szomolnokite. The September 2026 IMA list recognizes
  it as a redefined species. The accepted primary experiment follows
  rozenite as a transient phase during laboratory heating of a natural
  melanterite sample. Phase fractions are diffraction-refinement results,
  not isolated-product recoveries or universal environmental stability
  limits. No microbial transformation is established by this experiment.
sources:
- id: ima_2026_09
  title: >-
    IMA-CNMNC. The New IMA List of Minerals, September 2026;
    Rozenite row on PDF page 188 and field definitions on pages 1-2.
    Fe2+(SO4)(H2O)4; status Rd, 1963 s.p. denotes a special-procedure
    redefinition year, not a new-mineral accession.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-15'
- id: handbook
  title: >-
    Handbook of Mineralogy. Rozenite, version 1 (2001-2005), complete
