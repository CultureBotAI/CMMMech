  title: Kremser, Gerl, Benedito Borrás, Ramírez Espinosa, Monje Martínez, Guebitz and Pellis (2022). Bioleaching/enzyme-based recycling of aluminium and polyethylene from beverage cartons packaging waste. Resources, Conservation and Recycling 185:106444. DOI 10.1016/j.resconrec.2022.106444; published journal version, Sections 2-3, Figures 1-6, supplementary acid-production methods, Table S1 and Figures S1-S2.
  url: https://doi.org/10.1016/j.resconrec.2022.106444
  accessed_on: '2026-10-11'
