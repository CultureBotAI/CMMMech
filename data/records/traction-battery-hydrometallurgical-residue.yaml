id: cmmmech:traction-battery-hydrometallurgical-residue
name: Traction-battery hydrometallurgical residue
material_kind: secondary_resource
description: Residual solids from acid leaching in wet recovery of nickel or cobalt from waste traction-battery
  cathode materials and other recycled wastes. The curated study used separate nickel-line and cobalt-line
  residues from an unnamed Chinese enterprise; their compositions are not pooled. The source calls these
  residues slags, but does not establish molten-slag origin. They are downstream processing residues,
  distinct from mechanically prepared battery black mass, intact batteries, a pure cathode compound and
  isolated nickel or cobalt products. Exact incoming battery chemistries and the contribution of other
  wastes are unspecified. No constituent-element criticality is inherited.
sources:
- id: lu2025
  title: Lu, H., Zhang, H., Chen, X., Wang, L. and Yan, X. (2025). Bioleaching of sludge from acid-leached
    waste traction batteries used in electric vehicles for the extraction of Ni and Co using optimized
    microbial consortia. RSC Advances 15, 45979–45985. DOI 10.1039/D5RA07472J; complete Europe PMC XML,
    Sections 2–3, Tables 1–2, original Figures 1–6 and two-page SI Table S1.
  url: https://doi.org/10.1039/D5RA07472J
  accessed_on: '2026-10-12'
- id: ncbi20261012
