id: cmmmech:metalliferous-black-shale
name: Metalliferous black shale
material_kind: primary_resource
description: Metal-bearing, organic-matter-containing sedimentary shale considered as a geological resource. This heterogeneous rock is distinct from its constituent elements, individual mineral species, a standardized traded concentrate and processing-generated waste. The cited Pakistani, Polish and incompletely localized experimental feeds are not interchangeable. The Polish neutral-stage experiment used a previously acid-bioleached and washed derivative of the ore; its remaining-metal denominator is not the original geological feed inventory. No constituent's criticality designation or industrial recovery performance is inherited by this resource family.
