id: cmmmech:hureaulite
name: Hureaulite
material_kind: mineral
description: Hureaulite is the manganese(II) hydrogen phosphate hydrate mineral with current IMA formula
  Mn2+5(PO3OH)2(PO4)2(H2O)4. The September 2026 list records renamed status, 2007 s.p.; this is not a
  new-species approval number. Natural material can contain iron and other substitutions. Garcia Guajardo
  et al. (2024) prepared a synthetic manganese phosphate assigned to monoclinic C2/c hureaulite by powder
  diffraction and vibrational spectroscopy, then tested composite electrodes made from that powder. The
  synthetic reagent-derived material is distinguished from mined natural hureaulite, from lithiophilite
  and from a merely hureaulite-like phase. Its laboratory charge-storage behavior is not microbial transformation,
  extraction of manganese from ore, recovery of an isolated metal product or industrial deployment. Charge-partition
  and proton-transfer explanations are model-based interpretations, and the exact redox reaction remains
  unresolved. No constituent-element criticality is inherited.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Hureaulite row, PDF page 97, Mn2+5(PO3OH)2(PO4)2(H2O)4,
    Rn, 2007 s.p.; status definitions page 1.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-15'
- id: handbook_hureaulite
