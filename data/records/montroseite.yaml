id: cmmmech:montroseite
name: Montroseite
material_kind: mineral
description: Montroseite is the vanadium oxyhydroxide mineral with ideal formula V3+O(OH), listed as grandfathered
  (G), original-description year 1953, in the September 2026 IMA list. That year is not a numbered IMA
  approval. The original Colorado Plateau specimens were iron-bearing, commonly altered and incompletely
  separated from associated minerals. Single-crystal diffraction assigned the sharp orthorhombic Pbnm
  lattice to montroseite; the diffuse lattices and much of the original bulk powder pattern represent
  altered material, subsequently distinguished as paramontroseite or unresolved diffuse A. The historical
  Fe2+/V4+ compensation model is a chemical interpretation, not a modern site-specific valence measurement.
  Montroseite is distinct from paramontroseite, elemental vanadium and mixed uranium-vanadium ore. The
  cited natural evidence does not establish microbial formation, extraction, isolated-product recovery
  or industrial deployment; criticality is not inherited from vanadium.
