    Å, b = 10.000(3) Å, c = 6.492(2) Å, Z = 1), SGmeas = 3.31–3.36, Dcalc = 3.41–3.59
    g/cm3, Mohs hardness 4, and biaxial (+) indices alpha = 1.725(5), beta = 1.755(5),
    gamma = 1.815(5), 2V ~ 60°.'
