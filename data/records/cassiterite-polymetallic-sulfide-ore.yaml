mechanisms:
- id: moderately_thermophilic_ore_pretreatment
  name: Culture-associated sulfide alteration and iron mobilization from mixed tin ore
  process: bioleaching
  description: Growing mixed and single bacterial cultures were associated with iron mobilization, acidification and altered pyrite-bearing ore residues during laboratory pretreatment. The mixed culture showed an earlier increase in the iron-based dissolution proxy than either iron-oxidizing single culture. This supports conditional biological pretreatment of the mixed feed. It does not establish a sulfur mass balance, a specific molecular route, a sustained final advantage over both single cultures, selective tin recovery or a purified product.
  context: 'The three named acid-mine-drainage isolates were held by the authors'' Central South University laboratory; strain and sequence accessions are not supplied. The species IDs do not identify these isolates or independently verify their community proportions. The Myanmar ore was crushed and sieved below 1 mm and autoclaved at 115 degrees C for 30 min. Iron-free modified 9K medium contained, in g/L, (NH4)2SO4 3, Na2SO4 2.1, MgSO4.7H2O 0.5, K2HPO4 0.05, KCl 0.1 and Ca(NO3)2 0.01, at initial pH 2. The source specifies 10% pulp density, 10% v/v inoculum and a 1:1:1 mixed-culture ratio. Mid-log cells were centrifuged and washed twice with sterile water acidified to pH 2 before resuspension. The stated 2e7 cells/mL is described as the population in the inoculation, not unambiguously a final reactor concentration. Assays used 5 L flasks at 45 degrees C and 170 rpm, in triplicate, with figures extending to 20 days. Working volume is unresolved: Section 2.2 describes 150 mL medium, Section
    2.4 collects 200 mL culture, and Section 2.5 describes a 100 mL sample from a stirred-tank reactor. These descriptions are not harmonized into a verified reactor scale. Figures include a control and the three single cultures; the control preparation is incompletely described. No killed-cell or pH-trajectory-matched chemical comparison is provided. ICP total iron was measured every two days. The source defines its desulfurization percentage as the measured total-iron concentration divided by the total-iron concentration obtained by aqua-regia digestion of ore. This is an iron-based proxy, not directly measured sulfur removal or isolated tin yield; the concentration and sampling basis does not establish a closed cumulative mass balance.'
