id: cmmmech:chromium-tanned-leather-shavings
name: Chromium-tanned leather shavings
material_kind: secondary_resource
description: Chromium-bearing collagenous shavings generated during leather manufacture after chrome tanning, represented here by wet-blue tannery waste from Poland. This processing residue is distinct from tannery wastewater-treatment sludge, tanning liquors, elemental chromium and purified collagen. The accepted laboratory evidence concerns yeast-associated matrix bioconversion and chromium partitioning, not an isolated chromium product or industrial deployment. Constituent criticality is not inherited.
sources:
- id: wieczorek2023
  title: Dorota Wieczorek, Dorota Gendaszewska, Katarzyna Miśkiewicz, Anna Słubik and Katarzyna Ławińska (2023). Biotransformation of protein-rich waste by Yarrowia lipolytica IPS21 to high-value products—amino acid supernatants. Microbiology Spectrum 11(5):e02749-23. DOI 10.1128/spectrum.02749-23; PMID 37707427; PMC10581069. Complete original JATS/HTML, Tables 1–2, Figures 1–5 and all five supplemental PDFs inspected; the nominal local main-PDF download was HTML and is not evidence.
  url: https://doi.org/10.1128/spectrum.02749-23
  accessed_on: '2026-10-15'
- id: ncbi4952
  title: 'NCBI Taxonomy 4952: Yarrowia lipolytica, species. Current official taxonomy XML verifies the species label, not the identity or performance of the experimental IPS21 stock.'
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=4952&mode=Info
  accessed_on: '2026-10-15'
- id: uniprot_yarrowia_lipolytica_proteases
  title: 'UniProtKB/Swiss-Prot reviewed entries in Yarrowia lipolytica reference proteome UP000001300 (NCBITaxon:284591): Alkaline extracellular protease XPR2 (UniProtKB:P09230), Acid extracellular protease AXP1 (UniProtKB:Q92389), and pH-response transcription factor pacC/RIM101 (UniProtKB:P78978).'
  url: https://www.uniprot.org/uniprotkb?query=(proteome:UP000001300)+AND+(accession:P09230+OR+accession:Q92389+OR+accession:P78978)
  accessed_on: '2026-11-10'
mechanisms:
- id: ips21_matrix_bioconversion_and_chromium_partitioning
  name: Yeast-associated matrix bioconversion and chromium partitioning
  process: other
  description: Living Yarrowia lipolytica IPS21 cultures were associated with proteolytic activity, increased soluble amino acids, changing pH and altered total-chromium concentrations in operational liquid and combined biomass/residue fractions. These observations support conditional bioconversion of a chromium-bearing waste matrix. They do not establish purified chromium recovery, a closed chromium extraction yield, intracellular chromium exclusion or a demonstrated redox mechanism.
  context: Wieczorek et al. obtained wet-blue chrome-tanned shavings from a Polish tannery at source-reported 51°29′37.8″N, 21°08′43.1″E. Reported moisture was 15% and aqueous-extract pH 3.09; the listed 4.4 ± 0.2% chromium(III) oxide, ash and nitrogen values are attributed to earlier literature rather than clearly documented lot-specific characterization. Particle sizes were reported as 1–5 mm. Source-designated IPS21 came from the institute collection, originally isolated from contaminated soil near the former BORUTA dye factory. Laboratory assays used 100 mL flasks with 40 mL sterile modified YPG medium and 0.1–4% (wt/wt) shavings, with 0.4 or 0.8 mL inoculum, 30°C, 190 rpm and 48 h. Initial pH was set to 7.07 before autoclaving at 121°C for 20 min. Yeast extract supplies nutrients independently of the shavings. The abstract gives 15 g/L yeast extract and 5 g/L NaCl, whereas the stock-medium method gives 2.5 g/L NaCl and agar; the final liquid recipe is not fully reconciled. The printed
    inoculum OD600 token is 1,000, with no independently verified viable-cell count. Yeast-only, medium-only and uninoculated shavings comparisons appear for the relevant endpoints; comparisons are not pH-matched. Total-Cr experiments concern 0.1% and 1% feeds, not the 4% arm. Reported endpoint summaries use n=3. No industrial treatment trial is established.
