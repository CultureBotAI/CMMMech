id: cmmmech:inderite
name: Inderite
material_kind: mineral
description: >-
  Inderite is the Mg[B3O3(OH)5](H2O)4·H2O mineral species in the
  September 2026 IMA-CNMNC list, with status A and year notation
  1962 s.p. for a special procedure, not a fabricated sequential approval
  identifier. It is distinct from its dimorph kurnakovite, from
  inderborite, elemental boron and the borates commodity. Gatta et al.
  studied natural Kramer Deposit, California, material by EPMA-WDS,
  laser-ablation mass spectrometry and neutron diffraction. The P21/c
  structure comprises borate-ring/Mg-polyhedron clusters connected by
  hydrogen bonds, with four Mg-bound water molecules and one interstitial
  water per formula unit. The chemical characterization is specimen
  specific, including modest electron-beam damage and an assumed B/H
  stoichiometry in the EPMA formula; it is not a resource-grade survey.
  Commodity criticality and microbial activity are not inherited.
