id: cmmmech:ludlamite
name: Ludlamite
material_kind: mineral
description: >-
  Ludlamite is the ferrous phosphate mineral with ideal formula Fe2+3(PO4)2(H2O)4,
  recorded as grandfathered in the September 2026 IMA list. It is a distinct mineral
  species from the three-water phosphoferrite and eight-water vivianite. Moore (1971)
  investigated natural ludlamite crystals from the Palermo number 1 mine in an abiotic
  heating comparison. The lower-temperature arms retained the starting powder pattern,
  whereas the 240 degrees C arm gave a ferric product with diffuse diffraction unrelated
  to the initial mineral. This observation does not identify a pure crystalline product
  or establish a general transformation temperature for all ludlamite specimens.
  The ludlamite and phosphoferrite observations curated in this corpus are different
  mineral arms of the same study, not independent replications. No microbial process,
  isolated-product recovery or constituent-derived criticality designation is asserted.
