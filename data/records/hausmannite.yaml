id: cmmmech:hausmannite
name: Hausmannite
material_kind: mineral
description: Hausmannite is the grandfathered tetragonal manganese oxide mineral Mn2+Mn3+2O4, commonly written Mn3O4; the IMA September 2026 list gives 1828 as its historical entry. It is distinct from elemental manganese, other manganese oxides, manganese oxalate products and mixed natural manganese ores. The curated laboratory experiment used a synthesized oxide preparation identified by the authors as hausmannite, not a natural mineral specimen. No criticality designation is inherited from manganese.
