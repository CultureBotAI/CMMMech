id: cmmmech:sphalerite
name: Sphalerite
material_kind: mineral
description: >-
  Sphalerite is the mineral species with IMA-approved formula ZnS.
  The September 2026 IMA list records status A (approved) and the
  IMA No./Year entry 1980 s.p., denoting special procedure rather than a
  sequential approval identifier or the year of original discovery.
  This species is distinct from elemental zinc, the zinc commodity,
  other ZnS phases and a flotation concentrate. The curated experiments
  used an iron-bearing Gamsberg concentrate; they are the same studies
  represented under cmmmech:zinc, not additional independent replications.
  No constituent-element criticality is inherited.
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC. The New IMA List of Minerals, September 2026.
      PDF page 203, Sphalerite row; page 1, column definitions;
      page 2, distribution terms.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-11'
  - id: fowler_crundwell_1999
    title: >-
      Fowler TA and Crundwell FK (1999). Leaching of Zinc Sulfide by
      Thiobacillus ferrooxidans: Bacterial Oxidation of the Sulfur Product
      Layer Increases the Rate of Zinc Sulfide Dissolution at High
      Concentrations of Ferrous Ions. Applied and Environmental
      Microbiology 65:5285-5292. DOI 10.1128/AEM.65.12.5285-5292.1999.
      Methods; Figures 2-6 and 8-10; Discussion.
    url: https://doi.org/10.1128/AEM.65.12.5285-5292.1999
    accessed_on: '2026-10-11'
