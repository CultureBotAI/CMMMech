    report negative beta synthesis. The 2018 online posting is not the
    publication year of the experiment.
  url: https://doi.org/10.1180/minmag.1993.057.387.12
  accessed_on: '2026-10-16'
- id: schindler2009
  title: >-
    Schindler M, Freund M, Hawthorne FC, Burns PC, Maurice PA (2009).
    Dissolution of uranophane: An AFM, XPS, SEM and ICP study. Geochimica et
    Cosmochimica Acta 73:2510-2533. DOI 10.1016/j.gca.2009.01.031. Complete
    coauthor-hosted original, all 24 pages, Tables 1-4 and Figures 1-13
    inspected. The beta-specific acid-exposure comparison is in Table 3,
    Figure 3a-b and section 4.6; synthetic powder assays concern uranophane.
  url: https://doi.org/10.1016/j.gca.2009.01.031
  accessed_on: '2026-10-16'
mechanisms:
- id: abiotic_acid_exposure_null_redox
  name: Abiotic acid exposure without a detected surface redox shift
  process: other
  microbial: false
  description: >-
    The source's XPS comparison of natural fibrous beta-uranophane before
    and after acid exposure found similar fitted uranium-valence proportions.
    This is a bounded null surface-redox result, not proof of no dissolution,
    no surface alteration or universal resistance to reduction.
  context: >-
    The natural crystals came from the William Pinch collection at the
    Canadian Museum of Nature and the Shinkolobwe mine, Democratic Republic
    of Congo. The beta-specific treatment used HCl at initial pH 3.5 for
    three hours at room temperature, in the study's mounted-single-crystal,
    5-mL batch setup. Untreated cleaved surfaces supplied comparisons.
    XPS U 4f spectra were fitted to U(VI) and U(IV) components; these are
    surface spectral assignments, not bulk uranium speciation or product
    recovery measurements. Independent reaction replication and the
    beta-specific final solution pH were not clearly documented.
  evidence:
  - source_ref: schindler2009
    supports: support
    explanation: >-
      Table 3's explicitly beta-labelled rows and Figure 3a-b show similar
      spectra before and after the pH-3.5, three-hour treatment. Section 4.6
      interprets the comparison as no significant oxidation or reduction
      during that treatment. This narrow observation does not transfer the
      synthetic alpha-powder uranium-release ranking or alpha-surface
      coating identifications to parauranophane.
  - source_ref: schindler2009
    supports: partial
    explanation: >-
      The methods and several figure captions use uranophane generically,
      while Table 3 separates fibrous beta specimens from alpha specimens.
      Table 3 labels the beta Ca-HCl treatment 60 minutes but Table 4 lists
      Ca-HCl at 30 minutes, so that arm is not adopted. Other unresolved
      source labels include Figure 3d's alpha treatment duration, Figure 8e's
      lead salt, and Figure 10d's sampling interval. Only the explicitly
      beta-labelled HCl comparison is accepted here. XPS analysis, washing,
      drying and vacuum exposure do not establish in-situ aqueous
      speciation; companion studies would need separate inspection before
      adopting their explanation for the original U(IV) component.
  - source_ref: cesbron1993
    supports: context_only
    explanation: >-
      The independent natural Nopal I material has its own XRD evidence in
      Tables 1-2, not an identity inferred solely from yellow colour or
      uranium content. Figure 3 shows etched natural crystals and opal
      coatings but provides no measured environmental dissolution rate.
      About fifty hydrothermal preparations across several uranyl silicates,
      principally at 150 degrees C with some trials as low as 60 degrees C,
      did not produce beta-uranophane. Their failure is restricted to the
      tested preparations; it neither proves universal synthesis failure
      nor measures a thermodynamic stability boundary.
