name: Spent nickel-metal-hydride batteries
material_kind: secondary_resource
description: End-of-life nickel-metal-hydride batteries, represented by mixed battery powder supplied by a recycler. This secondary resource is distinct from lithium-ion battery black mass, pure electrode compounds, and its constituent elements. Battery formulations and upstream recycling steps are not fully specified for the selected feed. No constituent-element criticality status is inherited by this waste resource.
