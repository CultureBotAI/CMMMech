id: cmmmech:goethite
name: Goethite
material_kind: mineral
description: Goethite is the FeO(OH) mineral species listed as approved (A), with 1980 special-procedure history, in the IMA-CNMNC September 2026 master list. It is distinct from iron element, other iron oxyhydroxide minerals, iron-ore commodities and mixed goethite-bearing tailings. The natural mineral feeds below have sample-specific compositions; synthetic goethite preparations can contain more reactive precursor phases. No iron criticality designation is inherited.
sources:
- id: ima_2026_09
  title: IMA-CNMNC master list, September 2026, PDF p84 Goethite row and p1 status definitions; retained official PDF reinspected 11 October 2026. The entry 1980 s.p. is special-procedure history, not an asserted external identifier.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: stankovic_2024
  title: Stankovic S and Schippers A (2024). Goethite dissolution by acidophilic bacteria. Frontiers in Microbiology 15:1360018. DOI 10.3389/fmicb.2024.1360018; Methods 2.1-2.3, Tables 1-2, Results 3.1 and 3.3-3.4, Figures 1-2 and 6-9, Discussion and Conclusion. Publisher PDF and Europe PMC full-text XML inspected, including rendered PDF pp3-4 and 8-10.
