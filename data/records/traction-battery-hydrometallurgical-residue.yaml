id: cmmmech:traction-battery-hydrometallurgical-residue
name: Traction-battery hydrometallurgical residue
material_kind: secondary_resource
description: Residual solids from acid leaching in wet recovery of nickel or cobalt from waste traction-battery cathode materials and other recycled wastes. The curated study used separate nickel-line and cobalt-line residues from an unnamed Chinese enterprise; their compositions are not pooled. The source calls these residues slags, but does not establish molten-slag origin. They are downstream processing residues, distinct from mechanically prepared battery black mass, intact batteries, a pure cathode compound and isolated nickel or cobalt products. Exact incoming battery chemistries and the contribution of other wastes are unspecified. No constituent-element criticality is inherited.
sources:
- id: lu2025
  title: Lu, H., Zhang, H., Chen, X., Wang, L. and Yan, X. (2025). Bioleaching of sludge from acid-leached waste traction batteries used in electric vehicles for the extraction of Ni and Co using optimized microbial consortia. RSC Advances 15, 45979–45985. DOI 10.1039/D5RA07472J; complete Europe PMC XML, Sections 2–3, Tables 1–2, original Figures 1–6 and two-page SI Table S1.
  url: https://doi.org/10.1039/D5RA07472J
  accessed_on: '2026-10-12'
- id: ncbi20261012
  title: 'NCBI Taxonomy, live species nodes accessed 2026-10-12: Acidithiobacillus ferrooxidans 920, Leptospirillum ferriphilum 178606, Acidithiobacillus thiooxidans 930, Acidithiobacillus caldus 33059 and Sulfobacillus thermotolerans 338644. Species mappings, not authentication of experimental stocks.'
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?command=show&id=178606&mode=node
  accessed_on: '2026-10-12'
mechanisms:
- id: acidophile_culture_associated_leaching
  name: Acidophile culture-associated release from separate nickel and cobalt residues
  process: bioleaching
  description: Living acidophilic cultures were associated with increased dissolved-metal release from separate acid-leached nickel-line and cobalt-line residues. Single cultures and mixtures were compared. Iron and sulfur metabolism is a proposed explanation; the experiment does not isolate a unique cellular pathway or establish the contribution of each mixture member. The claim is laboratory solution release rather than isolated-product recovery or industrial deployment.
  context: 'Sections 2.1–2.3: source-reported stocks were A. ferrooxidans ATCC 23270 (Af), L. ferriphilum AS1 6358 (Lf), historical Thiobacillus thiooxidans BJMCC 01101 (Tt), A. caldus CGMCC 1.15711 (Ac) and S. thermotolerans DSM 17362 (St). Seven days of preculture preceded residue addition in 3-L beakers with a 2-L 9K-medium system, 200 mL culture and initial pH 1.9. Stirring suspended the solids; evaporated water was replenished daily and filtered samples analyzed by ICP-MS through day 12. Initial 10% loading denotes 200 g solids per 2 L; 20–50% arms used 400–1000 g. Af, Lf, Tt and the blank CK were tested at 30 degrees C, Ac/St at 40 degrees C; mixtures used 30, 40 or 45 degrees C. MC45-40AS contained equal starting volumes of all five cultures at 45 degrees C; MC40-25St contained equal Af/Lf/Tt/St volumes at 40 degrees C. Starting inoculum proportions do not demonstrate post-growth community composition. No matched 40/45-degree abiotic series, pH/iron-matched controls, replication count
    or error definition is reported. The text mentions optimization of sulfur and ferrous sulfate without complete final amounts.'
