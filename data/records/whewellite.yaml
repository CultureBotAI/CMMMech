    Complete one-page identity entry.
  url: https://www.handbookofmineralogy.org/pdfs/Whewellite.pdf
  accessed_on: '2026-10-14'
- id: weddellite_handbook
  title: Handbook of Mineralogy. Weddellite. Complete one-page entry, including atmospheric dehydration
