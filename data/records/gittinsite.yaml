id: cmmmech:gittinsite
name: Gittinsite
material_kind: mineral
description: Anhydrous calcium-zirconium sorosilicate (pyrosilicate) mineral with current
  September 2026 IMA-CNMNC approved formula CaZrSi2O7, status A, and approval number IMA 1979-034.
  Ansell, Roberts, Plant, and Sturman (1980) described the holotype specimen (Geological Survey
  of Canada No. 19558) as chalky fine-grained intergrowths with apophyllite after eudialyte
  in pegmatitic lenses of the Kipawa River peralkaline alkalic complex, Villedieu Township,
  Temiscaming County, Quebec, Canada. Electron-microprobe analysis of the Kipawa holotype
  (p. 203) yielded CaO 18.4, ZrO2 40.3, SiO2 40.8, total 99.5 wt%, corresponding on the basis
  of 7 O atoms to the empirical formula Ca0.98Zr0.98Si2.03O7, with initial powder X-ray diffraction
  indexed on a monoclinic cell (a = 6.878(4), b = 8.674(4), c = 4.697(2) A, beta = 101.74(4)
  degrees, V = 274.34 A3, Z = 2). Roelofsen-Ahl and Peterson (1989) solved the single-crystal
  structure on a specimen from the Strange Lake peralkaline granite, Quebec-Labrador, Canada
  (NMC 66057; WDS composition CaO 18.8, FeO 0.3, PbO 0.2, ZrO2 40.3, SiO2 40.8, F 0.2, less
  O=F 0.1, total 100.5 wt%) in acentric monoclinic space group C2 (a = 6.852(2), b = 8.659(1),
  c = 4.686(2) A, beta = 101.69(2) degrees, V = 272.(1) A3, Z = 2, R = 3.1%, Rw = 3.9% for
  513 observed reflections with I > 3sigma(I) out of 522 unique reflections), showing that
  ordering of [CaO6] and [ZrO6] octahedra within the octahedral sheets and bending of the
  pyrosilicate [Si2O7]6- bridge (Si-O1-Si = 147.4(5) degrees) lower the symmetry from the
  ideal C2/m thortveitite aristotype to C2. Distinct from armstrongite, vlasovite, eudialyte,
  and elemental zirconium; no criticality designation, microbial mechanism, or industrial
  recovery yield is asserted.
