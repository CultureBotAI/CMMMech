material_kind: element
description: >-
  Silver (Ag). The element identity is distinct from the silver(I) salts and
  precipitates used in the laboratory experiment below. The dated US
  designation concerns the silver mineral commodity; it is mapped here to
  its elemental identity, not inherited by every silver-bearing material.
