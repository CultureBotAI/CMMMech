mechanisms:
  - id: bcp1_tellurite_reduction
    name: Resting-cell tellurite transformation to intracellular tellurium nanorods
    process: redox_transformation
    description: >-
      Rhodococcus aetherivorans BCP1 (DSM 44980) resting cells produced
      intracellular tellurium nanostructures. Electron diffraction supported
      trigonal elemental tellurium in analyzed nanorods. The proposed
      surfactant-assisted assembly pathway remains an interpretation.
    context: >-
      Laboratory aerobic exposure of LB-grown, twice PBS-washed cells in
      50 mL PBS, pH 7.4, at 30 degrees C and 150 rpm for 0.5-16 h.
      The supplement specifies initial K2TeO3 loadings of 100, 500 or
      1000 micrograms/mL; main-text labels instead call these tellurite
      concentrations. Preserve that mass-basis ambiguity without conversion
      to elemental Te. Biomass loading is not quantified in the exposure
      protocol. Solution depletion is not an isolated-product yield;
      industrial operation was not demonstrated.
    microbial: true
    organisms:
      - id: NCBITaxon:191292
        label: Rhodococcus aetherivorans
    evidence:
      - source_ref: presentato_2018
        supports: support
        explanation: >-
          Figures 1-3 and 5 support solution depletion, intracellular
          nanostructures, and trigonal-Te diffraction. Figure 1 uses three
          biological replicates. At 16 h the higher nominal doses showed
          partial removal: 42 +/- 3% (500) and 28 +/- 4% (1000), not complete
          conversion. These are reported removal percentages, not recovery yields.
      - source_ref: presentato_2018_supplement
        supports: support
        explanation: >-
          Supplementary methods and Figure S1 caption specify PBS-only and
          autoclaved-biomass controls at the highest loading; the main text
          reports no abiotic removal. The assay measures supernatant tellurite
          by diethyldithiocarbamate absorbance at 340 nm, calibrated with
          K2TeO3 in PBS. No analytical detection limit is given; apparent
          complete depletion at the lowest dose cannot establish literal zero.
      - source_ref: presentato_2018
        supports: partial
        explanation: >-
          Figure 7 proposes nanorod assembly assisted by amphiphilic
          biomolecules. The paper does not identify a necessary tellurite
          reductase or measure an isolated elemental-tellurium mass yield.
