id: cmmmech:variscite
name: Variscite
material_kind: mineral
description: Variscite is the orthorhombic hydrated aluminum phosphate mineral Al(PO4)(H2O)2, conventionally
  AlPO4·2H2O. The September 2026 IMA-CNMNC list records approved status A and 1967 s.p., a special-procedure
  entry rather than a numbered new-mineral proposal. It is distinct from monoclinic metavariscite, anhydrous
  berlinite, aluminum metal and mixed phosphate resources. The curated mechanism is an abiotic foundation
  for phosphate-phase transformation; no microbial mechanism or constituent-derived criticality is assigned.
