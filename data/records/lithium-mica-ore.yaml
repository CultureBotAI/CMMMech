  evidence:
  - source_ref: sedlakova2020
    supports: support
    explanation: 'Materials and methods, Bioleaching kinetics, Figure 1 and Figure 4B support a condition-dependent dissolved-lithium result: the poor bacterial medium reached a reported 11 mg/L and a reported 8.8% feed-lithium extraction, while nutrient-rich bacterial medium showed no bioleaching. The authors report no lithium found in uninoculated controls; no analytical detection limit or full control concentration series is supplied, so this is not an exact-zero measurement. These observations support this assay, not a universal advantage of bacterial leaching or nutrient starvation.'
  - source_ref: sedlakova2020
    supports: partial
    explanation: Figure 3 and the pH discussion show unlike culture and control pH histories, without matched-acidity or cell-free spent-medium controls. Sulfuric-acid action and individual bacterial roles are proposed explanations. Figure 2 is a shrinking-core-model fit, not independent proof of a reaction pathway. Its plotted transformed ordinate begins near 0.667, and the paper does not supply a reproducible normalization resolving that offset; no fitted rate constant or claimed 400-fold kinetic gain is adopted here. Methods gives 1.21% elemental Li by AAS, whereas Table 1 gives 3.79% Li2O, approximately 1.76% elemental Li by stoichiometry. That unresolved feed-assay discrepancy prevents treating the reported percentage as an independently verified mass balance; it is retained as the authors' result only.
  - source_ref: sedlakova2020
    supports: partial
    explanation: Supplementary Figure S2A assigns the initial ore to polylithionite, muscovite and kaolinite. Panel B assigns the bacterial residue to polylithionite, kaolinite and sulfur and omits a muscovite reference pattern, consistent with the authors' description. The panels have different count scales, no quantitative phase analysis and no matched uninoculated residue pattern. Reference labels include non-ideal formulas, and the yeast panel has two different polylithionite-labelled references. Neither the labels nor peak-intensity differences establish pure endmembers, complete phase removal or a mineral-specific lithium yield.
- id: beauvoir_fungal_leaching
  name: Fungal culture-associated lithium mobilization and biomass association
  process: bioleaching
  description: A. niger cultivation on the same Beauvoir mixed ore produced low lithium mobilization, with much of the assayed extracted lithium in the harvested biomass fraction. Hyphae attached to and associated with cleavages in mineral particles. Organic-acid action and mechanical weathering are plausible interpretations, but acid identities, intracellular localization and their individual contributions were not directly established. This is a separate fungal flask assay, not the first stage of a demonstrated sequential recovery process.
  context: The authors identify strain An-S from the acidified Sobov site and report ISB collection number 1674; no strain-level identifier is assigned here. In duplicate 250 mL flasks, 2 g of the same milled ore was added to 200 mL glucose 5 g/L and (NH4)2SO4 0.5 g/L medium, adjusted initially to pH 5.1, with 5 mL of eight-day-old conidial culture. Medium and mineral were autoclaved at 120 degrees C for 20 minutes. Incubation was static at 21 degrees C. Methods lists sampling through day 41 and paired uninoculated media. AAS was used on filtered liquid; harvested biomass was washed, air-dried, incinerated at 500 degrees C for four hours and digested in 2 M HCl. The paper's figures and prose use different endpoint descriptions, so approximately forty-day results are not assigned a fabricated exact common endpoint across organisms.
