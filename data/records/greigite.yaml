  evidence:
  - source_ref: gorlas2022
    supports: support
    explanation: Figure 3D-F identifies extracellular L-cystine-arm nanocrystals as greigite by electron diffraction and high-resolution TEM at 144 hours. Figure 2 and Table 1 do not resolve greigite in the 160-hour bulk XANES fit for this arm, which is dominated by poorly ordered FeS and iron phosphates. The authors attribute the non-detection to low abundance, citing an approximate 5% XANES detection limit. Microscopic detection and bulk non-detection are not converted into contradictory presence claims or a quantified greigite yield. Pyrite was not observed in this arm.
  - source_ref: gorlas2022
    supports: support
    explanation: For the elemental-sulfur arm, Figure 2D and Table 1 fit the 160-hour bulk Fe K-edge spectrum with greigite 41%, pyrite 49% and FeS 11%. These are fitted relative Fe-species contributions, sum to 101% as printed, and are not recovered masses, percentages of total culture solids or conversion of added iron. Supplementary Figures S2-S3 distinguish extracellular nanocrystals from pyrite-containing spherules. The article's Table 1 labels uncertainty intervals as 98% confidence, while the methods specify 99.7% (three sigma); the confidence convention is unresolved.
  - source_ref: gorlas2022
    supports: partial
    explanation: Cell-free controls in both sulfur-source media are reported to contain amorphous FeS without observed greigite or pyrite. Supplementary Figure S6 directly illustrates a 70-hour elemental-sulfur control with SEM and EDX, not a complete phase-quantified control series matched to the 144-160-hour culture measurements. The comparisons support culture-associated formation under these conditions but do not isolate active metabolism from cell-derived substrates, templating and altered sulfur chemistry.
  - source_ref: gorlas2022
    supports: partial
    explanation: Cell damage, iron-phosphate-rich debris and later greigite motivate the proposed precursor pathway. Dissolved phosphate release was explicitly not measured. ATP and cell-division observations in Figures 4-6 concern population response to mineralization and do not demonstrate that greigite alone causes survival or growth. Appendix S1 documents chemically synthesized XANES reference compounds, including greigite; these standards are distinct from the microbial assay products. No industrial deployment, isolated-product yield or universal biological origin of natural greigite is established.
