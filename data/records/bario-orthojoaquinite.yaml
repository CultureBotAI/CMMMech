id: cmmmech:bario-orthojoaquinite
name: Bario-orthojoaquinite
material_kind: mineral
description: >-
  Bario-orthojoaquinite (IMA 1979-081) is an IMA-accepted barium-titanium-iron
  cyclosilicate mineral of the joaquinite group with IMA September 2026 Master
  List formula Ba4Fe2+2Ti2O2(SiO3)8·H2O and general crystal-chemical formula
  Fe2+4Ba4Ti4(Ba,Sr)4O4[Si4O12]4·2H2O (empirical formula
  (Na0.12Fe3.61Mn0.24)Sigma3.97Ba4(Ti3.88Al0.12)Sigma4.00(Ba2.88Sr0.88Ca0.08Al0.16)Sigma4.00O4[Si4O12]4·2H2O).
  Described by Wise (1982) from the Benitoite Gem Mine, San Benito County,
  California, USA, where it occurs as yellowish-brown dipyramidal to truncated
  pyramidal crystals up to 8 mm across on fractures in serpentinized peridotite
  and metamorphosed basaltic rocks alongside benitoite, baotite, fresnoite, and
  natrolite. Orthorhombic (space group Ccmm, Cc2m, or Ccm21), with a = 10.477(5)
  Å, b = 9.599(1) Å, c = 22.59(2) Å, Z = 2, Dmeas = 3.959(2) g/cm3, Dcalc =
  3.962 g/cm3, Mohs hardness 5.5, good {001} cleavage, and biaxial (+) optics
  with alpha = 1.735(2), beta = 1.737(2), gamma = 1.80(1), and 2V = 10–15°.
