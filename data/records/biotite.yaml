        supports: support
        explanation: Results and Figure 1A show the Fe increase over the 4-48-hour biotite time course and elevated Si relative to uninoculated controls from 12 to 48 hours. Figure 1B shows culture acidification relative to controls, and Figure 1E shows stained mineral-associated cells after 24 hours. Figure 1 reports n=3 with one-standard-deviation error bars. These support the conditional culture-associated mobilization claim, without establishing a recovered product.
      - source_ref: sheng_2026
        supports: partial
        explanation: No pH-matched abiotic assay separates acid dissolution from other cellular effects. Figure 1D and the main text call the early 1.7-7.6% CAS siderophore-unit values detectable, whereas supplementary p2 classifies values below 10% as negative; later biotite time points are reported as nondetections. A positive siderophore mechanism is therefore not assigned. Gene-expression correlations are not functional tests, as the Discussion acknowledges. Cell-associated Fe digestion and surface fluorescence do not demonstrate intracellular uptake. Feed member-species identity, phase purity, fraction-specific mass balance, isolated-metal recovery and industrial deployment remain unestablished.
causal_graphs:
