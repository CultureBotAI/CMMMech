id: cmmmech:marioantofilliite
name: Marioantofilliite
material_kind: mineral
description: >-
  IMA-approved copper-aluminium layered double hydroxide (LDH) carbonate mineral of the
  hydrotalcite supergroup (quintinite group; IMA 2025-012; symbol Maf in Section 1, p. 734,
  and Figure 1 caption, p. 735; status A, Approved 2025; full description published 14
  October 2025; no separate symbol column is printed in the September 2026 IMA Master List,
  PDF p. 136) with ideal end-member formula [Cu4Al2(OH)12](CO3)*3H2O (printed as
  [Cu4Al2(OH)12](CO3)(H2O)3 in the September 2026 IMA Master List, PDF p. 136, and as
  [Cu4Al2(OH)12](CO3)*3H2O in the Title, Abstract, and Section 5, pp. 733, 737, requiring CO2
  7.03 wt%, Al2O3 16.28 wt%, CuO 50.80 wt%, and H2O 25.89 wt%, total 100.00 wt%; Biagioni,
  Sejkora, Perchiazzi, Mugnaioli, Mauro, Belmonte, Skoda, and Dolnicek, 2025, European
  Journal of Mineralogy 37:733-746). Natural analogue of synthetic Cu-Al LDH phases (e.g.,
  Yamaoka et al., 1989; Britto and Kamath, 2009; Intissar et al., 2015) studied for catalytic
  and anion-exchange properties, and the second new supergene mineral species (after
  tiberiobardiite) described from ophiolite-hosted volcanogenic massive sulfide Cu(-Fe) ore
  deposits of the northern Apennines (Sections 1, 8, and 9, pp. 733-734, 741-743). Named in
  honour of Mario Antofilli (1920-1983), long-time president of the Gruppo Mineralogico
  Ligure, co-author of the 1983 book "I nostri minerali - Geologia e Mineralogia in Liguria",
  author of a 1982 review on Ligurian zeolites, and discoverer of the Molinello mine specimens
  that yielded tiragalloite (Abstract, p. 733, and Section 1, p. 734). Discovered in a
  supergene specimen (initially dubiously identified as carbonatecyanotrichite) provided by
  the mineral collector Sebastiano Di Lisi from the Monte Copello-Reppia Cu-Fe mining prospect
  (latitude 44 deg 23 min 11.40 sec N, longitude 9 deg 27 min 25.17 sec E), Graveglia Valley,
  Ne, Genoa Province, Liguria, Italy (Sections 1-2, p. 734). Type material is represented by
  two cotype specimens: one specimen (oxidized ore sample and single crystal used for X-ray
  diffraction study) is kept in the mineralogical collection of the Museo di Storia Naturale
  of the University of Pisa, Via Roma 79, Calci (Pisa, Italy), under catalogue number 20081,
  and the second cotype specimen (polished grain used for WDS chemical analysis) is kept in
  the National Museum, Prague, Czech Republic, under catalogue number P1P 3/2025 (Section 1,
  p. 734). Hosted in a deeply weathered gossanized sulfide ore body (mainly pyrite and
  chalcopyrite in a gangue of calcite, quartz, and clay minerals at the tectonized contact
  between Jurassic ophiolitic pillow/brecciated basalts and Calpionella limestone / Diaspri di
  Monte Alpe cherts), where marioantofilliite formed at circumneutral pH (6-8) and ambient
  conditions via oxidative dissolution of primary Cu-Fe sulfides by mine-drainage aqueous
  solutions and neutralization by gangue carbonates (CO2 sequestration), associated in type
  material with allophane and greenish globular malachite on limonite (Abstract, p. 733;
  Section 2, p. 734; Figure 1, p. 735). Occurs as blue globular aggregates up to 1 mm in
  diameter composed of micrometre-sized prismatic crystals (Figure 1, p. 735), transparent,
  with a light-blue streak and a greasy lustre, non-fluorescent under short- and
  long-wavelength UV radiation, soft and brittle, with no observed cleavage or fracture due
  to the very small crystal size (Abstract, p. 733, and Section 2, p. 734). Calculated
  density is 2.825 g cm-3 based on the empirical formula and single-crystal XRD unit-cell
  parameters (Abstract, p. 733, and Section 2, p. 734). Optically biaxial (-), with alpha =
  1.613(4), beta = 1.626(3), and gamma = 1.633(5) in 589 nm light, 2V = 69 deg calculated by
  ExcalibrW from spindle-stage extinction and 2Vcalc = 72 deg from the refractive indices
  using the equation of Wright (1951), strong dispersion (r > v), distinct pleochroism from
  X = colourless to Z = pale blue, and a Gladstone-Dale compatibility index [1 - (KP/KC)] =
  0.006 ("superior", Mandarino, 1981; Abstract, p. 733, and Section 2, p. 734). Micro-Raman
  spectroscopy (Thermo Scientific DXR dispersive Raman spectrometer on confocal Olympus
  microscope, 532 nm laser, 4000-20 cm-1; Section 3, pp. 735-736, and Figure 2, p. 736) shows
  O-H stretching of H-bonded OH and H2O groups at 3520 cm-1 (strongest) with a shoulder at
  2935 cm-1, weak H2O nu2 bending at 1659 cm-1, weak CO32- nu3 antisymmetric stretching at
  1395 cm-1, medium-strong CO32- nu1 symmetric stretching at 1060 cm-1, strong M-O symmetric
  stretching at 513 cm-1 (shoulders at 576 and 547 cm-1), O-M-O bending at 150 cm-1 (shoulder
  at 227 cm-1), and a lattice mode at 67 cm-1; rapid dissolution with strong effervescence in
  cold ~3.3 M HCl further confirms carbonate groups (Section 5, p. 736). Thermogravimetric and
  mass-spectrometric evolved-gas analysis (Setaram SETSYS thermobalance with Pfeiffer Vacuum
  GSD 320 03 OmniStar mass spectrometer on 1.316 mg in air from 30 to 995 deg C at 10 deg C
  min-1; Section 4 and Figure 3, p. 736) recorded four mass-loss steps totalling 33.27 wt%
  (16.43 wt% at 30-230 deg C from ~3 H2O and 5.5 OH; 11.81 wt% at 230-550 deg C from ~9.35 wt%
  [~6.5 OH] + ~2.46 wt% [~0.35 CO2]; 4.44 wt% at 550-780 deg C from ~0.63 CO2; and 0.59 wt%
  at 780-995 deg C during formation of tenorite CuO and CuAl2O4 spinel), matching the
  stoichiometric H2O + CO2 content of 33.62 wt% unnormalized (27.56 + 6.06 wt%) and 31.86 wt%
  normalized (26.12 + 5.74 wt%). Quantitative wavelength-dispersive electron-microprobe
  analyses (Cameca SX 100 at the National Museum, Prague; 15 kV, 10 nA, 5 um beam diameter,
  PAP correction; average of n = 20 spot analyses; As, Na, P, Ca, Mn, Ba, Pb, Sr, Fe, Ni, Co,
  and Zn below detection limits; Section 5, pp. 736-737, and Table 1, p. 737) yielded mean
  (and normalized to 100.00 wt%) SO3 0.07 wt% (range 0.00-0.16, esd 0.04, normalized 0.07,
  standard celestine), CO2calc 6.06 wt% (normalized 5.74), SiO2 0.54 wt% (0.04-1.61, esd 0.40,
  normalized 0.51, standard wollastonite), Al2O3 14.97 wt% (14.20-16.01, esd 0.51, normalized
  14.19, standard sanidine), MgO 0.12 wt% (0.00-0.31, esd 0.12, normalized 0.11, standard
  diopside), CuO 56.21 wt% (53.54-60.20, esd 1.93, normalized 53.26, standard chalcopyrite),
  and H2Ocalc 27.56 wt% (normalized 26.12), with unnormalized Total 105.53 wt% (exact sum
  105.53 wt%) and normalized Total 100.00 wt% (exact sum 100.00 wt%). Recalculated on the
  basis of (Cu + Mg + Al) = 6 apfu (layer composition [(Cu,Mg)0.71Al0.29(OH)2]0.29+, x ~ 0.29,
  M2+:M3+ = 4.25:1.76 ~ 2.45), the empirical formula (with rounding errors) is
  [Cu2+4.23Mg0.02Al1.76(OH)12](CO3)0.82(SO4)0.01[Si(OH)6]0.05*3H2O (Abstract, p. 733, and
  Section 5, p. 737). Crystallizes in the monoclinic system, space group C2/m (#12), with
  single-crystal X-ray diffraction unit-cell parameters (Bruker D8 Venture diffractometer,
  Photon III CCD detector, microfocus MoKalpha radiation, lambda = 0.71073 A, T = 299(2) K,
  801 reflections above 20sigma(I) with 5.406 deg < 2theta < 58.21 deg; crystal size 0.035 x
  0.006 x 0.006 mm; Section 6.2, p. 737, and Table 3, p. 739) a = 5.590(3) A, b = 2.9358(11)
  A, c = 7.675(3) A, beta = 100.958(17) deg, V = 123.66(9) A3, Z = 1/3 (for the 6-cation
  formula; Z = 2 for the 1-cation formula; Gandolfi-like microfocus CuKalpha powder XRD
  refined in Topas-Academic gave a = 5.5815(6) A, b = 2.9374(4) A, c = 7.6878(9) A, beta =
  100.925(9) deg, V = 123.76(2) A3, Section 6.1, p. 737; low-dose STEM 3DED in a JEOL
  JEM-F200 TEM at 200 kV showed layer repeats ~3.0 x 3.2 A, gamma ~ 120 deg, consistent with
  the Niggli-reduced cell a = 2.94, b = 3.15 A, gamma = 117.7 deg, Section 6.3, pp. 739-740).
  Structure refinement in Shelxl-2018 converged to R1 = 0.0372 for 181 reflections with F >
  4sigma(F) and R1 = 0.0372 (wR2 = 0.0893, GooF = 1.141, Rint = 0.0640) for all 182 unique
  reflections out of 1682 measured reflections and 23 parameters (Section 6.2, pp. 737-738,
  and Table 3, p. 739). The average structure consists of distorted {001} brucite-like layers
  in which Cu2+ and Al3+ statistically occupy the octahedrally coordinated M(1) site (2b,
  refined occupancy Cu0.613(18)Al0.387(18), Jahn-Teller distorted 4+2 coordination with four
  equatorial M(1)-O(1) = 1.942(3) A and two apical M(1)-O(1) = 2.233(5) A, mean 2.039 A, BVS =
  2.34 vu vs 2.39 vu expected) and H-bonded interlayer disordered C (4i, s.o. 0.097(5),
  C-O(1i) = 1.28(6) A, C-O(2i) x 2 = 1.35(5) A, BVS = 3.60 vu), O(1i) (4i, s.o. 0.34(3), CO3
  or H2O), and O(2i) (4g, s.o. 0.193(9), CO3) sites, yielding the structural formula
  [(Cu0.613(18)Al0.387(18))(OH)2](CO3)0.194*0.486H2O for Z = 2 (note that Section 7.4 on p.
  741 prints the 6-cation recalculation "with rounding errors" as
  [(Cu3.72Al2.28)(OH)12](CO3)1.10*3.06H2O, whereas 6 x
  [(Cu0.613Al0.387)(OH)2](CO3)0.194*0.486H2O equals
  [(Cu3.68Al2.32)(OH)12](CO3)1.16*2.92H2O; Tables 4-6, pp. 739-740, and Section 7, pp.
  740-741). The principal powder X-ray diffraction lines in Table 2 [dobs in A (Iobs, dcalc in
  A, Icalc) hkl; p. 738] are 7.56 (100, 7.54, 100) (0 0 1), 3.778 (26, 3.768, 27) (0 0 2),
  2.750 (5, 2.752/2.744, 2/12) (-2 0 1, 2 0 0), 2.524 (8, 2.519, 15) (-1 1 1), 2.438 (4,
  2.451/2.434, 1/10) (-2 0 2, 2 0 1), 2.233 (7.5, 2.229, 12) (-1 1 2), 2.044 (3.9,
  2.058/2.050/2.041, 1/2/7) (-2 0 3, 1 1 2, 2 0 2), 1.892 (8.2, 1.889/1.884, 11/1) (-1 1 3, 0
  0 4), 1.728 (2.6, 1.712, 2) (-2 0 4), and 1.731 (2.4, 1.727, 5) (1 1 3). No biological or
  microbial interaction data are reported in the type mineralogical description.
