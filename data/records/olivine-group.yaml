id: cmmmech:olivine-group
name: Olivine group
material_kind: mineral_group
description: Olivine denotes a mineral group, identified as GROUP in the CNMNC-hosted Compendium of IMA-approved Mineral Nomenclature. The forsterite-fayalite solid-solution series lies within this group; a magnesium-rich experimental olivine is not necessarily the chemically pure forsterite endmember. This record keeps group scope distinct from the existing forsterite species record, elemental constituents and bulk ultramafic resources. No group-wide criticality or uniform microbial response is inferred. The enstatite companion record uses a different feed arm of the same Klug study.
sources:
- id: ima_compendium_2019
  title: A Compendium of IMA-approved Mineral Nomenclature, Melbourne 2018 compilation, copyright 2019; CNMNC-hosted PDF pages 10 and 16, forsterite-fayalite examples; page 35, Whitney and Evans mineral-abbreviation table, olivine GROUP row and footnote.
  url: https://cnmnc.units.it/ima_reports/2%20IMA-Nomenclature-e-Booklet-2019-1.pdf
  accessed_on: '2026-10-11'
- id: klug_2026
  title: Klug et al. (2026). Bioleaching of olivine and enstatite with formation of Mg-oxalate mediated by engineered Gluconobacter oxydans. Scientific Reports 16:25317. DOI 10.1038/s41598-026-63817-0; Methods, Figures 2-6 and Discussion.
  url: https://doi.org/10.1038/s41598-026-63817-0
  accessed_on: '2026-10-11'
- id: klug_2026_data
  title: 'Klug et al. (2026), Supplementary Material 1: leachate pH, ICP-MS data, XRD minerals and Mg, Fe, Ni mass balance calcs worksheets. Same experiment as the main article.'
  url: https://pmc.ncbi.nlm.nih.gov/articles/instance/13473492/bin/41598_2026_63817_MOESM1_ESM.xlsx
  accessed_on: '2026-10-11'
- id: klug_2026_si
  title: 'Klug et al. (2026), Supplementary Material 2: Table S1 and Figures S1-S4; assumed commercial San Carlos composition, Raman assignment, feed mixture and direct versus cell-free XRD.'
  url: https://pmc.ncbi.nlm.nih.gov/articles/instance/13473492/bin/41598_2026_63817_MOESM2_ESM.docx
  accessed_on: '2026-10-11'
- id: ncbi_oxydans
  title: NCBI Taxonomy 442 - Gluconobacter oxydans, species rank; XML checked 11 October 2026. This identifier does not resolve the engineered B58 derivative.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=442&mode=Info
