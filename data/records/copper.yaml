  evidence:
  - source_ref: christel_2018
    supports: support
    explanation: Methods and Bioleaching of Chalcopyrite Concentrate results, Figure 1C, support composition-dependent copper release. The initial A. caldus/S. thermosulfidooxidans treatment reached 14.2 +/- 0.3 mM total released Cu; Figure 1 identifies means +/- SD with n=4. Uninoculated controls released 2.4 +/- 0.3 mM Cu after 15 days. The record preserves the authors' concentration assay, without converting it to a recovery percentage or a purified metal yield.
  - source_ref: christel_2018
    supports: partial
    explanation: The same results section reports marginal leaching by A. caldus alone and attributes its late iron oxidation to possible surviving environmental contaminants. It also reports variable run lengths and lower performance of the three-species mixture than the binary mixtures. These observations limit generalization to arbitrary acidophile mixtures and unsterilized ores. Low-redox and cell- attachment explanations, candidate iron-oxidation genes and scale-up feasibility remain interpretations or future tests, not demonstrated molecular causes or industrial performance.
