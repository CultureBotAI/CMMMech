  evidence:
  - source_ref: smeaton2012_chapter4
    supports: support
    explanation: Chapter 4 methods/results and Figure 4.1 show approximately 4.6 mM filtered Fe(II) and 3.2 mM filtered Tl in living-cell mineral tubes by the nominal 893-hour endpoint, versus approximately 2.1 mM Tl in cell-free mineral controls. Autoclaved-cell tubes release less Tl and show negligible Fe(II), as do cell-free Fe(II) controls. These are concentrations from this synthetic feed, not extraction yields. Different pH trajectories and possible dead-cell surface effects preclude attributing the entire between-arm difference to a single direct electron-transfer pathway.
  - source_ref: smeaton2012_si
    supports: partial
    explanation: SI S1-S2, Table S2 and Figures S3-S6 constrain substrate and product interpretation. The main account gives (H3O)0.29Tl0.71Fe2.74(SO4)2(OH)5.22(H2O)0.78, whereas SI S1 prints (OH)6; this discrepancy is retained rather than assigning a pure mineral endmember. PIPES sulfur prevents independent tracking of sulfate release. Table S2 includes stoichiometrically estimated acetate, bicarbonate and sulfate despite its measured-concentrations heading. Secondary saturation indices are model predictions. Local Tl/S/O enrichment in Figure S5 does not identify a pure sulfate phase or quantify a recovered fraction; its caption incorrectly names O and Fe. Fe/O-rich particles likewise lack phase-specific identification.
  - source_ref: smeaton2012_chapter4
    supports: partial
    explanation: The separate 72-hour mineral-free sorption experiment used about 35 micromolar Tl in 0.1 M NaCl with live cells, autoclaved cells and cell-free controls near nominal pH 5 and 6.2/6.3. The authors report no significant between-arm Tl depletion difference. This limited null result does not establish absence of sorption at the millimolar concentrations of the dissolution assay or in other environmental systems. Methods, results and supporting table labels disagree on pH; final pH is not identical across arms. No statistically stronger conclusion is inferred from the printed data.
  - source_ref: smeaton2012_si
    supports: partial
    explanation: Table S1 contains mismatched pH labels and a contradictory significance notation. Reported biomass-to-cell-count conversions also differ within the source. ATP luminescence is a biomass/viability proxy, not a direct viable-cell count; some prose time/value assignments disagree with Figure 4.1. Proposed ATPase uptake/efflux and specific detoxification mechanisms were not tested by expression or perturbation experiments. The source also uses 853/863 hours in passages alongside the nominal 893-hour assay; no silent harmonization or industrial performance claim is made.
