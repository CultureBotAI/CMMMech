mechanisms:
- id: voltae-pyrite-associated-growth-and-reduction
  name: Methanogen growth on specimen pyrite with synthetic-phase reduction assays
  process: redox_transformation
  description: Living Methanococcus voltae A3 produced cells and methane with washed natural specimen pyrite as its added iron and sulfur source. Separate synthesized-FeS2 experiments produced sulfide and showed dependence on mineral accessibility, supporting culture-associated reductive transformation under these laboratory conditions. The natural specimen growth observation does not itself quantify its dissolution or establish the same reduction rate as the synthesized phase. No isolated-metal recovery or industrial deployment was demonstrated.
  context: Payne et al. crushed Zacatecas, Mexico specimen pyrite from Ward's, selected the 63-125 micrometre fraction, and applied sequential hydrochloric acid, water and acetone washes. Natural specimen assays used 1.5 g per 75 mL medium, reported as 167 mM FeS2; synthesized-phase assays used 2 mM Fe. Loading was selected using estimated geometric surface areas, not measured equal reactivity. M. voltae A3, source ATCC BAA-1334, was washed and inoculated at 10% v/v into initially pH 7 defined basal medium with trace metals, vitamins, organic supplements and formate. The reported formate addition was 0.4% v/v of a 40% wt/v stock. Cultures used 165 mL serum bottles, 75 mL medium, an 80:20 N2/CO2 headspace pressurized to 3.14 atm, and static incubation at 38 degrees C. The specimen growth endpoint was day 5; the separate synthetic time course extended to day 7 and dialysis comparison used day 5. Biological arms were triplicate; the reported sulfide abiotic controls were single reactors. Direct
    counts, gas chromatography and methylene-blue sulfide analysis were used. The strain CURIE identifies A3, independently supported by NCBI and ATCC.
