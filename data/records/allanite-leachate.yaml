- id: lu2026
  title: Lu J et al. (2026). Bio-based oxalic acid production in Issatchenkia orientalis enables sustainable rare earth recovery. Nature Communications 17:2193. DOI 10.1038/s41467-026-68957-5; original article, Figures 2-4 and Methods, especially Precipitation test, pages 7-9.
  url: https://doi.org/10.1038/s41467-026-68957-5
  accessed_on: '2026-10-12'
