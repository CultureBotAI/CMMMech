id: cmmmech:monazite-la
name: Monazite-(La)
material_kind: mineral
description: >-
  Monazite-(La) is the lanthanum-dominant anhydrous phosphate mineral
  with ideal formula La(PO4), distinct from monazite-(Ce), the monazite
  group, hydrated rhabdophane-(La), elemental lanthanum and mixed
  monazite ores. The September 2026 IMA list records renamed status
  and a 1966 special procedure, not a numbered approval accession.
  Ni et al. (1995) resolved a synthetic LaPO4 crystal in monoclinic
  P21/n monazite with nine-coordinate rare-earth sites. Their natural
  monazite comparator was Ce-dominant, not natural monazite-(La).
  Zhoujin et al. (2025) separately produced synthetic La monazite by
  abiotic microwave-assisted hydrothermal treatment. Characterization
  of synthetic analogues does not demonstrate microbial formation,
  recovery from an ore or waste, or industrial operation. Criticality
  is not inherited from the lanthanum constituent.
