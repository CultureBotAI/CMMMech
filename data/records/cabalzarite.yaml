mechanisms:
- id: abiotic_thermal_dehydration
  name: Laboratory high-temperature single-step dehydration of natural cabalzarite
  process: other
  description: Heating 3.30 mg of powdered natural cabalzarite (sample CABA14, containing
    <= 1 vol% impurities) in an open gold crucible at 10 degrees C/min under dry nitrogen
    up to 900 degrees C produced a single-step mass loss of ~6 wt% between 640 and 700 degrees
    C, matching the stoichiometric 5.87-7.30 wt% H2O content calculated from electron-microprobe
    analyses for H2O/OH groups at the O1 site.
  context: Thermogravimetric analysis in Brugger et al. (2000), p. 1309, used a Perkin Elmer
    TGS-2 thermobalance on 3.30 mg of CABA14 powder heated to 900 degrees C at 10 degrees
    C/min in dry N2. The anomalously high dehydration onset (640-700 degrees C) reflects very
    strong hydrogen bonding across the [O1-H...O1]3- configuration (O1-O1 distance 2.567-2.589
    A). Post-heating phase identification of the anhydrous residue was not reported.
  microbial: false
  evidence:
  - source_ref: brugger_2000_cabalzarite
    supports: support
    explanation: Page 1309 reports that 3.30 mg of CABA14 powder heated in an open gold crucible
      under dry N2 at 10 degrees C/min to 900 degrees C underwent a single-step ~6 wt% weight
      loss between 640 and 700 degrees C, in quantitative agreement with the 5.87-7.30 wt%
      H2O calculated from EMPA stoichiometry.
  - source_ref: brugger_2000_cabalzarite
    supports: partial
    explanation: Because the ~6 wt% TGA mass loss carries a ~10% relative uncertainty on the
      small 3.30 mg charge, the exact H2O:OH ratio at O1 was fixed by charge balance in the
      EMPA recalculation rather than by gravimetric water determination alone.
