id: cmmmech:fluor-rewitzerite
name: Fluor-rewitzerite
material_kind: mineral
description: IMA-approved monoclinic paulkerrite-group hydrated potassium-manganese-aluminium-titanium
  oxyfluorophosphate mineral (IMA 2023-115; status A, Approved; full description published
  26 June 2024; no mineral symbol is printed in the primary paper or in the September 2026
  IMA Master List, PDF p. 76) with ideal end-member formula [(H2O)K]Mn2(Al2Ti)(PO4)4(OF)(H2O)10
  * 4H2O (formula weight 935.7 in Table 3, p. 547; requiring K2O 5.04 wt%, MnO 15.16 wt%,
  Al2O3 10.90 wt%, TiO2 8.54 wt%, P2O5 30.34 wt%, F 2.03 wt%, H2O 28.86 wt%, -O = F -0.85
  wt%, printed Total 100.00 wt% in Section 4, p. 543, although the exact arithmetic sum of
  the rounded ideal percentages is 100.02 wt%; Hochleitner, Grey, Kampf, Boer, MacRae, Mumme,
  and Wilson, 2024, European Journal of Mineralogy 36:541-554). Named as the F-dominant analogue
  (X = OF) of rewitzerite ([(H2O)K]Mn2(Al2Ti)(PO4)4[O(OH)](H2O)10 * 4H2O, IMA 2023-005, Grey
  et al., 2023a) under the IMA-approved nomenclature for the paulkerrite group ABM12(M22M3)(PO4)4X2(H2O)10
  * 4H2O (Grey et al., 2023b; Section 1, pp. 541-542). Discovered in a specimen collected
  by Erich Keck in the mid-1970s from the 67 m level of the Hagendorf-Sud pegmatite mine quarry
  (49 deg 39 min 1 sec N, 12 deg 27 min 35 sec E), Oberpfalz (Upper Palatinate), northeast
  Bavaria, Germany (Section 1-2, pp. 541-542). The holotype specimen is housed in the Bavarian
  State Mineral Collection (Mineralogische Staatssammlung Munchen, SNSB), Munich, Germany,
  under registration number MSM 80824, and a cotype specimen is deposited in the mineralogical
  collections of the Natural History Museum of Los Angeles County, Los Angeles, California,
  USA, under catalogue number 76307 (Section 1, p. 542). Occurs in small corrosion vugs within
  green-grey cleavage masses of primary zwieselite that have been heavily altered and replaced
  by finely granular clean fluorapatite (~2 wt% MnO), directly associated with clusters of
  pale-yellow straw-like crystals of Al-rich strunzite (MnFe1.1Al0.9(PO4)2(OH)2(H2O)6, ~11
  wt% Al2O3), translucent orange-brown crystalline masses of Na-bearing jahnsite-(CaMnMn),
  reddish-orange prisms of Zn- and Al-bearing earlshannonite, silvery plate-like aggregates
  (~50 um across by <1 um thick) of Zn-bearing cryptomelane, hexagonal prism bundles of iangreyite,
  sphalerite, columbite, and pyrite (Section 2, p. 542). Forms clusters (up to 0.5 mm) of
  colourless transparent stubby pseudo-orthorhombic prisms up to 0.1 mm long, flattened on
  {010} and elongated along [100], displaying crystal forms {100}, {010}, {001}, {111}, and
  {-111}, and ubiquitously twinned by 2-fold rotation about c ([001]; Section 3, p. 542, and
  Figure 2, p. 543). Has a white streak, vitreous lustre, brittle tenacity, uneven fracture,
  Mohs hardness 3, measured density Dmeas = 2.42(2) g cm-3 (by flotation in methylene iodide
  + toluene), and calculated density Dcalc = 2.418 g cm-3 (from the empirical formula and
  100 K synchrotron single-crystal unit-cell volume; Abstract, p. 541, and Section 3, p. 542).
  Optically biaxial positive (+), with refractive indices measured in white light of alpha
  = 1.569(3), beta = 1.582(3), and gamma = 1.602(3) in the Abstract (p. 541) vs gamma = 1.6021(3)
  in Section 3 (p. 542), 2V(meas) = 78(1) deg (determined from extinction data using EXCALIBR,
  Gunter et al., 2004), and 2V(calc) = 78.6 deg; dispersion was not observed, the mineral
  is non-pleochroic, optical orientation is X = b, Y = c, Z = a, and the Gladstone-Dale compatibility
  index is 1 - (Kp/Kc) = 0.035 (excellent, Mandarino, 1981; Section 3, p. 542). Micro-Raman
  spectroscopy (Horiba XploRA Plus spectrometer, 532 nm diode laser, 100x/0.9 objective, 2
  um spot, 1800 gm mm-1 grating; Section 5, p. 543, and Figure 3, p. 544) shows broad O-H
  stretching bands peaking at 3390 cm-1 (H-bonded H2O molecules with O...O = 2.75-2.80 A,
  Libowitzky, 1999) and 3100 cm-1 (strongly H-bonded O15-O13 = 2.68 A), H2O bending bands
  at 1625 and 1670 cm-1, PO4 stretching bands at 1145, 1080, 1030, 995, and 958 cm-1, cyclic
  Ti-O-Ti-O chain vibrations at 827 and 723 cm-1 (with a stronger 723 cm-1 peak than in rewitzerite
  due to displacement of Ti4+ toward the bridging O/F anion X), and PO4 bending, H2O librational,
  and M-(O,H2O) modes at 635, 595, 502, 456, 385, 326, 286, 224, and 155 cm-1. Quantitative
  wavelength-dispersive electron-microprobe analyses (JEOL JXA-8530F Hyperprobe equipped with
  a liquid-N2 cold stage; 15 kV, 2.0 nA, defocused 8-10 um beam on Ir-coated polished crystals,
  STRATA-derived water matrix correction, average of n = 13 analyses on 4 crystals; Section
  4, pp. 542-543, and Table 1, p. 544) yielded mean K2O 5.78 wt% (range 5.40-6.22, SD 0.20,
  standard Adularia), MnO 11.35 wt% (9.64-12.44, SD 0.91, standard MnSiO3), MgO 0.42 wt% (0.23-0.52,
  SD 0.08, standard Spinel), Al2O3 9.27 wt% (6.20-11.14, SD 1.35, standard Berlinite), Fe2O3(total)
  7.01 wt% (4.04-9.81, SD 1.99, standard Hematite; partitioned on the basis of Fe2+ at M1
  and Fe3+ at M2+M3 into Fe2O3 3.54 wt% and FeO 3.11 wt%), TiO2 7.64 wt% (6.93-8.94, SD 0.60,
  standard Rutile), P2O5 30.28 wt% (28.42-31.61, SD 1.02, standard Berlinite), F 1.88 wt%
  (1.18-2.42, SD 0.40, standard Fluorite), stoichiometric H2Ocalc = 28.80 wt% (15 H2O per
  4 P), -O = F = -0.79 wt%, and Total = 101.28 wt%. Normalized to 9(M1 + M2 + M3 + P) cations
  per formula unit, the empirical formula is A1[(H2O)0.85K0.15]sum=1.00 A2(K1.00) M1(Mn2+1.50Mg0.09Fe2+0.41)sum=2.00
  M2+M3(Al1.70Ti4+0.89Fe3+0.42)sum=3.01(PO4)3.99 X(O1.09F0.92)sum=2.01(H2O)10 * 4.12H2O (Abstract,
  p. 541, and Section 4, p. 543). Crystallizes in the monoclinic system, space group P21/c
  (#14), Z = 4. Synchrotron single-crystal X-ray diffraction (Australian Synchrotron MX2 microfocus
  beamline, Dectris Eiger 16M detector, lambda = 0.7109 A, T = 100 K, crystal size 0.040 x
  0.050 x 0.070 mm3; Section 6.2, pp. 544-546, and Table 3, p. 547) gave unit-cell parameters
  a = 10.407(1) A, b = 20.514(2) A, c = 12.193(1) A, beta = 90.49(2) deg, V = 2603.0(4) A3,
  while room-temperature Gandolfi powder X-ray diffraction (Rigaku R-Axis Rapid II curved-imaging-plate
  microdiffractometer, monochromatised MoKalpha radiation, JADE Pro profile fitting; Section
  6.1, p. 544, and Table 2, p. 545) gave a = 10.425(18) A, b = 20.591(18) A, c = 12.285(18)
  A, beta = 90.47(10) deg, V = 2637(6) A3, Z = 4. Full-matrix least-squares refinement on
  F in JANA2006 (with 2-fold rotation twinning about c giving twin volumes 0.800(3) and 0.200(3),
  89 constraints, and 477 parameters) converged to Robs = 0.058, wRobs = 0.076 for 6186 observed
  reflections with Io > 3sigma(I) and Robs = 0.062, wRobs = 0.077 for all 6931 independent
  reflections out of 47535 collected (theta = 1.94 to 32.05 deg), with largest diff. peak
  and hole 0.99 and -1.25 (printed with a typographical unit error "e A2" instead of "e A-3"
  in Table 3, p. 547). The heteropolyhedral framework structure (Section 6.2-7, pp. 546-552,
  and Tables 4-9, pp. 548-552; note that Table 5, p. 548, reports refined site scattering
  A1 = 8.6 e and A2 = 17.0 e whereas Table 9, p. 552, transposes them as "A1, A2 = 17.1, 8.9")
  consists of (001) layers of [100] krohnkite-type chains of corner-connected PO4 tetrahedra
  and M2O4X(H2O) octahedra linked along [010] by M1O2(H2O)4 octahedra and interconnected along
  [001] via corner-sharing with M3O4X2 octahedra to form linear [001] trimers M2-M3-M2 (with
  Al3+ ordered into the two outer M2a/M2b sites and Ti4+ dominant at the central centrosymmetric
  M3a/M3b sites, resulting in pseudosymmetric monoclinic P21/c symmetry rather than orthorhombic
  Pbca). The seven strongest powder X-ray diffraction lines (Abstract, p. 541, and Table 2,
  p. 545) [dobs in A (I, hkl)] are 10.30 (90, 020), 7.43 (84, 111, -111), 6.14 (100, 002),
  5.19 (44, 200), 3.719 (54, -222, 222), 3.111 (92, 203, -203, 061), and 2.866 (55, -242,
  062, 242). No biological or microbial interaction data are reported in the type mineralogical
  description.
