mechanisms:
- id: culture_associated_mixed_carbonate_precipitation
  name: Azurite assignment in a bacterial-culture-associated mixed carbonate precipitate
  process: biomineralization
  description: Kang and colleagues assigned azurite, malachite, calcite and copper carbonate in an XRD pattern of precipitate associated with the ureolytic isolate designated Sporosarcina soli B-22. The species mapping follows the paper and its cited sequence, while the B-22 versus B7-22 strain-label discrepancy is unresolved. Ureolysis, increasing pH and carbonate precipitation provide a proposed explanation; the experiment does not demonstrate a unique enzyme pathway or exclude matched chemical precipitation. The accepted azurite observation is qualitative and belongs to a mixed solid.
  context: Bacteria were isolated from abandoned-mine soil at Imgi, Busan, Korea. Isolation BPU agar contained 3 g/L beef extract, 5 g/L peptone, 20 g/L urea, 10 g/L microagar and 100 micrograms/mL cycloheximide at pH 7, incubated at 30°C for three days. YA broth was 20 g/L yeast extract and 10 g/L ammonium sulfate, pH 7. The calcite-production protocol describes 24 h in YA followed by 72 h in BPU at 30°C and 200 rpm, then mixing 500 microlitres of bacterial suspension with 500 microlitres of 350 mM calcium chloride dihydrate solution. Figure 7 identifies its XRD material as B-22 grown in BPU, but the exact copper dose and correspondence to this generic calcite protocol are not fully specified. The microscopy/diffraction preparation placed suspension on glass and dried it at 50°C; SEM samples were water-resuspended, redried and platinum-coated. The separate YA copper-removal assay used synthetic copper salts, not a real mine-waste feed. This is a laboratory culture and processed-solid observation,
    not industrial mineral recovery.
