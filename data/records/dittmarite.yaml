id: cmmmech:dittmarite
name: Dittmarite
material_kind: mineral
description: Dittmarite is the magnesium ammonium phosphate monohydrate mineral species, (NH4)Mg(PO4)(H2O),
  grandfathered in the September 2026 IMA list with original-description year 1887. It is distinct
  from struvite, which contains six waters per formula unit, and from elemental magnesium or phosphorus.
  The studied synthetic feed was XRD-identified as dittmarite despite being called synthetic struvite
  throughout much of the paper. The same Suyamud 2020 experiment is represented under magnesium
  and glushinskite; this is not an independent study or an inherited criticality designation.
