  - id: biogenic_sulfide_ni_rich_medium
    label: Biogenic sulfide reacting with dissolved Ni(II) in Ni-rich culture medium (pH ~7.1) and subsequent sample workup
    node_type: CHEMICAL_ENTITY
    description: Dissolved sulfide produced in 100 mL anoxic lactate/sulfate medium (initial pH 7.2, final biotic bulk pH ~7.1; 500 uM nominal Ni + Fe across No Fe, 5:1, 1:1, and 1:5 arms) followed by 6-25 day harvest, enzymatic/detergent/sonication TEM preparation, shipping, and potential low-O2 oxidation during mounting or transport.
    protein_grounding_status: NOT_APPLICABLE
  - id: polydymite_assigned_minor_phase
    label: Minor irregular-particle polydymite-assigned (Ni3S4) component in mixed nickel-sulfide solids
    node_type: MATERIAL_OR_PHASE
    description: Minor irregular-particle component in Ni-rich culture (and abiotic) solids assigned to polydymite (Ni3S4) from ~3.34 A lattice fringes (Table 2, Results p. 5, Figure 4d), co-occurring with precursor particles and vaesite in No Fe culture products; subject to preparation-oxidation alternatives (Discussion pp. 7-8), violarite 220 overlap (~3.34 vs 3.35 A in Fe-bearing arms), and the unresolved annotated Figure 4c 3.38 A 100p vs main-text 220 index conflict.
    protein_grounding_status: NOT_APPLICABLE
  edges:
