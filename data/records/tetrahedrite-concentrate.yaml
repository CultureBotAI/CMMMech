id: cmmmech:tetrahedrite-concentrate
name: Tetrahedrite concentrate
material_kind: primary_resource
description: A mixed flotation concentrate enriched in source-labelled tetrahedrite, represented by the
  Strieborná vein feed from the Mária Mine in the Rožňava ore field, eastern Slovakia, studied by Kupka
  et al. (2025). This extracted geological feed is distinct from a modern tetrahedrite mineral species,
  elemental copper or antimony, and a waste stream. The source describes tetrahedrite as the principal
  sulfide, accompanied by siderite and quartz, minor pyrite, arsenopyrite and chalcopyrite, and trace
  other sulfides. Table 1 reports bulk Cu 25.59, Sb 19.68 and Ag 0.57 wt%. Its approximate phase-proportion
  prose is inconsistent with its bulk SiO2 value, so no reconciled quantitative mineral assemblage is
  assigned here. Modern tetrahedrite suffix species are distinct identities; the paper's generic phase
  label and selected microprobe analyses do not establish a species identity for this heterogeneous feed.
  No criticality designation is transferred from its constituent elements.
