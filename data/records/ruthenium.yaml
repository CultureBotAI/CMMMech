id: cmmmech:ruthenium
name: Ruthenium
material_kind: element
description: >-
  Ruthenium (Ru). This element record is distinct from the dissolved Ru(III)
  chloride feed, cell-associated oxidized ruthenium material, and Pd/Ru catalyst
  preparations in the curated laboratory study. The US 2025 list names the
  ruthenium commodity individually; this maps to the element without extending
  criticality to every ruthenium compound, mineral or waste. The evidence supports
  biomass-associated deposition, without demonstrating elemental Ru recovery,
  a microbial enzyme requirement or industrial operation.
