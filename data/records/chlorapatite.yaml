  title: 'UniProtKB reference proteome UP000000556 (Pseudomonas putida KT2440, NCBITaxon:160488): Phosphate-binding protein PstS (pstS / PP_2656, UniProtKB:Q88JJ3), Phosphate import ATP-binding protein PstB 1 (pstB1 / PP_2659, UniProtKB:Q88JJ0), and Phosphate regulon transcriptional regulatory protein PhoB (phoB / PP_5320, UniProtKB:Q88C63).'
