id: cmmmech:tin
name: Tin
material_kind: element
description: >-
  The element Sn, distinct from organotin compounds, dissolved inorganic tin,
  tin minerals, indium tin oxide and tin-bearing waste resources. The United
  States 2025 list's Tin designation is mapped to this element; it does not
  automatically designate tributyltin or contaminated sediment as critical.
  The curated microbial experiment concerns organotin ligand transformation,
  not destruction of the tin element or production of metallic tin.
