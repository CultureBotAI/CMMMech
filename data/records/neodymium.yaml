mechanisms:
  - id: chlorella_dried_biomass_sorption
    name: Nd biosorption by dried Chlorella vulgaris biomass
    process: biosorption
    microbial: true
    organisms:
      - id: NCBITaxon:3077
        label: Chlorella vulgaris
    description: >-
      Inactive algal biomass removed dissolved Nd from chemically prepared
      magnet leachate. This is biosorption, not demonstrated metabolic uptake
      or microbial dissolution of magnets. Specific binding chemistry is inferred.
    context: >-
      Laboratory batch assays used SAG 211-12, dried at 90 degrees C for 24 h.
      Magnets were roasted at 950 degrees C for 7 h then nitric-acid leached.
      At pH 5, 35 degrees C, 250 mg Nd/L and 0.5 g dry biomass/L, experimental
      uptake calculated from aqueous depletion was 157.40 mg/g; assays used
      0.2 L, 300 rpm, 90 min and duplicates.
      Taxonomy is species-level; the strain is specified here. No industrial
      Nd recovery or purified product was demonstrated.
    evidence:
      - source_ref: kucuker2017
        supports: support
        explanation: >-
          Methods and Fig. 2 support the scoped assay. The reported competing
          metals were below detection after pretreatment, limiting selectivity
          claims for untreated waste. Table 1's 188.68 mg/g is a fitted Langmuir
          capacity, not measured uptake.
      - source_ref: kucuker2017
        supports: partial
        explanation: >-
          Results discuss possible precipitation at 50 degrees C despite other
          statements about its absence. High-temperature removal is therefore
          not assigned wholly to biosorption; model fits do not establish a
          unique molecular mechanism.

