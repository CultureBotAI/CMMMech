id: cmmmech:retzian-nd
name: Retzian-(Nd)
material_kind: mineral
description: Basic manganese-neodymium arsenate mineral with current September 2026 IMA-CNMNC
  approved formula Mn2+2Nd(AsO4)(OH)4, status A, and special-procedure tag 1982 s.p. (approved
  by the IMA Commission on New Minerals and Mineral Names alongside the redefinition of retzian-(Ce);
  not a numbered IMA approval CURIE). Dunn and Sturman (1982) described the holotype specimen
  (Smithsonian NMNH 143762) and paratypes (NMNH 146086, 148342, and C4116-2) from manganiferous
  calcite-franklinite-willemite ore at the 1100-foot level of the Sterling Hill mine, Ogdensburg,
  Sussex County, New Jersey, USA, associated with rhodochrosite, sonolite, barite, chlorophoenicite,
  and allactite. Electron-microprobe analysis of the holotype (Table 4, p. 844, combining
  the 8.3 wt% H2O value measured by DTA-TGA between 230 and 570 degrees C on Mossgruvan, Sweden
  retzian-(Ce) specimen NMNH R5416 because Sterling Hill material was too scarce for direct
  gravimetric water analysis) yielded MnO 25.9, MgO 2.0, ZnO 1.8, FeO 0.4, As2O5 26.9, La2O3
  7.6, Ce2O3 7.8, Pr2O3 4.2, Nd2O3 10.9, Sm2O3 2.4, Eu2O3 0.9, Gd2O3 1.9, Y2O3 1.6, H2O 8.3,
  total 102.6 wt%, corresponding on the basis of 8 O atoms to the empirical formula (Mn1.63Mg0.22Zn0.10Fe0.03)Sigma1.98(Nd0.29La0.21Ce0.21Pr0.11Sm0.07Y0.06Gd0.05Eu0.02)Sigma1.02(AsO4)1.04(OH)3.90.
  Single-crystal Weissenberg and Gandolfi X-ray diffraction (Table 3, p. 843) confirmed orthorhombic
  space group Pban with unit-cell dimensions a = 5.690(5), b = 12.12(1), c = 4.874(3) A, Z
  = 2, and measured density 4.2(1) g/cm3 (calculated 4.45 g/cm3). Distinct from retzian-(Ce),
  retzian-(La), arsenocrandallite, and elemental neodymium, manganese, or arsenic; no criticality
  designation, microbial mechanism, or industrial recovery yield is asserted.
