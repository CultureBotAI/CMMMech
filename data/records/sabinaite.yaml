mechanisms:
- id: abiotic_thermal_decarbonation_zirconia_crystallization
  name: Laboratory two-stage thermal decarbonation of sabinaite to cubic and monoclinic ZrO2
  process: other
  description: 'Heating natural Francon quarry sabinaite at 8 degrees C/min in flowing CO2
    (6.8 mg sample) or N2 (7.3 mg sample) produced a two-stage decarbonation totaling 28.1
    wt% mass loss (theoretical 28.0 wt% CO2 for Na4Zr2TiO4(CO3)4): a sharp first stage losing
    18.8 wt% (CO2 atmosphere) or 19.3 wt% (N2 atmosphere) around the 519 degrees C endotherm
    to yield stabilized cubic ZrO2 (a = 5.05 A at 587 degrees C), followed by a second stage
    losing 9.3 wt% (CO2) or 8.8 wt% (N2) across endotherms at 660 and 780 degrees C to yield
    monoclinic ZrO2 (baddeleyite structure) with trace cubic ZrO2 and Na2ZrO3 at 998-1010
    degrees C.'
  context: Simultaneous DTA-TGA experiments in Jambor et al. (1980), pp. 27-28, heated 6.8
    mg of sabinaite in a dynamic CO2 atmosphere (to 998 degrees C) and 7.3 mg in a dynamic
    N2 atmosphere (to 1010 degrees C) at 8 degrees C/min, supplemented by an intermediate
    run quenched at 587 degrees C and room-temperature X-ray powder diffraction of the solid
    residues. Infrared absorption confirmed the absence of H2O or OH in unheated sabinaite.
  microbial: false
  evidence:
  - source_ref: jambor_1980_sabinaite
    supports: support
    explanation: Pages 27-28 report that the 6.8 mg sample in CO2 lost 18.8 wt% in the first
      stage (endotherm at 519 degrees C; quenched 587 degrees C residue identified by XRD
      as stabilized cubic ZrO2 with a = 5.05 A) and 9.3 wt% in the second stage (endotherms
      at 660 and 780 degrees C), while the 7.3 mg sample in N2 lost 19.3 wt% and 8.8 wt% across
      the same two stages, both giving 28.1 wt% total CO2 loss and a final 998-1010 degrees
      C solid product of monoclinic ZrO2 plus trace cubic ZrO2 and Na2ZrO3.
  - source_ref: mcdonald_1996_sabinaite
    supports: support
    explanation: Pages 812-814 show that the revised structural formula Na4Zr2TiO4(CO3)4 requires
      28.08 wt% CO2 (matching the 28.1 wt% gravimetric loss measured by Jambor et al. 1980)
      and has two crystallographically distinct carbonate groups (C1 and C2) in equal 1:1
      proportions, whereas the observed ~2:1 TGA step ratio (18.8-19.3 wt% vs 8.8-9.3 wt%)
      reflects kinetic intermediate phase formation rather than unequal carbonate site multiplicities.
