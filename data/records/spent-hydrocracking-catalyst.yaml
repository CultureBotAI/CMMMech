  title: Sawangchart, Meksiriporn and Sutjaritvorakul (2026). Process Optimization and Kinetics
    Study of Metals Leaching from Spent Hydrocracking Catalysts by Cell-free Medium Filtrate
    of Aspergillus aculeatus. Trends in Sciences 23(10):13063. Published 10 May 2026; DOI 10.48048/tis.2026.13063.
    Methods pp. 3-5, Tables 4-8, Figures 1-4.
