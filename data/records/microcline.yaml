id: cmmmech:microcline
name: Microcline
material_kind: mineral
description: 'Microcline is a triclinic potassium feldspar mineral with ideal formula KAlSi3O8, distinct
  from orthoclase, the potassium-feldspar family and traded feldspar. The September 2026 IMA list records
  grandfathered status. Curated field specimens differ in accessory minerals: the South Dakota material
  contains albite intergrowths with apatite inclusions, whereas the Ontario comparison was homogeneous
  and phosphorus-poor. Their behavior is not a chemically pure microcline endmember response. No criticality
  designation is inherited from feldspar commodity or constituent elements.'
