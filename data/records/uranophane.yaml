id: cmmmech:uranophane
name: Uranophane
material_kind: mineral
description: >-
  Uranophane is the calcium uranyl silicate hydrate mineral
  Ca(UO2)2(SiO3OH)2(H2O)4·H2O in the September 2026 IMA list. It is the
  historical alpha polymorph; the former beta polymorph is the distinct
  species parauranophane. CNMNC approved these names in August 2022.
  The IMA entry Rn, 2022 s.p. records a renaming by special procedure,
  not a unique approval accession. Natural Nopal I material was distinguished
  from the beta polymorph by powder diffraction in the 1993 study. Separate
  experiments on natural Shinkolobwe crystals and synthetic uranophane
  powders support abiotic laboratory dissolution and surface alteration.
  Neither the uranium constituent nor mineral occurrence establishes a
  criticality designation, microbial mechanism or industrial recovery.
