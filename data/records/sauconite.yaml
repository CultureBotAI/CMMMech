id: cmmmech:sauconite
name: Sauconite
material_kind: mineral
description: Sauconite is a Zn-rich smectite-group mineral with grandfathered status G and original-description
  year 1875 in the September 2026 IMA list, whose formula is Na0.3Zn3(Si,Al)4O10(OH)2·4H2O. The experimental
  material below is a synthetic Zn-rich trioctahedral smectite assigned to sauconite by combined diffraction
  and chemical characterization. It is distinct from generic saponite, zinc as an element, and mixed higher-temperature
  products. No constituent criticality designation is inherited.
