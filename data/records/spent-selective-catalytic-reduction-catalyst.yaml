mechanisms:
- id: thiooxidans_bioacid_arsenic_removal
  name: Extracellular bioacid leaching of arsenic before catalyst regeneration
  process: bioleaching
  description: Acidic culture supernatant produced by source-reported Acidithiobacillus thiooxidans ATCC 19377 leached arsenic from a ground spent SCR catalyst. This demonstrates treatment by a microbial lixiviant after cell and sulfur separation, not direct growing-cell attack on the catalyst. Concentrating the supernatant improved arsenic removal in the tested conditions. Subsequent vanadium/tungsten supplementation, drying and calcination formed a separate regeneration stage before laboratory NO-conversion tests. These results do not demonstrate isolated arsenic recovery or an industrial regeneration operation.
  context: 'Niu2025 Methods 1.1–1.4: the Xinjiang coal-power-plant catalyst was ground and sieved to at most 0.25 mm. A logarithmic-phase culture was inoculated at 5% vol/vol into modified mineral medium with 20 g sulfur per liter, initial pH 2.0–2.5, and grown at 32 +/- 1 degrees C and 150 rpm for 6–8 days until pH 0.8. Centrifugation at 7012 g for 10 minutes removed cells and sulfur; the supernatant was designated Ats. C-Ats was prepared by rotary evaporation from 1 liter to 500 mL, a twofold volume concentration called single concentration in the source. Leaching used 100 mL liquid in 250 mL flasks. The selected C-Ats treatment used 5% mass/volume solids, initial pH 0.6, 50 degrees C, 150 rpm and 8 h. The pH-adjustment reagent and independent verification of supernatant sterility were not specified. Liquid samples were centrifuged and filtered at 0.22 micrometers before ICP-OES. Source tables give means +/- standard deviations, n=3; leaching percentages use initial feed element inventory
    as denominator. No complete solids/liquids balance, isolated metal product, detection limit for reported zero tungsten loss or long-term reuse cycles were demonstrated.'
