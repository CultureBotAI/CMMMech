mechanisms:
  - id: mr1_selenite_reduction
    name: Non-growing MR-1 selenite reduction with conditional FccA and CymA involvement
    process: redox_transformation
    description: >-
      Washed Shewanella oneidensis MR-1 cells transformed selenite to
      selenium-associated particles, with XPS supporting elemental Se in
      the analyzed cell fraction. Gene-deletion phenotypes support FccA
      and CymA involvement under the tested conditions; they do not prove
      an exclusive pathway or direct catalysis by purified FccA.
    context: >-
      Laboratory cells grown in LB at 30 degrees C were washed twice and
      added at OD600 1.0 to 40 mL anaerobic mineral medium under nitrogen,
      with 0.5 mM selenite and 20 mM lactate at 30 degrees C. The medium
      contains HEPES/NaOH but the paper does not state a measured pH.
      Fumarate at 20 mM was added only in the separate competition assay.
      The authors report no growth and declining protein-based biomass.
      Kinetic rates refer to the initial 12 h; XPS sampled washed,
      lyophilized cells after 48 h. These are laboratory transformations,
      not demonstrated purified-product recovery or industrial deployment.
    microbial: true
    organisms:
      - id: NCBITaxon:211586
        label: Shewanella oneidensis MR-1
    evidence:
      - source_ref: li_2014
        supports: support
        explanation: >-
          Figure 2 and Results report initial selenite-depletion rates of
          0.54 +/- 0.13 micromol/h for delta-fccA and 1.35 +/- 0.05 for WT;
          the caption specifies standard errors of triplicate cultures.
          Figure 4 preserves substantial later residual reduction in
          delta-cymA. Thus reduced rates support involvement, not absolute
          necessity. No complementation or purified-FccA assay is reported.
      - source_ref: li_2014
        supports: support
        explanation: >-
          Figure 5 shows predominantly intracellular and smaller surface
          particles. EDX establishes elemental composition; the 48 h Se 3d
          XPS peak supports the Se(0) assignment. Neither proves exclusive
          periplasmic localization or a phase-pure isolated product.
          Supernatant selenite was assayed by acid/ascorbate colorimetry;
          Table 1 provides a separate digestion/ICP-AES selenium balance,
          not an isolated recovery yield.
      - source_ref: li_2014_supplement
        supports: support
        explanation: >-
          Figure S1 caption identifies autoclaved cells as the adsorption
          comparison; main Results report negligible adsorption. Figure S2
          caption and S4 describe a BSA-equivalent Micro BCA protein assay
          for biomass, rather than a viable-cell count. Supplement captions
          and methods were read; embedded graph pixels were not rendered,
          so no supplementary numeric points are transcribed.
      - source_ref: klonowska_2005
        supports: partial
        explanation: >-
          In a different LB growth context, the paper describes extracellular
          or cell-attached selenium deposits (Figure 1, 2 mM selenite) and
          reports that a cymA-deletion mutant still reduces selenite (data
          not shown). These observations limit universal localization and
          pathway claims. They are not a matched quantitative refutation of
          Li's rate defect. The older EDX assignment alone does not resolve
          selenium oxidation state.
