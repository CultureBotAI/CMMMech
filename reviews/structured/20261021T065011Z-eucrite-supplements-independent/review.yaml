limitations:
- Exact EU meteorite name/accession and Skylab versus SkyFall supplier wording remain
  unresolved; Vesta is a source attribution.
- The main-text 2.47 and supplement 2.74 Pt ratios conflict. Reproducible arithmetic
  is not a formal correction or proof of physical inventory normalization.
- Both workbook source roles are labeled ppm; dilution and normalization details,
  negative-value censoring rules and detection limits remain unverified. Blank, zero,
  Inf, NA and NL must not be treated as equivalent.
- One abiotic replicate cannot estimate control variance. The twofold criterion is
  arbitrary, not inferential statistical significance.
- No separate pellet/biomass accounting, direct causal ligand assay, authenticated
  experimental stock, isolated product or independent experimental replication was
  established.
- Notice and duplicate searches were bounded; direct NCBI requests were incomplete
  or timed out, with species scope verified from the official indexed result. Only
  Pt/Pd derived G:J summaries were independently recalculated.
notes:
- No owner, history or prior review was edited. Raw primary files and independent
  arithmetic remain in the hashed external source/review directories.
- The previous review had no findings to reconcile. This new observation documents
  improved supplementary access without rewriting its historical limitations.
- Coordinator final just-check exit was confirmed by root and its complete log independently
  read; named, strict, history and diff checks were independently executed.
