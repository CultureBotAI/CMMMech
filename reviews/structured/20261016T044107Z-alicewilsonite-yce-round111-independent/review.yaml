  support: supports
  summary: The full original pp. 144–148, Figures 1–4 and Table 1 support holotype
    CMNMC 53660, an alicewilsonite outer rim surrounding donnayite/gaidonnayite, with
    the SXRD grain selected from the rim. WDS used 20 kV, 10 nA, 20–50 micrometre
    beams and time-dependent intensity correction. The six-analysis means 8.52 wt%
    Y2O3 and 9.52 wt% Ce2O3 are not bulk mixed-crystal or recovery values. Water and
    CO2 are calculated because insufficient pure phase could be separated; IR qualitatively
    supports water. No controlled mechanism is curated. The 293 K P 1 model rounded
    R1=0.055 and inversion twin 87:13 are supported by Table 3 and CIF. Figures 5–6,
    Table 4 and CIF preserve omitted Ca, proxy Ce/Dy and unlocated hydrogen. Prose
    Sr1 Ce0.23 differs from Table 4/CIF 0.22; Rint 0.062 differs from CIF 0.0394,
    also printed beside unique reflections. Geological replacement is an interpretation,
    and qualitative room-temperature HCl effervescence has no concentration, duration
    or recovery denominator.
