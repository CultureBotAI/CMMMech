  accessed_at: '2026-10-30T17:11:30Z'
  support: supports
  summary: 'Pretreated culture filtrate from Aspergillus niger ATCC 1015 growth on struvite-bearing material
    precipitated cerium-bearing phosphate and, at higher Ce loading, oxalate phases. Microbial involvement
    denotes upstream leachate production; the cerium reaction itself was cell-free. Substrate-edge evidence
    (kang_2022, supports: partial): Kang et al. (2022) identify CePO4·H2O at 20 mM CeCl3 and phosphate
    plus Ce2(C2O4)3·10H2O at 50 mM CeCl3 by XRD/Rietveld and FTIR, but Modified Czapek-Dox medium contained
    1 g/L Na2HPO4 and a matched synthetic phosphate/oxalate or untreated-filtrate control was not reported.
    Product-edge evidence (kang_2022, supports: support): Arsenazo III colorimetry (Figure 3), powder
    XRD with Rietveld refinement (Figure 6, Table 2), and FTIR (Figure 9) confirm >99% aqueous Ce removal
    and precipitation of CePO4·H2O and Ce2(C2O4)3·10H2O.'
