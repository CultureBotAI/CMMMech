    annotation_note: 'Grounded to strain-exact Methanococcus voltae A3 (ATCC BAA-1334) reference proteome UP000007722 (NCBITaxon:456320; UniProtKB organism string: Methanococcus voltae (strain ATCC BAA-1334 / A3); locus Mvol_1128).'
    evidence:
    - source_ref: payne2021
      supports: partial
      explanation: Payne et al. (2021) tracked methane production alongside cell growth and sulfide generation by Methanococcus voltae A3 on natural specimen pyrite (Figure S3a) and accessible synthesized FeS2 (Figures 1c and 3; Table S3), without performing genetic knockouts of Mvol_1128.
  evidence:
  - source_ref: payne2021
    supports: support
    explanation: Supplementary Figure S3a shows specimen-associated cell and methane production relative to cultures without added Fe/S. Figure 4b and supplementary Figures S7-S8 show cells associated with specimen grains. For the separate synthesized material, Figure 1a,c,e shows growth, methane and sulfide production; sulfide was not detected in the single abiotic control. Supplementary Figure S1 characterizes the synthesized phase by XRD; it does not show a separate specimen XRD pattern. These observations support the stated assay-specific growth and reduction interpretation.
  - source_ref: payne2021
    supports: partial
    explanation: Figure 3 and supplementary Table S3 compare accessible versus 3.5 kDa membrane-sequestered synthesized FeS2. At day 5, accessible mineral supported cell and methane production and 10.55 +/- 0.13 micromol total sulfide, reported as mean +/- SD for three biological replicates. Sequestered, unamended and abiotic arms had sulfide below detection, not measured zero. This does not distinguish contact-dependent electron transfer from access to products or large extracellular assemblies. Acid-labile Fe(II) remained below the approximately 11 micromolar assay limit. Secondary mackinawite or pyrrhotite formation and the molecular uptake pathway were proposed, not phase-confirmed products or a closed mineral mass balance. The cell-based reduction estimate combines measurements with assumptions and is not a directly measured extraction yield. Supplementary Figure S6 also shows growth with added sulfide alone, consistent with trace iron in the medium.
  - source_ref: payne2021
    supports: context_only
    explanation: Original supplementary Data Set 1, sheet Figure 1 CH4 and Sulfide Values, labels E23 as total methane in mmol and H24 as Unamended, but H26:H32 reference the neighboring pyrite standard-deviation cells G26:G32 multiplied by 1000. H26 has an explicit formula and H27:H32 use a shared formula; cached H29 is 225.334939 mmol, inconsistent with the near-zero unamended curve in Figure 1c. This workbook block cannot independently validate the plotted control methane values and is not imported as measurements or silently repaired. The separate natural specimen Figure S3 and dialysis Table S3 are not this workbook block.
  - source_ref: payne2021
    supports: context_only
    explanation: The companion Methanosarcina barkeri arm is not pooled with A3 or assigned a strain CURIE here. The paper labels it MS but gives ATCC BAA-2329. Its printed main-medium recipe also conflicts with supplementary Table S2, including NaCl 1.0 versus 29.22 g/L and MgCl2 hexahydrate 0.4 versus 10.17 g/L. The actual strain and recipe remain unresolved. Natural specimen and synthetic endpoints, FeS controls and dialysis data are separate experiments; their numbering inconsistencies do not justify merging them or transferring assay values between substrates.
  - source_ref: atcc_baa2329
    supports: partial
    explanation: The issuing collection identifies BAA-2329 as Fusaro, while the primary paper calls the culture MS. This limits strain-level transfer of the companion result without deciding which label describes the cells actually tested. It does not invalidate the separately identified A3 arm.
