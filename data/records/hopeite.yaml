mechanisms:
- id: fungal_associated_hopeite_recrystallization
  name: Hopeite alteration and secondary precipitation associated with Aspergillus niger culture
  process: biomineralization
  microbial: true
  organisms:
  - id: NCBITaxon:5061
    label: Aspergillus niger
  description: During laboratory culture of Aspergillus niger Ch4/07, large chemically formed hopeite
    crystals showed rounded edges, while small hopeite-assigned crystals encrusted hyphae. The observations
    support culture-associated dissolution and secondary precipitation; they do not establish that fungi
    are necessary for hopeite formation or identify a specific biochemical pathway. Starting hopeite formed
    before inoculation. No isolated zinc or phosphate recovery yield is demonstrated.
  context: Sazanova2025 used 30 mL Czapek-Dox surface cultures in cultivation mattresses at 25 degrees
    C for 28 days, in triplicate, initially pH 6.0. Medium contained, in g/L, glucose 30, NaNO3 2.0, KH2PO4
    1.0, MgSO4.7H2O 0.5, KCl 0.5 and FeSO4.7H2O 0.01. ZnSO4.7H2O additions were 0, 250, 500, 1000 or 2000
    micromol/L; the strongest secondary-hopeite observation is the 2000 micromol/L arm at day 14. Hopeite
    had already precipitated after autoclaving at 121 degrees C without spores; autoclave duration and
    inoculum density/volume were not specified. Uninoculated zinc-containing syntheses and zinc-free fungal
    cultures were included. Matched killed-cell, cell-free-metabolite and pH-matched control series were
    not reported. Microscopy was performed at days 7, 14, 21 and 28; PXRD used ground mycelium with crystals
    at day 28 and selectively at earlier times. Ch4/07 was reported from damaged marble; its deposited
    sequence is not an independent authentication of the culture used here.
  evidence:
  - source_ref: sazanova2025
    supports: support
    explanation: Section 3.2.2, Figure 6 and Table 3 identify hopeite-associated hyphal encrustations
      in the A. niger 2000 micromol/L culture. Figure 6 shows large rounded parent crystals beside small
      crystals and tubular hyphal structures, with a PXRD pattern of the mycelial fragments labelled hopeite;
      SEM/EDX and comparison to calculated alpha-hopeite diffraction support the assignment. Table 3 lists
      abiogenic and biogenic hopeite at days 14 and 21, with katsarosite also present at day 21. The spatially
      separate small crystals are the evidence for secondary formation, not proof that every phosphate
      crystal is biogenic.
  - source_ref: sazanova2025
    supports: partial
    explanation: Section 3.2.1 and Figure 3 show that zinc-containing medium produces Mg-bearing hopeite
      before inoculation. Free-zinc values in Tables 1-2 are measured after this chemical precipitation,
      not after fungal removal. Zinc-free fungal cultures lacked the reported phosphate and oxalate crystals.
      Figure 4 and Table 3 concern mixed biomass/mineral preparations; no quantitative hopeite fraction,
      isolated product purity or closed Zn/P balance was measured. Reported absence of visible hopeite
      at day 28 does not establish complete conversion or extraction.
  - source_ref: sazanova2025
    supports: partial
    explanation: 'The day-14 2000 micromol/L A. niger arm is reported at pH 6.0 in Tables 1 and 3. Later
      pH statements conflict: day 28 is 2.8 in Table 1, 2.5 in Table 3, whereas Discussion 4.1 describes
      days 14 and 28 as pH 5-6. Discussion 4.2 also substitutes mmol for the Methods micromol/L concentration
      basis. No unique late endpoint pH or universal hopeite precipitation threshold is inferred.'
  - source_ref: genbank_ch407
    supports: context_only
    explanation: KF768341.1 verifies the source strain label Ch 4/07, A. niger annotation and marble provenance;
      it does not prove that the experimental inoculum was independently re-identified.
  - source_ref: ncbi_niger
    supports: context_only
    explanation: The current species node verifies the organism name and identifier without establishing
      the strain-level phenotype.
  - source_ref: genbank_op758843
    supports: context_only
    explanation: The source companion culture is called P. chrysogenum Cs/21 with accession OP758843,
      but OP758843.1 is P. granulatum isolate II47-8. Those companion assays are not assigned a verified
      P. chrysogenum or P. granulatum mechanism here. The primary A. niger evidence is treated separately.
  - source_ref: sazanova2025
    supports: partial
    explanation: The existing katsarosite owner describes another mineral product of this same experiment,
      not independent replication of the hopeite claim. A related 2023 report cited by the article may
      share strains and experiments. The paper reports no underlying assay dataset and says no new data
      were created or analyzed despite describing experiments. Laboratory surface cultures and proposed
      remediation uses do not demonstrate field or industrial deployment.
