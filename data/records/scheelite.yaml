      supports: support
      explanation: Reviewed Swiss-Prot entry UniProtKB:A4YHQ8 (SLAA_METS5, slaA / Msed_1806) in Metallosphaera sedula DSM 5348 reference proteome UP000000242 (NCBITaxon:399549) encodes S-layer protein A (GO:0030115; Pfam:PF28202).
  evidence:
  - source_ref: blazevic2019
    supports: support
    explanation: Materials and Methods (Strain, Media Composition and Cultivation Setup; Metal Analysis), the first Results subsection and Figure 3A support a higher W signal in inoculated cultures than corresponding abiotic controls, with appreciable abiotic release also present. Figure 1 supports growth and mineral attachment in the tested impure concentrate. Figure 3's plotted x-axis is in days although its caption says hours; the y-axis describes log10 soluble metals with mg/L units. No exact concentration, fold change or recovery percentage is extracted from this ambiguously labeled graph.
  - source_ref: blazevic2019
    supports: partial
    explanation: The intracellular Mn/Fe discussion explicitly states that the actual energy source and an oxidizable-substrate balance sufficient to explain growth could not be confirmed. The proposed Fe/Mn oxidation-driven mineral disruption is therefore a hypothesis; the Conclusion also allows indirect chemistry and acid dissolution. These limits prevent treating growth on the concentrate as proof of energy conservation from tungsten or pure scheelite.
  - source_ref: blazevic2019
    supports: partial
    explanation: Figures 4-7 and the tungsten-deposit discussion support W-bearing surface encrustation in processed cells, so filtrate W alone is not total mobilized W. The microscopy preparation included 30 days of oxic dehydration after 21 days of culture and focused-ion-beam preparation. The authors describe the deposits as carbide-like and call for further W-environment spectroscopy; no pure WC phase, resolved W redox route, in-vivo product stoichiometry or useful material yield is accepted here. This associated observation does not convert the bioleaching result into demonstrated recovery.
