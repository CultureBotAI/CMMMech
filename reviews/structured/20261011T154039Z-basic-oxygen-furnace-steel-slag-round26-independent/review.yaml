limitations:
- Community profiling is preliminary and no species/strain-specific causal role is
  established.
- Source loading, feed analysis, plotted masses and reported percentages are inconsistent;
  no reconciled mass balance or whole-feed recovery can be claimed.
- Reagent acid and unequal initial chemistry confound culture-versus-medium comparisons;
  independent column replication is unspecified.
- The supplement was read through original XML/text and original embedded image pixels,
  not a successfully rendered full DOCX page.
- Kinetic fits and aqueous-speciation calculations are model evidence, not uniquely
  demonstrated pathways or directly measured oxidation states.
- Resin removal and alkaline elution are separate stage metrics with incompletely
  specified denominators, errors and replication; no isolated final product is demonstrated.
- Correction and duplicate searches were bounded; the Crossmark content frame was
  inaccessible and no universal absence is claimed.
notes:
