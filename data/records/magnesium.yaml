mechanisms:
  - id: fungal_magnesium_oxalate_formation
    name: Magnesium oxalate formation during fungal mineral transformation
    process: biomineralization
    description: >-
      Aspergillus niger ATCC 1015 formed magnesium oxalate dihydrate
      (glushinskite) during growth with magnesium ammonium phosphate feeds.
    context: >-
      Laboratory malt extract agar contained 1% w/v natural struvite from
      a Veolia wastewater site in Exeter, UK, or synthetic feed identified
      by XRD as dittmarite (MgNH4PO4.H2O), despite the paper's synthetic
      struvite terminology. Colonies grew from 5-mm mycelial plugs over
      cellophane for seven days at 25 degrees C in darkness. Crystals were
      extracted from agar with hot water, washed and dried before analysis.
    microbial: true
    organisms:
      - id: NCBITaxon:380704
        label: Aspergillus niger ATCC 1015
    evidence:
      - source_ref: suyamud_2020
        supports: support
        explanation: >-
          Figures 3-5 show crystals beneath colonies, Mg/C/O by EDXA,
          and XRD patterns assigned to magnesium oxalate dihydrate in both
          feed treatments, compared with struvite and dittmarite controls.
          Figure 5 reports representative patterns from at least three
          determinations. Table 2 documents accompanying acidification.
      - source_ref: suyamud_2020
        supports: partial
        explanation: >-
          Mineral-free fungal and feed controls do not isolate oxalate's
          causal contribution from acidification with a chemistry-matched
          comparison. Phase identification establishes formation, not an
          isolated magnesium recovery yield or industrial deployment.
    protein_examples:
      - uniprot_accession: UniProtKB:G3Y4N5
        entry_name: CEXA_ASPNA
        protein_name: Citrate exporter A
        gene_symbol: cexA
        entry_status: SWISS_PROT
        target_organism:
          id: NCBITaxon:380704
          label: Aspergillus niger ATCC 1015
        interpro_ids:
          - InterPro:IPR011701
          - InterPro:IPR020846
          - InterPro:IPR036259
        pfam_ids:
          - Pfam:PF07690
        functional_role: >-
          Plasma-membrane MFS citrate exporter CexA in Aspergillus niger ATCC 1015
          that secretes intracellularly synthesized citric acid into the extracellular
          medium, contributing to medium acidification during magnesium-mineral
          transformation.
        annotation_note: >-
          Grounded to strain-matched reviewed Swiss-Prot entry UniProtKB:G3Y4N5
          (CEXA_ASPNA; locus ASPNIDRAFT_56962) for Aspergillus niger ATCC 1015
          (NCBITaxon:380704).
        evidence:
          - source_ref: suyamud_2020
            supports: partial
            explanation: >-
              Representative Aspergillus niger ATCC 1015 organic-acid exporter CexA
              for fungal acidification during magnesium ammonium phosphate
              transformation to glushinskite; Suyamud et al. (2020) did not assay
              cexA mutants or isolate citric versus oxalic acid contributions.
causal_graphs:
  - id: aspergillus_magnesium_oxalate_formation_graph
    name: Aspergillus niger ATCC 1015 organic-acid-mediated magnesium biomineralization as glushinskite
    description: >-
      Causal pathway linking Aspergillus niger ATCC 1015 organic-acid secretion
      (represented by citrate exporter CexA alongside oxalic acid production) to
      agar acidification, magnesium mobilization from struvite/dittmarite feeds,
      and magnesium oxalate dihydrate (glushinskite) biomineralization.
    scope: REPRESENTATIVE_EXAMPLE
    mechanism_ref: fungal_magnesium_oxalate_formation
    nodes:
      - id: cexa_citrate_exporter
        label: CexA plasma-membrane citrate exporter (cexA)
        node_type: GENE_OR_PROTEIN
        gene_symbol: cexA
        description: >-
          Major facilitator superfamily transporter exporting citric acid across
          the Aspergillus niger ATCC 1015 plasma membrane.
        protein_grounding_status: GROUNDED
        protein_examples:
          - uniprot_accession: UniProtKB:G3Y4N5
            entry_name: CEXA_ASPNA
            protein_name: Citrate exporter A
            gene_symbol: cexA
            entry_status: SWISS_PROT
            target_organism:
              id: NCBITaxon:380704
              label: Aspergillus niger ATCC 1015
            interpro_ids:
              - InterPro:IPR011701
              - InterPro:IPR020846
              - InterPro:IPR036259
            pfam_ids:
              - Pfam:PF07690
            functional_role: >-
              Plasma-membrane MFS citrate exporter CexA in Aspergillus niger ATCC 1015
              that secretes intracellularly synthesized citric acid into the extracellular
              medium, contributing to medium acidification during magnesium-mineral
              transformation.
            annotation_note: >-
              Grounded to strain-matched reviewed Swiss-Prot entry UniProtKB:G3Y4N5
              (CEXA_ASPNA; locus ASPNIDRAFT_56962) for Aspergillus niger ATCC 1015
              (NCBITaxon:380704).
            evidence:
              - source_ref: suyamud_2020
                supports: partial
                explanation: >-
                  Representative Aspergillus niger ATCC 1015 organic-acid exporter CexA
                  for fungal acidification during magnesium ammonium phosphate
                  transformation to glushinskite; Suyamud et al. (2020) did not assay
                  cexA mutants or isolate citric versus oxalic acid contributions.
      - id: secreted_fungal_organic_acids
        label: Secreted fungal organic acids and protons (agar acidification and oxalate supply)
        node_type: CHEMICAL_ENTITY
        description: >-
          Extracellular organic acids (oxalate, citrate) and protons secreted by
          growing Aspergillus niger ATCC 1015 colonies.
        protein_grounding_status: NOT_APPLICABLE
      - id: mg_ammonium_phosphate_feeds
        label: Magnesium ammonium phosphate feeds (1% w/v natural struvite or synthetic dittmarite)
        node_type: MATERIAL_OR_PHASE
        description: >-
          Natural struvite or XRD-identified synthetic dittmarite (MgNH4PO4·H2O)
          in malt extract agar.
        protein_grounding_status: NOT_APPLICABLE
      - id: magnesium_oxalate_dihydrate_crystals
        label: Magnesium oxalate dihydrate (glushinskite, Mg(C2O4)(H2O)2) crystals
        node_type: MATERIAL_OR_PHASE
        description: >-
          Crystalline magnesium oxalate dihydrate formed beneath colonies after
          7 days of fungal growth.
        protein_grounding_status: NOT_APPLICABLE
    edges:
      - source: cexa_citrate_exporter
        target: secreted_fungal_organic_acids
        predicate: transports
        relationship: efflux of citric acid contributing to extracellular acidification
        description: CexA exports citrate into the agar medium alongside fungal oxalic acid secretion.
        evidence:
          - source_ref: suyamud_2020
            supports: partial
            explanation: >-
              Table 2 in Suyamud et al. (2020) documents agar acidification during
              Aspergillus niger ATCC 1015 growth on struvite and dittmarite plates.
      - source: secreted_fungal_organic_acids
        target: mg_ammonium_phosphate_feeds
        predicate: acts_on
        relationship: acidolysis and magnesium mobilization from phosphate mineral feeds
        description: >-
          Fungal acidification and secreted oxalate dissolve magnesium ammonium
