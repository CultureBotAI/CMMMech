mechanisms:
- id: bsubtilis_acidic_mixture_biosorption
  name: Lutetium biosorption by washed Bacillus subtilis biomass in an acidic mixed-REE solution
  process: biosorption
  microbial: true
  organisms:
  - id: NCBITaxon:1423
    label: Bacillus subtilis
  description: >-
    Washed, non-autoclaved B. subtilis ATCC 7003 biomass lowered the lutetium
    concentration of a synthetic eight-REE solution relative to simultaneous
    no-biomass controls. The eight-element arm in supplementary Table S1 reports
    74% relative lutetium biosorption at both two and four hours. This percentage
    uses the contemporaneous control concentration as its denominator, not an
    isolated-product recovery or a fraction proven to be intracellular.
  context: >-
    Table 1 identifies ATCC 7003, grown in FP medium at 30 degrees C and 120 rpm
    for two to four days. Section 2.2 reports harvested biomass washed twice in
    acidified water, then exposed at room temperature and pH 2.5 (HCl) to chloride
    salts of La, Ce, Nd, Gd, Dy, Er, Yb and Lu, each initially 15 micromol/L, with
    5 g dry biomass/L. Samples were centrifuged and filtered through 0.2-micrometre
    nylon before ICP-MS. Assays and no-biomass controls were duplicated; independent
    culture derivation is unspecified. Control-relative depletion corrects for
    losses present without biomass, but cannot distinguish cell-surface adsorption,
    intracellular uptake and cell-associated precipitation. The authors call the
    untreated biomass living; viability during the acidic assay was not established
    here. The separate 4 g/L live-versus-autoclaved comparison is not the Table S1
    condition. No Lu-specific desorption, purified product or industrial operation
    is demonstrated by this accepted arm.
  evidence:
  - source_ref: breuker_2020_supp
    supports: support
    explanation: >-
      Table S1, experiment 2, Lu column, reports means of two parallel assays of
      74% at two and four hours. Experiment 1 and Figure S1 contain La, Nd, Dy and
      Yb, without Lu; their biomass-loading and time patterns are not lutetium
      measurements. The percentage is calculated by the main paper's Section 2.2
      formula (control minus sample)/control.
  - source_ref: breuker_2020
    supports: support
    explanation: >-
      Methods 2.1–2.2, Table 1 and Figure 2a locate the ATCC 7003
      preparation and the Lu-specific bar for the eight-REE, 5 g/L, two-hour assay.
      The pattern shows greater fractional depletion for Lu than the lighter
      members of this mixture, without establishing universal selectivity across
      different feeds or proving a particular binding ligand.
  - source_ref: breuker_2020
    supports: partial
    explanation: >-
      Figure 1 shows lower relative Lu biosorption at higher REE loading, while
      Figure 7 shows lower Lu depletion with autoclaved than untreated biomass
      under its separate 4 g/L conditions. Autoclaving changes cell integrity and
      does not by itself prove metabolically driven uptake. Section 3.1 explicitly
      leaves the dominant acidic-pH binding chemistry unresolved. Figure 4's
      separate Fe/Zr competition assay has different Lu percentages from Figure 2;
      its similar paired outcomes do not establish that all competing ions are
      harmless. The wastewater application concerns gadolinium, not lutetium.
