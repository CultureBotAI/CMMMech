limitations:
- Source-assigned minority peaks/shoulders are not quantitative phase purity or an
  isolated product yield.
- Different harvest durations confound the static/shaken comparison; target-specific
  biological causality remains unresolved.
- Water washing and drying may affect unstable hydrate phases; actual phase change
  in these samples was not measured.
- Only claim-bearing sections of the 198-page thesis were reviewed; the inaccessible
  1994 journal article was not treated as inspected evidence.
- Frazier abstract/body hydrolysis-product wording conflicts; specific body observations
  are retained without a generalized balanced reaction.
notes:
