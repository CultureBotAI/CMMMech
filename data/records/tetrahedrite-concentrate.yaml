      Sulfur-Oxidizing Bacteria. Journal of Sustainable Metallurgy 11:3685-3699.
      DOI 10.1007/s40831-025-01089-0. Complete 15-page original article,
      Figures 1-8, Tables 1-2 and seven-page supplement with Figures S1-S12.
    url: https://doi.org/10.1007/s40831-025-01089-0
    accessed_on: '2026-10-12'
  - id: ima_2026_09
