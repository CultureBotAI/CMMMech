id: cmmmech:molybdenum
name: Molybdenum
material_kind: element
description: >-
  The element Mo, distinct from molybdate ions, experimental sodium molybdate,
  molybdenum-blue products, molybdenite and other Mo-bearing resources. The
  Canadian designation is the named molybdenum material in its 2024 list;
  it does not assign criticality to every compound or ore. A laboratory
  DRY1 culture study supports molybdenum-blue formation consistent with
  molybdate transformation, without an isolated-metal recovery yield or a
  chemically resolved product phase.
