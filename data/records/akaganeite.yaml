    description: By analogy to established Geobacter sulfurreducens PCA EET physiology, ImcH is represented as a candidate inner-membrane quinone oxidoreductase routing respiratory electrons from the menaquinone pool toward periplasmic and outer-membrane electron carriers; Cutting et al. (2009) did not test imcH mutants.
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: Cutting et al. (2009) demonstrated microbial Fe(III) reduction of akaganeite by wild-type Geobacter sulfurreducens in the presence of 10 microM AQDS but did not perform genetic or biochemical characterization of ImcH (GSU3259).
  - source: imch_cytochrome
    target: synthetic_akaganeite_substrate
