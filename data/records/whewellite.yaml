    Kalashnikov, Andrey O.; Vlasov, Dmitry Yu.; Polyanskaya, Evgeniya I. (2019). Calcium Oxalates in Lichens
    on Surface of Apatite-Nepheline Ore (Kola Peninsula, Russia). Minerals 9(11):656. DOI 10.3390/min9110656.
    Complete 13-page original inspected, including Figures 1-7 and Tables 1-2; PDF metadata dated 20 November
    2019 agrees with the publisher updated-version entry.
  url: https://doi.org/10.3390/min9110656
  accessed_on: '2026-10-14'
- id: ncbi_niger
  title: NCBI Taxonomy 5061. Aspergillus niger, species. Official taxonomy XML checked on 14 October 2026;
    species identity does not authenticate a strain.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=5061
  accessed_on: '2026-10-14'
- id: genbank_ch407
  title: NCBI GenBank KF768341.1. Aspergillus niger strain Ch 4/07 ribosomal/ITS sequence, isolation source
    grecian marble. Official sequence XML checked; accession labels a sequence, not a mineral or full
    genome.
  url: https://www.ncbi.nlm.nih.gov/nuccore/KF768341.1
  accessed_on: '2026-10-14'
mechanisms:
- id: ch407_culture_associated_whewellite
  name: Culture-associated whewellite on fluorapatite-rich rock
  process: biomineralization
  description: Growing A. niger cultures were associated with whewellite crystallization on mixed apatite-nepheline
    rock. Diffraction and microscopy support a calcium-oxalate product; fungal acid secretion and host
    dissolution are proposed explanations rather than independently isolated causal steps.
  context: Section 2.2 used source-named Aspergillus niger Ch4/07, isolated from damaged Proconesos marble
    at Chersonesos and identified using ITS sequence KF768341. The official record is KF768341.1, strain
    Ch 4/07; this correspondence is not independent authentication of the experimental stock. Conidia
    from a 10-day solid culture inoculated approximately 5 by 5 mm biofilm-free fragments of fluorapatite-rich
    apatite-nepheline rock from the sample-1 dump block, covered by 15 mL liquid Capek-Dox medium in Petri
    dishes. Experiments ran in triplicate at 20-25 degrees C for 2-15 days. The reported medium contains,
    in g/L, NaNO3 2.0, KH2PO4 1.0, MgSO4·7H2O 0.5, KCl 0.5, FeSO4·7H2O 0.01 and glucose 30.0. Initial
    pH 5.5 fell to 4.0 at day 5 and rose to 4.5 by the endpoint. Inoculum density, mineral mass, sterilization
    protocol and handling-dependent water content of harvested solids are not specified. No experiment
    used the sample-2 rock.
  microbial: true
  organisms:
  - id: NCBITaxon:5061
    label: Aspergillus niger
  evidence:
  - source_ref: frank_kamenetskaya_2019
    supports: support
    explanation: Sections 2.2 and 3.4 report whewellite in all three culture replicates. Figure 3 trace
      3 identifies whewellite in the day-5 culture product alongside retained substrate peaks; Figure
      7 shows day-5 and day-12 surface products. The record concerns the identified calcium-oxalate component
      of a mixed sample, not a phase-pure isolated product or a measured conversion yield.
  - source_ref: frank_kamenetskaya_2019
    supports: partial
    explanation: The paper supplies no matched uninoculated incubation outcome, killed-biomass arm or
      measured organic-acid series for this rock experiment. Biofilm-free starting rock is not such a
      control. Dissolution textures and pH change are compatible with fungal acid action but do not isolate
      the acid species, establish a molecular pathway or partition calcium sources. Figure 3 is a displayed
      pattern, not a replicate-level quantitative refinement; the record does not infer identical rates
      or phase fractions across the three replicates.
  - source_ref: frank_kamenetskaya_2019
    supports: partial
    explanation: Sections 3.4 and 4 report only whewellite in the experimental oxalate products, unlike
      whewellite plus weddellite in field material. The cited marble experiments are separate studies,
      not matched substrate controls in this experiment. Differences in community, solution chemistry
      and handling prevent attributing the phase contrast solely to microbial community composition or
      substrate solubility.
  - source_ref: weddellite_handbook
    supports: context_only
    explanation: The Handbook notes that weddellite can dehydrate to whewellite on atmospheric exposure.
      The 2019 study gives no in situ hydration monitoring or quantified storage/dehydration control,
      so original formation proportions and possible post-collection transformation remain unresolved;
      dehydration is not asserted to have occurred in these samples.
  - source_ref: genbank_ch407
    supports: context_only
    explanation: The deposited ITS/ribosomal sequence is assigned to A. niger strain Ch 4/07 and agrees
      with the paper accession. It supports strain-name provenance, not an independently measured formation
      phenotype.
  - source_ref: ncbi_niger
    supports: context_only
    explanation: NCBI 5061 resolves to Aspergillus niger at species rank; the identifier is not specific
      to Ch4/07.
  protein_examples:
  - uniprot_accession: UniProtKB:A0A254TZW7
    entry_name: CEXA_ASPNG
    protein_name: Citrate exporter A
    gene_symbol: cexA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:5061
      label: Aspergillus niger
    interpro_ids:
    - InterPro:IPR011701
    - InterPro:IPR020846
    - InterPro:IPR036259
    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA that secretes intracellularly synthesized
      citric acid into the extracellular medium, driving organic-acid acidification and metal chelation.
    annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:A0A254TZW7 (CEXA_ASPNG) for Aspergillus
      niger (NCBITaxon:5061).
    evidence:
    - source_ref: frank_kamenetskaya_2019
      supports: support
      explanation: Secretes citric acid into the culture medium, contributing to organic-acid acidification
        and ligand-assisted transformation of Fluorapatite-rich phosphate rock into Whewellite (CaC2O4·H2O)
        and weddellite calcium oxalate crystals.
- id: lichen_associated_whewellite
  name: Whewellite associated with natural lichen biofilms
  process: biomineralization
  description: Whewellite was assigned with weddellite in natural lichen-associated material on fluorapatite-rich
    ore surfaces. The accepted observation is mineral occurrence and spatial association; the study does
    not identify which organism supplied oxalate or establish microbial necessity.
  context: The 2018 field collection sampled biofilms on apatite-nepheline ore blocks from Khibiny massif
    dumps (sample 1) and the Kola Science Centre Rock Garden (sample 2). Thin sections and XRD identified
    mainly fluorapatite and nepheline with minor aegirine, titanite and titanomagnetite, rather than a
    pure mineral substrate. The authors associated calcium oxalates with fluorapatite-rich areas in thalli
    identified morphologically as Farnoldia jurana in sample 1 and Lecanora polytropa and Polysporina
    simplex in sample 2. These are mixed natural biofilms, not isolated-strain formation experiments;
    co-occurring micromycetes were also identified. Local crystallization pH, temperature, duration and
    metabolic state during formation were not measured. The separately cultivated A. niger strain is not
    assigned to those field specimens.
  microbial: true
  evidence:
  - source_ref: frank_kamenetskaya_2019
    supports: partial
    explanation: Sections 2.1, 2.3-2.5 and 3.1-3.3, Table 2 and Figures 1-6 support source-assigned mixed
      whewellite/weddellite associated with lichen thalli. Figure 3 trace 2 explicitly represents Farnoldia
      jurana material; separate diffraction patterns for each of the other named lichens are not displayed.
      Figure 6 shows crystal-hypha association and source-assigned morphologies. The stated close proportions
      are not a quantitative phase refinement or a recovered-mass fraction.
  - source_ref: frank_kamenetskaya_2019
    supports: partial
    explanation: The field association does not isolate a causal organism, demonstrate oxalate secretion
      by each lichen mycobiont, or trace calcium from a particular host phase. Discussion hypotheses about
      organic acids, Sr/Al impurities, citrate and community-dependent stabilization were not tested by
      matched community manipulations or dissolved-metabolite measurements in this study. Carbon-coated
      EDX spectra establish elemental context, not independently a crystal hydrate, valence or lattice-site
      substitution. No sterile field comparator, phase-specific extraction yield or industrial process
      is demonstrated.
  - source_ref: weddellite_handbook
    supports: context_only
    explanation: Potential atmospheric dehydration of weddellite is a handling limitation. The field samples
      were not followed in situ from nucleation through collection, so no original phase ratio or compulsory
      transformation sequence is inferred.
