mechanisms:
- id: abiotic-pentlandite-replacement
  name: Abiotic hydrothermal replacement of pentlandite by a violarite-assigned phase
  process: redox_transformation
  microbial: false
  description: Controlled acidic hydrothermal treatment generated an XRD-assigned violarite component
    while pentlandite declined in mixed natural and synthetic feeds. Ex situ textures support a coupled
    dissolution–reprecipitation interpretation. These are laboratory chemical transformations, not microbial
    synthesis, a proven pure endmember or a closed nickel recovery process.
  context: 'Tenailleau et al. (2006), p.707: one water-bath series used 1.0 g Mount Keith concentrate
    in 100 mL acetate-buffered solution at 80 degrees C and pH 3–5, approximately 0.2 molal total acetate.
    The concentrate was reported as 90 wt% pentlandite and 9 wt% pyrite with minor hydrotalcite/serpentine
    minerals and magnetite, below 0.1 mm. The design describes duplicate experiments at each pH, with
    Ar in one set and less than 0.05% H2S mixed into Ar in another; some reactions received 1 mL of 0.1
    M ferric hydroxyacetate. Figure 1 compares two ferric-acetate arms at pH 3.4 differing in H2S addition.
    A separate hydrothermal series used 1–5 g synthetic pentlandite–pyrrhotite aggregates, approximately
    1–2 mm, containing 39 wt% pentlandite and 61 wt% pyrrhotite. This feed was prepared by exsolution
    at 150 degrees C for 672 hours with natural pyrrhotite buffering. The cell operated at 120 degrees
    C and reported pressure 3.5 bar, with acetate solution circulated around the cell, daily solution
    replacement and sampling. Methods specify pH 4.0 while Figure 2 gives approximately 3.9. Removed samples
    dried on blotting paper at room temperature for 2–3 days before powder XRD/Rietveld analysis, with
    BSE imaging and EDS of polished products. No organism, biomass or inoculum was used.'
  evidence:
  - source_ref: tenailleau2006
    supports: support
    explanation: Figures 1–2 show declining pentlandite and increasing violarite-assigned phase fractions
      under the stated distinct conditions. Figure 3 shows progressive replacement of pentlandite lamellae,
      porous products and a narrow gap at the reaction front. These observations support the source's
      phase-assignment and replacement interpretation; the composition range called violarite is explicitly
      broader than the ideal mineral formula.
  - source_ref: tenailleau2006
    supports: partial
    explanation: Results call the coarse hydrothermal experiments batch mode despite the flow-through
      apparatus description, and explicitly state that phase fractions are only semiquantitative because
      no independent phase standard was used. The abstract describes complete transformation after three
      days, but Figure 2 retains a nonzero refined pentlandite component and variable product fractions.
      Reported 80-degree conversion percentages are not adopted as closed nickel or whole-feed yields.
      Mixed feed, sampling, fluid replacement and secondary pyrite/marcasite formation prevent a simple
      one-phase mass balance.
  - source_ref: tenailleau2006
    supports: partial
    explanation: Discussion p.708 states that EBSD did not establish the crystallographic relationship
      because the transformed violarite and surrounding pyrrhotite did not yield patterns; the abstract's
      broader characterization statement does not override that limitation. The authors also allow the
      apparent 200–400 nm reaction-front gap to have expanded during drying. Dissolution–reprecipitation
      is a supported textural interpretation, not directly observed in situ interfacial chemistry or proof
      of a unique microscopic pathway.
  - source_ref: tenailleau2006
    supports: context_only
    explanation: Figure 4 is a thermodynamic calculation that excludes competing vaesite and polydymite;
      it is not a measured phase-boundary map or a comprehensive equilibrium test. The proposed 5–10 year
      natural transformation at 20 degrees C is an extrapolation, not an observed field time course. Potential
      flotation/smelting implications are motivation, not industrial deployment, isolated recovery or
      evidence for microbial necessity.
