id: cmmmech:lucasite-ce
name: Lucasite-(Ce)
material_kind: mineral
description: >-
  Lucasite-(Ce) (IMA 1986-020) is an IMA-accepted cerium-titanium oxide-hydroxide
  mineral with IMA September 2026 Master List formula CeTi2O5(OH) and
  crystal-chemical formula CeTi2(O,OH)6 (empirical formula
  Ce0.51La0.27Nd0.11Pr0.11Ti2(O,OH)6). Described by Nickel, Grey, and Madsen
  (1987) from heavy-mineral concentrates of the Argyle AK1 diamondiferous
  olivine lamproite tuff, East Kimberley region, Western Australia, Australia.
  Monoclinic (space group I2/a, equivalent to standard C2/c; refined to R =
  0.054 for 977 independent reflections), with a = 5.178(1) Å, b = 8.756(4) Å,
  c = 9.768(5) Å, beta = 93.52(4)°, Z = 4, Dcalc = 5.00 g/cm3, Vickers
  microhardness VHN10 = 761–900 kg/mm2 (mean 824 kg/mm2), {001} cleavage, and
  refractive indices n > 2.0 (Gladstone-Dale calculated mean n = 2.321).
