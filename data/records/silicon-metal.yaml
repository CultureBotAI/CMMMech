id: cmmmech:silicon-metal
name: Silicon metal
material_kind: commodity
description: >-
  Silicon supplied in metallic commercial form as a raw-material commodity,
  including metallurgical material that can undergo further purification for
  semiconductor and solar applications. USGS distinguishes silicon metal from
  ferrosilicon and describes silica as its source material. This record is
  distinct from the silicon element, quartz or other silica phases, silicate
  minerals, ferrosilicon alloys and silicones. Grade-specific trade categories
  are not treated as a universal purity definition. The designations preserve
  the silicon-metal scope in the original EU 2024 lists. Diatom silicification
  and microbial removal of impurities from quartz do not establish production
  or recovery of silicon metal; no microbial mechanism is asserted here.
