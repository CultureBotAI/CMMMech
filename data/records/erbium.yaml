mechanisms:
- id: cyanobacterial_erbium_association
  name: Erbium association with harvested cyanobacterial biomass
  process: other
  microbial: true
  organisms:
  - id: NCBITaxon:118562
    label: Limnospira platensis
  description: >-
    Cultures reported as Arthrospira platensis CNMN-CB-02 yielded harvested dried fractions
    containing Er after growth in synthetic Er(III)-supplemented medium. Increasing nominal
    exposure was associated with increasing element concentration in this fraction. Total-element
    analysis does not distinguish intracellular bioaccumulation from surface association or
    nonbiological material retained with the biomass.
  context: >-
    The study reports Arthrospira platensis CNMN-CB-02 from the Institute of Microbiology
    and Biotechnology, Technical University of Moldova. The official collection lists CB-02
    as Spirulina platensis. NCBI maps both species names to Limnospira platensis; the species
    identifier does not verify a strain genome or a strain-specific NCBI node. Living cultures
    were exposed to Er(III), supplied as Er(NO3)3·6H2O, in separate single-element treatment
    series at 10, 20 and 30 mg/L elemental concentration. These are not mixed-REE selectivity
    assays. Supplementation occurred on day 1 with 0.4 g/L inoculum, followed by five more
    days of cultivation. Flasks held 500 mL of nutrient medium, including 8 g/L bicarbonate
    and 0.08 g/L EDTA, at pH 10.0 and 30 degrees C. Illumination was reported as 55 µM photons/m2/s;
    the paper uses this nonstandard printed unit, retained without silently converting it.
    Cultures were shaken at 100 rpm for 45 min twice daily, 12 h apart. Controls were cultures
    grown without added REEs. Experiments were reported in triplicate, with Student t-tests
    against controls. Biomass was retained on 5-8 µm filters and part was dried for instrumental
    neutron activation analysis (NAA); reference materials supported analytical quality control.
    The methods do not describe a post-filtration wash, a biomass-free exposure control or
    cell-surface versus intracellular fractionation. NAA measures total element in the harvested
    dried fraction, not free-ion speciation or aqueous depletion. Initial solution concentrations
    were checked by ICP-OES, but no final dissolved-element balance is reported for this experiment.
    No desorption, isolated product or industrial demonstration was tested.
  evidence:
  - source_ref: zinicovscaia2024
    supports: support
    explanation: >-
      Sections 2.1-2.3 and Section 3/Figure 1 report Er in the dried biomass fraction increasing
      with the nominal Er concentration; the text gives 5470-21,400 mg Er/kg of that fraction.
      This is a source-reported concentration range, not an isolated-product yield. Figures
      2-4 and the results describe lower biomass quantities and phycobiliproteins, with increased
      MDA, under these particular Er exposure conditions.
  - source_ref: zinicovscaia2024
    supports: partial
    explanation: >-
      The harvested-fraction result supports biomass-associated Er accumulation only. Without
      a reported wash, abiotic exposure control, aqueous mass balance or localization assay,
      surface binding, intracellular uptake, retained medium and co-retained precipitate are
      not separated. Alkaline bicarbonate-containing medium further makes unmeasured chemical
      partitioning relevant; precipitation is a possible alternative, not a demonstrated phase.
      The record therefore uses process other rather than asserting biosorption, biomineralization
      or metabolic transport as a resolved cause.
  - source_ref: zinicovscaia2024
    supports: partial
    explanation: >-
      The 2024 text reports a 21.3% biomass decline at 30 mg/L, but the corresponding Figure
      2 bar heights do not clearly reproduce that percentage against their plotted control.
      Only the direction of inhibition is retained here; neither exact percentage nor a general
      toxicity threshold is inferred.
  - source_ref: yushin2022
    supports: partial
    explanation: >-
      The earlier study of the same named strain reports no statistically significant biomass-quantity
      change at 10-30 mg/L Er (Section 3.4 and Figure 6), unlike the 2024 growth result. Its
      living-culture protocol used erbium sulfate, six days at 25-28 degrees C and pH 8-9
      with lower reported illumination (Section 2.5), so these are different conditions, not
      direct replications. Its control concentration is printed in mg/L in the prose while
      Figure 6 uses g/L, preventing unqualified reuse of that number. Section 3.2 also explicitly
      avoided pH above 6 in the separate dried-biomass sorption experiments because of Er(OH)3
      formation; this reinforces the need to resolve chemical partitioning in alkaline living
      cultures without proving the same phase formed in the 2024 experiment.
