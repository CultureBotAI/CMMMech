id: cmmmech:lansfordite
name: Lansfordite
material_kind: mineral
description: Lansfordite is the hydrated magnesium carbonate mineral Mg(CO3)(H2O)5, conventionally MgCO3·5H2O,
  listed as grandfathered with original-description year 1888 in the September 2026 IMA-CNMNC list. The
  year is not an approval identifier. It is distinct from nesquehonite, other magnesium carbonates, magnesium
  metal and mixed mineral resources. Evidence below separates abiotic laboratory synthesis/dehydration
  from one natural occurrence associated with cactus decay; no constituent criticality, identified microbial
  producer or industrial recovery is inferred.
sources:
- id: ima_2026_09
  title: 'IMA-CNMNC. The New IMA List of Minerals, September 2026. Definitions pages 1-2 and Lansfordite
    row PDF page 121: Mg(CO3)(H2O)5, G, 1888. Previously acquired official original re-inspected 14 October
    2026.'
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: handbook_lansfordite
  title: Handbook of Mineralogy, Lansfordite, version 1, 2001-2005. Formula, monoclinic mineral identity
