id: cmmmech:behoite
name: Behoite
material_kind: mineral
description: >-
  Behoite (IMA 1969-031) is an IMA-accepted beryllium hydroxide mineral, the
  natural orthorhombic beta-Be(OH)2 polymorph, with IMA September 2026 Master
  List formula Be(OH)2. Described by Ehlmann and Mitchell (1970) from the Rode
  Ranch rare-earth pegmatite, Llano County, Texas, USA (and also recognized in
  hydrated Vitro-tuff at Honeycomb Hills, Juab County, Utah, USA), where it
  occurs as colorless, pseudo-octahedral crystals ({011} dome with {110} prism
  faces) in white to tan powdery alteration rinds replacing brown gadolinite in
  association with tengerite, bastnaesite, albite, and quartz. Semiquantitative
  spectrographic analysis by A. S. McCreath and Son (Table 1, p. 4) shows Be as
  the major cation with Si (1–10%), Fe (0.3–3%), and minor/trace elements. The
  authors observed minor clay impurities and did not establish silicon or iron
  as essential behoite constituents. Orthorhombic (space group P212121), with a
  = 4.64(2) Å, b = 7.05(2) Å, c = 4.55(3) Å, Z = 4, measured natural specific
  gravity SGmeas = 1.92 ± 0.01 (cited synthetic measured density 1.924), Mohs
  hardness ~4, and biaxial (–) optics with alpha = 1.533(3), beta = 1.544(3),
  gamma = 1.548(3), and 2V = 82°.
