  - source_ref: karnachuk2021
    supports: partial
    explanation: Later bioreactor patterns and the displayed batch patterns do not carry the same kornelite labels; absence of a label is not a quantified disappearance or a detection-limit-based absence. Section 3.2 calls the pH-6.5 bioreactor phases unpronounced, while supplementary Figure S2A assigns small peaks. Phase identity and timing therefore remain qualified. No matched sterile or killed-cell arm separates biological effects from solution chemistry or sample-workup oxidation/precipitation. Fe/S maps in Figure 4/S1 identify elements, not kornelite or Fe(III).
