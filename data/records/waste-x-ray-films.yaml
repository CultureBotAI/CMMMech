id: cmmmech:waste-x-ray-films
name: Waste X-ray films
material_kind: secondary_resource
description: Used silver-bearing radiographic films obtained from medical facilities, comprising a gelatin-silver emulsion on a polymer base. The curated feeds are discarded X-ray films, not unused film stock, photographic processing liquids, elemental silver or all photographic wastes. Laboratory studies distinguish microbial-enzyme stripping of the emulsion from subsequent thermal production of silver metal. No constituent criticality designation or industrial deployment is inherited.
sources:
- id: shankar2010
