id: cmmmech:metavivianite
name: Metavivianite
material_kind: mineral
description: Metavivianite is the approved mixed-valence iron phosphate mineral species Fe2+Fe3+2(PO4)2(OH)2(H2O)6,
  IMA 1973-049. It is distinct from vivianite, elemental iron or phosphorus, and an unidentified oxidized
  iron-phosphate mixture. Laboratory abiotic precipitation provides diffraction-supported formation in
  a mixed product. A separate bacterial enrichment study proposed a metavivianite-like intermediate without
  diffraction confirmation; that observation is retained as provisional and does not establish formation
  of the accepted mineral species. No constituent criticality designation or industrial recovery claim
  is inherited.
