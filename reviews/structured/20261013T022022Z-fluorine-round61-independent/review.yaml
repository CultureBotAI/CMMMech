limitations:
- No accessioned fungal stock mapping or modern species authentication; the F. solani/F.
  culmorum source label conflict remains unresolved.
- The general 100 mg/cm3 CaF2 dose conflicts with Table 2 no-growth results at 5%
  and 10%. The carbon concentrations of 0.3% and 0.1%, and malt extract at 1 g/L,
  prevent assigning one universal protocol or normalized yield.
- Control-subtracted electrode endpoints establish net aqueous mobilization. Missing
  matched-pH, metabolite-only, killed-cell, solid-phase and mass-balance evidence
  prevents identification of a unique chemical cause or recovered-product yield.
- The soil CaF2 null limits environmental transfer; water-extractable fluoride is
  not a direct microscopic dissolution measurement. The separate cryolite response
  is not a CaF2 result.
- Existing identity, dated criticality and the recombinant 2024 mechanism were assessed
  through exact field preservation and the prior independent scientific review. Their
  authorities and full text were not newly read live.
- Notice and contrary-literature queries cover first returned sets only. Local hidden/ignored
  searches are scoped to declared scientific trees and cited downloads. No exhaustive
  literature or machine-wide absence claim is made.
- New original scans remain outside Git because reading permission is not redistribution
  permission. Natural-fluorite source gaps under issue 187 remain open; synthetic
  CaF2 evidence does not close them.
notes:
- Working-tree attestation at trusted base 78ba2f4c84ff84be64b0da23e603f59c761905aa.
  Native inspect preceded assessment; dossier inputs were re-inspected and their corrected
  attribution reassessed after issue 192. Target record and new history hashes remained
  unchanged.
- 'Findings by severity: no confirmed blocker, major, minor or informational record
