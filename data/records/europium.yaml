mechanisms:
- id: anabaena_culture_europium_sorption
  name: Europium sorption associated with Anabaena sp. SAG 12.82 cultures
  process: biosorption
  microbial: true
  organisms:
  - id: NCBITaxon:1840102
    label: Anabaena sp. SAG 12.82
  description: Cultures exposed to europium nitrate showed reduced Eu in separated supernatants
    and qualitative Eu signals in harvested biomass. Electron-dense intracellular deposits were
    reported after Eu exposure, but their composition and oxidation state were not established
    by particle-specific analysis. Neither a demonstrated Eu(III)-to-Eu(0) reduction nor an
    exclusively metabolic uptake route is asserted.
  context: Fischer et al. used SAG 12.82 cultures grown in 150 mL modified Bold's Basal Medium
    in 250 mL flasks, with nitrate reduced to 50%, initial medium pH 6.8, reported culture pH
    7.3, 22 degrees C, orbital shaking and a 12 h day/night cycle (4200 K light). Cultures were
    divided into salt-exposed and untreated references. Separate assays used 0.111 mM initial
    Eu in nutrient medium and 0.191 mM in a nutrient-starved culture. Initial biomass concentration,
    biological replicate count and a matched biomass-free time course are not specified in the
    inspected main article or supplement. The initial concentration reference was appropriately
    diluted stock without biomass, not an incubated abiotic control. Samples of 2 mL were centrifuged
    at 14000 rpm for 15 min; supernatants were filtered through 0.45 micrometre filters, acidified,
    frozen and measured by ICP-MS. Sampling had stated temporal uncertainty of +/- 10 min. ICP-MS
    measures elemental Eu rather than proving dissolved Eu(III) speciation. Washed, dried biomass
    was examined by qualitative LIBS; these spectra cannot quantify biomass loading. Cultures
    appeared viable by color and optical microscopy, without a quantitative viability or killed-cell
    comparison. The current SAG catalogue lists this strain as non-axenic; the experimental
    article does not verify culture purity, so associated microbes cannot be excluded. Dose
    and nutritional state change together between the Eu arms. No recovery from real waste,
    desorption yield or isolated Eu product was demonstrated.
  evidence:
  - source_ref: fischer2019_esi
    supports: support
    explanation: Table S1 and Figure S1 (page S2) give 0.111 mmol/L initially, 2.47E-3 mmol/L
      at 57 min and 6.16E-4 mmol/L at 1692 min in the fed arm. These are about 97.8% and 99.4%
      decreases, respectively, calculated from the reported initial reference; they are not
      recovered-product yields. Table S4 and Figure S4 (page S5) give 0.191 mmol/L initially,
      5.79E-2 at 40 min, 2.21E-2 at 65 min, 2.85E-2 at 185 min and 4.03E-2 mmol/L at 1490 min
      in the starved arm. The later increase is retained. The supplement labels an error column
      RSD in mmol/L without explaining its statistical basis or replicate count; no confidence
      interval is inferred.
  - source_ref: fischer2019
    supports: partial
    explanation: 'Experimental and Results, ICP-MS and LIBS, with Figures 1-3, support culture-associated
      solution depletion and qualitative biomass enrichment. Main-text summaries conflict with
      the supplement: a discussion claim of 99.4% removal after one hour does not match the
      57 min Table S1 value, and near-total starved uptake at three hours does not match Table
      S4. The paper''s visual absence of precipitation is not a matched abiotic precipitation
      control. These data do not isolate the fraction caused by living cyanobacteria, passive
      binding, extracellular precipitation or associated organisms, and the fed/starved comparison
      does not establish metabolic causality.'
  - source_ref: fischer2019
    supports: partial
    explanation: Results, TEM and XRD, Figure 8 captions, Discussion and Conclusion report electron-dense
      deposits in heterocysts at 10 and 28 h, unlike the abstract's vegetative-cell wording.
      This localization conflict is explicit; the Results account is retained as an attributed
      observation, not independently remeasured microscopy. The authors report no Bragg reflections
      at 6, 28 or 200 h and acknowledge missing oxidation-state measurements. Neither electron
      density nor a negative bulk XRD result identifies a pure Eu phase or rules out all noncrystalline
      Eu compounds. The proposed biomolecule-complexed Eu species remain a hypothesis.
  - source_ref: sag_1282
    supports: context_only
    explanation: The live strain catalogue confirms Anabaena spec. SAG 12.82 and currently lists
      bacterial and other contamination. This supports the culture-purity caveat, without proving
      which associates were present in the 2019 experiment or their contributions.
  - source_ref: fritz2023
    supports: partial
    explanation: The later primary article's Sections 2-4 describe further image analysis of
      Eu-exposed SAG 12.82 heterocysts and call the Eu deposits amorphous. Its abstract also
      uses bioreduction language, but the inspected methods provide no new Eu oxidation-state
      assay. The record therefore does not upgrade the 2019 observation to Eu(0), enzyme causality
      or recovered product. Detailed particle-size distributions from this later study are outside
      this curated assay.
