mechanisms:
- id: bcp1_tellurite_reduction
  name: Resting-cell tellurite transformation to intracellular tellurium nanorods
  process: redox_transformation
  description: Rhodococcus aetherivorans BCP1 (DSM 44980) resting cells produced intracellular tellurium nanostructures. Electron diffraction supported trigonal elemental tellurium in analyzed nanorods. The proposed surfactant-assisted assembly pathway remains an interpretation.
  context: Laboratory aerobic exposure of LB-grown, twice PBS-washed cells in 50 mL PBS, pH 7.4, at 30 degrees C and 150 rpm for 0.5-16 h. The supplement specifies initial K2TeO3 loadings of 100, 500 or 1000 micrograms/mL; main-text labels instead call these tellurite concentrations. Preserve that mass-basis ambiguity without conversion to elemental Te. Biomass loading is not quantified in the exposure protocol. Solution depletion is not an isolated-product yield; industrial operation was not demonstrated.
  microbial: true
  organisms:
  - id: NCBITaxon:191292
    label: Rhodococcus aetherivorans
  protein_examples:
