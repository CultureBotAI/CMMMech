id: cmmmech:arsenic
name: Arsenic
material_kind: element
description: >-
  Arsenic (As), grounded by the neutral-atom ChEBI identifier. Arsenate,
  arsenite, gallium arsenide and metal hydroxide sludge are different
  chemical or resource entities. The US designation maps the listed arsenic
  commodity to this element without designating all arsenic-bearing wastes.
  Arsenic was retained in the final 2025 list despite proposed removal in the
  draft. The mechanism concerns co-mobilization from sludge in the same
  experiment curated for gallium, not an independent replication or an
  arsenic detoxification process.
