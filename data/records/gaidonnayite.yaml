mechanisms:
- id: abiotic_irreversible_thermal_dehydration_wadeite_transformation
  name: Laboratory irreversible thermal dehydration of gaidonnayite and transformation to
    wadeite-type Na2ZrSi3O9
  process: other
  description: Heating a 12.70 mg sample of natural Mont Saint-Hilaire gaidonnayite in air
    at 10 degrees C/min to 1000 degrees C produced a total dehydration mass loss of 9.25 wt%
    completed near 400 degrees C (resolved into two overlapping steps around 120-260 and 260-400
    degrees C), with no water readsorption after standing in air at room temperature for 24
    hours. Heating separate aliquots at 450 degrees C and 1000 degrees C converted the dehydrated
    mineral into a crystalline phase whose X-ray powder diffraction pattern closely resembled
    wadeite (K2ZrSi3O9) with smaller interplanar spacings corresponding to a sodium-wadeite
    analogue (Na2ZrSi3O9).
  context: Thermogravimetric and thermal X-ray diffraction experiments in Chao and Watkinson
    (1974), pp. 318-319, heated 12.70 mg of hand-picked gaidonnayite in air at 10 degrees
    C/min from room temperature to 1000 degrees C, checked mass recovery after 24 h exposure
    to ambient air, and recorded X-ray powder diffraction patterns of aliquots heated to 450
    and 1000 degrees C.
  microbial: false
  evidence:
  - source_ref: chao_1974_gaidonnayite
    supports: support
    explanation: Pages 318-319 report that the 12.70 mg sample lost 9.25 wt% H2O on heating
      to ~400 degrees C in two poorly resolved steps, showed zero weight gain after 24 hours
      at room temperature, and gave identical wadeite-like X-ray powder patterns after heating
      to 450 degrees C and 1000 degrees C.
  - source_ref: chao_1985_gaidonnayite
    supports: support
    explanation: Page 14 notes that the two crystallographically distinct water molecules
      OW(10) and OW(11) are each coordinated to two Na+ cations (Na1-OW10 = 2.411 A, Na2-OW10
      = 2.660 A; Na1-OW11 = 2.416 A, Na2-OW11 = 2.382 A), explaining the two-stage dehydration
      and framework collapse into the anhydrous Na2ZrSi3O9 phase.
