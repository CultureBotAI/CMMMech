limitations:
- Complete main PDFs were available. Reviewer inspected all retained scientific claims,
  all19 numbered main figures plus graphical abstract, all3 main tables, all22 supplementary
  figures and all9 supplementary tables. This does not claim visual inspection of
  every reference-only page of the39-page accepted manuscript.
- Original DOCX text/tables and embedded graphics were inspected directly and media
  bytes verified; no successful whole-DOCX page-layout conversion is claimed. Duplicate
  SVG schematic was byte-verified but not treated as an additional experimental graphic.
- No raw sequencing reanalysis, independent sample or strain authentication, statistical
  rerun, digitization of complete plot data, or recovery mass-balance reconstruction
  was performed.
- Source discrepancies and nonreplication persist. The record supports a bounded chemical
  mobilization mechanism and community context, not a demonstrated microbial advantage
  or industrial recovery.
- BioProject authority is based on the independently read and hash-verified official
  XML acquired by the curator; reviewer fresh web landing failed. Notice search is
  explicitly bounded.
- Curator dedup includes hidden/ignored/followed scientific trees and referenced raw
  roots with exclusions stated. No machine-wide absence or whole-field evidence exhaustion
  is asserted. Local structural gates are separate from scientific confidence and
  hosted publication.
