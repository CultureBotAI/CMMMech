  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 86,
    Greigite row; page 1 column definitions and page 2 distribution terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: gorlas2018
