id: cmmmech:cerussite
name: Cerussite
material_kind: mineral
description: >-
  Cerussite is the grandfathered lead carbonate mineral, Pb(CO3), recognized by the IMA-CNMNC
  September 2026 list. It is distinct from elemental lead, hydrocerussite, anglesite, lead
  oxalate, lead-bearing ore and battery paste. The dated list gives 1845 as the original-description
  year, not an IMA approval number. No criticality designation is inherited from lead.
