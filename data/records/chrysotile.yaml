id: cmmmech:chrysotile
name: Chrysotile
material_kind: mineral
description: Chrysotile is the Mg3Si2O5(OH)4 serpentine mineral species, redefined under the 2007 special
  procedure in the September 2026 IMA list. It is distinct from lizardite, magnesium element, asbestos
  as a collective material term and chrysotile asbestos mill tailings. The reviewed experiment used a
  prepared natural chrysotile sample with nonideal composition, not an assumed pure end member. No constituent
  criticality designation is inherited.
