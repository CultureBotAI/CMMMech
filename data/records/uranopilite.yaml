id: cmmmech:uranopilite
name: Uranopilite
material_kind: mineral
description: >-
  Uranopilite is the uranyl sulfate oxide hydroxide hydrate mineral
  with the September 2026 IMA formula
  (UO2)6(SO4)O2(OH)6(H2O)6·8H2O. Its grandfathered status G and
  original-description year 1882 are not a numbered approval accession.
  It is distinct from elemental uranium, a uranium commodity, zippeite
  and phases historically called metauranopilite. Burns determined
  the triclinic P-1 structure from a natural Joachimsthal, Bohemia
  specimen in Harvard Museum collection 89612. The structure contains
  uranyl sulfate chains with six coordinated and eight interstitial
  water groups per formula unit. Hydrogen positions were not directly
  located; the hydrogen-bond model and hydroxyl/water assignments
  used crystal-chemical and bond-valence arguments. The historical
  (UO2)6(SO4)(OH)10·12H2O formulation has the same total elemental
  composition but a different partition of hydroxyl and molecular
  water. The later natural Cervena-vein study confirmed the structure
  with substantial twinning and refinement limitations. Its Table 15
  water content was calculated from the assumed fourteen-water
  structure, not independently measured. Natural crystals in ore
  fractures support occurrence in an alteration assemblage; they
  do not establish a controlled formation rate, exact formation pH
  or microbial causation. This record accepts natural identity and
  structural evidence, with thermal transformations deferred. No
  criticality designation, extraction yield or industrial recovery
  is inferred.
