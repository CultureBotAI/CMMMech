id: cmmmech:marcasite
name: Marcasite
material_kind: mineral
description: Marcasite is the orthorhombic FeS2 mineral species, distinct from cubic pyrite, other iron sulfides, elemental iron and mixed sulfide ores. The September 2026 IMA list records grandfathered status and original-description year 1845; the year is not an approval accession. The accepted experiment used powder characterized as marcasite by composition and diffraction, without a reported refined phase fraction or specific surface area. No constituent criticality is inherited.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026; PDF page 136 Marcasite row, pages 1–2 definitions and terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: handbook
  title: Handbook of Mineralogy. Marcasite; one-page mineral description, crystal data and pyrite dimorphism.
  url: https://handbookofmineralogy.org/pdfs/marcasite.pdf
  accessed_on: '2026-10-14'
- id: nowaczyk2000
  title: Nowaczyk, K. and Domka, F. (2000). Oxidation of Pyrite and Marcasite by Thiobacillus ferrooxidans Bacteria. Polish Journal of Environmental Studies 9(2):87–90. Complete four-page original; Methods pp.88–89, Figures 2–4 and Table 1.
  url: https://www.pjoes.com/pdf-87281-21140?filename=21140.pdf
  accessed_on: '2026-10-14'
- id: ncbi920
  title: NCBI Taxonomy 920, Acidithiobacillus ferrooxidans; Thiobacillus ferrooxidans is a listed synonym. Current authority resolves species nomenclature, not the experimental isolate.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920
  accessed_on: '2026-10-14'
mechanisms:
- id: culture-associated-marcasite-oxidation
  name: Culture-associated ferric-iron accumulation during marcasite oxidation
  process: bioleaching
  description: Live cultures reported as Thiobacillus ferrooxidans produced greater measured ferric-iron accumulation from marcasite powder than the study's chemically altered inactive-inoculum references. The observation supports conditional culture-associated oxidation and iron mobilization. It does not isolate direct cell attack, quantify total dissolved iron or establish isolated iron-product recovery.
  context: 'Nowaczyk and Domka (2000), Methods pp.88–89 and figure/table captions: bacteria were isolated from Siersza colliery mine water, with no strain accession, sequence or independent purity test supplied. Precultures used Silverman 9K medium in 50 mL Erlenmeyer flasks in thermostated shakers. Leaching used 350 mL Erlenmeyer flasks with iron-free Silverman medium, 1%, 2% or 3% (wt/vol) mineral and 10% inoculum; the inoculum basis is printed as wt/vol and is not silently converted to a cell density. Conditions were 37 degrees C and initial pH 2.2, with grain size below 0.125 mm. Figure 4 extends to 40 days. The actual liquid volume, shaker speed, inoculum washing and cell concentration are unreported. Quantitative composition was 45.9% Fe and 53.5% S for marcasite; powder XRD was compared with a standard. Fe(III) was measured colorimetrically by the rhodanate method. Reference samples used boiled inoculum and reported 1500 ppm HgI2 as bacteriostat. No time-resolved pH or redox matching
    is established.'
