id: cmmmech:argentojarosite
name: Argentojarosite
material_kind: mineral
description: Argentojarosite is the silver ferric hydroxysulfate mineral with ideal formula AgFe3(SO4)2(OH)6, with ferric iron. The September 2026 IMA list records it as redefined, 1987 s.p. It is distinct from potassium jarosite and from silver ions, metallic silver or a generic industrial jarosite precipitate. Mukherjee's 2013 Ohio State MSc thesis identified synthetic argentojarosite following silver-nitrate addition to an iron-oxidizing culture's ferric sulfate and poorly crystalline ferric precipitates. The thesis explicitly separates the biological iron-oxidation step from the subsequent abiotic precipitation step. Silver-bearing solids and relative diffraction crystallinity are not measures of silver recovery from an ore or waste, absolute product purity or microbial precipitation necessity. No constituent-element criticality is inherited.
