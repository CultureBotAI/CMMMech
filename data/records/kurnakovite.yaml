mechanisms:
  - id: abiotic-mixed-borate-precipitation
    name: Laboratory formation of kurnakovite in a mixed borate assemblage
    process: other
    description: >-
      A long-term supersaturation experiment produced an X-ray
      diffraction pattern assigned to kurnakovite together with
      boracite and aksaite. The observation supports abiotic formation
      of kurnakovite in a mixed assemblage. It does not establish a
      single-phase precipitate, a recovered boron yield or a direct
      dissolution rate of pure kurnakovite.
    context: >-
      Table S1 identifies experiment SYN-Boracite-2 as indirect
      precipitation from 1.0 mol/kg MgCl2 plus 1.0 mol/kg NaCl at
      22.5 plus or minus 0.5 degrees C. Methods specify ACS-grade
      chemicals and degassed deionized water. Eight solution samples
      span 957-1629 days; tabulated corrected pHm values span 8.14-8.25.
      The supplement warns that a correction calibrated for pure
      MgCl2 is applied to a solution also containing sodium and borate,
      with additional uncertainty estimated below plus or minus 0.08.
      The full initial boron loading, reactor volume and independent
      reactor replication are not specified in the acquired article
      or its two supplemental tables. No organism or biomass was used;
      the natural specimen in the 2019 structure study is not the
      starting material of this experiment.
    microbial: false
    evidence:
      - source_ref: xiong2020
        supports: support
        explanation: >-
          Experimental results on p. 978 and Figure 1 on p. 979 identify
          the mixed kurnakovite-boracite-aksaite product by powder XRD.
          Figure 1's borax reference sticks do not establish borax as
          an identified product. Figure 2 follows dissolved boron,
          magnesium, sodium and chloride; these are solution molalities,
          not solid yields. Industrial crystallization is a proposed
          application on p. 982, not demonstrated deployment.
      - source_ref: xiong2020_supplement
        supports: partial
        explanation: >-
          Table S1 provides the solution conditions and time series
          for one named experiment. Its final time is 1629 days,
          agreeing with the abstract but conflicting with 1642 days
          in the main results on p. 979. The author interprets the
          approximately stable late solution series as equilibrium
          after about 900 days, but the first tabulated observation
          is at 957 days. This supersaturation approach does not
          independently demonstrate convergence from undersaturation,
          and no quantitative phase fractions or isolated-product mass
          are reported. The duration conflict remains unresolved.
      - source_ref: xiong2020
        supports: partial
        explanation: >-
          Equations 1-4 and Table 1 infer an infinite-dilution equilibrium
          constant from solution activities calculated with EQ3/6 and
          a Pitzer model. The reported kurnakovite dissolution log10 K
          of -14.11 plus or minus 0.40, stated as two sigma at 25 degrees C
          and 1 bar, is derived by combining that result with a prior
          boracite equilibrium constant. It is not a direct pure-phase
          dissolution measurement at the experiment's 22.5 degrees C.
          The separate borax/sodium-sulfate experiments and older
          thermodynamic estimates in Tables 2-7 are not additional
          kurnakovite precipitation replicates.
