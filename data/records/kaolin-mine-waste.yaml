  evidence:
  - source_ref: sanchez_palencia_2022
    supports: support
    explanation: Figures 7-12 and Results pp394-402 support limited culture-associated iron mobilization with substantial abiotic-medium leaching. High-iron inoculated bars exceed the matched high-iron control bars, but D1 day-14 values are close and no quantitative significance test of that difference is supplied. Low-iron cultures lack their own abiotic comparison. The authors explicitly identify EDTA complexation as a plausible source of the uninoculated leaching. Their reported maximum 0.83 percent iron elimination is retained as a source-reported gross assay result, not an abiotic-subtracted bacterial yield or verified closed mass balance; the exact arm/time and calculation are not provided with that percentage.
  - source_ref: sanchez_palencia_2022
    supports: partial
    explanation: Quantitative and plotting limits prevent reconstructing a precise recovery yield. Figure 9 caption specifies 14.9 mg/L total Fe for the high-iron D2 day-7 sample and Figure 11 shows a large Fe(III) peak, whereas Figure 10 clips that total-Fe bar at its 6 mg/L axis limit. The D2 peak then decreases, contrary to a universal reading of the prose's steadily increasing trend. The stated 0.83 percent is not transparently reconciled with the feed's Fe2O3 basis and this peak. The paper initially says analytical determinations were triplicate, but the biological Results describe duplicate analyses; D1 and D2 are retained separately, without inferred standard errors or pooled extraction estimates.
  - source_ref: sanchez_palencia_2022
    supports: partial
    explanation: Figure 12 reports lauric acid as chromatographic percentage area, not an absolute mass concentration or molar secretion rate. Its curves are not universally monotonic, and the low-iron D1 day-10 bar exceeds the high-iron bar. Culture-associated acid signals and the D2 day-7 low pH are consistent with a microbial influence but do not establish that lauric acid caused iron dissolution. Figure 9 is a calculated equilibrium diagram, not direct identification of the iron host or an iron-respiration assay; its headings say 25 degrees C while the caption says approximately 22 degrees C. The precise leaching temperature and control of oxygen transfer remain unclear.
  - source_ref: sanchez_palencia_2022_esm
    supports: partial
    explanation: ESM geological text and Figures S1-S2 describe kaolin beds in the fluvial/deltaic Utrillas Sandstone Formation and call the kaolin secondary in origin through feldspar hydrolysis. The main Introduction instead describes the studied deposit as primary and in place from granite alteration. This source conflict is not resolved by renaming the waste as a mineral species or processing residue; the record's resource kind rests on the independently explicit mine-dump origin.
  - source_ref: ncbi_thuringiensis
    supports: context_only
    explanation: Resolves the species label used by the paper within the Bacillus cereus group. The taxon link does not verify isolate no. 91 as the reference EB63 strain, identify its sequence, or prove its metabolic role beyond the actual inoculation experiment.
- id: chemical_oxalate_comparator
  name: Chemical acid leaching comparator and failed long-duration validation
  process: other
  description: Oxalic/citric acid assays chemically removed a fraction of the iron impurities from high-iron mine waste. The chemical comparator performed better than the bacterial assays under different conditions, but a longer validation did not produce the predicted complete elimination. No microbial attribution applies to these acid-only experiments.
  context: Tables 1 and 4 describe ten RSM runs, including duplicate centre-point experiment 9, with nominal acid levels 20, 60 and 100 mM, 1, 4 and 7 g kaolin per 100 mL, and 7, 30 or 60 days. Methods mix 50 mL each of citric and oxalic acid solutions; they do not clearly distinguish the tabulated concentrations from the pre-mixing stock concentrations. Suspensions were hand-shaken initially and for one minute daily. AAS measured solution iron. The separate long validation used 14 g feed in 200 mL of 20 mM oxalic acid for 218 days with occasional stirring. These are laboratory chemical assays, not matched-pH or matched-time controls for the 14-day microbial experiment.
  microbial: false
  evidence:
  - source_ref: sanchez_palencia_2022
    supports: support
    explanation: Table 4 reports 32.21 percent Fe removed for experiment 4 at nominal 100 mM each acid, 1 g/100 mL, 60 days and final pH 0.74; experiment 7 gave 31.7 percent. Equation 1 uses the phrase Fe reduced for an iron-removal calculation, not proof of Fe(III)-to-Fe(II) conversion. Post-treatment Fe2O3 percentages in Table 3 are solid-composition values, not directly interchangeable with Table 4 extraction yields; an independently closed solid/liquid mass balance is not supplied.
  - source_ref: sanchez_palencia_2022
    supports: partial
    explanation: Figures 4-5 and Equation 2 describe fitted relationships, including percent removal = 0.48 x days, rather than a validated prediction of complete removal at arbitrary duration. The 218-day validation ended with only traces of solution Fe and 3.42 mass percent Fe2O3 in the residue versus 3.06 initially. The authors attribute this to reprecipitation during a final cold week below approximately 5 degrees C. Similar major XRD phases in Figure 6 do not independently identify a new iron precipitate or isolate temperature causality. The prose asserts that iron leaching increased linearly with time in a repeated 218-day experiment, without supplying the corresponding numerical dataset. The source explicitly considers the demonstrated removal inadequate for industrial use.
  - source_ref: sanchez_palencia_2022_esm
    supports: context_only
    explanation: Figure S3 photographs the yellow suspension about halfway through the long chemical assay. It establishes neither a final iron yield nor an independently quantified precipitate or recovered product.
