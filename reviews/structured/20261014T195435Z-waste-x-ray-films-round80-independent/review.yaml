limitations:
- No independent authentication of historical culture stocks; current taxonomy only
  maps the supplied names/designations.
- Crude preparations and incomplete matched controls do not prove a purified single-enzyme
  pathway; the record preserves those limits.
- No initial silver inventory or whole-process mass balance; 99.16% denotes product
  purity, not recovery yield, and N=5 is not five independent recovery runs.
- Source dose and capacity discrepancies remain explicit; no separate supplement was
  announced in the inspected originals, not an exhaustive live SI inventory.
- Bounded notice searches are not proof of absence. Structural gates do not certify
  scientific truth or future hosted publication.
