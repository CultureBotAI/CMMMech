mechanisms:
- id: culture_acid_aluminium_leaching
  name: Aluminium dissolution using culture-derived sulfuric acid liquor
  process: bioleaching
  microbial: true
  description: >-
    Acidic liquor generated by sulfur-oxidizing cultures was used in a separate
    spent-medium stage to dissolve aluminium from prepared blister waste.
    The laboratory evidence supports conditional leaching and layer separation,
    with a conditional biogenic-acid advantage over reagent acid at 22 degrees C
    that is absent at 50 degrees C. It does not
    establish direct cell attack, identified biosurfactant causality or isolated
    aluminium-product recovery from this feed.
  context: >-
    Approximately 5 kg of waste from two hospitals in Lower Austria was sorted
    into transparent, white and silver-coloured fractions, then cut to about
    1 x 1 cm or shredded below 4 or 2 mm. FTIR identified PVC, acrylic adhesive
    and additional packaging-dependent polymers. Section 3.1 reports about
    12.6, 13.7 and 67.6% w/w Al respectively after acid dissolution of 2.5 g
    samples; these are batch-specific values. The study names A. thiooxidans
    DSM 504 and A. caldus DSM 9466 for upstream sulfur oxidation. Its blister
    lixiviant was separately produced in a semi-continuous reactor following
    Kremser et al. 2022, with 0.85 M sulfate and pH about 0.2, described as
    approximately 0.86 M sulfuric acid. The paper's lower-concentration sulfur
    comparison experiments are not the blister leaching batch. No exact
    sulfur-lot linkage from the biogas-residue comparison to that lixiviant is
    established. Flasks contained 150 mL liquid in 250 mL vessels, 2.5, 5.0 or
    7.5% w/v waste, 22 degrees C and 150 rpm for up to nine days in triplicate.
    Commercial 0.86 M sulfuric acid was the comparator. Separate 50 degrees C
    and particle-size experiments used 7.5% w/v. The nominal 1 L stirred
    trials used below-4-mm transparent or white material, 7.5% w/v, 22 degrees C
    and 250 rpm for 14 days. Samples for Al analysis were filtered at 0.2
    micrometres and measured with xylenol-orange spectrophotometry. The cited
    acid-production protocol filters withdrawn liquor, but the blister study
    does not independently demonstrate sterility of its applied liquor.
  organisms:
  - id: NCBITaxon:930
    label: Acidithiobacillus thiooxidans
  - id: NCBITaxon:33059
    label: Acidithiobacillus caldus
  evidence:
  - source_ref: kremser2023
    supports: support
    explanation: >-
      Sections 2.5-2.6 and 3.3, Figures 2-4 support aluminium mobilization and
      separation of polymer-rich residues. The authors report near-complete
      leaching from transparent and white fractions within seven to nine days
      in flasks, while silver-coloured material reaches only about 36% at best.
      Its higher Al inventory, greater pH rise and changed redox potential
      accompany poorer release; those observations do not isolate the causal
      contribution of each factor. Later trials exclude the silver fraction.
  - source_ref: kremser2023
    supports: partial
    explanation: >-
      Figure 3 and Section 3.3.2 show that commercial and biogenic acid perform
      similarly at 50 degrees C. Finer shredding did not materially improve the
      tested outcomes. Figure 4 reports approximately 90% and 81% Al leaching
      at day 14 for transparent and white material in the 1 L trials, below
      the flask results. These comparisons refute an unconditional advantage
      of biogenic acid or of increasing reactor size. Foam-associated Al
      retention is a proposed explanation, not a quantified inventory balance.
  - source_ref: kremser2023
    supports: partial
    explanation: >-
      Reported percentages are retained as the authors' leaching estimates,
      not recalculated yields. The accessible rendition of Equation 2 places
      the solid Al inventory above the liquid inventory, opposite the usual
      released-fraction ratio; the intended calculation is unresolved. Some
      Figure 2 and 3 bars exceed 100%, and Section 3.3.1 later calls the silver
      material 63% Al instead of Section 3.1's 67.6%. No raw replicate data or
      complete solid-liquid Al balance resolves these differences here.
  - source_ref: kremser2023
    supports: partial
    explanation: >-
      Biosurfactants and other metabolites are proposed from foam and acid-type
      differences, without chemical identification or a component-specific
      intervention. The reagent comparator does not match all medium solutes.
      Section 3.3.3 proposes hydroxide precipitation using earlier work; it
      does not supply a blister-specific isolated Al product yield or purity.
      Polymer reprocessing separately required thermal treatment, with ethyl
      acetate cleaning and stabilizer comparisons; discoloration persisted.
      These laboratory tests establish neither industrial deployment nor a
      process-wide economic or environmental advantage.
  - source_ref: kremser2022_acid
    supports: context_only
    explanation: >-
      The cited upstream method uses DSM 504 and DSM 9466 for sulfur oxidation,
      with aerated, stirred acid production and filtration of withdrawn liquor.
      This explains the microbial origin of the leaching reagent. It does not
      authenticate the later blister liquor, assign strain-specific causality,
      or transfer incineration-slag outcomes to pharmaceutical packaging.
  - source_ref: dsm504
    supports: context_only
    explanation: DSM 504 resolves to the study's A. thiooxidans collection label.
  - source_ref: dsm9466
    supports: context_only
    explanation: DSM 9466 resolves to A. caldus C-SH12, consistent with the paper.
  - source_ref: ncbi_thiooxidans
    supports: context_only
    explanation: The CURIE identifies the species, not DSM 504 or its stock provenance.
  - source_ref: ncbi_caldus
    supports: context_only
    explanation: The CURIE identifies the species, not DSM 9466 or its role in the mixture.
