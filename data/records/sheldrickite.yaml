id: cmmmech:sheldrickite
name: Sheldrickite
material_kind: mineral
description: Hydrated sodium-calcium fluorocarbonate mineral with current September 2026 IMA-CNMNC
  approved formula NaCa3(CO3)2F3(H2O), status A, and approval number IMA 1996-019. Grice,
  Gault, and Van Velthuizen (1997) described the cotype specimens (CMNMI 81530, 81537, 81538,
  and 81539) from thermally metamorphosed marble xenoliths at the Poudrette quarry, Mont Saint-Hilaire,
  Rouville County, Quebec, Canada, where it occurs on fluorite and calcite with leucophanite,
  pectolite, microcline, arfvedsonite, and schorlomite. Electron-microprobe WDS analysis (mean
  of 3 points, p. 182) combined with thermogravimetric H2O measurement and stoichiometric
  CO2 calculation yielded Na2O 9.16, CaO 48.84, SrO 0.36, F 16.17, CO2 25.81 (calc), H2O 5.61,
  less O=F 6.81, total 99.14 wt%, corresponding on the basis of 2 C atoms (10 anions) to the
  empirical formula Na1.01(Ca2.97Sr0.01)Sigma2.98(CO3)2[F2.90(OH)0.07]Sigma2.97·H2O. Single-crystal
  X-ray diffraction refined in acentric trigonal space group P32 (single-crystal cell a =
  6.726(2), c = 15.044(4) A, V = 589.7(3) A3, Table 2; Debye-Scherrer powder XRD cell a =
  6.718(3), c = 15.050(4) A, V = 588.3(3) A3, Z = 3, R = 4.6%, wR = 4.2% for 867 observed
  reflections with Fo > 5sigma(Fo) out of 965 unique reflections) established a three-layer
  c-repeat sequence of [CaF]-, [(CO3)2]4-, and [Na(H2O)]+ structural slabs. Thermogravimetric
  analysis under dry nitrogen recorded a single continuous 5.61 wt% dehydration step between
  160 and 265 degrees C. Distinct from fluorite, shortite, rouvilleite, and commercial fluorspar;
  no criticality designation, microbial mechanism, or industrial recovery yield is asserted.
