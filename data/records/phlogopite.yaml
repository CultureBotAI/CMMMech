id: cmmmech:phlogopite
name: Phlogopite
material_kind: mineral
description: Phlogopite is a magnesium-rich mica mineral species with ideal formula KMg3(AlSi3O10)(OH)2
  in the September 2026 IMA list, distinct from generic mica, the biotite grouping, muscovite, potassium
  and traded potash. The IMA row gives grandfathered status and the historical date 1841, not a numbered
  approval accession. The experiment curated here used a chemically characterized natural phlogopite specimen
  containing iron and titanium, not an ideal pure endmember. No criticality designation is inferred from
  its constituent elements.
