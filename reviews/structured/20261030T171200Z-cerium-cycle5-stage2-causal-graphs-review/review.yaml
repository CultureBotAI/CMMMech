  locator: 'kang_2022: Kang, Csetenyi, Gao and Gadd (2022). Solubilization of struvite and biorecovery
    of cerium by Aspergillus niger. Applied Microbiology and Biotechnology 106:821-833. DOI 10.1007/s00253-021-11721-0;
