mechanisms:
- id: mr1_chlorite_iron_reduction
  name: MR-1 reduction of iron associated with a natural chlorite preparation
  process: redox_transformation
  description: Washed Shewanella oneidensis MR-1 suspensions increased iron(II) in a weak-acid-extractable
    fraction relative to uninoculated controls. Bulk Mössbauer fits support reduction of chlorite-associated
    iron(III), alongside unresolved impurity contributions. Most reduced iron remained associated with
    solids; small aqueous iron increases and greater susceptibility to a later acid extraction do not
    establish isolated-metal recovery.
  context: Laboratory resting-cell bottles contained chlorite powder smaller than 100 micrometres, prepared
    by abrasion, hand picking and sieving of a Michigamme metamorphic specimen, at a 1:40 solid-to-solution
    mass ratio. The anaerobic medium was 30 mM bicarbonate at pH 7 under 80% nitrogen and 20% carbon dioxide,
    with 10 mM lactate and, in selected bottles, 10 micromolar AQDS. MR-1 was precultured at 30 degrees
    C, harvested and washed twice; the inspected main and supplement do not explicitly give the resting-assay
    temperature or final cell density. Residues were collected after 28 days. Figure 1 reports standard
    errors of triplicate measurements, without clearly establishing independent culture replication. The
    separate eight-week growth experiments used biotite flakes and are not chlorite growth evidence.
  microbial: true
  organisms:
  - id: NCBITaxon:211586
    label: Shewanella oneidensis MR-1
  evidence:
  - source_ref: brookshaw_2014
    supports: support
    explanation: Figure 1B shows elevated weak-acid-extractable Fe(II) with MR-1, with and without AQDS,
      relative to uninoculated controls. The denominator is total iron extracted by 0.5 N HCl for one
      hour, not all structural iron or a recovery yield. Figure 2C-D and Table 2 show a decrease in fitted
      chlorite Fe(III) area from 10.4% to 8.2%; the authors interpret this as about 21% of the starting
      chlorite Fe(III) reduced. These are spectral component estimates, not a mineral mass balance. AQDS
      accelerated early reduction without a clear increase in its final extent.
  - source_ref: brookshaw_2014
    supports: partial
    explanation: Methods explicitly retain magnetite below the XRD detection limit, and Mössbauer fits
      include magnetite plus an unresolved impurity. The paper calls the chlorite Fe-rich clinochlore
      although its calculated formula is Fe-dominant; no new species assignment or quantitative purity
      is inferred. Figure 1D shows aqueous iron changes, but peak timing in the AQDS curve differs from
      the prose. ICP-AES measures elemental iron rather than independently establishing dissolved oxidation
      state. Figure 3 is a subsequent 0.5 M HCl extraction, not culture-only dissolution. The proposed
      long-distance electron-transfer pathway remains interpretive; no molecular perturbation proves it.
  - source_ref: brookshaw_2014_si
    supports: partial
    explanation: Supplemental Figure S2 establishes the initial source-assigned ferroan clinochlore diffraction
      pattern. Figures S1 and S2 are explicitly unaltered powders and do not display a before/after XRD
      comparison, although the main text cites them when reporting no appreciable structural change or
      new phases. Main microscopy and the source interpretation support predominantly solid-associated
      reduction with that evidential limit. Figure S3 and the growth/counting methods concern biotite
      only. No industrial process, isolated iron product or complete phase-specific reduction follows.
