mechanisms:
- id: gl24_surface_nucleation
  name: Celestine-associated mineralization on Synechococcus GL24 surfaces
  process: biomineralization
  microbial: true
  description: The source-designated cyanobacterium Synechococcus strain GL24 formed Sr-bearing mineral
    patches on its S-layer in illuminated artificial lakewater. Selected-area electron diffraction and
    elemental microanalysis supported celestine together with strontianite. Early patches were Sr- and
    S-bearing; later encrustations became more carbonate-dominated. This is culture-associated nucleation
    of mixed minerals from dissolved salts, not microbial dissolution of a starting celestine ore, a pure
    celestine product or proof of a particular celestine-to-strontianite reaction pathway.
  context: GL24 was originally isolated from Fayetteville Green Lake, New York. The 1994 source provides
    this isolate designation but no sequence accession or independently verified strain-level taxon identifier;
    no modern species or strain CURIE is assigned. Artificial GL medium was prepared without Ca, Mg or
    Sr, then supplied with 10 mM Sr as the nitrate salt for the Sr-only arm, together with 10 mM Na2SO4
    and 3.2 mM NaHCO3 in the base medium. The salt medium was filter sterilized through 0.2 micrometre
    nylon to avoid heat-induced carbonate precipitation, and acid-washed tubes were rinsed five times
    with high-purity water. Nine tubes each containing 9 mL were inoculated from a one-month-old culture
    to a reported final 10^6 cells/mL, with a tenth tube left uninoculated. Incubation was at 22 degrees
    C under Gro-lux fluorescent illumination of 20 microeinsteins per square metre per second. One tube
    was sacrificed at each of nine times from 4 to 288 h; this is not nine biological replicates per time.
    Whole-mount TEM, EDS and selected-area diffraction examined cell-associated minerals, while the remaining
    suspension was used for pH. Separate Ca/Mg/Sr competition arms had total divalent-cation concentration
    10 mM. Those mixed-cation results are not pure-celestine experiments. Laboratory tubes, not natural-lake
    celestine production or deployed treatment, define the accepted scope.
  evidence:
  - source_ref: schultze1994
    supports: support
    explanation: Methods and Results pp. 447-450, Figures 1-4, support early cell-surface mineral patches,
      increasing encrustation, initial pH rise, and celestine/strontianite assignments using selected-area
      diffraction and Sr/S microanalysis. The paper reports neither mineralization nor pH change in uninoculated
      controls. Figure 3A identifies an early Sr/S-bearing patch as celestine; Figure 3B and the increasing
      Sr/S ratio in Figure 4 support later strontianite dominance. Both mineral types occurred, so no
      phase-pure celestine yield or quantitative phase fraction is inferred.
  - source_ref: schultze1994
    supports: partial
    explanation: Figure 4 averages five EDS stoichiometric determinations at each time, not independent
      culture replicates; changing Sr/S ratios do not by themselves quantify phase proportions or prove
      conversion of each original sulfate crystallite into carbonate. The selected diffraction spacings
      and spot analyses support the authors limited phase assignment, not modern full-pattern quantitative
      refinement. No killed-cell, isolated-S-layer or matched-pH chemical control in this experiment establishes
      the exclusive role of living metabolism versus surface nucleation and solution chemistry.
  - source_ref: schultze1994
    supports: partial
    explanation: Figure 5 shows declining Sr in acidified cell-free supernatants; this does not measure
      a separated, purified celestine product or identify what fraction of removed Sr entered celestine
      rather than strontianite or surface-bound pools. The authors note that shed mineralized S-layers
      affect interpretation of supernatant cation measurements in comparison arms. Discussion pp. 451-452
      proposes that Sr/Ca imbalance impairs photosynthesis and S-layer replacement, but does not directly
      demonstrate that causal sequence with viability or photosynthetic-rate measurements. Figures 6-7
      illustrate S-layer structure and calcium/gypsum context; they are not additional celestine-specific
      experiments.
