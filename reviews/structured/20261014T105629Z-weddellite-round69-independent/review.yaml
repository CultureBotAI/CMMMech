summary: Tetragonal calcium oxalate hydrate weddellite is correctly separated from
  monoclinic whewellite, caoxite and mixed ore. IMA dihydrate formula does not measure
  water occupancy of the field crystals. Natural whewellite/weddellite coexistence
  is supported as source-assigned spatial association. Non-observation of weddellite
  in the separate A.niger experiment is conditional and does not establish a universal
  incapacity or refute field occurrence.
