id: cmmmech:galena
name: Galena
material_kind: mineral
description: Galena is the PbS mineral species listed as grandfathered in the September 2026 IMA list; its original-description year is unresolved there. It is distinct from elemental lead, anglesite, manufactured PbS reagents and mixed lead ores or flotation concentrates. The experiment below concerns galena within a natural mixed concentrate, not a pure natural endmember. No criticality designation is inherited from lead.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Galena row on PDF page 79; status and year definitions on page 1 and distribution terms on page 2. Same-day retained original rechecked, not downloaded anew.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: pacholewska2004
  title: 'Pacholewska, M. (2004). Bioleaching of galena flotation concentrate. Physicochemical Problems of Mineral Processing 38, 281-290. Complete original main: Methods pp. 282-284, Tables 1-3, Figures 1-3 and results pp. 284-290. Publisher landing supplies issue 1; no verified DOI is assigned here.'
  url: https://www.journalssystem.com/ppmp/Bioleaching-of-galena-flotation-concentrate,79494,0,2.html
  accessed_on: '2026-10-11'
- id: ncbi_ferrooxidans
  title: NCBI Taxonomy 920. Acidithiobacillus ferrooxidans, species rank and current name. Species identifier only; not an authentication of F3-02.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920&mode=info
  accessed_on: '2026-10-11'
mechanisms:
- id: culture_associated_sulfate_transformation
  name: Culture-associated galena transformation with lead sulfate precipitation
  process: redox_transformation
  description: Inoculation with the source-labelled A. ferrooxidans F3-02 culture accompanies faster ferrous-iron depletion, higher redox potential and a residue with less galena and more anglesite than the sterile-labelled comparator. The observations support a conditional culture-associated transformation in a mixed concentrate. Ferric attack and oxidation of reduced sulfur are proposed contributions, not separately isolated pathways. Lead sulfate precipitation also occurs without inoculation, and low dissolved lead shows no inoculated advantage. This is not demonstrated lead extraction into solution or isolated-product recovery.
  context: Laboratory shake-flask assay using flotation concentrate from ZGH Boleslaw S.A., Poland. The source estimates approximately 80% PbS by XRD, with hydrocerussite, marcasite, sphalerite, pyrite and minor gypsum and quartz; these approximate starting phase percentages do not close exactly to 100%. Table 1 gives 69.3% Pb and 18.4% total S. Particle-size distribution and washing or other pre-assay solid treatment are not specified. F3-02 was isolated from ferruginous mineral water at Piwniczna-Lomnica, cultivated in modified 2K medium and not initially adapted to lead compounds. No sequence or authenticated collection accession is supplied for that strain. The medium contains, in g/L, (NH4)2SO4 3.0, KCl 0.1, MgSO4.7H2O 0.5, Ca(NO3)2 0.01, K2HPO4 0.5 and FeSO4.7H2O 9.84, nominally 2.0 g/L Fe(II), with sulfuric acid adjustment to nominal pH 2. The paper specifies 5% w/v concentrate, 100 mL solution and 10 mL culture in 300 mL Erlenmeyer flasks, 25 degrees C and 130 rpm; whether the inoculum
    is included in the 100 mL and loading denominator is unresolved. Table 2 starts at pH 2.2 and 2.159 g/L Fe(II), differing from the nominal medium values. Sampling extends to 384 h. Replicate number, uncertainty, inoculum cell density, inoculum washing, sterilization method and verification of control sterility are unreported. The comparator is described as sterile, but its pH and redox trajectories differ from the inoculated treatment; no dynamic chemistry-matched control isolates a direct cell effect. Pb and Zn were measured by atomic absorption, Fe(II) by manganometry, residue sulfur fractions gravimetrically and phases by XRD; residues were air-dried on filters for SEM. Residue masses and a closed Pb/S balance are not supplied.
  microbial: true
  organisms:
  - id: NCBITaxon:920
    label: Acidithiobacillus ferrooxidans
  protein_examples:
