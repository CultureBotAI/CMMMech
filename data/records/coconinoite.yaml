id: cmmmech:coconinoite
name: Coconinoite
material_kind: mineral
description: >-
  Coconinoite (IMA 1965-003) is an IMA-accepted hydrated iron-aluminum uranyl
  phosphate-sulfate mineral with IMA September 2026 Master List formula
  Fe3+2Al2(UO2)2(PO4)4(SO4)(OH)2·20H2O. Described by Young, Weeks, and Meyrowitz
  (1966) from the oxidized zone of Colorado Plateau uranium deposits at the Sun
  Valley mine (Coconino County, Arizona, USA), Blackwater No. 4 and Huskon No. 7
  mines (Apache County, Arizona, USA), and the Jomac mine (White Canyon
  district, San Juan County, Utah, USA), where it forms light creamy-yellow
  microcrystalline aggregates of lath-shaped grains (6 x 2 um) in seams with
  gypsum, jarosite, limonite, quartz, clay, and coalified wood. Microchemical
  analyses in Table 2 (p. 656) report for Blackwater No. 4 sample 1715 Fe2O3
  9.7, Al2O3 6.6, UO3 34.9, P2O5 18.3, SO3 5.4, H2O- 18.2, H2O+ 5.8 (total H2O
  24.0), CaO 0.1, CO2 < 0.1, Na2O < 0.1, acid-insol. 0.5, total 99.5 wt%, and
  for Jomac sample T-J2-53 Fe2O3 10.3, Al2O3 6.5, UO3 34.2, P2O5 17.7, SO3 6.1,
  total H2O 23.4, CaO < 0.1, CO2 0.7, Na2O 0.1, acid-insol. 1.0, total 100.0
  wt%. Possibly monoclinic, with strongest X-ray powder diffraction lines at
  11.05(100), 5.52(42), and 5.61(18) Å, SGmeas = 2.70, Dcalc = 2.68 g/cm3,
  nonfluorescent under ultraviolet light, and unheated biaxial (–) optics with
  alpha = 1.550(5), beta = 1.586(5), gamma = 1.590(5), and 2V = 28–43° (average
  40°).
