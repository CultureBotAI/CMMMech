id: cmmmech:metallic-machining-burrs
name: Metallic machining burrs
material_kind: secondary_resource
description: Metal-rich solid burrs generated by machining, represented here by an industrial sample obtained in Mexico City and mechanically reduced before laboratory testing. This resource denotes machining offcuts rather than a particular alloy, elemental metal, smelting slag or coolant-trap grinding sludge. The sampled batch was iron-rich but its alloy and phase identities, facility, collection date and machining operation were not specified. Industrial origin does not establish industrial bioleaching deployment, and no criticality designation is inferred from its constituents.
sources:
- id: gomez_ramirez2020_burrs
  title: 'Gomez-Ramirez, Moreno-Villanueva and Rojas-Avelizapa (2020), Acidithiobacillus thiooxidans DSM 26636: An Alternative for the Bioleaching of Metallic Burrs. Catalysts 10(11), 1230, DOI 10.3390/catal10111230. Complete original 11-page publisher PDF; Sections 2-4, Figures 1-4 and Table 1.'
  url: https://doi.org/10.3390/catal10111230
  accessed_on: '2026-10-15'
- id: gomez_ramirez2021_context
  title: Gomez-Ramirez et al. (2021), Bioleaching of metals from machining process wastes. Revista Mexicana de Ingenieria Quimica 20(2), 751-759, DOI 10.24275/rmiq/Bio2079. Complete original nine-page publisher PDF; Sections 2-3, Figures 1-2 and Tables 1-2. Same-group studies of separately described IW-steel and IW-scrap feeds, used only as context.
  url: https://doi.org/10.24275/rmiq/Bio2079
  accessed_on: '2026-10-15'
- id: ncbi_thiooxidans
  title: NCBI Taxonomy 930, Acidithiobacillus thiooxidans, current species entry inspected on 2026-10-15. Species mapping does not authenticate the paper's DSM 26636 experimental stock.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=930&mode=Info
  accessed_on: '2026-10-15'
mechanisms:
- id: sulfur_oxidation_associated_burr_leaching
  name: Sulfur-oxidizing culture-associated leaching of machining burrs
  process: bioleaching
  description: A source-assigned Acidithiobacillus thiooxidans DSM 26636 culture incubated with industrial burrs and added elemental sulfur showed increased sulfate, titratable acidity and acidification relative to uninoculated controls. The study also reports limited metal mobilization after subtracting control losses. These observations support a culture-associated acid-generating treatment, with proton-mediated dissolution proposed by the authors. They do not establish a specific enzyme, direct microbial oxidation of the burr alloy, complete metal extraction or isolated-product recovery.
  context: 'The 2020 original Sections 4.1-4.4, pages 7-9, describe burrs from an unnamed Mexico City industry, cut and crushed to 10-15 mm long and 1-2 mm wide. A four-day inoculum grown at pH 3, 30 degrees C and 150 rpm in modified Starkey medium plus 1% elemental sulfur was added as 3 mL to 30 mL medium in 125 mL flasks, with 0.33 g each of burrs and sublimed sulfur: nominal 1% w/v of each in 33 mL. Controls held 33 mL medium and the same solid additions without inoculum. Eighteen inoculated and nine control flasks were distributed across three destructive sampling times: six and three respectively every seven days over 21 days, at 30 degrees C and 150 rpm. Supernatants were centrifuged and filtered through 0.22 micrometre membranes; sulfate, NaOH-titrated acidity and pH were measured. End-point liquid aliquots were acid-digested and analyzed by ICP-OES. The method calls the chamber-counted inoculum 2 x 10^8 CFU/mL; chamber counting alone does not establish colony-forming viability, and
    no direct growth series in the burr assays is shown. The medium was autoclaved, but this does not establish sterilization of the burr feed or independent stock authentication. Sampling dates for native concentration observations were not supplied; quantitative observations are not encoded here.'
  microbial: true
