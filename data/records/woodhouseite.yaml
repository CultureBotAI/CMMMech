id: cmmmech:woodhouseite
name: Woodhouseite
material_kind: mineral
description: Woodhouseite is the calcium aluminium sulfate-phosphate mineral CaAl3(SO4)(PO4)(OH)6, distinct
  from strontium-dominant svanbergite, calcium aluminium phosphate crandallite and calcium as an element.
  The September 2026 IMA list records its redefinition by special procedure in 1987. Lemmon (1937) described
  natural crystals from quartz veins adjoining and penetrating andalusite deposits on White Mountain,
  Mono County, California. Geometrical crystallography, optical observations and wet chemical analysis
  of hand-sorted crystals supported the new mineral. Its analysis contains minor substituents and a phosphate-sulfate
  imbalance; Lemmon explicitly considered a single analysis insufficient to prove the proposed substitution.
  This historical description is not a modern single-crystal refinement. Stoffregen and Alpers (1987)
  subsequently measured natural aluminium phosphate-sulfate grains by electron microprobe at Summitville,
  La Granja and La Escondida. Calcium-rich grains approaching woodhouseite occur at depth in Summitville
  and at La Granja, where small grains appear to replace apatite and contact pyrophyllite. Variable Ca/Sr
  and phosphate/sulfate ratios, minor additional cations and calculated rather than measured water distinguish
  these grains from pure ideal endmembers. Figure 1 depicts an approximately equal Ca/Sr grain, not pure
  woodhouseite. Apatite dissolution or replacement during advanced argillic alteration is the authors'
  field-textural interpretation; there was no controlled formation experiment, reaction time series or
  microbial assay. Their 250 degrees C, 40-bar stability diagram uses assumed aqueous compositions and
  an inferred woodhouseite boundary because direct thermodynamic data were unavailable to that study.
  It is not a measured formation threshold, and its hydroxyapatite model omits fluoride/chloride effects.
  The companion svanbergite record uses the same field study. These sources establish mineral identity
  and qualified natural alteration context, not microbial formation, elemental extraction yield, isolated-product
  recovery or industrial deployment. No constituent-element criticality is inherited.
