  evidence:
  - source_ref: pangayao_2015
    supports: support
    explanation: Sections 2.2-2.5 and 3.1-3.3, Figures 1-2 and Tables 1-3 support the mixed-feed identity, treatment and filtered-liquor assays. Table 3 reports run-specific maxima of 56.69% Zn and 69.32% Cu in run 13, 70.68% Mn in run 15, and 79.86% Cr and 70.74% Fe in run 17; these are not one combined optimum or isolated product yields. Figure 2 and Section 3.2 show final pH approximately 0.61-1.39 after the initial chemical adjustment to pH 2.
  - source_ref: pangayao_2015
    supports: partial
    explanation: The paper labels Table 3 values as percent metal leached but does not give the calculation equation, initial-feed digestion procedure, blank corrections, raw liquor concentrations or complete solution/residue mass balance. Its reported total feed concentrations in Section 3.1 therefore do not independently validate the percentage denominator. Added chemical acid, unquantified inoculum chemistry and missing matched controls limit microbial attribution; pH decline alone does not establish growth or sulfur-oxidation causality. Neither species contribution nor fly-ash/bottom-ash-specific extraction is resolved.
  - source_ref: pangayao_2015
    supports: partial
    explanation: Section 3.3 states 59.69% maximal Zn whereas Table 3, abstract and conclusion give 56.69%. Table 5 is numerical model optimization, not a separately described validation experiment; its Zn prediction 56.88% conflicts with abstract 56.38%, and its 1 g sulfur settings for Zn/Mn contradict the conclusion's general 3 g optimum. The inoculum main effect is reported nonsignificant. Table 4 gives Fe/Cu lack-of-fit p-values 0.0417/0.0416 despite broad model-adequacy wording. These source inconsistencies and statistical limitations prevent a validated optimum, universal enhancement or scale-up performance claim.
  - source_ref: atcc_albertensis
    supports: context_only
    explanation: The catalogue corroborates the source's ATCC 35403 species designation and DSM 14366 correspondence. It does not establish purity, growth or the strain's separate causal contribution in the mixed-culture experiment.
  - source_ref: atcc_thiooxidans
    supports: context_only
    explanation: The catalogue corroborates ATCC 19377 as A. thiooxidans and lists DSM 14887. This is culture-identity context, not an independent ash-leaching experiment.
