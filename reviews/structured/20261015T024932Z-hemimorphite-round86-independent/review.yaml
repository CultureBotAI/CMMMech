limitations:
- Deposit AM-18-56128 SI remains unacquired; its XRD, comparative fits and chemistry
  are not independently verified. The accepted microbial entry is contextual precursor
  evidence only.
- Matched sterile precipitation, field strain authentication and crystalline phase
  yield are unavailable; taxonomy is species-level name mapping.
- Serial sampling uses a constant-volume assumption; reagent-free blank, replicate
  counts and error bars are not supplied for the chemical experiment.
- Publisher version notes show a PDF update11July2017 and later HTML updates. This
  review binds the acquired current PDF bytes, not an asserted unchanged first publication.
- Bounded notice search is not exhaustive; structural validation cannot prove scientific
  truth.
