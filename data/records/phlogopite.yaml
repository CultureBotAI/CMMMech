mechanisms:
- id: paxillus_phlogopite_surface_weathering
  name: Fungal-associated phlogopite surface alteration under potassium limitation
  process: bioleaching
  microbial: true
  organisms:
  - id: NCBITaxon:71150
    label: Paxillus involutus
  description: Phlogopite exposed to Paxillus involutus for 21 days showed surface furrows, fractured
    or raised layers and clustered deposits relative to pre-exposure images. This supports a bounded fungal-associated
    weathering interpretation. Potassium concentration in harvested mycelium was not significantly greater
    than in the potassium-depleted, mineral-free fungal control. Greater aluminium and iron concentrations
    in harvested material are compatible with mineral interaction but do not alone establish intracellular
    uptake, element-specific release from phlogopite or a recovered-product yield.
  context: The reported strain was ATCC 200175, with ITS Sanger identity checking described in SI S2.
    SI S3 locates the natural phlogopite at Caldara di Manziana near Rome, Italy, and reports SEM-EDX/microprobe
    composition and no other minerals detected by XRD. Approximately 2 cm2 flakes were ultrasonically
    cleaned in deionized water and autoclaved at 121 degrees C for 15 minutes. Flakes were placed on sterile
    cellophane over 30 mL modified Melin–Norkrans agar in 100-by-20 mm Petri dishes, inoculated with three
    5 mm plugs from seven-day cultures and incubated for 21 days at 25 degrees C in darkness. The phlogopite
    arm and mineral-free negative control omitted KH2PO4, with ammonium phosphate adjusted to balance
    phosphorus against the complete-medium positive control. This does not establish identical nitrogen
    conditions. Agar, cellophane and potentially the inoculum supplied residual potassium; depleted does
    not mean potassium-free. Five biological replicates per condition supplied elemental and biomass measurements;
    five per condition were sequenced, although ten were initially allocated to RNA extraction. This plant-free
    laboratory assay is not an industrial extraction process or demonstrated nutrient transfer to plants.
  evidence:
  - source_ref: pinzari_2024
    supports: support
    explanation: Methods 2.1–2.3, Results 3.3 and Figure 1b1–b3 document phlogopite surfaces before and
      after fungal exposure, including furrows and clustered deposits. The comparison is with initial
      material, not an aged, fungus-free phlogopite arm. The image does not identify a crystalline secondary
      mineral or quantify dissolution. Muscovite and vermiculite panels belong to separate substrate arms.
  - source_ref: pinzari_2024_si
    supports: support
    explanation: Methods S1–S3 and Figure S1 establish the organism-checking procedure, experimental arms,
      specimen provenance and preparation. The phlogopite structural formula is (Si2.75Al1.25)(Al0.14Mg2.09Fe2+0.49Ti0.17)(K0.98)O10(OH)2,
      with tetrahedral, octahedral and interlayer groups respectively. This is a specimen composition
      rather than an ideal endmember. The stated lack of XRD-detected accessory minerals has no reported
      quantitative trace-phase detection limit. KCl exchange applied only to vermiculite, not to phlogopite.
  - source_ref: pinzari_2024
    supports: partial
    explanation: Table 3 reports mycelial potassium concentrations of 8.64 ± 2.91 micrograms per gram
      dry mycelium for phlogopite and 5.52 ± 1.69 for the depleted control (means ± SD, n=5), both statistical
      group c under ANOVA/Tukey. The apparent numerical increase therefore does not establish enhanced
      potassium acquisition. Neither these concentrations nor the authors’ extraction/assimilation terminology
      are a fraction of starting mineral potassium or isolated recovery yield. Methods 2.3 removed mineral
      flakes before digestion but did not separately mass-balance microscopic carryover, surface-associated
      material and intracellular elements.
  - source_ref: pinzari_2024
    supports: partial
    explanation: Table 3 assigns phlogopite-grown harvested material significantly higher aluminium and
      iron concentrations than both controls, but iron was also supplied by the medium, and the paper
      acknowledges trace aluminium contamination. These comparisons support interaction, not an element-specific
      source mass balance. Table 1 gives final pH 2.12 ± 0.09 for phlogopite versus 2.54 ± 0.42 for the
      depleted control; their statistical groups overlap. No matched aged abiotic mineral arm or pH-matched
      abiotic arm separates fungal enhancement from chemical weathering in the acidified medium. Table
      2 reports differing dry-biomass groups for phlogopite and the depleted control; this does not resolve
      the nonsignificant potassium-concentration contrast.
  - source_ref: pinzari_2024
    supports: partial
    explanation: Figures 2–5, Table 5 and Discussion 4.2 show expression responses, including the authors’
      proposed organic-acid-related weathering interpretation. They do not provide a knockout, enzyme-specific
      intervention, measured organic-acid flux or demonstrated causal partition among acid attack, physical
      damage and redox processes in this assay. The paper reports no significant upregulation of identified
      potassium-transporter genes versus the depleted control. Earlier Pinzari2022 work is related lineage,
      not an independently verified replication here. Discussion 4.1 also claims significantly increased
      aluminium for vermiculite, contrary to its Table 3 group b; that cross-substrate claim is not transferred
      to phlogopite.
  - source_ref: ncbi_paxillus
    supports: context_only
    explanation: Taxon 71150 resolves the species name. ATCC 200175 remains the strain reported and checked
      by the authors; no independent authentication of the culture stock or strain-specific NCBI identifier
      is asserted.
  - source_ref: geo_158973
    supports: context_only
    explanation: The series metadata links the same experiment and publication. It supplies provenance
      rather than another weathering observation. Raw-read reanalysis and gene-level supplemental spreadsheet
      validation are outside this record’s accepted surface and elemental comparisons.
