id: cmmmech:yttrium
name: Yttrium
material_kind: element
description: >-
  The element Y, distinct from its trivalent ion, experimental chloride salt,
  host minerals and rare-earth commodity mixtures. The dated US designation
  concerns the named yttrium mineral commodity; it does not establish criticality
  of every Y-bearing substance. Laboratory evidence concerns yttrium associated
  with washed algal biomass, without establishing intracellular transport,
  isolated-product recovery or industrial deployment.
