mechanisms:
- id: xiamen_acidophile_associated_chromium_leaching
  name: Acidophile-associated acidification and chromium solubilization
  process: bioleaching
  description: Acclimatized Acidithiobacillus cultures supplied with ferrous sulfate and elemental sulfur were associated with acidification and aqueous chromium mobilization from one tannery sludge. The combined culture/substrate treatment outperformed the reported comparisons, without isolating species synergy, proving chromium redox transformation or producing an isolated chromium product.
  context: Wang et al. sampled tannery sludge from a factory in Xiamen, Fujian, China and refrigerated it at 4 °C. Table 1 reports pH 7.10, total solids 12.88% and source-labelled Cr3+ 15.890 g/kg dry weight; ICP-based total chromium analysis does not independently establish that oxidation-state assignment. Source-reported A. ferrooxidans CGMCC NO.0727 and A. thiooxidans CGMCC NO.0759 were cultivated in improved 9K and SM media, then serially acclimatized in sludge to pH 2.0. Batch assays used 250 mL flasks containing 135 mL sludge, acidified initially to pH 6.50 with H2SO4 and conditioned for 12 h, at 28 °C and 180 rpm. Figure captions specify 2% (w/w) sludge. Section 2.3 says 15% volume inoculum, whereas Figures 1–2 say 10% (v/v); the exact inoculum fraction is unresolved. The combined arm used a 1:1 culture mixture and source-stated 4.0 g/L FeSO4 plus 3.0 g/L elemental sulfur. Single-culture arms received their corresponding energy substrate; a mixture without added substrates and uninoculated
    treatments with and without added substrates were also compared. Treatments and analyses were reported in triplicate. Daily 15 mL samples were centrifuged and filtered through 0.45 micrometre membranes before ICP-OES total-Cr analysis; evaporation loss was replenished, while cumulative sampling corrections are not explained.
  microbial: true
