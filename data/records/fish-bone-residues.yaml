    supports: partial
    explanation: The medium supplied phosphate, ferrous sulfate, sulfur and sulfuric acid before bone addition. The paper does not establish complete blank correction or a closed phosphorus mass balance, and precursor cultivation does not prove that added chemical acid ceased contributing. Model-derived concentrations in mg/L conflict with the article's percent-concentration wording, and reported solubilization percentages are not adopted as recovery yields. Figure/model/dose inconsistencies prevent confident quantitative optimization. Table 4 and historical fertilizer-limit discussion do not establish current legal compliance, comprehensive safety, agronomic efficacy or industrial deployment. No purified phosphorus product was isolated.
