id: cmmmech:xenotime-concentrate
name: Xenotime concentrate
material_kind: primary_resource
description: A mixed natural mineral concentrate represented by the laboratory feed studied by He et al. (2024), containing source-assigned xenotime, monazite, zircon, almandine and ilmenite. Its deposit, supplier and concentration history are not specified in the reviewed article and supplement. Particle counting and density conversion estimated about 82.0 wt% xenotime and 2.7 wt% monazite; these are sample-specific phase estimates, not measured product purity. The feed is distinct from the xenotime-(Y) mineral species, monazite species, elemental rare earths, a rare-earth commodity and a secondary waste resource. No criticality designation is inherited from its constituent elements.
sources:
- id: he2024
  title: 'He Y, Ma L, Liang X, Li X, Zhu J and He H (2024). Resistant rare earth phosphates as possible sources of environmental dissolved rare earth elements: Insights from experimental bio-weathering of xenotime and monazite. Chemical Geology 661:122186. DOI 10.1016/j.chemgeo.2024.122186; complete 56-page GFZ author postprint including repository cover, Figures 1-7 and Tables 1-3.'
  url: https://doi.org/10.1016/j.chemgeo.2024.122186
  accessed_on: '2026-10-12'
- id: he2024_supplement
  title: He et al. (2024), original publisher Supplementary Materials, 16 pages, Figures S1-S7, Tables S1-S8 and Text S1. Actual item captions are used; the page-2 contents list has inconsistent figure and table numbering.
  url: https://ars.els-cdn.com/content/image/1-s2.0-S0009254124002663-mmc1.pdf
  accessed_on: '2026-10-12'
- id: ncbi_thuringiensis
  title: NCBI Taxonomy 1428, Bacillus thuringiensis, species in the Bacillus cereus group. This maps the authors' species name and does not independently identify their experimental isolate.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=1428&mode=Info
  accessed_on: '2026-10-12'
- id: uniprot_bacillus_thuringiensis_organic_acids
  title: 'UniProtKB reference proteome UP000194143 (Bacillus thuringiensis, NCBITaxon:1428): Citrate synthase (CAB88_23625, UniProtKB:A0A0K0QI82), Malate dehydrogenase (mdh / CAB88_23615, UniProtKB:A0A0B5XLM5), and L-lactate dehydrogenase (ldh / CAB88_25135, UniProtKB:A0A0K0QJ28).'
  url: https://www.uniprot.org/uniprotkb?query=(proteome:UP000194143)+AND+(accession:A0A0K0QI82+OR+accession:A0A0B5XLM5+OR+accession:A0A0K0QJ28)
  accessed_on: '2026-11-10'
mechanisms:
- id: bacillus_concentrate_bioweathering
  name: Bacterial enhancement of rare-earth mobilization from mixed phosphate concentrate
  process: bioleaching
  description: A culture identified by the authors as Bacillus thuringiensis enhanced aqueous rare-earth release from the mixed concentrate relative to corresponding abiotic controls. Unbuffered cultures acidified strongly; enhanced release also occurred in MES-buffered medium near pH 6. Metabolite profiles and separate organic-acid leaching assays support a contribution from proton attack and organic ligands, without resolving each metabolite's contribution in the living culture. This is laboratory bio-weathering and mobilization, with partial immobilization in secondary precipitates, not an isolated rare-earth product or an industrial recovery process.
  context: The isolate came from topsoil at the Renju regolith-hosted rare-earth deposit in Guangdong, China; that location is not established as the concentrate's origin. Section 2.2 refers to sequence comparison by BLAST but supplies no isolate accession or independently verifiable sequence in the reviewed article and supplement. Concentrate was crushed and sieved to 48-74 micrometres, washed ultrasonically with ethanol and ultrapure water and freeze-dried. Assays used 0.5 g of sterile feed and 100 mL medium in 250 mL flasks, approximately 1e6 CFU/mL initially, 180 rpm and 25-28 degrees C for 30 days. Cells were harvested in exponential phase and washed three times. Medium contained, in g/L, glucose 10, NH4Cl 1, MgSO4.7H2O 1 and KCl 0.2, initially pH 6, with or without 20 mmol/L MES. No additional phosphorus was supplied. Each medium had a biotic feed arm, an abiotic feed control and a cells-only control. Time-course measurements used three replicates; metabolomics on days 4, 8 and 15
    used six biotic-feed and five cells-only replicates. CFU counts exclude attached cells. Aqueous elemental analyses used centrifuged, 0.22-micrometre-filtered samples and ICP-MS. Separate chemical tests used 0.1 g feed in 20 mL of HCl or 1 mmol/L organic-acid solution, initial pH 3, 5 or 6, at the same temperature and agitation for 96 h in triplicate. These chemical assays were not a 30-day pH-trajectory-matched replacement for the biological experiment.
