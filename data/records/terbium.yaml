id: cmmmech:terbium
name: Terbium
material_kind: element
description: >-
  The element Tb, distinct from its dissolved ions, salts, host minerals,
  phosphors and waste streams. The dated US designation concerns the named
  terbium mineral commodity; it does not assign criticality to every
  Tb-bearing material. The curated mechanism is a laboratory screening
  observation using lyophilized cyanobacterial biomass and a synthetic
  terbium solution, without demonstrated isolated-product recovery.
