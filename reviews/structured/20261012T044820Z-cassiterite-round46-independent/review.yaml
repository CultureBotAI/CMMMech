limitations:
- The source contradicts itself on flotation pH, conditioning duration and biomass-to-cell-count
  conversion; the reviewer does not repair those values.
- Post-cultivation sterilization is reported but no viability assay or sterilization
  temperature is given; no active-metabolic claim follows.
- Missing zero-biomass flotation arm, gangue-selectivity and closed tin balance prevent
  a quantified microbial advantage, isolated-metal yield or product-grade conclusion.
- Taxon verification used actual same-session issuing-source HTML; reviewer live extraction/API
  limitations are disclosed. The strain accession remains unavailable.
- Notice and dedup searches are bounded; nine unavailable referenced roots and undecoded
  binaries are not claimed searched exhaustively.
