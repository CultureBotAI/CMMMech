    url: https://www.rruff.net/doclib/am/vol51/AM51_651.pdf
    accessed_on: '2026-10-24'
mechanisms:
  - id: abiotic_tga_dta_dehydration_desulfation
    name: Abiotic thermal dehydration, basal spacing contraction, and TGA/DTA desulfation of coconinoite
    process: other
    description: >-
      Low-temperature dehydration of coconinoite at 135–215 °C with contraction
      of its basal X-ray spacing from 11.05 Å to 8.49–8.18 Å and elevation of
      refractive indices (measured on sample EVC-6 after the reversible 2.5 h
      treatment at 135 °C: alpha = 1.605(5), calculated beta = 1.630, gamma =
      1.645(5), 2V = 75 ± 5°), followed in Chevenard thermogravimetric analysis
      (514 mg of sample 1715 heated 22–982 °C) and Eberhard DTA by complete
      dehydration (23.7 wt% water-associated loss through 450 °C; double
      endotherm at 150–250 °C) and high-temperature sulfur-oxide-associated mass
      loss (5.3 wt% between 600 and 850 °C; endotherm near 800 °C, described as
      SO2 loss on p. 655 and SO3 loss on p. 657; step losses sum to 29.0 wt%
      whereas Fig. 2 separately reports 28.7 wt% total loss by 982 °C).
    context: >-
      Abiotic laboratory oven heating, Chevenard thermogravimetric analysis
      (TGA, 22–982 °C), and Eberhard differential thermal analysis (DTA); no
      microbial, enzymatic, or bioleaching mechanism was tested or reported in
      Young, Weeks, and Meyrowitz (1966).
    microbial: false
    evidence:
      - source_ref: young_1966_coconinoite
        supports: support
        explanation: >-
          Oven heating of coconinoite sample EVC-6 at 135 °C for 2.5 hours
          reversibly dehydrates the mineral, raising refractive indices to alpha
          = 1.605(5), calculated beta = 1.630, gamma = 1.645(5) (2V = 75 ± 5°,
          Table 1, p. 655) and contracting the basal X-ray spacing from 11.05 Å
          to 8.49 Å (and to 8.30 Å at 174 °C and 8.18 Å at 215 °C), while
          Chevenard thermogravimetric analysis (22–982 °C on 514 mg of sample
          1715) and Eberhard DTA record a 23.7 wt% water-associated loss through
          450 °C (double endotherm at 150–250 °C; distinct from the 23.4 wt%
          chemical-analysis H2O total of Jomac sample T-J2-53) followed by a 5.3
          wt% sulfur-oxide-associated mass loss from 600 to 850 °C (endotherm
          near 800 °C, referred to as SO2 on p. 655 and SO3 on p. 657; the two
          step losses sum to 29.0 wt%, whereas Fig. 2 separately states 28.7 wt%
          total loss by 982 °C, pp. 654–657, 663).
