id: cmmmech:moolooite
name: Moolooite
material_kind: mineral
description: Moolooite is an approved copper oxalate mineral, IMA 1980-082, listed as Cu(C2O4).nH2O in the September 2026 IMA compilation. The variable hydration is retained rather than treating every specimen as a measured monohydrate. It is distinct from elemental copper, other copper oxalates such as wheatleyite, and the heterogeneous ore used in the experiment below. No criticality designation is inherited from copper.
