assessments:
- assessment_id: identity
  area: identity
  topic: Mineral species and composition
  outcome: supported
  summary: The species boundary is supported.
  details: Paramontroseite is grandfathered G, 1955, ideal VO2 in the orthorhombic
    Pbnm form; it is not every synthetic VO2 polymorph. The year denotes original
    description, not an approval identifier. Neither elemental vanadium nor a mixed
    ore is the target.
  target_ids:
