id: cmmmech:igelstromite
name: Igelströmite
material_kind: mineral
description: >-
  Igelströmite (IMA 2021-035) is an IMA-accepted anhydrous iron(III)–antimony(III)–lead(II)
  oxide mineral of the minium group (schafarzikite subgroup, general formula
  MX2O4) with September 2026 IMA-CNMNC Master List ideal formula Fe3+(SbPb)O4
  (PDF p. 100, status A; written Fe3+(Sb3+Pb2+)O4 in the article title/Abstract
  and Fe(SbPb)Sigma=2O4 in Section 4, p. 314; IMA symbol Ig; ideal composition
  PbO 49.73 wt%, Sb2O3 32.48 wt%, Fe2O3 17.79 wt%, total 100 wt%). Described by
  Holtstam, Langhof, Friis, Karlsson, and Erambert (2024) from the Hindenburg
  working (150 m level) of the Långban Långban-type Fe–Mn skarn deposit (59.85°
  N, 14.26° E), Filipstad district, Värmland Province, Sweden (named after
  Swedish mineralogist Lars Johan Igelström, 1822–1897; holotype specimen
  deposited in the Department of Geosciences, Swedish Museum of Natural History,
  Stockholm, under catalogue no. GEO-NRM 19255056, with single-crystal mount KNR
  44278 at the Natural History Museum, University of Oslo, pp. 311–312). Occurs
  as tiny lenticular crystals forming compact rounded aggregates up to 1 mm
  across within late low-temperature hydrothermal calcite-filled fractures
  cutting finely banded hausmannite–calcite–dolomite–phlogopite ore, closely
  associated with calcite and native lead (which forms intergrowths, inclusions,
  and direct replacements of igelströmite, with accessory långbanite and a
  romeite-group mineral in the matrix, pp. 312–313, Fig. 2a–b). Macroscopically
  dark reddish-brown to black with submetallic lustre, translucent in thin edges,
  yellowish-brown to dark-brown streak, Mohs hardness 3–4, brittle with uneven to
  conchoidal fracture, distinct/good {110} cleavage, non-fluorescent under UV,
  and Dcalc = 6.33(1) g/cm3 from the empirical formula and single-crystal unit
  cell (Section 3, p. 313, and Table 4, p. 315). In reflected light it is
  greyish-white, weakly bireflectant, nonpleochroic, with weak anisotropy
  (greyish to brownish rotation tints) and abundant dark-brown to red internal
  reflections; reflectance values in air (R2, R1, Section 3, p. 313, where the
  spectral window is printed as "400–70 nm range" for 400–700 nm, and Table 2, p.
  314) at the four COM wavelengths are 16.1, 15.2% (470 nm), 15.1, 14.4% (546
  nm), 14.9, 14.2% (589 nm), and 14.8, 14.1% (650 nm). Micro-Raman measurements
  (532 nm laser) produced no usable spectrum due to laser-induced breakdown of
  the sample surface (Section 6.1, p. 315), whereas 57Fe Mössbauer spectroscopy
  with a 57Co rhodium-matrix point source (Section 6.2, pp. 316–317, Fig. 4)
  yielded a single paramagnetic quadrupole doublet with centre shift CS = 0.42(2)
  mm/s, quadrupole splitting QS = 0.89(3) mm/s, and FWHM = 0.67(4) mm/s,
  confirming exclusively octahedrally coordinated high-spin Fe3+. Mean of 12 WDS
  electron-microprobe point analyses (CAMECA SX100, 15 kV, 15 nA, 2–10 um beam;
  Section 4, pp. 313–314, Table 3, p. 315) yielded Sb2O3 42.89 wt% (2sigma 5.41),
  PbO 34.42 (2sigma 4.53), Fe2O3 11.05 (2sigma 1.73) and FeO 1.14 (2sigma 1.92)
  (recast from total Fe for charge balance on 3 cations and 4 O), MnO 4.78
  (2sigma 1.57), As2O3 3.88 (2sigma 1.41), MgO not detected, printed Total =
  98.17 wt% (arithmetic sum of rounded means = 98.16 wt%), corresponding on 3
  cations and 4 O to the empirical formula
  (Fe3+0.59Mn2+0.29As3+0.06Fe2+0.06)Sigma=1.00(Sb3+1.24Pb2+0.65As3+0.11)Sigma=2.00O4.
  Tetragonal, space group P42/mbc (no. 135), Z = 4 (Section 5, pp. 314–318,
  Tables 4–7, 10–11, Fig. 5): single-crystal MoKalpha XRD refinement on a 0.007 x
  0.028 x 0.041 mm fragment (Rigaku Synergy-S with HyPix-6000HE detector;
  MoKalpha wavelength printed as "lambda = 0.71703 Å" for 0.71073 Å in Section
  5.1 on p. 314; 411 reflections with Fo > 4sigma(Fo) out of 500 unique, 6571
  collected, Rint = 3.93%, R1 = 3.73%, R1(all) = 4.60%, wR2 = 6.66%, GoF = 1.315,
  Table 4, p. 315) gives a = 8.4856(2) Å, c = 6.0450(3) Å, V = 435.27(3) Å3, with
  [001] chains of edge-sharing M(Fe)O6 octahedra (4d site, Fe–O1 = 2.020(4) Å x
  2, Fe–O2 = 2.054(4) Å x 4, <Fe–O> = 2.043 Å, BVS = 2.60 v.u., refined SOF =
  0.978(17) Fe, site composition Fe3+0.59Mn2+0.29Fe2+0.06As0.06 with 25.22 SXRD
  vs 26.13 EPMA e-, Tables 5–7, 10; note Table 5 header on p. 316 prints "Site |
  x | y | x" with a duplicate "x" for "z") cross-linked via corner-sharing chains
  of trigonal-pyramidal X(Sb,Pb)O3 polyhedra (8h site, refined SOF 0.76(3) Sb +
  0.24(3) Pb, Sb/Pb–O1 = 2.024(3) Å x 2, Sb/Pb–O2 = 2.067(5) Å, <Sb/Pb–O> = 2.038
  Å, plus 2.660(5) Å, BVS = 2.40 v.u.; Table 6 lists site composition
  Sb0.625Pb0.325As0.055 summing to 1.005 per site = 2.01 pfu, 58.44 SXRD vs 60.34
  EPMA e-) surrounding stereoactive 5s2/6s2 lone-pair tunnels; Gandolfi CuKalpha
  powder XRD (18 reflections, Section 5.2, pp. 314–315, Table 11, p. 318) refines
  to a = 8.4777(5) Å, c = 6.0417(6) Å, V = 434.23(5) Å3, with seven strongest
  lines [d in Å (Irel; hkl)] at 3.218 (100; 211), 2.681 (37; 310), 1.9471 (28;
  330, 411), 1.6746 (24; 313), 4.240 (19; 200), 2.456 (19; 202), and 3.015 (15;
  002). Distinct from co-described manganoschafarzikite (Mn2+Sb3+2O4, IMA
  2022-129), schafarzikite (Fe2+Sb3+2O4), and minium (Pb2+2Pb4+O4); no
  criticality designation for igelströmite itself, no microbial or biological
  mechanism, and no industrial recovery yield are asserted.
