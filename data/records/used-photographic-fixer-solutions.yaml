      explanation: Section 2.2 vs Table 1 vs Section 2.7 conflict on whether 2.8 g Ag/L and 18.5 g thiosulfate/L represent undiluted or 1:10 diluted fixer (versus ~280 mg Ag/L after bacterial treatment), and the endpoint of the uninoculated fixer control is not reported.
  - source: thiosulfate_depleted_conditioned_fixer_liquor
