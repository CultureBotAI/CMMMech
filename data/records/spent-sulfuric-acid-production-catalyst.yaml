id: cmmmech:spent-sulfuric-acid-production-catalyst
name: Spent sulfuric-acid-production catalyst
material_kind: secondary_resource
description: >-
  Used catalyst from sulfur-dioxide oxidation in sulfuric-acid production,
  represented here by vanadium-bearing material from a copper-smelter acid unit.
  This process-defined secondary resource is distinct from petroleum
  hydrodesulfurization catalysts, automotive converters, fresh catalyst and its
  constituent elements or mineral phases. The selected silica-rich feed does
  not define every spent acid-plant catalyst. No constituent-element criticality
  designation is inherited.
sources:
