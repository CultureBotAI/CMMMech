id: cmmmech:aragonite
name: Aragonite
material_kind: mineral
description: >-
  Orthorhombic calcium carbonate mineral with ideal formula CaCO3, distinct
  from calcite and vaterite polymorphs, hydrated monohydrocalcite, the calcium
  element and carbonate-bearing resources. The September 2026 IMA list gives
  grandfathered status and original-description year 1791, not a new-mineral
  approval accession. Laboratory bacterial mineralization supports aragonite
  formation under specified solution conditions; it does not establish a
  criticality designation, a purified critical-metal product or industrial use.
