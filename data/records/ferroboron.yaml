id: cmmmech:ferroboron
name: Ferroboron commodity
material_kind: commodity
description: Iron-boron master-alloy products supplied as alloying additions, rather
  than pure boron, borate ore or a single stoichiometric iron boride. ISO 10386:1994
  identifies ferroboron supplied for steelmaking and foundry use. Bomet also describes
  its boron-iron products as additions for rare-earth permanent magnets and amorphous
  materials, and publishes several enterprise grades under BMTQB2016, document BMT16-204.
  This grade-dependent composition is not represented by a single FeB formula or a universal
  boron-purity cutoff. The ISO catalogue scope was inspected, but its complete standard
  was not acquired; the manufacturer table does not substitute for that standard. Ferroboron
  is a specific traded alloy family and is not asserted to exhaust the original EU metallurgy-grade
  boron designation. No criticality designation or microbial production mechanism is
  assigned.
