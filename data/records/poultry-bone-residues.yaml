id: cmmmech:poultry-bone-residues
name: Poultry-bone residues
material_kind: secondary_resource
description: Phosphorus-bearing poultry-bone residues investigated as a secondary feed for nutrient reuse,
  represented by cooked or boiled poultry bones ground and sieved to below 1 mm in the selected laboratory
  studies. The organic-mineral feed is distinct from elemental phosphorus, purified hydroxyapatite, phosphate
  rock, manure and bone-incineration ash. The animal species, supplier and exact cooking procedure are
  not reported; poultry is not silently narrowed to chicken. Material composition and treatment effects
  remain specimen-specific; no constituent criticality designation is inherited.
