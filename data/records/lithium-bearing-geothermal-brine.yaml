mechanisms:
- id: ureolytic_brine_cation_pretreatment
  name: Ureolytic carbonate precipitation during lithium-brine pretreatment
  process: biomineralization
  description: Prepared S. pasteurii DSM 33 biomass with added urea raised pH and produced carbonate-bearing solids while measured Ca, Mg, Mn and Sr concentrations declined in one natural geothermal brine. Lithium largely remained in the measured solution. This is a laboratory impurity-removal pretreatment observation, not isolated lithium recovery or demonstrated improvement in downstream direct lithium extraction. The authors assigned calcite, vaterite and magnesite in mixed solids by XRD; phase-specific Sr/Mn incorporation and a uniquely cellular precipitation pathway were not established.
  context: Cells grown in tryptone soy broth with 500 mM urea at 28 degrees C and 180 rpm were harvested in mid-log phase and washed with phosphate-buffered saline. The natural brine was not sterilized and was treated under reported non-growth conditions with 500 mM urea, initial OD600 values 0.05-0.4, 100 mL in 250 mL flasks, 28 degrees C, static incubation for 24 h, in triplicate. Figure 1 is the main comparison; supporting figures show higher inocula and a separate no-added-cell control. The reported Bacillus subtilis ATCC-2385 comparator and brine-plus-urea control are retained as source descriptions, without independently resolving that comparator strain accession. No matched-pH chemical or killed-biomass comparison was reported, and unsterilized brine is not an axenic system. ICP-OES measured elemental concentrations, but the main methods do not clearly specify solid/liquid separation for every metal time-point aliquot; supplementary Table S2 omits the lithium wavelength. Only qualitative
    treatment comparisons are curated. The paper does not demonstrate an integrated industrial process, a lithium carbonate product, or a lithium mass-balance recovery yield.
