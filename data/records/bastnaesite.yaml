id: cmmmech:bastnaesite
name: Bastnaesite fluorocarbonate family
material_kind: mineral_group
description: Bastnaesite, also spelled bastnäsite, is represented here as the fluorocarbonate family with ideal composition REE(CO3)F, encompassing the separately named bastnäsite-(Ce), -(La), -(Nd) and -(Y) species in the September 2026 IMA mineral list. This family-level record does not assert one member species or cover all hydroxyl-bearing or other members of the broader structural group. The experimental material below is a Ce- and La-rich natural mineral separate, not a pure endmember, a whole bastnaesite-bearing rock, an elemental rare earth, or a recovered commodity. Bulk oxide composition alone does not establish its member-species assignment. No constituent criticality designation is inherited.
