id: cmmmech:pertlikite
name: Pertlikite
material_kind: mineral
description: >-
  Pertlikite is an approved tetragonal mineral of the voltaite group,
  IMA 2005-055, represented in the September 2026 IMA list as
  K2(Fe(II),Mg)2(Mg,Fe(III))4Fe(III)2Al(SO4)12(H2O)18.
  It is distinct from cubic voltaite and magnesiovoltaite, rather than
  a synonym for any magnesium-bearing voltaite-group material.
  Ertl et al. (2008) characterized natural type material from Madeni
  Zakh, Iran, using portions of a single crystal for diffraction,
  optical examination and electron-microprobe analysis, with additional
  grains for bulk hydrogen analysis. Tetragonal I41/acd symmetry and
  unequal Fe/Mg site occupancies distinguish the studied crystal from
  the cubic structural model. The formula combines microprobe chemistry,
  fitted Mossbauer spectral areas and structure refinement; it is not
  a direct assay of every site or oxidation state. Spectral areas were
  not corrected for different recoil-free fractions. Measured water
  was 15.3 wt.% with estimated 10% relative uncertainty, whereas
  16.73 wt.% in the composition table was estimated from the structure.
  Powder and single-crystal cell dimensions differ beyond their stated
  precision, and hydrogen positions around disordered Al-bound waters
  were not located. A proposed origin through pyrite decomposition
  is geological interpretation, not an observed reaction or microbial
  mechanism. No extraction, recovery yield or criticality designation
  is curated.
