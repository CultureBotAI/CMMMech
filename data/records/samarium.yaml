id: cmmmech:samarium
name: Samarium
material_kind: element
description: The element Sm, distinct from Sm(III), samarium nitrate, mineral species, alloys
  and waste streams. The dated US designation concerns the named samarium mineral commodity,
  without assigning that designation to every Sm-bearing material. The mechanism concerns laboratory
  culture-associated depletion from a synthetic solution and qualitative biomass enrichment,
  not a purified samarium product or industrial process.
