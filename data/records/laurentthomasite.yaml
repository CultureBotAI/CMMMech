id: cmmmech:laurentthomasite
name: Laurentthomasite
material_kind: mineral
description: >-
  Laurentthomasite (IMA 2018-157, approved April 2019) is an IMA-accepted
  anhydrous magnesium-potassium-beryllium-aluminium milarite-group (osumilite-type)
  double-ring cyclosilicate mineral (Strunz 9.CM.05) with September 2026
  IMA-CNMNC Master List ideal formula Mg2K(Be2Al)Si12O30 (PDF p. 122, status A;
  printed with a missing trailing zero as Mg2K(Be2Al)Si12O3 in Table 1 on p. 357
  of Ferraris et al. 2020), representing the anhydrous Mg-dominant A-site
  analogue of milarite Ca2K(Be2Al)Si12O30 and related to oftedalite
  ScCaKBe3Si12O30 and friedrichbeckeite Mg2NaKBe3Si12O30. Described by Ferraris,
  Pignatelli, Cámara, Parodi, Pont, Schreyer, and Wei (2020) from pockets in a
  coarse-grained quartz-syenite pegmatite (~550 Myr Pan-African granitoid hosted
  in the 2550–2500 Myr Antananarivo block reworked at ~750–500 Myr) in the
  Ihorombe region, Fianarantsoa Province, ~80 km northeast of Betroka
  (23°16'03" S, 46°05'49" E), southern Madagascar (discovered in late 2017 by
  Laurent Thomas; holotype MNHN_MIN_218.1_a and cotypes MNHN_MIN_218.1_b and
  MNHN_MIN_218.1_c deposited at the Muséum National d'Histoire Naturelle, Paris,
  France, pp. 355–357). Occurs as euhedral tabular hexagonal crystals up to 15 mm
  wide and 5 mm thick flattened on {0001} and bounded by {10-10} prism and {0001}
  pinacoid forms (sometimes forming clusters up to 2 cm on quartz or floating in
  cavity-filling clay), associated with orthoclase (1–5 cm), smoky to grey quartz
  (1–3 cm), pale green prismatic hexagonal apatite (0.2–2 cm), colourless to
  yellow hexagonal phenakite (0.2–1.5 cm), pale blue prismatic beryl (0.2–2 cm),
  albite, magnetite, and sub-millimetric SEM-EDS-identified thortveitite
  (Sc2Si2O7), cheralite (CaTh(PO4)2), and microscopic Nb–Ta–W phases, while
  hosting aligned micrometric inclusions of an Fe2+-rich phase (pp. 356–358).
  Physical and optical characterization (pp. 355–359, Figs. 1–4) shows
  transparent crystals with vitreous lustre, light blue streak, non-fluorescence,
  Mohs hardness ~6, brittle tenacity with irregular to conchoidal fracture, poor
  {0001} cleavage, Dmeas = 2.67(8) g/cm3 (Archimedes balance across 5 fragments),
  Dcalc = 2.66(4) g/cm3, uniaxial (+) optics at 589 nm with omega = 1.540(2) and
  epsilon = 1.545(3), Gladstone–Dale compatibility index 1 - (KP/KC) = 0.028
  (excellent), and strong cobalt-blue (along [0001]) to green-yellow (along
  [1000]) dichroism attributed by 295 K 57Fe Mössbauer spectroscopy (backscattering
  MIMOS II, Section 3, p. 356, and Section 4.1, pp. 357–358, Fig. 3) to
  intervalence charge transfer between octahedral Fe2+ at the A site (Doublet 1:
  IS = 1.15 mm/s, QS = 2.51 mm/s, FWHM = 0.25 mm/s, 92.0% area) and tetrahedral
  Fe3+ at the T(2) site (Doublet 2: IS = 0.14 mm/s, QS = 1.66 mm/s, FWHM = 0.34
  mm/s, 5.8% area, plus 2.2% area from inclusion Fe2+ at IS = 1.07 mm/s, QS =
  1.00 mm/s, FWHM = 0.26 mm/s; normalized laurentthomasite Fe2+/(Fe2+ + Fe3+) =
  94 ± 2%), while micro-Raman spectroscopy (514.5 nm, Section 4.2, pp. 358–359,
  Fig. 4) confirms the absence of H2O/OH bands above 1300 cm-1 and exhibits
  [T(1)12O30] double-ring modes at 1145, ~550, and ~480 cm-1 with a split band at
  263 and 288 cm-1. Combined 40-point WDS electron-microprobe analysis (Cameca SX
  Five, 15 kV, 10 nA, 5 um beam), ICP-OES/ICP-MS (on 120 mg of pure crystals for
  Be, Y, and trace elements), and Mössbauer Fe partitioning (Section 5.1, pp.
  357, 359, Tables 2–3) yielded SiO2 73.10 wt% (range 71.29–74.90, SD 0.41), BeO
  6.02 (ICP-MS, <5% uncertainty), K2O 4.30 (3.92–4.67, SD 0.03), MgO 4.01
  (3.80–4.09, SD 0.07), Sc2O3 3.78 (3.70–3.86, SD 0.05), Al2O3 3.11 (3.03–3.20,
  SD 0.05), FeO 2.69 (printed range 2.50–2.67, where the printed mean 2.69 wt%
  slightly exceeds the printed upper range bound 2.67 wt%, SD 0.07), MnO 1.91
  (1.77–2.04, SD 0.07), Y2O3 0.22 (ICP-MS, <5% uncertainty), Fe2O3 0.19
  (calculated from FeO and Mössbauer ratio), BaO 0.16 (0.09–0.23, SD 0.04), Na2O
  0.15 (0.10–0.18, SD 0.02), CaO 0.07 (0.06–0.08, SD 0.01), ZnO 0.04 (0.01–0.07,
  SD 0.03), TiO2 0.02 (printed range 0.02–0.019, SD 0.01), total 99.77 wt% (plus
  Table 3 ICP-MS trace elements in ug/g including Y 1754, Rb 1405, Yb 922, Lu
  321, Zn 176, Er 91.2, Cs 82.9, Tm 43.4, Ga 37.3, As 36.6, Dy 29.4, Sr 21.2, Ni
  15.3, Ho 12.8, Zr 7.81, In 7.72, Hf 6.59, Gd 5.56, Cr 5.5, Nd 3.88, Ce 3.62, Co
  3.49, V 3.4, Sm 3.07, Cu 3.0, Nb 2.99, Sn 2.36, Tb 2.32, Ge 2.15, Ta 2.02, La
  1.50, Th 0.87, Pb 0.85, Pr 0.749, U 0.70, Sb 0.57, Eu 0.239, Bi 0.07, Cd 0.07),
  giving on 30 anions pfu the empirical formula
  (Mg0.86Sc0.54Fe2+0.35Mn0.26)Sigma2.01(K0.89Na0.05Y0.02Ca0.01Ba0.01)Sigma0.98[(Be2.35Al0.50Mg0.11Fe3+0.03)Sigma2.99(Si11.90Al0.10)O30]
  and simplified formula (Mg,Sc)2(K,Na)[(Be,Al,Mg)3(Si,Al)12O30] (ideal
  Mg2K(Be2Al)Si12O30 requires SiO2 75.92, MgO 8.49, Al2O3 5.37, BeO 5.27, K2O
  4.96, total 100 wt%). Hexagonal, space group P6/mcc (no. 192), Z = 2 (Sections
  5.2–5.3, pp. 359–363, Tables 4–9): Rietveld powder XRD refinement (CuKalpha1,
  Rp = 4.9%, Rwp = 6.5%, p. 359) gives a = 9.95343(6) Å, c = 14.15583(8) Å, V =
  1214.54(1) Å3 (ten strongest observed PXRD lines with I >= 2 in Table 5, p.
  361: 3.171 (10)(211), 4.064 (8)(112), 2.881 (8)(114), 4.965 (6)(110), 2.732
  (4)(204), 3.533 (3)(004), 7.055 (2)(002), 4.302 (2)(200), 3.675 (2)(202), and
  1.825 (2)(315) Å, whereas the Abstract on p. 355 prints 2.732 – (8) – 204 in
  place of 2.881 – (8) – 114 before 2.732 – (4) – 204 and omits 1.825 (2)(315));
  single-crystal CuKalpha XRD refinement (430 reflections with Io > 2sigma(I) out
  of 431 independent, R1 = 1.89%, wR2 = 4.76%) is reported in Table 6 (p. 362) as
  a = 9.95800(10) Å, c = 14.14920(10) Å, V = 1215.085(19) Å3 for crystal size
  0.40 x 0.29 x 0.17 mm, whereas Section 5.2 prose (pp. 359–360) prints a =
  9.95800(7) Å, c = 14.114916(11) Å (a digit-duplication typo for 14.14916(11) Å,
  as confirmed by the reported volume), V = 1215.081(15) Å3 for crystal size 39.6
  x 28.7 x 16.9 um. Distinct from milarite, oftedalite, friedrichbeckeite,
  almarudite, and elemental beryllium or scandium; no criticality designation for
  laurentthomasite itself, no microbial or biological mechanism, and no
  industrial recovery yield are asserted.
