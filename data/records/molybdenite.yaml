  evidence:
  - source_ref: francisco2007
    supports: support
    explanation: Experimental methods on pages 1095-1096 and the liquid-phase results on page 1098 report Mo below 2 mg/L, the stated detection limit, in all assays. Mo was measured by inductively coupled plasma spectrometry in supernatant after centrifugation; the instrument subtype is not specified. This censored solution concentration is neither zero nor a recovered fraction of feed molybdenum. No complete molybdenum mass balance, isolated product yield or quantified concentrate upgrade is supplied.
  - source_ref: francisco2007
    supports: support
    explanation: Figures 5-6 identify the starting mixed phases and show residue patterns after 22 days. The authors assign disappearance of pyrite and pyrrhotite peaks in inoculated arms, while corresponding uninoculated residues retain pyrite peaks; molybdenite peaks remain. This is qualitative phase evidence for culture-associated companion-sulfide removal. It does not quantify absolute mineral consumption, demonstrate direct enzymatic attack or establish oxidation of the molybdenite fraction.
  - source_ref: francisco2007
    supports: partial
    explanation: The solid-phase paragraph on page 1098 says that inoculated samples showed no mineralogical changes after the period just discussed. The temporal wording may mean no further changes after day 22, consistent with earlier companion-sulfide loss, rather than no change from the starting material. Its comparison baseline is not explicit, so a definite source contradiction is not inferred. Qualitative XRD does not establish absolute complete oxidation. The same page reports persistent molybdenite peaks through 43 days in both inoculated and uninoculated flasks, but explicitly labels the final inoculated patterns as data not shown.
  - source_ref: francisco2007_supplement
    supports: support
    explanation: Original Figure 2S shows molybdenite peaks in 43-day uninoculated residues without added iron, with Fe(II), and with Fe(III). It does not show the missing 43-day inoculated patterns. Figure 1S concerns oxygen-consumption kinetics of the heterogeneous specimen and cannot establish molybdenite oxidation independently of its iron sulfides.
  - source_ref: francisco2007
    supports: partial
    explanation: Page 1097 and Figure 2 describe an early pH rise toward 4 and periodic acid corrections over approximately the first 15 days, followed by differing culture/control trajectories and eventual pH 1.7-1.9 after about day 25. The controls therefore do not isolate a pH-independent cell effect. Figure captions label the Fe(III) control as 30 mmol/L Fe(III), whereas the methods describe 30 mmol/L ferric sulfate, leaving the stated addition basis ambiguous. The result is confined to this heterogeneous feed and assay; it does not establish universal resistance of molybdenite to microbial or chemical leaching under other conditions.
  - source_ref: lu2026_concentrate
    supports: context_only
    explanation: A separate laboratory comparison in Sections 2.3 and 3.3 uses the Mo-adapted consortium WZ-Q, not LR, with a mineral-processed molybdenite concentrate containing reported Mo 12.40% and S 14.25% in Table 2. Its mine origin, processing route and complete phase composition are unspecified. The 30-day assay used 250 mL flasks, 10% w/v pulp, 10% v/v inoculum and 9K medium with nominal initial pH 1.4; samples from one flask were collected every five days for filtered-residue analysis. No matched uninoculated concentrate series or flask replication is reported. The temperature, agitation and working volume are not explicitly assigned to this assay; the adjacent black-shale conditions and triplication are not transferred. WZ-Q is an unresolved community, and no isolate or taxon identifier is inferred for it. This is not a replication of the 2007 mixed-specimen assay.
  - source_ref: lu2026_concentrate
    supports: context_only
    explanation: Figure 4b labels Mo and S as percentages in leaching residue, showing a small Mo-content decline and a larger S-content decline. Section 3.3 instead describes monitoring aqueous concentrations, leaving the fraction assignment inconsistent. Section 2.4 reports residue digestion and ICP-OES. Relative residue composition without residual-solid mass, a Mo mass balance or concentrate-specific phase/speciation evidence does not demonstrate Mo extraction or the authors' proposed sulfide-to-oxide conversion. No extraction percentage or recovered product is assigned to this concentrate. The 29.7% Mo result in Figure 7 and the SEM/XPS results in Figures 12 and 17 concern separate black-shale arms and cannot supply the missing concentrate evidence.
  - source_ref: lu2026_concentrate
    supports: context_only
    explanation: Figure 4a begins near pH 1.7 despite the methods' initial pH 1.4, and the reference electrode for its potential values is unspecified. The report calls WZ-Q moderately thermophilic in the concentrate methods but does not give that assay's temperature. These method and accounting limits prevent attributing the concentrate's compositional changes to microbial activity or treating them as a refutation of the bounded LR observation. Neither study establishes industrial deployment or universal molybdenite resistance to leaching under other conditions.
