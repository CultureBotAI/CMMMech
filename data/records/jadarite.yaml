mechanisms:
- id: acidophile_jadarite_bearing_material_leaching
  name: Transient microbial enhancement of Li release from jadarite-bearing material
  process: bioleaching
  description: Inoculated jadarite-bearing material released lithium faster than uninoculated acidic medium during part of a laboratory time course. The uninoculated control reached similar dissolved Li by day 30, and sulfuric-acid-only leaching released more Li. Post-treatment XRD showed loss of jadarite-associated peaks, but other unidentified Li-bearing phases prevent attributing all dissolved lithium to this mineral species. Biofilm involvement was suggested without establishing an exclusive molecular cause.
  context: Live in-lab ore-derived culture was reported as At. ferrooxidans, without a strain accession. The species identifier normalizes the reported name to Acidithiobacillus ferrooxidans; the title and abstract spell the genus Acidiothiobacillus. This mapping does not independently identify the culture. Ground Jadar Valley material contained jadarite, dolomite and probertite, with possible unidentified Li-bearing phases. Triplicate biotic flasks ran statically at 23 degrees C for 30 days, targeting pH 1.8; addition of jadarite raised pH immediately and required repeated sulfuric acid doses. Acid additions differed between treatments, limiting attribution of the observed difference solely to biology. Methods state 2 g powder, 190 mL basal medium and 10 mL inoculum but label this 2% w/v; those amounts imply 1% w/v. The discrepancy is unresolved and no normalized yield is curated. No purified Li product or industrial heap operation was demonstrated.
