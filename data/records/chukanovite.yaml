  evidence:
  - source_ref: oloughlin_2021
    supports: support
    explanation: Section 3.3, Figures 6-8 and Tables 2-3 support the narrow phosphate-free culture-product assignment. At 140 K, Table 3 fits chukanovite relative spectral areas of 20.0 percent without AQDS and 27.4 percent with AQDS, alongside goethite. The AQDS sample's fitted chukanovite areas are 21.6 percent at 270 K and 29.0 percent at 77 K; these temperature-dependent spectral areas are not mass fractions or whole-feed recovery yields. Section 3.3 calls the pXRD evidence inconclusive, while noting a small peak near 34 degrees 2theta at day 1060. Figure 8's bladed crystallites provide compatible morphology, not independent chemical or phase proof. Residual goethite is explicitly retained.
  - source_ref: oloughlin_2021
    supports: partial
    explanation: 'The phosphate-arm assignment is internally inconsistent: Section 3.3 says no secondary mineral formation was evident with AQDS plus 500 micromolar phosphate, whereas Table 2 labels its SEM outcome Chuk and Section 4.3 states chukanovite formed with or without that phosphate addition. Table 2 calls its XRD inconclusive and its Mossbauer result not determined. No confident phosphate-arm chukanovite assignment or phosphate-specific yield is accepted here. Section 3.3 also prints initial goethite rates in micromolar/day where Table 2 gives the same numbers in millimolar/day; no exact rate is adopted.'
  - source_ref: oloughlin_2021
    supports: partial
    explanation: Section 4.1 proposes a secondary product of goethite reduction because no intermediate phase was observed. The absence of a detected intermediate does not establish a unique direct pathway. Bicarbonate production is estimated from Fe(II) and formate stoichiometry rather than measured. The reported sterile diffraction comparator, incomplete control metadata and fitted mixed-phase assignments do not establish metabolic necessity, direct enzymatic carbonate precipitation or industrial recovery. Separate feroxyhyte evidence in the corpus belongs to the same 2021 publication.
  - source_ref: oloughlin_2019
    supports: partial
    explanation: Section 4.2 explicitly reports that chukanovite was not observed in any of that study's systems. These are distinct commercial lepidocrocite experiments, including an electron-donor survey with differing observation durations and focused 62-day formate/AQDS cultures in chloride or sulfate medium at initial pH 7.5 and 30 degrees C. Their products include green-rust phases and, in other donor arms, siderite. This bounded null result limits transfer of the 2021 goethite observation; it does not refute the latter's particular long-incubation assignment. The suggestion that the 2019 incubation was too short for chukanovite is a hypothesis, not an experimentally isolated time effect.
  - source_ref: ncbi_cn32
    supports: context_only
    explanation: Resolves the repeated CN-32 strain name to NCBITaxon:319224; taxon mapping does not resolve the conflicting culture accession.
  - source_ref: atcc_cn32
    supports: context_only
    explanation: The collection identifies CN-32 as BAA-453, preserving rather than silently correcting the papers' BAA-543 attribution.
  - source_ref: atcc_es5
    supports: partial
    explanation: The printed BAA-543 accession resolves to Cellulomonas sp. ES5, so the provenance of the reported CN32 stock remains uncertain.
