mechanisms:
- id: ae104_stock_dependent_particles
  name: Stock-dependent culture-associated formation of source-assigned gold nanoparticles
  process: biomineralization
  description: Cupriavidus metallidurans AE104 cells exposed to an aqua-regia-prepared Au(III)
    solution contained particles interpreted by the authors as periplasmic gold nanoparticles.
    The commercial Au(III) stock instead produced damaged cells or no visible nanoparticles
    in the reported microscopy series. This laboratory comparison supports a preparation-dependent
    outcome, not universal reduction of every gold complex or an isolated-product recovery
    yield.
  context: AE104 is the plasmid-free derivative of CH34; the species identifier does not identify
    this derivative. Cells were cultivated aerobically in Tris-buffered mineral salts medium
    with 2 g/L sodium gluconate at 30 degrees C. The TEM protocol used two precultures at
    200 rpm, a 66-fold dilution into fresh medium, and addition of Au(III)-chloride after
    reaching 180-200 Klett units. Incubation after addition was at 100 rpm and 30 degrees
    C. Figure 2A reports 50 micromolar of the previously used, aqua-regia-prepared stock for
    72 h. Commercial HAu(III)Cl4 was Sigma-Aldrich TraceCERT, supplied as 1 g/L Au in hydrochloric
    acid; Figure 2B-D report 50 micromolar for 70 h, 15 micromolar for 21 h, and 50 micromolar
    for 30 min. The general methods describe 72 h and additional exposure/recovery experiments;
    their timings are not substituted for the labeled panels. Samples were fixed with glutaraldehyde
    and osmium tetroxide, ethanol-dehydrated, uranyl-acetate-stained, resin-embedded and sectioned
    at 80 nm. Exact final medium pH and a molecular analysis of the two stock solutions are
    not reported for this microscopy comparison.
