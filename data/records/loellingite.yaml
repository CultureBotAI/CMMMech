id: cmmmech:loellingite
name: Löllingite
material_kind: mineral
description: >-
  Löllingite, commonly written loellingite, is the orthorhombic iron arsenide
  mineral with ideal formula FeAs2. The September 2026 IMA list records it as
  grandfathered, with original-description year 1845. It is distinct from
  arsenopyrite, skutterudite, elemental arsenic and a mixed arsenic-bearing ore.
  Natural compositions need not be exact endmembers. The accepted microbial
  experiment concerns a quantified loellingite-arsenopyrite feed mixed with
  pyrite, not purified loellingite. Its flotation response does not establish
  dissolved-metal extraction, an isolated loellingite product or industrial
  deployment. No constituent-element criticality is inherited.
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 127,
      Löllingite row, and page 1 status and year definitions; FeAs2, G, 1845.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-15'
  - id: handbook_loellingite
    title: >-
      Handbook of Mineralogy. Löllingite, complete one-page entry, version 1
      (2001-2005). Orthorhombic identity, natural chemistry and safflorite-series
      context; the listed Pnnm cell and powder pattern are explicitly synthetic.
    url: https://www.handbookofmineralogy.org/pdfs/lollingite.pdf
    accessed_on: '2026-10-15'
  - id: almojadah2025
    title: >-
      Almojadah SS and Harmer SL (2025). Separation of arsenopyrite/loellingite
      and pyrite through bio-flotation by selective attachment of Leptospirillum
      ferrooxidans. Minerals Engineering 230:109440. Complete 14-page original,
      sections 2-5, Figures 1-11 and Tables 1-6.
    url: https://doi.org/10.1016/j.mineng.2025.109440
    accessed_on: '2026-10-15'
  - id: almojadah2025_fulltext
    title: >-
      Flinders University repository copy of the complete Almojadah and Harmer
      (2025) publisher original; available online 20 May 2025, volume issue
      dated September 2025, one experiment lineage.
    url: https://researchnow-admin.flinders.edu.au/ws/portalfiles/portal/159178863/Almojadah_Separation_P2025.pdf
    accessed_on: '2026-10-15'
  - id: almojadah2024_thesis
    title: >-
      Almojadah SS (2024). Investigating the Interactions between Extracellular
      Polymeric Substances (EPS) and Iron Sulfide Surfaces. PhD thesis, Flinders
      University, November 2024. Sections 3.3.2.2 and 4.2.4 (PDF pages 82-83
      and 98), Figures 4.13 and 4.15-4.17, and Tables 4.2-4.6; earlier methods
      and results from an inferred shared experiment lineage.
    url: https://flex.flinders.edu.au/file/3d891474-c382-4654-9f26-cfaf4156d95e/1/Samar%27s%20thesis%20%28Investigating%20the%20Interactions%20between%20EPS%20and%20Iron%20Sulfide%20Surfaces%29.pdf
    accessed_on: '2026-10-21'
  - id: dsm2705
    title: >-
      DSMZ catalogue, Leptospirillum ferrooxidans DSM 2705, type strain L15;
      aliases ATCC 29047 and VKM B-1339. Collection identity does not establish
      an independently sequenced culture in the flotation experiment.
    url: https://www.dsmz.de/collection/catalogue/details/culture/DSM-2705
    accessed_on: '2026-10-15'
  - id: ncbi_180
    title: >-
      NCBI Taxonomy 180, Leptospirillum ferrooxidans, species rank; DSM 2705 is
