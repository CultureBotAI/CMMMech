mechanisms:
- id: abiotic_hydrothermal_cs_ion_exchange
  name: Laboratory hydrothermal Cs+ ion-exchange conversion of natural carnotite to margaritasite
  process: other
  description: Hydrothermal reaction of 10 mg natural Colorado Plateau carnotite (0.12 wt%
    Cs2O, K2(UO2)2V2O8·nH2O, c = 6.59 A) with 0.05-0.10 g of 0.1 M CsCl aqueous solution (pH
    5.6) in sealed Pt capsules at 200 degrees C for 14, 61, and 209 days converted carnotite
    via interlayer K+ -> Cs+ ion exchange into discrete crystalline margaritasite characterized
    by a sharp (001) diffraction peak at 12.7 degrees 2theta (d = 7.0 A, c = 7.30-7.31 A)
    and bulk Cs2O uptake reaching 10.67-12.83 wt% (with individual Cs-rich crystal domains
    exceeding Cs/(K+Cs) = 0.70 by EMPA); by contrast, parallel runs at 80 degrees C for 14
    and 61 days produced only 0.75-0.85 wt% Cs2O uptake (mole fraction Cs/(K+Cs) < 0.05) with
    no margaritasite phase transition, and heating natural margaritasite in air from 100 to
    500 degrees C for 68 h contracted c from 7.25 to 7.17 A.
  context: Hydrothermal capsule ion-exchange and heating experiments reported by Wenrich et
    al. (1982), pp. 1281 and 1283-1287, Tables 5-7, and Figures 5-6, constraining the >100-200
    degrees C hydrothermal origin of natural margaritasite at Sierra Pena Blanca.
  microbial: false
  evidence:
  - source_ref: wenrich_1982_margaritasite
    supports: support
    explanation: Tables 5-7 and Figures 5-6 (pp. 1283-1286) demonstrate that 200 degrees C
      hydrothermal reaction of carnotite with 0.1 M CsCl for 14, 61, and 209 days produces
      the 12.7 degrees 2theta (001) margaritasite reflection (c = 7.30-7.31 A) and bulk Cs2O
      contents of 10.67-12.83 wt% (with Cs/(K+Cs) > 0.7 in margaritasite domains), whereas
      80 degrees C runs yield only 0.75-0.85 wt% Cs2O without phase change.
  - source_ref: wenrich_1982_margaritasite
    supports: partial
    explanation: Even after 209 days at 200 degrees C, XRD patterns and EMPA  traverses (Table
      7, Figure 5) show an inhomogeneous two-phase mixture of Cs-rich margaritasite domains
      and residual carnotite domains because a miscibility gap separates carnotite and margaritasite
      across 0.06 <= Cs/(K+Cs) <= 0.70.
