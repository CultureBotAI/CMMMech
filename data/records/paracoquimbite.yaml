id: cmmmech:paracoquimbite
name: Paracoquimbite
material_kind: mineral
description: >-
  Paracoquimbite is a trigonal ferric sulfate mineral, ideally
  Fe(III)4(SO4)6(H2O)12·6H2O. The September 2026 IMA list retains
  the 2019 redefinition; the reduced formula Fe2(SO4)3·9H2O used
  in older studies describes the same ideal composition. It is
  compositionally distinct from aluminium-essential coquimbite.
  Their related structures form the coquimbite group; older claims
  that they are simple dimorphs do not express the current species
  definitions. The accepted experiment prepared synthetic
  paracoquimbite from acidified ferric-sulfate solution and identified
  it by powder diffraction. It does not demonstrate microbial
  formation, ore treatment or an isolated iron recovery yield.
