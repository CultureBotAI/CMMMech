  evidence:
  - source_ref: pacholewska2004
    supports: support
    explanation: Phase Analysis of Residues on p. 286 and Figure 1 on p. 287 identify anglesite peaks in both leached residues. The source estimates about 40% anglesite and 43% galena in the inoculated 288 h residue, compared with about 25% anglesite and 62% galena in the control. These are approximate proportions of different mixed residues, not fractions of initial lead converted to anglesite, absolute product masses or an isolated-product yield. No phase-quantification procedure or uncertainty supports a more precise comparison. Other phases, including pyrite and jarosite, remain present.
  - source_ref: pacholewska2004
    supports: partial
    explanation: Table 2 records faster Fe(II) depletion and different pH/Eh in the inoculated concentrate, consistent with an indirect role for microbial oxidation but not an isolated molecular pathway. Dissolved Pb at 288 h is 0.0021 g/L in the inoculated arm versus 0.0022 g/L in the control; these solution measurements do not demonstrate enhanced soluble-lead recovery. The medium itself contains sulfate, and the feed contains other sulfur minerals, so product sulfate cannot be assigned exclusively to oxidation of galena sulfur. The separate synthetic-PbS arm developed pH near 5, retained Fe(II) and lacked observed bacterial colonies while a chemically formed PbSO4 coating was reported. It is not a matched low-pH test of the natural concentrate.
  - source_ref: pacholewska2004
    supports: partial
    explanation: The Table 3 quantity called sulfur conversion is the residue sulfate-sulfur divided by total sulfur minus sulfate-sulfur, expressed as a percentage. This operational difference term does not identify each residual sulfur phase, and the ratio is not an initial-feed sulfur or lead mass balance. Its printed control entries at 96 and 192 h do not reproduce the displayed constituent ratios; no corrected values or conversion yield are adopted. The statement of no further change at 384 h also overstates the displayed ratio's plateau. Figures 2-3 show surface coatings and cell-like objects, but morphology alone does not authenticate F3-02 or chemically identify every coating. A passivating role of anglesite with possible elemental sulfur is proposed rather than independently measured or established for all media.
  - source_ref: ncbi_aferrooxidans
    supports: context_only
    explanation: NCBI resolves taxon 920 as Acidithiobacillus ferrooxidans at species rank. The primary paper supplies the F3-02 isolate designation; no culture-collection or sequence accession is established here and no separate strain identifier is invented.
