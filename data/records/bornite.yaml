id: cmmmech:bornite
name: Bornite
material_kind: mineral
description: Bornite is the Cu5FeS4 mineral species listed as approved, with the notation 1962 s.p., in the September 2026 IMA list. It is distinct from copper metal, chalcocite, chalcopyrite, mixed copper ores and processing residues. The natural specimens below contain other phases; their solution measurements cannot be treated as selective conversion of pure endmember bornite. No criticality designation is inherited from copper or iron.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Bornite row on PDF page 29; column definitions on page 1 and distribution terms on page 2.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: zhang2019
  title: Zhang et al. (2019). Interactions between marmatite and bornite during the oxidative dissolution process in abiotic and biotic systems. RSC Advances 9, 26609-26618. Sections 2-3, Figures 1-5 and original supplementary Table S1 and Figure S1; author-name correction cited separately.
  url: https://doi.org/10.1039/C9RA03658J
  accessed_on: '2026-10-11'
- id: zhang2019_correction
  title: Zhang et al. (2019). Correction to Interactions between marmatite and bornite during the oxidative dissolution process in abiotic and biotic systems. RSC Advances 9, 33428. Corrects Hussnain Ahmed Janjua's name; the notice does not revise experimental results.
  url: https://doi.org/10.1039/C9RA90072A
