  - source: solid_feed_substrate
    target: solubilized_metal_species
    predicate: produces
    relationship: Bacterial removal of the porous surface elemental-sulfur layer increases sphalerite Zn dissolution at 4–8 g/L Fe(II)
    description: At 1 g/L Fe(III) and 4 g/L (100 h) or 8 g/L (69 h) Fe(II), A. ferrooxidans FC1 oxidizes the diffusion-limiting elemental-sulfur layer on sphalerite and increases dissolved Zn in 0.45-um filtrate above matched sterile electrochemical controls after 8–12 h.
    evidence:
    - source_ref: fowler_crundwell_1999
      supports: support
      explanation: Atomic spectrophotometry filtrate Zn time series and surface sulfur analyses in Fowler and Crundwell (1999) Figures 2–6 confirm increased Zn dissolution and lower surface elemental sulfur in inoculated runs at 4 and 8 g/L Fe(II) relative to sterile controls.
