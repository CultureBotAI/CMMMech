id: cmmmech:petscheckite
name: Petscheckite
material_kind: mineral
description: >-
  Petscheckite (IMA 1975-038) is an IMA-accepted uranium-iron-niobium-tantalum
  oxide mineral with IMA September 2026 Master List formula U4+Fe2+Nb2O8 and
  general formula U4+Fe2+(Nb,Ta)2O8 (occurring in oxidized/hydrated metamict
  varieties oxy-petscheckite U4+(Fe3+2/3[]1/3)(Nb,Ta)2O8 and
  hydroxy-petscheckite U4+(Fe3+<1/3[]>2/3)(Nb,Ta)2O7(O,OH)). Described by Mücke
  and Strunz (1978) from the Antsakoa I pegmatite in the Berere pegmatite field,
  near Tsaratanana, Madagascar, where it occurs with columbite, strüverite,
  monazite, ilmenite, garnet, and tourmaline, sheathed by liandratite.
  Metamict when unheated; trigonal/hexagonal (space group P-31m) after
  recrystallization at ~650 °C, with a = 6.42 Å, c = 4.02 Å, Z = 1, SGmeas = 5.0
  (unheated) to 5.5 (heated), Dcalc = 7.2 g/cm3 (oxy-petscheckite) and 6.6 g/cm3
  (hydroxy-petscheckite), and Mohs hardness ~5 (oxy-petscheckite) to 3.5
  (hydroxy-petscheckite).
identifiers:
  - id: IMA:1975-038
    label: Petscheckite
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC (Pasero M., 2026), The New IMA List of Minerals – A Work in
      Progress (Updated: September 2026), PDF p. 170, Petscheckite row: status
      A, IMA 1975-038, formula U4+Fe2+Nb2O8, reference Mücke A., Strunz H.
      (1978) American Mineralogist 63, 941-946.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-24'
  - id: muecke_1978_petscheckite
    title: >-
      Mücke A and Strunz H (1978), Petscheckite and liandratite, two new
      pegmatite minerals from Madagascar, American Mineralogist 63:941-946.
      Primary species description of petscheckite (IMA 1975-038) from the
      Antsakoa I pegmatite, near Berere, Madagascar; reports wet-chemical
      analysis by W. Napiontek (Table 1: UO2 40.5, Nb2O5 45.99, Ta2O5 10.01,
      Fe2O3 1.12, FeO 0.10, MnO 0.42, ZrO2 0.71, Al2O3 0.49, CaO 0.05, K2O
      trace, total 99.39 wt%), trigonal P-31m unit cell after 650 °C heating
      (a = 6.42 Å, c = 4.02 Å, Z = 1), SGmeas = 5.0–5.5, Dcalc = 6.6–7.2 g/cm3,
      Mohs hardness 3.5–5, and thermal recrystallization and high-temperature
      disproportionation behavior.
    url: https://www.rruff.net/doclib/am/vol63/AM63_941.pdf
    accessed_on: '2026-10-24'
mechanisms:
  - id: abiotic_metamict_thermal_recrystallization
    name: Abiotic thermal recrystallization and 1000 °C disproportionation of metamict petscheckite
    process: other
    description: >-
      Thermal annealing of X-ray amorphous metamict oxy-petscheckite at ~650 °C
      restores its trigonal P-31m crystal structure (a = 6.42 Å, c = 4.02 Å, Z =
      1) and raises specific gravity from 5.0 to 5.5, whereas heating hydrated
      hydroxy-petscheckite at 1000 °C for 24 hours dehydrates and
      disproportionates it into cubic uranpyrochlore U4+(Nb,Ta)2O7 (a = 10.36 Å)
      plus oxy-petscheckite and 3 H2O.
    context: >-
      Abiotic laboratory furnace annealing at red heat (~650 °C) and 24-hour
      calcination at 1000 °C monitored by X-ray powder diffraction; no
      microbial, enzymatic, or bioleaching mechanism was tested or reported in
      Mücke and Strunz (1978).
    microbial: false
    evidence:
      - source_ref: muecke_1978_petscheckite
        supports: support
        explanation: >-
          Heating X-ray amorphous metamict oxy-petscheckite at red heat (~650 °C)
          restores its trigonal P-31m crystal structure (a = 6.42 Å, c = 4.02 Å,
          Z = 1) and increases specific gravity from 5.0 to 5.5, whereas heating
          partially hydrated hydroxy-petscheckite for 24 hours at 1000 °C
          dehydrates and disproportionates it into cubic uranpyrochlore
          U4+(Nb,Ta)2O7 (a = 10.36 Å) plus oxy-petscheckite and 3 H2O (pp.
          941–945, Tables 3–4, 6).
