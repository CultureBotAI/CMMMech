id: cmmmech:curite
name: Curite
material_kind: mineral
description: >-
  Curite is the lead uranyl oxide hydroxide hydrate mineral with the
  IMA formula Pb3+x[(UO2)4O4+x(OH)3-x]2(H2O)2, distinct from elemental
  uranium, lead commodities and synthetic strontium analogues. The
  September 2026 IMA list gives grandfathered status G; 1921 is its
  original-description year, not an approval accession. A natural
  Shinkolobwe crystal was refined in orthorhombic Pnma in 2019.
  Hydroxyl hydrogen positions were refined from X-ray data, whereas
  water orientations required Torque calculations; these are not
  wholly independent experimental determinations of all hydrogen
  positions. Slight lead nonstoichiometry and a proposed local
  hydroxyl/oxide charge-balance mechanism remain distinguished from
  directly resolved substitution. Natural structural evidence and
  synthetic surface experiments concern separate specimens. No
  criticality designation, microbial mechanism or industrial recovery
  is inferred.
sources:
