  url: https://ejm.copernicus.org/articles/34/463/2022/
  accessed_on: '2026-10-16'
- id: cesbron1993
  title: >-
    Cesbron F, Ildefonse P, Sichere MC (1993). New mineralogical data on
    uranophane and beta-uranophane; synthesis of uranophane. Mineralogical
    Magazine 57:301-308. DOI 10.1180/minmag.1993.057.387.12. Complete original
    eight-page article from RRUFF visually inspected. Figures 1-4 and
