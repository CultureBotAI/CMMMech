      supports: partial
      explanation: Co-targeted by RNAi or antisense RNA knockdown of SIT1 and SIT2 in Thalassiosira pseudonana (Shrestha & Hildebrand 2015), delaying Si uptake and growth under low silicic acid (20 uM) while single-gene contributions were not separated.
  - uniprot_accession: UniProtKB:B5YNJ0
    entry_name: B5YNJ0_THAPS
    protein_name: Silicic acid transporter, silicon transport
    gene_symbol: SIT2
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:35128
      label: Thalassiosira pseudonana
    reference_proteome_id: UP000001449
    interpro_ids:
    - InterPro:IPR004693
    pfam_ids:
    - Pfam:PF03842
    functional_role: Silicon transporter SIT2 (THAPSDRAFT_41392) co-mediating silicic acid transport and silicon-responsive regulation of frustule biosilicification in Thalassiosira pseudonana CCMP1335.
    annotation_note: Experimental strain is Thalassiosira pseudonana CCMP1335 (NCBITaxon:296543); grounded to the species-level Thalassiosira pseudonana reference proteome entry SIT2 (UniProtKB:B5YNJ0, NCBITaxon:35128, UP000001449), which was sequenced from strain CCMP1335.
    evidence:
    - source_ref: shrestha_2015
      supports: partial
      explanation: Co-targeted by RNAi or antisense RNA knockdown of SIT1 and SIT2 in Thalassiosira pseudonana (Shrestha & Hildebrand 2015), delaying Si uptake and growth under low silicic acid (20 uM) while single-gene contributions were not separated.
  evidence:
  - source_ref: shrestha_2015
    supports: support
    explanation: Figure 7 compares wild type with RNAi clones R-13, R-14 and R-22 and antisense clones A-2, A-7 and A-8. Results report that wild type depleted the supplied silicic acid by 2 h, whereas the RNAi clones required an additional hour; antisense clones showed a similar delay. Figure 8A-B shows lower PDMPO fluorescence in the knockdowns at 20 micromolar supply. These are different assays and do not equate net solution depletion with the amount of solid silica.
  - source_ref: shrestha_2015
    supports: partial
    explanation: Figure 8C tests wild type, R-13, A-2 and A-7 at 200 micromolar supply. The authors report no incorporation difference in this comparison; the plotted trajectories are not numerically identical. Figures 7-8 state standard deviations with n=3 but do not identify independent culture versus technical replication. The captions provide no inferential statistical test for the high-supply null statement. This limits claims that SIT knockdown universally suppresses silicification or that passive diffusion was directly demonstrated by this assay.
  - source_ref: shrestha_2015
    supports: partial
    explanation: Vector design and Figure 6 establish knockdown rather than gene deletion. Sequence similarity prevented separate SIT1 and SIT2 perturbations; the immunoblot antiserum recognized all three SITs. No rescue experiment is described in the inspected main article. A sensing role is the authors' hypothesis, with an upstream sensor retained as an alternative. Supplementary construct/alignment files could not be acquired through the checked legitimate routes, so their sequences and supplementary predictions were not verified.
