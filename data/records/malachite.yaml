mechanisms:
- id: brown_rot_surface_transformation
  name: Culture-associated copper oxalate formation on synthetic malachite
  process: biomineralization
  microbial: true
  organisms:
  - id: NCBITaxon:80602
    label: Serpula himantioides
  - id: NCBITaxon:80637
    label: Coniophora puteana
  - id: NCBITaxon:85982
    label: Serpula lacrymans
  - id: NCBITaxon:1333629
    label: Amyloporia xantha
  description: >-
    The brown-rot cultures Serpula himantioides LE-BIN 1368, Coniophora puteana LE-BIN 1370
    and source-named Antrodia xantha LE-BIN 1029 formed surface deposits assigned to moolooite
    on synthetic malachite. Powder diffraction and microscopy support source-assigned copper
    oxalate formation during these laboratory incubations. They do not quantify malachite
    dissolution, a copper recovery yield, complete conversion or industrial deployment.
  context: >-
    Table 3 describes a homogeneous synthetic malachite substrate, Cu2(CO3)(OH)2, with possible
    Fe up to 3.06 wt%. That is a source-reported impurity bound, not a separately measured
    concentration for every block. The cited synthesis patent is not evidence of natural-mineral
    provenance or current commercial deployment. Methods 2.2 describes approximately 1 x 0.5
    x 0.5 cm blocks in plastic Petri dishes with 20 mL liquid glucose-peptone medium, initial
    pH 5.5, room temperature and 30 days, in triplicate. Mycelial fragments came from ten-day
    cultures on glucose-peptone agar. Inoculum amount, substrate sterilization and a separate
    complete liquid-medium formulation are not specified. The paper names Antrodia xantha;
    current NCBI taxonomy and its cited ribosomal accession use Amyloporia xantha for LE-BIN
    1029. The organisms list includes the tested comparator S. lacrymans; it does not assert
    identical mineral formation by every listed culture.
  evidence:
  - source_ref: vlasov2023
    supports: support
    explanation: >-
      Table 4 assigns moolooite by both SEM/EDX and PXRD to S. himantioides at pH 3, C. puteana
      at pH 3.5 and source-named A. xantha at pH 2.5. Figure 3g shows the selected A. xantha
      product pattern, with underlying-substrate reflections retained. Figures 6d and 7c-d
      show surface aggregates for those cultures; Section 3.2.2 describes a copper-oxalate
      crust. These are endpoint phase and morphology observations, not isolated-product mass
      or purity measurements.
  - source_ref: vlasov2023
    supports: partial
    explanation: >-
      S. lacrymans LE-BIN 1192 has dashes for malachite pH, SEM/EDX and PXRD in Table 4. These
      mean no reported result in those cells, not a measured zero yield, proven absence of
      growth or permanent inability to transform malachite. The paper gives no malachite-specific
      uninoculated phase pattern or quantitative control outcome, although Methods states
      that fungus-free controls were performed.
  - source_ref: vlasov2023
    supports: partial
    explanation: >-
      Methods states that fungus-free controls were performed, but the selected mineral-arm
      results do not provide a matched pH-control series or a quantitative inoculated-versus-uninoculated
      phase balance. No killed-biomass or cell-free-metabolite comparison isolates a necessary
      causal step. Oxalate secretion is the proposed explanation, without an arm-specific
      oxalate time course or molecular intervention in this study. PXRD methods are referred
      to earlier papers; the displayed patterns include substrate peaks. Culture association
      and source-assigned phases do not establish quantitative microbial enhancement, complete
      feed consumption or industrial use.
  - source_ref: vlasov2023
    supports: context_only
    explanation: >-
      This is one arm of Vlasov et al. (2023), also represented by the humboldtine record
      and separately curated mineral-feed owners. The shared paper, its XML/PDF and the different
      material views are not independent replications. Its comparison with earlier Aspergillus
      niger studies uses different protocols and does not establish superior extraction rates
      for the present cultures. The natural adit observations concern calcium oxalates on
      wood/carbonate rock; they do not establish field deployment of this particular feed
      transformation.
  - source_ref: ima_2026_09
    supports: context_only
    explanation: >-
      The authority establishes the mineral species name and formula, not the purity, valence,
      hydration or transformation behavior of the specific experimental material.
  - source_ref: ncbi_fungal_taxonomy
    supports: context_only
    explanation: >-
      Species taxonomy verifies identifiers and current names. A species TaxID does not identify
      the experimental strain or demonstrate its mineral-transforming phenotype.
  - source_ref: genbank_ky352492_1
    supports: context_only
    explanation: >-
      The deposited sequence carries the Serpula himantioides LE-BIN 1368 source label cited
      by the paper. This label/sequence match is not independent authentication of the experimental
      culture or direct evidence for the mechanism.
  - source_ref: genbank_ky433978_1
    supports: context_only
    explanation: >-
      The deposited sequence carries the Coniophora puteana LE-BIN 1370 source label cited
      by the paper. This label/sequence match is not independent authentication of the experimental
      culture or direct evidence for the mechanism.
  - source_ref: genbank_ky352493_1
    supports: context_only
    explanation: >-
      The deposited sequence carries the Serpula lacrymans LE-BIN 1192 source label cited
      by the paper. This label/sequence match is not independent authentication of the experimental
      culture or direct evidence for the mechanism.
  - source_ref: genbank_ky433983_1
    supports: context_only
    explanation: >-
      The deposited sequence carries the Amyloporia xantha LE-BIN 1029 source label cited
      by the paper. This label/sequence match is not independent authentication of the experimental
      culture or direct evidence for the mechanism.
