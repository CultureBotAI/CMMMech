mechanisms:
- id: abiotic_hydrothermal_synthesis
  name: Abiotic hydrothermal preparation of synthetic natrojarosite
  process: other
  microbial: false
  description: Basciano and Peterson prepared synthetic members of the sodium-potassium and sodium-hydronium
    jarosite solid-solution series and characterized them by powder X-ray diffraction with Rietveld
    refinement, chemical analysis and infrared spectroscopy. A two-step treatment produced their near-endmember
    sodium sample P. This is laboratory abiotic synthesis and structural characterization, not microbial
    precipitation or metal recovery.
  context: Initial sodium-hydronium preparations used ferric sulfate pentahydrate and variable sodium
    sulfate in water at 140 degrees C for 48 hours. For sample P, an initially approximately 87% sodium-occupied
    material was ground and treated at 200 degrees C for three days in sulfuric acid and sodium sulfate
    solution. The recipe prints 1.0 m for sulfuric acid and 0.5 before sodium sulfate without an explicit
    concentration unit for the latter; an executable complete recipe is not inferred. Annealing and
    homogenization treatments differ among members of the wider series, and are not assigned uniformly
    to every sample. No microorganisms were involved.
  evidence:
  - source_ref: basciano2008
    supports: support
    explanation: Pages 854-856 describe the two-stage sodium-endmember preparation. Figure 1 and Tables
      1-4 identify sample P through diffraction, chemistry and refinement. Table 1 reports approximately
      97.7% Na site occupation from chemical analysis normalized to two sulfur atoms; Tables 2 and
      4 use an idealized 100% Na model. Analytical uncertainty and model idealization preclude treating
      the difference as a precise deficit or reporting a quantitative product purity or yield.
  - source_ref: basciano2008
    supports: partial
    explanation: Several original-text inconsistencies prevent reconstruction of an unambiguous protocol.
      Page 854 calls Figure 1 ammoniojarosite, whereas its caption and sample P identify natrojarosite.
      The Table 1 P asterisk footnote says chloride-medium synthesis, conflicting with the two-step
      sulfate-medium description and page 856 discussion. Table 3 prints Na occupancy 0.1 for P, inconsistent
      with Tables 2 and 4 and the endmember discussion. These values are retained as source conflicts,
      not silently corrected measurements. Table headings for the broader Na-K series also differ
      from the methods reagent names.
  - source_ref: basciano2008
    supports: partial
    explanation: The structural series and infrared spectra demonstrate composition-dependent variation,
      but do not establish recovery efficiency, phase-specific dissolution kinetics or industrial
      treatment. Natural comparison samples were assessed through unit-cell parameters, with minor
      aluminium substitution noted; they were not all refined for atomic occupancies. Synthetic near-endmember
      results therefore do not establish universal stoichiometry or full iron occupancy for natural
      natrojarosite.
