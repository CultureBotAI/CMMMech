id: cmmmech:baricite
name: Barićite
material_kind: mineral
description: Barićite is a hydrated magnesium phosphate mineral species. The September 2026 IMA list gives
  the approved formula Mg3(PO4)2(H2O)8 and approval number 1975-027. It remains distinct from bobierrite,
  elemental magnesium or phosphorus, and mixed recovered precipitates. The historical experimental source
  uses baricite and a mixed (Mg,Fe) formula; its phase assignment is retained as reported, not a measurement
  proving the current ideal composition. No criticality designation is inherited from constituents.
