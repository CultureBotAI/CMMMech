mechanisms:
- id: sulfur_assisted_culture_acidification
  name: Sulfur-assisted culture-associated acidification and phosphorus mobilization
  process: bioleaching
  description: Living acidithiobacilli cultures and indigenous sludge organisms were associated with acidification and increased phosphorus in filtered liquid after elemental sulfur supplementation. This establishes a laboratory solubilization observation, with unresolved phosphorus-source accounting, rather than isolated-product recovery or exclusive causation by either added strain.
  context: 'Pradhan et al. used Lehtoniemi WWTP sludge, initially 5.59% total solids, in 250 mL loosely closed bottles containing 10 mL sludge and 90 mL medium or culture. Incubation was at 30 degrees C and 150 rpm. At days 21 and 42, 10 mL incubated mixture was replaced with fresh sludge; nominal 10 g/L elemental sulfur, described as 80% pure, was added at day 42 before continuing to day 63. Added cultures were A. ferrooxidans DSM 29444 and A. thiooxidans DSM 14887, separately or as equal-volume inoculum mixtures. Comparators contained sludge with water or uninoculated growth medium. These were not sterile-sludge controls: indigenous sulfur/iron oxidizers grew in the media. The liquid endpoint was obtained by 0.45 micrometre filtration.'
