- evidence_id: original
  kind: primary_source
  reference: https://www.rruff.net/doclib/am/vol60/AM60_280.pdf
  locator: Complete five-page original; methods p. 280, enlarged Tables 1–2 p. 281,
    Tables 3–6 pp. 281–282, Figures 1–2 and discussion pp. 283–284.
  accessed_at: '2026-10-16T07:17:41.519478Z'
  support: supports
  summary: Dal Negro et al. 1975 pp. 280–281 and Tables 1–2 describe natural Mont
    Saint-Hilaire pegmatite material. Five-grain microprobe means were normalized
    using a separate 0.2 g thermogravimetric sample. The 28.4 wt% total loss could
    not distinguish water from CO2. The prose assumed 20:80 partition differs from
    Table 1 corrected H2O 6.24 and CO2 22.12 wt%; these are not independent measurements.
    Table 2 mixed specimen formula La0.56Ce0.82Sr0.40Ca0.22(CO3)2(OH)1.38·0.62H2O
    is not the ideal Ce-Sr endmember. A 0.16×0.10×0.08 mm crystal fragment yielded
    502 independent reflections, of which 498 were observed, with refinement R=0.059.
    Pmcn is a nonstandard Pnma setting. Tables 3–6 contain coordinates, displacement
    parameters, distances and printed structure factors. No hydrogen atom positions
    are given; shared heavy-cation scattering is chemically constrained rather than
    separately measured occupancies. Discussion and Figures 1–2 support eight carbonate-oxygen
    and two hydroxyl/water-oxygen neighbours. Structural analogies to aragonite and
    bastnaesite are not observed conversions.
  snapshot_sha256: 6cda2bb37267927cc374cf7b5f2f6c574656fc3b8ebefa41b76710f87b0268ba
