id: cmmmech:cuprosklodowskite
name: Cuprosklodowskite
material_kind: mineral
description: >-
  Cuprosklodowskite is the copper uranyl silicate hydrate mineral
  Cu(UO2)2(SiO3OH)2(H2O)4·2H2O in the September 2026 IMA list,
  equivalent in bulk composition to Cu[(UO2)(SiO3OH)]2·6H2O.
  Its triclinic P-1 structure is distinct from magnesium-bearing
  sklodowskite, and the mineral is not elemental copper or uranium.
  Status G denotes a grandfathered species; 1933 is the original-description
  year, not a numbered approval accession. Plášil's 2018 study provides
  original natural-crystal diffraction and hydrogen-position refinement
  despite the article's Review label. The diffraction crystal came from
  the National Museum in Prague collection; the article does not establish
  that it is the Musunoi specimen photographed separately in Figure 2d.
  Section 3.1 and Figure 4a describe copper's distorted sixfold coordination
  and the two longer bonds to uranyl oxygen, differing from magnesium's
  linkage to silicate oxygen in sklodowskite. The original supplementary
  CIF and Table 2 agree on the unit-cell parameters and R1 = 3.75% for
  1033 reflections above I > 3 sigma(I). The CIF retains incomplete
  publication-template fields and different temperature entries
  (cell measurement 295(11) K; diffraction ambient 287 K), so a single
  exact experimental temperature is not imposed here. This record
  establishes mineral identity and specimen-specific structure; it does
  not assert a dissolution, microbial extraction, recovery, criticality
  or industrial-deployment claim.
