id: cmmmech:xianhuaite-ce
name: Xianhuaite-(Ce)
material_kind: mineral
description: >-
  Xianhuaite-(Ce) (IMA 2024-091, symbol Xhu-Ce) is an IMA-accepted
  potassium-cerium-niobium oxide mineral with September 2026 IMA-CNMNC Master
  List ideal formula K2CeNb5O15 (PDF p. 236, status A), representing the first
  naturally occurring mineral with a tetragonal tungsten bronze (TTB)-type
  framework structure and the natural analogue of room-temperature
  centrosymmetric synthetic K2CeNb5O15. Described by Yang, Xue, Yang, Sun, Li,
  Yu, Yan, Liu, Zhao, Meng, Chen, Chen, Liu, Yan, Hou, Ao, and Wang (2026) from
  two specimens in the giant Bayan Obo REE–Nb–Fe deposit, Baotou, Inner Mongolia,
  China (named in honor of Academician Xianhua Li; holotype specimen GMCTM2024012
  deposited in the Geological Museum of China, Beijing, and cotype specimen
  BYEB-3 deposited at the Crystal Structure Laboratory, China University of
  Geosciences, Beijing, pp. 449–450): (1) sample BY-E2024-103 from the East
  Orebody (41°48'01" N, 109°59'39" E), occurring as black-brown megacrystalline
  aggregates at the contact between aegirine-type and dolomite-type Nb–REE–Fe
  ores in association with fersmite and fergusonite-(Ce); and (2) sample
  BY-EC2024-14 from the East Contact Zone (41°48'47" N, 110°01'27" E), occurring
  in dolomite-type Nb–REE–Fe ore quantified by TIMA as dolomite (71.89 vol%),
  magnetite (12.19 vol%), fersmite (8.00 vol%), calcite (2.69 vol%),
  columbite-(Fe) (1.72 vol%), xianhuaite-(Ce) (0.40 vol%), aeschynite (0.37
  vol%), fergusonite-(Ce) (0.28 vol%), kinoshitalite (0.21 vol%), pyrochlore
  (0.19 vol%, preserved as relict inclusions within fersmite and
  xianhuaite-(Ce)), phlogopite (0.18 vol%), barite (0.15 vol%), apatite (0.10
  vol%), chlorite (0.09 vol%), biotite (0.05 vol%), forsterite (0.02 vol%), and
  other minerals (1.47 vol%), recording fluid-mediated Nb remobilization during
  Permian granitic skarnization (pp. 450–451, 453–454, Fig. 1). Occurs as
  irregular granules or tetragonal prisms from 0.03 x 0.03 x 0.1 mm to 0.4 x 0.4
  x 0.6 mm; dark brown to black-brown in hand specimen and pale yellow-brown to
  brownish-red in transmitted-light thin fragments, with white streak, adamantine
  lustre, non-fluorescence under 365 nm UV, no magnetism, brittle tenacity with
  conchoidal fracture, perfect {001} cleavage (no parting), Mohs hardness 5–6
  (VHN200 = 469.5 kg/mm2 mean, range 448.7–490.2 kg/mm2), Dcalc = 5.23 g/cm3,
  Gladstone–Dale calculated refractive index Ncalc = 2.22, and grey reflected-light
  color with air reflectance Rmin–Rmax (CRAIC 20/30PV Pro, 6 spots across 6
  grains, p. 450, Fig. 2) of 17.6–18.5% (470 nm), 17.4–18.5% (546 nm), 17.3–18.3%
  (589 nm), and 17.2–18.4% (650 nm). Micro-Raman spectroscopy (532 nm laser,
  WITec 300R, 50–4000 cm-1, Section 5, pp. 452–453, Fig. 3) shows no peaks above
  1000 cm-1 and exhibits diagnostic TTB modes at ~853 cm-1 (NbO6 octahedral
  vibrations), 645 and 537 cm-1 (Nb–O stretching), 175 cm-1 (internal NbO6 mode),
  and 135 and 81 cm-1 (external cation modes). Mean of 10 WDS spot analyses on a
  single grain (JEOL JXA-iHP200F, 15 kV, 20 nA; Section 4, pp. 450, 452, Table 1)
  yielded Nb2O5 65.45 wt% (range 64.38–66.47, SD 0.65, KNbO3 standard), BaO 11.19
  (8.96–12.28, SD 1.02, barite), Ce2O3 6.65 (6.33–7.07, SD 0.28, H2CeO5P), K2O
  6.28 (5.97–7.03, SD 0.32, KNbO3), La2O3 5.26 (4.78–5.82, SD 0.32, H2LaO5P),
  Fe2O3 1.18 (0.67–1.74, SD 0.33, magnetite), CaO 0.91 (0.67–1.13, SD 0.14,
  apatite), Nd2O3 0.75 (0.63–0.83, SD 0.07, H2NdO5P), TiO2 0.63 (0.44–1.21, SD
  0.25, rutile), Na2O 0.31 (0.26–0.35, SD 0.02, jadeite), Pr2O3 0.28 (printed
  range 0.00–0.23, where the printed mean 0.28 wt% exceeds the printed upper
  range bound 0.23 wt%, SD 0.14, H2PrO5P), MgO 0.17 (0.09–0.27, SD 0.06,
  forsterite), SrO 0.16 (0.09–0.23, SD 0.04, celestite), Ta2O5 0.08 (0.00–0.20,
  SD 0.09, LiTaO3; rounds to 0.003 apfu on 15 O and is omitted from the printed
  empirical formula), total 99.30 wt% (ideal K2CeNb5O15 requires Nb2O5 72.01,
  Ce2O3 17.78, K2O 10.21, total 100 wt%), giving on 15 O apfu the empirical
  formula A1(K1.30Ba0.69Sr0.02)Sigma2.01
  A2(Ce0.39La0.31Nd0.04Pr0.02Ca0.15Na0.09)Sigma1.00
  B(Nb4.75Fe3+0.13Ti0.09Mg0.04)Sigma5.01 O15 and simplified formula
  (K,Ba)2(Ce,La)(Nb,Fe)5O15. Tetragonal, space group P4/mbm (#127, mean |E2 - 1|
  = 0.925), Z = 2 (Sections 6 and 7.2, pp. 449, 452–458, Tables 2–7, Fig. 4):
  single-crystal MoKalpha XRD refinement on a 0.02 x 0.02 x 0.01 mm crystal
  fragment (Rigaku XtaLAB PRO-007HF, 293 K, 427 reflections with I > 2sigma(I)
  out of 480 independent, Rint = 0.036, R1 = 0.0189, wR(F2) = 0.042, S = 1.11,
  Table 3, p. 455) gives a = 12.5355(4) Å, c = 3.9213(2) Å, V = 616.19(5) Å3,
  with corner-sharing NbO6 octahedra at B1 (2c, Nb0.947(15)Fe0.053(15), <B1–O> =
  1.964 Å, BVS = 5.17 v.u.) and B2 (8j, Nb1.00, <B2–O> = 1.975 Å, BVS = 5.15 v.u.)
  forming c-axis tunnels with five-membered rings hosting 9-coordinated A1 sites
  (4g, K0.642(3)Ba0.358(3), <A1–O> = 2.949 Å, BVS = 1.21 v.u.) and four-membered
  rings hosting 12-coordinated A2 sites (2a, Ce0.812(4)Ca0.188(4), <A2–O> = 2.678
  Å, BVS = 2.63 v.u.); MoKalpha rotation-mode powder XRD refinement (Chekcell,
  Section 6.1, pp. 452–453, Table 2, p. 454) gives a = 12.5458(8) Å, c =
  3.9279(1) Å, V = 618.24(9) Å3, with seven strongest observed lines at 2.785
  (100)(420, 311), 3.208 (61)(211), 3.034 (53)(410), 1.960 (44)(620, 002, 441),
  2.931 (40)(330, 221), 3.469 (28)(320), and 3.915 (25)(001) Å. Distinct from
  fersmite, columbite-(Fe), fergusonite-(Ce), aeschynite, pyrochlore, and
  elemental niobium, cerium, or lanthanum; no criticality designation for
  xianhuaite-(Ce) itself, no microbial or biological mechanism, and no industrial
  recovery yield are asserted.
