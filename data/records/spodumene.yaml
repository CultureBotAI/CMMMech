  evidence:
  - source_ref: kirk2024
    supports: refute
    explanation: Sections 2.1-2.3, 3.1 and 3.3 and Figure 4 refute a material microbial enhancement of lithium release for this specific feed and protocol. The inoculated and uninoculated lithium curves were similar, despite larger solution-iron values in the inoculated arm. Section 2.5 states that post-leach spodumene residues were not examined by XRD; no measured extent of spodumene-phase destruction is claimed. This result does not refute distinct fungal or other microbial treatments.
  - source_ref: kirk2024_data_v1
    supports: partial
    explanation: The version 1 Mendeley deposit was inspected separately from the article. The standalone spodumene and lepidolite bioleaching workbooks have identical thirty Li replicate values at Sheet1!C3:E12. Their headers use mg/kg while the paper reports mg/L, and they lack a loading or acid-dose ledger. These provenance and unit gaps prevent independent quantitative confirmation, normalized yield calculation or treating the two workbook blocks as independent observations. No deposited values are silently corrected or adopted here.
causal_graphs:
- id: acidophile_spodumene_leaching_limit_graph
  name: Acidithiobacillus ferrooxidans inoculation and refractory low-extraction boundary of Bikita alpha-spodumene at pH 1.8
  description: 'Causal pathway linking representative Acidithiobacillus ferrooxidans rus-operon proteins (Cyc2 AFE_3153/DN052_11975, Swiss-Prot rusticyanin AFE_3146 and DSM 16523 rusticyanin DN052_11940, and Cyc1 AFE_3152 in reference proteomes UP000001362 and UP000248886) for the ferrous-sulfate-grown Bor sulfide-ore isolate (10 mL inoculum in 190 mL sterile basal nutrient solution with 2 g ball-milled ~0.5 um Bikita, Zimbabwe spodumene-bearing powder [containing alpha-spodumene and quartz by qualitative XRD; labeled 2% w/v though 2 g in 200 mL total liquid implies 1% w/v, so no normalized recovery percentage is calculated] in triplicate 250 mL flasks at static 23 C and stable pH 1.8 for 30 days without supplemental H2SO4 additions) to the refractory low-extraction boundary in Kirk et al. (2024): inoculated flasks contained higher dissolved Fe from ferrous-sulfate stock-culture carryover (Figure 5), but dissolved lithium curves remained low and similar in inoculated and uninoculated spodumene
    flasks (Figure 4, kirk2024_data_v1), and Section 2.5 explicitly notes that post-leach spodumene residues were not examined by XRD.'
