          - source_ref: uniprot_thermoanaerobacter_cysteine_sulfur
            supports: partial
            explanation: UniProtKB:B0KB21 (B0KB21_THEP3, Teth39_0119) in Thermoanaerobacter pseudethanolicus reference proteome UP000002156 (NCBITaxon:340099) encodes Cysteine desulfurase (EC 2.8.1.7; GO:0031071 cysteine desulfurase activity; GO:0019448 L-cysteine catabolic process).
    evidence:
      - source_ref: moon2013
        supports: support
        explanation: Results, Effect of microbes and sulfur sources, and Figure 1 show XRD patterns plus HRTEM/FFT compatible with cubic hawleyite. The thiosulfate/sulfite products also contain greenockite, whereas the displayed cysteine product and G20-sulfate and sodium-sulfide reference preparations are reported as cubic. Figure 4 and the time-course text describe an initial cubic product followed by a mixture as incubation and dosing continue. Cysteine concentration and the full G20 comparison protocol are not supplied in the main methods, so those comparisons are contextual rather than fully reconstructed independent culture assays. This is the same original experiment represented under greenockite, not a second biological replication.
      - source_ref: moon2013
        supports: partial
        explanation: Materials and methods and Figures 2–3 distinguish an abiotic medium comparison from the separate Cd-salt plus sodium-sulfide reference, which can itself produce cubic CdS. The no-microbe thiosulfate/sulfite controls showed negligible precipitation; the control-method sentence also says the same medium was incubated with X513 for 24 h, leaving preparation/conditioning wording ambiguous. In the room-temperature comparison, 24-h pristine and two-hour-autoclaved cultures gave fluorescence, while 0.2-micrometre filtration removed most protein and roughly half the sulfide. Thus filtration is not a sulfide-matched test of cell-surface catalysis. Dead biomass can support the optical signal; the proposed nucleation role is not an identified enzyme, a uniquely proven pathway, or proof that live metabolism is required at the moment of precipitation.
      - source_ref: moon2013
        supports: partial
        explanation: Characterization and Figure 4 use profile fitting without structural parameters, reference-intensity-ratio semi-quantification, and Scherrer crystallite sizes. They do not provide a structural refinement, raw diffraction dataset or a phase-specific isolated recovery balance. TEM object sizes exceed XRD coherent-domain estimates; the source interprets aggregation, so a universal sub-10-nm particle diameter is not adopted. The prose assigns 0.672 nm to greenockite (002), whereas the Handbook c value 0.6713 nm implies d002 about 0.3357 nm; the printed 28.1-degree (102) assignment is also not treated as an independently validated index. These unresolved labels limit detailed crystallographic interpretation without erasing the broader mixed-phase XRD/FFT observation.
      - source_ref: handbook
        supports: context_only
        explanation: The structure entry establishes cubic hawleyite and its distinction from hexagonal greenockite. It is identity context, not another biosynthesis experiment.
      - source_ref: handbook_greenockite
        supports: context_only
        explanation: Greenockite Cell Data gives c = 6.713 angstrom, permitting the stated check of Moon2013 printed (002) spacing. This secondary structural reference does not independently validate the microbial product.
      - source_ref: moon2013
        supports: partial
        explanation: Table 1 and the scale-up section describe washed, freeze-dried mixed CdS material and tests from 10 mL to two parallel 24-L reactors. The 1-L yield and conversion values concern bulk CdS nanoparticles, not either pure polymorph; reported conversion is not accompanied by a closed dissolved/solid cadmium balance or a detailed analytical calculation. Similar fluorescence across volumes does not establish identical phase fractions or phase purity at every scale. These are controlled experimental scale-up demonstrations, not industrial deployment, an independently audited cost comparison, or recovered elemental cadmium. The source conclusion calls the process near room temperature, but synthesis methods specify 65 degrees C; only the separate nucleation comparison is explicitly at room temperature.
