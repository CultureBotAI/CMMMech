summary: Cattiite is IMA 2000-032 Mg3(PO4)2(H2O)18·4H2O, equivalently 22 total waters.
  The natural 1A2 polytype is supported by the original single-crystal cell data and
  chemistry, distinct from bobierrite and mixed phosphate resources. The heated product
  has a powder pattern similar to bobierrite, not proven phase purity. The weak 4.83
  angstrom reflection and grinding-medium dependence support only tentative preparation-related
  1A1 formation. Poor diffraction and water loss explain why the authors did not repeat
  full refinement. Geological origin proposals do not establish microbial causality
  or its universal absence.
