id: cmmmech:rhabdophane-ce
name: Rhabdophane-(Ce)
material_kind: mineral
description: >-
  Rhabdophane-(Ce) is the cerium-dominant hydrated phosphate mineral
  listed by IMA-CNMNC with ideal formula Ce(PO4)·H2O and renamed status
  Rn, 1966 s.p., in September 2026. That nomenclature entry is not a
  numbered approval identifier. It is distinct from elemental cerium,
  an unspecified mixed rare-earth phosphate and anhydrous monazite-(Ce).
  Synthetic Ce-rich rhabdophane prepared by replacement of Durango
  fluorapatite was identified by powder diffraction and thermal
  characterization in Bamforth et al. (2024). The fitted monoclinic
  structural model is study-specific; the Sm reference structure used
  in refinement is not a Ce-specimen accession. Ideal hydration is
  not an assay of every synthetic powder: Shelyug et al. (2018) reported
  CePO4·0.732H2O from thermogravimetry including adsorbed and structural
  water. Porous monazite and rhabdophane can have overlapping low
  electron-microprobe totals, so elemental composition or totals alone
  do not distinguish these phases. The curated transformation is an
  abiotic laboratory result. No microbial mechanism, isolated cerium
  recovery, industrial deployment or inherited criticality is asserted.
