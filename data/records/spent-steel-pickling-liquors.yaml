id: cmmmech:spent-steel-pickling-liquors
name: Spent steel-pickling liquors
material_kind: secondary_resource
description: Acidic metal-bearing process liquids remaining after removal of oxide scale from steel surfaces. The accepted experiment uses hydrochloric-acid liquor collected from a steel-processing plant's pickling bath, subsequently filtered and diluted with laboratory 9K medium. This liquid feed is distinct from steelmaking slag, mill scale, electroplating-bath effluents, treatment sludge and synthetic iron-salt solutions. It is represented as one process-resource identity, without separate owners for acid recipes or facilities. Evidence here concerns culture-associated iron redox transformation and sediment formation in the hydrochloric-liquor arm; it does not establish performance for every steel-pickling liquor, isolated metal recovery or criticality.
sources:
- id: qin2016
  title: Qin, Xie, Guo, Shan, Li, Xue, Xiao and Ma, Ferrous bio-oxidation by Acidithiobacillus ferrooxidans in hydrochloric acid pickling waste liquor. Desalination and Water Treatment 57(4):1836-1843 (2016; online 6 December 2014), DOI 10.1080/19443994.2014.981221. Complete official eight-page original, sections 2-4, Table 1 and Figures 1-8 inspected. No separate supplement is announced in the inspected original.
  url: https://doi.org/10.1080/19443994.2014.981221
  accessed_on: '2026-10-15'
- id: genbankkf378735
  title: 'NCBI GenBank KF378735.1, Acidithiobacillus ferrooxidans strain XJF-8 partial 16S ribosomal RNA gene, 1440 bases. Current source qualifiers specify coal mine drainage and China: Shanxi, conflicting with the paper''s Tianjin factory-outlet isolation account. This is the accession cited by the paper, not independently confirmed identity of its culture.'
  url: https://www.ncbi.nlm.nih.gov/nuccore/KF378735.1
  accessed_on: '2026-10-15'
- id: ncbi920
  title: NCBI Taxonomy 920, Acidithiobacillus ferrooxidans, species rank; current authoritative taxonomy XML. Species nomenclature does not resolve the conflicting experimental-isolate provenance.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920
  accessed_on: '2026-10-15'
mechanisms:
- id: culture_associated_ferrous_oxidation
  name: Conditional culture-associated Fe(II) oxidation in diluted pickling liquor
  process: redox_transformation
  description: A culture assigned by the authors to Acidithiobacillus ferrooxidans was associated with declining dissolved Fe(II) in filtered hydrochloric steel-pickling liquor mixed with 9K medium. Iron oxidation and formation of iron-sulfate-containing sediments are the source interpretation. The measured percentage endpoint is Fe(II) oxidation, not recovered iron yield, and reagent-derived iron, sulfate and ammonium cannot be assigned exclusively to the waste feed. The assay does not establish a particular molecular pathway or biological necessity for precipitation.
  context: Sections 2.1-2.3, printed p. 1837, describe serial cultivation and colony isolation from sediment near a polymerization ferric-chloride factory outlet in Tianjin. The reported isolation culture used 50 mL in 250 mL Erlenmeyer flasks, 30 degrees C and 100 rpm; these are explicitly culture conditions, not separately established working volume or temperature for every waste-liquor assay. The actual plant liquor was filtered at 0.22 micrometres and mixed with 9K medium, with late-exponential-phase inoculum and Fe(II) monitoring by dichromate titration. Inoculum quantity and exact waste-assay working volume are not given. The authors state that the 9K comparison's ferrous content was matched to each mixed medium. Figure 1 also includes low-response CK curves, but the inspected methods do not define CK preparation, inoculation or sterility; it is not treated as a fully documented matched sterile control. Section 2.4 specifies three repeats for single-factor pH/iron/chloride experiments,
    without establishing independent biological replication for every waste-fraction or sediment-characterization arm.
