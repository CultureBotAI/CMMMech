mechanisms:
- id: acid_hydrothermal_replacement
  name: Abiotic acid-mediated replacement by monazite-(Ce)
  process: other
  microbial: false
  description: >-
    Synthetic Ce-rich rhabdophane was replaced by monazite-(Ce)
    during closed-reactor experiments at 180 degrees C for 8 hours.
    At nominal pH approximately 1, relative crystalline phase
    analysis reported 98.6% replacement in 1 M phosphoric acid,
    compared with 6.4% in 0.1 M hydrochloric acid. These are fitted
    phase proportions, not isolated-product or elemental recovery
    yields. Diffraction and preserved aggregate textures with
    changed nanoscale prisms support dissolution and precipitation;
    the proposed rate-limiting step and fluid-boundary mechanism
    remain interpretations of the experiment.
  context: >-
    Laboratory, no organisms. Starting material was produced by
    reacting 50 +/- 0.5 mg of 250-355 micrometre Durango fluorapatite
    with 15 mL of 0.1 M HCl and 0.02 M CeCl3·7H2O at 30 degrees C
    for 96 hours, then rinsing with water and acetone. Eleven such
    preparative runs supplied characterization samples and nine
    pooled/homogenized portions for distinct hydrothermal conditions;
    they are not eleven replicates of each comparison. Table 1 lists
    20.9-21.1 mg portions in 15 mL fluids in 25 mL PTFE-lined reactors,
    while the methods prose says 20 +/- 0.1 mg; that discrepancy is
    unresolved. Acid composition and nominal pH are experimental
    comparators, not matched microbial controls. At nominal pH 3,
    section 3.1 calls replacement below 5%, but Figure 3 labels
    4.4%, 4.7% and 6.4%; no single corrected value or kinetic law is
    inferred. The authors note an approximately 1% PXRD detection
    limit. Preparative completion is diffraction-defined, not a
    claim of absolute chemical purity or directly measured hydration.
  evidence:
  - source_ref: bamforth2024
    supports: support
    explanation: >-
      Sections 2.1-2.2, Table 1 and Figures 2-3 establish the stated
      material, comparison and relative phase conversion. Figures
      6-7 show aggregate preservation and changed individual prisms;
      section 4.1.2 interprets coupled dissolution-precipitation.
      The 98.6% versus 6.4% comparison is restricted to the two
      nominal-pH-1 fluids and 180 degrees C/8-hour treatment.
  - source_ref: bamforth2024
    supports: partial
    explanation: >-
      Figure 9 is a proposed mechanism, not direct molecular tracking.
      The loading discrepancy between section 2.1.2 and Table 1 and
      pH-3 conflict between section 3.1 and Figure 3 remain unresolved.
      Section 4.3.2/Figure 10 demonstrates overlapping microprobe
      totals in independently identified phases; composition alone
      cannot establish that an unrelated biological Ce phosphate
      is rhabdophane. No microbial causality or deployment is tested.
