- id: kang_2022
  title: Kang, Csetenyi, Gao and Gadd (2022). Solubilization of struvite and biorecovery of cerium by Aspergillus niger. Applied Microbiology and Biotechnology 106:821–833. Complete 13-page article; Methods pp. 823–824, Figures 1–9, Tables 1–2 and Discussion. DOI 10.1007/s00253-021-11721-0.
  url: https://doi.org/10.1007/s00253-021-11721-0
