id: cmmmech:chrysotile-asbestos-tailings
name: Chrysotile asbestos tailings
material_kind: secondary_resource
description: >-
  Residues from processing chrysotile-bearing ore for asbestos production,
  represented here by the Clinton Creek mill tailings in Yukon, Canada.
  These heterogeneous, magnesium-rich residues contain fibrous chrysotile,
  serpentinite and other phases, including weathering carbonates. They are
  distinct from a pure chrysotile mineral specimen, unprocessed serpentinite,
  mine waste rock and other ultramafic tailings streams. No criticality
  designation is inherited from magnesium or other constituents.
