id: cmmmech:lukechangite-ce
name: Lukechangite-(Ce)
material_kind: mineral
description: Anhydrous sodium-cerium fluorocarbonate mineral with current September 2026 IMA-CNMNC
  approved formula Na3Ce2(CO3)4F, status A, and approval number IMA 1996-033. Grice and Chao
  (1997) described the cotype specimen (CMNMI 81535, formerly provisional phase UK80) from
  a pegmatite vein at the Poudrette quarry, Mont Saint-Hilaire, Rouville County, Quebec, Canada,
  where it occurs with microcline, sodalite, catapleiite, fluorite, aegirine, siderite, astrophyllite,
  and Petersenite-(Ce). Electron-microprobe WDS analysis (mean of 5 analyses on 1 grain, p.
  1257) with CO2 calculated by stoichiometry yielded Na2O 14.94, CaO 0.10, SrO 0.12, La2O3
  16.36, Ce2O3 29.48, Pr2O3 1.95, Nd2O3 5.88, F 3.58, CO2 28.40 (calc), less O=F 1.51, total
  99.30 wt%, corresponding on the basis of 4 C atoms (13 anions) to the empirical formula
  (Na2.99Ca0.01Sr0.01)Sigma3.01(Ce1.11La0.62Nd0.22Pr0.07)Sigma2.02(CO3)4F1.17. Single-crystal
  X-ray diffraction refined in hexagonal space group P63/mmc (single-crystal cell a = 5.0612(8),
  c = 22.820(9) A, V = 506.2(2) A3; Debye-Scherrer powder XRD cell a = 5.068(1), c = 22.87(5)
  A, V = 509(1) A3, Z = 2, R = 3.4%, wR = 4.0% for 335 observed reflections with F > 5sigma(F)
  out of 399 unique reflections) confirmed that lukechangite-(Ce) is isostructural with synthetic
  Na3La2(CO3)4F, featuring layered sheets of [CeO9], [Na1O6F2], [Na2O6], and [CO3] polyhedra
  stacked along c. The mineral is soluble with effervescence in 1:1 HCl. Distinct from cordylite-(Ce),
  baiyuneboite-(Ce) (cordylite-(Ce) synonym/polytype), huanghoite-(Ce), and elemental cerium;
  no criticality designation, microbial mechanism, or industrial recovery yield is asserted.
