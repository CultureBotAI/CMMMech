  outcome: supported
  summary: A heterogeneous calcium-sulfate-rich residue generated during wet-process
    phosphoric acid manufacture from phosphate rock. It is distinct from natural gypsum
    mineral, phosphate-rock commodity and individual rare-earth elements. Curated
    laboratory evidence separates synthetic single-REE-doped model powders from an
    industrial residue sample. Neither experiment establishes industrial recovery,
    and constituent-element criticality is not inherited by the residue.
