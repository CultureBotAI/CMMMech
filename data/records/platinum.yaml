mechanisms:
- id: ch34_hydrogen_ptii_transformation
  name: Hydrogen-driven Pt(II) transformation in the presence of CH34 biomass
  process: redox_transformation
  description: Washed Cupriavidus metallidurans CH34 biomass exposed to a synthetic Pt(II) chloro-complex under hydrogen acquired platinum-bearing particles. The authors interpreted biomass-associated XANES and EXAFS spectra as consistent with metallic Pt(0). Hydrogen alone also removed Pt(II), so the experiment supports a transformation with microbial biomass present, without establishing that living cells or a particular enzyme are necessary.
  context: 'Laboratory anaerobic batches: CH34 from SCK-CEN was first grown aerobically overnight in LB-Lennox at 28 degrees C, centrifuged at 7000 g for 7 minutes, washed twice with 25 mL phosphate buffer (8.5 g/L Na2HPO4.7H2O and 3 g/L KH2PO4), and resuspended to OD610 of 1. Fifty mL suspensions in 120 mL serum bottles received Pt(II) supplied as K2PtCl4, at 100 mg/L Pt from a 2.5 g/L Pt stock in 1 M HCl. Bottles underwent 20 nitrogen/vacuum cycles and the headspace was replaced with 100% hydrogen; batches were mixed at 100 rpm and 28 degrees C, with initial assay pH adjusted to 1.8-2.2. Aerobic denotes biomass cultivation, not the anaerobic transformation assay. Table 1 reports 99% Pt removal with hydrogen at 48 h versus 24% in the no-electron-donor CH34 arm and 99% in the chemical hydrogen control (screening experiments n=1). These ICP-OES-based removal percentages are not measured Pt(0) fractions or purified-product yields; the 2017 methods refer detailed ICP sample preparation to an
    earlier paper, whose full procedure was not verified here. Membrane-intact cell counts decreased during exposure, so sustained metabolic activity is not assumed.'
