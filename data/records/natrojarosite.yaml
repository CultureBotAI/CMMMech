id: cmmmech:natrojarosite
name: Natrojarosite
material_kind: mineral
description: Natrojarosite is the sodium ferric hydroxysulfate mineral with ideal formula NaFe3(SO4)2(OH)6,
  all iron ferric. The September 2026 IMA list records the species as redefined, 1987 s.p. It is distinct
  from potassium jarosite, ammoniojarosite, hydroniumjarosite and a mixed industrial jarosite residue.
  Natural compositions can contain substitutions; the ideal formula is not an assay of every specimen.
  Gómez et al. (2024), sampling in May 2010, identified natrojarosite and quartz in an inner crust
  associated with a cyanobacteria-containing mixed microbial mat beneath a gypsum-rich outer layer
  at Río Tinto, Spain. Their field deposit measurements averaged pH 0.8, but pH across the thin cyanobacterial
  layer could not be measured. This is an association, without controlled evidence that the organisms
  precipitated or dissolved natrojarosite, without a verified cyanobacterial species or strain, and
  without an extraction or recovery measurement. No constituent-element criticality or industrial
  deployment is inferred.
