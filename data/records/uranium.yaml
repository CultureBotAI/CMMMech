mechanisms:
  - id: oneidensis_bes_uranium_separation
    name: Uranium separation in an MR-1-inoculated electrochemical system
    process: separation
    description: >-
      A laboratory electrochemical system inoculated with Shewanella
      oneidensis MR-1 showed aqueous uranium depletion and uranium associated
      with the carbon-felt working electrode. Abiotic systems also removed
      uranium. This supports separation in the combined biological and
      electrical system, with partial evidence for a microbial mechanism;
      microbial necessity, a specific electron-transfer pathway and a
      purified uranium product are not established by this record.
    context: >-
      Defined electrolyte, not ore or industrial waste: 100 mL working and
      counter chambers separated by Nafion 117, with carbon-felt electrodes.
      The working solution contained 30 mM bicarbonate, 10 mM PIPES,
      30 mM ammonium acetate, 40 mM NaCl, and Wolfe's vitamins and trace
      metals. Dissolved U(VI) was prepared from U metal in HCl and hydrogen
      peroxide. Chambers were purged with nitrogen containing 400 ppm CO2.
      After equilibration and the second solution sample, the biotic system
      was inoculated and the working electrode poised at -800 mV versus
      saturated Ag/AgCl. The metadata specifies ambient-temperature
      equilibration and experiments lasting 72-574 h, with a shorter abiotic
      U repeat; it does not provide an exact controlled assay temperature or
      inoculum density/preparation. The original biotic U series has recorded
      pH values of 7.01-8.21 after inoculation, so this was not a constant-pH
      assay. Filtered samples were measured by ICP-OES. Electrode material
      underwent carbonate extraction followed by concentrated acid extraction.
      Independent replicate counts and a statistical microbial-effect estimate
      are not assigned here. Neither stable mineral identity nor industrial
      deployment is claimed.
    microbial: true
    organisms:
      - id: NCBITaxon:211586
        label: Shewanella oneidensis MR-1
    evidence:
      - source_ref: kane_2026_bes
        supports: support
        explanation: >-
          FGDC process steps 1-4 and tables T1-T3 and T6 support the laboratory
          separation observation. In T3, the original biotic series has
          975 mg/kg U at BESU.8Vb_W.EQ and less than 0.1 mg/kg at
          BESU.8Vb_W.END; the latter is encoded as -0.1, a detection limit,
          not zero or a negative concentration. T6 reports uranium in the
          subsequent electrode acid extract. These observations are not
          a mass-balanced recovery percentage or product purity measurement.
      - source_ref: kane_2026_bes
        supports: partial
        explanation: >-
          Abiotic T3 samples also decrease, from 914 mg/kg at
          BESU.8Va_W.t0 to 0.819 mg/kg at BESU.8Va_W.END. T2 shows different
          pH histories, and the source reports pre-electrolysis sorption.
          T6 original biotic and abiotic acid extracts use concentrated HCl
          and HNO3 respectively, so their amounts are not a matched assay
          of microbial enhancement. These controls limit attribution of
          the observed separation specifically to MR-1 metabolism.
      - source_ref: kane_2026_bes
        supports: support
        explanation: >-
          T9_SEM.pdf pages 2-6 show deposits and U-labelled EDS signals on
          both abiotic and biotic U electrodes, supporting electrode
          association. T8_XRD.csv supplies diffraction counts for these
          conditions and a carbon-felt blank, but this curation does not
          assign a crystalline phase or oxidation state from those data.
    observations:
      - id: u_biotic_equilibrated
        source_ref: kane_2026_bes
        source_table: T3_AqueousICPOES.csv
        source_sample_id: BESU.8Vb_W.EQ
        source_column: U_ppm
        raw_value: '975'
        analyte:
          id: CHEBI:27214
          label: uranium atom
        material_form: >-
          Uranium-bearing electrolyte. ICP-OES measures total elemental U;
          the atom identifier grounds the element, not neutral atoms in solution
          or an oxidation-state measurement.
        sampled_fraction: >-
          Working-chamber solution filtered at 0.22 micrometres before
          preservation in 1% nitric acid.
        study_arm: biotic
        result_status: measured
        value: 975
        unit: mg/kg
        analyzed_on: '2024-09-24'
        sampled_on: '2024-09-06'
        sampling_source_locator: 'T2_pH.csv; SampleID=BESU.8Vb_W.EQ; Date column'
        context: >-
          Post-equilibration baseline of the run assigned to the biotic arm.
          Metadata process steps 1 and 3 place inoculation after this second
          solution sample, so study_arm does not assert cells were present
          when this baseline was sampled. This source cell is not a recovery
          percentage or an independent microbial-effect estimate.
      - id: u_biotic_endpoint
        source_ref: kane_2026_bes
        source_table: T3_AqueousICPOES.csv
        source_sample_id: BESU.8Vb_W.END
        source_column: U_ppm
