  evidence:
  - source_ref: vanalin2023
    supports: support
    explanation: Figures 1-3 and the Results document attached cells, biofilm development and a thin biofilm layer by complementary CLSM, SEM and a FIB cross-section; Appendix Figure S12 provides a CLSM cross-section of mature biofilm. Main Figure 1A/D and Appendix Figures S7 and S10 distinguish early attachment, greater coverage during maturation and reduced coverage during dispersion on the ore. Main Figure 3E/F localizes cells around roughness and surface imperfections. Reported attachment within 10 min and growth to approximately 1e9 cells/mL are explicitly data not shown and are not adopted here as verified quantitative observations. Images from the separate monazite-muscovite and xenotime crystal arms are contextual comparisons, not measurements of this ore.
  - source_ref: vanalin2023
    supports: partial
    explanation: Figure 5 compares representative high-grade ore surfaces after 14 days of abiotic and biotic treatment and supports the authors' qualitative erosion interpretation. It is not a registered before-and-after image series of the same grain and supplies no erosion volume, elemental release time course, closed mass balance or measured recovery fraction. Similar-pH abiotic comparisons are described in the discussion, but the control pH lists disagree elsewhere and no matched pH trajectory is shown. Contact-mediated chemistry, organic-acid action and EPS contributions remain interpretations without a causal intervention in this experiment.
  - source_ref: vanalin2023_appendix
    supports: partial
    explanation: Figures S1-S2 and Tables S1-S4 support a heterogeneous ore, not a pure Ce- or Nd-dominant monazite specimen. Table S3 reports 65 wt% monazite group among crystalline phases only; its listed 65, 3, 15 and 18 sum to 101 despite a printed total of 100. Table S1 describes monazite-(Ce) and cheralite refinement references, while Table S2 lists CePO4 and LaPO4 reference patterns. Overlapping crandallite/florencite peaks and a tentative kihlmanite assignment are acknowledged by the source. These model and reference-pattern differences preclude promoting the tabulation to whole-feed grade or a unique mineral-species identifier. No new extraction denominator is calculated from these phase estimates.
  - source_ref: vanalin2023_appendix
    supports: partial
    explanation: Figures S5-S7 document cytometry and fluorescence controls. Hoechst and DiTO-1 stain DNA with different permeability properties; their combined signal is not a live-cell count, and Figure S7 explicitly identifies autofluorescent epoxy around grains. SEM observations independently support cell attachment. Main Figure 4C-E and Appendix Figures S15-S16 show cells on grains with different elemental composition, supporting only the reported absence of detected selective colonization in the examined fields. Figure S11 provides later live-imaging snapshots without a quantified recolonization rate.
  - source_ref: vanalin2023_video
    supports: context_only
    explanation: The three source-labelled day-11/day-14 clips show depth-coded reconstructions of the mineral-associated fluorescent structures. Six sampled frames per clip span their approximately 16, 48 and 32 s display durations; these are viewing rotations, not elapsed culture time or independent replicates. They corroborate spatial imaging context but do not establish live-cell viability, metabolite activity, dissolution kinetics or rare-earth recovery.
  - source_ref: vanalin2023
    supports: context_only
    explanation: The Introduction and Discussion quote rare-earth solution concentrations from Corbett and Fathollahzadeh studies published in 2017-2018. Those values are prior-study context rather than new measurements from the 2023 microscopy experiment, and are not imported as this feed's yield or as independent replication. The separate crystal arms and previously studied ore batches are not assumed to be the identical physical feed.
