id: cmmmech:titanium-metal
name: Titanium metal
material_kind: commodity
description: Titanium in metallic commercial forms, considered as a raw-material commodity. USGS distinguishes
  titanium sponge metal and downstream metal forms from titanium dioxide pigment and mineral concentrates.
  Sponge is one metal form, not the entire commodity. This record is distinct from the titanium element
  as a chemical identity, titanium-bearing minerals, titanium oxides and any particular alloy formulation
  or waste stream. The designations preserve the titanium-metal scope in the original EU 2024 lists. A
  culture-containing grinding study used titanium sponge alongside an incompletely identified titanium-industry
  waste feed and reported fine titanium-compound powders. Its pooled results do not establish sponge-specific
  recovery, microbial enhancement or production of pure titanium metal.
