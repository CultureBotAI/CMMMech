limitations:
- The culture phase is bixbyite-like, with no refined composition/polytype, phase
  fractions or direct bulk-valence measurement. Mapping it to the Mn-rich species
  is explicitly qualified.
- No matched uninoculated long-incubation XRD/Raman series or in situ phase trajectory
  establishes exclusive microbial necessity or excludes preparation effects.
- Figure 3 exact Mn loading, harvest age and vessel gas exchange remain unspecified.
  Separate short oxidation assays cannot supply those missing phase conditions.
- No solid Mn-oxide particles at pH 7.2 despite positive LBB/trapping; oxidation is
  not identical to precipitation or recovery.
- Protein activity, inhibitor response and transcript association do not identify
  a unique causal mineral-forming enzyme. Growth-assay and ABTS recipe discrepancies
  remain unresolved.
- Partial 16S species assignment and submission metadata do not provide whole-genome
  authentication or species-wide phenotype.
- Other complete studies identified in the dossier were outside this record review;
  current notice and local searches are bounded. Supplement was inspected as original
