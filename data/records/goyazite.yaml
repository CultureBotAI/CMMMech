id: cmmmech:goyazite
name: Goyazite
material_kind: mineral
description: Goyazite is the strontium aluminium phosphate mineral SrAl3(PO4)(PO3OH)(OH)6, distinct from
  calcium-dominant crandallite, other crandallite-group species and strontium as an element. A primary
  natural-crystal refinement supports its identity. A separate laboratory study produced goyazite-bearing
  synthetic preparations and measured thermal dehydroxylation across a nominal calcium-strontium series.
  Minor impurities, starting-gel composition and measurement-dependent thermal peaks limit interpretation.
  No microbial mechanism, strontium recovery yield, mineral criticality or industrial deployment is asserted.
