id: cmmmech:cattiite
name: Cattiite
material_kind: mineral
description: Cattiite is the highly hydrated magnesium phosphate mineral listed as Mg3(PO4)2(H2O)18·4H2O
  in the September 2026 IMA list, with approval2000-032; this has22 waters per formula unit, conventionally
  Mg3(PO4)2·22H2O. It is distinct from bobierrite, less-hydrated magnesium phosphates, elemental magnesium/phosphorus
  and mixed recovered fertilizers. The original natural material was assigned to the 1A2 polytype, with
  preparation-sensitive diffraction and dehydration limits. No microbial mechanism or constituent criticality
  is inferred from its natural occurrence or chemical transformations.
