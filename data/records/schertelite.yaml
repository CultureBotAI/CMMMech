  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Pages 1-2 definitions; newberyite page
    154 and schertelite page 194. Previously acquired official original re-inspected on 14 October 2026.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: entrena_1994
