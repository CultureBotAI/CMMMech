mechanisms:
- id: inferred_abiotic_weathering
  name: Inferred oxidation and hydrogen loss during natural weathering
  process: redox_transformation
  microbial: false
  description: Evans and Mrose interpreted natural montroseite-paramontroseite intergrowths as oxidation
    of VO(OH) to orthorhombic VO2 with hydrogen loss while retaining a related oxygen framework. Their
    proposed reaction is 2VO(OH) + 0.5O2 -> 2VO2 + H2O. This is a structural and geological inference
    from altered natural crystals, not a controlled conversion experiment or measured hydrogen-transport
    mechanism.
  context: The Bitter Creek mine, Paradox Valley, Colorado, supplied two altered crystals. One contained
    sharp montroseite plus diffuse paramontroseite and a weaker unresolved diffuse-A phase; the other
    gave nearly pure paramontroseite diffraction with slight residual montroseite reflections. The 1955
    study reused the 1953 montroseite intensity data, so the papers and the two mineral records do not
    represent independent replications. The proposed below-50-degrees-C atmospheric or groundwater weathering
    setting has no measured reaction duration, pH, oxygen activity, conversion fraction or matched laboratory
    control. Diffuse A could be an intermediate or a separated Fe-rich phase; its identity was unresolved.
  evidence:
  - source_ref: evans_mrose1955
    supports: partial
    explanation: Pages 863 and 867 distinguish the two natural crystals, visually estimated 99 montroseite
      and 34 paramontroseite reflections, no absorption correction, and poorer diffuse-phase data. Figures
      1-4 and Table 4 show related, parallel lattices and an interoxygen separation interpreted as a hydrogen
      bond in montroseite but not paramontroseite. Pages 872-874 infer oxidation and hydrogen migration;
      they do not directly track atoms or establish a universal low-temperature rate or equilibrium boundary.
  - source_ref: weeks1953
    supports: context_only
    explanation: Pages 1239-1241 and Tables 2-3 show that bulk powder patterns and chemical analyses include
      altered and impure material. The Matchless composition was calculated as about 35 percent substituted
      oxyhydroxide and 65 percent VO2, not measured conversion in a timed assay. Bitter Creek, Matchless
      and Whitney separates have different impurities and must not be pooled as pure montroseite or paramontroseite.
- id: abiotic_thermal_oxidative_breakdown
  name: Heating-associated oxidative breakdown of Fe-bearing natural paramontroseite
  process: redox_transformation
  microbial: false
  description: Curetti and Pavese observed Fe-bearing natural paramontroseite progressively break down
    into diffraction-assigned V2O5 and Fe2V4O13 during laboratory heating. Under their stepped powder
    protocol, new phases appeared in the 350-400 degrees C interval, and Figure 7 retains parent paramontroseite
    at 400 and 450 degrees C but not in its plotted 500 degrees C assemblage. This supports specimen-specific
    oxidative phase transformation, not vanadium extraction, product recovery or a universal transition
    temperature for pure VO2.
  context: The Prachovice, Czech Republic, specimen contains compositionally zoned Fe/Al-bearing paramontroseite
    on a calcite matrix with associated U-rich material. Crystals selected from U-free mapped areas for
    powder diffraction still contained about 8 weight percent calcite. The powder was placed in a flat
    Pt holder, heated at 20 degrees C per minute, and measured at 50-degree intervals up to a stated 550
    degrees C after 2-hour holds; each diffraction scan took about 150 minutes. Figure 7 ends at 500 degrees
    C and the cell-parameter table at 450 degrees C. The gas composition/flow and oxygen fugacity are
    not specified. Separate crystals heated for 6 hours at 400 degrees C were used for EDS and Raman work;
    those results are not an identical powder time series. There is no pure-VO2 matched comparison, measured
    dissolved vanadium, isolated-product mass balance or demonstrated industrial process.
  evidence:
  - source_ref: curetti2023
    supports: support
    explanation: Sections 2.1-2.5, Figures 1-3 and 5-7 and Table 3 establish the natural feed, selected
      powder with calcite, temperature protocol and mixed diffraction products. Section 3.2 identifies
      V2O5 and Fe2V4O13 and infers oxidation of V4+ to V5+ from the assigned phases. Parent diffraction
      persists through 450 degrees C in Table 3 and Figure 7. The transformation did not yield an observed
      rutile-type VO2 phase under this protocol.
  - source_ref: curetti2023
    supports: partial
    explanation: Section 3.2 reports final Fe2V4O13 and V2O5 proportions of about 65 and 35 weight percent
      respectively, but the labeled stacked bars in Figure 7 show V2O5 as the larger final product and
      retain calcite. The exact product fractions and denominator therefore remain unresolved and are
      not treated as recovery yields. The proposed balanced reaction uses an approximate Al-free V0.8Fe0.2O2
      formula, distinct from both the measured average composition and refined occupancies. Absence of
      an amorphous intermediate is inferred from retained calcite fraction, not a separately quantified
      glass assay.
  - source_ref: curetti2023
    supports: partial
    explanation: Sections 2.2-2.3 and 3.1, Tables 1-2 and Figure 4 favor Fe in a separate tetrahedral
      site for this Fe-rich specimen, rather than simple V-site substitution. The average chemical formula
      V0.84Fe0.19Al0.03O2 differs from refined site occupancies, and small Al is omitted in the proposed
      model; EDS and refinement do not directly measure every cation valence. Section 3.3 and Figure 9
      show laser-induced changes and overlapping Raman peaks; an Fe2V4O13 reference spectrum was unavailable,
      so individual Raman assignments are not unique and a database match is not an unaltered-paramontroseite
      fingerprint.
