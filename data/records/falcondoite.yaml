id: cmmmech:falcondoite
name: Falcondoite
material_kind: mineral
description: 'Hydrous nickel-magnesium phyllosilicate mineral of the sepiolite group with
  current September 2026 IMA-CNMNC approved formula Ni4Si6O15(OH)2(H2O)2·4H2O (the Ni-dominant
  analogue of sepiolite, written [Ni8(H2O)4(OH)4Si12O30]·(H2O)8 for the 8-octahedral half-cell),
  status A, and approval number IMA 1976-018. Springer (1976) described the holotype specimen
  (ROM M 34324, Royal Ontario Museum, Toronto) from a 2 cm-wide whitish-green garnierite vein
  at 3 m depth crosscutting decomposed serpentinized harzburgite in the Loma Peguera lateritic
  nickel deposit worked by Falconbridge Dominicana C. por A. near Bonao, Dominican Republic,
  where it is intergrown with sepiolite, Ni-bearing talc, and serpentine. Bulk wet-chemical/XRF
  analysis after drying at 60 degrees C (Table 2, p. 408: SiO2 45.93, NiO 26.7, MgO 8.46,
  FeO 1.99, Cr2O3 0.45, Al2O3 0.39, MnO <0.01, CoO <0.01, LOI 15.0 wt%, plus 7 wt% moisture
  lost below 60 degrees C) and four electron-microprobe point analyses of pure falcondoite
  fibers (Analyses A-D, Table 2, average: SiO2 49.2, NiO 23.6 [range 20.1-27.6], MgO 9.26
  [6.89-12.5], FeO <0.03,Al2O3 and Cr2O3 <0.05, H2O/LOI 18.0 wt%) gave the average probe formula
  {(Ni0.58Mg0.42)8(H2O)4(OH)4[Si12O30]}·(H2O)8. Powder X-ray diffraction (Table 1, p. 407)
  indexed on an orthorhombic sepiolite-type unit cell with a = 13.5, b = 26.9 A (printed as
  26.9 A on p. 408 and misprinted as 29.9 A in the p. 407 abstract; both the reported cell
  volume V = 1903 A3 = 13.5 x 26.9 x 5.24 A3 and d060 = 4.48 A in Table 1 confirm b = 26.9
  A), c = 5.24 A, Z = 2 (for the 8-octahedral formula) or Z = 4 (for Ni4Si6O15(OH)2(H2O)2·4H2O),
  Dmeas = 1.9(1) g/cm3 (low due to microporous fibrous aggregation), and Dcalc = 2.54 g/cm3
  (biaxial with mean refractive index <1.55, Mohs hardness 2-3). Differential thermal and
  thermogravimetric analysis up to 1000 degrees C demonstrated four-stage dehydration (15.1
  wt% total mass loss) followed by exothermic crystallization of orthopyroxene above 850 degrees
  C. Distinct from sepiolite, willemseite, pimelite, nepouite, and elemental nickel or magnesium;
  no criticality designation, microbial mechanism, or industrial recovery yield is asserted.'
