limitations:
- 'Neither study provides a closed phase-resolved mass balance, isolated copper yield,
  product purity or demonstrated industrial deployment. Source-evidence follow-up:
  https://github.com/CultureBotAI/CMMMech/issues/370.'
- The 2019 composition entries, mass-versus-molar wording and isolated CuS98 label
  remain source inconsistencies; current version notes and prior v2 reconciliation
  are not a newly acquired v2 binary.
- The 2021 control outcomes, precise Table 5 sampling day/fraction, feed/effluent
  accounting and biological replication remain unresolved.
- One public sequence run does not map both study sample labels or establish an organism-specific
  mechanism. No strain CURIE or causal enzyme assignment is curated.
- Full published originals and relevant supplements were inspected; no experiment,
  raw analytical data analysis or product characterization was independently repeated.
notes:
- Native capture and preliminary independent assessment began at the recorded start;
  final drafting and artifact hashes are actual. No owner corrections were supported
  or made.
- Primary artifacts were acquired by the author or reused from prior retained downloads
  and independently inspected here. Fresh ENA and EuropePMC authority requests for
