        material_form: >-
          Uranium-bearing electrolyte. ICP-OES measures total elemental U;
          the atom identifier grounds the element, not neutral atoms in solution
          or an oxidation-state measurement.
        sampled_fraction: >-
          Working-chamber solution filtered at 0.22 micrometres before
          preservation in 1% nitric acid.
        study_arm: abiotic
        result_status: measured
        value: 914
        unit: mg/kg
        analyzed_on: '2024-09-24'
        sampled_on: '2024-08-08'
        sampling_source_locator: 'T2_pH.csv; SampleID=BESU.8Va_W.t0; Date column'
        context: >-
          Source-labelled t0 point of the original abiotic run. It is a
