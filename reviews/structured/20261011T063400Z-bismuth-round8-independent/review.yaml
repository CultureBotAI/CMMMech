limitations:
- Filtered-solution depletion is a small-pool measurement; no closed balance of suspended
  feed, dissolved Bi and biomass or isolated-product yield is available.
- TEM-EDS and co-fractionation support association but do not identify a crystalline
  phase, Bi oxidation-state change, transport protein or causal polyphosphate tolerance
  mechanism.
- Time-course replication is unspecified; three fractionation replicates are not clearly
  independent biological cultures.
- ENA and NCBI live opens failed during review. Identity verification uses curator-retained
  official responses whose source, content and hashes were independently checked.
- The retained files named dodge2005.pdf and dodge2005-correct.pdf are HTML, not PDFs;
  review used the actual full HTML and figure images. No PDF inspection is claimed.
- Correction/counterevidence and duplicate searches are bounded by the stated scope;
  no exhaustive absence claim or guarantee about all literature is made.
