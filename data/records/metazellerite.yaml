    url: https://www.rruff.net/doclib/am/vol51/AM51_1567.pdf
    accessed_on: '2026-10-24'
mechanisms:
  - id: abiotic_topotactic_zellerite_dehydration
    name: Abiotic topotactic dehydration of zellerite to parallel-oriented metazellerite
    process: other
    description: >-
      Topotactic dehydration of orthorhombic zellerite (Ca(UO2)(CO3)2·5H2O, V =
      1065.4 Å3, Z = 4) into parallel-oriented crystallites of metazellerite
      (Ca(UO2)(CO3)2·3H2O, V = 879.5 Å3, Z = 4), contracting unit-cell volume by
      186 Å3 while preserving the orientation of crystallographic axes a, b, and
      c; from the 186 Å3 volume contraction (~19–23 Å3 per water molecule), the
      authors infer loss of 8 or 10 H2O molecules per unit cell and favor the 8
      H2O (5-to-3 hydrate) formula interpretation pending further verification,
      whereas the 6.9 wt% H2O- loss at 110 ± 5 °C is a separate
      chemical-analysis determination on zellerite (with part of H2O- treated as
      structural).
    context: >-
      Abiotic dehydration observed during X-ray beam exposure in Buerger
      precession single-crystal photography, storage in laboratory air (with low
      ambient relative humidity proposed as a stability condition), and separate
      110 ± 5 °C chemical drying; no microbial, enzymatic, or bioleaching
      mechanism was tested or reported in Coleman, Ross, and Meyrowitz (1966).
    microbial: false
    evidence:
      - source_ref: coleman_1966_metazellerite
        supports: support
        explanation: >-
          Buerger precession X-ray single-crystal photography demonstrates that
          orthorhombic zellerite (Ca(UO2)(CO3)2·5H2O, V = 1065.4 Å3, Z = 4)
          dehydrates topotactically under X-ray exposure and during
          laboratory-air storage (with low humidity discussed as a stability
          condition) into parallel-oriented crystallites of metazellerite
          (Ca(UO2)(CO3)2·3H2O, V = 879.5 Å3, Z = 4), contracting the unit-cell
          volume by 186 Å3 while preserving crystallographic axes a, b, and c;
          the authors infer a loss of 8 or 10 H2O per unit cell from the 186 Å3
          volume change and favor the 8 H2O (3H2O hydrate) formula pending
          further verification, while separately reporting 6.9 wt% H2O- lost on
          drying zellerite at 110 ± 5 °C in Table 2 (pp. 1570–1575).
