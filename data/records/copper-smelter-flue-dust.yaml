    description: Tth tetrathionate hydrolases (A. ferrooxidans tth AFE_0029; A. thiooxidans tth GCD22_14205, tth GCD22_02315) disproportionates tetrathionate and polythionate intermediates into sulfate and H+, contributing to Adapted Sarcheshmeh AMD consortium (A. ferrooxidans, A. thiooxidans, L. ferrooxidans; 10% v/v) in 9K medium (initial pH 1.8, 32-34 C, supplemental H2SO4 from day 114).
    evidence:
