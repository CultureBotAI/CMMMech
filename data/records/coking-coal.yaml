id: cmmmech:coking-coal
name: Coking coal
material_kind: commodity
description: >-
  Coal suitable for making coke, treated as an end-use commodity rather than a
  mineral species, the carbon element, coke itself or all coal. The EIA glossary
  defines coking coal as suitable bituminous coal. Its separate metallurgical-coal
  definition includes both coking coal and pulverized coal consumed in steelmaking,
  whereas the USGS 2026 fact sheet uses coking and metallurgical coal interchangeably
  in its coke-production scope. This record follows the narrower coke-making
  identity and records the original EU 2024 coking-coal designation without
  silently equating all metallurgical-coal uses. The experiment concerns
  beneficiation of selected Tabas feeds described by the authors as suitable for
  coking; retained coke-making performance after treatment was not demonstrated.
