limitations:
- The experimental feed has no demonstrated member-species identity or phase purity;
  fraction preparation for Fe/Si aliquots and earlier-reference cleaning details remain
  unresolved.
- No acid-matched, genetic knockout or rescue experiment establishes individual causal
  roles. The CAS detection-threshold contradiction is explicit; no positive siderophore
  mechanism is accepted.
- Retained authority/source files were independently inspected, not all freshly downloaded.
  The assembly and article disagree about platform/completeness; those claims remain
  excluded. Bounded web searches cannot prove global absence of contrary evidence.
