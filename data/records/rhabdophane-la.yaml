mechanisms:
- id: thermal_conversion_to_monazite
  name: Abiotic thermal conversion of synthetic La rhabdophane
  process: other
  microbial: false
  description: >-
    A synthetic La rhabdophane powder was thermally converted to
    La monazite by heating 200 mg in air at 1100 degrees C for
    6 hours. Powder X-ray diffraction identified the starting
    hydrated phase and the monazite product. This is a laboratory
    mineral transformation, not a microbial extraction experiment
    or a measured isolated-lanthanum recovery yield.
  context: >-
    The synthesis series used analytical lanthanide chlorides;
    for La, the precursor was LaCl3·7H2O. Four mmol of lanthanide
    chloride was mixed with 5 M H3PO4 at a metal:P molar ratio
    of 1:1.03, stirred for 15 minutes at 60 degrees C and held
    in Teflon for two weeks at 90 degrees C. Powders were washed
    twice with deionized water, then ethanol, centrifuged and
    air-dried overnight. The resulting rhabdophane and heated
    monazite powders were stored airtight at room temperature
    for approximately a year before calorimetry. PXRD/Rietveld
    analysis fitted the hydrated powder using a monoclinic C2
    model and the heated product as P21/n monazite; reported
    single-phase status is limited by diffraction detection.
    Separate 15-20 mg TGA/DSC runs in air used 10 degrees C/min
    over 30-1000 degrees C, with blank correction. La total-water
    content was reported as 0.804 H2O per LaPO4, including
    adsorbed and structural water. This is not a site-resolved
    water occupancy. The series-level 700-950 degrees C
    transformation interval is not adopted as an exact La
    equilibrium threshold; the transformation was not reversed.
  evidence:
  - source_ref: shelyug2018
    supports: support
    explanation: >-
      Material Preparation and Powder X-ray Diffraction, page 2,
      specify the synthesis, 1100 degrees C/6-hour treatment and
      structural models. Figure 1 shows the La starting/product
      diffraction traces; Table 1 and Figure 3/Table 2 report
      the phase and thermal characterization. These support
      the bounded abiotic conversion of this synthetic powder.
  - source_ref: shelyug2018
    supports: partial
    explanation: >-
      The abstract's stated water-content trend with ionic radius
      conflicts with the values in Table 2, and prose on pages
      4-5 gives conflicting directions for temperature trends;
      those generalized trends are not adopted. Total mass loss
      does not independently resolve structural versus adsorbed
      water. The irreversible heating test and thermodynamic
      calculations do not establish an equilibrium transition
      temperature, biological causation or industrial deployment.
