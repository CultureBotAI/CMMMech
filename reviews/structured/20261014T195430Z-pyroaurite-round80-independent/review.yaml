summary: Qualified acceptance of pyroaurite species identity and its occurrence in
  an inoculated field-trial arm. The record correctly withholds microbial enhancement,
  pure-product yield and industrial performance. No supported corrective defect found.
limitations:
- Unreplicated plots and nutrient-unmatched open-field controls cannot isolate microbial
  pyroaurite enhancement.
- Source-fitted minor-phase abundance and morphology do not yield an isolated product
  or phase-specific mass balance; original diffraction profiles are not supplied in
  the inspected main/SI.
- Figure/depth/analyte-label inconsistencies are explicitly retained; no uncurated
  correction or numerical conversion is inferred.
- Culture recovery is not a complete microbial census, and related hydromagnesite/laboratory
  outcomes are not transferred.
- Bounded DOI notice searches and current Crossref snapshots are not proof that every
  correction or conflicting publication has been found.
assessments:
- assessment_id: identity
  area: identity
  topic: Species, group and material boundaries
  outcome: supported
  summary: Mg6Fe3+2(OH)16(CO3)·4H2O pyroaurite has current IMA Rd/1865 identity; this
    does not denote hydrotalcite, generic layered double hydroxides or the mixed tailings
    feed.
  target_ids:
  - cmmmech:pyroaurite
  evidence_ids:
  - record
  - ima
  - handbook
- assessment_id: design
  area: evidence
  topic: Field design and unmatched controls
  outcome: supported
  summary: Two unreplicated 1×1×0.5 m plots received 40.5 L 0.22 M sulfuric acid in
    creek water. At two weeks, Bio received 2 L local consortium plus 18 L BG-11/creek-water
    medium, while Chem received 20 L creek water. Nine additional weeks gives eleven
    total. Equal liquid volumes do not match nutrients; open plots are not sterile.
    Triplicate depth subsamples are not replicated treatment plots. No resolved taxon
    or strain is assigned.
  target_ids:
  - cmmmech:pyroaurite
  evidence_ids:
  - record
  - primary
- assessment_id: phase
  area: evidence
  topic: Pre-existing phase and endpoint denominator
  outcome: supported
  summary: Table1 already contains 1.3–2.6 wt% pyroaurite in untreated depth intervals.
    Final 2–4 cm averages are Chem 2.6 and Bio 2.5 wt%; TablesS4–S5 individual values
    are Chem 2.6/2.5/2.5 and Bio 2.9/3.2/1.3. Those source-fitted phase proportions
    establish occurrence, not increased microbial production, pure-phase recovery,
    statistically replicated enhancement or a phase-specific mass balance. Figures2/5
    provide field/morphology context, not independent quantitative identification.
  target_ids:
  - cmmmech:pyroaurite
  evidence_ids:
  - record
  - primary
  - si
- assessment_id: preparation
  area: evidence
  topic: Analytical handling and unavailable underlying patterns
  outcome: supported
  summary: Air drying, fluorite addition, ethanol milling, drying and Rietveld/Pawley
    fitting are retained. Complete original and five-page SI provide fitted abundance/Rwp
    tables, not the underlying diffraction profiles. Patterns/refinements were therefore
    not reproduced. Low-abundance uncertainty and chemically driven dissolution/reprecipitation
    remain material alternatives.
  target_ids:
  - cmmmech:pyroaurite
  evidence_ids:
  - record
  - primary
  - si
- assessment_id: contradictions
  area: evidence
  topic: Source label, depth and nutrient conflicts
  outcome: supported
  summary: Figure7 visibly labels A Control/B Chem/C Bio; adjacent discussion swaps
    A/C. The curated interpretation follows table/graph rather than that prose. Two-week
    hydromagnesite 2–4 cm prose conflicts with Methods/Table1/SI2–17 cm, so it is
    not transferred. SI TableS1 uses elemental nutrient bases PO4-P/NO2-N/NO3-N versus
    main ion labels; no concentration conversion or new observation was invented.
  target_ids:
  - cmmmech:pyroaurite
  evidence_ids:
  - record
  - primary
  - si
- assessment_id: microbial
  area: scope
  topic: Association, null field outcomes and scale
  outcome: supported
  summary: Microbial true denotes the deliberately inoculated arm, not necessity or
    pyroaurite-specific causation. No obvious surface crust or macroscopic microbial
    growth developed; later BG-11 recovery establishes culturable cyanobacteria under
    that assay only. The prior four-week laboratory crust and hydromagnesite response
    are not pyroaurite effects here. Field deployment is an experiment, not commercial
    carbon removal or Mg recovery.
  target_ids:
  - cmmmech:pyroaurite
  evidence_ids:
  - record
  - primary
  - si
