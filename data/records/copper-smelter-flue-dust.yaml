      supports: partial
      explanation: Chemolithoautotrophic sulfur and iron oxidation by the adapted consortium (alongside external H2SO4 additions in the net-acid-consuming continuous system) maintains the acidic ferric/sulfate lixiviant in 9K medium at 32-34 C in Bakhtiari et al. (2008).
  - source: adapted_mesophilic_consortium_9k_leach_system
    target: acid_preleached_sarcheshmeh_smelter_flue_dust
    predicate: solubilizes
    relationship: culture-associated and acid-assisted oxidative leaching of H2SO4-pretreated copper-smelter flue dust at 2-7% wt/vol
    description: In batch shake flasks (16-30 days) and a 180-day two-stage continuous stirred-tank campaign (2.7-6 days residence time at 32-34 C), the adapted consortium in 9K medium leaches copper from H2SO4-pretreated Sarcheshmeh flue dust at 2%, 4%, and 7% wt/vol.
    evidence:
    - source_ref: bakhtiari2008
      supports: support
      explanation: Section 2.3 and Table 3 of Bakhtiari et al. (2008) show higher copper extractions in biological shake flasks (87%, 88%, 81%) than in sterile flasks (39%, 45%, 47%) at 2%, 4%, and 7% wt/vol, while continuous-reactor runs (Table 4) lacked matched abiotic reactor controls and experienced ~10% evaporation loss per stage.
  - source: acid_preleached_sarcheshmeh_smelter_flue_dust
    target: extracted_copper_from_preleached_dust
    predicate: produces
    relationship: copper extraction from preleached dust of 81-88% in batch biological flasks and 86.8-90.3% tabulated maxima in two-stage continuous reactors
    description: Leaching of the acid-pretreated dust yields 87% (2% wt/vol, 16 d), 88% (4% wt/vol, 23 d), and 81% (7% wt/vol, 30 d) Cu extraction in biological shake flasks (vs 39-47% in sterile flasks) and tabulated two-stage CSTR maxima of 89.7% (2%, 2.7 d), 90.3% (4%, 4 d), and 86.8% (7%, 6 d, 34 C).
    evidence:
    - source_ref: bakhtiari2008
      supports: partial
      explanation: Tables 3 and 4 and Figures 2-5 of Bakhtiari et al. (2008) report the batch and continuous extraction percentages for preleached dust; support is partial because continuous treatments were sequential non-replicated operating intervals with ~10% evaporation volume loss, batch Interventions at 7% loading, and no closed combined preleach-plus-bioleach copper balance.
