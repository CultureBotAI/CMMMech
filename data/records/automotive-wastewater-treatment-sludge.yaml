    annotation_note: Grounded to reference-proteome entry UP000363590 for type strain Acidithiobacillus thiooxidans ATCC 19377 (NCBITaxon:637390), representing Acidithiobacillus thiooxidans DSM 11478 (NCBITaxon:930) in Yagnentkovsky et al. (2009).
    evidence:
