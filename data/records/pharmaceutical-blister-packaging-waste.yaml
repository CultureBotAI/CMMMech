    description: Biogenic sulfuric-acid media from A. caldus DSM 8584 (45 C) and A. thiooxidans DSM 504 (30 C) dissolve the metallic aluminium layer from shredded PVC-Al blister waste (<4 mm and <10 mm) at 2% (w/v) over 7 days.
