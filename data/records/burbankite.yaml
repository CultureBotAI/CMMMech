mechanisms:
- id: synthetic_la_ca_analogue_formation
  name: High-pressure formation of a synthetic La-Ca carbonate with burbankite structure
  process: other
  microbial: false
  description: Milani et al. synthesized a burbankite-structure carbonate from a nominal
    Na3Ca2La(CO3)5 mixture at 5 GPa and 1073 K for 24 h. The recovered laboratory assemblage
    also contained a Ca-rich La oxide, so it was not a demonstrated pure carbonate product.
    Electron microprobe analysis and single-crystal X-ray diffraction characterize the carbonate;
    its ambient structure was refined in P63mc. This establishes formation and La incorporation
    in a synthetic analogue. It does not demonstrate recovery from a natural ore, quantitative
    La capture, a species-wide compositional endmember or industrial deployment.
  context: 'Carbonate powders in the stated stoichiometric proportions were sealed in a
    platinum capsule 3.5 mm long and 2 mm in diameter and heated in a multi-anvil apparatus
    at about 40 K/min. The reported temperature accuracy was ±20 K and assumed pressure
    uncertainty ±3 percent. Starting powder identities, purities and mass, phase yield and
    independent synthesis replication are not specified. Twenty microprobe points characterize
    the synthetic carbonate, not twenty independent synthesis runs. The nominal formula
    differs from its reported analytical composition; the prose and Table 1 state a five-oxygen
    normalization without explicitly distinguishing metal-oxide oxygen from the full carbonate
    formula. A metal-oxide-only basis could explain that wording, so it is not treated as
    proof of an erroneous formula. Na uncertainty is (14) in the prose/CIF and (13) in Table
    1. No exact analytical formula is adopted here. Separate pressure and temperature diffraction
    arms must not be pooled with the synthesis. Thermal coverage and fitted coefficients
    conflict between abstract/methods and published tables/results: the reported 746 K maximum
    exceeds the 628 K maximum in Table 5 and Supplement Table S4, and the abstract and Results
    give different thermal-expansion coefficients. No disputed thermal coefficient, extrapolated
    mantle density or natural phase stability boundary is adopted.'
  evidence:
  - source_ref: milani2022
    supports: support
    explanation: Experimental p.352 and Figure 1 establish the conditions and mixed recovered
      assemblage. Results pp.353–355 and Tables 1–3 characterize the synthetic carbonate
      and refined structure; they support the bounded laboratory formation claim, not natural-ore
      recovery or pure-product yield.
  - source_ref: milani2022supp
    supports: partial
    explanation: The CIF explicitly identifies a synthetic source made at 5 GPa and 1073
      K. Tables S1–S4 and Figures S1–S3 provide structure and elastic context; Table S4
      ends at 628 K. These files do not resolve all printed formula/thermal inconsistencies
      or provide a phase yield.
