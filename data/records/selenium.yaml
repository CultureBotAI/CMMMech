  - source: fcca_fumarate_reductase
    target: soluble_selenite_se4
    predicate: reduces
    relationship: periplasmic four-electron reduction of Se(IV)
    description: Periplasmic FccA is conditionally implicated by deletion kinetics and fumarate competition as the major contributor to initial 12 h selenite reduction in washed non-growing S. oneidensis MR-1 suspensions, without direct purified-enzyme proof.
    evidence:
    - source_ref: li_2014
      supports: partial
      explanation: In Li et al. (2014) Figure 2 and Results, delta-fccA reduced the initial 12 h selenite-depletion rate from 1.35 +/- 0.05 micromol/h in wild type to 0.54 +/- 0.13 micromol/h (standard errors of triplicate cultures, ~60% decrease) and 20 mM exogenous fumarate suppressed selenite reduction, supporting conditional FccA involvement in non-growing cells without genetic complementation, purified-FccA enzymatic kinetics, or elimination of residual non-FccA reduction.
  - source: mtrc_outer_membrane_cytochrome
    target: soluble_selenite_se4
    predicate: modulates
    relationship: minor parallel outer-membrane electron transfer
    description: Outer-membrane decaheme cytochrome MtrC (and the MtrCAB complex) plays at most a minor parallel role in selenite reduction compared with FccA in washed non-growing S. oneidensis MR-1 suspensions.
    evidence:
    - source_ref: li_2014
      supports: partial
      explanation: Li et al. (2014) report that outer-membrane Mtr-pathway deletion mutants retain most selenite-depletion activity relative to delta-fccA in washed non-growing S. oneidensis MR-1 suspensions (0.5 mM selenite, 20 mM lactate, 30 degrees C), indicating that extracellular MtrC electron transfer is not the primary route under these conditions.
  - source: soluble_selenite_se4
    target: elemental_se0_nanoparticles
    predicate: transforms_into
    relationship: reductive precipitation of Se(0) nanospheres
    description: Microbial reduction of 0.5 mM soluble selenite in washed non-growing S. oneidensis MR-1 suspensions yields predominantly intracellular and smaller surface Se(0)-assigned particles quantified by whole-suspension acid digestion/ICP-AES balance.
    evidence:
    - source_ref: li_2014
      supports: partial
      explanation: Li et al. (2014) Figure 5 TEM/EDX and 48 h Se 3d XPS on washed lyophilized cells (plus negligible autoclaved-cell adsorption in Supporting Figure S1 and acid-digestion/ICP-AES selenium balance in Table 1) support cellular reduction of selenite to predominantly intracellular and smaller surface Se(0)-assigned particles, without proving exclusive periplasmic accumulation or isolated phase-pure Se(0) recovery.
