mechanisms:
  - id: pseudomonas_bioalteration
    name: Heterotrophic microbial alteration of lead blast-furnace slag
    process: bioleaching
    description: >-
      Living Pseudomonas aeruginosa cultures altered a real lead-smelting
      residue in laboratory reactors with weekly medium renewal. Compared
      with sterile growth medium, the inoculated treatment increased
      cumulative elemental release into the operational digested-liquid
      fraction. Filtered and digested fractions differed, consistent with
      particulate association as well as dissolved mobilization. These
      measurements do not uniquely quantify cell-surface sorption, isolate
      a metal product, or establish a commercial recovery process.
    context: >-
      Chapter 8 Section 8.2 describes duplicate experiments with 2.5 g of
      slag grains, reported as 2 mm diameter, in 75 mL of medium in
      150 mL polycarbonate flasks at 23 +/- 2 degrees C and 100 rpm for
      140 days. The three arms were ultrapure water, sterile growth medium,
      and growth medium with P. aeruginosa. Fresh medium was supplied
      every seven days. Per litre the medium contained 4 g succinic acid,
      1 g ammonium sulfate, 1 g disodium hydrogen phosphate and 6 g TRIS.
      Methods specify NaOH adjustment to pH 7.8; results instead describe
      initial medium pH 8.2, increasing to 8.5 in the biotic arm and
      remaining 8.2 in the sterile arm. These reported settings are
      retained separately. General thesis methods, Section 4.1.2, identify
      the research strain as CIP 105094 from Institut Pasteur; Chapter 8
      itself names the species without repeating its accession. An
      inoculum dose and a Chapter-8-specific slag sterilization protocol
      were not specified in the inspected methods. The digested sample
      used hydrogen peroxide and heating; the filtered sample excluded
      suspended cells and neoformed precipitates. The PDF prints the
      filter pore-size unit as micrograms, which is dimensionally invalid;
      a corrected pore diameter is not inferred. Separate polished-section
      observations at 60 and 150 days are not the same endpoint as the
      140-day liquid series or the 128-day cumulative table. Industrial
      feedstock origin does not establish industrial operation of this
      laboratory weathering experiment.
    microbial: true
    organisms:
      - id: NCBITaxon:287
        label: Pseudomonas aeruginosa
    evidence:
      - source_ref: yin2014_thesis
        supports: support
        explanation: >-
          Sections 8.2.1-8.2.3 establish feed origin, medium, duplicate
          control arms and ICP-AES measurement. Figures 8.1 and 8.7 and
          Table 8.3 support greater cumulative release in digested biotic
          liquid than in sterile medium under the reported conditions.
          This is a treatment-level comparison, not a demonstrated
          molecular mechanism. Figure 8.6 shows bacterial colonization
          of the slag surface; the neighboring abiotic images also show
          glass and lead-droplet alteration.
      - source_ref: yin2014_thesis
        supports: partial
        explanation: >-
          Table 8.3 reports 128-day cumulative Zn release of 260.4
          micrograms per gram of slag in digested biotic liquid and
          257.0 micrograms per gram in ultrapure water, versus 42.6 in
          sterile medium. The water arm therefore precludes describing
          Zn release as universally or exclusively microbially driven.
          The filtered biotic Zn value is 136.8 micrograms per gram of
          slag; it represents a different sampled fraction, not a lower
          total extraction experiment. The source does not establish
          statistical superiority over water or a recovered-metal yield.
      - source_ref: yin2014_thesis
        supports: partial
        explanation: >-
          Sections 8.3.1 and 8.4.1 and Figure 8.7 attribute differences
          between digested and filtered liquid to metal association with
          cells or biofilm. Filtration also removes neoformed precipitates,
          so that difference alone cannot distinguish biosorption,
          intracellular accumulation and noncellular particulate metal.
          The narrative's 28% dissolved and 72% associated Fe are not
          arithmetically consistent with Table 8.3 values 91.1 and
          270.1 micrograms per gram. No corrected fraction or exclusive
          biosorption yield is adopted.
      - source_ref: yin2014_thesis
        supports: context_only
        explanation: >-
          Section 8.4.3 and schematic Figure 8.9 propose siderophore
          complexation and cell-surface binding to explain enhanced
          mobilization. They do not directly identify or quantify those
          ligands in this experiment. Table 8.4 extrapolates complete
          leaching times while neglecting protective secondary layers;
          these are model extrapolations, not observed field lifetimes
          or industrial treatment times. Neither criticality nor a
          separated product recovery is established.
