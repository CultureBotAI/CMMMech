id: cmmmech:weeksite
name: Weeksite
material_kind: mineral
description: >-
  Potassium uranyl silicate hydrate mineral with current September 2026
  IMA-CNMNC approved formula (K)2(UO2)2(Si5O13)(H2O)2·2H2O, status A, and
  special-procedure approval year 1962 s.p. (not a numbered IMA-XXXX-YYY
  accession). Outerbridge, Staatz, Meyrowitz, and Pommer (1960) described the
  holotype from opal-fluorite-calcite veinlets in porphyritic rhyolite at the
  Autunite No. 8 claim, east side of the Thomas Range, Juab County, Utah, USA,
  and documented nine additional occurrences in Utah, California, New Mexico,
  Wyoming, Pennsylvania, Texas, Arizona, and Chihuahua, Mexico. Microchemical
  analysis of ~100 mg of purified Thomas Range type material (Table 3, p. 46:
  SiO2 33.6, UO3 51.5, K2O 5.5, BaO 1.4, CaO 1.1, Na2O 0.7, Al2O3 0.6, CO2 0.3,
  H2O 6.6, Fe2O3 <0.1, sum 101.3 wt%) and single-crystal precession / powder
  X-ray diffraction led the 1960 authors to propose the orthorhombic Pnnb
  formula K2(UO2)2(Si2O5)3·4H2O (a = 14.26(2), b = 35.88(10), c = 14.20(2) A,
  Z = 16). Later structural studies cited in the IMA Master List (including the
  paywalled second reference Mineralogical Magazine 90 (2026), 653, which was
  not acquired at curation) revised the silicate-sheet stoichiometry from
  (Si2O5)3 (6 Si per 2 U) to (Si5O13) (5 Si per 2 U); both the 1960 analytical
  formula and the current IMA formula are retained with explicit attribution.
  Outerbridge et al. (1960) also demonstrated laboratory hydrothermal synthesis
  of weeksite and its Na analogue in sealed Pyrex tubes at 150 degrees C.
  Distinct from haiweeite, boltwoodite, uranophane, and elemental uranium; no
  criticality designation, microbial mechanism, or industrial recovery yield is
  asserted.
