  summary: MAF is an A. ferrooxidans-dominated enrichment; source-named Sulfolobus
    metallicus was used at 45 °C, and MT after 65 °C selection is unresolved. Aerobic
    100 mL cultures in 250 mL flasks, 120 mM Fe(II), initial pH 2.3–2.6 and varying
    ammonium are explicit. At 36 °C, 5.4/9.4 mM ammonium gave schwertmannite, 11.5–85.4
    mM mixed phases, and 165–805 mM ammoniojarosite by XRD. Table 3 already identifies
    ammoniojarosite at 165 mM, unlike the conclusion above 165 mM. Formation at 22
    °C took about two months versus seven days at 36 °C or higher; these are not measured
    precipitation kinetics. Ferric abiotic preparations differ in ammonium, time and
    temperature and are expressly unmatched. Sample 6.6 is 65 °C in Methods, Tables
    1/4 and the Figure 4 plot but 45 °C in Table 3 and Figures 4/9 captions; Figure
    7 says 35 °C versus 36 °C elsewhere. Nitrogen deficits, inferred hydronium substitution
    and possible biomass nitrogen preclude pure-endmember or biological-yield claims.
    Morphology lacks a matched living/inactive comparison or unique biosignature proof.
