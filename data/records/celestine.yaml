id: cmmmech:celestine
name: Celestine
material_kind: mineral
description: Celestine, also called celestite in the primary study, is the orthorhombic strontium sulfate
  mineral SrSO4 in the barite group. It is distinct from strontianite, elemental strontium, mixed sulfate
  phases, strontium-containing solutions and the industrial baryte commodity. The September 2026 IMA list
  reports approved status with 1967 s.p.; this special-procedure notation is not a unique numbered mineral
  accession. The curated laboratory study identifies celestine alongside strontianite on cyanobacterial
  cell surfaces; no mineral-specific criticality designation, pure-phase recovery yield or industrial
  application is inferred.
