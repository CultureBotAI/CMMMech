mechanisms:
  - id: acidophile_capacitor_leaching_limit
    name: No detected tantalum mobilization in an acidophile capacitor-scrap assay
    process: bioleaching
    description: >-
      A living mixed iron- and sulfur-oxidizing acidophile culture mobilized
      several base metals from tantalum capacitor scrap, but Ta was not detected
      in the reported leachate. This experiment limits claims that the tested
      culture directly solubilizes Ta from this feed. It does not demonstrate
      that all microbial Ta leaching is impossible or establish a recovered
      tantalum product from the remaining solids.
    context: >-
      The paper names Acidithiobacillus ferrooxidans, Leptospirillum ferrooxidans
      and Acidithiobacillus thiooxidans in the mixed culture, without strain
      accessions, relative abundance or member-specific activity tests. No
      organism identifiers are assigned to this unresolved experimental mixture.
      Visually identified surface-mount capacitors from spent mobile phones
      were manually removed and ground to 0.5 and 0.75 mm fractions. Table 1
      reports Ta at 292.5 g/kg (SD 2.32) after HF-containing microwave digestion
      for both fractions; this is bulk elemental composition, not a Ta phase
      determination. Laboratory trials used 250 mL Erlenmeyer flasks, 100 mL
      actively growing modified 9K culture, 2% w/v scrap, 30 degrees C and
      150 rpm for 10 days, with pH maintained at 1.8 using 10% v/v sulfuric
      acid. Activation medium contained elemental sulfur and ferrous sulfate.
      The study varied initial iron in its PCB assays, but does not unambiguously
      specify the final ferrous concentration for the capacitor comparison.
      Medium sterilization is described at 121 degrees C for 30 min, with
      ferrous sulfate excluded. The sentence concerning sterilization of
      the samples is grammatically ambiguous, so feed sterility is not
      assumed. Experiments were triplicate with non-inoculated medium
      controls; 0.45 micrometre-filtered liquor was sampled every second day,
      with sterile water replacing sampling and evaporation losses.
    microbial: true
    evidence:
      - source_ref: sikander_2022
        supports: refute
        explanation: >-
          Refutes efficient direct Ta solubilization by this specific acidophile
          treatment, not all microbial Ta processing. Section 4.3 states that
          Ta was not detected in the leachate. Figure 12 shows no Ta mobilization
          bar for either capacitor particle fraction; supplementary Table S6
          records Ta concentration as u and leached percentage as 0 for both
          Ta.Cap rows. The supplement does not define u or provide a numeric
          Ta detection limit. Those entries are therefore not curated as
          measured zero concentrations or a quantified recovery percentage.
      - source_ref: sikander_2022
        supports: partial
        explanation: >-
          The microorganism-containing experiment and uninoculated controls
          test this laboratory protocol, but maintained acidity and added iron
          do not isolate each consortium member or prove an enzymatic mechanism.
          Removal of other metals is not itself a measured Ta enrichment factor,
          recovered mass, purity or mass balance. Supporting Table S1 is a
          composition table for digestion without HF, despite the Methods'
          reference to it as ICP-OES validation; it supplies no calibration
          or Ta detection-limit study. Table 1's HF digest and S1's non-HF
          digest cannot be treated as interchangeable estimates of total Ta.
          The study's broader upscaling discussion does not show industrial
          deployment, and the native insolubility or chemical form of the
          residual Ta was not resolved in this assay.
