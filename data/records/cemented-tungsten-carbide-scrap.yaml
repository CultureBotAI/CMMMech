id: cmmmech:cemented-tungsten-carbide-scrap
name: Cemented tungsten carbide scrap
material_kind: secondary_resource
description: Discarded hardmetal production components composed of tungsten carbide with cobalt or cobalt-nickel binder, represented by rolling-mill rollers and brazed cutting tips in the Chaika study. This manufactured secondary resource is distinct from pure tungsten carbide, a mineral species, tungsten mining tailings and metal grinding sludge. The sampled shapes and compositions do not define every hardmetal waste stream. No criticality designation or industrial deployment is inferred.
sources:
- id: chaika2013_hardmetal
  title: Chaika, Derbasova and Gavrish (2013), Research division of tungsten carbide and cobalt as a result of microbiological waste destruction of tungstencobalt waste. Visnyk NTUU KPI, Mechanical Engineering 3(69), 125-130. Complete Russian original, Figures 1-3, Tables 1-6, Equations 1-8. Publisher portal posting date 2014-01-07 differs from printed issue year 2013. Publisher-declared DOI 10.20535/2305-9001.2013.69.29004 returned 404 at both DOI resolver and Crossref on the access date; the official article/PDF is accessible.
  url: https://journal.mmi.kpi.ua/old/article/view/29004
  accessed_on: '2026-10-12'
- id: ncbi_ferrooxidans
  title: NCBI Taxonomy 920, Acidithiobacillus ferrooxidans; Thiobacillus ferrooxidans is a homotypic synonym. Species nomenclature only, without authentication of the experimental culture.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920&mode=Info
  accessed_on: '2026-10-12'
mechanisms:
- id: culture_ferric_associated_binder_mobilization
  name: Culture and ferric-solution-associated hardmetal binder mobilization
  process: bioleaching
  description: A source-described bacterial ferric-sulfate solution was used in a continuously mixed hardmetal-scrap experiment. The authors report cobalt and nickel transfer into liquor and a tungsten-rich solid residue, with spent ferrous liquor routed to fermenters for biological ferric regeneration. This supports association with the reported culture-containing workflow. Ferric attack, electrochemical dissolution and mechanical abrasion also occur in the authors' process description; without matched controls it does not isolate a microbial enhancement or demonstrate a specific contact-mediated pathway.
  context: Pages 125-128 describe production waste with Co binder in cutting tips and Co-Ni binder in rolling-mill rollers, mixed with the biological solution at a liquid-to-solid volume ratio of 1:1. This is not a mass loading. The apparatus is referred to a 2012 paper; its construction is not specified in this article. The working-solution criteria are ferric Fe above 4 g/L and pH below 4, with a seven-day time course. The source names Thiobacillus ferrooxidans and also an association of thionic bacteria; a verified pure culture is not established. Strain accession, stock provenance, inoculum density, nutrient recipe, incubation temperature, reactor volume, agitation rate, replicated leaching runs and analytical uncertainty are not supplied. Residue was decantation-washed and dried at 85 degrees C; that is a recovery preparation temperature, not the leaching temperature.
