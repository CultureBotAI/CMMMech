id: cmmmech:biotite
name: Biotite mica series
material_kind: mineral_group
description: Biotite denotes a compositional series of trioctahedral micas in or near the field between
  the annite-phlogopite and siderophyllite-eastonite joins in the IMA-approved mica nomenclature of Rieder
  et al. (1998). It is represented here as a mineral group, not an individual mineral species. The IMA's
  2019 compendium reproduces Whitney and Evans (2010), which labels biotite as GROUP. No constituent criticality
  designation is inherited. The experimental feed below is author-designated biotite; its bulk oxide composition
  does not establish a particular member species or quantitative phase purity.
