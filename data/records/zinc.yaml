    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000001362 for Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159).
    evidence:
    - source_ref: fowler_crundwell_1999
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 sulfur-oxidation enzyme (AFE_1792) for oxidative sulfur/acid generation in fowler_crundwell_1999; individual sqr/tth genes were not mutated.
  - uniprot_accession: UniProtKB:B7J3C9
    entry_name: TTH_ACIF2
    protein_name: Tetrathionate hydrolase
    gene_symbol: tth
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:243159
      label: Acidithiobacillus ferrooxidans ATCC 23270
    reference_proteome_id: UP000001362
    ec_numbers:
    - EC:3.12.1.-
    interpro_ids:
    - InterPro:IPR018391
    - InterPro:IPR002372
    - InterPro:IPR011047
    - InterPro:IPR015943
    pfam_ids:
    - Pfam:PF13360
    functional_role: Periplasmic tetrathionate hydrolase (EC 3.12.1.-; tth / AFE_0029) hydrolyzing tetrathionate into thiosulfate, elemental sulfur, and sulfate, generating sulfuric acid protons.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000001362 for Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159).
    evidence:
    - source_ref: fowler_crundwell_1999
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 sulfur-oxidation enzyme (tth) for oxidative sulfur/acid generation in fowler_crundwell_1999; individual sqr/tth genes were not mutated.
  evidence:
  - source_ref: fowler_crundwell_1999
    supports: support
    explanation: Methods and Figures 2-6 compare inoculated and microscopy-checked sterile runs. Dissolution diverged after approximately 8-12 h; surface comparisons at Fe(II) 4 g/L after 100 h and 8 g/L after 69 h support the authors' sulfur-removal interpretation. No recovery percentage is inferred from the plots.
  - source_ref: fowler_crundwell_1999
    supports: partial
    explanation: Figures 2-3 include a 1 g/L Fe(II) series whose paired data appear inconsistent with the Discussion's sharp low-ferrous null boundary. A universal 1 g/L threshold is therefore not curated. Shrinking-core fits and SEM/EDAX are mechanistic support, not enzyme assays, sulfur mass balance, or independent process replication.
  - source_ref: fowler_crundwell_1998
    supports: partial
    explanation: Methods and Figures 4-6 report similar zinc dissolution with FC1 and sterile controls when Fe(II) was held at 1 g/L and Fe(III) varied, at pH 1.6, 35 degrees C and 5 g concentrate/L. Bacterial iron oxidation and surface attachment occurred, but no additional dissolution was demonstrated under those conditions. This bounds the later enhancement claim; neither study justifies a universal direct bacterial leaching mechanism.
