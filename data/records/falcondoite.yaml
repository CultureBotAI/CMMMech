mechanisms:
- id: abiotic_thermal_dehydration_and_orthopyroxene_crystallization
  name: Four-stage thermal dehydration to orthopyroxene and weak MgCl2 ion-exchange leaching
    of falcondoite
  process: other
  description: Heating natural falcondoite at 8 degrees C/min from 25 to 1000 degrees C in
    DTA/TGA produced four endothermic dehydration steps totaling 15.1 wt% mass loss—7.0 wt%
    zeolitic water lost between 25 and 200 degrees C (DTA endotherm at 180 degrees C), 3.1
    wt% and 2.3 wt% structurally bound water lost across 200-370 degrees C (360 degrees C
    peak) and 370-600 degrees C (540 degrees C peak), and 2.3 wt% hydroxyl water lost across
    600-850 degrees C (840 degrees C peak)—followed by an exothermic reaction at ~850 degrees
    C and solid-state recrystallization to orthopyroxene by 1000 degrees C; separately, reacting
    100 mg falcondoite in 50 mL of 1 M MgCl2 solution at 60-70 degrees C for 3 weeks leached
    only 0.24% Ni (1.14% of total mineral Ni).
  context: Laboratory DTA/TGA and ion-exchange experiments reported by Springer (1976), Table
    3 and pp. 408-409, on Loma Peguera falcondoite pre-dried at 60 degrees C (which already
    removed 7 wt% loosely held moisture). The low Ni extraction in hot 1 M MgCl2 confirms
    that Ni2+ is octahedrally coordinated within the ribbon structure rather than weakly adsorbed
    on external channel surfaces.
  microbial: false
  evidence:
  - source_ref: springer_1976_falcondoite
    supports: support
    explanation: Table 3 and pp. 408-409 document the four DTA endothermic peaks (180, 360,
      540, and 840 degrees C) and corresponding TGA mass losses (7.0% zeolitic H2O at 25-200
      degrees C, 3.1% and 2.3% bound H2O at 200-370 and 370-600 degrees C, and 2.3% hydroxyl
      H2O at 600-850 degrees C; 15.1% total loss at 25-1000 degrees C) and state that heating
      to 1000 degrees C converts falcondoite to orthopyroxene.
  - source_ref: springer_1976_falcondoite
    supports: partial
    explanation: Page 409 reports that soaking 100 mg falcondoite in 50 mL of 1 M MgCl2 at
      60-70 degrees C for 3 weeks extracted only 0.24% Ni (1.14% of total contained Ni), showing
      that abiotic salt exchange alone does not substantially leach structural Ni.
