mechanisms:
- id: bacillus_concentrate_bioweathering
  name: Bacterial enhancement of rare-earth mobilization from mixed phosphate concentrate
  process: bioleaching
  description: A culture identified by the authors as Bacillus thuringiensis enhanced aqueous rare-earth release from the mixed concentrate relative to corresponding abiotic controls. Unbuffered cultures acidified strongly; enhanced release also occurred in MES-buffered medium near pH 6. Metabolite profiles and separate organic-acid leaching assays support a contribution from proton attack and organic ligands, without resolving each metabolite's contribution in the living culture. This is laboratory bio-weathering and mobilization, with partial immobilization in secondary precipitates, not an isolated rare-earth product or an industrial recovery process.
  context: The isolate came from topsoil at the Renju regolith-hosted rare-earth deposit in Guangdong, China; that location is not established as the concentrate's origin. Section 2.2 refers to sequence comparison by BLAST but supplies no isolate accession or independently verifiable sequence in the reviewed article and supplement. Concentrate was crushed and sieved to 48-74 micrometres, washed ultrasonically with ethanol and ultrapure water and freeze-dried. Assays used 0.5 g of sterile feed and 100 mL medium in 250 mL flasks, approximately 1e6 CFU/mL initially, 180 rpm and 25-28 degrees C for 30 days. Cells were harvested in exponential phase and washed three times. Medium contained, in g/L, glucose 10, NH4Cl 1, MgSO4.7H2O 1 and KCl 0.2, initially pH 6, with or without 20 mmol/L MES. No additional phosphorus was supplied. Each medium had a biotic feed arm, an abiotic feed control and a cells-only control. Time-course measurements used three replicates; metabolomics on days 4, 8 and 15
    used six biotic-feed and five cells-only replicates. CFU counts exclude attached cells. Aqueous elemental analyses used centrifuged, 0.22-micrometre-filtered samples and ICP-MS. Separate chemical tests used 0.1 g feed in 20 mL of HCl or 1 mmol/L organic-acid solution, initial pH 3, 5 or 6, at the same temperature and agitation for 96 h in triplicate. These chemical assays were not a 30-day pH-trajectory-matched replacement for the biological experiment.
