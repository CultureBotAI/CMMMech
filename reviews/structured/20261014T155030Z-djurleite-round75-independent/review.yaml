limitations:
- Reported XRD is not shown, associated copper minerals contribute and the purity
  calculation is unexplained.
- No matched uninoculated leaching time course, replication/error estimates, closed
  copper balance or isolated product recovery.
- Inoculum optimum and initial graph baseline conflict; redox-unit/reference and inoculum
  iron carryover remain unresolved.
- Species taxonomy does not authenticate Atf.6 or establish identity with related
  LD-1 strains.
- Attachment assay uses different preparation and conditions; correlation does not
  identify a direct attack pathway.
- Related source follow-ups and bounded notice/supplement checks are not exhaustive;
  inaccessible related originals were not imported.
