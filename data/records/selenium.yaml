    - InterPro:IPR027477
    - InterPro:IPR012286
    pfam_ids:
    - Pfam:PF14537
    - Pfam:PF00890
    functional_role: Periplasmic tetraheme flavocytochrome c fumarate reductase FccA (EC 1.3.2.4; SO_0970) acting as the principal periplasmic selenite Se(IV) reductase in non-growing MR-1 cells.
    evidence:
    - source_ref: li_2014
      supports: support
      explanation: Deletion of fccA strongly reduces selenite reduction rate during the first 12 hours in non-growing Shewanella oneidensis MR-1 suspensions.
  - uniprot_accession: UniProtKB:Q8E8S0
    entry_name: CYMA_SHEON
    protein_name: Tetraheme c-type cytochrome CymA
    gene_symbol: cymA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:211586
      label: Shewanella oneidensis MR-1
    reference_proteome_id: UP000008186
    ec_numbers:
    - EC:7.1.1.8
    interpro_ids:
    - InterPro:IPR051174
    - InterPro:IPR036280
    - InterPro:IPR024717
    - InterPro:IPR005126
    - InterPro:IPR038266
    pfam_ids:
    - Pfam:PF03264
    functional_role: Inner-membrane tetraheme c-type menaquinol dehydrogenase CymA (EC 7.1.1.8; SO_4591) delivering electrons from the menaquinol pool to periplasmic FccA during selenite reduction.
    evidence:
    - source_ref: li_2014
      supports: support
      explanation: Deletion of cymA markedly diminishes selenite reduction and alters Se(0) nanoparticle localization in S. oneidensis MR-1.
  - uniprot_accession: UniProtKB:Q8EG34
    entry_name: Q8EG34_SHEON
    protein_name: Extracellular iron oxide respiratory system surface decaheme cytochrome c component MtrC
    gene_symbol: mtrC
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:211586
      label: Shewanella oneidensis MR-1
    reference_proteome_id: UP000008186
    interpro_ids:
    - InterPro:IPR020014
    - InterPro:IPR054337
    - InterPro:IPR054334
    - InterPro:IPR036280
    pfam_ids:
    - Pfam:PF22113
    - Pfam:PF22111
    functional_role: Outer-membrane decaheme c-type cytochrome MtrC (SO_1778) evaluated as an outer-membrane electron-transfer comparator during selenite reduction.
    evidence:
    - source_ref: li_2014
      supports: partial
      explanation: Evaluated alongside FccA and CymA to distinguish periplasmic FccA-dependent selenite reduction from outer-membrane MtrCAB pathways.
  evidence:
  - source_ref: li_2014
    supports: support
    explanation: Figure 2 and Results report initial selenite-depletion rates of 0.54 +/- 0.13 micromol/h for delta-fccA and 1.35 +/- 0.05 for WT; the caption specifies standard errors of triplicate cultures. Figure 4 preserves substantial later residual reduction in delta-cymA. Thus reduced rates support involvement, not absolute necessity. No complementation or purified-FccA assay is reported.
  - source_ref: li_2014
    supports: support
    explanation: Figure 5 shows predominantly intracellular and smaller surface particles. EDX establishes elemental composition; the 48 h Se 3d XPS peak supports the Se(0) assignment. Neither proves exclusive periplasmic localization or a phase-pure isolated product. Supernatant selenite was assayed by acid/ascorbate colorimetry; Table 1 provides a separate digestion/ICP-AES selenium balance, not an isolated recovery yield.
  - source_ref: li_2014_supplement
    supports: support
    explanation: Figure S1 caption identifies autoclaved cells as the adsorption comparison; main Results report negligible adsorption. Figure S2 caption and S4 describe a BSA-equivalent Micro BCA protein assay for biomass, rather than a viable-cell count. Supplement captions and methods were read; embedded graph pixels were not rendered, so no supplementary numeric points are transcribed.
  - source_ref: klonowska_2005
    supports: partial
    explanation: In a different LB growth context, the paper describes extracellular or cell-attached selenium deposits (Figure 1, 2 mM selenite) and reports that a cymA-deletion mutant still reduces selenite (data not shown). These observations limit universal localization and pathway claims. They are not a matched quantitative refutation of Li's rate defect. The older EDX assignment alone does not resolve selenium oxidation state.
