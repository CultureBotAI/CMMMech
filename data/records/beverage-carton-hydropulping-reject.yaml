  evidence:
  - source_ref: kremser2022_cartons
    supports: support
    explanation: Methods 2.5 and 2.8, Results 3.3-3.4 and Figures 4-5 support aluminium dissolution from this prepared reject. The authors describe near-complete flask leaching by seven days and integrated leaching by seven to eight days. Figure 4a contains variation with loading and uncertainty, so these descriptions are approximate outcomes rather than an exact 100% yield for every replicate. Figure 4a's commercial-acid comparison is similar; the evidence supports acid substitution, not microbial necessity during the leaching stage or a universal advantage over chemical treatment.
  - source_ref: kremser2022_cartons
    supports: partial
    explanation: A separate direct-culture arm used source-labelled A. ferrooxidans DSM 583, also called newly classified A. ferridurans in Methods 2.5. Its pre-grown iron-containing medium, initial acidification to pH 1.4, added sulfur and reagent-medium blanks differ from the spent-acid comparison. The authors report at most about 88% leaching at 10 g/L after 14 days, falling to about 20% at 25 g/L. Figure 4b shows a nonzero chemical blank. Figure 4g and Figure S2 show polymer oxidation-associated spectra and discoloration. These results limit extrapolation across loadings and methods; they do not establish a persulfate or Fenton pathway, which is proposed without a pathway-specific intervention. No taxon CURIE is assigned to this disputed direct-culture stock.
  - source_ref: kremser2022_cartons
    supports: partial
    explanation: After leaching, NaOH addition to pH 6.5 in the methods produced a filtered precipitate described as Al(OH)3. The abstract instead says pH 6.4. Reported near-100% precipitation follows residual-solution Al non-detection, without a stated detection limit, crystalline-phase confirmation, product purity or whole-feed isolated Al yield. This is chemical precipitation downstream of microbial acid production, not demonstrated microbial aluminium biomineralization.
  - source_ref: kremser2022_cartons
    supports: partial
    explanation: Enzyme and acid processing, repeated washing, drying, density separation and extrusion all contribute to the recovered polymer fraction. Figure 3 supports fibre removal with some lignin-rich remains; no enzyme-producing organism or enzyme-free glucose baseline is established here. Figure 6 retains visible impurities despite similar processed-film rheology. Figure 2's starting 79/11/11% component labels sum to 101%, so they are not an exact mass balance. The abstract's stirred-tank description of the integrated trial differs from the bottle-and-shaking methods. An industrial feed supplier and 1 L laboratory treatment do not establish industrial deployment or verified environmental and economic savings.
  - source_ref: dsm504
    supports: context_only
    explanation: The live collection corroborates the upstream DSM 504 species label.
  - source_ref: dsm9466
    supports: context_only
    explanation: The live collection corroborates upstream DSM 9466 as A. caldus C-SH12.
  - source_ref: dsm583
    supports: partial
    explanation: The current catalogue retains A. ferrooxidans for DSM 583, unlike the paper's reclassification statement. Neither label independently authenticates the experimental stock or resolves its genomic identity.
  - source_ref: ncbi_thiooxidans
    supports: context_only
    explanation: The species CURIE does not identify DSM 504 or prove its individual role.
  - source_ref: ncbi_caldus
    supports: context_only
    explanation: The species CURIE does not identify DSM 9466 or prove its individual role.
