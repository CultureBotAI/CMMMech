id: cmmmech:grimmite
name: Grimmite
material_kind: mineral
description: >-
  Grimmite (IMA 2020-060) is an IMA-accepted cubic nickel-cobalt sulfide mineral
  of the spinel supergroup, thiospinel group, linnaeite subgroup (filling the
  0.50 <= x <= 1.50 compositional interval of the Co(3-x)NixS4 solid-solution
  series between linnaeite Co2+Co3+2S4 and siegenite CoNi2S4), with September
  2026 IMA Master List ideal formula NiCo2S4 (status A, PDF p. 86; ideal
  composition Ni 19.26, Co 38.67, S 42.07, total 100.00 wt%) and single-crystal
  grain empirical formula Ni1.01(Co1.99Fe0.06Pb0.01Bi0.01)Sigma2.07S3.92 on the
  basis of 7 apfu (Škácha et al. 2021, pp. 175, 177–178). WDS electron-microprobe
  analysis of the single-crystal structure grain (n = 13 points at 15 kV, 20 nA,
  1 um beam; Table 2, p. 177) gave Ni 19.27 (range 18.62–20.59), Co 38.23
  (36.39–39.36), Fe 1.16 (0.95–1.53), Bi 0.62 (0–1.30), Pb 0.46 (0.24–0.92), As
  0.09 (0–0.56), Cu 0.08 (0–0.21), Mn 0.03 (0–0.14), S 41.05 (40.28–41.87),
  total 100.99 wt%; across all 125 point analyses from the cotype polished
  sections (83 Fe-poor points with Fe <= 0.14 apfu and 42 Fe-enriched points,
  Table 3, p. 178), CoFe-1 substitution reaches up to 0.88 apfu Fe (15.57 wt% Fe
  in spot 15). Described by Škácha, Sejkora, Plášil, Dolníček, and Ulmanová
  (2021) from the mine dump of shaft no. 9, Jerusalem deposit, Příbram uranium
  and base-metal district, central Bohemia, Czech Republic (49°40'12.806" N,
  14°1'48.102" E; two cotype polished sections deposited at the National Museum,
  Prague, catalogue number P1P 49/2020, and the Mining Museum Příbram, catalogue
  number 3/2020), where it occurs in siderite–sphalerite gangue cementing
  brecciated Upper Proterozoic greenish-black shale (pp. 175–176). Strongly
  zoned aggregates of skutterudite-subgroup minerals (skutterudite,
  nickelskutterudite, and ferroskutterudite) rimmed by nickeline and
  gersdorffite (with occasional glaucodot and arsenopyrite) were hydrothermally
  leached during precipitation of younger siderite II, and the leached cavities
  were filled by quartz containing pyrite, sphalerite II, grimmite, galena,
  Bi-rich ullmannite, bismuthinite, parkerite, and xenomorphic jaipurite (CoS)
  inclusions within grimmite (pp. 176–177, Fig. 2). Named in honor of Johann
  Grimm (1805–1874), second director of the Příbram Mining College; material of
  this composition was previously referred to in the mineralogical literature
  under the unapproved name "nickellinnaeite" (pp. 176, 180–182). Forms
  idiomorphic to hypidiomorphic isometric grains up to 200 x 70 um or veinlet
  aggregates up to 500 x 30 um, grey with a pinkish tint, metallic lustre,
  opaque, no cleavage observed, uneven fracture, estimated Mohs hardness 4.5–5.5
  by analogy with linnaeite-subgroup thiospinels, Dcalc = 4.96 g/cm3 (for the
  empirical formula) and 4.89 g/cm3 (for ideal NiCo2S4; 4.843 g/cm3 for the
  refined structural formula in Table 5, p. 179); in reflected light in air it
  is creamy grey with a pinkish tint and isotropic, with COM reflectance values
  (R%, Table 1, p. 177) of 42.5 (470 nm), 45.9 (546 nm), 47.7 (589 nm), and 50.2
  (650 nm). Cubic, space group Fd-3m (Z = 8), a = 9.3933(9) Å, V = 828.81(14)
  Å3; single-crystal X-ray diffraction on a 0.028 x 0.009 x 0.007 mm FIB-SEM
  extracted fragment (MoKalpha, lambda = 0.71073 Å, 79 unique / 76 observed
  reflections with I > 3sigma(I) refined to Robs = 0.0539, wRobs = 0.1746, Rall
  = 0.0554, wRall = 0.1753, GOF(obs) = 1.46 in Table 5, p. 179; printed as R =
  0.0489 on 735 observed reflections in the abstract on p. 175) places Ni at the
  tetrahedral Wyckoff site 8b (T–S1 = 2.1866(10) Å x 4) and Co at the octahedral
  Wyckoff site 16c (M–S1 = 2.2635(10) Å x 6; Table 6, p. 179), with seven
  strongest calculated CuKalpha powder X-ray diffraction lines [d in Å (Irel)
  (hkl)] at 3.3210 (74.7)(220), 2.7116 (7.2)(222), 2.3483 (80.7)(400), 1.9174
  (26.7)(422), 1.6605 (100.0)(440), 1.4852 (10.6)(620), and 1.3558 (15.1)(444)
  (Table 4, p. 179). Distinct from linnaeite (Co2+Co3+2S4), siegenite
  (CoNi2S4), polydymite (Ni2+Ni3+2S4), violarite (Fe2+Ni3+2S4), carrollite
  (CuCo2S4), and elemental nickel or cobalt; no criticality designation,
  microbial mechanism, or industrial recovery yield is asserted.
