mechanisms:
  - id: c4_10_biotite_dissolution
    name: C4-10 culture-associated dissolution of a biotite feed
    process: bioleaching
    description: Priestia aryabhattai C4-10 cultures increased measured Fe and Si in biotite-containing medium relative to uninoculated feed controls. Acidification, organic-acid production and mineral-associated cells accompany the dissolution phenotype; their individual causal contributions and the necessity of particular genes are unresolved.
    context: C4-10 is a living soil isolate grown in LB at 37 degrees C and 180 rpm for 16 hours, harvested, washed and resuspended in sterile distilled water at 10^8 cells/mL. Triplicate laboratory dissolution flasks contained 60 mL sterilized BHm, 0.6 g biotite and 1.5 mL suspension, incubated at 37 degrees C and 180 rpm and sampled at 4, 8, 12, 16, 20, 24, 36 and 48 hours. BHm was prepared at pH 7.0 with 2 g/L glucose; the biotite particles were 75-150 micrometres and reported to contain 39.90% SiO2, 14.75% Fe2O3 and 13.69% MgO. Mineral cleaning refers to an earlier protocol without restating its steps. Fe and Si were measured by ICP-OES and described as dissolved, but separation of these elemental aliquots is not specified in the inspected main and supplemental methods. The separate transcriptome experiment used 0.5 mL inoculum and an 8-hour endpoint; it is not the same assay as the dissolution time course. Lizardite substitution and its MgSO4-free medium are covered by the separate
      lizardite record.
    microbial: true
    organisms:
      - id: NCBITaxon:412384
        label: Priestia aryabhattai
