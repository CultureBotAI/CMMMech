id: cmmmech:schertelite
name: Schertelite
material_kind: mineral
description: Schertelite is the hydrated magnesium hydrogen-phosphate mineral species (NH4)2Mg(PO3OH)2(H2O)4.
  The September 2026 IMA list gives grandfathered status and original-description year 1902, not a new-mineral
  approval identifier. It is distinct from elemental phosphorus or magnesium, struvite, other phosphate
  mineral species and mixed culture precipitates. Constituent criticality is not inherited. The culture
  evidence below is a bounded assignment of a minor recovered phase, not a purified product or established
  direct metabolic pathway.
sources:
