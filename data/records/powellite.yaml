      Ca(MoO4), G, 1891. The year of first description is not a unique
      IMA approval accession.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-14'
  - id: sidorenko2008
    title: >-
      Sidorenko GA, Chistyakova NI, Doinikova OA, Chukanov NV,
      Naumova IS and Kuzmin VI (2008). Black Powellite from
      Molybdenum-Uranium Deposit. New Data on Minerals 43, 23-30.
      Complete eight-page official original inspected, including
      all original graphics: chemical and optical comparisons on
      pages 23-24; diffraction and infrared evidence on pages 25-27;
      missing thermal study of the amorphous arm and inconsistent
      phase-state discussion on page 29; proposed radiation origin on
      pages 29-30. Heating results on the crystalline arm are not
      transferred to the amorphous arm.
    url: https://fmm.ru/images/2/23/NDM_2008_43_Sidorenko_eng.pdf
    accessed_on: '2026-10-14'
