mechanisms:
- id: cn32_feroxyhyte_reductive_transformation
  name: Culture-associated feroxyhyte reduction and condition-dependent secondary minerals
  process: redox_transformation
  microbial: true
  organisms:
  - id: NCBITaxon:319224
    label: Shewanella putrefaciens CN-32
  description: >-
    Laboratory cultures reported as S. putrefaciens CN32 produced
    acid-extractable Fe(II) from synthetic feroxyhyte and secondary solids
    assigned to magnetite and chukanovite without added phosphate. AQDS
    accelerated the initial Fe(II) increase without a reported significant
    increase in the final amount in phosphate-free cultures. Phosphate
    additions in AQDS-containing cultures slowed initial Fe(II) production
    and changed the later phase distribution; the high-phosphate treatment
    yielded green-rust and vivianite assignments. These observations support
    conditional reductive transformation, not complete conversion of every
    Fe(III) atom to Fe(II), a demonstrated gene pathway or isolated iron recovery.
  context: >-
    Section 2.1 describes peroxide oxidation of synthetic Fe(OH)2 to
    feroxyhyte, followed by repeated washing, drying at 60 degrees C and
    grinding through a 200-mesh sieve; phase identity was checked by pXRD.
    Duplicate 160 mL serum bottles contained 100 mL defined mineral medium,
    80 mM Fe(III) as feroxyhyte and 75 mM formate. Medium was adjusted to
    pH 7.5 before sterilization and addition of filter-sterilized reagents;
    this is not a controlled constant-pH trajectory. Inoculated bottles
    were argon-sparged and incubated on a roller drum at 30 degrees C in
    darkness. Late-log-phase cultures were added to approximately
    5 x 10^9 cells/mL as printed. The 2021 paper delegates the complete
    basal-medium and inoculum preparation to earlier references; those
    inherited recipes were not reconstructed here. The named strain is
    mapped to CN-32, but Section 2.2 prints ATCC BAA-543 whereas the
    authority assigns CN-32 to BAA-453 and BAA-543 to Cellulomonas sp. ES5;
    this discrepancy remains an experimental-provenance limitation.
    Treatments were no added phosphate without or with 100 micromolar
    AQDS, and 500 micromolar or 5 mM phosphate with 100 micromolar AQDS.
    No phosphate-amended, AQDS-free arm was included. Total Fe(II) was
    measured by ferrozine after one-week HCl extraction of suspension,
    with extra acid for magnetite-containing samples; it is not dissolved
    Fe(II) alone. Anoxic handling, pXRD, SEM and selected Mossbauer fits
    characterized solids. Figure 23 includes a sterile-control diffraction
    trace, but a matched sterile Fe(II) time series and complete control
    amendment/time details are not supplied with these results.
  evidence:
  - source_ref: oloughlin_2021
    supports: support
    explanation: >-
      Section 3.7, Figure 22 and Table 4 show an early plateau near 24 mM
      acid-extractable Fe(II) in both phosphate-free cultures. Table 4
      reports final values of 24.28 +/- 2.10 mM without AQDS and
      24.51 +/- 6.02 mM with AQDS at day 78, approximately 30 percent of
      the initially supplied 80 mM Fe(III). The paper's description of
      essentially complete bioreduction within 11 days therefore cannot
      mean reduction of all initial Fe(III) to Fe(II). AQDS changes the
      initial rate, and Section 4.2 explicitly reports no significant
      final-extent difference for feroxyhyte. The fitted maximum sustained
      rates are not instantaneous rates or enzyme-specific measurements.
  - source_ref: oloughlin_2021
    supports: support
    explanation: >-
      Figure 23 compares the sterile-control feroxyhyte pattern with
      inoculated solids assigned to magnetite and chukanovite in the
      phosphate-free and 500 micromolar phosphate treatments. At 5 mM
      phosphate the assigned products are carbonate green rust and
      vivianite. Figure 24 supplies morphology, not standalone phase proof;
      Table 4 marks the high-phosphate SEM green-rust assignment with a
      question mark and supplies no Mossbauer result for that arm.
      Table 5's selected AQDS and AQDS-plus-500-micromolar-phosphate fits
      support magnetite/chukanovite mixtures; their relative spectral areas
      are not whole-feed mass recovery percentages.
  - source_ref: oloughlin_2021
    supports: partial
    explanation: >-
      Table 4 reports 55.07 +/- 2.92 and 59.93 +/- 1.65 mM final Fe(II)
      at day 156 for the 500 micromolar and 5 mM phosphate treatments,
      respectively. These longer-duration endpoints must not be treated
      as a same-day comparison with day-78 phosphate-free endpoints.
      Figure 23 labels the actual plotted patterns as day 78 or day 156,
      consistent with Table 4, while its caption says 46 days. That
      unresolved caption conflict is retained rather than assigning a
      fabricated common harvest date. No residual feroxyhyte was identified
      in the inoculated diffraction patterns, but nondetection and mixed
      Fe(II)/Fe(III) products do not establish total iron reduction or a
      quantitative pure-phase yield.
  - source_ref: oloughlin_2021
    supports: partial
    explanation: >-
      Sterile-control diffraction supports retention of the starting phase
      under one control condition; the absence of a reported matched
      sterile Fe(II) trajectory and fully specified control arms limits
      quantification of the microbial increment. No killed-cell, cell-free
      metabolite or mutant comparison resolves biological necessity or a
      particular electron-transfer pathway. Dissolution-reprecipitation is
      inferred from changed morphology in Section 4.1, not directly traced.
      All phosphate arms also contain AQDS, so phosphate effects cannot be
      generalized to shuttle-free systems. The study demonstrates laboratory
      solid transformation, with no isolated iron product, natural-ore
      performance or industrial deployment established.
