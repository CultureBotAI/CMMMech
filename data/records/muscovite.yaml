id: cmmmech:muscovite
name: Muscovite
material_kind: mineral
description: Muscovite is a mica mineral species with ideal formula KAl2(Si3Al)O10(OH)2, distinct from
  generic mica, biotite, phlogopite, traded potash and potassium-bearing feldspars. The September 2026
  IMA list records approval by a 1998 special procedure, not a numbered mineral accession. The curated
  laboratory specimen is a chemically characterized natural museum muscovite flake; its composition is
  not an ideal pure endmember. No criticality designation is inferred from its potassium or aluminium
  content.
