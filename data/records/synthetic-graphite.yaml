    title: >-
      US Geological Survey, 2021 Minerals Yearbook, Graphite [Advance Release],
      by Andrew A. Stewart, December 2024, pp. 32.1-32.17: synthetic graphite
      manufacturing from petroleum coke and coal-tar pitch near 3,000 degrees C
      (p. 32.2), domestic shipments by end use in Table 3 (p. 32.12; 259,000 t
      valued at $1.16 billion in 2021), trade statistics in Tables 1, 5, 7, and
      8 (pp. 32.10-32.16), and battery anode material applications (pp. 32.3-32.5).
    url: https://pubs.usgs.gov/myb/vol1/2021/myb1-2021-graphite.pdf
    accessed_on: '2026-10-18'
  - id: usgs_mcs2026_graphite
    title: >-
      US Geological Survey, Mineral Commodity Summaries 2026, Graphite (Natural),
      printed pp. 92-93 (chapter PDF pp. 1-2): imports of natural and synthetic
      graphite battery active anode material (AAM), antidumping/countervailing
      duty investigations, and competition of synthetic graphite powder and
      secondary synthetic graphite scrap in steelmaking and battery applications.
    url: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-graphite.pdf
    accessed_on: '2026-10-18'
  - id: doe_2023_fr
    title: >-
      US Department of Energy, Notice of Final Determination on 2023 DOE Critical
      Materials List, 4 August 2023, Federal Register Vol. 88, No. 149,
      pp. 51792-51798 (Document 2023-16611): Table 1 rows for 'Graphite (natural
      and synthetic)', 'Graphite--natural', and 'Graphite--synthetic' and
      Footnote 6 on p. 51796 documenting that the 2022 DOI/USGS critical-mineral
      definition of graphite encompasses both natural and synthetic graphite.
    url: https://www.govinfo.gov/content/pkg/FR-2023-08-04/html/2023-16611.htm
    accessed_on: '2026-10-18'
