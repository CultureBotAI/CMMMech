id: cmmmech:rare-earth-rich-deep-sea-mud
name: Rare-earth-rich deep-sea mud
material_kind: primary_resource
description: Naturally occurring deep-ocean sediment enriched in rare-earth elements and yttrium, commonly
  termed REY-rich mud. This record denotes the heterogeneous geological sediment resource, including pelagic
  clay with REY-bearing biogenic calcium phosphate grains documented in western North Pacific samples.
  It is distinct from individual rare-earth elements, a purified rare-earth commodity, an isolated apatite
  mineral, phosphorite, ferromanganese nodules and rock-surface ferromanganese crusts. Host phases and
  composition vary among deposits; no single mineral formula or universal grade defines this resource.
  Collection or physical concentration alone does not make the natural feed a secondary resource. No constituent
  criticality designation is inherited. This identity-only record does not assert a microbial extraction,
  transformation or recovery mechanism, a recovered-metal yield, economic reserves or industrial deployment.
sources:
- id: usgs2025
  title: U.S. Geological Survey (2025). U.S. Geological Survey Global Seabed Mineral Resources. Fact Sheet
    2025–3017, version 1.1, April 2025; page 2, Table 1 identifies REY-rich muds separately from polymetallic
    nodules, cobalt-rich ferromanganese crusts and phosphorite minerals. Asterisks refer to the U.S. 2022
    constituent list, not a criticality designation for this geological resource.
  url: https://pubs.usgs.gov/fs/2025/3017/fs20253017.pdf
  accessed_on: '2026-10-11'
- id: takaya2018
  title: Takaya et al. (2018). The tremendous potential of deep-sea mud as a source of rare-earth elements.
    Scientific Reports 8:5763. DOI 10.1038/s41598-018-23948-5; Results and Discussion, Determination of
    the host mineral of REY, Figure 3, and Methods describe natural sediment and biogenic calcium phosphate
    grains. Physical separation of such grains is distinct from microbial processing.
  url: https://doi.org/10.1038/s41598-018-23948-5
  accessed_on: '2026-10-11'
- id: wang2018
  title: Wang et al. (2018). Microbial community composition and diversity in the Indian Ocean deep sea
