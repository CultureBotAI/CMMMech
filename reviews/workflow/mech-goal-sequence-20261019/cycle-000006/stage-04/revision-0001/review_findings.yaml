  - cmmmech:spent-sulfuric-acid-production-catalyst
  summary: 'Across 16 single-species Acidithiobacillus thiooxidans records (2 element:
    arsenic.yaml, gallium.yaml; 14 secondary_resource: automotive-wastewater-treatment-sludge.yaml,
    blast-furnace-cast-house-dust.yaml, copper-smelter-slag.yaml, discarded-led-lamps.yaml,
    electric-arc-furnace-dust.yaml, gaas-production-hydroxide-sludge.yaml, gold-mine-tailings.yaml,
    metallic-machining-burrs.yaml, nickel-based-superalloy-residue-powders.yaml, spent-alkaline-zinc-carbon-batteries.yaml,
    spent-automotive-three-way-catalyst.yaml, spent-hydrodesulfurization-catalyst.yaml,
    spent-selective-catalytic-reduction-catalyst.yaml, spent-sulfuric-acid-production-catalyst.yaml)
    whose tth_hydrolase causal-graph nodes were expanded in Cycle 5 Stage 3 (PR #872)
    to include both A. thiooxidans ATCC 19377 tetrathionate hydrolase paralogs (UniProtKB:A0A5P9XPU3
    tth / GCD22_14205 and UniProtKB:A0A5P9XS05 tth / GCD22_02315), causal_graphs[0].nodes[1]
    still retains the pre-expansion singular label ''Tth tetrathionate hydrolase (tth)''
    and generic description ''Periplasmic tetrathionate hydrolase disproportionating
    tetrathionate into thiosulfate, elemental sulfur, sulfate, and protons.'' without
    naming GCD22_14205 and GCD22_02315, whereas sibling node sqr_reductase explicitly
    names ''(Sqr/Sqor; GCD22_02301 / GCD22_03207)'' and the 5 Cycle 6 Stage 2/3 A.
    thiooxidans records explicitly name ''(tth GCD22_14205; tth GCD22_02315)''.'
- finding_id: cmmmech-cycle6-stage4-finding-0003
  issue_key: cmmmech.round124-minerals.missing-ima-symbol-slot
  review_id: 20261031T132001Z-cycle6-stage4-mineral-cohort-review
  status: open
  severity: minor
  category: completeness
  target_ids:
  - cmmmech:vielleaureite-ce
  - cmmmech:xianhuaite-ce
  summary: 'Both data/records/vielleaureite-ce.yaml (cmmmech:vielleaureite-ce) and
    data/records/xianhuaite-ce.yaml (cmmmech:xianhuaite-ce), curated in Cycle 6 Stage
    1 (PR #884), state their IMA-CNMNC-approved mineral symbols in description (''Vielleaureite-(Ce)
    (IMA 2022-134, symbol Vlr-Ce; ...)'' from Ragu et al. 2025 Eur. J. Mineral. 37:627-643,
    p. 627; and ''Xianhuaite-(Ce) (IMA 2024-091, symbol Xhu-Ce)'' from Yang et al.
    2026 Am. Mineral. 111(3):449-459, p. 449), but omit the top-level ima_symbol slot
    (ima_symbol: Vlr-Ce and ima_symbol: Xhu-Ce after material_kind: mineral), unlike
    peer IMA mineral records such as data/records/andreybulakhite.yaml (ima_symbol:
    Adb) and data/records/yttrotungstite-nd.yaml (ima_symbol: Ytgs-Nd).'
