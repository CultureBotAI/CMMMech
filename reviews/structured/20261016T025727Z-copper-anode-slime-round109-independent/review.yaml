assessments:
- assessment_id: identity
  area: identity
  topic: Distinct secondary resource, source feed and constituent scope
  outcome: supported
  summary: The heterogeneous anode-slime identity is supported and separated from
    other copper materials.
  details: Guixi copper-smelter anode slime is the studied electrolytic-refining feed,
    not a pure mineral, elemental copper, flue dust, or the distinct downstream copper-autoclave-slime
    residue. Table 1 composition Cu 21.43 wt%, Sb 5.805%, Bi 2.868% and As 5.569%
    is source-specific. Table 3 within-element phase distribution is not bulk mineral
    abundance. No jurisdiction/list/edition claim is made and constituent criticality
    is not inherited.
