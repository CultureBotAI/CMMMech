mechanisms:
- id: brown_rot_surface_transformation
  name: Culture-associated calcium oxalate formation on a fluorapatite crystal
  process: biomineralization
  description: Brown-rot fungal cultures on a source-identified fluorapatite crystal produced surface material assigned to calcium oxalate monohydrate, whewellite. Serpula himantioides LE-BIN 1368, Coniophora puteana LE-BIN 1370 and source-named Antrodia xantha LE-BIN 1029 have powder-diffraction as well as microscopy assignments; the Serpula lacrymans LE-BIN 1192 comparison relies on microscopy. This supports laboratory surface biomineralization without quantifying fluorapatite dissolution, phosphorus or fluorine mobilization, or an isolated recovered product.
  context: Table 3 identifies a Cl-bearing fluorapatite crystal from the Slyudyanka mineral deposit in the Irkutsk region, with Cl approximately 1.17 wt% and formula Ca5(PO4)3(F,Cl). This source-assigned substituted specimen is not a pure fluorapatite endmember or bulk phosphate ore. The listed agar propagation medium contains CaCl2 and phosphate salts; the liquid formulation is not separately tabulated. Without a no-mineral calcium balance, the calcium in the new crystals cannot be assigned exclusively to dissolution of the substrate. Methods 2.2 describes approximately 1 x 0.5 x 0.5 cm blocks in plastic Petri dishes with 20 mL liquid glucose-peptone medium, initial pH 5.5, room temperature and 30 days, in triplicate. Mycelial fragments came from ten-day cultures on glucose-peptone agar. Inoculum amount, substrate sterilization and a separate complete liquid-medium formulation are not specified. The paper names Antrodia xantha; current NCBI taxonomy and its cited ribosomal accession use
    Amyloporia xantha for LE-BIN 1029. The organisms list includes the tested comparator S. lacrymans; it does not assert identical mineral formation by every listed culture.
