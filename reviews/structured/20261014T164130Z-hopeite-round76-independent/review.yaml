limitations:
- No raw assay dataset, quantitative phase fraction or closed zinc/phosphorus recovery
  balance is available in the inspected original.
- Culture-associated morphology and diffraction do not establish biological necessity
  or a molecular pathway; matched killed-cell/cell-free/pH controls are missing.
- The companion culture accession is inconsistent and later endpoint pH/unit statements
  conflict; these uncertainties remain in the owner.
- The katsarosite owner describes the same experiment, not independent replication;
  the 2023 antecedent is not accepted as independently verified replication here.
- Bounded correction and supplementary checks do not establish literature-wide absence.
  This review supplies no new experimental replication.
