      of sulfide to elemental sulfur/polysulfide coupled to quinone reduction during acidophilic sulfur/sulfide
      bioleaching.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000001362 for Acidithiobacillus
      ferrooxidans ATCC 23270 (NCBITaxon:243159).
    evidence:
    - source_ref: willner2018
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 sulfur-oxidation enzyme (AFE_1792)
        for oxidative sulfur/acid generation in willner2018; individual sqr/tth genes were not mutated.
