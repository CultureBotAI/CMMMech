mechanisms:
- id: geobacter_monometallic_rh_transformation
  name: Resting-cell transformation of soluble Rh(III) to Rh(0)-bearing particles
  process: redox_transformation
  description: Washed resting Geobacter sulfurreducens cells supplied with acetate removed Rh from a synthetic single-metal solution and formed cell-associated particles identified as metallic Rh by XRD and selected area electron diffraction. Cell-free controls did not show comparable Rh removal. The observation supports cell-associated reduction under these conditions, without establishing complete conversion to Rh(0), a specific cytochrome requirement or an isolated-metal recovery yield.
  context: Laboratory 10 mL batches in serum bottles contained 200 micromolar Rh supplied from a 50 mM RhCl3.xH2O stock in deionized water, 10 mM sodium acetate and 30 mM sodium bicarbonate. Bottles were flushed for at least 30 minutes with 80:20 nitrogen/carbon dioxide, pH 6.8-7.0, then received resting cells at OD600 0.4 and were incubated at 30 degrees C for up to 24 h. Biomass had been grown anaerobically at 30 degrees C with 20 mM acetate and 40 mM fumarate to late log phase, harvested at 4920 g and 4 degrees C for 20 minutes, and washed twice in 30 mM bicarbonate pH 7. The paper does not provide a culture-collection or strain accession; the species identifier does not resolve that omission. Rh remaining in solution was quantified by ICP-MS after 14800 g centrifugation for 20 minutes and nitric-acid dilution of the supernatant. Results 3.1.1 reports greater than 95% aqueous Rh removal within 1 h, whereas no-cell Rh controls retained the dissolved pool. This is centrifuged-supernatant
    depletion, not a quantitative Rh(0) fraction. Washed 24 h solids were assessed by XRD and TEM/SAED; the inferred crystallite size and image particle size have different measurement bases.
