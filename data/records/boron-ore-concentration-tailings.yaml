    functional_role: Reviewed Swiss-Prot major facilitator superfamily (MFS) plasma-membrane citrate exporter CexA (cexA; CEXA_ASPNG) mediating active extracellular secretion of citric acid by Aspergillus niger.
    annotation_note: Reviewed Swiss-Prot entry (CEXA_ASPNG) grounded directly to species-level taxon Aspergillus niger (NCBITaxon:5061), matching the unsequenced species-level A. niger isolate. Represents the wild-type Aspergillus niger strain (Industrial Microbiology Laboratory, Ege University, Izmir, Turkey) secreting citric, oxalic, and gluconic acids during 45-day one-step and two-step bioleaching of Espey boron-ore concentration tailings in Ertan (2026).
    evidence:
    - source_ref: ertan2026
      supports: partial
      explanation: Reviewed Swiss-Prot Aspergillus niger plasma-membrane MFS citrate exporter CexA (cexA) mediating extracellular citric acid secretion by wild-type A. niger (1 x 10^7 spores in 100 mL sucrose medium at 30 C and 120 rpm for 45 days; accumulating 1006.9 mg/L citric acid alongside 512.9 mg/L gluconic and 252.8 mg/L oxalic acid in two-step bioleaching at 0.5% w/v pulp density [60.2% Li and 50.0% Mg extraction], and 6.5 mg/L citric alongside 889.8 mg/L oxalic and 91.6 mg/L gluconic acid in one-step bioleaching at 0.5% w/v [76.5% Li and 37.2% K extraction]) on <72 um Espey boron-ore concentration tailings in Ertan (2026); the Ege University A. niger isolate lacks a genome accession and CexA expression was not directly assayed.
