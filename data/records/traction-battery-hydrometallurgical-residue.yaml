  - source: solid_feed_substrate
    target: solubilized_metal_species
    predicate: produces
    relationship: 12-day bioleaching of separate Ni-line and Co-line battery residues releases dissolved Ni and Co
    description: Over 12 days in 2 L 9K medium, inoculated single and mixed acidophile cultures increase dissolved Ni release from the nickel-line residue and dissolved Co release from the cobalt-line residue relative to the 30 degrees C blank control.
    evidence:
    - source_ref: lu2025
      supports: support
      explanation: ICP-MS filtrate time series in Lu et al. (2025) Figures 1–4 confirm higher dissolved Ni and Co release from the respective battery residues in inoculated 9K systems than in the 30 degrees C blank.
