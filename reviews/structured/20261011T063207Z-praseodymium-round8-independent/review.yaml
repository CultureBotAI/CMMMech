limitations:
- The best main run has n = 1; three independent refabricated smaller-column repeats
  show lower purity and yield and are correctly retained.
- Selected-fraction accounting does not independently establish a feed-to-product
  mass balance or metal recovery after isolation.
- Source capacity wording and a repeat-workbook header are inconsistent; the accepted
  claims avoid pooling or inventing resolution.
- Column temperature, complex-feed performance, long-term reuse and industrial operation
  remain unestablished.
- Correction and duplicate searches are bounded; absence of a returned notice is not
  exhaustive absence.
