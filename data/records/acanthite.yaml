      explanation: Klaus et al. (1999) proposed periplasmic silver-binding and efflux mechanisms alongside H2S reaction to explain periplasmic elemental Ag and minority monoclinic Ag2S (acanthite) crystal formation in Pseudomonas (Stutzerimonas) stutzeri AG259 grown on Lennox L agar with 50 mM AgNO3 (30 degrees C, 48 h, dark), without sequencing AG259 or assaying CopA directly.
