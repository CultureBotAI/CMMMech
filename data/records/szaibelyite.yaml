mechanisms:
  - id: abiotic-thermal-dehydroxylation
    name: Thermal water loss and breakdown of natural szaibélyite separates
    process: other
    description: >-
      Heating characterized natural separates produced gradual water loss
      followed by a larger dehydroxylation event and a diffraction-assigned
      monoclinic Mg2B2O5 breakdown product. The specimens, atmosphere and
      source protocol ambiguities limit transfer of temperatures or mass
      losses to pure szaibélyite or other processing conditions.
    context: >-
      Marincea sampled the Bolfu-Tony, Baia Roșie and Antoniu areas at
      Băița Bihor. Hand picking and magnetic/heavy-liquid separation were
      followed by pulverization and a one-day wash with cold 0.5 N HCl.
      The resulting separates were reported as at least 90% pure, with
      residual serpentine-group mineral detected by X-ray diffraction.
      Parallel TGA/DTG/DTA measurements used static air at 10 degrees C/min.
      A separate TGA/DSC apparatus used nitrogen at 30 mL/min with evolved-gas
      infrared analysis. The Methods give that arm a heating rate of
      10 degrees C/min, but Table 7 footnote 2 says 20 degrees C/min; this
      remains unresolved. The earlier thesis Table 30 repeats the same
      specimen rows but identifies the DSC atmosphere as argon rather than
      nitrogen, also at 20 degrees C/min. Methods also describe 1 h at
      20 degrees C under
      10^-4 torr before analysis, whereas the thermal Results describe
      12 h at 110 degrees C, without an explicit reconciliation by aliquot.
      No microorganisms were used.
    microbial: false
    evidence:
      - source_ref: marincea2001
        supports: support
        explanation: >-
          Pages 121-122, Figure 4 and Table 7 show preliminary mass loss
          between approximately 150 and 600 degrees C and a larger
          water-evolution event near 600-700 degrees C. In the illustrated
          sample 1672, the DTA and DTG peaks occur at 660 and 640 degrees C,
          respectively. The Table 7 air-DTA peak temperatures across five
          separately identified specimens range from 655 to 670 degrees C;
          these are different specimens, not five replicate measurements of
          one material. The source reports diffraction assigned to monoclinic
          P21/a Mg2B2O5 for the breakdown product, with unit-cell refinements
          in Table 8. These measurements support abiotic thermal conversion,
          not isolated boron recovery or a product-purity yield.
      - source_ref: marincea2001
        supports: partial
        explanation: >-
          Article pp. 121-122 describe diffraction lines that weakened and
          broadened after approximately 300 degrees C but remained recognizable
          to 650 degrees C, with residual original-cell features at least to
          700 degrees C. The temperature-resolved arm traced in the thesis is
          from Cacova Ierii and is not assigned here to Băița Bihor. The
          article's different descriptions of completion
          at 650-680 or 650-700 degrees C therefore must not be collapsed to
          a sharp universal threshold. Total mass losses include the earlier
          event and are not equivalent to the main-event loss or to the ideal
          hydroxyl content of a pure mineral. Residual serpentine and the
          ambiguous pretreatment and nitrogen heating rate constrain
          quantitative attribution. Fluorine in evolved gas was below the
          approximately 0.1 wt.% detection limit, not a measured zero.
      - source_ref: marincea2001
        supports: partial
        explanation: >-
          Page 122 reports no separate 150-200-degree-C endothermic peak,
          contrasting with a cited earlier hydroxyl-ascharite result; the
          earlier experiment was not independently acquired here. Proposed
          assignment of early water loss to particular hydroxyl groups and
          slow structural accommodation is interpretive. No return to the
          starting szaibélyite, equal-duration unheated control,
          isolated-product mass balance or industrial operation was
          demonstrated.
      - source_ref: marincea1998
        supports: partial
        explanation: >-
          The earlier thesis supplies the breakdown-product powder data
          referenced by the article: Table A.23 includes Băița Bihor specimen
          1672 after heating in air to 900 degrees C, as specified on p. 245.
          It shares specimens and data with the 2001 article and is not an
          independent replication. Table 30 calls the DSC atmosphere argon
          at 20 degrees C/min, conflicting with the article's nitrogen
          descriptions; the exact atmosphere and rate cannot be reconciled
          from these texts. Table A.22 labels one specimen 1402 BB whereas
          Table 32 and the article use 1406; those labels are not silently
          equated. The temperature-resolved diffraction and cooled-product
          persistence in Figure 46 concern specimen 1821 from Cacova Ierii,
          a separate locality, and are not transferred to the Băița Bihor
          specimens. Extra low-temperature peaks in an unwashed Mașca-Băișoara
          sample are attributed to residual boric acid, not treated as a
          contradiction from an identically prepared pure szaibélyite feed.
      - source_ref: grice2008
        supports: context_only
        explanation: >-
          The separate Penobsquis refinement locates two hydrogen positions
          and supports the hydroxyl-bearing structural model. Twenty
          microprobe analyses of seven grains measured Mg, Fe and Mn, while
          B and H contents were supplied from ideal stoichiometry and the
          structural interpretation. It does not independently repeat the
          Romanian heating experiment or resolve its protocol discrepancies.
