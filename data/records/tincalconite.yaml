mechanisms:
  - id: abiotic-humidity-interconversion
    name: Humidity-driven tincalconite-borax interconversion in a mixed residue
    process: other
    description: >-
      Tincalconite formed in a laboratory-altered natural qilianshanite
      residue hydrated to borax during increasing relative humidity and
      reappeared during drying. The phase sequence displayed hysteresis.
      Nahcolite persisted alongside the borates, so the experiment did not
      produce a pure isolated borax or tincalconite recovery product.
    context: >-
      Liu and Bish used the residue of powdered natural qilianshanite from
      the Lewis Cliff Ice Tongue, Antarctica, after laboratory-air exposure
      for 2.5 months as humidity declined seasonally. The resulting material
      contained tincalconite and nahcolite. The subsequent RH-controlled
      XRD cycle ran at room temperature, reported as 23 +/- 0.5 degrees C,
      from 10 to 90 and back to 10% RH in 10-percentage-point steps,
      with a 2.5-h delay before scanning at each stage. Scans covered
      2-70 degrees 2theta with 0.02-degree steps and 1 s per step.
      The separate sulfate gravimetric experiments and qilianshanite TGA
      arms do not measure water uptake or recovery for this borate cycle.
      This abiotic laboratory protocol does not demonstrate microbial
      involvement or an in situ Antarctic reaction rate.
    microbial: false
    evidence:
      - source_ref: liu2020
        supports: support
        explanation: >-
          Methods p. 13 and Figure 6/pp. 30-32 show partial hydration to
          borax at the upward 80% RH stage and return toward tincalconite
          on decreasing RH through 50-40%. The authors describe only one
          of these two borate phases at the end-member RH conditions,
          while the Figure 6 caption explicitly says nahcolite remains
          throughout. This is diffraction evidence for reversible borate
          phase interconversion in a mixture, not 100% total-sample purity
          or a quantified recovered-boron yield.
      - source_ref: liu2020
        supports: partial
        explanation: >-
          The Figure 6 caption on p. 31 says borax disappeared by the
          downward 40% RH stage, but its continuation on p. 32 lists borax
          as present through that stage. The record retains the reported
          50-40% drying bracket without resolving this endpoint conflict
          or inventing a sharper equilibrium threshold. Figure 7 summarizes
          these protocol-dependent observations; the 2.5-h delays do not
          independently prove thermodynamic equilibrium. The study provides
          one plotted sequence of 17 continuous runs, not 17 independent
          replicates or repeated hydration cycles.
      - source_ref: liu2020
        supports: partial
        explanation: >-
          The authors explicitly avoided more detailed tincalconite
          thermal analysis because the decomposed material was mixed with
          sodium bicarbonate/carbonate (p. 34). Neither the sulfate
          water-sorption masses nor the mixed qilianshanite mass-loss
          assignments establish pure-tincalconite hydration stoichiometry.
          No quantitative phase fractions, boron mass balance, isolated
          product yield or industrial deployment was demonstrated for
          this humidity cycle.
