id: cmmmech:neodymium
name: Neodymium
material_kind: element
description: >-
  The element Nd. The identifier grounds the element, not an Nd(III) ion,
  mineral species, magnet alloy, or discarded magnet. The US designation below
  concerns the named neodymium mineral commodity in the 2022 list; it is a dated
  designation, not a claim about every Nd-bearing resource or current policy.
