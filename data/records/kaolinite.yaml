id: cmmmech:kaolinite
name: Kaolinite
material_kind: mineral
description: Kaolinite is the aluminium phyllosilicate mineral Al2Si2O5(OH)4, distinct from kaolin as a natural clay resource and from halloysite, dickite and nacrite. The September 2026 IMA list records approval by a 1980 special procedure, not a numbered mineral accession. The curated CMS KGa-1b and KGa-2 reference specimens differ in ordering and accessory phases; kaolinite-associated iron is not established as exclusively structural iron. No criticality designation is inferred from aluminium or kaolin.
