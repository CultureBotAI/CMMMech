id: cmmmech:sabinaite
name: Sabinaite
material_kind: mineral
description: Anhydrous sodium-zirconium-titanium oxycarbonate mineral with current September
  2026 IMA-CNMNC approved formula Na4TiZr2O4(CO3)4, status A, and approval number IMA 1978-071.
  Jambor, Sturman, and Weatherly (1980) originally described the cotype specimens (NMC 61017-61024
  and ROM M35902) from dawsonite-bearing silicocarbonatite sills at the Francon (St-Michel)
  quarry, Montreal Island, and from Mont Saint-Hilaire, Quebec, Canada. Combined electron-microprobe,
  atomic-absorption, and thermal-decomposition analysis on the Francon quarry type material
  (Table 2, p. 27) yielded Na2O 20.7, CaO 0.2, ZrO2 39.1, HfO2 0.47, TiO2 12.0, CO2 27.1 (mean
  of 28.1 wt% by TGA and 26.2 wt% by evolution), total 99.57 wt%, from which Jambor et al.
  (1980) proposed the provisional formula Na9Zr4Ti2O9(CO3)8 and a pseudo-orthorhombic/monoclinic
  subcell. McDonald (1996) solved the crystal structure on an untwinned crystal from Mont
  Saint-Hilaire in monoclinic space group C2/c (a = 10.196(1), b = 6.616(1), c = 17.958(3)
  A, beta = 94.14(1) degrees, V = 1208.2(3) A3, Z = 4, R = 2.1%, wR2 = 5.7% for 1564 observed
  reflections with F > 4sigma(F) out of 1759 unique reflections; WDS composition Na2O 19.01,
  ZrO2 39.20, TiO2 10.50, Nb2O5 2.02, HfO2 0.56, CO2 28.08 calc, total 99.37 wt%), proving
  complete ordering of 6-coordinated Ti4+ and 8-coordinated Zr4+ in polyhedral [Zr2TiO4(CO3)4]4-
  sheets interleaved with Na+ layers and establishing the ideal stoichiometric formula Na4Zr2TiO4(CO3)4
  ( noting also that the IMA Master List misprints the 1980 Canadian Mineralogist volume as
  19 instead of 18). Distinct from weloganite, dresserite, and elemental zirconium or titanium;
  no criticality designation, microbial mechanism, or industrial recovery yield is asserted.
