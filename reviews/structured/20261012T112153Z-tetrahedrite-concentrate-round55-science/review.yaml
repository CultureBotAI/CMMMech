limitations:
- The experimental stocks were not independently sequenced or authenticated. DSM14882
  catalogue shaking guidance differs from the study protocol; catalogue identity context
  does not independently replicate or falsify that assay.
- Source concentration-unit, phase-proportion, Table2 arsenic-statistics and figure-locator
  inconsistencies remain unresolved. No corrected numerical copper yield or precise
  phase assignment is asserted.
- Control heat treatment, pH and ferric exposure are not independently matched; cell
  density, liquid/inoculum volumes, percentage basis and sampling corrections remain
  unavailable.
- XPS is surface-specific, gas stoichiometry relies on Cu-derived reacted-phase estimates
  and selected composition, and heterogeneous primary cores persist. No isolated product,
  full mass balance or industrial performance is demonstrated.
- All main scientific pages1–12 and every main/SI figure/table were independently
  viewed. Reference pages13–15 were not separately visually inspected; earlier comparison
  studies remain source-qualified context, not full-primary accepted experiments.
  Notice/dedup searches are bounded; no machine-wide or universal absence claim.
notes:
- No maintained record, history or source-dossier bytes changed by this reviewer.
