id: cmmmech:realgar
name: Realgar
material_kind: mineral
description: Realgar is the monoclinic arsenic sulfide mineral, given as AsS in
  the September 2026 IMA list and represented molecularly as As4S4 in the selected
  primary study. The IMA entry is grandfathered, with original-description year
  1747. It is distinct from elemental arsenic, orpiment, amorphous arsenic sulfides
  and other As4S4 polymorphs. No criticality designation is inherited from arsenic.
