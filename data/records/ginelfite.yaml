id: cmmmech:ginelfite
name: Ginelfite
material_kind: mineral
ima_symbol: Glf
description: >-
  IMA-approved complex silver-thallium-lead-antimony-arsenic boxwork sulfosalt mineral
  (IMA 2022-110; symbol Glf; status A, Approved 2023; full description published May 2025)
  with ideal end-member formula Ag2(Ag0.5Fe2+0.5)TlPb24.5(Sb,As)32.5S75.5 reported in the
  primary type description title, abstract, Section 4.1, and Table 7 (Biagioni et al., 2025,
  European Journal of Mineralogy 37:319-335; note that Table 8 on p. 332 prints the formula
  with S76 as Ag2(Ag0.5Fe0.5)TlPb24.5(Sb,As)32.5S76, and the September 2026 IMA-CNMNC Master
  List, PDF p. 82, lists the pre-refinement formula Ag2(Ag0.5Fe2+0.5)TlPb23.5(Sb,As)33.5S76
  prior to recognizing the half-occupancy of the S(71) site and final Pb/(Sb,As) site
  assignments). Named in honour of Carlo Gini (born 1954; technician from 1988 to 2019) and
  Francesco Guelfi (born 1947; technician from 1981 to 2011), former technicians at the X-ray
  laboratory of the Dipartimento di Scienze della Terra of the Universita di Pisa, by
  combining their surnames. Discovered in specimens collected by co-authors Georges Favreau,
  Jean-Claude Boulliard, and Vincent Bourgoin during a sampling campaign authorized by the
  Ecrins National Park at the Tl-rich hydrothermal deposit of Jas Roux, La
  Chapelle-en-Valgaudemar, Hautes-Alpes department, France (44 deg 44 min 45 sec N, 6 deg
  19 min 18 sec E), from the centre of the cliff of the tectonic block indicated as
  "compartiment 2" by Mantienne (1974), where the Tl-Hg-Ag-Sb-As mineralization occurs within
  a 3.8 m thick baryte-rich zone hosted in Triassic metadolostone and marble (matching the
  earlier unnamed mineral UM2000-44-S:AgAsPbSb of Smith and Nickel, 2007, first reported by
  Mantienne, 1974, indicated as "madocite argento-thallifere" by Moelo, 1983, and examined by
  Johan and Mantienne, 2000). In type material, ginelfite occurs associated with Fe-poor
  sphalerite (pale brownish grains with trace Cd) and lopatkaite (5 spot analyses averaging
  Pb 55.82(29), As 3.80(8), Sb 20.98(8), S 19.93(6), total 100.52(30) wt%, corresponding on a
  20 apfu basis to Pb4.84(3)Sb3.09(1)As0.91(2)S11.16(3), Ev(%) = -2.8(6)%) within a silicified
  matrix devoid of vugs, with baryte and quartz; holotype material is deposited in the
  collections of the Museo di Storia Naturale of the Universita di Pisa, Calci (PI), Italy
  (catalogue number 20023) and in the collections of the Department of Mineralogy and
  Petrology, National Museum in Prague, Czech Republic (catalogue number P1P 31/2022). Forms
  dark-grey acicular crystals up to 0.5 mm in length with a black streak, metallic lustre,
  opaque diaphaneity, brittle tenacity, conchoidal fracture, no observed cleavage, calculated
  density Dcalc = 5.765 g/cm3 from the empirical formula and single-crystal unit-cell
  parameters, and historical Vickers microhardness VHN25 = 165 kg/mm2 (range 157-170 kg/mm2
  for five indentations on five grains; Johan and Mantienne, 2000), corresponding to a Mohs
  hardness of 3 to 3.5. In reflected light in air, ginelfite is light grey with weak
  pleochroism and weak bireflectance, moderate anisotropism with weak brownish and blue
  tints, and no internal reflections; Commission on Ore Mineralogy (COM) reflectance values
  in air (Rmin, Rmax in %; MSP400 TIDAS spectrophotometer, 50x objective, WTiC Zeiss 370
  standard; Table 1) are 35.4, 38.1% (470 nm), 34.6, 37.0% (546 nm), 33.7, 36.0% (589 nm),
  and 32.3, 34.6% (650 nm). Wavelength-dispersive electron microprobe analysis (35 spot
  analyses, Cameca SX 100, 25 kV, 20 nA, 1 um beam diameter; Table 2) yielded Pb 45.44 wt%
  (range 44.81-45.83, e.s.d. 0.21), Sb 23.46 wt% (23.10-23.94, e.s.d. 0.19), S 21.07 wt%
  (20.62-21.32, e.s.d. 0.14), As 6.17 wt% (5.84-6.48, e.s.d. 0.17), Ag 2.34 wt% (2.20-2.42,
  e.s.d. 0.05), Tl 1.14 wt% (0.98-1.34, e.s.d. 0.09), Fe 0.22 wt% (0.20-0.25, e.s.d. 0.01),
  and Cu 0.07 wt% (0.00-0.09, e.s.d. 0.02), total 99.91 wt% (range 99.21-100.59, e.s.d.
  0.32), corresponding on the basis of SigmaMe = 61 atoms per formula unit to the empirical
  formula Cu0.12(4)Ag2.51(5)Fe0.46(3)Tl0.65(5)Pb25.40(14)Sb22.32(18)As9.54(24)S76.12(74)
  (Sb + As = 31.86(12) apfu, Sb/(Sb + As) = 0.701(7), and relative error on valence
  equilibrium Ev(%) = -1.1(1.0)% with range -2.3 to +1.7% in Table 2 assuming Fe as Fe2+, or
  -0.8(1.0)% if Fe occurs as Fe3+). Crystallizes in the triclinic system, space group P-1
  (#2), with single-crystal X-ray diffraction unit-cell parameters a = 8.3635(6) A, b =
  27.5481(19) A, c = 29.199(2) A, alpha = 95.335(3) deg, beta = 94.123(3) deg, gamma =
  94.367(3) deg, V = 6657.7(8) A3, and Z = 2 (refined with twin ratio 62.2 : 37.8(2) around
  [100] to R1 = 0.0876, R(all) = 0.1131, wR2 = 0.1764, and GoF = 1.221 for 23,779
  reflections with Fo > 4sigma(Fo) out of 30,492 unique reflections from 291,055 measured at
  293(2) K using MoKalpha radiation, Table 4). The zinkenite-related boxwork sulfosalt
  structure (organized around two symmetry-independent Pb6S6 triangular rods) contains 61
  independent cation sites (21 pure Pb sites Pb(1)-Pb(19), Pb(21), and Pb(22); 1 mixed
  ninefold tricapped trigonal prismatic Tl(20) site Tl0.65Pb0.35 with <Tl(20)-S> = 3.29 A
  and BVS = 1.30 v.u.; 12 mixed Pb/Sb sites M(1)-M(12) with M(9)-M(12) split into a/b
  sub-positions; 24 Sb/As sites comprising 8 pure Sb sites, 1 pure As site As(20) with
  <As(20)-S> = 2.27 A and BVS = 3.15 v.u., and 15 mixed Sb/As sites including split
  Sb(21a)/Sb(21b); 2 pure Ag sites Ag(1) and Ag(2) in 4+1 trigonal dipyramidal coordination
  with <Ag-S> = 2.78 and 2.79 A and BVS = 1.05 and 1.04 v.u.; and 1 mixed (Ag,Fe) site Ag(3)
  with refined occupancy Ag0.51(2)Fe0.49(2) in distorted 4+2 octahedral coordination,
  <Ag(3)-S> = 2.70 A, and BVS = 1.68 v.u.) and 76 independent S sites (including
  half-occupied S(71), occupancy 0.50; Tables 5-6), built by combining three boxwork modules:
  partition rod A (3 polyhedra wide x 4 atomic layers thick, Me12S16), fill-element rod B (4
  atomic layers thick, Me14S18), and continuous (001) wall layer C (Me35S42, formed by
  two-atomic-layer-thick ribbons R1, R2, and R3), whose modular formula sum on p. 328 is
  (Ag0.51Fe0.49)Ag2(Tl0.65Pb0.35)Pb21(Sb7.59Pb4.41)Sigma12.00(Sb15.52As8.48)Sigma24.00S75.5
  (Ev = -1.7%). The seven strongest observed Gandolfi powder X-ray diffraction lines
  highlighted in bold in Table 3 (dobs in A (Iobs; dcalc, Icalc, hkl), CuKalpha) are 3.413
  (s; 3.417, 48, 0 8 0; 3.395, 84, 0 4 7; 3.393, 28, -2 -2 5; 3.393, 27, 2 -3 4), 2.965 (s;
  2.960, 15, 2 -5 5; 2.957, 32, -2 4 6; 2.956, 34, 2 3 5), 2.805 (ms; 2.816, 13, -2 -5 6;
  2.816, 17, 2 -6 5), 2.729 (ms; 2.733, 19, 0 10 0; 2.732, 17, -2 7 4; 2.732, 10, 2 -4 7;
  2.731, 20, 2 6 3), 2.091 (vs; 2.091, 100, -4 1 1), 1.872 (ms; 1.873, 17, 2 -13 5; 1.873,
  15, -2 -12 6), and 1.785 (ms; 1.780, 13, 4 3 6). No biological or microbial interaction
  data are reported in the type mineralogical description.
