id: cmmmech:spaltiite
name: Spaltiite
material_kind: mineral
description: >-
  IMA-approved thallium-copper-arsenic sulfosalt mineral (IMA 2014-012; status A, Approved
  2014; full description published January 2026; symbol Spti in Section 1, p. 28, and
  Figure 3b caption, p. 30, and Spli in Figure 3a caption, p. 30, of the primary paper;
  no separate symbol column is printed in the September 2026 IMA Master List, PDF p. 203)
  with ideal end-member formula Tl2Cu2As2S5 (printed as Tl2Cu2As2S5 in the September 2026
  IMA Master List, p. 203, and in the Title, Abstract, and Section 1, pp. 27-28, as
  Cu2Tl2As2S5 in Section 5, p. 30, and as Cu2As2Tl2S5 in Table 4, p. 33, requiring Cu 15.02
  wt%, As 17.71 wt%, Tl 48.32 wt%, S 18.95 wt%, total 100.00 wt%; Graeser, Topa,
  Effenberger, Makovicky, Paar, and Dinca, 2026, European Journal of Mineralogy 38:27-37).
  Named from the laboratory nickname "spalti", derived from the German verb "spalten"
  ("cleave" in the Abstract, p. 27; "splitting" in Section 1, p. 28), in allusion to its
  extremely well-developed cleavage parallel to {100}. Found in 2009 by Walter Gabriel (a
  member of Forschungs-Gemeinschaft Lengenbach, FGL / FLG) on one of the dumps of the
  Lengenbach quarry, located southeast of the village of Faeld at ~1660 m altitude in the
  Binn Valley (Binntal), Canton Valais, Switzerland (660.171/135.176 in Swiss grid system
  CH903/LV03, i.e. latitude 46 deg 21 min 54 sec N, longitude 8 deg 13 min 15 sec E; hosted
  in a ~240 m thick bank of pure white Triassic dolostone of the Penninic Monte Leone Nappe
  metamorphosed to upper greenschist-lower amphibolite facies at up to 4 kb and 400-500 deg C
  during the Alpine orogeny and mineralized by late-stage hydrothermal solutions mainly
  enriched with As and Tl, inferred from its composition and mineral assemblage to originate
  from "Zone 1" of Graeser et al., 2008; Sections 1-2, pp. 28-29); the type specimen that
  contained the only three known crystals of spaltiite is deposited in the mineral collection
  of the Natural History Museum in Basel, Switzerland (catalogue no. S210), and one of the
  three crystals, which served for electron-microprobe, optical, and structural
  investigations, is deposited in the mineral collection of the Natural History Museum Vienna
  (catalogue no. N 9528) (Section 1, p. 28). Occurs in a ~30 x 30 x 20 mm3 piece of pure
  white Triassic dolostone as three euhedral long prismatic to lath-like crystals, each ~2 mm
  long and only ~0.2 mm thin (the crystal in Figure 2 measures 2.1 x 0.5 x 0.2 mm3), with
  point symmetry 2/m, elongated along the c axis [001] with the pinacoid {100} as the most
  prominent crystal form, numerous small {hk0} forms along the c axis, and a rounded top
  (Figure 2, p. 29), associated in the hand specimen and at the crystal base with small
  quantities of pyrite, drechslerite (Tl4(Pb,Sb,As)4S8; Topa et al., 2019), and hatchite
  (TlPbAgAs2S5) (Abstract, p. 27; Section 3, pp. 29-30; Figure 3, p. 30; and Table 2, p. 31).
  Crystals are greyish or lead-grey to black in colour and extremely soft with a metallic
  lustre and perfect cleavage parallel to {100} that produces minute and plastic slabs (all
  attempts to separate a small fragment for X-ray analysis yielded only extremely fine
  lamellae <1 um in diameter that could not be pulverised; Abstract, p. 27, and Section 3, p.
  30). Mohs hardness is 1.5-2, corresponding to Vickers micro-indentation hardness VHN15 =
  30-65 with a mean of 47 kg mm-2 (printed as "kg mm-2" in the Abstract, p. 27, and as
  "kg mm2" in Section 3, p. 30), and calculated density is Dcalc = 5.70 g cm-3 (Table 4, p.
  33). In the ore microscope, a polished section appears white under plane-polarised incident
  light with common red internal reflections; neither pleochroism nor bireflectance is
  discernible; anisotropy is weak in air, with a reddish-brown to greenish tint, and more
  distinct in oil, with a violet to greenish rotation tint (Section 4, p. 30). Reflectance
  values (Rmin, Rmax in %) measured in air using a WTiC standard and a Leitz MPV-SP
  microscope photometer (Abstract, p. 27, and Section 4 and Table 1, p. 30) at the four COM
  standard wavelengths are 27.0, 32.6 (470 nm), 26.8, 32.1 (546 nm), 26.0, 31.1 (589 nm), and
  24.8, 29.3 (650 nm) (full spectrum reported from 28.2, 33.2 at 400 nm to 23.8, 27.9 at 700
  nm in 20 nm steps in Table 1, p. 30). After initial qualitative EDS analyses on an
  unpolished surface with a JEOL "Superprobe" JXA 8600F, quantitative wavelength-dispersive
  electron-microprobe analyses (JEOL "Hyperprobe" JXA 8530F FE-EPMA at the Central Research
  Laboratories of the Natural History Museum, Vienna; 25 kV, 20 nA, 2 um beam diameter, 10 s
  peak and 5 s background count times; standards lorandite TlAsS2 for AsLalpha, TlLalpha, and
  SKalpha, galena for PbMalpha, Ag metal for AgLalpha, chalcopyrite for CuKalpha, and
  stibnite for SbLalpha; n = 10 points on the main grain in the polished section parallel to
  the a axis; Section 5, p. 30, and Table 2, p. 31) yielded mean Cu 15.46(12) wt%, Ag 0.15(6)
  wt%, As 17.36(14) wt%, Sb 0.41(5) wt%, Tl 47.41(19) wt%, Pb not detected, S 19.20(8) wt%,
  total 99.99(32) wt% (charge balance ch = -1.2%), corresponding on the basis of 11 atoms per
  formula unit (Z = 4) in Table 2 (p. 31) to Cu 2.04(1), Ag 0.01(0), As 1.94(1), Sb 0.03(0),
  Tl 1.95(1), S 5.03(1) apfu (note that the Abstract on p. 27 and Section 5 on p. 30 print
  the empirical formula as Tl1.94Cu2.04Ag0.01As1.95Sb0.03S5.03 and
  Cu2.04Ag0.01Tl1.94As1.95Sb0.03S5.03, respectively, swapping the Table 2 apfu coefficients
  of Tl = 1.95(1) and As = 1.94(1), where 47.41 wt% Tl / 204.383 = 0.23197 and 17.36 wt% As
  / 74.9216 = 0.23171 confirm Tl1.95 and As1.94 apfu). Crystallizes in the monoclinic system,
  space group P21/c (#14), with single-crystal X-ray diffraction unit-cell parameters
  (four-circle Nonius Kappa CCD diffractometer, 300 um capillary optics collimator,
  monochromated MoKalpha radiation, lambda = 0.71073 A, T = 293 K; Section 6.2, p. 31, and
  Table 4, p. 33) a = 15.791(8) A, b = 10.000(5) A, c = 6.323(3) A, beta = 99.25(8) deg, V =
  985.5(8) A3, Z = 4, and axial ratio a:b:c = 1.579:1:0.632 (Gandolfi powder X-ray
  diffraction with FeKalpha radiation on a 114.6 mm camera, Section 6.1, p. 31, and Table 3
  footnote b, p. 32, gave a = 15.821(9) A, b = 10.023(6) A, c = 6.334(4) A, beta = 99.21(6)
  deg). Data collection, structure solution by charge flipping, and refinements on F2 used
  COLLECT, JANA, and SHELXL-97 (Section 6.2, p. 31), converging to R1 = 0.1218 for 4753
  observed reflections with Fo > 4sigma(Fo) and R1 = 0.1408 for all 6057 unique reflections
  out of 19,790 measured reflections, with GooF = 1.51 for 101 parameters (CSD-2505991; note
  that Table 4 on p. 33 prints the row label "R1(F): all, observed" alongside the values
  "12.18 %, 14.08 %", transposing the "all" and "observed" labels relative to the Abstract on
  p. 27, which confirms R1 = 12.18 % for the 4753 observed reflections with Fo > 4sigma(Fo)).
  The asymmetric unit (Table 5, p. 33, and Tables 6-7, p. 34) contains 11 independent fully
  occupied sites: two Tl1+ cations with stereoactive lone-electron pairs, Tl1[7] in a
  distorted pentagonal bipyramid (Tl1-S = 3.122(4)-3.517(4) A, BVS = 0.968 vu, effective
  charge / charge distribution CD = 0.998) and Tl2[8] in a bicapped pentagonal bipyramid
  (Tl2-S = 3.006(4)-3.519(4) A in Table 6, p. 34, cited as 3.007-3.521 A on p. 32; BVS =
  0.965 vu, CD = 1.012); two As3+ cations with stereoactive lone pairs forming trigonal AsS3
  pyramids, As1 (As1-S11 = 2.210(4) A, As1-S12 = 2.296(4) and 2.340(4) A, average S-As1-S =
  97.9 deg, plus two long contacts As1-S22 = 3.731(4) A and As1-S23 = 3.846(4) A; BVS = 2.938
  vu, CD = 2.960) whose As1S3 pyramids share S12 corners to form infinite chains along [001],
  and As2 (As2-S21 = 2.253(4) A, As2-S22 = 2.262(4) A, As2-S23 = 2.287(4) A, average S-As2-S
  = 100.7 deg, plus two long contacts As2-S11 = 3.462(4) A and As2-S12 = 3.659(5) A; BVS =
  3.091 vu, CD = 3.014) whose As2S3 pyramids are not connected to each other; two Cu1+
  cations, Cu1 in slightly pyramidal [3S] coordination (Cu1-S23 = 2.267(5) and 2.336(4) A,
  Cu1-S22 = 2.290(5) A, sum of S-Cu1-S angles 346.4 deg; BVS = 0.784 vu, CD = 0.983) shifted
  toward As1 with a short Cu1-As1 contact of 2.635(4) A (Table 7, p. 34; printed as 2.635 A
  on p. 32), and Cu2 in distorted Cu2S4 tetrahedra (Cu2-S21 = 2.308(5) and 2.337(4) A,
  Cu2-S22 = 2.381(4) A, Cu2-S11 = 2.392(5) A, average S-Cu2-S = 109.3 deg; BVS = 0.900 vu,
  CD = 1.034); and five S2- anions (S11, S12, S21, S22, S23). Corner-linked Cu1S3 and AsS3
  pyramids form CuAs2S5 slabs along [001] that are connected by Cu2S4 tetrahedra into two
  inversion-related polar Cu2As2S5 layers (layer symmetry pc) parallel to {100} at (1/4 y z)
  and (3/4 y z), alternating with two topologically and crystallographically distinct
  centrosymmetric Tl layers (layer symmetry p21/c) centred at (0 y z) and (1/2 y z) and
  interlinked via S21 (Tl1-S21-Tl2 = 171.03(11) deg; Section 7, pp. 32-35). The seven
  strongest powder X-ray diffraction lines highlighted in bold in the Gandolfi pattern [dobs
  in A (Irel, Icalc, dcalc in A) hkl; Table 3, p. 32] are 3.907 (100, 100, 3.914) (021),
  3.643 (80, 34, 3.646) (-221), 3.484 (30, 45, 3.496) (311), 2.980 (50, 63, 2.988) (510),
  2.862 (30, 45, 2.869) (-511), 2.647 (60, 36, 2.652) (-331), and 2.506 (50, 29, 2.506) (040)
  (note that the Abstract on p. 27 lists eight strong lines using dcalc and Icalc values from
  Table 3 while printing intensity 40 instead of 100 for 021 and omitting minus signs on hkl:
  3.914 (40) 021; 2.988 (63) 510; 3.496 (45) 311; 2.869 (45) 511; 2.652 (36) 331; 3.646 (34)
  221; 2.506 (29) 040; and 2.762 (26) 202, where 202 has dobs = 2.749 A and Irel = 30 in
  Table 3). No biological or microbial interaction data are reported in the type
  mineralogical description.
