mechanisms:
  - id: acidophile_assisted_mg_leaching
    name: Acidophile-assisted magnesium leaching from Clinton Creek tailings
    process: bioleaching
    microbial: true
    description: >-
      Colonized sulfur or pyrite supplied acidity that increased magnesium
      release from tailings in laboratory columns. The cultures were reported
      as Acidithiobacillus thiooxidans from Wits Basin and an A. ferrooxidans
      enrichment from Kam Kotia tailings; strain authentication was not
      provided. Acid generation supports an indirect leaching mechanism,
      without proving direct microbial attack on a particular Mg-bearing phase.
    context: >-
      Clinton Creek tailings collected below the surface with minimal visible
      carbonate crust were sieved below 2.36 mm. Phase 1 used 10 g substrate
      in 10 mL syringe columns, 4-12 wt% ground pyrite or 2.1-6.4 wt% sulfur,
      and 2 mL basal salts per week for one month. Corresponding abiotic
      additive arms and no-additive controls were included. Ground serpentinite
      and acetic-acid-washed tailings were separate comparison substrates;
      the acid wash could also alter silicate reactivity. Enrichments were
      cultured near 21 degrees C, but column temperature was not explicitly
      stated. Phase 2 used colonized sulfur or Kam Kotia Cu-Zn sulfidic
      tailings above 10 g tailings, with 1 mL weekly basal salts for one year
      and duplicate no-additive controls. Leachates were filtered at
      0.45 micrometres and analyzed by ICP-AES. These are laboratory
      dissolution experiments, not demonstrated industrial recovery or net
      carbon removal.
    evidence:
      - source_ref: power2010
        supports: support
        explanation: >-
          Figure 1 and Phase 1 results show higher magnesium release with
          colonized additives than corresponding abiotic arms. Phase 2
          Figure 2 shows sustained enhancement relative to no-additive
          controls. The article's pH-dependent model is consistent with
          acid-mediated dissolution; it does not establish an additional
          biological effect at matched acidity.
      - source_ref: power2010_si
        supports: support
        explanation: >-
          Methods S2-S5 identify culture provenance, washed inocula and
          filtered-leachate analysis. Table S3 gives 317 mg Mg released by
          the one-year 8.5 wt% sulfur column versus 13.7 mg for the mean
          no-additive control. Its 14.3% denominator is total Mg inferred
          from 10 g feed at 36.7 wt% MgO, not isolated product recovery.
      - source_ref: power2010
        supports: partial
        explanation: >-
          Existing carbonates contribute to Mg release and may lose stored
          carbon during leaching. Phase 2 lacks matched abiotic additive
          columns; main Methods lists 12.5% for the highest sulfur loading
          while Figure 2, results and SI Table S3 use 10.5%. Sulfidic-tailings
          arms produced episodic metal pulses and the 30% arm showed declining
          pH and increasing metals. The proposed facility in Figure 3 and
          scaled carbon-sequestration estimates are scenarios, not deployment
          or measured net carbon storage. Asbestos detoxification was not
          established.
