id: cmmmech:perovskite
name: Perovskite
material_kind: mineral
description: Perovskite is the calcium titanate mineral species with ideal formula CaTiO3. The September
  2026 IMA-CNMNC list gives grandfathered status G and original description year 1839, not an IMA approval
  number. This owner identifies the mineral species, not the broader perovskite structure class, halide
  photovoltaic materials, elemental titanium, or a perovskite-bearing concentrate. Keller and Buseck (1994)
  independently characterized natural perovskite grains from Ca-Al-rich inclusions in the Allende and
  Vigarano carbonaceous chondrites by transmission electron microscopy and electron diffraction, using
  the orthorhombic Pnma setting. Their energy-dispersive analyses detected Ca and Ti without other reported
  detectable elements; this is detection-limited cation evidence, not proof of absolute purity or a measured
  oxygen balance. The paper examined over 50 grains from six extracted regions. Its separately synthesized
  CaTiO3 cooling experiments are not natural-feed extraction or recovery studies. Twinning observations
  and inferred meteorite thermal histories are kept distinct; no universal high-temperature transition
  sequence or cooling-rate thermometer is asserted here. No microbial mechanism, processing performance,
  industrial deployment or criticality designation is inferred.
