id: cmmmech:ammoniojarosite
name: Ammoniojarosite
material_kind: mineral
description: >-
  Ammoniojarosite is the ammonium ferric hydroxysulfate mineral with ideal formula
  (NH4)Fe3(SO4)2(OH)6, with ferric iron. The September 2026 IMA list records it as
  redefined, 1987 s.p. It is distinct from potassium jarosite, natrojarosite,
  hydroniumjarosite and industrial jarosite residues. Wang et al. (2007) prepared
  diffraction-assigned ammoniojarosite during biological oxidation of ferrous sulfate
  in ammonium-containing laboratory media. Their products were nonstoichiometric,
  and low-ammonium experiments instead produced schwertmannite or mixed precipitates.
  Neither phase assignment nor bulk composition establishes absolute phase purity,
  a recovered-metal yield, microbial necessity or industrial deployment. No
  constituent-element criticality is inherited.
