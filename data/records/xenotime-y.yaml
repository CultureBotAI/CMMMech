id: cmmmech:xenotime-y
name: Xenotime-(Y)
material_kind: mineral
description: Xenotime-(Y) is the yttrium-dominant phosphate mineral species with ideal formula
  Y(PO4), distinct from elemental yttrium, other xenotime species and xenotime-bearing concentrates.
  Ni, Hughes and Mariano (1995) characterized a natural crystal from the Nanling granitoid, southeastern
  China, by electron microprobe and single-crystal X-ray diffraction. Its tetragonal I4_1/amd
  structure has eight-coordinate rare-earth sites. The natural specimen contains additional elements
  and is distinct from the synthetic rare-earth phosphate comparators examined in the same study.
  The structural comparisons do not demonstrate microbial transformation or extraction. No dated
  criticality designation or industrial deployment is assigned.
