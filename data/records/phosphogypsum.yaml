    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000006375 for Gluconobacter oxydans 621H (NCBITaxon:290633; locus GOX0985) as the strain-sequenced reference representative for parent mechanism taxon Gluconobacter oxydans (NCBITaxon:442; supplier-labelled culture isolate).
