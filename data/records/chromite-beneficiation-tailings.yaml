      supports: partial
      explanation: Sections 2.1-2.5 and 3.1-3.3 and Figures 1-6 of Bolaños-Benítez et al. (2018) report culture acidification from initial pH 3.5 to average ~1.6 over 30-34 days at 5, 10, and 30 g/L Sukinda tailings with A. thiooxidans DSM 9463 (B-S2); however, uninoculated medium controls did not match the inoculated pH trajectory and the 30 g/L pH-2 acidified-water control mobilized more Fe (479 mg/kg at ~11 d) than 30 g/L bioleaching (~150-213 mg/kg).
