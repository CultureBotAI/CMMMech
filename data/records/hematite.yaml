  title: IMA-CNMNC master list, September 2026, PDF p92 Hematite row and explanatory status definitions; retained official PDF reinspected 11 October 2026. The entry 1971 s.p. is special-procedure history, not an asserted external identifier.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
