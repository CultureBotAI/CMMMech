id: cmmmech:thomasclarkite-y
name: Thomasclarkite-(Y)
material_kind: mineral
description: >-
  Hydrated sodium-yttrium bicarbonate-hydroxide mineral with current September
  2026 IMA-CNMNC approved formula NaY(HCO3)(OH)3(H2O)2·2H2O and approval number
  IMA 1997-047. Grice and Gault (1998) characterized the cotype specimens
  (CMNMI 81553, CMNMI 81554, and CMNMI 81555, formerly provisional phase UK93)
  from a large late-stage hydrothermal miarolitic cavity on level 7 of the
  Poudrette quarry, Mont Saint-Hilaire, Rouville County, Quebec, Canada.
  Electron-microprobe WDS analysis (2 points on 1 grain, p. 1295) combined with
  thermogravimetric analysis yielded Na2O 6.72, CaO 0.33, Y2O3 14.52, La2O3
  8.63, Ce2O3 17.11, Pr2O3 1.92, Nd2O3 5.63, Sm2O3 1.22, Gd2O3 1.22, Dy2O3 2.04,
  Er2O3 2.20, Yb2O3 1.32, ThO2 0.54, F 0.17, CO2 12.00, H2O 26.60, O=F -0.07,
  total 102.10 wt%, corresponding on the basis of 10 anions to the empirical
  formula
  (Na0.80Ce0.18Ca0.02)Sigma1.00(Y0.48La0.20Ce0.21Pr0.04Nd0.12Sm0.03Gd0.03Dy0.04Er0.04Yb0.03)Sigma1.22(HCO3)[O6.97F0.03]H9.93.
  Single-crystal X-ray diffraction refined in monoclinic space group P2
  (pseudotetragonal cell a = 4.556(1), b = 13.018(6), c = 4.556(2) A,
  beta = 90.15(3) degrees, V = 270.2(2) A3, Z = 1, R = 0.055, wR2 = 0.157 for
  1616 observed reflections with > 4sigma(F) using reflection twin law (101),
  twin fraction 0.496(9)) revealed a layered structure with 2-fold orientational
  disorder of the bicarbonate [HCO3]- groups and half-occupied W7 and OH4 sites.
  Hydrogen positions were not directly located by X-ray diffraction; the
  bicarbonate versus carbonate assignment rests on charge balance, C-O bond-
  valence sums, and infrared absorption bands. Laboratory thermogravimetric
  analysis showed a two-stage weight loss up to 510 degrees C, and the mineral
  dissolves readily with strong effervescence in 10% HCl. Distinct from
  adamsite-(Y), shomiokite-(Y), and elemental yttrium; no criticality
  designation, microbial mechanism, or industrial recovery yield is asserted.
