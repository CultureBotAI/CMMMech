id: cmmmech:heavy-rare-earth-elements
name: Heavy rare-earth commodities, EU assessment convention
material_kind: commodity
description: >-
  This commodity subgroup uses the EU 2020 critical-raw-material assessment's
  ten-member heavy-rare-earth convention: europium, gadolinium, terbium,
  dysprosium, holmium, erbium, thulium, ytterbium, lutetium and yttrium.
  Scandium is assessed separately and promethium is excluded in that source.
  The assessment covers oxide mixtures and low-purity single oxides in its
  initial-processing stage, and high-purity metals or interalloys in advanced
  refining. These are related commodity forms, not one mineral or alloy.
  The EU 2024 Annex II designation names heavy rare earth elements without
  enumerating members; its mapping here uses the explicitly stated EU 2020
  assessment convention. Light/heavy boundaries in other conventions are not
  asserted equivalent. This group overlaps individual element records and
  the broader rare-earth commodity family; no group-wide microbial mechanism
  or strategic designation is inferred from individual members.
