id: cmmmech:petalite
name: Petalite
material_kind: mineral
description: >-
  Petalite is the lithium aluminium silicate mineral species LiAlSi4O10,
  listed by IMA-CNMNC in September 2026 as grandfathered, with 1800 as the
  year of its original description (PDF page 170). This year is not an IMA
  approval-number identifier. The Handbook of Mineralogy describes monoclinic
  petalite occurring in granite pegmatites, where it can locally constitute
  lithium ore. This is geological resource context from the 2001 entry,
  not a claim about present production, universal ore grade or extractability.
  Its listed associations include spodumene and lepidolite; their occurrence
  together does not make those minerals or the lepidolite series synonyms
  for petalite. The species is distinct from elemental lithium, a bulk
  pegmatite feed, and a manufactured lithium product. No microbial mechanism
  or criticality designation is assigned here.
