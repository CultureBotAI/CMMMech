id: cmmmech:polymetallic-nodules
name: Polymetallic nodules
material_kind: primary_resource
description: Naturally occurring marine iron-manganese oxide and hydroxide concretions, commonly occurring on abyssal sediments and containing variable nickel, copper, cobalt and other constituents. This resource identity denotes the nodules, not a pure mineral species, constituent element, processing residue or defined traded metal grade. It is distinguished from rock-surface ferromanganese crusts and the terrestrial mixed manganese ore curated separately. Collection, drying and grinding do not make this geological feed a secondary resource. No constituent criticality designation is inherited.
sources:
- id: usgs2025
  title: U.S. Geological Survey (2025). U.S. Geological Survey Global Seabed Mineral Resources. Fact Sheet 2025–3017, version 1.1, April 2025; page 2, Table 1 distinguishes nodules on abyssal sediments from rock-surface ferromanganese crusts. Constituent asterisks refer to the U.S. 2022 list, not a criticality designation for these resource identities.
  url: https://pubs.usgs.gov/fs/2025/3017/fs20253017.pdf
  accessed_on: '2026-10-11'
