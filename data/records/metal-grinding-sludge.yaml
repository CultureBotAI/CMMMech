id: cmmmech:metal-grinding-sludge
name: Metal grinding sludge
material_kind: secondary_resource
description: >-
  Sludge generated during grinding of metal workpieces with cooling fluids,
  represented by an iron-rich sample from Tatra Koprivnice. Material collected
  from grinding-fluid traps contains metal particles and other phases; it is
  distinct from elemental iron, a specified alloy and coal-combustion cinder
  or slag. The evidence concerns the sampled processing residue, not every
  grinding sludge or an industrial bioleaching operation. No criticality
  designation is inferred from the metals it contains.
sources:
- id: fecko1996_tatra
  title: >-
    Fecko and Kucerova (1996), Bacterial leaching of waste materials at the
    Tatra joint stock company, Koprivnice. Mineralia Slovaca 28(5), 388-390.
    Original publisher issue PDF pages 82-84; grinding-sludge methods,
    Figures 1-3 and Tables 1 and 3. Tables 2 and 4 and Figures 4-7 concern
    the separate coal-cinder/slag feed.
  url: https://www.geology.sk/wp-content/uploads/documents/foto/MS/MS-1996-28-5.pdf
  accessed_on: '2026-10-11'
- id: ncbi_ferrooxidans
  title: >-
    NCBI Taxonomy 920, Acidithiobacillus ferrooxidans; Thiobacillus
    ferrooxidans is a homotypic synonym. Species-level mapping only.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920&mode=Info
  accessed_on: '2026-10-11'
mechanisms:
- id: culture_associated_grinding_sludge_leaching
  name: Acidophile culture-associated leaching of metal grinding sludge
  process: bioleaching
  microbial: true
  organisms:
  - id: NCBITaxon:920
    label: Acidithiobacillus ferrooxidans
  description: >-
    An acidified laboratory incubation with a source-described pure culture
    of Thiobacillus ferrooxidans was accompanied by changes in grinding-sludge
    morphology and elemental composition, increasing reported solution Fe(II)
    and increasing most-probable-number estimates. These observations support
    culture-associated leaching under the reported conditions. Without a
    matched abiotic comparison they do not isolate microbial enhancement
    over chemical dissolution. Persistent iron-bearing solids and unresolved
    recovery accounting preclude a complete-extraction or isolated-product claim.
  context: >-
    Page 388 describes sterilized Erlenmeyer flasks containing 10 g waste,
    180 mL 9K medium without FeSO4 and 20 mL bacterial suspension. The culture
    was supplied by the Mining Institute of the Slovak Academy of Sciences
    in Kosice; no strain accession or experimental stock authentication is
    reported. Incubation lasted 28 days at 26-30 degrees C, with pH maintained
    between 1.8 and 2.0. The source does not specify agitation, the adjusting
    reagent or acid additions, inoculum carry-over chemistry, or sterilization
    of the waste itself. It reports ICP elemental analysis and EDAX and X-ray
    characterization. The method used specifically to quantify solution
    Fe(II), leaching-flask replication, analytical detection limits and a
    sampling-adjusted mass balance are not described. No analysis dates are
    supplied for native concentration observations.
  evidence:
  - source_ref: fecko1996_tatra
    supports: support
    explanation: >-
      Pages 388-389 identify the grinding-derived feed and the inoculated
      experiment. Figures 1-3 show the original particles, an iron globule
      and the altered post-incubation material. The text reports persistence
      of Fe and Fe3O4 after treatment. Table 1 gives before/after elemental
      contents, while Table 3 reports increasing Fe(II) in solution and
      increasing MPN estimates across the four weeks. These are distinct
      analytical observations, not a single measurement of recovered metal.
  - source_ref: fecko1996_tatra
    supports: partial
    explanation: >-
      No matched uninoculated leaching arm is reported in the complete
      article. Acid dissolution, inoculum chemistry and changes in solid
      mass therefore remain alternative or additional explanations for the
      observations. Sterilized flasks do not establish a sterile waste feed.
      The MPN procedure uses five parallel dilution arrays and a two-week
      incubation at 30 degrees C, with iron-oxidation-associated color scoring;
      this is an analytical growth assay, not five replicated leaching flasks
      or direct proof of a particular in-flask dissolution pathway. It does
      not authenticate the experimental strain or independently establish
      attachment, enzyme action or microbial necessity.
  - source_ref: fecko1996_tatra
    supports: partial
    explanation: >-
      Table 1 labels a row as recovery into the leach, but no recovery
      equation or residue-mass denominator is provided. Its Pb, Mn and Fe
      percentages do not equal simple depletion calculated from the listed
      before/after concentrations. Such a calculation would itself not be
      a mass-based recovery yield. The discrepancy is retained without
      correcting the source or adopting those percentages. Increased relative
      Ti and Al contents do not establish net uptake or production of these
      elements. The abstract and results also highlight different sets of
      best-leached elements; no performance ranking is inferred here.
  - source_ref: fecko1996_tatra
    supports: partial
    explanation: >-
      The study's suggestion that adaptation or longer incubation could
      improve results is not demonstrated by an adapted-culture or duration
      comparison. Culture survival and changed residues do not establish
      economic suitability, isolated-metal recovery or industrial deployment.
      The separate coal-cinder/slag experiment in Tables 2 and 4 and Figures
      4-7 supplies no grinding-sludge controls or additional replicates; its
      phase descriptions, production tonnage and outcomes are not transferred
      to this resource.
  - source_ref: ncbi_ferrooxidans
    supports: context_only
    explanation: >-
      The live NCBI species record lists Thiobacillus ferrooxidans as a
      homotypic synonym of Acidithiobacillus ferrooxidans, consistent with
      the historical paper name. NCBITaxon:920 is a species identifier,
      not a strain accession or independent evidence of the mechanism.
