    row PDF p. 207, Sr(CO3), G, 1791. Previously acquired dated authority re-inspected on 14 October 2026.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
