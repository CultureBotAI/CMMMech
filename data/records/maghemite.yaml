id: cmmmech:maghemite
name: Maghemite
material_kind: mineral
description: >-
  Maghemite is the ferric iron oxide mineral commonly written gamma-Fe2O3,
  distinct from hematite, magnetite, elemental iron and an unresolved magnetic
  iron-oxide mixture. The September 2026 IMA list gives the vacancy-bearing
  formula (Fe3+0.67 vacancy0.33)Fe3+2O4 and status Rd, redefined through a
  2018 special procedure; this is not an IMA proposal identifier. The curated
  laboratory study used synthesized nanomaghemite and supports culture-associated
  reduction toward magnetite-like products, with sulfate-dependent differences
  and mixed-product limitations. No iron criticality designation, natural-ore
  extraction yield or industrial deployment is inherited.
