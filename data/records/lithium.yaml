    annotation_note: Grounded to type-strain reference proteome UP000001362 (Acidithiobacillus ferrooxidans ATCC 23270; NCBITaxon:243159). Represents the unsequenced Bor sulfide-ore Acidithiobacillus ferrooxidans isolate inoculated into jadarite-bearing and spodumene-bearing lithium silicate leaching flasks in Kirk et al. (2024).
    evidence:
    - source_ref: kirk2024
