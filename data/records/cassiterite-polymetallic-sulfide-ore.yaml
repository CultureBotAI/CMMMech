id: cmmmech:cassiterite-polymetallic-sulfide-ore
name: Cassiterite-polymetallic sulfide ore
material_kind: primary_resource
description: >-
  A heterogeneous natural tin-bearing geological feed containing cassiterite
  and sulfide minerals, represented here by the Myanmar ore studied by Wang
  et al. (2025). The crushed experimental ore contained source-assigned
  pyrite, cassiterite, quartz, tourmaline and mica. Its mine and deposit are
  not specified. Crushing does not establish a processing-waste origin.
  This resource is distinct from cassiterite or pyrrhotite mineral species,
  elemental tin, a tin commodity and a produced concentrate. The study does
  not establish extraction from a pure mineral or properties of all ores
  described by this name. No criticality designation is inherited from tin.
sources:
