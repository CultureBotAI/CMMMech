  - source: sulfide_generation_iron_nail_and_ph_shift
    target: baricite_assigned_mixed_precipitates
    predicate: nucleates
    relationship: culture-associated phase selection of crystalline barićite within mixed Mg-phosphate/carbonate solids
    description: Alkalinized, iron-nail-bearing G20 acetate cultures yield crystalline barićite (30.6 and 27.8 wt% of Rietveld-fitted crystalline phases in samples 1_103 and 2_35) plus magnesium-phosphate decahydrate, calcite, and elemental sulfur, without enhancing net dissolved Mg removal over sterile controls.
    evidence:
    - source_ref: han_2016
      supports: support
      explanation: Sections 2.1-2.3 and 3.2, Table 2, and Figure 1c-d assign 30.6 and 27.8 wt% barićite in Rietveld XRD fits of duplicate acetate-culture precipitates (samples 1_103 and 2_35) versus predominantly amorphous solids and calcite in sterile counterparts.
    - source_ref: han_2016
      supports: partial
      explanation: Main Table 2 and SI Figure 1 show similar net Mg depletion in inoculated and sterile acetate media, the iron nail's dissolved Fe contribution was not independently quantified, and Main Table 1 (0.89 mM phosphate) conflicts with SI Table 1 (0.089 mM phosphate).
