id: cmmmech:gaas-production-hydroxide-sludge
name: GaAs wafer-production hydroxide sludge
material_kind: secondary_resource
description: Heterogeneous metal-hydroxide sludge generated by neutralizing waste streams from industrial gallium arsenide wafer production. The curated evidence concerns the sludge supplied for Fritze et al. (2026), not crystalline GaAs, a pure iron mineral or all semiconductor wastes. Table 1 reports 32.81% Si, 6.97% Fe, 1.21% Ga, 1.34% As, 0.27% P and 1.83% Ca by handheld XRF; Section 2.1 separately reports 0.538% fluoride by ion-selective electrodes. These are the study's reported composition percentages, not a complete phase analysis or a specification for every sludge batch. No elemental identifier or constituent criticality designation is assigned to this waste. The gallium and arsenic records describe constituent outcomes from the same experiment; they are not independent replications.
sources:
- id: fritze2026
  title: 'Fritze MT, Haubrich F, Otto A, Schippers A and Hedrich S (2026). Bioleaching of GaAs metal hydroxide sludge: a biohydrometallurgical alternative to conventional acid leaching. Frontiers in Microbiology 17:1807986. doi:10.3389/fmicb.2026.1807986. Main text and supplementary material.'
  url: https://doi.org/10.3389/fmicb.2026.1807986
  accessed_on: '2026-10-11'
- id: ncbi_thiooxidans
  title: NCBI Taxonomy 930 — Acidithiobacillus thiooxidans, species rank
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=930&mode=Info
  accessed_on: '2026-10-11'
mechanisms:
- id: thiooxidans_sludge_leaching
  name: Sulfur-oxidizing culture leaching of GaAs-production hydroxide sludge
  process: bioleaching
  description: Living Acidithiobacillus thiooxidans cultures produced acidity during laboratory leaching of the sludge, with gallium, arsenic and iron mobilized into solution and some dissolved ferric iron reduced to ferrous iron. Acid dissolution accounts for much of the gallium release; additional microbial facilitation remains provisional. The proposed involvement of sulfur intermediates in iron reduction is not a demonstrated direct gallium or arsenic redox reaction. Dissolution does not establish selective separation or purified-product recovery.
  context: The study used type strain DSM 14887, adapted to 5% w/v sludge with aluminum; NCBITaxon:930 anchors the species, not a strain-specific taxon. Sludge was dried at 60 degrees C for 48 hours and mortar-homogenized. Section 2.1 describes the iron phase as amorphous ferrihydrite, while arsenate association and gallium association with iron are assumed or expected rather than measured speciation. The selected assay used 3% w/v sludge in 50 mL shake-flask setups, HBS minimal medium, 1% elemental sulfur, initial pH 1.8, 30 degrees C and eight days. Table 2 specifies 12.9 mM aluminum, molar Al:F 1.5:1, and 1 mL sulfuric acid for initial acidification. Aluminum was added to counter fluoride inhibition. Section 2.3 reports 10% inoculum as w/v; this unusual basis is retained. Biotic setups were triplicate. Uninoculated controls included an initial-pH negative control and a comparator acid-adjusted in response to the biotic pH. Dissolved Fe, Ga and As were measured by ICP-MS. Main-assay shaking
    speed and sampled-liquid separation are unresolved in Section 2.3. Industrial sludge provenance does not establish industrial deployment of the microbial process.
