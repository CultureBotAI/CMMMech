id: cmmmech:lizardite
name: Lizardite
material_kind: mineral
description: Lizardite is the Mg3Si2O5(OH)4 mineral species, grandfathered in the September 2026 IMA list with original-description year 1956. It is distinct from elemental magnesium, generic serpentine minerals and ultramafic rock resources. The experimental material was designated lizardite and chemically characterized by the authors; no quantitative phase-purity result is reported in the inspected study. No constituent criticality designation is inherited.
