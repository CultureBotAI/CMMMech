  - source: bioreactor_biogenic_sulfuric_acid_media
    target: enzyme_cleaned_pe_al_hydropulping_reject
    predicate: solubilizes
    relationship: spent ~1.4 M biogenic sulfuric-acid dissolution of aluminium from Cellic CTec3-pretreated carton reject
    description: Centrifuged ~1.4 M biogenic sulfuric-acid supernatant from mixed DSM 504 + DSM 9466 sulfur cultures leaches Cellic CTec3-pretreated (<11 mm) beverage-carton reject at 1.0, 2.5, or 5.0% (w/v) in 100 mL flasks (room temperature, 150 rpm, 7 d) and at 50 g/L in 1 L (30 C, 170 rpm, 7-8 d).
    evidence:
    - source_ref: kremser2022_cartons
      supports: support
      explanation: Methods 2.5 and 2.8, Results 3.3-3.4, Figures 4-5, and the supplementary acid-production methods of Kremser et al. (2022) document aluminium leaching from Cellic CTec3-pretreated (<11 mm) reject using centrifuged ~1.4 M biogenic sulfuric acid produced by DSM 504 and DSM 9466, performing comparably to commercial 1.4 M H2SO4 at 5.0% (w/v) and supporting acid substitution rather than a live-cell advantage during the leaching stage.
  - source: enzyme_cleaned_pe_al_hydropulping_reject
    target: dissolved_aluminium_from_carton_reject
    predicate: produces
    relationship: near-complete aluminium solubilization into acidic leachate in 7-8 days
    description: Chromazurol-S Spectroquant assays show near-complete aluminium dissolution by 7 days in 100 mL flasks (1.0-5.0% w/v reject at room temperature) and by 7-8 days in the 1 L integrated trial (50 g/L reject at 30 C), whereas a separate direct-culture DSM 583 arm reached up to ~88% Al leaching at 10 g/L and ~20% at 25 g/L over 14 days.
    evidence:
    - source_ref: kremser2022_cartons
      supports: partial
      explanation: Results 3.3-3.4 and Figures 4-5 of Kremser et al. (2022) report near-complete Al dissolution by 7 days in flasks and 7-8 days in the 1 L integrated trial; support is partial because Figure 4a shows loading-dependent replicate variation rather than an exact 100% yield, commercial 1.4 M H2SO4 gave similar dissolution, and subsequent Al hydroxide recovery at pH 6.4/6.5 is a chemical NaOH precipitation step.
