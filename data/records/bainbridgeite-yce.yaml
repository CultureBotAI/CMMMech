id: cmmmech:bainbridgeite-yce
name: Bainbridgeite-(YCe)
material_kind: mineral
description: An approved sodium-barium-yttrium-cerium carbonate mineral, IMA 2020-065, with ideal IMA-CNMNC September 2026 formula Na2Ba2YCe(CO3)6(H2O)3. The suffix denotes dominant cations at distinct crystallographic sites. Lykova et al. (2024, Part 3) characterized holotype CMNMC 46324 from Mont Saint-Hilaire, Canada. Its five electron-microprobe analyses average 8.24 wt% Y2O3 and 8.38 wt% Ce2O3 (Table 1); the other specimens in that table are separate. Analyses used 20 kV, 10 nA, 20–50 micrometre beams and beam-instability corrections. CO2 and H2O were calculated, not measured; infrared data support water qualitatively. The 293 K single-crystal model is triclinic P1, R1 = 0.040, with twinning. Poor crystal quality, omitted Ca, Ce/Dy scattering proxies for lighter/heavier lanthanides, constrained occupancies and unlocated hydrogen limit atom-specific interpretation. Table 6 gives unequal measured and assigned-model scattering values for Y6 (40.1 versus 38.3 electrons). The 2026 Part 5
  follow-up identifies a bainbridgeite-(NdCe) rim on the photographed YCe holotype crystal, with a YCe core and an intermediate YCe/alicewilsonite-(YCe) zone. Accordingly, the 2024 chemistry is a specimen-resolved analysis, not a homogeneous whole-crystal assay; the 2026 mixed-phase diffraction model is not substituted for it. This mineral is distinct from bainbridgeite-(NdCe), alicewilsonite-(YCe), elements and ores. Natural intergrowth and proposed geological replacement are not controlled transformation evidence. The qualitative aqueous-HCl effervescence observation has no concentration, duration or yield and is not curated as recovery. No microbial process, industrial deployment or inherited elemental criticality is established by these characterizations.
