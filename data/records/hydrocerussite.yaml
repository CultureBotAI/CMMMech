id: cmmmech:hydrocerussite
name: Hydrocerussite
material_kind: mineral
description: Hydrocerussite is the Pb3(CO3)2(OH)2 mineral species, listed as grandfathered with original-description
  year 1877 in the September 2026 IMA master list. It is distinct from cerussite, pyromorphite, elemental
  lead and lead-bearing wastes. The accepted experiment concerns a hydrocerussite-assigned component in
  processed bacterial-cell products from lead acetate solution, not a pure recovered mineral or an industrial
  waste assay. The Kato2022 experiment is also contextualized under lead and pyromorphite; these records
  are not independent replications. No lead-commodity criticality is inherited.
