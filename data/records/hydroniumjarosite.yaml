mechanisms:
- id: abiotic_hydrothermal_formation
  name: Abiotic hydrothermal formation of hydronium-rich jarosite
  process: other
  microbial: false
  description: Basciano and Peterson precipitated a hydroniumjarosite preparation from ferric sulfate
    without added potassium sulfate. The broader potassium- hydronium series initially developed compositional
    zoning; grinding and further heating in the reaction solution homogenized selected mixed compositions.
    Powder diffraction and chemical analyses supported the assigned phases. This is reagent-based mineral
    synthesis, not a microbial experiment or an assay of recovered iron from waste.
  context: Laboratory sample A used 40 g ferric sulfate pentahydrate in 100 mL aqueous starting solution,
    with no added K2SO4, at 140 degrees C for an initial 48 hours in polypropylene containers inside
    steel vessels. The potassium-containing series required additional equilibration; the reported 20-day
    sample-B and 3-day sample-H treatments are not assigned to sample A. Products were washed, filtered
    and dried at 120 degrees C. Alumina was deliberately added for synthetic-powder diffraction preparation;
    its presence in the refinement is not evidence of a synthesis impurity. The natural quartz-bearing
    sample was analyzed separately. No matched biological control or microbial strain was used.
  evidence:
  - source_ref: basciano2007
    supports: support
    explanation: Methods on pages 1465-1467, Table 1 sample A, Tables 2-3 and Figures 1-4 support abiotic
      precipitation and the qualified comparison with potassium-bearing preparations. Figure 3 plots
      solid yield in grams and sulfur-normalized solution/crystal composition; these are not isolated-element
      recovery percentages. The natural-sample discussion on page 1472 supports occurrence and identity,
      not microbial causality.
  - source_ref: basciano2007
    supports: partial
    explanation: 'Full iron occupancy does not imply a completely occupied hydronium site: Table 3 refines
      sample A''s A-site occupancy to 0.92(1). Hydrogen positions within H3O were not directly determined,
      and the proposed protonation/charge-compensation model remains an interpretation. Table 1''s trace
      K assay is rounded away in its sample-A formula; the natural sample''s formula and K-occupancy
      entries disagree between Tables 1, 3 and 4. Some sulfate/formula tokens in the methods and table
      heading also conflict. No corrected empirical formula, exact site population, universal endmember
      composition or executable reconstructed recipe is inferred.'
