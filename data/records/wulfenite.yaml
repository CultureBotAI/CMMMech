id: cmmmech:wulfenite
name: Wulfenite
material_kind: mineral
description: 'Wulfenite is the lead molybdate mineral species PbMoO4, distinct from elemental lead or
  molybdenum, the tungstate endmember stolzite and an unspecified lead-bearing ore or precipitate. The
  Handbook of Mineralogy identifies its tetragonal structure and documents W-bearing compositions. Gracanin
  and colleagues (2024) characterized natural tabular and bipyramidal crystals from Mezica, Slovenia:
  single-crystal diffraction assigned both examined forms to I41/a, while microscopy showed inclusions
  within the otherwise compositionally wulfenite host. Their environmental growth reconstruction is an
  inference, not a monitored precipitation experiment. The publisher correction repairs the legends of
  Figures 1-6; the updated figures and Tables 1-4 are used here. The separately studied Xinjiang material
  underwent abiotic sodium-sulfide treatment in the laboratory. This record does not establish a microbial
  mechanism, an isolated-metal recovery yield or industrial deployment. Criticality is unrecorded.'
