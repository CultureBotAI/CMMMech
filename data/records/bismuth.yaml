mechanisms:
- id: fusarium_bi_accumulation
  name: Bismuth accumulation associated with Fusarium BI phosphorus-rich granules
  process: other
  description: Fusarium sp. strain BI grew on bismuth subsalicylate and decreased the filtered
    soluble-Bi pool relative to an uninoculated suspension. TEM-EDS located Bi in intracellular
    phosphorus-rich granules, and polyphosphate-containing extracts also contained Bi. These
    observations support bioaccumulation with a proposed polyphosphate association; they do
    not identify crystalline bismuth phosphate, demonstrate Bi(III) reduction or establish
    the molecular transport route. No isolated-product recovery yield or industrial deployment
    was demonstrated.
  context: Dodge and Wackett isolated Fusarium sp. BI from activated sewage sludge by enrichment
    on bismuth subsalicylate. Morphology and partial gene sequences supported an unresolved
    Fusarium isolate, not a named species. For soluble-Bi analysis, 1.5 mM bismuth subsalicylate
    suspensions in 250 mL minimal medium were preincubated on a shaker at 30 degrees Celsius
    for 24 h. Experimental flasks then received 100 microlitres of a 48 h culture grown on
    1.5 mM salicylate. The medium contained 15 mM potassium phosphate buffer at pH 7.0, mineral
    salts and vitamins. Daily samples from inoculated and uninoculated flasks passed through
    0.2 micrometre polyethersulfone filters; acidified filtrates were analyzed for total Bi
    by ICP-OES with an yttrium internal standard. Replicate number and error estimates for
    this time course are not specified. Separate TEM-EDS preparations used washed 96 h biomass
    grown on 1.5 mM bismuth subsalicylate or salicylate. Polyphosphate fractionation used
    0.4 g wet biomass from 72 h cultures; Figure 4 reports three replicates, without establishing
    independent culture replication. Defined laboratory reagent suspensions are not ore, waste
    leachate or a recovery installation.
  microbial: true
