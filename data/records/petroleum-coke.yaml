  evidence:
  - source_ref: tripathi2010
    supports: support
    explanation: Tables 3-5 on p. 83 give residual total sulfur concentrations of 6.31-6.34% before treatment, 5.42-5.52% after the first week and 0.40-0.47% after retreating those solids for a further week. The source reports an initial mean of 6.32%, a first-stage value of 5.46% and about 13.5% reduction. These observations support a sequential culture-associated change in solid composition under the reported conditions, without establishing the incremental effect of inoculation.
  - source_ref: tripathi2010
    supports: partial
    explanation: Table 5 reports 92.56-93.67% sulfur removal alongside final solid concentrations of 0.40-0.47%. These percentages are consistent in scale with concentration reductions relative to the initial feed, not an additional 93% recovery from the first-stage residue. Some individual table percentages do not exactly reproduce a common initial 6.32% denominator. No remaining-solid mass, liquid sulfur inventory, sulfur-species balance, recovered sulfur product or carbon yield is given; concentration changes cannot be treated as whole-feed recovery yields.
  - source_ref: tripathi2010
    supports: partial
    explanation: The described uninoculated comparison has no separately reported numerical result, preventing a microbial effect-size calculation and leaving acid-medium chemistry and other causes unresolved. Pyrite, sulfate and organic sulfur are discussed generically on pp. 83-85 without source-specific phase/speciation measurements. The discussion refers to Figure 1, but no Figure 1 graphic appears in the inspected complete five-page original. Reagent-volume, culture-identity and replication gaps further limit mechanistic attribution. Facility production capacity is not the scale of this flask experiment, and the claimed economic and fuel-use benefits are not directly tested.
  - source_ref: ncbi930
    supports: context_only
    explanation: Current taxonomy maps the historical name Thiobacillus thiooxidans to Acidithiobacillus thiooxidans. This nomenclatural mapping does not validate the Rajgir culture assignment, establish purity or identify it with any type strain listed by NCBI.
