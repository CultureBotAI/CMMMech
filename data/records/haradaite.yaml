id: cmmmech:haradaite
name: Haradaite
material_kind: mineral
description: Haradaite is a strontium-vanadyl silicate mineral with ideal formula SrV4+Si2O7, status A
  and approval 1963-011 in the September 2026 IMA list. The approval identifier is distinct from the 1967
  structural paper and the later 1982 natural description. Natural material from the Noda-Tamagawa and
  Yamato mines, Japan, contains substitutions; the analyzed Yamato type material was calcian and barian,
  not the pure Sr endmember. The 1967 structure analysis preferred orthorhombic Amam over Ama2, with silicate
  chains joined by vanadium, while explicitly discussing limited reflections and possible intensity errors;
  that historical model is not a claim that every specimen and later refinement has been reassessed. The
  1982 paper likewise prefers Amam and separates the two localities. Haradaite is distinct from elemental
  vanadium, generic vanadium ore and other vanadium silicates. Abiotic reagent synthesis supports a qualified
  formation mechanism. Geological association with other minerals does not demonstrate microbial formation,
  extraction or recovery, and criticality is not inherited from its constituents.
