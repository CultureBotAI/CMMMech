mechanisms:
  - id: y1_aragonite_precipitation
    name: Aragonite precipitation in magnesium-containing Y1 cultures
    process: biomineralization
    microbial: true
    organisms:
      - id: NCBITaxon:1402
        label: Bacillus licheniformis
    description: >-
      Source-designated B. licheniformis Y1 produced aragonite-bearing
      precipitates in calcium- and magnesium-supplemented organic medium.
      At nominal Mg/Ca molar ratios 6 and 9, XRD assigned aragonite with
      Mg-calcite after 14 days and only aragonite among fitted crystalline
      phases after 25 days; at ratio 12, only aragonite was assigned at both
      times. At ratio 3, Mg-calcite and aragonite coexisted, while ratio 0
      yielded calcite. These are phase observations in harvested solids,
      not mineral recovery yields or proof that every solid component is
      crystalline aragonite. Alkalinization and mineral association with
      extracellular polymeric substances are consistent with bacterial
      promotion of precipitation, without proving a unique molecular cause.
    context: >-
      The study used a preserved laboratory Y1 isolate; NCBI MF808044.1
      identifies a partial 16S sequence submitted as B. licheniformis Y1.
      The species taxon does not independently authenticate the stock.
      Mineralization medium contained beef extract 5 g/L, tryptone 10 g/L,
      NaCl 10 g/L, nominal Ca2+ 0.01 mol/L and Mg2+ 0, 0.03, 0.06, 0.09 or
      0.12 mol/L supplied by CaCl2 and MgCl2·6H2O. Initial pH was adjusted
      to 7.0 with HCl/NaOH. A 1% v/v bacterial suspension inoculum was
      compared with an equal-volume sterile-water control; each Mg/Ca arm
      had triplicate inoculated and control groups at 37 degrees C and
      130 rpm. Day-14/day-25 solids were washed three times with distilled
      water and anhydrous ethanol and dried before powder XRD and Rietveld
      fitting. The drying temperature is not specified. The reported pH
      rise and mineral microscopy do not replace a pH-matched cell-free
      phase-control series. Separate abiotic experiments added sodium
      carbonate to calcium/magnesium solutions with or without organic
      molecules and also produced aragonite; their recipe and times differ
      from the cultures. This is a laboratory precipitation study, not an
      extraction process, metal-specific recovery demonstration or deployment.
    evidence:
      - source_ref: han2023
        supports: support
        explanation: >-
          Sections 2.1-2.5 and 3.1-3.2, Figure 1 (p. 6) and Figure 2
          (p. 7), support culture conditions, alkalinization and the stated
          time- and Mg/Ca-dependent phase assignments. Figure 3 (p. 7)
          associates cell/EPS-bearing aggregates with aragonite-assigned
          preparations; this alone does not resolve which molecular component
          is necessary for nucleation.
      - source_ref: han2023_si
        supports: support
        explanation: >-
          Supplementary Figure S5 panels E-H show mixed Mg-calcite/aragonite
          fits at day 14 and aragonite-only fits at day 25 for ratios 6 and 9;
          panels I-J assign aragonite at ratio 12 at both times. The 100%
          fit labels describe the fitted crystalline assemblage, not a
          mass-balance yield, exclusion of amorphous/organic material, or
          biological specificity. Figure S3 contrasts growth-associated pH
          change with the control in the biochemical growth assay.
      - source_ref: han2023
        supports: partial
        explanation: >-
          Sections 2.9-2.13, 3.6-3.9 and 4.2 distinguish acid-digest Mg
          measurements, selected HRTEM/SAED spacings and modeled energies.
          Bulk Mg does not independently establish its coordination or the
          fraction substituting for Ca; the authors explicitly retain
          uncertainty about the Mg microenvironment. Section 4.3 offers
          alternative replacement and dissolution/reprecipitation hypotheses
          for selected dolomite-assigned surface domains after further
          incubation, without a bulk aragonite-to-dolomite conversion yield.
          Those inferences are not treated as demonstrated atomistic steps.
      - source_ref: han2023_si
        supports: context_only
        explanation: >-
          Figure S13 includes aragonite precipitated without biomolecules
          in the separate sodium-carbonate experiment (main Section 2.10),
          preventing a claim that bacterial presence is universally necessary
          for aragonite formation. This abiotic experiment is not a matched
          substitute for the culture control.
