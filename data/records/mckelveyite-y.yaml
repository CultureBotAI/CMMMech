id: cmmmech:mckelveyite-y
name: Mckelveyite-(Y)
material_kind: mineral
description: >-
  Hydrated sodium-calcium-barium-yttrium carbonate mineral of the mckelveyite
  (donnayite) group with current September 2026 IMA-CNMNC redefined formula
  NaCaBa3Y(CO3)6(H2O)3, status Rd, and approval number IMA 1964-025. Milton et
  al. (1965) originally described mckelveyite from four subsurface core and
  trona-mine localities in the Eocene Wilkins Peak Member of the Green River
  Formation, Sweetwater County, Wyoming, USA, proposing the uranium-bearing
  trigonal P-3 formula Na1.9Ba4.0Ca1.1Sr0.2RE1.5U0.3(CO3)9·5H2O after
  recalculating wet-chemical analyses of massive and crystal-aggregate fractions
  for 18.0-20.7 wt% acid-insoluble impurities (organic matter, authigenic
  biotite, acmite, and quartz). Subsequent studies cited by Demartin et al.
  (2008) showed that type mckelveyite-(Y) is triclinic P1 (mckelveyite-(Y)-1A)
  with formula NaBa3(Ca,U)Y(CO3)6·3H2O. Demartin et al. (2008) solved the first
  complete crystal structure on a uranium-free monoclinic Cc polytype,
  mckelveyite-(Y)-2M (a = 15.8213(7), b = 9.1364(4), c = 13.7522(6) A,
  beta = 112.44(1) degrees, Z = 4, R = 0.0283 for 4454 reflections with
  I > 2sigma(I)), from hydrothermal carbonate veins at the Cava Fabi talc
  quarry, Val Malenco, Sondrio, Lombardy, Italy, where CO2 and H2O were derived
  from structure solution rather than direct gas analysis. Following IMA-CNMNC
  guidance, the monoclinic Alpine material is a polytype (mckelveyite-(Y)-2M) of
  the species rather than a separate mineral species. Distinct from
  mckelveyite-(Nd), donnayite-(Y), ewaldite, and elemental yttrium or rare
  earths; no criticality designation, microbial mechanism, or extraction yield
  is asserted.
