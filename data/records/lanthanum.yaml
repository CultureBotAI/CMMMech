mechanisms:
- id: niger_supernatant_lanthanum_precipitation
  name: Lanthanum precipitation using Aspergillus niger culture supernatant
  process: biomineralization
  description: A. niger ATCC 1015 cultures produced supernatants that precipitated La supplied as soluble lanthanum chloride. Recovered crystals included lanthanum oxalate decahydrate; higher-La supernatant reactions also produced a phosphorus-containing phase. Microbial involvement is the prior fungal culture step. Chemical oxalic acid also precipitated La, so the experiment does not establish a requirement for living cells during precipitation or a unique biological precipitation reaction.
  context: Laboratory cultures used 100 mL nitrate-containing modified AP1 medium in 250 mL flasks, initially adjusted to pH 5.5, with 20 g/L glucose. Cultures were incubated for 7 days at 25 degrees C, 125 rpm, in darkness and filtered through 63 micrometre nylon mesh. The authors call this supernatant biomass-free; this coarse filtration is not a sterility demonstration. Harvest pH was 3.41 +/- 0.10. Assays mixed 9 mL supernatant with 1 mL LaCl3 solution to give 1-50 mM final La, then rolled for 24 h at room temperature, with at least three independent replicates. Precipitates were collected, washed three times and dried for weighing; remaining supernatant La was measured colorimetrically with Arsenazo III after centrifugation. Comparators used 9 mL of 25 mM chemical oxalic acid plus 1 mL LaCl3. These were not pH-matched supernatants, and the fungal-supernatant oxalate concentration was not directly measured. Neither mixed-REE separation, real-waste treatment nor industrial operation was
    demonstrated.
