    title: >-
      Comboni et al. (2024), original publisher supplementary ZIP with
      four CIF files S0026461X2400029Xsup001.cif through sup004.cif.
      These are non-hydrogen refinements of the starting phase in the
      same pressure study; none is a solved inderborite-II structure.
    url: https://static.cambridge.org/content/id/urn%3Acambridge.org%3Aid%3Aarticle%3AS0026461X2400029X/resource/name/S0026461X2400029Xsup001.zip
    accessed_on: '2026-10-15'
mechanisms:
  - id: abiotic-pressure-transition
    name: Disruptive pressure-induced transition in natural inderborite
    process: other
    description: >-
      Compression produced a first-order transition with severe loss of
      diffraction quality. The authors indexed a metrically monoclinic
      high-pressure phase but could not determine its space group or
      solve its atomic structure. The starting crystalline state did not
      return during the experimental decompression. Before transition,
      non-hydrogen refinements support inter-polyhedral tilting and
      shortening of oxygen separations associated with hydrogen bonds.
    context: >-
      Two approximately 20 x 15 x 10 micrometre crystals from the Inder
      Deposit sample were studied separately at ESRF ID15b in
      membrane-driven diamond-anvil cells with helium as pressure medium
      and ruby calibration uncertainty of 0.05 GPa. The deposited CIFs
      specify 293 K. The paper identifies the specimen as the same sample
      used in the neutron/chemistry study; this does not establish a
      complete chemical assay of each tiny pressure crystal. These are
      abiotic laboratory observations, without a microbial assay, boron
      extraction or recovered product. Proposed radiation-shielding uses
      were not tested as concrete performance or industrial deployment.
    microbial: false
    evidence:
      - source_ref: comboni2024
        supports: support
        explanation: >-
          Table 1 distinguishes two compression arms. In the first, the
          last starting-phase and first high-pressure-phase measurements
          are 8.11(5) and 8.80(5) GPa; in the second, they are 7.45(5) and
          8.96(5) GPa. These are sampled brackets, not an equilibrium
          transition pressure. The first arm extends to 10.10(5) GPa.
          Figures 2-3 and p. 479 show the discontinuity and reduced
          diffraction. The reported approximately 7% volume drop belongs
          to the first-arm transition comparison; the fitted starting-phase
          isothermal bulk modulus is 41(1) GPa from the second-order
          Birch-Murnaghan fit, with K-prime fixed at 4 (Table 3).
      - source_ref: comboni2024
        supports: partial
        explanation: >-
          Page 475 says data reached 9.84(5) GPa, whereas Table 1,
          abstract and p. 479 give 10.10(5) GPa. The text's 8.11-8.80
          GPa transition interval describes the first arm and does not
          replace the second arm's wider bracket. Table 2 shows
          O1-O6-O4 increasing from 165.7(1) to 172.3(3) degrees and
          O6-O1-O8 decreasing from 125.6(1) to 118.6(2) degrees, opposite
          to the directions stated on p. 479. Specific disputed angle
          directions are not used to define the mechanism. Failure to
          recover the starting state is limited to the experimental
          timescale and damaged crystals, not proof of permanent
          thermodynamic irreversibility.
      - source_ref: comboni2024_cifs
        supports: partial
        explanation: >-
          Cell metrics of the four files correspond to the first-arm
          starting-phase points at 0.43, 3.84, 6.23 and 8.11 GPa.
          Their atom loops contain no hydrogen sites, so hydrogen-bond
          deformation is inferred from oxygen geometry. The first file's
          pressure tag is 330000, unlike the 0.43-GPa cell assignment
          in Table 1; it is retained as an unresolved metadata conflict.
          Their doubled non-hydrogen formula and Z of 2 are a refinement
          convention, not evidence of a dehydrated mineral.
      - source_ref: comboni2024_si_pdf
        supports: partial
        explanation: >-
          Table S1 and Figure S4 support the distinction between relatively
          stiff coordination polyhedra and larger changes in selected
          inter-oxygen distances. Table S1's quadratic-elongation rows
          contain unexplained values near 10, including 19.919 for one
          B2 entry; these values are not adopted as reliable distortion
          measurements. Figure S3 explicitly shows inderite outside the
          proposed water-content/transition-pressure trend. The trend is
          a comparative hypothesis, not a universal causal law.
