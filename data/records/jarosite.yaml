mechanisms:
- id: thiooxidans_sulfur_assisted_dissolution
  name: Culture-associated reductive dissolution with inorganic sulfur donors
  process: redox_transformation
  microbial: true
  organisms:
  - id: NCBITaxon:930
    label: Acidithiobacillus thiooxidans
  description: Acidithiobacillus thiooxidans DSM 504 cultures showed greater
    dissolved-iron release and Fe(II) accumulation from biosynthesized potassium
    jarosite than uninoculated controls supplied with the same sulfur donor.
    Sulfite gave the largest reported dissolution, followed by thiosulfate and
    elemental sulfur. The authors interpret this as dissimilatory iron reduction
    coupled to sulfur oxidation. The maintained claim is culture-associated
    reduction and dissolution; direct enzymatic reduction, growth by ferric-iron
    respiration and an exclusive electron-transfer pathway are not established.
  context: The potassium-jarosite feed was prepared in a separate Acidianus
    manzaensis culture at 65 degrees C and 180 rpm, using 100 mL basal medium in
    250 mL flasks, initially pH 2.0 plus or minus 0.05, with 0.2 M FeSO4 and
    0.067 M K2SO4. After approximately six days the precipitate was filtered,
    washed with deoxygenated ultrapure water and vacuum dried at 30 degrees C.
    Dissolution assays used 0.5 g feed in 50 mL sterile basal salts medium in
    150 mL serum bottles, initial pH 1.94 plus or minus 0.05, and elemental
    sulfur, Na2S2O3 or Na2SO3 supplied at an equivalent sulfur concentration of
    10 g/L. Inoculated bottles began at 4 x 10^8 cells/mL; each donor had an
    uninoculated sterile control. Bottles were sealed with butyl stoppers and
    flushed for approximately 20 minutes with N2/CO2 at 80/20 by volume, then
    shaken at 30 degrees C and 180 rpm for up to 34 days. Assays were in
    duplicate and sampled every two to four days. These are nominally anaerobic
    laboratory batches; a measured dissolved-oxygen time course, killed-cell
    control and cell-free culture-filtrate comparison are not reported.
  evidence:
  - source_ref: chen2022
    supports: support
    explanation: Methods 2.2, Table 1 and Figure 1 support the prepared feed's
      potassium-jarosite assignment through XRD comparison with PDF 71-1777,
      SEM morphology and elemental analysis. Table 1 reports Fe 31.23%, K 5.33%
      and S 12.11%, compared with ideal reference values 33.45%, 7.78% and 12.81%.
      The near-ideal Fe/S molar ratio does not establish endmember stoichiometry
      or quantitative phase purity; potassium is lower than in the ideal
      reference. The study does not resolve all possible substitutions or
      amorphous fractions. This is not a sampled industrial residue.
  - source_ref: chen2022
    supports: support
    explanation: Figure 2 shows donor-dependent dissolved total iron and Fe(II)
      accumulation in inoculated assays, with the sulfite arm highest. Methods
      2.4 measure dissolved total and ferric iron by the sulfosalicylic acid
      method; Fe(II) is calculated as their difference, not measured by an
      independent ferrous assay. Supplementary Figures S2-S3 show substantially
      lower but nonzero iron release in uninoculated controls. These comparisons
      support a culture-associated enhancement under the reported conditions.
  - source_ref: chen2022
    supports: partial
    explanation: The exact final sulfite percentage is internally inconsistent.
      Section 3.2, manuscript line 246, states 96.4% after 34 days, whereas the
      abstract and conclusion state 98.4%; Figure 2c plots a near-complete extent.
      The manuscript gives no explicit leaching-percentage calculation or full
      solid-liquid iron balance. Its plotted extent and solution concentrations
      are not an isolated jarosite-derived product yield, and neither conflicting
      sulfite percentage is selected as an accepted recovery measurement.
  - source_ref: chen2022
    supports: partial
    explanation: Supplementary Figure S2 gives day-34 abiotic leaching extents
      of 1.3%, 6.3% and 8.5% for elemental sulfur, thiosulfate and sulfite,
      respectively; maxima across sampled times are 1.5%, 6.3% and 8.7%.
      These source-defined extents are retained to distinguish endpoint from
      maximum and to show that abiotic release was not zero. Statements in
      the main text that sulfite alone could not mediate dissolution are
      stronger than these control observations support. They do not establish
      a uniquely biological dissolution reaction.
  - source_ref: chen2022
    supports: support
    explanation: Figures 4-8 compare final residues with controls. After 34 days,
      the sulfite culture residue lacks the characteristic jarosite Raman peaks
      seen in its uninoculated control, and its Fe L-edge spectrum resembles
      the Fe(II) sulfate standard rather than the initial ferric jarosite.
      SEM shows fine, poorly crystallized residue rather than the original
      jarosite morphology. These observations support substantial transformation
      of the sampled solid; non-detection without a quantified phase detection
      limit does not prove complete disappearance of every jarosite particle
      or recovery of a pure crystalline ferrous-sulfate product.
  - source_ref: chen2022
    supports: partial
    explanation: Figure 2b shows decreases in dissolved Fe(II) at some later
      sulfite-arm times; Fe(II)-bearing solids in Figure 7 are compatible with
      repartitioning. Solution iron alone therefore does not close the iron
      inventory. Figure 8 assigns sulfur spectra in the sulfite culture residue
      to sulfate and observes elemental sulfur in both biotic and abiotic
      thiosulfate residues. These spectra support sulfur transformation but
      do not resolve a complete electron balance or distinguish direct
      microbial electron transfer from reactions involving sulfur intermediates.
  - source_ref: chen2022
    supports: partial
    explanation: Figure 3 and Supplementary Figure S4 show donor-dependent pH
      and redox trajectories, including an early rise toward pH 2.8 in the
      abiotic thiosulfate control. This qualifies the main text's statement
      that abiotic pH and redox values showed no significant changes. There
      is no pH-clamped comparison isolating microbial effects from evolving
      solution chemistry. S4 also includes a sodium-sulfate control curve
      not described among the three dissolution donors in Methods 2.3; it is
      not used here to infer a fourth equivalently specified assay.
  - source_ref: chen2022
    supports: partial
    explanation: Figure 3c reports no significant increase in planktonic cell
      counts in the sulfite arm despite its largest dissolution response.
      Counts do not demonstrate viability, biomass yield or energy conservation
      by iron respiration. The experiment does not measure an enzyme, test
      respiratory mutants, or eliminate chemical reduction by cell-associated
      or released sulfur intermediates. Laboratory removal of this prepared
      jarosite does not establish improved extraction from a mixed ore,
      industrial jarosite-waste treatment or an industrial recovery process.
