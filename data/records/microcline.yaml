mechanisms:
- id: community_associated_specimen_weathering
  name: Nutrient-associated colonization and weathering of heterogeneous microcline specimens
  process: bioleaching
  microbial: true
  description: Indigenous groundwater microorganisms colonized and were associated with surface alteration
    of the phosphorus-bearing South Dakota microcline specimen in field microcosms. The phosphorus-poor
    Ontario specimen showed sparse attached cells and no visible chemical weathering. These specimen-dependent
    observations support microbial weathering as an interpretation, but neither quantify phase-specific
    dissolution nor demonstrate potassium or phosphorus recovery. Organic-acid or ligand attack is proposed,
    not causally isolated.
  context: Rogers1998 exposed source-characterized natural specimens in punctured 8 mL bottles within
    background and petroleum-contaminated groundwater wells at Bemidji, Minnesota. Crushed 5–10 mm chips
    were ultrasonically cleaned four times for 15 seconds and dry-sterilized for approximately two hours
    at 150 degrees C. Methods describe 3–12 month exposures; the microcline image in Figure 6 is after
    approximately one year. Field water chemistry was measured rather than held at a laboratory setpoint.
    Mineral characterization included optical microscopy, SEM-EDS, XRD, electron microprobe and whole-rock
    analysis. Apatite in the South Dakota specimen is hosted within intergrown albite, not demonstrated
    as phosphorus substitution in the microcline lattice. Attached organisms were described morphologically;
    no strain-resolved causal agent or taxon identifier is asserted.
  evidence:
  - source_ref: rogers_1998
    supports: support
    explanation: Methods pp.1533–1534 and Results pp.1535–1538, Tables 1–2 and Figures 1, 3 and 6 document
      the contrasting specimen composition, attached cells and altered South Dakota surfaces versus nearly
      barren, unaltered Ontario material. Enrichment cultures from all tested specimens were positive
      for fermenters, iron reducers and methanogens, including sparsely colonized specimens; sparse visible
      attachment is not evidence of sterile material or a taxon-specific mechanism.
  - source_ref: rogers_1998
    supports: partial
    explanation: Figure 7 compares separate abiotic acid-weathering experiments with the field surfaces,
      but laboratory pH 3/5 acid conditions are not a matched sterile field control. Accessory apatite/albite,
      field chemistry and surface heterogeneity prevent assignment of nutrient release exclusively to
      microcline. Replicated phase-specific dissolution or recovery mass balances are absent from the
      accepted claim. The abstract and Table 1/2004 Table 1 differ in microcline versus anorthoclase phosphorus
      values; no exact phosphorus grade is adopted.
  - source_ref: rogers_2004
    supports: partial
    explanation: Section 3.1 p.98 explicitly summarizes the earlier feldspar field lineage, describing
      microcline as less colonized and lightly etched, whereas Rogers1998 Figure 6 describes extensive
      weathering. These qualitative descriptions are retained without a universal extent claim or counting
      the 2004 summary as independent field replication. The new 2004 field-chip experiment concerned
      manufactured glasses, not a new microcline field trial.
  - source_ref: rogers_2004
    supports: partial
    explanation: 'The distinct laboratory arm (Methods 2.5, Results 3.3, Figures 6–10 and Table 5) limits
      generalization: microcline-supported biomass increased but there was no corresponding silicon increase,
      and Table 5 marks microcline weathering absent. Four 40 mL microcosms per material used 4 g sterile
      chips, 50:50 anaerobic groundwater/deionized water, a native sediment inoculum, added 1 mM 3,4-dihydroxybenzoic
      acid and three months at 25 degrees C in darkness. Added air precipitated groundwater iron, and
      inoculum Tween 80 contributed some phosphorus. The model ligand was supplied, not shown to be secreted
      at that concentration. Silicon/phosphate plots subtract sterile controls; iron subtracts the bottle
      blank. Cell counts include viable and nonviable cells. These outcomes do not establish microbial
      necessity for phosphorus release, and an increase in biomass is not proof of increased microcline
      dissolution.'
  - source_ref: rogers_2004
    supports: context_only
    explanation: Separate abiotic powder reactors at pH 5 compared acetate with the model ligand. Their
      dissolution results must not be treated as live-microbial performance. Neither the field association
      nor laboratory assays establish isolated product recovery or industrial mineral extraction.
