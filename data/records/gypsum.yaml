id: cmmmech:gypsum
name: Gypsum
material_kind: mineral
description: Gypsum is the grandfathered calcium sulfate mineral species Ca(SO4)(H2O)2, distinct from
  anhydrite, bassanite, elemental calcium or sulfur, and mixed industrial residues such as phosphogypsum
  and titanogypsum. This owner describes the hydrated substrate in a disputed microbial dehydration experiment
  and an independent negative test. The same primary experiments are cross-represented in cmmmech:anhydrite;
  their occurrence in two mineral owners does not create independent replication. Mineral identity is
  established separately from the contested mechanism. No constituent criticality, industrial deployment
  or recovery yield is asserted.
