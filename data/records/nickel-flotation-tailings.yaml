  - uniprot_accession: UniProtKB:B7J3C9
    entry_name: TTH_ACIF2
    protein_name: Tetrathionate hydrolase
    gene_symbol: tth
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:243159
      label: Acidithiobacillus ferrooxidans ATCC 23270
    reference_proteome_id: UP000001362
    ec_numbers:
    - EC:3.12.1.-
    interpro_ids:
    - InterPro:IPR018391
    - InterPro:IPR002372
    - InterPro:IPR011047
    - InterPro:IPR015943
    pfam_ids:
    - Pfam:PF13360
    functional_role: Periplasmic tetrathionate hydrolase (EC 3.12.1.-; tth / AFE_0029) hydrolyzing tetrathionate into thiosulfate, elemental sulfur, and sulfate, generating sulfuric acid protons.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000001362 for Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159).
    evidence:
    - source_ref: munoz_blandon2010
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 tetrathionate hydrolase (tth / AFE_0029) for polythionate disproportionation and sulfuric-acid generation during shaken acidic T&K leaching of pyrrhotite/dolomite-bearing nickel flotation tailings in Munoz Blandon (2010); individual sqr/tth genes were not mutated.
  evidence:
  - source_ref: munoz_blandon2010
    supports: support
    explanation: 'Pages 33, 36-40 and 50-53 identify the flotation residue and laboratory protocol. Figures 13-14 and Table 11 on pages 62-63 report day-14 extraction as percentages of total feed Ni: inoculated/control 42/24% without added iron, 46/30% with ferrous iron and 45/37% with grown ferric culture. Corresponding total-Cu percentages were 16/14%, 17/14% and 16/13%. These are reported treatment comparisons, without displayed replicate uncertainty or a statistical significance test. The adjacent percentages against the smaller aqua-regia-soluble Ni fraction are not total-metal extraction yields. No leachate concentration is converted here into isolated-product recovery.'
  - source_ref: munoz_blandon2010
    supports: partial
    explanation: Figures 13 and 15 show generally higher redox in inoculated flasks and changed solid-phase diffraction after treatment. Pyrrhotite and dolomite peaks declined, and additional peaks were assigned to jarosite, but silicate-jarosite peak overlap and mixed feed prevent a quantitative mineral mass balance. The proposed acid and ferric-iron mediation is consistent with these observations; a killed-cell control, blank-corrected inoculum chemistry, identical pH trajectory and authenticated strain-specific mechanism are not demonstrated.
  - source_ref: munoz_blandon2010
    supports: partial
    explanation: 'The separate 50-day series in Figures 16-17 and Table 13 also showed higher Ni mobilization in the first three inoculated arms. The strong-acid arm did not: Table 13 reports total-Ni extraction of 44% with inoculated ferric culture plus 1.25 M sulfuric acid and 45% in its control. Table 2 describes that control as sterile acid alone, so the iron chemistry is not matched and the result does not uniquely demonstrate acid inhibition of living cells. Some total/soluble values elsewhere in this table cannot be reconciled using rounded Table 7 composition; those denominators are not pooled or recalculated.'
  - source_ref: munoz_blandon2010
    supports: partial
    explanation: Static beaker tests in Figures 19-22 and Table 14 showed similar or greater nickel mobilization in controls. The source proposes restricted oxygen and mass transfer, without directly measuring those causes. The static protocol includes inconsistent iron concentrations between figure captions and discordant total/soluble percentage accounting, so precise static yields are not adopted. Those null comparisons remain evidence against treating the shaken-flask benefit as universal. Neither the industrial origin of the waste nor these laboratory tests demonstrates pilot or industrial microbial recovery.
