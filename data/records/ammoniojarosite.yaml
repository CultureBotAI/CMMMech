mechanisms:
- id: iron_oxidation_associated_precipitation
  name: Ammonium-dependent precipitation during microbial ferrous-iron oxidation
  process: biomineralization
  microbial: true
  organisms:
  - id: NCBITaxon:920
    label: Acidithiobacillus ferrooxidans
  - id: NCBITaxon:47303
    label: Sulfuracidifex metallicus
  description: >-
    Iron-oxidizing cultures generated ferric iron from dissolved ferrous sulfate,
    with ammoniojarosite identified in the resulting precipitates at sufficient
    ammonium concentrations. The ammonium-concentration series used an enrichment
    dominated by A. ferrooxidans, not a verified pure strain. A separate temperature
    series used that enrichment, source-named Sulfolobus metallicus, or an unresolved
    thermophilic consortium. The demonstrated association with biological iron
    oxidation does not isolate a cell-specific nucleation mechanism.
  context: >-
    Wang et al., section 2.1 and Table 1: aerobic 100 mL cultures in 250 mL shake
    flasks used 120 mM FeSO4.7H2O, 1.6 mM MgSO4.7H2O, 5.4 mM NH4H2PO4 and
    4.05 mM H2SO4, initially pH 2.3-2.6, with added ammonium sulfate and no
    potassium nutrient salt. The 36 degrees C concentration series tested
    5.4-805 mM ammonium. The separate 165 mM ammonium temperature series used
    the MAF enrichment at 22 and 36 degrees C, the source-named S. metallicus
    culture at 45 degrees C, and consortium MT at 65 degrees C. NCBI species
    mappings do not identify a deposited experimental strain; the MT composition
    after enrichment at 65 degrees C was not established, so no taxa are assigned
    to it. Carbon came from ambient CO2. Precipitates were generally aged for one
    week, but the 22 degrees C product required about two months. They were
    centrifuged, washed twice with 5 mM sulfuric acid and dried at 65 degrees C
    for ten hours; elemental-analysis aliquots were additionally dried at
    110 degrees C. Inoculum fraction, shaking speed and independent culture
    replication were not specified in the inspected methods.
  evidence:
  - source_ref: wang2007
    supports: support
    explanation: >-
      Sections 2.1-3.1, Tables 1 and 3 and Figures 1-2 show schwertmannite as the
      only identified phase at 5.4 and 9.4 mM ammonium, mixed schwertmannite and
      ammoniojarosite at 11.5-85.4 mM, and ammoniojarosite as the only identified
      crystalline phase in the tested 165-805 mM arms at 36 degrees C. The
      abstract/conclusion says above 165 mM, whereas Table 3 already assigns
      sample 3.5.12 at 165 mM to ammoniojarosite. These are tested conditions,
      not a universal precipitation threshold or quantified purity measurement.
  - source_ref: wang2007
    supports: support
    explanation: >-
      Section 3.2, Table 4 and Figures 4-8 identify the temperature-series
      ammoniojarosites by powder diffraction, unit-cell refinement and elemental
      chemistry. All products were nitrogen-deficient relative to the ideal
      endmember; hydronium substitution was inferred from composition and
      diffraction trends. Nitrogen retained in biomass could also contribute to
      bulk analysis. Mineral stoichiometry is therefore not assumed from the
      ideal formula, and neither fitted cell parameters nor bulk nitrogen quantify
      a microbial mineral-production yield.
  - source_ref: wang2007
    supports: partial
    explanation: >-
      Section 2.1 explicitly states that abiotic syntheses were not matched
      controls: ferric rather than ferrous sulfate, ammonium concentrations,
      temperature and contact time differed (36 degrees C for 27 days,
      65 degrees C for eight days, and 95 degrees C for 24 hours). Sample 6.6
      is 65 degrees C in Methods, Tables 1 and 4 and the Figure 4 plotted label,
      but 45 degrees C in Table 3 and Figures 4 and 9 captions. Figure 7 labels
      the low-temperature abiotic trace 35 degrees C although Tables 1 and 4
      give 36 degrees C. No exact matched-temperature biological advantage is
      inferred across these inconsistent labels.
  - source_ref: wang2007
    supports: partial
    explanation: >-
      Sections 3.1-3.3 and Figure 9 retain causal limits: precipitation rates and
      ammonium consumption were not measured, proposed precipitation order was
      not demonstrated, and living-versus-inactive intact-cell comparisons were
      absent. Biological and chemical products could not consistently be
      distinguished by diffraction, chemistry, color or surface area. More
      rounded or aggregated biological particles do not establish a unique
      biosignature, extracellular-polymer mechanism or metabolic necessity.
