id: cmmmech:beverage-carton-hydropulping-reject
name: Beverage-carton hydropulping reject
material_kind: secondary_resource
description: The aluminium-polymer-rich reject remaining after paper recovery by hydropulping discarded liquid beverage cartons, with residual cellulosic fibres and mixed plastics. This process-defined secondary resource is distinct from intact beverage cans, pharmaceutical blisters, aluminium as an element and purified polyethylene. The selected industrial-origin sample does not define a universal reject composition or inherit a criticality list.
