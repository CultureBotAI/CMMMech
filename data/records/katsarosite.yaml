id: cmmmech:katsarosite
name: Katsarosite
material_kind: mineral
description: Katsarosite is the approved zinc oxalate dihydrate mineral, ideal Zn(C2O4).2H2O, IMA 2020-014,
  with monoclinic C2/c structure. It is distinct from zinc metal, dissolved zinc, zinc sulfate reagent
  and magnesium-dominant oxalates that can have a related diffraction pattern. No criticality designation
  is inherited from zinc.
