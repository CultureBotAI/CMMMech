id: cmmmech:niasite
name: Niasite
material_kind: mineral
description: >-
  IMA-approved anhydrous nickel arsenate mineral (IMA 2019-105; status A, Approved 2020)
  with ideal end-member formula Ni2+4.5(AsO4)3 (requiring NiO 49.37 wt%, As2O5 50.63 wt%,
  total 100 wt%), representing the tetragonal garnet-like (jeffbenite-type) dimorph of
  monoclinic unprotonated alluaudite-type johanngeorgenstadtite (IMA 2019-122) and the natural
  analogue of synthetic Ni4.35As3O11.7(OH)0.3 (Barbier, 1999; Kampf et al., 2020, European
  Journal of Mineralogy 32:373-385). Discovered on museum specimen AMNH 17956 from
  Johanngeorgenstadt, Erzgebirge, Saxony, Germany, where it occurs as a secondary oxidation
  product of primary nickeline associated with johanngeorgenstadtite, aerugite, bunsenite,
  quartz, rooseveltite, and xanthiosite; the holotype specimen is deposited at the American
  Museum of Natural History, New York (catalogue no. AMNH 17956, consisting of three major
  fragments and numerous smaller ones including 10 pieces mounted on two acrylic discs; also
  the holotype for johanngeorgenstadtite), and a cotype specimen of five fragments mounted on
  a glass slide is deposited at the Natural History Museum of Los Angeles County (catalogue
  no. LACMNH 74203, ex-Mark Feinglos collection, originally from the matrix of AMNH 17956).
  Forms sugary aggregates of violet-red to red-orange irregular, rounded grains or short
  prisms ~50 um in diameter with a pale-pink streak, resinous to subadamantine lustre,
  transparent diaphaneity, Mohs hardness ~4, brittle tenacity, conchoidal fracture, no
  cleavage, non-fluorescence under long- or short-wave ultraviolet light, insolubility in
  concentrated HCl and concentrated H2SO4 at room temperature, and calculated density
  Dcalc = 5.222 g/cm3 for the empirical formula and 5.245 g/cm3 for the ideal formula from
  single-crystal unit-cell parameters (or Dx = 5.065 g/cm3 in Table 3 for the refined cell
  contents Ni4.10(AsO4)3). Optically uniaxial (-) in white light with omega = 1.925(5) and
  epsilon = 1.855(5), pleochroic with O beige and E deep pink (absorption O < E), and
  Gladstone-Dale compatibility index 1 - (Kp/Kc) = -0.021 (excellent) for the empirical
  formula and -0.017 (superior) for the ideal formula. Micro-Raman spectroscopy (532 nm laser)
  is featureless from 4000 to 1000 cm-1 (confirming the absence of O-H and H2O) and exhibits
  a dominant doublet at 855 and 822 cm-1 (overlapping nu3 antisymmetric and nu1 symmetric
  AsO4 stretching vibrations, with a weak shoulder at 723 cm-1), bands at ~550, 507, and
  491 cm-1 (nu4 AsO4 bending), overlapping bands at 438 and 432 cm-1 (nu2 AsO4 bending), a
  composite band at ~347 cm-1 (Ni3O4 stretching), and low-energy M-Ox and lattice modes at
  270, 222, 192, 156, 147, and 130 cm-1. Electron microprobe analysis (5 points on 4 crystals,
  Cameca SX-50, 15 kV, 20 nA, 5 um beam; Table 1) yielded NiO 40.38 wt% (range 36.91-43.79,
  SD 3.10), CoO 7.26 wt% (5.42-8.54, SD 1.39), FeO 0.29 wt% (0.12-0.56, SD 0.21), Al2O3
  0.15 wt% (0.01-0.35, SD 0.17), CuO 0.13 wt% (0.07-0.19, SD 0.04), Na2O 0.08 wt% (0.00-0.20,
  SD 0.10), Ag2O 0.06 wt% (0.00-0.15, SD 0.07), and As2O5 51.03 wt% (50.27-51.58, SD 0.48),
  total 99.38 wt%, corresponding on the basis of 12 O atoms per formula unit to the empirical
  formula (Ni2+3.69Co2+0.66Fe2+0.03Al0.02Na0.02Cu2+0.01)Sigma4.43As3.03O12 (with trace Ag2O
  0.06 wt% below 0.005 apfu omitted from the rounded formula) and simplified formula
  (Ni2+,Co2+,Fe2+,Al,Na,Cu2+)4.5(AsO4)3 or (Ni2+,Co2+)4.5(AsO4)3. Crystallizes in the
  tetragonal system, space group I-42d (#122), with single-crystal X-ray diffraction unit-cell
  parameters a = 6.8046(8) A, c = 18.6190(13) A, V = 862.1(2) A3, and Z = 4 (refined to
  R1 = 0.0226, wR2 = 0.0442, GoF = 1.089, and Flack parameter 0.03(3) for 471 reflections
  with Io > 2sigma(I) out of 499 unique reflections collected with MoKalpha radiation on a
  35 x 30 x 20 um crystal, printed as "35 mm x 30 mm x 20 mm" in Table 3 via a mm-for-um
  unit typo). The dense garnet-like heteropolyhedral framework (isostructural with jeffbenite,
  Mg3Al2Si3O12) contains two fully occupied AsO4 tetrahedra (As1 with <As1-O> = 1.696 A,
  BVS = 4.88 v.u.; As2 with As2-O1 = 1.688(4) A x 4, BVS = 4.96 v.u.), two octahedra jointly
  occupied by Ni and Co (Ni1 with refined site occupancy 0.983(6), <Ni1-O> = 2.058 A,
  BVS = 2.08 v.u., sharing opposite edges with two As1O4 tetrahedra; Ni2 with refined site
  occupancy 0.971(5), <Ni2-O> = 2.091 A, BVS = 1.90 v.u.), and one partially occupied
  dodecahedral site (Ni3 with refined site occupancy 0.200(7), ideal occupancy 0.25, four
  shorter Ni3-O2 = 2.209(5) A and four longer Ni3-O3 = 2.707(4) A bonds, <Ni3-O> = 2.458 A,
  BVS = 1.08 v.u.; note that in Table 6a on p. 383 the O1 bond-valence contributions
  0.39 + 0.35 + 1.24 sum to 1.98 v.u. whereas Table 6a prints 1.99 v.u. due to unrounded
  summation). The strongest observed Gandolfi powder X-ray diffraction lines (dobs in A
  (Iobs; hkl), MoKalpha, Table 2a) are 2.752 (100; 2 0 4, 2 1 3), 1.678 (28; 3 2 5, 4 0 2,
  2 2 8), 3.008 (25; 2 1 1), 1.706 (21; 2 1 9, 4 0 0), 3.274 (18; 1 0 5), 1.446 (13; 4 2 4),
  2.330 (10; 2 1 5, 0 0 8), 1.412 (10; 3 3 6, 2 0 12, 3 1 10, 1 0 13), and 4.644 (9; 0 0 4,
  1 0 3) / 2.408 (9; 2 2 0) / 1.533 (9; 3 2 7, 3 0 9, 4 2 0). No biological or microbial
  interaction data are reported in the type mineralogical description.
