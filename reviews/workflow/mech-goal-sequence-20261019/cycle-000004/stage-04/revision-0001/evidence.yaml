findings:
- finding_id: cmmmech-cycle4-stage4-finding-0001
  status: open
  summary: "In data/records/traction-battery-hydrometallurgical-residue.yaml (cmmmech:traction-battery-hydrometallurgical-residue), causal_graphs[0] (ferrooxidans_battery_residue_bioleaching_graph) node solid_feed_substrate (line 521) carries label 'Industrial traction-battery hydrometallurgical residues (BR1, BR2, BR4)', where (BR1, BR2, BR4) are bauxite-residue sample codes from Borra et al. (2016) rather than the separate nickel-line and cobalt-line traction-battery hydrometallurgical residues in Lu et al. (2025, lu2025). In addition, nodes[0].label ('Sqr sulfide-quinone reductase (AFE_1792)'), nodes[1].label ('Tth tetrathionate hydrolase (tth / AFE_0029)'), and edges[0].evidence[0].explanation ('Reduced sulfur oxidation in A. ferrooxidans couples Sqr and polythionate hydrolysis to proton generation.') retain single-species A. ferrooxidans labels whereas sqr_reductase and tth_hydrolase are grounded across the five-member acidophile consortium."
- finding_id: cmmmech-cycle4-stage4-finding-0002
  status: open
  summary: "Across the 663-record corpus, 8 records (cadmium-telluride-photovoltaic-module-scrap, cathode-ray-tube-glass, churchite-y, end-of-life-cigs-photovoltaic-modules, end-of-life-crystalline-silicon-photovoltaic-modules, iron-ore-tailings, polymetallic-nodules, waste-printed-circuit-boards) serialize top-level 'mechanisms' before 'sources' (and in churchite-y before 'sources' and 'criticality'), whereas CANONICAL_RECORD_KEYS in scripts/new_history.py and the LinkML MaterialRecord class place 'sources' and 'criticality' before 'mechanisms' and 'causal_graphs'."
- finding_id: cmmmech-cycle4-stage4-finding-0003
  status: open
  summary: "Across the 663-record corpus, 16 records (aluminium-salt-slag, beryllium, beverage-carton-hydropulping-reject, biogas-desulfurization-sulfur-residue, cesium, electroformed-copper-silver-manufacturing-scrap, ground-waste-tire-rubber, ion-adsorption-rare-earth-clay, pharmaceutical-blister-packaging-waste, rhenium, rubidium, spent-lead-acid-battery-electrolyte, spent-vanadium-flow-battery-electrolyte, strontium, zinc-leach-residue, zinc-purification-hot-filter-cake) serialize top-level 'history_refs' before 'curation_history', whereas CANONICAL_RECORD_KEYS in scripts/new_history.py and the LinkML MaterialRecord class place 'curation_history' before 'history_refs'."
