id: cmmmech:thulium
name: Thulium
material_kind: element
description: Thulium is the element Tm, represented by its neutral-atom identity and distinct from Tm(III) chloride solutions, mineral hosts and rare-earth commodities. It is named in the United States Final 2025 List of Critical Minerals. Prepared Bacillus subtilis cell powders provide laboratory evidence for thulium biosorption and subsequent acidic elution, without an isolated pure-metal yield or demonstrated industrial process.
