id: cmmmech:spent-alkaline-zinc-carbon-batteries
name: Spent alkaline and zinc-carbon batteries
material_kind: secondary_resource
description: End-of-life non-button alkaline and zinc-carbon batteries, represented by a mixed AA-cell powder after dismantling, electrolyte washing and drying. This secondary resource is distinct from the curated watch/button-cell powder, nickel-metal-hydride batteries and lithium-ion battery black mass. The selected experiment treats the two primary-cell chemistries together; it does not establish separate chemistry-specific performance or a universal battery composition. Constituent-element criticality is not inherited.
sources:
- id: falco2014
  title: Falco, Martínez, Di Nanno, Thomas and Curutchet (2014). Study of a pilot plant for the recovery of metals from spent alkaline and zinc-carbon batteries with biological sulphuric acid and polythionate production. Latin American Applied Research 44(2):123–129. DOI 10.52292/j.laar.2014.429; complete seven-page publisher PDF, Methods II.A–H, Results III.A–C, Figures 1–7 and Table 1.
  url: https://doi.org/10.52292/j.laar.2014.429
  accessed_on: '2026-10-12'
- id: dsm11478
  title: 'DSMZ catalogue: Acidithiobacillus thiooxidans DSM 11478, strain Tth04. Collection identity does not authenticate the experimental stock.'
  url: https://www.dsmz.de/collection/catalogue/details/culture/DSM-11478
  accessed_on: '2026-10-12'
- id: ncbi930
  title: 'NCBI Taxonomy 930: Acidithiobacillus thiooxidans, species identity.'
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=930&mode=Info
  accessed_on: '2026-10-12'
mechanisms:
- id: biogenic_acid_medium_leaching
  name: Indirect leaching with a sulfur-oxidizing culture medium
  process: bioleaching
  description: Sulfur-grown Acidithiobacillus thiooxidans DSM 11478 produced an acidified, polythionate-containing medium in a separate air-lift reactor. This medium mobilized Zn and Mn from prepared mixed AA battery powder. Microbial involvement is upstream lixiviant production; direct cell attack on the battery powder and an isolated polythionate-specific causal effect were not demonstrated. Removal or inactivation of all cells before the leaching stage was not established.
  context: 'Methods II.B–F, pp.124–125: mixed spent AA alkaline and Zn-C cells of different brands were opened; casing, ferrous components, plastic and paper were separated, powder was washed with distilled water and dried overnight at a printed 150 degrees without an explicit temperature-unit letter. Figure 1 also separates a zinc can. Table 1 reports mixed-powder compositions both with and without that can, without transparently binding one of those assays to every extraction denominator. No absolute whole-cell inventory is reconstructed. The culture was maintained at 30 degrees C and 180 rpm in mineral salts medium, initially pH 2.5 with 1% m/V elemental sulfur. The 26.5-L total-volume air-lift reactor held sulfur as substrate and attachment support, was maintained at 30 degrees C and was inoculated once; acidified liquid was replaced with fresh mineral medium without reinoculation. The conclusion selects 8 kg sulfur, 10 L medium, 138 L/h air and a 350 mM proton endpoint. These are acid-production
    settings, not a claim of 10 L battery-leaching volume. The separate 50-L leaching vessel contained 2 kg prepared powder and 28 L biological medium at pH near 0.4, stirred at 200 rpm. Medium was replaced when pH and dissolved-metal measurements plateaued. Leaching-stage temperature and a full sampling/mass-balance correction were not specified. The authors call the integrated apparatus a pilot plant; the stated vessel and feed scales do not establish commercial deployment.'
