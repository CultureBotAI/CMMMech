  evidence:
  - source_ref: oyama_2021
    supports: support
    explanation: Sections 2.1-2.5 and 3.2, Figures 1, 5 and 6 and Figure S4 support the specified mixed-feed identity, inoculation and conditional copper dissolution. Eb favored 0.3% carbon at its endpoint, whereas Ea favored 0.05% at its endpoint despite faster early leaching at 0.3%. D3 tests plotted only 0 and 0.05%; the claim that higher doses did not improve D3 is explicitly attributed to unpublished data and is not adopted as an available measured dose-response. Figure 6 reports duplicate averages/error bars without establishing a statistical effect test.
  - source_ref: oyama_2021
    supports: partial
    explanation: Section 3.2 calls the controls sterile, but Section 2.1 explicitly states that the mixed concentrates were not sterilized. They are interpreted as no-added-cell comparators, not verified abiotic systems. Figure 6 includes substantial copper dissolution in control curves for D3 and Ea; low control redox potential does not prove zero dissolution or biological necessity. The article does not provide the same explicit control copper endpoints for every feed. Different pH trajectories and feed-specific acid adjustments prevent a clean estimate of microbial or carbon effects independent of chemistry.
  - source_ref: oyama_2021
    supports: partial
    explanation: Figure 5 calculates theoretical Cu atomic shares upon complete dissolution of each mineral, not observed phase-resolved extraction. The model Enormal is defined for chalcopyrite and is not independently validated for every phase in these mixed feeds. Electrochemical galvanic tests, detailed rate analyses, and residue XRD/SEM in Figures 2-4 and S1-S3 concern the separate model-chalcopyrite arm; they do not directly prove the same pathway or passivating phase for D3, Eb or Ea. Reported associations between redox behavior and feed composition are not a controlled mineral-ratio experiment.
  - source_ref: oyama_2021
    supports: partial
    explanation: Section 3.2.3 broadly describes roughly 60% arsenic leaching and proposes amorphous Fe-As precipitation for the rest. Figure S4 instead shows strongly arm-dependent soluble arsenic, including much lower values in several carbon-free and high-carbon conditions. No uniform 60% arsenic extraction or complementary immobilization yield is adopted. Dissolved total arsenic is not oxidation-state speciation; no mixed-feed secondary-phase identification or closed arsenic balance demonstrates the proposed precipitate. Source iron curves also contain initially added 5 mM Fe and cannot be read as mineral-derived iron alone. Suggested cell attachment, inhibition or flotation-chemical toxicity is not directly discriminated.
  - source_ref: ncbi_caldus
    supports: context_only
    explanation: The current official species entry verifies NCBITaxon:33059 and lists DSM 8584 and KU as type-strain aliases. This does not authenticate the experimental culture or identify the remaining community members through the same accession.
  - source_ref: okibe_2022
    supports: context_only
    explanation: The existing enargite-pyrite owner concerns different DC-I/DC-II/DC-III compositions at 20% w/v feed with six starting organisms and a 60-day design. The 2021 D3/Eb/Ea assays are not pooled with those results. The 2021 introduction's separate 2020 precursor with 37.4% enargite and 47.3% pyrite resembles nominal 2022 DC-II; it is not a D3/Eb/Ea composition or evidence of independent replication.
