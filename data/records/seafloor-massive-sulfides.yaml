  evidence:
  - source_ref: saito2015
    supports: support
    explanation: Methods 2.1–2.2 and Table 1 establish natural mixed ore, living DSM 1651 culture, preparation and assay. Results 3.1 and the rendered Figure 1 distinguish sample A copper/zinc inoculated curves from sample A sterile curves and sample B zinc. The text supplies the approximate day-10 values retained here. Figure 2 compares starting material and residues at initial pH 1.2, a different condition from Figure 1; it supports a changed mineral assemblage, not an identical-assay metal balance.
  - source_ref: saito2015
    supports: partial
    explanation: 'Results 3.2–3.3 retain non-target behavior: dissolved Pb and Au were below the reported 0.1 g/m3 analytical limit, not measured zero. Anglesite peaks appear in the inoculated residue, consistent with secondary Pb precipitation; the detailed dissolution/precipitation route is inferred. Gallium extraction decreases with increasing ore loading and Ga/Au are enriched in residual material, not isolated products. The reported dissolved-Ga concentration in section 3.3 is incompatible with the Table 1 feed inventory at the stated loadings, so that numerical concentration and a closed Ga balance are not accepted.'
  - source_ref: saito2015
    supports: partial
    explanation: 'Figures 4–8 and sections 3.4.1–3.4.5 limit generalization: higher loading lengthens the lag, and section 3.4.3 describes about 80% Cu/Zn extraction at 15 days, whereas the conclusion broadly says above 80% at 10 days across the loading range. Salt addition increases abiotic leaching and suppresses copper bioleaching at higher nominal doses; section 3.4.5 uses kmol/m3 while Figure 8 labels the same NaCl numbers kg/m3, so no resolved salt threshold is asserted. The pH-variation subsection reports smaller drift than section 3.1; no single pH tolerance is imposed on all runs. Replication, chemistry-matched causality and complete mass balance remain unresolved. Figure 9 reuses terrestrial-concentrate results from earlier papers and is not an independent replication of the marine ore assay.'
  - source_ref: dsm1651
    supports: context_only
    explanation: The issuing collection confirms Acidianus brierleyi DSM 1651 and its terrestrial thermal-spring provenance. It does not certify the adapted culture state, experimental performance or a marine strain identity.
causal_graphs:
- id: saito2015_archaeal_bioleaching_graph
  name: Acidianus brierleyi DSM 1651 thermoacidophilic Fe/S oxidation and oxidative dissolution of Kairei seafloor massive sulfide ore at 70 C
  description: Causal pathway linking strain-matched Acidianus brierleyi DSM 1651T (NCBITaxon:41673; reference proteome UP000248044) thermoacidophilic iron-oxidation respiratory complex subunits (terminal oxidase subunits DFR85_00215 UniProtKB:A0A2U9IB76 and DFR85_00220 UniProtKB:A0A2U9IIG0, and sulfocyanins DFR85_00225 UniProtKB:A0A2U9IB82 and DFR85_00235 UniProtKB:A0A2U9IB88) to aerobic Fe(II) and sulfur oxidation at 70 C (1.0 x 10^7 cells/mL inoculated into 150 mL metal-free basal medium at initial pH 1.5 with 1% w/v [1.5 g] 300-500 um Kairei hydrothermal field SMS ore KR02-15 ROE-1 [23.5 wt% Fe, 11.1 wt% Cu, 10.1 wt% Zn, 0.21 wt% Pb; chalcopyrite, pyrite, sphalerite] in 500-mL flasks at 100 rpm for 27 days, raising ORP to ~560-580 mV vs Ag/AgCl and lowering pH to ~1.15-1.20) and oxidative dissolution of ~100% Zn (~1000 mg/L), ~90% Cu (~1000 mg/L), and ~70% Fe (~1600 mg/L) in both Fe-pre-grown and S0-pre-grown A. brierleyi arms (versus <35% Zn, <15% Cu, and <10% Fe at ORP ~350-380 mV
    and pH ~1.6 in the sterile control, and <20% Cu with undissolved chalcopyrite in 25 C A. ferrooxidans DSM 14882 and 50 C S. thermotolerans DSM 17362 comparators) in Saito et al. (2015).
