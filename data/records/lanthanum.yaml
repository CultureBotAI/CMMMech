id: cmmmech:lanthanum
name: Lanthanum
material_kind: element
description: >-
  The element La, distinct from dissolved La(III), lanthanum chloride,
  lanthanum oxalate, lanthanum oxide and La-bearing minerals or wastes.
  The dated US designation concerns the named lanthanum mineral commodity;
  it does not transfer criticality to every La-bearing material. Laboratory
  evidence below concerns fungal production of a precipitation medium and
  separate chemical conversion of a precipitate, not extraction from an ore.
