id: cmmmech:hollandite
name: Hollandite
material_kind: mineral
description: Hollandite is the barium manganese oxide mineral with IMA-CNMNC formula Ba(Mn4+6Mn3+2)O16 in the September 2026 list, which records redefined status and a 2012 special procedure. The mineral species is distinct from the broader hollandite structure family, elemental manganese, manganese ore and manganese oxalates. No criticality designation is inherited from manganese or barium.
