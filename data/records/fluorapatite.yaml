id: cmmmech:fluorapatite
name: Fluorapatite
material_kind: mineral
description: Fluorapatite is the calcium phosphate fluoride mineral with IMA-CNMNC formula Ca5(PO4)3F. The September 2026 list records renamed status and a 2010 special procedure; this is not a new-mineral approval number. It is distinct from elemental phosphorus or fluorine, hydroxyapatite, chlorapatite and the heterogeneous phosphate-rock resource. No criticality designation is inherited from its constituents.
