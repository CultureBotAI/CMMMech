id: cmmmech:zincobriartite
name: Zincobriartite
material_kind: mineral
description: >-
  Zincobriartite is the natural copper-zinc-germanium sulfide mineral
  Cu2ZnGeS4, listed as approved IMA 2015-094 in the September 2026
  IMA-CNMNC list. The original announcement in CNMNC Newsletter 29,
  published in February 2016, places it among proposals approved in
  January 2016 and describes it as the zinc analogue of briartite from
  the Kipushi mine, Democratic Republic of the Congo. The proposal
  identifier's 2015 prefix is retained without treating it as the
  publication or approval month. The announcement reports the historical
  formula Cu2(Zn,Fe)(Ge,Ga)S4 and type material at the Natural History
  Museum, London, catalogue BM 1967,271. That broader formula is
  distinguished from the current listed endmember and is not a measured
  composition of every specimen. Newsletter 90, published in April
  2026, still lists zincobriartite among approved minerals lacking a
  published full description. The announcement therefore supports
  bounded identity and provenance, not unavailable analytical methods,
  specimen assays or independently reproducible structure refinement.
  Historical briartite grains are not automatically reassigned to this
  species. No extraction mechanism, recovery yield or inherited
  constituent-element criticality is asserted.
