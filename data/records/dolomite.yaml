mechanisms:
- id: anoxic_mn_phototrophic_dolomite
  name: Dolomite precipitation in Mn-amended anoxygenic photosynthetic biofilms
  process: biomineralization
  description: Mixed anoxic biofilms enriched from Fayetteville Green Lake sediments produced a carbonate phase assigned to dolomite with detectable ordering in the illuminated, 1 mM Mn(II)-amended treatment. Original supplementary XRD compares this treatment with a dolomite standard, illuminated cultures without added Mn and dark cultures with Mn. Supplementary microscopy shows cell-associated mineral encrustation and mineral grains on extracellular polymeric substances. The authors infer a role for active anoxygenic photosynthetic cell surfaces together with EPS and Mn; the molecular action of Mn and a unique organism's causal contribution remain unresolved.
  context: Laboratory serum-bottle enrichment, 27°C, 12 h light/12 h dark cycle and two-week comparison; sulfide-reduced modified FGL medium with approximately 2 mM Mg, 1 mM Ca, 44 mM bicarbonate and 50 µM Na2S in the principal comparison. The retained supplement specifies 80% N2/20% CO2 and pH 7 adjusted before inoculation; the accepted main text instead gives 80% N2/15% CO2, an unresolved source discrepancy. Initial enrichments used DCMU and ascorbate, but the studied later MFGL cultures lacked added DCMU, ascorbate and sulfate, with reported residual sulfate below 0.9 µM. Inocula were washed three times with anoxic water. The culture was a consortium with Chlorobium-affiliated sequences and other anaerobic bacteria, not a pure Chlorobium strain. At least triplicate experiments were reported. Dark, no-added-Mn and uninoculated Mn-amended controls were included. These conditions are synthetic laboratory media, not industrial recovery or direct proof of ancient-ocean conditions.
  microbial: true
  evidence:
  - source_ref: daye_supplement
    supports: support
    explanation: Section 1 defines the 1 mM Mn, illuminated two-week treatment and controls. Figures DR2-DR3 show its diffraction pattern with a dolomite standard and labeled 015/021 features; Table DR1 fits ordered dolomite phases in that arm. Figure DR4A-C shows mineral-encrusted Chlorobium-like cells in this same treatment, and Figure DR5 shows grains associated with EPS. The accepted claim is the source-assigned dolomite phase and culture association. EDS alone does not establish crystal ordering, and fitted phase percentages are not magnesium recovery yields, purified-product fractions or independent biological replicates.
  - source_ref: daye_accepted
    supports: partial
    explanation: Methods/Results report no detectable precipitates in uninoculated controls after two weeks, while Discussion explicitly says the product was not perfectly ordered. This supports a contribution of the inoculated biofilm under the reported conditions; it does not prove a specific gene, enzyme or organism is solely responsible. The 8-page accepted manuscript contains text and captions but no embedded main Figures 1-2; detailed main-figure measurements and an exact 0.1 mM dose response are not imported. The independently inspected original supplement provides the phase/condition evidence used here.
  - source_ref: daye_supplement
    supports: partial
    explanation: Control labels and some captions are inconsistent. Figure DR2 calls its dark trace Mn-amended whereas Table DR1 labels a dark row no Mn. DR7B identifies EPS-associated calcite in a dark/no-Mn arm, contrary to the accepted main text's broad no-minerals statement; DR8 only shows absence of cell-surface encrustation. DR4D/E are dark controls in the supplement but the main text refers to them as no-Mn light controls. DR3B is labeled 021 in the graphic and 012 in the caption; DR2's caption elsewhere lists 112. These discrepancies prevent a definitive phase-by-arm quantitative comparison and are not silently corrected. The illuminated 1 mM-Mn arm remains explicitly and consistently identified. Raw patterns, refinement uncertainty and complete sterile-control traces were not supplied in the inspected artifacts; ordering is retained as the authors' qualified assignment, not a new crystallographic reanalysis.
