mechanisms:
- id: natural_schoepite_transformation
  name: Abiotic formation during alteration of natural schoepite
  process: other
  microbial: false
  description: >-
    Natural schoepite crystals transformed to metaschoepite during
    laboratory storage and examination. Diffraction identified the
    mineral relationship; loss of interlayer water, hydrogen-bond
    rearrangement and strain effects were proposed explanations.
  context: >-
    Finch et al. examined Shinkolobwe museum specimens B3616 and
    91.62. Crystals from the surface of B3616 differed from crystals
    obtained from the interior of 91.62. Manipulation, coating and
    exposure history mattered. This was not a controlled humidity
    rate experiment or a microbial incubation.
  evidence:
  - source_ref: finch1998
    supports: support
    explanation: >-
      Pages 836-838 and Table 3 describe crystal sc-c(1) changing to
      sc-c(2) overnight at 20 degrees C during a ten-hour X-ray
      exposure. The a dimension decreased by approximately two percent,
      while b and c did not change detectably; diffraction supported
      metaschoepite. A shortened initial a dimension suggested some
      metaschoepite was already present before the visible transformation.
      This observation is not a conversion yield or a homogeneous
      reaction-rate measurement.
  - source_ref: finch1998
    supports: partial
    explanation: >-
      Uncoated 91.62 crystals did not visibly alter during the more-than-
      two-year study, but the authors report later alteration of those
      crystals. Coated B3616 crystals and uncoated manipulated crystals
      behaved differently. The one-sixth interlayer-water-loss account
      is a structural interpretation, not a direct water-loss measurement
      in this arm. The authors did not establish reversibility and
      could not solve a complete metaschoepite structure from their
      poor-quality crystals. Their apparently stable natural mixtures
      do not establish universal stability in air.
- id: synthetic_humidity_dehydration
  name: Abiotic humidity-associated dehydration of synthetic metaschoepite
  process: other
  microbial: false
  description: >-
    Synthetic metaschoepite developed an alpha-UO2(OH)2-type dehydration
    product during storage over silica desiccant or a moderately humid
    salt solution. Diffraction and spectroscopy support hydrate and
    dehydrated-phase mixtures. The exact local structure of the product
    remains model-dependent; it is not assigned here as a pure natural
    mineral species or an isolated uranium recovery product.
  context: >-
    Kirkegaard et al. prepared two batches through uranyl nitrate heating
    at 300 degrees C for 24 hours, hydration of the resulting amorphous
    UO3 with D2O at 80 degrees C, and ambient evaporation and rinsing.
    Powder samples in ceramic crucibles were stored in separate bell
    jars near 22 degrees C and stirred weekly. Tables 1-2 describe A
    from batch 1 over saturated NaCl in D2O at approximately 78 percent
    relative humidity for 41 days; B from batch 2 over K2CO3 in D2O
    at approximately 45 percent for 18 days; C from batch 1 over silica
    desiccant for 41 days, with its relative humidity unspecified.
    Salt-based humidities use calculations at 20 degrees C and are
    approximate for the experiment. D2O preparation does not establish
    retained complete deuteration after ambient handling.
  evidence:
  - source_ref: kirkegaard2019
    supports: support
    explanation: >-
      Figures 3-4 and Table 2 give neutron-diffraction Rietveld-fitted
      weight percentages of metaschoepite and the alpha-UO2(OH)2-type
      phase, respectively: A 95.5(2) and 4.5(3), B 70.7(1) and 29.3(1),
      C 10.8(5) and 89.2(6). Parenthetical uncertainties are retained as
      printed. These are fitted phase fractions, not gravimetric water
      losses, isolated-product yields or reaction rates. C remained a
      mixture despite the discussion's essentially-complete wording.
      No conversion of A to schoepite was observed under this particular
      humid-storage condition; universal irreversibility was not tested.
  - source_ref: kirkegaard2019_si
    supports: partial
    explanation: >-
      Page S2 and Figure S2 show a minor dehydration-product peak in
      the second batch before storage, attributed to synthesis material
      above the waterline. Initial scans also differed in duration,
      twelve versus one hour. B therefore cannot be treated as an
      initially pure replicate of A or C. Figure S8 shows that neutron
      patterns alone do not distinguish the competing local structural
      models. Figure S4 labels A as 75 percent relative humidity, while
      the main Tables 1-2 specify 78 percent; this discrepancy is retained.
  - source_ref: kirkegaard2019
    supports: partial
    explanation: >-
      Discussion page 19 calls B's duration sixteen days, conflicting
      with eighteen in Tables 1-2. The authors explicitly cannot confirm
      a faster desiccation rate because equilibration times differ.
      Separate batches, an initial minor dehydrated component and
      possible handling effects also limit comparisons. Their synthetic
      dry-storage result narrows earlier apparent air-stability claims
      without equating uncontrolled natural-specimen histories to these
      controlled laboratory arms. No threshold humidity, field rate or
      independently replicated recovery efficiency is inferred.
