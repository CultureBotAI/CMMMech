- assessment_id: sample
  area: evidence
  topic: Natural domains and composition
  outcome: supported
  summary: Six WDS analyses in Table 2 average 22.84 wt% Gd2O3, with substantial Sm
    and Nd. Measurements on microscopic natural domains from Zimna Voda do not establish
    bulk ore grade, a pure end-member or recovered yield.
  target_ids:
  - cmmmech:monazite-gd
  evidence_ids:
  - record
  - primary
- assessment_id: cell
  area: evidence
  topic: Measured versus estimated structure
  outcome: supported
  summary: SAED on a FIB lamella supports monoclinic P21/n. The electron-diffraction
    cell is less precise and differs from the weighted synthetic-endmember estimates
    emphasized in the abstract/Table 3. No single-crystal XRD was performed. The record
    correctly keeps these distinct.
  target_ids:
