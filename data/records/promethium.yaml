name: Promethium
material_kind: element
description: >-
  Promethium is the element Pm, represented here by its neutral-atom identity,
  distinct from individual isotopes, dissolved ions, mineral species and rare-earth
  commodity mixtures. Australia's Critical Minerals List, updated on 20 February
  2024, includes a rare-earth-elements group whose footnote 17 explicitly names
  promethium. The designation below is that source's group-member mapping, not a
  separate individually scored promethium entry or a claim about other
  jurisdictions. This record contains verified identity and dated criticality;
  no microbial mechanism or recovery performance is asserted.
