      supports: partial
      explanation: Supplementary Figures S1-S5 and Tables S1-S3 of Bolaños-Benítez et al. (2018) present Visual MINTEQ thermodynamic aqueous-speciation calculations (e.g., Cr(OH)2+, CrHPO4+, HCrO4-, CrO4^2-) rather than independent solid-phase extractions or measured isolated-metal recovery yields.
