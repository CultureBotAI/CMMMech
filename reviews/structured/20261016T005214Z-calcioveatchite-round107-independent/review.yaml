assessments:
- assessment_id: identity
  area: identity
  topic: Accepted species and exact type material
  outcome: supported
  summary: IMA 2020-011 and the original distinguish calcioveatchite from Sr-dominant
    veatchite; borehole 130 at 911 m, Nepskoe and source-reported Fersman holotype97013
    describe the studied type. The specimen number is not independently verified as
    an external controlled identifier.
  target_ids:
  - cmmmech:calcioveatchite
  evidence_ids:
  - record
  - ima
  - primary
- assessment_id: chemistry
  area: evidence
  topic: Ideal formula, microprobe and water measurements
  outcome: supported
  summary: Four holotype WDS spots at 20 kV/10 nA with5×5 µm area give CaO 7.05, SrO
    20.70 and B2O3 61.96 wt%; empirical Sr1.23Ca0.78B10.99O16(OH)5.H2O remains distinct
    from ideal chemistry. Water 10.22 wt% is structure-derived; three separate gross
    multicrystal Penfield values average 10.07 wt% and are not same-preparation microprobe
    confirmation.
  target_ids:
  - cmmmech:calcioveatchite
  evidence_ids:
  - record
  - primary
- assessment_id: structure
  area: evidence
  topic: Structural model and site-based species boundary
  outcome: supported
  summary: Single-crystal refinement at293(2) K supports P21, Z2, Sr-dominant eleven-coordinate
    and Ca-dominant ten-coordinate sites. H atoms were Fourier located with distance/thermal
    restraints, not freely measured without constraints. The Sr1.5Ca0.5 boundary and
    earlier Canadian chemistry discussion do not reclassify every historical veatchite
    specimen.
  target_ids:
  - cmmmech:calcioveatchite
  evidence_ids:
  - record
  - primary
