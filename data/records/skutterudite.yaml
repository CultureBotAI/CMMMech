mechanisms:
- id: acidophile-associated-leaching-of-skutterudite-bearing-concentrate
  name: Acidophile-associated leaching of mixed skutterudite-bearing concentrate
  process: bioleaching
  description: A living mixed acidophile culture was used to solubilize cobalt from a skutterudite-dominated natural concentrate in an acidic laboratory reactor. The reported dissolved fraction is relative to bulk concentrate cobalt, not mineral-specific dissolution or recovered cobalt product. A separate pyrite-conditioned flask produced secondary scorodite during processing. These observations support a microbial processing context; absent matched abiotic controls and phase-specific balances, they do not establish microbial necessity, enhancement over abiotic leaching or an exclusive direct-attack mechanism.
  context: Bou Azzer, Morocco concentrate was blended from several ore bodies, supplied in late 2017 and milled through a less-than-100-micrometre mesh. Section 2.5 experiment 4 used a 2-L reactor with 1-L working volume, 1% w/v concentrate, 0.5% w/v zero-valent sulfur, 5 mM ferrous sulfate and acidophile basal salts/trace elements. Initial pH 1.8 was allowed to fall to 1.5 and then controlled with 1 M NaOH; operation was at 35 degrees C, 180 rpm and approximately 1 L/min sterile air. Inoculum combined the original iron/sulfur-oxidizing consortium with leachate from a preceding 30-degree-C flask screen. Inoculum volume and cell density are unspecified, and the concentrate was not sterilized. The abstract says 13 initial species whereas section 2.6 lists 12 named members; this discrepancy is not silently resolved. The two organisms below were significant culturable endpoint members, not the complete initial community or individually demonstrated causal agents.
