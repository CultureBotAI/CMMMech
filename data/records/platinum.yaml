  evidence:
  - source_ref: maes_2017
    supports: support
    explanation: Methods, Figure 1, supplementary Figure S1, and the Platinum speciation analysis section support the authors' Pt(0) interpretation for aerobically cultivated CH34 exposed to Pt(II) under hydrogen. Figure 3 shows particulate deposits in the CH34 Pt(II) panel. The phase claim depends on X-ray absorption evidence, not the color change or microscopy alone, and is not a quantitative determination of complete conversion.
  - source_ref: maes_2017
    supports: partial
    explanation: Table 1's chemical hydrogen control also reaches 99% Pt(II) removal; thus the CH34 endpoint does not establish a microbial enhancement over that abiotic arm. The paper additionally reports 99% removal with heat-killed Shewanella cells, a different organism and not a matched CH34 viability control. No specific hydrogenase or other enzyme was demonstrated to cause Pt reduction in CH34.
  - source_ref: maes_2017
    supports: partial
    explanation: Figure 5 and the membrane-integrity results show CH34 intact-cell counts declining to the assay detection level by 27 h in the acidic Pt(II)/hydrogen experiment. Membrane staining is not proof of growth or metabolic activity. Table 1 also reports only 3% carboplatin removal and zero for the tetraamine preparation with CH34 and hydrogen; the Pt(II) chloro-complex result cannot be extended to all Pt complexes.
  - source_ref: maes_2017
    supports: partial
    explanation: 'Spectroscopy reporting has unresolved internal inconsistencies: Methods specifies the Pt L3 edge and a 11919 eV calibration value, while Figure 1 is plotted near 11560-11630 eV and Results calls the edge K-edge. This record retains the authors'' qualitative XANES/EXAFS interpretation without adopting those conflicting absolute energy assignments or claiming independent spectral refitting. The source also distinguishes solution removal from reduced Pt in biomass.'
