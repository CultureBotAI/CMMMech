id: cmmmech:hemimorphite
name: Hemimorphite
material_kind: mineral
description: >-
  Hemimorphite is the orthorhombic hydrated zinc silicate mineral
  Zn4Si2O7(OH)2·H2O. The September 2026 IMA-CNMNC list records approved
  status A and 1962 s.p.; this special-procedure entry is not a numbered
  new-mineral approval. The record distinguishes crystalline hemimorphite
  from willemite, mixed zinc ores and a poorly ordered hemimorphite-like
  microbial precursor. It contains a natural-sample chemical-leaching
  experiment and narrowly scoped precursor-associated field evidence.
  It does not assert microbial production of phase-pure crystalline
  hemimorphite, inherited criticality or industrial recovery.
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC, The New IMA List of Minerals, September 2026. Retained
      official original: definitions PDF page 1 and Hemimorphite row
      page 92, Zn4(Si2O7)(OH)2·H2O, A, 1962 s.p. This dated edition is
      not a claim that the live issuing-site index was accessible here.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-15'
  - id: handbook_hemimorphite
    title: >-
      Handbook of Mineralogy, Hemimorphite. Complete one-page version 1.2
      datasheet, copyright 2001; formula, orthorhombic crystal data and
      occurrence in oxidized zinc-bearing deposits.
    url: https://www.handbookofmineralogy.org/pdfs/hemimorphite.pdf
    accessed_on: '2026-10-15'
  - id: zhao2017
    title: >-
      Zhao D, Yang S, Chen Y, Tang C, He J and Li H (2017). Leaching Kinetics
      of Hemimorphite in Ammonium Chloride Solution. Metals 7, 237.
      DOI 10.3390/met7070237. Complete ten-page original including
      Figures 1-13 and Table 1 inspected.
    url: https://doi.org/10.3390/met7070237
    accessed_on: '2026-10-15'
  - id: medas2018
    title: >-
      Medas D et al. (2018). Structure of low-order hemimorphite produced
      in a Zn-rich environment by cyanobacterium Leptolingbya frigida.
      American Mineralogist 103, 711-719. DOI 10.2138/am-2018-6128.
      Complete nine-page original, Figures 1-6 and Tables 1-2 inspected.
      The associated deposit AM-18-56128 is separately cited below.
    url: https://doi.org/10.2138/am-2018-6128
    accessed_on: '2026-10-20'
  - id: medas2018_supplement
    title: >-
      Medas D et al. (2018), supplementary material to DOI
      10.2138/am-2018-6128. Official American Mineralogist May 2018
      deposit AM-18-56128, eight-page 6128_supp.pdf within the ZIP.
      Sections S1-S5, Figures S1-S3 and Table S1 inspected; the deposit
      belongs to the same publication and is not an independent experiment.
    url: https://msaweb.org/MSA/AmMin/TOC/2018/May2018_data/AM-18-56128.zip
    accessed_on: '2026-10-20'
  - id: ncbi_stenomitos_frigidus
    title: >-
      NCBI Taxonomy 1886765, Stenomitos frigidus, species, including
      Leptolyngbya frigida as a synonym and former TaxID 268127. Current
      XML inspected. This taxonomic mapping does not authenticate a
      source-specific Naracauli strain or the causality of its association.
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=1886765&mode=info
    accessed_on: '2026-10-15'
mechanisms:
  - id: abiotic_ammonium_chloride_leaching
    name: Chemical leaching of a natural hemimorphite-bearing specimen
    process: other
    microbial: false
    description: >-
      Concentrated aqueous ammonium chloride released Zn from a
      hemimorphite-bearing natural specimen, while residue diffraction
      retained hemimorphite and showed silica. Ammoniacal Zn complexation
      is the authors' chemical interpretation; no organism participates
      in this experiment and no isolated recovered Zn product is measured.
    context: >-
      Zhao et al. Sections 2.1-2.2 used a Yunnan, China specimen that was
      ground and wet-sieved. Figure 1 assigns hemimorphite by XRD. Table 1
      assigns 99.20% of the specimen's total Zn to hemimorphite; this is
      not a 99.20 wt% mineral-purity measurement. Total Zn is 42.24 wt%,
      with minor Zn assigned to sulfate, sulfide and ferrite phases.
      The Figure 5 comparison used 5 g solid per 1000 mL solution,
      45-61 micrometre particles, 95 degrees C and 350 rpm in a
      condenser-equipped 2 L flask. Five-millilitre slurry samples were
      filtered and aqueous Zn measured by atomic absorption. Replicate
      counts, error bars and a reagent-free blank series are not reported.
    evidence:
      - source_ref: zhao2017
        supports: support
        explanation: >-
          Section 3.3 and Figure 5 report 92.95% aqueous Zn extraction
          after 150 min at 5.0 mol/L NH4Cl, compared with 47.28% at
          3.5 mol/L under the stated conditions. Equation 1 divides
          dissolved Zn by total feed Zn; the outcome is neither
          phase-specific hemimorphite dissolution nor isolated-product
          recovery. Figure 3 assigns residual hemimorphite and SiO2.
      - source_ref: zhao2017
        supports: partial
        explanation: >-
          Equation 1 assumes constant solution volume despite serial
          sampling, so its reported percentages are retained with that
          limitation. Methods list five stirring speeds including
          200 rpm, whereas Section 3.2/Figure 4 display four; the
          accepted Figure 5 arm is consistently labelled 350 rpm.
          Section 3.6 and Figure 12 show silica associated with some
          residual surfaces but do not show a continuous product layer
          on the polished cross sections. Elovich fits and inferred
          rate-controlling steps are interpretations, not direct
          demonstrations of a unique molecular pathway.
  - id: field_associated_low_order_precursor
    name: Field association of a cyanobacterium with a hemimorphite-like precursor
    process: biomineralization
    microbial: true
    organisms:
      - id: NCBITaxon:1886765
        label: Stenomitos frigidus
    description: >-
      White-mud material from Rio Naracauli, Sardinia, contained
      nanoparticulate zinc silicate associated with cyanobacterial
      filaments assigned by the source to Leptolyngbya frigida.
      Spectroscopy and the supplemental diffraction comparison support
      a locally hemimorphite-like structure with low long-range order.
      This contextual precursor
      observation does not establish formation of crystalline
      hemimorphite or demonstrate the necessity of the assigned organism.
    context: >-
      Medas et al. Materials and methods, page 712, studied natural
      material collected between summer 1995 and summer 2010, alongside
      crystalline hemimorphite and hydrozincite reference minerals.
      These are field collections and structural comparisons, not a
      controlled pure-culture precipitation assay. The source provides
      no strain accession or matched sterile precipitation control.
      Its prior-study water chemistry, seasonal behavior and aging
      experiments are not adopted as newly verified experiments here.
      The supplement compares field sample WM9 with crystalline
      reference material and models local coordination in four WM
      samples; it does not supply a sterile biological comparator.
      The current taxon name maps the historical species
      label only, not an independently authenticated field isolate.
    evidence:
      - source_ref: medas2018
        supports: context_only
        explanation: >-
          Figure 1, page 713, shows particles associated with filaments
          and polymeric material; panels a-b are explicitly modified
          from Medas et al. 2012 and are not independent new microscopy.
          Figures 2-3, page 714, and Figures 5-6, page 715, compare the
          precursor with crystalline reference material using FTIR,
          silicon NMR and Zn X-ray absorption. These support local
          structural similarity and limited order, not unambiguous
          crystalline-species identity or a mineral yield.
      - source_ref: medas2018
        supports: partial
        explanation: >-
          Discussion, pages 716-717, leaves template and metabolic
          contributions unresolved. Organic-matrix binding and
          Zn-mediated silica condensation are proposed explanations;
          Table 1 fixes the first-shell coordination in its fitting
          model, and Table 2 provides comparison chemical shifts.
          Neither establishes the organism's causal necessity. The
          unacquired separate 2017 aging paper remains a gap for
          claims about time-dependent conversion, solubility or
          preservation; acquiring the 2018 supplement does not
          independently verify that earlier experiment.
      - source_ref: medas2018_supplement
        supports: context_only
        explanation: >-
          Figure S2, PDF page 4, compares WM9 with crystalline
          hemimorphite from San Giovanni Mine. WM9 has a diffuse
          pattern and caption-assigned quartz peaks; this is not
          phase-pure crystalline hemimorphite or a quantified phase
          fraction. Sections S2 and S4, pages 4-5, additionally assign
          carbonate signals to hydrozincite, interpreted by the
          authors as detrital fragments. A reference mineral is not
          a matched control for microbial necessity.
      - source_ref: medas2018_supplement
        supports: partial
        explanation: >-
          Section S1, pages 2-3, defines the EXAFS fitting procedure
          and normalized squared-residual misfit R2. Section S5 and
          Figure S3, pages 5-6, compare models with and without a Si
          coordination shell for WM9, WM13, WM20 and WM23, displaying
          R2 of 0.01 and 0.02 respectively. This source-reported model
          comparison supports local Zn-Si coordination, not long-range
          crystalline identity, phase abundance or biological causation.
          Raw spectra were not obtained or independently refitted.
      - source_ref: medas2018_supplement
        supports: partial
        explanation: >-
          Table S1, PDF page 7, reports loss on ignition for 14 WM
          samples, spanning 9.50-15.12 percent w/w. These are bulk
          mass-loss measurements, not direct organic-matter assays,
          mineral fractions or product yields. Main-paper page 717
          combines LOI with NMR sensitivity for a rough organic-matter
          interpretation; that estimate is not adopted as measured
          organic content or a recovery denominator.
