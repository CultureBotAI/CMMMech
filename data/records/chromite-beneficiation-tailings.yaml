id: cmmmech:chromite-beneficiation-tailings
name: Chromite beneficiation tailings
material_kind: secondary_resource
description: >-
  Mixed residual mineral solids from physical beneficiation of chromite-bearing
  ore. The curated case is fresh superficial tailings collected in May 2017 at
  a beneficiation plant in Sukinda valley, Odisha, India, with a separate
  stockpiled-tailings core used for chemical extraction comparisons. The
  source describes comminution, desliming and gravity concentration, rather
  than chromate manufacture. These solids are distinct from the chromite
  mineral species, unprocessed ore, lateritic overburden, the plant's chromite
  concentrate and chemically processed chromite ore residues. Reported XRD
  phases include chromite, goethite, hematite, gibbsite and chlorite; Cr also
  occurs in nonchromite phases. Table 1 reports 56.7 wt% Fe2O3 and 18.1 wt%
  Cr2O3 on an XRF oxide-equivalent basis, not quantitative mineral fractions.
  Neither chromium criticality nor industrial microbial processing is
  inferred from this feed's composition or industrial origin.
sources:
  - id: bolanos2018
    title: >-
      Bolaños-Benítez, van Hullebusch, Lens, Quantin, van de Vossenberg,
      Subramanian and Sivry (2018). (Bio)leaching Behavior of Chromite
      Tailings. Minerals 8(6):261, published 20 June 2018.
      DOI 10.3390/min8060261. Complete 23-page primary; Sections 2-4,
      Tables 1-2 and Figures 1-8.
    url: https://doi.org/10.3390/min8060261
    accessed_on: '2026-10-11'
  - id: bolanos2018_supplement
    title: >-
      Supplementary Materials to Bolaños-Benítez et al. (2018),
      (Bio)leaching Behavior of Chromite Tailings. Original seven-page
      publisher PDF, final page blank; Figures S1-S5 and Tables S1-S3.
      Tables S1-S3 are visual MINTEQ calculations, not measured product
      speciation or mineral recovery.
    url: https://mdpi-res.com/minerals/minerals-08-00261/article_deploy/minerals-08-00261-s001.pdf
    accessed_on: '2026-10-11'
  - id: dsm9463
    title: >-
      DSMZ culture catalogue. Acidithiobacillus thiooxidans DSM 9463,
      strain designation B-S2, isolated from an Australian bioleaching reactor.
      Catalogue identity does not authenticate the experimental stock.
    url: https://www.dsmz.de/collection/catalogue/details/culture/DSM-9463
    accessed_on: '2026-10-11'
  - id: ncbi_thiooxidans
    title: NCBI Taxonomy 930, Acidithiobacillus thiooxidans, species-level entry.
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?mode=Info&id=930
    accessed_on: '2026-10-11'
  - id: ncbi_wcs358
    title: >-
      NCBI Taxonomy 1495066, current species label Pseudomonas capeferrum,
      listing WCS358 as its type strain and Pseudomonas sp. WCS358 as included.
      NCBI marks the name effectively but not validly published. This resolves
      the source's WCS 358 label without asserting stock authentication.
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=1495066
    accessed_on: '2026-10-11'
mechanisms:
  - id: thiooxidans_acid_associated_leaching
    name: Sulfur-fed culture-associated acidification and element release
    process: bioleaching
    microbial: true
    organisms:
      - id: NCBITaxon:930
        label: Acidithiobacillus thiooxidans
    description: >-
      Living source-labelled A. thiooxidans DSM 9463 cultures maintained
      acidic conditions and were associated with release of Fe, Ni, Mn and Al
      from the mixed fresh tailings. Sulfur oxidation and resulting acid
      production are the proposed principal explanation. This is not evidence
      of selective chromite destruction, direct microbial iron oxidation or
      an isolated chromium recovery product. Initial Cr mobilization also
      occurred without inoculation and is associated with medium phosphate.
    context: >-
      Laboratory duplicate batches at 5, 10 and 30 g tailings/L, in
      cotton-plugged 500 mL reactors at 30 degrees C and 190 rpm, with 1%
      v/v pregrown culture. Material was autoclaved at 121 degrees C for
      20 min. The medium contained, per litre, 2 g (NH4)2SO4, 0.25 g
      MgSO4.7H2O, 0.1 g K2HPO4 and 0.1 g KCl, with elemental sulfur
      printed as 11% wt/v; that unusual reported dose is retained without
      correction. The medium was initially adjusted to pH 3.5; inoculated
      reactors subsequently shown in Figure 3 average about pH 1.6,
      whereas uninoculated medium controls have higher, loading-dependent pH.
      Controls contained sterile tailings and medium, and blanks sterile
      tailings and distilled water; both received sodium azide. Separate
      chemical comparisons used acidified water at initial pH 2 and 30 g/L.
      Each 20 mL sample withdrawal was replaced with fresh sterile medium.
      Filtered 0.45 micrometre leachates were acidified with 16 N HNO3 reagent
      and analyzed by ICP-AES/HR-ICP-MS; final acid concentration is not given.
      Fe speciation used ferrozine. Reported errors are standard deviations
      of duplicate experiments. Methods list sampling through day 30,
      whereas results and supplementary tables use day 34; exact scheduling
      remains inconsistent. Working liquid volume, tested particle-size
      distribution and cumulative withdrawal/replacement correction are
      not established. Reported mg element/kg tailings quantities are
      extraction-normalized results, not recovery yields or leachate mg/L.
    evidence:
      - source_ref: bolanos2018
        supports: support
        explanation: >-
          Sections 2.2-2.4 and 3.2-3.3, Figures 3-8, support acidic
          culture-associated element release and its loading dependence.
          For 5 g/L, the Results report Fe increasing from 421 to
          1234 mg/kg tailings over the plotted experiment. The uninoculated
          medium controls release less Fe, Ni, Mn and Al but do not match
          the inoculated pH trajectory. This supports association with the
          sulfur-fed culture, not an effect independent of acidity.
      - source_ref: bolanos2018_supplement
        supports: partial
        explanation: >-
          Figure S3 and main Section 4.2 preserve counterevidence at 30 g/L:
          the authors compare 479 mg Fe/kg after approximately 11 days
          with acidified water against 213 mg/kg with the inoculated culture.
          Thus microbial enhancement is not universal. The separate acid
          arm has different medium chemistry and no documented matching
          pH trajectory; inhibition by released metals is a hypothesis.
          Figure S2 shows Fe(II)/Fe(III) evolution without bacteria. Its
          Fe axis is mg/L, whereas Figure S3 is mg/kg tailings, and their
          quantities are not reconciled here. The main paper's attribution
          of Fe(II) oxidation to A. thiooxidans is not independently
          demonstrated; its cited comparison concerns A. ferrooxidans.
      - source_ref: bolanos2018
        supports: partial
        explanation: >-
          Figure 5 shows early Cr release in both medium controls and
          inoculated reactors, followed by declining aqueous Cr. The
          separate one-hour chemical extraction in Section 2.3 and Table 2
          used 1 g solids with 25 mL water or 0.1 M KH2PO4 and a
          0.22 micrometre filtrate. Fresh-tailings phosphate extraction
          reports 223 mg Cr(VI)/kg and 240 mg total Cr/kg, compared with
          63 mg Cr(VI)/kg using water. These are operational exchangeable
          pools, not microbial yields. Table 2 labels bulk total Cr as
          96 g/kg while the adjacent prose says 96 mg/kg; Table 1's
          oxide-equivalent assay is not converted to resolve this conflict.
          Old-tailings depth comparisons are separate chemical extractions,
          not evidence of microbial remediation in a stockpile.
      - source_ref: bolanos2018_supplement
        supports: partial
        explanation: >-
          Figures S3 and S5 show lower Cr release from the separate
          concentrate than from fresh tailings, consistent with contributions
          from other phases. The main text's approximately threefold
          comparison is not imposed as a matched-time ratio because the
          plotted tailings and concentrate trajectories differ. Neither
          the concentrate nor the tailings is pure chromite. Tables S1-S3
          model dissolved complexes and possible precipitation; they do not
          measure solid products or prove Cr(VI) reduction. Reduction by
          ferrous iron, sulfur intermediates and biomass, adsorption and
          precipitation remain alternative contributions to solution loss.
  - id: wcs358_culture_associated_redistribution
    name: Alkalinizing WCS358 culture-associated element redistribution
    process: bioleaching
    microbial: true
    organisms:
      - id: NCBITaxon:1495066
        label: Pseudomonas capeferrum
    description: >-
      The culture called Pseudomonas putida WCS 358 in the paper was
      associated with increasing pH, a CAS-reactive siderophore signal,
      transient iron mobilization and declining filtered chromium after
      initial release. The identifier follows NCBI's current P. capeferrum
      species entry, which includes WCS358 and explicitly marks the name
      effectively but not validly published. It is not genetic authentication
      of the experimental culture. Siderophore-specific mineral attack and
      direct enzymatic chromium reduction were not established.
    context: >-
      The same fresh-tailings batch design used 5, 10 and 30 g/L, 1% v/v
      pregrown culture, 30 degrees C, 190 rpm, duplicate reactors and
      20 mL sampling with replacement. WCS 358 was supplied by Peter
      Bakker, University of Utrecht. Iron-free succinate medium contained,
      per litre, 6 g K2HPO4, 3 g KH2PO4, 0.2 g MgSO4.7H2O, 1 g
      (NH4)2SO4 and 4 g succinic acid, initially pH 7. Figure 3 shows
      inoculated pH rising to approximately 9 while uninoculated medium
      controls remain near 7. Sodium-azide medium controls and water
      blanks, and a separate initial-pH-9 water comparison at 30 g/L,
      were used. Culture-associated protein and CAS response were assayed
      in supernatant; these are proxies rather than direct viable-cell counts
      or identified siderophore concentrations. The sampling-time and
      mass-accounting limits of the acidophile arm also apply. This is
      laboratory mobilization/redistribution, not isolated metal recovery
      or demonstrated field remediation.
    evidence:
      - source_ref: bolanos2018
        supports: support
        explanation: >-
          Sections 2.2.1, 2.4.3-2.4.4, 3.2-3.3 and 4.2 and Figures 3-8
          support the stated pH and element trajectories. Culture-associated
          Cr depletion is greater than in the phosphate-rich medium
          controls, but both start with substantial Cr release. Total
          filtered elemental concentrations alone do not separate microbial
          reduction from adsorption, precipitation or sampling losses.
          The paper itself describes the P. putida influence on Cr
          leaching as negligible when discussing the alkaline-water comparison.
      - source_ref: bolanos2018_supplement
        supports: partial
        explanation: >-
          Figure S4 shows transient, loading-dependent CAS and protein
          signals, not monotonic growth or molecular identification.
          Figures S1 and S3 document evolving dissolved oxygen and a
          separate alkaline-water arm; they do not provide matched
          cell-free culture-metabolite or siderophore-deficient controls.
          Tables S1-S3 are equilibrium simulations without adsorption
          parameters, not a measured Cr(III)/Cr(VI) time course or identified
          precipitate. Proposed biosorption, sulfur-mediated reduction,
          ferrous-iron reduction and enzymatic processes are not resolved
          quantitatively. No recovered-metal mass balance was demonstrated.
