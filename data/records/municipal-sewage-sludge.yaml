    description: Addition of nominal 10 g/L elemental sulfur (80% pure) at day 42 drives microbial sulfur oxidation and culture acidification in 250 mL bottles at 30 C and 150 rpm (down to pH 0.9 in the A. thiooxidans T+S arm by day 63), dissolving sludge-bound phosphorus from Lehtoniemi WWTP municipal sewage sludge.
