    the two grounded Acidithiobacillus thiooxidans ATCC 19377 tth paralogs (GCD22_14205 UniProtKB:A0A5P9XPU3
    and GCD22_02315 UniProtKB:A0A5P9XS05), whereas sibling node sqr_reductase (lines 204-207) explicitly
    lists both A. ferrooxidans and A. thiooxidans paralog loci.
