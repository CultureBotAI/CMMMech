id: cmmmech:synthetic-graphite
name: Synthetic graphite
material_kind: commodity
description: >-
  Manufactured crystalline graphite commodity produced industrially by high-
  temperature graphitization (~3,000 degrees C) of carbonaceous precursors such
  as calcined petroleum coke and coal-tar pitch. USGS 2021 Minerals Yearbook
  (Graphite chapter, printed pp. 32.1-32.16) and USGS Mineral Commodity
  Summaries 2026 (Graphite (Natural) chapter, printed pp. 92-93) distinguish
  synthetic graphite from natural flake, amorphous, and vein/lump graphite
  (cmmmech:natural-graphite and mineral species cmmmech:graphite) and track
  synthetic graphite across electric-arc-furnace electrodes, unmachined shapes,
  motor brushes, steelmaking carbon raisers, and lithium-ion battery active
  anode material (HTS 3801.10, 3801.20, 3801.90, 6903.10, and 8545.11). In the
  2023 US Department of Energy Final Critical Materials List (88 FR 51792-51798),
  DOE evaluated 'Graphite (natural and synthetic)' and 'Graphite--synthetic' in
  Table 1 (p. 51796, where synthetic graphite alone was scored 'Not Critical' in
  both short and medium terms) while explicitly noting in Footnote 6 (p. 51796)
  that the 2022 DOI/USGS Final List of Critical Minerals defined 'graphite' to
  include both natural and synthetic graphite. This record captures the
  manufactured synthetic-graphite commodity and its explicit authority scope
  boundaries without asserting a standalone mineral species identity or
  microbial mechanism.
criticality:
  - jurisdiction: United States
    list_name: Department of the Interior / USGS Final List of Critical Minerals (as scoped in 2023 DOE Final Notice Footnote 6)
    edition: 2022/2023 scope for Graphite (natural and synthetic), 88 FR 51796
    classification: critical
    source_ref: doe_2023_fr
sources:
