limitations:
- No matched abiotic/sterile/mechanical controls isolate microbial advantage; the
  association and reported iron-regeneration workflow are narrower than a proven contact
  pathway.
- Unknown strain provenance, culture density, temperature, detailed medium, reactor
  volume, agitation rate and replicated analytical uncertainty limit reproducibility.
- Percent-Co curve and relative elemental tables are not initial-inventory extraction
  yields or complete mass balances; carbon absent and normalization incompletely described.
- No original WC diffraction trace or quantitative phase purity; particle distribution
  comes from inaccessible2012reference. Reported Co-rich powder lacks independently
  displayed phase characterization.
- Downstream chemical purification/reduction has conflicting pH/composition descriptions
  and no isolated product masses; Equation7 is unbalanced and not adopted.
- Publisher-declared DOI remains unresolved despite accessible official fullpaper;
  no separate SI linked on inspected primary/landing.2012 references and2015 corrosion
  fulltext are deferred.
- Bounded notice/dedup searches include hidden/ignored/followed relevant paths but
  do not cover unrelated machine directories or all unextracted binary content.
