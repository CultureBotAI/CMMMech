limitations:
- Starting powder identities, purities and mass, quantitative phase yield and independent
  synthesis replication are unspecified.
- The synthetic La-Ca analogue cannot establish ore recovery, natural-specimen behavior
  or an industrial process.
- Prose/CIF Na uncertainty differs from Table1; abstract/methods thermal limit 746
  K differs from Table5/S4 maximum 628 K, and fitted coefficients differ. None is
  silently harmonized.
- Bounded notice and identity searches do not establish exhaustive literature coverage.
  Shared source acquisition is not independent experimental replication.
- No criticality claim is made; omission does not mean the material is absent from
  every criticality list.
- Native whole-corpus review validation and exact-head publication checks are separate
  later gates.
