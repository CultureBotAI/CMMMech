mechanisms:
- id: abiotic_metamict_thermal_recrystallization
  name: Laboratory thermal annealing and trigonal P-31m recrystallization of metamict liandratite
  process: other
  description: Annealing X-ray-amorphous (metamict) natural liandratite from the Antsakoa
    I pegmatite at red heat (~650 degrees C) and for 24 hours at 1000 degrees C restored a
    sharp single-phase trigonal/hexagonal P-31m diffraction pattern (a = 6.36, c = 4.01 A,
    Z = 1, isostructural with synthetic hexagonal U6+Ta2O8) and increased measured density
    from ~6.8 to 7.0 g/cm3 without decomposition into cubic uranpyrochlore or extraneous oxide
    phases; in addition, prolonged oxidizing heating of coexisting metamict petscheckite at
    1000 degrees C oxidized and converted its U4+ component into the same trigonal liandratite
    phase alongside minor FeNbO4.
  context: Laboratory heating and X-ray diffraction experiments reported by Mucke and Strunz
    (1978), Tables 3-5 and pp. 944-946, establishing the structural identity of liandratite
    and its oxidative genetic link to petscheckite.
  microbial: false
  evidence:
  - source_ref: mucke_1978_liandratite
    supports: support
    explanation: Pages 944-945 and Tables 3 and 5 demonstrate that metamict liandratite (Dmeas
      ~ 6.8 g/cm3) recrystallizes at red heat (~650 degrees C) and 1000 degrees C (24 h) into
      a single trigonal P-31m phase (a = 6.36, c = 4.01 A, Z = 1, Dmeas = 7.0 g/cm3) with
      a powder pattern identical to synthetic hexagonal UTa2O8.
  - source_ref: mucke_1978_liandratite
    supports: partial
    explanation: Because natural unheated liandratite is completely metamict, all unit-cell
      parameters and single-crystal Weissenberg/Debye-Scherrer data in Tables 3 and 5 represent
      thermally annealed material rather than unheated natural crystals.
