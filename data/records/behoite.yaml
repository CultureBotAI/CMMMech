mechanisms:
  - id: abiotic_dta_dehydroxylation
    name: Abiotic two-step DTA thermal decomposition of behoite
    process: other
    description: >-
      Two-step thermal decomposition of natural orthorhombic beta-Be(OH)2
      (behoite) recorded by unplotted DuPont 900 differential thermal analysis
      (DTA, 20 °C/min in air), described in the p. 7 thermal-data section as a
      two-step endothermic reaction with inflections beginning near 265 °C and
      290 °C and peaking at 310 °C (whereas the p. 1 abstract refers to the
      310 °C DTA feature as an exothermic peak; reaction products were not
      separately characterized in the DTA paragraph).
    context: >-
      Abiotic laboratory differential thermal analysis (DTA) on Rode Ranch
      behoite using a DuPont 900 thermal analyzer in air at 20 °C/min; no
      microbial, enzymatic, or bioleaching mechanism was tested or reported in
      Ehlmann and Mitchell (1970).
    microbial: false
    evidence:
      - source_ref: ehlmann_1970_behoite
        supports: support
        explanation: >-
          In the unplotted differential thermal analysis (DTA) discussion on p.
          7, Rode Ranch behoite heated on a DuPont 900 thermal analyzer in air
          at 20 °C/min is described as undergoing a two-step endothermic
          reaction beginning at approximately 265 °C and 290 °C and peaking at
          310 °C, whereas the p. 1 abstract refers to an exothermic peak at
          310 °C (pp. 1, 7).
