        description: Reaction of dissolved sulfide with soluble Cd(II) forms cubic hawleyite-assigned CdS initially in thiosulfate/sulfite time courses and as the sole reported phase in cysteine-fed X513 (as well as abiotic Na2S reference reactions).
        evidence:
          - source_ref: moon2013
