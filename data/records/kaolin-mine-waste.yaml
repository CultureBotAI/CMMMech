  title: 'UniProtKB reference proteome UP000194143 (Bacillus thuringiensis, NCBITaxon:1428): Citrate synthase (CAB88_23625, UniProtKB:A0A0K0QI82), L-lactate dehydrogenase (ldh / CAB88_25135, UniProtKB:A0A0K0QJ28), and Beta-ketoacyl-[acyl-carrier-protein] synthase III (fabH / CAB88_05480, UniProtKB:A0A0G3E229).'
