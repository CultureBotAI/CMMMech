  summary: 'Living acidophilic cultures were associated with increased dissolved-metal release from separate
    acid-leached nickel-line and cobalt-line residues. Single cultures and mixtures were compared. Iron
    and sulfur metabolism is a proposed explanation; the experiment does not isolate a unique cellular
    pathway or establish the contribution of each mixture member. The claim is laboratory solution release
    rather than isolated-product recovery or industrial deployment. Substrate-edge evidence (lu2025, supports:
    partial): Lu et al. (2025) Sections 3.1.1–3.1.4 and Figures 1–4 report higher Ni and Co leaching ratios
    in inoculated single and consortium arms than in the 30 degrees C uninoculated blank, though matched
    40/45 degrees C abiotic controls and pH/iron-matched controls were not reported. Product-edge evidence
    (lu2025, supports: support): ICP-MS filtrate time series in Lu et al. (2025) Figures 1–4 confirm higher
    dissolved Ni and Co release from the respective battery residues in inoculated 9K systems than in
    the 30 degrees C blank.'
