      3.34, CaO 0.17, Na2O 0.12, H2O 1.3 calc., sum 100.63 wt%, negligible REE),
      orthorhombic unit cell (Ccmm, Cc2m, or Ccm21; a = 10.477(5) Å, b =
      9.599(1) Å, c = 22.59(2) Å, Z = 2), Dmeas = 3.959(2) g/cm3, Dcalc = 3.962
      g/cm3, Mohs hardness 5.5, and biaxial (+) optical constants (alpha =
      1.735(2), beta = 1.737(2), gamma = 1.80(1), 2V = 10–15°).
