limitations:
- Isolate-specific XRD and HeapSeep/secondary enrichment patterns are not displayed;
  reported assignment remains explicitly partial.
- XRD identifies processed mixed precipitates, not an isolated pure product or complete
  antimony mass balance.
- Heat-sterilized/unamended controls are reported with data not shown; a separate
  cell-free white precipitate is not mineralogically assigned.
- Nominal Methods dosing differs from Figure7 initial antimony-tartrate concentration;
  no uniform dose or calculated Sb recovery is imposed.
- Strain-sp. NCBI labels are retained; historical species proposals and candidate
  AioA context do not demonstrate a specific precipitation pathway.
- Bounded notice search is not exhaustive; other deferred studies were not imported.
  No separate supplement was listed in inspected main text.
