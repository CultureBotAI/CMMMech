id: cmmmech:stibnite
name: Stibnite
material_kind: mineral
description: Stibnite is the Sb2S3 mineral species, grandfathered in the September
  2026 IMA list with original-description year 1832. It is distinct from elemental
  antimony, dissolved antimony species, mixed antimony ores and mine wastes. The
  experiment below used commercial stibnite containing quartz, separately from
  the study's natural ore samples. No criticality designation is inherited from
  antimony.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 206,
    Stibnite row; page 148, Mopungite row; page 1 column definitions and page 2
    distribution terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: loni2020
  title: Loni et al. (2020). Mechanism of microbial dissolution and oxidation of
    antimony in stibnite under ambient conditions. Journal of Hazardous Materials
    385, 121561. Complete university-hosted article-in-press version inspected;
    sections 2.2-2.4 and 3.2-3.4, Table 1, Figures 1 and 4-7.
  url: https://doi.org/10.1016/j.jhazmat.2019.121561
  accessed_on: '2026-10-11'
- id: loni2020_supplement
  title: Loni et al. Supplementary materials for DOI 10.1016/j.jhazmat.2019.121561.
    Original publisher-hosted DOCX; Table S3 and Figures S4-S5 distinguish loadings,
    growth observations and abiotic mineral phases.
  url: https://ars.els-cdn.com/content/image/1-s2.0-S0304389419315158-mmc1.docx
  accessed_on: '2026-10-11'
- id: ncbi_versutus
  title: NCBI Taxonomy 34007. Paracoccus versutus, species-level entry;
