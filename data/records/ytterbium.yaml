mechanisms:
- id: penidiella_yb_depletion
  name: Ytterbium depletion from solution during Penidiella sp. T9 cultivation
  process: other
  microbial: true
  organisms:
  - id: NCBITaxon:1391704
    label: Penidiella sp. T9
  description: >-
    Cultivation of the acidophilic fungal isolate T9 was associated with reduced
    dissolved ytterbium in a synthetic single-element chloride treatment. A
    no-T9 comparison supports a culture-associated effect, but the Yb assay
    does not establish whether sorption, uptake or precipitation caused it.
  context: >-
    T9 was isolated from an abandoned-mine sample in Japan and identified by
    morphology and ribosomal sequence comparison as Penidiella sp. T9.
    The NCBI node names this isolate; it does not establish a formally named
    species or a complete genome. The specificity test supplied separate REE
    chloride salts at nominal 100 mg/L elemental concentration. Yb was a
    single-element treatment, separate from the Dy/Nd mixture experiment.
    The methods refer to the cultivation assay in basal salt medium at pH 2.5,
    with 20 mM potassium hydrogen phthalate-HCl buffer, at 30 degrees C and
    120 rpm. Medium contained 2 g/L glucose, 0.1 g/L yeast extract and 0.05 g/L
    each of KH2PO4 and K2HPO4, among other salts. Removal was calculated from
    initial and day-3 dissolved concentrations. The analytical subsection is
    explicitly titled Measurement of Dy by ICP-AES and describes centrifugation,
    0.2-micrometre supernatant filtration and technical triplicate readings;
    separate Yb calibration, raw replicates and uncertainty are not given.
    The REE-specific results describe almost no accumulation without T9, but
    do not publish numerical Yb control concentrations. No Yb biomass loading,
    intracellular localization, speciation, desorption or isolated-product
    mass balance is reported. Laboratory synthetic solutions are not mine
    drainage treatment or industrial deployment.
  evidence:
  - source_ref: horiike2015
    supports: support
    explanation: >-
      The Specificity of metal bioaccumulation methods and REE-specific
      bioaccumulation results report 45% Yb removal after three days and almost
      no accumulation in the absence of T9. The denominator is the initial
      dissolved Yb concentration. This supports partial aqueous depletion
      associated with cultivation, not complete removal or purified recovery.
  - source_ref: horiike2015
    supports: partial
    explanation: >-
      The detailed biomass-content assay, three-experiment time course in
      Figure 4 and SEM-EDX localization in Figure 5 concern Dy, not Yb. They
      cannot establish a Yb uptake pathway, Yb phosphate formation, a Yb
      capacity per dry mass or Yb biological replicate precision. The paper's
      proposed phosphate mechanism remains untested for the Yb-specific arm;
      process other retains that uncertainty. More than half the starting
      dissolved Yb remained at the reported endpoint.
