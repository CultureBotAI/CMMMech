limitations:
- Elemental association is not lattice incorporation or oxidation-state determination.
- No phase-specific mass balance, extraction selectivity, quantitative phase fraction
  or isolated-metal yield.
- Fragment Al/Mg prose conflicts with Figure2B; powder diffraction does not supply
  a separate fragment diffraction trace.
- Hot recovery, acetone preparation and drying limit in-culture phase hydration inference.
- No matched pH/metabolite/killed-biomass controls isolate an exclusive cause.
- Named strain catalogue mapping does not authenticate the culture.
- Older Borkar2026 science retained by exact preservation and its earlier independent
  review, not freshly re-read.
- Bounded notice and duplicate searches do not prove global absence.
