id: cmmmech:bario-orthojoaquinite
name: Bario-orthojoaquinite
material_kind: mineral
description: >-
  Bario-orthojoaquinite (IMA 1979-081) is an IMA-accepted barium-titanium-iron
  cyclosilicate mineral of the joaquinite group with IMA September 2026 Master
  List formula Ba4Fe2+2Ti2O2(SiO3)8·H2O and structural formula
  Fe2+4Ba4Ti4(Ba,Sr)4O4[Si4O12]4·2H2O. Described by Wise (1982) from the
  Benitoite Gem Mine, San Benito County, California, USA, where it occurs as
  yellowish-brown dipyramidal to truncated pyramidal crystals up to 8 mm across
  on fractures in serpentinized peridotite and metamorphosed basaltic rocks
  alongside benitoite, baotite, fresnoite, and natrolite. Table 1 column 5 (p.
  811) reports SiO2 35.15, TiO2 11.33, Al2O3 0.57, FeO 9.47, MnO 0.62, BaO
  38.56, SrO 3.34, CaO 0.17, Na2O 0.12, H2O 1.3, total 100.63 wt%, with
  rare-earth oxides below detection. Orthorhombic (space group Ccmm, Cc2m, or
  Ccm21), with a = 10.477(5) Å, b = 9.599(1) Å, c = 22.59(2) Å, Z = 2, Dmeas =
  3.959(2) g/cm3, Dcalc = 3.962 g/cm3, Mohs hardness 5.5, good {001} cleavage,
  and biaxial (+) optics with alpha = 1.735(2), beta = 1.737(2), gamma =
  1.80(1), and 2V = 10–15°.
