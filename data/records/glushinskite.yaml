mechanisms:
- id: fungal_glushinskite_formation
  name: Glushinskite formation during fungal phosphate-mineral transformation
  process: biomineralization
  description: Glushinskite was identified among crystals collected after growth of Aspergillus
    niger ATCC 1015 on agar containing natural struvite or a synthetic feed identified as dittmarite.
    The organism grew during this laboratory assay; this is microbial mineral formation rather than
    an elemental-magnesium recovery process.
  context: Malt extract agar contained 1% w/v natural struvite from a Veolia wastewater-treatment
    site in Exeter, UK, or synthetic magnesium ammonium phosphate identified by XRD as dittmarite
    despite the paper's synthetic-struvite terminology. A 5-mm plug from an actively growing colony
    inoculated each plate over cellophane. Crystals were collected after seven days at 25 degrees
    C in darkness, extracted from agar with water at 80 degrees C, washed at least three times and
    dried in a vacuum desiccator before SEM, EDXA and XRD. The selected solid-medium experiment
    is separate from the paper's liquid-culture assays.
  microbial: true
  organisms:
  - id: NCBITaxon:380704
    label: Aspergillus niger ATCC 1015
  evidence:
  - source_ref: suyamud_2020
    supports: support
    explanation: Figures 3-5 compare the feed materials with post-growth crystals. XRD traces A
      and B in Figure 5 are assigned to magnesium oxalate dihydrate against the glushinskite reference
      pattern, while C and D are struvite and dittmarite feed controls. Figure 4 detects Mg, C and
      O in the analyzed product crystals; Figure 3 shows their morphology. Figure 5 presents representative
      patterns from at least three determinations. Table 2 documents acidification in both mineral-fed
      and mineral-free fungal cultures.
  - source_ref: suyamud_2020
    supports: partial
    explanation: Feed diffraction controls and mineral-free fungal growth do not provide a chemistry-matched
      abiotic comparison that isolates oxalate production from acidification or proves microbial
      necessity under all conditions. The Results also describe amorphous debris. The phase assignment
      is the authors' published identification, not a quantified pure-phase fraction or an isolated
      recovery yield. Neither magnesium-metal production nor industrial deployment is demonstrated.
