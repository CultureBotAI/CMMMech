mechanisms:
- id: brierleyi_associated_scorodite_crystallization
  name: Scorodite precipitation in Acidianus brierleyi cultures
  process: biomineralization
  description: Living cultures reported as Acidianus brierleyi DSM 1651T produced scorodite-bearing precipitates from synthetic Fe(II)- and As(III)-containing acidic solutions. Culture-associated oxidation and precipitation provide a route for transferring arsenic into solids; the experiments do not establish an exclusive enzymatic pathway or prove that cells are necessary for every precipitation step. Scorodite made without added seeds was identified by original X-ray diffraction. Additional seeded cultures showed condition-dependent solution arsenic removal, with amorphous material or jarosite under other conditions.
  context: Sections 2.1-2.2 describe unseeded production of bioscorodite seed material in 200 mL heterotrophic basal salts medium in 500 mL flasks, initially pH 1.5 with sulfuric acid, containing 18 mM Fe(II) as FeSO4.7H2O, 13 mM As(III) as NaAsO2 and 0.02% w/v yeast extract. Cultures were incubated for 14 days at 70 degrees C and 100 rpm. Subsequent crystallization experiments used the same flask volume, temperature and agitation, initial pH 1.5 or 1.2, 3.3-20 mM As(III), 4.5-28 mM Fe(II), an initial cell density of 1.0 x 10^7 cells/mL and 0.15% w/v bioscorodite or chemical scorodite seeds where indicated. Initial pH was specified, not maintained as a constant. Experiments were conducted in duplicate. Dissolved Fe(II), As(III), total soluble Fe and As, cell counts, pH and redox potential were monitored. Solid analyses included XRD, FTIR, thermogravimetry and electron microscopy. These are laboratory synthetic-solution experiments.
