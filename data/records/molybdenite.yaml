id: cmmmech:molybdenite
name: Molybdenite
material_kind: mineral
description: Molybdenite is the MoS2 mineral species, grandfathered in the September 2026 IMA list with original-description year 1796. It is distinct from elemental molybdenum, dissolved molybdate, manufactured MoS2 and mixed ores or concentrates. The experiment below concerns molybdenite within a heterogeneous commercial ore-grade specimen, not a purified mineral. No criticality designation is inherited from molybdenum.
