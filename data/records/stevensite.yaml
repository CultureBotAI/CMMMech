id: cmmmech:stevensite
name: Stevensite
material_kind: mineral
description: Stevensite is a Mg-rich smectite name listed with questionable status Q, original-description
  year 1873, in the September 2026 IMA list; it is not an approved or grandfathered entry. The listed formula
  is (Ca,Na)xMg3-ySi4O10(OH)2. The experimental material below is a synthetic, poorly crystalline Mg-rich trioctahedral
  smectite assigned by the authors as likely stevensite, not independently established phase-pure mineral.
  This owner is distinct from saponite, hectorite, amorphous Mg-silicate, and its carbonate transformation
  products. No constituent criticality designation is inherited.
