id: cmmmech:chlorite
name: Chlorite group
material_kind: mineral_group
description: Chlorite denotes a hydrous phyllosilicate group with a hydroxide interlayer, not a single
  species or the dissolved chlorite anion. The nomenclature authority distinguishes constituent species
  by composition and structure. The microbial study used a natural Michigamme, Michigan chlorite preparation
  with residual magnetite and another unresolved iron-bearing impurity. Its author-assigned ferroan clinochlore
  identity is retained as specimen context, without converting this group owner into a phase-pure clinochlore
  or chamosite record. No constituent criticality designation is inherited.
