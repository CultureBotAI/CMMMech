assessments:
- assessment_id: identity
  area: identity
  topic: Natural hemihydrate identity versus mixed laboratory products
  outcome: supported
  summary: Bassanite is correctly distinguished from gypsum, anhydrite, calcium and
    commercial plaster.
  target_ids:
  - cmmmech:bassanite
  evidence_ids:
  - owner
  - ima
  - handbook
  - allen
  details: Natural chemistry/optics and acknowledged X-ray verification support identity;
    impurity-corrected calculated fractions are not direct modern purity estimates.
    Historical1910 is not an accession. No criticality designation asserted.
- assessment_id: eps
  area: scope
  topic: Extracted bacterial polymers, conditions and controls
  outcome: supported
  summary: The microbial flag is explicitly limited to bacterial origin of EPS, without
    requiring growing cells in precipitation.
  target_ids:
  - cmmmech:bassanite
  evidence_ids:
  - owner
  - aldisi
  details: 50mg dryEPS/50mL synthetic3.16-times evaporated seawater, open100mL bottle,35C5–6d,
    triplicate; harvested solids washed and40C dried. No-EPS gypsum versus DF112/DF2141
    mixed bassanite/anhydrite and mostly-gypsum other-EPS arms. Z27/S27/S7D1 label
    conflict remains unresolved. Neither workup timing nor water-activity/Ca-binding
    causal mechanism is proved.
- assessment_id: hydration
  area: evidence
  topic: Incomplete conversion and semiquantitative phase denominator
  outcome: supported
  summary: Partial gypsum appearance after hydration constrains complete-conversion
    and pure-product claims.
  target_ids:
  - cmmmech:bassanite
  evidence_ids:
  - owner
  - aldisi
  details: 0.2g mixed precipitate/5mL water,30C7d retains bassanite/anhydrite. EPS
    removal is not quantified. Higher-dose calcite is a different mixture. Table1
    semiquantitative processed-phase proportions are not isolated bassanite mass yield.
- assessment_id: cultures
  area: scope
  topic: Culture association, strain identity and unequal assay systems
  outcome: supported
  summary: The record preserves medium-level mixed sulfate observations without transferring
