id: cmmmech:coquimbite
name: Coquimbite
material_kind: mineral
description: >-
  Coquimbite is a trigonal aluminium-ferric-iron sulfate mineral, ideally
  AlFe(III)3(SO4)6(H2O)12·6H2O. IMA-CNMNC proposal 19-F, approved in
  October 2019, redefined the species to recognize essential aluminium;
  the September 2026 mineral list retains that formula and redefined
  status. The older Al-free formula Fe2(SO4)3·9H2O is not the current
  species definition. Coquimbite and paracoquimbite have related structures
  and form the coquimbite group; aluminocoquimbite has a different topology
  and is not a member of that group. In Mauro et al. 2020, a natural
  Monte Arsiccio specimen was characterized by electron microprobe,
  spectroscopy and single-crystal diffraction. Twenty microprobe spots
  gave the empirical formula Al0.96Fe3.11S5.97O24·18H2O, with water
  calculated from the structure rather than directly measured. Table 3
  and the associated CIF model an Al-dominant site with occupancy
  Al0.946(7)Fe0.054(7). These sample-specific chemical and structural
  results support the revised identity without implying an exactly ideal
  bulk composition. The study establishes mineral identity and structure;
  it does not test microbial formation, extraction or recovery.
