mechanisms:
- id: ccmp1335_silicic_acid_utilization
  name: Conditional SIT contribution to diatom silicic-acid uptake and silica incorporation
  process: biomineralization
  description: Living Thalassiosira pseudonana CCMP1335 cultures depleted silicic acid from medium and incorporated a fluorescent silica tracer into their frustules. Joint SIT1/SIT2 knockdown delayed solution depletion and reduced the silica-associated fluorescence at low silicic-acid supply. This supports a conditional contribution to silicon utilization and cell-wall biosilicification, without establishing an exclusive transporter, a directly demonstrated sensing pathway, or metal recovery.
  context: Laboratory stock cultures grew in NEPC medium containing 100 micromolar Si(OH)4, on an orbital shaker at 18 degrees C under continuous light of 100 microeinsteins/m2/s. Exponentially growing cells were harvested and deprived of silicic acid before replenishment. Silica-incorporation Methods specify 24 h deprivation; Figures 7-8 describe overnight starvation. Sodium silicate supplied a nominal 20 micromolar Si(OH)4 concentration for the selected assays. Silicomolybdate colorimetry of centrifuged supernatant measured disappearance, normalized per cell; this is a net-depletion proxy for uptake. PDMPO at 100 ng/mL, added five minutes before silicate, provided a flow-cytometric proxy for newly incorporated silica. A subset of clones was compared at 200 micromolar supply in a separate incorporation assay. Measured assay pH and an abiotic medium-depletion blank are not specified in the inspected main methods. No isolated silica mass, crystallographic phase, Si(0) product or industrial
    deployment is established here.
