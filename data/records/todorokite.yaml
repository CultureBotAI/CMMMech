id: cmmmech:todorokite
name: Todorokite
material_kind: mineral
description: >-
  Todorokite is the hydrous manganese oxide species listed by IMA-CNMNC in
  September 2026 with formula (Na,Ca,K,Ba,Sr)1-x(Mn,Mg,Al)6O12·3-4H2O
  (PDF page 218). Its status is approved; the accompanying 1962 s.p. entry
  identifies action by special procedure, not a modern approval-number CURIE.
  The Handbook of Mineralogy describes monoclinic material with variable
  cation composition and hydration in analyzed natural specimens. Its older
  generalized formula and specimen analyses are not substituted for the current
  IMA formula. Documented occurrence includes weathering or hydrothermal
  alteration of manganese-bearing minerals and deep-sea manganese nodules;
  these contexts do not specify a universal abundance or ore grade. The
  Handbook's geological term secondary mineral describes formation by
  alteration, not a material generated by industrial processing. This species
  is distinct from elemental manganese, a bulk manganese ore or nodule, and
  a manganese oxalate product. No microbial mechanism or criticality
  designation is assigned here.
