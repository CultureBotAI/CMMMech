id: cmmmech:aluminosugilite
name: Aluminosugilite
material_kind: mineral
description: >-
  Aluminosugilite (IMA 2018-142) is an IMA-accepted potassium-sodium-aluminium-lithium
  double-ring silicate mineral of the milarite (osumilite) group, the A-site
  Al3+-dominant analogue of sugilite (KNa2Fe3+2Li3Si12O30), with September 2026
  IMA Master List ideal formula KNa2Al2Li3Si12O30 (status A, PDF p. 8) and
  holotype empirical formula
  K0.99Na1.99(Al1.38Mn3+0.31Fe3+0.24Ti0.05Mg0.01)Sigma1.99Li3.06Si11.99O30 on the
  basis of O = 30 (Nagashima et al. 2020, pp. 57, 60). Combined WDS
  electron-microprobe analysis (35 points at 15 kV, 6 nA) and laser-induced
  breakdown spectroscopy (LIBS, 48 spots on the Li 670.706 nm emission line) in
  Table 1 (p. 60) report SiO2 72.20 (range 70.51–74.23, SD 0.73), TiO2 0.43
  (0.15–1.15, SD 0.21), Al2O3 7.06 (5.03–9.44, SD 1.04), Fe2O3 1.92 (0.69–5.60,
  SD 1.20; total Fe as Fe2O3), Mn2O3 2.42 (0.48–4.43, SD 0.78; total Mn as
  Mn2O3), MgO 0.04 (0.00–0.65, SD 0.11), CaO 0.01 (0.00–0.10, SD 0.02), Na2O
  6.17 (5.99–6.43, SD 0.11), K2O 4.68 (4.39–4.86, SD 0.11), Li2O 4.59
  (4.33–4.70, SD 0.10), total 99.52 wt% (V, Cr, Rb, and Cs below detection
  limits). Described by Nagashima, Fukuda, Matsumoto, Imaoka, Odicino, and
  Armellino (2020) from the Cerchiara mine, near Faggiona, Borghetto
  Vara–Pignone, La Spezia province, Liguria, Italy (44.116° N, 9.420° E;
  collected in 1997 by Gianluca Armellino; holotype deposited at the National
  Museum of Nature and Science, Tsukuba, Japan, registration number
  NSM-MF-16503), where it fills millimeter-scale interstices in Jurassic
  ophiolitic manganiferous metacherts (metamorphosed at prehnite–pumpellyite
  facies, P = 0.25 +/- 0.05 GPa, T = 250–300 °C, and affected by oxidizing
  Na–K–Li-rich hydrothermal metasomatism) in close association with quartz and
  K-feldspar (within a deposit assemblage that also includes braunite, hematite,
  calcite, pectolite, aegirine to aegirine-augite, richterite, andradite,
  piemontite, ganophyllite, balestraite, and Mn-bearing carbonates; pp. 57–58).
  Forms aggregates of transparent pinkish-purple prismatic and/or granular
  crystals up to 1 mm in length (individual grains typically 50–100 um) with
  pale purple to white streak, vitreous lustre, brittle tenacity, Mohs hardness
  6–6.5, indistinct/poor cleavage on (0001), Dmeas = 2.71–2.72 g/cm3 (by
  flotation in methylene iodide–toluene heavy liquids), Dcalc = 2.73 g/cm3,
  uniaxial (–) optics with omega = 1.577–1.586 (average 1.581), epsilon =
  1.575–1.585 (average 1.580), weak pleochroism, Gladstone–Dale compatibility
  index 1 - (KP/KC) = +0.003 (superior, for average Dmeas = 2.71 g/cm3),
  magnetic attraction in a Frantz isodynamic separator at 0.9 A (15° side tilt,
  vs 0.6 A for Fe3+-rich sugilite from Iwagi Islet), and insolubility in HCl,
  HNO3, and H2SO4 (pp. 57–59). Hexagonal, space group P6/mcc (Z = 2);
  single-crystal X-ray diffraction on a 0.038 x 0.036 x 0.028 mm crystal
  (MoKalpha, lambda = 0.71073 Å, 590 unique reflections refined to R1 = 0.0217,
  wR2 = 0.0599, S = 1.071; Table 2, p. 62) gives a = 9.9830(4) Å, c = 13.9667(5)
  Å, V = 1205.45(7) Å3 in the abstract and text (printed as 1205.45(1) Å3 in
  Table 2, p. 62), while CuKalpha1 powder X-ray diffraction gives refined cell
  parameters a = 9.954(7) Å, c = 13.95(4) Å, V = 1197(4) Å3 (p. 61). The crystal
  structure (Tables 3–4, pp. 62–63) consists of double six-membered [Si12O30]
  rings of T1O4 tetrahedra (<T1–O> = 1.6102 Å) cross-linked by edge-sharing
  octahedral A sites (A–O3 = 1.9395(12) Å, refined scattering occupancy
  Al0.629(6)Fe0.371) and strongly angularly distorted T2(Li)O4 tetrahedra
  (T2–O3 = 1.9700(12) Å, bond-angle variance sigma2 = 545.8), with K+ at the
  12-coordinated C site (C–O2 = 2.9950(13) Å) and Na+ disordered across the
  split 9-coordinated B' site (1/3, 2/3, 0.008(6), occupancy 0.5, <B'–O> = 2.660
  Å). A second occurrence at the Funakozawa mine, Hirono Town, Iwate Prefecture,
  Japan (40°15'08'' N, 141°37'04'' E shaft; 40°15'10'' N, 141°36'44'' E river
  boulder at the Ono–Funakozawa confluence), documented in the second
  IMA-listed reference by Nishio-Hamane, Nagashima, Mori, Ohki, and Suzuki
  (2024, Journal of Mineralogical and Petrological Sciences 119:240509), forms
  foliated reddish-light purple crystals up to 1 mm in diameter and 50 um thick
  (Mohs hardness 6, indistinct cleavage, almost colorless with weak pleochroism
  in thin section) in <= 5 mm quartz layers along the schistosity of thermally
  metamorphosed biotite-zone slate, coexisting with aegirine, amphibole
  (ferri-leakeite, potassic-richterite), quartz, norrishite, braunite–neltnerite
  series minerals, albite, titanite, Mn-bearing diopside, marsturite, and
  cerchiaraite-(Mn), and altering in outcrop into swinefordite (Li-rich smectite)
  with foliated texture retained (pp. 1–3). SEM-EDS analyses (JEOL IT-100, 15 kV,
  0.8 nA, 1 um beam; Table 1, p. 4) yield average compositions (on Si = 12 apfu,
  Li = 3 apfu fixed) of K2O 4.55 (4.19–4.88), Na2O 5.93 (5.46–6.41), Al2O3 6.59
  (6.03–7.87), Fe2O3 3.47 (1.46–4.68), Mn2O3 1.32 (0.78–1.85), Li2O 4.44
  (calculated), SiO2 71.36 (70.35–72.47), total 97.66 wt%
  (K0.98Na1.93(Al1.31Fe0.44Mn0.17)Sigma1.91Li3Si12O29.82) for the boulder sample
  (n = 10) and K2O 4.42 (4.08–4.83), Na2O 6.12 (5.67–6.60), Al2O3 5.72
  (4.29–6.95), Fe2O3 4.02 (1.48–6.30), Mn2O3 2.36 (1.56–3.29), Li2O 4.45
  (calculated), SiO2 71.54 (69.64–73.48), total 98.63 wt%
  (K0.95Na1.99(Al1.13Fe0.51Mn0.30)Sigma1.94Li3Si12O29.88) for the outcrop sample
  (n = 15). Synchrotron powder XRD at SPring-8 BL02B2 (lambda = 0.999393 Å, 49
  peaks indexed in d = 8.65–1.35 Å) refines P6/mcc cell parameters a = 9.9834(4)
  Å, c = 13.9669(8) Å, V = 1207.00(11) Å3 (p. 4), and single-crystal XRD
  refinement on a 0.11 x 0.08 x 0.04 mm boulder crystal (Rigaku HyPix-6000HE,
  MoKalpha, 8,184 collected / 1,022 unique / 786 observed reflections, Rint =
  5.81%, R1 = 2.67%, wR2 = 7.97%, S = 1.07; Tables 2–4, pp. 4–7) yields a =
  9.9894(7) Å, c = 13.9527(9) Å, V = 1205.77(14) Å3 in abstract/text (pp. 1, 4)
  and 1205.77(19) Å3 in Table 2 (p. 5), structural formula
  KNa2(Al1.34M0.66)Li3Si12O30 (M = Fe + Mn; AAl occupancy Al0.669(5)Fe0.331,
  A–O3 = 1.9385(10) Å, T2–O3 = 1.9735(10) Å, C–O2 = 2.9922(11) Å, BNa split at
  z = 0.0124(9) with 0.5 occupancy), and attributes the <= 20–30% Mn3+ limit in
  P6/mcc sugilite-series minerals to the regular AO6 octahedron resisting
  Jahn–Teller distortion (pp. 5–6). Distinct from Fe3+-dominant sugilite,
  Mn3+-bearing sugilite varieties, and elemental lithium; no criticality
  designation, microbial mechanism, or industrial recovery yield is asserted.
