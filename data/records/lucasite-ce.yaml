id: cmmmech:lucasite-ce
name: Lucasite-(Ce)
material_kind: mineral
description: >-
  Lucasite-(Ce) (IMA 1986-020) is an IMA-accepted cerium-titanium
  oxide-hydroxide mineral with IMA September 2026 Master List formula
  CeTi2O5(OH) and crystal-chemical formula CeTi2(O,OH)6 (empirical formula
  Ce0.51La0.27Nd0.11Pr0.11Ti2(O,OH)6). Described by Nickel, Grey, and Madsen
  (1987) from heavy-mineral concentrates of the Argyle AK1 diamondiferous
  olivine lamproite tuff, East Kimberley region, Western Australia, Australia.
  Table 1 (p. 1007) reports the mean of eight electron-microprobe analyses:
  Ce2O3 24.99, La2O3 13.12, Nd2O3 5.90, Pr2O3 5.50, CaO 0.62, TiO2 47.93, MgO
  0.03, SiO2 0.25, Al2O3 0.04, total 98.38 wt% (with F not analyzed and the low
  98.38 wt% total together with bond-valence sums interpreted as indicating
  hydroxyl/water substitution). Monoclinic (space group I2/a, equivalent to
  standard C2/c; refined to R = 0.054 for 977 independent reflections), with a =
  5.178(1) Å, b = 8.756(4) Å, c = 9.768(5) Å, beta = 93.52(4)°, Z = 4, Dcalc =
  5.00 g/cm3, Vickers microhardness VHN10 = 761–900 kg/mm2 (mean 824 kg/mm2),
  {001} cleavage, and refractive indices n > 2.0 (Gladstone-Dale calculated mean
  n = 2.321).
