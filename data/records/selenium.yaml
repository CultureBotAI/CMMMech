material_kind: element
description: >-
  Selenium (Se), chemical element with atomic number 34. The experimental
  substrate is soluble selenite, distinct from the element identifier,
  a selenium mineral, or a secondary resource. Australia's dated selenium
  material designation is mapped to this element without extending it to salts.
