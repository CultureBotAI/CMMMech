id: cmmmech:gobelinite
name: Gobelinite
material_kind: mineral
description: 'IMA-approved monoclinic hydrated cobalt-copper hydroxy-sulfate mineral and Co-dominant
  analogue of ktenasite (IMA 2018-167; status A, Approved; full description published 25 November
  2020; no mineral symbol is printed in the primary paper or in the September 2026 IMA Master
  List, PDF p. 84) with ideal end-member formula CoCu4(SO4)2(OH)6 * 6H2O (written CoCu4(SO4)2(OH)6(H2O)6
  in the September 2026 IMA Master List, PDF p. 84, requiring CuO 44.48 wt%, CoO 10.47 wt%,
  SO3 22.38 wt%, and H2O 22.67 wt%, total 100.00 wt% in Section 4, p. 639; Mills, Kolitsch,
  Favreau, Birch, Galea-Clolus, and Henrich, 2020, European Journal of Mineralogy 32:637-644).
  Named in reference to German kobold ("goblin", a superstitious term used by medieval miners
  for cobalt ore, and the etymological root of cobalt and cobaltite; Pfeifer, 2004), which
  originates from Old French gobelin (ca. 1195) and Medieval Latin gobelinus (before 1141),
  honouring the Old French roots of the word because the Cap Garonne locality is in France
  and avoiding confusion with cobaltite (Section 1, p. 638); previously reported as "cobalt-nickel-ktenasite"
  at Cap Garonne by Sarp et al. (1990) and as "ktenasite", "ktenasite-(Co,Ni)", or "ktenasite-Co"
  at Eisenzecher Zug by Henrich (1998, 2008a, b) (Section 2, p. 639, and Section 7, p. 643).
  Characterized from two co-type localities (France / Germany in the IMA Master List): (1)
  Pillar 78b in the "fond de mine" area (also found on pillars 78, 79, and 80) in the north
  mine of the Cap Garonne (CG) mine (43 deg 4 min 53 sec N, 6 deg 1 min 55 sec E), Var, Provence-Alpes-Cote
  d''Azur, France, where the holotype specimen (found by Valerie Galea-Clolus) is preserved
  in the mineralogical collections of Geosciences, Museums Victoria, Melbourne, Victoria,
  Australia, under registration number M54565; and (2) a small, fissure-like area in an adit
  on the Schlanger und Eichert vein at the Eisenzecher Zug (EZ) mine (50 deg 49 min 9 sec
  N, 7 deg 59 min 14 sec E), Eiserfeld, Siegerland, North Rhine-Westphalia, Germany, where
  the cotype specimen (found by Johannes Markus Henrich in 1997) is preserved in the Naturhistorisches
  Museum, Vienna, Austria, under registration number O 1045 (Abstract, p. 637, and Section
  1-2, pp. 638-639). At Cap Garonne, gobelinite is likely to have formed from weathering of
  cobaltite-gersdorffite and nearby tennantite under acidic conditions, associated with brochantite,
  cerussite, gordaite-group minerals ("guarinoite", theresemagnanite, and pale-green gordaite),
  serpierite, botallackite, an unknown copper sulfate, and (at pillar 80) antlerite and anglesite;
  at Eisenzecher Zug, it formed by acidic weathering of a primary Cu-Co ore paragenesis (chalcocite,
  djurleite, carrollite, locally hematite, and less commonly pyrite, bornite, alloclasite,
  and chalcopyrite) directly on quartz, siderite, carrollite, or slate country rock, associated
  with brochantite, devilline, malachite, asbolane, spherocobaltite, langite, and "sericite"
  (Section 2, pp. 638-639). Occurs as aggregate crusts (CG) or curved radial, subparallel,
  or coral-like aggregates (EZ) of pale green, bluish green, or greyish green blocky to thin
  lath-like, prismatic, or acicular crystals commonly 0.1-0.2 mm and rarely up to 0.5 mm (CG)
  or 0.2-0.5 mm (EZ) long, elongated on [010] and flattened on {001} with crystal forms {001},
  {031}, and {201} (Abstract, p. 637, and Section 3, pp. 638-639). Has a white streak with
  a pale-green cast, vitreous to sometimes pearly lustre, transparent to translucent diaphaneity,
  non-fluorescent under UV light, brittle tenacity with an irregular fracture, Mohs hardness
  ~2.5, no observed cleavage, measured density D(meas.) = 2.95(2) g cm-3 (CG, by sink-float
  in Clerici solution), calculated density D(calc.) = 2.907 g cm-3 (CG, from the empirical
  formula and unit cell), and X-ray densities 2.958 g cm-3 (CG, 100 K single-crystal refinement)
  and 2.926 g cm-3 (EZ, 298 K single-crystal refinement; Abstract, p. 637, and Section 3,
  p. 639). Optically biaxial negative (-) (measured on CG material in white light), with alpha
  = 1.576(2), beta = 1.617(2), gamma = 1.630(2), 2V(meas.) = 58(4) deg (by direct measurement
  on a spindle stage), 2V(calc.) = 57.5 deg, weak r > v dispersion, optical orientation X
  = beta [b], Y = gamma [c], and Z approx. alpha [a], pleochroism X = colourless, Y = green,
  and Z = pale green, and Gladstone-Dale compatibility index 1 - (Kp/Kc) = 0.011 (superior,
  Mandarino, 2007; Abstract, p. 637, and Section 3, p. 639). Quantitative wavelength-dispersive
  electron-microprobe analyses of Cap Garonne gobelinite (JEOL Superprobe at the University
  of Melbourne; 20 kV, 5 nA, 20 um beam diameter; note that Section 4 text on p. 639 states
  "10 points" whereas the Table 1 caption on p. 640 states "n = 9") yielded mean CuO 42.45
  wt% (range 38.77-45.45, SD 1.84, standard Cu metal Kalpha), CoO 6.58 wt% (5.75-7.38, SD
  0.57, standard Co metal Kalpha), ZnO 3.14 wt% (2.18-5.12, SD 0.96, standard Zn metal Kalpha),
  NiO 3.37 wt% (3.00-3.57, SD 0.19, standard NiFe Kalpha), Al2O3 0.02 wt% (0-0.04, SD 0.01,
  standard Al2O3 Kalpha; note that Al2O3 0.02 wt% is omitted in the Abstract on p. 637 while
  still reporting Total 100.30 wt%), SO3 22.12 wt% (21.50-22.73, SD 0.40, standard SrSO4 Kalpha),
  stoichiometric H2Ocalc = 22.62 wt% (6 H2O + 6 OH), and Total = 100.30 wt%, giving the empirical
  formula (Co0.63Ni0.32Zn0.28Cu3.83)sum=5.06S1.98O20H18.00 based on 20 O atoms; quantitative
  SEM-EDS spot analyses of Eisenzecher Zug gobelinite (JEOL JSM-6610LV at the Natural History
  Museum, Vienna, Bruker e-FlashHR+ detector with 127 eV resolution, Bruker Esprit 2.0 software,
  15 kV, 1 um spot size, 60 s measuring time, PB-ZAF correction, n = 9 spot analyses after
  excluding one outlier; Section 4, pp. 639-640) gave the average empirical formula (Co0.92Ni0.21Mg0.01Cu3.79)sum=4.93(SO4)2.08(OH)6
  * 6H2O. Crystallizes in the monoclinic system, space group P21/c (#14), Z = 2, isostructural
  with ktenasite (Mellini and Merlino, 1978). Synchrotron single-crystal X-ray diffraction
  on Cap Garonne holotype material (Australian Synchrotron MX2 beamline, Dectris EigerX 16M
  detector, lambda = 0.71073 A, T = 100 K, fragment size 10 x 10 x 2 um; Section 5.1, p. 640,
  and Tables 3-4, pp. 641-642) gave unit-cell parameters a = 5.5990(11) A, b = 6.0840(12)
  A, c = 23.676(5) A, beta = 95.22(3) deg, V = 803.2(3) A3, Z = 2, refining in SHELXL-2016/6
  (with fixed site occupancies Co = Co0.62Ni0.32Zn0.06 and Cu1, Cu2 = Cu0.95Zn0.05) to R1
  = 0.0310 for 2386 reflections with Fo > 4sigma(Fo) and R1 = 0.0312 for all 2419 data (Rint
  = 0.0315); room-temperature powder X-ray diffraction on CG material (Agilent SuperNova diffractometer,
  Atlas CCD, MoKalpha radiation; Section 5.1 and Table 2, p. 640) gave a = 5.6098(12) A, b
  = 6.0981(7) A, c = 23.800(5) A, beta = 95.20(6) deg, V = 810.8(9) A3, Z = 2; and room-temperature
  single-crystal X-ray diffraction on Eisenzecher Zug cotype material (Nonius KappaCCD diffractometer,
  MoKalpha radiation, T = 298 K, crystal fragment dimensions printed as "0.05 x 0.05 x 0.13
  um" in Section 5.2, p. 640, a typographical unit error for mm) gave a = 5.611(1) A, b =
  6.103(1) A, c = 23.808(5) A, beta = 95.18(3) deg, V = 811.9(3) A3, Z = 2, refining in SHELXL-97
  (with fixed site occupancy Co = Co0.92Ni0.08) to R1 = 0.0289 for 1998 reflections with Fo
  > 4sigma(Fo) (printed as "R1 = 0.0280" in the Abstract, p. 637) and R1 = 0.0400 for all
  2352 data (Rint = 0.0259). The crystal structure (Section 6, pp. 641-642, and Tables 3-4)
  consists of brucite-like sheets of edge-sharing, Jahn-Teller-distorted (4 + 2)-coordinated
  CuO6 octahedra (<Cu1-O> = 2.108 A [CG] / 2.112 A [EZ] in Table 4, p. 642; <Cu2-O> = 2.101
  A [CG] / 2.106 A [EZ] in Table 4, p. 642, vs 2.105 A [EZ] in Section 6 text, p. 641) decorated
  on both sides by corner-sharing SO4 tetrahedra (<S-O> = 1.478 A [CG] / 1.474 A [EZ]) and
  linked along c via hydrogen bonds to interstitial isolated octahedral Co(H2O)6 groups (<Co-O>
  = 2.072 A [CG] / 2.082 A [EZ]). The eight strongest powder X-ray diffraction lines for CG
  gobelinite reported in the Abstract (p. 637) [d in A (I) hkl] are 11.870 (100) 002, 5.924
  (40) 004, 4.883 (10) 102, 4.825 (15) 013, 3.946 (15) 006, 2.956 (15) 008, 2.663 (20) 202,
  and 2.561 (15) -1 2 3, of which six (002, 004, 013, 006, 008, and 202) are marked in bold
  in Table 2 (p. 640). No biological or microbial interaction data are reported in the type
  mineralogical description.'
