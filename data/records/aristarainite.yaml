      observed/calculated structure factors and refinement summaries.
      Table headers, representative rows and the final summary were
      visually inspected. No independent re-refinement or exhaustive
      numerical transcription of the deposited factors was performed.
    url: https://msaweb.org/MSA/AmMin/Supplemental_Data/Vol%2062%20p0979%20AM-77-052.pdf
    accessed_on: '2026-10-16'
