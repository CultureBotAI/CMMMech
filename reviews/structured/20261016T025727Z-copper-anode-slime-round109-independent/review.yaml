- assessment_id: methods
  area: evidence
  topic: Actual leaching protocol, analytical methods and comparative controls
  outcome: supported
  summary: The bounded abiotic leaching claim matches the inspected primary methods
    and original Figure 5.
  details: The selected condition is 4 mol/L sulfuric acid, 120 g/L sodium chloride,
    70°C, 2 h and 10 mL/g. Figure 5a/b concentration series were conducted at 80°C
    and are kept separate from the 70°C selection; temperature and time series are
    not treated as a single factorial optimization. The zero-added-chloride comparison
    is explicit. XRF, chemical dissolution with ICP-AES, XRD, SEM/EDS and laser sizing
    support the reported characterization. Unspecified sample mass, stirring speed,
    replication and uncertainty remain unfilled; this is not a microbial experiment
    and no organism identifier is appropriate.
  target_ids:
  - cmmmech:copper-anode-slime
  evidence_ids:
  - owner
  - primary
  - figures
- assessment_id: mechanism
  area: evidence
  topic: Measured comparative dissolution and inferred chloride chemistry
  outcome: supported
  summary: Comparative leaching is supported while the detailed molecular explanation
    stays qualified.
  details: Original Figure 5 supports increased Sb/Bi leaching with added chloride
    under the tested conditions and nonuniform element responses to acid concentration,
    temperature and time. The record does not claim a universal optimum, new kinetic
    fit or directly measured aqueous complex distribution. Chloride-complex formation
    and suppression of insoluble phases are author interpretations. Source-reported
    leaching percentages are not independently reconciled whole-process recoveries.
  target_ids:
  - cmmmech:copper-anode-slime
  evidence_ids:
  - owner
  - primary
  - figures
  - balance
- assessment_id: numbers
  area: consistency
  topic: Feed composition, liquid accounting and censored endpoints
  outcome: supported
  summary: The source accounting limitations are preserved rather than silently repaired.
  details: Table 4 initial liquid Cu 25880, Sb 29450, Bi 28050 and As 24000 mg/L does
    not directly reconcile with Table 1 and 10 mL/g under unchanged-volume/same-feed
    assumptions. Those assumptions are stated, with possible unreported feed or volume
    changes left unresolved. A concentration decrease does not establish isolated
    recovery without solution volumes and product masses. Final Sb <5 mg/L remains
    censored rather than converted into zero. The study’s 98% precipitation reports
    are attributed and not accepted as independently verified recoveries.
  target_ids:
  - cmmmech:copper-anode-slime
  evidence_ids:
  - owner
  - primary
  - balance
  - figures
- assessment_id: downstream
  area: scope
  topic: Hydrolysis stages, acid concentration and product identification limits
  outcome: supported
  summary: Precipitation is correctly separated from the accepted leaching mechanism.
  details: The text’s two hydrolysis stages use 80°C and H+ concentrations 0.8 then
    0.2 g/L; these are not pH values. NaOH dosing/volumes, precipitation times and
    product masses are not supplied. Sb4O5Cl2 and BiOCl assignments and thermodynamic
    diagrams remain attributed context only because original full-size Figures 6–7
    were unavailable. Caption/text inspection and the graphical abstract do not establish
    independent pattern validation. Modeled concentrations are not measured precipitation
    outcomes.
