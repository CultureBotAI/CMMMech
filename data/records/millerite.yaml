id: cmmmech:millerite
name: Millerite
material_kind: mineral
description: Millerite is the trigonal NiS mineral species, distinct from hexagonal alpha-NiS, hydrated or unresolved nickel-sulfide precursors, elemental nickel and mixed ores. The September 2026 IMA-CNMNC list gives grandfathered status and original-description year 1845; that year is not a unique approval accession. The curated mechanism concerns a synthetic mineral-assigned component of laboratory precipitates. No nickel criticality designation or industrial deployment is inherited.
sources:
- id: ima_2026_09
  title: 'IMA-CNMNC (September 2026). The New IMA List of Minerals. Definitions p.1; Millerite row p.144: NiS, G (grandfathered), original-description year 1845.'
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: mansor2019
  title: 'Mansor, M., Winkler, C., Hochella, M. F. Jr. and Xu, J. (2019). Nanoparticulate Nickel-Hosting Phases in Sulfidic Environments: Effects of Ferrous Iron and Bacterial Presence on Mineral Formation Mechanism and Solid-Phase Nickel Distribution. Frontiers in Earth Science 7:151. DOI 10.3389/feart.2019.00151. Full primary PDF, Methods pp.3–4, Results pp.4–6, Figures 1–11, Tables 1–2 and Discussion pp.6–13.'
  url: https://doi.org/10.3389/feart.2019.00151
  accessed_on: '2026-10-14'
- id: mansor2019_si
  title: Mansor et al. (2019), associated Supplementary Material, Table_1 DOCX. DOI 10.3389/feart.2019.00151.s001; Frontiers Figshare article 8323754, file 15598037. Nine annotated diffraction panels and Table S1.
  url: https://doi.org/10.3389/feart.2019.00151.s001
  accessed_on: '2026-10-14'
