id: cmmmech:metal-grinding-sludge
name: Metal grinding sludge
material_kind: secondary_resource
description: Sludge generated during grinding of metal workpieces with cooling fluids, represented by an iron-rich sample from Tatra Koprivnice. Material collected from grinding-fluid traps contains metal particles and other phases; it is distinct from elemental iron, a specified alloy and coal-combustion cinder or slag. The evidence concerns the sampled processing residue, not every grinding sludge or an industrial bioleaching operation. No criticality designation is inferred from the metals it contains.
sources:
- id: fecko1996_tatra
  title: Fecko and Kucerova (1996), Bacterial leaching of waste materials at the Tatra joint stock company, Koprivnice. Mineralia Slovaca 28(5), 388-390. Original publisher issue PDF pages 82-84; grinding-sludge methods, Figures 1-3 and Tables 1 and 3. Tables 2 and 4 and Figures 4-7 concern the separate coal-cinder/slag feed.
  url: https://www.geology.sk/wp-content/uploads/documents/foto/MS/MS-1996-28-5.pdf
  accessed_on: '2026-10-11'
- id: ncbi_ferrooxidans
  title: NCBI Taxonomy 920, Acidithiobacillus ferrooxidans; Thiobacillus ferrooxidans is a homotypic synonym. Species-level mapping only.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920&mode=Info
  accessed_on: '2026-10-11'
mechanisms:
- id: culture_associated_grinding_sludge_leaching
  name: Acidophile culture-associated leaching of metal grinding sludge
  process: bioleaching
  description: An acidified laboratory incubation with a source-described pure culture of Thiobacillus ferrooxidans was accompanied by changes in grinding-sludge morphology and elemental composition, increasing reported solution Fe(II) and increasing most-probable-number estimates. These observations support culture-associated leaching under the reported conditions. Without a matched abiotic comparison they do not isolate microbial enhancement over chemical dissolution. Persistent iron-bearing solids and unresolved recovery accounting preclude a complete-extraction or isolated-product claim.
  context: Page 388 describes sterilized Erlenmeyer flasks containing 10 g waste, 180 mL 9K medium without FeSO4 and 20 mL bacterial suspension. The culture was supplied by the Mining Institute of the Slovak Academy of Sciences in Kosice; no strain accession or experimental stock authentication is reported. Incubation lasted 28 days at 26-30 degrees C, with pH maintained between 1.8 and 2.0. The source does not specify agitation, the adjusting reagent or acid additions, inoculum carry-over chemistry, or sterilization of the waste itself. It reports ICP elemental analysis and EDAX and X-ray characterization. The method used specifically to quantify solution Fe(II), leaching-flask replication, analytical detection limits and a sampling-adjusted mass balance are not described. No analysis dates are supplied for native concentration observations.
