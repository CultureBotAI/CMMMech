    annotation_note: Grounded to Geobacter sulfurreducens PCA reference proteome UP000000577 (NCBITaxon:243231) for the species-level mechanism organism Geobacter sulfurreducens (NCBITaxon:35554).
    evidence:
    - source_ref: xie_2026
      supports: partial
      explanation: Representative Geobacter sulfurreducens PCA inner-membrane cytochrome CbcL (GSU0274) for extracellular electron transfer to 200 uM aqueous Rh(III) (from RhCl3.xH2O) with 10 mM sodium acetate in Xie et al. (2026); individual cytochrome genes were not mutated.
  evidence:
  - source_ref: xie_2026
    supports: support
    explanation: Methods 2.1-2.3, Results 3.1.1 and Figure 1a distinguish the cell-containing and no-cell monometallic Rh assays. Results 3.2, Figure 2, Table 2 and Figure 4c identify Rh(0)-consistent diffraction in harvested material and particle agglomerates associated with cells. The phase claim relies on diffraction, not the black color or aqueous removal alone.
  - source_ref: xie_2026
    supports: partial
    explanation: Results 3.3, Figure 3 and Table 1 report no discernible monometallic Rh XPS signal, so the monometallic surface Rh(0)/Rh(III) proportions are unresolved. XRD is dominated by one broad reflection; SAED supplies additional indexed planes, but neither quantifies all amorphous or dissolved Rh. The record does not transfer the bimetallic Rh XPS percentages to this preparation.
  - source_ref: xie_2026
    supports: partial
    explanation: Methods 2.2 says controls without electron donor were prepared, but Rh-specific donor-free outcomes are not shown in Figure 1 or tabulated in the inspected article or supplementary Table S1. Replicate counts and definitions of Figure 1 error bars are not specified. A matched killed-cell comparison and direct genetic or protein-level demonstration of Rh-reducing cytochromes are not reported; acetate dependence, viability and a unique enzyme pathway therefore remain unestablished.
- id: geobacter_pdrh_cotransformation
  name: Rh transformation during simultaneous Pd/Rh exposure of resting cells
  process: redox_transformation
  description: A separate simultaneous exposure of resting Geobacter sulfurreducens to Pd(II) and Rh(III) generated cell-supported mixed nanoparticles. The authors' combined XRD, atomic-resolution imaging and elemental mapping support a PdRh alloy interpretation, with mixed surface oxidation states. This preparation is distinct from monometallic Rh particles and from sequential Pd-seeding protocols.
  context: Methods 2.2 repeats the 10 mL, OD600 0.4, 10 mM acetate, 30 mM bicarbonate, pH 6.8-7.0, 30 degrees C anaerobic assay with 100 micromolar Pd plus 100 micromolar Rh added together, supplied from Na2PdCl4 and RhCl3.xH2O stocks. Results 3.1.2 reports 97% aqueous Rh removal within 1 h with cells; the cell-free mixture also lost approximately 20% Rh by the later endpoint, unlike the single-metal no-cell Rh control. The authors propose co-removal during Pd hydrolysis as an explanation. Characterized solids were collected after 24 h. No purified alloy product yield, full Rh mass balance, real waste-feed trial or deployment is established by this synthetic-feed experiment.
