mechanisms:
- id: lr_mixed_specimen_leaching_limit
  name: Molybdenite persistence during culture-associated companion-sulfide leaching
  process: bioleaching
  description: In laboratory bioleaching assays with Acidithiobacillus ferrooxidans LR, molybdenite persisted in a mixed sulfide specimen while the authors interpreted changes in iron chemistry and residue XRD as preferential removal of companion pyrite and pyrrhotite. Molybdenum in sampled liquid remained below the reported detection limit in both inoculated and uninoculated conditions. This is a bounded attempted-leaching result and companion-phase observation, not demonstrated microbial molybdenite oxidation, molybdenum extraction or isolated-product recovery. The authors' proposed galvanic protection of molybdenite was not directly measured.
  context: The natural ore-grade material came from Ward's Natural Science Establishment, Rochester, New York; the specimen's mine origin is not supplied. It was ground below 0.2 mm and contained 0.8 wt% Mo, 34.0 wt% Fe and 23.0 wt% S. Initial XRD identified molybdenite, pyrite and pyrrhotite, with additional unidentified copper-mineral peaks. LR was isolated from acidic uranium-ore leach liquor at Lagoa Real, Bahia, Brazil, and adapted to the mixed sulfide before inoculation. No authenticated strain accession is assigned. The 43-day flask study used 250 mL Erlenmeyers containing 150 mL culture medium and 2.5% w/v ore, autoclaved at 120 degrees C for 30 minutes, then inoculated at 5% v/v and shaken at 150 rpm and 30 plus or minus 2 degrees C. Inoculated arms with and without 30 mmol/L supplemental Fe(II) had corresponding uninoculated controls; an additional uninoculated Fe(III) control was included. The cited T-and-K medium recipe is not reproduced in full. Flask replication, inoculum cell
    density, washing status and initial pH are not explicitly given. All flasks required early acid corrections; exact acid doses and timing are unavailable. Separate triplicate resting-cell respirometry does not supply those missing flask details. These are laboratory observations, not an industrial process demonstration.
