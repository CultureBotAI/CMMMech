id: cmmmech:plumbogottlobite
name: Plumbogottlobite
material_kind: mineral
ima_symbol: Pgtb
description: >-
  Plumbogottlobite (IMA 2025-075) is an IMA-accepted hydrous lead–magnesium
  vanadate mineral of the adelite–descloizite group with September 2026
  IMA-CNMNC Master List ideal formula PbMg(VO4)(OH) (PDF p. 174, status A;
  official IMA symbol Pgtb, whereas Section 1 on p. 209 lists "Warr symbol:
  Pgot"; ideal composition PbO 61.41 wt%, V2O5 25.02 wt%, MgO 11.09 wt%, H2O 2.48
  wt%, total 100 wt%), representing the Pb2+ analogue of gottlobite
  (CaMg(VO4)(OH)), the Mg2+ analogue of descloizite (PbZn(VO4)(OH)), the V5+
  analogue of duftite-alpha (Pb(Cu,Mg)(AsO4)(OH)), and the Mg-dominant analogue
  of mottramite (PbCu(VO4)(OH)) and cechite (Pb(Fe2+,Mn2+)(VO4)(OH)). Described
  by Kampf, Désor, and Ma (2026) from a single hydrothermal baryte-vein specimen
  collected on the dumps of the Glücksstern mine, Gottlob Hill, Friedrichroda,
  Gotha District, Thuringia, Germany (50°51'6" N, 10°34'10" E; holotype
  deposited in the Natural History Museum of Los Angeles County under catalogue
  no. 77403, pp. 209–210). Occurs as subparallel intergrowths of orange-brown
  tablets flattened on {001} (bounded by observed crystal forms {100}, {010},
  {001}, {110}, {011}, {101}, and {111}) up to ~0.2 mm across on fracture
  surfaces in baryte with hausmannite (Sections 2–3, p. 210, Figs. 1–2).
  Exhibits a light-orange-brown streak, transparent character with adamantine
  lustre, non-fluorescence under long- or short-wave UV, Mohs hardness 4–4.5,
  brittle tenacity with irregular to conchoidal fracture, no cleavage or
  twinning, rapid decomposition in dilute HCl at room temperature forming a white
  residue that slowly dissolves, and calculated density Dcalc = 5.359 g/cm3 for
  the empirical formula and 5.516 g/cm3 for the structural formula on the
  single-crystal cell (Section 3, p. 210, and Table 3, p. 212). Optically biaxial
  (–) with 2Vmeas = 84(1)°, optical orientation Y = c (whereas Section 3 on p.
  210 erroneously writes "uniaxial (–)" in the sentence immediately preceding 2V
  = 84(1)° and Y = c), non-pleochroic in demonstrable orientations, and
  Gladstone–Dale predicted mean refractive index n_calc = 2.077 (exceeding
  available index liquids, Section 3, p. 210). Micro-Raman spectroscopy (532 nm
  laser, 2 mW, Section 5, pp. 210–212, Fig. 3) shows a broad weak O–H stretching
  band at ~3217 cm-1, a weak overtone at ~1550 cm-1, VO4 stretching bands at 847
  (very strong), 781 (shoulder), and 732 (medium) cm-1, VO4 bending modes at 441,
  381, and 325 cm-1, and external/lattice modes at 275, 198, and 138 cm-1. Mean
  of 4 WDS electron-microprobe point analyses (JEOL JXA-iHP200F field-emission
  electron probe microanalyser, 15 kV, 10 nA, 10 um beam; Section 4, p. 210,
  Table 1, p. 211) yielded raw means PbO 52.47 wt% (range 51.80–53.41, SD 0.69),
  V2O5 23.96 (23.85–24.06, SD 0.09), MgO 8.20 (8.00–8.38, SD 0.15), CuO 3.94
  (3.60–4.12, SD 0.24), MnO 1.69 (1.58–1.88, SD 0.14), which when normalised with
  stoichiometric structural H2O (V = 1, O = 5) give PbO 56.48, V2O5 25.79, MgO
  8.82, CuO 4.24, MnO 1.81, H2O* 2.85, Total = 99.99 wt% (raw analytical totals
  were low by ~7.5% because the crystals did not take a good polish, Section 4,
  p. 210); on 5 O apfu, Section 4 (p. 210) partitions Mn2+ across both cation
  sites as
  (Pb0.89Mn2+0.05[]0.06)Sigma1.00(Mg0.77Cu2+0.19Mn2+0.04)Sigma1.00(VO4)(OH)
  (+0.12 H for charge balance), whereas the Abstract (p. 209) places all Mn2+ at
  the octahedral site as
  (Pb0.89[]0.11)Sigma1.00(Mg0.77Cu2+0.19Mn2+0.09)Sigma1.05(VO4)(OH) (+0.12 H).
  Orthorhombic, space group Pnma (no. 62), Z = 4, descloizite structure type
  (Sections 6–7, pp. 211–215, Tables 2–7, Fig. 4): single-crystal MoKalpha XRD
  refinement on a 120 x 80 x 60 um crystal (Rigaku R-Axis Rapid II, 429
  reflections with I > 2sigma(I) out of 430 unique, 7391 collected, Rint = 0.142,
  R1 = 0.0302, wR2 = 0.0754, R1(all) = 0.0304, wR2(all) = 0.0755, GoF = 1.309,
  refined structural formula (Pb0.941[]0.059)(Mg0.700Cu0.300)(VO4)(OH); Table 3
  index ranges transpose l and k as -7 <= l <= 7, -11 <= k <= 11 for b = 6.11 Å
  and c = 9.40 Å) gives a = 7.6104(7) Å, b = 6.1091(6) Å, c = 9.3968(8) Å
  (Abstract, p. 209, and Table 7, p. 215, consistent with V = 436.88 Å3; printed
  with digit transposition as c = 9.3986(8) Å in Table 3 on p. 212), V =
  436.88(7) Å3 (436.88(6) Å3 in Table 7), with [010] chains of edge-sharing
  (Mg,Cu)O4(OH)2 octahedra (Mg site at 4a: Mg–OH = 2.025(6) Å x 2, Mg–O1 =
  2.156(7) Å x 2, Mg–O3 = 2.187(7) Å x 2; true six-bond mean = 2.123 Å, printed
  as "<Mg–O> = 2.157 Å" in Table 5 on p. 214, BVS = 1.86 v.u. in Table 6 on p.
  214) corner-linked by VO4 tetrahedra (V site at 4c: V–O2 = 1.651(10) Å, V–O3 =
  1.756(9) Å, V–O1 = 1.758(8) Å x 2; printed "<V–O> = 1.722 Å" in Table 5 vs true
  four-bond mean 1.731 Å, BVS = 4.81 v.u. in Table 6 on p. 214, which misplaces
  the "x2 down-arrow" multiplier onto V–O3 instead of V–O1) and 9-coordinated
  lone-pair-asymmetric PbO8(OH) polyhedra (Pb site at 4c: three short bonds
  Pb–OH = 2.370(9) Å and Pb–O1 = 2.471(7) Å x 2 with <Pb–Oshort> = 2.437 Å on one
  hemisphere, and six longer bonds Pb–O3 = 2.725(9) Å, Pb–O1 = 2.749(7) Å x 2,
  Pb–O2 = 2.801(10) Å, and Pb–O2 = 3.233(3) Å x 2 with <Pb–Olong> = 2.915 Å on the
  other, BVS = 2.01 v.u. in Table 6 on p. 214 and Section 7 on p. 215); Gandolfi
  MoKalpha powder XRD (Table 2, p. 211, and Section 6.1, p. 212) refines to a =
  7.599(12) Å, b = 6.118(10) Å, c = 9.394(15) Å, V = 436.7(10) Å3, with eight
  strongest lines [dobs in Å (Iobs; hkl)] at 3.230 (100; 210), 2.102 (69; 123),
  1.660 (55; 133, 323), 5.115 (53; 011), 2.887 (46; 103), 2.612 (46; 113), 2.651
  (43; 212), and 2.303 (42; 221). Distinct from gottlobite, descloizite,
  mottramite, cechite, and elemental vanadium, magnesium, or lead; no criticality
  designation for plumbogottlobite itself, no microbial or biological mechanism,
  and no industrial recovery yield are asserted.
