        node_type: CHEMICAL_ENTITY
        description: Biogenic sulfide generated in anaerobic modified TOR-39 medium at 65 C reacted with soluble CdCl2 dosed at 0.4 mM/day over 10 days (after 24 h pre-growth; separate total nominal Cd doses of 4.45 or 8.90 mM).
        protein_grounding_status: NOT_APPLICABLE
      - id: mixed_cds_with_hexagonal_greenockite_component
        label: Mixed extracellular CdS nanoparticles with hexagonal greenockite-assigned component alongside cubic hawleyite
        node_type: MATERIAL_OR_PHASE
        description: Washed extracellular CdS precipitate from thiosulfate- or sulfite-fed Thermoanaerobacter sp. X513 cultures in which XRD and HRTEM/FFT assign a hexagonal greenockite component emerging after an initial cubic hawleyite product and increasing in relative abundance through 240 h (Figures 1 and 4), whereas cysteine-fed X513, Desulfovibrio G20-sulfate, and Na2S abiotic references yielded only cubic CdS; includes unresolved printed d(002) = 0.672 nm vs Handbook c = 0.6713 nm (d002 ~ 0.3357 nm) and 28.1-degree (102) label discrepancies.
