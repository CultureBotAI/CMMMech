id: cmmmech:metatorbernite
name: Metatorbernite
material_kind: mineral
description: Metatorbernite is the copper uranyl phosphate mineral Cu(UO2)2(PO4)2(H2O)4·4H2O in the September
  2026 IMA list, with grandfathered status G. The year 1916 is a historical description year, not a numbered
  IMA approval. Its ideal eight-water composition is distinct from twelve-water torbernite, arsenate metazeunerite,
  calcium meta-autunite, uranyl ions and elemental uranium or copper. Locock and Burns grew synthetic
  metatorbernite in copper-bearing silica gel at room temperature over three weeks and refined an epoxy-coated,
  merohedrally twinned crystal in P4/n. Its 88.3(6)% fitted copper-site occupancy and constrained hydrogen
  model are specimen-specific; proposed oxonium charge compensation was not directly established. The
  2023 natural Cornwall crystal instead gave the preferred P4/nmm model with a smaller c repeat. These
  are source-specific structural models, not grounds to replace all specimens with one symmetry or transfer
  occupancy between them. Thermal behavior below is abiotic laboratory evidence; neither criticality nor
  microbial extraction, isolated-product recovery or industrial deployment is inferred.
