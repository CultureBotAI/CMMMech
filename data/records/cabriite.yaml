id: cmmmech:cabriite
name: Cabriite
material_kind: mineral
description: 'Palladium-copper-tin intermetallic mineral with current September 2026 IMA-CNMNC
  approved formula Pd2CuSn (written Pd2SnCu in the original paper), status A, and approval
  number IMA 1981-057. Evstigneeva and Genkin (1983) described the type polished sections
  (deposited in the Mineralogical Museum of the Academy of Sciences of the USSR, the Mineralogical
  Museum of IGEM, Moscow, and the National Mineral Collection at the Geological Survey of
  Canada, Ottawa) from massive mooihoekite-, putoranite-, and talnakhite-type Cu-Ni sulfide
  ores of the Oktyabr''sk deposit, Noril''sk district, Krasnoyarsk Krai, Russia (USSR), where
  it forms grains up to 200 um (and intergrowths up to 4 mm with polarite, sperrylite, paolovite,
  sobolevskite, froodite, cassiterite, stannite, galena, sphalerite, and native silver). Cameca
  MS-46 and MAC-400 electron-microprobe analyses of 6 natural grains (Table 2, p. 482) yielded:
  Analysis 1 (Sb-bearing): Pd 55.5, Sn 27.5, Cu 16.0, Sb 2.2, total 101.2 wt%, empirical formula
  Pd2.04(Sn0.91Sb0.07)Sigma0.98Cu0.98; Analysis 4 (X-rayed Pt-bearing grain): Pd 49.5, Pt
  7.1, Sn 29.2, Cu 15.2, total 101.0 wt%, empirical formula (Pd1.88Pt0.15)Sigma2.03Sn1.00Cu0.97;
  and Analysis 6: Pd 52.1, Pt 2.6, Sn 30.0, Cu 16.2, total 100.9 wt%, empirical formula (Pd1.94Pt0.05)Sigma1.99Sn1.00Cu1.01
  (with overall ranges across the 6 natural analyses of Pd 49.5-55.5, Pt 0-7.1, Ag 0-1.15,
  Sn 27.5-30.0, Sb 0-2.2, Cu 15.2-16.2 wt%). Gandolfi 57.3-mm powder X-ray diffraction on
  both natural grain 4 and synthetic Pd2SnCu annealed at 400 degrees C for 100 hours (Table
  3, pp. 484-485) indexed on an orthorhombic Pmmm unit cell with a = b = 7.88(5), c = 3.94(2)
  A, Z = 4, Dcalc = 10.7 g/cm3 (ideal Pd2SnCu) and 11.1 g/cm3 (Pt-bearing grain 4), micro-indentation
  hardness VHN50 = 258-282 kg/mm2 (mean 272 kg/mm2), representing an ordered 2a x 2a x a superstructure
  (structural variant 5, Table 4, p. 486) derived below 200 degrees C from a cubic Cu3Au-type
  (Pd,Cu)3Sn subcell (Pm3m, a = 3.89 A). Distinct from paolovite (Pd2Sn), atokite ((Pd,Pt)3Sn),
  taimyrite ((Pd,Cu,Pt)3Sn), stannopalladinite, and elemental palladium, platinum, tin, or
  copper; no criticality designation, microbial mechanism, or industrial recovery yield is
  asserted.'
