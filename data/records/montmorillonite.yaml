mechanisms:
- id: mr1_humic_swy2_reduction
  name: Humic-associated enhancement of iron reduction in SWy-2 suspensions containing MR-1
  process: redox_transformation
  microbial: true
  organisms:
  - id: NCBITaxon:211586
    label: Shewanella oneidensis MR-1
  description: Liu2017 observed increasing operational total iron(II) in montmorillonite SWy-2 suspensions
    containing washed Shewanella oneidensis MR-1 cells. Added humic acids increased iron(II) relative
    to live suspensions without added humic acid. The result supports a conditional culture-associated
    reduction phenotype and humic enhancement; it does not establish that every reduced iron atom came
    from the montmorillonite lattice, that the sterile controls for a different clay apply here, or that
    a dissolved iron product was recovered. The separate nontronite assays do not establish SWy-2 illite,
    silica or siderite production.
  context: The source identifies SWy-2 from the Clay Minerals Society Source Clays Repository as montmorillonite
    and gives a structural composition, but does not provide a quantitative accessory-phase analysis of
    the experimental fraction. Bulk material was ground, soaked in 0.01 M NaCl for 24 hours, size-fractionated
    to 0.5–2.0 micrometres by centrifugation, washed until the AgNO3 chloride test was negative, freeze-dried
    and ground. MR-1, reported as ATCC 700550, was grown overnight in tryptic soy broth at 30 degrees
    C, harvested, washed and resuspended in sterile 10 mM PIPES, then held anaerobically. Basic assays
    used 50 mL serum bottles with 30 mL deoxygenated 10 mM PIPES, 0.03 g SWy-2, 3 mg KCl and 10–200 mg/L
    Aldrich, Suwannee River or Elliott soil humic acid, inoculated to approximately 10^8 cells/mL and
    shaken at 30 degrees C in darkness. Figure 1d–f spans up to 120 hours. The reduction-assay electron
    donor and PIPES pH are not explicitly stated in the inspected original or supplement; pH 7 used for
    a separate stock/model is not assigned to this assay. Figure 2b additionally labels 1, 5 and 10 g/L
    SWy-2 arms, although the Methods sentence introducing the expanded loading series names only NAu-2.
    This is laboratory iron redox chemistry, not demonstrated industrial extraction or microbial growth
    yield.
  evidence:
  - source_ref: liu_2017
    supports: support
    explanation: Figure 1d–f and Results pp.2–3 show total iron(II) time courses for SWy-2 with each humic-acid
      type and concentration, including live zero-humic-acid comparisons. Figure 2b separately varies
      SWy-2 loading with and without Elliott soil humic acid. Error bars represent SD for n=3; the Methods
      says experiments were performed at least three times. Total and dissolved iron(II) used the cited
      phenanthroline assay. These operational iron fractions are not synonymous with isolated dissolved-metal
      recovery or a phase-specific extraction mass balance.
  - source_ref: liu_2017_si
    supports: support
    explanation: Figure S1c/d reports initial reduction rates and reduction extents for SWy-2. Figure
      S6 directly shows ethylene-glycolated SWy-2 XRD before exposure and after reduction without or with
      Elliott soil humic acid. Changes in diffraction support alteration of the processed clay, but neither
      a refined phase inventory nor complete conversion to a pure product is supplied. No numerical values
      were digitized from these plots.
  - source_ref: liu_2017_si
    supports: partial
    explanation: The explicit sterile comparison in Figure S5b concerns NAu-2, not SWy-2. No matched sterile
      SWy-2 time course is presented in the inspected main or supplement. Zero-humic-acid SWy-2 arms still
      contain MR-1 and therefore are not abiotic controls. NAu-2-specific humic fractionation, electrochemical
      activity, Fe(II)-complexation experiments and dissolved-versus-solid-associated partitions cannot
      independently prove those mechanisms for SWy-2. Humic abiotic reducing capacity and accessory-iron
      contributions are not excluded by the accepted SWy-2 comparisons.
  - source_ref: liu_2017
    supports: partial
    explanation: The detailed microscopy and assignments of illite, silica and tentative siderite in Figure
      6 and supplementary Figures S7–S10 concern NAu-2. Their products and molecular interpretation are
      not transferred to this montmorillonite record. Added KCl also prevents interpreting any potassium
      in a possible product as wholly released from SWy-2. The two mineral records share this publication
      lineage and are not independent replication of one experiment.
  - source_ref: ncbi_mr1
    supports: context_only
    explanation: Taxon 211586 resolves the named MR-1 strain. The taxonomy entry supports organism identity,
      not the mineral transformation or independent verification of the culture stock.
