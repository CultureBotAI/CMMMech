mechanisms:
  - id: gb1_manganese_oxidation
    name: Mn(II) and complexed Mn(III) oxidation by Pseudomonas putida GB-1
    process: redox_transformation
    microbial: true
    organisms:
      - id: NCBITaxon:76869
        label: Pseudomonas putida GB-1
    description: >-
      Growing GB-1 cultures converted defined soluble Mn substrates to
      filter-retained oxidized Mn. Mn(III)-citrate and Mn(III)-desferrioxamine B
      (DFOB) supported oxide accumulation, with lower and slower accumulation
      from the strongly complexed DFOB substrate.
    context: >-
      Laboratory triplicates used 5 mL Minimal Media A with HEPES at pH 7.8,
      30 degrees C, darkness, and 100 micromolar Mn supplied as MnCl2,
      Mn(III)-citrate, or Mn(III)-DFOB. Sterile medium and a GB-1 triple Mn-oxidase
      knockout were negative controls. Table 4 reports final GB-1 particulate
      oxide concentrations of 79.8 +/- 2.0 micromolar after 96 h from Mn(II), and
      54.3 +/- 2.9 micromolar after 168 h from Mn(III)-DFOB. The table does not
      define the reported error statistic. These are LBB oxidizing
      equivalents calculated assuming particulate MnO2, not identification of a
      crystalline mineral or recovery of a purified product. No industrial
      extraction or recovery operation was tested.
    evidence:
      - source_ref: wright2018
        supports: support
        explanation: >-
          Culture conditions, Mn(III)-L oxidation methods, Fig. 1 and Table 4
          support these assays. Mutants retaining MnxG or McoA oxidized Mn(III)
          complexes; this is genetic support, not purified-enzyme evidence.
      - source_ref: wright2018
        supports: partial
        explanation: >-
          Fig. 3 and Discussion show abiotic Mn(III)-DFOB formation, so its
          accumulation alone is not proof of microbial oxidation. MopA activity
          was limited in darkness; the discussion reports stronger activity in
          light in separate KG_mopA cell-free-extract experiments. These findings limit universal enzyme
          and environmental extrapolation.
