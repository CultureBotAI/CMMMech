  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: klug_2026
  title: Klug et al. (2026). Bioleaching of olivine and enstatite with formation of Mg-oxalate mediated by engineered Gluconobacter oxydans. Scientific Reports 16:25317. DOI 10.1038/s41598-026-63817-0; Methods, Figures 2-6 and Discussion.
  url: https://doi.org/10.1038/s41598-026-63817-0
  accessed_on: '2026-10-11'
