id: cmmmech:phosphoferrite
name: Phosphoferrite
material_kind: mineral
description: Phosphoferrite is the ferrous phosphate mineral with ideal formula Fe2+3(PO4)2(H2O)3. The
  September 2026 IMA list records redefined status under the 1980 special procedure. It is distinct from
  the more hydrated species vivianite and ludlamite, the Mn-dominant related mineral reddingite, and ferric
  kryzhanovskite. The historical Hagendorf Sud specimen studied by Moore (1971) contained Mn and Ca and
  was not a pure synthetic Fe endmember. Laboratory heating produced a source-reported ferric crystalline
  product with diffraction similarities to the starting material. Later structural work by Moore, Araki
  and Kampf (1980) corrected substantial indexing and unit-cell errors in the earlier natural kryzhanovskite
  comparison; this record therefore retains the limited heating observation without treating the earlier
  cell dimensions, exact structural model or pure-product identity as established. These are abiotic laboratory
  observations, not microbial extraction or demonstrated industrial recovery. No criticality designation
  is inherited from iron or phosphorus.
