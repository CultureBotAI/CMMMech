  evidence:
  - source_ref: kondo_2024
    supports: support
    explanation: Sections 2.1-2.5, Figures 1-4 and Section 3 support the specific mixed-feed culture assays and their reported dissolved-metal outcomes. Figure 2 shows nonmonotonic carbon-dose effects and rising pH in carbon arms; Figure 4 shows similar later copper trajectories, unequal iron additions and the intervening pH change. These are two linked culture stages, not universal operating optima. Figure 3 derives rates from Figure 2 and is not an independent kinetic experiment.
  - source_ref: kondo_2024
    supports: partial
    explanation: Figures 5-6 and Section 3.2 show As/Fe/O/S/Sb-bearing secondary particles and declining relative tennantite diffraction peaks. They do not independently identify a pure ferric-arsenate or scorodite product, quantify phase-specific dissolution, or demonstrate long-term arsenic stability. Reported final dissolved arsenic is about 4% in the 0.01% carbon flask and 15% in both reactors, not an isolated arsenic recovery yield. The proposed ferric-arsenate/basic-ferric-sulfate association remains tentative. Iron percentages are especially difficult to interpret after unequal external iron additions. Terminal community dominance and separate tolerance tests in Table 1 cannot establish that selection caused every change in leaching.
  - source_ref: ncbi_sulfobacillus
    supports: context_only
    explanation: Resolves the species label and type-strain aliases for the reported member; it does not verify the stock used or resolve the other consortium members and source naming discrepancy.
