id: cmmmech:ion-adsorption-rare-earth-leach-residue
name: Ion-adsorption rare-earth leach residue
material_kind: secondary_resource
description: A processed, mixed mineral residue remaining after ammonium-sulfate extraction of ion-exchangeable rare earths from weathered ion-adsorption ore. Zhang and colleagues (2024) prepared the studied material in the laboratory from Guangdong, China ore; this is not evidence of sampling an industrial tailings deposit. It is distinct from the natural ion-adsorption rare-earth clay feed, individual mineral species and isolated rare-earth products. The preparation included repeated salt leaching, rinsing, 60-mesh sieving, drying and crushing. The authors' ion-unexchangeable designation is operational, referring to the rare earths remaining after that pretreatment. It does not mean resistance to every subsequent extractant. The experimental feed contains mainly kaolinite, quartz, orthoclase and muscovite, with minor Fe-bearing and rare-earth-bearing phases. Its composition is not a universal tailings specification, and no criticality designation is inherited from its constituent elements.
sources:
- id: zhang2024
  title: Zhang J, Li P, Guan X and colleagues (2024). Bioleaching ion-unexchangeable rare earth in ion-adsorption type rare earth waste tailing. Separation and Purification Technology 348, 127691. DOI 10.1016/j.seppur.2024.127691. Complete nine-page accepted manuscript supplied by OSTI record 2479444; Methods 2.2.1-2.2.6, Results 3.1-3.5, Figures 1-5 and Table 1 inspected.
  url: https://doi.org/10.1016/j.seppur.2024.127691
  accessed_on: '2026-10-12'
- id: zhang2024_repository
  title: OSTI 2479444 public accepted manuscript of Zhang and colleagues, matched by title, authors, DOI and publisher metadata. The OSTI April 2024 date and PNNL December 2024 posting differ from the journal's November 2024 issue; these do not identify new experiments.
  url: https://www.osti.gov/servlets/purl/2479444
  accessed_on: '2026-10-12'
- id: zhang2024_supplement
  title: Zhang and colleagues (2024), original Elsevier supplementary DOCX for PII S1383586624014308. Matching article title and all authors; Parts 1.1-1.3, Figures S1-S7 and Tables S1-S6 inspected through original XML, tables, embedded graphics and a local PDF rendering.
  url: https://ars.els-cdn.com/content/image/1-s2.0-S1383586624014308-mmc1.docx
  accessed_on: '2026-10-12'
- id: ncbi_aspergillus_niger
  title: NCBI Taxonomy 5061, Aspergillus niger, current species-level identity. This does not authenticate the experimental CGMCC3.739 strain or establish its sequence identity.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=5061&mode=Info
  accessed_on: '2026-10-12'
mechanisms:
- id: fungal_culture_and_filtrate_bioleaching
  name: Fungal culture and metabolite-filtrate-associated rare-earth leaching
  process: bioleaching
  description: Aspergillus niger culture and a separately produced culture filtrate were used to mobilize rare earths remaining in the pretreated residue. Measured organic acids and acidification support an acid-associated leaching interpretation. The proposed contributions of proton attack, carboxylate complexation and Fe-bearing phase dissolution are not individually established by matched biological controls. Chemical citric-acid experiments provide separate mechanistic context; they are not an independent microbial replication. Solution release and post-leach salt desorption do not establish an isolated rare-earth product or industrial recovery.
  context: The source reports A. niger CGMCC3.739 supplied through BJMCC, without strain sequence authentication. Freeze-dried material was grown on PDA at 301 K for six days; a second generation was grown in PDB for five days as inoculum. Five mL fungal suspension was added to 150 mL PDB containing 20 g/L dextrose, 5 g/L potato powder and 0.1 g/L chloromycetin, initially pH 5.8-6.2. The one-step arm combined fungal cultivation and solid leaching at 301 K and 220 rpm. The two-step arm first cultivated the fungus until nutrient depletion and minimum pH, then used the filtrate for leaching; filtration cutoff and verified absence of cells are not stated. The text reports leaching outcomes after 20 days, while the separate Figure 4a pH trajectory is plotted in hours and does not span that entire duration. Solid loading and leachant volume are not clearly specified for the biological arms separately; chemical-batch loadings must not be transferred to them. A sterile PDB control without a sample
    is described, which is not a matched uninoculated medium-plus-solid control. Replicate counts and the meaning of the plotted error bars are not stated.
  microbial: true
