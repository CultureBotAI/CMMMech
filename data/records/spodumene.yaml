mechanisms:
- id: acidophile-spodumene-leaching-limit
  name: No material lithium-leaching enhancement from the tested spodumene-bearing feed
  process: bioleaching
  description: Living culture reported as Acidithiobacillus ferrooxidans did not materially improve the rate or extent of lithium release from a spodumene-bearing sample relative to uninoculated acidic medium in the reported laboratory comparison. This is a condition-specific unsuccessful enhancement test, not evidence that every microbial process on spodumene is ineffective. More solution iron in the inoculated arm does not demonstrate greater lithium extraction, and no purified lithium product was recovered.
  context: Kirk et al. used Bikita, Zimbabwe material containing alpha-spodumene and quartz by XRD. The ore-derived in-lab culture was reported without a strain accession; the species identifier normalizes the name, not independently authenticating the culture. Stock cultures contained ferrous sulfate, and the paper acknowledges growth-medium iron carryover. Powdered feed was prepared by grinding to approximately 0.5 micrometre. Methods specify 2 g powder in 190 mL basal medium plus 10 mL inoculum, but call this 2% w/v; the amounts instead imply 1% w/v. Biotic treatments were triplicate, static at 23 degrees C for 30 days, initially pH 1.8, with uninoculated basal-medium and sulfuric-acid-only comparisons. Spodumene pH reportedly remained at 1.8 without later acid additions. ICP-OES measured the centrifuged supernatant, not an isolated product. Figure captions describe 2500 microlitres of sulfuric acid for chemical leaching, while Methods specify 0.29 mL of 5.5 M acid for initial 200 mL
    treatments; the inconsistency prevents assuming an unambiguous acid-matched comparison.
  microbial: true
  organisms:
  - id: NCBITaxon:920
    label: Acidithiobacillus ferrooxidans
  protein_examples:
