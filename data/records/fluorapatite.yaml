mechanisms:
- id: brown_rot_surface_transformation
  name: Culture-associated calcium oxalate formation on a fluorapatite crystal
  process: biomineralization
  description: Brown-rot fungal cultures on a source-identified fluorapatite crystal produced surface material assigned to calcium oxalate monohydrate, whewellite. Serpula himantioides LE-BIN 1368, Coniophora puteana LE-BIN 1370 and source-named Antrodia xantha LE-BIN 1029 have powder-diffraction as well as microscopy assignments; the Serpula lacrymans LE-BIN 1192 comparison relies on microscopy. This supports laboratory surface biomineralization without quantifying fluorapatite dissolution, phosphorus or fluorine mobilization, or an isolated recovered product.
  context: Table 3 identifies a Cl-bearing fluorapatite crystal from the Slyudyanka mineral deposit in the Irkutsk region, with Cl approximately 1.17 wt% and formula Ca5(PO4)3(F,Cl). This source-assigned substituted specimen is not a pure fluorapatite endmember or bulk phosphate ore. The listed agar propagation medium contains CaCl2 and phosphate salts; the liquid formulation is not separately tabulated. Without a no-mineral calcium balance, the calcium in the new crystals cannot be assigned exclusively to dissolution of the substrate. Methods 2.2 describes approximately 1 x 0.5 x 0.5 cm blocks in plastic Petri dishes with 20 mL liquid glucose-peptone medium, initial pH 5.5, room temperature and 30 days, in triplicate. Mycelial fragments came from ten-day cultures on glucose-peptone agar. Inoculum amount, substrate sterilization and a separate complete liquid-medium formulation are not specified. The paper names Antrodia xantha; current NCBI taxonomy and its cited ribosomal accession use
    Amyloporia xantha for LE-BIN 1029. The organisms list includes the tested comparator S. lacrymans; it does not assert identical mineral formation by every listed culture.
  microbial: true
  organisms:
  - id: NCBITaxon:80602
    label: Serpula himantioides
  - id: NCBITaxon:80637
    label: Coniophora puteana
  - id: NCBITaxon:85982
    label: Serpula lacrymans
  - id: NCBITaxon:1333629
    label: Amyloporia xantha
  evidence:
  - source_ref: vlasov2023
    supports: support
    explanation: Table 4 lists whewellite by SEM/EDX and PXRD for S. himantioides at pH 2, C. puteana at pH 3 and source-named A. xantha at pH 3.5. Figure 3b is the selected S. himantioides product pattern, with underlying-substrate reflections also present; Figure 4b shows its source-assigned whewellite aggregates. These data support the authors' surface-product phase assignment rather than a phosphorus release measurement.
  - source_ref: vlasov2023
    supports: partial
    explanation: For S. lacrymans at pH 5.5, Table 4 reports whewellite by SEM/EDX but a dash for PXRD. Section 3.2.2 and Figure 5c describe a small amount of crystals with microscopy-only identification; this is not equivalent to the diffraction-confirmed arms. No fluorapatite-specific uninoculated product pattern, phosphate or fluoride balance, or quantitative sterile-control comparison is supplied. Calcium-containing medium and possible carryover from agar remain alternative calcium sources.
  - source_ref: vlasov2023
    supports: partial
    explanation: Methods states that fungus-free controls were performed, but the selected mineral-arm results do not provide a matched pH-control series or a quantitative inoculated-versus-uninoculated phase balance. No killed-biomass or cell-free-metabolite comparison isolates a necessary causal step. Oxalate secretion is the proposed explanation, without an arm-specific oxalate time course or molecular intervention in this study. PXRD methods are referred to earlier papers; the displayed patterns include substrate peaks. Culture association and source-assigned phases do not establish quantitative microbial enhancement, complete feed consumption or industrial use.
  - source_ref: vlasov2023
    supports: context_only
    explanation: This is one arm of Vlasov et al. (2023), also represented by the humboldtine record and separately curated mineral-feed owners. The shared paper, its XML/PDF and the different material views are not independent replications. Its comparison with earlier Aspergillus niger studies uses different protocols and does not establish superior extraction rates for the present cultures. The natural adit observations concern calcium oxalates on wood/carbonate rock; they do not establish field deployment of this particular feed transformation.
  - source_ref: ima_2026_09
    supports: context_only
    explanation: The authority establishes the mineral species name and formula, not the purity, valence, hydration or transformation behavior of the specific experimental material.
  - source_ref: ncbi_fungal_taxonomy
    supports: context_only
    explanation: Species taxonomy verifies identifiers and current names. A species TaxID does not identify the experimental strain or demonstrate its mineral-transforming phenotype.
  - source_ref: genbank_ky352492_1
    supports: context_only
    explanation: The deposited sequence carries the Serpula himantioides LE-BIN 1368 source label cited by the paper. This label/sequence match is not independent authentication of the experimental culture or direct evidence for the mechanism.
  - source_ref: genbank_ky433978_1
    supports: context_only
    explanation: The deposited sequence carries the Coniophora puteana LE-BIN 1370 source label cited by the paper. This label/sequence match is not independent authentication of the experimental culture or direct evidence for the mechanism.
  - source_ref: genbank_ky352493_1
    supports: context_only
    explanation: The deposited sequence carries the Serpula lacrymans LE-BIN 1192 source label cited by the paper. This label/sequence match is not independent authentication of the experimental culture or direct evidence for the mechanism.
  - source_ref: genbank_ky433983_1
    supports: context_only
    explanation: The deposited sequence carries the Amyloporia xantha LE-BIN 1029 source label cited by the paper. This label/sequence match is not independent authentication of the experimental culture or direct evidence for the mechanism.
causal_graphs:
- id: brown_rot_fluorapatite_calcium_oxalate_graph
  name: Brown-rot fungal surface transformation of Slyudyanka fluorapatite to whewellite
  description: Causal pathway linking organic-acid excretion by brown-rot basidiomycetes (Serpula himantioides LE-BIN 1368, Coniophora puteana LE-BIN 1370, Amyloporia xantha LE-BIN 1029, and comparator Serpula lacrymans LE-BIN 1192) to surface alteration of Cl-bearing Slyudyanka fluorapatite and crystallization of whewellite.
  scope: RECORD_SPECIFIC_MECHANISM
  mechanism_ref: brown_rot_surface_transformation
  nodes:
  - id: brown_rot_oxalate_secretion_pathway
    label: Brown-rot basidiomycete organic-acid / oxalate secretion pathway
    node_type: GENE_OR_PROTEIN
    description: Enzymatic oxalate biosynthesis and efflux pathways in Serpula himantioides LE-BIN 1368, Coniophora puteana LE-BIN 1370, and Amyloporia xantha LE-BIN 1029; marked UNGROUNDED because Vlasov et al. (2023) performed comparative mineralogical assays without gene or protein characterization.
    protein_grounding_status: UNGROUNDED
  - id: brown_rot_secreted_oxalic_acid
    label: Secreted fungal organic acids in glucose-peptone medium (pH 2.0-5.5)
    node_type: CHEMICAL_ENTITY
    description: Extracellular oxalic and organic acids lowering liquid glucose-peptone medium pH to 2.0-3.5 in diffraction-confirmed arms.
    protein_grounding_status: NOT_APPLICABLE
  - id: slyudyanka_fluorapatite_substrate
    label: Cl-bearing Slyudyanka fluorapatite crystal block (Ca5(PO4)3(F,Cl), ~1.17 wt% Cl)
    node_type: MATERIAL_OR_PHASE
    description: Substituted fluorapatite crystal (~1 x 0.5 x 0.5 cm) from the Slyudyanka deposit incubated for 30 days in 20 mL glucose-peptone medium.
    protein_grounding_status: NOT_APPLICABLE
  - id: whewellite_surface_crystals
    label: Whewellite (CaC2O4·H2O) surface crystal aggregates
    node_type: MATERIAL_OR_PHASE
    description: Surface calcium oxalate monohydrate (whewellite) assigned by PXRD and SEM/EDX in S. himantioides, C. puteana, and A. xantha cultures (microscopy-only at pH 5.5 in S. lacrymans).
    protein_grounding_status: NOT_APPLICABLE
  edges:
  - source: brown_rot_oxalate_secretion_pathway
    target: brown_rot_secreted_oxalic_acid
    predicate: produces
    relationship: organism-dependent organic-acid excretion and medium acidification
    description: Brown-rot fungi acidify the liquid glucose-peptone medium and excrete oxalate metabolites.
    evidence:
    - source_ref: vlasov2023
      supports: partial
      explanation: Table 4 in Vlasov et al. (2023) reports medium acidification to pH 2.0 (S. himantioides), pH 3.0 (C. puteana), and pH 3.5 (A. xantha) on fluorapatite, while oxalate secretion is inferred without a direct metabolite assay.
  - source: brown_rot_secreted_oxalic_acid
    target: slyudyanka_fluorapatite_substrate
    predicate: dissolves
    relationship: acidolysis and oxalate attack on mineral substrate surface
    description: Secreted fungal organic acids dissolve cations from the mineral block surface.
    evidence:
    - source_ref: vlasov2023
      supports: partial
      explanation: Vlasov et al. (2023) propose fungal organic-acid dissolution of the fluorapatite crystal surface to supply calcium for oxalate crystallization (without a separate medium-calcium mass balance).
  - source: slyudyanka_fluorapatite_substrate
    target: whewellite_surface_crystals
    predicate: transforms_into
    relationship: crystallization of secondary surface oxalate biominerals
    description: Released metal cations precipitate with fungal oxalate as surface biomineral crystals.
    evidence:
    - source_ref: vlasov2023
      supports: support
      explanation: Table 4 and Figures 3b and 4b in Vlasov et al. (2023) identify whewellite by PXRD and SEM/EDX for S. himantioides, C. puteana, and A. xantha.
