  evidence:
  - source_ref: topolska_2014
    supports: support
    explanation: 'Experimental methods, Table 2, Figure 4 and Table 3: after 305 h, filtered-solution Pb in MP- was 13.5 +/- 0.37 micromolar with bacteria versus 1.47 +/- 0.16 micromolar without; MP+ values were 3.66 +/- 0.31 and 1.15 +/- 0.07 micromolar, respectively. Errors are reported standard deviations of triplicates. These are solution concentrations, not extraction percentages or isolated-product yields. Figure 2 also shows limited growth when pyromorphite supplies phosphate, with no growth in the no-phosphate/no-mineral control.'
  - source_ref: topolska_2014
    supports: partial
    explanation: 'Solution analysis, cell-bound Pb method and Results E.II: the separate 100 h MP+ acid-digestion comparison assigned 13.6 +/- 0.4 micromolar Pb to cells, reported as 94% of total Pb released in that comparison. That fraction is not the 305 h filtered-solution result or a 94% mineral-recovery yield. Sorption could be reversible; no long-term permanence is demonstrated.'
  - source_ref: topolska_2014
    supports: partial
    explanation: 'Discussion, Microbially enhanced Pb remobilization: pH was not held equal across biotic and abiotic arms. The authors argue that the observed pH range is insufficient to explain the Pb difference but explicitly do not completely exclude its contribution. Unmeasured metabolites, P uptake and binding are proposed contributors; acidification, a named enzyme or a unique chelation mechanism is not established.'
  - source_ref: kato_2022
    supports: context_only
    explanation: Results 2.3 and Figures 6-7 report pyromorphite/hydrocerussite associated with a different isolate, Pseudomonas sp. KKY-29, exposed to lead acetate. This distinct deposition experiment does not contradict Topolska's dissolution result under different substrate and nutrient conditions, or establish permanent immobilization. Kato's Results 2.6 and Discussion reverse the phosphate-condition phase assignments, and biomass/phosphate units are inconsistent; those assignments, removal percentages and proposed phosphate-metabolism causality are not transferred here.
