  evidence:
  - source_ref: wang2019
    supports: support
    explanation: Methods 2.2–2.4, Figures 1–3 and Discussion p. 139 support conditional culture-associated solubilization. The combined culture/substrate arm reached source-reported 97.1% after seven days and final pH 1.65. Equation 4 defines efficiency as aqueous Cr quantity divided by initial sludge Cr quantity, multiplied by 100; this is dissolved extraction, not isolated product recovery. Figure 3 shows much smaller release in uninoculated substrate-added sludge and near-zero release in the no-substrate comparisons. The single-culture/substrate arms are lower than the combined treatment under these conditions.
  - source_ref: wang2019
    supports: partial
    explanation: Uninoculated sludge is not demonstrated sterile; Discussion p. 139 explicitly allows indigenous organisms. Single-culture treatments differ in substrate chemistry from the combined treatment, and no matched-pH acid-only comparison isolates a biological contribution beyond acid generation. Lower pH, higher ORP, falling Fe(II) and increasing sulfate are consistent with the proposed indirect mechanism but do not establish individual species causality, population succession, chromium valence changes or organic-matter breakdown. Figure 4 regressions are associations rather than independent mechanistic proof.
  - source_ref: wang2019
    supports: partial
    explanation: 'Source inconsistencies remain unresolved: inoculum 15% in Methods versus 10% in figure captions; acclimatization labels 4 g/L Fe2+ whereas the batch recipe specifies 4 g/L FeSO4. Section 3.2 says sulfate remained unchanged in uninoculated treatments, but Figure 2b shows an increase in the Fe2+ plus sulfur arm and Discussion acknowledges a slight increase. These statements are not silently harmonized or used to reconstruct exact reagent chemistry.'
  - source_ref: wang2019
    supports: partial
    explanation: 'The reported residual sludge value 531 mg/kg and initial 15.890 g/kg dry weight do not yield 97.1% by simple unchanged-solid-mass subtraction. The paper uses an aqueous-inventory denominator and does not provide a complete solid-mass/sampling balance to reconcile the endpoints. The source-reported values remain separate qualified quantities. Its agricultural/landfill suitability conclusion is not adopted: no independent regulatory applicability check, complete toxicity assessment, isolated product or industrial deployment is established.'
  - source_ref: ncbi920
    supports: context_only
    explanation: The current official entry verifies the species identifier/label, not CGMCC NO.0727 stock identity, culture purity or experimental sequencing.
  - source_ref: ncbi930
    supports: context_only
    explanation: The current official entry verifies the species identifier/label, not CGMCC NO.0759 stock identity, culture purity or experimental sequencing.
causal_graphs:
- id: xiamen_acidophile_associated_chromium_leaching_graph
  name: Acidithiobacillus thiooxidans and Acidithiobacillus ferrooxidans S0/Fe2+-supplemented bioleaching of chromium from tannery sludge
  description: Causal pathway linking representative Acidithiobacillus thiooxidans and Acidithiobacillus ferrooxidans reduced-sulfur oxidation enzymes Sqr/Sqor and Tth to sulfuric-acid production (from 2 g/L S0, alongside Fe2+ bio-oxidation from 2 g/L Fe2+), lowering tannery-sludge pH from 7.62 to ~1.8-2.0 with ORP > +600 mV and solubilizing 94.8% Cr over 6-7 days.
  scope: REPRESENTATIVE_EXAMPLE
  mechanism_ref: xiamen_acidophile_associated_chromium_leaching
  nodes:
  - id: sqr_reductase
