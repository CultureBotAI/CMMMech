  evidence:
  - source_ref: song2018
    supports: support
    explanation: Sections 3.1-3.2 and Figures 1-3 show Fe(II) oxidation and precipitate formation in both arms. Broad XRD features were assigned to the schwertmannite reference pattern 47-1775; the authors report no other characteristic peaks. This supports the stated phase assignment but does not quantify amorphous impurities or establish absolute product purity. Biological material had a rough, spiny aggregate morphology, contrasting with smoother chemical particles.
  - source_ref: song2018
    supports: partial
    explanation: 'Section 3.1 and Figure 1 report total-Fe precipitation of 35.0% in the biological arm and 47.9% in the chemical arm after 60 hours. These percentages quantify dissolved total-Fe loss relative to initial dissolved total Fe; they are not isolated mineral-mass or elemental-metal recovery yields. Matching the average oxidation rate did not match every time point: at 12 hours Fe(II) oxidation was 11.0% biologically and 18.4% chemically. The H2O2 comparator changes oxidant chemistry and does not isolate an exclusive enzymatic or extracellular-polymer cause of precipitation.'
  - source_ref: song2018
    supports: context_only
    explanation: 'Sections 2.2.2 and 3.3 and Figure 4 test a downstream property of the collected materials: 25 mg solid in 100 mL solution initially containing 0-30 mg/L As(III), adjusted to pH 7.5, at 28 degrees C and 180 rpm for four hours, in triplicate. The authors report saturation uptake of 117 mg/g for biological and 87 mg/g for chemical material. These are source-reported mass-normalized uptake values under this assay, not microbial arsenic extraction or universal capacities. Section 2.3 specifies total-As analysis of filtrates, so the experiment does not independently resolve arsenic redox speciation. It demonstrates neither isolated arsenic recovery nor a living-cell adsorption mechanism.'
  - source_ref: ncbi_ferrooxidans
    supports: context_only
    explanation: The current authority resolves the asserted species name and identifier. LX5 and CGMCC No. 0727 remain primary-source strain labels; the species node is not evidence of a strain-specific mechanism.
- id: lx5_eps_removal_perturbation
  name: Increased collected precipitate after extracellular-material removal
  process: biomineralization
  description: A separate experiment found more dried precipitate after centrifugation and removal of the cell supernatant than with conventional resting cells or centrifuged cells whose detached extracellular material was retained. This is evidence for a treatment-associated difference in biomineralization, with extracellular polymer inhibition proposed by the authors. It does not identify a specific polymer, enzyme or exclusive molecular cause.
  context: Section 2.2.3 compared conventional LX5 resting cells, cells centrifuged at 20,000 g for 20 minutes at 4 degrees C then resuspended with their supernatant, and similarly centrifuged cells whose supernatant was removed and replaced by the same volume of deionized water. Each treatment used 25 mL cell suspension plus 225 mL solution containing 11.12 g FeSO4.7H2O, with reported cell density approximately 6.0 x 10^6 cells/mL and initial pH 3.0, at 28 degrees C and 180 rpm for 72 hours. Solids were filtered through Whatman No. 4 paper, washed once and dried at 60 degrees C to constant mass. This is a separate assay from the 60-hour solution comparison.
