id: cmmmech:zirconolite
name: Zirconolite
material_kind: mineral
description: >-
  Zirconolite is a zirconium-bearing oxide mineral listed by IMA-CNMNC in
  September 2026 with formula (Ca,Y)Zr(Ti,Mg,Al)2O7 and redefined status.
  Its 1989 special-procedure entry is not a numbered new-mineral approval.
  CaZrTi2O7 is the simplified composition used in the cited nomenclature
  and natural-specimen study, not the measured formula of every grain.
  The IMA-approved nomenclature published by Bayliss et al. (1989) uses the
  unsuffixed name for metamict or undetermined-polytypoid material and
  distinguishes the 2M, 3T and 3O layered variants from cubic zirkelite.
  This record does not assign a particular polytypoid, space group or
  synthetic ceramic composition to an uncharacterized natural specimen.
  Bellatreccia et al. (1999) studied a natural polycrystalline aggregate
  collected at Jacupiranga, São Paulo, Brazil, from the locality historically
  associated with the name zirkelite. It was explicitly a different specimen
  from the historical type specimen. One hand-picked grain yielded no
  diffraction pattern after 48 hours in a Gandolfi camera; the authors
  assigned zirconolite using the metamict state and chemical composition.
  Three crystals examined by electron microscopy and electron microprobe
  showed oscillatory, sector or irregular compositional zoning. Their
  zirconium-bearing chemistry also included niobium, thorium, uranium,
  hafnium and rare-earth elements; this is specimen chemistry rather than
  a bulk resource grade. Table 3 separates new zirconolite analyses from
  the chemically distinct intergrown calzirtite. Point analyses and images
  support the natural occurrence, but no structure refinement of the
  unheated metamict specimen establishes a 2M identity. Historical
  heat-treated lattice parameters in Table 2 are reused from other studies,
  not newly measured natural-crystal structures in this investigation.
  The specimen's reported heavy-mineral sand provenance and carbonatitic
  chemical affinity do not resolve its original host rock unambiguously.
  Fine lamellae approach the microprobe spot size, so intermediate analyses
  can mix adjacent zones. The seven-oxygen cation formulae and inferred
  substitutions are calculations from chemistry, not direct site-occupancy
  or oxidation-state measurements. Figure 5 and Figure 6 captions disagree
  with plotted expressions or axis labels; no substitution regression is
  recalculated here. Tables 1-2 compile older data and do not add independent
  sampling. This identity and natural-specimen record makes no microbial
  mechanism, extraction yield, industrial deployment or inherited elemental
  criticality claim.
