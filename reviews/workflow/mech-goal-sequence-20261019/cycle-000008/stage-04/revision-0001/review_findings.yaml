findings:
- finding_id: cmmmech-cycle8-stage4-finding-0001
  issue_key: cmmmech.schwertmannite.lx5-eps-removal-perturbation-graph-inverted-node-ids
  review_id: 20261105T005507Z-schwertmannite-cycle8-stage4-record-review
  status: open
  severity: minor
  category: graph
  target_ids:
  - cmmmech:schwertmannite
  summary: 'In data/records/schwertmannite.yaml (cmmmech:schwertmannite, causal_graphs[1]
    lx5_eps_removal_perturbation_graph, lines 537-583), after Cycle 8 Stage 2 (PR #924, Issue
    #925) remediated nodes[2].label, nodes[2].description, nodes[3].label, and nodes[3].description
    to match Song et al. (2018, Materials 11(9):1739, DOI:10.3390/ma11091739, Section 3.4,
    Table 1, and Figures 5-7) — where 20,000 g centrifugal EPS removal leaves the 72 h Fe(II)
    oxidation trajectory unimpaired (Figure 5a) and increases 72 h dry schwertmannite precipitate
    mass from 0.89 g (conventional) and 0.96 g (EPS detached-but-retained) to 1.29 g (Figure
    5b) and BET surface area to 86.43 m2/g (Table 1) — nodes[2].id (attenuated_12_to_40h_ferrous_oxidation_flux,
    line 537) and nodes[3].id (reduced_12_to_40h_schwertmannite_precipitate_yield, line 542)
    and their references in edges[2].target (line 567), edges[3].source (line 575), and edges[3].target
    (line 576) still retain the inverted pre-remediation node IDs that contradict their own
    remediated labels and descriptions.'
- finding_id: cmmmech-cycle8-stage4-finding-0002
  issue_key: cmmmech.ferrooxidans-cyc2-causal-graphs.mid-sentence-capitalized-periplasmic-target-label-in-edge-description
  review_id: 20261105T005506Z-cycle8-stage4-causal-graphs-cohort-review
  status: open
  severity: minor
  category: graph
  target_ids:
  - cmmmech:argentojarosite
  - cmmmech:basic-oxygen-furnace-steelmaking-dust
  - cmmmech:cemented-tungsten-carbide-scrap
  - cmmmech:eudialyte-ore
  - cmmmech:nickel-smelter-slag
  - cmmmech:rutile
  - cmmmech:schwertmannite
  - cmmmech:spent-steel-pickling-liquors
  summary: 'Across the 8 Acidithiobacillus ferrooxidans records (9 causal graphs) updated
    in Cycle 8 Stage 2 (PR #924, commit d69682fb) and Stage 3 (PR #926, commit 57341037) —
    data/records/argentojarosite.yaml (line 279), data/records/basic-oxygen-furnace-steelmaking-dust.yaml
    (line 282), data/records/cemented-tungsten-carbide-scrap.yaml (line 283), data/records/eudialyte-ore.yaml
    (line 272), data/records/nickel-smelter-slag.yaml (line 265), data/records/rutile.yaml
    (line 273), data/records/schwertmannite.yaml (causal_graphs[0] line 386 and causal_graphs[1]
    line 552), and data/records/spent-steel-pickling-liquors.yaml (line 278) — edges[0].description
    (cyc2_outer_membrane_cytochrome -> rus_cyc1_periplasmic_electron_transfer) interpolates
    the capitalized target node label ''Periplasmic rusticyanin and diheme cytochrome c4 Cyc1
    (rus AFE_3146; cyc1 AFE_3152)'' verbatim mid-sentence (''... deliver electrons across
    the outer membrane to Periplasmic rusticyanin and diheme cytochrome c4 Cyc1 (rus AFE_3146;
    cyc1 AFE_3152).'') instead of lowercase ''periplasmic rusticyanin and diheme cytochrome
    c4 Cyc1 (rus AFE_3146; cyc1 AFE_3152)''.'
- finding_id: cmmmech-cycle8-stage4-finding-0003
  issue_key: cmmmech.shewanella-mr1-chromium-uraninite.unqualified-template-node-descriptions-and-capitalized-interpolations
  review_id: 20261105T005509Z-uraninite-cycle8-stage4-record-review
  status: open
  severity: minor
  category: graph
  target_ids:
  - cmmmech:chromium
  - cmmmech:uraninite
  summary: In data/records/chromium.yaml (cmmmech:chromium, element, Belchik et al. 2011,
    Appl. Environ. Microbiol. 77(12):4035-4041, DOI:10.1128/AEM.02463-10; causal_graphs[0]
    lines 118-260, nodes[3..4] lines 213-222, edges[1..3] lines 233-259) and data/records/uraninite.yaml
    (cmmmech:uraninite, mineral, Marshall et al. 2006, PLOS Biology 4(8):e268, DOI:10.1371/journal.pbio.0040268;
    causal_graphs[0] lines 195-397, nodes[4..5] lines 333-344, edges[2..4] lines 367-397),
    oxidized_metal_substrate and reduced_metal_product in causal_graphs[0] retain generic
    template placeholder descriptions ('Oxidized metal species or mineral substrate (<Label>)
    accepting extracellular electrons.' and 'Reduced metal species or mineral phase (<Label>)
    formed by extracellular electron transfer.'), and mechanisms[0].protein_examples[0..1].evidence[0].explanation,
    causal_graphs[0].nodes[...].protein_examples[0].evidence[0].explanation, and causal_graphs[0].edges[...].{description,evidence[0].explanation}
    interpolate the capitalized node labels verbatim mid-sentence ('... to Dissolved chromate
    Cr(VI)', '... into Reduced Cr(III) precipitate/complexes', '... to Soluble uranyl carbonate
    U(VI) complexes', '... into Extracellular nanocrystalline uraninite (UO2)'). Furthermore,
    in chromium.yaml (causal_graphs[0].nodes[4], lines 218-222, and edges[3], lines 251-259),
    reduced_metal_product is labeled 'Reduced Cr(III) precipitate/complexes' without the qualification
    stated in mechanisms[0].description (line 35) and mechanisms[0].evidence[1].explanation
    (line 116) that Belchik et al. (2011) detected elemental Cr in electron-dense precipitates
    by TEM-EDX (Figures 2-3) and inferred Cr(III) valence from prior studies rather than oxidation-state
    spectroscopy.
