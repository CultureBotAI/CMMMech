id: cmmmech:lithium-mica-ore
name: Lithium-mica ore
material_kind: primary_resource
description: Natural lithium-bearing ore containing lithium micas together with other mineral phases. The 2020 curated experiment used crushed ore from Beauvoir, France, supplied by the University of Birmingham and called lepidolite by Sedlakova-Kadukova et al. Its initial XRD pattern was assigned to polylithionite, muscovite and kaolinite in supplementary Figure S2A. These are source-qualified assignments in a heterogeneous feed, not a certified pure polylithionite specimen or quantitative phase proportions. Lepidolite is series terminology, not an unambiguous mineral-species identifier. This extracted geological feed remains a primary resource, distinct from an individual mica species, elemental lithium, a processing waste or a purified lithium product. A separate 2025 experiment used a supplier-provided mixed feed called lepidolite, with mica, albite and quartz assignments and additional celadonite labels in its initial diffraction figure; no mine provenance or quantitative species composition
  was supplied. The two feeds are separate experiments within this resource category. No criticality designation or industrial deployment is inferred from its lithium content.
