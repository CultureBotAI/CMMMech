mechanisms:
- id: qualified-natural-sample-thermal-breakdown
  name: Abiotic thermal breakdown of an author-assigned amblygonite-bearing specimen
  process: other
  microbial: false
  description: In situ powder diffraction of the natural Nagatare specimen XN163 showed changes with heating,
    which the thesis interprets as partial breakdown at 600 degrees C and complete breakdown with berlinite
    formation at 700 degrees C. Composition and phase-mixture limitations prevent treating this as a controlled
    pure-endmember transformation. The companion montebrasite record reuses the same crystal-series and
    field-texture studies, not an independent thermal replicate.
  context: Shirose thesis analytical methods (printed pages 13-14, PDF pages 20-21) and Section 5.2.4
    (printed pages 32-33, PDF pages 39-40) used a RIGAKU Ultima IV diffractometer and measured XN163 in
    situ from 50 to 700 degrees C. Heating was 10 degrees C/min under vacuum, with a ten-minute hold at
    each target before measurement. Numerical vacuum pressure, sample mass, independent heating replicates,
    a matched unheated treatment control and a lithium/fluorine product balance are not reported. Starting
    material is a natural substituted phosphate with lacroixite, not a synthetic pure LiAlPO4F standard.
  evidence:
  - source_ref: shirose_thesis
    supports: partial
    explanation: Section 5.2.4 and Figures 17-18 (printed pages 32-33, PDF pages 39-40) support the source-specific
      qualitative thermal sequence. Figure 17 shows diffraction changes; the text assigns anhydrous phosphates
      at 600 degrees C and berlinite at 700 degrees C. No quantitative phase-refinement series, isolated
      berlinite yield, recovered lithium product or closed mass balance is presented. Approaching monoclinic
      cell geometry does not demonstrate isolation of the hypothetical high-temperature C2/c phase proposed
      in Section 5.3.
  - source_ref: shirose_thesis
    supports: partial
    explanation: Table 1 (printed page 21, PDF page 28) assigns XN163 bulk-XRD F/(F+OH)=0.54, EPMA mean
      0.47 with range 0.39-0.50, and 4.8(5) wt% lacroixite. Figure 17 labels F=0.54, whereas the Figure
      18 legend labels the same specimen F=0.45. These estimates cross the F/OH species boundary and are
      not silently reconciled. EPMA Li2O and H2O are stoichiometrically calculated in Tables 2-3, not
      independent lithium and water assays. Thus the source name cannot establish a pure amblygonite feed.
  - source_ref: groat2003
    supports: context_only
    explanation: Methods (pages 197-199), Table 2 (page 198), Table 11 (page 206) and Figures 1-15 establish
      natural-crystal structure and F/OH-related Li-site models. The AF-46 and Saxony specimens have neutron-derived
      F fractions 0.55 and 0.77; Table 11 reports differing composition estimates from other techniques.
      They are separate natural specimens from heated XN163. Split Li-site occupancies and NMR peak intensities
      are structural measurements or constrained models, not recoverable-lithium fractions. These data
      also ground cmmmech:montebrasite within the same study lineage.
  - source_ref: ima_2026_09
    supports: context_only
    explanation: The exact Amblygonite row gives LiAl(PO4)F and grandfathered status, original-description
      year 1818. This verifies the mineral identity independently of the thesis specimen assignment and
      confers no criticality designation.
  - source_ref: handbook_amblygonite
    supports: context_only
    explanation: The complete entry gives LiAlPO4(F,OH), triclinic centered C-1 crystallography and substituted
      natural analyses. The ideal F endmember is distinct from an arbitrary commercial lithium-phosphate
      label or any mixture called amblygonite.
