mechanisms:
- id: abiotic_flow_column_dissolution
  name: Abiotic dissolution of synthetic K-compreignacite in flowing porewater
  process: other
  microbial: false
  description: >-
    Synthetic K-bearing compreignacite mixed with quartz released
    uranium under flowing simulated porewater. Much more uranium
    left the columns in the higher-carbonate, higher-pH solution.
    Carbonate, pH, other solution constituents, initial mineral
    loading and run duration differed between treatments; this
    comparison does not isolate a carbonate-only causal effect.
    Initial potassium leaching and altered surface structure were
    observed or inferred, while uranyl-group detachment and ternary
    carbonate complexation remain proposed molecular explanations.
  context: >-
    Synthetic material was prepared from uranyl nitrate and K2CO3
    at approximately pH 5 and 100-105 degrees C for 24 hours, washed
    and air-dried. XRD, vibrational spectroscopy and EXAFS supported
    the phase assignment; TGA gave 6.60 percent mass loss interpreted
    as approximately eight waters. Table 3 gives U:K = 2.13 ± 0.05
    rather than the ideal 3. Duplicate K columns were dry-packed
    with cleaned quartz and run upward at room temperature and
    ambient atmospheric CO2. Low-carbonate arms A/B used 0.21 mM
    total carbon, influent pH 6.65, 0.2363/0.2351 g mineral and
    0.037 mL/min for 173 hours. High-carbonate arms C/D used 2.78 mM
    total carbon, pH 8.40, 0.0510/0.0524 g mineral and 0.035/0.037
    mL/min for 190 hours. These are pH values after tubing, not
    reservoir or constant effluent pH. Nylon 0.2 micrometre filters
    bracketed the columns; ICP-MS measured effluent uranium. Quartz
    controls with and without dissolved uranium were included.
  evidence:
  - source_ref: reinoso_maset2017
    supports: support
    explanation: >-
      Table 2 reports 99.5 and 99.6 percent of initial uranium
      remaining in low-carbonate K columns A/B, compared with 37.7
      and 41.7 percent in high-carbonate K columns C/D. Remaining
      amounts were calculated from initial loading minus integrated
      effluent release; they are not independent final-solid assays
      or purified-product recovery. Figures 2-3 show an initial pulse
      and approximate later steady state in low-carbonate arms,
      whereas high-carbonate arms did not attain steady uranium
      release. The published 58-87 percent removal range pools K
      and Na arms and is not assigned wholesale to this K mineral.
  - source_ref: reinoso_maset2017
    supports: partial
    explanation: >-
      Table 6 reports duplicate-average RT-TST-VF optimized overall
      rates of 1.28e-13 and 1.57e-10 mol/m2/s for low and high
      carbonate K arms. These model-derived surface-area-normalized
      rates include fitted mineral volume and transport assumptions;
      they are not direct elementary rate constants. Corresponding
      steady-state-method estimates were 8.46e-13 and 6.02e-11.
      Sections 4.1-4.3 acknowledge possible early loss of sub-0.2
      micrometre particles or colloids. The rate models assume
      stoichiometric dissolution and omit interlayer cation exchange.
      Microscopy and EXAFS support alteration but do not directly
      image a unique rate-determining atomic detachment step.
  - source_ref: reinoso_maset2017_si
    supports: partial
    explanation: >-
      Table S3 uses seven-water compreignacite equilibria, whereas
      the main manuscript's synthesis and dissolution equation use
      eight waters. Figure S9 calculates speciation for uranium-added
      control solutions, whose compositions differ from the mineral
      influents in Table 1; its curves are not direct measurements
      of the dissolving-column effluent. SI chemistry and fitted
      sorption assumptions do not establish a measured percentage
      of a particular aqueous uranyl complex.
  - source_ref: reinoso_maset2017
    supports: context_only
    explanation: >-
      Section 3.2.2 associates approximately 76 micromol/g solid U
      with high-carbonate K treatment, while Table 3 assigns 75.9
      to low-carbonate and 16.2 to high-carbonate treatment. Section
      4.2 calls the starting K material potassium-deficient despite
      Table 3's U:K ratio below three. Those conflicting solid
      composition interpretations are not reconciled by assumption
      or used to calculate an additional recovery. The source's
      sodium analogue remains a comparator, not a second natural
      identity or interchangeable K-mineral result.
