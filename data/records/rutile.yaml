mechanisms:
- id: photocatalytic_support_of_iron_cycling
  name: Natural-rutile photocatalysis associated with microbial iron cycling
  process: other
  description: Illuminated rutile on a graphite electrode supplied electrons through an external circuit to a separate chamber containing growing Acidithiobacillus ferrooxidans and an iron-rich medium. Ferrous-iron, electrical-current and cell-count observations support the authors' interpretation that photoelectrons regenerate Fe(II) from Fe(III), supporting further microbial Fe(II) oxidation and growth. Rutile is the photocatalytic component, not the iron feed, and the bacteria are spatially separated from the mineral coating. This is a coupled abiotic-photochemical and microbial process; it does not establish microbial Ti redox chemistry, rutile dissolution, a specific enzyme pathway, isolated-metal recovery or industrial deployment.
  context: The source identifies the isolate by a nearly full-length 16S sequence with 100% reported similarity to A. ferrooxidans and accession HQ603786. NCBITaxon:920 maps the species only. The paper's Shanxi acid-pit-water origin and the accession's soil field are retained without harmonization. Two glass chambers of 350 mL each were separated by a proton-exchange membrane and connected by a wire through a 1000 ohm resistor. The mineral electrode was prepared from 0.54 g powder and 0.06 g acetylene black with approximately 0.3 mL polytetrafluoroethylene and ethanol, spread on a 5 by 7 cm graphite electrode and air-dried for 12 h. The photocatalytic chamber contained 12.5 g/L ascorbic acid as a chemical hole scavenger and 2.5 g/L KCl. Thus neither light nor rutile was the sole supplied source of reducing equivalents. The cell chamber contained modified 9K medium with 41.7 g/L FeSO4·7H2O and a final inoculum of 3.5e5 cells/mL at 10% v/v. Isolation used medium adjusted to pH 2.2 plus or
    minus 0.02, but a reactor pH trajectory is not supplied. The magnetically stirred reactor was maintained near 30 degrees C; 150 rpm in the supplement refers to culture enrichment, not an established reactor stirring speed. Figure 2 follows four days under 380-760 nm light at approximately 13.5 mW/cm2. Figure 4 separately varies wavelength or intensity. Cells were counted directly by microscopy, not by the CFU procedure used for another species in this paper. Exact replicate numbers and error-bar definitions for these rutile curves are not supplied.
