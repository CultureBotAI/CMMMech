mechanisms:
- id: prony_filament_encrustation
  name: Field-associated brucite encrustation of microbial filaments
  process: biomineralization
  description: At the Prony Bay hydrothermal field, brucite-rich mineral crusts occur around carbon-rich microbial filaments in young chimney conduits. Laser-microdissected mineralized filaments from ST09 gave XRD patterns assigned predominantly to brucite with minor hydrotalcite; microscopy and DNA staining support microbial sheaths within these structures. Filaments are proposed to provide nucleation surfaces during chimney consolidation. This is an observational organomineralization interpretation, not a controlled demonstration of microbial necessity or a quantified recovery process.
  context: Natural hydrothermal chimneys sampled during the 2011 HYDROPRONY cruise, New Caledonia; ST09 is a juvenile active edifice at about 50 m water depth, compared with more mature ST07 and other sites. Reduced alkaline fluids derived from serpentinization mix with seawater. This is field occurrence studied by laboratory microscopy and diffraction, without a defined culture temperature, exposure duration, loading, inoculated isolate or industrial operation. SEM fragments were stored at 4°C; molecular/imaging fractions used preservation protocols rather than living precipitation assays. Filament-rich ST09 material yielded predominantly one uncultivated Firmicutes-affiliated 16S OTU; the nearest cultivated relative was only 88% similar, so no named species or metabolic pathway is assigned. Sequence abundance in mixed material does not prove that a single taxon precipitated the mineral. The source also recognizes abiotic precipitation from supersaturated alkaline fluids. No matched sterile,
    killed-biomass or pH-controlled formation experiment is provided.
  microbial: true
  evidence:
  - source_ref: pisapia_2017
    supports: support
    explanation: Methods p. 5 describes laser microdissection and XRD of individual encrusted ST09 filaments. Figures 2 and 3 show mineral-covered carbon-rich filaments, Mg/O-rich crusts and a brucite-dominated diffraction pattern; Figure 5 shows DNA-stained cells in microbial sheaths. These observations support brucite-associated microbial encrustation, not an independently resolved rate or mass yield. Minor hydrotalcite is a co-occurring phase of unresolved origin, not assumed to be microbial brucite conversion.
  - source_ref: pisapia_2017
    supports: partial
    explanation: Discussion p. 11 explicitly states that thermodynamic supersaturation permits abiotic brucite precipitation and that high fluid pH already supplies the alkaline conditions. Sheaths as nucleation sites are proposed; functional groups, metabolic alkalinization and phase-specific causation are not experimentally isolated. Table 1 and pp. 11-14 describe mixed-sample sequence affiliation, not cultured strain verification; the paper itself warns that metabolisms cannot reliably be inferred from these distant relatives. The micrographs are spatial observations, not time-lapse proof of the depicted growth sequence. No magnesium extraction, isolated-product recovery or engineered deployment follows.
