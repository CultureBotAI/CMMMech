  evidence:
  - source_ref: mukherjee2013
    supports: support
    explanation: Sections 3.1-3.2, Figures 5-9 and Tables 7-10 (printed pages 30-40) identify argentojarosite from multiple powder-diffraction reflections matched to reference PDF2 41-1398, fitted cell parameters and elemental chemistry. Figure 8 shows its characteristic peaks at five, twenty and forty mM Ag after fourteen days, with no corresponding sharp phase pattern in the zero-Ag arm. The forty mM/fourteen-day sample had reported bulk Ag 18.42, Fe 28.99 and S 11.07 wt%, broadly near ideal composition; these are concentrations in the collected solids, not percentages of input silver recovered. The reference-card number identifies a diffraction reference and is not assigned as an external mineral identifier.
  - source_ref: mukherjee2013
    supports: partial
    explanation: Sections 3.2 and 4, Figures 7-13 and Tables 7-10 do not quantify absolute phase purity or a silver mass balance. The zero-Ag phase is described as poorly crystalline and a possible schwertmannite precursor; assigning all starting solids to pure schwertmannite would overstate the diffraction. The more yellow and sharper-diffracting forty mM/fourteen-day product may still contain poorly crystalline ferric material. FWHM changes are peak-dependent, and several Table 7 reflections are narrower at twenty than forty mM, so a universal monotonic crystallinity rule is not inferred.
  - source_ref: mukherjee2013
    supports: partial
    explanation: Sections 3.3-3.5 and Figures 14-16 (printed pages 45-51), with the separate Table 9 twenty mM row (printed page 40; PDF page 50), retain negative and abiotic comparisons. Separated culture solution produced insufficient precipitate for analysis within fourteen days; separated solid treated with twenty mM Ag showed no identified argentojarosite and contained 0.35 wt% Ag. Later solution precipitates were not analyzed. A chemical ferric-sulfate/forty mM Ag mixture likewise gave no centrifuge-recoverable product after fourteen days. Conversely, a separate old synthetic schwertmannite reference (100 mg, twenty mM Ag, pH 2.0 plus/minus 0.1, fourteen days; suspension volume not given) showed partial argentojarosite formation with goethite and residual material. These comparisons neither isolate cell-specific catalysis nor prove that both original culture phases are universally necessary; their solids, solution chemistry and histories differ.
  - source_ref: mukherjee2013
    supports: partial
    explanation: Source inconsistencies are retained. Figure 6 lower traces are labeled five mM although its caption and associated prose say zero mM; the unambiguous Figure 8 fourteen-day comparison is used for the graded concentration claim. Table 9 and Figure 11 report anomalous 90.33 wt% Fe at twenty mM/eight hours and 0.37 wt% Fe for zero mM/eight hours, without a resolved analytical explanation. These values are not repaired or used for a yield. Figure 14 prints a one-hour sampling point, distinct from the main eight-hour series; only the explicitly discussed fourteen-day separated-phase outcome is adopted.
