id: cmmmech:hazenite
name: Hazenite
material_kind: mineral
description: Hazenite is the hydrated potassium sodium magnesium phosphate mineral species KNaMg2(PO4)2(H2O)14,
  approved as IMA2007-061 and listed as approved in the September 2026 IMA list. It is distinct from elemental
  phosphorus, magnesium or potassium, the ammonium analog of hazenite, and mixed lake deposits or recovered
  fertilizers. The original description establishes a natural mineral associated with dried or decomposed
  cyanobacterial material; it does not establish exclusive biological formation, a quantified recovery
  process or industrial deployment. Constituent criticality is not inherited.
