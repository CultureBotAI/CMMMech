id: cmmmech:dunite
name: Dunite
material_kind: primary_resource
description: Dunite is an ultramafic rock and geological feed, not a mineral species or elemental magnesium. BGS Rock Classification Scheme code DUN defines this peridotite type by more than 90% olivine in the assemblage of olivine, pyroxene and hornblende. The curated experiments used three powders from a North Carolina dunite deposit, including strongly altered material with much lower remaining olivine fractions. Their laboratory results do not describe every dunite, a pure forsterite feed, a waste tailing, or a traded product grade. No criticality designation is inherited from constituent elements.
