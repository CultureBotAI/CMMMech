id: cmmmech:szaibelyite
name: Szaibélyite
material_kind: mineral
description: >-
  Szaibélyite is the MgBO2(OH) mineral species in the September 2026
  IMA-CNMNC list, with grandfathered status G and original-description year
  1862 rather than a sequential approval number. The doubled structural
  formula Mg2(OH)[B2O4(OH)] describes the same ideal composition; it contains
  hydroxyl rather than required molecular water. Marincea characterized
  natural material from the Romanian type locality, Băița Bihor, whereas
  Grice refined a separate natural Penobsquis, New Brunswick, crystal in
  monoclinic P21/a with two hydrogen positions. Grice's boron and water
  quantities were ideal calculated values, not directly measured assays;
  the reported analytical total exceeds 100%. Szaibélyite is distinct from
  the manganese-dominant sussexite species, synthetic magnesium-borate
  products, elemental boron and the borates commodity. No criticality,
  microbial mechanism or industrial performance is inherited.
