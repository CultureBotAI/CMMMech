    description: Static 38 degrees C incubation of M. voltae A3 with washed Zacatecas specimen pyrite (167 mM FeS2) supported cell and CH4 production over 5 days (Figure S3a), and incubation with accessible synthesized FeS2 (2 mM Fe) produced cells, CH4, and 10.55 +/- 0.13 umol sulfide at day 5 (Figures 1a,c,e and 3; Table S3).
