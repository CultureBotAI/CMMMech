id: cmmmech:cobalt
name: Cobalt
material_kind: element
description: >-
  Cobalt (Co), atomic number 27. This element-level record uses the ChEBI
  cobalt-atom identifier for chemical identity. Cobalt-bearing cathodes and
  mixed battery black mass are material forms and secondary resources,
  respectively; neither is a mineral species or synonymous with the element.
