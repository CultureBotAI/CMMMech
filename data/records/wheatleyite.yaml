mechanisms:
- id: transient_fungal_culture_oxalate
  name: Transient wheatleyite assignment during fungal culture on weathered copper ore
  process: biomineralization
  microbial: true
  organisms:
  - id: NCBITaxon:5061
    label: Aspergillus niger
  description: The source assigned wheatleyite in mixed solids on malachite-bearing weathered ore after
    five days of Aspergillus niger Ch4/07 culture. The corresponding six-day pattern no longer displayed
    the assigned wheatleyite peaks, while moolooite remained. This supports transient culture-associated
    occurrence, not a quantified conversion pathway, complete dissolution, exclusive fungal causation
    or isolated copper recovery. The proposed reactants are fungal oxalate, substrate-derived copper and
    sodium supplied by the nutrient medium.
  context: Ch4/07 was isolated from damaged Proconesos marble at Chersonesos, Crimea; the paper's ITS
    accession maps to KF768341.1 and species NCBITaxon:5061, not a strain-specific TaxID. Approximately
    5 by 5 mm fragments of secondary copper-bearing phases coating weathered chalcopyrite-bearing ore
    from Voronov Bor were submerged in 15 mL liquid Czapek-Dox medium in Petri dishes. The medium contained,
    in g/L, NaNO3 2.0, KH2PO4 1.0, MgSO4.7H2O 0.5, KCl 0.5, FeSO4.7H2O 0.01 and glucose 30.0, with initial
    pH 5.5. Conidia from a ten-day solid-medium culture were used; cultivation lasted five to six days
    at 20-25 degrees C in triplicate. Inoculum density, fragment sterilization and a numerical pH trajectory
    are not reported. The wheatleyite-bearing pattern specifically concerns malachite-bearing surfaces,
    not pure chalcopyrite or every tested ferruginous/azurite substrate. Powder diffraction used Cu K-alpha
    radiation and the ICDD PDF-2 2016 database. Matched uninoculated, killed-cell and cell-free-metabolite
    controls are not specified.
  evidence:
  - source_ref: frank2021
    supports: support
    explanation: Results on in-vitro copper oxalates, Figure 5c and its caption identify wheatleyite together
      with moolooite after five days. Several labelled wheatleyite reflections distinguish this phase
      assignment from morphology or elemental co-occurrence alone. Figure 6c-d assigns acicular wheatleyite
      crystals on malachite, whereas the adjacent spherulites are moolooite. Neither mixed diffraction
      nor these images quantifies phase purity or product mass.
  - source_ref: frank2021
    supports: partial
    explanation: Figure 5b is the six-day pattern, which lacks the wheatleyite labels present in Figure
      5c; the Results describe disappearance. No detection limit, quantitative phase fraction, dissolved
      wheatleyite inventory or tracked individual-crystal series is supplied. This does not demonstrate
      complete removal or conversion of wheatleyite into moolooite. The Discussion invokes water solubility
      and medium composition, but does not independently measure a phase-specific dissolution rate or
      causal sodium/oxalate dose response.
  - source_ref: frank2021
    supports: partial
    explanation: Materials and methods and the Discussion support fungal culture association and proposed
      oxalate-mediated precipitation. Direct oxalate measurements and matched controls isolating metabolism
      from extracellular chemistry are absent. Figure 5a,d and the field lichen observations concern moolooite,
      not natural wheatleyite in those thalli. Iron-related morphology interpretations likewise concern
      moolooite and are not transferred. Laboratory mineral formation is not an industrial deployment
      or a recovered-metal yield.
  - source_ref: frank2021_si
    supports: context_only
    explanation: Tables S1-S2 summarize previous natural and experimental copper oxalates, including wheatleyite,
      while Table S3 lists field microorganisms. These tables do not add a second verified experiment
      for this record or establish a causal wheatleyite-forming role for every organism listed. The present
      assay is the same study already curated under moolooite, not independent replication.
