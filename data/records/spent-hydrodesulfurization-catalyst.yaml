id: cmmmech:spent-hydrodesulfurization-catalyst
name: Spent hydrodesulfurization catalyst
material_kind: secondary_resource
description: Used catalyst from hydrodesulfurization of petroleum feeds, represented here by a characterized raw catalyst from a Brazilian diesel-treatment unit. This process-defined secondary resource is distinct from spent fluid catalytic cracking and hydrocracking catalysts, from fresh catalyst formulations, and from its constituent elements. The selected material was described as CoMo on alumina, but its measured composition and microbial response do not define all spent HDS catalysts. No constituent-element criticality designation is inherited.
sources:
- id: ferreira_2017
  title: Ferreira, Sérvulo, da Costa, Ferreira, Godoy and Oliveira (2017). Bioleaching of Metals from a Spent Diesel Hydrodesulfurization Catalyst Employing Acidithiobacillus thiooxidans FG-01. Brazilian Journal of Chemical Engineering 34(1):119-129. DOI 10.1590/0104-6632.20170341s20150208; methods pp. 120-122, Tables 1-4 and Figures 1-4.
  url: https://doi.org/10.1590/0104-6632.20170341s20150208
  accessed_on: '2026-10-11'
- id: ferreira_2015
  title: Ferreira, Sérvulo, Ferreira and Oliveira. Assessment of Metal Recovery from Raw Spent Hydrodesulfurization Catalyst through Bioleaching and Chemical Leaching. Brazilian Journal of Petroleum and Gas 9(4):137-145, issue dated 2015; author-hosted metadata dated January 2016. DOI 10.5419/bjpg2015-0014. Related source with unresolved abstract/body and filtration/SEM inconsistencies.
  url: https://doi.org/10.5419/bjpg2015-0014
  accessed_on: '2026-10-11'
- id: ncbi_thiooxidans
  title: 'NCBI Taxonomy 930: Acidithiobacillus thiooxidans, species; this identifier does not identify strain FG-01.'
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=930&mode=Info
  accessed_on: '2026-10-11'
mechanisms:
- id: fg01_hds_leaching
  name: FG-01 culture-associated acid leaching of raw diesel HDS catalyst
  process: bioleaching
  description: Acidithiobacillus thiooxidans FG-01 cultivation and previously grown culture medium were associated with Al, Mo and V mobilization from raw spent diesel HDS catalyst. Commercial sulfuric acid gave similar or greater release in relevant comparisons, limiting any claim of microbial enhancement. Direct culture and two-stage leaching are separate assay arms; neither established an isolated metal product or industrial operation.
  context: Ferreira et al. (2017) obtained 200 kg of spent catalyst from a Brazilian heavy-oil refinery diesel-treatment unit and subsampled it; the leaching feed received no grinding, solvent washing or decoking. Analytical digestion and microscopy drying/coating are characterization steps, not leach pretreatments. FG-01 was reported as a uranium-mine isolate from Paraná, supplied by the State University of São Paulo; no accession verifying the exact strain is supplied. Four-day T&K preculture was at 30 +/-1 degrees C and 150 rpm; general assays used 500 mL flasks with 100 mL medium, nominal initial 10^5 cells/mL, initial pH 2 adjusted with sulfuric acid, 29 +/-1 degrees C and 150 rpm. One-stage experiments used 5 g/L catalyst with or without 10 g/L elemental sulfur; Table 2 labels incubation 30 degrees C and samples at days 1, 3 and 7. In two-stage assays, catalyst was added after growth without catalyst had generated reported acidity around 40 g/L as sulfuric acid; the resulting solution
    was diluted before 5-50 g/L catalyst additions. The 2017 paper does not describe removing cells before this second stage; filtration of 25 mL analytical aliquots through 0.22-micrometre membranes must not be interpreted as preparation of a cell-free lixiviant. AAS measured the filtered-liquid metals. At least three replicate flasks were sacrificed during monitoring. Autoclaved medium controls and commercial sulfuric-acid controls were included; Table 3 does not identify its endpoint time or final acid concentration explicitly.
