id: cmmmech:fluormacraeite
name: Fluormacraeite
material_kind: mineral
description: >-
  IMA-approved monoclinic paulkerrite-group hydrated potassium manganese iron-titanium
  oxyfluorophosphate mineral (IMA 2024-054; status A, Approved 2024; full description
  published March 2025; no mineral symbol assigned in the September 2026 IMA Master List,
  PDF p. 75, or in the type description) with ideal end-member formula
  [(H2O)K]Mn2(Fe2Ti)(PO4)4[OF](H2O)10*4H2O (written
  [(H2O)K]Mn2(Fe2Ti)(PO4)4(OF)(H2O)10*4H2O in the IMA Master List,
  [(H2O)K]Mn2Fe2Ti(PO4)4(OF)(H2O)10*4H2O in Section 4, p. 172, and
  (H2O)KMn2Fe2Ti(PO4)4(OF)(H2O)10*4H2O in Table 3, p. 173; requiring K2O 4.74 wt%, MnO
  14.28 wt%, Fe2O3 16.07 wt%, TiO2 8.04 wt%, P2O5 28.58 wt%, H2O 27.18 wt%, F 1.91 wt%,
  -O=F -0.80 wt%, total 100 wt%; Grey et al., 2025, European Journal of Mineralogy
  37:169-179). Represents the F-dominant analogue of macraeite
  ([(H2O)K]Mn2(Fe2Ti)(PO4)4[O(OH)](H2O)10*4H2O, IMA 2023-065) with OF replacing O(OH) at
  the X1/X2 sites, and is the first type mineral described from the Plossberg phosphate
  pegmatite (Lindner Mine / Lindner Quarry dumps; reported as 18 km from Hagendorf in
  Section 1 on p. 170 vs 15 km north-northeast of Hagendorf in Section 2 on p. 170),
  Tirschenreuth district, Upper Palatinate, Bavaria, Germany. Found grown on fissures in
  fresh magnesium-bearing triplite-zwieselite (Mn0.89Fe0.68Mg0.43(PO4)F0.87(OH)0.13)
  within tabular baryte- and beryl-bearing pegmatitic bodies up to 2 m thick embedded in
  Moldanubian biotite-gneisses, associated with spherical blue phosphosiderite, pink
  strengite micro-crystals, white fluorapatite globules, light-yellow leucophosphite,
  black-green rockbridgeite, and reddish-brown cacoxenite; the holotype specimen is
  housed in the Mineralogical State Collection (SNSB), Munich, Germany, under
  registration number MSM38573, and a cotype specimen (used for optical measurements and
  Raman spectroscopy) is housed in the Natural History Museum of Los Angeles County, USA,
  under catalogue number 76422. Occurs as isolated pale-yellow rhombic tablets flattened
  on (010), 50-150 um in diameter and 10-30 um thick, exhibiting forms {010}, {001}, and
  {111}, calculated density Dcalc = 2.39 g/cm3 (from the empirical formula and
  single-crystal unit-cell volume), biaxial positive (+) optics with alpha = 1.610(3),
  beta = 1.620(3), gamma = 1.644(3) (white light), 2Vcalc = 66.5 deg, optical orientation
  X = b, Y = c, Z = a, [001] pseudo-merohedral sector twinning visible under crossed
  polarizers, and a superior Gladstone-Dale compatibility index of 0.0083. Micro-Raman
  spectroscopy (532 nm diode laser at 4 mW, Horiba XploRA PLUS spectrometer with 100 um
  slit, 1800 g/mm grating, and 100x objective; Figure 3a, Section 5, pp. 171-173) shows
  an O-H stretching band centred at 3455 cm-1 with a shoulder at 3350 cm-1, water H-O-H
  bending at 1650 cm-1, symmetric PO4 stretching at 975 cm-1 (with shoulders at 955 and
  1010 cm-1), antisymmetric PO4 stretching at 1085 and 1130 cm-1, intense M2-X/Ti-O
  stretching bands at 775 and 825 cm-1 from short (1.89 A) bonds in linear M2-M3-M2
  octahedral trimers, and PO4 bending modes at 595 and 480 cm-1. Wavelength-dispersive
  electron microprobe analysis (n = 8 analyses on 2 crystals using a
  liquid-nitrogen-cooled cold stage, JEOL JXA 8530F Hyperprobe, 15 kV, 2 nA, 4 um
  defocused beam; Table 1) yielded P2O5 28.51 wt% (range 27.69-29.05, SD 0.59), Fe2O3
  14.74 wt% (11.87-16.60, SD 1.91), MnO 12.49 wt% (11.77-13.99, SD 0.74), TiO2 8.19 wt%
  (6.06-10.03, SD 1.22), K2O 4.41 wt% (2.41-5.31, SD 0.98), F 1.55 wt% (1.21-1.94, SD
  0.30), MgO 1.07 wt% (0.97-1.28, SD 0.16), Al2O3 0.65 wt% (0.40-1.26, SD 0.38), H2Ocalc
  27.13 wt% (based on 30 H per 4 P), and -O=F -0.65 wt%, with Table 1 printing Total =
  98.10 wt% whereas the exact arithmetic sum of the printed mean constituents is 98.09
  wt%. Normalized to 9(P + M1 + M2 + M3) atoms per formula unit
  (K0.93Mn1.75Mg0.26Al0.13Fe3+1.84Ti4+1.02P4.00F0.81O32.05H30), the structural empirical
  formula is
  A1[K0.14(H2O)0.76]Sigma0.90A2[K0.79(H2O)0.21]Sigma1.00M1(Mn2+1.75Mg0.25)Sigma2.00M2+M3(Fe3+1.84Al0.13Ti4+1.02Mg0.01)Sigma3.00(PO4)4.00X[O0.94F0.81(OH)0.25]Sigma2.00(H2O)10*3.90H2O
  (note that the Table 4 footnote on p. 175 reports the unrounded refined site
  occupancies A1 = 0.132(7)K + 0.768H2O and A2 = 0.794(6)K + 0.206H2O). Crystallizes in
  the monoclinic system, space group P21/c (#14), with synchrotron single-crystal X-ray
  diffraction unit-cell parameters at 100 K (Australian Synchrotron MX2 beamline, lambda
  = 0.7107 A, 0.050 x 0.045 x 0.030 mm crystal, twin volumes 0.393(3) and 0.607 by
  two-fold rotation about c; Table 3) of a = 10.546(2) A, b = 20.655(1) A, c = 12.405(1)
  A, beta = 90.09(1) deg, V = 2702.1(6) A3, and Z = 4 (refined to Robs = 0.0559, wRobs =
  0.0700 for 5646 reflections with I > 3sigma(I) and Robs = 0.0614, wRobs = 0.0710, GoF =
  2.43 for all 6313 unique reflections from 49,470 measured; note that the Abstract on p.
  169 mislabels Robs = 0.0559 as "wRobs = 0.0559"; Gandolfi-like MoKalpha powder X-ray
  diffraction on a Rigaku R-Axis Rapid II micro-diffractometer, Section 6.1 and Table 2,
  gave a = 10.531(17) A, b = 20.652(18) A, c = 12.408(17) A, beta = 90.1(2) deg, V =
  2699(6) A3). The seven strongest observed powder X-ray diffraction lines (dobs in A
  (Iobs; hkl), Table 2) are 3.142 (100; 2 5 1, 0 0 4), 6.209 (84; 0 0 2), 2.884 (78; 2 6
  0, 1 2 4), 10.249 (74; 0 2 0), 7.493 (66; 1 1 1), 3.735 (61; -1 1 3, -2 2 2, 2 4 0), and
  3.023 (51; 3 0 2, 3 3 1, 0 6 2, 1 0 4, -2 3 3, 3 2 2). No biological or microbial
  interaction data are reported in the type mineralogical description.
