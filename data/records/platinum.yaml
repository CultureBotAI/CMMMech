mechanisms:
  - id: ch34_hydrogen_ptii_transformation
    name: Hydrogen-driven Pt(II) transformation in the presence of CH34 biomass
    process: redox_transformation
    description: >-
      Washed Cupriavidus metallidurans CH34 biomass exposed to a synthetic
      Pt(II) chloro-complex under hydrogen acquired platinum-bearing particles.
      The authors interpreted biomass-associated XANES and EXAFS spectra as
      consistent with metallic Pt(0). Hydrogen alone also removed Pt(II), so the
      experiment supports a transformation with microbial biomass present,
      without establishing that living cells or a particular enzyme are necessary.
    context: >-
      Laboratory anaerobic batches: CH34 from SCK-CEN was first grown aerobically
      overnight in LB-Lennox at 28 degrees C, centrifuged at 7000 g for 7 minutes,
      washed twice with 25 mL phosphate buffer (8.5 g/L Na2HPO4.7H2O and 3 g/L
      KH2PO4), and resuspended to OD610 of 1. Fifty mL suspensions in 120 mL serum
      bottles received Pt(II) supplied as K2PtCl4, at 100 mg/L Pt from a
      2.5 g/L Pt stock in 1 M HCl. Bottles underwent 20 nitrogen/vacuum cycles
      and the headspace was replaced with 100% hydrogen; batches were mixed at
      100 rpm and 28 degrees C, with initial assay pH adjusted to 1.8-2.2.
      Aerobic denotes biomass cultivation, not the anaerobic transformation assay.
      Table 1 reports 99% Pt removal with hydrogen at 48 h versus 24% in the
      no-electron-donor CH34 arm and 99% in the chemical hydrogen control
      (screening experiments n=1). These ICP-OES-based removal percentages are
      not measured Pt(0) fractions or purified-product yields; the 2017 methods
      refer detailed ICP sample preparation to an earlier paper, whose full
      procedure was not verified here. Membrane-intact cell counts decreased
      during exposure, so sustained metabolic activity is not assumed.
    microbial: true
    organisms:
      - id: NCBITaxon:266264
        label: Cupriavidus metallidurans CH34
    evidence:
      - source_ref: maes_2017
        supports: support
        explanation: >-
          Methods, Figure 1, supplementary Figure S1, and the Platinum speciation
          analysis section support the authors' Pt(0) interpretation for
          aerobically cultivated CH34 exposed to Pt(II) under hydrogen. Figure 3
          shows particulate deposits in the CH34 Pt(II) panel. The phase claim
          depends on X-ray absorption evidence, not the color change or microscopy
          alone, and is not a quantitative determination of complete conversion.
      - source_ref: maes_2017
        supports: partial
        explanation: >-
          Table 1's chemical hydrogen control also reaches 99% Pt(II) removal;
          thus the CH34 endpoint does not establish a microbial enhancement over
          that abiotic arm. The paper additionally reports 99% removal with
          heat-killed Shewanella cells, a different organism and not a matched
          CH34 viability control. No specific hydrogenase or other enzyme was
          demonstrated to cause Pt reduction in CH34.
      - source_ref: maes_2017
        supports: partial
        explanation: >-
          Figure 5 and the membrane-integrity results show CH34 intact-cell
          counts declining to the assay detection level by 27 h in the acidic
          Pt(II)/hydrogen experiment. Membrane staining is not proof of growth
          or metabolic activity. Table 1 also reports only 3% carboplatin
          removal and zero for the tetraamine preparation with CH34 and hydrogen;
          the Pt(II) chloro-complex result cannot be extended to all Pt complexes.
      - source_ref: maes_2017
        supports: partial
        explanation: >-
          Spectroscopy reporting has unresolved internal inconsistencies:
          Methods specifies the Pt L3 edge and a 11919 eV calibration value,
          while Figure 1 is plotted near 11560-11630 eV and Results calls the
          edge K-edge. This record retains the authors' qualitative
          XANES/EXAFS interpretation without adopting those conflicting absolute
          energy assignments or claiming independent spectral refitting. The
          source also distinguishes solution removal from reduced Pt in biomass.
