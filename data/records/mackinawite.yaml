- id: am13_sulfide_precipitation_and_biomass_associated_growth_graph
  name: Maridesulfovibrio hydrothermalis AM13 dissimilatory sulfate reduction and biomass-influenced mackinawite (FeS) nucleation and growth
  description: Causal pathway linking representative Maridesulfovibrio hydrothermalis AM13 = DSM 14728 (NCBITaxon:1121451; reference proteome UP000010808) dissimilatory sulfate-reduction enzymes (sat DESAM_20547, aprA/AprB DESAM_20543-DESAM_20544, and dsvABC DESAM_20116-DESAM_20117 / DESAM_21662) to lactate-driven biogenic sulfide generation in anoxic marine medium (initial pH 7.03, final live-culture pH ~7.06 at 35 C) and reaction with Fe(II) (measured 3.81 +/- 0.17 mM FeCl2) to precipitate powder-XRD-verified mackinawite (FeS) with larger Scherrer crystalline domains when live or gamma-inactivated AM13 biomass encountered Fe(II) prior to sulfide production/addition in Picard et al. (2018), while preserving cell-free Na2S mackinawite formation, vivianite co-precipitation in inactive/abiotic arms, the Table 3 (18.5 +/- 7.7 nm) vs Section 3.2 (18.7 +/- 7.7 nm) inactive-cell c-axis domain discrepancy, and conditional 5-to-11-month partial greigite evolution.
