id: cmmmech:theisen-sludge
name: Theisen sludge
material_kind: secondary_resource
description: >-
  Fine-grained flue-dust residue from top-gas scrubbing during copper-shale
  smelting in a blast furnace, also called Theisenschlamm. The resource scope
  here is the historical processing waste represented by the Helbra
  mono-landfill in Saxony-Anhalt, Germany. It is distinct from unprocessed
  copper shale, a mineral species, an elemental commodity and a prepared
  leaching solution. Meschke et al. (2016) sampled material at a depth of
  4 m in May 2015. They measured Cu, Mo, Pb, Sn, Sb and Zn by energy-dispersive
  X-ray fluorescence and Ag, Co, Ge and Re in an aqua-regia extract by ICP-MS.
  Their Figure 5A identifies zinc and lead as major measured components and
  reports other measured constituents; the two analytical fractions are not
  interchangeable measures of complete extractability. This sampled-feed
  characterization does not establish uniform composition throughout the
  landfill or a recoverable reserve. The same paper's membrane experiments
  used prepared Ge/Mo/Re solutions, rather than the sampled sludge or its
  actual leachate, and its Figure 2 reproduces bioleaching-solution information
  attributed to Klink et al. (2016). Those distinct evidence streams do not
  establish a newly verified microbial mechanism, isolated-metal yield or
  industrial recovery process for this record. No criticality designation is
  inherited from constituent elements.
sources:
  - id: meschke2016
    title: >-
      Meschke, Gumnior, Daus, Haseneder and Repke (2016). Nanofiltration - A new
      separation pathway in secondary mining. In Drebenstedt and Paul (eds.),
      IMWA 2016 - Mining Meets Water - Conflicts and Solutions, pp. 1356-1363.
      Complete eight-page official IMWA PDF; Introduction, Analytical
      investigation of Theisenschlamm, Synthetic feed solutions, Figures 2
      and 5A, and Conclusion. Source title and authors follow the printed
      article and official proceedings index, rather than the PDF metadata.
    url: https://www.imwa.info/docs/imwa_2016/IMWA2016_Meschke_283.pdf
    accessed_on: '2026-10-12'
