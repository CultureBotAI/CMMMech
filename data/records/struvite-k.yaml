id: cmmmech:struvite-k
name: Struvite-(K)
material_kind: mineral
description: >-
  Struvite-(K) is the approved potassium magnesium phosphate hexahydrate
  mineral, KMg(PO4).6H2O, IMA 2003-048. It is distinct from ammonium struvite,
  hazenite, newberyite, anhydrous magnesium potassium phosphate and the mixed
  battery washwater used in one experiment. Curated evidence concerns
  laboratory abiotic synthesis and precipitation from real spent-alkaline-battery
  washwater. Neither microbial formation, a phase-specific potassium recovery
  yield, industrial precipitation deployment nor criticality inherited from
  potassium, magnesium or phosphorus is established.
