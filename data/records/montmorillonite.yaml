id: cmmmech:montmorillonite
name: Montmorillonite
material_kind: mineral
description: Montmorillonite is a hydrated smectite mineral with generalized formula (Na,Ca)0.3(Al,Mg)2Si4O10(OH)2·nH2O,
  distinct from nontronite, generic smectite, mixed-layer illite-smectite and bentonite clay resources.
  The September 2026 IMA list retains the name as grandfathered, dated 1847; this date is not a numbered
  approval accession. The curated experiment used processed natural Source Clays SWy-2 rather than an
  ideal pure endmember. No criticality designation is inherited from aluminium, magnesium or other constituents.
