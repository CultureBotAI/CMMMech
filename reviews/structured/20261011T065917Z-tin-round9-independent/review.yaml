limitations:
- The initial review preserves an open minor analytical-validation wording finding;
  no maintained scientific input was edited by this reviewer.
- C22 species identity, independent biological replication after apparent pooling,
  matched broth/killed controls and longitudinal viability are unresolved.
- Compound-specific ng/g results are not a tin mass balance, isolated recovery or
  toxicity endpoint; final exact percentages remain uncertain without documented dilution
  or linear range beyond 50 ng/g.
- No supplement declaration was found in the inspected main XML; a supplementary API
  timeout is not evidence of universal absence.
- Correction/retraction searches are bounded first result sets, not exhaustive registries.
  Live review-session database opens failed; the curator's retained authority responses
  were independently read and hash checked.
- 'No native quantitative observations were manufactured: these values lack the exact
  mg/kg source cells and analysis dates required by the observation contract.'
