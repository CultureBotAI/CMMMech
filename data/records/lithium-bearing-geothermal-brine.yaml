id: cmmmech:lithium-bearing-geothermal-brine
name: Lithium-bearing geothermal brine
material_kind: primary_resource
description: Naturally occurring geothermal saline water containing dissolved lithium, considered as a
  geological extraction feed. The resource is a variable aqueous mixture, distinct from elemental lithium,
  a mineral species, manufactured lithium carbonate and waste-derived secondary resources. The curated
  experiment used one unsterilized brine from an unnamed Cornish geothermal project; its composition and
  laboratory response do not define all geothermal brines. No criticality designation or external material
  identifier is inferred from the lithium constituent.
sources:
- id: rehmanji2025
  title: Rehmanji, Skeffington, Hudson-Edwards and Newsome (2025). Circular economy approaches to microbially-induced
    carbonate precipitation for bioprocessing of geothermal brine for lithium recovery. RSC Advances 15:43263-43274;
    DOI 10.1039/d5ra06824j, published 6 November 2025. Sections 2.1-2.2 and 4.1-4.7, Figure 1 and supplementary
    Tables S1-S2/S7, Figures S5/S7.
  url: https://doi.org/10.1039/d5ra06824j
  accessed_on: '2026-10-11'
- id: rehmanji2025_si
