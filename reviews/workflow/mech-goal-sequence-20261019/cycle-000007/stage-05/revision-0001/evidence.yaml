    and data/records/plumbogottlobite.yaml (cmmmech:plumbogottlobite, IMA 2025-075) — explicitly state
    their IMA-CNMNC-approved mineral symbols in description (''IMA symbol Fru'' in fengruiite.yaml line
    8 from Tian et al. 2026 Eur. J. Mineral. 38:519-530, p. 519; ''IMA symbol Ig'' in igelstromite.yaml
    line 9 from Holtstam et al. 2024 Eur. J. Mineral. 36:311-322, p. 311; ''official IMA symbol Lzc''
    in lazerckerite.yaml lines 11-12 from Pazout et al. 2024 Eur. J. Mineral. 36:641-656, p. 641; and
    ''official IMA symbol Pgtb'' in plumbogottlobite.yaml line 8 from Kampf et al. 2026 Eur. J. Mineral.
    38:209-216, p. 209), but omit the top-level ima_symbol slot (ima_symbol: Fru, ima_symbol: Ig, ima_symbol:
    Lzc, and ima_symbol: Pgtb immediately following material_kind: mineral), unlike peer IMA mineral records
    such as data/records/andreybulakhite.yaml (ima_symbol: Adb), data/records/vielleaureite-ce.yaml (ima_symbol:
    Vlr-Ce), data/records/xianhuaite-ce.yaml (ima_symbol: Xhu-Ce), and data/records/yttrotungstite-nd.yaml
    (ima_symbol: Ytgs-Nd).'
  disposition: 'Resolved under #918 (GRP-C7S5-001) by populating top-level ima_symbol: Fru in data/records/fengruiite.yaml,
    ima_symbol: Ig in data/records/igelstromite.yaml, ima_symbol: Lzc in data/records/lazerckerite.yaml,
    and ima_symbol: Pgtb in data/records/plumbogottlobite.yaml immediately after material_kind: mineral
    with 4 append-only EDIT history sidecars; verified in reviews/structured/20261104T153000Z-cycle7-stage5-remediation-verification/review.yaml.'
