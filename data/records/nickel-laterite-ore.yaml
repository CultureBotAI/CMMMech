mechanisms:
- id: aerobic_sulfur_oxidizer_leaching
  name: Ore-dependent aerobic bioleaching by a sulfur-oxidizing consortium
  process: bioleaching
  description: A living six-strain Acidithiobacillus thiooxidans mixture supplied acidity and increased nickel and cobalt mobilization from some Brazilian laterites relative to uninoculated reactors following the same pH trajectories. The contribution of reductive mineral dissolution is inferred from solution chemistry; neither a specific molecular reduction route nor universal enhancement across ore mineralogies is established.
  context: DSM 14887T, DSM 504, DSM 622, DSM 103717, DSM 9463 and BGR isolate RAM8 cultures were mixed in equal volumes. The species ID does not identify the mixture or establish any individual strain's causal contribution. Homogenized, sieved (<2 mm), unwashed ore from Barro Alto, Jacare and Piaui was added at 10% w/v to 2-L stirred, air-supplied reactors with 1.5 L salts medium and 1% w/v elemental sulfur at 30 degrees C. Initial pH was 3.0; 10% v/v inoculum grew for four days before ore addition. Methods specify 3 mM ferrous iron in the medium and 3 mM ferrous sulfate before ore addition; the cumulative dose is unresolved. Leaching pH was maintained at 1.5 or allowed to change, with uninoculated controls adjusted to the biotic pH trajectories. BaSt and 1P5 ran for 15 days, BaC for 20, Jacare samples for 24 and Piaui for 15. Dissolved metals were measured by ICP-OES after 0.2-micrometer filtration and acid stabilization. These are laboratory ore assays, not isolated-metal recovery or demonstrations
    of commercial deployment.
