id: cmmmech:probertite
name: Probertite
material_kind: mineral
description: >-
  Probertite is the NaCaB5O7(OH)4(H2O)3 mineral species in the
  September 2026 IMA-CNMNC list, with grandfathered status G and
  original-description year 1929, not a sequential approval identifier.
  It is distinct from ulexite, elemental boron, the borates commodity
  and mixed ores containing probertite. Gatta et al. studied natural
  Kramer Deposit material from collection specimen 11717, using
  separate crystals for X-ray diffraction at 293 K and neutron
  diffraction at 20 K. Both refinements used monoclinic P21/c;
  the model contains pentaborate chains with three tetrahedral and
  two triangular boron sites, four hydroxyl groups and three water
  molecules per formula unit. Ten hydrogen sites were first located
  using neutron data and then incorporated into the X-ray refinement.
  Chemical analyses are specimen-specific: electron-probe results
  give CaO 15.8(2) and Na2O 8.6(3) wt%, while the separate trace-element
  table reports a mean lithium concentration of 0.392 wt ppm from
  ten analyses. Near-ideal major-cation composition does not mean
  zero trace elements or establish purity for every deposit. The
  paper reports limitations of its neutron extinction correction;
  the official deposited CIF now provides both diffraction models,
  each with ten hydrogen sites. Unknown restraint counts and differing
  extinction descriptions remain unresolved; the complete final
  publisher article has not been compared with the accepted manuscript.
  This identity and characterization record makes no criticality,
  microbial extraction, isolated-product recovery or demonstrated
  radiation-shielding deployment claim.
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC, The New IMA List of Minerals, September 2026:
      PDF page 177, Probertite row; page 1, status and year definitions.
      Fresh official list and current landing-page link checked
      on 16 October 2026.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-16'
  - id: gatta2022
    title: >-
      Gatta, Cannaò, Gagliardi and Fabelo (2022), Crystal-chemical
      reinvestigation of probertite, CaNa[B5O7(OH)4]·3H2O, a mineral
      commodity of boron, American Mineralogist 107, 1378-1384,
      DOI 10.2138/am-2022-8086. Complete 20-page institutional
      accepted manuscript inspected: specimen/chemistry PDF pp. 4-5,
      diffraction and refinement pp. 5-7, interpretation pp. 7-11,
      Table 1 p. 16, Table 2 pp. 17-18, Figures 1-2 pp. 19-20.
      The manuscript title omits Crystal-chemical; final metadata
      supplies it. Electron-probe Sr 800-1000 wt ppm and laser-ablation
      mean Sr 1230 ± 230 wt ppm are separate analytical summaries.
      The broad purity and possible concrete-use discussion is not
      a measured recovery or deployment result. The official CIF deposit
      was subsequently inspected separately; a comparison with the
      complete final publisher article remains unavailable.
    url: https://air.unimi.it/retrieve/dfa8b9a7-5fce-748b-e053-3a05fe0a3a96/8086GattaPreprint_Probertite_AmMineral.pdf
    accessed_on: '2026-10-21'
  - id: gatta2022_cif
    title: >-
      Gatta et al. (2022), official American Mineralogist deposit
      AM-22-78086, linked from the July 2022 contents entry at p. 1378.
      Archive member 8086gatta.cif identifies DOI 10.2138/am-2022-8086
      and contains separate neutron 20(1) K and X-ray 293(1) K blocks
      for Kramer Deposit material. Both have 31 independent sites,
      including ten H sites with listed occupancy 1. Neutron H sites
      have anisotropic displacement parameters; X-ray H sites are
      isotropic. Both restraint-count fields are unknown. The neutron
      extinction field names SHELXL, while the accepted manuscript
      refers to Larson (1967); the X-ray block says none. No raw
      reflection-observation loop or exact refinement instruction
      file is included. Rounded-coordinate geometry checks are not
      a re-refinement, purity assay or validation of the extinction
      correction; original uncertainty and rounding differences remain.
    url: https://msaweb.org/MSA/AmMin/TOC/2022/Jul2022_data/AM-22-78086.zip
    accessed_on: '2026-10-21'
