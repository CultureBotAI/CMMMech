mechanisms:
- id: c4_10_lizardite_dissolution
  name: C4-10 culture-associated dissolution of a lizardite feed
  process: bioleaching
  description: Priestia aryabhattai C4-10 cultures increased magnesium and silicon concentrations relative to uninoculated feed controls, accompanied by acidification and surface-associated cells. Gene-expression correlations are compatible with several contributing processes but do not establish any gene as necessary for dissolution.
  context: The soil isolate C4-10 was grown in LB, harvested and washed. Methods specify 1.5 mL of a 10^8-cells/mL suspension, 60 mL sterilized BHm and 0.6 g mineral in the dissolution protocol, with lizardite substituting for biotite and MgSO4 omitted from BHm. The lizardite feed was 75-150 micrometres and contained reported oxide fractions including 42.85% MgO and 44.35% SiO2; cleaning follows a cited earlier protocol without restating its details. Triplicate laboratory flasks were incubated at 37 degrees C and 180 rpm, sampled from 4 to 48 hours. The initial BHm preparation pH is 7.0; Figure 2B instead shows uninoculated lizardite media near 7.6 during sampling. Dissolved elements were measured by ICP-OES. The separate biotite transcriptome assay used a different inoculum volume and is not pooled with this lizardite dissolution assay.
