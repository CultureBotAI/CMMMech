  evidence:
  - source_ref: hetz_schippers_2025
    supports: support
    explanation: 'Methods and Barro Alto Results, Figures 1-7: for stockpile sample BaSt with pH not maintained, reported nickel extraction after 15 days was 83.0 +/- 5.7% (mean +/- SD; four bioreactors), versus 33.6 +/- 0.1% in the matched-pH uninoculated control (two bioreactors). These are reported fractions of feed nickel mobilized, not an isolated nickel product, and do not demonstrate industrial operation.'
  - source_ref: hetz_schippers_2025
    supports: partial
    explanation: 'Figures 5-6 and 8-10 and the corresponding Results restrict the mechanism''s generality: 1P5 showed no enhancement over its chemical control (three biotic reactors, one control), Piaui had similar nickel extraction in biotic and chemical assays, and JacF extraction was very low. JacC showed some enhancement in Results even though the abstract groups Jacare samples broadly with acid-only outcomes. Discussion leaves the aerobic ferric-iron reduction route unresolved; it does not establish a specific enzyme or universal nickel-leaching advantage across laterites.'
