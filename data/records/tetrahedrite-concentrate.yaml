mechanisms:
- id: acidophile_associated_metal_mobilization
  name: Acidophile-associated metal mobilization from mixed tetrahedrite concentrate
  process: bioleaching
  description: 'Separate inoculated laboratory cultures showed greater copper mobilization and sulfate accumulation than the uninoculated acidic control. The two organisms denote separate culture arms, not a consortium. Dissolved copper and sulfate trajectories, oxygen consumption and altered grain surfaces support culture-associated oxidative leaching, while iron cycling is the authors'' mechanistic interpretation. No enzyme-specific or genetic cause was established. The response was element dependent: dissolved antimony rose early and subsequently declined, and the abiotic treatment released more iron and manganese than the inoculated treatments in the reported day-35 comparison. Copper and sulfur depletion with antimony and iron enrichment in selected alteration rims does not demonstrate a pure secondary mineral product or complete dissolution of every grain.'
  context: Ore was crushed, milled nominally below 100 micrometres and upgraded by froth flotation; occasional larger quartz grains are described. The source-labelled A. ferrooxidans DSM 14882 and A. ferrivorans SS3 DSM 17398 were pre-grown at 25 degrees C with 120 mM FeSO4, harvested in late exponential phase on 0.4-micrometre filters, washed with 0.025 M sulfuric acid and resuspended in fresh iron-free basal medium. The leaching medium contained 0.4 g/L MgSO4·7H2O, 0.1 g/L (NH4)2SO4 and 0.04 g/L K2HPO4, initially adjusted to pH 1.5 with sulfuric acid. Triplicate aerobic flask assays used 2% pulp density, 25 degrees C and 150 rpm for 120 days. The percentage basis, working volume, inoculum density and inoculum volume are not specified. No external iron was added to the leaching medium, but the concentrate supplied iron, including from siderite. The abiotic control used medium and concentrate autoclaved at 105 degrees C for 15 minutes; matching heat pretreatment of the inoculated feed is
    not explicit. The medium was unbuffered and pH diverged among treatments, so neither pH nor ferric-iron exposure was matched independently of cells. Filtered 0.2-micrometre samples were analyzed for total dissolved elements and sulfate; these measurements do not identify all aqueous oxidation states or isolated products. Sampling-volume and replacement corrections are not specified. Figures 2b-c have concentration units inconsistent with Figure 2a and the prose, so this record retains qualitative trends without a reconciled copper concentration or extraction percentage. There is no demonstrated isolated metal recovery, complete mass balance, universal optimum or industrial deployment; the authors acknowledge that observed rates may be too low for practical application.
