id: cmmmech:monetite
name: Monetite
material_kind: mineral
description: Monetite is the anhydrous calcium hydrogen-phosphate mineral CaHPO4, written Ca(PO3OH) in
  the September 2026 IMA list. It is triclinic and distinct from brushite, CaHPO4.2H2O, and from a whole
  dental resin composite. The IMA entry has grandfathered status G and original-description year 1882,
  not a unique approval accession. The curated laboratory evidence concerns source-assigned monetite on
  synthetic brushite-containing composite surfaces following live biofilm or cell-free spent-broth exposure;
  it does not establish natural occurrence in those specimens or pure-mineral recovery. No criticality
  designation is inherited from calcium or phosphorus.
