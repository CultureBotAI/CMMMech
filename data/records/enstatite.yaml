id: cmmmech:enstatite
name: Enstatite
material_kind: mineral
description: Enstatite is the Mg2Si2O6 mineral species listed as approved through a 1988 special procedure in the September 2026 IMA list. The special-procedure year is not a unique approval-number identifier. This species is distinct from elemental magnesium and from the mixed San Carlos experimental feed, which contained 31 wt% enstatite and 69 wt% olivine by the authors' XRD characterization. No constituent criticality is inherited. The companion olivine-group record describes other material scope within the same Klug experiment, not an independent replication.
