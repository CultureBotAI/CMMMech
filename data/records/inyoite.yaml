id: cmmmech:inyoite
name: Inyoite
material_kind: mineral
description: >-
  Inyoite is the CaB3O3(OH)5(H2O)3·H2O species in the September 2026
  IMA-CNMNC list, with grandfathered status G and original-description year
  1914, not a sequential approval identifier. Schaller's 1916 original
  investigation distinguishes glassy inyoite cores from meyerhofferite
  alteration products in specimens from Mount Blanco near Death Valley,
  California. Its small 0.1037-g inyoite analysis did not directly determine
  boron. The modern pressure experiment below concerns a separate museum
  crystal, not those historical specimens. Inyoite is distinct from borax,
  tincalconite, kernite, ulexite, colemanite and the borates commodity.
  Inyoite-II is the authors' experimental high-pressure phase label, not a
  second asserted IMA-approved natural mineral. No commodity criticality or
  microbial activity is inherited.
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC, The New IMA List of Minerals, September 2026: PDF page 102,
      Inyoite row; pages 1-2, status and original-description definitions.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-15'
  - id: schaller1916
    title: >-
      Schaller (1916), Inyoite and meyerhofferite, two new calcium borates,
      U.S. Geological Survey Bulletin 610, pp. 35-55: original specimens,
      locality, chemical-analysis limitations and inferred alteration,
      pp. 35-40 and Plates I-II.
    url: https://pubs.usgs.gov/bul/0610/report.pdf
    accessed_on: '2026-10-21'
  - id: comboni2022
    title: >-
      Comboni et al. (2022), High-pressure behaviour and atomic-scale
      deformation mechanisms in inyoite, CaB3O3(OH)5·4H2O, Physics and
      Chemistry of Minerals 49, 4, DOI 10.1007/s00269-021-01173-3.
      Open institutional accepted manuscript labelled Revision_1,
      Methods and Results pp. 3-9, Figures 1-5 and Tables 1-5.
    url: https://air.unimi.it/bitstream/2434/898884/6/inyoite_15-12-2021_revision_1.pdf
    accessed_on: '2026-10-21'
  - id: comboni2022_deposits
    title: >-
      Comboni et al. (2022), official article and linked supplementary
      file 1 (Table S1 and strain information) and files 2-13 (12 CIFs).
      Publisher-linked supplements were acquired and inspected separately
      from the institutional manuscript; the version-of-record PDF was
      not acquired.
    url: https://doi.org/10.1007/s00269-021-01173-3
    accessed_on: '2026-10-21'
mechanisms:
  - id: abiotic-pressure-transition
    name: Pressure-induced transition of a natural inyoite crystal
    process: other
    description: >-
      In-situ single-crystal diffraction detected an abrupt volume decrease
      and a changed diffraction pattern under increasing pressure, assigned
      to inyoite-II. The high-pressure atomic structure remained unresolved,
      and return to the starting crystalline phase was not demonstrated.
    context: >-
      A specimen supplied by the University of Milan Museum of Mineralogy
      was first checked by single-crystal X-ray diffraction. Its collection
      locality and a new quantitative chemical analysis were not reported.
      One approximately 20 x 15 x 10 micrometre crystal was compressed in a
      membrane-driven diamond-anvil cell at ESRF ID15B, with helium as the
      pressure medium and ruby pressure calibration with stated uncertainty
      of 0.05 GPa. Deposited CIFs specify approximately 293 K. This is an
      abiotic laboratory diffraction experiment; it does not test ore
      processing, biological action, boron recovery or concrete performance.
    microbial: false
    evidence:
      - source_ref: comboni2022
        supports: support
        explanation: >-
          Methods pp. 3-4, Results pp. 4-6, Table 1 and Figures 2-3 bracket
          the transition between 8.25(5) and 8.86(5) GPa. Table 1 gives
          respective volumes 824.75(6) and 762(2) cubic angstroms, an
          approximately 7.6% decrease across these sampled pressures, not
          a directly measured equilibrium transition pressure. The authors
          describe the high-pressure phase as metrically monoclinic, with
          diffraction extinctions suggesting preservation of P21/n.
      - source_ref: comboni2022
        supports: partial
        explanation: >-
          Pages 4-5 report too few sufficiently intense reflections to solve
          the high-pressure structure. Pages 7-9 infer low-pressure
          deformation from refined non-hydrogen positions and oxygen-oxygen
          distances; hydrogen sites were not located. Increasing boron
          coordination from three to four at the transition is an analogy-based
          hypothesis, not a solved inyoite-II structure. Page 7 reports that
          repeated attempts to collect diffraction at ambient pressure after
          decompression found no reflections. This does not establish a
          reversible cycle, a recovered crystalline product or its phase yield.
      - source_ref: comboni2022_deposits
        supports: partial
        explanation: >-
          Supplementary Table S1 and the 12 CIFs cover only the starting
          polymorph from ambient pressure through 8.25(5) GPa; no inyoite-II
          structure is supplied. The manuscript abstract says the experiment
          reached 19.80(5) GPa, whereas Table 1 ends at 18.91(5) GPa and the
          body states 18.9 GPa; that discrepancy remains unresolved. At
          2.00(5) GPa, Table 1 in both the accepted PDF and DOCX gives
          924.0(1) cubic angstroms, consistent at the printed precision with
          supplementary CIF 6 at 923.96(11). The prior record's 944.0(1)
          was a transcription error. Supplementary CIF 10 has a commented
          7.23-GPa header but cell parameters and refinement statistics
          matching Table 1 and Table S1 at 5.19(5) GPa. It and CIF 13 lack
          explicit pressure tags. These inferred joins do not establish a
          fully reconciled pressure-volume dataset. Deposited model contents
          are not an independent chemical assay or replication.
      - source_ref: schaller1916
        supports: context_only
        explanation: >-
          Pages 35-40 and Plates I-II infer natural alteration from glassy
          inyoite cores surrounded by fibrous or prismatic meyerhofferite.
          They do not constitute a controlled observation of the high-pressure
          transition or establish its natural occurrence. The Mount Blanco
          locality in this original source differs from the Kramer locality
          attributed to Schaller in the 2022 introduction; neither determines
          the unreported provenance of the 2022 experimental specimen.
