id: cmmmech:gadolinium
name: Gadolinium
material_kind: element
description: >-
  The element Gd, distinct from its dissolved ions, experimental nitrate salt, host minerals
  and manufactured materials. The dated US designation concerns the named gadolinium mineral
  commodity, without transferring criticality to every Gd-bearing substance. The curated laboratory
  experiment documents element in harvested cyanobacterial biomass, not a resolved uptake
  pathway, purified metal recovery or industrial deployment.
