        sampled_fraction: >-
          Working-chamber solution filtered at 0.22 micrometres before
          preservation in 1% nitric acid.
        study_arm: abiotic
        result_status: measured
        value: 0.819
        unit: mg/kg
        analyzed_on: '2024-09-24'
        context: >-
          Original abiotic-run endpoint. T2 contains no exact match for this
          sample ID, so sample collection date is unrecorded; the ICP-OES
