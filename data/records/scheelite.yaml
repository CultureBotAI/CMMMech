  title: 'UniProtKB reference proteome UP000000242 (Metallosphaera sedula DSM 5348, NCBITaxon:399549): Cytochrome c oxidase subunit I FoxA (foxA / Msed_0484, UniProtKB:A4YE09), Sulfocyanin (Msed_0323, UniProtKB:A4YDJ8), and S-layer protein A SlaA (slaA / Msed_1806, UniProtKB:A4YHQ8).'
  url: https://www.uniprot.org/uniprotkb?query=(proteome:UP000000242)+AND+(accession:A4YE09+OR+accession:A4YDJ8+OR+accession:A4YHQ8)
