mechanisms:
- id: abiotic_precipitation_from_reagent_solution
  name: Abiotic synthesis of crystalline potassium magnesium phosphate hexahydrate
  process: other
  microbial: false
  description: >-
    Raising the pH of a magnesium chloride and potassium dihydrogen phosphate
    solution with potassium hydroxide produced a recoverable crystalline solid
    assigned to struvite-(K) by powder diffraction and complementary spectroscopy.
    The experiment establishes a synthetic mineral analogue, not microbial
    precipitation or recovery from an industrial waste feed.
  context: >-
    Gardner2021 Section 2.1 (page 196, PDF page 2) used 25 g KH2PO4 and
    5 g anhydrous MgCl2 in 100 mL deionized water, with a nominal Mg:P ratio
    of 1:3.5. After ten minutes of stirring, the flask was angled about
    45 degrees and the initial pH 4.4 was raised to 7.5 by approximately
    20 mL 45 wt% KOH added in 1-2 mL increments. The mixture stood at room
    temperature for seven days. The white solid was vacuum-filtered, washed
    repeatedly with deionized water and finally acetone, and vacuum-desiccated
    for two days. No independent synthesis-replicate count or matched
    precursor-omission control series is reported. The n=10 composition
    analyses are EDX spots, not independent synthesis batches.
  evidence:
  - source_ref: gardner2021
    supports: support
    explanation: >-
      Section 2.1 reports 13.61 g isolated powder, stated as 0.0511 mol and
      97.26% yield relative to the limiting 0.0525 mol magnesium precursor.
      This is the authors' isolated-solid synthesis yield on a magnesium
      basis, not a wastewater removal percentage or proof of absolute purity.
      Section 3.1 and Figures 2-3 (page 197, PDF page 3) show the diffraction
      pattern indexed against the struvite-K reference and prismatic/tabular
      particles; morphology alone is not the phase assignment.
  - source_ref: gardner2021
    supports: partial
    explanation: >-
      Sections 3.1-3.2 and Figure 4 (pages 197-198, PDF pages 3-4) report
      no precursor peaks visible by diffraction, but a weak phosphorus NMR
      resonance near 3.8 ppm could represent residual KH2PO4 below the
      diffraction detection limit. Thus the claimed complete reaction does
      not establish an impurity-free product. The observed major phosphorus,
      magnesium and potassium environments support the assigned analogue;
      they do not identify biological involvement.
  - source_ref: gardner2021_si
    supports: support
    explanation: >-
      Figure S1 on supplementary page S2 shows a representative BSE image
      and EDX spectrum containing K, Mg, P and O. Main Section 3.1 describes
      ten spot analyses and a near-target Mg:K:P ratio. This is supporting
      elemental evidence, not an independent quantitative water assay or a
      universal phase-purity measurement.
  - source_ref: ima_2026_09
    supports: context_only
    explanation: >-
      The exact Struvite-(K) row and list definitions establish the approved
      mineral name, ideal composition and IMA number 2003-048. They do not
      certify either synthetic preparation or confer an element's criticality.
  - source_ref: handbook_struvite_k
    supports: context_only
    explanation: >-
      The complete identity entry describes the potassium equivalent of
      struvite from Switzerland and Austria, with natural diffraction and
      structural information. The Austrian bone-alteration occurrence is not
      an experimentally established microbial formation mechanism.
- id: abiotic_precipitation_from_battery_washwater
  name: Chemical precipitation of struvite-(K)-bearing solids from spent-battery washwater
  process: other
  microbial: false
  description: >-
    Magnesium oxide and phosphoric acid additions to real potassium-rich
    alkaline-battery washing water produced struvite-(K)-assigned solids,
    with reagent- and pH-dependent newberyite, hazenite and residual MgO.
    Laboratory concentration-removal percentages, fitted crystalline phase
    fractions and isolated mineral recovery are distinct quantities.
    No inoculum or biological mechanism was tested, and the pilot filtration
    used to prepare the feed does not demonstrate pilot precipitation.
  context: >-
    Abayie2025 Sections 2.1-2.6 and Tables 1-3 (PDF pages 2-4) describe
    Tracegrow-supplied washwater prepared from 137.4 kg sieved, magnetically
    separated spent alkaline-battery black mass and 87.9 L water. After one
    hour of mixing and overnight settling, the surface liquid was pilot
    filter-pressed, yielding about 35 L of feed with pH 13.4. Precipitation
    used 600 mL feed in 700 mL beakers, duplicate experiments at 25 degrees C,
    500 rpm mixing, three hours reaction, one hour settling, filtration and
    ten days room-temperature desiccation. Model 1 used nominal 85% sidestream
    MgO with NaOH pH adjustment; Model 2 used that MgO at pH 7 with HCl;
    Model 3 compared nominal 71% sidestream and 97% commercial MgO at pH 7
    and nominal Mg:K:P 0.5:1:0.5. Other ratios and pH values are separate
    arms. No matched reagent-free or ionic-strength-matched control series
    or closed potassium mass balance is reported.
  evidence:
  - source_ref: abayie2025
    supports: support
    explanation: >-
      Sections 3.3-3.5 and Figures 4-7 (PDF pages 7-10) show the pH-7
      products' diffraction and SEM-EDS. Figure 6b identifies struvite-K
      in both Model 3 products; newberyite accompanies the sidestream arm.
      Figure 6a and Section 3.5 report first-cycle K concentration removal
      of 59.5% for nominal 71% sidestream MgO and 65.1% for nominal 97%
      commercial MgO. Equation 3 in Section 2.7 is (K0-K1)/K0 using solution
      concentrations. These are not phase-specific solid recovery yields,
      and the equation does not itself correct for reagent-volume changes.
  - source_ref: abayie2025
    supports: partial
    explanation: >-
      Sections 3.4-3.5 report Rietveld-derived struvite-K phase proportions,
      including 82% and 99.8% for Model 3 sidestream and commercial products.
      Figures 4b and 6b show assigned peaks but no refinement residuals,
      internal-standard amorphous correction or uncertainty for those
      fractions. Those reported fitted proportions are not adopted as an
      absolute purity or potassium-yield claim. Local SEM-EDS ratios and
      morphology in Figures 5 and 7 do not remove that limitation.
  - source_ref: abayie2025
    supports: support
    explanation: >-
      Section 3.5 (PDF pages 8-9) reports no further change in potassium
      concentration during the second recycled-water precipitation cycle;
      potassium was not fully removed. The proposed chloride interference
      and competing-phase explanations were not isolated experimentally
      from the simultaneous pH, reagent and solution-composition changes.
  - source_ref: abayie2025_si
    supports: partial
    explanation: >-
      Figures S1-S4 show different phase-labelled mixtures at Model 1 pH
      10.5-12, including hazenite-dominated high-ratio patterns. Table S1
      supplies final concentration cells, not a solid mass balance or raw
      refinement files. The Model 1 aqueous potassium removal cannot be
      assigned entirely to struvite-(K); no phase-specific yield is inferred
      from those mixed solids.
  - source_ref: abayie2025
    supports: partial
    explanation: >-
      The abstract calls commercial MgO 95%, whereas Sections 2.1, 2.6,
      Table 3 and Figure 6 use 97%; the latter defines the curated arm.
      Sidestream MgO is described as 71% or 70.9%, while Table 1 gives
      70.01 wt% MgO. Table 3 reagent doses are retained as source-defined
      nominal recipes rather than independently reconciled stoichiometry.
      Table 4 lists Model 2 Cd as 2 mg/kg against its own 1.5 mg/kg inorganic
      fertilizer limit, contradicting Section 3.6's statement that every
      measured heavy metal is below the listed limits. No fertilizer
      compliance, safe agricultural use or current regulatory claim is made.
