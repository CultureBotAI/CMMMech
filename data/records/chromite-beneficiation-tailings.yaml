  evidence:
  - source_ref: bolanos2018
    supports: support
    explanation: Sections 2.2-2.4 and 3.2-3.3, Figures 3-8, support acidic culture-associated element release and its loading dependence. For 5 g/L, the Results report Fe increasing from 421 to 1234 mg/kg tailings over the plotted experiment. The uninoculated medium controls release less Fe, Ni, Mn and Al but do not match the inoculated pH trajectory. This supports association with the sulfur-fed culture, not an effect independent of acidity.
  - source_ref: bolanos2018_supplement
    supports: partial
    explanation: 'Figure S3 and main Section 4.2 preserve counterevidence at 30 g/L: the authors compare 479 mg Fe/kg after approximately 11 days with acidified water against 213 mg/kg with the inoculated culture. Thus microbial enhancement is not universal. The separate acid arm has different medium chemistry and no documented matching pH trajectory; inhibition by released metals is a hypothesis. Figure S2 shows Fe(II)/Fe(III) evolution without bacteria. Its Fe axis is mg/L, whereas Figure S3 is mg/kg tailings, and their quantities are not reconciled here. The main paper''s attribution of Fe(II) oxidation to A. thiooxidans is not independently demonstrated; its cited comparison concerns A. ferrooxidans.'
  - source_ref: bolanos2018
    supports: partial
    explanation: Figure 5 shows early Cr release in both medium controls and inoculated reactors, followed by declining aqueous Cr. The separate one-hour chemical extraction in Section 2.3 and Table 2 used 1 g solids with 25 mL water or 0.1 M KH2PO4 and a 0.22 micrometre filtrate. Fresh-tailings phosphate extraction reports 223 mg Cr(VI)/kg and 240 mg total Cr/kg, compared with 63 mg Cr(VI)/kg using water. These are operational exchangeable pools, not microbial yields. Table 2 labels bulk total Cr as 96 g/kg while the adjacent prose says 96 mg/kg; Table 1's oxide-equivalent assay is not converted to resolve this conflict. Old-tailings depth comparisons are separate chemical extractions, not evidence of microbial remediation in a stockpile.
  - source_ref: bolanos2018_supplement
    supports: partial
    explanation: Figures S3 and S5 show lower Cr release from the separate concentrate than from fresh tailings, consistent with contributions from other phases. The main text's approximately threefold comparison is not imposed as a matched-time ratio because the plotted tailings and concentrate trajectories differ. Neither the concentrate nor the tailings is pure chromite. Tables S1-S3 model dissolved complexes and possible precipitation; they do not measure solid products or prove Cr(VI) reduction. Reduction by ferrous iron, sulfur intermediates and biomass, adsorption and precipitation remain alternative contributions to solution loss.
- id: wcs358_culture_associated_redistribution
  name: Alkalinizing WCS358 culture-associated element redistribution
  process: bioleaching
  description: The culture called Pseudomonas putida WCS 358 in the paper was associated with increasing pH, a CAS-reactive siderophore signal, transient iron mobilization and declining filtered chromium after initial release. The identifier follows NCBI's current P. capeferrum species entry, which includes WCS358 and explicitly marks the name effectively but not validly published. It is not genetic authentication of the experimental culture. Siderophore-specific mineral attack and direct enzymatic chromium reduction were not established.
  context: The same fresh-tailings batch design used 5, 10 and 30 g/L, 1% v/v pregrown culture, 30 degrees C, 190 rpm, duplicate reactors and 20 mL sampling with replacement. WCS 358 was supplied by Peter Bakker, University of Utrecht. Iron-free succinate medium contained, per litre, 6 g K2HPO4, 3 g KH2PO4, 0.2 g MgSO4.7H2O, 1 g (NH4)2SO4 and 4 g succinic acid, initially pH 7. Figure 3 shows inoculated pH rising to approximately 9 while uninoculated medium controls remain near 7. Sodium-azide medium controls and water blanks, and a separate initial-pH-9 water comparison at 30 g/L, were used. Culture-associated protein and CAS response were assayed in supernatant; these are proxies rather than direct viable-cell counts or identified siderophore concentrations. The sampling-time and mass-accounting limits of the acidophile arm also apply. This is laboratory mobilization/redistribution, not isolated metal recovery or demonstrated field remediation.
  microbial: true
  organisms:
  - id: NCBITaxon:1495066
    label: Pseudomonas capeferrum
  evidence:
  - source_ref: bolanos2018
    supports: support
    explanation: Sections 2.2.1, 2.4.3-2.4.4, 3.2-3.3 and 4.2 and Figures 3-8 support the stated pH and element trajectories. Culture-associated Cr depletion is greater than in the phosphate-rich medium controls, but both start with substantial Cr release. Total filtered elemental concentrations alone do not separate microbial reduction from adsorption, precipitation or sampling losses. The paper itself describes the P. putida influence on Cr leaching as negligible when discussing the alkaline-water comparison.
  - source_ref: bolanos2018_supplement
    supports: partial
    explanation: Figure S4 shows transient, loading-dependent CAS and protein signals, not monotonic growth or molecular identification. Figures S1 and S3 document evolving dissolved oxygen and a separate alkaline-water arm; they do not provide matched cell-free culture-metabolite or siderophore-deficient controls. Tables S1-S3 are equilibrium simulations without adsorption parameters, not a measured Cr(III)/Cr(VI) time course or identified precipitate. Proposed biosorption, sulfur-mediated reduction, ferrous-iron reduction and enzymatic processes are not resolved quantitatively. No recovered-metal mass balance was demonstrated.
- id: versicolor_og2_tailings_leaching_association
  name: Metal release during OG2 fungal treatment of mixed silicate-rich tailings
  process: bioleaching
  description: Nickel, iron, magnesium and silicon were reported in leachates during laboratory treatment with source-labelled living T. versicolor OG2. Organic-acid-mediated release is proposed; oxalic acid was detected in one treated filtrate. Absent uninoculated leaching controls prevent assigning an incremental microbial effect. Neither selective chromite dissolution nor isolated nickel recovery is demonstrated, and the source's percentage calculation is not accepted as a verified yield.
  context: Eti Krom supplied final chromite-enrichment tailings called olivine and serpentine. XRD identifies multiple silicates and spinels in both; Table 1 reports 2.91 and 29.91 wt% Cr2O3 equivalents, respectively, not chromite phase fractions. Table 2 reports solid-feed Ni at 3246.61 and 1457.18 ppm. The as-received feeds were not ground; Figure 1 documents different size distributions. Ataturk University supplied OG2. The paper states ITS identification and assigned GenBank accessions but prints no accession value, so strain identity remains source-reported. Cultures were reactivated on potato dextrose agar at 30 degrees C for 5-11 days, then washed with pH-7.2 PBS and 0.01% Tween 80. Each 20 g solid suspension in 500 mL water was autoclaved at 121 degrees C for 15 min, received 80 mL medium prepared with 2 g/L glucose, 0.5 g/L peptone and 0.5 g/L yeast extract plus 1 mL spore suspension, and was brought to 1000 mL. These medium concentrations are for the prepared aliquot; final nutrient
    concentrations are not assumed. Treatments used initial pH 4.5, 5.0, 5.5 or 6.3, 20 degrees C and 3 or 7 days. The methods conflict between 150 and 200 rpm and give spore density approximately 10^7 without a unit. They call loading 2% by weight; the explicit mass and volume correspond to 20 g/L. Solids were separated at 6000 rpm, dried at 60 degrees C for two days, and supernatants stored at 4 degrees C for ICP-MS analysis. No leach replicate number, uncertainty, final pH trajectory, uninoculated control, matched-acid control or recovered-product mass balance is reported. The control in Table 3 belongs to a separate fungal growth-tolerance plate assay and does not control the leaching.
  microbial: true
  organisms:
  - id: NCBITaxon:5325
    label: Trametes versicolor
  evidence:
  - source_ref: acar2025
    supports: support
    explanation: Experimental and Results, pages 2528-2536, support feed identity, inoculated treatment and detected metal release. Figures 5 and 7 label their highest Ni dissolution indices as 41.82% and 30.97% at initial pH 5 after seven days for the olivine-labelled and serpentine-labelled feeds. These are author-reported indices, retained only to identify the experimental observations. Equation 1 divides solution ppm by solid-sample ppm without an explicit solid-mass/liquid-volume conversion. Under the stated 20 g/L loading this expression alone does not establish a feed-mass extraction fraction. Original solution values and normalization calculations are not supplied, so no corrected yield is inferred. Figures 6 and 8 use ratios of these dissolution indices for selectivity, not product purity or isolated-metal yield.
  - source_ref: acar2025
    supports: partial
    explanation: Figure 4 and pages 2530-2534 report oxalic acid at 9.562 mg/L in the seven-day olivine-treatment filtrate chromatogram. The methods describe a 100-fold dilution without clarifying the reported concentration's back-correction; it is not converted here. Citric acid, laccase-driven release, specific metal-organic complexes and ferric/ferrous reaction pathways are discussed rather than measured in this experiment. No abiotic filtrate comparison establishes the increment attributable to fungal acid production. The proposed Cr(VI)-toxicity explanation for differences between feeds lacks a leaching-stage Cr(VI) assay; chromite abundance is not evidence that hexavalent chromium was present. Different mineralogy and particle size also confound feed comparisons. The graphical nickel-product depiction and proposed downstream separation are not demonstrated recovery operations or industrial deployment.
