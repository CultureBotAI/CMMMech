      microbial assay or a demonstrated extraction pathway.
    url: https://doi.org/10.5194/ejm-33-717-2021
    accessed_on: '2026-10-15'
  - id: mauro2021_si
    title: >-
      Mauro et al. (2021), official supplementary ZIP: gersdorffite.cif,
      tetrahedrite-(Fe).cif and title page. The gersdorffite CIF confirms
      space group 198, P2₁3, and cell dimension 5.6968(7) Å. Minor
      main-table/CIF reporting differences are retained in the source
      dossier; no disputed temperature or reflection count is imported.
    url: https://ejm.copernicus.org/articles/33/717/2021/ejm-33-717-2021-supplement.zip
    accessed_on: '2026-10-15'
  - id: jaatinen2011_context
    title: >-
      Jaatinen T (2011), Bio-oxidation and bioleaching of arsenic-containing
      and refractory gold concentrates. MSc thesis, Tampere University
      of Technology. Context only: Table 6.2 on printed page 27 gives
      inherited mixed-feed mineralogy; Sections 6.2.2, 7.6.2, 7.8, 8.2 and 8.4,
      Figures 7.27-7.30 and Appendix 3 document GFC assays and community
      limits. No polymorph assignment establishes the current species;
      the separately cited Wakeman2011 journal original was unavailable.
    url: https://trepo.tuni.fi/bitstream/123456789/20695/4/jaatinen.pdf
    accessed_on: '2026-10-15'
