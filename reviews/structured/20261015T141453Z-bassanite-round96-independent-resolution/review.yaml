limitations:
- Extracted bacterial EPS origin is distinct from live-cell necessity; natural mineral
  occurrence is not evidence of microbial origin.
- Mixed semiquantitative phase estimates, washing/drying and rehydration constrain
  phase purity, formation timing and complete conversion; no isolated bassanite yield
  or industrial deployment.
- Al Disi control-strain labels remain inconsistent and water-activity/calcium-binding
