    title: >-
      IMA-CNMNC, The New IMA List of Minerals, September 2026. Retained
      official original: definitions PDF page 1 and Hemimorphite row
      page 92, Zn4(Si2O7)(OH)2·H2O, A, 1962 s.p. This dated edition is
      not a claim that the live issuing-site index was accessible here.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-15'
  - id: handbook_hemimorphite
    title: >-
      Handbook of Mineralogy, Hemimorphite. Complete one-page version 1.2
      datasheet, copyright 2001; formula, orthorhombic crystal data and
