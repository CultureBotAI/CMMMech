mechanisms:
- id: yeast_acetobacter_sulfur_solubilization
  name: Sulfur solubilization in yeast and acetic-acid-bacterium incubations
  process: bioleaching
  description: Sulfate was detected after incubating pyrite ash with source-identified S. cerevisiae alone or with A. aceti and organic substrates. These laboratory observations provide partial evidence for a culture-associated desulfurization treatment. The study does not separate biological action from acid-driven dissolution, demonstrate an iron-oxidizing phenotype, or establish a purified iron product or recovery of constituent metals.
  context: The Bandırma calcined ash was reported to contain 61.08% iron and 0.59% total sulfur. Five-percent pulp suspensions, without a stated mass/volume basis, were incubated for eight weeks at 25, 30 and 35 degrees C. The five treatments combined ash with glucose and yeast; glucose and both organisms; glucose, ethanol and both organisms; ethanol, acetic acid and both organisms; or all three organic additions and both organisms. The isolates came from commercial baker's yeast and vinegar, with no sequence, deposit or strain-specific identification supplied. Species CURIEs resolve the reported names only. Methods call the medium sulfur-free but do not give its complete recipe, substrate concentrations, inoculum quantity, working volume, ash pretreatment, sterilization, shaking rate, replication or uncertainty. No matched uninoculated or killed-cell treatment is reported. Glucose, ethanol and added acetic acid are experimental inputs, not measured microbial metabolite yields. No industrial
    microbial operation was demonstrated.
  microbial: true
  organisms:
  - id: NCBITaxon:4932
    label: Saccharomyces cerevisiae
  - id: NCBITaxon:435
    label: Acetobacter aceti
  evidence:
  - source_ref: ermurat2013
    supports: partial
    explanation: 'Methods page 2 and Results pages 4–5 describe weekly pH/redox measurements and spectrophotometric sulfate measurement after eight weeks. Figure 1 is a light micrograph of the mixed culture with ash; attachment does not establish the sulfur reaction''s cause. Page 5 reports a highest dissolved-sulfur/total-sulfur ratio of 0.5 for the treatment containing glucose, ethanol, acetic acid and both organisms. Figure 5 displays separate 25 and 35 degrees C series as stacked segments: their combined column height is not one treatment''s sulfur-removal fraction. It provides no 30-degree series or error bars. Without an abiotic comparator, the reported ratio cannot establish the biological contribution or synergism.'
  - source_ref: ermurat2013
    supports: partial
    explanation: Equations 1–10, Table 1 and Figures 2–4 derive ferric/ferrous ratios and quantities termed specific growth or iron-utilization rates from pH and redox observations. They are model predictions, not independent iron-speciation measurements or measured cell-growth rates. The source reports only modest pH/redox changes and discusses limited oxygen as a possible explanation. These results do not establish enzymatic iron oxidation by either source-reported isolate. No sulfur balance including biomass or gas, residual-solid sulfur assay, product purity, yield or ironmaking test is supplied.
- id: acidophile_ash_assay_limited_response
  name: Acidophilic consortium assay with no established leaching advantage
  process: bioleaching
  description: The São Domingos ash was tested with the SLA acidophilic consortium under conditions transferred from an optimization model for a different, crushed-pyrite feed. The author concluded that this transfer failed and did not establish useful microbial enhancement of ash leaching. The result is specific to this feed and nine-day assay; it does not establish that all pyrite-roasting residues resist biological treatment.
  context: SD-BIO-2 was collected from native-sulfur and black layers and supplied and characterized by LNEG. The source identifies it as roasted pyrite ash below 250 micrometers, with original roasting equipment and temperature unknown. It is distinct from the study's SD-BIO-1 slag and SD-BIO-3 partly leached crushed pyrite. Tables 4.8–4.9 report a heterogeneous, sulfate-rich ash including gypsum, anglesite, beudantite and quartz, with uncertain minor assignments; portable-XRF composition is sample-specific. The SLA culture came from the Freiberg working group's collection and is reported as S. thermosulfidooxidans DSM 9293T, L. ferriphilum DSM 14647 and A. caldus DSM 8584. Catalogue-name correspondence does not independently authenticate the experimental stocks or establish an individual species' contribution. Adaptation used 3% wt/vol feed, 1% wt/vol elemental sulfur and 20 mM ferrous iron for seven days at 42 degrees C and 120 rpm. The ash assay used the 100 mL batch setup, 10% vol/vol
    inoculum, 2% wt/vol ash, 1% wt/vol sulfur, nominal initial pH 1.66, 54 mM added ferrous iron and 42 degrees C for nine days. Shaking speed is explicit for adaptation but not separately restated for this assay. HBS medium and trace salts contained several measured metals; their blank subtraction is not documented. The comparison is called abiotic, but feed sterilization and ash-control sterility verification are not established. Cells in controls of the separate crushed-pyrite and slag experiments are explicitly reported; that observation is not assigned to the ash arm.
