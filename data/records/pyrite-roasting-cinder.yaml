id: cmmmech:pyrite-roasting-cinder
name: Pyrite-roasting cinder
material_kind: secondary_resource
description: Solid residue generated by roasting or calcining pyrite-bearing feed, also described as pyrite ash. The curated experiments concern calcined waste supplied by the Eti Mining Bandırma Borax Plant, Turkey, and a separately characterized, weathered pyrite-ash sample from São Domingos, Portugal. This processing residue is distinct from natural pyrite, unroasted mine tailings, smelting slag and spent sulfuric-acid-production catalyst. Its composition varies with feed, processing and weathering; neither study establishes a uniform mineral formula or commercial product specification. No criticality-list designation is inferred from constituent elements.
sources:
- id: ermurat2013
  title: Ermurat Y (2013). Modeling the kinetics of pyrite ash biodesulfurization by Saccharomyces cerevisiae and Acetobacter aceti in liquid state bioreactors. Electronic Journal of Biotechnology 16(2). DOI 10.2225/vol16-issue2-fulltext-1. Complete 12-page SciELO original, especially Methods page 2, Table 1 and Figures 1–5. PDF publication date is 15 March 2013; Crossref gives 7 March 2013.
  url: https://doi.org/10.2225/vol16-issue2-fulltext-1
  accessed_on: '2026-10-12'
- id: pereira2025
  title: Pereira da Luz MV (2025 deposit). Statistical optimization of parameters for bioleaching of mine wastes from São Domingos Mine, Portugal. SINReM master's thesis, Microbiology and Biohydrometallurgy Working Group, TU Bergakademie Freiberg; public author-deposited Scriptiebank copy, complete 101-page PDF including appendices. The pyrite-ash arm is SD-BIO-2, with Tables 4.3–4.9 and Figures 5.12–5.14; this is a thesis experiment, not an independently peer-reviewed journal article.
  url: https://scriptiebank.be/file/21588/download?token=QIzLpVs8
  accessed_on: '2026-10-12'
- id: thesis_deposit
  title: Scriptiebank author and 2025 deposit record for Pereira da Luz's SINReM master's thesis. Establishes the public PDF's provenance and deposit year; its popular summary is not an additional experiment.
