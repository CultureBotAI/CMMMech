  evidence:
  - source_ref: kane_2026_bes
    supports: support
    explanation: FGDC process steps 1-4 and tables T1-T3 and T6 support the laboratory separation observation. In T3, the original biotic series has 975 mg/kg U at BESU.8Vb_W.EQ and less than 0.1 mg/kg at BESU.8Vb_W.END; the latter is encoded as -0.1, a detection limit, not zero or a negative concentration. T6 reports uranium in the subsequent electrode acid extract. These observations are not a mass-balanced recovery percentage or product purity measurement.
  - source_ref: kane_2026_bes
    supports: partial
    explanation: Abiotic T3 samples also decrease, from 914 mg/kg at BESU.8Va_W.t0 to 0.819 mg/kg at BESU.8Va_W.END. T2 shows different pH histories, and the source reports pre-electrolysis sorption. T6 original biotic and abiotic acid extracts use concentrated HCl and HNO3 respectively, so their amounts are not a matched assay of microbial enhancement. These controls limit attribution of the observed separation specifically to MR-1 metabolism.
  - source_ref: kane_2026_bes
    supports: support
    explanation: T9_SEM.pdf pages 2-6 show deposits and U-labelled EDS signals on both abiotic and biotic U electrodes, supporting electrode association. T8_XRD.csv supplies diffraction counts for these conditions and a carbon-felt blank, but this curation does not assign a crystalline phase or oxidation state from those data.
