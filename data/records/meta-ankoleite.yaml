    url: https://doi.org/10.1007/s00253-016-7327-9
    accessed_on: '2026-10-14'
  - id: liang2015
    title: >-
      Liang et al. (2015). Uranium phosphate biomineralization by fungi.
      Environmental Microbiology 17, 2064-2075.
      DOI 10.1111/1462-2920.12771. Complete original PDF inspected;
