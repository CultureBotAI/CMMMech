    - InterPro:IPR002372
    - InterPro:IPR011047
    - InterPro:IPR015943
    pfam_ids:
    - Pfam:PF13360
    functional_role: Periplasmic tetrathionate hydrolase (tth) in Acidithiobacillus thiooxidans ATCC 19377 disproportionating tetrathionate into thiosulfate, elemental sulfur, sulfate, and sulfuric acid protons during sulfur bioleaching.
    annotation_note: Grounded to reference-proteome entry UP000363590 for type strain Acidithiobacillus thiooxidans ATCC 19377 (NCBITaxon:637390), representing Acidithiobacillus thiooxidans DSM 14887 (NCBITaxon:930) in Fritze et al. (2026).
    evidence:
    - source_ref: fritze2026
      supports: partial
      explanation: Representative Acidithiobacillus thiooxidans ATCC 19377 tetrathionate hydrolase (tth) for sulfur-oxidizing acidification and gallium bioleaching from GaAs-production hydroxide sludge by Acidithiobacillus thiooxidans DSM 14887 in Fritze et al. (2026); individual sqr/tth genes were not mutated or directly assayed.
  evidence:
  - source_ref: fritze2026
    supports: support
    explanation: Sections 2.1-2.3, Table 2, Section 3.2 and Figure 3 report 94% of feed gallium in solution at the end of the 3% sludge assay, versus 77% in its acid-adjusted abiotic comparator. Figure 3 presents biotic means and SD; exact numeric SD is not transcribed here. These are leaching fractions, not an isolated-product recovery yield. The experiment remains laboratory scale despite the industrial origin of the sludge.
  - source_ref: fritze2026
    supports: partial
    explanation: Section 3.2 reports 86% gallium leached within the first day and attributes rapid dissolution chiefly to low pH. It calls the abiotic controls simplified and explicitly requests replicate confirmation of microbial facilitation. Section 3.4 reports faster chemical processing at higher solids loading and discusses downstream precipitation prospectively; neither selective gallium recovery nor industrial bioleaching deployment follows from these data. The abstract's Al:Fe ratio conflicts with Al:F in the methods and results; the curated flask dose follows Table 2, not the abstract's 1.4:1 reactor/optimization value.
