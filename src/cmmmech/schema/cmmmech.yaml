id: https://github.com/CultureBotAI/CMMMech/schema
name: cmmmech
title: Critical minerals and microbial mechanisms
description: Evidence-backed materials, dated criticality designations, and recovery mechanisms.
license: BSD-3-Clause
prefixes:
  linkml: https://w3id.org/linkml/
  cmmmech: https://github.com/CultureBotAI/CMMMech/records/
  UniProtKB: http://purl.uniprot.org/uniprot/
  InterPro: https://www.ebi.ac.uk/interpro/entry/InterPro/
  Pfam: https://www.ebi.ac.uk/interpro/entry/pfam/
  NCBIfam: https://www.ncbi.nlm.nih.gov/genome/annotation_prok/evidence/
  ComplexPortal: https://www.ebi.ac.uk/complexportal/complex/
  EC: https://www.ebi.ac.uk/intenz/query?cmd=SearchEC&ec=
  GO: http://purl.obolibrary.org/obo/GO_
default_prefix: cmmmech
default_range: string
imports:
  - linkml:types
  - mech_shared
  - history
types:
  NonEmptyText:
    typeof: string
    pattern: '\S'
  SourceKey:
    typeof: string
    pattern: '^[a-z][a-z0-9_-]*$'
  NumericSourceValue:
    description: Exact numeric source-cell text, before interpretation of detection-limit encoding.
    typeof: string
    pattern: '^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'
classes:
  CriticalMineralRecord:
    tree_root: true
    attributes:
      id:
        identifier: true
        required: true
        pattern: '^cmmmech:[a-z][a-z0-9-]*$'
      name:
        range: NonEmptyText
        required: true
      material_kind:
        range: MaterialKind
        required: true
      description:
        range: NonEmptyText
        required: true
      identifiers:
        range: NamedEntity
        multivalued: true
        inlined_as_list: true
      sources:
        range: Source
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined_as_list: true
      criticality:
        range: CriticalityDesignation
        multivalued: true
        inlined_as_list: true
      mechanisms:
        range: Mechanism
        multivalued: true
        inlined_as_list: true
      causal_graphs:
        description: >-
          Directed causal graphs representing molecular, genetic, biochemical,
          or environmental mechanisms for this material record, with explicit
          node types (including GENE_OR_PROTEIN) and UniProtKB protein groundings.
        range: CausalGraph
        multivalued: true
        inlined_as_list: true
      curation_history:
        description: Descriptive inline change events; not a substitute for scientific record reviews.
        range: CurationEvent
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      history_refs:
        description: >-
          Repository-relative paths to canonical HistoryRecord sidecars,
          separate from native inline curation_history events. Presence is
          advisory; supplied references must identify this record's history.
          Create sessions with just new-history, then append the returned path.
        multivalued: true
        pattern: '^history/records/[a-z][a-z0-9-]*/[A-Za-z0-9_.-]+\.yaml$'
  CurationEvent:
    description: Who changed or reviewed a record, when, and what was done.
    attributes:
      timestamp:
        range: datetime
        required: true
        pattern: '^20[0-9]{2}-'
      curator:
        range: NonEmptyText
        required: true
      action:
        range: NonEmptyText
        required: true
      summary:
        range: NonEmptyText
        required: true
  NamedEntity:
    attributes:
      id:
        required: true
        pattern: '^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$'
      label:
        range: NonEmptyText
        required: true
  Source:
    attributes:
      id:
        range: SourceKey
        required: true
      title:
        range: NonEmptyText
        required: true
      url:
        range: uri
        required: true
        pattern: '^https?://[^\s/]+(?:/[^\s]*)?$'
      accessed_on:
        range: date
        required: true
  CriticalityDesignation:
    attributes:
      jurisdiction:
        range: NonEmptyText
        required: true
      list_name:
        range: NonEmptyText
        required: true
      edition:
        range: NonEmptyText
        required: true
      classification:
        range: CriticalityClass
        required: true
      source_ref:
        range: SourceKey
        required: true
  Mechanism:
    attributes:
      id:
        range: SourceKey
        required: true
      name:
        range: NonEmptyText
        required: true
      process:
        range: ProcessType
        required: true
      description:
        range: NonEmptyText
        required: true
      context:
        range: NonEmptyText
        required: true
      microbial:
        range: boolean
        required: true
      organisms:
        range: NamedEntity
        multivalued: true
        inlined_as_list: true
      protein_examples:
        description: >-
          Representative UniProtKB protein entries (preferring reviewed Swiss-Prot
          or reference-proteome entries) grounding enzymes, transporters, cytochromes,
          chelators, or biomineralization templates implicated in this mechanism.
        range: ProteinExample
        multivalued: true
        inlined_as_list: true
      evidence:
        range: MechanismEvidence
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined_as_list: true
      observations:
        description: >-
          Selected source concentration cells associated with this mechanism,
          including abiotic controls. Presence does not establish microbial
          causality or turn concentration change into a recovery yield.
        range: ConcentrationObservation
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
  MechanismEvidence:
    attributes:
      source_ref:
        range: SourceKey
        required: true
      supports:
        range: SupportLevel
        required: true
      explanation:
        range: NonEmptyText
        required: true
  ConcentrationObservation:
    description: >-
      A reported mass-based elemental concentration or a below-detection limit,
      with its source cell and sample context. The current contract preserves
      numeric tables that encode below-detection limits with a negative sign.
      It does not represent estimates, recovery percentages, or pooled samples.
    attributes:
      id:
        range: SourceKey
        required: true
      source_ref:
        range: SourceKey
        required: true
      source_table:
        range: NonEmptyText
        required: true
      source_sample_id:
        range: NonEmptyText
        required: true
      source_column:
        range: NonEmptyText
        required: true
      raw_value:
        range: NumericSourceValue
        required: true
      analyte:
        range: NamedEntity
        required: true
        inlined: true
      material_form:
        range: NonEmptyText
        required: true
      sampled_fraction:
        range: NonEmptyText
        required: true
      study_arm:
        description: Assigned experiment arm, not proof that cells were present when sampled.
        range: StudyArm
        required: true
      result_status:
        range: ConcentrationResultStatus
        required: true
      value:
        description: Finite nonnegative reported concentration; only present for measured results.
        range: float
        minimum_value: 0
      detection_limit:
        description: Finite positive upper boundary; only present for below-detection results.
        range: float
        minimum_value: 0
      unit:
        range: MassBasedConcentrationUnit
        required: true
      analyzed_on:
        description: Source analysis date, never substituted for sample collection date.
        range: date
        required: true
      sampled_on:
        description: Independently sourced collection date; omit when unresolved.
        range: date
      sampling_source_locator:
        description: Table, exact sample key and date column within source_ref supporting sampled_on.
        range: NonEmptyText
      context:
        description: Analytical basis, sample timing and limits needed to interpret this cell.
        range: NonEmptyText
        required: true
  CausalGraph:
    description: >-
      A directed causal graph of molecular, genetic, biochemical, or environmental
      steps mediating a critical mineral interaction mechanism.
    attributes:
      id:
        range: SourceKey
        required: true
      name:
        range: NonEmptyText
        required: true
      description:
        range: NonEmptyText
        required: true
      scope:
        range: CausalGraphScopeEnum
        required: true
      mechanism_ref:
        description: Optional ID of the Mechanism in this record represented by this causal graph.
        range: SourceKey
      nodes:
        range: CausalNode
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined_as_list: true
      edges:
        range: CausalEdge
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined_as_list: true
  CausalNode:
    description: >-
      A node in a causal graph. GENE_OR_PROTEIN nodes represent specific genes,
      operons, enzymes, transporters, cytochromes, or protein complexes and carry
      verified UniProtKB protein_examples when grounded.
    attributes:
      id:
        range: SourceKey
        required: true
      label:
        range: NonEmptyText
        required: true
      node_type:
        range: CausalNodeTypeEnum
        required: true
      description:
        range: NonEmptyText
      term:
        range: NamedEntity
        inlined: true
      gene_symbol:
        range: NonEmptyText
      protein_grounding_status:
        range: ProteinGroundingStatusEnum
        required: true
      protein_examples:
        range: ProteinExample
        multivalued: true
        inlined_as_list: true
  CausalEdge:
    description: A directed causal or mechanistic relationship between two nodes in a CausalGraph.
    attributes:
      source:
        range: SourceKey
        required: true
      target:
        range: SourceKey
        required: true
      predicate:
        range: CausalPredicateEnum
        required: true
      relationship:
        range: NonEmptyText
      description:
        range: NonEmptyText
      evidence:
        range: MechanismEvidence
        multivalued: true
        inlined_as_list: true
  ProteinExample:
    description: >-
      A verified UniProtKB protein entry grounding a GENE_OR_PROTEIN causal node
      or an interaction mechanism, with organism, reference proteome, and family
      cross-references.
    attributes:
      uniprot_accession:
        required: true
        pattern: '^UniProtKB:([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})(-[0-9]+)?$'
      entry_name:
        range: NonEmptyText
        pattern: '^[A-Z0-9]+_[A-Z0-9]+$'
      protein_name:
        range: NonEmptyText
        required: true
      gene_symbol:
        range: NonEmptyText
      entry_status:
        range: UniProtEntryStatusEnum
        required: true
      target_organism:
        range: NamedEntity
        required: true
        inlined: true
      reference_proteome_id:
        range: string
        pattern: '^UP[0-9]{9}$'
      ec_numbers:
        range: string
        multivalued: true
        pattern: '^EC:[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+|-|n[0-9]+)$'
      interpro_ids:
        range: string
        multivalued: true
        pattern: '^InterPro:IPR[0-9]{6}$'
      pfam_ids:
        range: string
        multivalued: true
        pattern: '^Pfam:PF[0-9]{5}$'
      ncbifam_ids:
        range: string
        multivalued: true
        pattern: '^NCBIfam:(TIGR[0-9]{5}|NF[0-9]{6})$'
      complex_portal_id:
        range: string
        pattern: '^ComplexPortal:CPX-[0-9]+$'
      go_terms:
        range: NamedEntity
        multivalued: true
        inlined_as_list: true
      functional_role:
        range: NonEmptyText
        required: true
      annotation_note:
        range: NonEmptyText
      evidence:
        range: MechanismEvidence
        multivalued: true
        inlined_as_list: true
enums:
  ConcentrationResultStatus:
    permissible_values:
      measured:
      below_detection:
  MassBasedConcentrationUnit:
    permissible_values:
      mg/kg:
  StudyArm:
    permissible_values:
      biotic:
      abiotic:
  MaterialKind:
    permissible_values:
      element:
      mineral:
      mineral_group:
      commodity:
      primary_resource:
        description: >-
          A naturally occurring geological resource or extracted feed whose
          identity remains that resource, such as lithium-bearing geothermal
          brine. Distinct from a mineral species, traded product specification,
          or secondary material generated by use or processing.
      secondary_resource:
  CriticalityClass:
    permissible_values:
      critical:
      strategic:
      not_listed:
      unknown:
  ProcessType:
    permissible_values:
      bioleaching:
      biosorption:
      biomineralization:
      redox_transformation:
      separation:
      recovery:
      recycling:
      other:
  SupportLevel:
    permissible_values:
      support:
      partial:
      refute:
      context_only:
  CausalGraphScopeEnum:
    permissible_values:
      REPRESENTATIVE_EXAMPLE:
        description: Graph models a specific well-characterized model strain or experimental study.
      BROAD_MECHANISM:
        description: Graph models a conserved biochemical pathway or mechanism shared across taxa.
      RECORD_SPECIFIC_MECHANISM:
        description: Graph models the exact material-organism-process interaction in this record.
  CausalNodeTypeEnum:
    permissible_values:
      GENE_OR_PROTEIN:
        description: A specific gene, operon, enzyme, transporter, cytochrome, chelator, or protein complex.
      CHEMICAL_ENTITY:
        description: A dissolved ion, organic acid, metabolite, ligand, electron donor, or gas.
      BIOLOGICAL_PROCESS:
        description: A cellular, metabolic, physiological, or regulatory process.
      CELLULAR_STRUCTURE:
        description: A cell wall polymer, membrane, periplasm, biofilm matrix, or cell surface.
      PHENOTYPE_OR_TRAIT:
        description: An organismal phenotype, growth response, or functional trait.
      ENVIRONMENTAL_CONDITION:
        description: pH, redox potential, temperature, nutrient limitation, or solution chemistry state.
      MATERIAL_OR_PHASE:
        description: A mineral phase, solid substrate, precipitate, ore concentrate, or material product.
  ProteinGroundingStatusEnum:
    permissible_values:
      GROUNDED:
        description: Node is grounded to one or more verified UniProtKB entries in protein_examples.
      UNGROUNDED:
        description: >-
          Node represents a gene or protein whose exact sequence or strain entry
          is absent from or obsolete in UniProtKB (documented in description).
      NOT_APPLICABLE:
        description: Node is not a single groundable protein or gene product.
  UniProtEntryStatusEnum:
    permissible_values:
      SWISS_PROT:
        description: Manually annotated and reviewed UniProtKB/Swiss-Prot entry.
      TREMBL:
        description: Computationally analyzed UniProtKB/TrEMBL entry.
  CausalPredicateEnum:
    permissible_values:
      acts_on:
      assembles_into:
      binds:
      catalyzes:
      chelates:
      displays_on_surface:
      drives:
      incorporates_into:
      inhibits:
      modulates:
      negatively_regulates:
      nucleates:
      oxidizes:
      positively_regulates:
      produces:
      provides_electrons_to:
      reduces:
      supplies_substrate_for:
      transforms_into:
      transports:

