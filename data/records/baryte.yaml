id: cmmmech:baryte
name: Baryte commodity
material_kind: commodity
description: The crude, crushed and ground barite raw-material commodity, also named baryte in
  the original EU 2024 critical-materials list. USGS reports mined barite and products sold by
  crushers and grinders for uses including drilling-fluid weighting and fillers. This record denotes
  that traded industrial material, with variable feed and product specifications, rather than
  a single mineral specimen, the barite mineral species as a taxonomic concept, or elemental barium.
  The US list uses Barite and the EU list uses baryte; both entries are mapped to this commodity
  scope. No mineral-species identifier or microbial mechanism is asserted.
