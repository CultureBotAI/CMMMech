limitations:
- The original study conflicts on the93% pulp-density arm, both day-28 labels and
  sieve preparation; unresolved source inconsistencies remain explicit.
- Main working liquid volume and percentage loading basis are unclear; companion conditions
  do not retroactively resolve them.
- No pH-trajectory-matched sterile comparison, direct V speciation, quantified survival
  or isolated causal test establishes a specific enzyme/reduction mechanism.
- Residue masses and complete V balances are unavailable; liquid percentages and residue
  concentrations are different measurements, and no isolated product or industrial
  deployment is demonstrated.
- Companion residue evidence is related same-group work, not independently verified
  replication; residual SPLP V/Al remain and no safety or regulatory determination
  is made.
- Correction searches cover declared first-returned sets only. Primary files were
  curator-downloaded and independently inspected; no raw-data reanalysis was performed.
notes:
- Target and source-dossier orientation preceded canonical inspect; detailed scientific
  assessment followed exact-state capture.
- All relevant primary main figures/tables and all three supplement image panels were
  visually inspected. Companion Table1 was text-inspected, while Figures1–3 and Tables2–4
  were also visually inspected.
- No review defect was found, so no corrective record edit or review issue is proposed.
  Existing evidence limitations are not converted into invented curation errors.
- 'First save rejected a target-kind metadata value: record was corrected to shared
  maintained. Target/input hashes and scientific assessment were unchanged; no review
