id: cmmmech:scheelite
name: Scheelite
material_kind: mineral
description: Scheelite is the Ca(WO4) mineral species in the September 2026 IMA list, with grandfathered status G and original-description year 1821. It is distinct from elemental tungsten, tungstate ions, wolframite and impure tungsten concentrates. The experiment below reuses the Blazevic 2019 study also represented under tungsten, with a scheelite-bearing mixed feed; it is not an independent replicate or evidence for a pure-mineral yield. No constituent-element criticality is inherited.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 194, Scheelite row; page 1 column definitions and page 2 distribution terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: blazevic2019
  title: 'Blazevic et al. (2019). Biotransformation of Scheelite CaWO4 by the Extreme Thermoacidophile Metallosphaera sedula: Tungsten-Microbial Interface. Frontiers in Microbiology 10:1492; Materials and Methods, Results and Discussion, Figures 1-7 and Table 1.'
  url: https://doi.org/10.3389/fmicb.2019.01492
  accessed_on: '2026-10-11'
- id: ncbi_metallosphaera
  title: NCBI Taxonomy 43687 - Metallosphaera sedula; species, with DSM5348 listed among type-strain designations.
  url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=43687&retmode=xml
  accessed_on: '2026-10-11'
