id: cmmmech:cobalt-rich-ferromanganese-crusts
name: Cobalt-rich ferromanganese crusts
material_kind: primary_resource
description: Naturally occurring layered iron-manganese oxide and oxyhydroxide deposits on exposed marine
  rock surfaces, commonly seamounts. This resource identity covers the cobalt-bearing, predominantly hydrogenetic
  crusts formed by accumulation from seawater; it does not denote every hydrothermal encrustation. The
  heterogeneous crust material is distinct from sediment-hosted polymetallic nodules, constituent cobalt
  or manganese elements, a pure mineral species, and a processing residue. Maciąg et al. characterize
  crusts and their altered basalt interfaces from Dirck Hartog Ridge; their sample-specific mineral mixtures
  are not a universal formula or grade. Collection and physical preparation do not make this geological
  resource secondary. This identity-only record inherits no constituent criticality and makes no microbial
  extraction, metal-recovery yield or industrial-deployment claim. Experimental microbial leads remain
  in the source dossier pending complete assay and control review.
sources:
- id: usgs2025
  title: U.S. Geological Survey (2025). U.S. Geological Survey Global Seabed Mineral Resources. Fact Sheet
    2025–3017, version 1.1, April 2025; page 2, Table 1 distinguishes rock-surface cobalt-rich ferromanganese
    crusts from abyssal-sediment polymetallic nodules. Constituent asterisks refer to the U.S. 2022 critical-mineral
    list, not a criticality designation for the resource. Previously acquired official PDF re-inspected.
  url: https://pubs.usgs.gov/fs/2025/3017/fs20253017.pdf
  accessed_on: '2026-10-11'
- id: maciag2019
  title: Maciąg, Zawadzki, Kozub-Budzyń, Piestrzyński, Kotliński and Wróbel (2019). Mineralogy of Cobalt-Rich
    Ferromanganese Crusts from the Perth Abyssal Plain (E Indian Ocean). Minerals 9(2):84. DOI 10.3390/min9020084.
    Primary 33-page paper; Introduction, Methods 3, Results 4.1–4.2, Table 1 and Figures 2–4 establish
    geological substrate and heterogeneous material identity; no microbial assay is inferred.
  url: https://doi.org/10.3390/min9020084
  accessed_on: '2026-10-11'
