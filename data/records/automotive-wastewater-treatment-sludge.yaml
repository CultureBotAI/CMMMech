id: cmmmech:automotive-wastewater-treatment-sludge
name: Automotive wastewater-treatment sludge
material_kind: secondary_resource
description: Sludge generated by wastewater treatment at an automotive factory, represented by the nickel- and zinc-bearing feed studied by Yagnentkovsky et al. (2009). The paper does not identify the factory or resolve its individual contributing processes and mineral phases. This secondary-resource identity is distinct from untreated wastewater, municipal sewage sludge, pure nickel or zinc compounds, and spent automotive exhaust catalysts. The selected feed does not define all automotive treatment sludges, and no constituent-element criticality is inherited.
sources:
- id: yagnentkovsky_2009
  title: Yagnentkovsky, Viera and Donati (2009). Recovery of Nickel and Zinc Using Biogenerated Sulphuric Acid. Advanced Materials Research 71-73:649-652. DOI 10.4028/www.scientific.net/AMR.71-73.649. Full repository PDF, methods pp. 649-650 and Figures 1-3, inspected; PDF p. 5 is an appended reference-link page.
  url: https://doi.org/10.4028/www.scientific.net/AMR.71-73.649
  accessed_on: '2026-10-11'
- id: dsm_11478
  title: 'DSMZ culture catalogue: Acidithiobacillus thiooxidans DSM 11478, strain Tth04; Brazilian mine-drainage origin and Donati collection history. Culture-collection context, not a new sludge experiment.'
  url: https://www.dsmz.de/collection/catalogue/details/culture/DSM-11478
  accessed_on: '2026-10-11'
- id: ncbi_thiooxidans
  title: 'NCBI Taxonomy 930: Acidithiobacillus thiooxidans, species. This taxon ID does not identify the experimental strain DSM 11478.'
