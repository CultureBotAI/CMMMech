    annotation_note: Grounded to Geobacter sulfurreducens PCA reference proteome UP000000577 (NCBITaxon:243231) for the species-level mechanism organism Geobacter sulfurreducens (NCBITaxon:35554).
    evidence:
    - source_ref: watts2015
      supports: partial
      explanation: Representative Geobacter sulfurreducens PCA inner-membrane cytochrome CbcL (GSU0274) for extracellular electron transfer to 50 mM ferrihydrite with 20 mM acetate and 10 uM AQDS during upstream biogenic magnetite preparation in Watts et al. (2015); individual cytochrome genes were not mutated.
  evidence:
  - source_ref: watts2015
    supports: support
    explanation: Sections 2.1, 2.3-2.5, 2.8, 3.5-3.6 and Figures 6-8 support the residue identity, separately produced biogenic reagent and reductive stabilization. With 5 or 10% magnetite, aqueous Cr(VI) fell below 1 micromolar within one day; no-addition controls remained about 1.3 mM during the 100-day experiment. Lower magnetite additions left measurable aqueous Cr(VI). Linear combination fits to day-50 Cr K-edge XANES gave 26% of total Cr as Cr(VI) in the control and 7% after either 5 or 10% magnetite. These are fitted oxidation-state proportions, not isolated-product yields or mass fractions of the entire residue. Spectral shapes were consistent with Cr(III) hydroxide-like products, while XRD did not resolve a new crystalline Cr(III) phase; no unique product mineral or complete conversion is assigned.
  - source_ref: watts2015
    supports: partial
    explanation: Sections 3.5-3.6 preserve both analytical and treatment limits. Alkaline extraction indicated only 7% of initial total Cr as Cr(VI), versus the 26% XANES fit. The authors attribute this to incomplete extraction of resistant Cr(VI); the methods are not treated as interchangeable. Remaining Cr(VI) after excess reagent is interpreted as poorly soluble or inaccessible, not absent. The synthetic zero-valent-iron comparator required a smaller dose for aqueous removal and reached fitted bulk Cr(VI) proportions of 4-7%; that range is not assigned to the biogenic magnetite arm. No viable-cell versus killed-cell comparison establishes a living-cell contribution during COPR treatment.
  - source_ref: watts2015
    supports: partial
    explanation: 'Sections 2.9 and 3.7 and Figure 9 describe a separate air challenge after the initial 100 days: 25 mL portions were transferred to 250 mL flasks, shaken at 100 rpm in the dark at 20 degrees C, with headspace re-equilibrated every 2-4 days, and followed for another 100 days. All magnetite-dose arms showed some aqueous Cr(VI) remobilization; the authors describe the higher dose increases as less than 10% of the original Cr(VI) values. They explicitly leave oxidation of Cr(III) versus altered solubility of residual Cr(VI) unresolved. The broader discussion''s stability language does not establish no rebound, complete detoxification or indefinite field stability.'
  - source_ref: watts2015_supplement
    supports: partial
    explanation: Figure SI 1 supports magnetite as the detected crystalline phase in the biogenic reagent and mixed metallic iron/magnetite in the synthetic comparator. Figure SI 2 fits early aqueous removal in model chromate solutions and separately sampled groundwater; these fitted rates are not COPR-treatment rates.
  - source_ref: watts2015
    supports: partial
    explanation: Sections 3.3-3.4 and 4, Figures 1-5 and Tables 2-3 show incomplete electron utilization, stronger passivation in complex groundwater and inhibition by oxygen. Proposed in situ injection and reactive barriers were not demonstrated; the authors identify reagent-dose, clogging and passivation obstacles to deployment.
