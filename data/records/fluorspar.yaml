id: cmmmech:fluorspar
name: Fluorspar
material_kind: commodity
description: The calcium-fluoride raw-material commodity used in acid production, metallurgy and
  other industrial applications. The USGS definition covers crude or beneficiated material mined
  or milled for fluorite; its 2026 commodity chapter distinguishes acid and metallurgical grades
  and also recognizes synthetic fluorspar from recycling processes. This commodity record does
  not identify elemental fluorine, dissolved fluoride, or the fluorite mineral species, and does
  not assert one grade or universal purity specification. US and EU named fluorspar designations
  are recorded directly. No microbial mechanism is asserted.
