id: cmmmech:goethite
name: Goethite
material_kind: mineral
description: >-
  Goethite is the FeO(OH) mineral species listed as approved (A), with 1980
  special-procedure history, in the IMA-CNMNC September 2026 master list. It is
  distinct from iron element, other iron oxyhydroxide minerals, iron-ore
  commodities and mixed goethite-bearing tailings. The natural mineral feeds
  below have sample-specific compositions; synthetic goethite preparations can
  contain more reactive precursor phases. No iron criticality designation is
  inherited.
