id: cmmmech:fish-bone-residues
name: Fish-bone residues
material_kind: secondary_resource
description: Phosphorus-bearing fish-bone residues investigated as a secondary feed for nutrient reuse,
  represented by fish bones of unspecified species and supply provenance ground and sieved to below 1
  mm in the selected laboratory studies. The organic-mineral feed is distinct from elemental phosphorus,
  purified hydroxyapatite, phosphate rock, manure and bone-incineration ash. The inspected methods do
  not establish a cooking or industrial processing history for this fish-bone feed. Material composition
  and treatment effects remain specimen-specific; no constituent criticality designation is inherited.
