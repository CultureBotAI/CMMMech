    node_type: BIOLOGICAL_PROCESS
    description: Enzymatic consumption of free catechol over the first ~10 h while Ge-bound catechol resists cleavage when GeO2 is equimolar or in excess (leaving ~42-48% residual complexed catechol at 32 h), whereas excess initial catechol permits complete catechol degradation and subsequent release of cell-bound Ge.
