id: cmmmech:oil-sands-froth-treatment-tailings
name: Oil-sands froth-treatment tailings
material_kind: secondary_resource
description: >-
  Mineral-bearing residue from bitumen froth treatment, represented here
  by naphtha-process tailings from Plant 6 at the Mildred Lake Settling
  Basin, Alberta, Canada. The heterogeneous solids include quartz,
  titanium-bearing minerals, zircon, sulfides and carbonates, with residual
  hydrocarbons. This processing waste is distinct from its constituent
  elements or mineral species, underlying straight coarse tailings,
  fluid fine tailings and petroleum coke. These site-specific studies
  do not define all froth-treatment processes or establish an economic
  reserve, a criticality designation or industrial metal recovery.
sources:
  - id: ferry2025
    title: >-
      Ferry, Abdolahnezhad and Lindsay (2025), Acid neutralization and
      metal mobilization in oil sands froth treatment tailings.
      Geochemical Transactions 26, 10. Complete 18-page publisher
      article, Figures 1-6, Tables 1-2 and original DOCX supplement
      with Figures S1-S8 and Table S1.
    url: https://doi.org/10.1186/s12932-025-00106-1
    accessed_on: '2026-10-12'
  - id: lindsay2019
    title: >-
      Lindsay, Vessey and Robertson (2019), Mineralogy and geochemistry
      of oil sands froth treatment tailings: Implications for acid
      generation and metal(loid) release. Applied Geochemistry 102,
      186-196. Complete 39-page institutional accepted manuscript,
      Figures 1-6, Table 1 and publisher DOCX supplement with
      Figures S1-S5 and Tables S1a-S1b.
    url: https://doi.org/10.1016/j.apgeochem.2019.02.001
    accessed_on: '2026-10-12'
  - id: balaberda2026
    title: >-
      Balaberda and colleagues (2026), Biogeochemical characterization
      of froth treatment tailings. Chemosphere 394, 144800; available
      online 12 December 2025. Complete 13-page article and original
      DOCX supplement, including Figures 1-7, Figures S1-S9,
      Tables S1-S6 and supplementary methods Texts S1-S2.
    url: https://doi.org/10.1016/j.chemosphere.2025.144800
    accessed_on: '2026-10-12'
  - id: ncbi_bioproject
    title: >-
      NCBI BioProject PRJNA1363209, Biogeochemical Characterization of
      Froth Treatment Tailings. Official accession and study-title
      verification only; sequence reads were not reanalyzed.
    url: https://www.ncbi.nlm.nih.gov/bioproject/PRJNA1363209
    accessed_on: '2026-10-12'
mechanisms:
  - id: sulfuric_acid_column_mobilization
    name: Sulfuric-acid-driven mobilization from weathered processing residue
    process: other
    microbial: false
    description: >-
      Acid-fed laboratory columns released metals and metalloids from
      froth-treatment tailings while mineral reactions buffered the
      effluent pH. Weathering state and prior solvent washing affected
      the release patterns. This is a chemical mobilization experiment;
      microbial false classifies the tested treatment and does not claim
      that the environmental feed was sterile. Neither recovered metal
      products nor a microbial advantage were demonstrated.
    context: >-
      Ferry et al. compared non-weathered, partially weathered and highly
      weathered beach material, each as received and after Dean-Stark
      toluene washing. Six acrylic columns, 10 cm long and 6 cm internal
      diameter, represented the six treatments, without independently
      replicated columns. After deionized-water saturation, the reported
      influent was 0.05 M sulfuric acid at approximately pH 1.5, supplied
      at approximately 0.33 pore volumes per day. Those concentration
      and pH descriptions are retained as reported rather than reconciled
      by a speciation calculation. Effluent was sampled approximately
      every pore volume until pH was consistently below 2. Table S1 gives
      total throughput of 117.8, 110.0, 99.3, 85.6, 77.9 and 75.0 pore
      volumes for NW, NW-SW, PW, PW-SW, HW and HW-SW, respectively.
      Temperature and a common elapsed-day endpoint are not specified.
      No inoculated versus sterile or otherwise matched biological
      comparison is reported.
    evidence:
      - source_ref: ferry2025
        supports: support
        explanation: >-
          Figures 1-3 show staged acidification and element-specific
          effluent profiles. The non-weathered and partially weathered
          columns initially buffered pH near neutral before acidification;
          the highly weathered columns stayed below pH 2. Major-element
          panels use mg/L, whereas the Co, Ni, Zn and other trace-element
          panels use micrograms/L. Figures 6 and S7 report cumulative
          elemental release normalized to solid mass, not percentages
          of an initial recoverable inventory or isolated-product yields.
          The different total throughputs preclude treating all endpoints
          as equal-duration or equal-dose tests.
      - source_ref: ferry2025
        supports: partial
        explanation: >-
          Table 1 gives relative XRD phase abundances before and after
          treatment. Carbonate loss and changes in the assemblage support
          mineral reactions, but relative enrichment of residual rutile,
          anatase or zircon does not demonstrate their formation or
          recovery. Saturation indices in Figures 5 and S5 are modeled
          results, not direct identification of every proposed secondary
          phase; the text states that Al hydroxides were not identified
          by XRD. Trace-element release in Figure S6 does not establish
          a unique mineral host or complete dissolution of that host.
      - source_ref: ferry2025
        supports: partial
        explanation: >-
          Solvent washing did not universally increase every element's
          mobilization: Figure S7 and the discussion retain greater
          cumulative As release in the unwashed NW and PW treatments.
          Table 2 also distinguishes three neutralization-potential
          methods; washing increases NP-1 and NP-2 in those pairs but
          decreases the reported ABA-derived NP-3. The Results assign
          a Co maximum of 2250 micrograms/L to non- and partially
          weathered material, whereas Figure 3 places the prominent
          initial high-Co pulse in the highly weathered series. No
          treatment-specific Co maximum is adopted from that mismatch.
      - source_ref: ferry2025
        supports: partial
        explanation: >-
          Initial bitumen contents were measured in unwashed material;
          absence after solvent washing was assumed rather than
          independently quantified. Washing can change accessibility
          and initial composition, so it is not a selective biological
          control. Major and trace elements were measured after 0.45
          and 0.2 micrometer filtration, respectively; these operational
          fractions do not exclude every colloid. The supplement notes
          no replicate initial bulk analyses because of limited material.
          Source-site industrial operation is distinct from deployment
          of the laboratory acid treatment as a recovery process.
      - source_ref: lindsay2019
        supports: context_only
        explanation: >-
          Sections 2.1-2.3, Table 1, microscopy Figures 2-3 and original
          diffraction patterns in Figure S1 establish the processed
          origin and mixed mineralogy of fresh and beach-deposited FTT.
          Froth treatment separates bitumen from solids and water;
          residual naphtha is recovered before tailings hydrotransport.
          These solvent-washed specimens contain titanium oxides,
          zircon, pyrite and other phases in a quartz-rich heterogeneous
          residue. Constituent identities are evidence about this waste,
          not interchangeable identifiers for the whole material.
      - source_ref: lindsay2019
        supports: partial
        explanation: >-
          The 2019 study characterizes mineralogy, bulk chemistry and
          static acid-base properties, without a microbial extraction
          experiment. Its fresh-sample years differ between Methods
          (2013 and 2016), Results/Table S1 (2015) and Figure S4's caption
          (2013). Abstract and Results mineral-group averages also differ.
          Table S1a is headed quantitative XRD although it lists elemental
          chemistry, with inconsistent mean-versus-range entries for
          some major elements. No unified grade, numerical recovery or
          matched replication across the three publications is inferred.
      - source_ref: balaberda2026
        supports: context_only
        explanation: >-
          A separate November-December 2019 field survey sampled six
          locations through the deposit and underlying straight coarse
          tailings. The study analyzed 119 microbial-community samples,
          with geochemistry for 80 and mineralogy for 48; the combined
          environmental-correlation subset contained 36 samples.
          Figures 5-7 and S5-S9 describe 16S rRNA gene community
          distributions and associations. No independent interval
          replicates were collected. Community presence and correlations
          do not demonstrate active sulfate reduction, metal extraction
          or causal metal recovery. Functional roles were inferred from
          prior literature, and the authors explicitly call for functional
          validation; methane emissions were not measured in this study.
      - source_ref: balaberda2026
        supports: partial
        explanation: >-
          Supplementary Text S1 treats some samples not analyzed for
          naphtha as non-detects and replaces below-detection values
          with half the detection limit. These are imputations rather
          than measured concentrations. The article and supplement
          differ over Type II versus Type III ANOVA and Tukey versus
          Sidak adjustment descriptions. Unequal group sizes, dispersion
          differences and the limited chemistry subset further constrain
          causal interpretation. Some plotted genus-level annotations
          are actually unresolved higher ranks. No cultured strain,
          enzyme activity, biomass-normalized extraction or biological
          yield is assigned to this resource from these observations.
      - source_ref: ncbi_bioproject
        supports: context_only
        explanation: >-
          Official NCBI metadata resolves PRJNA1363209 to the matching
          froth-treatment-tailings study and raw-sequence-read project.
          This verifies the accession, not the authors' ecological
          inferences or the completeness and reproducibility of a new
          sequence analysis. No organism identifier is assigned to the
          environmental mixture as if it were an authenticated isolate.
