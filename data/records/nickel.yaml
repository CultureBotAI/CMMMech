id: cmmmech:nickel
name: Nickel
material_kind: element
description: Nickel (Ni), atomic number 28. The ChEBI nickel-atom identifier grounds this element-level record; nickel ions, alloys, mineral species and heterogeneous laterite ores are different entities. The US designation maps the listed nickel commodity to this element and does not designate every nickel-bearing ore or waste. The curated experiment concerns nickel mobilization from particular laterite samples, not dissolution of elemental nickel.
