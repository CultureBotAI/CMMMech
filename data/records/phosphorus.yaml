description: >-
  Phosphorus (P), the chemical element. Canada's named phosphorus material
  designation is mapped to this element; it is not a designation of every
  phosphate salt or mineral. The experiment concerns phosphate mobilization
  from a mixed struvite/dittmarite feed, not elemental phosphorus production.
