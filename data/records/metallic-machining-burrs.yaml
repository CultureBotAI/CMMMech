  evidence:
  - source_ref: gomez_ramirez2020_burrs
    supports: support
    explanation: Section 4.2 and Table 1 on page 8 establish the actual industrial burr feed and its measured elemental composition. Table 1 reports 410159.5 +/- 21163.2 mg/kg Fe and additional Cr, Si, Al, Mo, V, Mn, Mg, Ni, Cu, Sb, Li and Zn. It does not establish a named alloy or mineral phase; the unusually large Al dispersion is retained as source uncertainty rather than corrected. The introduction's generic machining examples do not identify the sampled factory's exact process. No coolant-sludge or slag result is transferred.
  - source_ref: gomez_ramirez2020_burrs
    supports: support
    explanation: Figures 1-3 on pages 3-4 compare inoculated and uninoculated arms. Sulfate and titratable acidity rise with the culture while controls remain low; inoculated pH decreases while control pH increases. The plotted significance groups do not distinguish days 14 and 21 for these endpoints. Figure 3 labels its time axis in hours, whereas Sections 2.1 and 4.3 and Figures 1-2 specify days; the experimental duration follows the explicit 21-day methods and the conflicting axis is preserved as a source error. The abstract and Figure 2 indicate approximately 0.16 M acidity, while Results and Discussion quote 0.15 M. Neither titration nor sulfate alone identifies a particular enzyme or proves direct attack on metal.
  - source_ref: gomez_ramirez2020_burrs
    supports: partial
    explanation: Figure 3 shows different starting pH values, approximately 2.5 in the inoculated arm and 3 in controls, consistent with unequal inoculum chemistry rather than a pH-matched causal comparison. Modified Starkey medium contains MgSO4, FeSO4, ammonium sulfate and added molybdate and was initially acidified with sulfuric acid. Control subtraction is described, but separate medium-only, washed-inoculum, pH-matched acid, killed-cell and sulfur-free arms are not reported. The experiment supports culture association and acidification, not unique attribution of all measured metal to burr dissolution or separation of acidity from other culture effects. The sulfate method designation in Section 4.3 also differs from the standard named by reference 36.
  - source_ref: gomez_ramirez2020_burrs
    supports: partial
    explanation: Section 2.2 and Figure 4 on page 4 report small metal removal values, including 4658.5 mg/kg Fe and 63.2 mg/kg Mo, alongside source-labeled percentage values. Section 4.4 on page 9 describes a day-zero/day-21 concentration difference with abiotic-loss subtraction, but prints the percentage equation with control metal content in the numerator and metal removal in the denominator. This does not supply a coherent independently reproducible recovery calculation. The liquid-to-mg/kg normalization, individual control metal data, full residue and precipitate mass balance, analytical recovery and uncertainty propagation are not supplied. The reported concentrations are retained as source-defined assay outcomes, not validated extraction fractions or recovered-product yields; no replacement formula is silently imposed.
  - source_ref: gomez_ramirez2020_burrs
    supports: partial
    explanation: Discussion page 6 proposes acid-mediated dissolution and mentions brown precipitates, including precipitation during NaOH titration. Their composition and metal content were not characterized; the suggested ferrous-sulfate assignment is not phase evidence. The oxidation equations are mechanistic proposals rather than direct speciation or molecular measurements. No selective metal recovery, product purity, economics, detoxification endpoint or industrial treatment was demonstrated. Suggested downstream biosorption or precipitation remains prospective.
  - source_ref: gomez_ramirez2021_context
    supports: context_only
    explanation: 'The same group''s 2021 original Sections 2-3, Figures 1-2 and Tables 1-2 describe two separately named and compositionally different Mexico City industrial feeds, crushed below 1000 micrometres: IW-steel and IW-scrap. The Al-rich IW-scrap arm did not acidify and its sulfate response was lower than IW-steel; this cautions against assuming uniform response across machining wastes. These feed identities and results are not assigned to the 2020 burr batch, and overlapping authors, strain and assay approach do not constitute independent replication. The 2021 paper has its own concentration, volume and textual inconsistencies; its percentages and proposed metal-toxicity mechanism are not imported as burr performance or demonstrated causal effects.'
  - source_ref: ncbi_thiooxidans
    supports: context_only
    explanation: The current NCBI species entry resolves Acidithiobacillus thiooxidans to NCBITaxon:930. This validates the species-level label only. DSM 26636 remains the original study's strain designation; the queried DSMZ catalogue route redirected to a generic search page and did not independently confirm the experimental stock or alias.
