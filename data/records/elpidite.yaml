      methods on pages 236-237; source-assigned elpidite in Figure 3B,
      Figures 6-7, Table 6 and pages 240-243. Table 4 also lists IL-356.
      Separate supplementary tables and analytical appendix remain
      unavailable and are not claimed as inspected.
    url: https://doi.org/10.24425/agp.2022.140427
