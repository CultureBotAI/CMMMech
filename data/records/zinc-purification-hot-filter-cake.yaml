id: cmmmech:zinc-purification-hot-filter-cake
name: Zinc purification hot filter cake
material_kind: secondary_resource
description: Mixed precipitated solids removed during the hot purification of zinc leach liquor, before the subsequent zinc-powder cementation stage. The accepted specimen is hot filter press cake (HFC) from the National Iranian Lead and Zinc Company in Zandjan, Iran, containing zinc, cobalt and manganese. This processing residue is distinct from zinc leach residue, cold purification filter cake, a pure oxide mineral, or elemental zinc. Its laboratory chemical leaching does not establish a microbial mechanism, a criticality designation, purified-metal production or industrial deployment of the tested treatment.
sources:
- id: haghshenas2007
  title: 'Haghshenas, Darvishi, Mos''hefi Shabestari, Keshavarz Alamdari and Sadrnezhaad (2007). Leaching Recovery of Zinc, Cobalt and Manganese from Zinc Purification Residue. IJE Transactions B: Applications 20(2):133-140. Complete eight-page original on the coauthor''s host; Sections 2-4, Table 1 and Figures 1-5. No DOI asserted.'
  url: https://docs.sadrn.com/papers/278.pdf
  accessed_on: '2026-10-16'
mechanisms:
- id: sequential_acid_peroxide_leaching
  name: Abiotic acid leaching followed by peroxide-assisted dissolution
  process: separation
  description: Sulfuric acid mobilized zinc from a mixed hot purification cake; a subsequent acid/peroxide treatment of the remaining residue increased dissolved cobalt and manganese. Solution concentrations support chemical mobilization, with uncertain selectivity and incomplete mass balances. No organism, biomass, culture metabolite or biological treatment was used.
  context: The plant sequence on page 135 distinguishes KMnO4-assisted hot purification at 90 degrees C, followed by Ca(OH)2 precipitation at pH 5, from the later zinc-powder cementation that produces cold filter cake. Section 2.1/Table 1 reports the studied HFC as XRD-amorphous, with XRF oxide-equivalent entries including 14.00 wt.% ZnO, 4.8 wt.% Co3O4 and 22.9 wt.% MnO. Those assay labels do not identify crystalline oxide hosts or equal elemental-metal fractions. Section 2.2 used a 0.5 L batch glass reactor and 300 rpm at ambient temperature; the abstract specifies 25 degrees C. The selected zinc step used 30 g/L H2SO4 and an acid/HFC 'stoichiometry' of 0.85. The source does not sufficiently define that ratio for conversion to a liquid-to-solid ratio or a complete recipe. The remaining solids were then treated with acid and H2O2; Figure 4 compares 20-50 g/L H2SO4 after 10 min. Independent replicate counts, uncertainty estimates and a full solids/solution inventory are not given.
  microbial: false
  evidence:
  - source_ref: haghshenas2007
    supports: support
    explanation: Sections 3.1-3.3 and Figures 1-4 support rapid zinc mobilization and increased solution Co and Mn with peroxide-assisted acid treatment. The zinc curves approach a plateau around two minutes; this is not independently demonstrated quantitative recovery of all feed zinc. Above 30 g/L acid, the authors report filtration difficulties and iron dissolution, explaining their practical selection of 30 g/L. For the later treatment they select 50 g/L acid and describe a diminishing effect above 5 g/L H2O2. These are outcomes within the tested laboratory series, not universal optimum conditions.
  - source_ref: haghshenas2007
    supports: partial
    explanation: Page 137 explicitly reports partial Co and Mn leaching in the zinc step, whereas the page 138 conclusion says no Co or Mn dissolved. The record therefore does not accept complete zinc selectivity. Section 3.3 states a constant H2O2 addition of 5 cm3 while Figure 4 varies H2O2 concentration in g/L; stock concentration and dosing reconciliation are unavailable. The abstract calls peroxide an oxidation agent, while the body invokes reduction and calls KNO3 a reductive agent. Those redox assignments are not independently established here; the accepted claim is empirical dissolution.
  - source_ref: haghshenas2007
    supports: partial
    explanation: Figures 3-5 report aqueous concentrations, not isolated-product yields. The conclusion's almost-complete Co solubilization lacks a closed feed-to-liquor mass balance. Its statement that solvent extraction proved usable is not accompanied by an extraction protocol, product characterization or product yield in this paper. The industrial origin of the waste does not demonstrate industrial use of the experimental leaching sequence. No microbial result is inferred from separate, incompletely accessed HFC studies.
