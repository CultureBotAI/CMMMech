  title: >-
    Finch RJ, Hawthorne FC, Ewing RC (1998). Structural relations among
    schoepite, metaschoepite and dehydrated schoepite. Canadian
    Mineralogist 36:831-845. Complete 15-page published PDF inspected
    during round110; experimental text, Table 3 and Figures 3-5
    rechecked for this record. Pages 835-839 distinguish natural
    specimens and alteration arms; pages 839-843 discuss proposed
    structural mechanisms. No DOI verified in the bounded search.
  url: https://www.rruff.net/doclib/cm/vol36/CM36_831.pdf
  accessed_on: '2026-10-16'
mechanisms:
- id: natural_crystal_alteration
  name: Abiotic alteration of natural schoepite to metaschoepite-bearing material
  process: other
  microbial: false
  description: >-
    Natural schoepite crystals altered during laboratory manipulation,
    storage and X-ray examination. Diffraction supports formation of
    metaschoepite, sometimes in mixtures with residual schoepite and
    dehydrated schoepite. Partial loss of interlayer water and associated
    structural rearrangement are proposed explanations, not directly
    measured reaction stoichiometry or a universal humidity threshold.
  context: >-
    Finch et al. studied Shinkolobwe museum specimens B3616 and 91.62.
    B3616 crystals came from its surface, whereas 91.62 crystals were
    extracted from its interior. Coating and exposure histories differed.
    The observation below is the same experiment already represented
    from the product perspective in cmmmech:metaschoepite, not an
    independent replication. The 2018 structural specimens are separate.
  evidence:
  - source_ref: finch1998
    supports: support
    explanation: >-
      Page 837 and Table 3 describe B3616 crystal sc-c(1) changing
      overnight at 20 degrees C during a ten-hour X-ray exposure to
      sc-c(2), identified as metaschoepite. Its a dimension decreased
      approximately two percent from 14.26 to 14.0 angstrom in that
      paper's axis setting; b and c did not change detectably. The
      initially shortened a dimension suggested pre-existing minor
      metaschoepite. This is not an initially pure conversion yield,
      controlled dehydration rate or isolated-product recovery.
  - source_ref: finch1998
    supports: partial
    explanation: >-
      Pages 836-839 preserve contrasting stability and mixed products:
      coated B3616 crystals and uncoated 91.62 crystals remained stable
      during more than two years of study, although the latter later
      altered. Altered B3616 cores and rims differed in phase content.
      Poor diffraction limited complete structural solution, and the
      authors did not test reversibility. Their proposed loss of
      one-sixth of interlayer water was not a direct water-loss assay.
      Separate heating in water and at 120 degrees C in air produced
      different or uncertain mixtures and is not pooled with sc-c(1).
  - source_ref: plasil2018
    supports: context_only
    explanation: >-
      Pages 67-69 and S1 reconsider the earlier acentric schoepite
      model in favor of Pbca. Seven weak pre-averaging reflections
      violated the b-glide in the newer data; the successful refinement
      and strong parameter correlations in the acentric model underlie
      the author's conclusion. The modern axis setting and revised
      structural model must not be silently substituted into the 1998
      experiment's cell labels. Calculated structural complexity is
      not a measured dehydration barrier, rate or recovery efficiency.
