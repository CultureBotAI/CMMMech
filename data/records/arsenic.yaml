mechanisms:
  - id: thiooxidans_hydroxide_sludge_comobilization
    name: Arsenic co-mobilization during hydroxide-sludge bioleaching
    process: bioleaching
    description: >-
      Arsenic entered solution during acidic laboratory leaching of sludge
      with living sulfur-oxidizing Acidithiobacillus thiooxidans cultures.
      Similar final arsenic leaching in the acid-adjusted abiotic comparator
      does not establish a microbial enhancement. The observed process is
      co-mobilization, without a demonstrated arsenic redox reaction,
      detoxification or recovered arsenic product.
    context: >-
      DSM 14887 type-strain cultures were adapted to 5% w/v sludge with
      aluminum; the taxon identifier resolves the species, not the strain.
      The GaAs-wafer-production hydroxide sludge was dried at 60 degrees C
      for 48 hours and mortar-homogenized. Table 1 reports 1.34% As by
      handheld XRF. Section 2.1 assumes arsenate associated with iron phases;
      it does not measure arsenic oxidation state in this assay. The curated
      3% w/v experiment used 50 mL shake-flask setups, HBS medium, 1% elemental
      sulfur, initial pH 1.8, 30 degrees C and eight days. Table 2 gives
      12.9 mM Al (molar Al:F 1.5:1) and 1 mL sulfuric acid initially.
      Section 2.3 labels the 10% inoculum w/v, an unresolved unusual basis.
      Biotic setups were triplicate; controls were uninoculated, either
      initially pH 1.8 or acid-adjusted to follow the biotic pH. Dissolved
      elements were measured by ICP-MS, without arsenic speciation. The
      exact shaking speed and sample separation protocol for this assay
      are not resolved in Section 2.3.
    microbial: true
    organisms:
      - id: NCBITaxon:930
        label: Acidithiobacillus thiooxidans
    evidence:
      - source_ref: fritze2026
        supports: support
        explanation: >-
          Section 3.2 and Figure 3 report 68% of feed arsenic in solution
          after eight days in the 3% sludge biotic assay. The figure presents
          biotic means and SD, without numeric SD transcribed here. The
          authors associate arsenic release with dissolution of ferrihydrite;
          this is a host-dissolution interpretation, not evidence for
          microbial reduction of arsenate. Industrial feed provenance does
          not establish industrial operation of this laboratory process.
      - source_ref: fritze2026
        supports: partial
        explanation: >-
          The same Section 3.2 reports 66% arsenic leaching in the
          acid-adjusted abiotic comparator and describes simplified controls
          requiring replicate confirmation. The small reported difference
          therefore does not establish arsenic-specific microbial benefit.
          Its statement placing initial 24% As at day 1 conflicts with
          Figure 3, which places that point at day 0; no initial value or
          derived arsenic rate is curated. Section 3.4 discusses subsequent
          chemical arsenic removal prospectively, not a tested microbial
          recovery or detoxification result. Methods and Table 2 specify
          Al:F, whereas the abstract says Al:Fe; this record follows the
          flask-specific Table 2 ratio.
