    annotation_note: Grounded to reference proteome UP000000556 for Pseudomonas putida KT2440 (NCBITaxon:160488; catA-I / PP_3713, UniProtKB:Q88GK8), representing catechol ortho-cleavage in Pseudomonas putida ATCC 33015 (NCBITaxon:303) in Chmielowski and Klapcinska (1986) and Klapcinska and Chmielowski (1986).
