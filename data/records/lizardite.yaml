  title: IMA-CNMNC. The New IMA List of Minerals, September 2026; PDF page 127, Lizardite row, and pages 1-2 column definitions and terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: sheng_2026
  title: Sheng, Zheng, Yang, Dong, He and Sheng (2026). Silicate minerals enhance the expression of genes related to mineral dissolution by Priestia aryabhattai strain C4-10. Applied and Environmental Microbiology 92(2):e02554-25. DOI 10.1128/aem.02554-25; Figure 2, Materials and Methods, and supplemental methods pp1-2.
