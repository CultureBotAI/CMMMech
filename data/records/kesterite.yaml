  evidence:
  - source_ref: teh_1979
    supports: partial
    explanation: Printed pages 85-87 and Figure 1 support an inoculated synthetic kesterite leaching assay with soluble tin measured by atomic absorption and confirmed colorimetrically. The reported 72.66% Sn extraction is retained as the author's percentage for this synthetic feed, not a validated natural-mineral recovery yield or isolated metal product. The plotted concentration scale labelled tin concentration (x1000 ppm) is not reconciled with feed loading, and no graph values are converted or digitized. Missing matched sterile control, replication and phase-purity data, along with the pH contradiction, limit causal and quantitative interpretation. No downstream tin isolation, product purity, solar-material recycling or industrial deployment was demonstrated.
