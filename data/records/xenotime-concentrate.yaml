  evidence:
  - source_ref: he2024
    supports: support
    explanation: Sections 2.3 and 3.2-3.4 and Figures 1-3 show enhanced aqueous rare-earth release in both bacterial feed arms compared with their abiotic controls. The unbuffered culture reached about pH 3 and the text reports a maximum total rare-earth concentration of about 716 micrograms/L on day 15, followed by a decline and partial increase. The buffered culture reached about 343 micrograms/L at day 30. These are filtered aqueous concentrations, not cumulative extraction fractions or isolated product yields. The later decline and observed precipitates prevent treating solution concentration as total mineral loss.
  - source_ref: he2024
    supports: partial
    explanation: Figures 4-6 and Sections 3.5-3.6 and 4.2 link bacterial growth to organic-acid profiles and show acid-dependent chemical leaching, including tartaric-acid activity near pH 6. Many tested organic acids perform similarly to HCl at pH 3; proton and ligand contributions depend on conditions. Normalized MS signals are not absolute extracellular acid concentrations. No genetic intervention, spent-medium reconstruction or individual-metabolite contribution in the live culture was demonstrated. Figure 5's caption calls the cells-only comparator Exp-Control, whereas its legend and Methods identify it as Exp-Bt; the abiotic mineral control remains a separate arm. Section 2.4 prints 0.22 mm for chemical-solution filters, whereas Section 2.5.1 specifies 0.22 micrometres for analyzed suspensions. These preparation descriptions are not silently harmonized.
  - source_ref: he2024_supplement
    supports: partial
    explanation: 'Figure S1 and Tables S2-S4 support a mixed mineral feed and distinct rare-earth distributions among its phases. Phase weight fractions derive from particle counts and assumed densities. Quantitative source inconsistencies remain: Figure S1 repeats the same reference-card number for almandine and ilmenite; xenotime Yb and Lu values in Tables S3 and S4 do not agree under straightforward oxide-to-element conversion. Main Table 1''s TiO2 content also does not close against the tabulated phase fractions and compositions. Its printed P2O3 and U2O3 labels are retained as source uncertainties, not silently relabeled. Whole-feed Y was above the XRF upper limit, not absent. These limitations preclude a new closed elemental mass balance or a precise recovery efficiency from the phase estimates.'
  - source_ref: he2024
    supports: partial
    explanation: Table 3 estimates 0.03% xenotime and 0.3% monazite dissolution for the unbuffered day-15 solution. These are two-component calculations from aqueous rare-earth composition, not measured separate-mineral mass losses. They assume the two phosphates supply the dissolved rare earths and negligible differential re-sorption or precipitation. Figure 7 and Section 4.3 show secondary REE- and P-bearing precipitates, but their mineral identities could not be established by micro-XRD, TEM or Raman. Rhabdophane- or churchite-type assignments are proposed analogies, not identified products. This qualifies the dissolution model and supports only conditional preferential monazite dissolution, without proving a general species-level rate ratio.
  - source_ref: he2024_supplement
    supports: context_only
    explanation: Actual Figure S6 models phosphate saturation and Figure S7 compares modeled and measured solution composition; their numbering is reversed in the contents list. Table S7 and Text S1 apply the concentrate's 1.38 square metres/g surface area to both phosphate phases by assumption. Phase-specific rates therefore are model dependent. Main Equation 1 also calls this a prepared granite sample despite the study's concentrate feed. No calculated mineral-specific rate is promoted to a direct measurement or an industrial design parameter here.
