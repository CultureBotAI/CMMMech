    - NCBIfam:TIGR01409
    functional_role: Periplasmic [NiFe] cytochrome-c3 hydrogenase small iron-sulfur subunit (EC 1.12.2.1;
      HydA / Ddes_1039) mediating H2 oxidation and periplasmic electron transfer in Desulfovibrio desulfuricans.
    annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:P13061 (PHNS_DESDA; locus Ddes_1039)
      for Desulfovibrio desulfuricans ATCC 27774 (NCBITaxon:525146), representing the inferred periplasmic
      [NiFe] hydrogenase system in experimental strain Desulfovibrio desulfuricans ATCC 29577 (NCBITaxon:876).
    evidence:
