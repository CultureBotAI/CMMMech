summary: Qualified acceptance of the mineral identity and natural-crystal characterization,
  without transferred microbial recovery, criticality or industrial claims. No supported
  corrective defect found.
limitations:
- Farkas1997 reports rapid beam-induced dehydration and limited structural accuracy;
  hydrogen positions were not determined. Its interpretation of a Sussex basaluminite
  specimen does not establish equivalence for every poorly ordered mine-drainage precipitate.
- Carrero2017 is context-only counterevidence here. Institutional abstract and newly
  located mirror text were inspected, but its full graphics and SI were not reviewed
  or used to import measurements. The author’s earlier access limitation remains honest.
- No microbial organism, biomass state, mechanism, extraction yield or industrial
  deployment is established by this identity-only record. Criticality is unassessed
  and not inherited from aluminium.
- Bounded notice/duplicate searches do not establish universal absence of other sources
  or corrections. Structural checks do not prove scientific truth.
