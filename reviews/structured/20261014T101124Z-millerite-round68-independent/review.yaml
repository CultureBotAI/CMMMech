limitations:
- Mixed particles, phase overlap and processing limit in situ or pure-product attribution.
- Unlike chemistry, sulfide delivery and harvest prevent a unique cell-specific mechanism
  inference.
- No local pH measurement, enzyme perturbation, phase yield or long-term stability
  test.
- The three Ni records represent one study, not three independent replications.
- Bibliographic searches are bounded; no raw-data crystallographic refinement or independent
  experiment was performed.
notes:
- No supported corrective finding on frozen bytes. A proposed millerite supplement-label
  discrepancy was rejected after visual inspection before record freeze.
- Raw sources remain outside Git. Whole-batch structured checking and exact coverage
  follow saving.
