mechanisms:
- id: abiotic-thermal-hydrate-intermediate
  name: Szomolnokite intermediate during heating of melanterite-rich powder
  process: other
  microbial: false
  description: >-
    In situ powder diffraction identified poorly crystalline szomolnokite
    during dehydration of the mixed melanterite-rozenite starting material,
    followed by declining szomolnokite and increasing basic ferric sulfate,
    FeOHSO4. The 100-degree-C pattern contained weak, broadened szomolnokite
    peaks; only FeOHSO4 was identified at 200 degrees C. The paper's
    descriptions of the onset and disappearance intervals differ and are
    retained as limitations rather than a unique stability threshold.
  context: >-
    Lacalamita et al., Methods on PDF page 3: natural Fornovolasco mine
    material from Tuscany, Italy, was ground in an agate mortar and
    placed on a corundum holder. Air-XRPD covered 25-775 degrees C
    in 25-degree steps with 5 min equilibration. The stated scan range
    was 10-82 degrees 2theta, step 0.0263 degrees and counting time
    257 s/step. The initial refinement was 78 wt% melanterite and
    22 wt% rozenite. About 50% RH is mentioned for the initial
    room-temperature-to-50-degree transition; a complete controlled
    humidity history is not supplied. No pure szomolnokite starting
    feed, independent heating replicate count, inoculum, microbial
    control, isolated product mass or mineral recovery yield is reported.
  evidence:
  - source_ref: lacalamita2021
    supports: support
    explanation: >-
      Section 3.2 on PDF pages 5-6, Figures 2-3 and Figure 7 on page 9
      identify the phases and refined weight fractions. Discussion on
      pages 10-12 describes weak, broadened szomolnokite peaks at
      100 degrees C and its replacement by FeOHSO4. Figure 7 retains
      nonzero szomolnokite between 100 and 200 degrees C; section 3.2
      identifies only FeOHSO4 in the 200-degree pattern. These are
      diffraction-phase observations in a changing mixture, not a
      mass-balanced extraction or recovery experiment.
  - source_ref: lacalamita2021
    supports: partial
    explanation: >-
      Section 3.2 on page 5 introduces szomolnokite and FeOHSO4 from
      100 degrees C, whereas page 10 identifies a szomolnokite peak
      at 75 degrees C. The infrared discussion on page 12 associates
      szomolnokite disappearance with 100-150 degrees C, whereas
      Figure 7 and the reaction scheme extend its loss toward
      200 degrees C. These differing descriptions are unresolved.
      The nitrogen TG/DTA run used about 13 mg and 10 degrees C/min;
      its approximately 260-degree event is not interchangeable with
      the air-XRPD 200-degree endpoint. Infrared pellet effects and
      detector saturation are described on pages 3 and 12.
  - source_ref: lacalamita2021
    supports: partial
    explanation: >-
      Discussion on pages 11-12 proposes oxidation of FeSO4·H2O to
      FeOHSO4 using atmospheric oxygen. An additional melanterite
      sample heated to 300 degrees C in nitrogen yielded a mixture
      assigned to szomolnokite and FeOHSO4; this qualitative comparison
      does not isolate oxygen uptake or establish every reaction step.
      The alternative anhydrous-FeSO4 route reported in earlier work
      was not observed in this natural-sample experiment. No universal
      reaction pathway or microbial cause is inferred.
