- id: bacillus_kaolin_waste_iron_impurity_leaching_graph
  name: Bacillus thuringiensis glucose/EDTA-conditioned partial iron impurity removal from Pouto kaolin mine waste
  description: Causal pathway linking representative Bacillus thuringiensis organic-acid and fatty-acid biosynthetic enzymes Citrate synthase (UniProtKB:A0A0K0QI82), L-lactate dehydrogenase Ldh (UniProtKB:A0A0K0QJ28), and Beta-ketoacyl-ACP synthase III FabH (UniProtKB:A0A0G3E229) to moderate broth acidification (pH 4.9-5.7) and GC-MS-detected lauric acid in 1 g/L glucose + 0.5 g/L EDTA medium, resulting in 20% solid-phase Fe2O3 reduction (from 0.87 to 0.70 wt% Fe2O3; 6.13 mg/L dissolved Fe in leachate, leaving ~82% of solid Fe loss unaccounted for in solution) from Pouto kaolin mine waste in Sanchez-Palencia et al. (2022).
