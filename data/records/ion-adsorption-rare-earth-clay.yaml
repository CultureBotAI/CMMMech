id: cmmmech:ion-adsorption-rare-earth-clay
name: Ion-adsorption rare-earth clay
material_kind: primary_resource
description: >-
  Naturally weathered, rare-earth-bearing clay material, distinct from an individual
  clay mineral, isolated rare-earth element or processing residue. Separate
  curated experiments concern ferruginous, poorly sorted material from 3.8–4.8 m
  depth above volcanic breccia in the Ambohimirahavavy Alkaline Complex, Madagascar,
  and a Guangxi, China ore described as an ion-adsorption feed. Their specimens,
  communities, preparations and assays remain distinct; neither characterizes
  every ion-adsorption deposit.
