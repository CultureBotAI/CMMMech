id: cmmmech:malachite
name: Malachite
material_kind: mineral
description: >-
  Malachite is the grandfathered copper carbonate hydroxide mineral, Cu2(CO3)(OH)2, recognized
  by the IMA-CNMNC September 2026 list. It is distinct from elemental copper, azurite, copper
  oxalate moolooite, malachite-green dye and mixed copper ores. The experiment curated here
  used synthetic malachite, not a natural ore. No criticality designation is inherited from
  copper.
