  evidence:
  - source_ref: christel_2018
    supports: support
    explanation: Bioleaching results and Figure 1C report 14.2 +/- 0.3 mM total released Cu for the initial A. caldus/S. thermosulfidooxidans pair, versus 2.4 +/- 0.3 mM for uninoculated controls at 15 days; Figure 1 reports means +/- SD, n=4. Every binary mixture outperformed the three-species mixture in that experiment. Different elapsed endpoints preclude treating this comparison as a common-time leaching rate.
  - source_ref: christel_2018
    supports: partial
    explanation: Marginal leaching and late iron oxidation in A. caldus-only flasks were attributed to possible surviving environmental contaminants. Figure 2 and the repeated pair experiments reached 593 +/- 15 mV, so the lower initial redox values do not establish a universal 550 mV ceiling. Proposed passivation, attachment, transient chalcocite formation and candidate iron-oxidation genes are not demonstrated molecular causes or phase-specific mass balances. Large-scale testing remains future work in the source.
