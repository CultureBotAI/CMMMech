id: cmmmech:indium
name: Indium
material_kind: element
description: >-
  The element In, distinct from indium ions, salts, indium tin oxide and
  indium-bearing minerals or waste streams. The dated US designation concerns
  the named indium mineral commodity. The mechanism describes laboratory
  biosorption from synthetic solutions by prepared mixed microalgal biomass;
  it does not establish treatment of an actual indium waste stream or recovery
  of an isolated indium product.
