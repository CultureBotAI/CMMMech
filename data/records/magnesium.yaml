description: >-
  Magnesium (Mg), the chemical element. The named magnesium commodity in
  the US 2025 list is mapped to this element; its designation is not inherited
  by every magnesium mineral. The experiment concerns magnesium-containing
  mineral transformation, not production of elemental magnesium metal.
