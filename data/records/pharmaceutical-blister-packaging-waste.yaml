  - source: sqr_reductase
    target: tth_hydrolase
    predicate: supplies_substrate_for
    relationship: oxidation of sulfide to sulfur/polythionate intermediates
    description: Sqr / Sqor sulfide-quinone oxidoreductases (A. thiooxidans sqr GCD22_02301, sqor GCD22_03207; A. caldus Atc_1705, Atc_1437) catalyzes oxidation of reduced sulfur species to zero-valent sulfur and polythionate intermediates metabolized by Tth / TetH tetrathionate hydrolases (A. thiooxidans tth GCD22_14205, tth GCD22_02315; A. caldus TetH Atc_1595).
    evidence:
    - source_ref: kremser2023
      supports: partial
      explanation: Reduced-sulfur oxidation in Acidithiobacillus thiooxidans (sqr GCD22_02301, sqor GCD22_03207; tth GCD22_14205, tth GCD22_02315) and Acidithiobacillus caldus (Atc_1705, Atc_1437; TetH Atc_1595) couples sulfide-quinone oxidation and polythionate hydrolysis during upstream semi-continuous bioreactor sulfur oxidation and ~0.86 M biogenic sulfuric-acid (0.85 M sulfate, pH ~0.2) leaching of aluminium from transparent, white, and silver pharmaceutical blister packaging waste by Acidithiobacillus thiooxidans DSM 504 and Acidithiobacillus caldus DSM 9466 (C-SH12) in Kremser et al. (2022, 2023); individual genes were not directly assayed.
  - source: tth_hydrolase
    target: bioreactor_sulfur_oxidized_blister_leach_media
    predicate: produces
    relationship: sulfuric acid proton and lixiviant generation
    description: Tth / TetH tetrathionate hydrolases (A. thiooxidans tth GCD22_14205, tth GCD22_02315; A. caldus TetH Atc_1595) disproportionates tetrathionate and polythionate intermediates into sulfate and H+, generating Upstream semi-continuous reactor culture acid (~0.86 M biogenic H2SO4, 0.85 M sulfate, pH ~0.2) produced by mixed A. thiooxidans DSM 504 + A. caldus DSM 9466 (C-SH12).
    evidence:
    - source_ref: kremser2023
      supports: partial
      explanation: Chemolithoautotrophic sulfur oxidation by Acidithiobacillus thiooxidans and Acidithiobacillus caldus generates the acidic sulfate/polythionate lixiviant during upstream semi-continuous bioreactor sulfur oxidation and ~0.86 M biogenic sulfuric-acid (0.85 M sulfate, pH ~0.2) leaching of aluminium from transparent, white, and silver pharmaceutical blister packaging waste by Acidithiobacillus thiooxidans DSM 504 and Acidithiobacillus caldus DSM 9466 (C-SH12) in Kremser et al. (2022, 2023); individual enzyme activities were not isolated.
  - source: bioreactor_sulfur_oxidized_blister_leach_media
    target: shredded_pvc_al_blister_waste
    predicate: solubilizes
    relationship: culture-generated ~0.86 M biogenic sulfuric-acid dissolution of aluminium from sorted blister waste
    description: Culture-generated ~0.86 M biogenic H2SO4 (from DSM 504 + DSM 9466) leaches sorted transparent, white, and silver blister fractions (1 x 1 cm, <4 mm, or <2 mm) at 2.5, 5.0, or 7.5% (w/v) in 150 mL flasks (22 C or 50 C, 150 rpm, up to 9 d) and 1 L stirred reactors (22 C, 250 rpm, 14 d).
    evidence:
    - source_ref: kremser2023
      supports: partial
      explanation: Sections 2.1-2.6 and 3.1-3.4 and Figures 1-6 of Kremser et al. (2023) demonstrate aluminium dissolution from sorted pharmaceutical blisters using ~0.86 M biogenic acid from DSM 504 + DSM 9466; support is partial because Kremser et al. (2023) do not clarify whether cells were removed before blister leaching, commercial 0.86 M H2SO4 performed similarly at 50 C, and the 22 C difference was not mechanistically resolved.
  - source: shredded_pvc_al_blister_waste
    target: dissolved_aluminium_and_delaminated_pvc
    predicate: produces
    relationship: fraction- and scale-dependent aluminium solubilization into acidic leachate
    description: Xylenol-orange assays show near-complete Al dissolution from transparent and white blisters within 7-9 days in flasks at 22 C, ~36% maximum Al dissolution from polyamide-containing silver blisters, and ~90% (transparent) and ~81% (white) Al dissolution after 14 days in 1 L stirred trials at 7.5% (w/v).
    evidence:
    - source_ref: kremser2023
      supports: partial
      explanation: Sections 3.2-3.4 and Figures 2-6 of Kremser et al. (2023) report near-complete flask Al leaching for transparent and white blisters (7-9 d), ~36% maximum for silver blisters (where Al content is printed as 67.6% in Sec. 3.1 vs 63% in Sec. 3.3.1), and ~90% / ~81% at day 14 in 1 L trials, without isolating a recovered aluminium product.
    - source_ref: kremser2022_acid
      supports: support
      explanation: Kremser et al. (2022, Waste Management 144:182-190) establish the upstream semi-continuous bioreactor sulfur-oxidation process using Acidithiobacillus thiooxidans DSM 504 and Acidithiobacillus caldus DSM 9466 (strain C-SH12) that generated the ~0.86 M biogenic sulfuric acid (0.85 M sulfate, pH ~0.2) used in Kremser et al. (2023).
