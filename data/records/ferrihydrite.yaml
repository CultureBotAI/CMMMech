id: cmmmech:ferrihydrite
name: Ferrihydrite
material_kind: mineral
description: Ferrihydrite is an approved mineral species in the September 2026 IMA list, with
  formula Fe(III)5O7(OH) and approval number 1971-015. The name also occurs in experimental
  descriptions of poorly crystalline synthetic two-line iron oxyhydroxides; that assay designation
  does not independently establish ideal IMA formula, natural origin or purity. This record
  concerns a characterized synthetic nanophase substrate, not iron metal, an ore grade or
  every Fe(III) oxide. The Ax17 assay is also represented under iron and the paired ferrihydrite/magnetite
  record; these are substrate/product perspectives on one experiment, not independent replication.
  No iron criticality designation is inherited.
