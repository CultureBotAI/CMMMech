id: cmmmech:aluminium
name: Aluminium
material_kind: element
description: >-
  Aluminium (Al), the chemical element, distinct from its ions, alumina,
  bauxite ores and red-mud wastes. The dated US designation maps the named
  aluminum commodity to this element without assigning criticality to every
  Al-bearing material. The curated mechanism concerns laboratory aluminium
  mobilization from a mixed red-mud sample, not production of aluminium metal.
