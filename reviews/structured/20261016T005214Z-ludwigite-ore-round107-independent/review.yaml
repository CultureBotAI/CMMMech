summary: Qualified acceptance of a mixed-resource identity and bounded author-reported
  abiotic laboratory leaching; no supported corrective record defect.
limitations:
- The referenced 2017 analytical methods DOI10.1016/j.hydromet.2016.11.004 was not
  acquired. Percentage denominator, sampling, assays, replicates and uncertainty cannot
  be independently reconstructed from the 2024 article.
- Raw leach curves and mineral mass balances were unavailable; no curve refitting,
  corrected equation or numerical recovery prediction was produced. Explicit internal
  source conflicts remain unresolved.
- The evaporated mixed salts and separately sized residue/SEM arms do not establish
  pure-product recovery or industrial performance. Original ore mine/batch identity
  and roasting-gas details remain incomplete.
- Shared source acquisition is disclosed. Bounded correction and hidden/ignored dedup
  searches do not establish exhaustive absence.
- Working-tree review at the retained base. Record validation is separate from scientific
  truth; native review-check and committed-head/hosted publication remain separate.
notes:
- No owner/history correction was needed; unavailable originals and retained internal
  source conflicts are limitations, not invented corrective defects.
- No self-authored REE record is scientifically reviewed in this observation.
