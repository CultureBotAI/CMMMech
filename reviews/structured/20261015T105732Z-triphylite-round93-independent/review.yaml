assessments:
- assessment_id: identity
  area: identity
  topic: Species, specimen and authority scope
  outcome: supported
  summary: Current Fe2+-dominant triphylite and Mn2+-dominant lithiophilite are separate
    species. Losey natural crystals contain Fe/Mn/Mg substitutions; near-boundary
    Trip50 is not a clean endmember. Li2O used for matrix correction and fixed site
    occupancy cannot independently quantify lithium. Pbnm/Pmnb settings do not define
    separate species.
  target_ids:
  - cmmmech:triphylite
  evidence_ids:
  - owner
  - losey
  - ima
  - handbook
  - nomenclature
- assessment_id: biology
  area: scope
  topic: Biomass, organism and deployment
  outcome: supported
  summary: All accepted experiments are abiotic. No taxon/strain or microbial causality
    is asserted; no constituent criticality or industrial deployment is inferred.
    Natural pegmatite identity and synthetic assay material remain distinct.
  target_ids:
  - cmmmech:triphylite
  evidence_ids:
  - owner
  - losey
  - oxidation
- assessment_id: conditions
  area: evidence
  topic: Natural feed, arms and controls
  outcome: supported
  summary: Palermo9706.41 contains microscopic sarcopsides despite no significant
    secondary powder-XRD phase. Table1 Tri87 uses53.5mg cuboid+21mg KMnO4; Tri77 uses50.8mg
    powder+20.2mg KMnO4, both120°C8days in1mL0.1NHCl in3cm3 closed vessels without
    oxygen buffering. Powder and cuboid are separate samples, with no matched acid-only
    control, stated independent replication or aqueous lithium balance.
  target_ids:
  - cmmmech:triphylite
  evidence_ids:
  - owner
  - oxidation
- assessment_id: quantity
  area: quantity
  topic: Measured local composition and product identity
  outcome: supported
  summary: Tri77 approximate93% ferric iron is a Mössbauer fraction of iron, not recovered
    phase mass. Tri87 profiles show lithium from approximately1apfu core to0.30(7)rim;
    this is local solid composition, not feed extraction. The cuboid formula borrows
    valence information from the separate powder arm. An amorphous contribution and
    outer Mn-rich region prevent pure-product assumptions.
  target_ids:
  - cmmmech:triphylite
  evidence_ids:
  - owner
  - oxidation
- assessment_id: mechanism
  area: evidence
  topic: Pathway interpretation and same-study nomenclature
  outcome: supported
  summary: Optical extinction, spatial profiles and diffraction support a topotactic
    relationship. Porosity and K enrichment do not uniquely distinguish solid-state
    transport, dissolution-reprecipitation or pore-hosted phase. Table3 of2023 reassigns
    Tri77/Tri87 to heterosite; historical names remain provenance, not current species
    assignments or new replication.
  target_ids:
  - cmmmech:triphylite
  evidence_ids:
  - owner
