    title: >-
      Jiafeng Li, Junmeng Li, Lei Tian, Jian Wang, Yanfei Xiao and Zhiyuan Ma
      (2025), Extraction of rare earths from ion-adsorption type rare earth ore
      by indigenous microbial community; International Journal of Minerals,
      Metallurgy and Materials 32(8), 1848–1860; final publisher edition,
