      explanation: Representative Serpula lacrymans reference-proteome pyruvate carboxylase for the brown-rot comparative assay on cerussite (PbCO3) in Vlasov et al. (2023); individual enzymes were not genetically perturbed in the study.
  evidence:
  - source_ref: vlasov2023
    supports: support
    explanation: Table 4 assigns anhydrous lead oxalate by SEM/EDX and PXRD to S. himantioides at pH 2, C. puteana at pH 2.5 and source-named A. xantha at pH 3.5. Figure 3d is the selected C. puteana product diffraction pattern, retaining substrate reflections; Figure 4d shows source-assigned lead-oxalate morphology for S. himantioides. These observations support formation in mixed surface products without establishing complete replacement of the cerussite.
  - source_ref: vlasov2023
    supports: partial
    explanation: For S. lacrymans at pH 3, Table 4 and Section 3.2.2 report isolated lead-oxalate-like crystals by SEM/EDX, while PXRD lists whewellite only; Figure 5d is microscopy, not independent diffraction confirmation of lead oxalate. Section 3.2.2 describes both whewellite and weddellite for C. puteana, whereas its Table 4 microscopy cell lists whewellite with lead oxalate and its PXRD cell lists lead oxalate only. This co-product discrepancy remains unresolved. No cerussite-specific uninoculated phase pattern or quantitative control outcome is supplied.
  - source_ref: vlasov2023
    supports: partial
    explanation: Methods states that fungus-free controls were performed, but the selected mineral-arm results do not provide a matched pH-control series or a quantitative inoculated-versus-uninoculated phase balance. No killed-biomass or cell-free-metabolite comparison isolates a necessary causal step. Oxalate secretion is the proposed explanation, without an arm-specific oxalate time course or molecular intervention in this study. PXRD methods are referred to earlier papers; the displayed patterns include substrate peaks. Culture association and source-assigned phases do not establish quantitative microbial enhancement, complete feed consumption or industrial use.
  - source_ref: vlasov2023
    supports: context_only
    explanation: This is one arm of Vlasov et al. (2023), also represented by the humboldtine record and separately curated mineral-feed owners. The shared paper, its XML/PDF and the different material views are not independent replications. Its comparison with earlier Aspergillus niger studies uses different protocols and does not establish superior extraction rates for the present cultures. The natural adit observations concern calcium oxalates on wood/carbonate rock; they do not establish field deployment of this particular feed transformation.
  - source_ref: ima_2026_09
    supports: context_only
    explanation: The authority establishes the mineral species name and formula, not the purity, valence, hydration or transformation behavior of the specific experimental material.
  - source_ref: ncbi_fungal_taxonomy
    supports: context_only
    explanation: Species taxonomy verifies identifiers and current names. A species TaxID does not identify the experimental strain or demonstrate its mineral-transforming phenotype.
  - source_ref: genbank_ky352492_1
    supports: context_only
    explanation: The deposited sequence carries the Serpula himantioides LE-BIN 1368 source label cited by the paper. This label/sequence match is not independent authentication of the experimental culture or direct evidence for the mechanism.
  - source_ref: genbank_ky433978_1
    supports: context_only
    explanation: The deposited sequence carries the Coniophora puteana LE-BIN 1370 source label cited by the paper. This label/sequence match is not independent authentication of the experimental culture or direct evidence for the mechanism.
  - source_ref: genbank_ky352493_1
    supports: context_only
    explanation: The deposited sequence carries the Serpula lacrymans LE-BIN 1192 source label cited by the paper. This label/sequence match is not independent authentication of the experimental culture or direct evidence for the mechanism.
  - source_ref: genbank_ky433983_1
    supports: context_only
    explanation: The deposited sequence carries the Amyloporia xantha LE-BIN 1029 source label cited by the paper. This label/sequence match is not independent authentication of the experimental culture or direct evidence for the mechanism.
