  evidence:
  - source_ref: rasoulnia_2021
    supports: support
    explanation: >-
      Results, Bioleaching of REEs and Base Metals, and Figure 4 report
      G. oxydans two-step leaching of 34% Mn, 88% Fe, 41.5% Co, 18.5% Ni,
      21% Cu, 12% Zn and 6.5% total REEs. Spent-medium values are 35%, 68%,
      35.5%, 16.5%, 20%, 9% and 9%, respectively. These are source-reported
      feed-relative aqueous extraction percentages at the reported endpoint,
      not isolated-product recovery. Figure 4 error bars represent standard
      deviations of triplicate experiments. Individual REE yields differ;
      the total must not be assigned to every REE.
  - source_ref: rasoulnia_2021
    supports: partial
    explanation: >-
      The abstract gives 6.0% total REEs for two-step treatment whereas main
      Results and Table 3 give 6.5%; this discrepancy and the two-step timing
      conflict remain unresolved. Figure 3 supports gluconate accumulation
      before powder addition and subsequent rising pH. The spent-medium result
      supports activity of culture liquid after cell removal, but different
      culture ages and solution histories prevent attribution of yield
      differences solely to the presence of cells. Proposed REE adsorption
      onto cells and phosphate precipitation were not closed by independent
      partition measurements or a complete mass balance in this study.
  - source_ref: rasoulnia_2021
    supports: refute
    explanation: >-
      The tested conditions refute an unconditional claim that either culture
      or any inoculation schedule efficiently leaches this powder. Results
      and Figures 3-4 report no metal leaching for one-step G. oxydans and
      no appreciable leaching for S. pilosus in any tested mode, even with
      pyruvate in its spent medium. These are reported null outcomes rather
      than exact analytical zeros. Different phosphate concentrations,
      buffering, initial pH and metabolites prevent a general ranking of
      intrinsic species capability; toxicity and precipitation are proposed
      contributors rather than isolated causal tests.
  - source_ref: rasoulnia_2021
    supports: partial
    explanation: >-
      Figure 5 shows selected particle surfaces, cross-sections and elemental
      maps before and after treatment. It does not establish phase-specific
      metal flux, identify every REE precipitate or prove selective recovery.
      Table 1 characterizes this mixed powder, not a universal NiMH composition.
      No recovered metal product, complete process balance, technoeconomic
      demonstration or industrial deployment was established.
  - source_ref: rasoulnia_2021_supplement
    supports: context_only
    explanation: >-
      Medium-selection experiments compare acid production, pH and available
      growth measurements in PVK and GYM before the selected battery assays.
      These support the culture-medium context, not an independent battery
      leaching replicate or a molecular pathway assignment.
