id: cmmmech:hafnium
name: Hafnium
material_kind: element
description: >-
  Hafnium (Hf), distinct from its Hf(IV) complexes, hafnium oxide phases,
  zirconium-bearing minerals and commercial alloy or waste streams. The US
  2025 critical-mineral list names hafnium individually; the designation is
  mapped to this element without extending it to every Hf-bearing material.
  Curated evidence concerns cell-free binding of Hf(IV) clusters by a purified
  bacterial protein, not microbial ore extraction or industrial metal recovery.
