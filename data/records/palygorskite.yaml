  evidence:
  - source_ref: bishop_2010_thesis
    supports: support
    explanation: Methods 2.1-2.2, Results 3.4 printed p16 and Figure 8H (PDF p54; specimen label PFl-1) support 2.65% and 4.17% Fe(III) reduction without and with AQDS, respectively, and a near-baseline no-cell curve. These are source-reported reduction extents in the prepared material, not percentages of clay dissolved or product recovered. Prose cites Figure 8F for PFl-1, but the actual nine-panel figure and its caption identify H; F is ARG-24.
  - source_ref: bishop_2010_thesis
    supports: partial
    explanation: Figure 1F shows the original magnetite impurity and the treated diffraction pattern; Figure 5 includes PFl-1 after cleaning. These support the authors' assignment of the remaining reducible iron to cleaned clay, within method detection limits, not universal phase purity. DCB and acid pretreatment can alter the specimen. Table 2 reports different total-iron determinations, and the thesis abstract contains inconsistent cross-mineral rankings; neither a universal reduction ranking nor a harmonized iron composition is asserted.
  - source_ref: bishop_2010_thesis
    supports: partial
    explanation: Table 3 (printed p37, PDF p44) reports the same dissolved Fe value, 0.002 mmol/L, and Al value, 0.024 mmol/L, for PFl-1 control and bioreduced plus-AQDS material. Si, Mg and K differ, but the stated DCP error is +/-0.03 mmol/L. Thus the general prose about greater dissolved Fe and Al in bioreduced clays must not be transferred to PFl-1. Figure 10 shows declining PFl-1 colony counts, and XRD does not show a discernible new PFl-1 phase; no growth promotion, new mineral identity or bulk iron-extraction yield is claimed.
  - source_ref: bishop_2011_lineage
    supports: context_only
    explanation: The journal metadata/abstract describe the same authors' clay reduction and technetium research. Thesis-specific conditions and figure numbers are not attributed to the unavailable journal full text; this is one research lineage.
- id: pretreated_pfl1_technetium_reaction
  name: Abiotic technetium removal by washed bioreduced PFl-1
  process: redox_transformation
  description: A separate reaction used washed, pasteurized bioreduced PFl-1 as an Fe(II)-bearing reductant. Loss of aqueous technetium accompanied Fe(II) oxidation. Microorganisms prepared the reductant in the preceding arm; this assay is an abiotic reaction, and the source interprets technetium immobilization as Tc(VII) reduction to Tc(IV).
  context: Methods 2.3-2.4.5 and Table 1 specify anoxic 10 mL reactions in 20 mL bottles, 30 mM PIPES at pH 7, nominal initial 50 micromolar technetium-99 supplied as ammonium pertechnetate, and 0.5 mM PFl-1-associated Fe(II). The bioreduced solid was washed and pasteurized before technetium addition. No-clay technetium and no-technetium clay controls were included. Liquid-scintillation analysis of centrifuged supernatant measured remaining aqueous activity; phenanthroline monitored Fe(II). Bottles were gently hand-shaken daily. The reported initial technetium concentration conflicts with the approximately 80-scale starting points in Figures 11 and 13; the prose also ambiguously states a 0.5 micromolar subsequent spike. No precise technetium capacity is adopted.
  microbial: false
  evidence:
  - source_ref: bishop_2010_thesis
    supports: support
    explanation: Figure 11F (PDF p59) separately plots PFl-1 aqueous technetium decline, Fe(II) decline and the two controls, including repeated technetium additions. This supports reactivity of the prepared Fe(II)-bearing solid. It does not prove that only newly biogenic Fe(II) reacts; Results 3.5 explicitly considers reaction of pre-existing Fe(II).
  - source_ref: bishop_2010_thesis
    supports: partial
    explanation: The direct Tc-bearing microscopy in Figures 14-15 concerns CCa-2 and ISCz-1, not PFl-1. Aqueous activity loss and Fe oxidation are consistent with the source redox interpretation, but PFl-1-specific Tc oxidation-state spectroscopy, product crystal structure, isolated recovered product and long-term reoxidation resistance are not established here. PIPES alone decreased aqueous Tc after about 800 hours; the source limits or refreshes the buffer in longer experiments. No field deployment, purified-metal recovery or source-wide Fe/Tc ratio is inferred.
