id: cmmmech:municipal-sewage-sludge
name: Municipal sewage sludge
material_kind: secondary_resource
description: Unincinerated sludge generated by municipal wastewater treatment, represented here by partially dewatered sludge from Kuopio, Finland, and sludge from a municipal treatment plant in Tianjin, China. These heterogeneous processed residues contain organic matter, nutrients and metals; their precise upstream treatment histories and mineral hosts are not fully resolved. This secondary resource is distinct from sewage-sludge incineration ash, untreated wastewater, factory-specific treatment sludge and purified phosphorus or metal products. The selected specimens do not define every municipal sludge.
sources:
- id: pradhan_2021
  title: Pradhan, Heinonen-Tanski, Veijalainen, Peraniemi and Torvinen (2021). Phosphorus Recovery from Sewage Sludge Using Acidithiobacilli. International Journal of Environmental Research and Public Health 18:7135. DOI 10.3390/ijerph18137135. Complete 13-page original; methods sections 2.1-2.7, Figures 1-2 and Tables 1-6 inspected.
  url: https://doi.org/10.3390/ijerph18137135
  accessed_on: '2026-10-15'
- id: qiu_2021
  title: Qiu, Xie, Liu, Meng, Wang, Wang and Wang (2021). Removal behavior and chemical speciation distributions of heavy metals in sewage sludge during bioleaching and combined bioleaching/Fenton-like processes. Scientific Reports 11:14879. DOI 10.1038/s41598-021-94216-2. Complete 12-page original, methods pp. 2-3, Figures 1-6 and Table 1 inspected; some enrichment and analytical details are referred to earlier work rather than reproduced in this article.
  url: https://doi.org/10.1038/s41598-021-94216-2
  accessed_on: '2026-10-15'
