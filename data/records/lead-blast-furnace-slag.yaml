mechanisms:
- id: pseudomonas_bioalteration
  name: Heterotrophic microbial alteration of lead blast-furnace slag
  process: bioleaching
  description: Living Pseudomonas aeruginosa cultures altered a real lead-smelting residue in laboratory reactors with weekly medium renewal. Compared with sterile growth medium, the inoculated treatment increased cumulative elemental release into the operational digested-liquid fraction. Filtered and digested fractions differed, consistent with particulate association as well as dissolved mobilization. These measurements do not uniquely quantify cell-surface sorption, isolate a metal product, or establish a commercial recovery process.
  context: Chapter 8 Section 8.2 describes duplicate experiments with 2.5 g of slag grains, reported as 2 mm diameter, in 75 mL of medium in 150 mL polycarbonate flasks at 23 +/- 2 degrees C and 100 rpm for 140 days. The three arms were ultrapure water, sterile growth medium, and growth medium with P. aeruginosa. Fresh medium was supplied every seven days. Per litre the medium contained 4 g succinic acid, 1 g ammonium sulfate, 1 g disodium hydrogen phosphate and 6 g TRIS. Methods specify NaOH adjustment to pH 7.8; results instead describe initial medium pH 8.2, increasing to 8.5 in the biotic arm and remaining 8.2 in the sterile arm. These reported settings are retained separately. General thesis methods, Section 4.1.2, identify the research strain as CIP 105094 from Institut Pasteur; Chapter 8 itself names the species without repeating its accession. An inoculum dose and a Chapter-8-specific slag sterilization protocol were not specified in the inspected methods. The digested sample used
    hydrogen peroxide and heating; the filtered sample excluded suspended cells and neoformed precipitates. The PDF prints the filter pore-size unit as micrograms, which is dimensionally invalid; a corrected pore diameter is not inferred. Separate polished-section observations at 60 and 150 days are not the same endpoint as the 140-day liquid series or the 128-day cumulative table. Industrial feedstock origin does not establish industrial operation of this laboratory weathering experiment.
  microbial: true
