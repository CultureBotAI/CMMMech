            supports: partial
            explanation: Horiike et al. (2017) isolated urease-producing halophilic Bacillus sp. TK2d in 10% marine broth 2216 (3.74 g/L) with 3% NaCl, 20 g/L urea, and 1.0 mM SrCl2, documenting ammonium accumulation and soluble Sr incorporation into biogenic carbonate precipitates (Figures 1-5, Table 1); ureG and other urease-cluster genes were not sequenced, mutated, or inhibited.
          - source_ref: uniprot_bacillus_subtilis_ureabc
            supports: partial
            explanation: Reviewed Swiss-Prot entry UniProtKB:Q07403 (UREG_BACSB) in Bacillus sp. TB-90 (NCBITaxon:36824) provides the canonical reviewed genus-level Bacillus representative for Urease accessory protein UreG (ureG).
    evidence:
      - source_ref: horiike_2017
        supports: support
        explanation: 'Results, Isolation of a urease-producing microorganism, and Figures 1-2: at 3% NaCl the text reports soluble Sr declining from 1.0 mM to 0.13 mM at day 2 and below 1.0e-7 mol/L after 4 days. The stated bound is retained rather than converted to zero or an exact 100% recovery. The Methods describe uninoculated controls; the screening Results report little decline in the negative control and four other isolates. Figures 1-2 show culture time courses rather than overlaid full negative-control curves. Ammonium accumulation accompanies Sr decline but is not a urease knockout or inhibition test.'
      - source_ref: horiike_2017
        supports: support
        explanation: Figures 3-5 and the solid-characterization Results report Sr/Ca in precipitates, P-containing dense regions associated with cells at day 2, and extracellular mineral material at later times. The reported electron-diffraction spacings are consistent with aragonite. Table 1 gives two-standard XANES fitted SrCO3-like fractions of 52% after 5 days and 87% after 10 days for the 1 mM starting-Sr cultures; the remaining fitted fractions are SrCl2-like. These are model-dependent spectral fractions, not crystalline-phase purities, fractions of total initial Sr recovered, or proof that all solid Sr is strontianite.
      - source_ref: horiike_2017
        supports: partial
        explanation: Figure 2 and its Results show much weaker Sr removal at 5-10% NaCl than at 0.3-3%, despite growth at some higher salinities. Urease-positive isolates did not all remove Sr effectively. The chemical comparison also formed Sr-bearing carbonate without bacteria, using a different Na2CO3/CaCl2/SrCl2 recipe; it is not a chemistry-matched control proving microbial necessity for precipitation. The data do not establish a specific Mg ion-channel mechanism or universal Sr selectivity.
      - source_ref: horiike_2017
        supports: partial
        explanation: Figure 1b shows a modest Mg concentration change although the Results describe no decrease; the defensible comparison is much stronger depletion of Sr and Ca, not exact Mg exclusion from all phases. EDS nondetection in selected carbonate material has an approximately 0.1% weight/weight detection limit and does not establish zero Mg throughout the precipitate. Long-term leaching stability, isolated-metal yield and deployment are untested in this study. The linked supplement was not acquired after bounded PMC, publisher and Europe PMC attempts; claims here rely on the inspected main text, Table 1 and main Figures 1-6, not an independent reassessment of supplementary micrographs or chemical-control curves.
causal_graphs:
  - id: tk2d_sr_biomineralization_graph
    name: Bacillus sp. TK2d ureolytic carbonate alkalinization and soluble strontium incorporation into mixed carbonate precipitates
    description: Causal pathway linking representative Bacillus UreABC urease subunits (UniProtKB:P77837, UniProtKB:P71035, UniProtKB:P75030) and reviewed Bacillus UreG nickel-incorporation accessory GTPase (UniProtKB:Q07403) to urea hydrolysis and ammonium/carbonate generation in Bacillus sp. TK2d cultures (3.74 g/L marine broth 2216, 30 g/L NaCl, 20 g/L urea, 1.0 mM SrCl2, 30 C, 120 rpm) and soluble Sr depletion (to 0.13 mM at day 2 and <1.0e-7 mol/L after day 4 at 0.3-3% NaCl) into extracellular aragonite-like Ca/Sr carbonate precipitates with two-standard Sr K-edge XANES fits of 52% SrCO3-like (day 5) and 87% SrCO3-like (day 10) coordination alongside residual SrCl2-like fractions (Horiike et al., 2017).
    scope: REPRESENTATIVE_EXAMPLE
