  edges:
  - source: ph_and_autoclaving_condition
    target: imch_cytochrome
    predicate: modulates
    relationship: starting pH (6.8 vs 6.3) and 121 degrees C autoclaving govern the phenotypic requirement for ImcH during akaganeite reduction
    description: Lower medium pH (6.3, both fresh and autoclaved) strongly suppresses akaganeite reduction by delta-imcH, whereas at pH 6.8 fresh unautoclaved akaganeite imposes an ~7-day lag in delta-imcH that is shortened by 20 min autoclaving at 121 degrees C; thermodynamic redox shifts are inferred by analogy to Figure 1 soluble Fe(III)-citrate rather than directly measured on akaganeite.
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: Levar et al. (2017) Figure 2 and Table 1 show that pH 6.3 strongly suppresses delta-imcH akaganeite reduction and pH 6.8 autoclaving shortens the ~7-day delta-imcH lag without a general fumarate-growth defect, while mineral redox potentials were inferred rather than directly measured.
  - source: imch_cytochrome
    target: synthetic_akaganeite_substrate
    predicate: reduces
    relationship: ImcH pathway supports rapid onset of akaganeite Fe(III) reduction at pH 6.8 and reduction at pH 6.3
    description: ImcH-associated extracellular electron transfer enables rapid initial reduction of fresh akaganeite at pH 6.8 (preventing the ~7-day lag seen in delta-imcH) and is required for substantial reduction at pH 6.3, though direct ImcH electron transfer from the quinone pool was not assayed with purified protein and complementation was cited from earlier work.
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: Levar et al. (2017) Figure 2 demonstrates that wild-type Geobacter sulfurreducens PCA reduces akaganeite without the ~7-day pH 6.8 lag or pH 6.3 suppression observed in delta-imcH, with partial support reflecting inferred mineral redox potential and cited-only genetic complementation.
  - source: cbcl_cytochrome
    target: synthetic_akaganeite_substrate
    predicate: reduces
    relationship: CbcL pathway sustains akaganeite Fe(III) reduction to the full wild-type Fe(II) endpoint
    description: CbcL-associated extracellular electron transfer sustains akaganeite reduction after initial Fe(III) reduction, as delta-cbcL initiates reduction without lag but stalls below the wild-type 0.5 N HCl-extractable Fe(II) endpoint (and enables lagged reduction in delta-imcH at pH 6.8), without direct mineral voltage measurement or Figure 2 complementation controls.
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: Levar et al. (2017) Figure 2 shows that delta-cbcL cultures initiate akaganeite reduction but plateau below wild-type acid-extractable Fe(II) levels across pH 6.8 and 6.3 conditions, while mineral redox potential and direct CbcL electron-transfer steps remain inferred.
  - source: synthetic_akaganeite_substrate
    target: acid_extractable_fe2
    predicate: produces
    relationship: microbial reduction of synthetic akaganeite increases 0.5 N HCl-extractable Fe(II) over 14-15 days
    description: Condition-dependent microbial reduction of synthetic XRD-assigned akaganeite in modified NB medium with 20 mM acetate increases 0.5 N HCl-extractable Fe(II) (extracted >=24 h at 23-25 degrees C for ferrozine analysis) over ~14-15 days relative to 14-day cell-free controls, without an independently reported initial akaganeite Fe concentration or isolated secondary mineral product.
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: Levar et al. (2017) Figure 2 and Methods document accumulation of 0.5 N HCl-extractable Fe(II) in live PCA cultures over ~14-15 days with no observable reduction in 14-day cell-free controls, while initial akaganeite Fe loading is not independently quantified and 0.5 N HCl extraction does not isolate a purified mineral product.
