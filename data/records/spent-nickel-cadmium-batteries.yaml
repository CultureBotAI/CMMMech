  evidence:
  - source_ref: sedlakova2017
    supports: support
    explanation: Results 3.1.2 and Figure 2A show Cd dissolution approaching the reported 100% level in both biotic and abiotic ferric treatments over the 28-day series, whereas the dilute-acid comparator is lower. This is a source-reported leaching efficiency for the prepared cathode fraction, not whole-cell or isolated-product recovery. The article does not give a complete efficiency equation, raw analytical series or a closed metal balance for independently reconstructing the percentage.
  - source_ref: sedlakova2017
    supports: partial
    explanation: The abstract and Results 3.1.2 report 55% Ni extraction for both biotic and ferric treatments, but Figure 2B plots those series near 45–47%, below 50%. The prose and original graph are retained as conflicting source statements; neither is silently corrected or adopted as a harmonized yield. Both support partial Ni dissolution and similar biotic/ferric performance, rather than quantitative microbial superiority. Triplicates are stated, but Figure 2 has no displayed error bars or underlying replicate values.
  - source_ref: sedlakova2017
    supports: partial
    explanation: The authors relate poor acid-only dissolution to neutralization and pH rising toward 7, and interpret ferric hydrolysis as sustaining acidity. Their oxidative and hydrolytic explanation and generalized equations are not separate measurements of phase-specific Ni oxidation or proof of an exclusive biological pathway. Figures 5 and 6 concern other-feed pH data and a proposed integrated recycling model respectively; they are not a NiCd pH time series or an operated closed-loop industrial plant. References 20–21 are earlier NiCd studies from overlapping authors; independence from those experiments is not established here, and their uninspected original measurements are not pooled with Figure 2.
  - source_ref: ncbi920
    supports: context_only
    explanation: The live authority identifies A. ferrooxidans at species level. It does not resolve the primary paper's pure-versus-mixed-culture conflict, identify a strain, or prove that this organism caused the observed extraction beyond the chemical comparators.
causal_graphs:
- id: acidophilic_cathode_leaching_graph
  name: Acidithiobacillus ferrooxidans rus-operon Fe(II) biooxidation and ferric/acid dissolution of spent Ni-Cd battery cathode powder
  description: Causal pathway linking representative Acidithiobacillus ferrooxidans rus-operon proteins (outer-membrane Cyc2 AFE_3153/DN052_11975, rusticyanin AFE_3146/DN052_11940, and periplasmic Cyc1 AFE_3152 in reference proteomes UP000001362 and UP000248886) to aerobic Fe(II) oxidation in 9K medium (initial pH 1.5, 200 mL medium + 5 mL inoculum with 2 g <40-um dismantled spent Ni-Cd cathode powder assaying 6.5% Cd and 47.1% Ni) and mobilization of Cd (approaching ~100% by day 28 in Figure 2A) and partial Ni (reported as 55% in the abstract and Results 3.1.2 vs plotted near 45-47% in Figure 2B) in Sedlakova-Kadukova et al. (2017), while preserving comparable extraction in the abiotic ferric-sulfate comparator (44.63 g/L reagent), lower extraction in dilute sulfuric acid alone, and the unresolved Methods (pure A. ferrooxidans) vs Figure 2 caption (A. ferrooxidans + A. thiooxidans mixture) conflict.
  scope: REPRESENTATIVE_EXAMPLE
  mechanism_ref: acidophilic_cathode_leaching
