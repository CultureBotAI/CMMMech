mechanisms:
- id: oneidensis_bes_vanadium_separation
  name: Vanadium separation in an MR-1-inoculated electrochemical system
  process: separation
  description: A laboratory electrochemical system inoculated with Shewanella oneidensis MR-1 showed aqueous vanadium depletion and vanadium in working-electrode acid extracts. Abiotic systems also removed vanadium. This supports separation in the combined biological and electrical system, with partial evidence for a microbial mechanism; microbial necessity, improved recovery, and an isolated vanadium product are not established by this record.
  context: 'Defined electrolyte, not ore or industrial waste: 100 mL working and counter chambers separated by Nafion 117, with carbon-felt electrodes. The working solution contained 30 mM bicarbonate, 10 mM PIPES, 30 mM ammonium acetate, 40 mM NaCl, and Wolfe''s vitamins and trace metals. The source describes the V(V) stock as Na3V2O8 in 1% HCl; that reported reagent formula is retained without inferring a mineral identity or independently resolved stoichiometry. Chambers were purged with nitrogen. After equilibration and the second solution sample, the biotic system was inoculated and the working electrode poised at -800 mV versus saturated Ag/AgCl. The metadata specifies ambient equilibration but no exact controlled assay temperature or inoculum density/preparation. T2 records the biotic V run from May 21 to May 30, 2025, and abiotic V from May 15 to May 21; their starting concentrations, durations and pH histories differ. The biotic series has recorded pH 7.31-7.70 from sample Vbrr_0
    through BESV.brr_END. Filtered solution was measured by ICP-OES; electrode-associated material was extracted with dilute and concentrated nitric acid. Independent replicate counts, a specific reduced V species and industrial deployment are not assigned.'
  microbial: true
  organisms:
  - id: NCBITaxon:211586
    label: Shewanella oneidensis MR-1
  protein_examples:
