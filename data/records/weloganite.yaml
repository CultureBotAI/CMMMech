id: cmmmech:weloganite
name: Weloganite
material_kind: mineral
description: 'Hydrated sodium-strontium-zirconium carbonate mineral, archetype of the mckelveyite/weloganite
  group, with current September 2026 IMA-CNMNC approved formula Na2Sr3Zr(CO3)6(H2O)3, status
  A, and approval number IMA 1967-042. Sabina, Jambor, and Plant (1968) originally described
  weloganite from an alkaline dawsonite-bearing sill at the Francon quarry, St-Michel, Montreal
  Island, Quebec, Canada, initially proposing the Na-free trigonal formula Sr5Zr2(CO3)9·4H2O
  based on a partial analysis that overlooked essential sodium (Table 1, p. 471: SrO 41.0,
  ZrO2 19.4, CO2 32.2, H2O 6.6, sum 99.2 wt%). Following Chen and Chao''s (1975) discovery
  of essential Na and triclinic symmetry, Grice and Perrault (1975) performed a complete chemical
  re-analysis on 2.0 g of pure Francon quarry weloganite (Table 1, p. 210: SrO 36.18, CaO
  1.14, ZrO2 15.26, Na2O 7.75, K2O 0.02, CO2 30.70, H2O+ 7.65, H2O- 0.11, SiO2 0.25, Fe2O3
  0.03, MgO <0.02, total 99.20 wt%, empirical formula (Sr2.8Ca0.2)ZrNa2(CO3)6·3H2O) and solved
  the crystal structure in non-centrosymmetric triclinic space group P1 (a = 8.966(1), b =
  8.980(2), c = 6.730(1) A, alpha = 102.72(2), beta = 116.65(1), gamma = 60.06(1) degrees,
  V = 419.60 A3, Z = 1, R = 0.043 for 2354 observed reflections), showing ordered 9-coordinated
  [Zr(CO3)3O3] (3m symmetry), 6-coordinated [NaO4(H2O)2] and [NaO2(H2O)4] octahedra, and three
  10-coordinated Sr2+ polyhedra. Distinct from mckelveyite-(Y), donnayite-(Y), bainbridgeite-(NdCe),
  strontianite, and elemental strontium or zirconium; no criticality designation, microbial
  mechanism, or industrial recovery yield is asserted.'
