  evidence:
  - source_ref: joseph2012
    supports: support
    explanation: Figure 1A shows fungal growth on brochantite-containing agar across the labelled 10-50 g/L series, decreasing with loading. Figure 1B supports the authors' copper-oxalate product estimate. The ring patterns described after 18 days are a visual observation consistent with redistribution, not a measured metal recovery. Table 1 separately defines MABRO at 5 g/L brochantite; this is not the entire concentration series. The methods formula Cu4(OH)6(SO4)4 is a source error; the identity authorities establish Cu4(SO4)(OH)6.
  - source_ref: joseph2012
    supports: partial
    explanation: Results page 5 assigns moolooite, CuC2O4.nH2O with n below 1, to products on all three copper media using ESEM, XRD and FTIR, partly referring to Joseph et al. 2011 for characterization. The complete 2012 article was inspected, but does not display the original powder patterns for these mineral arms. The accepted outcome is the authors' copper-oxalate product assignment, not independent confirmation of hydration, phase purity or complete substrate conversion. The related 2011 article's original graphics were not successfully acquired in this investigation and are not accepted as directly inspected evidence.
  - source_ref: joseph2012
    supports: partial
    explanation: Figure 1B provides semiquantitative XRD estimates after three months. Its caption uses percentage of dry treated mycelium, while methods describe dried culture and Results use an ambiguous amount-of-copper denominator. The prose percentages are not unambiguously mapped to each mineral arm. No numerical extraction efficiency or recovered-product yield is imported; neither a copper mass balance nor purified product recovery was demonstrated.
  - source_ref: joseph2012
    supports: partial
    explanation: Figure 3 and organic-acid methods concern separate mineral-free malt-agar cultures after 21 days at 8 or 12 g/L malt. Oxalic acid was detected among eleven acid standards. This supports an oxalate-producing phenotype, not proof that oxalate is the sole or necessary cause in the mineral arm. Reported production-rate units and extrapolated quantities are unresolved and are not imported or silently corrected. No industrial deployment or long-term conservation performance follows from these laboratory observations.
  - source_ref: ncbi_bassiana
    supports: context_only
    explanation: The live authority resolves NCBITaxon:176275 to Beauveria bassiana at species rank. It does not verify the unnamed study isolate, strain accession or causal pathway.
- id: bassiana_roof_patina_conversion
  name: Fungal-associated oxalate formation on brochantite-bearing roof coupons
  process: biomineralization
  description: In a separate laboratory surface treatment, fungal growth on copper roof coupons bearing source-assigned brochantite patina was accompanied by copper-oxalate bands and crystals. This is a surface-associated transformation observation; it does not establish complete bulk mineral conversion, a metal recovery yield or durable protective performance.
  context: The same unnamed live fungal isolate was inoculated as conidia suspended in water, at least 200 per 85-mm Petri dish. Unsterilized R1 and R2 copper roof coupons measured 0.1 by 1.5 by 2 cm. They received 2-mm layers of either malt agar (12 g/L malt, 15 g/L agar) or MABRO additionally containing 5 g/L brochantite. Incubation was at room temperature in the dark; numerical temperature and pH were not supplied. Optical microscopy and reflectance FTIR were followed weekly for three weeks. The two coupons are distinct treatment samples, not demonstrated biological replication; no matched sterile roof-coupon control is shown. Unsterilized surfaces limit attribution exclusively to the inoculated fungus.
