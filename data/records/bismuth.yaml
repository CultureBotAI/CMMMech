id: cmmmech:bismuth
name: Bismuth
material_kind: element
description: Bismuth (Bi), represented as an element distinct from bismuth subsalicylate, dissolved bismuth and intracellular Bi-bearing material. A laboratory Fusarium isolate accumulated Bi while growing on bismuth subsalicylate. The accumulated material was associated with phosphorus-rich granules, without an identified mineral phase or established Bi oxidation-state change. The United States 2025 designation names the bismuth commodity and does not automatically apply to every compound or resource.
