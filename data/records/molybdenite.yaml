id: cmmmech:molybdenite
name: Molybdenite
material_kind: mineral
description: Molybdenite is the MoS2 mineral species, grandfathered in the September
  2026 IMA list with original-description year 1796. It is distinct from elemental
  molybdenum, dissolved molybdate, manufactured MoS2 and mixed ores or concentrates.
  The experiment below concerns molybdenite within a heterogeneous commercial
  ore-grade specimen, not a purified mineral. No criticality designation is
  inherited from molybdenum.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 146,
    Molybdenite row; page 1 column definitions and page 2 distribution terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: francisco2007
