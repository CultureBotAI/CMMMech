id: cmmmech:calciohilairite
name: Calciohilairite
material_kind: mineral
description: >-
  Calciohilairite (IMA 1984-023) is an IMA-accepted hydrated calcium-zirconium
  silicate mineral of the hilairite group with IMA September 2026 Master List
  formula CaZrSi3O9(H2O)3 and empirical formula
  (Ca0.79Zr0.11Na0.03Cu0.03)(Zr0.99Fe0.01)(Si2.82Al0.18)O9·3.30H2O. Described
  by Boggs (1988) from miarolitic cavities in alkaline granite of the Golden
  Horn batholith on the south-southwest ridge of Liberty Bell Mountain
  (48°31'4"N, 120°39'7"W), Okanogan County, Washington, USA (cotypes NMNH
  161591 and 162192). Trigonal (space group R32), with powder-refined unit cell
  a = 20.870(4) Å, c = 16.002(4) Å, Z = 18 (unaltered single crystal a =
  20.887(4) Å, c = 15.974(2) Å; subcell a = 10.415(4) Å, c = 16.01(3) Å, Z = 6),
  Dmeas = 2.68(2) g/cm3, Dcalc = 2.74 g/cm3, Mohs hardness 4, and uniaxial (–)
  optics with omega = 1.622(1) and epsilon = 1.619(1).
