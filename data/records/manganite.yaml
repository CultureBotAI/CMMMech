mechanisms:
- id: mr4_associated_manganite_reductive_dissolution
  name: Anaerobic MR-4-associated reductive dissolution of synthetic manganite
  process: redox_transformation
  description: Living MR-4 cultures increased filtered dissolved manganese from source-assigned synthetic manganite in anaerobic laboratory incubations. The authors interpret this as Mn(III)-to-Mn(II) reductive dissolution. Uninoculated, heat-killed, oxygen-exposed and dialysis-separated comparisons strongly limited release under the tested conditions. This supports a culture-associated process with contact and metabolic dependencies in this assay, not a universal requirement for direct electron transfer, an identified reductase, pure-phase mass balance, isolated manganese product or industrial recovery.
  context: Larsen1998 calls the culture Shewanella putrefaciens MR-4; the current NCBI name is Shewanella sp. MR-4, not an authenticated sequence match to the historical laboratory stock. Cells were serially acclimated, centrifuged and resuspended in defined M1 medium containing 30 mM lactate without the casamino acids used during pregrowth. Standard experiments used 250 mL open flasks inside a 10% H2/90% N2 anaerobic chamber at reported 27 degrees C, medium adjusted to pH 7.4, nominal 200 micromol/L MnOOH and 5 x 10^6 cells/mL unless varied. The H2 atmosphere means the no-added-carbon arm is not an electron-donor-free system. Manganite was prepared from MnSO4, H2O2 and NH3, heated at 95 degrees C for six hours, washed hot and cold and stored frozen. The paper gives needle morphology and a synthesis recipe but no batch-specific diffraction refinement, quantified phase purity or measured composition. Separate pH and temperature arms used sealed 50 mL serum bottles and only two sampling times.
