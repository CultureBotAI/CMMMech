id: cmmmech:tannery-sludge
name: Tannery sludge
material_kind: secondary_resource
description: Chromium-bearing solids from tannery wastewater treatment, represented here by the Xiamen factory sludge tested by Wang et al. (2019). This heterogeneous secondary resource is distinct from untreated tanning liquor, leather shavings, pyrolyzed tannery residue, electroplating sludge and elemental chromium. The experiment does not establish a universal sludge composition or inherit constituent-element criticality.
sources:
- id: wang2019
  title: Wenhao Wang, Jianlei Gao, Yonghong Li and Jingqing Gao (2019). Enhanced Cr bioleaching efficiency from tannery sludge with Acidithiobacillus ferrooxidans and Acidithiobacillus thiooxidans. Desalination and Water Treatment 165:134–140. DOI 10.5004/dwt.2019.24500. Complete official seven-page original, Table 1, Figures 1–4 and Equations 1–8 inspected.
  url: https://doi.org/10.5004/dwt.2019.24500
  accessed_on: '2026-10-12'
- id: ncbi920
  title: 'NCBI Taxonomy 920: Acidithiobacillus ferrooxidans, species; verifies the species label, not the source-reported CGMCC culture stock.'
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920&mode=Info
  accessed_on: '2026-10-12'
- id: ncbi930
  title: 'NCBI Taxonomy 930: Acidithiobacillus thiooxidans, species; verifies the species label, not the source-reported CGMCC culture stock.'
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=930&mode=Info
