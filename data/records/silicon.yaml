id: cmmmech:silicon
name: Silicon
material_kind: element
description: The element Si, distinct from dissolved silicic acid, biogenic silica, crystalline silica minerals and the silicon-metal commodity. The United States 2025 list's Silicon material designation is mapped to this element; it does not designate every silicate or imply that diatom silica formation recovers semiconductor-grade or metallic silicon.
