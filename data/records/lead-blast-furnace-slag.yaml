  accessed_on: '2026-10-16'
- id: pasteur_cip
  title: Institut Pasteur CRBIP collection catalogue, CIP 105094, Pseudomonas aeruginosa. Collection identity checked; catalogue cultivation conditions are not substituted for the experiment's reported conditions.
