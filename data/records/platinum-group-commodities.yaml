    title: 'USGS Thesaurus, platinum-group elements (code 2263); definition, synonyms and six narrower element terms'
    url: https://apps.usgs.gov/thesaurus/term-simple.php?code=2263&thcode=2
    accessed_on: '2026-10-11'
  - id: australia_2024
    title: >-
      Australian Department of Industry, Science and Resources. Australia's
      Critical Minerals List and Strategic Materials List, updated 20 February
      2024; Table 1 platinum-group-elements row and footnote 16 naming six metals.
    url: https://www.industry.gov.au/publications/australias-critical-minerals-list-and-strategic-materials-list
    accessed_on: '2026-10-11'
criticality:
