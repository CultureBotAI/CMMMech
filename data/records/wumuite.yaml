id: cmmmech:wumuite
name: Wumuite
material_kind: mineral
description: >-
  Wumuite (IMA 2017-067a) is an IMA-accepted potassium-aluminium-tungsten oxide
  mineral with a hexagonal tungsten bronze (HTB)-type structure (Strunz 04.E,
  Dana 07 AB3O9) and September 2026 IMA-CNMNC Master List ideal formula
  KAl0.33W2.67O9 (PDF p. 236, status A; also written K(W2.67Al0.33)O9 or
  K(W2.67Al0.33)Sigma3O9 in Xue, Li, and Xie 2020). Described by Xue, Li, and Xie
  (2020) from a lightly weathered yellowish-gray aplitic Neoproterozoic Sinian
  (800 Ma zircon age) biotite–quartz monzonite body near the contact zone of
  Permian mafic rocks and ~300 m northeast of a fault-controlled
  pyrite-quartz-vein gold deposit in gabbro, near Nanyang village, Huaping
  County, Lijiang City, Yunnan Province, adjacent to northwestern Panzhihua City
  on the Sichuan–Yunnan boundary in the Panzhihua–Xichang (Pan–Xi) region,
  southwestern China (note coordinate discrepancy between the Abstract on p. 483,
  26°46'8.21" N, 101°27'13.86" E, and Section 2 on p. 484, 26°46'18.21" N,
  101°27'13.86" E; named after the Wumu River; holotype M13782 at the Geological
  Museum of China, Beijing, and cotype NY-6-2Z at the Crystal Structure
  Laboratory, China University of Geosciences, Beijing, pp. 483–485). Occurs as
  light green, transparent, hexagonal tabular crystals up to 0.3 mm across
  dominated by {0001} pinacoids with {10-10}, {01-10}, and {1-100} prism forms,
  associated with major quartz, orthoclase, albite, biotite, hornblende, and
  kaolinite, minor/accessory ilmenite, goethite, hematite, zircon, zoisite,
  tourmaline, monazite-(Ce), and allanite-(Ce), and W–Te mineralization
  comprising earlier automorphic scheelite inclusions, tellurite, later
  allotriomorphic rims and intergrowths of tewite (K1.5(Te,W)1.5W5O19, IMA
  2014-053), and unnamed natural WO3 (pp. 483–485, Figs. 1–3). Exhibits a white
  streak, vitreous to adamantine lustre, brittle tenacity, good {10-10} and
  {0001} cleavage, Mohs hardness ~5–6, Dcalc = 6.52 g/cm3 (measured density not
  determined due to small crystal size), uniaxial (+) optics with Gladstone–Dale
  calculated refractive index n = 2.13, and reflection FTIR bands (Bruker
  HYPERION 1000, 4000–400 cm-1, Section 5, pp. 485–486, Fig. 4) at 816 cm-1 (WO6
  octahedral stretching) and 523, 475, 446, and 424 cm-1 (W–O bending). Ten-point
  WDS electron-microprobe analysis on a single grain (JEOL JXA-8100, 20 kV, 10
  nA, 2 um beam; Section 4, p. 485, Table 1) yielded WO3 91.16 wt% (range
  88.45–92.35, SD 1.10, scheelite standard), K2O 5.55 (5.16–5.85, SD 0.28,
  microcline standard), Al2O3 2.52 (2.40–2.68, SD 0.04, albite standard), TeO2
  0.59 (0.54–0.75, SD 0.08, Sb2Te3 standard), total 99.82 wt%, corresponding on 9
  O apfu to the empirical formula K0.80(W2.68Al0.34Te0.03)Sigma3.05O9 within the
  nonstoichiometric HTB solid-solution series Kx(W3-x/3Alx/3)Sigma3O9 (x <= 1,
  coupled substitution 3[] + W6+ = 3K+ + Al3+). Hexagonal, space group P6/mmm, Z
  = 1 (Sections 6.1–6.2, pp. 485–492, Tables 2–7, Figs. 5–8): primary single-crystal
  MoKalpha XRD refinement on a 0.07 x 0.07 x 0.05 mm crystal (Bruker SMART
  APEX-CCD, 162 reflections with I > 2sigma(I) out of 164 independent, Rint =
  0.01, R1 = 0.025, wR2 = 0.072, GoF = 1.05, Table 3, p. 488) gives a = 7.2952(5)
  Å, c = 3.7711(3) Å (printed as 3.7713 Å in the Abstract on p. 483 and Section
  6.2 prose on p. 487), V = 173.81(2) Å3, with corner-sharing (W0.89Al0.11)O6
  octahedra at 3f (mean (W,Al)–O = 1.923 Å) forming hexagonal tunnels along c
  partially occupied by K1 at 1b (occupancy 0.8, K1–O2 = 3.182(2) Å); a second
  SCXRD measurement (Rigaku XtaLAB PRO-007HF, MoKalpha, Section 6.2, p. 487)
  gave a = 7.2904(2) Å, c = 3.7686(2) Å, V = 173.47(1) Å3 for the 1c subcell and
  revealed weak satellite reflections doubling c (c' = 2c = 7.5396(5) Å, a =
  7.2904(3) Å, V = 347.09(2) Å3 in P6/mmm, or C-centered orthorhombic a =
  7.2848(4) Å, b = 12.6348(6) Å, c = 7.5395(4) Å, V = 693.96(6) Å3) due to
  alternating K occupancy (1.0 and 0.56 at 1a and 1b in the 2c superstructure);
  CHECKCELL powder XRD refinement (MoKalpha, Section 6.1, p. 485, Table 2, p.
  487) gave a = 7.285(5) Å, c = 3.767(1) Å, V = 173.1(3) Å3, with four strongest
  lines at 3.161 (100)(020), 2.413 (40)(021), 6.261 (36)(010), and 3.727
  (30)(001) Å. In abiotic solid-state synthesis experiments (Section 7, pp.
  492–493, Fig. 9), heating pure WO3 with natural granite orthoclase (KAlSi3O8)
  at 700 °C and 1 atm yielded synthetic wumuite, and heating synthetic wumuite
  with WO3 and TeO2 for 10 h at 650 °C and 1 atm yielded synthetic tewite.
  Distinct from tewite, liguowuite, scheelite, tellurite, and elemental tungsten;
  no criticality designation for wumuite itself, no microbial or biological
  mechanism, and no industrial recovery yield are asserted.
