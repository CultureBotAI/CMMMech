mechanisms:
- id: bacterial_biolixiviant_dunite_leaching
  name: Conditional metal leaching from dunite-deposit powders with bacterial biolixiviant
  process: bioleaching
  description: Glucose-grown Gluconobacter oxydans NRRL B-58 produced an acidic biolixiviant that mobilized Mg, Mn, Fe, Co and Ni from the tested rock powders. Compared with deionized water, release increased; at 1% pulp density the advantage over initially pH-matched gluconic acid was small, and removing cells after biolixiviant production did not significantly change short-term release. The supported mechanism is biologically produced leaching chemistry, without demonstrated cell-contact necessity, an identified additional active metabolite, or mineral-specific flux.
  context: Weathered exterior was cut from North Carolina Day Brook dunite-deposit samples before tungsten-carbide milling. Main Methods report DUN-1 as 64 wt% olivine, 27% lizardite, 5% antigorite and 4% talc; DUN-2 as 37% olivine, 59% lizardite, 2% talc and 2% meixnerite; and DUN-3 as 92% olivine, 5% antigorite, 2% lizardite and 1% talc. These are author-reported XRD proportions, not newly confirmed phase assignments. DUN-1 supplies main Figures 2-6, DUN-2 Figure 7, and DUN-3 the early-time Figure S3 according to main Methods. B58 was grown in yeast-peptone-mannitol medium at 30 degrees C and 200 rpm, back-diluted to OD590 0.05 and grown to about 1.5 over 48 h. Splitting culture into 7.5-mL portions and adding equal volumes of 40% glucose gave 15 mL at 20% glucose, followed by 48 h biolixiviant production. The main short assays used 1% wt/vol powder, 22 degrees C and 24 h with shaking; Figure S1 depicts 200 rpm during leaching. Wild-type initial biolixiviant pH was 2.39 +/- 0.02. Analytical
    samples were centrifuged through 0.45-micrometre filter plates at 1500 x g for five minutes, acid-diluted and measured by ICP-MS. Thus results concern operational filtrate elemental concentrations, not oxidation-state-resolved ions or a weighed recovered product. This is laboratory work.
  microbial: true
