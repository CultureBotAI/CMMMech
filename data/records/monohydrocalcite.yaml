mechanisms:
  - id: wms2_monohydrocalcite_precipitation
    name: Monohydrocalcite in WMS2 calcium-magnesium mineralization cultures
    process: biomineralization
    description: The source-designated WMS2 culture, reported as Halomonas utahensis, produced monohydrocalcite in organic calcium-magnesium media, with phase composition dependent on Mg/Ca ratio and sampling time. Powder XRD and Rietveld fits assigned monohydrocalcite as the sole fitted crystalline phase at nominal Mg/Ca 7 after 27 days and Mg/Ca 9 after 14 and 27 days. Both ratios yielded monohydrocalcite/hydromagnesite mixtures at 140 days. These observations do not establish a pure product mass yield, a universally transient intermediate or direct conversion of individually tracked crystals into hydromagnesite. Growth-associated alkalinization, ammonia and carbonic-anhydrase assays support a proposed microbial contribution to carbonate formation, without isolating the causal necessity of each component.
    context: WMS2 was screened from a saltern and identified by the authors using a 1477-bp 16S sequence and phylogeny. The cited ON000249.1 accession is currently annotated as uncultured Halomonas sp. clone WMS2, an environmental sample, rather than the stated cultured species. Halomonas is therefore used only as genus-level context; no species taxon or authenticated strain identifier is asserted. Section 5.3 specifies beef extract 5 g/L, tryptone 10 g/L, NaCl 30 g/L, KCl 2 g/L and nominal Ca2+ 0.01 M supplied by calcium chloride, with magnesium chloride supplying the Mg2+ series. For the accepted Mg/Ca 7 and 9 arms the stated Mg2+ values are 0.07 and 0.09 M. Into 150 mL of medium the recipe adds 3 mL 1 M Na2CO3 and 5 mL 1 M NaHCO3, then adjusts pH to 7.0 with NaOH/HCl. Experimental groups received 1% bacterial suspension, controls the same volume of sterile water, with three parallel samples per group. The inoculum percentage basis is not explicitly specified in Section 5.3. Growth and
      salinity assays used 37 degrees C and 120 rpm, but the mineralization subsection does not independently state its incubation temperature or agitation; these settings are not silently transferred. Solids were sampled at 14, 27 and 140 days for ex situ XRD, FTIR and microscopy. Mineral harvest washing/drying conditions are not detailed in Section 5.4. No matched-pH, killed-cell or isolated-enzyme phase-control series is reported. This is a laboratory salt-supplemented medium study, not industrial extraction or a metal-remediation trial.
