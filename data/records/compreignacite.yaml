id: cmmmech:compreignacite
name: Compreignacite
material_kind: mineral
description: >-
  Compreignacite is the potassium uranyl oxide hydroxide hydrate
  mineral K2(UO2)6O4(OH)6(H2O)7, approved as IMA 1964-026 and listed
  with status A in September 2026. It is distinct from elemental
  uranium, uranium commodities and the synthetic sodium analogue
  called Na-compreignacite. Burns refined natural type-locality
  material from Margnac, Haute-Vienne, France in orthorhombic Pnnm;
  partially occupied interlayer potassium and water sites support
  the revised seven-water formula. The dissolution study below used
  synthetic K-bearing material represented with eight waters and
  a nonideal measured U:K ratio. Its preparation is not silently
  equated with ideal natural material. No criticality, microbial
  mechanism or industrial deployment is inferred.
