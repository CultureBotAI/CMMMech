id: cmmmech:tenorite
name: Tenorite
material_kind: mineral
description: Tenorite is the monoclinic copper(II) oxide mineral CuO, distinct from cuprite (Cu2O), elemental
  copper and unspecified copper-oxide nanoparticles. The September 2026 IMA list records approved status
  A with a 1962 special-procedure action, not a sequential approval number. The accepted experiment concerns
  a synthetic analogue assigned to monoclinic CuO after heating material conditioned with fungal biomass
  filtrate. It does not establish direct living-cell formation, phase purity or isolated copper recovery.
  No elemental copper criticality designation is inherited.
