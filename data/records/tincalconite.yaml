id: cmmmech:tincalconite
name: Tincalconite
material_kind: mineral
description: >-
  Tincalconite is the Na2B4O5(OH)4(H2O)3 mineral species in the September
  2026 IMA-CNMNC list, with grandfathered status G and original-description
  year 1878 rather than a sequential approval identifier. It is distinct
  from borax, kernite, elemental boron and the borates commodity. Pabst and
  Sawyer characterized clear natural crystals from a Searles Lake drill
  core at about 116 feet depth; direct crystallization from brine was their
  interpretation of the occurrence, not an observed formation experiment.
  Giacovazzo et al. refined synthetic crystals grown from aqueous borax
  near 80 degrees C in trigonal R32. Luck and Wang later refined at 291(2) K a synthetic
  crystal obtained from layered aqueous sodium borohydride and
  tetraheptylammonium iodide in acetone, also in R32. Their
  partially occupied water-oxygen model favored Na6[B4O5(OH)4]3·8H2O,
  equivalent to 2.667 waters per Na2B4O5(OH)4 unit, rather than the three
  waters retained in the current IMA formula. Their freely refined O12
  occupancy was 0.337(5); this is a crystallographic model result, not a
  measured water extraction yield or a new accepted mineral species.
  The 2002 Table 1 formula H28B12Na6O27 omits oxygen relative to the
  article's stated hydrated formula; its formula mass is therefore not
  adopted. Natural species identity, synthetic structural models and
  experimentally transformed mixed material remain separate. No commodity
  criticality, microbial activity or industrial recovery claim is inherited.
