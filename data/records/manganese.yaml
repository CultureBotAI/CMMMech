mechanisms:
- id: gb1_manganese_oxidation
  name: Mn(II) and complexed Mn(III) oxidation by Pseudomonas putida GB-1
  process: redox_transformation
  microbial: true
  organisms:
  - id: NCBITaxon:76869
    label: Pseudomonas putida GB-1
  description: Growing GB-1 cultures converted defined soluble Mn substrates to filter-retained oxidized
    Mn. Mn(III)-citrate and Mn(III)-desferrioxamine B (DFOB) supported oxide accumulation, with lower
    and slower accumulation from the strongly complexed DFOB substrate.
  context: Laboratory triplicates used 5 mL Minimal Media A with HEPES at pH 7.8, 30 degrees C, darkness,
    and 100 micromolar Mn supplied as MnCl2, Mn(III)-citrate, or Mn(III)-DFOB. Sterile medium and a GB-1
    triple Mn-oxidase knockout were negative controls. Table 4 reports final GB-1 particulate oxide concentrations
    of 79.8 +/- 2.0 micromolar after 96 h from Mn(II), and 54.3 +/- 2.9 micromolar after 168 h from Mn(III)-DFOB.
    The table does not define the reported error statistic. These are LBB oxidizing equivalents calculated
    assuming particulate MnO2, not identification of a crystalline mineral or recovery of a purified product.
    No industrial extraction or recovery operation was tested.
  evidence:
  - source_ref: wright2018
    supports: support
    explanation: Culture conditions, Mn(III)-L oxidation methods, Fig. 1 and Table 4 support these assays.
      Mutants retaining MnxG or McoA oxidized Mn(III) complexes; this is genetic support, not purified-enzyme
      evidence.
  - source_ref: wright2018
    supports: partial
    explanation: Fig. 3 and Discussion show abiotic Mn(III)-DFOB formation, so its accumulation alone
      is not proof of microbial oxidation. MopA activity was limited in darkness; the discussion reports
      stronger activity in light in separate KG_mopA cell-free-extract experiments. These findings limit
      universal enzyme and environmental extrapolation.
  protein_examples:
  - uniprot_accession: UniProtKB:B0KQT1
    entry_name: B0KQT1_PSEPG
    protein_name: Manganese-oxidizing multicopper oxidase MnxG
    gene_symbol: mnxG
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:76869
      label: Pseudomonas putida GB-1
    interpro_ids:
    - InterPro:IPR002355
    - InterPro:IPR008972
    - InterPro:IPR048215
    functional_role: Multicopper oxidase MnxG (PputGB1_2447) catalyzing two-electron oxidation of soluble
      Mn(II) to biogenic Mn(III/IV) oxide in Pseudomonas putida GB-1.
    evidence:
    - source_ref: wright2018
      supports: support
      explanation: Primary multicopper oxidase responsible for Mn(II) oxidation in P. putida GB-1; genetic
        deletion and complementation in Wright et al. (2018) dissect its contribution alongside McoA and
        MopA.
  - uniprot_accession: UniProtKB:B0KSN7
    entry_name: B0KSN7_PSEPG
    protein_name: Multicopper oxidase type 2
    gene_symbol: mcoA
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:76869
      label: Pseudomonas putida GB-1
    interpro_ids:
    - InterPro:IPR011706
    - InterPro:IPR045087
    - InterPro:IPR008972
    pfam_ids:
    - Pfam:PF17963
    - Pfam:PF07731
    functional_role: Multicopper oxidase McoA (PputGB1_2665) functioning as an independent Mn(II)-oxidizing
      multicopper oxidase pathway in Pseudomonas putida GB-1.
    evidence:
    - source_ref: wright2018
      supports: support
      explanation: Second multicopper oxidase (PputGB1_2665) shown by clean deletion and overexpression
        in Wright et al. (2018) to oxidize Mn(II) to Mn(III/IV) oxides.
