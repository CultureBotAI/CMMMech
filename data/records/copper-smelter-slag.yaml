id: cmmmech:copper-smelter-slag
name: Copper smelter slag
material_kind: secondary_resource
description: 'Heterogeneous slag generated by copper smelting, distinct from copper ore, flotation tailings, a pure mineral or a recovered copper product. The curated experiment used two historical Polish copper-production slags: crystalline fayalite/glass-rich material (CS) and predominantly glassy material (AS), with different residual copper-bearing phases. These characterized feeds do not define all copper smelter slags. No constituent''s criticality designation is inherited.'
sources:
- id: potysz2019
  title: Potysz and Kierczak (2019). Prospective (Bio)leaching of Historical Copper Slags as an Alternative to Their Disposal. Minerals 9(9):542. DOI 10.3390/min9090542; publisher v2 PDF, 24 pages; Sections 2.1-2.3, 3.1-3.6, Tables 1-4 and Figures 1-9.
  url: https://doi.org/10.3390/min9090542
  accessed_on: '2026-10-11'
- id: dsm9463
  title: DSMZ culture catalogue. Acidithiobacillus thiooxidans DSM 9463, strain designation B-S2, isolated from a bioleaching reactor in Australia; authority identity does not independently authenticate the study stock.
  url: https://www.dsmz.de/collection/catalogue/details/culture/DSM-9463
  accessed_on: '2026-10-11'
- id: ncbi930
  title: NCBI Taxonomy. Acidithiobacillus thiooxidans, species Taxonomy ID 930.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=930
  accessed_on: '2026-10-11'
mechanisms:
- id: sulfur_oxidizer_associated_slag_leaching
  name: Sulfur-oxidizer-associated metal mobilization from historical slags
  process: bioleaching
  description: Living A. thiooxidans DSM 9463 cultures were associated with acidification and greater copper, zinc and iron mobilization from two historical slags than uninoculated growth medium at the same nominal loading. Sulfur oxidation and acid-mediated dissolution are supported interpretations; the experiment does not isolate direct cellular attack from the changed solution chemistry or quantify dissolution of each mineral phase.
  context: Laboratory flasks contained the 0.25-0.5 mm slag fraction, mineral-salt medium with 1% w/v elemental sulfur and 2% v/v inoculum pregrown for two weeks. Initial medium pH was 3.5, with free drift during 21 days; agitation was 150 rpm. This record emphasizes the unambiguous 1% pulp-density arm. The paper does not clearly specify incubation temperature, working volume or inoculum cell density. Methods state at least duplicate extractions, without arm-specific replicate counts. Leachates were filtered through 0.45-micrometre PTFE, acidified and analyzed for elements with an Agilent 7700x. Reported extraction fractions refer to the starting slag inventory, not purified-metal recovery, and do not establish industrial deployment.
  microbial: true
  organisms:
  - id: NCBITaxon:930
    label: Acidithiobacillus thiooxidans
