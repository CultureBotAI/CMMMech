id: cmmmech:jonlarsenite
name: Jonlarsenite
material_kind: mineral
description: >-
  IMA-approved natural cubic aluminium-copper intermetallic mineral (IMA 2024-078a; status A,
  Approved; full description published 21 October 2025; no mineral symbol is stated in the
  primary paper or in the September 2026 IMA Master List, PDF p. 106) with ideal end-member
  formula Al4Cu9 (requiring Al 15.88 wt%, Cu 84.12 wt%, total 100.00 wt%; Bindi, Kihle, Cheng,
  Hu, Yao, Ma, Guan, Asimow, and Steinhardt, 2025, European Journal of Mineralogy 37:783-791).
  Named in honour of Jon Larsen (b. 1959), who played a pivotal role in the decade-long
  systematic European urban micrometeorite search under project STARDUST (Section 1, pp.
  783-784). Discovered in micrometeorite sample NMM/L2 (an elongated, dark grey, vesicular
  scoriaceous microspherule ~200 um in diameter; country listed as "Norway (meteorite)" in the
  September 2026 IMA Master List, PDF p. 106), collected by Jon Larsen on 15 August 2022 from
  loose particulate material on the roof of a modern industrial facility operated by Bertel O.
  Steen Logistics near Skedsmokorset, just north of Oslo, Norway (coordinates 60.0176196 deg N,
  11.0578908 deg E; building constructed in 2017-2018; Abstract, p. 783, and Section 1, p.
  784). The type material (polished section of NMM/L2) is deposited in the collections of the
  Natural History Museum, University of Oslo, Postboks 1172, Blindern, 0318 Oslo, Norway,
  under registration number KNR 44452 (Section 1, p. 784). NMM/L2 represents the fifth
  documented extraterrestrial object hosting metallic Al-Cu intermetallic phases, after the
  Khatyrka meteorite, KT-01 (Sudan), FB-A1 (southern Italy), and NG-1 (Democratic Republic of
  the Congo) (Sections 1 and 3, pp. 784, 789). Jonlarsenite occurs as subhedral to anhedral
  grains up to ~2 um in maximum dimension intimately intergrown with Cu-bearing aluminum and
  embedded within the silicate matrix associated with magnesian olivine, oxides/spinel, Fe-Ni
  metal beads (taenite, iron, nickel), and Ca-rich / compositionally diverse silicate glass
  (Abstract, p. 783; Sections 1 and 2.1, p. 784). Extraterrestrial origin was substantiated by
  secondary ion mass spectrometry (SIMS) triple-oxygen isotope measurements (Cameca ims 7f-GEO,
  primary Cs+ beam at +10 kV and ~3 nA, ~20 um spot size, San Carlos olivine standard) at three
  locations in relict olivine, two of which plot far from the terrestrial fractionation line
  and on or close to the carbonaceous chondrite anhydrous mineral (CCAM) line (Section 2.4, p.
  788; Figures 11-12, p. 790), reflecting high-temperature redox and rapid-quenching processes
  during parent-body alteration or hypervelocity impact events in space (Section 3, p. 789). In
  transmitted and reflected light, jonlarsenite is opaque and exhibits high backscattered
  electron contrast in SEM images; colour, lustre, streak, hardness, tenacity, cleavage,
  fracture, and other macroscopic physical and optical properties could not be directly
  measured due to the ~2 um grain size and intimate intergrowth with adjacent phases (Abstract,
  p. 783; Section 2.1, pp. 784-785). The calculated density is 6.979 g cm-3, derived from the
  empirical formula obtained via EPMA and the unit-cell parameters determined by TEM (Abstract,
  p. 783; Section 2.1, p. 785). Quantitative chemical analyses (Section 2.2, p. 785, and Table
  1, p. 786) were obtained by two complementary methods: (1) wavelength-dispersive electron
  probe microanalysis (EPMA; JEOL 8200, 12 kV, 5 nA, ~150 nm focused beam, CITZAF correction,
  n = 2; Ni analysed with Ni metal standard and found below the 0.03 wt% detection limit),
  yielding mean Al 13.64 wt% (range 13.15-14.12), Cu 81.12 wt% (80.38-81.86), Fe 3.86 wt%
  (3.60-4.11), Total 98.62 wt% (exact sum 13.64 + 81.12 + 3.86 = 98.62 wt%), corresponding on
  the basis of 13 atoms per formula unit to (Al3.55Fe0.45)sum=4.00(Cu8.96Fe0.04)sum=9.00; and
  (2) STEM-EDS on a site-specific FIB-milled lamella (n = 4; Helios NanoLab G3 UC dual-beam
  FIB-SEM with 2 kV Ga+ final polish; Titan Cubed Themis 300 double Cs-corrected STEM at 300 kV
  with X-FEG and Super-X EDS), yielding mean Al 15.05 wt% (range 12.84-16.52), Cu 80.58 wt%
  (79.96-81.33), Fe 4.37 wt% (3.40-5.83), Total 100.00 wt% (exact sum 15.05 + 80.58 + 4.37 =
  100.00 wt%), corresponding on the basis of 13 atoms to
  (Al3.81Fe0.19)sum=4.00(Cu8.66Fe0.34)sum=9.00. Conventional X-ray diffraction could not be
  performed due to nanoscale grain size; selected-area electron diffraction (SAED) and
  atomic-resolution HAADF-STEM imaging on the FIB lamella established that jonlarsenite is
  cubic, space group P-43m (#215), with a = 8.70(1) A (reported as a ~ 8.70 A in the Abstract,
  p. 783, and Figure 7 caption, p. 788), V = 659(2) A3 (rounded from 8.70^3 = 658.503 A3), and
  Z = 4, matching the ordered gamma-brass (gamma-Al4Cu9) crystal structure of Arnberg and
  Westman (1978) (Section 2.3, pp. 785-788; Figures 7-10, pp. 788-790). In the ordered P-43m
  gamma-Al4Cu9 structure (Table 2, p. 789, where the caption prints "fractional atom
  coordinates (A)" although the tabulated coordinates x, y, z are dimensionless fractions;
  Section 2.3, pp. 786-788), there are two inequivalent Al sites - Al1 at Wyckoff 4e (0.1157,
  0.1157, 0.1157), 9-coordinated to 9 Cu atoms, and Al2 at 12i (0.8113, 0.8113, 0.5332),
  11-coordinated to 11 Cu atoms - and six inequivalent Cu sites: Cu1 at 4e (-0.1704, -0.1704,
  -0.1704) (12-coordinated to 6 Cu at 3 x 2.49 and 3 x 2.62 A and 6 Al at 3 x 2.55 and 3 x
  2.58 A), Cu2 at 6f (0, 0, 0.3553) (12-coordinated to 9 Cu at 2.50-2.56 A and 3 Al at 2.56 A),
  Cu3 at 12i (0.3153, 0.3153, 0.0322) (12-coordinated to 9 Cu at 3 x 2.54 and 3 x 2.63 A and 3
  Al at 2.44 A), Cu4 at 4e (0.6066, 0.6066, 0.6066) (13-coordinated to 7 Cu and 6 Al with
  Cu-Al = 2.50-2.79 A), Cu5 at 4e (0.3253, 0.3253, 0.3253) (13-coordinated to 9 Cu at
  2.45-2.72 A and 4 Al at 2.71 A), and Cu6 at 6g (1/2, 1/2, 0.8549) (11-coordinated to 6 Cu
  and 5 Al with Cu-Al = 2.50-2.57 A). Calculated X-ray powder diffraction lines (Powder Cell v.
  2.4 for CuKalpha1, Bragg-Brentano geometry; all 10 reflections listed in Table 3, p. 789,
  with the four bold strongest reflections indicated; note that reflection 332 with Icalc = 3
  is included in Table 3 despite the caption stating "Icalc > 3") [dcalc in A (Icalc) hkl] are
  3.8908 (4) (210), 3.5518 (7) (211), 2.9000 (9, bold) (300, 221), 2.0506 (100, bold) (411,
  330), 1.8548 (3) (332), 1.7759 (4) (422), 1.4500 (9, bold) (600, 442), 1.2557 (4) (444),
  1.1839 (15, bold) (721, 633), and 1.0709 (7) (741). No biological or microbial interaction
  data are reported in the type mineralogical description.
