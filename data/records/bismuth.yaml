  evidence:
  - source_ref: dodge_2005
    supports: support
    explanation: 'Methods, Assay for total soluble bismuth; Results, Depletion of bismuth;
      Figure 2: after 6 days the inoculated soluble-Bi pool decreased by approximately 0.4
      mg/L, whereas the uninoculated control rose by approximately 0.2 mg/L. The source describes
      the decline as about 75% of initial soluble Bi. This denominator is the small filtered
      dissolved pool, not the total 1.5 mM bismuth-subsalicylate suspension, and no whole-feed
      mass balance or recovery percentage follows.'
  - source_ref: dodge_2005
    supports: support
    explanation: 'Methods, Electron microscopy and elemental analysis; Results, Localization;
      Figure 3: TEM-EDS of 60 nm sections found Bi with P and other elements in cytoplasmic/vacuolar
      granules. Salicylate-grown controls also had granules but no detected Bi. The EDS spot
      exceeded granule diameter; adjacent material contributes to the spectrum. Extracellular
      Bi-rich regions were also observed and interpreted as undissolved feed. Localization
      does not establish a unique chemical phase.'
  - source_ref: dodge_2005
    supports: partial
    explanation: 'Methods, Polyphosphate extraction and analysis; Results, Polyphosphate isolation;
      Figure 4: long-chain-soluble and granular fractions from Bi-fed biomass contained more
      Bi relative to phosphate than short-chain fractions and salicylate controls. Polyphosphate
      was measured as orthophosphate after hydrolysis. Co-fractionation and EDS support the
      proposed association but do not directly establish a Bi-polyphosphate molecular structure
      or show that polyphosphate causes tolerance.'
  - source_ref: dodge_2005
    supports: partial
    explanation: 'Results, Depletion of bismuth and Degradation of the salicylate moiety;
      Table 1: Bi oxidation states were not resolved. Salicylate hydroxylase and catechol
      1,2-dioxygenase assays in crude extracts support an organic-substrate catabolic pathway,
      not a Bi reductase. The paper extends the salicylate pathway to bismuth subsalicylate
      by inference. Separate glucose/bismuth-nitrate tolerance assays and equivalent endpoint
      growth on salicylate and bismuth subsalicylate do not prove quantitative Bi recovery;
      growth on the Bi compound reached stationary phase about 24 h later.'
