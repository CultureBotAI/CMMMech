mechanisms:
- id: pca_akaganeite_reduction
  name: Condition-dependent akaganeite reduction by Geobacter sulfurreducens PCA
  process: redox_transformation
  microbial: true
  organisms:
  - id: NCBITaxon:243231
    label: Geobacter sulfurreducens PCA
  description: Living wild-type Geobacter sulfurreducens PCA cultures increased acid-extractable
    Fe(II) from freshly prepared XRD-assigned akaganeite. Comparisons with delta-imcH and delta-cbcL
    mutants associate the timing and extent of reduction with those electron-transfer systems,
    with strong dependence on starting pH and autoclaving. The study supports conditional microbial
    Fe(III) reduction, not elemental iron production, a purified mineral product, or direct measurement
    of akaganeite redox potential.
  context: The synthetic substrate was prepared by slowly titrating 0.4 M FeCl3 with 25% NaOH
    over 90 minutes to pH 7, holding for one hour, washing with water, and using it within 24
    hours. Powder XRD assigned the product to akaganeite. Mineral incubations used 1 mL mineral
    suspension plus 9 mL modified NB basal medium, acetate as electron/carbon donor, no added
    fumarate, nitrilotriacetate-free trace minerals, and N2:CO2 (80:20). The basal recipe specifies
    20 mM acetate; phosphate was increased to 0.69 g/L NaH2PO4·H2O before autoclaving. Separate
    comparisons used pH 6.8 or 6.3, with fresh medium or 20 minutes autoclaving at 121 degrees
    C. Each received 100 microlitres of stationary-phase cells grown on acetate/fumarate from
    separate colony picks. Figure 2 reports triplicate culture means and standard deviations,
    representative of at least duplicate incubations, over approximately 14-15 days. Samples were
    extracted in 0.5 N HCl for at least 24 hours at 23-25 degrees C before the ferrozine assay;
    that temperature is for extraction, while the mineral-culture incubation temperature is not
    stated in the inspected Methods. Acid-extractable Fe(II) is not a dissolved-only fraction.
    Initial akaganeite Fe loading is not independently quantified here; the nearby approximately
    20 mM Methods statement follows the goethite preparation and is not transferred to this assay.
  evidence:
  - source_ref: levar_2017
    supports: support
    explanation: Methods and Results, Evidence that the electron transfer pathway changes even
      in the absence of XRD pattern changes, plus Figure 2 show wild-type reduction at pH 6.8
      and no observable reduction in the reported 14-day cell-free controls. Delta-cbcL starts
      reducing but stalls below wild type; fresh-medium delta-imcH has a roughly seven-day lag
      before approaching the wild-type endpoint. Autoclaving at pH 6.8 shortens that lag. At pH
      6.3, delta-imcH reduction is strongly suppressed and autoclaving does not restore it. Table
      1 fumarate-growth comparisons help exclude a gross pH-dependent growth defect. These are
      condition-specific phenotypes, not universal knockout inability.
  - source_ref: levar_2017
    supports: partial
    explanation: The discussion explicitly states that mineral redox potentials cannot be directly
      measured in these experiments; quantitative voltage measurements in Figure 1 concern soluble
      Fe(III)-citrate, not akaganeite. Similar powder XRD before/after autoclaving does not exclude
      changes in aggregation, short-range order or surface properties. Direct ImcH/CbcL electron
      movement from the quinone pool is not demonstrated, and complementation is cited from earlier
      studies rather than performed as a Figure 2 control. The record therefore retains pathway
      association and inferred redox interpretation without treating a particular mineral voltage,
      direct protein mechanism, complete feed conversion, isolated recovery or industrial deployment
      as demonstrated.
  - source_ref: sklute_2023
    supports: context_only
    explanation: A separate 55 degrees C hydrogen-fed Ax17 experiment on synthetic nanophase akaganeite
      gave a dark nonmagnetic product with amorphous iron-rich nanospheres; oxalate-extractable
      Fe(II) was not significantly different from controls, while temperature-dependent Mossbauer
      analysis detected new ferric and ferrous components with nonunique phase fits. Heated abiotic
      controls also changed. That different organism, medium and analytical extraction is not
      a direct replication or refutation of PCA reduction, and cautions against assuming a universal
      crystalline recovery product or equating an extraction null with no transformation.
