id: cmmmech:piilonenite-nd
name: Piilonenite-(Nd)
material_kind: mineral
description: >-
  Hydrated sodium-neodymium carbonate mineral with current September 2026
  IMA-CNMNC approved formula NaNd(CO3)2(H2O)3 and a unique layered structure
  chemically analogous to the NaY(CO3)2·6H2O hexahydrate adamsite-(Y) and the
  Na3Y(CO3)3·3H2O trihydrate shomiokite-(Y). The primary description by Lykova
  et al. (2026) cites approval number IMA 2025-031, whereas the September 2026
  IMA Master List (PDF p. 173) prints 2025-031b; both identifiers refer to the
  same Mont Saint-Hilaire holotype (CMNMC 93393, from 3-6 cm wide apophyses of
  the Poudrette pegmatite cutting a hornfels xenolith on level 8 of the
  Poudrette (Demix) quarry, previously conflated under provisional code UK119),
  and IMA:2025-031 is recorded as the canonical CURIE while retaining the
  2025-031b suffix note from the master list. Electron-microprobe WDS analysis
  on holotype CMNMC 93393 (7 analyses, Table 1, p. 340) yielded Na2O 9.29, Y2O3
  1.71, La2O3 0.93, Ce2O3 8.32, Pr2O3 2.75, Nd2O3 23.90, Sm2O3 6.85, Eu2O3 0.27,
  Gd2O3 3.64, Tb2O3 0.12, Dy2O3 0.90, Ho2O3 0.13, Er2O3 0.12, Tm2O3 0.07, CO2*
  26.32, H2O* 16.16, total 101.48 wt%, corresponding to the empirical formula
  Na1.00(Nd0.48Ce0.17Sm0.13Gd0.07Pr0.06Y0.05La0.02Dy0.02)Sigma1.00(CO3)2(H2O)3
  (with two Y-enriched zones reaching 18.43 wt% Y2O3 / 0.53 apfu Y), where CO2
  and H2O were calculated by stoichiometry rather than directly measured because
  of the paucity of pure material. Synchrotron single-crystal X-ray diffraction
  at 298(2) K (ALS beamline 12.2.1, lambda = 0.7288 A, Table 3, p. 342) on an
  inversion-twinned crystal (54:46 ratio) refined in orthorhombic space group
  P212121 (a = 6.7914(11), b = 17.135(3), c = 6.4360(10) A, V = 749.0(2) A3,
  Z = 4, R1 = 0.092, wR2 = 0.106 for 1168 unique reflections with I > 2sigma(I)
  out of 1364 unique reflections), with isotropic displacement parameters
  retained for C2 and several O sites (O1, O4, O5, O6, O8, O9) and unlocated
  hydrogen positions. The mineral slowly dissolves in room-temperature aqueous
  HCl with effervescence (qualitative diagnostic observation, p. 339). Distinct
  from adamsite-(Y), shomiokite-(Y), and elemental neodymium; no criticality
  designation or microbial mechanism is asserted.
