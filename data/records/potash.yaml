id: cmmmech:potash
name: Potash
material_kind: commodity
description: The commodity category of mined and manufactured salts containing potassium in water-soluble
  form. USGS distinguishes potassium chloride (muriate of potash), potassium sulfate (sulfate
  of potash), and potassium magnesium sulfate products in agricultural use, while also describing
  industrial uses. This is not elemental potassium, potassium oxide despite K2O-equivalent statistical
  reporting, a single potash-bearing mineral species, or all potassium-bearing rocks. In particular,
  potassium feldspar is not equated with a potash product. The named US 2025 designation applies
  to potash as a commodity. No microbial production or recovery mechanism is asserted.
