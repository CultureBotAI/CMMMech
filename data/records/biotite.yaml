    title: Rieder et al. (1998). Nomenclature of the Micas. Clays and Clay Minerals 46(5):586-595. DOI 10.1346/CCMN.1998.0460513; p586 Commission approval, p589 Table 4 and Series Names and Lists of Invalid Names.
    url: https://doi.org/10.1346/CCMN.1998.0460513
    accessed_on: '2026-10-11'
