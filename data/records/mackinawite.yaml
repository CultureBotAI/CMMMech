  evidence:
  - source_ref: picard2018
    supports: support
    explanation: Sections 2.1-2.5, Tables 1-2, Figures 1-2 and supplement S1-S2 distinguish the live, inactivated, cell-free and post-growth Fe-addition arms. Figure 2 assigns mackinawite reflections against the reference diffraction pattern in panel D; it is the only detected crystalline iron sulfide at one week and two months across these arms. Vivianite also occurs in inactive-cell and some abiotic samples, so the complete precipitate is not established as pure mackinawite. Identification rests on diffraction, not on the FeS formula or black precipitate color alone.
  - source_ref: picard2018
    supports: support
    explanation: Section 3.2, Table 3 and Figure 3 show larger Scherrer-derived crystalline domains in live-cell and inactive-cell treatments than in cell-free and post-growth Fe-addition treatments. Figures 4-7 and S3 show differences in aggregation and cell-associated deposits. Crystalline-domain estimates, dynamic-light-scattering aggregate sizes and selected microscopy images measure different properties; none is a mineral recovery yield. The inactive-cell comparison supports a biomass contribution without implying sulfate reduction or other metabolism by killed cells.
  - source_ref: picard2018
    supports: partial
    explanation: Table 2 and Figure S2 show that the controls approximate, rather than exactly match, sulfide exposure, Fe/S ratio and pH. Reported final pH values are about 7.06 for live Fe cultures, 7.30 for abiotic treatments and 7.37 for inactive-cell treatments. The inactive-cell pretreatment also permits vivianite formation before sulfide addition. Table 3 gives inactive-cell c-axis domain size as 18.5 +/- 7.7 nm, while Section 3.2 says 18.7 +/- 7.7 nm; no reconciled point estimate is adopted. The qualitative growth comparison is retained without claiming a completely isolated molecular cause or a universal biological size signature.
  - source_ref: picard2018
    supports: partial
    explanation: Section 3.4 explicitly states that Fe/S elemental maps do not identify mineralogy at each cell surface. Assignment of those deposits to mackinawite is an inference from the bulk one-week diffraction result. Cell-surface binding and extracellular-polymer templating are proposed explanations, not results of purified-polymer or gene-disruption assays. The approximately 60% allocation of FeS to cell crusts in Sections 3.4 and 4.3 is a geometric estimate, not a measured recovered fraction.
  - source_ref: picard2018
    supports: partial
    explanation: Figure 2C detects greigite alongside mackinawite in the five-month live treatment; Section 4.2 instead says greater than five months and reports residual mackinawite at eleven months. This is conditional phase evolution, not complete conversion or proof of enzymatic iron oxidation. Neither pyrite nor marcasite was detected in the tested samples. The null result is specific to these conditions, and Section 4.5 warns that reactant concentrations exceed those typical of natural sediments. No natural-feed extraction, field performance or isolated-metal recovery is demonstrated.
  - source_ref: ncbi_am13
    supports: context_only
    explanation: The current strain node and source-name synonym resolve AM13 = DSM 14728 without assigning an unverified strain to a species-level experiment. Taxonomy verifies the label mapping, not the mineralization mechanism.
