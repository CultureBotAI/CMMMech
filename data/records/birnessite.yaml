      supports: partial
      explanation: Representative Aspergillus niger citrate exporter CexA for organic-acid excretion during ATCC 201373 clearing and transformation of synthetic sodium birnessite in Wei et al. (2012); cexA was not directly assayed.
  evidence:
  - source_ref: wei2012
    supports: support
    explanation: Results on printed pages 1745-1746, Table 1 and Figure 1D report birnessite clearing during fungal growth. Figure 2I compares the abiotic feed morphology with crystals after 15 days of A. niger growth (J) and 5 or 23 days of S. himantioides growth (K-L). Table 3 reports initial surface pH 7.26, falling to 3.08 after 15 days for A. niger and 2.93 after 25 days for S. himantioides (six surface measurements). The 23-day growth/microscopy sampling and 25-day pH/clearing statements are retained as distinct times.
  - source_ref: wei2012
    supports: partial
    explanation: Figure 4 assigns the recovered 5-day S. himantioides material to manganese oxalate trihydrate plus dihydrate (lindbergite), and the 23-day material to the dihydrate. These are source assignments from reference-pattern matching, not quantitative phase fractions. Crystals were extracted using 80 degrees C water and vacuum-dried overnight before analysis; no wet-culture or paired drying series excludes preparation-related hydration changes. The trihydrate is not assigned retrospectively to falottaite, and the Serpula diffraction result is not transferred to the A. niger arm. This is the same Wei2012 experiment also represented under lindbergite, not independent evidence.
  - source_ref: wei2012
    supports: partial
    explanation: Table 1 reports growth and clearing-zone extension ratios and Table 2 biomass tolerance indices against no-oxide growth controls. None is an extraction fraction. The narrative's complete solubilization after 15 or 25 days rests on clearing rather than a dissolved-Mn balance; newly precipitated solids preclude interpreting it as complete aqueous recovery. Figure 2I supplies an abiotic morphology comparison, but no time-matched sterile diffraction, killed-biomass or pH-matched fungal series establishes microbial necessity or an exclusive cause.
  - source_ref: wei2012
    supports: partial
    explanation: Figure 5 and the abiotic-test methods compare 50 microlitre additions of 0.5 M citric acid, oxalic acid or HCl to 5 mm wells in amended agar. The organic acids cleared birnessite, whereas HCl produced no significant halo in that test. These separate chemical assays support a possible organic-metabolite contribution without measuring fungal oxalate production or identifying their products by diffraction. Figure 3 EDX concerns a separate biogenic-MnOx feed; Figure 6 is a conceptual model, including speculative metal sorption, rather than direct evidence for every pathway or recovery application drawn.
  - source_ref: ncbi_niger
    supports: context_only
    explanation: TaxID 5061 resolves the reported species name; it does not authenticate ATCC 201373 or establish a species-wide phenotype. That strain differs from the ATCC 1015 cultures used in other curated manganese studies.
  - source_ref: ncbi_himantioides
    supports: context_only
    explanation: TaxID 80602 resolves the reported species name, not the unaccessioned experimental isolate or a lineage within that species complex.
- id: fungal_synthetic_cobalt_birnessite_transformation
  name: Fungal transformation of synthetic cobalt-bearing birnessite to oxalate-bearing solids
  process: biomineralization
  description: Growing A. niger ATCC 1015 transformed a separately prepared synthetic cobalt-bearing birnessite into rosette-like solids assigned by the authors to manganese oxalate dihydrate (lindbergite), with cobalt detected by EDXA in examined transformed material. Matched uninoculated material retained birnessite-like diffraction. This supports culture-associated mineral transformation and cobalt association with the recovered solids, not a measured cobalt recovery fraction or demonstrated cobalt lattice substitution. Oxalate-mediated dissolution and precipitation are the authors' interpretation; cobalt reduction was proposed without a direct oxidation-state assay. No industrial deployment was demonstrated.
  context: Ferrier2022 used living A. niger ATCC 1015 on 90 mm malt extract agar plates, approximately 25 cm3 medium containing 0.2% (w/v) powder below 90 micrometres, inoculated with a 5 mm leading-edge colony plug and incubated for 14 days at 25 degrees C in darkness. Synthetic feed was prepared from CoCl2 and KMnO4 with HCl at elevated temperature, washed, desiccated, acid-treated to exchange interlayer potassium, then recovered and dried. The printed nitric-acid recipe says 200 ml 0.1 HNO3 without a concentration unit; it is not silently completed here. Feed was heated at 105 degrees C for at least 24 hours before experiments. Table 1 reports partial XRF composition as 73.41% MnO, 7.74% Co and 4.48% K2O, using the source's mixed oxide/element basis; this is neither a refined mineral formula nor complete phase purity. Elements not present in synthesis solutions were excluded from that table. This arm is separate from the same paper's natural Nkamouna laterite and from Wei2012's sodium
    birnessite and A. niger ATCC 201373.
