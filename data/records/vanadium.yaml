mechanisms:
- id: oneidensis_bes_vanadium_separation
  name: Vanadium separation in an MR-1-inoculated electrochemical system
  process: separation
  description: A laboratory electrochemical system inoculated with Shewanella oneidensis MR-1 showed aqueous
    vanadium depletion and vanadium in working-electrode acid extracts. Abiotic systems also removed vanadium.
    This supports separation in the combined biological and electrical system, with partial evidence for
    a microbial mechanism; microbial necessity, improved recovery, and an isolated vanadium product are
    not established by this record.
  context: 'Defined electrolyte, not ore or industrial waste: 100 mL working and counter chambers separated
    by Nafion 117, with carbon-felt electrodes. The working solution contained 30 mM bicarbonate, 10 mM
    PIPES, 30 mM ammonium acetate, 40 mM NaCl, and Wolfe''s vitamins and trace metals. The source describes
    the V(V) stock as Na3V2O8 in 1% HCl; that reported reagent formula is retained without inferring a
    mineral identity or independently resolved stoichiometry. Chambers were purged with nitrogen. After
    equilibration and the second solution sample, the biotic system was inoculated and the working electrode
    poised at -800 mV versus saturated Ag/AgCl. The metadata specifies ambient equilibration but no exact
    controlled assay temperature or inoculum density/preparation. T2 records the biotic V run from May
    21 to May 30, 2025, and abiotic V from May 15 to May 21; their starting concentrations, durations
    and pH histories differ. The biotic series has recorded pH 7.31-7.70 from sample Vbrr_0 through BESV.brr_END.
    Filtered solution was measured by ICP-OES; electrode-associated material was extracted with dilute
    and concentrated nitric acid. Independent replicate counts, a specific reduced V species and industrial
    deployment are not assigned.'
  microbial: true
  organisms:
  - id: NCBITaxon:211586
    label: Shewanella oneidensis MR-1
  evidence:
  - source_ref: kane_2026_bes
    supports: support
    explanation: FGDC process steps 1-4, T2, T3 and T6 support the separation observation. T3 reports
      44.1 mg/kg V at Vbrr_0 and 34 mg/kg at BESV.brr_END. T6 reports vanadium in working-electrode extracts
      including Vbrr_WE. The concentrations are mg/kg, not an assumed mg/L conversion. Aqueous depletion
      and extracted electrode-associated amounts are not a mass-balanced recovery percentage or product
      purity.
  - source_ref: kane_2026_bes
    supports: partial
    explanation: T3 abiotic V decreases from 19.1 mg/kg at BESVarr_0 to 12.2 mg/kg at BESVarr_END. T2
      gives different pH histories and durations; the unequal starting concentrations also prevent treating
      endpoint differences as a controlled microbial-effect estimate. T6 separates working-electrode,
      holder and reference-frit extracts; these must not be pooled into an unsupported microbial recovery
      yield.
  - source_ref: kane_2026_bes
    supports: context_only
    explanation: Process step 5 and T7_UV_Vis.csv describe qualitative solution speciation work after
      67 days of anaerobic storage for the biotic sample and 76 days for the abiotic sample. No immediate
      endpoint oxidation-state assignment is made here. T9_SEM.pdf page 7 is labelled solids from V phosphate-buffered
      culturing medium, so it does not establish the mineral identity of the V BES electrode product.
  observations:
  - id: v_biotic_equilibrated
    source_ref: kane_2026_bes
    source_table: T3_AqueousICPOES.csv
    source_sample_id: Vbrr_0
    source_column: V_ppm
    raw_value: '44.1'
    analyte:
      id: CHEBI:27698
      label: vanadium atom
    material_form: Vanadium-bearing electrolyte. ICP-OES measures total elemental V; the atom identifier
      grounds the element, not neutral atoms in solution or an oxidation-state measurement.
    sampled_fraction: Working-chamber solution filtered at 0.22 micrometres before preservation in 1%
      nitric acid.
    study_arm: biotic
    result_status: measured
    value: 44.1
    unit: mg/kg
    analyzed_on: '2025-08-06'
    sampled_on: '2025-05-21'
    sampling_source_locator: T2_pH.csv; SampleID=Vbrr_0; Date column
    context: Post-equilibration baseline of the run assigned to the biotic arm. Metadata steps 1 and 3
      place inoculation after the second solution sample; study_arm therefore does not assert cells were
      present at this baseline. The source sample ID differs from the BESV.brr prefix of later samples;
      its exact T2 key is retained without renaming.
  - id: v_biotic_endpoint
    source_ref: kane_2026_bes
    source_table: T3_AqueousICPOES.csv
    source_sample_id: BESV.brr_END
    source_column: V_ppm
    raw_value: '34'
    analyte:
