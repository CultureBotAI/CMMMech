    description: Sqr / Sqor sulfide-quinone oxidoreductases (A. ferrooxidans AFE_1792, sqr AFE_0267; A. thiooxidans sqr GCD22_02301, sqor GCD22_03207; L. ferrooxidans LFE_1004) oxidizes reduced sulfur species to elemental sulfur and polythionate intermediates metabolized by Tth tetrathionate hydrolases (A. ferrooxidans tth AFE_0029; A. thiooxidans tth GCD22_14205, tth GCD22_02315).
