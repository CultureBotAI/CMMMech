id: cmmmech:lithium-hydroxide-monohydrate
name: Lithium hydroxide monohydrate commodity
material_kind: commodity
description: Manufactured lithium hydroxide monohydrate products, with nominal composition
  LiOH.H2O. The hydration state distinguishes this commodity from anhydrous LiOH; it
  is not elemental lithium or the general battery-grade lithium umbrella. Albemarle
  product 401106 is a crystalline monohydrate with a supplier specification of at least
  55.0% LiOH by acidimetric titration, expressed as LiOH rather than as monohydrate
  purity. Its stated applications include lubricating greases and alkaline storage batteries.
  SAMR separately names a battery-grade monohydrate standard, GB/T 26008-2020; the complete
  qualification tables were not inspected. The supplier assay and the existence of that
  narrower standard do not qualify every monohydrate product for lithium-ion cathode
  manufacture. No criticality designation or microbial production mechanism is asserted.
