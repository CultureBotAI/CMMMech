mechanisms:
- id: isolated_fbp_hafnium_cluster_binding
  name: Cell-free Hf(IV) cluster binding by bacterial ferric ion-binding protein
  process: other
  description: Purified recombinant Neisseria gonorrhoeae ferric ion-binding protein (nFbp) retained multiple Hf(IV) equivalents after removal of unbound small molecules. Crystallography resolved oxo-Hf clusters attached to Tyr195 and Tyr196 in an open protein cleft. This supports a laboratory protein-cluster interaction; physiological Hf uptake, ore dissolution, Hf(IV) reduction and recovery of elemental hafnium were not demonstrated.
  context: The protein was expressed in Escherichia coli TOP10 carrying pTrc99A/Fbp/Ng and purified by cation exchange chromatography. Holo protein was stripped of iron with citrate to prepare apo protein; this was a purified-protein assay, not live-cell exposure. Table 1's representative Hf preparation used a 50-fold molar excess of [Hf(NTA)2]2-, 100 mM NaCl, 4 mM phosphate and 25 mM bicarbonate at pH 7.4 and 310 K for 3 h. ICP-AES after gel filtration and/or ultrafiltration reported 4.03 +/- 0.10 mol Hf and 1.39 +/- 0.04 mol phosphorus per mol protein. Methods describes averages of three determinations on each sample, not three independent cultures. The crystallization preparation separately states four molar equivalents of Na2[Hf(NTA)2].2H2O under similar buffer, temperature and time conditions, followed by ultrafiltration in 0.1 M KCl; 50 or 100 equivalents reportedly gave similar results. Hanging-drop crystals were grown at 290 K with PEG 4000, KCl and imidazole/malate buffer pH 7.7.
    The paper does not identify the N. gonorrhoeae donor strain; E. coli is the expression host and does not demonstrate whole-cell hafnium handling in this experiment.
