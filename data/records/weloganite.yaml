mechanisms:
- id: abiotic_multistage_thermal_decomposition
  name: Laboratory multi-stage thermal dehydration and decarbonation of natural weloganite
    to SrCO3 and SrZrO3
  process: other
  description: 'Heating natural Francon quarry weloganite in air up to 1400 degrees C (tracked
    by DTA, TGA, and room-temperature X-ray powder diffraction of quenched products at 350,
    500, 650, 740, 860, 1000, and 1400 degrees C) decomposed the mineral through three principal
    endothermic stages: (1) a sharp endotherm at 378 degrees C (300-440 degrees C, 17.05 wt%
    gravimetric loss) expelling H2O and part of the CO2 to form crystalline SrCO3 plus an
    amorphous, dilute-HCl-soluble Zr-bearing phase; (2) a second endotherm at 535 degrees
    C (440-650 degrees C, additional 2.26 wt% loss) crystallizing a cubic Zr-betafite-like
    oxide phase alongside SrCO3 at 650-740 degrees C; and (3) a third endotherm at 760 degrees
    C accompanied by solid-state reaction of the Zr-oxide intermediate with SrCO3 to form
    crystalline perovskite-type SrZrO3 plus residual SrCO3 at 860-1400 degrees C (with an
    additional 19.65 wt% mass loss between 650 and 1000 degrees C, totaling 38.96 wt%).'
  context: Thermal decomposition experiments in Sabina et al. (1968), pp. 473-475, Figure
    4, and Tables 3-4, combined DTA at 12 degrees C/min up to 1000 degrees C, isothermal and
    dynamic TGA intervals (300-440, 440-650, and 650-1000 degrees C), dilute HCl leaching
    tests of the heated products, and X-ray powder diffraction + X-ray spectrographic analyses
    of residues quenched from 350, 500, 650, 740, 860, 1000, and 1400 degrees C.
  microbial: false
  evidence:
  - source_ref: sabina_1968_weloganite
    supports: support
    explanation: Pages 473-475, Figure 4, and Tables 3-4 document the three endotherms (378,
      535, and 760 degrees C), the gravimetric losses of 17.05 wt% (300-440 degrees C), 2.26
      wt% (440-650 degrees C), and 19.65 wt% (650-1000 degrees C; total 38.96 wt%), and the
      XRD phase progression from SrCO3 + HCl-soluble amorphous Zr phase (350-500 degrees C)
      to SrCO3 + cubic Zr-betafite-like oxide (650-740 degrees C) to SrZrO3 + SrCO3 (860-1400
      degrees C).
  - source_ref: grice_1975_weloganite
    supports: support
    explanation: Table 1 (p. 210) establishes that natural weloganite contains 7.75 wt% Na2O,
      30.70 wt% CO2, and 7.65 wt% H2O+ (combined H2O + CO2 = 38.35 wt%, closely matching the
      38.96 wt% total TGA loss), so the heated solid residues in Sabina et al. (1968) also
      retained sodium alongside Sr and Zr.
