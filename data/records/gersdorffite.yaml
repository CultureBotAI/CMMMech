id: cmmmech:gersdorffite
name: Gersdorffite
material_kind: mineral
description: >-
  Gersdorffite is the nickel sulfarsenide mineral species with ideal formula
  NiAsS and cubic space group P2₁3. The September 2026 IMA-CNMNC list records
  it as renamed in 2022. CNMNC Newsletter 69 explicitly renamed
  gersdorffite-P2₁3 as gersdorffite, gersdorffite-Pa3 as paragersdorffite,
  and gersdorffite-Pca2₁ as orthogersdorffite; these other polymorphs are
  distinct species, not aliases of this record. Mauro and colleagues
  (2021, Section 3.1.1, Tables 1 and 3-5, Figures 2-4, and the original CIF)
  characterized natural zoned crystals from Contrada Zillì, Sicily, by
  electron-microprobe analysis and powder and single-crystal diffraction.
  The studied crystal has P2₁3 symmetry and a = 5.6968(7) Å. The specimen
  contains other minerals, and the gersdorffite grains show Fe/Co
  substitution and Sb/Bi-bearing zoning; this is not a pure bulk NiAsS
  feed. The proposed low-temperature, multistage geological origin is an
  interpretation of crystal chemistry and textures, not an experimentally
  demonstrated formation mechanism.
  Jaatinen's 2011 thesis supplies contextual mixed-concentrate leaching
  evidence under the older name: its GFC feed mineralogy, inherited from
  Wakeman et al. (2011), reports 30.6% gersdorffite but does not resolve the
  polymorph required by the current nomenclature. The GFC flask assays
  showed low culture activity and no consistent biological enhancement
  over their chemical controls. Dissolved metals from this mixed feed
  cannot establish dissolution of today's gersdorffite species or a
  recovered-product yield. A species-specific microbial mechanism and
  criticality designation are therefore unrecorded.
