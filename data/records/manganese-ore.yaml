id: cmmmech:manganese-ore
name: Manganese ore
material_kind: primary_resource
description: Manganese ore here denotes natural manganese-bearing geological feed, including the mixed
  ore excavated from an abandoned Michigan mine in the curated study. It is a primary resource, distinct
  from the pyrolusite mineral species, elemental manganese, electrolytic manganese products and processing
  residues. The source calls its sample pyrolusite ore, but reports several manganese minerals. This
  record does not define a traded product grade or inherit constituent criticality.
mechanisms:
- id: iron_assisted_two_stage_manganese_leaching
  name: Manganese-ore leaching with biologically mobilized iron
  process: bioleaching
  microbial: true
  description: A mixed-culture iron-leaching stage generated Fe(II)-bearing liquor used to mobilize
    manganese from a separate mixed-ore bed. Laboratory results support manganese release in this biologically
    supplied reductant system. The authors report carbonate suppression relative to prior single-stage
    work, but conflicting figure annotations leave that comparison unresolved. The study does not establish
    a sterile chemical second stage, zero carbonate formation, or commercial recovery performance.
  context: 'Living mixed metal-reducing cultures originated from a fen in Houghton County, Michigan,
    and previously adapted cultures inoculated the iron stage. No individual strain or causal community
    member is resolved here. Fermented Typha latifolia biomass plus 5 g/L sucrose supplied organic nutrient
    liquid. Methods 2.4 and Figure 5 describe two 250 mL Buechner flasks in series: the drawing labels
    200 g iron feed and 350 g manganese ore. Methods 2.1 identifies the iron feed as tailings from an
    unnamed iron-ore production facility, smaller than 0.15 mm; the manganese ore came from an abandoned
    Keweenaw County mine and was crushed below 3 mm. After seven days of adaptation, 300 mL fresh nutrient
    per week was supplied in five 60 mL increments. Packed beds, fermentation locks and a submerged
    manganese-flask outlet were used to maintain anaerobic conditions. Experiments were run in triplicate.
    A numerical flask incubation temperature is not specified in these methods; Section 3.6 discusses
    ambient-temperature operation. Reported operating pH was 4.7 +/- 0.7 in the iron stage and 4.4 +/-
    0.8 in the manganese stage. Overflow Mn was measured by colorimetric periodate oxidation and Fe(II)
    by 1,10-phenanthroline spectrophotometry; filtration and operational dissolved-fraction details
    are not supplied. These assays do not resolve the mineral phase contributing each metal.'
  evidence:
  - source_ref: borkar2026
    supports: support
    explanation: Methods 2.1 and Table 1 report ore XRD proportions of 31.1 wt% pyrolusite, 26.5% macfallite,
      22.9% braunite and 19.5% manganite. Table 2 reports 53 wt% Mn calculated from those XRD results,
      not an independently assayed ore grade. No mineral-specific release fraction is measured.
  - source_ref: borkar2026
    supports: support
    explanation: Section 3.2 and Figures 8–10 report 5.92 g cumulative Mn over 123 days and a maximum
      overflow Mn concentration of 1792 mg/L in the two-stage flask experiment. Maximum concentration,
      cumulative mobilized mass and recovered-product yield are different quantities; no new yield is
      calculated here.
  - source_ref: borkar2026
    supports: partial
    explanation: Sections 3.1–3.3 compare the two-stage experiment with single-stage biotic and abiotic
      experiments from earlier studies, references 7 and 13. They are historical comparisons, not matched
      contemporaneous two-stage controls. The paper does not provide a sterile two-stage or matched
      chemical-Fe(II) comparator that isolates microbial necessity or the relative acid and iron contributions.
      Section 3.6 explicitly allows microbial carryover into the manganese stage and states that dominant
      organisms and relative activities were not assessed. Thus the second stage is not established
      as cell-free, and no taxon-specific or mineral-specific causal claim is made.
  - source_ref: borkar2026
    supports: partial
    explanation: Section 3.3 states that two-stage residue lacks manganese-carbonate peaks, in contrast
      with prior single-stage work. Figure 11, however, places black rhodochrosite-labelled markers
      above both traces, including approximately 24.2 and 31.4 degrees in the upper two-stage trace.
      The text and figure annotations therefore conflict. This record does not decide whether those
      markers indicate confirmed carbonate detection or misplaced annotations; raw diffraction data
      or an author clarification would be needed. Without a reported detection limit or carbon balance,
      neither complete carbonate absence nor cessation of microbial CO2 production is established. Iron-mediated
      reduction and carbonate suppression remain incompletely isolated explanations.
  - source_ref: borkar2026
    supports: partial
    explanation: Methods 2.5 and Table 6 describe 19 L fermentation, iron and manganese units, with
      20 kg ore charges in the leaching tanks, flow of 5 L/day and downstream 12 L oxidation/settling
      tanks. Figure 12 labels Mn at 767 mg/L leaving manganese leaching and 98 mg/L after the iron stage
      of the recirculating flow; 98 mg/L is not the immediate oxidation-tank effluent, which is labelled
      152 mg/L. The text's calculated 3.35 g/day available for precipitation is therefore not accepted
      as a directly weighed daily recovery or a closed full-process mass balance.
  - source_ref: borkar2026
    supports: support
    explanation: Section 3.5 describes downstream solids dried at 100 degrees C for 24 hours, washed
      and roasted at 750 degrees C in an oxidizing atmosphere. Figure 13 assigns the main roasted phase
      to Mn3O4. Table 7 reports 93 wt% Mn3O4 on an oxide-equivalent basis converted from acid-digest
      ICP elemental analysis, as its footnote specifies. It is not a direct quantitative XRD phase-purity
      measurement, battery qualification, or electrolytic MnO2 product. Absence of carbonate peaks after
      roasting does not establish absence before heating.
  - source_ref: borkar2026
    supports: partial
    explanation: Section 3.6 explicitly identifies the downstream processing as laboratory-scale characterization,
      with optimization, scale-up, economics and long-term industrial stability left for future work.
      The 19 L apparatus is bench-scale despite the pilot terminology. This and the iron-ore-tailings
      record represent the same linked experiment.
