id: cmmmech:inderborite
name: Inderborite
material_kind: mineral
description: >-
  Inderborite is the CaMg[B3O3(OH)5]2(H2O)4·2H2O mineral species in the
  September 2026 IMA-CNMNC list, with grandfathered status G and
  original-description year 1941, not a sequential approval identifier.
  It is distinct from inderite, hydroboracite, elemental boron and the
  borates commodity. Gatta et al.'s natural crystals from Quarry 98,
  Inder Deposit, Kazakhstan, have a monoclinic C2/c structure: borate
  rings connect Ca and Mg polyhedra into sheets, with hydrogen bonds
  linking the sheets. Their openly deposited Revision_1 manuscript
  reports EPMA-WDS on three crystals, including quartz micro-inclusions
  and modest beam damage; near-ideal Ca and Mg composition is a
  specimen-level observation, not a universal purity or ore-grade claim.
  Inderborite-II below is an experimental high-pressure label, not an
  asserted independently approved natural species. No criticality or
  microbial activity is inherited from boron or associated minerals.
