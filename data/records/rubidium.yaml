id: cmmmech:rubidium
name: Rubidium
material_kind: element
description: Rubidium (Rb), represented as an element distinct from its ions, compounds, isotopes, host minerals, alloys and commodity streams. The US 2025 designation names the rubidium commodity and does not designate every compound or host material. A laboratory experiment tracked light-dependent uptake of rubidium-86 ions by intact phototrophic bacteria as a probe of potassium transport. This does not establish rubidium recovery from ore, brine or waste.
