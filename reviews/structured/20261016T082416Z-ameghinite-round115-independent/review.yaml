summary: 'Ameghinite passes with limitations: current identity, structural characterization
  and the bounded 1967 abiotic heating observations are supported. No corrective owner
  defect found.'
limitations:
- Thermal sample mass, replication and quantitative aliquot purity are not reported;
  product assignments and historical melting comparisons remain unresolved.
- The 2012 spectroscopy source and its missing XRD supplement were not independently
  reassessed for new admitted claims.
- The 2017 study was assessed for the distinct-phase boundary, not for validating
  every thermodynamic calculation or importing its measurements.
- Original diffraction deposit inspection was limited to identity/header/representative
  rows or summary, without re-refinement.
- Searches were bounded and do not establish exhaustive literature absence.
- Working-tree scientific acceptance is separate from final canonical review checking
  and committed/hosted publication gates.
