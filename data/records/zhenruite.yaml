id: cmmmech:zhenruite
name: Zhenruite
material_kind: mineral
description: >-
  IMA-approved hydrous molybdenum trioxide ("molybdic acid" hemihydrate) mineral (IMA
  2022-050; status A, Approved 2022; full description published January 2026; no mineral
  symbol is printed in the September 2026 IMA Master List, PDF p. 240, or in the primary
  type description) with ideal end-member formula (MoO3)2(H2O) in the September 2026 IMA
  Master List (PDF p. 240) and (MoO3)2*H2O (equivalently MoO3*1/2H2O, requiring MoO3 94.11
  wt%, H2O 5.89 wt%, total 100.00 wt%) in Gu, Yang, Gibbs, and Liu (2026, European Journal
  of Mineralogy 38:39-52). Co-described with tianhuixinite ((MoO3)3*H2O, IMA 2022-081) and
  named in honour of the late Chinese mineralogist Prof. Zhenru Zhang (1930-2002) at Central
  South University, Changsha, Hunan Province, China, who graduated from the Department of
  Geology of Nanjing University in 1952, taught crystallography and mineralogy, ore geology,
  and modern analytical techniques at the Department of Geology, Central South University,
  and made important contributions to clay mineralogy in ceramics and ore mineralogy in
  nonferrous metals and gold deposits with over 44 articles and 3 books (Section 1, p. 40).
  Found on specimens (Figure 1, p. 40) collected from the Freedom #2 mine in the Central
  Mining Area (latitude 38 deg 29 min 43 sec N, longitude 112 deg 12 min 55 sec W), ~5.6 km
  north-northeast of the town of Marysvale in the central part of the Marysvale volcanic
  field, Utah, USA (weathered product of primary molybdenum ores in an epithermal U-Mo vein
  system hosted in a 23-18 Ma volcanic/hypabyssal complex of porphyritic quartz monzonite,
  fine-grained granite, and glassy alkali rhyolite; co-type locality for umohoite,
  liangjunite, wangpuite, downsite, vanpeltite, and fanguangite, associated with alunogen,
  anhydrite, coquimbite, fluorite, liangjunite, quartz, and raydemarkite; Abstract, p. 39,
  and Section 2.1, pp. 40-41); parts of the cotype samples are deposited at the University of
  Arizona Alfie Norville Gem and Mineral Museum, Tucson, Arizona, USA (catalogue no. 22720),
  and the RRUFF Project (deposition no. R220010) (Section 1, p. 40, and Figure 1 caption, p.
  40). Occurs as acicular or prismatic crystals up to 60 x 10 x 10 um elongated along [010]
  (Figures 1 and 3, pp. 40-42; single-crystal X-ray diffraction data were collected from a
  25 x 6 x 6 um crystal, Section 2.4, p. 43); crystals are colourless in transmitted light
  and transparent, are insoluble in water or hydrochloric acid at room temperature, and have
  a white streak, vitreous lustre, brittle tenacity, Mohs hardness 1.5-2, perfect cleavage on
  {001}, no observed twinning, Gladstone-Dale calculated average refractive index n_calc =
  1.990 (optical properties could not be measured directly because the refractive indices
  exceed those of available immersion liquids), and calculated density Dcalc = 4.081 g cm-3
  based on the empirical formula and single-crystal X-ray diffraction unit-cell volume V =
  248.89(2) A3 with Z = 2 (Abstract, p. 39; Section 2.2, pp. 41-42; and Table 3, p. 47;
  density could not be measured directly owing to small crystal size and limited sample).
  Wavelength-dispersive electron-microprobe analyses (Shimadzu EPMA-1720 at 15 kV, 10 nA,
  2 um beam diameter, pure Mo metal standard, n = 7 spot analyses; Section 2.2, pp. 41-42,
  and Table 1, p. 41) yielded mean MoO3 93.24 wt% (SD 1.81 wt%), with ideal H2O* = 5.89 wt%
  added, giving a total of 99.13 wt% and an empirical formula of (Mo1.00O3)2*H2O on the
  basis of 7 O atoms per formula unit. Micro-Raman spectroscopy (Horiba ARAMIS micro-Raman
  system, 532 nm solid-state laser, thermoelectrically cooled CCD detector, 2 cm-1
  resolution, 1 um spot size; Section 2.3, p. 42, and Figure 6, p. 44) showed a band at 3460
  cm-1 assigned to O-H stretching vibrations in H2O, bands at 907, 925, 980, and 984 cm-1
  attributed to Mo-O stretching vibrations, bands between 280 and 700 cm-1 ascribable to
  Mo-O-Mo and O-Mo-O bending vibrations, and bands below 280 cm-1 associated with rotational
  and translational modes of MoO6 octahedra and H2O groups as well as lattice vibrational
  modes. Crystallizes in the monoclinic system, space group P21/m (#11), as the natural
  counterpart of synthetic monoclinic P21/m (MoO3)2*H2O ("alpha-MoO3*1/2H2O" of Fellows et
  al., 1983, and Benard et al., 1994), with single-crystal X-ray diffraction unit-cell
  parameters (Rigaku XtaLAB Synergy D/S four-circle diffractometer, CuKalpha radiation,
  lambda = 1.54184 A, at room temperature on a 25 x 6 x 6 um crystal; Section 2.4, p. 43,
  and Table 3, p. 47) a = 9.6790(6) A, b = 3.70653(19) A, c = 7.1029(4) A, beta = 102.391(5)
  deg, V = 248.89(2) A3, Z = 2, and axial ratio a:b:c = 2.6113:1:1.9163 (powder X-ray
  diffraction on the Rigaku XtaLAB Synergy D/S four-circle diffractometer with CuKalpha
  radiation, lambda = 1.54184 A, in Gandolfi mode at 50 kV and 1 mA, refined using Holland
  and Redfern, 1997, gave unit-cell parameters a = 9.6760(5) A, b = 3.708(18) A, c =
  7.101(2) A, beta = 102.372(1) deg, and V = 248.92(5) A3; Section 2.4, p. 43; note that
  Table 3 on p. 47 prints Z = 2 for natural zhenruite alongside Z = 4 for synthetic
  (MoO3)2*H2O from Benard et al., 1994, where V = 248.4 A3 and Z = 4 correspond to the
  hemihydrate formula unit MoO3*1/2H2O rather than (MoO3)2*H2O). The crystal structure was
  solved and refined using SHELX2019 (Section 2.4, pp. 43-44) to R1 = 0.032 and wR2 = 0.091
  for 582 observed reflections with I > 2sigma(I) (out of 609 independent and 5069 collected
  reflections, Rint = 0.054, GooF = 1.073 for 55 parameters; Table 3, p. 47). The asymmetric
  unit (Table 4, p. 47, Table 6, p. 48, and Table 7a, p. 50) contains two independent Mo6+
  cations at 2e special positions with y = 1/4, Mo1 (BVS = 5.98 v.u. in Table 7a, p. 50) and
  Mo2 (BVS = 5.84 v.u. in Table 7a, p. 50), and seven O sites (O1-O7 at 2e; O1 is the
  coordinated H2O oxygen with BVS = 0.36 v.u., and hydrogen-bond-corrected oxygen BVS sums
  are O2 = 2.07, O3 = 2.14, O4 = 1.95, O5 = 2.08, O6 = 1.95, and O7 = 1.94 v.u.), forming two
  topologically identical double chains of edge-sharing octahedra along [010] with Mo-O bond
  distances varying from 1.684 to 2.428 A (Section 3.1, p. 47, and Table 6, p. 48): a type-A
  chain of Mo1O6 octahedra (Mo1-O4 = 1.688(6) A, Mo1-O2 = 1.696(7) A, Mo1-O3 x 2 =
  1.9590(14) A, Mo1-O3 = 2.240(5) A, Mo1-O6 = 2.428(6) A; mean <Mo1-O> = 1.995 A) and a
  type-B chain of Mo2O5(H2O) octahedra (Mo2-O7 = 1.684(7) A, Mo2-O6 = 1.736(6) A, Mo2-O5 x 2
  = 1.9569(18) A, Mo2-O1 = 2.276(6) A, Mo2-O5 = 2.318(6) A; mean <Mo2-O> = 1.988 A) that
  alternate via shared O6 corners to build corrugated layers parallel to (001) linked along
  [001] by interlayer hydrogen bonds from O1 (O1...O2 = 2.920 A x 2, O1...O4 = 2.936 A,
  O1...O6 = 3.160 A, O1...O7 = 3.050 A), topologically identical in layer geometry to
  anhydrous molybdite (MoO3) and raydemarkite (MoO3*H2O) (Sections 3.1 and 3.3, pp. 47-51).
  The seven strongest powder X-ray diffraction lines [dmeas in A (Imeas, Ical) (hkl);
  Abstract, p. 39, and Table 2, p. 46] are 6.932 (68.0, 72.6) (001), 4.729 (47.2, 75.3)
  (200), 3.565 (24.0, 35.7) (201), 3.183 (100.0, 100.0) (11-1), 3.139 (43.2, 33.4) (20-2),
  3.003 (31.2, 35.3) (111), and 2.281 (20.0, 20.2) (20-3). No biological or microbial
  interaction data are reported in the type mineralogical description.
