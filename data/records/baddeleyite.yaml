      baddeleyite (ZrO2) in basaltic maar near Hajnáčka (southern Slovakia).
      Mineralia Slovaca 43, 255-262. Complete eight-page original inspected,
      including Figures 1-5 and Tables 1-2; methods pages 257-258, detection
      limits page 258, Table 2 page 259 and English summary page 262.
      Table 2 oxide labels govern interpretation of the text's abbreviated
      element names; the text and table differ on the lower TiO2 value.
    url: https://www.geology.sk/wp-content/uploads/2019/10/MS_3_2011_04_Huraiova-et-al.pdf
    accessed_on: '2026-10-12'
