limitations:
- The source uses parallel acid contacts on separate portions; mass-loss endpoints
  cannot be interpreted as sequential or elemental recovery. No complete dissolved-element/product/residue
  mass balance, isolated pure-metal yield or residual-carbon correction is supplied.
- Industrial source of feed does not establish industrial deployment. No microbial
  culture or biologically produced acid is involved in the accepted experiment; no
  criticality designation is inherited.
- No matched water-only leach or acid/reagent-only flocculation blank is reported
  alongside the accepted endpoints. Proposed kinetic/adsorption/bridging mechanisms
  are not uniquely proved by fits, microscopy or zeta potential.
- Source Figure3B versus text, Figure8 versus Table5, zeta-direction text and cow-pasture/aquaculture
  terminology remain unresolved under source issue311. No unsupported reconciliation
  or omitted negative outcome was introduced.
- No separate SI document was announced in the inspected main/JATS or found in the
  acquired30-asset archive. This bounded check is not proof that additional data cannot
  exist.
- Notice and literature searches were bounded. Deferred microbial-carbonation studies
  were not acquired/assessed as experiments and are not imported.
