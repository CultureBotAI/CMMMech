id: cmmmech:petersenite-ce
name: Petersenite-(Ce)
material_kind: mineral
description: Anhydrous sodium-cerium carbonate mineral of the burbankite group with current
  September 2026 IMA-CNMNC approved formula Na4Ce2(CO3)5, status A, and approval number IMA
  1992-048. Grice, Van Velthuizen, and Gault (1994) described the cotype specimen (CMN 81511)
  from pegmatite dikes and Hornfels-hosted alkaline segregations at the Poudrette quarry,
  Mont Saint-Hilaire, Rouville County, Quebec, Canada. Electron-microprobe WDS analysis (mean
  of 3 analyses on 3 grains, Table 1, p. 407) with CO2 calculated by stoichiometry yielded
  Na2O 17.38, CaO 1.32, BaO 0.32, SrO 1.70, La2O3 14.49, Ce2O3 23.66, Pr2O3 2.00, Nd2O3 5.82,
  Sm2O3 0.60, CO2 32.92 (calc), total 100.21 wt%, corresponding on the basis of 15 O atoms
  to the empirical formula (Na3.75Ca0.16)Sigma3.91(Ce0.96La0.59Nd0.23Sr0.11Pr0.08Sm0.02Ba0.01)Sigma2.00(CO3)5.
  Single-crystal X-ray diffraction refined in monoclinic space group P21 (a = 20.872(4), b
  = 6.367(1), c = 10.601(2) A, beta = 120.50(1) degrees, V = 1213.9(4) A3, Z = 4, R = 3.5%,
  Rw = 3.0% for 3506 observed reflections with F > 4sigma(F) out of 3655 unique reflections;
  Gandolfi powder XRD cell a = 20.84(2), b = 6.351(5), c = 10.580(9) A, beta = 120.43(4) degrees)
  established a monoclinic burbankite-group superstructure retaining the 2:1 ratio of [8]-coordinated
  (Na1-Na8) to [10]-coordinated (Ce1-Ce4) cation polyhedra linked by planar carbonate triangles,
  with lowering of symmetry from hexagonal P63mc driven by Na+/REE3+ cation ordering. The
  mineral effervesces rapidly in dilute HCl. Distinct from remondite-(Ce), burbankite, khanneshite,
  and elemental cerium; no criticality designation, microbial mechanism, or industrial recovery
  yield is asserted.
