id: cmmmech:electrical-steel
name: Electrical steel
material_kind: commodity
description: Specialty iron-silicon alloy steel commodity engineered for magnetic core applications, including grain-oriented electrical steel, non-grain-oriented electrical steel, and amorphous steel within the scope of the 2023 US Department of Energy Critical Materials Assessment and Final 2023 Critical Materials List (88 FR 51792-51798). The DOE Notice defines electrical steel as essential to clean energy transformers and electric-motor technologies and designates it as a critical material for energy under Section 7002(a) of the Energy Act of 2020. USGS Mineral Commodity Summaries 2026 tracks grain-oriented electrical steel as a distinct defense-stockpile material line item within the Iron and Steel chapter (printed p. 100, PDF p. 104) and documents ferrosilicon consumption by the steel industry in the Silicon chapter (printed p. 170, PDF p. 174). This record represents the manufactured alloy commodity rather than elemental iron (cmmmech:iron), elemental silicon (cmmmech:silicon), a
  natural mineral species, or undifferentiated carbon and structural steels. No ChEBI or IMA identifier applies to this multi-grade engineered steel family, and no microbial extraction, processing, or recovery mechanism is asserted.
