id: cmmmech:pilanesbergite
name: Pilanesbergite
material_kind: mineral
ima_symbol: Pbg
description: >-
  IMA-approved sodium-calcium-iron-titanium oxy-fluor-disilicate mineral of the wohlerite group
  (IMA 2023-007; symbol Pbg in the September 2026 IMA Master List, PDF p. 173, and Pbt in
  Figure 2 of the type description; status A, Approved 2023; full description published
  January 2024) with ideal end-member formula Na2Ca2Fe2Ti2(Si2O7)2O2F2 (written
  Na2Ca2Fe2+2Ti2(Si2O7)2O2F2 in the IMA Master List; requiring SiO2 32.68 wt%, CaO 15.25 wt%,
  FeO 19.53 wt%, TiO2 21.72 wt%, Na2O 8.42 wt%, F 5.17 wt%, O=F -2.18 wt%, total 100.59 wt%
  before rounding of individual oxide components to 100.00 wt%; Dal Bo et al., 2024, European
  Journal of Mineralogy 36:73-85). Represents the Fe2+- and Ti4+-dominant member of the
  wohlerite group (isomorphic with lavenite Na2Ca2Mn2Zr2(Si2O7)2O2F2, normandite
  Na2Ca2Mn2Ti2(Si2O7)2O2F2, and madeiraite Na2Ca2Fe2Zr2(Si2O7)2O2F2 via the homovalent
  substitutions Mn2+ <-> Fe2+ on X3 and Zr4+ <-> Ti4+ on X1), and is named after its type
  locality in the ~1300 Ma Pilanesberg Alkaline Complex, North West Province, South Africa.
  Discovered in a river gulley near the southern margin of the Pilanesberg Complex (25.3463 deg S,
  27.0658 deg E; sample MEPB62), where it occurs as a rock-forming mineral (~2 vol%, norms
  sum to 16.95 wt% mafic minerals) in meso-agpaitic green foyaite (nepheline syenite) together
  with microcline, nepheline, sodalite, albite, aegirine, arfvedsonite, and accessory
  manganoan pectolite, titanite, fluorite, aenigmatite, rinkite, fluorapatite, lorenzenite,
  lamprophyllite, and astrophyllite; cotype specimens are deposited at the Natural History
  Museum, University of Oslo, Norway (catalogue number KNR 44406; thin section used for EPMA,
  SCXRD, and petrography) and the Laboratoire de Mineralogie, University of Liege, Belgium
  (catalogue number 21980; mineral separate used for PXRD, optical, and density measurements).
  Forms long prismatic to acicular pale brown to orange-brown crystals up to ~1 mm in length
  (clustered in sub-solidus radial aggregates replacing magmatic titanite or aenigmatite) with
  a pale yellow streak, vitreous lustre, transparent diaphaneity, brittle tenacity, uneven
  fracture, no observed cleavage, estimated Mohs hardness 5-6 (by comparison with lavenite),
  and measured density 3.43(5) g/cm3 (Berman balance in toluene at 25 degC) vs calculated
  density Dcalc = 3.49 g/cm3 from the empirical formula and single-crystal unit cell. Optically
  biaxial negative with alpha = 1.740(5), beta = 1.795(5), gamma = 1.810(5) (measured in white
  light), 2Vmeas = 56(5) deg, 2Vcalc = 54 deg, strong dispersion r > v, optical orientation X ^ a
  = 22 deg and Z = b, and pleochroism from pale yellow to orange; Gladstone-Dale compatibility
  index 1 - (Kp/Kc) = -0.025 (excellent). Wavelength-dispersive electron microprobe analysis
  (n = 15 points on 7 grains, CAMECA SX100, 15 kV, 15 nA, 10 um beam; Table 1) yielded SiO2
  32.28 wt% (range 31.88-32.62, 2sigma SD 0.37), TiO2 18.33 wt% (17.63-19.12, SD 0.94), CaO
  16.87 wt% (16.27-17.64, SD 0.79), FeO 9.70 wt% (8.54-10.26, SD 0.98), Na2O 9.43 wt%
  (9.23-9.60, SD 0.20), F 5.54 wt% (5.42-5.63, SD 0.11), MnO 4.96 wt% (4.62-5.52, SD 0.52),
  ZrO2 2.95 wt% (2.19-4.16, SD 1.10), Nb2O5 1.36 wt% (1.06-1.76, SD 0.39), MgO 0.49 wt%
  (0.39-0.63, SD 0.14), SrO 0.18 wt% (0.11-0.22, SD 0.06), Al2O3 0.03 wt% (0.01-0.04, SD
  0.02), Ce2O3 0.02 wt% (0.00-0.08, SD 0.05), and K2O 0.01 wt% (0.00-0.02, SD 0.01), with
  Table 1 printing Total = 102.13 wt%, O=F = 2.33 wt%, and net Total = 99.80 wt% whereas the
  exact arithmetic sum of the 14 printed mean constituents is 102.15 wt% and 99.82 wt% after
  -O=F (a 0.02 wt% rounding difference). Normalized to 18 (O + F) anions per formula unit, the
  empirical formula is Na2.00(Ca1.74Na0.26)Sigma2.00(Fe1.00Mn0.52Ca0.49Zr0.05)Sigma2.06(Ti1.69Zr0.14Mg0.09Nb0.08)Sigma2.00(Si2O7)2.00O1.84F2.16.
  Crystallizes in the monoclinic system, non-standard wohlerite-group space group P21/a (#14),
  with single-crystal X-ray diffraction unit-cell parameters a = 10.7811(2) A, b = 9.7836(1) A,
  c = 7.0348(1) A, beta = 108.072(2) deg, V = 705.41(2) A3, and Z = 2 (refined to R1 = 0.0206,
  wR = 0.0250 for 3214 observed reflections with I > 3sigma(I) and R2 = 0.0767, wR2 = 0.0798,
  GoF = 1.04/1.08 for all 3692 unique reflections from 34,780 measured at 293 K on a 0.065 x
  0.043 x 0.025 mm orange blocky crystal using MoKalpha radiation, Table 3; powder unit cell
  from 43 reflections on a Rigaku SmartLab diffractometer with CuKalpha1 radiation is
  a = 10.749(4) A, b = 9.756(3) A, c = 7.001(2) A, beta = 108.05(2) deg, V = 698.0(3) A3). The
  refined structural formula (Tables 4-7) is X4(Na)2X2(Ca0.85Na0.15)2X3(Fe0.48Mn0.25Ca0.25Zr0.02)2X1(Ti0.85Zr0.07Nb0.04Mg0.04)2(Si2O7)2(F2.16O1.84)
  (note that Section 6.1 on p. 77 mislabels site W1 as "W1 (O4)" whereas Tables 4 and 7
  correctly identify it as O8 (W1), and Table 4 on p. 80 misprints Ueq for X3 (Fe) as
  "0.349(4)" A2 instead of ~0.0135 A2). The six strongest observed powder X-ray diffraction
  lines (dmeas in A (Imeas; hkl), Table 2) are 2.851 (100; 1 2 -2), 3.219 (60; 3 1 0), 2.802
  (51; 3 2 0), 2.743 (27; 2 2 -2 / 2 3 0), 2.423 (19; 4 0 -2) and 1.723 (19; 4 4 -2), and
  2.366 (18; 3 2 1). No biological or microbial interaction data are reported in the type
  mineralogical description.
