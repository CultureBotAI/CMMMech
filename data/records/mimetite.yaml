id: cmmmech:mimetite
name: Mimetite
material_kind: mineral
description: Mimetite is the Pb5(AsO4)3Cl mineral species, grandfathered in the September 2026 IMA list with original-description year 1832. It is distinct from elemental lead or arsenic, dissolved arsenate, the phosphate mineral pyromorphite and an unspecified lead-bearing ore. The curated experiment used a characterized but impure natural mimetite specimen. No constituent-element criticality is inherited.
