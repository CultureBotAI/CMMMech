id: cmmmech:titanowodginite
name: Titanowodginite
material_kind: mineral
description: >-
  Titanowodginite (IMA 1984-008) is an IMA-accepted manganese-titanium-tantalum
  oxide mineral of the wodginite group, the B-site Ti-dominant analogue of
  wodginite, with IMA September 2026 Master List formula Mn2+TiTa2O8 and
  empirical formula
  (Mn3.01Fe2+0.96[]0.03)Sigma4.00(Ti2.46Sn1.27Ta0.22Fe3+0.05)Sigma4.00(Ta6.69Nb1.31)Sigma8.00O32
  (for Z = 4). Described by Ercit, Černý, and Hawthorne (1992) from the Tanco
  rare-element granitic pegmatite, Bernic Lake, southeastern Manitoba, Canada
  (holotype M5636 at the Manitoba Museum of Man and Nature; paratype MM-266 at
  the University of Manitoba), where it occurs as dark brown to black bipyramidal
  crystals up to 1 cm with microlite, manganotantalite, and simpsonite.
  Monoclinic (space group C2/c), with a = 9.466(2) Å, b = 11.431(1) Å, c =
  5.126(1) Å, beta = 90.31(2)°, V = 554.6(1) Å3, Z = 4, Dmeas = 6.86(3) g/cm3,
  Dcalc = 6.89 g/cm3, Mohs hardness 5.5, and biaxial (+) optics with n > 2.0.
