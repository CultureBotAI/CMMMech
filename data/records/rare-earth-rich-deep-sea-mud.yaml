id: cmmmech:rare-earth-rich-deep-sea-mud
name: Rare-earth-rich deep-sea mud
material_kind: primary_resource
description: Naturally occurring deep-ocean sediment enriched in rare-earth elements and yttrium, commonly
  termed REY-rich mud. This record denotes the heterogeneous geological sediment resource, including pelagic
  clay with REY-bearing biogenic calcium phosphate grains documented in western North Pacific samples.
  It is distinct from individual rare-earth elements, a purified rare-earth commodity, an isolated apatite
  mineral, phosphorite, ferromanganese nodules and rock-surface ferromanganese crusts. Host phases and
  composition vary among deposits; no single mineral formula or universal grade defines this resource.
  Collection or physical concentration alone does not make the natural feed a secondary resource. No constituent
  criticality designation is inherited. A field-proxy study provides qualified evidence for an inferred
  microbial contribution to natural diagenetic iron transformations and REY redistribution; it does not
  demonstrate a controlled microbial extraction process, a recovered-metal yield, economic reserves or
  industrial deployment.
sources:
