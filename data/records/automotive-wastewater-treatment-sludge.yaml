    functional_role: Membrane-bound sulfide-quinone reductase (sqr) in Acidithiobacillus thiooxidans ATCC 19377 oxidizing reduced sulfur species to zero-valent sulfur and polysulfide/polythionate intermediates during chemolithoautotrophic sulfur bioleaching.
    annotation_note: Grounded to reference-proteome entry UP000363590 for type strain Acidithiobacillus thiooxidans ATCC 19377 (NCBITaxon:637390), representing Acidithiobacillus thiooxidans DSM 11478 (strain Tth04, NCBITaxon:930) in Yagnentkovsky et al. (2009).
    evidence:
    - source_ref: yagnentkovsky_2009
      supports: partial
      explanation: Representative Acidithiobacillus thiooxidans ATCC 19377 sulfide-quinone reductase (sqr) for sulfur-pearl oxidation in iron-free 9K medium and laboratory column leaching of Ni and Zn from automotive wastewater-treatment sludge by Acidithiobacillus thiooxidans DSM 11478 (strain Tth04) in Yagnentkovsky et al. (2009); individual sqr/tth genes were not mutated or directly assayed.
