id: cmmmech:magnetite
name: Magnetite
material_kind: mineral
description: Magnetite is the Fe(II)Fe(III)2O4 mineral species, grandfathered in the September
  2026 IMA list with original-description year 1845. It is distinct from elemental iron, maghemite,
  ferrihydrite and a mixed magnetic precipitate. The experiment below forms a magnetite-rich,
  probably cation-deficient mixed product from synthetic ferrihydrite; it does not demonstrate
  pure ideal magnetite or recovery from natural magnetite ore. The Ax17 assay is also represented
  under iron and the paired ferrihydrite/magnetite record; these are substrate/product perspectives
  on one experiment, not independent replication. No iron criticality designation is inherited.
