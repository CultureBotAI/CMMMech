id: cmmmech:glushinskite
name: Glushinskite
material_kind: mineral
description: Glushinskite is the magnesium oxalate dihydrate mineral species, Mg(C2O4)(H2O)2, listed
  as redefined by the IMA in a 1987 special procedure in its September 2026 list. That date is not
  an approval-number identifier. It is distinct from elemental magnesium, magnesium oxalate without
  a specified hydration state, and the phosphate mineral feeds in the experiment. This record reuses
  the Suyamud 2020 experiment represented under magnesium and dittmarite; these are separate material
  identities, not independent experiments. No constituent-element criticality is inherited.
