id: cmmmech:municipal-sewage-sludge
name: Municipal sewage sludge
material_kind: secondary_resource
description: >-
  Unincinerated sludge generated by municipal wastewater treatment, represented here by
  partially dewatered sludge from Kuopio, Finland, and sludge from a municipal treatment
  plant in Tianjin, China. These heterogeneous processed residues contain organic matter,
  nutrients and metals; their precise upstream treatment histories and mineral hosts are
  not fully resolved. This secondary resource is distinct from sewage-sludge incineration
  ash, untreated wastewater, factory-specific treatment sludge and purified phosphorus or
  metal products. The selected specimens do not define every municipal sludge.
