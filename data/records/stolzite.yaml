id: cmmmech:stolzite
name: Stolzite
material_kind: mineral
description: >-
  Stolzite is the lead tungstate mineral species Pb(WO4), listed as
  grandfathered in the September 2026 IMA-CNMNC list. It is distinct
  from elemental tungsten, wulfenite and a mixed lead-tungsten ore.
  Kiseleva and colleagues (2008, pages 18-21 and Figures 3-4) describe
  natural Mo-bearing stolzite from the Bugdaya deposit, eastern
  Transbaikalia, Russia. Electron-microprobe composition was reported
  as Pb(W0.74Mo0.26)O4; this is a W-dominant solid-solution composition,
  not a pure PbWO4 analysis or a distinct species named chillagite.
  The grains occupy fractures and cavities in galena and occur with
  anglesite and covellite. Small grains prevented crystal-structure
  investigation, so the source's assignment is retained with that
  limitation. Its proposed supergene origin is an interpretation of
  mineral associations, not a demonstrated reaction pathway. The
  occurrence does not establish extractable reserves or recovery yield.
  Microbial mechanisms and criticality designations are unrecorded.
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC. The New IMA List of Minerals, September 2026;
      PDF page 1 field definitions and page 206 Stolzite row:
      Pb(WO4), G, 1845. The year of first description is not a unique
      IMA approval accession.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-14'
  - id: kiseleva2008
    title: >-
      Kiseleva GD, Kovalenker VA, Trubkin NV, Borisovsky SE and Mokhov AV
      (2008). Rare Minerals of In, Cd, Mo, and W in Gold-base Metal Veins
      of the Bugdaya Au-Mo(W)-porphyry Deposit, Eastern Transbaikalia,
      Russia. New Data on Minerals 43, 13-22. Stolzite arm on pages
      18-21; original Figures 3-4 on pages 19-20; composition and lack
      of crystal-structure investigation on page 20. The distinct
      dzhalindite arm is already represented elsewhere in CMMMech.
    url: https://fmm.ru/images/9/94/NDM_2008_43_Kiseleva_eng.pdf
    accessed_on: '2026-10-14'
