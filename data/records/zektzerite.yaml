id: cmmmech:zektzerite
name: Zektzerite
material_kind: mineral
description: >-
  Zektzerite (IMA 1976-034) is an IMA-accepted sodium-lithium-zirconium
  silicate mineral with IMA September
  2026 Master List formula NaLiZrSi6O15 and empirical formula
  Li1.00Na1.02(Zr0.94Ti0.05Hf0.01)Si6.06O15.15 (Table 1, p. 418 Zektzerite
  Analysis column: SiO2 68.24, ZrO2 21.84, TiO2 0.75, HfO2 0.5, Na2O 5.9, Li2O
  2.8, total 100.0 wt%, vs theoretical NaLiZrSi6O15 Li2O = 2.82 wt%, with H2O
  reported as absent by the Penfield method on a 300 mg sample). Described by
  Dunn et al. (1977) from miarolitic cavities in riebeckite granite of the
  Golden Horn batholith near Washington Pass (48°32'N, 120°35'W), Okanogan
  County, Washington, USA (holotype NMNH 136030), where it occurs as colorless
  to pink pseudohexagonal tabular crystals up to 35 mm associated with
  microcline, quartz, riebeckite, astrophyllite, and elpidite. Orthorhombic (space group Cmca or C2ca), with a = 14.306(5) Å,
  b = 17.330(4) Å, c = 10.140(3) Å, V = 2514.0(9) Å3, Z = 8, Dmeas = 2.79 g/cm3,
  Dcalc = 2.80 g/cm3, Mohs hardness ~6, perfect {100} and {010} cleavages, light
  yellow short-wave UV fluorescence, and biaxial (–) optics with alpha =
  1.582(3), beta = 1.584(3), gamma = 1.584(3), and 2V ~ 0°.
