mechanisms:
- id: fungal_aluminium_mobilization_red_mud
  name: Aspergillus-associated aluminium leaching from red mud
  process: bioleaching
  description: Growing fungal isolate G-10 mobilized aluminium from red mud while acidifying the medium and accumulating organic acids. Synthetic acid mixtures also leached aluminium, supporting a contribution from extracellular chemistry without demonstrating that live fungal contact is required or resolving a specific enzyme mechanism.
  context: G-10 was assigned to Aspergillus niger using morphology and a 612-bp ITS sequence with 99% similarity; the species identifier does not independently authenticate the strain. Red mud collected at the Ajka spill site in October 2010 was air-dried, disaggregated and sieved below 0.2 mm. The selected laboratory assay used 0.2 g red mud in 45 mL Sabouraud dextrose broth plus 5 mL suspension of approximately 10^6 spores/mL, in 250-mL flasks. Medium was autoclaved before inoculation; growing cultures were incubated statically in darkness at 25 degrees C for seven days, in triplicate. Aluminium was measured by ICP-OES in 0.45-micrometre filtrate; this is a filter-passing total-Al measurement, not a free Al3+ speciation assay. Table 1 reports 6.97% total Al in the dry feed. Its Al-host phases were unresolved by XRD, so no particular aluminium mineral is assigned to the experiment.
  microbial: true
  organisms:
  - id: NCBITaxon:5061
    label: Aspergillus niger
