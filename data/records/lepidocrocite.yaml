mechanisms:
- id: cn32_formate_lepidocrocite_transformation
  name: Formate-fed culture-associated lepidocrocite transformation to green-rust phases
  process: redox_transformation
  description: In the culture reported as Shewanella putrefaciens CN32, formate consumption accompanied Fe(II) accumulation and loss of detectable starting lepidocrocite with carbonate-green-rust formation. Chloride- and sulfate-amended cultures followed different phase trajectories. The evidence supports laboratory culture-associated reduction and secondary mineral formation; it does not demonstrate a uniquely biological pathway, fully reduced iron, a pure isolated recovery product, or industrial operation.
  context: The primary feed was commercial lepidocrocite, Bayferrox 943, supplied at 80 mM Fe(III). The focused formate experiments used triplicate 250 mL serum bottles containing 200 mL defined mineral medium, 75 mM formate, 100 micromolar AQDS electron shuttle, and either 25 mM NaCl or 25 mM Na2SO4. Medium was adjusted initially to pH 7.5 and autoclaved before filter-sterilized donor/AQDS addition, sealed and argon-sparged. Late-log inoculum gave a reported 5 x 10^9 cells/mL; cultures were rolled in the dark at 30 degrees C for 62 days. The named CN32 strain maps to NCBI 319224 and ATCC BAA-453, while the paper prints ATCC BAA-543, which the authority identifies as Cellulomonas sp. ES5. This accession conflict is unresolved; the taxon records the paper's repeated strain name, not a verified chain of custody. The paper delegates the full basal-medium and inoculum recipes to earlier studies and cites an akaganeite paper for lepidocrocite characterization; no exact inherited recipe, surface
    area or chemical purity is assumed. Contemporaneous Figure 6 starting patterns and phase standards support the substrate assignment. The separate donor survey includes both a no-donor culture and a sterile control. Figure 1 plots the sterile-control total Fe(II) curve near baseline, but does not specify its donor and salt identity. It therefore supplies a reported negative comparator without establishing a chemistry-matched cell-free counterpart for each focused formate/AQDS chloride and sulfate arm.
