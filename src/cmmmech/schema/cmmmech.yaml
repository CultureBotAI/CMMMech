id: https://github.com/CultureBotAI/CMMMech/schema
name: cmmmech
title: Critical minerals and microbial mechanisms
description: Evidence-backed materials, dated criticality designations, and recovery mechanisms.
license: BSD-3-Clause
prefixes:
  linkml: https://w3id.org/linkml/
  cmmmech: https://github.com/CultureBotAI/CMMMech/records/
default_prefix: cmmmech
default_range: string
imports:
  - linkml:types
  - mech_shared
  - history
types:
  NonEmptyText:
    typeof: string
    pattern: '\S'
  SourceKey:
    typeof: string
    pattern: '^[a-z][a-z0-9_-]*$'
  NumericSourceValue:
    description: Exact numeric source-cell text, before interpretation of detection-limit encoding.
    typeof: string
    pattern: '^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'
classes:
  CriticalMineralRecord:
    tree_root: true
    attributes:
      id:
        identifier: true
        required: true
        pattern: '^cmmmech:[a-z][a-z0-9-]*$'
      name:
        range: NonEmptyText
        required: true
      material_kind:
        range: MaterialKind
        required: true
      description:
        range: NonEmptyText
        required: true
      identifiers:
        range: NamedEntity
        multivalued: true
        inlined_as_list: true
      sources:
        range: Source
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined_as_list: true
      criticality:
        range: CriticalityDesignation
        multivalued: true
        inlined_as_list: true
      mechanisms:
        range: Mechanism
        multivalued: true
        inlined_as_list: true
      curation_history:
        description: Descriptive inline change events; not a substitute for scientific record reviews.
        range: CurationEvent
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      history_refs:
        description: >-
          Repository-relative paths to canonical HistoryRecord sidecars,
          separate from native inline curation_history events. Presence is
          advisory; supplied references must identify this record's history.
          Create sessions with just new-history, then append the returned path.
        multivalued: true
        pattern: '^history/records/[a-z][a-z0-9-]*/[A-Za-z0-9_.-]+\.yaml$'
  CurationEvent:
    description: Who changed or reviewed a record, when, and what was done.
    attributes:
      timestamp:
        range: datetime
        required: true
        pattern: '^20[0-9]{2}-'
      curator:
        range: NonEmptyText
        required: true
      action:
        range: NonEmptyText
        required: true
      summary:
        range: NonEmptyText
        required: true
  NamedEntity:
    attributes:
      id:
        required: true
        pattern: '^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$'
      label:
        range: NonEmptyText
        required: true
  Source:
    attributes:
      id:
        range: SourceKey
        required: true
      title:
        range: NonEmptyText
        required: true
      url:
        range: uri
        required: true
        pattern: '^https?://[^\s/]+(?:/[^\s]*)?$'
      accessed_on:
        range: date
        required: true
  CriticalityDesignation:
    attributes:
      jurisdiction:
        range: NonEmptyText
        required: true
      list_name:
        range: NonEmptyText
        required: true
      edition:
        range: NonEmptyText
        required: true
      classification:
        range: CriticalityClass
        required: true
      source_ref:
        range: SourceKey
        required: true
  Mechanism:
    attributes:
      id:
        range: SourceKey
        required: true
      name:
        range: NonEmptyText
        required: true
      process:
        range: ProcessType
        required: true
      description:
        range: NonEmptyText
        required: true
      context:
        range: NonEmptyText
        required: true
      microbial:
        range: boolean
        required: true
      organisms:
        range: NamedEntity
        multivalued: true
        inlined_as_list: true
      evidence:
        range: MechanismEvidence
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined_as_list: true
      observations:
        description: >-
          Selected source concentration cells associated with this mechanism,
          including abiotic controls. Presence does not establish microbial
          causality or turn concentration change into a recovery yield.
        range: ConcentrationObservation
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
  MechanismEvidence:
    attributes:
      source_ref:
        range: SourceKey
        required: true
      supports:
        range: SupportLevel
        required: true
      explanation:
        range: NonEmptyText
        required: true
  ConcentrationObservation:
    description: >-
      A reported mass-based elemental concentration or a below-detection limit,
      with its source cell and sample context. The current contract preserves
      numeric tables that encode below-detection limits with a negative sign.
      It does not represent estimates, recovery percentages, or pooled samples.
    attributes:
      id:
        range: SourceKey
        required: true
      source_ref:
        range: SourceKey
        required: true
      source_table:
        range: NonEmptyText
        required: true
      source_sample_id:
        range: NonEmptyText
        required: true
      source_column:
        range: NonEmptyText
        required: true
      raw_value:
        range: NumericSourceValue
        required: true
      analyte:
        range: NamedEntity
        required: true
        inlined: true
      material_form:
        range: NonEmptyText
        required: true
      sampled_fraction:
        range: NonEmptyText
        required: true
      study_arm:
        description: Assigned experiment arm, not proof that cells were present when sampled.
        range: StudyArm
        required: true
      result_status:
        range: ConcentrationResultStatus
        required: true
      value:
        description: Finite nonnegative reported concentration; only present for measured results.
        range: float
        minimum_value: 0
      detection_limit:
        description: Finite positive upper boundary; only present for below-detection results.
        range: float
        minimum_value: 0
      unit:
        range: MassBasedConcentrationUnit
        required: true
      analyzed_on:
        description: Source analysis date, never substituted for sample collection date.
        range: date
        required: true
      sampled_on:
        description: Independently sourced collection date; omit when unresolved.
        range: date
      sampling_source_locator:
        description: Table, exact sample key and date column within source_ref supporting sampled_on.
        range: NonEmptyText
      context:
        description: Analytical basis, sample timing and limits needed to interpret this cell.
        range: NonEmptyText
        required: true
enums:
  ConcentrationResultStatus:
    permissible_values:
      measured:
      below_detection:
  MassBasedConcentrationUnit:
    permissible_values:
      mg/kg:
  StudyArm:
    permissible_values:
      biotic:
      abiotic:
  MaterialKind:
    permissible_values:
      element:
      mineral:
      mineral_group:
      commodity:
      secondary_resource:
  CriticalityClass:
    permissible_values:
      critical:
      strategic:
      not_listed:
      unknown:
  ProcessType:
    permissible_values:
      bioleaching:
      biosorption:
      biomineralization:
      redox_transformation:
      separation:
      recovery:
      recycling:
      other:
  SupportLevel:
    permissible_values:
      support:
      partial:
      refute:
      context_only:
