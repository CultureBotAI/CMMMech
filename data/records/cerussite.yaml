    annotation_note: Grounded to reference-proteome entry in UP000008063 for Serpula lacrymans var. lacrymans S7.3 (NCBITaxon:936435) as the sequenced strain representative for mechanism species Serpula lacrymans (NCBITaxon:85982; tested isolate LE-BIN 1192). Serpula himantioides (NCBITaxon:80602) and Amyloporia xantha (NCBITaxon:1333629) lack UniProtKB proteomes.
    evidence:
