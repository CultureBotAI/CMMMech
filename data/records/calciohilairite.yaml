id: cmmmech:calciohilairite
name: Calciohilairite
material_kind: mineral
description: >-
  Calciohilairite (IMA 1984-023) is an IMA-accepted hydrated calcium-zirconium
  silicate mineral of the hilairite group with IMA September 2026 Master List
  formula CaZrSi3O9(H2O)3 and site-grouped empirical formula
  (Ca0.89Zr0.15Na0.03Cu0.03)(Zr0.99Fe0.01)(Si2.82Al0.09)O9·3.30H2O (from 6
  electron microprobe analyses in Table 2, p. 1193: SiO2 37.35–41.37, ZrO2
  31.64–33.97, CaO 10.70–14.10, Na2O 0.13–0.24, FeO 0.00–0.70, Al2O3 0.00–2.61,
  TiO2 0.00–0.09 wt%, CuO 0.19–1.12 wt% in 5 analyses and n.d. in altered sample
  6, and H2O 12.88–15.18 wt% by difference). Described by Boggs (1988) from
  miarolitic cavities in alkaline granite of the Golden Horn batholith on the
  south-southwest ridge of Liberty Bell Mountain (48°31'4"N, 120°39'7"W),
  Okanogan County, Washington, USA (cotypes NMNH 161591 and 162192). Trigonal
  (probable space group R32), with powder-refined unit cell a = 20.870(4) Å, c =
  16.002(4) Å (unaltered single crystal a = 20.887(4) Å, c = 15.914(3) Å;
  subcell a = 10.415(4) Å, c = 16.01(3) Å), Dmeas = 2.68(2) g/cm3, Dcalc = 2.74
  g/cm3, Mohs hardness 4, and uniaxial (–) optics with omega = 1.622(1) and
  epsilon = 1.619(1).
