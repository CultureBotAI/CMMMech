id: cmmmech:vanadium
name: Vanadium
material_kind: element
description: >-
  Vanadium (V), represented here as an element distinct from the dissolved
  V(V) feed and electrode-associated material in a laboratory
  bioelectrochemical separation study. The United States 2025 designation
  applies to the named vanadium commodity; it does not identify a vanadium
  mineral species or establish the criticality of every vanadium compound.
