limitations:
- Source methods/table/results conflict in volumes versus masses, run times, room-temperature
  heading versus 40°C and 800 versus 900°C thermal endpoint. These are disclosed source
  limitations, not repaired measurements.
- No complete Zn balance, quantified purity, matched causal controls or independent
  synthesis replicate count; n=200 measures crystals.
- Morphological and gas-release pathways are interpretations; no evolved-gas assay
  or intervention establishes them uniquely.
- No separate SI document is announced in inspected complete original/JATS; the supplemental-assets
  route contains main figures. Bounded notice searches are not exhaustive.
- Scientific assessment is not laboratory replication, and structural validation does
  not prove truth.
