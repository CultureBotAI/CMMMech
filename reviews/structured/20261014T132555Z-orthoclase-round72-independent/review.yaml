limitations:
- Assessment covers the full relevant Chapter XII, not all unrelated chapters of the
  274-page thesis.
- The chapter and final journal are the same study. Final journal methods text was
  read, but local final journal PDF/image and any supplemental equivalence are not
  asserted.
- One interrupted run is not replicated reactors; fifty pits describe within-surface
  observations.
- A polished Na-bearing natural crystal and one hydrothermal face/condition do not
  establish all-feldspar behavior; initial surface rounding and polishing defects
  affect model interpretation.
- No microbial potassium release, recovered product, constituent criticality or industrial
  deployment is inferred.
- The bounded notice/conflict searches do not establish exhaustive later-literature
  coverage.
notes:
- No supported corrective finding in this scope; no owner/history edits by reviewer.
- Structured source adapters for genes or transcriptomic modules are not applicable
  to these abiotic mineral claims.
