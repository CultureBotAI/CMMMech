  topic: Resource and criticality boundaries
  outcome: supported
  summary: The industrially generated mixed hot cake is distinct from minerals, elements
    and other zinc residues.
  details: Page135 distinguishes hot KMnO4 treatment at90 C and Ca(OH)2 precipitation
    at pH5 from subsequent cold zinc-dust cementation. The accepted Zandjan specimen
    is a mixed XRD-amorphous precipitate. Table1 oxide-equivalent assay entries ZnO14.00wt%,Co3O4
    4.8wt%,MnO22.9wt% do not identify crystalline hosts or equal elemental metal fractions.
    There is no inherited jurisdiction/list/edition criticality claim.
