id: cmmmech:kornelite
name: Kornelite
material_kind: mineral
description: >-
  Kornelite is a monoclinic ferric sulfate mineral, represented in the
  September 2026 IMA list as Fe(III)2(SO4)3(H2O)6·1.75H2O.
  Its additional channel water is variable; historical seven-water
  formulae are not exact hydration measurements for every specimen.
  This species is distinct from paracoquimbite, ferricopiapite and
  undifferentiated ferric-sulfate salts. The evidence below separates
  abiotic synthesis of a characterized crystalline product from
  provisional diffraction assignments in mixed bacterial-culture solids.
  Neither experiment establishes a recovered iron product from ore
  or waste, industrial deployment or a criticality designation.
