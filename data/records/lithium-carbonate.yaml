id: cmmmech:lithium-carbonate
name: Lithium carbonate commodity
material_kind: commodity
description: Lithium carbonate (Li2CO3) supplied as a manufactured chemical commodity.
  This product family is distinct from elemental lithium, lithium-bearing brines and
  ores, and other lithium salts. Albemarle describes separate technical, battery and
  pharmaceutical product grades; grade names do not make every lithium carbonate lot
  interchangeable. Its dated product 401125 technical sheet specifies at least 99.0%
  Li2CO3 and lists cathode manufacture among its applications, illustrating why a battery-related
  use alone does not establish a universal battery-grade threshold. That supplier-specific
  assay is not the definition of this whole family. SAMR separately registers YS/T 582-2023
  for battery-grade lithium carbonate, but its complete technical tables were not inspected.
  No criticality designation, microbial production or qualified recovered-product yield
  is asserted here.
