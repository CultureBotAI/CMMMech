id: cmmmech:nesquehonite
name: Nesquehonite
material_kind: mineral
description: Nesquehonite is the hydrated magnesium carbonate mineral species Mg(CO3)(H2O)2·H2O,
  listed as grandfathered in the September 2026 IMA-CNMNC list with original-description year 1890.
  That year is not an approval identifier. It is distinct from dypingite, hydromagnesite, elemental
  magnesium and the magnesite commodity. The evidence below concerns nesquehonite within laboratory
  precipitates, not magnesium metal or an industrially recovered product; no constituent criticality
  is inherited.
