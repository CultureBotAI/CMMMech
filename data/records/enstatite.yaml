mechanisms:
- id: mixed_feed_enstatite_bioleaching
  name: Enstatite-bearing mixed-feed leaching by engineered bacterial biolixiviant
  process: bioleaching
  description: An enstatite-bearing olivine mixture released Mg and Ni into the analyzed liquid fraction in both cell-containing and cell-free bacterial-biolixiviant arms. XRD and the authors' mass-balance model are consistent with partial enstatite dissolution, but the study did not test a pure-enstatite feed or measure enstatite-specific aqueous flux.
  context: The selected feed was the 69 wt% olivine/31 wt% enstatite bulk powder, not the separate hand-selected olivine-only arm. The strain was Gluconobacter oxydans B58 delta-pstS, P112:mgdh, propagated from one colony; triplicate flasks per arm and sampling day were technical replicates from that shared culture. YPM growth and glucose-based biolixiviant production each lasted two days at 30 degrees C and 200 rpm. Prepared cell-containing cultures and centrifuged, 0.2-micrometre-filtered biolixiviant were tested separately. Each 100-mL flask contained 10 mL liquid and 0.5 g powder (5% pulp), incubated statically at 30 degrees C for 0, 5, 10 or 15 days. The Methods temperature takes precedence over the Introduction's room-temperature shorthand. Powders had typical particle size 40 micrometres after 20 minutes of tungsten-carbide milling; visibly carbonate-coated/altered grains were removed and a 60-minute deionized-water ultrasonic wash preceded milling. Powder sterilization was 135 degrees
    C for three minutes. Controls contained 20% glucose and mineral without cells or biolixiviant, with no acid or pH matching. Species taxon 442 does not identify the engineered genotype.
