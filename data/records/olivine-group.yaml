  evidence:
  - source_ref: klug_2026_data
    supports: support
    explanation: ICP-MS data row 6 reports day-15 Mg means of about 9565 ppm with cells (O6), 7203 ppm with cell-free biolixiviant (Y6), and 242 ppm in the glucose-only olivine control (E6). XRD minerals rows 4, 10 and 14 assign respectively 32, 20 and 0 wt% Mg-oxalate in residual solids, with associated amorphous-silica fractions. These phase fractions are not isolated-product yields. The workbook's ppm-to-mg/L convention is retained only in prose, without conversion to mg/kg.
  - source_ref: klug_2026_si
    supports: support
    explanation: Figure S3 compares direct and cell-free olivine XRD series and preserves Mg-oxalate formation in the cell-free day-15 residue. Figure S1 presents a background-subtracted Raman spectrum assigned to glushinskite. These are the authors' phase assignments; no new separate generic magnesium-oxalate species is created here. Table S1 makes the imported-composition assumption explicit.
  - source_ref: klug_2026
    supports: partial
    explanation: Figure 6a and the Discussion allocate about 64% of initial Mg to solution and 11% to Mg-oxalate at day 15, together accounting for the reported roughly 75% liberated from starting olivine. The Abstract instead calls the 11% a proportion of leached Mg; these denominators conflict and are not silently harmonized. The values are mass-balance estimates using assumed starting chemistry, 10 mL liquid and XRD proportions, not a weighed isolated yield or 75% dissolved Mg. Carbon in the oxalate likely derives from glucose; net atmospheric capture and long-term storage are unestablished.
  - source_ref: klug_2026
    supports: partial
    explanation: Leachate was centrifuged at 3214 x g for 20 minutes, frozen, thawed, passed through 0.45-micrometre filter plates and diluted 10000-fold in nitric acid for ICP-MS. Reported Mg and Ni were blank-corrected by about 1043 and 3.2 ppm respectively using a 100-fold-dilution comparison. These operationally defined filtrate concentrations are not isolated-product yields or resolved chemical species. Initial treated pH was about 2.4-2.5 but controls were about 8.7; later direct and cell-free pH trajectories also differed. The experiment does not isolate physical contact from evolving acid/metabolite chemistry, demonstrate a particular Fe-oxidation enzyme, or compare this mutant with wild type for mineral leaching. Laboratory results establish no industrial deployment or net atmospheric carbon removal. Oxalic acid was detected in only one mutant biolixiviant replicate; its concentration was not quantified, and proposed Fe oxidation/siderophore effects remain mechanistic interpretations.
