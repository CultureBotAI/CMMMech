    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA that secretes intracellularly synthesized citric acid into the extracellular medium, driving organic-acid acidification and metal chelation.
    annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:A0A254TZW7 (CEXA_ASPNG) for Aspergillus niger (NCBITaxon:5061).
    evidence:
    - source_ref: urik2015
      supports: partial
      explanation: Representative Aspergillus niger citrate exporter CexA for organic-acid excretion during isolate G-10 bioleaching of Ajka red mud in Urik et al. (2015); cexA was not mutated.
  evidence:
  - source_ref: urik2015
    supports: support
    explanation: Sections 2.3, 2.5 and 3.3 with Figure 3 report approximately 141 mg/L Al after seven days for G-10 at the selected loading. No-fungus controls gave undetected or below-detection Al; a numerical Al detection limit is not supplied. Section 3.4 and Figure 7a report final pH 2.3 with oxalic and citric acids at 16.0 and 28.6 mmol/L. These results establish mobilization into the filtrate, without demonstrating an isolated aluminium product or industrial operation.
  - source_ref: urik2015
    supports: partial
    explanation: Sections 2.4 and 3.4 with Figure 8 report approximately 142 mg/L Al for synthetic mixture B, formulated from the day-five fungal acid profile. Mixtures used sodium salts and HCl-adjusted pH, 0.2 g red mud in 50 mL and two days at 25 degrees C. This chemically mediated result is comparable in concentration to fungal leaching, but unequal incubation periods and media prevent a matched kinetic comparison. Acidification alone does not identify its physiological cause, and these experiments do not isolate proton effects from ligand complexation or other metabolites.
