  summary: 'An enstatite-bearing olivine mixture released Mg and Ni into the analyzed liquid fraction
    in both cell-containing and cell-free bacterial-biolixiviant arms. XRD and the authors'' mass-balance
    model are consistent with partial enstatite dissolution, but the study did not test a pure-enstatite
    feed or measure enstatite-specific aqueous flux. Substrate-edge evidence (klug_2026, supports: partial):
    Klug et al. (2026) tested enstatite only within a 69 wt% olivine / 31 wt% enstatite mixed powder (without
    a pure-enstatite control or pH-matched abiotic control) and inferred partial enstatite dissolution
    from XRD and mass-balance modeling. Product-edge evidence (klug_2026, supports: partial): Klug et
    al. (2026) ICP-MS worksheet row 6 and Figure 6c–d measure bulk filtrate Mg and Ni from the 69/31 olivine-enstatite
    mixture and estimate enstatite''s contribution by mass balance rather than direct phase-specific flux
    measurement.'
