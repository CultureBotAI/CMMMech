mechanisms:
  - id: abiotic_thermal_dehydration_decarbonation
    name: Laboratory thermal dehydration and decarbonation of natural thomasclarkite-(Y)
    process: other
    description: >-
      Heating a 5.970 mg powdered sample of natural thomasclarkite-(Y) under
      flowing dry nitrogen from room temperature to 1000 degrees C produced two
      resolved weight-loss stages between 20 and 510 degrees C totaling 2.302 mg
      (38.6 wt%), attributed by the authors to loss of weakly H-bonded [H2O]
      groups between 20 and 110 degrees C (1.222 mg, 20.5 wt%) followed by a
      bimodal DTG loss between 380 and 510 degrees C (1.080 mg, 18.1 wt%) from
      decomposition of (OH)- and (HCO3)- groups into H2O and CO2.
    context: >-
      Thermal analysis in Grice and Gault (1998), pp. 1295-1296 and Figure 3
      used a 5.970 mg powdered natural sample from Mont Saint-Hilaire in a
      Mettler-Toledo TA8000 / TG50 thermal system with an M3 microbalance heated
      from room temperature to 1000 degrees C at 5 degrees C/min under dry
      nitrogen flowing at 200 mL/min. Because the 380-510 degrees C step co-
      evolved H2O and CO2 without online gas analysis, the authors calculated
      ideal CO2 (12.0 wt%) from crystal-structure stoichiometry and subtracted
      it from the total 38.6 wt% TG weight loss to obtain 26.6 wt% total H2O.
    microbial: false
    evidence:
      - source_ref: grice_gault_1998_thomasclarkite
        supports: support
        explanation: >-
          Pages 1295-1296 and Figure 3 report two TG/DTG weight-loss stages on
          the 5.970 mg sample (total loss 2.302 mg or 38.6 wt%): Stage 1
          (20-110 degrees C) lost 1.222 mg (20.5 wt%, assigned to loss of weakly
          H-bonded [H2O] molecules), and Stage 2 (380-510 degrees C, bimodal DTG
          peak) lost 1.080 mg (18.1 wt%, assigned to combined loss of H2O and
          CO2 from (OH)- and (HCO3)- decomposition).
      - source_ref: grice_gault_1998_thomasclarkite
        supports: partial
        explanation: >-
          Because the bimodal 380-510 degrees C DTG peak reflects overlapping
          dehydroxylation and decarbonation without evolved-gas spectroscopy or
          diffraction identification of the heated solid residue, the partition
          of the 38.6 wt% total loss into 26.6 wt% H2O and 12.0 wt% CO2 relies
          on the ideal structural content of one (HCO3)- group per formula unit.
