mechanisms:
- id: shewanella_passive_film_reduction
  name: Shewanella-associated reduction of the titanium oxide passive film
  process: redox_transformation
  description: Shewanella algae biofilms were associated with oxygen depletion near the titanium surface, a thinner oxide film, increased lower-valence titanium spectral components and enhanced corrosion relative to uninoculated controls. Riboflavin addition and overproduction support an electron-shuttle contribution. Reduction of the pre-existing oxide film and subsequent corrosion of underlying Ti are distinct processes; these experiments do not demonstrate recovery of a titanium product.
  context: The reported strain is S. algae MCC 1A11468 from the Marine Culture Collection of China; the linked taxonomy ID resolves the species only. Commercially pure Ti cylinders were 10 mm in diameter and 3 mm high, with a 0.785 cm2 exposed electrochemical surface, ground to 1000 grit, ethanol-cleaned, water-rinsed and UV-sterilized for 30 min. The culture medium was 2216E at initial pH 7.2 +/- 0.2; Figure S1 shows changing pH rather than a constant-pH experiment. Main film and electrochemical comparisons run to 21 days in bulk aerobic medium. The separate Figure 5 mechanistic incubations were anaerobic, using lactate as donor and simulated seawater deoxygenated with filtered nitrogen for at least 30 min. The inspected main article and full supplement do not specify incubation temperature, starting cell density, lactate concentration or riboflavin amendment concentration. The RF construct overexpressed S. oneidensis MR-1 riboflavin genes in S. algae; it is not a second organism independently
    tested here. These are laboratory coupon experiments, not an industrial extraction or recovery process.
