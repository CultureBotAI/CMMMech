  evidence:
  - source_ref: fu2014
    supports: support
    explanation: Methods on page 665 and Figures 1a, 2a and 3a report increasing dissolved-copper extraction indices from the djurleite-rich specimen in inoculated flasks. Page 668 reports 95.12% after 48 days at 1.5 g/L initial Fe(II). Figure 2a also shows that higher initial iron was not uniformly beneficial. These are conditional specimen-level observations, not a universal optimum or a quantitative djurleite-only conversion.
  - source_ref: fu2014
    supports: partial
    explanation: Page 665 reports 36.45% copper extraction when pH was adjusted to 2, before the reported incubation time course; Figure 1a starts near that value. Substantial initial chemical release and the absence of a matched uninoculated time course prevent attributing the full endpoint or its increment exclusively to microbial activity. Associated chalcocite and bornite are additional copper sources. The paper's direct-attack and ferric-regeneration explanations are proposed mechanisms, without selective inhibition, contact separation or chemistry-matched controls.
  - source_ref: fu2014
    supports: partial
    explanation: Pages 666 and 669 conflict on the preferred djurleite inoculum (1.0 versus 0.5 x 10^8 cells). Figure 3c and its discussion label redox potential in eV, without an electrode reference, so no numerical redox threshold is adopted. Figure 3a does not reproduce the initial copper baseline depicted in Figures 1a and 2a; no reconciliation is supplied. The paper repeats Figure 2 on pages 667-668 and Table 1 on pages 665 and 671; repeated layouts are not independent experiments. Its cited Fu et al. 2013 djurleite paper is related same-group work and is not counted here as independent replication.
  - source_ref: fu2014
    supports: partial
    explanation: The separate attachment assay on page 665 used washed cells in 50 mL of 0.001 mol/L KCl at pH 2, 30 degrees C and 120 rpm, with 0.5 g mineral of reported 50 micrometre size. Attachment was estimated by subtracting planktonic counts, and Figures 4-5 show attachment trends and cells on mineral surfaces. These conditions differ from leaching. Depletion, SEM attachment and adsorption-model fits do not demonstrate direct enzymatic dissolution or prove that attachment caused the copper endpoint.
