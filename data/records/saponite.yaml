mechanisms:
- id: mat_associated_saponitic_precipitation
  name: Community-associated precipitation of source-assigned saponitic material
  process: biomineralization
  microbial: true
  organisms:
  - id: NCBITaxon:2836
    label: Bacillariophyta
  description: Liquid cultures derived from Caballo Alba microbial mats developed Mg-Al-Si-rich layers and
    pseudomorphs on degraded diatom frustules, assigned by the authors to saponite; some cyanobacteria-like
    filaments were also coated. Dissolution of biogenic silica followed by silicate precipitation is the proposed
    route. Spatial association and culture controls support a community effect but do not isolate a particular
    strain, metabolism or living-cell requirement.
  context: Mats collected in March 2019 from Caballo Alba lake, Segovia, Spain, inoculated modified ASN-III
    liquid and 20 g/L agar semi-solid media. Methods report 1 mL inoculum, triplicate experiments, 30 degrees
    C, seven months and dark/light conditions without an explicit photoperiod or separate light/dark mineral
    outcomes. No additional water was added. Initial pH was adjusted to 7.4; liquid culture endpoints were
    pH 8.0-8.3 versus 7.6 in the uninoculated liquid control. The medium supplied Mg, Al and dissolved silicate
    as well as Ca and bicarbonate, so the diatom frustule is not the only available silicon source. The inoculum
    was a mixed community containing at least two unnamed pennate-diatom morphotypes, cyanobacteria and other
    bacteria, not a pure isolate. SEM preparations were fixed, ethanol-dehydrated and dried; TEM used powdered
    material suspended in butanol. No in-situ phase time series, phase-specific mass yield or recovery process
    was measured.
  evidence:
  - source_ref: del_buey_2023
    supports: support
    explanation: Methods 2.1-2.4 and Figures 3-6 show partly corroded frustules, Mg enrichment, Mg-Al-Si-bearing
      layers, and diatom-shaped pseudomorphs in liquid cultures. Figure 7 shows comparatively preserved frustules
      embedded in EPS in the semi-solid cultures. These observations support the source's culture-dependent
      association and dissolution/precipitation interpretation, not direct tracking of individual atoms or
      proof that EPS alone caused the difference.
  - source_ref: del_buey_2023
    supports: partial
    explanation: The assignment is based on morphology and TEM/SEM EDS composition, including a reported saponitic
      structural-formula range. Figure 6C/E shows diffuse rings and its caption calls the aggregates amorphous;
      bulk XRD did not resolve clay peaks. No treated-clay diffraction series or refined phase fraction is
      supplied. Accordingly, the material is retained as source-assigned saponitic, poorly ordered Mg-Al silicate
      rather than independently confirmed phase-pure crystalline saponite.
  - source_ref: del_buey_2023_si
    supports: partial
    explanation: Original Figures S2 and S4 corroborate the coated frustules/filaments and flaky Mg-Si-Al material.
      Figure S5 resolves halite and source-assigned coalingite in the uninoculated liquid control. The main
      text reports no clay mineral detected in controls, but control XRD alone cannot exclude amorphous Mg-silicate
      when the biotic material is itself XRD-undetected. No killed-inoculum, isolated-frustule, pH-matched
      or specific-metabolism control is described; the study does not establish a living-cell requirement or
      exclusive biological necessity.
  - source_ref: del_buey_2023
    supports: partial
    explanation: Table 1 records substantial Si and Al depletion even in the no-inoculum control, as well as
      lower final Si in cultures. The printed 99.2-99.6% Si-consumption range does not match all three culture
      cells; the Al culture value spans rows and its replication is unclear. These solution measurements are
      not a saponite mass balance. The main text also cross-refers to Figure S3 for a control observation although
      S3 is a community chart; S5 is the actual control diffractogram. No exact uptake efficiency or phase
      yield is adopted.
  - source_ref: del_buey_2023
    supports: partial
    explanation: The interpretation invokes photosynthesis, decaying biomass, EPS differences and local Mg
      binding, but these contributions are not separately measured. Light/dark methods are not linked to separate
      outcome arms. Carbonate diffraction, isotopic data and saturation modeling cannot establish the saponite
      phase or a saponite-specific metabolism. Reported community percentages include chloroplast assignments
      within 16S profiles; they are not a quantitative census of diatom species. This is laboratory evidence,
      with no industrial extraction or demonstrated field-scale manufacture.
