mechanisms:
- id: spent_acid_leaching_after_fibre_removal
  name: Culture-derived acid leaching in staged carton-reject processing
  process: bioleaching
  description: Sulfur-oxidizing mixed cultures supplied acidic supernatant for aluminium dissolution in a separate laboratory leaching stage. Enzymatic fibre removal, acid leaching, sodium-hydroxide precipitation and polymer density separation are distinct operations. Comparable reagent-acid performance prevents assigning a special leaching benefit to live cells or microbial metabolites. Aluminium precipitation is a subsequent chemical operation.
  context: 'About 25 kg of reject was supplied by a German paper recycler after hydropulping. Large caps were removed, the material dried at 60 degrees C for up to 48 hours, shredded below 11 mm and homogenized. FTIR and SEM-EDX identified layered Al, predominantly PE, other plastics and residual fibres. Small-scale enzyme pretreatment used 1 g feed in 100 mL, 0.5 M citrate buffer at pH 4.8, 2.5-7.5% v/v Cellic CTec3, 50 degrees C and 150 rpm for 24 hours. This commercial enzyme mixture is not a live microbial culture, and its producing strain is not assigned. The supplement identifies DSM 504 and DSM 9466 for acid generation in a 2 L vessel with 1.8 L working volume, 6% w/v sulfur, 30 degrees C, 250 rpm and 60 L/h air, followed by partial medium replacement and a second cycle. Centrifuged supernatant is described as cell-free 1.4 M sulfuric acid; the supplement estimates total acidity from sulfate and pH rather than establishing reagent purity. Leaching used 100 mL in 250 mL flasks, 1.0,
    2.5 or 5.0% w/v reject, room temperature and 150 rpm, in triplicate, with a commercial 1.4 M acid comparator only at the highest loading. Aluminium was measured by the chromazurol-S Spectroquant assay. The integrated trial used 50 g/L reject in a 2 L bottle: four days of enzyme treatment at 50 degrees C and 170 rpm, washing, then 1 L biogenic acid at 30 degrees C and 170 rpm for about a week.'
  microbial: true
