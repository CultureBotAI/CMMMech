mechanisms:
  - id: desulfuricans_pd_reduction
    name: Resting-cell reduction of dissolved Pd(II) to elemental palladium
    process: redox_transformation
    description: >-
      Desulfovibrio desulfuricans ATCC 29577 resting cells reduced soluble
      Pd(II) to cell-associated Pd(0) with an electron donor. Hydrogenase
      involvement was inferred, not established by a specific genetic test.
    context: >-
      Laboratory anaerobic batch assay using washed, nongrowing ATCC 29577
      cells (0.5 g/L; 2.5 mL in sealed 12 mL serum bottles) in 20 mM
      MOPS-NaOH, pH 7, at 30 degrees C. The substrate was
      0.5 mM Pd(II) supplied as the palladium ammine chloride salt reported by
      Lloyd et al.; hydrogen replaced nitrogen in the headspace. The reported 100%
      dissolved-Pd(II) depletion after 24 h is an assay result, not a purified
      metal yield. Pd(0) identity was supported by X-ray diffraction and
      cell-associated deposits by electron microscopy and elemental analysis.
      This experiment does not establish performance in mixed waste leachates,
      ore extraction, or industrial deployment.
    microbial: true
    organisms:
      - id: NCBITaxon:876
        label: Desulfovibrio desulfuricans
    evidence:
      - source_ref: lloyd_1998
        supports: support
        explanation: >-
          Methods and results preceding Figure 1, and Figure 1A-C: the
          reported outcome was absent in cell-free, heat-killed, and
          electron-donor-free controls. These controls and solid-phase
          characterization support microbial Pd(II) reduction under the stated
          conditions in this strain.
      - source_ref: lloyd_1998
        supports: partial
        explanation: >-
          Hydrogen-supported reduction and inhibition following copper
          pretreatment implicate hydrogenase activity, but do not identify
          a unique enzyme or establish its necessity genetically.
      - source_ref: mikheenko_2008
        supports: context_only
        explanation: >-
          The introduction cautions that copper is not a specific hydrogenase
          inhibitor. The mutant experiments concern D. fructosivorans, a
          different species, and cannot establish enzyme necessity in ATCC
          29577. This narrows the 1998 mechanistic inference without refuting
          its observed Pd reduction.

