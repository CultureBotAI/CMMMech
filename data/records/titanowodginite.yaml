id: cmmmech:titanowodginite
name: Titanowodginite
material_kind: mineral
description: >-
  Titanowodginite (IMA 1984-008) is an IMA-accepted manganese-titanium-tantalum
  oxide mineral of the wodginite group, the B-site Ti-dominant analogue of
  wodginite, with IMA September 2026 Master List formula Mn2+TiTa2O8 and unit-cell
  formula (Mn3.04Fe2+0.89[]0.07)Sigma4(Ti2.49Sn1.21Ta0.22Fe3+0.08)Sigma4(Ta6.06Nb1.94)Sigma8O32
  (p. 637, for Z = 4).
  Described by Ercit, Černý, and Hawthorne (1992) from the Tanco rare-element
  granitic pegmatite, Bernic Lake, southeastern Manitoba, Canada, where it
  occurs as dark brown to black bipyramidal crystals up to 1
  cm with microlite and manganocolumbite in saccharoidal albite plus quartz with
  minor muscovite and beryl. Monoclinic (space group C2/c), with a = 9.466(2) Å
  in Table 4 (9.466(1) Å in p. 637 text), b = 11.431(1) Å, c = 5.126(1) Å,
  beta = 90.31(2)°, V = 554.6(1) Å3, Z = 4, Dmeas = 6.86(3) g/cm3, Dcalc = 6.89
  g/cm3, Mohs hardness 5.5, and biaxial (+) optics with n > 2.0.
