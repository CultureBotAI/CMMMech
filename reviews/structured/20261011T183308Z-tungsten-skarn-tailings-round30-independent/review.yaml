limitations:
- No replicated beneficiation outcomes,uncertainty estimates or quantitative product
  mineralogy establish general recovery performance; the record states those limits.
- The gravity-feed lower cutoff is explicit in Methods/Results but omitted from Table6
  shorthand; it is not silently assumed that unsieved repository material shares the
  quoted W distributions.
- Physical engineering results and geochemical field correlations do not demonstrate
  any microbial mechanism. No organism identifier or inherited criticality is asserted.
- Field sequential extraction has incomplete W mass closure and carbonate exchange
  lacks direct mineralogical confirmation. Those field values and exact chemical equations
  are not adopted as quantitative recovery evidence.
- Notice search is bounded; MDPI version-note direct opening returned429 although
  an indexed original-version listing was available. No exhaustive absence of notices
  or machine-wide duplicates is claimed.
