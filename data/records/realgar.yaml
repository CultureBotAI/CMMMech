  evidence:
  - source_ref: chen2012
    supports: support
    explanation: Methods page 10 and results page 13 report soluble arsenic by ICP-AES. The culture reached 121.95 mg/L on day 15 compared with 16.44 mg/L in the sterile control, described as a 7.4-fold difference. Subsequently the culture concentration declined and by day 25 was lower than the control. These are the authors' solution concentrations, not a cumulative extraction fraction, mineral-specific arsenic mass balance or isolated recovery. The article supplies no concentration-time figure, numerical uncertainty for these values, or explicit liquid filtration specification.
  - source_ref: chen2012
    supports: support
    explanation: Figures 1-3 and pages 11-14 document cracks or pits after extended culture exposure, starting-material realgar and arsenolite by XRD, and a realgar-associated Raman spectrum. Figure 2 and its discussion assign realgar, dimorphite, magnetite and jarosite to the bioleached residue. The reported 43, 23, 6 and 28 wt% are relative residual-solid phase assignments, not absolute product yields. Raman does not support the authors' tested pararealgar alternative; this does not establish the absence of every possible minor phase.
  - source_ref: chen2012
    supports: partial
    explanation: A sterile control supports a culture-associated difference, but SEM attachment/surface changes do not isolate direct enzymatic attack from chemically mediated dissolution. Added medium iron and the arsenolite impurity prevent attributing all aqueous arsenic specifically to realgar or all secondary iron to the mineral. The proposed adsorption or coprecipitation explanation for declining aqueous arsenic is not tested with a closed arsenic balance or solid-phase arsenic speciation. Table 1 converts As/S ratios into normalized formulas inconsistently with its atom percentages; those formulas are not adopted as mineral stoichiometries.
