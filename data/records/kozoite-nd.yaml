id: cmmmech:kozoite-nd
name: Kozoite-(Nd)
material_kind: mineral
description: >-
  Kozoite-(Nd) is the neodymium-dominant orthorhombic rare-earth
  hydroxyl carbonate mineral with ideal formula Nd(CO3)(OH),
  approved as IMA 1998-063. It is distinct from elemental neodymium,
  kozoite-(La), hydroxylbastnäsite-(Nd) and commercial rare-earth
  feeds. The original Niikoba, Hizen-cho, Japan material consists of
  crystals smaller than 10 µm in an alkali olivine basalt cavity.
  Six-grain microprobe analyses show a mixed rare-earth composition,
  including Nd0.85 and La0.61 on a two-cation basis, rather than a
  pure Nd end member. Fluorine was not detected; no detection limit
  is supplied. Carbon and hydrogen were measured separately by
  triplicate elemental analysis using approximately 5 mg portions.
  Synchrotron powder diffraction and Rietveld refinement give Pmcn,
  a = 4.9829(1), b = 8.5188(2), c = 7.2570(2) Å and Z = 4.
  Hydrogen positions were not located, and the original study could
  not exclude a nearly orthorhombic monoclinic structure without
  suitable single crystals. The thermal experiment below concerns
  this natural mixed-REE material, not an isolated synthetic Nd
  end member. These sources do not establish microbial formation,
  industrial recovery or a jurisdiction-specific criticality designation.
