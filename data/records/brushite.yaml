  url: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41598-019-51133-9/MediaObjects/41598_2019_51133_MOESM1_ESM.docx
  accessed_on: '2026-10-14'
- id: ncbi_ecoli
  title: NCBI Taxonomy 562, Escherichia coli, species; official XML inspected 14 October 2026. Species
    mapping does not authenticate engineered HB101 derivatives.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=562&mode=Info
