id: cmmmech:dacostaite
name: Dacostaite
material_kind: mineral
ima_symbol: Dcs
description: >-
  IMA-approved hydrated potassium magnesium-aluminium fluoride-arsenate mineral (IMA
  2024-015; symbol Dcs in the September 2026 IMA Master List, PDF p. 54; status A,
  Approved 2024; full description published January 2025) with ideal end-member formula
  K(Mg2Al)[Mg(H2O)6]2(AsO4)2F6*2H2O (requiring As2O5 28.47 wt%, Al2O3 6.31 wt%, MgO 19.97
  wt%, K2O 5.83 wt%, F 14.12 wt%, H2O 31.25 wt%, O=-F -5.95 wt%, sum 100.00 wt%; Biagioni
  et al., 2025, European Journal of Mineralogy 37:39-52). Represents the first mineral
  species in the K2O-MgO-Al2O3-As2O5-H2O-F system and is named in honour of Angelo Da
  Costa (1940-2022), Tuscan mineral collector active from the early 1970s who contributed
  to the exploration of mineralogical localities in northern Tuscany (Apuan Alps, Monte
  Pisano) and collaborated with the Museo di Storia Naturale of the University of Pisa.
  Discovered in a small exploitation void known as Stanza Santoni at the Cetine di
  Cotorniano Mine (43 deg 13 min N, 11 deg 09 min E), Chiusdino, Siena province, Tuscany,
  Italy (a former Sb ore deposit where stibnite ores are hosted in Upper Triassic Calcare
  cavernoso limestone replaced by black jasperoids and vuggy silica at the contact with
  overlying Liguride Nappe argillic formations), where it occurs in fewer than 10 known
  specimens associated with quartz, native sulfur, gypsum, F-bearing alunite, nannoniite
  (IMA 2024-010), and a microcrystalline pharmacosiderite-like phase replacing a
  cube-octahedral precursor, formed by late-stage oxidized (Al,F)-rich fluids; the
  holotype specimen is deposited in the Museo di Storia Naturale, University of Pisa, Via
  Roma 79, Calci (Pisa, Italy), under catalogue number 20073. Forms aggregates of thin
  pseudo-hexagonal micaceous, colourless-to-white flakes and bent laths up to 0.5 mm in
  size with a white streak, silky lustre, no UV fluorescence at 254 or 350 nm, brittle
  tenacity, flexible but non-elastic crystals, perfect {001} cleavage, and calculated
  density Dcalc = 2.162 g/cm3 (from the empirical formula and single-crystal unit-cell
  parameters; Mohs hardness and direct density could not be measured owing to small
  crystal size and scarcity of material). Optically colourless and non-pleochroic in
  plane-polarized light, biaxial negative (-) with alpha = 1.4730(4), beta = 1.4801(4),
  gamma = 1.4805(4) (at 589 nm), 2Vmeas = 29(2) deg (spindle stage) and 2Vcalc = 27 deg,
  weak dispersion, undulatory extinction parallel or nearly parallel to the {001}
  cleavage, and a superior Gladstone-Dale compatibility index of -0.005. Micro-Raman
  spectroscopy (633 nm He-Ne laser at 8 mW, Thermo Scientific DXR dispersive Raman
  spectrometer at the National Museum in Prague; Figure 2, Section 4.1, pp. 40-42) shows
  a prominent nu1 symmetric AsO4 stretching band at 838 cm-1, AsO4 nu4 and nu2 bending
  and Mg(H2O)6/Al(F,OH,O)6 modes at 531 and 397 cm-1, lattice modes at 257, 176, and 130
  cm-1, H-O-H bending at 1685 and 1633 cm-1, and broad O-H stretching bands at ~3180-3550
  cm-1 (O...O distances 2.7-2.9 A, maximum at 2.73 A). Wavelength-dispersive electron
  microprobe analysis (n = 10 spot analyses on unpolished carbon-coated crystal surfaces,
  Cameca SX100 at the National Museum in Prague, 15 kV, 5 nA, 10 um beam diameter; Si, S,
  Pb, Cl, Ni, and Co were below detection limits; Table 1) yielded (mean wt%, range, SD,
  and value normalized to 100.00 wt% with stoichiometric H2O) As2O5 35.42 wt%
  (34.37-35.98, SD 0.57; normalized 28.69 wt%), MgO 21.13 wt% (18.60-24.94, SD 2.13;
  normalized 17.12 wt%), F 13.15 wt% (9.13-16.59, SD 2.91; normalized 10.65 wt%), Al2O3
  12.23 wt% (10.69-13.72, SD 1.01; normalized 9.91 wt%), K2O 4.13 wt% (2.85-5.43, SD
  0.78; normalized 3.35 wt%), CuO 0.42 wt% (0.27-0.94, SD 0.19; normalized 0.34 wt%), CaO
  0.36 wt% (0.27-0.46, SD 0.06; normalized 0.29 wt%), ZnO 0.34 wt% (0.21-0.47, SD 0.09;
  normalized 0.27 wt%), P2O5 0.17 wt% (0.02-0.27, SD 0.07; normalized 0.14 wt%), Na2O
  0.15 wt% (0.05-0.33, SD 0.10; normalized 0.12 wt%), MnO 0.04 wt% (0.01-0.08, SD 0.02;
  normalized 0.03 wt%), FeO 0.04 wt% (0.00-0.08, SD 0.03; normalized 0.03 wt%),
  analytical sum 87.58 wt% (range 86.57-88.71, SD 0.78; normalized 70.94 wt%), O=-F -5.54
  wt% (normalized -4.48 wt%), and H2Ocalc 41.40 wt% (normalized 33.54 wt%), giving an
  unnormalized total of 123.44 wt% (due to loss of 6-7 H2O groups in the microprobe
  vacuum and unpolished surface geometry) and normalized total of 100.00 wt%. Based on
  (As + P) = 2 apfu and electrostatic balance, the empirical formula is
  (K0.56Ca0.04Na0.03[]0.37)Sigma1.00(Al1.54Mg1.38Cu0.03Zn0.03)Sigma2.98[Mg(H2O)6]2[(As0.99P0.01)O4]2[F4.46(OH)1.46O0.08]Sigma6.00*2H2O
  (general crystal-chemical formula
  [K1-x(H2O)x](Mg2-xAl1+x)[Mg(H2O)6]2(AsO4)2F6-y(OH)y*2H2O with x ~ 0.5, y ~ 1.5).
  Crystallizes in the monoclinic system, space group C2/m (#12), with single-crystal
  X-ray diffraction unit-cell parameters a = 12.474(5) A, b = 7.198(3) A, c = 13.724(6) A,
  beta = 99.518(13) deg, V = 1215.3(8) A3, and Z = 2 (refined from 6874 measured and 1325
  unique reflections collected at 293(2) K on a 0.070 x 0.040 x 0.020 mm crystal using
  MoKalpha radiation on a Bruker D8 Venture diffractometer to R1 = 0.0927 for 1022
  reflections with Fo > 4sigma(Fo), R1 = 0.1152 for all data, wR2 = 0.2574, GoF = 1.055,
  102 parameters, Table 3, where the h index range is printed as "-15 <=h15" with a
  missing "<=" symbol; Gandolfi-like CuKalpha powder X-ray diffraction refined with
  UnitCell, Section 3.3 and Table 2, gave a = 12.4760(18) A, b = 7.1974(11) A, c =
  13.7211(18) A, beta = 99.549(12) deg, V = 1215.0(2) A3). The crystal structure (Tables
  4-7 and Figures 3-4) comprises crandallite/elliottite-like heteropolyhedral {001}
  layers of corner-sharing (Mg,Al)(F,OH,O)6 octahedra at M(1) (4e, <M(1)-phi> = 1.939 A)
  and M(2) (2b, <M(2)-phi> = 1.937 A) decorated by As(1)O4 tetrahedra (4i, <As(1)-O> =
  1.676 A) and hosting split K(1) (2a) and K(2) (4i) cations in pseudo-hexagonal
  cavities, alternating along c with isolated interlayer Mg(3)(H2O)6 octahedra (4i,
  <Mg(3)-Ow> = 2.109 A, BVS = 1.94 v.u.) and split non-coordinated Ow(5a/5b/5c) H2O
  molecules linked by H bonds (note that Section 4.3.2 on pp. 43 and 45 cites BVS values
  of 5.14 v.u. for As(1) and 2.52 and 2.53 v.u. for M(1) and M(2), whereas Table 6 on p.
  45 lists 5.11, 2.54, and 2.54 v.u., respectively; and Section 4.3.3 on p. 46 states
  that "O(2) accepts H bonds from two Ow(2) groups", whereas Tables 6 and 7 show that O(2)
  accepts two H bonds from Ow(3) at 2.670(13) A while Ow(2) donates H bonds to O(1) at
  2.763(10) A). The six strongest observed powder X-ray diffraction lines (dobs in A
  (Iobs; hkl), Table 2) are 13.7 (s; 0 0 1), 5.48 (m; 1 1 1), 2.977 (m; 2 2 1), 5.98 (mw;
  -2 0 1), 3.581 (mw; 0 2 0, -3 1 1, 3 1 0), and 1.797 (mw; -6 2 1, 0 4 0). No biological
  or microbial interaction data are reported in the type mineralogical description.
