id: cmmmech:natural-graphite
name: Natural graphite
material_kind: commodity
description: >-
  Graphite of natural mineral origin considered as a commercial raw-material
  commodity. USGS Mineral Commodity Summaries 2026 distinguishes flake and
  high-purity, amorphous, and lump and chip forms in its natural-graphite chapter,
  and identifies synthetic graphite among competing materials. This record
  covers the natural-origin commodity rather than the carbon element, a mineral
  specimen or species identifier, synthetic graphite, or a particular battery
  product specification. Natural origin alone does not establish battery-grade
  suitability. The criticality entry records the named BGS/CMIC assessment;
  the report explicitly states that it does not constitute government policy.
  No microbial extraction, purification or recovery mechanism is asserted here.
