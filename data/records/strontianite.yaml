id: cmmmech:strontianite
name: Strontianite
material_kind: mineral
description: Strontianite is the orthorhombic strontium carbonate mineral SrCO3, an aragonite-group species
  distinct from Sr-substituted calcite, mixed calcium-strontium carbonates, celestine, elemental strontium
  and commercial strontium salts. The September 2026 IMA list gives grandfathered status and original-description
  year 1791, not a numbered approval accession. The curated experiment identifies strontianite in a laboratory
  bacterial coating on printed polymer; no mineral-specific criticality designation or industrial recovery
  claim is inferred.
