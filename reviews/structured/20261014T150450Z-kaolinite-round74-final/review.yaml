limitations:
- Iron host among kaolinite lattice, accessory phases and surface-associated material
  is unresolved; growth is indirect evidence rather than phase-specific iron release.
- Historical isolate identification is weak and lacks an accession; current taxon
  naming does not authenticate the isolate.
- Siderophore supernatants were pooled and estimates use a surrogate standard; no
  independent absolute concentration or causal necessity is established.
- Culture pH diverges among arms and cited earlier dissolution controls were not independently
  verified as part of this assay.
- No supplement is identified within the acquired original; bounded searches do not
  establish exhaustive absence of later studies or notices.
notes:
- This successor preserves the exact initial finding and source evidence; it does
  not overwrite the earlier needs_curation verdict. Issue 242 is scientifically resolved
  here, while GitHub disposition is handled by the publication coordinator.
- The entire corrected record and new history were read. Original full primary/authority
  assessment is retained; unchanged scientific fields were compared byte/structure-wise,
  and the affected source method was visually re-read. No new or repeated broad literature
  search is claimed.
- Reviewer authored separate variscite/strengite owners but did not author or edit
  kaolinite or its history. Initial finding was independently confirmed after curator
  self-check.
- Review start is the filesystem birth time of corrected native inspection; finish
  is actual successor construction time after terminal gate verification.
- Source inventory and original search boundaries remain those of the saved initial
  review; independent comparison and after-fix checks are additional evidence.
