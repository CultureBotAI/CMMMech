    url: https://doi.org/10.1128/AEM.66.11.5092-5098.2000
    accessed_on: '2026-10-15'
  - id: ngwenya2014
    title: >-
      Ngwenya BT, Magennis M, Podda F and Gromov A (2014). Self-preservation
      strategies during bacterial biomineralization with reference to
      hydrozincite and implications for fossilization of bacteria. Journal
      of the Royal Society Interface 11, 20140845. DOI 10.1098/rsif.2014.0845.
      Complete PMC text and original Figures 1-6 inspected; PDF routes
