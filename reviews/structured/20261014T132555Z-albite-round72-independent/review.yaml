limitations:
- The historical experiment is abiotic; it cannot establish microbial enhancement,
  isolated-product recovery or deployment.
- Hypothetical layer thickness and molecular complexes are model-dependent. Prior
  failures to detect a uniform layer and defect-localized dissolution are retained.
- Sequential medium changes and incorporation of earlier results must not be counted
  as independent replication; handpicked clevelandite lacks a new quantitative phase-purity
  assay.
- The bounded notice/conflict searches do not establish that all later literature
  has been exhausted.
notes:
- No supported corrective finding in this scope; no owner/history edits by reviewer.
- Structured source adapters for genes or transcriptomic modules are not applicable
  to these abiotic mineral claims.
