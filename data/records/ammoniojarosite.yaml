mechanisms:
- id: iron_oxidation_associated_precipitation
  name: Ammonium-dependent precipitation during microbial ferrous-iron oxidation
  process: biomineralization
  description: Iron-oxidizing cultures generated ferric iron from dissolved ferrous sulfate, with ammoniojarosite identified in the resulting precipitates at sufficient ammonium concentrations. The ammonium-concentration series used an enrichment dominated by A. ferrooxidans, not a verified pure strain. A separate temperature series used that enrichment, source-named Sulfolobus metallicus, or an unresolved thermophilic consortium. The demonstrated association with biological iron oxidation does not isolate a cell-specific nucleation mechanism.
  context: 'Wang et al., section 2.1 and Table 1: aerobic 100 mL cultures in 250 mL shake flasks used 120 mM FeSO4.7H2O, 1.6 mM MgSO4.7H2O, 5.4 mM NH4H2PO4 and 4.05 mM H2SO4, initially pH 2.3-2.6, with added ammonium sulfate and no potassium nutrient salt. The 36 degrees C concentration series tested 5.4-805 mM ammonium. The separate 165 mM ammonium temperature series used the MAF enrichment at 22 and 36 degrees C, the source-named S. metallicus culture at 45 degrees C, and consortium MT at 65 degrees C. NCBI species mappings do not identify a deposited experimental strain; the MT composition after enrichment at 65 degrees C was not established, so no taxa are assigned to it. Carbon came from ambient CO2. Precipitates were generally aged for one week, but the 22 degrees C product required about two months. They were centrifuged, washed twice with 5 mM sulfuric acid and dried at 65 degrees C for ten hours; elemental-analysis aliquots were additionally dried at 110 degrees C. Inoculum fraction,
    shaking speed and independent culture replication were not specified in the inspected methods.'
  microbial: true
