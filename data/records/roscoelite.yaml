id: cmmmech:roscoelite
name: Roscoelite
material_kind: mineral
description: Roscoelite is a vanadium-bearing mica mineral with the ideal formula KV3+2(Si3Al)O10(OH)2
  in the September 2026 IMA list. The list records status A and the special-procedure entry 1998
  s.p.; that entry is not an original discovery year or a conventional numbered approval. Blake's
  1876 description concerns natural mica from Granite Creek, El Dorado County, California, and explicitly
  corrects his initial chromium identification to vanadium. The species is distinct from vanadium
  as an element, generic vanadium-bearing mica, and mixed shale or ore feeds. Ito's synthetic material
  was assigned to roscoelite by powder diffraction indexed as a 1M mica; its mixed-valence, nonideal
  bulk chemistry and microscopic oxide inclusions must not be replaced by the ideal all-V3+ formula.
  No criticality designation is inherited from vanadium, and neither the natural occurrence nor abiotic
  synthesis establishes microbial extraction or industrial recovery.
