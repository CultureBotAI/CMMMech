  evidence:
  - source_ref: fritze2026
    supports: support
    explanation: Sections 2.1-2.3, Tables 1-2, Section 3.2 and Figures 2-3 support the feed-specific laboratory process. The source reports final leached fractions of 94% Ga, 68% As and 73% Fe at 3% sludge, versus 77% Ga, 66% As and 62% Fe in the acid-adjusted abiotic comparator. These percentages refer to each element's leaching yield, not a total sludge recovery fraction or isolated-product yield. Figure 3 shows biotic means and SD; numeric SD values are not inferred from pixels. Figure 2 supports incomplete ferric iron reduction in the leachate.
  - source_ref: fritze2026
    supports: partial
    explanation: Section 3.2 reports 86% gallium leached within the first day and attributes rapid release chiefly to low pH. It calls the abiotic controls simplified and requests replicated confirmation of microbial facilitation; Figure 2 displays nonidentical biotic and abiotic pH trajectories. The small arsenic endpoint difference does not establish a meaningful microbial advantage. Supplementary Figure S2, a separate 5% sludge assay, shows final biotic arsenic leaching below its acid-adjusted comparator; no numeric value is digitized here. These results do not support a universal microbial enhancement across loadings, elements or waste batches.
  - source_ref: fritze2026
    supports: partial
    explanation: The abstract's Al:Fe wording conflicts with the methods' Al:F; the selected flask dose follows Table 2 rather than the separate 1.4:1 optimization/reactor setting. Section 3.4 reports faster chemical processing at higher solids loading and discusses further iron reduction, silica removal and downstream precipitation as process-development issues. No selective microbial product isolation, product purity or commercial microbial operation is established for this feed.
