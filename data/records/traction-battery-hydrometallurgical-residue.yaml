  evidence:
  - source_ref: lu2025
    supports: support
    explanation: Sections 3.1.1–3.1.4 and Figures 1–4 show higher source-defined leaching ratios in inoculated arms than the 30-degree blank, with mixture composition, temperature and loading affecting the curves. Only the 30-degree single-culture comparison shares the blank temperature. Increasing solids loading generally lowered the final released fraction. Neither an independent temperature effect nor synergy among members is established by all comparisons. No percentage is adopted as a verified whole-process recovery yield.
  - source_ref: lu2025
    supports: partial
    explanation: Section 2.1 reports 0.8214% Ni in nickel residue and 0.4998% Co in cobalt residue, whereas original SI Table S1 reports 7209 ± 56 PPM Ni and 4093 ± 40 PPM Co for those respective feeds. The basis of the disagreement and uncertainty terms is unexplained. No reconciled inventory, normalized concentration observation or corrected extraction yield is inferred. Tables 1–2 and Figure 2 label MC40-25Ac, while portions of the prose and caption call it MC40-25AS; these are not treated as an additional consortium.
  - source_ref: lu2025
    supports: partial
    explanation: The abstract/conclusion assign 75.4% Co release to MC40-25St, Section 3.1.2 states 79.6%, and the loading discussion gives 82.9% at 10% loading. The text also claims a 1.18-fold improvement over a 72.3% single-culture result without consistent arithmetic. These source discrepancies preclude selection of a definitive optimized Co yield. Ni kinetics report 88.4%, while the separate BCR presentation reports 90.3% leached; the record does not silently equate these endpoints.
  - source_ref: lu2025
    supports: partial
    explanation: Section 2.4 and Figures 5–6 use operational BCR acid-soluble, reducible, oxidizable and residual fractions alongside a leached fraction. These are extraction categories, not verified mineral phases or oxidation states. No closed mass balance, recovered solid product, product purity, independent consortium authentication or industrial reactor performance is demonstrated. The supplier being industrial does not change the laboratory deployment scope.
  - source_ref: ncbi20261012
    supports: context_only
    explanation: Live species nodes resolve the five organism CURIEs and the historical Thiobacillus thiooxidans name to A. thiooxidans. ATCC 23270 and DSM 17362 appear among the respective type-strain links, but those links do not authenticate the cultures used. AS1 6358, BJMCC 01101 and CGMCC 1.15711 remain source-reported stock labels without an asserted collection CURIE or inferred causal assignment.
