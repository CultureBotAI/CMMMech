mechanisms:
  - id: recombinant_putida_defluorination
    name: Enantioselective hydrolytic defluorination by recombinant Pseudomonas
    process: other
    description: >-
      Pseudomonas putida ATCC 12633 engineered to constitutively express a
      Delftia acidovorans strain B defluorinase grew on two model fluorinated
      acids while releasing inorganic fluoride. Approximately half of the
      fluorine in each racemic substrate was released, consistent with
      preferential conversion of its S enantiomer. This is hydrolytic C-F
      bond cleavage, not fluorine reduction, universal PFAS degradation or
      isolation of a usable fluorine product.
    context: >-
      Laboratory recombinant culture grown with 20 mM racemic
      alpha-fluorophenylacetic acid or 2-fluoropropionic acid as sole carbon
      source in mineral salts basal medium. The medium had 40 mM
      sodium/potassium phosphate buffer at pH 6.8, ammonium chloride 1 g/L,
      trace metals and vitamins, and 50 micrograms/mL kanamycin for the
      recombinant strain. General flask methods specify 20 mL in 125 mL
      baffled flasks, 200 rpm, initial OD600 0.05-0.1 and growth at 28 or
      30 degrees C; the main methods do not assign one of those two
      temperatures unambiguously to each flask result. The separate
      96-well lag assay specifies 30 degrees C. Inocula were washed once
      and pregrown on mandelic acid or D-lactic acid, respectively. Fluoride
      was measured with an ion-selective electrode calibrated with NaF;
      OD600 and colony counts assessed growth and viability. Species
      taxonomy is grounded separately from the ATCC strain and its
      laboratory expression construct. The introduction's isolated 12663
      spelling conflicts with 12633 in Methods, Results and the culture
      authority; this record follows the latter. No fluorine-containing
      mineral, mixed environmental waste or industrial process was tested
      in the curated assays.
    microbial: true
    organisms:
      - id: NCBITaxon:303
        label: Pseudomonas putida
    evidence:
      - source_ref: dodge_2024
        supports: support
        explanation: >-
          Figure 2 and Table 2 show growth-associated fluoride release.
          Table 2 reports 9.9 +/- 0.1 mM fluoride from 20 mM racemic
          alpha-fluorophenylacetic acid and 9.9 +/- 0.2 mM from 20 mM
          racemic 2-fluoropropionic acid, with times to maximal OD600 of
          29 and 78 h, respectively. Values are means and standard
          deviations of three biological replicates; the authors report
          similar results in one independent repetition. The denominator
          is total racemic substrate: this is about half of its fluorine,
          not complete conversion or a recovered-product yield. Wild-type
          ATCC 12633 did not grow on these test acids in the stated tests.
      - source_ref: dodge_2024
        supports: support
        explanation: >-
          Purified-enzyme assays include substrate solutions without enzyme
          as spontaneous-release controls. Figure 3 and stereochemistry
          methods distinguish two experiments: polarimetry of residual
          alpha-fluorophenylacetic acid from a growing culture supported
          retention of the R enantiomer, whereas stereospecific lactate
          dehydrogenases identified D-lactate after purified-enzyme treatment
          of racemic 2-fluoropropionic acid. These observations support
          selective hydrolysis. The modeled active-site attack is an
          interpretation, not a new crystal structure or mutational proof.
      - source_ref: dodge_2024
        supports: partial
        explanation: >-
          Table 1 reports activities below 0.01 micromole/min/mg for tested
          difluorinated substrates and a fluoroolefin under its enzyme-assay
          conditions; these limits are not zero or proof about all PFAS.
          Table 2 shows lower final OD600 on fluorinated substrates than
          on the corresponding nonfluorinated products, and Figure 2F
          shows an initial colony-count decline before recovery. CrcB
          involvement is inferred from genomic comparison and other-strain
          literature, not a transporter knockout in this recombinant
          strain. Wild-type nongrowth is not itself a quantitative abiotic
          fluoride-release control for the flask cultures. Intracellular
          fluoride concentrations and an isolated fluoride product were
          not measured in these assays.
