id: cmmmech:vandenbrandeite
name: Vandenbrandeite
material_kind: mineral
description: >-
  Vandenbrandeite is the copper uranyl tetrahydroxide mineral
  Cu(UO2)(OH)4, distinct from elemental uranium, copper commodities
  and other copper uranyl minerals. The September 2026 IMA list
  gives grandfathered status G; 1932 is its original-description
  year, not an approval accession. Colmenero and colleagues refined
  a natural Musonoi, Democratic Republic of Congo crystal in
  triclinic P-1 at room temperature, including hydrogen positions
  obtained from difference-Fourier maps with soft O-H constraints.
  Their experimental structure and Raman spectrum are distinct
  from calculated elastic and thermodynamic properties. The
  natural Kalongwe material used for the earlier thermal study
  is a separate specimen population. No criticality designation,
  microbial mechanism or industrial recovery is inferred.
sources:
