- id: fungal_alkali_metal_mobilization_graph
  name: Aspergillus niger CexA-associated proposed organic-acid leaching and culture-associated Li, Rb, and Cs mobilization from Espey boron concentrator waste
  description: 'Causal pathway linking reviewed Swiss-Prot Aspergillus niger plasma-membrane MFS citrate exporter CexA (reviewed Swiss-Prot UniProtKB:A0A254TZW7 in NCBITaxon:5061 and UniProtKB:G3Y4N5 in ATCC 1015 NCBITaxon:380704, plus CBS 513.88 reference-proteome ortholog UniProtKB:A2R9K1 An17g01710 in UP000006706) to proposed organic-acid dissolution and complexation during 31-day shake-flask bioleaching of <38 um pulverized minus-25-mm solid waste from the Espey concentrator (Eti Mine Boric Acid Operation, Emet, Kutahya, Turkey; containing colemanite, muscovite, quartz, and dolomite by XRD in Figure 1, with feed Li, Rb, and Cs in Table 1) by an A. niger culture from Erzurum Technical University (7-day preculture on 100 g/L sucrose; 250 mL flasks with 100 mL medium, 2.5 mL spore suspension of unspecified concentration, and 1 g waste [1% w/v] autoclaved at 121 C for 15 min and incubated at 30 C and 125 rpm, sampled on days 4, 10, 13, 18, 24, and 31): reaching reported day-31 extraction
    of ~79% Li, 37% Rb, and 30% Cs (Figure 2, p. 4) in Ertan (2026) (*Journal of Anatolian Environmental and Animal Sciences* 11:1-8), while preserving the absence of uninoculated or matched organic-acid controls, unmeasured metabolite concentrations, day-24 Li text (43.71%) vs Figure 2 (~35%) conflict, Ertan (2023) pH citation overlap, and Figure 3d Rb kinetic ordinate discrepancy.'
