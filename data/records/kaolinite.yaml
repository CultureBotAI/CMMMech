  title: 'UniProtKB reference proteome UP001476583 (Ectopseudomonas mendocina, NCBITaxon:300): Pyoverdine export ATP-binding/permease protein PvdT (WG219_04650, UniProtKB:A0ABZ2RID1), TonB-dependent siderophore receptor (WG219_00765, UniProtKB:A0ABZ2RGC8), and Energy transducer TonB (WG219_08270, UniProtKB:A0ABZ2RK72).'
  url: https://www.uniprot.org/uniprotkb?query=(proteome:UP001476583)+AND+(accession:A0ABZ2RID1+OR+accession:A0ABZ2RGC8+OR+accession:A0ABZ2RK72)
