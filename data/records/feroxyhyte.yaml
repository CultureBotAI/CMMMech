mechanisms:
- id: cn32_feroxyhyte_reductive_transformation
  name: Culture-associated feroxyhyte reduction and condition-dependent secondary minerals
  process: redox_transformation
  description: Laboratory cultures reported as S. putrefaciens CN32 produced acid-extractable Fe(II) from synthetic feroxyhyte and secondary solids assigned to magnetite and chukanovite without added phosphate. AQDS accelerated the initial Fe(II) increase without a reported significant increase in the final amount in phosphate-free cultures. Phosphate additions in AQDS-containing cultures slowed initial Fe(II) production and changed the later phase distribution; the high-phosphate treatment yielded green-rust and vivianite assignments. These observations support conditional reductive transformation, not complete conversion of every Fe(III) atom to Fe(II), a demonstrated gene pathway or isolated iron recovery.
  context: Section 2.1 describes peroxide oxidation of synthetic Fe(OH)2 to feroxyhyte, followed by repeated washing, drying at 60 degrees C and grinding through a 200-mesh sieve; phase identity was checked by pXRD. Duplicate 160 mL serum bottles contained 100 mL defined mineral medium, 80 mM Fe(III) as feroxyhyte and 75 mM formate. Medium was adjusted to pH 7.5 before sterilization and addition of filter-sterilized reagents; this is not a controlled constant-pH trajectory. Inoculated bottles were argon-sparged and incubated on a roller drum at 30 degrees C in darkness. Late-log-phase cultures were added to approximately 5 x 10^9 cells/mL as printed. The 2021 paper delegates the complete basal-medium and inoculum preparation to earlier references; those inherited recipes were not reconstructed here. The named strain is mapped to CN-32, but Section 2.2 prints ATCC BAA-543 whereas the authority assigns CN-32 to BAA-453 and BAA-543 to Cellulomonas sp. ES5; this discrepancy remains an experimental-provenance
    limitation. Treatments were no added phosphate without or with 100 micromolar AQDS, and 500 micromolar or 5 mM phosphate with 100 micromolar AQDS. No phosphate-amended, AQDS-free arm was included. Total Fe(II) was measured by ferrozine after one-week HCl extraction of suspension, with extra acid for magnetite-containing samples; it is not dissolved Fe(II) alone. Anoxic handling, pXRD, SEM and selected Mossbauer fits characterized solids. Figure 23 includes a sterile-control diffraction trace, but a matched sterile Fe(II) time series and complete control amendment/time details are not supplied with these results.
