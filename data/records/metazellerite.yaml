id: cmmmech:metazellerite
name: Metazellerite
material_kind: mineral
description: >-
  Metazellerite (IMA 1965-032) is an IMA-accepted lower-hydrate calcium uranyl
  carbonate mineral with IMA September 2026 Master List formula
  Ca(UO2)(CO3)2·3H2O. Described by Coleman, Ross, and Meyrowitz (1966) from the
  oxidized zone of the Lucky Mc uranium mine, Gas Hills district, Fremont
  County, Wyoming, USA (and recognized in additional western United States
  deposits), where it forms as the chalky yellow dehydration product of
  zellerite (Ca(UO2)(CO3)2·5H2O) associated with gypsum, limonite, and iron
  disulfides. Orthorhombic (space group Pbn21 or Pbnm), with a = 9.718(5) Å, b =
  18.226(9) Å, c = 4.965(4) Å, V = 879.5(7) Å3, Z = 4, Dcalc = 3.414 g/cm3, and
  Gladstone-Dale calculated mean refractive index ncalc = 1.626.
identifiers:
  - id: IMA:1965-032
    label: Metazellerite
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC (Pasero M., 2026), The New IMA List of Minerals – A Work in
      Progress (Updated: September 2026), PDF p. 143, Metazellerite row: status
      A, IMA 1965-032, formula Ca(UO2)(CO3)2·3H2O, reference Coleman R.G., Ross
      D.R., Meyrowitz R. (1966) American Mineralogist 51, 1567-1578.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-24'
  - id: coleman_1966_metazellerite
    title: >-
      Coleman RG, Ross DR, and Meyrowitz R (1966), Zellerite and metazellerite,
      two new uranyl carbonates, American Mineralogist 51:1567-1578. Primary
      species description of metazellerite (IMA 1965-032) and zellerite from
      the Lucky Mc mine, Gas Hills district, Fremont County, Wyoming, USA;
      reports chemical analysis of the parent zellerite (Tables 1–2: CaO 10.8,
      UO3 56.6, CO2 13.0, H2O+ 6.6, H2O- 6.9, SiO2+insol. 0.5, R2O3 1.0, K2O 0.2,
      Na2O 0.4, total 100.2 wt%), orthorhombic Pbn21 or Pbnm unit cell of
      metazellerite (a = 9.718(5) Å, b = 18.226(9) Å, c = 4.965(4) Å, V =
      879.5(7) Å3, Z = 4), Dcalc = 3.414 g/cm3, ncalc = 1.626, and topotactic
      dehydration of zellerite to metazellerite.
    url: https://www.rruff.net/doclib/am/vol51/AM51_1567.pdf
    accessed_on: '2026-10-24'
mechanisms:
  - id: abiotic_topotactic_zellerite_dehydration
    name: Abiotic topotactic dehydration of zellerite to parallel-oriented metazellerite
    process: other
    description: >-
      Topotactic dehydration of orthorhombic zellerite (Ca(UO2)(CO3)2·5H2O, V =
      1065.4 Å3, Z = 4) into parallel-oriented crystallites of metazellerite
      (Ca(UO2)(CO3)2·3H2O, V = 879.5 Å3, Z = 4), losing 8 H2O molecules per
      unit cell (6.9 wt% H2O- at 110 ± 5 °C) and contracting unit-cell volume
      by 186 Å3 while preserving the orientation of crystallographic axes a, b,
      and c.
    context: >-
      Abiotic dehydration under low ambient relative humidity, X-ray beam
      exposure during Buerger precession single-crystal photography, and
      laboratory oven drying at 110 ± 5 °C; no microbial, enzymatic, or
      bioleaching mechanism was tested or reported in Coleman, Ross, and
      Meyrowitz (1966).
    microbial: false
    evidence:
      - source_ref: coleman_1966_metazellerite
        supports: support
        explanation: >-
          Buerger precession X-ray single-crystal photography and thermal drying
          at 110 ± 5 °C demonstrate that orthorhombic zellerite
          (Ca(UO2)(CO3)2·5H2O, V = 1065.4 Å3, Z = 4) dehydrates topotactically
          at low humidity or under X-ray exposure into parallel-oriented
          crystallites of metazellerite (Ca(UO2)(CO3)2·3H2O, V = 879.5 Å3, Z =
          4), releasing 8 H2O molecules per unit cell (6.9 wt% H2O- at 110 °C)
          and contracting the unit-cell volume by 186 Å3 while preserving
          crystallographic axes a, b, and c (pp. 1570–1575).
