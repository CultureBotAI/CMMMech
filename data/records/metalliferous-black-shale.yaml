mechanisms:
- id: heap1_acid_leaching_comparison
  name: Conditional acidophile-associated leaching with copper null results
  process: bioleaching
  description: Source-labelled Acidithiobacillus ferrooxidans Heap-1 cultures were associated with changed iron and manganese concentrations during acidic treatment of M-921 shale. The day-20 comparison does not show a copper advantage over abiotic treatment, and manganese enhancement depends on initial pH. These are solution observations, not isolated-metal yields or proof of a particular mineral-dissolution pathway.
  context: Anjum et al. obtained ore from PIEAS, originally from the source-spelled Turbella area, Pakistan. Oven-dried, ground material of source-reported particle size at or below 200 mesh was tested at 1% w/v in 250-mL shake flasks, 30 degrees C and 100 rpm, with uninoculated chemical controls. Table 3 compares initial pH 1.5, 2.0 and 2.5 with and without added ferrous iron; some media used 160 mM ferrous sulfate, but assignment of that dose to every endpoint arm is not explicit. Samples were centrifuged and filtered before metal analysis by atomic absorption; iron-speciation time courses used phenanthroline. Heap-1 is the ore assay culture, distinct from the three-strain growth comparison. The species identifier does not authenticate this local isolate. Leaching-flask replication, detection limits and a closed metal balance are not reported. Final pH and iron chemistry differ between arms.
