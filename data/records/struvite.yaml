id: cmmmech:struvite
name: Struvite
material_kind: mineral
description: Struvite is the (NH4)Mg(PO4)(H2O)6 mineral species, grandfathered in the September
  2026 IMA list with original-description year 1846. It is distinct from struvite-(K), dittmarite,
  elemental phosphorus or magnesium, and a recovered wastewater product that may contain multiple
  phases. The fungal experiment used processed struvite-bearing material from a water-treatment
  site and reuses Kang 2022 also represented under phosphorus and cerium; it is not an independent
  study. No constituent-element criticality is inherited.
