id: cmmmech:lazerckerite
name: Lazerckerite
material_kind: mineral
description: >-
  Lazerckerite (IMA 2022-113) is an IMA-accepted silver–lead–antimony–bismuth
  sulfosalt mineral belonging to the andorite branch of the lillianite homologous
  series (N = 4; 4,4L homologue, Strunz class 02.JB.40a, Dana class 3.04.15) with
  September 2026 IMA-CNMNC Master List ideal formula Ag3.75Pb4.50(Sb7.75Bi4)S24
  (PDF p. 122, status A; written Ag3.75Pb4.5(Sb7.75Bi4)S24 in the article title
  and Abstract, corresponding to Nchem = 4.00, Ag+ + (Sb3+,Bi3+) <-> 2Pb2+
  substitution degree L% = 93.75%, and Bi/(Bi+Sb) = 0.34; official IMA symbol
  Lzc, whereas Figs. 2 and 3 on p. 643 use label "Lze"; ideal composition Sb
  25.21 wt%, Pb 24.13 wt%, Bi 20.28 wt%, S 19.92 wt%, Ag 10.47 wt%, printed total
  100.00 wt%, arithmetic sum 100.01 wt%). Described by Pažout, Dušek, Sejkora,
  Plášil, Ilinca, and Dolníček (2024) from medieval mine dumps of the Staročeské
  pásmo Lode, Kutná Hora Ag–Pb–Zn ore district, Central Bohemia, Czech Republic
  (named after mining and assaying scholar Lazarus Ercker, 1528–1594; holotype
  polished section ST 48 deposited in the Department of Mineralogy and Petrology,
  National Museum in Prague, under catalogue no. P1P 11/2022, pp. 641–643).
  In the holotype sample (ST 48) it occurs as anhedral grains up to 0.6 x 0.3 mm
  in quartz gangue containing grains and lenses of pyrrhotite several mm in size
  (with no other base sulfides present), in association with terrywallaceite,
  Bi-rich jamesonite, and remnants of Ag,Bi-bearing galena (Fig. 2, p. 642); in
  other samples it forms replacement rims up to 100 um wide replacing earlier
  Ag–Pb–Bi–Sb phases along the sequence Ag,Bi-bearing galena -> terrywallaceite
  -> holubite -> lazerckerite followed by Bi-rich jamesonite needles along grain
  edges (Fig. 3, pp. 642–643), within the broader Kutná Hora Bi-sulfosalt
  crystallization sequence native Bi -> galena solid solution -> matildite ->
  izoklakeite/cosalite -> eskimoite/treasurite/vikingite -> gustavite -> Sb-rich
  gustavite -> staročeskéite/terrywallaceite -> holubite -> lazerckerite ->
  Bi-rich jamesonite (Section 2, pp. 642–643). Macroscopically steel-grey /
  lead-grey with a grey streak and metallic lustre, opaque, no observed cleavage,
  fluorescence, or internal reflections, and calculated density Dcalc = 5.920
  g/cm3 from the empirical formula, 5.960 g/cm3 from the ideal formula, and 6.001
  g/cm3 from the refined structural formula on the single-crystal cell (Abstract,
  p. 641, Section 3, p. 644, and Table 4, p. 646). In reflected light it is
  greyish-white with weak bireflectance and pleochroism (grey tints) and weak to
  moderate anisotropy (grey to bluish-grey rotation tints); reflectance values in
  air (Rmin, Rmax, 400–700 nm, Section 3, pp. 644–645, Table 1, Fig. 4; note
  Table 1 prints Rmax at 500 nm as "39-2" for 39.2%) at the four COM standard
  wavelengths are 36.1, 39.6% (470 nm), 34.4, 38.6% (546 nm), 33.7, 38.0% (589
  nm), and 33.1, 37.7% (650 nm). Mean of 5 WDS electron-microprobe point analyses
  on the holotype (JEOL JXA-8600 at University of Salzburg, 25 kV, 35 nA, 5 um
  beam, corroborated by CAMECA SX100 analyses at National Museum, Prague, 25 kV,
  20 nA, 2 um beam; Section 4, pp. 645–646, Table 2, p. 644) yielded Sb 24.91 wt%
  (range 23.93–25.30, SD 0.26), Pb 24.48 (23.92–25.21, SD 0.42), Bi 20.38
  (19.63–21.02, SD 0.57), S 20.12 (19.88–20.37, SD 0.14), Ag 10.12 (9.96–10.38,
  SD 0.14), Cu 0.06 (0.00–0.10, SD 0.04), Fe 0.02 (0.00–0.05, SD 0.02), Cd 0.02
  (0.00–0.07, SD 0.03), Se 0.02 (0.00–0.10, SD 0.03), Total = 100.13 wt% (range
  99.33–100.99, SD 0.71), giving on the basis of 44 apfu the empirical formula
  (Ag3.61Cu0.04)Sigma3.65(Pb4.55Fe0.01Cd0.01)Sigma4.57(Sb7.87Bi3.75)Sigma11.62(S24.15Se0.01)Sigma24.16
  in the Abstract (p. 641) and Section 4 (p. 646) (whereas Table 12 on p. 654
  prints
  (Ag3.61Cu0.04)Sigma3.65(Pb4.54Fe0.02Cd0.01)Sigma4.57(Sb7.87Bi3.75)Sigma11.62(S24.14Se0.01)Sigma24.15)
  and simplified formula (Ag,Cu)3.7(Pb,Fe,Cd)4.6(Sb7.9Bi3.8)Sigma11.7S24.
  Monoclinic, space group P21/c (no. 14), Z = 2, unit-cell type A of N = 4
  lillianite homologues (Sections 5–7, pp. 646–654, Tables 3–12, Figs. 6–13):
  single-crystal MoKalpha XRD refinement on a twinned 0.040 x 0.040 x 0.035 mm
  fragment (Oxford Diffraction Gemini with SuperNova CCD; twin domains 0.548(5)
  and 0.452(5) on (001); 2750 observed reflections with Iobs > 3sigma(I) out of
  5189 unique; Table 4 on p. 646 lists 26,345 measured reflections, Rint =
  0.0839, and GOF(all) = 2.097, whereas Section 5 prose on p. 646 writes 25,883
  measured reflections, Rint = 0.0852, and GOF = 2.10; R = 0.1063, wR = 0.1876,
  R(all) = 0.1769, wR(all) = 0.2050, GOF(obs) = 2.651) gives a = 13.2083(9) Å, b
  = 19.4595(8) Å, c = 8.4048(13) Å, beta = 90.032(7)°, V = 2160.3(4) Å3; the ten
  independent cation sites comprise bicapped trigonal-prismatic Pb1 and Pb2 (CN
  8), pure octahedral Ag10 and Sb8, and six mixed octahedral sites (Table 5 on
  p. 647 refined SOFs: M3 = 0.640(13) Sb + 0.360(13) Pb, M4 = 0.623(15) Sb +
  0.377(15) Bi, M5 = 0.577(14) Sb + 0.423(14) Bi, M6 = 0.487(15) Sb + 0.513(15)
  Bi, M7 = 0.382(13) Sb + 0.618(13) Bi, and M9 = 0.825(14) Ag + 0.125(14) Bi,
  corresponding to Table 4 structural formula Ag3.65Pb4.72Sb7.42Bi4.11S24,
  whereas Section 5 prose on p. 648 gives an EPMA-adjusted site-population
  formula summing to Ag3.61Pb4.54Sb7.87Bi3.75S24 and Section 7 prose on p. 650
  prints M9 with 0.835Ag + 0.125Bi) with a split sulfur site S9 (SoF = 0.5 in
  Table 5 on p. 647, with unsplit/shorter/longer bond distances denoted
  S9a/S9b/S9c in the Table 8 footnote on p. 651); because paucity of
  material precluded experimental powder XRD, the calculated powder pattern
  (Diamond 4, Table 3, p. 645) shows eight strongest reflections [dcalc in Å
  (Icalc; hkl)] at 3.3530 (100; -250), 2.9023 (39; -3-22), 2.9009 (37; 3-22),
  3.4071 (34; 1-32), 3.4079 (32; -1-32), 2.1012 (29; 004), 3.0027 (25; 3-12), and
  3.0043 (22; -3-12). Distinct from quatrandorite, terrywallaceite,
  oscarkempffite, clino-oscarkempffite, holubite, and staročeskéite; no
  criticality designation for lazerckerite itself, no microbial or biological
  mechanism, and no industrial recovery yield are asserted.
