      explanation: Representative Acidithiobacillus thiooxidans ATCC 19377 sulfide-quinone reductase (sqr) for cell-free sulfur-oxidizing culture supernatant leaching of Y, Ce, Lu, and Ga from discarded LED lamp powder by Acidithiobacillus thiooxidans PTCC 1717 in Nadi et al. (2025); individual sqr/tth genes were not mutated or directly assayed.
  - uniprot_accession: UniProtKB:A0A5P9XPU3
    entry_name: A0A5P9XPU3_ACITH
    protein_name: Tetrathionate hydrolase
    gene_symbol: tth
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:637390
      label: Acidithiobacillus thiooxidans ATCC 19377
    reference_proteome_id: UP000363590
    interpro_ids:
    - InterPro:IPR018391
    - InterPro:IPR002372
    - InterPro:IPR011047
    - InterPro:IPR015943
    pfam_ids:
    - Pfam:PF13360
    functional_role: Periplasmic tetrathionate hydrolase (tth) in Acidithiobacillus thiooxidans ATCC 19377 disproportionating tetrathionate into thiosulfate, elemental sulfur, sulfate, and sulfuric acid protons during sulfur bioleaching.
    annotation_note: Grounded to reference-proteome entry UP000363590 for type strain Acidithiobacillus thiooxidans ATCC 19377 (NCBITaxon:637390), representing Acidithiobacillus thiooxidans PTCC 1717 (NCBITaxon:930) in Nadi et al. (2025).
    evidence:
    - source_ref: nadi2025
      supports: partial
      explanation: Representative Acidithiobacillus thiooxidans ATCC 19377 tetrathionate hydrolase (tth) for cell-free sulfur-oxidizing culture supernatant leaching of Y, Ce, Lu, and Ga from discarded LED lamp powder by Acidithiobacillus thiooxidans PTCC 1717 in Nadi et al. (2025); individual sqr/tth genes were not mutated or directly assayed.
  evidence:
  - source_ref: nadi2025
    supports: support
    explanation: 'Materials and methods, Figures 2 and 5 and Table 5 support a conditional culture-derived lixiviant observation. At 10 g/L and three days, Table 5 reports extraction efficiencies of 43 +/- 0.86% Pr and 28 +/- 0.56% Nd for bioleaching. These are source-reported percentages, not independently reconstructed yields: Equation 1 defines its concentration denominator as residual powder and its numerator as initial solution, while calling a mass in kg pulp density. The intended inventory normalization is unresolved. No purified product or complete metal mass balance was measured.'
  - source_ref: nadi2025
    supports: partial
    explanation: Table 5 gives reagent-acid results of 0.0% Pr and 80 +/- 1.6% Nd, so the chemical comparator performs better for Nd. The 0.0% Pr token is not a verified analytical detection limit. Figure 9 shows unequal pH trajectories; its chemical-acid day-one pH near 3.1 also differs from the prose value 2.5. These comparisons do not isolate an EPS or enzymatic contribution from acidity and medium composition. A no-inoculum acid production control appears in Figure 1, but that is not a pH-matched control for the later lamp leaching.
  - source_ref: nadi2025
    supports: partial
    explanation: 'Quantitative inconsistencies remain: Table 6 instead labels the three-day result as Pr 46.76% and Nd 28.59%; the conclusion misnames its loading-response elements as Co and Pr, unlike Figure 2''s Pr and Nd. Figure 5 shows later Nd decline and a small later Pr maximum, so three days is not an uncontested optimum for every endpoint. Abstract wording that 5% inoculum produces the most acid differs from Figure 1 and the Results, which show slightly higher sulfate at 10%. Reported sulfate includes medium background and is not a corrected sulfur yield.'
  - source_ref: nadi2025
    supports: partial
    explanation: Figures 4 and 6-8 characterize changing residual material; FTIR, XRD and selected SEM-EDX regions do not independently prove that an iron layer caused declining Nd release, quantify bulk removal, or identify an enzyme, EPS complex or dissolved REE species. Nutrient inhibition, agglomeration, hydroxide precipitation and tetrad-effect explanations are interpretations, not separately isolated causes. The Scale up section discusses future options; it reports no larger LED trial, industrial deployment or techno-economic validation.
