  title: Pradhan, Heinonen-Tanski, Veijalainen, Peraniemi and Torvinen (2021). Phosphorus Recovery from Sewage Sludge Using Acidithiobacilli. International Journal of Environmental Research and Public Health 18:7135. DOI 10.3390/ijerph18137135. Complete 13-page original; methods sections 2.1-2.7, Figures 1-2 and Tables 1-6 inspected.
  url: https://doi.org/10.3390/ijerph18137135
  accessed_on: '2026-10-15'
