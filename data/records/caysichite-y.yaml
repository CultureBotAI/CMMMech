id: cmmmech:caysichite-y
name: Caysichite-(Y)
material_kind: mineral
description: >-
  A natural yttrium- and calcium-bearing silicate-carbonate mineral. The September
  2026 IMA list retains (Ca,Yb,Er)4Y4(Si8O20)(CO3)6(OH)(H2O)5·2H2O and records a
  1987 special-procedure renaming; that year is not an approval accession. The
  1974 original described Evans-Lou mine material from Quebec, Canada, formerly
  labelled UN-11 and UN-16, with type material deposited as Geological Survey of
  Canada collection 10402. Most analyses used hand-picked colourless crusts;
  a separate yellow grain contained an interstitial Y-rich material and a rim
  tentatively identified as synchysite-(Y), so its chemistry is not pooled with
  the colourless material. The 1978 refinement on a specimen supplied by Hogarth
  established orthorhombic Ccm21 symmetry and double-crankshaft silicate chains.
  Its Y/Ca/REE site assignments and OH/water distribution were model-based;
  hydrogen atoms were not located. A 2025 study of separate Ploskaya Mountain,
  Russia, material supports a related structure but explicitly leaves its
  species equivalence to the Canadian material unresolved: proposed dominant
  cations differ between sites. It proposes vacancy and carbonate-protonation
  models, without locating hydrogen, and requests renewed study of the type
  locality material. Its proposed formula does not replace the current IMA
  formula here. Published numerical formula and reflection-count discrepancies
  are retained in the source dossier rather than silently reconciled. Geological
  formation by alteration of hellandite remains an interpretation from textures
  and associations, not a demonstrated microbial process. No criticality-list
  designation, extraction yield or industrial deployment is asserted.
