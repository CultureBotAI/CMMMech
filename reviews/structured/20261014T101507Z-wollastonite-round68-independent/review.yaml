limitations:
- The natural bacterial-assay material has no independently established exact polytype
  or complete purity.
- Source loading, pH, unit and rate-summary discrepancies remain unresolved; numerical
  rates or a pooled enhancement are not adopted.
- Live/dead biomass and nutrient conditions are not uniformly matched, and independent
  reactor replication is unclear.
- This review assessed the bacterial claims, claim-bearing methods/results/figures
  and the full comment/reply; it did not recalculate the full 42-page paper's unrelated
  ligand dataset.
- No field efficacy, carbon sequestration or industrial product recovery is established.
notes:
- No supported corrective finding on the inspected frozen state.
- Bounded search does not certify absence of all other papers or corrections.
- Raw source artifacts remain outside Git; schema validation is not independent experimental
  replication.
