    Journal of Raman Spectroscopy 55:394-405. DOI 10.1002/jrs.6640;
    first online 15 December 2023. Complete institutional-repository
    article corroborated against publisher HTML: methods
    pages 396-397, F1 provenance Figure 2/page 398, semiquantitative
    F1 composition Table 1/page 399, spectra Figure 3/page 400.
    Computed La modes are distinct from measured spectra; Table 3
    experimental columns are VS17 and F2, despite nearby prose
    referring to F1. Section 4.3 generalizes a 985 cm-1 main band,
    whereas Figure 3 labels 983 cm-1; no exact universal peak
    assignment is imported. Additional underlying data were not acquired.
