id: cmmmech:cerianite-ce
name: Cerianite-(Ce)
material_kind: mineral
description: Cerianite-(Ce) is the cubic cerium dioxide mineral, with ideal formula CeO2. The IMA-CNMNC September 2026 list records renamed status Rn and the 1987 special-procedure action, not a sequential approval number. Natural material can contain thorium; this does not establish thorium in the experimental synthetic analogue. The accepted experiment produces a minor CeO2 phase by heating a fungal-conditioned phosphate/oxalate precursor, not by direct living-cell precipitation of cerianite. Elemental cerium criticality is not inherited by this mineral.
