id: cmmmech:hydrotalcite
name: Hydrotalcite
material_kind: mineral
description: Hydrotalcite is the magnesium-aluminium layered double hydroxide carbonate mineral Mg6Al2(OH)16(CO3)(H2O)4.
  The IMA-CNMNC September 2026 list gives approved status A and 2016 s.p., indicating a special-procedure
  action rather than a conventional sequential approval number. This species is distinct from the hydrotalcite
  group and from generic synthetic layered double hydroxides containing other metal ratios or interlayer
  anions. A Niue calcrete contains source-XRD-assigned hydrotalcite associated with optically interpreted
  biofilms; microbial formation is not demonstrated. Elemental magnesium or aluminium criticality is not
  inherited.
