id: cmmmech:monohydrocalcite
name: Monohydrocalcite
material_kind: mineral
description: Hydrated calcium carbonate mineral with ideal formula CaCO3·H2O, distinct from anhydrous calcite, vaterite and aragonite, magnesium carbonate minerals, calcium as an element and carbonate-bearing resources. The September 2026 IMA list gives grandfathered status and original-description year 1964, not a new-mineral approval accession. Laboratory phase-selective formation is curated without inheriting criticality from another material or asserting a critical-metal recovery application.
