mechanisms:
- id: mr1_silver_reduction
  name: Anaerobic culture-associated formation of elemental silver
  process: redox_transformation
  description: Growing Shewanella oneidensis MR-1 cultures transformed Ag(I)-bearing material to precipitates containing XRD-identified elemental Ag(0). This laboratory observation does not establish an isolated-product yield, complete conversion, or industrial recovery process.
  context: Defined chloride/phosphate-containing medium with 100 mM lactate and 20 mM fumarate, adjusted to pH 7.6 before sterilization; anaerobic incubation at 30 degrees C in the dark. General exposure methods add AgNO3 at nominal 1-400 micromolar Ag(I), with 10 mL inoculum added to 80 mL medium, and state six biological replicates. The separate XRD protocol specifies 1 L medium with 100 micromolar AgCl, no agitation, and 24 h incubation. This difference in stated starting salt is retained, not resolved by treating all added Ag as dissolved AgNO3. XRD samples were centrifuged, water-washed, and dried anaerobically.
  microbial: true
  organisms:
  - id: NCBITaxon:211586
    label: Shewanella oneidensis MR-1
