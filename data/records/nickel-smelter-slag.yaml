  evidence:
  - source_ref: munoz_blandon2010
    supports: support
    explanation: Pages 33 and 36-39, Tables 1-2 and Figures 4 and 7-9 establish feed provenance, culture and flask treatment. Table 9 on page 56 reports day-14 Ni extraction relative to total feed Ni as inoculated/control pairs of 13/13%, 12/12% and 11/10% for the no-added-iron, ferrous and grown-ferric-culture treatments, respectively. Corresponding total-Cu percentages are 8/5%, 8/7% and 4/4%. These source-reported values indicate a small or absent treatment difference under this design; they are not a statistically demonstrated equivalence or general impossibility of biological slag leaching. Percentages against the smaller aqua-regia-soluble fraction in the adjacent columns must not be presented as total-metal recovery.
  - source_ref: munoz_blandon2010
    supports: partial
    explanation: Figures 7-9 show elevated redox in inoculated arms, persistent dominant silicate peaks and minor peaks assigned to jarosite. These observations do not prove a unique nickel-release pathway or quantify secondary-phase mass. Separate respirometry on page 52 used washed cells, pH 2.2 glycine buffer and different loading; its oxygen consumption is not evidence of enhanced nickel release in the 14-day flasks. Duplicate assays are stated, but plotted dispersion, statistical tests, a complete metal mass balance and a killed-cell or inoculum-broth control are not provided for the leaching results.
  - source_ref: munoz_blandon2010
    supports: context_only
    explanation: Table 8 reports greater Ni extraction in a separate 48-hour chemical acid test at pH 0.5 than in the microbial flasks. Its loading, pH control and duration differ, so this is not a matched test of microbial efficiency. Static acid-curing experiments later in the thesis contain concentration-unit and total-versus-soluble reporting inconsistencies; their numerical yields are not assigned to this mechanism. Neither industrial origin of the feed nor proposed static processing establishes industrial bioleaching deployment.
