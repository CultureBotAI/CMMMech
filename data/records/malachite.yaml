    functional_role: NAD-dependent malate dehydrogenase (EC 1.1.1.37; locus CONPUDRAFT_126646) catalyzing oxidation of (S)-malate to oxaloacetate, supplying the direct oxaloacetate precursor for brown-rot fungal oxalic-acid biosynthesis and surface transformation of synthetic malachite (Cu2(CO3)(OH)2) into moolooite (copper oxalate hydrate).
    annotation_note: Grounded to reference-proteome entry in UP000053558 for Coniophora puteana RWD-64-598-SS2 (NCBITaxon:741705) as the sequenced strain representative for mechanism species Coniophora puteana (NCBITaxon:80637; tested isolate LE-BIN 1370). Serpula himantioides (NCBITaxon:80602) and Amyloporia xantha (NCBITaxon:1333629) lack UniProtKB proteomes, and basidiomycete oxaloacetate acetylhydrolase (oahA) homologs in TrEMBL (e.g., UniProtKB:A0A5M3MM75, UniProtKB:F8PSW8) are auto-annotated as Isocitrate lyase (EC 4.1.3.1) by PROSITE-ProRule PRU10119 due to shared PF13714 superfamily membership.
