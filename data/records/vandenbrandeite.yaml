mechanisms:
- id: abiotic_thermal_dehydroxylation
  name: Abiotic thermal dehydroxylation of natural vandenbrandeite
  process: other
  microbial: false
  description: >-
    Furnace heating of selected natural crystals produced progressive
    hydroxyl loss, fissuring and poorly crystalline intermediate
    material, followed by copper uranium oxide products at higher
    temperatures. The authors reported CuUO4 diffraction lines at
    900 degrees C together with weaker CuU3O10 and U3O8 reflections.
    This is laboratory thermal alteration of a mineral, not a
    demonstrated uranium separation or isolated pure-product recovery.
  context: >-
    The Kalongwe specimen from the then Shaba province of Zaire
    contained kasolite veinlets and inclusions. After water/acetone
    washing and stirring, small crystals were selected to reduce
    inclusions; EDAX still reported traces of Pb and Si. Heating
    was in air in a programmed furnace, with the stated treatment
    range 300-950 degrees C. Heated and unheated material was
    compared by IR, ESR, SEM/EDAX and powder XRD. Heating rate,
    dwell times, mass loading and replicate counts were not
    specified. The initial 21.00% Cu and 79.00% U values are
    metal-normalized EDAX proportions, not whole-mineral mass
    fractions or ore grades.
  evidence:
  - source_ref: botto2002
    supports: support
    explanation: >-
      Figure 4 compares original, 300, 600 and 950 degrees C
      infrared spectra with uranium oxide reference spectra.
      Figure 6 shows fissures in the 300 degrees C sample and
      subsequent morphological changes at 500, 700 and 950 degrees C.
      Page 181 reports poorly resolved diffraction at 600 degrees C,
      unsuccessful crystallization in the 500-700 degrees C interval,
      and CuUO4 with weaker CuU3O10 and U3O8 diffraction at 900
      degrees C. These product assignments are author-reported;
      the underlying powder patterns are not plotted in this article.
  - source_ref: botto2002
    supports: partial
    explanation: >-
      Pages 180-181 infer a topochemically directed process from
      spectroscopy, morphology and relatively homogeneous Cu/U
      distribution. This does not directly resolve an atomic
      reaction pathway or establish a pure product. Thermal
      characterization is incomplete: the abstract describes
      material as practically X-ray amorphous up to about 700
      degrees C, while page 180 says about 600 degrees C.
      Page 180 reports 9.04% mass loss at 250-380 degrees C,
      outside the stated lower furnace-treatment bound, without
      a corresponding raw TG curve or detailed measurement method
      for that value. It is not adopted as a calibrated onset,
      replicated yield or new quantitative observation.
  - source_ref: colmenero2019
    supports: context_only
    explanation: >-
      Room-temperature natural-crystal diffraction supports identity.
      The predicted temperature-dependent stability and peroxide
      reaction constants in this separate computational study do
      not experimentally validate the 2002 heating pathway or
      demonstrate performance in a spent-fuel repository. The
      calculated and experimental structures also use different
      axis settings as explicitly described on page 40713.
