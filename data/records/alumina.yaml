id: cmmmech:alumina
name: Alumina
material_kind: commodity
description: >-
  Aluminium oxide considered as a refined commercial material, used as feed for
  aluminium smelting and in nonmetallurgical applications such as ceramics,
  abrasives and refractories. This commodity is distinct from aluminium metal,
  aluminium hydroxide, bauxite ore and red mud. The broad commodity does not
  establish a particular crystalline phase or high-purity product specification.
  The EU designations explicitly name alumina as the intermediate processing
  form within the combined bauxite/alumina/aluminium value chain. No microbial
  mechanism is asserted here.
