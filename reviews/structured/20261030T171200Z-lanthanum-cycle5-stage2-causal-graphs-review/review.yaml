  summary: 'A. niger ATCC 1015 cultures produced supernatants that precipitated La supplied as soluble
    lanthanum chloride. Recovered crystals included lanthanum oxalate decahydrate; higher-La supernatant
    reactions also produced a phosphorus-containing phase. Microbial involvement is the prior fungal culture
    step. Chemical oxalic acid also precipitated La, so the experiment does not establish a requirement
    for living cells during precipitation or a unique biological precipitation reaction. Substrate-edge
    evidence (kang2019, supports: partial): Kang et al. (2019) demonstrate La2(C2O4)3·10H2O precipitation
    from 63-um-filtered A. niger AP1 supernatant (plus a phosphorus-containing phase at higher La loading),
    though fungal-supernatant oxalate concentration was not directly measured and 25 mM chemical oxalic
    acid comparators were not pH-matched. Product-edge evidence (kang2019, supports: support): Arsenazo
    III supernatant colorimetry (Figure 7a,c) and SEM/EDS, XRD, and FTIR (Figures 4, 8, and 9) confirm
    aqueous La depletion and La2(C2O4)3·10H2O crystallization.'
