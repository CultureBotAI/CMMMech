  evidence:
  - source_ref: niu2025
    supports: support
    explanation: Table 7 and section 2.3.5 report 81.63 +/- 2.51% arsenic leaching for C-Ats versus 44.74 +/- 2.94% for Ats at the stated selected conditions. Ats plus 1 g/L ascorbic acid gave 46.90 +/- 2.30%, and Ats plus 1 g/L humic acid gave 45.57 +/- 3.10%; those small differences alone do not establish separate reduction or chelation mechanisms. All four entries report tungsten loss as zero, with no assay detection limit. The claim of residual arsenic below 200 g/t is stated in the abstract and conclusion without a separate residual-solid assay or solids mass balance being presented.
  - source_ref: niu2025
    supports: partial
    explanation: Table 2 and section 2.2 compare 8 h, 50 degrees C, 5% mass/volume assays. Ats, sulfuric acid and oxalic acid started at pH 0.8; the alkaline comparator was 2% NaOH. Arsenic leaching was 35.30 +/- 1.47%, 1.50 +/- 0.70%, 20.55 +/- 1.83% and 80.62 +/- 3.74%, respectively. Tungsten losses were reported as zero, zero, 3.81 +/- 0.31% and 28.93 +/- 0.44%. Thus the alkaline arm removed more arsenic but lost more tungsten; the abstract's unqualified superiority claim for bioacid is not adopted. These chemical comparators do not include uninoculated culture medium processed and concentrated identically. They do not isolate the contributions of acidity, medium constituents and metabolites.
  - source_ref: niu2025
    supports: partial
    explanation: 'Sections 2.2–2.3 propose thiol-containing microbial metabolites attacking arsenic-oxygen bonds, citing earlier Niu2021 work. This paper does not directly identify or quantify those metabolites or demonstrate the proposed molecular reaction. Its explanation that decreasing pH promotes thiol deprotonation is not adopted as established chemistry. Tables 3–6 retain the condition dependence: higher solids loading lowered extraction, while 65 degrees C and 10 h individually gave more extraction than the selected 50 degrees C and 8 h conditions. The selected condition is not an unconstrained maximum. Repeated 44.74% Ats means have different reported standard deviations across Tables 3–7 and are not treated as a pooled estimate.'
  - source_ref: niu2025
    supports: support
    explanation: Methods 1.5–1.6 and Figure 3 distinguish spent catalyst, spent catalyst supplemented with V/W, and bioacid-treated catalyst supplemented with V/W. The last arm reached source-reported 100% NO conversion at 300 degrees C in a fixed-bed test using 0.1 g of 40–60 mesh material, 100 mL/min total gas, 5% oxygen, 0.1% each NH3 and NO, and nitrogen balance. No bioacid-only NO-conversion curve is supplied. The supplementation recipe omits exact loading amounts and final calcination temperature; drying was 110 degrees C for 6 h, followed by a 5 degrees C/min ramp and 3 h hold at the unspecified setpoint. Figure 2 shows anatase-like diffraction patterns before and after treatment; missing V2O5/WO3 peaks do not establish quantitative phase purity. No independently verified industrial reuse standard or field deployment is asserted.
  - source_ref: niu2025
    supports: context_only
    explanation: Table 1 identifies V, W, Ti, Ca, Fe and As in the studied feed and reports arsenic as 986.7 +/- 2.1 g/t. The Ti(K), Ca(K) and W(K) headings have an unexplained K designation under a common g/t unit, including Ti(K) 664.3 +/- 2.3. Those ambiguous entries are not converted into a normalized composition or reconciled by assumption. The industrial origin of the feed does not establish industrial use of the microbial treatment.
  - source_ref: ncbi_atcc19377
    supports: context_only
    explanation: The official entry resolves the exact ATCC 19377 taxon designation used in Methods 1.2. It supplies identity context only; no genome or independently authenticated experimental strain is inferred.
- id: alkaline_vanadium_tungsten_leaching
  name: Chemical alkaline leaching of vanadium and tungsten from spent SCR regions
  process: separation
  description: 'Sodium hydroxide transferred vanadium and tungsten from separately prepared yellow and gray regions of spent SCR catalysts into solution. The direction of the color-region difference was opposite for the two elements: yellow regions gave more vanadium extraction and gray regions more tungsten extraction. This is a separate abiotic laboratory study, not a control arm of Niu2025 or evidence of microbial metal recovery.'
  context: 'Su2020 Methods 2.1–2.3: only catalysts S3–S5 were spent; S1–S2 were fresh. Deposited solids were removed with 0.5 MPa compressed air, yellow and gray regions were manually separated, transition regions discarded, and samples hammered, vibration-milled, dried and sieved to less than 100 mesh. Methods specify 1.5 mol/L NaOH, 100 degrees C, liquid/solid ratio 15 with no explicit unit, 900 rpm and 120 minutes in a 50 mL Teflon tube in an oil bath; the conclusion instead states 240 minutes. That unresolved duration conflict prevents treating either value as uniquely verified. Actual liquid volume and solid mass are not given. Filtered leachates were analyzed by ICP-OES; feed V/W inventories were corrected using wet digestion rather than taken directly from XRF. Replicate counts and uncertainty for the plotted extraction percentages were not supplied.'
  microbial: false
  evidence:
  - source_ref: su2020
    supports: support
    explanation: 'Figures 2–3 and section 3.1: for spent S3, S4 and S5, yellow/gray vanadium leaching percentages were 66.8/42.1, 68.8/40.0 and 67.7/49.0, respectively; tungsten percentages were 38.0/44.6, 52.6/57.3 and 44.7/53.2. These are feed-inventory-normalized dissolved fractions, not product purity or isolated recovery yields. Fresh S1–S2 results and the prior studies summarized in Table 1 are not assigned to the spent-feed experiment.'
  - source_ref: su2020
    supports: partial
    explanation: Table 2 gives oxide-equivalent bulk composition, not mineral-phase fractions. Figure 4 identifies anatase diffraction and notes that undetected V/W phases may be noncrystalline or below detection. Figures 5–9 and Table 4 support associations with surface composition, fitted V oxidation-state fractions and V-W-Ti interactions. The proposed causal explanations for color-dependent extraction were not independently isolated experimentally. Different source feeds, surface sampling and preparation constrain generalization. No downstream V/W product isolation or industrial leaching campaign was reported.
