id: cmmmech:millerite
name: Millerite
material_kind: mineral
description: Millerite is the trigonal NiS mineral species, distinct from hexagonal alpha-NiS, hydrated or unresolved nickel-sulfide precursors, elemental nickel and mixed ores. The September 2026 IMA-CNMNC list gives grandfathered status and original-description year 1845; that year is not a unique approval accession. The curated mechanism concerns a synthetic mineral-assigned component of laboratory precipitates. No nickel criticality designation or industrial deployment is inherited.
