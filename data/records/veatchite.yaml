id: cmmmech:veatchite
name: Veatchite
material_kind: mineral
description: >-
  Veatchite is the strontium borate mineral species with ideal formula
  Sr2B11O16(OH)5·H2O in the September 2026 IMA-CNMNC list, with
  grandfathered status G and original-description year 1938. That year
  is not a sequential approval identifier. Its three named polytypes
  are veatchite-1A, veatchite-1M and veatchite-2M, historically called
  veatchite-A, p-veatchite and veatchite, respectively. These are not
  three separate species owners. Veatchite is distinct from elemental
  strontium or boron, the borates commodity, and the Ca-Sr-ordered
  species calcioveatchite, SrCaB11O16(OH)5·H2O.
  Grice and Pring (2012) determined the structures of separate natural
  specimens using single-crystal X-ray diffraction: NMNH 145911 from
  Emet, Turkey, for triclinic 1A with space group P-1; NMNH 113264
  from Reyershausen, Germany, for monoclinic 1M with P21; and RG701/1
  from Sussex, New Brunswick, for monoclinic 2M with Cc. The last
  specimen replaced the preserved California type crystal and must not
  be attributed to that type locality. Borate layers and their stacking
  distinguish the polytypes; the authors caution that their powder
  patterns alone do not satisfactorily distinguish them. Hydrogen
  positions were located by difference Fourier maps and refined, but
  no new chemical analyses were performed on the two type specimens.
  The paper's 2M Sr/Ca refinement has a slightly Ca-dominant smaller
  cation site and is explicitly discussed as potentially a new species;
  it is not a pure Sr end-member measurement. Pekov et al. (2024)
  subsequently establish the distinct calcioveatchite species and
  emphasize site occupancy in the boundary with veatchite. They do
  not directly reanalyse the 2012 RG701/1 crystal, so its exact modern
  species assignment remains a specimen-level qualification here.
  The three original AM-12-015 deposited CIF models have now been
  inspected. Their correspondence to the paper's polytypes is inferred
  from the publisher association, cell metrics and structural data;
  the files do not explicitly identify the museum specimens. The
  deposited 2M model pairs Ca1 with Sr1 and Ca2 with Sr2, but its
  occupancies and refinement details differ from the printed Table 2c.
  Deposited and printed cell values also differ. The files contain
  neither observed reflection tables nor original refinement
  instructions, so they do not establish an authoritative correction
  of the printed values or a modern reassignment of RG701/1.
  The 2012 temperature/pressure associations are geological
  interpretations with unknown precise parameters, not controlled
  polytype-transition experiments. Natural mineral characterization
  and geological occurrence do not establish microbial activity,
  boron recovery, industrial deployment or a jurisdiction-specific
  criticality designation.
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC, The New IMA List of Minerals, September 2026: PDF
      page 228, Veatchite row; page 35, distinct Calcioveatchite row;
      page 1, status/year definitions. Fresh official PDF acquired
      and relevant rows visually checked on 15 October 2026.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-15'
  - id: grice2012
    title: >-
      Grice JD and Pring A (2012), Veatchite: Structural relationships
      of the three polytypes, American Mineralogist 97, 489-495,
      DOI 10.2138/am.2012.3889. Complete seven-page publisher
      original acquired from RRUFF. Table 1 and Material studied
      p. 489; diffraction methods p. 490; site occupancies and
      boundary discussion Table 2c and p. 491; structures Figures
      1-4; geological interpretation p. 494. Original separate
      deposit AM-12-015 is cited below. Abstract/Table 1
      disagree on the 1M c parameter and 1A beta uncertainty;
      deposited and printed cell/refinement values also differ.
      Those numerical values are not selected here.
    url: https://doi.org/10.2138/am.2012.3889
    accessed_on: '2026-10-20'
  - id: grice2012_deposit
    title: >-
      Mineralogical Society of America, April 2012 Deposit Items,
      AM-12-015 associated with Grice and Pring, p. 489. All three
      linked files Grice_p489_12_CIF1.txt, Grice_p489_12_CIF2.txt
      and Grice_p489_12_CIF3.txt acquired and inspected on
      20 October 2026: cell/symmetry metadata, atom-site and
      anisotropic-displacement loops. CIF3 rows Sr1/Ca1 and
      Sr2/Ca2 establish the deposited site pairing; its numerical
      occupancies differ from printed Table 2c. Explicit museum
      identifiers, observed reflection tables and original
      refinement instructions are absent from these three files.
      The deposit is not treated as an authoritative corrected
      final refinement or specimen-level species reassignment.
    url: http://www.minsocam.org/MSA/AmMin/TOC/2012/Apr12_Data/Apr12_Data.html
    accessed_on: '2026-10-20'
  - id: pekov2024
    title: >-
      Pekov et al. (2024), A New Mineral Calcioveatchite,
      SrCaB11O16(OH)5·H2O, and the Veatchite-Calcioveatchite
      Isomorphous Series, Minerals 14, 901,
      DOI 10.3390/min14090901. Complete 18-page publisher PDF:
      nomenclatural history pp. 1-3; specimens/methods pp. 3-6;
      chemical analyses Table 1 and Figure 6 p. 8; site occupancies
      Table 4 pp. 10-11; species boundary and Penobsquis comparison
      sections 5.1-5.2 pp. 14-16. Used for modern species boundaries,
      not as a reanalysis of Grice and Pring's exact crystals.
    url: https://doi.org/10.3390/min14090901
    accessed_on: '2026-10-15'
