id: cmmmech:graphite-anode-material
name: Graphite anode material for lithium-ion batteries
material_kind: commodity
description: Graphite raw-material products manufactured and supplied as active material
  for lithium-ion battery negative electrodes. This end-use commodity family is a
  subset of the broader graphite commodity family, not a second disjoint graphite identity;
  no single origin or numerical qualification threshold is assigned to all members.
  SGL Carbon describes synthetic graphite anode materials with properties tailored to
  customer applications and distinguishes them from carbon-silicon composites and conductive
  additives. The record excludes complete electrodes, electric-arc-furnace electrodes
  and spent battery waste. SAMR names the product standard GB/T 24533-2019 for graphite
  negative-electrode materials, but its full technical tables were not inspected. Manufacturer
  use and testing descriptions establish product context, not a universal battery-grade
  purity rule or a microbial recovery result. No criticality designation is generalized
  from the broader graphite record.
