mechanisms:
- id: synthetic_thermal_dehydration
  name: Abiotic thermal dehydration of synthetic studtite
  process: other
  microbial: false
  description: >-
    Heating synthetic studtite produced metastudtite and subsequently
    X-ray-amorphous uranium-bearing products. Observed transitions
    depended on measurement times and heating history. Loss of
    interstitial water and an inward-moving reaction front are
    structural and kinetic interpretations, not direct imaging of
    a unique molecular pathway or universal transition temperatures.
  context: >-
    Spano et al. combined equal volumes of 0.5 M uranyl nitrate and
    30 percent H2O2, added dropwise, then vacuum-filtered the settled
    precipitate, rinsed it with three 50 mL portions of deionized
    water and dried it in ambient conditions. PXRD and Raman samples
    were heated in air from approximately 25 to 250 degrees C, with
    observations every 5 degrees C. Nominal rates were 1, 2, 5 and
    10 degrees C/min. The one-hour PXRD scans reduced effective
    rates to 0.075-0.080 degrees C/min; Raman effective rates were
    0.830, 1.419, 2.470 and 3.283 degrees C/min. Separate approximately
    25 mg TGA samples used continuous argon, a 30-minute equilibration
    at 25 degrees C, and uninterrupted nominal heating rates.
  evidence:
  - source_ref: spano2020
    supports: support
    explanation: >-
      Proof pages D-F and H-L, Figures 3, 5-7, 10-11 and 14 support
      the studtite-to-metastudtite sequence. PXRD-based partial least
      squares regression placed the product-dominant crossover near
      45-50 degrees C under long measurement dwell times; Raman
      crossovers were 62.1-67.6 degrees C across the nominal rate
      series. These are model-derived crossovers, defined as more
      product than reactant, not first appearance or phase-pure yields.
      The Raman series is not strictly monotonic: its nominal
      1 degrees C/min crossover exceeded the 2 degrees C/min value.
  - source_ref: spano2020
    supports: partial
    explanation: >-
      Page I and Figure 11 report a first-stage TGA mass loss of
      9.6 percent only at 1 degrees C/min; faster runs retained more
      mass. The authors interpret this as incomplete dehydration,
      not equal production of pure metastudtite at every rate. Mixed
      products persisted at 250 degrees C and their exact composition
      was unresolved. Figure 3 gives approximately 0.078 degrees C/min
      for a nominal 1 degrees C/min PXRD run, while Table 1 gives
      0.075; Figure 4's caption says 44.07 degrees C although its
      plotted vertical line is near 47 degrees C. These discrepancies
      preclude an exact universal crossover from those captions.
- id: peroxide_surface_phase_succession
  name: Abiotic studtite formation during peroxide exposure of U3O8
  process: other
  microbial: false
  description: >-
    Studtite became the principal identified alteration product on
    synthetic U3O8 surfaces after an early metastudtite-rich stage.
    Dissolution and reprecipitation were proposed to explain this
    succession; direct solid-state rehydration of isolated metastudtite
    was not demonstrated.
  context: >-
    Chamberlain et al. exposed separate approximately 50 mg alpha-
    and beta-U3O8 powders to 50 mL solutions with measured initial
    H2O2 concentrations 0.16 M, 0.0030 M or 0.000054 M. Beakers
    prepared in ambient atmosphere were sealed with parafilm between
    sampling. Water-only U3O8 and peroxide-only controls were included.
    Test strips indicated approximately pH 6.5; a numerical incubation
    temperature was not specified. Approximately 1 mg solid aliquots
    were air-dried for at least four hours before Raman and SEM
    analysis at ten time points from day 1 through day 83. Fifteen
    randomized Raman spots per sample are subsamples, not fifteen
    independent reaction vessels.
  evidence:
  - source_ref: chamberlain2025
    supports: support
    explanation: >-
      Figure 4 and Tables S-2-S-4 and S-6-S-8 show metastudtite as
      the largest alteration-phase contribution on day 1 and studtite
      as the largest from day 8 onward in the peroxide-added arms.
      U3O8 itself often remained the largest total spectral component,
      especially at low peroxide; this is not complete bulk conversion.
      Table S-2 illustrates the fitted normalized surface-spectral
      contributions for alpha-U3O8 in 0.16 M H2O2: metastudtite
      0.49734 on day 1 and 0.0225 on day 8, with studtite 0.04102
      and 0.85713, respectively. These are PLSR contributions,
      not mass fractions, recovery percentages or independent yields.
  - source_ref: chamberlain2025
    supports: partial
    explanation: >-
      Pages 10-11 limit the analysis to surfaces because bulk PXRD of
      each reacted aliquot was not feasible. Pages 15 and 21-22 propose
      dissolution/reprecipitation but do not isolate its contribution
      from continuing U3O8 alteration. Air drying and model-reference
      selection also limit an in-solution phase assignment. Tables S-5
      and S-9 contain small nonzero fitted alteration components in
      water controls; SEM showed no corresponding obvious morphological
      alteration. Residual spectra include an unidentified feature near
      620 cm-1 in fewer than ten reported spectra. Accordingly, the
      observations narrow any universal irreversibility claim without
      proving direct reversible hydration or an industrial process.
