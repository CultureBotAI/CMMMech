  evidence:
  - source_ref: song2018
    supports: support
    explanation: Figures 5-7 and Table 1 report similar Fe(II) oxidation trajectories but collected dry masses of 0.89, 0.96 and 1.29 g for conventional, detached-but-retained, and detached-and-removed treatments, respectively. Table 1 reports BET areas of 68.23, 56.76 and 86.43 square meters/g for those arms. These are precipitate properties, not purity-corrected mineral yields or metal recovery percentages.
  - source_ref: song2018
    supports: partial
    explanation: Supernatant removal also changes dissolved constituents and the handling treatment; there is no purified-polymer add-back or independent viability assay that isolates the proposed cause. Organic carbon was used as an extracellular-material proxy, and Figure 5a labels its concentration mg/L whereas Section 3.4 prints mg/mL; no reconciled concentration is adopted here. The hydroxyl coefficients in Table 1's calculated formulas also do not follow the article's stated Fe8O8(OH)8-2x(SO4)x relation. Those formulas are not used as mineral identity or stoichiometric proof.
