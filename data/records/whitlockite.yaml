id: cmmmech:whitlockite
name: Whitlockite
material_kind: mineral
description: Whitlockite is a calcium-magnesium hydrogen phosphate mineral. The September 2026 IMA list gives ideal Ca9 vacancy Mg(PO3OH)(PO4)6 and grandfathered status G with original-description year 1941; the vacancy is a structural site and the year is not an approval accession. It is distinct from beta-tricalcium phosphate, apatite minerals, amorphous calcium phosphate and phosphate resources. The curated microbial experiment reports a whitlockite-assigned product but explicitly retains Mg-stabilized beta-TCP as an alternative assignment; this record does not assert unambiguous phase purity. No constituent criticality is inherited.
