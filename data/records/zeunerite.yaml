id: cmmmech:zeunerite
name: Zeunerite
material_kind: mineral
description: Zeunerite is the copper uranyl arsenate mineral Cu(UO2)2(AsO4)2(H2O)4·8H2O in the September
  2026 IMA list, with grandfathered status G. The year 1872 denotes its original description, not a numbered
  IMA approval. Its ideal twelve-water composition is distinct from eight-water metazeunerite, phosphate
  torbernite, calcium meta-autunite and elemental uranium, copper or arsenic. Synthetic-crystal X-ray
  diffraction and a later partially deuterated synthetic-powder neutron study support P4/nnc models under
  their respective conditions. Hydrogen positions and disorder are model-dependent; these experiments
  do not establish natural-specimen homogeneity, long-term containment, a universal dehydration threshold
  or an extraction yield. No criticality or microbial activity is inferred from composition.
sources:
- id: ima_2026_09
  title: 'IMA-CNMNC. The New IMA List of Minerals, September 2026. Zeunerite row, PDF page 240: Cu(UO2)2(AsO4)2(H2O)4·8H2O,
    G, 1872; definitions on page 1. Current authority PDF acquired and row visually checked.'
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
