id: cmmmech:vaterite
name: Vaterite
material_kind: mineral
description: Calcium carbonate mineral with ideal formula CaCO3, distinct from calcite, aragonite, amorphous
  calcium carbonate, calcium as an element and commercial calcium carbonate products. The September 2026
  IMA list gives approved status and 1962 special-procedure notation; this is not a new-mineral accession.
  The curated laboratory evidence concerns vaterite assigned in processed mixed solids from one geothermal-brine
  experiment, without a pure-phase yield or inherited lithium criticality designation.
