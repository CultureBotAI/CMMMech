    url: https://pureportal.spbu.ru/files/141550754/2025_caysichite_Y.pdf
    accessed_on: '2026-10-16'
mechanisms:
  - id: abiotic-thermal-decomposition
    name: Laboratory heating of natural Canadian caysichite
    process: other
    description: >-
      Heating caused mass loss and an end product with an apatite-type
      diffraction pattern. Dehydration followed by two decarbonation
      stages was the original authors' interpretation, without evolved-gas
      identification or a chemically established final apatite species.
    context: >-
      The 1974 study used four different hand-picked natural samples;
      this is not a reported set of four replicate TGA runs. Figure 3
      specifies TGA in air at 12 degrees C per minute, ending at
      1120 degrees C. Figure 4 instead specifies DTA in CO2 at
      10 degrees C per minute. A separate static-heating sequence in air
      used 15 minutes at 350 degrees C, 15 minutes at 550 degrees C,
      and 50 minutes at 1100 degrees C. Thermal aliquot masses, quantified
      purity and analytical uncertainty were not supplied. These
      laboratory observations do not establish recovery of a rare-earth
      product or operating conditions for industrial treatment.
    microbial: false
    evidence:
      - source_ref: hogarth1974
        supports: support
        explanation: >-
          The thermal section p.296 and Figure 3 report TGA losses of
          8.3 percent over 290–580 degrees C, 10.6 percent over
          580–895 degrees C and 5.3 percent over 895–1120 degrees C.
          The reported total is 24.3 percent, whereas the rounded stages
          sum to 24.2 percent; neither value is silently substituted.
          The body attributes an apatite-structure diffraction pattern
          and swelling without melting to the end product. Static-heating
          cumulative losses were 2.84, 9.37 and 24.85 percent at the
          three successive conditions; these are not separate extraction
          efficiencies or combined with the TGA series.
      - source_ref: hogarth1974
        supports: partial
        explanation: >-
          The assignments of the three TGA stages to water and then CO2
          loss are expressly tentative in the body. Separate DTA peaks
          include 431 and 801 degrees C, with minor high-temperature
          events. The abstract calls the 1120-degree product a DTA
          product, whereas the thermal paragraph describes it with TGA;
          the exact product-arm attribution is therefore uncertain.
          No final-product chemical analysis, phase fraction, evolved-gas
          measurement, elemental balance or isolated REE recovery is reported.
