limitations:
- QEMSCAN-only ore assignment does not establish heterogenite purity, abundance, polytype
  or mineral-specific dissolution kinetics.
- One column per reported arm and changed circuit/curing conditions constrain causal
  comparisons; the cobalt assay schedule and agglomeration-acid recipe remain incomplete.
- No organism or microbial mechanism is supported by the accepted experiment. Deferred
  microbial originals were not substituted with abstracts.
- No supplement is announced in the inspected ten-page conference original; this is
  not an exhaustive archive search.
- Bounded correction/counterevidence screening is not a global completeness claim.
  Structural checks do not establish scientific truth or replace laboratory replication.
notes:
- No owner or history changes by this reviewer; no finding disposition is silently
  changed.
- All accepted source and authority/database evidence has an exact nonempty local
  artifact and SHA256. Source uncertainties remain limitations, not fabricated corrective
  findings.
