id: cmmmech:spent-hydrocracking-catalyst
name: Spent hydrocracking catalyst
material_kind: secondary_resource
description: Used refinery catalyst from hydrocracking, which combines cracking and hydrogenation
  of hydrocarbon feeds. This secondary-resource class is distinct from spent fluid catalytic
  cracking catalyst, automotive catalyst and the broader category of all hydroprocessing catalysts.
  The selected Thai refinery material was decoked before laboratory leaching; its composition
  is not a universal catalyst formulation, and no constituent-element criticality is inherited.
sources:
