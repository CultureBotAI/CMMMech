mechanisms:
- id: abiotic_hydrothermal_face_dissolution
  name: Abiotic dissolution and etch-pit development on an orthoclase cleavage surface
  process: other
  microbial: false
  description: A polished (001) surface developed diamond-shaped etch pits while its exposed surface retreated
    during alkaline hydrothermal reaction. AFM tracked pit morphology and VSI measured retreat relative
    to a masked reference. Numerical extrapolations about long-term surface area, pit-wall reactivity
    and defect effects are model results, not directly measured extraction yields.
  context: Chapter XII studied a natural Afghanistan orthoclase crystal with no minor phases detected
    by XRD or SEM. The final journal specifies Rietveld identification and composition K0.75Na0.22Fe0.01Al0.98Si3.02O8.
    A partly masked sample in a titanium mixed-flow reactor reacted at 180 degrees C and 50 bar for up
    to 4.8 days in NaOH/AlCl3 solution, with in-situ pH 9.0 ± 0.1 and inlet Al 3.8 ± 0.2 ppm. The run
    was interrupted at 0.75, 1.56, 2.21 and 4.80 days for surface measurements. These are repeated observations
    of one run; approximately fifty pits per time point are not fifty independent reactor experiments.
  evidence:
  - source_ref: pollet_thesis2016
    supports: support
    explanation: Chapter XII Methods pp.189–194, Tables XII.1–2 and Figures XII.1–5 directly document
      the specimen, apparatus, chemistry, diamond pit morphology and increasing surface retreat. Pit depth
      and wall angle tend to stabilize while lateral extent grows. A non-wetted masked area supplies the
      surface-height reference; this is an abiotic experiment without an organism or a biotic comparison.
  - source_ref: pollet_thesis2016
    supports: partial
    explanation: Chapter XII pp.198–209, Figures XII.5–12 and Table XII.3 separate observed topography
      from a fitted elementary-cell model. Initial surface rounding required an empirical correction,
      and polishing may have introduced defects. Long-term stabilization and more reactive pit walls are
      model-dependent interpretations limited to the studied face and conditions. Modelled surface-area
      changes are not measured mass recovery or independent validation of a universal feldspar mechanism.
  - source_ref: pollet_journal2016
    supports: context_only
    explanation: Final article Methods 2.1–2.4 corroborate XRD/Rietveld specimen assignment, composition,
      conditions and repeated-time sampling. The thesis chapter states its article was to be submitted
      in July 2016 and is the same study, not independent replication. The chapter's original tables and
      figures support the accepted bounded observations; complete final-journal image equivalence and
      any unacquired supplemental materials are not asserted. No microbial potassium release, purified
      product or industrial deployment is established.
