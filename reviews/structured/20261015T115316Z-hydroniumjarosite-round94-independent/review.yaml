    dried at 120 °C; alumina was added only for synthetic-powder refinement. Natural
    sample 7-13-2-1 contains quartz and minor K/Na. Refined sample-A A-site occupancy
    0.92(1) is distinct from full iron occupancy. Table 1 trace-potassium/formula,
    natural formula/occupancy and reagent sulfate-token conflicts remain unresolved.
    Figure 3 is solid yield and sulfur-normalized partitioning, not recovered-iron
    efficiency. Hydrogen positions and charge compensation were not directly determined
