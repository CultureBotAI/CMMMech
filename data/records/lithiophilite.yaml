id: cmmmech:lithiophilite
name: Lithiophilite
material_kind: mineral
description: Lithiophilite is the lithium manganese(II) phosphate mineral LiMn2+(PO4), listed by IMA-CNMNC
  in September 2026 as grandfathered with original-description year 1878, not an approval identifier.
  It is distinct from Fe2+-dominant triphylite, synthetic battery materials of unspecified phase and oxidized
  lithium-deficient group members. Losey2004 measured natural Mn-rich crystals from the Bennett Quarry,
  Maine, and Fillow Quarry, Branchville, Connecticut, using microprobe and single-crystal diffraction
  in orthorhombic space group 62 (Pbnm setting; Handbook Pmnb is another setting). Natural samples contain
  substitutional Fe and are not pure endmembers. Lithium in that study was constrained or assumed rather
  than independently measured. The separate Schmid-Beurmann2013 oxidation assay used a laboratory-synthesized,
  diffraction-assigned LiMnPO4 powder and found no detected phase or lattice change under one specified
  treatment. That conditional null does not establish universal resistance to lithium dissolution. Neither
  source demonstrates microbial transformation, isolated lithium recovery or inherited criticality.
