  summary: 'The authors'' selected olivine-only powder released Mg and Ni in both cell-containing and
    cell-free Gluconobacter oxydans biolixiviant experiments. Direct cultures had higher final filtrate
    Mg than the cell-free arm. Residues contained author-assigned Mg-oxalate and amorphous silica; this
    is conditional transformation of the tested magnesium-rich olivine, not proof of a response shared
    by every group member. Substrate-edge evidence (klug_2026, supports: support): Klug et al. (2026)
    demonstrate dissolution of XRD-pure San Carlos olivine powder at 5% w/v over 15 days in both cell-containing
    and cell-free G. oxydans B58 delta-pstS, P112:mgdh biolixiviant arms. Product-edge evidence (klug_2026,
    supports: support): Klug et al. (2026) ICP-MS data row 6, XRD minerals rows 4/10/14, Figure S1 Raman,
    and Figure S3 XRD confirm high filtrate Mg/Ni release and secondary Mg-oxalate (glushinskite) formation.'
