id: cmmmech:cuprite
name: Cuprite
material_kind: mineral
description: Cuprite is the cubic copper(I) oxide mineral Cu2O, listed as grandfathered in the September 2026 IMA compilation. It is distinct from elemental copper, tenorite (CuO), copper oxalates and heterogeneous copper ores. The experiment below used a commercial Cu2O preparation, not a natural ore specimen. No criticality designation is inherited from copper.
sources:
  - id: ima_2026_09
    title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Cuprite row, PDF page 52; introductory status definitions. G is grandfathered; 1845 is an original-description year, not an IMA approval number.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-14'
  - id: handbook_cuprite
    title: Handbook of Mineralogy. Cuprite, Cu2O. Single-page species description, cubic structure, powder reference and geological occurrence.
    url: https://www.handbookofmineralogy.org/pdfs/cuprite.pdf
    accessed_on: '2026-10-14'
  - id: fomina2005
    title: Fomina et al. (2005). Role of Oxalic Acid Overexcretion in Transformations of Toxic Metal Minerals by Beauveria caledonica. Applied and Environmental Microbiology 71:371-381. Complete article, Methods and Results, Figures 1-7; Cu2O-specific Figures 1, 2C, 3C and shared Figure 5B.
    url: https://doi.org/10.1128/AEM.71.1.371-381.2005
    accessed_on: '2026-10-14'
  - id: ncbi_caledonica
    title: NCBI Taxonomy 38006. Beauveria caledonica, species node.
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=38006
    accessed_on: '2026-10-14'
  - id: reference_its
    title: GenBank U19043.1. Beauveria caledonica ribosomal and ITS sequence, 630 bases; historical reference sequence used for the study's comparison, not a deposition of its experimental isolate.
    url: https://www.ncbi.nlm.nih.gov/nuccore/U19043.1
    accessed_on: '2026-10-14'
  - id: uniprot_beauveria_oxalate_citrate
    title: 'UniProtKB reference proteome UP000002762 (Beauveria bassiana strain ARSEF 2860, NCBITaxon:655819): Oxaloacetate acetylhydrolase (BBA_06346, UniProtKB:J4UKL8), Pyruvate carboxylase (BBA_04309, UniProtKB:J5JXL6), Citrate synthase (BBA_06310, UniProtKB:J5JPA1), and Malate dehydrogenase (BBA_06393, UniProtKB:J4KMZ7).'
    url: https://www.uniprot.org/uniprotkb?query=(proteome:UP000002762)+AND+(accession:J4UKL8+OR+accession:J5JXL6+OR+accession:J5JPA1+OR+accession:J4KMZ7)
    accessed_on: '2026-11-10'
mechanisms:
  - id: caledonica_associated_cu2o_alteration
    name: Fungal-associated alteration of commercial cuprite-form copper oxide
    process: bioleaching
    description: Laboratory cultures inoculated with Beauveria caledonica cleared an initially opaque Cu2O-containing agar and produced organic acids in a separate liquid Cu2O experiment. The authors also report copper oxalate hydrate formation from the copper substrates. These observations support culture-associated alteration with a proposed ligand-promoted pathway; they do not isolate oxalate as a necessary cause, determine a copper oxidation pathway, or establish complete copper extraction or an isolated product recovery yield. No industrial deployment was tested.
    context: The source's unnamed isolate came from lawn soil in the United Kingdom via the CEH Merlewood collection. An approximately 550-base ITS sequence was reported as 99 percent similar to U19043; that historical reference accession does not identify the experimental isolate. Commercial BDH Cu2O was heat sterilized at 95 degrees C for 36-48 hours. Its starting phase purity and particle size were not reported; a starting-material diffraction check described for pyromorphite must not be transferred. Modified Melin-Norkrans medium contained, per litre, glucose 10 g, (NH4)2HPO4 0.5 g, KH2PO4 0.3 g, MgSO4.7H2O 0.14 g, CaCl2.6H2O 0.05 g, NaCl 0.025 g, glutamic acid 0.001 g and thiamine 0.0001 g; solid medium additionally contained agar 14 g. The initial pH was adjusted to 5.5 before autoclaving. Agar assays used 20 mL medium in 90-mm dishes with 7.5 mM Cu2O, equivalent to 15 mM copper atoms, a cellophane membrane and a 7-mm inoculum disc from a culture at least 14 days old. Incubation was
      at 25 degrees C with colony and clear-zone monitoring over two months. Methods specify at least three replicates; Figure 1 states at least four determinations. Separately, static liquid cultures used 12 mL medium in 50-mL flasks with the same Cu2O loading and inoculum at 25 degrees C for 60 days, with at least three replicates. Liquid organic acids were assayed by HPLC and oxalate also by an enzymatic method. A Cu2O-specific pH trajectory and matched acid-only, killed-cell or pH-matched controls were not reported. Mineral-free inoculated medium was a comparison.
