    label: Dissolved Fe(II) (3.81 +/- 0.17 mM FeCl2) pre-contacted with AM13 biomass and reacting with biogenic or reagent sulfide
    node_type: CELLULAR_STRUCTURE
    description: Washed stationary-phase AM13 cells (~10^6 or 10^8 cells/mL, live or gamma-irradiated at 2 Gy/min for 48-72 h and pre-incubated 2 weeks in Fe medium) encountering dissolved Fe(II) prior to live biogenic sulfide production (final pH ~7.06) or reagent Na2S addition (final pH ~7.37; abiotic cell-free Na2S controls final pH ~7.30).
    protein_grounding_status: NOT_APPLICABLE
  - id: mackinawite_fes_precipitate_with_enlarged_domains
    label: Powder-XRD-verified mackinawite (FeS) precipitate with biomass-enlarged Scherrer crystalline domains
    node_type: MATERIAL_OR_PHASE
    description: Crystalline mackinawite (FeS) identified by powder XRD at 1 week and 2 months across live, gamma-inactivated, cell-free, and post-growth Fe-addition arms, exhibiting larger Scherrer-derived crystalline domains when live or inactive cells encountered Fe(II) before sulfide (inactive-cell c-axis domain reported as 18.5 +/- 7.7 nm in Table 3 vs 18.7 +/- 7.7 nm in Section 3.2), with vivianite co-occurring in inactive/abiotic samples and conditional partial greigite appearance at 5-11 months in live cultures.
    protein_grounding_status: NOT_APPLICABLE
