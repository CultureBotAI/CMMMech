id: cmmmech:spent-vegetable-oil-hydrogenation-catalyst
name: Spent vegetable-oil hydrogenation catalyst
material_kind: secondary_resource
description: Used nickel-bearing catalyst from vegetable-oil hydrogenation for oil hardening, including catalyst-bearing
  filter-aid mixtures. This process-defined secondary resource differs from fresh catalyst, nickel metal, spent
  bleaching earth and refinery cracking or desulfurization catalysts. Bosio et al. describe a particular feed
  containing organic residues and diatomaceous-earth filtering aid; that composition is not a universal formulation.
  IFC process guidance independently identifies spent hydrogenation catalyst and its associated filtering aid.
  This identity-only record inherits no constituent criticality. Microbial leaching and sulfide recovery reported
  by Bosio remain uncurated because complete methods, figures and product characterization were not acquired.
sources:
