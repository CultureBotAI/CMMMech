      explanation: Sections 2.2-2.4, Table 1, and Results pp. 857-858 report thiosulfate depletion and sulfate/sulfur formation during 4-day T. thioparus MCM B-39 treatment of diluted fixer without substantial silver removal in the bacterial step.
