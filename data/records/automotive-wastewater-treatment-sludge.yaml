    functional_role: Periplasmic tetrathionate hydrolase (tth) in Acidithiobacillus thiooxidans ATCC 19377 disproportionating tetrathionate into thiosulfate, elemental sulfur, sulfate, and sulfuric acid protons during sulfur bioleaching.
    annotation_note: Grounded to reference-proteome entry UP000363590 for type strain Acidithiobacillus thiooxidans ATCC 19377 (NCBITaxon:637390), representing Acidithiobacillus thiooxidans DSM 11478 (NCBITaxon:930) in Yagnentkovsky et al. (2009).
    evidence:
    - source_ref: yagnentkovsky_2009
      supports: partial
      explanation: Representative Acidithiobacillus thiooxidans ATCC 19377 tetrathionate hydrolase (tth) for air-lift sulfur oxidation and biogenic sulfuric-acid/polythionate leaching of automotive wastewater-treatment sludge by Acidithiobacillus thiooxidans DSM 11478 in Yagnentkovsky et al. (2009); individual sqr/tth genes were not mutated or directly assayed.
  evidence:
  - source_ref: yagnentkovsky_2009
    supports: support
    explanation: Methods and Figures 1-3 support culture-associated acid generation and subsequent leaching. Figure 3 shows reduced mobilization at higher solids with pH-2 lixiviant.
  - source_ref: yagnentkovsky_2009
    supports: partial
    explanation: No sterile or commercial-acid comparison is reported. Biofilm attachment was inferred from repeated acidification. Conflicting sulfur-loading and dilution-rate wording, and ambiguous Figure 1 proton units, prevent an exact optimum claim. Figure 3 percentages lack a stated calculation and error-bar definition. No isolated product, complete balance or deployment was demonstrated.
  - source_ref: dsm_11478
    supports: context_only
    explanation: Catalogue identity confirms the paper’s named strain; it does not establish assay causality.
