id: cmmmech:dolomite
name: Dolomite
material_kind: mineral
description: Dolomite is the calcium-magnesium carbonate mineral CaMg(CO3)2. The IMA-CNMNC September 2026 list gives grandfathered status G and original-description year 1792, not a numbered approval identifier. This owner denotes the mineral species, distinct from dolostone rock, the dolomite mineral group, Mg-bearing calcite, compositionally similar disordered precursors, and elemental magnesium. A laboratory mixed-biofilm study reports dolomite with detectable ordering reflections in an anoxic illuminated Mn-amended treatment; neither all Mg-rich carbonate precipitates nor all mineral samples are thereby identical. No criticality designation is inherited from a constituent.
