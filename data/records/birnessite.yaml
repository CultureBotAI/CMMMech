mechanisms:
- id: fungal_synthetic_sodium_birnessite_transformation
  name: Fungal culture-associated clearing and transformation of synthetic sodium birnessite
  process: bioleaching
  description: In separate laboratory cultures, growing Aspergillus niger and Serpula himantioides cleared synthetic sodium-birnessite-amended agar and produced new crystals. The observations support dissolution-associated transformation, with manganese oxalate phases assigned in the Serpula arm by powder diffraction. Organic-acid-mediated mobilization and reprecipitation are the authors' mechanistic interpretation; metabolite concentrations and manganese oxidation-state changes were not measured. Neither a dissolved-manganese mass balance, isolated-product yield nor industrial recovery is established.
  context: Wei2012 used A. niger ATCC 201373 and S. himantioides supplied by N. White, University of Abertay, without a strain accession or sequence for the latter. These were separate cultures, not a consortium. Sodium birnessite was supplied by S. Hillier and prepared by freeze-drying synthetic Na-buserite. The paper does not provide a specimen-specific initial composition, quantified phase purity or polytype refinement; its introductory mixed-cation formula is not a measured batch formula. Each 90 mm dish contained 20 cm3 malt extract agar with 0.5% (w/v) oxide and an 84 mm sterile cellophane membrane. A 5 mm leading-edge mycelial disc from cultures maintained for at least 7 days for A. niger or 14 days for S. himantioides was inoculated and grown at 25 degrees C in darkness, with at least three replicate plates. This evidence does not establish equivalent behavior for natural, substituted or otherwise prepared birnessites.
