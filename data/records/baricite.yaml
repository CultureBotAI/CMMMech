  - id: sulfide_generation_iron_nail_and_ph_shift
    label: Sulfide reaction with iron finishing nail and bulk pH rise to 8.3 in Mg/PO4-rich pore-water medium
    node_type: ENVIRONMENTAL_CONDITION
    description: Inoculated duplicate 100-mL serum bottles (samples 1_103 and 2_35) developed black sulfide crusts on the reactive iron finishing nail and reached endpoint pH 8.3 after 10 months at 25 C (compared with pH 7.7 and 7.9 and no black nail crust in sterile controls); dissolved sulfate, sulfide, iron, and phosphate time courses were not directly measured.
    protein_grounding_status: NOT_APPLICABLE
  - id: baricite_assigned_mixed_precipitates
    label: Mixed precipitates containing XRD/Rietveld-assigned barićite (30.6 and 27.8 wt% in samples 1_103 and 2_35)
    node_type: MATERIAL_OR_PHASE
    description: Solids filtered and N2-dried at 30 C containing Rietveld-fitted barićite (30.6 and 27.8 wt% of the crystalline assemblage in samples 1_103 and 2_35) alongside a magnesium-phosphate decahydrate (labelled Mg2(PO4)3.10H2O in Figure 1 vs Mg3(PO4)2.10H2O in Table 2/Results), calcite, and elemental sulfur, whereas sterile controls yielded mainly amorphous material and calcite with similar net Mg depletion.
    protein_grounding_status: NOT_APPLICABLE
