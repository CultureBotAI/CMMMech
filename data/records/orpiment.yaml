id: cmmmech:orpiment
name: Orpiment
material_kind: mineral
description: Orpiment is the monoclinic As2S3 mineral species, grandfathered in
  the September 2026 IMA list, whose original-description year is unspecified.
  It is distinct from elemental arsenic, realgar and amorphous As2S3. The
  observation below concerns an XRD-assigned secondary component of arsenopyrite
  leaching residues, not an isolated orpiment feed or recovered product.
  No criticality designation is inherited from arsenic.
