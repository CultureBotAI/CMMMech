id: cmmmech:gibbsite
name: Gibbsite
material_kind: mineral
description: Gibbsite is the monoclinic aluminium hydroxide mineral Al(OH)3, distinct from bayerite and
  other Al(OH)3 polymorphs, aluminium oxyhydroxides, elemental aluminium, the alumina commodity and heterogeneous
  bauxite. The September 2026 IMA list reports approved status with the special-procedure entry 1962 s.p.;
  this is not a unique numbered mineral accession. The curated experiment concerns abiotic dissolution
  of synthetic gibbsite nanoplates. No mineral-specific criticality designation, microbial mechanism or
  industrial recovery performance is inferred. The separate Lee and Fein 2000 bacterial-dissolution lead
  remains uncurated pending inspectable full primary evidence, tracked in CMMMech issue 219.
