id: cmmmech:neodymium
name: Neodymium
material_kind: element
description: >-
  The element Nd. The identifier grounds the element, not an Nd(III) ion,
  mineral species, magnet alloy, or discarded magnet. The US designation below
  concerns the named neodymium mineral commodity in the separate 2022 and 2025
  lists; these dated designations do not assign criticality to every Nd-bearing
  resource. The mechanisms distinguish biosorption from microbial production
  of a lixiviant that releases Nd from a synthetic phosphate substrate.
