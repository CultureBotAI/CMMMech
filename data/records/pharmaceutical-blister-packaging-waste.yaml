mechanisms:
- id: culture_acid_aluminium_leaching
  name: Aluminium dissolution using culture-derived sulfuric acid liquor
  process: bioleaching
  description: Acidic liquor generated by sulfur-oxidizing cultures was used in a separate spent-medium stage to dissolve aluminium from prepared blister waste. The laboratory evidence supports conditional leaching and layer separation, with a conditional biogenic-acid advantage over reagent acid at 22 degrees C that is absent at 50 degrees C. It does not establish direct cell attack, identified biosurfactant causality or isolated aluminium-product recovery from this feed.
  context: Approximately 5 kg of waste from two hospitals in Lower Austria was sorted into transparent, white and silver-coloured fractions, then cut to about 1 x 1 cm or shredded below 4 or 2 mm. FTIR identified PVC, acrylic adhesive and additional packaging-dependent polymers. Section 3.1 reports about 12.6, 13.7 and 67.6% w/w Al respectively after acid dissolution of 2.5 g samples; these are batch-specific values. The study names A. thiooxidans DSM 504 and A. caldus DSM 9466 for upstream sulfur oxidation. Its blister lixiviant was separately produced in a semi-continuous reactor following Kremser et al. 2022, with 0.85 M sulfate and pH about 0.2, described as approximately 0.86 M sulfuric acid. The paper's lower-concentration sulfur comparison experiments are not the blister leaching batch. No exact sulfur-lot linkage from the biogas-residue comparison to that lixiviant is established. Flasks contained 150 mL liquid in 250 mL vessels, 2.5, 5.0 or 7.5% w/v waste, 22 degrees C and 150 rpm
    for up to nine days in triplicate. Commercial 0.86 M sulfuric acid was the comparator. Separate 50 degrees C and particle-size experiments used 7.5% w/v. The nominal 1 L stirred trials used below-4-mm transparent or white material, 7.5% w/v, 22 degrees C and 250 rpm for 14 days. Samples for Al analysis were filtered at 0.2 micrometres and measured with xylenol-orange spectrophotometry. The cited acid-production protocol filters withdrawn liquor, but the blister study does not independently demonstrate sterility of its applied liquor.
