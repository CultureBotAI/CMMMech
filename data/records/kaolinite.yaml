  evidence:
  - source_ref: ams_2002
    supports: support
    explanation: Sections 2.1–2.5 and 3.1, Figures 1–2, distinguish specimen preparation and the growth arms. Kaolinite-containing cultures exceeded the no-added-iron control, whereas Fe-EDTA plus KGa-1b supported the largest population. This supports the source's interpretation of access to solid-associated iron under limitation; it does not assign that iron to the kaolinite lattice. The medium retained possible trace iron below the reported analytical detection range, and inoculum carryover was possible, so no-added-iron does not mean iron-free.
  - source_ref: ams_2002
    supports: support
    explanation: 'Sections 2.5 and 3.2, Figures 3–5, show different total versus per-cell siderophore patterns: KGa-2 cultures had more siderophore per estimated cell than the Fe-EDTA arm but less than the no-added-iron control. Total production was greatest with Fe-EDTA. Pooled extracts and calibration against the source-designated DFAM standard in the absence of a purified isolate-specific standard make these relative HPLC estimates; the plotted millimolar values are not curated as independently authenticated absolute concentrations. Figure 5''s hematite series comes from an earlier experiment and is not a simultaneous kaolinite control.'
  - source_ref: ams_2002
    supports: partial
    explanation: Sections 2.1, 3.1 and 3.3 leave iron distribution among lattice substitution, accessory phases and surface-associated iron unresolved. Cultures with added iron or kaolinite became more alkaline, while the no-added-iron control became more acidic; these are not pH-matched conditions. Aluminium was detected in filtered four-day culture supernatants, but this article's cited earlier abiotic/dissolution comparisons are not an independently inspected matched control series. No quantitative microbial enhancement, stoichiometric kaolinite dissolution, dissimilatory iron reduction, or exclusive siderophore causality is claimed here.
  - source_ref: ncbi_mendocina
    supports: context_only
    explanation: The current species name grounds the paper's organism label at species rank only. Section 2.2's historical identification wording and lack of a strain accession limit confidence in the experimental isolate; the taxon identifier does not resolve those limitations.
