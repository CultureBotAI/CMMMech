    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:5061
      label: Aspergillus niger
    interpro_ids:
    - InterPro:IPR011701
    - InterPro:IPR020846
    - InterPro:IPR036259
    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA that secretes intracellularly synthesized citric acid into the extracellular medium, driving organic-acid acidification and metal mobilization.
    annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:A0A254TZW7 (CEXA_ASPNG) for Aspergillus niger (NCBITaxon:5061).
    evidence:
    - source_ref: rasoulnia_mousavi_2016
      supports: partial
      explanation: Representative Aspergillus niger citrate exporter CexA for organic-acid excretion into the sucrose-grown PTCC 5210 spent medium used to leach V and Ni from heavy-fuel-oil combustion ash in Rasoulnia and Mousavi (2016); cexA was not assayed in the study.
  evidence:
  - source_ref: rasoulnia_mousavi_2016
    supports: support
    explanation: Section III, page 367 and Figure 2 report extraction percentages of 97% V and 50% Ni with flask-derived spent medium, compared with 100% V and 33% Ni with bubble-column-derived medium. These are source-reported leaching outcomes, not independently reconstructed yields or isolated-product recovery. The text reports citric-acid-rich flask medium and oxalic-acid-rich reactor medium after the different culture durations. The lower Ni result remains explicit rather than treating reactor cultivation as uniformly superior.
  - source_ref: rasoulnia_mousavi_2016
    supports: partial
    explanation: The complete four-page paper does not specify the liquid-metal assay, sampling fraction, yield equation, replication count or uncertainty for Figure 2. Figure 1 has error bars for agar colony diameter but does not define them or provide an ash-leaching control. Culture duration, aeration and possibly inoculum differ, preventing attribution of the yield contrast solely to vessel scale or one organic acid. Without matched abiotic leaching or complete solution/residue balances, the quoted 100% must not be interpreted as demonstrated quantitative recovery of a purified vanadium product.
  - source_ref: rasoulnia_mousavi_2016
    supports: partial
    explanation: Nickel-oxalate precipitation is proposed to explain the lower Ni extraction, but Figure 3 labels NiO in the treated solid and does not independently identify a nickel-oxalate phase. The diffraction text emphasizes a sodium iron sulfate residue, while the treated trace additionally labels NaHSO4.H2O and NiO. Neither supports claiming a single-phase residue. Loss of assigned vanadium peaks cannot demonstrate complete vanadium removal below an unstated diffraction detection limit. Figure 4 shows selected surface changes, not quantitative porosity, phase-specific flux or safe residue reuse.
  - source_ref: rasoulnia_mousavi_2016
    supports: partial
    explanation: Section III reports aeration difficulties with longer bubble-column fermentation because of biomass accumulation. The 1-L culture system and subsequent spent-medium assay therefore demonstrate laboratory process comparison only. No isolated metal product, economic balance, continuous industrial operation or comprehensive toxicity assessment is established by this paper.
