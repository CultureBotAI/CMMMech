  issue_key: tin-calibration-recovery-validation
  category: quantity
  severity: minor
  status: open
  certainty: confirmed
  title: Distinguish 50 ng/g calibration limit from 5–60 ng/g recovery testing
  description: The record says dilution or higher-range validation for TBT is not
    described, and the two dossiers repeat that broader absence claim. Primary §2.3.2
    explicitly reports recovery accuracy over 5–60 ng/g, 94–103% recovery and RSD
    <10%. This does not prove linear calibration above 50 ng/g or validate the nominal
    100 ng/g range, but it makes the unqualified absence claim incorrect. The qualitative
    debutylation interpretation remains defensible.
