id: cmmmech:batoniite
name: Batoniite
material_kind: mineral
description: IMA-approved hydrated aluminium sulfate mineral containing the octameric [Al8(OH)14(H2O)18]10+
  polyoxocation (IMA 2023-008; status A, Approved 2023; full description published 31 August
  2023; no mineral symbol is printed in the primary paper or in the September 2026 IMA Master
  List, PDF p. 21) with ideal end-member formula [Al8(OH)14(H2O)18](SO4)5 * 5H2O (written
  Al8(SO4)5(OH)14(H2O)18*5H2O in the September 2026 IMA Master List, PDF p. 21, requiring
  SO3 29.68 wt%, Al2O3 30.24 wt%, H2O 40.08 wt%, total 100.00 wt%; Mauro, Biagioni, Sejkora,
  Dolnicek, and Skoda, 2023, European Journal of Mineralogy 35:703-714). Named in honor of
  Italian amateur mineralogist Massimo Batoni (born 6 April 1948), vice president of the Associazione
  Micro-mineralogica Italiana, who collected and provided the first specimens of batoniite
  (Section 1, p. 704). Corresponds to the unnamed basic aluminum sulfate mineral coded as
  UM1987-12-SO:AlH (Smith and Nickel, 2007) from the Cetine di Cotorniano Mine previously
  described by Sabelli and Santucci (1987) with the tentative formula Al3(SO4)2(OH)5 * 9H2O
  and triclinic symmetry (Abstract, p. 703, and Section 1, p. 704). Discovered in the Garibaldi
  Tunnel, the lowest mining level of the Cetine di Cotorniano Mine (43 deg 13 min N, 11 deg
  09 min E), Chiusdino, Province of Siena, Tuscany, Italy, excavated in Paleozoic metasediments
  cropping out beneath the Upper Triassic evaporitic-dolomitic-brecciated "Calcare Cavernoso"
  Formation (Section 2, p. 704, and Section 3, p. 704). The holotype specimen is deposited
  in the mineralogical collection of the Museo di Storia Naturale of the University of Pisa,
  Via Roma 79, Calci (Pisa), Italy, under catalogue number 20028 (Section 1, p. 704, and Figure
  1, p. 705). Formed as a low-temperature secondary phase in a humid underground environment
  from sulfuric acid released during pyrite/marcasite oxidation reacting with Al-bearing phyllosilicates
  of the Paleozoic metasedimentary host rocks, directly associated with gypsum and a poorly
  crystalline resinous orange-brownish undetermined Al-Fe sulfate (Section 2, p. 704, and
  Section 5, p. 711). Occurs as hemispherical aggregates up to 1 mm in diameter composed of
  colorless to white tabular crystals flattened on {011}, with a white streak and a vitreous
  to greasy luster (Abstract, p. 703, and Section 2, p. 704). Batoniite is non-fluorescent
  under both shortwave and longwave ultraviolet light, brittle, with perfect cleavage on {011}
  (and other less distinct cleavage surfaces of undetermined orientation), and is slowly soluble
  in H2O; Mohs hardness and experimental density could not be determined owing to the paucity
  of available material, its brittleness, and its slow solubility in water, while the calculated
  density based on the ideal formula and single-crystal X-ray diffraction unit-cell parameters
  is Dcalc = 1.949 g cm-3 (Section 2, p. 704). Optically colorless and non-pleochroic under
  plane-polarized light, with distinct cleavage and inclined extinction (extinction angle
  ~30 deg), biaxial negative (-), with refractive indices measured at 589 nm of alpha = 1.4833(6),
  beta = 1.4948(6), gamma = 1.5019(5), 2V(meas.) = 71(1) deg (determined by spindle stage),
  and 2V(calc.) = 75.8 deg (calculated by the equation of Wright, 1951); X is inclined ~60
  deg to (011), and the Gladstone-Dale compatibility index (Mandarino, 1979, 1981) is 0.0022
  (superior; Section 2, p. 704). Micro-Raman spectroscopy (Thermo Scientific DXR spectrometer,
  532 nm diode-pumped solid-state laser at 6 mW, 100x objective, 50 um pinhole, 10 s exposure
  x 100 accumulations, 4000-100 cm-1; Section 3.1, p. 704, and Section 4.1 and Figure 2, p.
  706) shows a very strong band at 995 cm-1 (nu1 symmetric stretching of SO4 groups), a weak
  band at 1127 cm-1 with a shoulder at 1097 cm-1 (triply degenerate nu3 antisymmetric stretching
  of SO4), bands at 620 and 457 cm-1 (nu4 and nu2 bending of SO4), bands at 343 and 250 cm-1
  (Al-phi [phi = OH, H2O] and lattice modes), a band at 1629 cm-1 (nu2 bending of H2O groups),
  and a broad (O-H)-stretching band from 3750 to 2800 cm-1 with components near 3623, 3487,
  and 3230 cm-1 (corresponding to O-H...O hydrogen-bond distances of 2.60 to >3.20 A by the
  empirical relation of Libowitzky, 1999). Quantitative wavelength-dispersive electron-microprobe
  analyses (CAMECA SX 100 at the National Museum, Prague; 15 kV, 8 nA, 5 um beam diameter
  on an unpolished crystal surface, PAP matrix correction, average of n = 12 spot analyses;
  Section 3.2 and Table 1, p. 705; Section 4.2, pp. 706-707) yielded mean Al2O3 33.48 wt%
  (range 31.60-36.28, SD 1.17, normalized 30.17 wt%, standard sanidine Al Kalpha), Fe2O3 0.05
  wt% (0-0.18, SD 0.07, normalized 0.05 wt%, standard hematite Fe Kalpha), SO3 33.00 wt% (30.86-36.97,
  SD 1.55, normalized 29.74 wt%, standard celestine S Kalpha), measured Sum = 66.53 wt% (62.46-73.25,
  SD 2.64), stoichiometric H2O*calc = 44.41 wt% (normalized 40.04 wt%), unnormalized Total
  = 110.94 wt%, and normalized Total = 100.00 wt% (the high unnormalized analytical total
  reflects partial dehydration under the high vacuum of the electron microprobe). On the basis
  of Al + Fe + S = 13 atoms per formula unit, the empirical formula is (Al7.98Fe3+0.01)sum=7.99(SO4)5.01(OH)13.95(H2O)18
  * 5H2O (Abstract, p. 703, and Section 4.2, p. 707). Crystallizes in the triclinic system,
  space group P-1 (#2), with single-crystal X-ray diffraction unit-cell parameters (Bruker
  D8 Venture diffractometer, Photon III CCD detector, microfocus MoKalpha radiation lambda
  = 0.71073 A, T = 293(2) K, crystal size 0.150 x 0.138 x 0.040 mm, refined from 9840 reflections
  above 20sigma(I) with 4.79 deg < 2theta < 54.90 deg; Section 3.3 and Table 2, pp. 705-706)
  a = 9.1757(6) A, b = 12.0886(9) A, c = 20.9218(15) A, alpha = 82.901(3) deg, beta = 87.334(3)
  deg, gamma = 86.999(2) deg, V = 2297.8(3) A3, Z = 2, and a:b:c = 0.7590:1:1.7307. Structure
  solution by direct methods (Shelxtl) and anisotropic refinement (Shelxl-2018; H atoms refined
  isotropically with O-H distance restraints) converged to R1 = 0.0916 for 8118 reflections
  with Fo > 4sigma(Fo) and R1 = 0.1096 (wR2 = 0.1837, GooF = 1.233) for all 10076 unique reflections
  out of 65912 measured (2theta_max = 55.10 deg, Rint = 0.0822, Rsigma = 0.0566) with 811
  refined parameters (and 60 restraints reported in the Abstract, p. 703, though omitted from
  Table 2, p. 706) and maximum/minimum residual electron density +1.03 (at 1.47 A from O(43))
  and -0.69 e A-3 (at 0.87 A from H(19)). The bipartite crystal structure (Section 4.3, pp.
  707-711, and Tables 3-4, pp. 708-709) contains two symmetry-independent centrosymmetric
  [Al8(OH)14(H2O)18]10+ octameric polyoxocations (Al(1)-Al(4) and Al(5)-Al(8)), each formed
  by a core of four edge-sharing Al octahedra with two central Al(OH)6 and two peripheral
  Al(OH)5(H2O) polyhedra (Al-Al = 2.923-2.947 A) completed by four additional corner-sharing
  Al(OH)2(H2O)4 octahedra (individual Al-O distances 1.845(5)-1.981(5) A, average <Al-O> =
  1.892-1.903 A, bond-valence sums 3.04-3.15 vu), connected through an extensive hydrogen-bonding
  network (D...A [O...O] = 2.525(8)-3.471(7) A, O-H = 0.87(2)-0.98(2) A, D-H...A = 136(7)-179(9)
  deg in Table 4, p. 709) to an interstitial complex of five independent (SO4)2- tetrahedra
  (S(1)-S(5), individual S-O = 1.436(6)-1.487(5) A, average <S-O> = 1.456-1.470 A in Table
  3, p. 708, BVS = 6.08-6.30 vu) and five "free" H2O groups (Ow(1)-Ow(5)); X-ray powder diffraction
  data were collected with a 114.6 mm diameter Gandolfi camera using Ni-filtered CuKalpha
  radiation at 40 kV and 30 mA (Section 3.3, pp. 705-706; full reflection table deposited
  in Table S2 of the online Supplement). No biological or microbial interaction data are reported
  in the type mineralogical description.
