id: cmmmech:pyroaurite
name: Pyroaurite
material_kind: mineral
description: Pyroaurite is the magnesium-ferric-iron carbonate hydroxide hydrate mineral Mg6Fe3+2(OH)16(CO3)·4H2O.
  The IMA-CNMNC September 2026 list records redefined status Rd and the historical year 1865; that year
  is not a numbered approval identifier. It is distinct from hydrotalcite, the hydrotalcite mineral group,
  unspecified layered double hydroxides, elemental magnesium or iron, and mixed asbestos-mine tailings.
  The curated field trial identifies source-assigned pyroaurite in both inoculated and uninoculated acid-treated
  tailings and in the untreated baseline; it does not establish a microbial increase in pyroaurite production.
  No constituent criticality designation is inherited.
