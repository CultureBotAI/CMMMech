limitations:
- The original acid/base preparation contradiction and NaOH duration/washes remain
  unresolved. The earlier thesis is not a formal correction of the final assays.
- Missing na rows, printed zeros, rounding, the Pd summary and Cu/Zn threshold conflicts
  remain. Conditional arithmetic using two rows does not authorize exclusions or correct
  the published statistics.
- The additional CE4 Ni SI-versus-figure discrepancy remains a source clarification
  lead. Exact bar values were not digitized and reasons for possible group-membership
  differences remain unknown.
- The current original DOCX was inspected through its native OOXML and table cells,
  not a visual rendering. The curator reported two failed LibreOffice attempts. The
  table values are directly inspectable, but no fresh SI layout check is claimed.
- The medium-only comparator and partial 16S context do not prove exclusive EPS binding,
  active biomass, axenicity, intracellular uptake, a recovered product or industrial
  deployment.
- The bounded exact-DOI search found no attributable amendment; this is not exhaustive
  absence. Browser NCBI routes failed, while official EFetch successfully verified
  all asserted NCBI identifiers.
- Author final gates were verified against the exact frozen owner. Saving this new
  bundle requires a subsequent native review-check, coordinated by root.
