limitations:
- Community identity,inoculum,working volume and immobilization carrier remain unspecified;
  no matched controls establish biological necessity.
- 12-day endpoint versus14-day plotted range and8.81 versus8.86 post-SRB pH remain
  source inconsistencies; error-bar definition/replication unavailable.
- Pb/Cd removal bounds are source-attributed rounded concentration comparisons, not
  zero measurements or product yields.
- Dried-XRD assignments lack independently audited quantitative phases/harvested mass;
  modeled species and uncertain analytical speciation are not direct causal observations.
- Chemical polishing does not establish sterility, selective product recovery or discharge
  compliance; printed final sulfide/pH conflict with source comparison values.
- Upstream feed linkage does not establish identical batches or dilution-normalized
  full-process recovery; no deployment claim.
- Bounded live searches and text-only raw searches do not prove universal notice/supplement/duplicate
  absence. Deferred candidate sources are outside accepted scientific review scope.
notes:
- All maintained inputs stayed frozen. No Git/GitHub action or scientific record/history/source-dossier
  edit performed.
- Fluorite curation authorship is disclosed; its independent scientific judgment belongs
  to another reviewer.
