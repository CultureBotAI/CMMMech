findings:
- finding_id: cmmmech-cycle9-stage4-finding-0001
  issue_key: cmmmech.shewanella-mr1-bes-uranium-vanadium.template-node-descriptions-and-unqualified-uranium-product-label
  category: graph
  severity: minor
  status: resolved
  certainty: confirmed
  title: Uranium and vanadium Shewanella oneidensis MR-1 BES records now have T1/T2/T3/T6/T8/T9-grounded
    node/edge descriptions and qualified uranium product state
  description: 'In data/records/uranium.yaml (cmmmech:uranium, element, Kane et al. 2026 USGS
    data release DOI:10.5066/P9ERLSM6; causal_graphs[0] mr1_bes_uranium_reduction_graph, lines
    197-338) and data/records/vanadium.yaml (cmmmech:vanadium, element, Kane et al. 2026 USGS
    data release DOI:10.5066/P9ERLSM6; causal_graphs[0] mr1_bes_vanadium_reduction_graph, lines
    199-340), oxidized_metal_substrate (uranium.yaml line 295, vanadium.yaml line 297) and reduced_metal_product
    (uranium.yaml line 300, vanadium.yaml line 302) retain generic template descriptions repeating
    their capitalized node labels in parentheses (''Terminal electron acceptor substrate (<Label>)
    in kane_2026_bes.'' and ''Resulting reduced product state (<Label>) in kane_2026_bes.''),
    and edges[1..3] (uranium.yaml lines 316, 320, 325, 329, 334, 338; vanadium.yaml lines 318,
    322, 327, 331, 336, 340) interpolate those capitalized labels mid-sentence with generic one-line
    evidence explanations (''MtrC participates in extracellular reduction of ...'', ''OmcA contributes
    to extracellular reduction of ...'', ''Shewanella oneidensis MR-1 bioelectrochemical/anaerobic
    reduction converts ...'') that omit the exact T3/T6/T7/T8/T9 observations. Furthermore, in
    data/records/uranium.yaml, causal_graphs[0].nodes[4].label (''Cell-associated reduced U(IV)
    precipitate'', line 298) and causal_graphs[0].edges[3] (supports: support, lines 330-338)
    assert a reduced U(IV) precipitate with full support, whereas mechanisms[0].description (line
    35) and mechanisms[0].evidence[0..2] (lines 114-120) explicitly state that kane_2026_bes (T3_AqueousICPOES.csv,
    T6, T8_XRD.csv, T9_SEM.pdf pp. 2-6) documents aqueous U depletion (975 mg/kg at BESU.8Vb_W.EQ
    to <0.1 mg/kg at BESU.8Vb_W.END in biotic vs 914 -> 0.819 mg/kg in abiotic) and U-labelled
    EDS electrode deposits without assigning a crystalline mineral phase or U(IV) oxidation state
    and with abiotic removal limiting microbial attribution (supports: partial).'
  target_ids:
  - cmmmech:uranium
  - cmmmech:vanadium
  field_paths:
  - causal_graphs[0].nodes[3].description
  - causal_graphs[0].nodes[4].label
  - causal_graphs[0].nodes[4].description
