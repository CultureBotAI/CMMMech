mechanisms:
- id: lx5_ferrous_oxidation_and_schwertmannite_precipitation
  name: Resting-cell iron oxidation associated with schwertmannite precipitation
  process: biomineralization
  description: Washed resting cells of source-reported A. ferrooxidans LX5 oxidized dissolved Fe(II) in acidic ferrous sulfate solution while an iron precipitate formed and was assigned to schwertmannite by powder X-ray diffraction. A cell-free hydrogen-peroxide comparator also formed the phase. Biological total-iron precipitation was lower than the chemical comparator at 60 hours despite higher subsequent arsenic uptake by the collected biological material. The study supports microbial participation in reagent-based mineral formation, not a requirement for living cells in every schwertmannite synthesis or superior biological recovery yield.
  context: Song et al. report obtaining LX5 as CGMCC No. 0727. The asserted taxon identifier verifies the species, not that strain accession. Cells grown in modified 9K medium containing 44.48 g/L FeSO4.7H2O were collected at the end of exponential growth, filtered to remove precipitate, centrifuged, washed three times in pH 1.5 sulfuric acid and resuspended at pH 2.5. The formation assay used 225 mL solution containing 11.12 g FeSO4.7H2O in 500 mL flasks, with 10% v/v resting-cell inoculum and reported density 6.0 x 10^6 cells/mL. Initial pH was adjusted to 3.0 with sulfuric acid; incubation was at 28 degrees C and 180 rpm, with triplicate treatments. The chemical arm used 11.12 g FeSO4.7H2O in 250 mL effective volume, with approximately 6 mL of 30% H2O2 added by pump at a constant rate selected to approximate the average biological Fe(II) oxidation rate. Periodic samples were filtered at 0.22 micrometers before Fe(II) and total-Fe measurement. Section 2.2.1 says collection followed complete
    Fe(II) oxidation, reported at 60 hours, whereas Figures 1-3 captions describe 72 hours. The 60-hour solution comparison is retained separately from that unresolved collection-time discrepancy. These are laboratory flask experiments with reagent substrates, not industrial deployment.
