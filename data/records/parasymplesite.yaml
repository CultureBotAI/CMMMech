id: cmmmech:parasymplesite
name: Parasymplesite
material_kind: mineral
description: >-
  Parasymplesite is the monoclinic ferrous arsenate mineral
  Fe(II)3(AsO4)2·8H2O, a vivianite-group species dimorphous with
  symplesite. The September 2026 IMA list records grandfathered status G
  and historical year 1954, not a numbered approval proposal. It is
  distinct from ferric arsenate scorodite, phosphate vivianite, dissolved
  arsenic and the arsenate-bearing ferrihydrite precursor. The laboratory
  observation below assigns parasymplesite to mixed solids after bacterial
  reduction; it does not establish a pure natural-mineral product or an
  arsenic recovery yield. No constituent criticality designation is inherited.
