limitations:
- No individual experimental reflection intensities/refinement instruction set, new
  least-squares refinement, covariance propagation or experimental replication is
  claimed. Native placeholder loops are not observed-reflection datasets.
- Printed-source conflicts remain unresolved source limitations, not silently repaired
  repository observations. Coordinate and table agreement is a conditional consistency
  check rather than model validation.
- Fresh correction searches cover four exact DOI/correction/erratum/retraction queries
  and their returned windows only; no universal absence claim. The author retained
  six separate recorded web batches and exact public acquisition failures.
- Historical raw roots were unavailable; eleven version comparisons use committed
  recorded digests. Nine match and two current NLM main PDF binaries differ, without
  asserting scientific revision from binary difference.
- Four CIF scalar lexical normalizations remove literal backslashes in threshold/weight
  expressions in the author parser. Independent parsing retains the original tokens;
  sigma meaning is preserved in prose, but byte-exact scalar transcription is not
  claimed.
- The post-save native checker and any post-native full check will be recorded separately;
  this observation does not claim those future commands have completed.
- No treatment-specific replicate ledger,bulk dissolved-U time series or quantitative
  phase/mass balance was acquired. AFM in air after washing/drying cannot supply an
  in situ dissolution rate.
- The sourcePb2mean,water-H geometry,unit-cell/formula and treatment-time/pH/index
  conflicts remain unresolved. The new citation does not repair them or establish
  a unique adsorption mechanism.
