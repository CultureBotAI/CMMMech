id: cmmmech:atacamite
name: Atacamite
material_kind: mineral
description: Atacamite is the orthorhombic copper hydroxychloride mineral Cu2Cl(OH)3. It is
  distinct from elemental copper, other copper minerals and mixed corrosion patinas. The laboratory
  mineral experiment below used a synthetic preparation. No criticality designation is inherited
  from copper.
