    functional_role: Outer-membrane monoheme cytochrome c Cyc2 (cyc2, locus AFE_3153) in the rus operon of Acidithiobacillus ferrooxidans ATCC 23270, catalyzing primary extracellular electron extraction from soluble Fe(II) at low pH.
    annotation_note: Grounded to type-strain reference proteome UP000001362 (Acidithiobacillus ferrooxidans ATCC 23270 / DSM 14882 / NCIMB 8455; NCBITaxon:243159) as a representative strain-level entry for species-level mechanism organism Acidithiobacillus ferrooxidans (NCBITaxon:920). Represents the unsequenced Bor sulfide-ore Acidithiobacillus ferrooxidans isolate inoculated into Jadar Valley jadarite-bearing (and comparator Bikita spodumene) leaching flasks in Kirk et al. (2024).
    evidence:
    - source_ref: kirk2024
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans rus-operon Fe(II)-oxidation protein for the Bor Cu-Pb-Zn sulfide-ore isolate maintained on ferrous sulfate and inoculated (10 mL into 190 mL sterile basal nutrient solution with 2 g ~0.5 um Jadar Valley jadarite-bearing powder at static 23 C for 30 days) in Kirk et al. (2024); repeated 1 N (0.5 M) H2SO4 additions targeting pH 1.8 differed between treatments, inoculated flasks showed faster lithium release during part of the time course before converging with the uninoculated control by day 30 (while sulfuric-acid-only leaching remained higher), and the companion Bikita spodumene experiment showed little difference between inoculated and uninoculated dissolved lithium.
