mechanisms:
- id: synthetic_la_carbonate_dehydration_rehydration
  name: Abiotic dehydration and partial rehydration of synthetic La lanthanite
  process: other
  microbial: false
  description: >-
    Synthetic La lanthanite heated at 80 °C changed to a phase identified
    by powder X-ray diffraction as La tengerite-type carbonate after
    7 h. When this product was placed in water at 21 °C, lanthanite
    reappeared. Figure 12 reports 89 wt% lanthanite and 11 wt%
    tengerite-type phase at 120.5 h, establishing partial return at that
    sampled endpoint. These are fitted crystalline phase fractions,
    not lanthanum extraction yields or recovery efficiencies. The
    experimental tengerite-type product is not assigned a natural
    La-dominant mineral-species identifier.
  context: >-
    Laboratory abiotic experiment in Terribili et al. (2025). Initial
    lanthanite was synthesized by homogeneous mixing at 21 °C;
    synthesis scale and number of batches for this thermal sample
    are not specified. A 2 g portion of the resulting solid was
    heated in a lidded 50 mL porcelain crucible at 80 °C; 0.2 g samples
    were collected for XRD.
    A 0.3 g portion of the dehydration product was placed in a 15 mL
    glass reactor filled with Milli-Q water and left static at 21 °C;
    15 mL is the stated reactor capacity, not an independently specified
    water volume. The initial phase and successive time points provide
    phase controls. Replicate numbers and uncertainty for this separate
    dehydration/rehydration arm are not specified. The text's broad
    statement about eventual transformation of all tengerite is not
    demonstrated by the final plotted sample, which still contains
    tengerite; Table SI-1 also lists both phases at 120.5 h. SEM changes
    and diffraction support a hydration-dependent structural change,
    while comparable forward/reverse activation energies and the
    proposed surface-energy explanation remain hypotheses. No
    microorganisms, natural ore feed, isolated-metal product or
    industrial-scale test was involved.
  evidence:
  - source_ref: terribili2025
    supports: support
    explanation: >-
      Methods page 948 establishes the separate dry-heating and
      water-rehydration arms. Figure 10 shows lanthanite at 0 h,
      mixed phases at 5.5 h and tengerite-type material at 7 h;
      Figure 12 shows increasing lanthanite from 2 wt% at 5 h to
      89 wt% at 120.5 h, with 11 wt% tengerite remaining. Figures
      11 and 13 provide corresponding microscopy and SI Table SI-1
      preserves separate crystallite-size estimates for both phases.
      The narrower observed phase change is supported; full return
      by 120.5 h, a measured thermodynamic equilibrium and a recovery
      yield are not asserted.
