id: cmmmech:ferrowodginite
name: Ferrowodginite
material_kind: mineral
description: 'Anhydrous iron(II)-tin(IV)-tantalum oxide mineral of the wodginite group with
  current September 2026 IMA-CNMNC approved formula Fe2+Sn4+Ta2O8, status A, and approval
  number IMA 1984-006. Ercit, Cerny, and Hawthorne (1992) described the type specimen (SK-1,
  from sample A5234 of the J. Siivola collection, Geological Survey of Finland, originally
  collected from the Sukula granitic pegmatite near the Makitulokas farm house in the Tammela-Somero
  pegmatite province, southwestern Finland), where it forms 0.01-0.2 mm inclusions rimmed
  by a 10 um zone of stannomicrolite (''sukulaite'') and coexisting with tapiolite and native
  bismuth inside tantalian cassiterite (''ainalite''). MAC 5 EDS electron-microprobe analysis
  of type specimen SK-1 (mean of 2 analyses, Table 3, p. 636, with Fe2+/Fe3+ partitioned by
  wodginite stoichiometry) yielded Ta2O5 56.3, Nb2O5 14.8, SnO2 10.1, FeO 9.3, TiO2 4.3, MnO
  2.8, Fe2O3 1.9, total 99.4 wt%, corresponding on the basis of 32 O atoms per unit cell (Z
  = 4) to the empirical formula (Fe2+3.04Mn0.93[]0.03)Sigma4(Sn1.58Ti1.27Fe3+0.55Ta0.60)Sigma4(Ta5.38Nb2.62)Sigma8O32
  (or per 8 O atoms: (Fe2+0.76Mn0.23[]0.01)(Sn0.40Ti0.32Ta0.15Fe3+0.14)(Ta1.35Nb0.66)O8).
  Single-crystal precession and 114.6-mm Gandolfi powder X-ray diffraction (Table 4, p. 637)
  refined in monoclinic space group C2/c (or Cc) with a = 9.415(7), b = 11.442(6), c = 5.103(4)
  A, beta = 90.8(1) degrees, V = 549.7(6) A3, Z = 4, Dcalc = 7.02 g/cm3, and Mohs hardness
  5.5. Distinct from wodginite (Mn2+Sn4+Ta2O8), ferrotitanowodginite (Fe2+TiTa2O8), ferrotapiolite,
  ixiolite, and elemental tantalum, tin, niobium, or titanium; no criticality designation,
  microbial mechanism, or industrial recovery yield is asserted.'
