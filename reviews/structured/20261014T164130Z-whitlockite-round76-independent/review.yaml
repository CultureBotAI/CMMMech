limitations:
- No independent re-refinement, hydrogen-site identification or quantitative phase
  fraction establishes unambiguous pure whitlockite.
- Calcination and unequal washing complicate comparisons; source1h/2h thermal duration
  conflict remains unresolved.
- Sterile/filtrate/modified-medium controls constrain the association, but no killed-cell
  control or proven biochemical cause is established.
- The37degreesC model-urine context is not replication of70degreesC culture experiment
  and supplies phase-summary charts rather than raw diffraction patterns.
- Bounded correction and supplementary checks do not establish literature-wide absence.
  This review supplies no new experimental replication.
