summary: Diopside is CaMgSi2O6, separate from the pyroxene group and mixed silicate
  feeds. The natural experimental crystals have the reported nonideal composition,
  not an assumed pure end member. Limited or unresolved bacterial enhancement and
  modest element-dependent fungal effects are retained. Sequential baseline drift,
  source discrepancies and imperfect controls prevent universal inhibition, uniform
  null or proven molecular passivation claims.
