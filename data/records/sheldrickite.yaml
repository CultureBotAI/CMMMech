mechanisms:
- id: abiotic_thermal_dehydration
  name: Laboratory single-step thermal dehydration of natural sheldrickite
  process: other
  description: Heating a 2.528 mg flaky sample of natural sheldrickite from Mont Saint-Hilaire
    at 5 degrees C/min under dry nitrogen flowing at 200 mL/min up to 350 degrees C produced
    a single continuous mass loss of 0.142 mg (5.61 wt%) between 160 and 265 degrees C, matching
    the theoretical 5.49 wt% H2O content for 1 H2O molecule per NaCa3(CO3)2F3(H2O) formula
    unit.
  context: Thermogravimetric analysis in Grice et al. (1997), pp. 182-183, used a Mettler
    TA3000 thermal system with a TG50 thermobalance and M3 microbalance on 2.528 mg of natural
    sheldrickite heated from 30 to 350 degrees C at 5 degrees C/min under 200 mL/min dry N2.
    Higher-temperature decarbonation above 350 degrees C and the X-ray identity of the dehydrated
    solid residue were not reported.
  microbial: false
  evidence:
  - source_ref: grice_1997_sheldrickite
    supports: support
    explanation: Pages 182-183 report that the 2.528 mg flaky sample lost 0.142 mg (5.61 wt%)
      in one continuous step between 160 and 265 degrees C (versus 5.49 wt% calculated for
      NaCa3(CO3)2F3·H2O), confirming a single structurally distinct H2O site bonded to Na
      within the [Na(H2O)]+ layer.
  - source_ref: grice_1997_sheldrickite
    supports: partial
    explanation: The TGA run was terminated at 350 degrees C prior to carbonate decomposition,
      so CO2 (25.81 wt%) was calculated by stoichiometry rather than measured gravimetrically,
      and no rehydration or post-heating diffraction study was conducted.
