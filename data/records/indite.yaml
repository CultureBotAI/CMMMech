id: cmmmech:indite
name: Indite
material_kind: mineral
description: >-
  Indite is the iron-indium sulfide mineral species with ideal formula
  FeIn2S4. The September 2026 IMA-CNMNC list marks it approved and gives
  the year as 1967 s.p.; this special-procedure notation is not a numbered
  approval accession. Genkin and Murav'eva (1963) described natural grains
  in cassiterite-quartz ore from the Dzhalinda deposit, Little Khingan,
  in the Russian Far East. Reflected-light microscopy, quantitative
  microspectrographic analysis and powder X-ray diffraction support the
  identification. The diffraction comparison with previously synthesized
  FeIn2S4 supports a cubic spinel-type assignment; it is not a new
  single-crystal structure refinement of the natural material.
  The measured natural grains had variable, approximately determined
  iron-indium-sulfur proportions rather than uniformly ideal end-member
  stoichiometry. Nearly all observed indite grains were replaced to
  varying degrees by veinlets of the distinct indium hydroxide mineral
  dzhalindite. Natural and synthetic diffraction intensities also differ
  for the 311 reflection, which the authors retain in their structural
  comparison. The ideal species formula therefore does not establish
  purity of the analyzed grains or of the surrounding ore.
  The proposed later hydrothermal introduction of indite during
  quartz-associated replacement of cassiterite is a geological
  interpretation of textures and associations, not an experimentally
  demonstrated formation pathway. Cited laboratory synthesis conditions
  and separate heating experiments on dzhalindite are not natural indite
  formation conditions. This record denotes the mineral species,
  separately from elemental indium, synthetic FeIn2S4 materials and the
  mixed cassiterite ore. No microbial mechanism, extraction yield,
  industrial recovery or constituent-derived criticality designation is
  assigned by this identity and natural-specimen evidence.
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC. The New IMA List of Minerals, September 2026;
      definitions on PDF page 1 and Indite row on page 101:
      FeIn2S4, A, 1967 s.p., Russia. The special-procedure year is
      retained as reported without inventing a numbered IMA accession.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-12'
  - id: genkin_muraveva1963
    title: >-
      Genkin AD and Murav'eva IV (1963). Indite and dzhalindite,
      new indium minerals. Zapiski Vsesoyuznogo Mineralogicheskogo
      Obshchestva 92(4), 445-457, original Russian article.
      Complete 16-page PDF inspected: 13 numbered pages and three
      inserted original plates, including Figures 1-10 and Tables 1-8.
      Indite occurrence and analysis on pages 445-447, Table 2 and
      Figures 1-5; natural versus synthetic diffraction in Table 3
      and Figure 6 on pages 448-449; inferred geological sequence on
      pages 454-456 and Figure 10. Table 8 reuses earlier cassiterite
      analyses and is not an indite recovery experiment. The public
      RRUFF reference catalogue links this original file.
    url: https://www.rruff.net/odr/view/downloadfile/74558
    accessed_on: '2026-10-12'
  - id: handbook_indite
    title: >-
      Handbook of Mineralogy. Indite, version 1, copyright 2001-2005.
      Complete one-page original entry inspected; natural
      microspectrographic chemistry is separated from ideal FeIn2S4,
      with Dzhalinda occurrence, cubic identity and the 1963 reference.
    url: https://handbookofmineralogy.org/pdfs/indite.pdf
    accessed_on: '2026-10-12'
