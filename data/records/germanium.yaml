mechanisms:
- id: putida_catechol_associated_accumulation
  name: Catechol-associated germanium accumulation by Pseudomonas putida
  process: other
  description: Living ATCC 33015 cells accumulated germanium from GeO2-supplemented laboratory media. Catechol-associated accumulation included an intracellular component alongside envelope binding. An inducible catechol-transport explanation remains proposed. The two papers are companion studies from the same laboratory, not independent replication. Bioaccumulation is represented as other rather than isolated-product recovery.
  context: NCBITaxon:303 identifies the species, not ATCC 33015. The kinetic study used acetate-grown inocula, aerated mineral medium at pH 7.3, 2 mM GeO2, and 4 mM catechol or 5/10 mM acetate; cultivation used 30 degrees C and reciprocating shaking. Washed, sonicated pellets were measured by 71Ge scintillation, normalized to dry cell mass, over approximately 15 hours. The separate localization/fractionation study used 10 mM GeO2, 4 mM catechol or 10 mM acetate, and 30 degrees C shaking; its fractionation assay used 300 mL with about 0.15 g initial dry cells and 12 hours. Cells were washed with distilled water before sonication, differential centrifugation and radiometric fraction analysis.
