id: cmmmech:zinc
name: Zinc
material_kind: element
description: >-
  Zinc (Zn), atomic number 30. The zinc-atom identifier grounds this element
  record, not dissolved Zn(II), zinc sulfide, sphalerite, or a zinc concentrate.
  The United States designation maps the listed zinc commodity to this element;
  it does not designate every zinc-bearing mineral or waste. The curated
  experiments concern laboratory dissolution of a sphalerite concentrate.
