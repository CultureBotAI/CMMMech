    functional_role: Pyridoxal-phosphate-dependent cysteine synthase CysK (EC 2.5.1.47) coupling sulfide and O-acetyl-L-serine in bacterial cysteine/sulfide metabolism.
    annotation_note: Grounded to Klebsiella planticola (NCBITaxon:575) reference proteome UP001293169 entry UniProtKB:A0A0D8SNU2 (cysK), representing species-rank sulfur assimilation and cysteine homeostasis in Klebsiella planticola strain Cd-1.
    evidence:
    - source_ref: sharma_2000
      supports: partial
      explanation: Sharma et al. (2000) documented anaerobic cadmium tolerance and CdS-associated biomass formation by Klebsiella planticola Cd-1 at 5 mM Cd(II) with and without 5-10 mM thiosulfate (Figures 2-3), without genetic perturbation of cysK.
    - source_ref: uniprot_klebsiella_planticola_sulfur
      supports: partial
      explanation: UniProtKB:A0A0D8SNU2 (A0A0D8SNU2_KLEPL, cysK) in Klebsiella planticola reference proteome UP001293169 (NCBITaxon:575) encodes Cysteine synthase (EC 2.5.1.47; GO:0004124 cysteine synthase activity) as a species-level reference-proteome proxy for isolate Cd-1.
  evidence:
  - source_ref: sharma_2000
    supports: support
    explanation: Figures 2-3 compare sulfur XANES and cadmium EXAFS against reference compounds and cadmium-free biomass, supporting Cd-S coordination; Cd-O ligands also remain unresolved. The separate washed-pellet methylene-blue assay estimates approximately 1 mM CdS from sulfide, not directly measured cadmium recovery.
  - source_ref: sharma_2000
    supports: partial
    explanation: No matched cell-free precipitation comparison is reported. Thiosulfate interferes with the sulfide assay and was removed by pellet washing. These experiments do not identify an enzyme, establish a complete cadmium mass balance, or distinguish all abiotic contributions.
