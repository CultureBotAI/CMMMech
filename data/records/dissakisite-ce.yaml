id: cmmmech:dissakisite-ce
name: Dissakisite-(Ce)
material_kind: mineral
description: >-
  Dissakisite-(Ce) (IMA 1990-004) is an IMA-accepted
  calcium-cerium-magnesium-aluminum sorosilicate mineral of the epidote group,
  the magnesium analogue of allanite-(Ce), with IMA September 2026 Master List
  formula CaCe(Al2Mg)(Si2O7)(SiO4)O(OH) and core-based empirical formula
  Ca1.05(Ce0.57La0.33Nd0.07Pr0.03)Sigma1.00Mg0.93Fe0.14Ti0.06Al1.91Si2.94O12(OH)0.94F0.06
  (as reported in the paper's abstract). Described by Grew et al. (1991) from a
  forsterite-clinohumite-phlogopite-spinel calc-silicate marble lens in
  granulite-facies metamorphic rocks at Balchen Mountain (72°S, 27°30'E),
  eastern Sør Rondane Mountains, East Antarctica (sample EG88011814, holotype
  NMNH 168421). Monoclinic (space group P21/m), with a = 8.916(20) Å, b =
  5.700(8) Å, c = 10.140(25) Å, beta = 114.72(14)°, V = 468.10 Å3, Z = 2, Dmeas
  = 3.75(15) g/cm3, Dcalc = 3.97–4.02 g/cm3, and biaxial (+) optics with alpha =
  1.735(3), beta = 1.741(3), gamma = 1.758(3), and 2Vmeas = 64.2(3)°.
