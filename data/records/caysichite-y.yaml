    title: >-
      Krivovichev SV, Yakovenchuk VN, Goychuk OF and Pakhomovsky YA
      (2025), Caysichite-(Y) from the Ploskaya Mountain (Kola Peninsula,
      Russia): Crystal-Structure Refinement and the Chemical Formula.
      Crystals 15:799, DOI 10.3390/cryst15090799. Full sixteen-page
