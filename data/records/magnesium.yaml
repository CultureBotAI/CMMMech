        evidence:
          - source_ref: suyamud_2020
            supports: support
            explanation: >-
              Table 2 and Figures 3-5 in Suyamud et al. (2020) document acidification
              and transformation of struvite and dittmarite feeds.
      - source: mg_ammonium_phosphate_feeds
        target: magnesium_oxalate_dihydrate_crystals
        predicate: transforms_into
        relationship: precipitation of magnesium oxalate dihydrate (glushinskite)
        description: >-
          Mobilized Mg2+ precipitates with fungal oxalate as magnesium oxalate
