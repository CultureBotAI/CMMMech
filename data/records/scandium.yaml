      covalently immobilized on agarose beads for selective Sc(III) capture and pH-step chromatographic
      separation.
    annotation_note: Mechanism organism is recorded at species level Methylorubrum extorquens (NCBITaxon:408);
      grounded to the canonical Methylorubrum extorquens AM1 Swiss-Prot reference proteome entry Mex-LanM
      (UniProtKB:C5B164, NCBITaxon:272630, UP000009081).
    evidence:
    - source_ref: dong2024
      supports: support
      explanation: Immobilized Mex-LanM selectively binds Sc(III) over competing transition/base metals
        and elutes high-purity scandium upon mild acid stripping.
