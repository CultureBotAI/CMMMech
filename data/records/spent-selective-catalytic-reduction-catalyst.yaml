id: cmmmech:spent-selective-catalytic-reduction-catalyst
name: Spent selective catalytic reduction catalyst
material_kind: secondary_resource
description: Used vanadia-tungsta/titania catalysts from coal-fired power-plant flue-gas denitrification, represented by separately characterized laboratory feeds. Niu and colleagues studied an arsenic-contaminated honeycomb catalyst from a Xinjiang plant; Su and colleagues separately studied gray and yellow regions of three spent honeycomb catalysts, S3–S5. This manufactured, heterogeneous secondary resource is distinct from refinery hydroprocessing, fluid catalytic cracking and sulfuric-acid-production catalysts, pure constituent oxides, mineral species and elemental vanadium or tungsten. V2O5-WO3/TiO2 is the sources' catalyst formulation notation, not proof of three separately quantified crystalline phases. Fresh catalysts S1–S2 in Su's study are comparators, not spent-resource observations. No criticality designation is inherited from the constituents.
sources:
- id: niu2025
  title: Niu T, Xie X, Zhang X, Ma X, Feng F, Liu D and Tian B (2025). Mild Extraction and Green Regeneration of Arsenic from Spent SCR Catalysts. Nonferrous Metals (Extractive Metallurgy), issue 12:38–45. DOI 10.20237/j.issn.1007-7545.2025.12.004. Complete official eight-page Chinese-language article with English abstract; Methods 1.1–1.6, Tables 1–7 and Figures 1–3. DOI resolves through the Chinese DOI registration service; Crossref lookup returned 404.
  url: https://doi.org/10.20237/j.issn.1007-7545.2025.12.004
  accessed_on: '2026-10-12'
