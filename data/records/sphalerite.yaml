mechanisms:
  - id: fc1_concentrate_bioleaching
    name: Conditional bacterial enhancement of sphalerite dissolution
    process: bioleaching
    description: >-
      Living Thiobacillus ferrooxidans FC1, using its published name,
      enhanced sphalerite-concentrate dissolution under selected elevated
      ferrous-ion conditions relative to chemical controls with matched
      bulk iron chemistry. The authors interpret surface analyses and
      kinetic fits as support for removal of a sulfur product layer.
      The experiments do not demonstrate direct enzymatic oxidation
      of the ZnS lattice or a particular sulfur-oxidation enzyme.
    context: >-
      Both studies used Gamsberg flotation concentrate reported as
      98% sphalerite by XRD, with 53.3% Zn, 7.84% Fe, 32.5% S,
      1.19% Mn and 0.24% Pb. The authors interpret Fe as solid solution
      in sphalerite rather than a separate mineral; this is not a pure
      ideal-ZnS reagent. Concentrate was milled and screened to
      45-53 micrometres and washed in 0.5 M sodium sulfide to remove
      flotation agents and sulfidize its surface. The stirred, aerated
      two-compartment electrolysis cell had 2 L working volume,
      5 g concentrate/L, 10% v/v living FC1 inoculum, pH 1.6,
      35 +/- 0.1 degrees C and 5.9 mg/L dissolved oxygen. Electrolytic
      redox control maintained bulk iron concentrations during biotic
      and chemical runs; uninoculated controls were checked microscopically
      for bacteria. The 1999 series varied Fe(II) with Fe(III) held at
      1 g/L. Zinc was measured by atomic spectrophotometry in
      0.45-micrometre filtrate. Ten analytical replicates describe
      assay repeatability, not biological reactor replication.
      NCBITaxon:920 maps the published species name, not a verified
      accession or modern genomic reassignment of strain FC1.
      The apparatus controlled solution chemistry; it did not demonstrate
      downstream zinc-product recovery or industrial deployment.
    microbial: true
    organisms:
      - id: NCBITaxon:920
        label: Acidithiobacillus ferrooxidans
    evidence:
      - source_ref: fowler_crundwell_1999
        supports: support
        explanation: >-
          Figures 2-3 show later divergence of zinc dissolution after an
          initial approximately 8-12 h interval with similar dissolution.
          Figures 5-6 compare surfaces at Fe(II) 4 g/L after 100 h and
          8 g/L after 69 h, respectively. SEM/EDAX and shrinking-core
          fits support the authors' sulfur-layer explanation, without
          a sulfur mass balance or enzyme assay. These surface endpoints
          are distinct from the shorter Figure 2 dissolution time course.
          No recovery percentage is estimated from the figures.
      - source_ref: fowler_crundwell_1999
        supports: partial
        explanation: >-
          The 1 g/L Fe(II) series in Figures 2-3 also departs from
          equal dissolution, in tension with the Discussion's sharp
          low-ferrous null boundary. A universal 1 g/L threshold is
          therefore not asserted. Figure 10 reanalyzes earlier 1998
          data and is not new independent replication.
      - source_ref: fowler_crundwell_1998
        supports: partial
        explanation: >-
          Methods and Figures 4-6 report similar zinc dissolution in
          inoculated and chemical runs with Fe(II) fixed at 1 g/L
          and varied Fe(III), despite bacterial growth and attachment.
          This conditional null limits a universal enhancement claim.
          Figure 3's illustrative current caption gives different iron
          concentrations from the Methods; no quantitative current-based
          claim is taken from that panel.
