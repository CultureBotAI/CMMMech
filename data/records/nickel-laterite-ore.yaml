id: cmmmech:nickel-laterite-ore
name: Nickel laterite ore
material_kind: primary_resource
description: Naturally occurring heterogeneous nickel-bearing regolith formed by intense weathering of ultramafic parent rocks, including oxide-rich limonitic, clay-rich and hydrous magnesium-silicate-rich horizons. The USGS deposit model grounds this geological resource identity; excavated or stockpiled unprocessed ore remains within its scope. It is distinct from nickel metal, a mineral species such as goethite, a product-grade commodity and processing-generated laterite tailings. Individual ore samples differ in mineralogy and nickel, cobalt and chromium distribution; their laboratory leaching outcomes do not apply to every laterite or establish extraction from a pure host mineral.
