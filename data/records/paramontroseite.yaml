id: cmmmech:paramontroseite
name: Paramontroseite
material_kind: mineral
description: Paramontroseite is the orthorhombic vanadium dioxide mineral, ideal VO2, listed as grandfathered
  (G), original-description year 1955, in the September 2026 IMA list. The year is not a numbered IMA
  approval. It is structurally distinct from generic VO2 and rutile-type or monoclinic VO2 phases, and
  chemically distinct from montroseite VO(OH). Evans and Mrose established the natural diffuse-B phase
  in altered Bitter Creek montroseite crystals using a Pbnm model. The inferred natural weathering relation
  is distinct from the later laboratory heating of Fe-rich Prachovice paramontroseite. The 2023 specimen
  is zoned, Al-bearing and nonideal; its refinement favors Fe in a separate tetrahedral site and cannot
  be substituted for a pure-VO2 endmember or a measurement on the 1950s Colorado specimen. Criticality
  is not inherited from vanadium, and the curated studies establish no microbial mechanism or industrial
  recovery.
