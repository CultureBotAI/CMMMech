        supports: partial
        explanation: Uninoculated feed controls establish the conditional culture-associated difference, but no pH-matched or killed-cell hematite/feldspar comparator separates acidification from other effects. The acid-buffer comparison, detailed transcriptomics, metabolomics, EPS and biofilm assays concern biotite; their quantitative or causal results are not transferred to this feed. Figure 5 reports a separate 12-hour RT-qPCR response to this mineral; expression associations do not demonstrate gene necessity, and the Discussion explicitly calls for functional validation. No isolated-metal product, whole-feed recovery percentage, mineral-specific mass balance or industrial deployment is demonstrated.
causal_graphs:
  - id: pma2_2_potassium_feldspar_dissolution_graph
    name: Priestia megaterium PMA2-2 mineral-inducible gene response, culture acidification, and aluminium mobilization from potassium-feldspar feed
    description: 'Causal pathway linking the six mineral-inducible genes verified by 12-h RT-qPCR on potassium-feldspar in Priestia megaterium PMA2-2 (Figure 5 and Table 2 of Dong et al., 2026: spo0A / UniProtKB:P52932 and UP000031829 UniProtKB:A0A0B6ANB3, acs / acsA UniProtKB:D5DTY8, wecC / UniProtKB:A0A0B6ASU1, lysA / UniProtKB:A0A0B6ACY5, flgF / UniProtKB:A0A0B6AS33, and ltaS / ltaS1 UniProtKB:A0A0B6APG1) to culture acidification of glucose minimal medium (pH 4.69 +/- 0.01 at 12 h and 4.60 +/- 0.02 at 24 h vs 7.00 +/- 0.01 and 6.99 +/- 0.01 in uninoculated controls, Table S6) and 0.45-um-filtered Al mobilization (13.09 +/- 1.13 and 21.48 +/- 2.67 uM at 12 and 24 h vs 0.19 +/- 0.05 and 0.11 +/- 0.05 uM in controls; K was not measured) from 0.60 g potassium-feldspar feed (75-150 um; 19.24% Al2O3, 60.57% SiO2, 9.87% K2O, 4.51% Na2O, Table S7), while preserving that no pH-matched abiotic control or gene knockout was performed.'
    scope: REPRESENTATIVE_EXAMPLE
    mechanism_ref: pma2_2_potassium_feldspar_dissolution
    nodes:
      - id: pma2_2_kfeldspar_induced_gene_module
        label: Priestia megaterium mineral-inducible gene module on potassium-feldspar (spo0A, acs/acsA, wecC, lysA, flgF, ltaS/ltaS1)
