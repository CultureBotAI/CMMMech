      label: cytoplasm
    - id: GO:0004792
      label: thiosulfate-cyanide sulfurtransferase activity
    functional_role: Cytoplasmic rhodanese-domain thiosulfate sulfurtransferase GlpE (EC 2.8.1.1) catalyzing sulfur transfer from thiosulfate to thiophilic acceptors and sulfite/sulfide generation pathways.
    annotation_note: Grounded to Klebsiella planticola (synonym Raoultella planticola, NCBITaxon:575) reference proteome UP001293169 entry UniProtKB:A0A443VK69 (glpE), matching the species-rank organism assignment for salt-marsh isolate Klebsiella planticola strain Cd-1 in Sharma et al. (2000).
    evidence:
    - source_ref: sharma_2000
      supports: partial
      explanation: Sharma et al. (2000) demonstrated that Klebsiella planticola Cd-1 grown anaerobically with 5 mM Cd(II) and 5 or 10 mM sodium thiosulfate accumulated ~1 mM acid-labile sulfide (methylene-blue assay on washed pellets) and formed CdS-associated solids verified by S-XANES and Cd-EXAFS (Figures 2-3); specific thiosulfate-converting enzymes (such as GlpE or PhsABC) were not purified or genetically knocked out in strain Cd-1.
    - source_ref: uniprot_klebsiella_planticola_sulfur
      supports: partial
      explanation: UniProtKB:A0A443VK69 (A0A443VK69_KLEPL, glpE) in Klebsiella planticola reference proteome UP001293169 (NCBITaxon:575) encodes Thiosulfate sulfurtransferase GlpE (EC 2.8.1.1; GO:0004792 thiosulfate-cyanide sulfurtransferase activity) as a species-level reference-proteome proxy for unsequenced salt-marsh isolate Cd-1.
