- evidence_id: original
  kind: primary_source
  reference: https://doi.org/10.2138/am-1998-1-219
  locator: Complete seven-page original read/all pages visually inspected; methods
    p. 179, Tables 1–2 p. 180, enlarged Table 5 p. 181, Figures 1–2 and discussion
    pp. 182–183.
  accessed_at: '2026-10-16T06:11:42.864885Z'
  support: supports
  summary: Giester et al. 1998 abstract and pp. 179–181 distinguish six chemically
    characterized specimens from seven X-ray refinements. The original Flink M.M.
    no. 392 crystal, Narssarssuk 1*, was damaged by the beam and has only qualitative
    EDX Na evidence. Table 5 footnotes exclude that crystal from chemical analyses,
    mark selected Na measured by DCP and calculate CO2 by difference. Page 183 reports
    no reliable water analyses. The owner accurately avoids treating these as complete
    direct microprobe results. Methods p. 179 and Tables 1–2 support the seven P63/mmc
    refinements and lack of conclusive preference for attempted P-62c. The 1998 formula
    (Na1-xCax/2)BaCe2(CO3)4F uses Ce as a proxy for summed REE; Na/Ca cannot be determined
    from scattering alone because Ca scatters approximately twice Na. Chemistry constrains
    that substitution. Figures 1–2 and discussion pp. 182–183 support comparative
    structural identity with historical baiyuneboite, rather than a processing experiment.
    The claim is attributed to this comparative/type-material study; no access to
    every earlier Chinese original is implied.
  snapshot_sha256: b77495b11d3bbc496680412bb8f1191c6c30d8e618dbb2ce381862ba891c97f4
