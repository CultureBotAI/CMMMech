id: cmmmech:lepidocrocite
name: Lepidocrocite
material_kind: mineral
description: Lepidocrocite is the Fe(III)O(OH) mineral species listed as approved (A), with 1980 special-procedure history, in the September 2026 IMA master list. The 1980 s.p. entry is not an approval-number CURIE. This species is distinct from goethite, akaganeite, iron element, iron-ore commodities, and the chemically prepared or commercial laboratory feeds discussed below. No iron criticality designation is inherited.
