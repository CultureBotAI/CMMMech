limitations:
- 'Fresh independent scientific scope is the Morrison 2013 complete original JATS/HTML,
  three figures from each of two routes, nine formula/symmetry rasters, deposited
  CIF/HKL and resulting bounded owner change. Original IMA authority inspection remains
  the 16 October prior independent review; no fresh IMA or broader Vallina 2015/issue
  #421 synthesis review is claimed.'
- The same natural specimen contains mixed rare-earth chemistry; its bulk empirical
  coefficients and the all-REE-as-Nd scattering model are distinct. Native parsing
  establishes neither site-resolved REE chemistry nor a pure Nd specimen.
- No H coordinate rows are deposited. Oxygen geometry does not recover excluded H
  positions; the duplicated OW4/OW2 symmetry-code2 contact has incompatible printed
  distances and is left unresolved.
- All 1,570 deposited independent structure-factor rows are inspected, not the 9,235
  original collection integrations or detector frames. Conventional R1 agrees at displayed
  precision; direct weighted arithmetic does not exactly reproduce stored wR/S. No
  least-squares refinement, checkCIF run or reintegration was performed.
- Printed chemistry totals 100.07 and water-by-difference 23.43 versus printed 23.50
  remain conditional source arithmetic, with no correction/renormalization imported.
- Current article PDF and checkCIF result were not acquired; complete original XML/HTML
  and native files were available. Version comparisons to absent historical raw roots
  use verified historical digest declarations, not fresh reads of missing old files.
- No microbial mechanism, organism/strain, biomass state, experimental recovery yield,
  deployment or jurisdiction/list/edition criticality is inferred. Native validity
  is not experimental verification.
- Current searches are bounded returned results and local ignored/hidden/followed
  identity matches, not exhaustive literature or machine-wide absence claims.
