  evidence:
  - source_ref: kordloo2026
    supports: support
    explanation: Methods pp. 2-4, Figure 1 and Supplementary Figure S3 establish upstream culture preparation followed by cell-removed reagent leaching. Figure 1 shows an early ultrasonic benefit for Ni/Cr at ambient temperature, 10 g/L and 400 rpm; Cu differences are small and the prose explicitly reports no significant Cu effect. Longer-time differences narrow. This is a conditional ultrasound result using biogenic reagent, not proof of a unique microbial extraction advantage.
  - source_ref: kordloo2026
    supports: partial
    explanation: Figure 4 and results pp. 7-8 report 92.51% Cr, 86.91% Cu and 91.25% Ni at 8 min, 45 °C, 400 rpm and 10 g/L. Higher temperature and later times reduce reported dissolved fractions in several arms; ambient-temperature endpoints can exceed the 8 min optimum, so this is not a universal maximum. The paper provides no explicit extraction equation or complete sampling/mass balance; Table S2 reports final-PLS concentrations in ppm without sufficient linkage to reconstruct these percentages. No isolated saleable product or plant-scale operation is shown.
  - source_ref: kordloo2026
    supports: partial
    explanation: A chemistry-matched sterile H2SO4/ferric-iron control is absent, explicitly proposed as future work on p. 11. Figures 5/S5 support source-assigned hydronium-jarosite-containing residues and surface-composition changes; they do not directly measure Cr/Cu/Ni incorporation into that phase or establish the proposed passivation/rate-control pathway. Medium descriptions disagree on 44.22 versus 44.7 g/L and print Fe2SO4·7H2O versus FeSO4·7H2O. Table 4 lists six solids levels including 25 g/L, while Figure 3 displays five without 25 g/L; these are not harmonized.
  - source_ref: kordloo2026
    supports: refute
    explanation: 'The broad abstract claim that both toxicity tests demonstrate detoxification is contradicted by p. 10 and Figure S6a: residue Ni is 13.9 mg/L, above the source''s 5 mg/L TCLP comparator. Figure S6b labels the SPLP Ni threshold not stated, despite prose claiming both metals fall below thresholds. These limited extraction tests do not establish general detoxification or safe landfill disposal; source comparator values are not independently adopted regulatory limits.'
  - source_ref: ncbi920
    supports: context_only
    explanation: NCBI confirms the species label/identifier used by both papers. It cannot authenticate either unnamed experimental culture or resolve their purity, strain, or molecular mechanism.
