  title: 'Levar CE, Hoffman CL, Dunshee AJ, Toner BM and Bond DR (2017). Redox potential as a master variable controlling pathways of metal reduction by Geobacter sulfurreducens. ISME Journal 11:741-752. DOI 10.1038/ismej.2016.146. Complete 12-page original and Europe PMC XML: Methods pp742-744, Table 1, Results pp745-749, Figure 2.'
