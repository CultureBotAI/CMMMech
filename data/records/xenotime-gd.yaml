id: cmmmech:xenotime-gd
name: Xenotime-(Gd)
material_kind: mineral
description: >-
  Xenotime-(Gd) is the gadolinium-dominant xenotime species with ideal
  formula Gd(PO4), approved as IMA 2023-091. Its tetragonal I41/amd
  structure distinguishes it from monoclinic monazite-(Gd), despite
  their shared ideal formula. Ondrejka et al. (2024) characterized
  natural domains up to 20 micrometres across within xenotime-(Y)
  from the Zimna Voda quartz vein near Prakovce, Slovakia. Electron
  microprobe analyses at and near the holotype lamella average
  29.16 wt% Gd2O3 across six points in Table 2, with substantial Y
  and Dy; these are mixed mineral compositions, not pure GdPO4,
  bulk ore grade or recovered gadolinium yield. High-resolution
  transmission electron microscopy, Fourier-transform patterns
  and Raman observations support xenotime-type identity.
  Single-crystal and powder X-ray diffraction were not obtained;
  Table 3 is a calculated powder pattern. The cell parameters from
  25 Fourier-transform reflections and those estimated from weighted
  end-members are separate results. Density and refractive index
  are calculated, and several physical properties remain unmeasured.
  The 2026 corrigendum replaces Figure 4 because the black Raman
  traces for xenotime-(Y) and xenotime-(Gd) were interchanged; its
  authors retain the original text and interpretations. The proposed
  hydrothermal origin does not establish a controlled formation
  mechanism, microbial activity, recovery performance, industrial
  deployment or a jurisdiction-specific criticality designation.
