    annotation_note: Grounded to reference-proteome entry UP000001362 for type strain Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159), representing Acidithiobacillus ferrooxidans strain LR (NCBITaxon:920; pages 33, 36-39, and 50-58) tested on 5% w/v Brazilian flash-furnace nickel smelter slag in Munoz Blandon (2010).
