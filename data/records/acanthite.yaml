id: cmmmech:acanthite
name: Acanthite
material_kind: mineral
description: Acanthite is the monoclinic silver sulfide mineral Ag2S, listed as grandfathered with original-description year 1855 in the September 2026 IMA master list. It is distinct from elemental silver, generic silver-containing nanoparticles and the high-temperature cubic Ag2S form commonly called argentite. A laboratory bacterial study identifies acanthite as a minority particle type within a mixed silver-containing population. No criticality designation is inherited from silver.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 3, Acanthite row; page 1 explains grandfathered status and original-description years. Retained original rechecked.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: handbook_acanthite
  title: Handbook of Mineralogy. Acanthite, version 1 (2001-2005), one-page species entry; monoclinic crystal data and distinction from high-temperature cubic argentite.
  url: https://handbookofmineralogy.org/pdfs/acanthite.pdf
  accessed_on: '2026-10-14'
- id: klaus1999
  title: Klaus, Joerger, Olsson and Granqvist (1999). Silver-based crystalline nanoparticles, microbially fabricated. PNAS 96, 13611-13614. Complete original PMC full text, Materials and Methods, Results and Discussion, and original Figures 1-3, especially Figure 3b.
  url: https://doi.org/10.1073/pnas.96.24.13611
  accessed_on: '2026-10-14'
- id: ncbi_stutzeri
  title: NCBI Taxonomy 316. Stutzerimonas stutzeri, current species entry with Pseudomonas stutzeri as a homotypic synonym; not an identifier for strain AG259 or independent sequence verification of that historical isolate.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=316&mode=Info
  accessed_on: '2026-10-14'
mechanisms:
- id: ag259_associated_acanthite_particles
  name: Minority acanthite particles associated with silver-exposed bacterial cells
  process: biomineralization
  description: The strain reported as Pseudomonas stutzeri AG259 contained a small number of particles assigned to monoclinic Ag2S by combined electron diffraction and energy-dispersive X-ray analysis after growth on silver-nitrate-containing agar. Most of the analyzed silver was assigned to elemental silver, and a third crystal type remained unresolved. This supports culture-associated acanthite occurrence, without establishing an exclusively biological precipitation route, a pure product or a recovery yield.
  context: AG259 was supplied by J. T. Trevors and described as originally isolated from a silver mine. The species mapping retains the authors' identification under the current NCBI name; no strain-specific accession or sequence is supplied in this study. Cultures were maintained in Lennox L broth and grown on Lennox L agar containing nominally 50 mM AgNO3 at 30 degrees C for 48 hours in the dark. The article does not specify assay pH, inoculum density, agar recipe, free dissolved silver concentration, biological replicate count or a matched cell-free, killed-cell or sulfide control series. Growing cells were harvested, fixed for two hours in 2.5% glutaraldehyde in distilled water, sedimented at 1500 g for ten minutes and washed three times. Thin-section preparation included ethanol dehydration, epoxy embedding and polymerization at 60 degrees C for two days; some sections were stained with uranyl acetate and lead citrate. TEM operated at 200 kV on titanium grids. The study is a laboratory
    microscopy observation in processed cells, not an ore-leaching assay, isolated silver-sulfide recovery or industrial deployment.
