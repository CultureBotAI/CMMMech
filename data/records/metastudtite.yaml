id: cmmmech:metastudtite
name: Metastudtite
material_kind: mineral
description: >-
  Metastudtite is the uranyl peroxide dihydrate mineral UO4·2H2O,
  equivalent in composition to (UO2)(O2)(H2O)2. The September 2026
  IMA list gives approved status A and approval accession 1981-055.
  It is distinct from studtite, other uranium hydrates, elemental
  uranium and uranium commodities. The original description concerns
  natural Shinkolobwe material and a separate heated natural-studtite
  mixture; modern thermal and aqueous experiments used synthetic
  substrates. A particular historical structure model is not asserted
  as the unique current structure. No criticality, microbial activity,
  isolated uranium recovery or industrial deployment is inferred.
