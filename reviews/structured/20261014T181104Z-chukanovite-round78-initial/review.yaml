- Mixed fitted phase assignment with inconclusive diffraction, limited matched-control
  metadata and unobserved intermediates; no biological necessity or direct enzymatic
  pathway established.
- Phosphate-arm contradiction and μM/day versus mM/day conflict remain unresolved;
  no phase-specific mass yield or industrial recovery.
- Complete originals accessed; full relevant claim-bearing methods/tables/graphics
  inspected, not every unrelated mineral/donor arm re-curated. No exhaustive notice/supplement
