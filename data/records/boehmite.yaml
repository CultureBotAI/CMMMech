id: cmmmech:boehmite
name: Böhmite
material_kind: mineral
description: Böhmite, commonly spelled boehmite in the experimental literature, is the orthorhombic aluminium
  oxyhydroxide mineral AlO(OH), commonly designated gamma-AlOOH. It is distinct from diaspore, the Al(OH)3
  polymorphs, elemental aluminium, heterogeneous bauxite and the broad refined alumina commodity. The
  September 2026 IMA list gives grandfathered status and original-description year 1927, not a unique
  approval accession. The curated evidence concerns chemically synthesized nanoscale boehmite; no microbial
  mechanism, constituent criticality or industrial recovery performance is inferred.
