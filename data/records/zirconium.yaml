mechanisms:
  - id: hc1_culture_thermal_preparation
    name: HC1 culture-associated preparation followed by zirconia calcination
    process: other
    description: >-
      A preparation containing Streptomyces sp. HC1 culture and potassium
      hexafluorozirconate yielded a collected solid that was dried and
      calcined before characterization as zirconia-containing material.
      Microbial participation in the preparation is reported, but its
      necessity and the identity of a biologically formed precursor remain
      unresolved. The oxide product does not establish reduction of Zr(IV)
      to metallic zirconium or an enzymatic zirconium redox pathway.
    context: >-
      HC1 was supplied by Hacettepe University's Biotechnology Department;
      no sequence accession or culture-collection identifier is supplied
      in the inspected paper. Section 2.2 describes mycelium or spores in
      100 mL LB in a 250 mL flask, grown at 25 degrees C, pH 9 and 200 rpm
      for 72 h. Culture was mixed with 100 mL of 1 mM K2ZrF6 at pH 3.6
      and shaken at 200 rpm for 24 h; this stock concentration is not a
      demonstrated final mixture concentration. Reaction temperature is
      not separately specified. Centrifugation at 10000 rpm for 10 min,
      drying at 40 degrees C for 24 h and calcination at 450 degrees C
      for 3 h preceded product characterization. The Results instead
      describe Nutrient Broth and a 25 mL inoculum into 75 mL broth,
      followed by adjusted reaction pH values; the medium/protocol
      discrepancy is unresolved. Laboratory particle preparation is
      distinct from ore extraction, purified-element recovery and
      industrial deployment.
    microbial: true
    evidence:
      - source_ref: agceli_2023
        supports: support
        explanation: >-
          Sections 2.2-2.3 and 3.1 identify the culture-containing
          preparation and mandatory thermal steps. Figure 5 shows an
          aggregated particulate material and an EDX spectrum labelled
          Zr and O; Figure 4 supplies XRD data. These support a
          zirconium-containing processed solid, without an isolated
          product mass, zirconium mass balance or recovery percentage.
      - source_ref: agceli_2023
        supports: partial
        explanation: >-
          Section 2.2 states that uninoculated medium plus K2ZrF6 controls
          were performed, but no matched synthesis-control outcome is
          reported in the inspected full text or figures. The pre-calcination
          solid is not separately phase-characterized. Figure 4 includes
          reference patterns labelled synthetic Tazheranite ZrO2 and
          Sylvite KCl, while the prose discusses tetragonal and monoclinic
          zirconia. This does not establish a pure single zirconia phase.
          The proposed NADH/reductase explanation was not experimentally
          tested, and Zr remains formally +4 in both feed and ZrO2.
      - source_ref: agceli_2023
        supports: partial
        explanation: >-
          Figures 1-2 report number-weighted and volume-weighted size
          distributions respectively, so their axes are not interchangeable.
          The Results list reaction pH 5-7, whereas Figure 1 also plots
          pH 8 and 9. Figure 5's micrometre-scale aggregates and the
          text's 12.07 +/- 4.19 nm particle claim do not supply a transparent
          common measurement basis or sampling count. No validated size
          optimum is adopted here. Antimicrobial assays in Sections 3.2-3.3
          concern the prepared particles and do not prove microbial
          causality in their synthesis.
