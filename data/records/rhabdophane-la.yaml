- id: shelyug2018
  title: >-
    Shelyug A, Mesbah A, Szenknect S, Clavier N, Dacheux N and
    Navrotsky A (2018). Thermodynamics and Stability of Rhabdophanes,
    Hydrated Rare Earth Phosphates REPO4·nH2O. Frontiers in Chemistry
