  accessed_on: '2026-11-10'
mechanisms:
- id: bacillus_iron_impurity_leaching
  name: Limited culture-associated iron leaching in EDTA-containing medium
  process: bioleaching
  description: A living wastewater-derived Bacillus isolate was tested for removal of iron impurities from sterilized kaolin mine waste. Inoculated high-iron samples showed more dissolved iron than the corresponding uninoculated medium in the displayed assays, but the medium itself leached iron and the paper reported less than 1 percent elimination. Organic-acid and redox observations support a possible microbial contribution without demonstrating a specific respiratory pathway or separating all chemical and microbial effects. This is laboratory evidence of poor beneficiation performance, not a validated industrial recovery process.
  context: Methods pp388-390 describe Caobar mine-dump samples from iron-rich beds. Table 2 gives 92.20 and 97.00 mass percent kaolinite in high- and low-iron feeds, respectively, with quartz and muscovite. Table 3 reports 3.06 and 0.34 mass percent Fe2O3, not elemental Fe percentages. Samples were autoclaved at 121 degrees C for 20 minutes. Isolate no. 91 came from a wastewater-treatment biological reactor in Madrid; the authors identify it as Bacillus thuringiensis EB63 according to GenBank but provide no sequence accession or independent strain-level verification. Isolate no. 37, identified as Bacillus cereus AH-2, was discarded before the leaching experiments. Reactivation and mass culture used LB agar at 30 degrees C for 24 hours; that temperature is not an unambiguous specification of the subsequent leaching incubation. Each inoculated assay contained 12.5 g feed, 250 mL medium and 1 mL inoculum. The inoculum suspension in 0.9 percent saline had OD 0.1, approximately 5 x 10^4 CFU/mL
    before dilution into the assay; bacterial clumps made aliquots comparable but not identical. Medium per litre contained 2 g K2HPO4, 1 g ammonium sulfate, 0.1 g CaCl2, 0.75 g disodium EDTA, 0.2 g NaCl, 0.085 g NaNO3, 0.2 g urea, 0.1 g yeast extract and 20 g glucose. Methods state initial pH adjustment to 7.5, while plotted initial values are near 6.8. Independently prepared duplicate cultures D1 and D2 covered high-iron feed with bacteria, low-iron feed with bacteria, and high-iron feed without bacteria. There was no displayed low-iron abiotic arm, pH-matched control or EDTA-free control. Assays lasted 14 days. Methods list sampling on days 0, 3, 7 and 14, whereas Figures 7-12 also show day 10 and Conclusions list days 3, 7, 10 and 14. Dissolved oxygen fell to approximately 0.4 mg/L or lower from day 3 in all arms, including controls. Successive 0.45- and 0.22-micrometre filtrates were assayed by AAS for total Fe, phenanthroline colorimetry for Fe(II), and subtraction for Fe(III); lauric-acid
    evidence used derivatization and GC-MS. No isolated iron product, commercial-quality kaolin or industrial deployment was established.
