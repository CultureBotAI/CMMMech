    target: dvh_dsvab_sulfite_reductase
    predicate: supplies_substrate_for
    relationship: ATP-dependent sulfate activation to APS and two-electron reduction to intracellular sulfite
    description: Sat (DVU_1295) activates sulfate to APS and AprBA (DVU_0846-DVU_0847) reduces APS to sulfite for terminal reduction by DsvAB-DsvC (DVU_0402-DVU_0403, DVU_2776) during lactate oxidation in N. vulgaris str. Hildenborough.
    evidence:
    - source_ref: mansor2019
      supports: partial
      explanation: Mansor et al. (2019) Methods pp. 3-4 cultivate Desulfovibrio vulgaris DSM 644 / ATCC 29579 (Nitratidesulfovibrio vulgaris str. Hildenborough) in anoxic lactate-sulfate medium; individual sulfate-activation enzymes were not directly assayed.
  - source: dvh_dsvab_sulfite_reductase
    target: biogenic_sulfide_ni_rich_medium
    predicate: produces
    relationship: dissimilatory sulfite reduction generating dissolved sulfide for nickel-sulfide precipitation
    description: DsvAB-DsvC (DVU_0402-DVU_0403, DVU_2776) reduces sulfite to dissolved sulfide that precipitates Ni-rich sulfide precursors in 100 mL metal-amended cultures prior to harvest and TEM processing.
    evidence:
    - source_ref: mansor2019
      supports: partial
      explanation: Mansor et al. (2019) Methods pp. 3-4 and Results p. 5 document nickel-sulfide precipitation in sulfate-reducing N. vulgaris str. Hildenborough cultures without direct enzymatic or biotic-sulfide-flux measurements.
  - source: biogenic_sulfide_ni_rich_medium
    target: polydymite_assigned_minor_phase
    predicate: transforms_into
    relationship: formation of a minor polydymite-assigned Ni3S4 component in recovered culture solids or during oxidative workup
    description: Processed Ni-rich culture precipitates (and abiotic counterparts) contain minor irregular particles with ~3.34 A lattice fringes assigned to polydymite (Ni3S4); whether formation occurred entirely in situ before harvest or partly via low-O2 oxidation during mounting/transport remains unresolved.
    evidence:
    - source_ref: mansor2019
      supports: support
      explanation: Table 2, Results p. 5, and Figure 4d assign a minor irregular-particle component in Ni-rich products to polydymite using lattice fringes near 3.34 A alongside precursor particles and vaesite.
    - source_ref: mansor2019
      supports: partial
      explanation: Discussion pp. 7-8 note that polydymite also appears in Fe-poor abiotic samples and may form by oxidation during mounting or transport under very low oxygen, preventing proof of exclusive in-culture biological synthesis.
    - source_ref: mansor2019_si
      supports: partial
      explanation: Table S1 lists overlapping polydymite (~3.34 A) and violarite (~3.35 A) 220 spacings, while annotated Figure 4c labels a 3.38 A reflection 100p in conflict with the main-text 220 assignment.
