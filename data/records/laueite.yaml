id: cmmmech:laueite
name: Laueite
material_kind: mineral
description: >-
  Laueite is a grandfathered triclinic manganese-ferric phosphate
  mineral with IMA ideal formula
  Mn(II)Fe(III)2(PO4)2(OH)2(H2O)6·2H2O and historical year 1954
  in the September 2026 list. It is distinct from stewartite and
  pseudolaueite, which have different framework arrangements, and
  from strunzite, which has a different water content. Moore (1965)
  determined the P-1 structure of a natural Palermo No. 1 Quarry,
  New Hampshire crystal; hydrogen positions were not located.
  Baur (1969) proposed Mn(III) substitution from earlier bond lengths,
  while acknowledging other substituents; this was an interpretation,
  not a direct oxidation-state assay or current species formula.
  Grey et al. (2025) demonstrated an epitaxial orientation of laueite
  on stewartite in a natural Hagendorf-Sud composite crystal by
  single-crystal diffraction and indexed faces. Its rhomb contained
  both minerals. The EDS-derived laueite metal composition
  Mn0.66Mg0.17Fe2.17, scaled to three metal atoms, differs from the
  simplified refined Mn/Mg site occupancy 0.93(2)/0.07; neither is
  the ideal species formula. The ferric assignment and adjusted
  hydroxyl/water proportions were inferred from bond-valence and
  charge-balance considerations. Deposited checks flag displacement
  parameters, missing hydrogen sites and formula/Z reporting
  differences, limiting detailed atomistic interpretation.
  Suggested solution changes and heterosite-assisted nucleation
  remain paragenetic hypotheses. No controlled transformation,
  microbial mechanism, recovery performance or inherited criticality
  designation is curated.
sources:
