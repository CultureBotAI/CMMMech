id: cmmmech:basic-oxygen-furnace-steelmaking-dust
name: Basic oxygen furnace steelmaking dust
material_kind: secondary_resource
description: Dust generated by basic oxygen steelmaking, represented here by a stockpiled material from a historical iron and steelworks at Teesside, UK. This is a mixed processing residue, distinct from basic oxygen furnace slag, electric-arc-furnace dust and blast-furnace cast-house dust. The sampled dust contains iron, zinc and other elements; neither its constituents nor the paper's terminology establishes a criticality designation for the whole resource. Laboratory leaching evidence applies to the prepared source sample.
sources:
- id: kara2024_bos_dust
  title: Tezyapar Kara, Huntington, Simmons, Wagland and Coulon (2024), Extracting metal ions from basic oxygen steelmaking dust by using bio-hydrometallurgy, Heliyon 10(11), e32437; DOI 10.1016/j.heliyon.2024.e32437. Methods 2.1-2.6, Results 3.1-3.2, Tables 1-3 and Figures 1-5.
  url: https://doi.org/10.1016/j.heliyon.2024.e32437
  accessed_on: '2026-10-11'
- id: dsm583
  title: DSMZ catalogue DSM 583, Acidithiobacillus ferrooxidans; collection identity corroborates the paper's named stock, without authenticating its adapted culture.
  url: https://www.dsmz.de/collection/catalogue/details/culture/DSM-583
  accessed_on: '2026-10-11'
- id: ncbi_ferrooxidans
  title: NCBI Taxonomy 920, Acidithiobacillus ferrooxidans, species-level identity.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920&mode=Info
  accessed_on: '2026-10-11'
mechanisms:
- id: acidophile_assisted_dust_leaching
  name: Acidophile-associated leaching of prepared basic oxygen steelmaking dust
  process: bioleaching
  description: An adapted DSM 583 culture oxidized supplied ferrous iron and was associated with faster early dissolution of selected elements from dust in acidified batch assays. Acid and uninoculated iron-containing controls also leached the dust; later control values converged with or exceeded inoculated values for several elements. This supports a conditional early kinetic effect, rather than universal microbial superiority. Recirculating laboratory columns showed dissolution at low solids loading and failed by clogging at higher loading. Dissolved-metal measurements do not establish an isolated recovered product or industrial deployment.
  context: 'Methods 2.1-2.3: stockpiled BOS-D was air-dried, ground, sieved below 2 mm and autoclaved at 121 degrees C for 15 min. The named culture had been adapted to 5% w/v BOS-D. Dust was added after two days of precultivation; iron oxidation and redox potential were activity proxies, not direct growth or molecular-causality measurements. The authors report 1% w/v solids, pH 1.75, and 1% w/v energy source and inoculum for batch assays; the unusual mass-based inoculum wording is retained as unresolved. Culture maintenance is described at 30 degrees C and 150 rpm. Medium preparation specifies 11.1 g FeSO4.7H2O per litre and about 2.22 g/L Fe(II), so the 1% energy-source shorthand is not an exact interchangeable recipe. The pH was readjusted on monitoring days with 5 M sulfuric acid; this is the acid reagent concentration, not the final leachate concentration. Uninoculated iron-containing and acid-only batches were included. The article does not report a ferric-iron-matched sterile comparator
    or an acid-addition mass balance. Duplicate conditions are reported, with figure captions stating SD or RSD no greater than 20%; plotted curves do not display individual replicates. Filtered leachates were analyzed by ICP-MS and normalized to initial feed inventory measured by aqua-regia digestion. No analysis dates are supplied for native concentration-cell curation. Numerical outcomes remain qualified prose.'
