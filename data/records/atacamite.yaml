mechanisms:
- id: bassiana_associated_oxalate_formation
  name: Fungal-associated copper oxalate formation on synthetic atacamite
  process: biomineralization
  description: Laboratory cultures of Beauveria bassiana grew on synthetic atacamite-containing malt agar and the authors assigned copper oxalate products. This supports a qualified culture-associated transformation and precipitation observation. Acid-mediated dissolution followed by precipitation is a proposed explanation; neither causal necessity of oxalate nor isolated-metal recovery was established.
  context: The live, unnamed Beauveria bassiana isolate came from copper-contaminated vineyard soil at Bevaix Abbey, Neuchatel, Switzerland. The article mentions a local collection deposit but supplies no accession; the species TaxID does not identify the isolate. Synthetic substrate was prepared using cited chemical methods, exposed to UV for 30 minutes and added after medium autoclaving. Malt agar contained 12 g/L malt and 15 g/L agar; incubation was at room temperature in the dark, with numerical temperature and pH unspecified. Five-mm square fungal plugs were used. Radial growth was followed in two perpendicular directions every 3-4 days over 18 days. The methods specify two or three replicates, whereas Figure 1 specifies three with standard errors. Figure 1 labels loadings 10, 20 and 50 g/L Cu(II) compounds, while the caption and prose vary between copper, Cu(II) and compound concentrations; no elemental-copper conversion is accepted. Copper-free malt agar was the growth comparison.
    No matched mineral-only sterile, killed-cell, pH-matched or acid-specific control is reported for this mineral assay. The silver-arm sterile control cannot be transferred. Separate product estimates used cultures after three months, dried at 60 degrees C, ground below 40 micrometres and pressed as 800-mg samples for Cu-K-alpha XRD, with a copper oxalate dihydrate/quartz calibration.
