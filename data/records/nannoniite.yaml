id: cmmmech:nannoniite
name: Nannoniite
material_kind: mineral
description: >-
  IMA-approved monoclinic aluminium hydroxy fluoride mineral (IMA 2024-010; symbol Nnn; status
  A, Approved; full description published 11 December 2024) with ideal end-member formula
  Al2(OH)5F (Z = 4; corresponding to Al2O3 64.53 wt%, F 12.02 wt%, H2O 28.51 wt%, -O = F -5.06
  wt%, sum 100.00 wt%; simplified formula (Al,Mg)2(OH)5(F,OH); Biagioni, Mugnaioli, Lorenzon,
  Mauro, Musetti, Sejkora, Belmonte, Demitri, and Dolnicek, 2024, European Journal of
  Mineralogy 36:1011-1022). Represents the full characterization of the previously unnamed
  mineral UM1990-28-OHF:Al (Smith and Nickel, 2007) described by Jambor et al. (1990) from the
  Francon quarry, Montreal, Quebec, Canada (Section 1, p. 1012; Section 4.4.2, p. 1020). Named
  in honour of Roberto Nannoni (1943-2022), Italian secondary-school teacher and honorary
  curator of the mineralogical collection of the Museo Provinciale di Storia Naturale of
  Leghorn (Livorno), for his contribution to the knowledge of Tuscan mineralogy (Section 1, p.
  1012). Discovered in two samples from the Cetine di Cotorniano mine (43 deg 13 min N, 11 deg
  09 min E), Chiusdino, province of Siena, Tuscany, Italy, specifically from the small
  exploitation void known as "Stanza Santoni" (after mineral collector Valerio Santoni,
  1934-2002) within the Sb ore deposit (active 1878-1948, related to Late Miocene southern
  Tuscany hydrothermal activity and the Tuscan Magmatic Province) consisting of jasperoids and
  vuggy silica masses replacing Upper Triassic "Calcare Cavernoso" silicified limestone at the
  contact with overlying Liguride Nappe argillic formations (Abstract and Section 1, pp.
  1011-1012; Section 2, p. 1012). Type material is deposited in the mineralogical collection of
  the Museo di Storia Naturale, University of Pisa, Via Roma 79, Calci (Pisa), Italy, under
  catalogue numbers 20071 (holotype) and 20072 (co-type) (Section 1, p. 1012; Figure 1 caption,
  p. 1013). In type material, nannoniite is directly associated with quartz, baryte, gypsum,
  and F-bearing alunite (KAl3(SO4)2[(OH)5F]sum=6.00) in vugs of silicified limestone; the
  broader Stanza Santoni fluoride assemblage includes elpasolite (K2NaAlF6), fluorite (CaF2),
  gearksutite (CaAlF4(OH)*H2O), hydrokenoralstonite ([]2Al2F6(H2O)), rosenbergite
  (AlF[F0.5(H2O)0.5]4*H2O), opal, and dacostaite (IMA 2024-015,
  K(Mg2Al)[Mg(H2O)6](AsO4)2F6*2H2O), formed by late-stage circulation of (Al,F)-rich
  hydrothermal fluids enriched in Na, K, Mg, and Ca (Abstract, p. 1011; Section 2, pp.
  1012-1013; Section 4.2, p. 1017; Section 4.5, pp. 1020-1021). Occurs as (hemi-)spherical or
  rosette-like aggregates up to 1 mm in diameter formed by micrometre-sized spindle-like
  crystals (up to 0.5 mm aggregates in holotype 20071, Figure 1a) or tabular individuals (up to
  1 mm aggregates in co-type 20072, Figure 1b) (Abstract, p. 1011; Section 2, p. 1012; Figure
  1, p. 1013). Colourless to white, with a white streak and a vitreous to earthy lustre;
  brittle, with a perfect {001} cleavage; Mohs hardness was not determined owing to small
  crystal size (estimated close to 2-3 in analogy with gibbsite); density was not measured,
  with calculated density 2.492 g cm-3 based on the ideal formula and unit-cell parameters
  (reported rounded as 2.49 g cm-3 in Section 4.4.2, p. 1020); calculated Gladstone-Dale mean
  refractive index is 1.564 (Section 2, pp. 1012-1013). Under longwave UV radiation (lambda =
  350 nm), nannoniite shows yellowish-white fluorescence; under shortwave UV radiation (lambda
  = 254 nm), the primary paper contains an internal text discrepancy, stating "bluish-yellow"
  in the Abstract (p. 1011) vs. "bluish-white" in Section 2 (pp. 1012-1013) and Section 4.4.2
  (p. 1020, where it is compared to the bluish-white shortwave UV fluorescence of
  UM1990-28-OHF:Al reported by Jambor et al., 1990). Quantitative wavelength-dispersive
  electron microprobe analyses (Cameca SX 100, 15 kV, 5 nA, 20 um beam diameter, PAP matrix
  correction, National Museum, Prague; average of n = 9 spot analyses; Na, P, Si, Cl, Fe, Cu,
  Zn, and As below detection limits; Section 3.2 and Table 1, p. 1013) yielded mean SO3 0.49
  wt% (range 0.25-0.65, SD 0.14, standard Celestine), Al2O3 63.97 wt% (63.18-64.47, SD 0.46,
  standard Al2O3), MgO 0.51 wt% (0.46-0.59, SD 0.04, standard Diopside), CaO 0.22 wt%
  (0.18-0.26, SD 0.03, standard Fluorapatite), K2O 0.07 wt% (0.05-0.09, SD 0.02, standard
  Sanidine), F 11.72 wt% (11.03-12.29, SD 0.41, standard LiF), stoichiometric H2O(calc) 28.54
  wt%, and -O = F -4.94 wt% (rounded from -4.935 wt%), with analytical total 100.58 wt% (exact
  sum 0.49 + 63.97 + 0.51 + 0.22 + 0.07 + 11.72 + 28.54 - 4.94 = 100.58 wt%). On the basis of
  (OH + F) = 6 atoms per formula unit, the empirical formula is
  (Al1.99Mg0.02)sum=2.01(SO4)0.01(OH)5.02F0.98 (Section 4.2, p. 1015), where minor Ca, K, and S
  (SO4) reflect intimate association with alunite and gypsum, and standardless TEM-EDS (JEOL
  JEM-F200 SDD, Cliff-Lorimer approximation) gave Al2(OH)4.72F1.28 with minor Si attributed to
  disseminated amorphous silica/opal (Section 4.2, pp. 1016-1017). Crystallizes in the
  monoclinic system, space group P21/n (#14, non-standard setting of P21/c chosen for
  consistency with gibbsite, Saalfeld and Wedde, 1974), Z = 4, with three unit-cell parameter
  sets reported in the primary study: (1) three-dimensional electron diffraction (3DED; JEOL
  JEM-F200 TEM at 200 kV, lambda = 0.0251 A, ASI CheeTah detector, 1 deg precession semi-angle,
  PETS2 refinement on a 520 x 200 x 530 nm crystal; Abstract, p. 1011; Section 3.4, p. 1014;
  Table 3, p. 1016) a = 8.688(3) A, b = 5.024(2) A, c = 9.734(4) A, beta = 90.77(2) deg, V =
  424.9(3) A3 (summarized rounded as a = 8.69, b = 5.02, c = 9.73 A, beta = 90.8 deg, V = 424.9
  A3 in Table 8, p. 1019, and Section 4.4.2, p. 1020); (2) Gandolfi-like X-ray powder
  diffraction (Bruker D8 Venture, Photon III CCD, microfocus CuKalpha, Celref; Section 3.3, p.
  1013) a = 8.680(3) A, b = 5.018(4) A, c = 9.711(4) A, beta = 90.26(9) deg, V = 423.0(4) A3
  (P21/n); and (3) weak single-crystal X-ray diffraction on a 30 x 25 x 15 um grain (Bruker D8
  Venture, MoKalpha, 122 reflections above 20sigma(I); Section 3.3, p. 1013) a = 8.672(7) A, b
  = 5.009(4) A, c = 9.673(8) A, beta = 90.50(3) deg, V = 420.2(6) A3 (weak reflections simulated
  a C-centred lattice C2/c, and subsequent synchrotron XRD at Elettra Sincrotrone failed due to
  sample decay). The crystal structure was solved ab initio from 121 3DED frames by direct
  methods (SIR2019) and refined dynamically in JANA2020 across 104 zones to R(obs) = 0.1524 for
  2141 unique reflections with I > 3sigma(I) (R(all) = 0.1659, wR(F2) = 0.3171, Goof = 7.9515
  for 2672 unique reflections out of 7540 measured, 42 parameters; Section 3.4, pp. 1014-1015,
  and Table 3, p. 1016). Nannoniite is homeotypic with gibbsite (Al(OH)3): its dioctahedral
  sheet structure consists of ...ABBAABBA... stacked double layers of (OH/F) anions with two
  independent octahedrally coordinated Al sites - Al(1) (Al(1)-phi = 1.838(16)-2.063(14) A,
  mean <Al(1)-phi> = 1.911 A, BVS = 2.95 vu) and Al(2) (Al(2)-phi = 1.773(14)-1.940(15) A, mean
  <Al(2)-phi> = 1.883 A, BVS = 3.11 vu) - occupying two-thirds of the octahedral interstices,
  with fluorine ordered at the F(2) site (Al(1)-F(2) = 2.063(14) A, Al(2)-F(2) = 1.858(12) A)
  lining type 1 pseudo-hexagonal cavities together with in-plane O(1)-H(1) and O(6)-H(6)
  groups, whereas type 2 cavities are lined by six out-of-plane O(3)-H(3), O(4)-H(4), and
  O(5)-H(5) hydroxyl groups pointing alternately up and down in a UDUDUD sequence (vs. UUDD in
  gibbsite; Section 4.3-4.4.1, pp. 1017-1019, and Tables 4-8, pp. 1016-1019). Micro-Raman
  spectroscopy (HORIBA Jobin Yvon XploRA Plus, 532 nm laser, 100-4000 cm-1; Section 3.1, p.
  1013; Section 4.1 and Figure 2, p. 1015) shows lattice and Al-O-Al stretching, bending, and
  deformation bands at 147, 187, 251 (strong), 303, 371, 446, 534 (shoulder), and 561 (strong)
  cm-1, an OH translation band at 697 cm-1, delta(OH) hydroxyl deformation bands at 900, 976,
  and 1021 cm-1, and O-H stretching bands at 3350, 3431 (shoulder), 3517, 3579, and 3615
  (shoulder) cm-1. All 12 observed powder X-ray diffraction lines in Table 2 [dobs in A (Iobs;
  dcalc in A, Icalc, hkl); p. 1014] are 4.86 (vs; 4.867, 100, 0 0 2), 4.35 (s; 4.349, 35, 1 1
  0; 4.344, 19, 2 0 0), 3.241 (m; 3.262, 4, -2 0 2; 3.254, 10, -1 1 2), 2.427 (ms; 2.436, 15,
  -3 1 1; 2.433, 3, 0 0 4; 2.432, 14, 0 2 1; 2.423, 14, 3 1 1), 2.223 (mw; 2.241, 7, -3 1 2;
  2.232, 7, 0 2 2), 2.113 (vw; 2.130, 1, -1 1 4; 2.117, 1, 1 1 4; 2.111, 1, 2 0 4), 1.981 (m;
  1.996, 13, -3 1 3; 1.990, 2, -2 2 2; 1.986, 12, 0 2 3), 1.742 (mw; 1.757, 13, -3 1 4; 1.748,
  14, 0 2 4), 1.640 (w; 1.631, 2, -4 0 4; 1.627, 3, -2 2 4), 1.616 (w; 1.616, 3, 2 2 4), 1.553
  (vw; 1.562, 1, -5 1 2; 1.559, 1, -1 3 2; 1.557, 1, 1 3 2; 1.552, 1, 4 2 2; 1.550, 1, 5 1 2),
  and 1.447 (m; 1.450, 13, 3 3 0; 1.448, 7, 6 0 0). No biological or microbial interaction data
  are reported in the type mineralogical description.
