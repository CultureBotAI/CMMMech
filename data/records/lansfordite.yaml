  url: https://www.handbookofmineralogy.org/pdfs/lansfordite.pdf
  accessed_on: '2026-10-14'
- id: hill1982
  title: Hill, R.J.; Canterford, J.H.; Moyle, F.J. (1982). New data for lansfordite. Mineralogical Magazine
    46(341):453-457. DOI 10.1180/minmag.1982.046.341.08. Complete five-page original, preparation/dehydration
    text pp.453-454, Figure 3, Table I and Figures 4-5.
  url: https://doi.org/10.1180/minmag.1982.046.341.08
  accessed_on: '2026-10-14'
- id: garvie2003
  title: Garvie, L.A.J. (2003). Decay-induced biomineralization of the saguaro cactus (Carnegiea gigantea).
    American Mineralogist 88:1879-1888. DOI 10.2138/am-2003-11-1231. Complete ten-page original; analytical
    methods p.1880, decay stages pp.1881-1882, lansfordite discussion p.1882 and optical Figure 4 p.1883.
  url: https://doi.org/10.2138/am-2003-11-1231
  accessed_on: '2026-10-14'
mechanisms:
- id: abiotic_crystallization_and_dehydration
  name: Abiotic low-temperature crystallization and condition-dependent dehydration
  process: other
  microbial: false
  description: 'Hill et al. crystallized synthetic lansfordite from magnesium bicarbonate solution and
    observed replacement of exposed crystals by nesquehonite needles while their external morphology persisted.
    This is a qualitative laboratory transformation, not a universal dehydration endpoint: a separate
    natural cactus-derived sample became X-ray amorphous on air exposure.'
  context: Hill et al. calcined chromatographic-grade anhydrous MgCO3 at 700 degrees C for one hour, cooled
    the resulting MgO, and slurried 20 g in one litre of doubly distilled water in a two-litre autoclave
    at 15 degrees C. High-purity CO2 pressure was maintained at 700 kPa for one hour; after pressure release,
    solution was filtered through a 0.65-micrometre membrane. Open-beaker storage at 15 degrees C produced
    lansfordite on vessel walls and nesquehonite at the liquid surface after several days. At 0 degrees
    C, lansfordite was the only reported crystalline product. Crystals stored below about 10 degrees C
    remained transparent; higher temperature or reduced pressure produced opaque surfaces and inward-growing
    needles. Humidity, exposure duration, replicate count and conversion yield were not specified for
    that qualitative dehydration observation.
  evidence:
  - source_ref: hill1982
    supports: support
    explanation: Preparation text pp.453-454 supports the two distinct crystallization temperatures and
      mixed product at 15 degrees C. Table I and single-crystal analysis establish synthetic lansfordite
      identity. Page 454 and Figure 3 identify the surface coating and inward-growing needles as nesquehonite
      by XRD and illustrate the pseudomorphous replacement. The source did not report a controlled comparison
      with microbial inoculation.
  - source_ref: hill1982
    supports: partial
    explanation: The abstract emphasizes preparation below 10 degrees C, but methods also report mixed
      lansfordite/nesquehonite at 15 degrees C; below 10 is not treated as an absolute formation boundary.
      Figure 4 is a separate 10 degrees C/min thermal ramp on an 11.23 mg sample in static air, not room-temperature
      transformation kinetics. Abstract versus body end temperatures differ approximately (300 versus
      350 degrees C dehydration; 560 versus about 570 degrees C decarbonation), so no exact universal
      thermal threshold is adopted.
  - source_ref: garvie2003
    supports: partial
    explanation: Page 1882 and Figure 4 describe natural lansfordite becoming opaque and X-ray amorphous
      when exposed to room-temperature air, explicitly without nesquehonite reflections. This differs
      from Hill et al. synthetic nesquehonite replacement. Material provenance, moisture, pressure and
      exposure conditions are not matched, so neither result is discarded and no universal product, rate
      or explanation for the contrast is asserted.
- id: saguaro_decay_associated_occurrence
  name: Lansfordite associated with the microbial decay environment of a saguaro
  process: biomineralization
  microbial: true
  description: Garvie reported lansfordite in one decaying saguaro cactus collected in winter 2001 in
    Arizona. Microbial breakdown was proposed to supply a moist, CO2-enriched mineral-forming environment,
    but the phase-specific biological cause was not experimentally isolated. The accepted claim is a field
    association with decay, not proof that a named organism produces lansfordite or that microbes are
    necessary.
  context: The study sampled recently fallen, decaying and decayed Carnegiea gigantea across south and
    west-central Arizona. Lansfordite was found in a single decaying cactus retaining putrefying tissue,
    as glassy tabular to short-prismatic crystals and clusters up to about 1 mm, described as free of
    nesquehonite and monohydrocalcite in those samples. Methods used powder XRD, optical microscopy and
    SEM-EDS for mineral identification; Figure 4 shows optical images. The decay community was not taxonomically
    resolved for lansfordite and no taxon CURIE is assigned. There was no matched sterile cactus, isolate
    culture or quantified phase-specific production assay. Weather averages cited for January 2001 are
    not measured growth temperatures or pocket microchemistry; the general report of warm pockets reaching
    50 degrees C is not a measured lansfordite synthesis temperature.
  evidence:
  - source_ref: garvie2003
    supports: partial
    explanation: Analytical methods p.1880, the lansfordite paragraph p.1882 and Figure 4 p.1883 support
      the winter field occurrence and air-sensitive crystals. The article describes the samples as monomineralic
      but supplies no lansfordite-specific raw diffraction plot, refined phase fraction or full detection
      limit. Its low-temperature, high-CO2/moisture formation explanation is explicitly inferential rather
      than a controlled demonstration.
  - source_ref: garvie2003
    supports: partial
    explanation: Subsequent summer collections did not reveal lansfordite, but the number of searched
      cacti and matched environmental measurements are not given, preventing an occurrence-frequency or
      temperature-threshold estimate. Fungal hyphae shown on nesquehonite and glushinskite, and the isotope
      data for calcium carbonates in Table 1, are not evidence identifying a lansfordite-producing taxon
      or tracing its carbon. The study provides no industrial deployment, isolated magnesium recovery
      or lansfordite-specific carbon-sequestration rate.
  - source_ref: hill1982
    supports: context_only
    explanation: The separate abiotic synthesis provides a counterexample to any claim that lansfordite
      intrinsically requires microbes. It does not refute the narrower occurrence in a microbial decay
      environment, and its chemical conditions are not used as measured field conditions.
