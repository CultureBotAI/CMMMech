mechanisms:
  - id: yeast_uranyl_phosphate_precipitation
    name: Yeast-associated precipitation with a meta-ankoleite diffraction assignment
    process: biomineralization
    description: Kluyveromyces lactis reported as IFO1267 formed cell-associated uranium-containing precipitates during growth with soluble uranyl nitrate and glycerol 2-phosphate as the sole supplied phosphorus source. The authors assigned the harvested solids to meta-ankoleite together with chernikovite, bassetite and uramphite by XRD. Organic-phosphate hydrolysis and cell-associated precipitation are consistent with phosphatase-mediated biomineralization, but no particular enzyme, gene or exclusive molecular pathway was tested. This record selects the K. lactis growth arm of a six-yeast study; its microscopy, phosphate assay and diffraction are related measures from that study, not independent demonstrations of phase-specific uranium recovery.
    context: The accepted-manuscript Methods, printed pages 6-11, and Figure 3b specify modified Burkholder's medium with 30 mM glycerol 2-phosphate replacing KH2PO4 and 1 mM UO2(NO3)2, 100 mL medium in 250-mL flasks, 30 degrees C, 180 rpm, darkness and 120 h growth. Cells were first grown for 48 h in standard medium and then for 48 h in the source-described sucrose- and P-free equivalent medium before transfer; the standard recipe lists dextrose, so this carbon terminology is not silently reconciled. The standard medium contains trace KI and FeSO4, among other salts. No-P medium and uninoculated medium are specified as controls. The reported absence of significant abiotic precipitation is qualitative, without a numeric detection threshold or matched sterile XRD trace. Table 3 gives endpoint pH 5.5 for this K. lactis arm and 7.0 for its uninoculated counterpart. The study separately reacted pre-grown, washed cells with uranium for 48 h; those exposure images are not the 120-h growth-arm
      XRD. Samples were washed and vacuum-desiccated before characterization; hydration in the wet culture was not directly measured.
