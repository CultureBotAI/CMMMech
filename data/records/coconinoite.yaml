    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-24'
  - id: young_1966_coconinoite
    title: >-
      Young EJ, Weeks AD, and Meyrowitz R (1966), Coconinoite, a new uranium
      mineral from Utah and Arizona, American Mineralogist 51:651-663. Primary
      species description of coconinoite (IMA 1965-003) from Utah and Arizona,
      USA; reports microchemical analyses on Blackwater No. 4 sample 1715
      (Table 2: Fe2O3 9.7, Al2O3 6.6, UO3 34.9, P2O5 18.3, SO3 5.4, H2O 24.0
      [H2O+ 18.2, H2O- 5.8], CaO 0.1, CO2 <0.1, Na2O <0.1, acid insol. 0.5,
      total 99.5 wt%) and Jomac mine sample T-J2-53 (Fe2O3 10.3, Al2O3 6.5, UO3
      34.2, P2O5 17.7, SO3 6.1, H2O 23.4, CaO 0.1, CO2 0.7, Na2O <0.1, acid
      insol. 1.0, total 100.0 wt%), X-ray diffraction spacing (strongest line
      11.05 Å), SGmeas = 2.70, Dcalc = 2.68 g/cm3, biaxial (–) optical constants
      (alpha = 1.550(5), beta = 1.586(5), gamma = 1.590(5), 2V = 40°), and
      reversible thermal dehydration, TGA, and DTA behavior up to 982 °C.
    url: https://www.rruff.net/doclib/am/vol51/AM51_651.pdf
    accessed_on: '2026-10-24'
mechanisms:
  - id: abiotic_tga_dta_dehydration_desulfation
    name: Abiotic thermal dehydration, basal spacing contraction, and TGA/DTA desulfation of coconinoite
    process: other
    description: >-
      Reversible low-temperature dehydration of coconinoite at 135–215 °C with
      contraction of its basal X-ray spacing from 11.05 Å to 8.49–8.18 Å and
      elevation of refractive indices, followed by complete dehydration (23.4
      wt% H2O loss by 450 °C) and high-temperature thermal desulfation (5.3 wt%
      SO3 loss between 600 and 850 °C; total weight loss 28.7 wt% by 982 °C).
    context: >-
      Abiotic laboratory oven heating, Chevenard thermogravimetric analysis
      (TGA, 22–982 °C), and Eberhard differential thermal analysis (DTA); no
      microbial, enzymatic, or bioleaching mechanism was tested or reported in
      Young, Weeks, and Meyrowitz (1966).
    microbial: false
    evidence:
      - source_ref: young_1966_coconinoite
        supports: support
        explanation: >-
          Oven heating of coconinoite at 135 °C for 2.5 hours reversibly
          dehydrates the mineral, raising refractive indices to alpha = 1.605,
          beta = 1.630, gamma = 1.645 (2V = 75°15') and contracting the basal
          X-ray spacing from 11.05 Å to 8.49 Å (and to 8.30 Å at 174 °C and 8.18
          Å at 215 °C), while Chevenard thermogravimetric analysis (22–982 °C)
          and Eberhard DTA record a 23.4 wt% H2O loss from 22 to 450 °C (double
          endotherm at 150–250 °C) followed by a 5.3 wt% SO3 loss from 600 to
          850 °C (endotherm near 800 °C; total loss 28.7 wt%, pp. 654–657, 663).
