      - id: dissolved_sulfide_and_cdcl2_reaction
        label: Dissolved sulfide generation and reaction with supplied soluble CdCl2
        node_type: CHEMICAL_ENTITY
        description: Biogenic sulfide generated from cysteine or 10 mM thiosulfate/sulfite in anaerobic modified TOR-39 medium at 65 C reacted with soluble CdCl2 (0.4 mM/day for 10 days in the duplicate 10-mL time course; 4.45 or 8.90 mM total nominal Cd in separate phase comparisons).
        protein_grounding_status: NOT_APPLICABLE
      - id: cubic_hawleyite_assigned_cds_component
        label: Cubic hawleyite-assigned CdS component (cubic-only in cysteine/G20/Na2S arms; initial and mixed cubic/hexagonal phase in thiosulfate/sulfite arms)
        node_type: MATERIAL_OR_PHASE
        description: Synthetic CdS precipitate whose XRD and HRTEM/FFT patterns match cubic hawleyite as the sole assigned phase in the cysteine-fed X513 preparation (and in Desulfovibrio G20-sulfate and abiotic Na2S comparators) and as the initial product followed by a cubic hawleyite / hexagonal greenockite mixture in thiosulfate/sulfite-fed X513 cultures through 240 h (Figures 1 and 4), without proving unique biological phase selectivity or phase-pure isolated recovery.
        protein_grounding_status: NOT_APPLICABLE
