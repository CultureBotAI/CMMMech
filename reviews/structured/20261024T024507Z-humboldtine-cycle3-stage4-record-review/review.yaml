summary: 'Reviewed data/records/humboldtine.yaml (cmmmech:humboldtine) at commit 855e0eba1fa9b8a4a975b7155ec013414e4d437e.
  Humboldtine (Fe(C2O4)·2H2O, grandfathered IMA mineral species) carries accurate
  mineral identity, two primary-source fungal biomineralization mechanisms (niger_associated_iron_oxalate_formation
  from Zelenskaya et al. 2021 DOI:10.3390/cryst11121591 and brown_rot_iron_oxalate_comparison
  from Vlasov et al. 2023 DOI:10.3390/cryst13030432), two connected causal graphs
  (niger_associated_iron_oxalate_formation_graph and brown_rot_iron_oxalate_comparison_graph
  using predicate: dissolves), and 4 live-verified UniProtKB groundings (UniProtKB:A0A254TZW7
  CEXA_ASPNG, UniProtKB:A0A5M3MRX5 A0A5M3MRX5_CONPW, UniProtKB:A0A5M3MJR8 A0A5M3MJR8_CONPW,
  and UniProtKB:F8QHM8 F8QHM8_SERL3). However, across the 6 Aspergillus niger strain
  Ch 4/07 oxalate biomineralization mineral records citing GenBank ITS accession KF768341.1
  (https://www.ncbi.nlm.nih.gov/nuccore/KF768341.1), data/records/humboldtine.yaml
  keys this source under id: genbank_niger (line 22) and source_ref: genbank_niger
  (line 84), whereas all 5 sibling records (hopeite, katsarosite, moolooite, wheatleyite,
  and whewellite) standardize on genbank_ch407. Recorded open minor finding cmmmech-cycle3-stage4-finding-0003
  for Stage 5 remediation.'
