limitations:
- Natural mixed-REE material is not a pure ideal endmember, commodity or bulk ore
  resource.
- The volatile partition is assumed and internally inconsistent; it is not a direct
  water/CO2 determination.
- Hydrogen positions and separate shared-site cation occupancies are unresolved by
  the reported model; no independent refinement was performed.
- Bounded notice/identity searches do not establish exhaustive coverage; shared acquisition
  is not independent experimental replication.
- Omission of criticality does not assert absence from every list.
- Whole-corpus native review and exact-head publication checks are later separate
  gates.
