material_kind: element
description: Germanium (Ge), grounded by the neutral-atom ChEBI identifier. This element is distinct from the GeO2 reagent and dissolved germanium species used in the experiments, germanium-bearing minerals and coal wastes. The US 2025 list names the germanium commodity; its designation is mapped to this element without extending it to every germanium-bearing material.
