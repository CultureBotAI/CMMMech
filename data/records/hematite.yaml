causal_graphs:
- id: pma2_2_hematite_dissolution_graph
  name: Priestia megaterium PMA2-2 mineral-inducible gene response, culture acidification, and iron mobilization from hematite feed
  description: 'Causal pathway linking the six mineral-inducible genes verified by 12-h RT-qPCR on hematite in Priestia megaterium PMA2-2 (Figure 5 and Table 2 of Dong et al., 2026: spo0A / UniProtKB:P52932, acs / acsA UniProtKB:D5DTY8, wecC / UniProtKB:A0A0B6ASU1, lysA / UniProtKB:A0A0B6ACY5, flgF / UniProtKB:A0A0B6AS33, and ltaS / ltaS1 UniProtKB:A0A0B6APG1, induced 1.4- to 395-fold across tested minerals with ltaS peaking in hematite) to culture-associated acidification of glucose minimal medium (pH 4.69 +/- 0.05 at 12 h and 4.66 +/- 0.06 at 24 h vs 7.16 +/- 0.04 and 7.12 +/- 0.05 in uninoculated controls, Table S6) and 0.45-um-filtered Fe mobilization (25.95 +/- 0.90 and 71.43 +/- 1.56 uM at 12 and 24 h vs 0.04 +/- 0.00 uM in controls) from 0.60 g hematite feed (75-150 um; 86.58% Fe2O3, 9.82% SiO2, Table S7), while preserving that no pH-matched abiotic hematite control or gene knockout was performed.'
