id: cmmmech:yttrotungstite-nd
name: Yttrotungstite-(Nd)
material_kind: mineral
ima_symbol: Ytgs-Nd
description: >-
  Yttrotungstite-(Nd) (IMA 2023-064, symbol Ytgs-Nd) is an IMA-accepted
  monoclinic neodymium-dominant rare-earth tungsten hydroxy-oxide hydrate
  mineral of the yttrotungstite group (Strunz 04.FD.20, Dana 49.03.03.04), the
  Nd3+-dominant analogue of yttrotungstite-(Y) (YW2O7(OH)(H2O)) and
  yttrotungstite-(Ce) (CeW2O7(OH)(H2O)), with September 2026 IMA Master List
  ideal formula NdW2O7(OH)(H2O) (status A, PDF p. 238) and holotype empirical
  formula
  (Nd0.36Sm0.13Ce0.12Pr0.08La0.06Gd0.06Y0.05Dy0.03Yb0.02Ca0.01)Sigma0.92(W2.02P0.02)Sigma2.04O7(OH)(H2O)
  on the basis of 15 positive charges (Hatert et al. 2026, pp. 373, 375–376).
  WDS electron-microprobe analysis (n = 17 points on a JEOL JXA-8200 at 15 kV, 5
  nA, 3 um beam; Table 1, p. 376) gave WO3 73.40 (range 71.58–74.79, SD 0.90),
  Nd2O3 9.37 (8.90–9.66, SD 0.21), Sm2O3 3.56 (2.39–4.24, SD 0.48), Ce2O3 3.17
  (2.35–4.49, SD 0.58), Pr2O3 2.10 (1.61–2.64, SD 0.27), Gd2O3 1.74 (1.04–2.28,
  SD 0.36), La2O3 1.44 (0.68–2.77, SD 0.59), Y2O3 0.91 (0.36–1.45, SD 0.30),
  Dy2O3 0.81 (0.57–1.30, SD 0.19), Yb2O3 0.71 (0.46–0.90, SD 0.12), P2O5 0.18
  (0.08–0.27, SD 0.06), CaO 0.09 (0.01–0.28, SD 0.09), Er2O3 0.09 (0.00–0.25, SD
  0.10), MoO3 0.07 (0.00–0.26, SD 0.08), Eu2O3 0.07 (0.00–0.36, SD 0.12), Tb2O3
  0.07 (0.00–0.33, SD 0.10), As2O5 0.04 (0.00–0.14, SD 0.04), TiO2 0.03
  (0.00–0.09, SD 0.03), SiO2 0.02 (0.00–0.05, SD 0.02), Al2O3 0.01 (0.00–0.02,
  SD 0.01), K2O 0.01 (0.00–0.05, SD 0.01), stoichiometric H2Ocalc 4.24 (based on
  1 OH- and 1 H2O pfu from structure refinement), total 102.13 wt% (Mg, Mn, Fe,
  Ho, Tm, Lu, Pb, Th, U, Nb, Ta, Sn, F, Cl, and Na below detection limits).
  Described by Hatert, Philippo, Vignola, and Guennou (2026) from oxidized zones
  of the Nyakabingo tungsten mine, 10 km NNW of Kigali, Rwanda (1°52'33" S,
  30°02'36" E; collected in 1977 by Paul Antun; holotype specimens deposited at
  the Natural History Museum of Luxembourg, file number WPA504, and the
  Laboratory of Mineralogy, University of Liège, Belgium, catalogue number ULG
  21981), hosted in Mesoproterozoic Karagwe-Ankole Belt (992.4 +/- 1.5 Ma Ar–Ar
  muscovite age on G4-granite-related W-bearing quartz veins in low-grade
  greenschist-metamorphosed pyritiferous black shales, quartzites, and psammites
  of the Bumbogo and Nduba formations; pp. 373–375, Fig. 1). Occurs in
  honeycomb-textured oxidation zones after "reinite" (ferberite pseudomorphs
  after primary scheelite) as yellow-orange platy/tabular crystals flattened on
  {010} and fibrous radial aggregates up to 100 um in diameter closely
  associated with white fine-grained anthoinite (AlWO3(OH)3) and
  microcrystalline yellowish hydrokenoelsmoreite ([]2W2O6(H2O)) octahedra
  (within a wider oxidation assemblage containing ferberite, meymacite, raspite,
  yttrotungstite-(Ce), and iron oxides; pp. 374–375, Fig. 2); also corresponds
  to the previously reported unnamed Nd-dominant mineral UM2004-//-O:CeHNdSmW
  from the Clara Mine, Wolfach, Germany (Kolitsch et al. 2004; p. 375). Exhibits
  twinning parallel to (001), white streak, vitreous lustre, no UV fluorescence,
  Mohs hardness 1, brittle tenacity, perfect cleavage on (010) and excellent
  cleavage on (100) and (001), Dcalc = 6.25 g/cm3 (for the empirical formula and
  single-crystal cell; 6.331 g/cm3 for the ideal structural model in Table 3, p.
  378), biaxial optics with alpha = 1.90(2) and gamma = 2.10(2) at 589 nm,
  optical plane parallel to (010) with X ^ c = 6° and Z ^ a = 9° (Fig. 3),
  pleochroism from light yellow (X) to yellow (Z), and Gladstone–Dale
  compatibility index 1 - (KP/KC) = 0.0583 (good; p. 375). Polarized 633 nm
  micro-Raman spectra (Fig. 5, Table 5, pp. 376–379) show strong W–O stretching
  bands at 930, 834, and 684 cm-1, OH5 stretching bands at 3350, 3384, and 3434
  cm-1, and OW6 water stretching bands at 3522 and 3600 cm-1. Monoclinic, space
  group P21/m (Z = 2); single-crystal X-ray diffraction on a 0.098 x 0.088 x
  0.057 mm crystal (MoKalpha, lambda = 0.71073 Å, 883 unique reflections / 808
  with I > 2sigma(I) refined to R1 = 0.0362, wR2 = 0.0876, R1(all) = 0.0398,
  wR2(all) = 0.0897, GOF = 1.092; Table 3, p. 378) gives a = 5.8534(3) Å, b =
  8.6881(3) Å in the abstract, Section 5, and Table 7 (printed as 8.6681(3) Å in
  Table 3, p. 378, where V = 345.70(3) Å3 matches b = 8.6881(3) Å), c =
  7.0488(4) Å, beta = 105.336(5)°, V = 345.70(3) Å3, while FeKalpha Debye–
  Scherrer powder X-ray diffraction (Table 2, p. 377) gives refined cell
  parameters a = 5.84(1) Å, b = 8.64(1) Å, c = 7.045(8) Å, beta = 106.1(1)°, V =
  341.3(6) Å3 and strongest lines [d in Å (Iobs) (hkl)] at 4.72 (100)(110), 3.30
  (80)(12-1), 2.036 (60)(23-1), 2.852 (40)(121), 2.649 (30)(031), 3.12
  (20)(11-2), 1.829 (20)(231), and 1.658 (20)(31-3). The crystal structure
  (Tables 4 and 6, pp. 378–380, Fig. 6) consists of kinked chains of
  edge-sharing W1O6 octahedra (<W1–O> = 1.955 Å, BVS 5.94 v.u.) along [010]
  cross-linked by 8-coordinated Nd2O8 polyhedra (<Nd2–O> = 2.446 Å, BVS 3.31
  v.u.), resolving bridging OH5 (BVS 0.84 v.u.) and terminal OW6 water (BVS 0.33
  v.u.) and prompting IMA-CNMNC (Newsletter 91, Bosi et al. 2026) to uniformize
  the formulas of yttrotungstite-(Y) and yttrotungstite-(Ce) to YW2O7(OH)(H2O)
  and CeW2O7(OH)(H2O) (pp. 373, 380–381, Table 7). Distinct from
  yttrotungstite-(Y), yttrotungstite-(Ce), anthoinite, meymacite, and elemental
  neodymium or tungsten; no criticality designation, microbial mechanism, or
  industrial recovery yield is asserted.
