actions: []
limitations:
- The experiment supports formation associated with a reported living culture, but
  a matched uninoculated/killed-cell series is not supplied. Chemical seeds were made
  under different chemistry and duration.
- Seeded cultures do not separately quantify new scorodite mass, and original endpoint
  XRD patterns are not shown for every Table 3 treatment. The unseeded seed-production
  XRD supplies the clearest phase evidence.
- Nonideal hydration, associated organic material, bulk Fe/As ratios above one, alternative
  phases and the unresolved TCLP uncertainty discrepancy remain scientific limitations
  already represented in the record.
- An 18-hour acetate leach test cannot establish permanent sequestration, effluent
  compliance or industrial deployment. Separate reference-list studies were not promoted
  into new accepted observations.
- Publisher landing access was blocked in the curator acquisition. The complete institutional
  original including Appendix A was independently inspected; no exhaustive supplementary-inventory
  clearance is claimed.
notes:
- Native inspect captured the exact working-tree target/history/dossier/schema hashes
  before scientific assessment. New owner absence is bounded to the trusted base and
  hidden/ignored/symlink-inclusive record search, not a global literature novelty
  claim.
- No criticality list claim is present. Omission is unrecorded, not not-listed. NCBITaxon:41673
  grounds a species, while DSM 1651T remains the paper-reported strain designation.
- All 63 source-manifest artifacts and its report hash matched. Full originals and
  renders remain outside Git. No target, sidecar or dossier corrections were performed
  by this reviewer.
- The scientific assessment was drafted while final batch gates ran. No partial observation
  was saved. This single completed observation was saved only after the final receipts
  were inspected and frozen input hashes rechecked; no record/history/dossier bytes
  changed.
