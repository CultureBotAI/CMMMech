id: cmmmech:chromite-ore-processing-residue
name: Chromite ore processing residue
material_kind: secondary_resource
description: Chromium-bearing waste from chemical processing of chromite ore, distinct from the chromite mineral species and physical-beneficiation tailings. The curated case is a cementitious, high-lime-process residue from a Glasgow waste-fill site that received material from the Rutherglen Chromite Processing Works. High-lime processing oxidized ore Cr(III) to soluble Cr(VI), followed by aqueous extraction. The 2015 study sampled field-moist material from an exploratory borehole during the M74 motorway project and initially identified it tentatively as COPR from its pale granular appearance and high-pH yellow leachate. Subsequent XRF and XRD characterized a mixed residue rather than proving a pure feed. XRD identified cementitious and hydrated phases, including calcite, portlandite, brownmillerite, pyroaurite, hydrogarnet and brucite; remnant chromite was not detected by that assay. Table 4 reports 3.8 wt% Cr in the XRF composition, without loss-on-ignition correction; this is neither
  a mineral fraction nor a field-wet feed concentration. This record does not confer a constituent element's criticality designation on the residue or assert commercial microbial processing.
sources:
- id: watts2015
  title: Watts, Coker, Parry, Pattrick, Thomas, Kalin and Lloyd (2015). Biogenic nano-magnetite and nano-zero valent iron treatment of alkaline Cr(VI) leachate and chromite ore processing residue. Applied Geochemistry 54:27-42; available online 11 December 2014. DOI 10.1016/j.apgeochem.2014.12.001; PMID 26109747; PMCID PMC4461148. Complete 16-page published article, Sections 2-5, Tables 1-4, Figures 1-9; source stabilization principally Sections 2.8-2.9 and 3.5-3.7.
  url: https://doi.org/10.1016/j.apgeochem.2014.12.001
  accessed_on: '2026-10-14'
- id: watts2015_supplement
  title: 'Supporting Information to Watts et al. (2015). Original publisher DOCX, Figures SI 1-2: nanoparticle XRD and fitted aqueous Cr(VI) kinetics. These are associated artifacts of the same experiment, not independent replication or direct COPR recovery measurements.'
  url: https://ars.els-cdn.com/content/image/1-s2.0-S088329271400300X-mmc1.docx
  accessed_on: '2026-10-14'
- id: ncbi_sulfurreducens
  title: NCBI Taxonomy 35554, Geobacter sulfurreducens, species-level entry. Resolves the source's species label without authenticating an experimental strain; the 2015 paper does not specify a strain accession.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=35554&mode=Info
  accessed_on: '2026-10-14'
mechanisms:
- id: biogenic_magnetite_crvi_stabilization
  name: Chromium reduction and stabilization by separately produced biogenic magnetite
  process: redox_transformation
  description: Preformed nanoscale magnetite produced through G. sulfurreducens reduction of ferrihydrite lowered aqueous Cr(VI) release and reduced part of the bulk Cr(VI) in the residue. The microbial contribution is production of the Fe(II)-bearing reagent in a separate incubation. The particles were washed to remove bacterial cells before treatment; this is not evidence of live Geobacter growth or direct enzymatic Cr(VI) reduction in the hyperalkaline waste. Complete removal of cells was not independently demonstrated. Fe(II) oxidation coupled to Cr(VI) reduction is supported by chemical and spectroscopic changes, with residual inaccessible Cr(VI) and subsequent remobilization. Chromium was stabilized in the solid system, not recovered as an isolated saleable product.
  context: Laboratory duplicate microcosms contained 25 g field-moist COPR and 50 mL ultrapure water in 120 mL serum bottles, degassed with filtered N2 and held in the dark at 20 degrees C for 100 days. Magnetite doses were 0, 0.5, 1, 2, 5 and 10% by mass of field-wet COPR, not dry-feed percentages. The unamended residue was the no-addition control; parallel commercial NANOFER 25S zero-valent-iron treatments were a nonmicrobial comparator. pH stayed between 12.5 and 12.9. Samples for XANES and XRD were taken after 50 days. Aqueous Cr(VI) was measured with diphenylcarbazide, with a reported 1 micromolar detection limit; readily extractable Fe(II) used 0.5 M HCl and ferrozine. Error bars represent standard deviations of duplicate microcosms. The reagent production used source-labelled G. sulfurreducens grown anaerobically at 30 degrees C on acetate/fumarate, then washed cells at OD600 0.4 in 20 mM acetate, 50 mM ferrihydrite, 30 mM bicarbonate and 10 micromolar AQDS, incubated at 30 degrees
    C in the dark for one week. Resulting magnetic particles were washed three times and stored anoxically. No strain accession is specified in this paper. Waste and groundwater in the separate aqueous experiments came from different Glasgow sites; their results are not pooled.
