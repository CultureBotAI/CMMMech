  details: Figure 2 supports authors' RuO2-like lattice assignment. Figure 3/Table
    2 text assigns Ru(III)/Ru(VI), while bulk XANES assigns Ru(III)/Ru(IV), and labels
    include RuCl3/Ru(OH)3. Air exposure prevents assigning a unique original oxidation
    pathway. EXAFS Table 3 and paragraph 25 include a Ru-Ru shell; paragraph 26 then
    asserts its absence. The record does not repeat exclusively atomically dispersed
    Ru or claim a Pd-Ru metallic alloy. E. coli context has a different preparation
    and is not a replicate.
