mechanisms:
- id: abiotic_thermal_channel_dehydration
  name: Laboratory thermal channel dehydration of natural lemoynite with framework retention
  process: other
  description: Heating natural Mont Saint-Hilaire lemoynite up to 200 degrees C (with DTA
    endotherm at 140 degrees C and main TGA mass-loss step at 135-200 degrees C, and isothermal
    dehydration at 200 degrees C for 24 hours) expelled the loosely bound tunnel H2O molecules—eliminating
    the infrared H-O-H bending absorption bands at 1615/1618 and 1668 cm-1 and O-H stretching
    bands at 3400 and 3600 cm-1—while leaving the Si-O infrared bands (800-1200 and 400-550
    cm-1) and the Debye-Scherrer X-ray powder diffraction pattern of the rigid [ZrSi5O13]2-
    framework completely unchanged.
  context: Thermal and spectroscopic experiments in Perrault et al. (1969), pp. 589-593 and
    Figures 2-3, combined thermogravimetry (recording ~8 wt% rapid loss around 135 degrees
    C and ~13.3 wt% total loss up to 900 degrees C), DTA (endothermic peak at 140 degrees
    C), infrared spectrophotometry (400-3800 cm-1 in CCl4 and mineral oil mulls on unheated
    lemoynite versus lemoynite heated at 200 degrees C for 24 hours), and Debye-Scherrer X-ray
    powder photography before and after 24-hour heating at 200 degrees C.
  microbial: false
  evidence:
  - source_ref: perrault_1969_lemoynite
    supports: support
    explanation: Pages 589-593 and Figures 2-3 demonstrate that heating lemoynite at 200 degrees
      C for 24 hours removes the H2O infrared absorption bands at 1615/1618, 1668, 3400, and
      3600 cm-1 while yielding an X-ray powder diffraction film identical to unheated lemoynite.
  - source_ref: le_page_1976_lemoynite
    supports: support
    explanation: Pages 135-138 confirm structurally that the [ZrSi5O13]2- framework forms
      open 7-A-wide channels housing disordered zeolitic H2O and exchangeable cations, accounting
      for the topotactic dehydration without framework collapse.
