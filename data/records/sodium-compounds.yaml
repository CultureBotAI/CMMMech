id: cmmmech:sodium-compounds
name: Sodium compounds
material_kind: commodity
description: The source-defined industrial commodity category called Sodium (Na) (compounds) in
  the BGS/CMIC UK 2024 assessment. Section 2.6.3 defines its coverage as predominantly sodium
  carbonate, with some sodium nitrate and minor sodium metal; the category name is therefore not
  a chemical claim that metallic sodium is a compound. The assessment treats industrial salt separately.
  This record does not cover all sodium-containing substances, dissolved sodium ions or elemental
  sodium as a chemical-element concept. Its criticality entry uses corrected report OR/24/059,
  whose cover explicitly says it does not constitute government policy. No microbial extraction,
  transformation or recovery mechanism is asserted.
