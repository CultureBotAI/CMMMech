id: cmmmech:greenockite
name: Greenockite
material_kind: mineral
description: Greenockite is the hexagonal CdS mineral species, distinct from cubic hawleyite, unspecified cadmium-sulfide nanoparticles, elemental cadmium and mixed ores. The September 2026 IMA-CNMNC list gives grandfathered status and original-description year 1840; that year is not a unique approval accession. The curated mechanism concerns a synthetic greenockite-assigned component of mixed CdS produced in a defined microbial laboratory experiment, not a demonstrated origin or extraction pathway for every natural greenockite occurrence. No cadmium criticality designation is inherited.
sources:
  - id: ima_2026_09
    title: 'IMA-CNMNC (September 2026). The New IMA List of Minerals. Definitions p.1; Greenockite row p.86: CdS, G (grandfathered), original-description year 1840.'
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-14'
  - id: handbook
    title: Handbook of Mineralogy. Greenockite. Mineral Data Publishing version 1 (2001–2005); complete one-page identity/structure entry. Historical secondary context, not microbial evidence.
    url: https://www.handbookofmineralogy.org/pdfs/greenockite.pdf
    accessed_on: '2026-10-14'
  - id: moon2013
    title: Moon, J.-W. et al. (2013). Scalable economic extracellular synthesis of CdS nanostructured particles by a non-pathogenic thermophile. Journal of Industrial Microbiology and Biotechnology 40(11):1263–1271. DOI 10.1007/s10295-013-1321-3. Complete publisher HTML, Materials and methods, Results, Figures 1–6 and Table 1.
    url: https://doi.org/10.1007/s10295-013-1321-3
    accessed_on: '2026-10-14'
  - id: taxonomy_x513
    title: NCBI Taxonomy 573062 — Thermoanaerobacter sp. X513; species-rank X513-labelled entry. Thermoanaerobacter ethanolicus X513 is listed as a misspelling.
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=573062&mode=Info
    accessed_on: '2026-10-14'
