mechanisms:
  - id: cd1_cadmium_sulfide
    name: Culture-associated cadmium-sulfide formation
    process: biomineralization
    description: >-
      Living Klebsiella planticola Cd-1 cultures formed CdS-associated solids.
      This supports laboratory immobilization, not elemental-cadmium reduction,
      purified-product recovery or industrial deployment.
    context: >-
      Anaerobic synthetic CdCl2 medium used pyruvate/glucose and Trizma buffer,
      initially around pH 7.1. Washed, freeze-dried late-stationary biomass from
      5 mM Cd(II) cultures was characterized spectroscopically. A separate
      thiosulfate-amended assay used 5 mM Cd(II) and 5 or 10 mM thiosulfate.
      Exact precipitation incubation temperature, elapsed harvest time and
      vessel volume are not explicit. NCBITaxon:575 identifies the published
      species, not a verified Cd-1 strain accession.
    microbial: true
    organisms:
      - id: NCBITaxon:575
        label: Klebsiella planticola
    evidence:
      - source_ref: sharma_2000
        supports: support
        explanation: >-
          Figures 2-3 compare sulfur XANES and cadmium EXAFS against reference
          compounds and cadmium-free biomass, supporting Cd-S coordination;
          Cd-O ligands also remain unresolved. The separate washed-pellet
          methylene-blue assay estimates approximately 1 mM CdS from sulfide,
          not directly measured cadmium recovery.
      - source_ref: sharma_2000
        supports: partial
        explanation: >-
          No matched cell-free precipitation comparison is reported. Thiosulfate
          interferes with the sulfide assay and was removed by pellet washing.
          These experiments do not identify an enzyme, establish a complete
          cadmium mass balance, or distinguish all abiotic contributions.
