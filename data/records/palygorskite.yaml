mechanisms:
- id: cn32_pfl1_iron_reduction
  name: CN32-associated iron reduction in pretreated PFl-1
  process: redox_transformation
  description: Shewanella putrefaciens CN32 increased measured Fe(II) in the pretreated palygorskite specimen relative to no-cell controls. Added AQDS increased the final extent. The experiment supports conditional iron reduction, not substantial dissolved-iron recovery or a mineral-specific electron-transfer protein.
  context: PFl-1 from the Clay Minerals Society Source Clays Repository originated in the Hawthorn Formation, Georgia-Florida border. The 0.02-0.5 micrometre fraction was treated with dithionite-citrate-bicarbonate for ten minutes, acid-washed, homoionized and reoxidized before use. Methods specify 96-hour reoxidation whereas Figure 5 describes 72 hours; this discrepancy is unresolved. Pasteurized cleaned clay at 7 g/L was incubated with washed CN32 cells at approximately 1.92 x 10^7 cells/mL, nominal 0.2 mM lactate, 30 mM bicarbonate buffer at pH 7, with or without 0.1 mM AQDS. Duplicate anoxic laboratory tubes were held at 37 degrees C and shaken at 60 rpm for approximately two weeks. Equal buffer replaced cells in abiotic controls. Phenanthroline measured Fe(II); these are resting-cell buffer experiments, not demonstrated growth on palygorskite.
