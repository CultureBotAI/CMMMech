        study_arm: abiotic
        result_status: measured
        value: 12.2
        unit: mg/kg
        analyzed_on: '2025-07-03'
        sampled_on: '2025-05-21'
        sampling_source_locator: 'T2_pH.csv; SampleID=BESVarr_END; Date column'
        context: >-
          Abiotic-run endpoint. Its run duration and pH history differ from
          the biotic run. This concentration cell preserves the abiotic
