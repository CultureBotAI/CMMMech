  title: 'World Bank Group / IFC (12 February 2015). Environmental, Health, and Safety Guidelines: Vegetable
    Oil Production and Processing. Paragraphs 8-9, pp. 2-4; Annex A.3, paragraph 56, pp. 23-24. Historical
    dated process/resource identity guidance, not a criticality list or deployment study.'
  url: https://www.ifc.org/content/dam/ifc/doc/2010/2015-vegetable-oil-processing-ehs-guidelines-en.pdf
  accessed_on: '2026-10-11'
