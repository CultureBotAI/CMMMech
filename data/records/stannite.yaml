  evidence:
  - source_ref: teh_1979
    supports: partial
    explanation: Printed pages 85-87 and Figure 1 report tin solubilization measured by atomic absorption and confirmed colorimetrically. The Results report 54.45% Sn extracted from synthetic stannite and 31.30% from the separate natural sample; these are source-attributed percentages, not independently established mass balances or product yields. Figure 1 shows a lower synthetic-stannite sterile trace, supporting an inoculation-associated difference for that material only. The graph's printed concentration scale, labelled tin concentration (x1000 ppm), is not reconciled with the feed loading; no concentrations are digitized or converted. Missing replication, unequal material properties, incomplete controls and contradictory pH statements limit the strength and reproducibility of the microbial attribution. No recovered-product purity, continuous process or industrial deployment was demonstrated.
