mechanisms:
- id: abiotic_thermal_transformation
  name: Condition-dependent abiotic structural change and dehydration
  process: other
  microbial: false
  description: Natural metazeunerite undergoes diffraction changes interpreted as dehydration during vacuum
    heating, while a separate synthetic end-member sample shows a reversible low-temperature symmetry
    change and a distinct high-temperature transformation in a sealed capillary. Phosphate substitution,
    sample hydration, pressure, atmosphere and thermal history prevent direct transfer of a temperature
    or product assignment between these arms.
  context: Nazarchuk et al. studied natural sample 2a from Weisser Hirsch Mine, Saxony, Germany, and 2b
    from Melekhinskaya Sopka, Sherlovaya Gora, Russia. Semiquantitative EDS ratios Cu:U:As:P were 0.88:2.04:1.81:0.23
    and 0.96:1.99:1.97:0.06, respectively; these are slightly phosphate-bearing natural specimens, not
    chemically verified pure synthetic end members. Single-crystal data explicitly use 2a over 100-300
    K. Powder Methods include both specimens, ground from heptane suspension on Pt, and specify a vacuum
    chamber over 100-573 K, 10 K steps, 2 K/min and approximately 30 min per pattern. Figure 5 and Results
    label the plotted vacuum experiment 93-573 K and call its sample only 2, leaving its exact 2a/2b assignment
    unresolved. Separately, Kulaszewska et al. synthesized the arsenate end member with uranyl nitrate,
    copper chloride and arsenic acid, using 48 h settling, vacuum filtration, washing and 40-degree-C
    drying to constant weight. Their synchrotron sample was in a 0.5-mm borosilicate capillary secured
    with Kapton tape and described as sealed, measured initially at 293 K, cooled to 110 K and heated;
    nominal 50 K intervals and 30 min collections are stated, but plotted steps vary. The mixed-anion
    member is a separate material arm.
  evidence:
  - source_ref: nazarchuk2023
    supports: support
    explanation: Table 1 and Sections 2.3 and 3.2 support P4/nmm for natural crystal 2a at 100 K and strongly
      anisotropic thermal expansion. Section 3.2 and Figure 5 report powder diffraction changes at approximately
      283 and 543 K in vacuum, interpreted as two dehydration steps, and a separate 100-333 K experiment
      reaching a partially dehydrated state. These are source-assigned events for the specified natural
      material, not fixed species-wide decomposition temperatures or a metal extraction result.
  - source_ref: nazarchuk2023
    supports: partial
    explanation: Figure 5c-d caption incorrectly calls its material metatorbernite while the figure introduction,
      equations and surrounding text refer to metazeunerite, sample 2. The 93 K plotted start differs
      from the 100 K method boundary; no precise 2a/2b assignment is supplied for Figure 5. The study
      does not directly measure the water content of each intermediate by a paired mass-loss assay; its
      suggested greater flexibility of the arsenate layer and delayed water loss remain a structural interpretation.
      The cited CSD/ICSD files remain unacquired, precluding independent diffraction re-refinement.
  - source_ref: kulaszewska2019
    supports: support
    explanation: Section 3 and Figure 5 describe the synthetic arsenate end member as tetragonal initially,
      orthorhombic on cooling to 110 K, mixed orthorhombic/tetragonal at 293 K during reheating, and tetragonal
      again at 323 K. The authors call the orthorhombic indexing preliminary and identify the high-temperature
      product as unknown. This observed synthetic sequence differs from the 2023 natural-crystal model
      and vacuum powder behavior, rather than independently confirming their exact transition temperatures.
  - source_ref: kulaszewska2019_si
    supports: support
    explanation: Figure S9 gives the synthetic arsenate end-member cooling/heating sequence, including
      the 110 K, 293 K reheating, 323 K, 373 K, 423 K, 473 K and final cooled 293 K patterns. S7 and S8
      instead belong to the mixed phosphate-arsenate composition and are not assigned to pure metazeunerite.
  - source_ref: kulaszewska2019
    supports: partial
    explanation: The abstract places the new high-temperature phase at 473 K, Results says above 373 K,
      and the later comparison says 150 degrees C (about 423 K); Figure S9 provides sampled states rather
      than a unique transition onset. The paper also prints an arsenate-only formula in a sentence calling
      the composition mixed phosphate-arsenate. Neither that wording nor the mixed-member transition is
      used as an end-member measurement. Water content at each temperature, the high-temperature product
      and the causal origin of the low-temperature symmetry change remain unresolved. No quantitative
      uranium or arsenic recovery, microbial causality or durable field immobilization is demonstrated.
