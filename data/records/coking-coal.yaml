mechanisms:
  - id: tabas_culture_associated_desulfurization
    name: Culture-associated sulfur-content reduction in Tabas coking-coal feed
    process: bioleaching
    description: >-
      Prepared acidophilic mixed cultures were associated with lower residual
      sulfur content in selected Tabas coal feeds than thymol-containing
      uninoculated comparisons. The source proposes iron and sulfur oxidation
      associated with pyrite removal. Acid chemistry also removes sulfur, and
      the final hydrochloric-acid wash is part of the measured treatment sequence.
      This is laboratory impurity removal from coal, not microbial synthesis of
      coal, carbon recovery, an isolated sulfur product or demonstrated industrial
      coke production.
    context: >-
      Section 2.2 describes cultures obtained from the Sarcheshme Copper Complex
      R&D Center, reported to contain Acidithiobacillus ferrooxidans,
      Acidithiobacillus thiooxidans and Leptospirillum ferrooxidans. Section 2.4
      specifies a 1:1:1 mixture without strain accessions or member-specific
      controls. Eastern Parvadeh PE primary feed was crushed to a reported
      +180/-350 micrometre fraction. The B4C1 and B4B2 preparations include
      flotation and heavy-liquid concentrates; their protocol is not silently
      equated to raw PE. The culture was grown for 14 days before exposure,
      without coal adaptation, using iron- and sulfur-supplemented medium.
      Sections 2.2 and 2.4 call the medium 9K and K9 and describe the iron
      amendment differently, so no unique iron concentration is inferred.
      Coal incubations used 100 mL liquid in 250 mL flasks at 34 degrees C,
      150 rpm, initial pH 1.7, 5-10% w/v coal and 10-20% v/v inoculum for
      10-20 days. Uninoculated comparisons contained medium, coal and 3% w/w
      thymol. Evaporation was compensated with water acidified to pH 1.7.
      Residues were filtered, washed with 10% v/v HCl and dried at 60-70
      degrees C for 5-6 hours before analysis. The authors report ASTM-D3177
      sulfur and ASTM-D3174 ash analyses; exact sulfur-speciation implementation
      is not documented. Replicate numbers and the meaning of figure error bars
      were not specified in the inspected full text.
    microbial: true
    evidence:
      - source_ref: shahbazi2024
        supports: support
        explanation: >-
          Table 1, printed p. 583, gives PE initial total sulfur of 1.85%.
          Table 3, p. 589, gives 0.51% after 20 days with 20% inoculum at
          5% pulp density; Table 4, p. 590, gives 1.25% in the corresponding
          uninoculated condition. Reported reductions of 72.43% and 32.43%
          are consistent with those concentration changes. They are not a
          whole-feed sulfur mass balance, coal yield or recovered-product yield.
          Figure 4 shows evolving pH and ORP in the PE culture, consistent with
          the proposed acidophile chemistry but insufficient to identify a
          unique enzymatic or member-specific causal pathway.
      - source_ref: shahbazi2024
        supports: partial
        explanation: >-
          Sections 2.4 and 3.3 establish chemical-treatment contributions:
          uninoculated acidic controls retain substantial sulfur removal,
          thymol makes their composition different from inoculated treatments,
          and final HCl washing can alter residue composition. The authors
          attribute organic-sulfur changes to acidic conditions rather than
          direct microbial attack. No chemistry-matched cell-free culture
          control or isolated contribution of the wash is reported.
      - source_ref: shahbazi2024
        supports: partial
        explanation: >-
          Quantitative inconsistencies prevent generalizing the PE comparison.
          Table 3 assigns PE 68.98% ash reduction to bioleaching, whereas
          Section 3.4 and Figure 5 assign a similar value to bioflotation;
          Figure 5 also disagrees with several non-PE table values. Some
          non-PE initial and final sulfur entries do not reproduce the reported
          reduction percentages. No cross-method superiority, pooled result
          or exact ash-removal mechanism is accepted. Section 4 acknowledges
          unresolved scale and product-quality effects, and the inspected study
          reports no post-treatment coking-strength or plasticity test.
