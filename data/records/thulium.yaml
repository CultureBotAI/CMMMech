mechanisms:
- id: bsubtilis_powder_tm_biosorption
  name: Thulium biosorption by boiled and freeze-dried Bacillus subtilis cell powders
  process: biosorption
  description: Inactive cell powders from B. subtilis 168 and its LTA-defective RY1604 derivative removed dissolved thulium from defined chloride solutions. Table 3 entry 4 reports 90% and 74% removal for WT and LTA-defective powders, respectively, at 20 micrograms Tm/mL. Removal persisted in the defective preparation, so the comparison does not establish an exclusive lipoteichoic-acid-mediated route or quantify its contribution. Nitric acid eluted adsorbed rare-earth ions in a separate recovery step; the study did not establish a purified thulium-metal product.
  context: 'The accepted manuscript describes RY1604 as deletions of yfnI, yqgS and yvgJ combined with inducible ltaS, prepared after IPTG removal; Table 1 uses yvyJ where the construction methods use yvgJ. Biomass was boiled for 20 minutes, washed, freeze-dried, crushed and sieved to 53–100 micrometres. Assays used 20 mg powder in 20 mL metal solution at pH 3, 25 degrees C, mixed at 10 rpm for 30 minutes. Filter paper with nominal 7-micrometre retention and subsequent centrifugation separated solids before ICP atomic-emission spectrometry. Filter-associated adsorption was reported below 10%, but a blank-correction calculation and replicated uncertainty for Table 3 were not specified. WT-versus-mutant comparison tests these prepared biomasses, not growing-cell metabolism. No complemented-mutant adsorption assay was reported. The fitted saturation capacities are not accepted as measured capacities here: the deposited manuscript refers to Table 4 but does not include that table. The experiments
    used laboratory synthetic solutions, not ore or field water.'
  microbial: true
