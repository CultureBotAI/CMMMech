limitations:
- BY-3 collection designation is source-reported; no independently resolved strain
  accession or starting cell density.
- Natural powder includes arsenolite and reported purity measures are not reconciled.
  Total aqueous arsenic is not a realgar-specific yield.
- No time-matched pH control, contact-separation experiment, closed arsenic balance
  or direct retention speciation; later culture concentration is below sterile control.
- No original concentration-time plot, uncertainty or explicit filtration description
  for quoted soluble As values. No industrial or medical-effect claim is accepted.
- Independent bounded notice search does not prove absence of every correction or
  inaccessible supplement; current MDPI page returned429, but original retained fulltext/graphics
  were assessed.
notes:
- No claim of pure-phase recovery, industrial deployment or universal microbial necessity
  is inferred. Full source files remain outside Git.
- All evidence hashes bind nonempty actual inspected artifacts. The realgar2012.pdf
  HTML viewer is not used as PDF evidence; the actual realgar2012-original.pdf is
  bound.
