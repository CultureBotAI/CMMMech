    functional_role: High-affinity sodium/silicic acid symporter SIT1 (THAPSDRAFT_268895) mediating active uptake of dissolved orthosilicic acid (Si(OH)4) across the diatom plasma membrane under silicon-limiting conditions.
    annotation_note: Experimental strain is Thalassiosira pseudonana CCMP1335 (NCBITaxon:296543); grounded to the species-level Thalassiosira pseudonana reference proteome entry SIT1 (UniProtKB:B8C2V9, NCBITaxon:35128, UP000001449), which was sequenced from strain CCMP1335.
    evidence:
