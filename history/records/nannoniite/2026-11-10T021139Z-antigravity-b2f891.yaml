  details: Curated Nannoniite (Al2(OH)5F, IMA:2024-010, symbol Nnn) from the September 2026
    IMA Master List (PDF p. 151) and the open-access primary type description by Biagioni
    et al. (2024, European Journal of Mineralogy 36:1011-1022), including Stanza Santoni type
    locality at the Cetine di Cotorniano mine (Chiusdino, Siena, Tuscany, Italy; University
    of Pisa holotype 20071 and co-type 20072), characterization of UM1990-28-OHF:Al, Table
    1 WDS EMPA chemistry (n = 9), monoclinic P21/n 3DED/PXRD/SCXRD crystallography, Raman
    spectroscopy, and shortwave UV fluorescence discrepancy.
