id: cmmmech:hopeite
name: Hopeite
material_kind: mineral
description: Hopeite is the orthorhombic zinc phosphate tetrahydrate mineral, ideal Zn3(PO4)2.4H2O, distinct
  from its dimorph parahopeite, zinc metal, zinc sulfate reagent and zinc oxalates. The September 2026
  IMA list records grandfathered status G and original-description year 1826; that year is not an approval
  accession. The curated experiment distinguishes chemically precipitated starting hopeite from fungal-associated
  surface alteration and secondary hopeite-assigned crystals. No criticality designation is inherited
  from zinc.
