id: cmmmech:quenstedtite
name: Quenstedtite
material_kind: mineral
description: >-
  Quenstedtite is a triclinic ferric sulfate mineral, represented in
  the September 2026 IMA list as Fe(III)2(SO4)3(H2O)9·2H2O.
  It is distinct from other ferric-sulfate hydrates and from mixed-valence
  romerite. Thomas et al. (1974) refined a natural Chilean crystal of
  unknown exact locality in P-1, locating nine iron-coordinated water
  sites and two additional interlayer water sites. Eleven waters fit
  that specimen; earlier analyses indicating less water were retained
  as possible occupancy variability, with the lower limit untested.
  A separate 2012 MSc thesis refined a natural Alcaparrosa specimen
  and modeled hydrogen positions at 180 K. Its calcium-bearing surface
  grains were attributed to gypsum, rather than accepted as calcium
  intrinsic to quenstedtite. The thesis contains inconsistent comparison
  table angles, instrument descriptions and water-bonding prose; its
  CIF records mixed hydrogen treatment and geometrical H-site location.
  These qualifications prevent treating all hydrogen positions as direct
  unconstrained measurements or its proposed romerite conversion as an
  observed reaction. This is an identity and structure record, without
  a curated extraction, microbial mechanism, recovery yield or criticality
  designation.
