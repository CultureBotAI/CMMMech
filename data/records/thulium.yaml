  evidence:
  - source_ref: moriwaki_accepted_manuscript
    supports: support
    explanation: Preparation and Adsorption test methods (PDF pp. 7–9), Table 3 (PDF p. 21) and Figure 2 (PDF p. 23) support rapid Tm solution depletion by both powders. The Table 3 concentration header is micrograms/mL in the rendered PDF, despite erroneous extracted text. Entry 6 reports lower fractional removal at 100 micrograms/mL (35% WT; 29% defective), so the 20-micrograms/mL outcome is not a loading-independent performance guarantee.
  - source_ref: moriwaki_accepted_manuscript
    supports: partial
    explanation: The results on PDF p. 11 describe two 20-mL elutions with 2.7 M nitric acid and greater than 94% recovery of adsorbed rare-earth ions for both powders. This is stated across La, Eu and Tm, with no element-specific elution table or uncertainty; it is not greater than 94% recovery of initial thulium feed. Morphology, residual binding in RY1604 and the unquantified LTA/WTA abundances prevent assigning an exclusive ligand mechanism. Both Langmuir and Freundlich fits were acceptable, and the authors explicitly say these fits do not distinguish the adsorption mechanism. No direct Tm speciation or site-resolved spectroscopy is supplied.
  - source_ref: moriwaki_2013
    supports: context_only
    explanation: Publisher metadata and abstract confirm the publication identity and broad WT/defective comparison. The full scientific assessment uses the openly deposited accepted manuscript; the subscription version and its referenced capacity table were not accessed.
