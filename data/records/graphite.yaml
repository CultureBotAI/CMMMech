id: cmmmech:graphite
name: Graphite commodity family
material_kind: commodity
description: >-
  The commercial raw-material family comprising natural and synthetic graphite.
  The USGS Graphite 2021 yearbook jointly describes and separately accounts for
  these two origin-defined commodity streams. This broader record explicitly
  overlaps the natural-graphite commodity record, which denotes its natural-origin
  subset; the two records are not synonyms or disjoint material classes.
  Neither origin establishes a particular battery product qualification.
  This family is distinct from the carbon element, a graphite mineral species
  or specimen, graphene, and other carbon materials. The criticality entry
  preserves the unqualified graphite wording of the original EU 2024 Annex II;
  its separate Annex I battery-grade designation is not generalized to every
  family member. No microbial purification or recovery mechanism is asserted.
sources:
  - id: usgs-graphite2021
    title: >-
      Stewart, US Geological Survey 2021 Minerals Yearbook, Graphite,
      advance release December 2024: printed pp. 32.1-32.2 (PDF pp. 2-3),
      natural and synthetic graphite identities and commodity production
    url: https://pubs.usgs.gov/myb/vol1/2021/myb1-2021-graphite.pdf
    accessed_on: '2026-10-11'
  - id: eu2024-original
    title: >-
      Regulation (EU) 2024/1252 of 11 April 2024, original OJ text published
      3 May 2024: Article 3(3), Annex I, Section 1(k), and Annex II,
      Section 1(v), graphite scopes
    url: https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng
    accessed_on: '2026-10-11'
criticality:
