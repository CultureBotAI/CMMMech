mechanisms:
- id: mixed_acidophile_mobilization
  name: Culture-associated metal mobilization from mixed pond ash
  process: bioleaching
  description: Pangayao and colleagues measured zinc, manganese, chromium, iron and copper in filtered liquors following 15-day contact of the mixed ash with source-designated A. albertensis ATCC 35403 and A. thiooxidans ATCC 19377 cultures. Lower final pH and reported metal solubilization are consistent with culture-associated acid leaching. Added sulfuric acid and the absence of matched uninoculated controls prevent assignment of the full response to microbial sulfur oxidation or to either organism separately. No isolated recovered metal was demonstrated.
  context: The pond ash was dried at 105 degrees C for 24 hours and sieved using a stated number-200 mesh; the paper's accompanying 0.075-micrometre value is inconsistent and is not accepted as a verified particle cutoff. The source reports DSMZ-supplied cultures under ATCC designations; catalogue correspondence does not authenticate the experimental stocks or their mixing ratio, which is unreported. Cultures were incubated for 10 days at 30 degrees C and 160 rpm in a medium containing ammonium sulfate, magnesium sulfate, calcium chloride, potassium dihydrogen phosphate and 10 g/L elemental sulfur. Leaching used 250 mL flasks containing 100 mL medium, 1-5 g ash, 1-5 mL inoculum and 1-3 g added sulfur, at 30 degrees C and 160 rpm. Ash/medium were autoclaved at 121 degrees C for 15 minutes and adjusted with 1 M sulfuric acid from pH 6.5-8 to pH 2 before sulfur and inoculum addition. The 17-run Box-Behnken design includes repeated central settings; duplicate runs are reported. After 15 days,
    0.45-micrometre cellulose-acetate-filtered liquor was nitric-acid-preserved for ICP-OES. No acid-only, uninoculated or no-sulfur series is displayed, and no sulfur balance or direct organism-specific growth assay is supplied. This is a flask experiment with industrial-origin feed, not an industrial treatment demonstration.
