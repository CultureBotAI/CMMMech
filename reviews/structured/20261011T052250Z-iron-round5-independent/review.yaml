limitations:
- The primary product is a mixture; this review did not refit spectra, quantify phase
  proportions, reconstruct uncertainty or infer isolated-product yield.
- NCBI live reviewer fetch failed; the curator-acquired authority HTML was independently
  read and its receipt/checksum verified. Other identity and criticality authorities
  were opened live.
- Figures and supplement were acquired by the curator and independently inspected;
  no new raw files were committed. Only source-relevant supplement pages6-9 were visually
  examined; other pages were read only where relevant.
- The primary paper has a phosphate amount inconsistency between Methods and Discussion;
  no phosphate loading or inferred phosphate mechanism is curated, so it does not
  undermine this narrower record.
- Correction/retraction and duplicate searches are bounded; empty findings is not
  a corpus-wide or exhaustive-literature pass.
