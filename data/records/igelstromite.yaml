id: cmmmech:igelstromite
name: Igelströmite
material_kind: mineral
description: >-
  Igelströmite (IMA 2021-035) is an IMA-accepted anhydrous iron(III)–antimony(III)–lead(II)
  oxide mineral of the minium group (schafarzikite subgroup, general formula
  MX2O4) with September 2026 IMA-CNMNC Master List ideal formula Fe3+(SbPb)O4
  (PDF p. 100, status A; written Fe3+(Sb3+Pb2+)O4 in the article title/Abstract
  and Fe(SbPb)Sigma=2O4 in Section 4, p. 314; IMA symbol Ig; ideal composition
  PbO 49.73 wt%, Sb2O3 32.48 wt%, Fe2O3 17.79 wt%, total 100 wt%). Described by
  Holtstam, Langhof, Friis, Karlsson, and Erambert (2024) from the Hindenburg
  working (150 m level) of the Långban Långban-type Fe–Mn skarn deposit (59.85°
  N, 14.26° E), Filipstad district, Värmland Province, Sweden (named after
  Swedish mineralogist Lars Johan Igelström, 1822–1897; holotype specimen
  deposited in the Department of Geosciences, Swedish Museum of Natural History,
  Stockholm, under catalogue no. GEO-NRM 19255056, with single-crystal mount KNR
  44278 at the Natural History Museum, University of Oslo, pp. 311–312). Occurs
  as tiny lenticular crystals forming compact rounded aggregates up to 1 mm
  across on open fractures (some filled with grey to white calcite) in a
  fine-grained, bluish-grey hematite ore with minor aegirine, a serpentine-group
  mineral, and fluorcalcioroméite; in the fractures it grows on globular masses
  of a greyish-black serpentine-group mineral associated with nadorite, thin
  tabular hematite, colourless baryte, senarmontite, white acicular mimetite, and
  Pb-bearing rhodochrosite (Section 2, p. 312, Fig. 1, p. 313). Macroscopically
  dark reddish-brown to black with submetallic lustre, translucent in thin edges,
  brownish streak, estimated Mohs hardness ~3.5, brittle with uneven fracture,
  indistinct {110} cleavage, non-fluorescent under UV, and Dcalc = 6.33(1) g/cm3
  from the empirical formula and single-crystal unit cell (Section 3, p. 313, and
  Table 4, p. 315). In reflected light it is bluish-greyish-white, weakly
  bireflectant, nonpleochroic, with weak anisotropy (greyish to brownish rotation
  tints) and sparse deep-red internal reflections; reflectance values in air (R2,
  R1, Section 3, p. 313, where the spectral window is printed as "400–70 nm range"
  for 400–700 nm, and Table 2, p. 314) at the four COM wavelengths are 16.1, 15.2%
  (470 nm), 15.1, 14.4% (546 nm), 14.9, 14.2% (589 nm), and 14.8, 14.1% (650 nm).
  Micro-Raman measurements (532 nm laser) produced no usable spectrum due to
  laser-induced breakdown of the sample surface (Section 6.1, p. 315), whereas
  57Fe Mössbauer spectroscopy with a 57Co rhodium-matrix point source (Section
  6.2, pp. 316–317, Fig. 4) yielded a single paramagnetic quadrupole doublet with
  centre shift CS = 0.42(2) mm/s, quadrupole splitting QS = 0.89(3) mm/s, and
  asymmetry parameter a12 = 0.60(2), confirming predominance of octahedrally
  coordinated high-spin Fe3+ (with any Fe2+ < 15% of total Fe). Mean of 12 WDS
  electron-microprobe point analyses (CAMECA SX100, 15 kV, 10 nA, 1–2 um beam;
  Section 4, pp. 313–314, Table 3, p. 315) yielded Sb2O3 42.89 wt% (2sigma 5.41),
  PbO 34.42 (2sigma 4.53), Fe2O3 11.05 (2sigma 1.73) and FeO 1.14 (2sigma 1.92)
  (recast from total Fe for charge balance on 3 cations and 4 O), MnO 4.78
  (2sigma 1.57), As2O3 3.88 (2sigma 1.41), MgO not detected, printed Total =
  98.17 wt% (arithmetic sum of rounded means = 98.16 wt%), corresponding on 3
  cations and 4 O to the empirical formula
  (Fe3+0.59Mn2+0.29As3+0.06Fe2+0.06)Sigma=1.00(Sb3+1.24Pb2+0.65As3+0.11)Sigma=2.00O4.
  Tetragonal, space group P42/mbc (no. 135), Z = 4 (Section 5, pp. 314–319,
  Tables 4–7, 10–11, Fig. 5): single-crystal MoKalpha XRD refinement on a 0.007 x
  0.028 x 0.041 mm fragment (Rigaku Synergy-S with HyPix-6000HE detector;
  MoKalpha wavelength printed as "lambda = 0.71703 Å" for 0.71073 Å in Section
  5.1 on p. 314; 411 reflections with Fo > 4sigma(Fo) out of 500 unique, 6571
  collected, Rint = 3.93%, R1 = 3.73%, R1(all) = 4.60%, wR2 = 6.66%, GoF = 1.315,
  Table 4, p. 315) gives a = 8.4856(2) Å, c = 6.0450(3) Å, V = 435.27(3) Å3, with
  [001] chains of edge-sharing M(Fe)O6 octahedra (4d site, Fe–O1 = 2.097(6) Å x
  2, Fe–O2 = 2.064(5) Å x 4, <Fe–O> = 2.075 Å, BVS = 2.60 v.u., refined SOF =
  0.978(17) Fe, site composition Fe3+0.59Mn2+0.29Fe2+0.06As0.06 with 25.22 SXRD
  vs 26.13 EPMA e-, Tables 5–7, 10, pp. 316, 318; note Table 5 header on p. 316
  prints "Site | x | y | x" with a duplicate "x" for "z") cross-linked via
  corner-sharing chains of trigonal-pyramidal X(Sb,Pb)O3 polyhedra (8h site,
  refined SOF 0.76(3) Sb + 0.24(3) Pb, Sb–O1 = 2.070(3) Å x 2, Sb–O2 = 2.051(7)
  Å, <Sb–O> = 2.063 Å, BVS = 2.40 v.u.; Table 6 lists site composition
  Sb0.625Pb0.325As0.055 summing to 1.005 per site = 2.01 pfu, 58.44 SXRD vs 60.34
  EPMA e-) surrounding stereoactive 5s2/6s2 lone-pair tunnels; Gandolfi CuKalpha
  powder XRD (23 observed reflections, Section 5.2, p. 314, Table 11, p. 319)
  refines to a = 8.484(3) Å, c = 6.038(3) Å, V = 434.6(3) Å3, with seven
  strongest observed lines [dmeas in Å (Imeas; hkl)] at 3.21 (100; 2 1 1), 2.46
  (22; 2 0 2), 2.69 (20; 1 1 2, 3 1 0), 1.946 (19; 4 1 1), 1.667 (16; 3 3 2),
  4.25 (14; 2 0 0), and 1.778 (14; 2 1 3) (followed by 3.01 (13; 0 0 2, 2 2 0)).
  Distinct from co-described manganoschafarzikite (Mn2+Sb3+2O4, IMA
  2022-129), schafarzikite (Fe2+Sb3+2O4), and minium (Pb2+2Pb4+O4); no
  criticality designation for igelströmite itself, no microbial or biological
  mechanism, and no industrial recovery yield are asserted.
