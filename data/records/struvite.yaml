    entry_name: CEXA_ASPNA
    protein_name: Citrate exporter A
    gene_symbol: cexA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:380704
      label: Aspergillus niger ATCC 1015
    reference_proteome_id: UP000006706
    interpro_ids:
    - InterPro:IPR011701
    - InterPro:IPR020846
    - InterPro:IPR036259
    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA in Aspergillus niger ATCC 1015 that secretes intracellularly synthesized citric acid into the extracellular medium, contributing to organic-acid acidification during struvite solubilization.
    annotation_note: Grounded to strain-matched reviewed Swiss-Prot entry UniProtKB:G3Y4N5 (CEXA_ASPNA; locus ASPNIDRAFT_56962) for Aspergillus niger ATCC 1015 (NCBITaxon:380704).
    evidence:
    - source_ref: kang_2022
      supports: partial
      explanation: Representative Aspergillus niger ATCC 1015 citrate exporter CexA for fungal organic-acid excretion during struvite solubilization; Kang et al. (2022) measured pH drop (to 2.46 +/- 0.11) and oxalic acid (26.49 +/- 3.43 mM) without testing cexA mutants.
  - uniprot_accession: UniProtKB:A0A254TZW7
    entry_name: CEXA_ASPNG
    protein_name: Citrate exporter A
    gene_symbol: cexA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:5061
      label: Aspergillus niger
    interpro_ids:
    - InterPro:IPR011701
    - InterPro:IPR020846
    - InterPro:IPR036259
    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA that secretes intracellularly synthesized citric acid into the extracellular medium, contributing to organic-acid acidification during struvite solubilization.
    annotation_note: Grounded to functionally characterized reviewed Swiss-Prot entry UniProtKB:A0A254TZW7 (CEXA_ASPNG) for Aspergillus niger (NCBITaxon:5061) alongside strain-matched ATCC 1015 entry UniProtKB:G3Y4N5.
    evidence:
    - source_ref: kang_2022
      supports: partial
      explanation: Representative Aspergillus niger citrate exporter CexA for fungal organic-acid excretion during struvite solubilization; Kang et al. (2022) measured pH drop (to 2.46 +/- 0.11) and oxalic acid (26.49 +/- 3.43 mM) without testing cexA mutants.
  evidence:
  - source_ref: kang_2022
    supports: support
    explanation: Results and Figure 2B report final soluble Pi of 51.37 +/- 0.59 mM in the struvite-containing fungal culture; Figure 2 specifies means and standard errors from at least three replicates. Final pH was 2.46 +/- 0.11 and oxalic acid 26.49 +/- 3.43 mM. These are solution endpoints, not a mineral-specific mass balance or a recovery yield.
  - source_ref: kang_2022
    supports: partial
    explanation: Methods name uninoculated flasks, but Figure 2 compares inoculated cultures with versus without struvite. It does not provide an acid-matched abiotic contrast. Background medium phosphate and the mixed mineral feed limit attribution of every measured Pi molecule to struvite. The inspected full text does not specify the Pi assay procedure, although it describes oxalic acid HPLC. The source's complete-solubilization wording is not adopted as a quantified mineral dissolution fraction.
