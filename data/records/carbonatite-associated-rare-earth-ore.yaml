id: cmmmech:carbonatite-associated-rare-earth-ore
name: Carbonatite-associated rare-earth ore
material_kind: primary_resource
description: >-
  Naturally occurring, mixed rare-earth-bearing ore associated with
  alkaline-carbonatite deposits, anchored here to the tested Mushgia Khudag
  material from Mongolia. The deposit association does not establish that
  every sampled rock meets a modal carbonatite classification. The curated
  feed contains quartz, apatite, calcite and other phases, with monazite and
  parisite assignments; it is neither a pure mineral nor a processed waste.
  Laboratory culture pretreatment followed by sulfuric-acid leaching is
  represented as a treatment-associated observation with unresolved causal
  controls. Neither industrial deployment nor inherited criticality is asserted.
