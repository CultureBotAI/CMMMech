id: cmmmech:churchite-y
name: Churchite-(Y)
material_kind: mineral
description: Churchite-(Y) is the hydrated yttrium phosphate mineral species Y(PO4)(H2O)2, listed with renamed status in the September 2026 IMA-CNMNC master list. Its 1987 special-procedure year is not a unique approval accession. It is distinct from elemental yttrium, anhydrous xenotime-(Y), and an unidentified rare-earth phosphate precipitate. Laboratory synthesis and irradiation of a characterized synthetic YPO4·2H2O analogue support the abiotic processes below. Neither a microbial formation mechanism nor criticality inherited from yttrium is assigned. These experiments do not demonstrate extraction from an ore, isolated-element recovery, or industrial operation.
sources:
- id: ima_2026_09
  title: 'IMA-CNMNC. The New IMA List of Minerals, September 2026; PDF page 1 field definitions and page 45 Churchite-(Y) row: Y(PO4)(H2O)2, Rn, 1987 s.p.'
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-15'
- id: rafiuddin2026
  title: Rafiuddin MR, Mir AH and Zhang Y (2026). In Situ Observation of Radiation Damage in Rhabdophane- and Churchite-Type Rare-Earth Phosphate Nanocrystals. Inorganic Chemistry 65(22), 12509-12523. DOI 10.1021/acs.inorgchem.6c01299; PMID 42184095; PMCID PMC13250987. Complete primary article XML/HTML, original claim-bearing figures and thirteen-page supporting information inspected; main PDF route returned HTML and is not claimed acquired.
  url: https://doi.org/10.1021/acs.inorgchem.6c01299
  accessed_on: '2026-10-15'
mechanisms:
- id: acidic_synthetic_churchite_precipitation
  name: Abiotic precipitation of synthetic churchite-type yttrium phosphate
  process: other
  description: Rafiuddin and colleagues (2026) synthesized YPO4·2H2O by combining yttrium nitrate and phosphoric acid, adjusting the mixture to approximately pH 1.5 and aging it at 50 degrees Celsius. Powder X-ray diffraction, the reported monoclinic Rietveld fit, and electron diffraction support a churchite-type crystalline product; microscopy and elemental maps show acicular aggregates containing yttrium and phosphorus. This is chemical crystallization from reagent solutions, without microbial biomass or metabolites.
  context: The Y preparation in section 2.1.2 uses 30 mL of 0.05 M nitrate solution and 6 mL of 1 M H3PO4, approximately pH 1.5, one hour of stirring, and two days in a closed PFA vessel at 50 degrees Celsius. Precipitates were washed with deionized water and dried overnight at 40-50 degrees Celsius. The nitrate stock was prepared from Y2O3 and nitric acid. Section 2.2 describes powder diffraction over 10-80 degrees 2-theta, with atomic coordinates and site occupancies fixed during refinement. No mass-balanced synthesis yield or selective yttrium recovery from a mixed feed is established. The article's section 3.2 calls its reference pattern YPO4·H2O in one sentence, whereas Figure 4, Table 2 and supplement Figure S4 consistently identify the dihydrate. The record follows that explicit dihydrate characterization and retains the textual inconsistency rather than asserting a monohydrate experiment.
  microbial: false
  evidence:
  - source_ref: rafiuddin2026
    supports: support
    explanation: Sections 2.1.2, 2.2, 3.2 and 3.4.2; Figures 4, 6, 9 and 10; Table 2; supporting information Figure S4(c), page S6, and Figure S11(c), page S13. Personally inspected primary text, original figures, refinement plot and Y/P spectra support the synthetic crystalline analogue and specified preparation.
  - source_ref: rafiuddin2026
    supports: partial
    explanation: The authors report phase purity, but this curation does not independently refine raw diffraction data or establish an impurity detection limit. Fixed occupancies, elemental mapping and selected-area diffraction do not alone quantify water stoichiometry or recovered-product yield. The section 3.2 reference-formula mismatch is explicit in the source.
- id: xenon_irradiation_amorphization
  name: Abiotic irradiation-induced loss of crystalline order
  process: other
  description: The same study exposed synthetic churchite-type YPO4·2H2O crystallites to 650 keV Xe2+ ions while following their structure by transmission electron microscopy. At 298 K the Y material lost its sharp diffraction spots and developed an amorphous halo; Figure 13 and Table 4 identify complete amorphization at a reported fluence of 3.1 × 10^13 ions per square centimetre. This observed structural transformation is distinct from the proposed explanation involving disruption of interlayer hydrogen bonds.
  context: Section 2.3 describes irradiation of selected electron-transparent crystallites, approximately 15 minutes of equilibration at each temperature, incremental ion exposure and an electron beam switched off during irradiation. Ion flux was measured before and after each experiment. The reported 0.03 displacements per atom for the Y material is a SRIM model result, not a directly measured damage fraction. Churchite samples amorphized at tested temperatures up to 473 K; a critical amorphization temperature could not be established before the competing thermal phase transition. Comparators include Gd/Dy churchites, Sm/Gd/Dy rhabdophanes, Sm-monazite and Dy-xenotime, not a matched Y-only set of all structures. This experiment contains no actinide-doped Y sample or leach-resistance measurement, and does not establish geological-repository retention or recovery performance.
  microbial: false
  evidence:
  - source_ref: rafiuddin2026
    supports: support
    explanation: Section 2.3, section 3.5.2, Figure 13 bottom row and Table 4 support the Y-sample irradiation conditions and observed loss of diffraction. The pristine, intermediate and final patterns are directly distinguished; model-derived displacement values are kept separate from the reported ion fluence.
  - source_ref: rafiuddin2026
    supports: partial
    explanation: Section 3.5.2 presents hydrogen-bond disruption and structural connectivity as interpretations. The conclusions explicitly call for future measurements linking structural damage to leach resistance. Suggested repository-temperature benefits and actinide-retention implications are therefore not accepted as demonstrated behavior of this mineral.
