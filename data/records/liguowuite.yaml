id: cmmmech:liguowuite
name: Liguowuite
material_kind: mineral
description: >-
  Liguowuite (IMA 2020-097) is an IMA-accepted monoclinic tungsten trioxide
  mineral of the perovskite supergroup, non-stoichiometric perovskite group, and
  the first natural member of the A-site vacant single-oxide ([]BO3) perovskite
  subgroup (Nickel–Strunz 04.EA.10, Dana 04.05.01.02), with September 2026 IMA
  Master List ideal formula WO3 (status A, PDF p. 125) and empirical formula
  W1.00O3 on the basis of O = 3 (Xue et al. 2022, pp. 95, 98, 102–103). WDS
  electron-microprobe analysis (15 spots on 4 grains at 15 kV, 10 nA, 5 um beam;
  Table 1, p. 98) gave WO3 99.23 (range 98.19–99.93, SD 0.56), CaO 0.06
  (n.d.–0.11, SD 0.03), Na2O 0.04 (n.d.–0.10, SD 0.03), TeO2 0.03 (n.d.–0.14, SD
  0.05), K2O 0.01 (n.d.–0.05, SD 0.02), Al2O3 n.d. (n.d.–0.01, SD 0.00), total
  99.37 wt% (ideal WO3 = 100 wt%). Described by Xue, Sun, He, Chen, and Yang
  (2022) from the vicinity of Nanyang village, Huaping County, Lijiang
  Prefecture, Yunnan Province, southern Panzhihua–Xichang (Pan–Xi) region,
  Southwest China (26°46'8.21" N, 101°27'13.86" E in the abstract on p. 95;
  printed as 26°46'18.21" N, 101°27'13.86" E in Section 2.1 on p. 96; type
  specimens deposited at the Museum of China University of Geosciences, Beijing,
  catalogue number 21K005, and the Geological Museum of China, Beijing,
  catalogue number M16121), where it occurs in a Neoproterozoic (Sinian)
  semi-weathered biotite-quartz monzonite (biotite adamellite) stock near the
  contact zone with Permian basites and 300 m north of a fault-hosted
  pyrite-quartz vein gold deposit in Permian gabbro (pp. 95–97). Closely
  associated with tewite (IMA:2014-053) and wumuite (IMA:2017-067a), as well as
  scheelite, tellurite, monazite-(Ce), allanite-(Ce), bastnasite-(Ce),
  xenotime-(Y), hornblende, pargasite, ferro-hornblende, annite, hydrobiotite,
  phlogopite, orthoclase, microcline, albite, quartz, kaolinite, ilmenite,
  goethite, hematite, magnetite, pyrite, zircon, zoisite, titanite, epidote,
  diopside, tourmaline, almandine, fluorapatite, and moissanite (p. 96). Named
  in honor of Prof. Li Guowu (b. 1964) of China University of Geosciences
  (Beijing). Forms greenish-yellow, transparent to translucent prismatic to
  short-columnar grains (0.05–0.1 mm in diameter) displaying triclinic
  pseudomorphism ({100}, {010}, {001}, and {120} forms) composed of 100–200 nm
  monoclinic nanoparticles with cracks and nanovoids resulting from a
  high-to-low-temperature phase transition (pp. 96–97, 104–106, Figs. 1–2);
  greasy lustre, white streak, brittle tenacity, uneven fracture, no cleavage,
  Mohs hardness ~3–4, no UV fluorescence, Dcalc = 7.22 g/cm3, and calculated
  Gladstone–Dale refractive index n = 2.24 (p. 97). FTIR micro-reflection (Fig.
  3, p. 99: [WO6] stretching bands at 870 and 792 cm-1; W–O bending bands at
  548, 511, 490, 464, 439, and 418 cm-1) and 532 nm micro-Raman spectra (Fig. 4,
  p. 99: nu(O–W–O) stretching at 806 and 716 cm-1; delta(O–W–O) bending at 327
  and 272 cm-1; lattice mode at 134 cm-1) confirm the absence of O–H or H2O
  groups. Monoclinic, space group P21/n (no. 14, Z = 8); Rietveld powder X-ray
  diffraction refinement (CuKalpha, lambda = 1.5418 Å, 106 reflections in 2theta
  = 15–80° refined from the ICSD 16080 starting model to Rwp = 0.0604, Rp =
  0.0454, chi2 = 1.707; pp. 99–101, Tables 2–5, Figs. 5–6) gives a =
  7.32582(18) Å, b = 7.54767(18) Å, c = 7.71128(18) Å, beta = 90.678(3)°, V =
  426.348(19) Å3, with five strongest powder X-ray diffraction lines [d in Å
  (I%) (hkl)] at 3.6590 (100)(-200), 3.8552 (88)(002), 3.7685 (88)(020), 2.6258
  (60)(202), and 2.6928 (43)(022) (Table 2, p. 100), and corner-sharing distorted
  and tilted [W1O6] (W1–O = 1.7404(16)–2.1948(16) Å, mean 1.938 Å, BVS 6.033
  v.u.) and [W2O6] (W2–O = 1.7322(17)–2.1763(16) Å, mean 1.931 Å, BVS 6.195
  v.u.) octahedra (Glazer tilt system a-b+c-) with vacant A sites. Distinct from
  hydrous tungsten oxides (meymacite WO3·2H2O, hydrotungstite WO2(OH)2·H2O),
  anthropogenic burned-dump orthorhombic WO3 ("krasnogorite", invalid mineral
  name; p. 96), and elemental tungsten; no criticality designation, microbial
  mechanism, or industrial recovery yield is asserted.
