id: cmmmech:pyrite
name: Pyrite
material_kind: mineral
description: Pyrite is the FeS2 mineral species listed with grandfathered status G in the September 2026 IMA compilation. Its row does not provide an approval identifier or a known original-description year. The species is distinct from iron, sulfur, marcasite, pyrrhotite, nickel-bearing substituted experimental phases and mixed ores. Natural specimen material and synthesized FeS2 used in the experiment below are separate assay substrates. No constituent-element criticality designation is inherited.
