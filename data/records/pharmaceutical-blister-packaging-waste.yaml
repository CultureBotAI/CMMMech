id: cmmmech:pharmaceutical-blister-packaging-waste
name: Pharmaceutical blister packaging waste
material_kind: secondary_resource
description: >-
  Discarded multilayer pharmaceutical blister packaging containing aluminium,
  polymers and adhesives, represented by hospital-collected transparent, white
  and silver-coloured fractions. This manufactured waste resource is distinct
  from aluminium as an element, beverage cans, beverage-carton hydropulping
  reject and the sulfur feed used to produce its leaching acid. Its composition
  varies with packaging construction; no element-level criticality is inherited.
