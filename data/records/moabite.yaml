id: cmmmech:moabite
name: Moabite
material_kind: mineral
description: >-
  Moabite (IMA 2020-092) is an IMA-accepted anhydrous nickel-iron(III)
  oxyphosphate mineral with September 2026 IMA-CNMNC Master List ideal formula
  NiFe3+(PO4)O (PDF p. 145, status A), representing the first naturally occurring
  mineral with the alpha-Fe2PO5 (alpha-Fe2OPO4 / A2+B3+OPO4) structure type and
  the natural analogue of synthetic NiFe3+(PO4)O. Described by Britvin, Murashko,
  Krzhizhanovskaya, Vapnik, Vlasenko, Vereshchagin, Pankin, and Vasiliev (2025)
  from heavily veined dark-colored fine-grained anorthite–diopside paralava
  blocks in a small abandoned building-stone quarry (31°21'52" N, 36°10'55" E) in
  the 300 km2 Daba-Siwaqa pyrometamorphic complex (Hatrurim Formation / "Mottled
  Zone"), ~80 km south-southeast of Amman, central Jordan (named after the
  ancient Kingdom of Moab; holotype polished section 5627/1 deposited in the
  Fersman Mineralogical Museum of the Russian Academy of Sciences, Moscow,
  Russia, pp. 353–356). Occurs in millimeter-sized phosphate segregations as
  isometric to short prismatic euhedral crystals and anhedral grains up to 30 um
  across, formed by high-temperature (<= 1400 °C) pyrolytic oxidation of natural
  Fe–Ni phosphides and associated with diopside, anorthite, crocobelonite
  (CaFe3+2(PO4)2O, IMA 2020-005), yakubovichite (CaNi2Fe3+(PO4)3, IMA 2021-096),
  hematite, an unnamed alluaudite-group phosphate intermediate between
  NaNaCa(Fe3+Mg)(PO4)3 and []NaCa(Fe3+Fe3+)(PO4)3, native iron (alpha-Fe), and
  precursor phosphides negevite (NiP2), murashkoite (FeP), transjordanite (Ni2P),
  and halamishite (Ni5P4) (pp. 354–356, Figs. 1–2). Macroscopically deep-brown to
  very dark-brown/almost-black with vitreous lustre, semi-transparent red-brown
  in thin section (predicted Gladstone–Dale mean refractive index 1.99), Mohs
  hardness 4, no cleavage observed, Dcalc = 4.324 g/cm3 from the empirical
  formula and single-crystal unit-cell parameters (Abstract, p. 353; Table 5 on
  p. 358 reports Dx = 4.338 g/cm3 for ideal NiFe(PO4)O), and grey in reflected
  light with red-brown internal reflections, non-pleochroic, weak anisotropy and
  bireflectance (Rmax / Rmin in air, Table 2, p. 355: 14.1 / 14.0% at 470 nm,
  13.5 / 13.3% at 546 nm, 13.1 / 12.9% at 589 nm, and 12.8 / 12.7% at 650 nm).
  Micro-Raman spectroscopy (632.8 nm He–Ne laser, Section 5, pp. 355–356, Fig. 3)
  confirms the absence of O–H/H2O bands and shows bands at 115, 130, 160, 179,
  198, 255, 292sh, 307, 361, and 388 cm-1 ([MO6] octahedral and lattice modes),
  410, 423, 449, and 469 cm-1 (nu2 symmetric PO4 bending), 545, 590, 628, and
  650sh cm-1 (nu4 asymmetric PO4 bending), 843, 871, and 918 cm-1 (nu1 symmetric
  P–O stretching), and 988, 1019, 1090, and 1157 cm-1 (nu3 asymmetric P–O
  stretching). Mean of 5 WDS electron-microprobe analyses (WAVE 500
  wavelength-dispersive spectrometer, Oxford Instruments, attached to a Hitachi
  S-3400 N scanning electron microscope, 20 kV, 15 nA, 2 um beam; Section 2, p.
  354, and Section 6, p. 356, Table 3) yielded Fe2O3 36.04 wt% (range 34.70–37.11),
  P2O5 31.22 (30.47–32.55), NiO 29.75 (29.37–30.11), CuO 1.73 (1.58–1.92), V2O5
  0.47 (0.42–0.51), MgO 0.45 (0.36–0.61), Al2O3 0.19 (0.00–0.38), Cr2O3 0.18
  (0.00–0.32), total 100.03 wt%, corresponding on 5 O apfu to the empirical
  formula
  (Ni0.90Cu0.05Mg0.03)Sigma0.98(Fe3+1.01Al0.01Cr0.01)Sigma1.03(P0.99V5+0.01)Sigma1.00O5.
  Orthorhombic, space group Pnma (no. 62), Z = 4 (Section 2, p. 354, and Section
  7, pp. 356–360, Tables 1, 4–8, Fig. 4): single-crystal MoKalpha XRD refinement
  on a 0.03 x 0.01 x 0.01 mm crystal (Bruker Kappa APEX DUO, 389 reflections with
  I > 2sigma(I) out of 499 unique, 1866 collected, Rint = 0.062, R1 = 0.033, wR2
  = 0.071, GoF = 1.04, Table 5, p. 358) gives a = 7.2161(16) Å, b = 6.4064(15) Å,
  c = 7.4706(19) Å, V = 345.4(1) Å3, with zigzag [010] chains of alternating
  edge- and face-sharing [NiO6] octahedra (Ni1 at 4a, Ni1–O4 = 2.036(3) Å x 2,
  Ni1–O1 = 2.072(3) Å x 2, Ni1–O2 = 2.139(3) Å x 2, <Ni1–O> = 2.082 Å, BVS = 2.07
  v.u., Table 8, p. 359) and [Fe3+O6] octahedra (Fe1 at 4c, Fe1–O1 = 1.886(5) and
  2.081(5) Å, Fe1–O3 = 1.903(5) Å, Fe1–O4 = 2.014(3) Å x 2, Fe1–O2 = 2.374(5) Å,
  <Fe1–O> = 2.045 Å, BVS = 3.04 v.u.) cross-linked by [PO4] tetrahedra (P1 at 4c,
  P1–O3 = 1.511(5) Å, P1–O4 = 1.540(3) Å x 2, P1–O2 = 1.554(5) Å, <P1–O> = 1.536
  Å, BVS = 5.08 v.u., pp. 359–360) and oxo anions O1 (4c, coordinated by 2 Ni1
  and 2 Fe1); CoKalpha Debye–Scherrer powder XRD refinement (Rigaku RAXIS Rapid
  II diffractometer with semi-cylindrical imaging plate, r = 127.4 mm, 40 kV, 15
  mA, Section 2, p. 354, and Section 7, p. 356, Table 4, p. 357) gives a =
  7.2145(3) Å, b = 6.4031(3) Å, c = 7.4657(3) Å, V = 344.88(2) Å3, with seven
  strongest lines at 2.7262 (100)(121), 3.251 (83)(201), 5.20 (63)(101), 3.321
  (37)(102) (printed with a decimal comma as 3,321(37)(102) in the Abstract on p.
  353), 2.5946 (37)(202), 2.3542 (25)(103), and 2.3044 (24)(122) Å. Distinct from
  yakubovichite, crocobelonite, negevite, transjordanite, halamishite, and
  elemental nickel or phosphorus; no criticality designation for moabite itself,
  no microbial or biological mechanism, and no industrial recovery yield are
  asserted.
