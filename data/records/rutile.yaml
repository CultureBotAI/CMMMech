  evidence:
  - source_ref: lu2012
    supports: support
    explanation: 'Figures 1-2 and Methods support sustained cell growth and iron cycling in the illuminated, rutile-containing circuit. Dark and rutile-free comparisons also grow initially using medium iron; the illuminated rutile arm continues growing later. Figure 2b reports a positive association of net cell growth with transferred charge, without identifying a molecular electron-transfer pathway. Figure 4 shows a wavelength-dependent response and an intensity response that is not monotonic: growth rises between 2 and 8 mW/cm2 at 420 nm, then falls at 16 mW/cm2. These observations support the conditional reactor association, not a universal growth benefit of rutile.'
  - source_ref: lu2012
    supports: partial
    explanation: Figure 2 labels the comparison rutile-free and open circuit, whereas Methods list a mineral-free anode without explicitly specifying its circuit state. Separate effects of removing mineral and opening the circuit therefore cannot be cleanly assigned from this arm. Its caption's about-fivefold growth statement lacks a specified time-point denominator and is not adopted as a quantitative enhancement factor. The no-cell control additionally replaces ferrous sulfate with 6.1 g/L ferric chloride, so it is not a same-initial-iron-speciation sterile counterpart. Supplementary Figure S2 shows additional rutile-free and dark cell-free curves, but its plotted axis says Fe(III) although the accompanying reduction experiment is discussed in terms of Fe(II) generation. These source limits prevent treating all control curves as interchangeable assays.
  - source_ref: lu2012
    supports: partial
    explanation: The Results' 2.1 micrograms/L soluble Ti(IV) value is calculated from solubility assumptions, not a measured titanium-release endpoint. Photon-to-biomass efficiencies are model-based estimates using assumed biomass and energy conversions, not measured titanium recovery. The supplementary calculation contains conflicting oxidation/reduction wording, although its displayed equation does multiply the oxygen-consumption rate by 60 h; no missing time conversion is inferred. Figure 4 and the supplement also differ in their current-density area/unit descriptions. No numerical conversion efficiency or mineral extraction yield is adopted here. The separate sphalerite, goethite, A. faecalis and electrically biased soil-community experiments are not pooled with this rutile/A. ferrooxidans arm.
