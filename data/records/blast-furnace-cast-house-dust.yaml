  title: Frueholz, Habermaier, Spiess, Birklbauer, Guebitz and Haberbauer (2025). Zinc extraction from cast-house dust using the chemolithotrophic microorganism Acidithiobacillus thiooxidans. Biochemical Engineering Journal 222:109859. DOI 10.1016/j.bej.2025.109859; online 8 July 2025, October issue. Methods 2.1-2.7, Results 3.1-3.5, Tables 1-3 and Figures 1-11.
  url: https://doi.org/10.1016/j.bej.2025.109859
