mechanisms:
- id: putida_pyromorphite_remobilization
  name: Culture-enhanced lead release from synthetic pyromorphite
  process: bioleaching
  description: Growing Pseudomonas putida IBPRS KKP 1136 cultures increased filtered-solution Pb relative to uninoculated controls during dissolution of synthetic pyromorphite. The effect was greater when the mineral was the only added phosphate source. Nutrient scavenging, metabolites and cell-associated binding are candidate contributors; the experiment does not identify a unique dissolution pathway. This laboratory remobilization observation is not an isolated-metal recovery process or proof of a field remediation outcome.
  context: 'Topolska et al. E.II: 0.05 g synthetic pyromorphite in 100 mL medium in 500 mL flasks, run in triplicate for 305 h at 21 +/- 1 degrees Celsius and 100 rpm. XRD and SEM-EDS characterized the starting mineral; wet chemical analysis gave Pb5.09(PO4)2.96Cl. Mineral portions were heated at 180 degrees Celsius for 3 h before use. Mid-log cells grown to OD600 0.8 were pelleted, resuspended in the experimental solution and inoculated 1:100. The paper identifies the strain by earlier numerical taxonomy; the linked species identifier does not independently verify that strain assignment. MP+ contained 0.5 g/L K2HPO4, disodium succinate, glycerol, salts and FeEDTA; MP- omitted K2HPO4. The source reports FeEDTA as 30 mM, an unusual medium specification retained as reported rather than silently corrected. Initial pH was about 7.3; biotic pH rose toward 9, while abiotic pH stayed near its initial value. Controls included uninoculated mineral suspensions, growth without mineral and chlorapatite
    comparisons. ICP-MS measured total Pb and P after centrifugation and 0.2 micrometre polycarbonate filtration; a separate acid-digestion comparison assessed cell-associated Pb. Feed was a synthetic mineral, not a contaminated soil or industrial ore.'
