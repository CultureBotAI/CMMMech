  summary: Across the 668-record corpus, 13 records (chromium.yaml, electrical-steel.yaml, hafnium.yaml,
    manganese.yaml, praseodymium.yaml, rare-earth-element-commodities.yaml, scandium.yaml, selenium.yaml,
