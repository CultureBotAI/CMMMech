id: cmmmech:akaganeite
name: Akaganeite
material_kind: mineral
description: Akaganeite is a distinct iron oxyhydroxide mineral species, listed with formula (Fe(III),Ni(II))8(OH,O)16Cl1.25·nH2O,
  renamed status (Rn), and IMA number 1962-004 in the September 2026 IMA master list. The experimental
  abbreviation beta-FeOOH identifies the synthetic phase assignment used by the study; it does
  not establish the ideal IMA composition or nickel content of that preparation. This record is
  separate from iron element, other iron oxyhydroxide species, iron-ore commodities, and mixed
  waste feeds. No constituent criticality designation is inherited.
