mechanisms:
- id: bacterial_column_phosphorus_mobilization
  name: Culture-associated phosphorus elution from bone-amended soil columns
  process: bioleaching
  description: Bacillus megaterium PCM 1855, currently named Priestia megaterium, was associated with greater reported phosphorus elution from soil columns amended with 5% or 10% fish-bone material. The 1% arm showed no clear bacterial advantage in the source interpretation. Inoculum also supplied phosphorus and nutrients, so treatment-associated elution is not an isolated microbial contribution or a fish-bone-specific recovery yield.
  context: The source describes 30 mL glass columns containing 10 g total soil and ground bone feed, at nominal 1%, 5% or 10% bone by mass. Inoculated columns received 10 mL logarithmic-phase culture; uninoculated comparators received 10 mL distilled water. Table 1 assigns an additional 6.08 mg P2O5-equivalent phosphorus to the bacterial suspension and also counts phosphorus already present in soil. The culture medium contained glucose, ammonium sulfate, NaCl, MgSO4, KCl, MnSO4, FeSO4 and yeast extract. Inoculum preparation was at 34 degrees C and 120 rpm; these are not verified column-incubation conditions. Water was applied from above, with four nominal 3 mL eluent collections per day, followed by paper filtration and colorimetric vanadophosphomolybdate assay expressed as P2O5. The tenfold-medium follow-up was performed on poultry bones, not fish bones. Methods state 28 days, whereas Figures 2-3 and crossing-time discussions use minutes; exact elapsed time and rates are unresolved. Soil
    provenance, sterilization, column temperature and independent biological replication are not specified. No sterile-medium-matched or pH-matched control is described.
  microbial: true
  organisms:
  - id: NCBITaxon:1404
    label: Priestia megaterium
  evidence:
  - source_ref: wyciszkiewicz_2017_columns
    supports: support
    explanation: Sections 2.1-2.4 and 3.1, Tables 1-2 and Figure 2B establish the feed and reported elution comparison. At nominal 10% fish bone, Figure 2B and Table 2 report 37.05 versus 17.3 mg P2O5-equivalent phosphorus removed in inoculated and uninoculated arms; the figure establishes the amount unit omitted from Table 2. The 5% comparison is also higher in the inoculated arm. These are total-column elution amounts, not isolated product masses or phosphorus attributable solely to bone.
  - source_ref: wyciszkiewicz_2017_columns
    supports: partial
    explanation: Section 3.1 explicitly interprets the parallel 1% fish-bone curves as a lack of bacterial effect, despite later calling this arm the best on the basis of a reported 99.9% solubilization factor. Table 1 gives unequal initial phosphorus inventories and contains fish-feed mass and phosphorus-entry inconsistencies. The source does not resolve phosphate from soil, inoculum and bone separately. The reported solubilization percentages and curve-crossing times are not adopted as recovery yields or rates. Soil sterility is not established by describing the comparator as without bacteria. The empirical pH model does not identify a particular organic acid or demonstrate an exclusive molecular mechanism.
  - source_ref: wyciszkiewicz_2017_columns
    supports: partial
    explanation: The 28-day Methods description conflicts with the minute axes of Figures 2-3. Replicate counts, raw replicate data and a complete sampling/mass-balance calculation are unavailable in the inspected article. Table 3 gives several dose-slope p-values above 0.05 despite broad significance wording, and Table 4 labels some fitted maxima below its minima. No universal statistically demonstrated dose effect, fitted kinetic constant, agricultural efficacy, fertilizer safety or industrial deployment is inferred from this column study.
  - source_ref: ncbi_1404
    supports: context_only
    explanation: The current authority resolves Priestia megaterium and the historical Bacillus megaterium synonym. PCM 1855 provenance is reported by the study as the Polish Collection of Microorganisms; the species identifier does not independently authenticate that culture or establish a genome mapping.
- id: acidophile_broth_phosphorus_mobilization
  name: Acidophile-culture-associated phosphorus mobilization in bone-containing broth
  process: bioleaching
  description: In acidophile-inoculated flasks containing ground fish-bone feed, liquid-phase phosphorus increased while pH fell. Higher nominal feed doses increased reported liquid concentrations but reduced fitted fractional solubilization. Sulfuric-acid-mediated dissolution is proposed; added acid and phosphate plus the absence of a matched abiotic control prevent isolation of microbial necessity.
  context: The source-designated living Acidithiobacillus ferrooxidans F7-01 was reported to have been isolated from the Iron Bridge tailings impoundment, Poland. A 10% v/v inoculum of 72-hour culture was used in 9K medium containing 44.2 g/L FeSO4.7H2O, 0.8 g/L elemental sulfur and 0.5 g/L K2HPO4, with initial pH adjusted to 2.5 using H2SO4. Methods describe a seven-day precursor cultivation at 30 degrees C, followed by addition of ground bones to 250 mL medium and 12-day shaken cultivation at 34 degrees C; shaker speed and filtration cutoff are not specified. Bone doses are given as 2, 4, 10 and 20 g/L, while the separate phosphorite dose descriptions conflict between Methods and result tables. Samples are reported as triplicate means. Permeates underwent nitric-acid digestion and ICP-OES, with elemental phosphorus expressed as P2O5 equivalent; this does not establish dissolved orthophosphate speciation. All reported feed-dose arms were inoculated; no matched sterile, no-cell or acid-only
    arm is presented. The precursor timeline is also internally inconsistent between Methods and Figure 3.
  microbial: true
