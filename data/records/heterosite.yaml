mechanisms:
- id: abiotic-preparation-and-lithiation-of-synthetic-heterosite
  name: Abiotic delithiation and lithium uptake by a synthetic heterosite-structure sorbent
  process: redox_transformation
  microbial: false
  description: Persulfate treatment removed lithium from commercial LiFePO4 to form a source-assigned
    heterosite-structure FePO4 solid. In separate experiments, thiosulfate-assisted lithiation loaded
    this synthetic solid with lithium from LiCl solutions, iron-depleted Bruchsal geothermal brine, or
    a synthetic Neustadt-Glewe-like brine. Diffraction and chemical measurements support structural conversion
    and lithium uptake, but the products contain residual lithium, substitutions and secondary phases.
    Reductive intercalation is the authors' interpretation; uptake is not evidence of an isolated pure
    lithium product.
  context: 'Reich2024 used commercial carbon-coated IBUvolt LFP400. Delithiation screening used approximately
    1 g in 200 mL at nominal 25 degrees C, with water, NaCl, HCl and oxidant comparisons; reaction times
    differ among screening arms. Selected kinetics used 0.1 M Na2S2O8. Subsequent lithiation generally
    used 0.5 M Na2S2O3: pure LiCl experiments had nominal 200 mg/L Li and temperatures 25, 60 or 80 degrees
    C, while brine experiments used a nominal 60 degrees C setting. Natural Bruchsal feed had been pretreated
    to remove iron; the second brine was synthetic. Table 2 reports about 155-158 mg/L Li for Bruchsal
    versus approximately 11 mg/L for the synthetic brine, while figure labels round these to 160 and 10.
    Kinetic experiments used roughly 5 g sorbent/L over one minute to two weeks; isotherms varied sorbent
    loading and used three hours for Bruchsal and four hours for synthetic brine. The Bruchsal suspension
    was stirred, the synthetic one shaken. The workbook separately records nominal treatment temperature
    and temperatures during pH measurements; these are not asserted to be identical. Blanks and analytical
    quality controls were included, but independent experimental replication is not clearly established.
    No organisms were used.'
  evidence:
  - source_ref: eventoff1972
    supports: context_only
    explanation: The natural-crystal experiment on pages 45-49, Tables 2-4 and Figure 1 grounds heterosite
      independently of the engineered sorbent. It used Mn:Fe approximately 35:65 and found the lithium
      site essentially vacant. This is structural identity evidence, not a geothermal lithium-extraction
      experiment.
  - source_ref: reich2024
    supports: support
    explanation: Table 1 and Figures 1-4, pages 4-8, characterize the commercial precursor and delithiated
      solid. Lithium decreases from 43 to 1.7 mg/g in the two bulk analyses. The authors assign orthorhombic
      triphylite and heterosite structures, respectively. Residual Li, nonideal Fe/P chemistry, shifted
      diffraction peaks and an unidentified reflection near 64.35 degrees 2-theta preclude treating the
      latter as a demonstrated phase-pure ideal FePO4 endmember.
  - source_ref: reich2024
    supports: support
    explanation: Sections 3.2-3.4 and Figures 5-11 separate preparation, solution and brine arms. Selected
      0.1 M persulfate kinetics released approximately 42-43 mg Li per gram of precursor within one minute,
      while water released approximately 1-3 mg/g in the screening arms. For natural Bruchsal brine, the
      kinetic series approached 23 mg Li/g prepared sorbent after three hours; its separate isotherm gave
      approximately 24-27 mg/g at 2.5-5 g/L. The synthetic low-Li brine gave approximately 1.0 mg/g in
      the kinetic arm and 1.3 mg/g at 2 g/L in its separate four-hour isotherm. These are source-reported
      sorbent-normalized loadings, not percentages of purified lithium recovered.
  - source_ref: reich2024
    supports: partial
    explanation: 'Figure 8 and section 3.3 show a conditional null: seven-day pure-LiCl experiments at
      nominal 60 and 80 degrees C did not show lithium uptake, unlike the 25-degree arm. Thiosulfate instability
      and acidification confound a simple temperature-only interpretation. Figures 1-2 and 9-12 show secondary
      gypsum/sulfur formation, sodium and sulfur accumulation, and increasing Fe/P release during prolonged
      reaction. Performance in the early brine experiments is therefore not proof of long-term structural
      stability, universal selectivity or repeated industrial cycling.'
  - source_ref: reich2024_si
    supports: partial
    explanation: The workbook distinguishes fluid-OES and solid-digestion measurements, so a single analytical
      basis is not imposed on all reported loadings. Sheets Fig. 9a, Fig. 10 and Fig. 9b, Fig. 10 label
      kinetic lithium as fluid OES; sheets Fig. 10, Fig. 11a+b and Fig. 10, Fig. 11c+d label isotherm
      lithium as digestion OES. Bruchsal isotherm cells K9/K10 report about 26.76/23.68 mg/g, while synthetic-brine
      cell M11 reports about 1.317 mg/g. Some high-loading residual-fluid cells are encoded as zero or
      less than LOQ; they are not accepted as proof of exactly zero residual lithium or a closed recovery
      balance. Blank rows with zero sorbent mass also carry load-labelled entries whose normalization
      is not explained. Published static cell values were inspected without inventing missing formulas
      or silently replacing the source calculations.
