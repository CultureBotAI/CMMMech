mechanisms:
  - id: mr1_chromate_reduction
    name: MtrC/OmcA-associated reduction of Cr(VI) by resting MR-1 cells
    process: redox_transformation
    description: >-
      Resting Shewanella oneidensis MR-1 cells removed aqueous Cr(VI)
      supplied as potassium chromate. Deletion comparisons and purified
      protein electrocatalysis support contributions from the outer-membrane
      cytochromes MtrC and OmcA to reduction. Residual activity in the double
      mutant excludes an exclusive dependence on these two proteins.
      Chromium-bearing precipitates were observed, but their assignment
      to Cr(III) was inferred from earlier studies, not independently
      established by oxidation-state spectroscopy in this experiment.
    context: >-
      Laboratory resting-cell assays used wild-type MR-1 and its delta-mtrC,
      delta-omcA and double-deletion derivatives. Cells were grown aerobically
      for 16 h in dextrose-free tryptic soy broth at 30 degrees C, harvested
      and washed once in 30 mM sodium bicarbonate buffer reported at pH 8.
      Sealed, gas-purged assays contained 0.2 mM K2CrO4, 10 mM sodium lactate
      and 2 x 10^8 cells/mL at 30 degrees C and 25 rpm; the paper reports
      CO2:N2 of 80:20 without a post-purge pH measurement. Soluble Cr(VI)
      was measured by diphenylcarbazide, with equal-density heat-killed
      wild-type controls and triplicate measurements. Kinetic Figure 1
      covers 24 h; selected microscopy observations extend to 120 h.
      Separate purified-protein films were tested electrochemically in
      pH 7.4 phosphate-buffered saline at the reported 273 K, with a
      30 mV/s scan, 3000 rpm electrode rotation and analysis at -0.33 V
      versus the standard hydrogen electrode. Those electrode conditions
      are not whole-cell cultivation conditions.
    microbial: true
    organisms:
      - id: NCBITaxon:211586
        label: Shewanella oneidensis MR-1
    evidence:
      - source_ref: belchik_2011
        supports: support
        explanation: >-
          Methods (Cr(VI) reduction), Results (In vivo Cr(VI) reduction)
          and Figure 1 show lower Cr(VI)-loss rates in the deletion
          strains than in wild type and no observed reduction in the
          heat-killed control. Results (In vitro Cr(VI) reduction),
          Figures 4-5 and Table 1 report chromate-dependent catalytic
          currents from purified MtrC and OmcA films, distinguishable
          from bare-electrode responses. Together these support a
          cytochrome contribution, beyond a gene-expression correlation.
      - source_ref: belchik_2011
        supports: partial
        explanation: >-
          All deletion strains retained activity; the double mutant's
          reported 4 h rate was 31.1% of wild type. Reduction remained
          incomplete, with little further change reported from 24 to
          120 h (later kinetics not shown). Figures 2-3 locate electron-dense
          material and detect elemental Cr in selected particles; EDX
          does not establish valence or identify every dark inclusion.
          Figure 2C is labeled delta-mtrC in the image but delta-omcA
          in its caption, preventing an unambiguous assignment of that
          panel to one single mutant. The study establishes neither a
          recovered chromium-product mass balance nor industrial deployment.
