- id: yokoyama_2006
  title: Yokoyama, Tamura, Hatta, Nemoto, Watanabe and Yamada. Synthesis and characterization of Zn-substituted
    saponite (sauconite). Clay Science 13(3):75-80, issue labelled 2006. Complete six-page J-STAGE original,
    Figures 1-6 and Tables 1-3. The original prints acceptance on 6 April 2007, later than its issue year;
