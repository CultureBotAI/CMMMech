id: cmmmech:azurite
name: Azurite
material_kind: mineral
description: Azurite is the monoclinic copper hydroxycarbonate mineral Cu3(CO3)2(OH)2, distinct from malachite,
  calcite, generic copper carbonate and elemental copper. The September 2026 IMA list gives grandfathered
  status G and original-description year 1824. A laboratory bacterial study assigns a minor diffraction
  feature in a mixed precipitate to azurite; this does not establish a pure azurite product or a phase-specific
  copper recovery yield. No criticality designation is inherited from copper.
