id: cmmmech:baricite
name: Barićite
material_kind: mineral
description: Barićite is a hydrated magnesium phosphate mineral species. The September 2026 IMA list gives the approved formula Mg3(PO4)2(H2O)8 and approval number 1975-027. It remains distinct from bobierrite, elemental magnesium or phosphorus, and mixed recovered precipitates. The historical experimental source uses baricite and a mixed (Mg,Fe) formula; its phase assignment is retained as reported, not a measurement proving the current ideal composition. No criticality designation is inherited from constituents.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Pages 1-2 definitions and terms; barićite page 20, bobierrite page 27. Retained official original re-inspected on 14 October 2026.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-14'
- id: han_2016
  title: Han et al. (2016). Mineral formation during bacterial sulfate reduction in the presence of different electron donors and carbon sources. Chemical Geology 435:49-59. DOI 10.1016/j.chemgeo.2016.04.022. Complete ScholarWorks author manuscript, Sections 2-4, Tables 1-3, Figures 1-3; six publisher supplements (SI Tables 1-3 and Figures 1-3).
  url: https://doi.org/10.1016/j.chemgeo.2016.04.022
  accessed_on: '2026-10-14'
- id: ncbi_g20
  title: NCBI Taxonomy 207559, Oleidesulfovibrio alaskensis G20. Live taxonomy XML verifies strain rank, parent species 58180 and equivalent name Desulfovibrio alaskensis G20 on 14 October 2026.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=207559&mode=Info
  accessed_on: '2026-10-14'
- id: rivadeneyra_2014
  title: Rivadeneyra et al. (2014). Precipitation of Phosphate Minerals by Microorganisms Isolated from a Fixed-Biofilm Reactor Used for the Treatment of Domestic Wastewater. International Journal of Environmental Research and Public Health 11:3689-3704. DOI 10.3390/ijerph110403689; Sections 2.3-2.8, Tables 2-3 and Figures 4-5. Complete publisher PDF and PMC4025044 XML inspected.
  url: https://doi.org/10.3390/ijerph110403689
  accessed_on: '2026-10-14'
mechanisms:
- id: g20_baricite_assignment
  name: Barićite-assigned mixed precipitates in hydrogen-fed sulfate-reducing cultures
  process: biomineralization
  description: Hydrogen-fed G20 cultures in acetate-containing, nutrient-enriched marine pore-water medium formed recovered solids assigned by XRD to barićite, a magnesium-phosphate decahydrate, calcite and elemental sulfur. Sterile counterparts contained mainly amorphous material and calcite. The evidence supports culture-associated phase selection in this laboratory system, without demonstrating enhanced net magnesium removal or a unique molecular nucleation mechanism.
  context: The living strain is called Desulfovibrio alaskensis G20 in Han et al.; NCBI now resolves it as Oleidesulfovibrio alaskensis G20. Each 120-mL serum bottle contained 100 mL synthetic medium and an iron finishing nail, with a one-hour sterile hydrogen purge and butyl-rubber closure. Two drops of fresh G20 culture were added per inoculated bottle; drop volume and cell density were not specified. Duplicate inoculated and duplicate uninoculated bottles were incubated anaerobically at 25 degrees C for 10 months. Main Table 1 gives acetate 47 mM, sulfate 22.3 mM, magnesium 50.7 mM, calcium 8.22 mM, ammonium 10.58 mM and phosphate 0.89 mM, with 7.2 mM NaHCO3 and 1 mL/L Wolf vitamin solution. Magnesium was supplied as MgCl2.6H2O and phosphate as Na2HPO4. Initial pH was adjusted to give 7.5 after autoclaving; endpoint pH was 8.3 in both acetate cultures versus 7.7 and 7.9 in sterile counterparts. Vitamins were filter-sterilized and added after cooling. Solids were filtered, dried overnight
    at 30 degrees C in nitrogen and analyzed within a week.
