id: cmmmech:manganokhomyakovite
name: Manganokhomyakovite
material_kind: mineral
description: >-
  Manganokhomyakovite (IMA 1998-043) is an IMA-accepted sodium-strontium-calcium-manganese-zirconium-tungsten
  cyclosilicate mineral of the eudialyte group, the Mn-dominant analogue of
  khomyakovite, with IMA September 2026 Master List formula
  Na12Sr3Ca6Mn3Zr3W(Si25O73)(O,OH,H2O)3(Cl,OH)2 and empirical formula
  (Na11.51K0.30Ca0.25Sr0.04REE0.07)Sigma12.17Sr3Ca6(Mn2.04Fe1.23)Sigma3.27(Zr2.91Hf0.03Ti0.01)Sigma2.95(W0.66Nb0.41Ta0.01)Sigma1.08(Si24.60Al0.01)Sigma24.61O73(O,OH,H2O)Sigma3.70(OH1.19Cl0.81)Sigma2.
  Described by Johnsen et al. (1999) from miarolitic cavities in
  nepheline syenite at the Demix quarry (now part of the Poudrette quarry),
  Mont Saint-Hilaire, Rouville County, Quebec, Canada (cotypes CMNMC 81558 and
  81559). WDS electron microprobe analysis (4-analysis mean, p. 896) gives Na2O
  10.37, K2O 0.41, CaO 10.2, MnO 4.21, FeO 2.58, SrO 9.17, Al2O3 0.02, La2O3
  0.12, Ce2O3 0.2, SiO2 42.98, TiO2 0.02, ZrO2 10.43, HfO2 0.17, Nb2O5 1.58,
  Ta2O5 0.03, WO3 4.48, Cl 0.84, stoichiometric H2O 0.83, -O=Cl 0.19, total
  98.45 wt%. Trigonal (space group R3m), with a = 14.282(3) Å, c = 30.12(1) Å,
  V = 5320(2) Å3, Z = 3, Dmeas = 3.13(3) g/cm3, Dcalc = 3.17 g/cm3, Mohs
  hardness 5–6, and uniaxial (–) optics with omega = 1.629(1) and epsilon =
  1.626(2).
