  evidence:
  - source_ref: kane_2026_bes
    supports: support
    explanation: FGDC process steps 1-4, T2, T3 and T6 support the separation observation. T3 reports 44.1 mg/kg V at Vbrr_0 and 34 mg/kg at BESV.brr_END. T6 reports vanadium in working-electrode extracts including Vbrr_WE. The concentrations are mg/kg, not an assumed mg/L conversion. Aqueous depletion and extracted electrode-associated amounts are not a mass-balanced recovery percentage or product purity.
  - source_ref: kane_2026_bes
    supports: partial
    explanation: T3 abiotic V decreases from 19.1 mg/kg at BESVarr_0 to 12.2 mg/kg at BESVarr_END. T2 gives different pH histories and durations; the unequal starting concentrations also prevent treating endpoint differences as a controlled microbial-effect estimate. T6 separates working-electrode, holder and reference-frit extracts; these must not be pooled into an unsupported microbial recovery yield.
  - source_ref: kane_2026_bes
    supports: context_only
    explanation: Process step 5 and T7_UV_Vis.csv describe qualitative solution speciation work after 67 days of anaerobic storage for the biotic sample and 76 days for the abiotic sample. No immediate endpoint oxidation-state assignment is made here. T9_SEM.pdf page 7 is labelled solids from V phosphate-buffered culturing medium, so it does not establish the mineral identity of the V BES electrode product.
