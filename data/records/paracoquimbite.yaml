mechanisms:
- id: abiotic-acid-solution-crystallization
  name: Slow crystallization from an acidified ferric-sulfate solution
  process: other
  microbial: false
  description: >-
    Ackermann et al. prepared a synthetic paracoquimbite sample by
    aging an acidified ferric-sulfate solution in an open vial for
    one year, filtering the white powdery product and drying it
    at room temperature. Laboratory and synchrotron powder diffraction
    supported the phase assignment. The work reports material
    synthesis and characterization, without a product mass balance
    or quantified iron recovery from a natural or waste feed.
  context: >-
    Materials and Methods, printed page 1621: 2.93 g of analytical-grade,
    X-ray-amorphous ferric sulfate was dissolved after mixing and cooling
    3.1 mL water with 0.526 mL of 96% sulfuric acid. The solution
    aged at room temperature and 30-40% relative humidity; abundant
    mother liquor remained at filtration. Exact room temperature,
    solution pH, replicate synthesis count and product yield are
    not supplied. The authors caution that excess acid can produce
    persistent particles likely to be rhomboclase; complete initial
    ferric-sulfate dissolution was required. No organism or biological
    comparison was part of this preparation.
  evidence:
  - source_ref: ackermann2009
    supports: support
    explanation: >-
      Methods on page 1621 describe the recipe, year-long aging and
      filtration. Figure 1b on page 1622 shows the product crystals.
      The paracoquimbite structure was refined only from synchrotron
      powder data, reported as R-3 in Table 4 on page 1625. The
      paper's electron-microprobe measurements and single-crystal
      experiment are specifically described for kornelite; they are
      not paracoquimbite measurements despite the broad abstract wording.
  - source_ref: ackermann2009
    supports: partial
    explanation: >-
      Pages 1622-1624 distinguish uncertain thermogravimetric hydration
      estimates, 9.02 versus 9.38 waters per Fe2(SO4)3 depending on
      the plateau endpoint, from the adopted nine-water diffraction
      model. Hydrogen positions were not determined experimentally
      for paracoquimbite in this work. The supplementary deposit
      could not be acquired in this curation pass, so detailed
      coordinates and raw refinement reproducibility remain unchecked.
  - source_ref: ackermann2009
    supports: partial
    explanation: >-
      Pages 1626-1627 and Figure 6 explicitly show that the study's
      calculated phase-boundary positions depend strongly on estimated
      entropies. The synthesis does not establish a general equilibrium
      stability field, and those illustrative diagrams are not accepted
      here as measured boundaries. The older polytype description
      is interpreted using the later IMA species redefinition.
