- id: ncbi_kudriavzevii
  title: NCBI Taxonomy 4909, Pichia kudriavzevii, species; Issatchenkia orientalis is listed as a heterotypic synonym. This species identifier does not identify engineered strain JL04 or authenticate the experimental stock.
