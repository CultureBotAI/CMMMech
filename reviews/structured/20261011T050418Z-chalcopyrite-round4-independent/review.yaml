limitations:
- Concentrate purity is author-reported from elemental digestion and does not establish
  phase-pure chalcopyrite. No new mineral-phase analysis was performed.
- Christel supplement acquisition remained unavailable in the curator dossier. Reviewer
  used main methods/results, captions, full XML and Figures 1–2; no supplement-only
  measurement or transcriptome-derived causal claim accepted.
- Inoculum totals, variable endpoints, possible contamination and the repeated AS
  redox result prevent universal rate or ORP claims. No recovered metal product, raw-curve
  recalculation or industrial deployment established.
- This mineral record and copper.yaml reuse one experimental study. This review covers
  the new mineral record, not a new scientific review of the copper record.
- Source/correction search is bounded. Newer studies remain unverified extension leads;
