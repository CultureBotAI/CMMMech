mechanisms:
- id: dsm9463_culture_associated_v_leaching
  name: Loading-dependent culture-associated vanadium mobilization
  process: bioleaching
  microbial: true
  description: >-
    Living Acidithiobacillus thiooxidans DSM 9463 culture with elemental sulfur
    was associated with increased filtered-liquid vanadium at low catalyst
    loading, together with acidification and increasing sulfate. Higher-loading
    experiments lacked the same advantage over uninoculated controls. The
    evidence supports a conditional laboratory solubilization observation,
    without establishing direct enzymatic vanadium reduction, isolated vanadium
    recovery or industrial deployment.
  context: >-
    Mikoda et al. (2020) studied actual spent catalyst from a copper-smelter
    sulfuric-acid unit: approximately 10-mm granules were comminuted and sieved.
    Main Methods name 100- and 200-micrometre sieves, whereas supplementary
    Figure S1 names a 250-micrometre sieve; the fraction used for each bioleaching
    arm is not explicitly assigned. Table 3 reports 65.5 wt% SiO2 and 5.50 wt%
    V2O5 on an oxide-composition basis, not pure vanadium oxide or a universal
    feed composition. Culture DSM 9463 was supplied by DSMZ, pregrown in mineral
    medium with 1% w/v sulfur to reported pH 1.7, and added at 2% v/v. Assays
    used fresh mineral medium initially adjusted to pH 2.5 with sulfuric acid,
    2% w/v added elemental sulfur, 28 degrees C and 100 rpm. Materials were
    autoclaved at 121 degrees C for 15 minutes. The paper names 50-cm3 flasks
    but does not clearly specify working liquid volume. Pulp densities were
    1, 2, 5, 10 and 20%, with at least duplicate biotic and uninoculated batches
    sampled on days 1, 7, 14, 21 and 28. Pulp-density percentages are retained
    as source labels rather than silently assigned an unstated basis. Liquid
    aliquots were filtered at 0.22 micrometres, diluted and acidified for ICP-MS
    total-element V analysis; the stated quantification limit was 0.001 mg/L.
    No pH-trajectory-matched sterile acid control was reported.
  organisms:
  - id: NCBITaxon:930
    label: Acidithiobacillus thiooxidans
  evidence:
  - source_ref: mikoda_2020
    supports: support
    explanation: >-
      Results 3.2, Figure 7 and Perspectives 3.3 assign day-21 liquid V release
      of 93% to 1% pulp density and 85.5% to 2%, versus at most 17% in the
      corresponding uninoculated series. These source percentages normalize
      filtered-liquid V to the initial feed V inventory; they are not isolated
      product yields. Lower culture pH and increasing sulfate in Figure 9
      support culture-associated acidification, without separating the effects
      of cells from their evolving solution chemistry.
  - source_ref: mikoda_2020
    supports: partial
    explanation: >-
      The abstract instead attributes 93% to 2% pulp density. Results 3.2 also
      labels both day-28 values, 80% and 74%, as 1%, while Figure 7 distinguishes
      the two arms. These inconsistencies remain unresolved. The low-loading
      liquid V inventory declined after day 21. At 5-20% pulp density, Figure 8
      shows decreasing liquid V with controls often exceeding inoculated arms;
      no universal microbial advantage or monotonic extraction is established.
      Oxygen-transfer limitation and precipitation are proposed explanations,
      not independently isolated causes.
  - source_ref: mikoda_2020_supplement
    supports: partial
    explanation: >-
      Figures S2-S3 show a qualitative sulfur-settling transfer assay and
      changing solution color. These are activity/speciation clues, not cell
      counts, quantified survival, or direct measurement of V oxidation state.
      Figure S1's sieve description conflicts with main Methods. The observed
      colors cannot independently establish a microbial V(V)-reduction pathway.
  - source_ref: mikoda_2020
    supports: partial
    explanation: >-
      Figures 1-2 and Table 3 describe mixed feed and residual phases;
      disappearance of XRD peaks and lower residual-solid V concentration do
      not supply residue mass or a complete V balance. Color and the pH/Eh
      comparison in Figure 6 do not directly identify dissolved V species.
      Kinetic fits use selected incomplete time series to improve R-squared
      values (Methods 2.5), so they do not demonstrate a unique rate-controlling
      mechanism. Separate reagent-grade citric-acid leaching is abiotic, under
      different temperature, duration and vessel conditions; it is not evidence
      that DSM 9463 produced citrate.
  - source_ref: mikoda_residues
    supports: context_only
    explanation: >-
      This related same-group study explicitly follows the earlier work and
      repeats its raw/residue oxide compositions. Its 2%-pulp-density 93% claim
      does not resolve the earlier arm conflict or establish independent
      replication. The approximately 96% statement compares solid V
      concentrations, without residue-mass accounting for a recovered yield.
      The separate SPLP assay (1 g residue, 20 mL pH-4.2 solution, 18 hours)
      reports bioleached-residue V and Al of 6.4 and 4.8 mg/L in Table 3;
      residual leachability remains. These observations do not demonstrate a
      metal-free or universally safe residue, a regulatory determination,
      validated concrete use, or a recovered vanadium product.
