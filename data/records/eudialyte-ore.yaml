  evidence:
  - source_ref: hunter2020
    supports: support
    explanation: Sections 4.5.2-4.5.4 and Figures 4.5.2.1, 4.5.3.1 and 4.5.3.4-4.5.4.1 show acidification, an iron-assay shift and enhanced dissolved Si, Zr and rare earths in the inoculated ore treatment. In the ore time course, inoculated solutions approach pH 2.2 while the uninoculated ore comparator stays roughly pH 2.6-2.8. Figure 4.5.4.1 shows greater Y, La, Ce and Nd concentrations with inoculation than without it, but substantially higher concentrations under either strong-acid treatment. The controls have different pH trajectories and therefore do not establish a pH-independent microbial effect.
  - source_ref: hunter2020
    supports: partial
    explanation: Exact kinetic and mechanistic quantification is limited by internal source problems. Chapter 4 describes ferrozine measurements at 562 nm, whereas Section 7.4.9 specifies 568 nm. The printed calibration, equations and claim of complete iron oxidation are not independently recalibrated here. Section 4.5.1's FeSO4 stock molarity does not agree with its stated mass and volume. The text's Si:Zr comparison contrasts mass-concentration slopes with atomic stoichiometry; it cannot establish preferential adsorption from that ratio. Adsorption of Si onto iron precipitates remains an explanation, not a demonstrated ore-specific mechanism. No gel was observed at this low solids loading, which does not establish behavior at commercial pulp densities.
  - source_ref: hunter2020
    supports: context_only
    explanation: Section 4.5.5 and Figures 4.5.5.1-4.5.5.2 describe a separate chemical solvent-extraction step. A model solution and the actual filtered bioleachate are different experiments. The actual leachate was concentrated fivefold under vacuum, adjusted to 5.0 M NaNO3 and 0.1 M HNO3 at pH 1.40, and contacted with 0.1 M IL0 or the secondary amido-ammonium extractant 2AA in toluene. This procedure contradicts the abstract and conclusions' unqualified no-pH-adjustment wording. Reported solvent-extraction percentages are not ore recovery yields; Section 7.2's printed percentage equations also leave the concentration denominator ambiguous. Low concentrations of minor rare earths limit selectivity comparisons. Neither a purified product yield nor a complete zirconium separation is demonstrated by the retained ore experiment.
  - source_ref: hunter2020_supporting
    supports: context_only
    explanation: Archive member and text/workbook screening supplies provenance for the deposited computational supporting material. It does not repair the bioleaching organism discrepancy, supply an ore phase assay, or independently reproduce Chapter 4 curves.
