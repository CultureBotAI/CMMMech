id: cmmmech:gold-mine-tailings
name: Gold-mine tailings
material_kind: secondary_resource
description: Processing-derived residual material from gold production, distinct from unprocessed gold ore, elemental gold, individual mineral species and isolated rare-earth products. The curated experiment concerns one air-dried, sieved batch obtained from the Mouteh Gold Factory tailings dam. It supports qualified chemical pretreatment and culture-associated praseodymium, cerium and europium mobilization at laboratory scale; its composition and behavior do not define all gold-mine tailings. No criticality designation is inherited from constituents.
sources:
- id: fereydouni2025
  title: Fereydouni, H., Naseri, T. and Mousavi, S.M. (2025). Synergistic recovery of Pr, Eu, and Ce from gold mine tailings using bioleaching and oxalic acid pretreatment. Scientific Reports 15:4478. DOI 10.1038/s41598-025-88594-0; published 6 February 2025. Complete 12-page publisher article, Figures 1–7, Table 1 and Methods/Results/Conclusion inspected; no supplementary-file link identified in complete publisher HTML or PMC XML. Underlying data available from corresponding author on reasonable request.
  url: https://doi.org/10.1038/s41598-025-88594-0
  accessed_on: '2026-10-12'
- id: ncbi_thiooxidans
  title: 'NCBI Taxonomy 930: Acidithiobacillus thiooxidans, species; current official taxonomy XML inspected on 12 October 2026.'
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=930
  accessed_on: '2026-10-12'
mechanisms:
- id: oxalic_acid_pretreatment
  name: Chemical oxalic-acid pretreatment of a mixed gold-tailings feed
  process: other
  description: An abiotic oxalic-acid stage preceded the bacterial-culture assay and reportedly dissolved some iron while the three assayed rare-earth elements remained below detection in its filtrate. This is a chemical pretreatment observation, not microbial oxalate production, complete iron removal or isolated-metal recovery.
  context: 'Fereydouni et al. (2025), Methods and Conclusion: tailings were air dried and sieved through mesh 200 to less than 75 micrometres. The Conclusion and abstract specify 2 M oxalic acid, 90 degrees C and a liquid-to-solid ratio of 60 mL/g for 6 h; Methods independently specifies 500 rpm, 6 h, a heated flask sealed with foil and subsequent vacuum filtration, but omits the acid concentration, temperature and liquid-to-solid ratio. The bioleaching solid loading is not this chemical-stage ratio. Rinsing, drying and residual oxalate carryover into the subsequent culture stage are not detailed. Only one tailings batch was studied.'
  microbial: false
  evidence:
  - source_ref: fereydouni2025
    supports: support
    explanation: Methods Characteristics GMT (p. 2), Results Pretreatment with oxalic acid (p. 3) and Conclusion (p. 10) identify the processing waste and chemical stage. The authors report at most 20% iron dissolution and Pr, Ce and Eu below 0.01 mg/L in the oxalic-acid leachate. Below detection is not zero and does not by itself close a rare-earth mass balance or establish quantitative retention in the residue.
  - source_ref: fereydouni2025
    supports: partial
    explanation: Figure 3 and pp. 5–6 compare source-assigned quartz, clinochlore, muscovite, albite and gypsum peaks. Prose first says clinochlore and gypsum were removed, then narrows this to reduced peaks and explicitly disclaims complete contaminant removal. Figure 3 also labels hydrogen oxalate hydrate after pretreatment. These qualitative patterns do not quantify phase abundance, establish a particular rare-earth host or prove that iron removal alone caused subsequent extraction changes. Figures 4–6 provide FTIR/SEM/EDX context rather than a phase-specific dissolution balance.
- id: thiooxidans_culture_associated_ree_mobilization
  name: Sulfur-oxidizing culture-associated rare-earth mobilization after pretreatment
  process: bioleaching
  description: A living A. thiooxidans culture was used to condition sulfur-containing medium before addition of the mixed tailings. The paper reports higher dissolved Pr, Ce and Eu extraction endpoints for oxalic-acid-pretreated than untreated tailings. Acid generation is a plausible culture contribution, but omitted control data, incomplete loading information and inconsistent growth descriptions prevent a quantified microbial advantage, a unique molecular mechanism or a demonstrated synergistic interaction from being inferred.
  context: Methods pp. 2–3 attributes strain PTCC 1717 to IROST, Tehran; the species identifier is verified at NCBI but does not authenticate the experimental stock or strain. Growth medium is listed as elemental sulfur 5 g/L, (NH4)2SO4 2 g/L, K2HPO4.3H2O 0.25 g/L, MgSO4.7H2O 0.25 g/L and KCl 0.1 g/L. Propagation used 10% (v/v) inoculum at 30 degrees C and 140 rpm. The two-step assay separately specifies 100 mL medium in 250 mL flasks, 2% (v/v) inoculum described as 10^8 cells/mL, 30 degrees C, 140 rpm and seven days of leaching. Results chooses culture day 12 for tailings addition, whereas Methods calls the addition the end of logarithmic growth and Results/Conclusion describe its onset; no harmonized growth-stage interpretation is imposed. Bioleaching solids mass/pulp density, pretreatment-residue mass and assay-specific feed composition, filtration cutoff, replicate number and error-bar definition are not supplied in the inspected article. Hemocytometer counts are not viability or CFU
    measurements. Filtered liquor was analyzed by ICP-OES; water could be added to compensate evaporation.
  microbial: true
