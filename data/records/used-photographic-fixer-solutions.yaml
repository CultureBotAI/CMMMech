    description: Conditioned fixer diluted to nominal 100 mg Ag/L is pumped upward through 3 g of granulated C. cladosporioides strain 1 beads (10 cm x 1 cm ID column, 20 min retention) to sorb silver.
    evidence:
    - source_ref: pethkar2003
      supports: support
      explanation: Section 2.7 and Results pp. 858-859 describe packed-column biosorption of silver from conditioned fixer onto 3 g C. cladosporioides biomass beads.
    - source_ref: pethkar2003
      supports: partial
      explanation: Cumulative uptake is reported per gram biomass in Results versus per gram beads in Methods without specifying the proprietary granulation matrix fraction or testing an untreated-fixer column control.
  - source: cladosporioides_granulated_bead_silver_biosorption
    target: cyanide_eluted_electrowon_metallic_silver
    predicate: transforms_into
    relationship: Stage 3 abiotic alcoholic cyanide elution and electrowinning (0.8 V, 224 mA) yielding 127 mg metallic silver
    description: Sorbed silver is chemically eluted from the fungal beads with alkaline alcoholic cyanide (1% vs 10% ethanol discrepancy) and abiotically electrowon at 0.8 V and 224 mA to recover 127 mg metallic silver (70% reported overall recovery).
    evidence:
    - source_ref: pethkar2003
      supports: support
      explanation: Sections 2.5-2.7 and Results p. 859 report alcoholic cyanide elution and electrolysis at 0.8 V and 224 mA yielding 127 mg metallic silver (70% overall recovery).
    - source_ref: pethkar2003
      supports: partial
      explanation: Section 2.5 (1% ethanol) conflicts with Results (10% ethanol) on eluent composition, and metallic silver purity and a closed process mass balance are not reported.
