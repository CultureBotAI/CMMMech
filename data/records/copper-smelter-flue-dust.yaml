id: cmmmech:copper-smelter-flue-dust
name: Copper-smelter flue dust
material_kind: secondary_resource
description: Dry-collected particulate residue from copper smelting and converting, represented here by a blend of dust from reverberatory and converter furnaces at the Sarcheshmeh Copper Complex, Iran. One week's samples were mixed in the production ratio of three parts reverberatory dust to two parts converter dust. This processing-derived feed is distinct from furnace slag, natural copper minerals, copper anode slime and its downstream autoclave residue, and the wet copper-shale blast-furnace gas-scrubbing residue curated as Theisen sludge. The study reported 35.8 wt% total copper in the original blend and about 70% of particles finer than 80 micrometers; these are sample-specific assays, not a universal dust specification or recoverable reserve. Acid-preleached dust is an experimental preparation of this owner, not another material record. No criticality-list designation is inherited from copper or other constituents.
sources:
- id: bakhtiari2008
  title: Bakhtiari F, Atashi H, Zivdar M and Seyed Bagheri SA (2008). Continuous copper recovery from a smelter's dust in stirred tank reactors. International Journal of Mineral Processing 86(1–4):50–57. DOI 10.1016/j.minpro.2007.10.003; original available-online date 26 November 2007. Complete eight-page public author-copy text, Tables 1–4 and original publisher Figures 1–5; especially sections 2.1–2.3 and 3.1–3.2. Local PDF acquisition failed; the research dossier distinguishes web-read text from inspected original figures.
  url: https://doi.org/10.1016/j.minpro.2007.10.003
  accessed_on: '2026-10-12'
