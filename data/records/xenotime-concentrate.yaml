id: cmmmech:xenotime-concentrate
name: Xenotime concentrate
material_kind: primary_resource
description: A mixed natural mineral concentrate represented by the laboratory feed studied by He et al. (2024), containing source-assigned xenotime, monazite, zircon, almandine and ilmenite. Its deposit, supplier and concentration history are not specified in the reviewed article and supplement. Particle counting and density conversion estimated about 82.0 wt% xenotime and 2.7 wt% monazite; these are sample-specific phase estimates, not measured product purity. The feed is distinct from the xenotime-(Y) mineral species, monazite species, elemental rare earths, a rare-earth commodity and a secondary waste resource. No criticality designation is inherited from its constituent elements.
sources:
- id: he2024
  title: 'He Y, Ma L, Liang X, Li X, Zhu J and He H (2024). Resistant rare earth phosphates as possible sources of environmental dissolved rare earth elements: Insights from experimental bio-weathering of xenotime and monazite. Chemical Geology 661:122186. DOI 10.1016/j.chemgeo.2024.122186; complete 56-page GFZ author postprint including repository cover, Figures 1-7 and Tables 1-3.'
  url: https://doi.org/10.1016/j.chemgeo.2024.122186
  accessed_on: '2026-10-12'
- id: he2024_supplement
  title: He et al. (2024), original publisher Supplementary Materials, 16 pages, Figures S1-S7, Tables S1-S8 and Text S1. Actual item captions are used; the page-2 contents list has inconsistent figure and table numbering.
  url: https://ars.els-cdn.com/content/image/1-s2.0-S0009254124002663-mmc1.pdf
  accessed_on: '2026-10-12'
