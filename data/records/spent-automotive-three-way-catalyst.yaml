- id: compagnone_2023
  title: Compagnone, González-Cortés, Yeste, Cantero and Ramírez (2023). Bioleaching of the α-alumina
    layer of spent three-way catalysts as a pretreatment for the recovery of platinum group metals. Journal
    of Environmental Management 345:118825. DOI 10.1016/j.jenvman.2023.118825; Methods 2.1-2.6, Results
    3.2-3.5, Figures 2-6. Full primary repository PDF inspected; supplementary files and underlying dataset
    contents unavailable in this assessment.
  url: https://doi.org/10.1016/j.jenvman.2023.118825
  accessed_on: '2026-10-11'
