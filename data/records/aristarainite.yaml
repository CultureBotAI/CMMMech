id: cmmmech:aristarainite
name: Aristarainite
material_kind: mineral
description: >-
  Aristarainite is the approved sodium-magnesium borate mineral
  Na2Mg[B6O8(OH)4]2·4H2O, IMA1973-029, in the September 2026
  IMA-CNMNC list. Hurlbut and Erd described natural crystals
  from the Tincalayu borax deposit, Salta, Argentina, including
  material separated from borax/kernite hosts with warm water.
  Their 1974 chemical analysis on 95.4 mg included potassium
  and yielded the historical oxide formula Na2O·MgO·6B2O3·10H2O.
  Ghose and Wan's 1977 single-crystal refinement revised that
  ideal hydration to eight oxide-formula waters, equivalent to
  the current structural formula. This revision came from the
  structural model, not a new bulk-water assay. Hexaborate
  units form chains parallel to b; magnesium and sodium link
  these into sheets parallel to (001), cross-linked by hydrogen
  bonds. One hydrogen on the O(14) water site was modeled as
  two half-occupied positions; this is crystallographic disorder,
  not a measured molecular-motion rate. The papers' qualitative
  water/acid solubility and proposed geological polymerization
  do not establish extraction kinetics or an engineered process.
  Species identity is distinct from the borates commodity and
  its constituent elements; no criticality, microbial mechanism
  or industrial recovery claim is inferred.
