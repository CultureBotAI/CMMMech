id: cmmmech:coal-mine-drainage-treatment-solids
name: Coal-mine-drainage treatment solids
material_kind: secondary_resource
description: >-
  Heterogeneous solids accumulated during treatment of drainage from coal mines,
  including metal-rich precipitates and coatings in passive remediation systems.
  Their processing origin distinguishes this secondary resource from untreated
  mine water, natural ore, coal combustion ash and an individual oxide mineral.
  The curated experiment used material from five Pennsylvania passive systems
  containing different proportions of manganese, iron, aluminium and rare-earth
  elements. Neither a universal composition nor a constituent's criticality
  designation is assigned to the resource. Laboratory culture-associated metal
  mobilization is documented; a purified recovered product, economic recovery
  yield and industrial deployment are not established.
sources:
