limitations:
- The S. lacrymans malachite cells are dashes for pH, SEM/EDX and PXRD. The record
  correctly reports no product result instead of quantified zero, failed growth or
  permanent biological inability. No malachite-arm control pattern or quantitative
  inoculated/uninoculated phase balance is supplied.
- Culture association and selected source-assigned phases do not establish complete
  feed consumption, a phase-specific metal balance, isolated recovery, exclusive biochemical
  causality or industrial deployment.
- The liquid-medium recipe, inoculum amount and substrate sterilization remain unspecified;
  starting-material purity and selected analytical patterns limit generalization.
- Four species/sequence labels do not independently authenticate the experimental
  stock. The source Antrodia name and current Amyloporia synonym relationship are
  explicit.
- No affecting notice was identified in the bounded exact-DOI search/current metadata,
  not a universal absence claim. Full original evidence was reused from disclosed
  curator acquisitions and independently inspected.
- Hidden/ignored/followed dedup covers the enumerated corpus and referenced raw text
  roots, not universal binary decoding or machine-wide absence.
notes:
- No target record, history or source dossier was edited by this reviewer. Accurately
  represented source weaknesses are limitations, not fabricated corrective findings.
- The first independent API attempt failed under restricted DNS and is retained; a
  permitted network read then returned all three official resources successfully.
- Both mineral reviews are separate exact-target observations from the same independent
  reading; their common source does not imply independent experimental replication.
