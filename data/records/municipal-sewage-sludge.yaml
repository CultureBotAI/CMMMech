  evidence:
  - source_ref: pradhan_2021
    supports: support
    explanation: Sections 2.4-2.6 and 3.1-3.3, Figures 1-2 and Tables 3-5 support the culture treatments, indigenous growth in controls, acidification after sulfur addition and the increased filtered phosphorus endpoint. Table 5 reports 92% P solubilization at pH 0.9 for T+S in phase 3, compared with 27% in TC+S and 10% in F+S. The preceding T phases report 10% and 5%; the outcome is conditional on the complete sequential treatment.
  - source_ref: pradhan_2021
    supports: partial
    explanation: Section 2.4 media contain phosphate, iron and trace elements; explicit correction for these inputs and a closed replacement/sampling mass balance are not reported. Thus the reported 92% is not adopted as a verified sludge-derived recovery yield. Table 6 includes apparent elemental percentages exceeding 100%, and some Figure 1 final-pH traces differ from Table 5. The paper's sulfuric-acid concentration inferred directly from pH is not accepted as a measured acid yield. Neither an acidity-matched sterile control, strain-resolved tracking of the indigenous community, isolated phosphate product nor industrial operation was demonstrated.
  - source_ref: dsm_29444
    supports: context_only
    explanation: The catalogue confirms DSM 29444 as strain R1; it does not establish its individual contribution in sludge.
  - source_ref: dsm_14887
    supports: context_only
    explanation: The catalogue confirms DSM 14887 as strain 3/TA; species identifiers do not distinguish added cells from indigenous organisms.
- id: indigenous_iron_oxidizer_sludge_leaching
  name: Iron-fed indigenous enrichment bioleaching with a separate chemical oxidation extension
  process: bioleaching
  description: An unresolved indigenous iron-oxidizing enrichment was used to acidify municipal sludge and mobilize several metals in laboratory flasks. A subsequent hydrogen-peroxide Fenton-like treatment altered extraction and operationally defined metal fractions; that chemical extension is not itself evidence of microbial oxidation or isolated metal recovery.
  context: Qiu et al. used Tianjin municipal sludge adjusted to 4.0% total solids with deionized water. Each 300 mL sludge sample received 5% v/v living enrichment inoculum and 4.00 g/L Fe2+ supplied as FeSO4, followed by shaking at 28 degrees C and 150 rpm for up to 10 days. The inoculum originated from a municipal WWTP thickening tank; no species or strain assignment is justified. Samples of 20 mL were taken every 48 hours. The separate combined arms received 5-15 g/L H2O2 when bioleaching reached pH 4.5, 4.0 or 3.0. Experiments were described as triplicate, with ICP-MS metal analyses and modified BCR sequential extractions.
  microbial: true
  evidence:
  - source_ref: qiu_2021
    supports: support
    explanation: Methods pp. 2-3 and Figures 1-3 support progressive acidification and unequal metal mobilization. The single 10-day treatment reports 67.28% Zn and 49.83% Ni solubilization but only 6.32% Cr, with relatively low As and Pb removal. These percentages describe the study's assay, not recovered purified products. Figures 4-5 show that chemical H2O2 addition can increase extraction of several metals while reducing As and Pb removal relative to the single bioleaching endpoint.
  - source_ref: qiu_2021
    supports: partial
    explanation: No matched sterile Fe-fed or acidity-matched comparison is presented, and community identity and detailed sample pretreatment are not resolved in the main article. BCR fractions are operational extractions, not direct mineral or oxidation-state identification; proposed FeAsO4/PbSO4 formation and hydroxyl-radical pathways remain interpretations. The text varies between 65.81% and 65.19% for a combined-treatment Ni endpoint and gives inconsistent Cu peroxide-dose assignments, so no exact combined optimum is accepted. Neither complete detoxification nor industrial deployment or an isolated metal product was shown.
