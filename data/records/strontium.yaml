        annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:Q07403 (UREG_BACSB) from congeneric isolate Bacillus sp. TB-90 (NCBITaxon:36824), complementing the Bacillus subtilis str. 168 UreABC structural subunits (UniProtKB:P77837, UniProtKB:P71035, UniProtKB:P75030; B. subtilis str. 168 UP000001570 lacks ureEFGD accessory genes) as a reviewed genus-level UreG representative for halophilic marine-sediment isolate Bacillus sp. TK2d (NCBITaxon:1630002) in Horiike et al. (2017).
