id: cmmmech:molybdenite
name: Molybdenite
material_kind: mineral
description: Molybdenite is the MoS2 mineral species, grandfathered in the September
  2026 IMA list with original-description year 1796. It is distinct from elemental
  molybdenum, dissolved molybdate, manufactured MoS2 and mixed ores or concentrates.
  The experiment below concerns molybdenite within a heterogeneous commercial
  ore-grade specimen, not a purified mineral. No criticality designation is
  inherited from molybdenum.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 146,
    Molybdenite row; page 1 column definitions and page 2 distribution terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: francisco2007
  title: Francisco Jr., Bevilaqua and Garcia Jr. (2007). Estudo da dissolucao
    oxidativa microbiologica de uma complexa amostra mineral contendo pirita
    (FeS2), pirrotita (Fe1-xS) e molibdenita (MoS2). Quimica Nova 30(5),
    1095-1099. Complete publisher PDF, experimental methods and Figures 1-6.
  url: https://doi.org/10.1590/S0100-40422007000500008
  accessed_on: '2026-10-11'
- id: francisco2007_supplement
  title: Francisco Jr., Bevilaqua and Garcia Jr. (2007). Original supplementary
    page S1, Figures 1S-2S, appended to the complete article in the UNESP
    repository PDF. Figure 2S contains 43-day uninoculated controls.
  url: https://repositorio.unesp.br/server/api/core/bitstreams/4a0fec08-6d23-49aa-b365-0eff66bd691f/content
  accessed_on: '2026-10-11'
- id: ncbi_ferrooxidans
  title: NCBI Taxonomy 920. Acidithiobacillus ferrooxidans, species-level entry;
    this identifier does not identify the experimental isolate LR.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920&mode=Info
  accessed_on: '2026-10-11'
mechanisms:
- id: lr_mixed_specimen_leaching_limit
  name: Molybdenite persistence during culture-associated companion-sulfide leaching
  process: bioleaching
  microbial: true
  organisms:
  - id: NCBITaxon:920
    label: Acidithiobacillus ferrooxidans
  description: In laboratory bioleaching assays with Acidithiobacillus ferrooxidans
    LR, molybdenite persisted in a mixed sulfide specimen while the authors
    interpreted changes in iron chemistry and residue XRD as preferential removal
    of companion pyrite and pyrrhotite. Molybdenum in sampled liquid remained below
    the reported detection limit in both inoculated and uninoculated conditions.
    This is a bounded attempted-leaching result and companion-phase observation,
    not demonstrated microbial molybdenite oxidation, molybdenum extraction or
    isolated-product recovery. The authors' proposed galvanic protection of
    molybdenite was not directly measured.
  context: The natural ore-grade material came from Ward's Natural Science
    Establishment, Rochester, New York; the specimen's mine origin is not supplied.
    It was ground below 0.2 mm and contained 0.8 wt% Mo, 34.0 wt% Fe and 23.0 wt% S.
    Initial XRD identified molybdenite, pyrite and pyrrhotite, with additional
    unidentified copper-mineral peaks. LR was isolated from acidic uranium-ore
    leach liquor at Lagoa Real, Bahia, Brazil, and adapted to the mixed sulfide
    before inoculation. No authenticated strain accession is assigned. The
    43-day flask study used 250 mL Erlenmeyers containing 150 mL culture medium
    and 2.5% w/v ore, autoclaved at 120 degrees C for 30 minutes, then inoculated
    at 5% v/v and shaken at 150 rpm and 30 plus or minus 2 degrees C. Inoculated
    arms with and without 30 mmol/L supplemental Fe(II) had corresponding
    uninoculated controls; an additional uninoculated Fe(III) control was included.
    The cited T-and-K medium recipe is not reproduced in full. Flask replication,
    inoculum cell density, washing status and initial pH are not explicitly given.
    All flasks required early acid corrections; exact acid doses and timing are
    unavailable. Separate triplicate resting-cell respirometry does not supply
    those missing flask details. These are laboratory observations, not an
    industrial process demonstration.
  evidence:
  - source_ref: francisco2007
    supports: support
    explanation: Experimental methods on pages 1095-1096 and the liquid-phase
      results on page 1098 report Mo below 2 mg/L, the stated detection limit,
      in all assays. Mo was measured by inductively coupled plasma spectrometry
      in supernatant after centrifugation; the instrument subtype is not specified.
      This censored solution concentration is neither zero nor a recovered
      fraction of feed molybdenum. No complete molybdenum mass balance, isolated
      product yield or quantified concentrate upgrade is supplied.
  - source_ref: francisco2007
    supports: support
    explanation: Figures 5-6 identify the starting mixed phases and show residue
      patterns after 22 days. The authors assign disappearance of pyrite and
      pyrrhotite peaks in inoculated arms, while corresponding uninoculated
      residues retain pyrite peaks; molybdenite peaks remain. This is qualitative
      phase evidence for culture-associated companion-sulfide removal. It does
      not quantify absolute mineral consumption, demonstrate direct enzymatic
      attack or establish oxidation of the molybdenite fraction.
  - source_ref: francisco2007
    supports: partial
    explanation: The solid-phase paragraph on page 1098 says that inoculated
      samples showed no mineralogical changes after the period just discussed.
      The temporal wording may mean no further changes after day 22, consistent
      with earlier companion-sulfide loss, rather than no change from the starting
      material. Its comparison baseline is not explicit, so a definite source
      contradiction is not inferred. Qualitative XRD does not establish absolute
      complete oxidation. The same page reports persistent molybdenite peaks
      through 43 days in both inoculated and uninoculated flasks, but explicitly
      labels the final inoculated patterns as data not shown.
  - source_ref: francisco2007_supplement
    supports: support
    explanation: Original Figure 2S shows molybdenite peaks in 43-day uninoculated
      residues without added iron, with Fe(II), and with Fe(III). It does not show
      the missing 43-day inoculated patterns. Figure 1S concerns oxygen-consumption
      kinetics of the heterogeneous specimen and cannot establish molybdenite
      oxidation independently of its iron sulfides.
  - source_ref: francisco2007
    supports: partial
    explanation: Page 1097 and Figure 2 describe an early pH rise toward 4 and
      periodic acid corrections over approximately the first 15 days, followed
      by differing culture/control trajectories and eventual pH 1.7-1.9 after
      about day 25. The controls therefore do not isolate a pH-independent cell
      effect. Figure captions label the Fe(III) control as 30 mmol/L Fe(III),
      whereas the methods describe 30 mmol/L ferric sulfate, leaving the stated
      addition basis ambiguous. The result is confined to this heterogeneous
      feed and assay; it does not establish universal resistance of molybdenite
      to microbial or chemical leaching under other conditions.
