id: cmmmech:lithium-mica-ore
name: Lithium-mica ore
material_kind: primary_resource
description: >-
  Natural lithium-bearing ore containing lithium micas together with other
  mineral phases. The curated experiment used crushed ore from Beauvoir,
  France, supplied by the University of Birmingham and called lepidolite by
  Sedlakova-Kadukova et al. Its initial XRD pattern was assigned to
  polylithionite, muscovite and kaolinite in supplementary Figure S2A.
  These are source-qualified assignments in a heterogeneous feed, not a
  certified pure polylithionite specimen or quantitative phase proportions.
  Lepidolite is series terminology, not an unambiguous mineral-species
  identifier. This extracted geological feed remains a primary resource,
  distinct from an individual mica species, elemental lithium, a processing
  waste or a purified lithium product. No criticality designation or
  industrial deployment is inferred from its lithium content.
sources:
  - id: sedlakova2020
    title: >-
      Sedlakova-Kadukova, Marcincakova, Luptakova, Vojtko, Fujda and Pristas
      (2020). Comparison of three different bioleaching systems for Li recovery
      from lepidolite. Scientific Reports 10:14594.
      DOI 10.1038/s41598-020-71596-5. Complete eight-page publisher PDF,
      Materials and methods, Figures 1-4, Table 1 and Results and discussion;
      original five-page supplementary PDF, Figures S1 and S2A-D.
    url: https://doi.org/10.1038/s41598-020-71596-5
    accessed_on: '2026-10-12'
  - id: mica_nomenclature1998
    title: >-
      Rieder et al. (1998). Nomenclature of the micas. Clays and Clay Minerals
      46(5):586-595. DOI 10.1346/CCMN.1998.0460513. Table 4, printed page
      589, treats lepidolite as a series on or near the trilithionite-
      polylithionite join; this does not identify the composition of every
      ore sold or described as lepidolite.
    url: https://doi.org/10.1346/CCMN.1998.0460513
    accessed_on: '2026-10-12'
  - id: ncbi_ferrooxidans
    title: NCBI Taxonomy 920, Acidithiobacillus ferrooxidans, species-rank identity
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920
    accessed_on: '2026-10-12'
  - id: ncbi_thiooxidans
    title: NCBI Taxonomy 930, Acidithiobacillus thiooxidans, species-rank identity
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=930
    accessed_on: '2026-10-12'
  - id: ncbi_niger
    title: NCBI Taxonomy 5061, Aspergillus niger, species-rank identity
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=5061
    accessed_on: '2026-10-12'
  - id: ncbi_mucilaginosa
    title: NCBI Taxonomy 5537, Rhodotorula mucilaginosa, species-rank identity
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=5537
    accessed_on: '2026-10-12'
mechanisms:
  - id: beauvoir_acidophile_leaching
    name: Medium-dependent acidophile-associated lithium mobilization from mixed ore
    process: bioleaching
    microbial: true
    organisms:
      - id: NCBITaxon:920
        label: Acidithiobacillus ferrooxidans
      - id: NCBITaxon:930
        label: Acidithiobacillus thiooxidans
    description: >-
      A consortium cultured with sulfur in nutrient-poor acidic medium
      mobilized lithium from the Beauvoir feed over a prolonged laboratory
      incubation. The nutrient-rich bacterial treatment showed no lithium
      bioleaching in the authors' account. Acidification is consistent with
      an indirect acid-leaching contribution, but the experiment does not
      resolve each organism's causal role or establish exclusive proton
      control. Dissolved lithium and altered residue diffraction patterns
      do not demonstrate an isolated lithium product or selective dissolution
      of a single mineral species.
    context: >-
      The source names A. ferrooxidans SmolnikLC and A. thiooxidans SmolnikF,
      isolated from Smolnik copper-mine drainage; the taxon IDs identify
      species, not those strains. Cultures were adapted to ore for two months.
      Ball-milled feed was sieved below 150 micrometres, with approximately
      75% below 100 micrometres, and loaded at 10 g/L. Duplicate 250 mL flasks
      contained 190 mL medium plus 10 mL adapted inoculum, at 30 degrees C
      without shaking. Poor medium was sulfuric acid initially at pH 3 with
      5 g/L elemental sulfur; ore was added after culture acidification to
      pH 1.5. Rich medium contained inorganic nutrients, 44.2 g/L
      FeSO4.7H2O and 4 g/L sulfur. Same-medium uninoculated controls were
      reported, but pH trajectories were not held equal. Filtered 0.2
      micrometre samples were assayed for lithium by AAS. Results and Figure
      1B use an endpoint around 336 days, whereas Methods lists day 366 as
      the final sampling day; an exact reconciled duration is unavailable.
    evidence:
      - source_ref: sedlakova2020
        supports: support
        explanation: >-
          Materials and methods, Bioleaching kinetics, Figure 1 and Figure 4B
          support a condition-dependent dissolved-lithium result: the poor
          bacterial medium reached a reported 11 mg/L and a reported 8.8%
          feed-lithium extraction, while nutrient-rich bacterial medium
          showed no bioleaching. The authors report no lithium found in
          uninoculated controls; no analytical detection limit or full
          control concentration series is supplied, so this is not an
          exact-zero measurement. These observations support this assay,
          not a universal advantage of bacterial leaching or nutrient
          starvation.
      - source_ref: sedlakova2020
        supports: partial
        explanation: >-
          Figure 3 and the pH discussion show unlike culture and control
          pH histories, without matched-acidity or cell-free spent-medium
          controls. Sulfuric-acid action and individual bacterial roles are
          proposed explanations. Figure 2 is a shrinking-core-model fit,
          not independent proof of a reaction pathway. Its plotted
          transformed ordinate begins near 0.667, and the paper does not
          supply a reproducible normalization resolving that offset;
          no fitted rate constant or claimed 400-fold kinetic gain is
          adopted here. Methods gives 1.21% elemental Li by AAS, whereas
          Table 1 gives 3.79% Li2O, approximately 1.76% elemental Li by
          stoichiometry. That unresolved feed-assay discrepancy prevents
          treating the reported percentage as an independently verified
          mass balance; it is retained as the authors' result only.
      - source_ref: sedlakova2020
        supports: partial
        explanation: >-
          Supplementary Figure S2A assigns the initial ore to polylithionite,
          muscovite and kaolinite. Panel B assigns the bacterial residue to
          polylithionite, kaolinite and sulfur and omits a muscovite
          reference pattern, consistent with the authors' description.
          The panels have different count scales, no quantitative phase
          analysis and no matched uninoculated residue pattern. Reference
          labels include non-ideal formulas, and the yeast panel has two
          different polylithionite-labelled references. Neither the labels
          nor peak-intensity differences establish pure endmembers,
          complete phase removal or a mineral-specific lithium yield.
  - id: beauvoir_fungal_leaching
    name: Fungal culture-associated lithium mobilization and biomass association
    process: bioleaching
    microbial: true
    organisms:
      - id: NCBITaxon:5061
        label: Aspergillus niger
    description: >-
      A. niger cultivation on the same Beauvoir mixed ore produced low
      lithium mobilization, with much of the assayed extracted lithium in
      the harvested biomass fraction. Hyphae attached to and associated with
      cleavages in mineral particles. Organic-acid action and mechanical
      weathering are plausible interpretations, but acid identities,
      intracellular localization and their individual contributions were
      not directly established. This is a separate fungal flask assay,
      not the first stage of a demonstrated sequential recovery process.
    context: >-
      The authors identify strain An-S from the acidified Sobov site and
      report ISB collection number 1674; no strain-level identifier is
      assigned here. In duplicate 250 mL flasks, 2 g of the same milled ore
      was added to 200 mL glucose 5 g/L and (NH4)2SO4 0.5 g/L medium,
      adjusted initially to pH 5.1, with 5 mL of eight-day-old conidial
      culture. Medium and mineral were autoclaved at 120 degrees C for
      20 minutes. Incubation was static at 21 degrees C. Methods lists
      sampling through day 41 and paired uninoculated media. AAS was used
      on filtered liquid; harvested biomass was washed, air-dried,
      incinerated at 500 degrees C for four hours and digested in 2 M HCl.
      The paper's figures and prose use different endpoint descriptions,
      so approximately forty-day results are not assigned a fabricated
      exact common endpoint across organisms.
    evidence:
      - source_ref: sedlakova2020
        supports: support
        explanation: >-
          Figure 1A, Figure 4 and Li distribution/Bioleaching efficiency
          report a 0.2% extraction from the feed, combining dissolved and
          biomass-associated lithium; 77% of that extracted lithium was
          assigned to the biomass fraction. The 77% is not a fraction of
          initial ore lithium or an isolated-product yield. Reported
          uninoculated non-detection and lower culture pH support a
          culture-associated outcome, subject to the unspecified detection
          limit and the shared Table 1 versus AAS feed-composition conflict.
      - source_ref: sedlakova2020
        supports: partial
        explanation: >-
          Supplementary Figure S1 shows hyphae on and within apparent
          particle cleavages. Figure S2C includes source-assigned quartz
          with mica and kaolinite references, which the text interprets as
          a changed residue. These images do not quantify mechanical
          dissolution or prove de novo quartz precipitation; no quantitative
          mineral mass balance or matched sterile residue XRD is supplied.
          Figure 3 shows acidification but individual organic acids were
          not measured. Biomass digestion does not distinguish intracellular
          lithium from surface-bound lithium or fine mineral carryover;
          no killed-biomass control or localization assay resolves those
          alternatives. The proposed fungal-then-bacterial sequence and
          extraction of lithium from biomass were not demonstrated.
  - id: beauvoir_yeast_leaching
    name: Yeast culture-associated lithium mobilization and biomass partitioning
    process: bioleaching
    microbial: true
    organisms:
      - id: NCBITaxon:5537
        label: Rhodotorula mucilaginosa
    description: >-
      R. mucilaginosa cultivation with the Beauvoir mixed ore yielded
      lithium in solution and in a harvested biomass fraction. The rich
      medium promoted greater biomass-associated lithium than the poor
      medium in the authors' account. Solution decline and biomass digestion
      support partitioning to harvested material but do not alone prove
      intracellular bioaccumulation, a specific uptake pathway or isolated
      lithium recovery. Comparisons with the fungal and bacterial assays
      are confounded by medium, temperature, agitation and duration.
    context: >-
      The source identifies CCY 20-1-36, called R. mucilaginosa and formerly
      R. rubra; the verified NCBI identifier is at species rank. Five-day
      precultures were added to 200 mL media with 10 g/L ore in 250 mL flasks.
      Rich medium contained glucose 20, KH2PO4 5, (NH4)2SO4 5, MgSO4 0.34
      and yeast extract 7 g/L; poor medium contained glucose 5 and
      (NH4)2SO4 0.5 g/L. Media started at pH 5.1 and were autoclaved
      before inoculation. The source states 21 degrees C and duplicate
      experiments with uninoculated controls. Methods and figure captions
      specify shaking at 160 rpm, but Methods also says statically;
      this conflict is unresolved. Sampling is listed through day 59,
      while plotted comparisons show shorter series. Supernatant was
      centrifuged and assayed by AAS; harvested biomass was dried,
      incinerated and acid-digested for lithium measurement.
    evidence:
      - source_ref: sedlakova2020
        supports: support
        explanation: >-
          Figures 1A and 4 and the Li distribution/Bioleaching efficiency
          sections report early dissolved lithium, followed by a lower
          liquid concentration, and a total reported extraction of 1.1%
          from ore in the rich-medium assay. The reported 92% in biomass
          is a share of the extracted lithium, not 92% extraction from
          the feed. The text attributes higher total extraction in rich
          medium to greater biomass formation; the report does not
          establish equal-condition superiority over another organism.
      - source_ref: sedlakova2020
        supports: partial
        explanation: >-
          Centrifugation and digestion of a harvested fraction do not
          distinguish intracellular uptake from surface retention or
          entrained solids, particularly without killed-biomass controls.
          Figure 3's yeast curve rises again at its last plotted point,
          whereas the prose ends its description near pH 3.5; no exact
          final pH is selected here. Supplementary Figure S2D shows a
          changed mixed-residue pattern, but unmatched scales, unquantified
          phase assignments and missing sterile-residue XRD prevent a
          species-specific transformation claim. The feed-assay and
          incubation-description conflicts also limit quantitative
          comparison. Downstream recovery and sequential microbial
          processing remain proposals rather than performed operations.
