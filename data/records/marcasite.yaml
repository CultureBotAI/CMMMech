id: cmmmech:marcasite
name: Marcasite
material_kind: mineral
description: Marcasite is the orthorhombic FeS2 mineral species, distinct from cubic pyrite, other iron
  sulfides, elemental iron and mixed sulfide ores. The September 2026 IMA list records grandfathered status
  and original-description year 1845; the year is not an approval accession. The accepted experiment used
  powder characterized as marcasite by composition and diffraction, without a reported refined phase fraction
  or specific surface area. No constituent criticality is inherited.
