  evidence:
  - source_ref: oloughlin_2021
    supports: support
    explanation: Section 3.7, Figure 22 and Table 4 show an early plateau near 24 mM acid-extractable Fe(II) in both phosphate-free cultures. Table 4 reports final values of 24.28 +/- 2.10 mM without AQDS and 24.51 +/- 6.02 mM with AQDS at day 78, approximately 30 percent of the initially supplied 80 mM Fe(III). The paper's description of essentially complete bioreduction within 11 days therefore cannot mean reduction of all initial Fe(III) to Fe(II). AQDS changes the initial rate, and Section 4.2 explicitly reports no significant final-extent difference for feroxyhyte. The fitted maximum sustained rates are not instantaneous rates or enzyme-specific measurements.
  - source_ref: oloughlin_2021
    supports: support
    explanation: Figure 23 compares the sterile-control feroxyhyte pattern with inoculated solids assigned to magnetite and chukanovite in the phosphate-free and 500 micromolar phosphate treatments. At 5 mM phosphate the assigned products are carbonate green rust and vivianite. Figure 24 supplies morphology, not standalone phase proof; Table 4 marks the high-phosphate SEM green-rust assignment with a question mark and supplies no Mossbauer result for that arm. Table 5's selected AQDS and AQDS-plus-500-micromolar-phosphate fits support magnetite/chukanovite mixtures; their relative spectral areas are not whole-feed mass recovery percentages.
  - source_ref: oloughlin_2021
    supports: partial
    explanation: Table 4 reports 55.07 +/- 2.92 and 59.93 +/- 1.65 mM final Fe(II) at day 156 for the 500 micromolar and 5 mM phosphate treatments, respectively. These longer-duration endpoints must not be treated as a same-day comparison with day-78 phosphate-free endpoints. Figure 23 labels the actual plotted patterns as day 78 or day 156, consistent with Table 4, while its caption says 46 days. That unresolved caption conflict is retained rather than assigning a fabricated common harvest date. No residual feroxyhyte was identified in the inoculated diffraction patterns, but nondetection and mixed Fe(II)/Fe(III) products do not establish total iron reduction or a quantitative pure-phase yield.
  - source_ref: oloughlin_2021
    supports: partial
    explanation: Sterile-control diffraction supports retention of the starting phase under one control condition; the absence of a reported matched sterile Fe(II) trajectory and fully specified control arms limits quantification of the microbial increment. No killed-cell, cell-free metabolite or mutant comparison resolves biological necessity or a particular electron-transfer pathway. Dissolution-reprecipitation is inferred from changed morphology in Section 4.1, not directly traced. All phosphate arms also contain AQDS, so phosphate effects cannot be generalized to shuttle-free systems. The study demonstrates laboratory solid transformation, with no isolated iron product, natural-ore performance or industrial deployment established.
