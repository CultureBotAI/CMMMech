id: cmmmech:scandium
name: Scandium
material_kind: element
description: The element Sc, distinct from dissolved Sc(III), scandium chloride, scandium oxide, Sc-bearing
  minerals and waste feedstocks. The US2025 designation concerns the named scandium mineral commodity.
  Laboratory evidence below uses an immobilized bacterial protein and synthetic dissolved-metal mixtures;
  it does not demonstrate living-cell extraction.
