  group_id: GRP-C10S5-002
  issue_url: https://github.com/CultureBotAI/CMMMech/issues/951
  summary: 'In data/records/brushite.yaml (cmmmech:brushite, mineral, Heveran et al.
    2019 Scientific Reports 9:14721, DOI:10.1038/s41598-019-51133-9; causal_graphs[0]
    ureolytic_brushite_calcite_phase_transition_graph, lines 187-339), nodes[2].description
    (dissolved_metal_cations, lines 299-300) and nodes[3].description (precipitated_mineral_phase,
    lines 305-306) retain generic template descriptions repeating their capitalized
    node labels verbatim in parentheses (''Dissolved cations (Dissolved Ca(II) and
    phosphate in acidic pre-mineralization solution) undergoing carbonate/phosphate
    precipitation.'' and ''Solid mineral phase (Brushite (CaHPO4·2H2O) and calcium
    carbonate co-precipitate) formed via ureolytic alkalinization.''), where nodes[3].description
    and edges[1..2] (lines 318-339, supports: support) depict brushite as formed via
    ureolytic alkalinization even though mechanisms[0] (lines 46-51, 68-89) explicitly
    establishes that brushite and apatite precipitate initially in cell-free medium
    and nonureolytic Escherichia coli HB101 controls (Figure 2D-E) as well as early
    HB101/ure-integration cultures (Figure 2B, Figure 3I-L) and are subsequently replaced
    in bulk XRD by calcite as ureolytic alkalinization progresses and dissolved phosphorus
    returns to solution (Figures 1G-H, 2B, 3; supports: partial), with weak local
    Raman phosphate signals persisting at 7 d calcite indentation sites (Table 2).
    Furthermore, edges[0].evidence[0].explanation (line 317) uses the generic 70-character
    template string, edges[1..2] interpolate capitalized node labels mid-sentence
    with plural-subject singular-verb grammar (''Dissolved Ca(II) and phosphate ...
    precipitates into ...''), and edges[2].evidence[0].explanation (line 338) cites
    ''XRD/SEM-EDS'' whereas Heveran et al. (2019) used XRD, SEM, Raman, and WDS (mechanisms[0].context
    line 63).'
  disposition: 'Resolved under #951 (GRP-C10S5-002) by updating causal_graphs[0].nodes[2..3].description
    and edges[0..2] in brushite.yaml to document initial brushite/apatite precipitation
    in cell-free, nonureolytic, and early lower-urease cultures followed by bulk XRD
    replacement by calcite as pH rises and dissolved P returns to solution, setting
    supports: partial on edges[1..2], and citing XRD, SEM, Raman, and WDS with an
    append-only EDIT history sidecar; verified in reviews/structured/20261106T145500Z-cycle10-stage5-remediation-verification/review.yaml.'
