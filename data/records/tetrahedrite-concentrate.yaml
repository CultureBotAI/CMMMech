  evidence:
  - source_ref: kupka_2025
    supports: support
    explanation: Materials and Methods, Tables 1-2, Figures 2-5 and Figure S12 support the stated mixed feed, separate inocula, laboratory conditions and contrasting liquid-phase trajectories. Figure 3 is specifically the day-35 Fe/Mn comparison. Figure 5 presents zinc and silver only for A. ferrooxidans versus abiotic treatment and does not establish that arm's behavior for A. ferrivorans. Silver is plotted in micrograms/L, zinc in milligrams/L; these are concentrations rather than isolated recovery yields. The generic prose claim of more than 80% copper extraction is not applied equally to both cultures here because the plotted endpoints differ and the panel units are inconsistent.
  - source_ref: kupka_2025
    supports: partial
    explanation: Figure 2a labels Cu/Fe in g/L, whereas Figures 2b-c label them in mg/L despite similar numerical scales and g/L discussion. The article's approximate quartz abundance conflicts with Table 1's 1.00 wt% SiO2; neither discrepancy is silently corrected. Discussion locators calling the As/Sb profiles Figure 5b are inconsistent with the actual Figure 4a-b. Different pH, iron speciation and possibly thermal pretreatment limit attribution to a direct cellular effect. Mixed sulfides and sulfate already in the medium also preclude assigning every liquid analyte exclusively to the tetrahedrite phase.
  - source_ref: kupka_2025
    supports: partial
    explanation: Figures 1, 6-7 and S3-S11 provide XRD, microscopy, microanalysis and surface spectroscopy. Residual primary cores and heterogeneous rims persist; selected associated chalcopyrite grains lack alteration rims. Surface XPS assignments do not establish bulk conversion, dissolved speciation or a phase-pure recovered product. Scorodite was explicitly not detected, and discussion of tripuhyite remains a possible interpretation rather than an identified product. The SI's Fe-XPS cross-reference to S2 actually corresponds to S9; S2 instead shows a starting ore specimen with secondary covellite. Main Figure 7 and SI Figures S6-S7 reuse images, not independent replication. Figure 8 relates measured oxygen use to tetrahedrite oxidation inferred from copper release and a selected composition; it is not a direct phase dissolution or product-yield measurement. The respirometry discussion describes four parallel experiments, distinct from the stated triplicate flask protocol, and does not
      supply a full carbon balance.
  - source_ref: ncbi_ferrooxidans
    supports: context_only
    explanation: Resolves the species name without identifying a sequenced experimental stock.
  - source_ref: ncbi_ferrivorans
    supports: context_only
    explanation: Resolves the species name; its listed type strain is not the study's SS3 strain.
  - source_ref: dsm_14882
    supports: context_only
    explanation: Links the reported DSM 14882 culture designation to the named species; catalogue culture guidance is not a replication of this mineral assay.
  - source_ref: dsm_17398
    supports: context_only
    explanation: Links the reported DSM 17398 and SS3 designations without authenticating the study stock.
