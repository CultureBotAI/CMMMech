id: cmmmech:electric-arc-furnace-dust
name: Electric-arc-furnace dust
material_kind: secondary_resource
description: Zinc-bearing dust generated by electric-arc-furnace steelmaking, represented here by two actual dusts supplied by an unnamed steelmaking company. This process-defined secondary resource is distinct from cast-house dust, blast-furnace flue-gas dust, steelmaking slag, zinc ore and elemental zinc. The two samples do not define a universal composition. No elemental identifier or criticality designation is assigned to the dust.
sources:
- id: frueholz_2025
  title: 'Frueholz, Spiess, Eisbacher-Lubensky, Habermaier, Guebitz, Mueller and Haberbauer (2025). Zn recovery from steel mill EAF dusts: A two-step biotechnological approach. Resources, Conservation & Recycling Advances 27:200278. DOI 10.1016/j.rcradv.2025.200278; available online 16 July 2025, September issue. Full nine-page article, Methods 2.1-2.7, Results 3.1-3.3, Tables 1-5 and Figures 1-9 inspected.'
  url: https://doi.org/10.1016/j.rcradv.2025.200278
  accessed_on: '2026-10-11'
- id: spiess_2023_methods
  title: Spiess et al. (2023). Zinc recovery from bioleachate using a microbial electrolysis cell and comparison with selective precipitation. Frontiers in Microbiology 14:1238853. DOI 10.3389/fmicb.2023.1238853. Analytics and calculations, Equations 1-2, cited by the 2025 EAF study to define its recovery and coulombic-efficiency calculations. This earlier experiment used blast-furnace dust bioleachate, not the 2025 EAF feed.
  url: https://doi.org/10.3389/fmicb.2023.1238853
  accessed_on: '2026-10-11'
