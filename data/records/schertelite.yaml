  url: https://msaweb.org/AmMin/AM48/AM48_635.pdf
  accessed_on: '2026-10-14'
mechanisms:
- id: static_culture_schertelite_assignment
  name: Schertelite-assigned minor phase in static bacterial cultures
  process: biomineralization
  description: Powder diffraction of dried products from Myxococcus coralloides D cultures was interpreted
    as schertelite occurring with dominant struvite under selected static liquid-medium conditions. The
    accepted observation is the recovered source-assigned phase associated with a culture; direct microbial
    causality and product yield remain unresolved.
  context: The thesis used a live laboratory culture historically named Myxococcus coralloides D, described
    as a dispersed-growth derivative obtained by successive liquid passage; the Methods also calls it
    Corallococcus coralloides. No deposited stock or sequence accession is supplied for D, so no exact
    modern strain identifier is inferred. Static cultures were aerobic at 28 degrees C. CT medium used
    1% Bacto-Casitone and a 10 mM potassium-phosphate buffer. Table 8 associates the target phase with
    CT-2 (initial pH 6.8; nominal Mg 4.06 mM from MgSO4.7H2O), CT-13 (10 mM phosphate/10 mM Mg), and CT-15
    (10 mM phosphate/20 mM Mg); CT-13/15 derive from the pH 6.5 base recipe. Methods permits 3 mL tube
    cultures inoculated with 0.1 mL of a 50-hour culture or 100 mL in 250 mL flasks inoculated with 3.3
    mL; the target-phase table does not map each diffractogram to vessel size. Static products were collected
    after 20-22 days by decanting, repeated distilled-water washing and room-temperature drying. The dried
    mixed products were ground and examined by powder XRD using reference-pattern comparison. No boiling
    agar extraction applies to these liquid-culture target observations.
  microbial: true
  evidence:
  - source_ref: entrena_1994
    supports: partial
    explanation: Printed page 107 Table 8 and Figure 19 on page 108 (CT-2 and CT-15), Figure 21 on page
      110 (CT-2 and CT-13), and Figure 22 on page 111 (CT-2) assign schertelite to recovered mixed crystalline
      products. The phase was reported only in static cultures. These source assignments support culture
      association, with the analytical and control limitations below.
  - source_ref: entrena_1994
    supports: partial
    explanation: Printed pages 107-111 and 137-139 do not report phase-specific sterile or killed-cell
      control results, quantitative phase refinements, replicate counts or a phase-specific P/Mg mass
      balance. Peaks and shoulders were assigned within dominant struvite patterns, and the authors explain
      that shared elemental composition makes SEM-EDX unable to identify these minor phases independently.
      Their approximate order-of-5%-or-less abundance and 43% detection statement are not accepted as
      quantitative recovery, phase purity or replicate-resolved frequency. The comparison to shaken cultures
      is confounded by harvesting those after 10-12 days instead of 20-22 days. The thesis proposes metabolism,
      autolysis and local chemistry; it does not establish a target-specific enzyme, gene or obligate
      biological crystallization pathway. Its cellophane experiments concern struvite and are not transferred
      as direct controls for the minor target phase. Laboratory culture products do not establish natural
      formation or industrial recovery.
  - source_ref: entrena_1994
    supports: partial
    explanation: Discussion page 138 attributes ammonium supply to metabolism of the nitrogenous medium,
      but no target-specific ammonium balance establishes its source. The recipe has no deliberate inorganic
      ammonium addition; the reagent-impurity appendix on page 75 nevertheless lists trace ammonium in
      magnesium sulfate. No claim that every ammonium ion was bacterially generated is made. The exact
      role of autolysis and heterogeneous nucleation in schertelite formation remains proposed.
  - source_ref: frazier_1963
    supports: context_only
    explanation: Pages 639-641 report rapid incongruent dissolution of synthetic schertelite in water
      to form struvite. This makes repeated water washing of the culture precipitates a relevant preservation
      limitation; the direction or magnitude of any handling-induced change in the thesis samples was
      not measured. Separate abiotic synthesis does not disprove the culture-associated phase observation
      or establish a microbial enhancement.
- id: abiotic_synthesis_and_water_alteration
  name: Abiotic schertelite crystallization and aqueous alteration
  process: other
  description: A separate chemical study prepared synthetic schertelite without microorganisms and reported
    its incongruent dissolution to struvite in water. This independently bounds any claim that the phase
    requires microbial activity.
  context: Frazier et al. prepared coarse crystals at 25 degrees C by adding 8.6 g magnesium acetate,
    hydration unspecified, to 32.2 g NH4H2PO4 and 3.1 g ammonium acetate in 100 mL water. Washed, acetone-rinsed
    and air-dried crystals underwent chemical, optical and X-ray examination. This is concentrated reagent
    chemistry, distinct from the bacterial medium and not a matched abiotic culture control.
  microbial: false
  evidence:
  - source_ref: frazier_1963
    supports: support
    explanation: Pages 638-639 describe the preparation and give chemical analyses, optical properties
      and selected-crystal diffraction; Table 1 page 636 gives the powder pattern. Page 639 reports rapid
      incongruent dissolution in water with struvite formation, reiterated on page 640. Neither an isolated
      product yield nor a numerical dissolution rate is supplied.
  - source_ref: frazier_1963
    supports: partial
    explanation: The proposed surface alteration after several months in air was inferred chemically;
      the colloidal products were not identified by petrography or XRD. The abstract says hydrolysis produces
      struvite and schertelite, whereas the body separately describes schertelite-to-struvite and hannayite-to-newberyite-plus-struvite.
      The specific body observations are retained with this conflict; no universally balanced transformation
      or industrial deployment is asserted.
