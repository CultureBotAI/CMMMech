name: Chromium
material_kind: element
description: Chromium (Cr), represented as an element. Its identity differs from chromate oxyanions, potassium
  chromate reagent, chromium-bearing precipitates and chromite mineral species. The dated US designation
  names the chromium mineral commodity and is mapped to its elemental identity here; it is not inherited
  by every chromium compound or waste.
