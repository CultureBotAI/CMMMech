mechanisms:
- id: pca_akaganeite_reduction
  name: Condition-dependent akaganeite reduction by Geobacter sulfurreducens PCA
  process: redox_transformation
  description: Living wild-type Geobacter sulfurreducens PCA cultures increased acid-extractable Fe(II) from freshly prepared XRD-assigned akaganeite. Comparisons with delta-imcH and delta-cbcL mutants associate the timing and extent of reduction with those electron-transfer systems, with strong dependence on starting pH and autoclaving. The study supports conditional microbial Fe(III) reduction, not elemental iron production, a purified mineral product, or direct measurement of akaganeite redox potential.
  context: The synthetic substrate was prepared by slowly titrating 0.4 M FeCl3 with 25% NaOH over 90 minutes to pH 7, holding for one hour, washing with water, and using it within 24 hours. Powder XRD assigned the product to akaganeite. Mineral incubations used 1 mL mineral suspension plus 9 mL modified NB basal medium, acetate as electron/carbon donor, no added fumarate, nitrilotriacetate-free trace minerals, and N2:CO2 (80:20). The basal recipe specifies 20 mM acetate; phosphate was increased to 0.69 g/L NaH2PO4·H2O before autoclaving. Separate comparisons used pH 6.8 or 6.3, with fresh medium or 20 minutes autoclaving at 121 degrees C. Each received 100 microlitres of stationary-phase cells grown on acetate/fumarate from separate colony picks. Figure 2 reports triplicate culture means and standard deviations, representative of at least duplicate incubations, over approximately 14-15 days. Samples were extracted in 0.5 N HCl for at least 24 hours at 23-25 degrees C before the ferrozine
    assay; that temperature is for extraction, while the mineral-culture incubation temperature is not stated in the inspected Methods. Acid-extractable Fe(II) is not a dissolved-only fraction. Initial akaganeite Fe loading is not independently quantified here; the nearby approximately 20 mM Methods statement follows the goethite preparation and is not transferred to this assay.
