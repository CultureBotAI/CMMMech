id: cmmmech:belmonteite
name: Belmonteite
material_kind: mineral
ima_symbol: Bmo
description: >-
  IMA-approved hydrated calcium manganese arsenate mineral (IMA 2024-040; symbol Bmo;
  status A, Approved 2024; full description published August 2026) with structural ideal
  formula CaMn2(AsO4)2(H2O)5*2H2O in the title, Abstract (p. 531), and Section 6.5 (p.
  539: Ca(2)(Ca[])Mn(1)Mn2As(1)+As(2)(AsO4)2(H2O)5*2H2O, reflecting 5 cation-bonded H2O
  molecules at Ow(2), Ow(5), Ow(10), Ow(11), and Ow(12b) plus 2 free H2O molecules at
  Ow(9) and Ow(12a) when Ca(2) is half-occupied), printed as CaMn2(AsO4)2(H2O)6*H2O in
  the September 2026 IMA Master List (PDF p. 23) and as the stoichiometric end-member
  formula CaMn2(AsO4)2*7H2O in Section 4 (p. 533) and Table 8 (p. 541; requiring As2O5
  41.49 wt%, CaO 10.12 wt%, MnO 25.61 wt%, and H2O 22.77 wt% for a printed sum of 100.00
  wt%, where the four rounded constituent values sum to 99.99 wt%; Biagioni, Sejkora, and
  Dolnicek, 2026, European Journal of Mineralogy 38:531-543). Named in honour of Donato
  Belmonte (b. 1981), Associate Professor of Mineralogy at the University of Genoa,
  Italy, for his application of ab initio thermodynamic modelling to the mineral
  assemblages of the Ligurian Mn deposits and rodingitic rocks. Discovered in a sample
  collected more than 30 years earlier on the dumps of the Gambatesa mine (44 deg 21 min
  34 sec N, 9 deg 26 min 59 sec E), Graveglia Valley, Ne, Genoa Province, Liguria, Italy
  (which exploited braunite ore bodies near the base of the Upper Jurassic "Diaspri di
  Monte Alpe" Formation metachert sequence overlying Middle Jurassic northern Apennine
  ophiolites and is also the type locality for cavoite, gravegliaite, poppiite, reppiaite,
  saneroite, and vanadomalayaite). Occurs in vugs of a carbonate vein associated with
  tennantite-(Cu), calcite, luzonite, and bluish spherulae of an unidentified
  mahnertite-like (Ca,Cu)-arsenate-chloride secondary phase, formed during circulation of
  As-rich oxidizing fluids in the late-stage evolution of the Mn ore deposit; the
  holotype specimen is deposited in the mineralogical collection of the Dipartimento di
  Scienze della Terra dell'Ambiente e della Vita (DISTAV), University of Genoa, Italy,
  under catalogue number MO720, and the grain used for single-crystal X-ray diffraction
  is kept in the Museo di Storia Naturale, University of Pisa, Calci (Pisa, Italy), under
  catalogue number 20076. Forms aggregates up to 0.5 mm in length of thin tabular
  crystals, white in colour, with a white streak, silky lustre, transparency, brittle
  tenacity, perfect {010} cleavage, no fluorescence under short- or long-wave UV
  radiation, calculated density Dcalc = 2.677 g/cm3 (from the empirical formula and
  single-crystal unit-cell parameters), and a Gladstone-Dale calculated mean refractive
  index n = 1.578 (optical properties and direct density were not measured owing to the
  scarcity of material). Micro-Raman spectroscopy (532 nm green diode-pumped solid-state
  laser at 2.5 mW, Horiba Jobin-Yvon XploRA Plus spectrometer with 50x objective and 1200
  gr/mm grating; Figure 2, Section 3, p. 533) shows a strong AsO4 stretching band at 839
  cm-1 with shoulders at 815 and 891 cm-1 (nu1 and nu3 modes), weaker AsO4 bending bands
  at 336, 406, and 467 cm-1 (nu2 and nu4 modes), and O-H stretching bands at 2900-3700
  cm-1 confirming H2O groups. Wavelength-dispersive electron microprobe analysis (n = 8
  spot analyses, Cameca SX100 at the National Museum in Prague, 15 kV, 10 nA, 10 um beam
  diameter on a polished crystal surface; Na, P, Mg, Si, Pb, S, Cl, Sr, Fe, Zn, F, N, V,
  and Cr were below detection limits; Table 1) yielded (mean wt%, range, e.s.d., and
  value normalized to 100.00 wt% with stoichiometric H2O) As2O5 48.57 wt% (45.93-50.35,
  SD 1.71; normalized 41.60 wt%), MnO 29.94 wt% (28.85-30.35, SD 0.49; normalized 25.65
  wt%), CaO 10.12 wt% (9.75-10.40, SD 0.22; normalized 8.67 wt%), CuO 1.28 wt%
  (1.00-1.64, SD 0.22; normalized 1.10 wt%), Al2O3 0.22 wt% (0.08-0.69, SD 0.20;
  normalized 0.19 wt%), K2O 0.10 wt% (0.04-0.18, SD 0.05; normalized 0.08 wt%), and
  H2Ocalc 26.51 wt% (normalized 22.71 wt%), for an unnormalized total of 116.74 wt%
  (reflecting partial dehydration under vacuum and electron-beam instability) and
  normalized total of 100.00 wt%. On the basis of 15 O atoms per formula unit and the
  crystal-structure analysis, the empirical formula is
  (Ca0.86Mn0.11K0.01)Sigma0.98(Mn1.90Cu0.08Al0.02)Sigma2.00As2.01O8*7H2O. Crystallizes in
  the orthorhombic system, centrosymmetric space group Cmce (#64), with single-crystal
  X-ray diffraction unit-cell parameters a = 8.8418(9) A, b = 23.031(2) A, c =
  13.5270(14) A, V = 2754.6(5) A3, and Z = 8 (refined from 29,235 measured and 1507
  unique reflections collected at 300(2) K on a 0.100 x 0.050 x 0.030 mm crystal using
  microfocus MoKalpha radiation on a Bruker D8 Venture diffractometer to R1 = 0.0385 for
  1195 reflections with F > 4sigma(F), R1 = 0.0525 for all data, wR2 = 0.1047, Goof =
  1.069, 129 parameters, Table 3; Gandolfi-like microfocus CuKalpha powder X-ray
  diffraction on the same diffractometer, refined with Burnham's least-squares program,
  yielded a = 8.854(7) A, b = 23.02(2) A, c = 13.533(13) A, V = 2759(3) A3, Section 5.1,
  p. 533; note that Table 2 on p. 537 prints two column headers as "d*calc" instead of
  "d*calc" and "dcalc" and misprints d*calc = 2.224 A for reflection (0 4 5) alongside
  dobs = 2.446 A and dcalc = 2.449 A, where the true powder-cell spacing is 2.450 A).
  The crystal structure (Tables 4-7 and Figures 3-7) consists of {010} Mn4O10(H2O)4
  layers (topologically analogous to those in switzerite, metaswitzerite, and
  castellaroite) formed by Mn(1)O4(H2O)2 octahedra (Mn(1) at 16i, BVS = 2.04 v.u.)
  decorated on both sides by As(1)O4 (8f, BVS = 5.18 v.u.) and rotationally disordered
  As(2)O4 (8f, split O(7a)/O(7b) and O(8), BVS = 5.08 v.u.) tetrahedra and connected to
  [100] rods of half-occupied seven-fold-coordinated Ca(2)O3(H2O)4 polyhedra (16i, s.o.
  Ca0.50, BVS = 1.87 v.u., 2.18 v.u. in ordered configuration no. 1) and H-bonded H2O
  molecules (Ow(9) and Ow(12a)). The eight strongest observed powder X-ray diffraction
  lines (dobs in A (Iobs; hkl), Table 2) are 11.6 (s; 0 2 0), 8.9 (mw; 0 2 1), 7.1 (mw; 1
  1 1), 5.37 (mw; 1 3 1), 3.51 (mw; 2 4 0, 1 5 2), 3.049 (mw; 2 2 3), 2.905 (mw; 0 4 4, 2
  6 0), and 2.684 (mw; 2 0 4, 3 1 2). No biological or microbial interaction data are
  reported in the type mineralogical description.
