mechanisms:
- id: sulfur_oxidizing_culture_associated_zinc_mobilization
  name: Culture-associated zinc mobilization during repeated reactor cycles
  process: bioleaching
  description: A living culture assigned by the authors to Acidithiobacillus thiooxidans, supplied with elemental sulfur, was associated with acidification, sulfate accumulation and filtered-liquid zinc in serial laboratory reactor cycles. Iron was less extensively mobilized under the tested conditions. The evidence supports conditional solubilization in an acidic culture system, without proving a unique cellular dissolution pathway, isolated zinc recovery, validated residue reuse or industrial deployment.
  context: Frueholz et al. (2025) used actual cast-house dust from an Austrian steelmaking company, with reported dry mass 99.9%. Drying a characterization aliquot at 105 degrees C does not establish pretreatment of the whole feed; dust sterilization is not specified. The paper does not report a strain accession, culture-collection origin or independent stock authentication. Precultivation used sulfur-containing universal medium initially adjusted to pH 3.5 with sulfuric acid, 0.02 g/L yeast extract and 1% w/v technical elemental sulfur. Reactor experiments used 2.7 L medium plus 0.3 L culture, a 3-L working volume, 30 degrees C and 160 rpm. Following seven days of cultivation, reported pH was 0.85 before the first dust addition. Loading progressed through 50, 75, 100 and 125 g/L in 14-day cycles. Each exchange removed two-thirds of the stirred contents, retaining 1 L with culture, liquid and residual solid, then restored 3 L with fresh medium, added dust and sulfur at a stated 7.5 g/L.
    Three successive 125-g/L cycles used 75 L/h air (0.42 vvm), followed by three at 90 L/h (0.50 vvm) in the same reactor. These are serial cycles, not six independent reactors. Samples were taken 30 minutes after dust addition, labeled day 0, and on days 7 and 14; liquid passed through 0.2-micrometre filters for total-element ICP analysis, with sulfate analyzed by ion chromatography. Controls used 100-mL uninoculated cultivation-medium batches at the four dust loadings; their reactor geometry, culture history and evolving acidity were not matched to the biotic reactor.
