id: cmmmech:kuliokite-y
name: Kuliokite-(Y)
material_kind: mineral
description: >-
  A natural yttrium-bearing aluminium fluorosilicate mineral, with current
  IMA formula Y4Al(SiO4)2(OH)2F5 and approval 1984-064. The accepted primary
  characterization is a 2025 re-investigation of Ploskaya Mountain, Kola
  Peninsula, Russia, material from the type locality, not an assertion that
  the analysed crystals are the original holotype. Wavelength-dispersive
  microprobe analyses of three crystals, each averaging 4–7 spots, show
  variable Yb and other heavy rare-earth contents; water was calculated
  from structural data rather than measured directly. A single-crystal
  refinement at 293(2) K supports monoclinic Im symmetry, replacing the
  triclinic interpretation discussed in the paper. The model used mixed
  Y/Yb scattering curves with total occupancy constrained to one for each
  Y site; those occupancies are not separate direct assays of every
  lanthanide at each site. Its seven-coordinate Y2 site was interpreted
  as favouring heavier REEs relative to eight-coordinate Y1. This is a
  crystal-chemical interpretation of natural material, not a demonstrated
  separation or recovery process. Only one hydrogen position was located;
  the F3 hydroxyl/fluoride ratio was fixed during refinement. The studied
  sample's idealized (OH)2.5F4.5 composition differs from the current IMA
  end-member formula. Suggested fluorokuliokite and hydroxykuliokite species
  remain hypothetical in this study and are not aliases or new records.
  The 1986 original descriptions and the 1993 natural-alteration study are
  contextual citations within the 2025 paper, not independently acquired
  evidence here. No criticality-list designation, microbial mechanism,
  laboratory synthesis, extraction yield or industrial deployment is asserted.
