mechanisms:
  - id: pma2_2_potassium_feldspar_dissolution
    name: PMA2-2 culture-associated aluminium mobilization from a potassium-feldspar feed
    process: bioleaching
    description: PMA2-2 cultures increased filtered Al concentrations relative to uninoculated potassium-feldspar-feed controls, with accompanying acidification. This is an Al-release assay; neither potassium release nor production of a feldspar or potash commodity was established by these measurements.
    context: 'Living Priestia megaterium PMA2-2, isolated from Dracaena cochinchinensis rhizosphere soil in Purple Mountain, Nanjing, China, was precultured in LB for 12 hours at 37 degrees C and 160 rpm, harvested, washed and resuspended in 0.85% NaCl. The other-mineral assays followed the dissolution protocol: triplicate 220 mL flasks with 60 mL sterilized glucose minimal medium, 0.60 g of 75-150 micrometre mineral feed and 0.2 mL of 10^8 cells/mL suspension, incubated at 37 degrees C and 160 rpm, with separate flasks for 12- and 24-hour endpoints. Medium preparation pH was 7.0; its stated composition was 0.015% MgSO4.7H2O, 0.05% Na2HPO4.2H2O, 0.025% (NH4)2SO4, 0.01% KNO3 and 0.5% glucose. Element measurements used ICP-OES after centrifugation and 0.45 micrometre polyethersulfone filtration of a 10 mL aliquot; these are operationally filtered total-element concentrations, without oxidation-state resolution. Feed origin, cleaning procedure and quantitative phase analysis were not specified
      in the inspected methods and supplement. Table S7 reports 19.24% Al2O3, 60.57% SiO2, 9.87% K2O and 4.51% Na2O, plus minor oxides, for this feed. These bulk data do not justify substituting a microcline, orthoclase or sanidine species identifier.'
