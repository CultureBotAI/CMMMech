limitations:
- No isolated causal experiment of iron valence, replicate-level raw observations,
  complete phase balances or recovered titanium product is established.
- Supplier names in methods and acknowledgments differ without lot mapping; the owner
  follows methods. Table 1 unusual Al2O5 label and printed HCl concentration equivalents
  are not adopted as corrected chemical measurements.
- The reviewer did not re-fit kinetic/XANES data, authenticate industrial feed lots
  or adopt deferred microbial studies.
- Bounded source/notice/dedup searches are not exhaustive; publisher landing access
  failed with HTTP 429 while complete originalPDF and saved authority metadata were
  inspected.
