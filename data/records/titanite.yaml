id: cmmmech:titanite
name: Titanite
material_kind: mineral
description: Titanite is the calcium titanium silicate mineral with ideal formula CaTiO(SiO4), also written CaTiSiO5. The September 2026 IMA-CNMNC list records approved status A and the special-procedure token 1967 s.p.; this is not a numbered IMA proposal. Sphene is a historical name used in the processing literature. This species is distinct from elemental titanium, titanium metal, TiO2 polymorphs and titanite-bearing ore or flotation-tail mixtures. A primary laboratory study supports hydrochloric-acid decomposition of a titanite-rich mixed concentrate and formation of a titanium/silica solid, with important feed and analytical limitations. Criticality, microbial activity and industrial recovery performance are not inferred.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Titanite row PDF page 218; status and special-procedure definitions page 1. Current official landing page and dated PDF checked.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-16'
- id: gerasimova2020
  title: Gerasimova LG, Nikolaev AI, Shchukina ES, Maslova MV (2020). Titanite-Containing Mineral Compositions and Their Chemical Treatment with Preparation of Functional Materials. Materials 13:1599. DOI 10.3390/ma13071599. Complete eleven-page original inspected; feed/preparation pp. 3-5, Table 2 and Figures 3-5; separate pigment and filler treatments pp. 6-9, Figures 6-9 and Tables 3-4.
  url: https://doi.org/10.3390/ma13071599
  accessed_on: '2026-10-16'
mechanisms:
- id: abiotic_hydrochloric_decomposition
  name: Acid decomposition of a titanite-rich concentrate
  process: other
  description: Heated concentrated hydrochloric acid decomposed a titanite-rich mixed concentrate. The authors report calcium partitioning to the liquor and a titanium/silica precipitate designated DTK. Figure 5 assigns diffraction peaks to anatase and rutile; silica is described as amorphous. This supports a bounded abiotic processing observation, not complete selective extraction, pure TiO2 recovery or a quantified recovery yield. The later calcined filler and mechanically modified pigment are separate treatments.
  context: The 2020 feed is described as a 0.5-1.5 mm sand fraction after nepheline flotation, containing titanite plus several other minerals. Section 2.1 also refers to ore blocks ground below 40 micrometres; Section 2.2 describes one-hour ball milling at media:concentrate 5:1. The precise relation between these preparation descriptions is unclear. Dilute HCl cleaning used 30 or 50 g/L, solid:liquid ratios 1:3 or 1:4, and 20 or 40 degrees C. The text gives three hours whereas Table 2 gives two hours. Filtering, washing and drying at 105 degrees C produced a concentrate reported as approximately 80% titanite. For subsequent decomposition, concentrate was added to 32% HCl preheated to 80 degrees C at solid mass:acid volume 1:3, heated to boiling and mixed for five hours with vapour return, followed by four hours of vapour stripping and condensation. Boiling temperature, charge scale, independent batch replication and a complete product mass balance are not reported. No organisms were used.
  microbial: false
  evidence:
  - source_ref: gerasimova2020
    supports: support
    explanation: Methods pp. 3-5 describe the mixed feed, cleaning and hot-HCl treatment. The DTK pattern in Figure 5 and product description in Section 3.2 support formation of a TiO2/silica solid. The reported dilute-acid resistance of titanite in Section 3 is condition-specific and does not conflict with decomposition under the subsequent stronger, boiling-acid conditions.
  - source_ref: gerasimova2020
    supports: partial
    explanation: Table 2 gives concentrate compositions rather than extraction fractions. The conclusion's approximately 90 wt% Ti/Si extraction and fivefold-yield claim are not adopted without a displayed stream mass balance. The paper inconsistently attributes feed chemical composition to FTIR and solid phase identity to XRF, although separate XRD and XRF instruments are described. The two-versus-three-hour cleaning discrepancy remains unresolved. Its pilot pigment-production statement in Section 3.1 does not establish deployment of the acid decomposition route. Figure 9 labels particle diameter in nm while the text reports micrometres; no particle-size performance claim is curated here.
