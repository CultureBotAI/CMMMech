id: cmmmech:szomolnokite
name: Szomolnokite
material_kind: mineral
description: >-
  Szomolnokite is the monoclinic ferrous sulfate monohydrate mineral,
  Fe(II)(SO4)·H2O, distinct from tetrahydrate rozenite and heptahydrate
  melanterite. The September 2026 IMA list recognizes it as a grandfathered
  species. The accepted laboratory experiment follows diffraction-assigned
  szomolnokite as a transient product during heating of a natural
  melanterite-rich powder. The same experiment supports the separate
  rozenite record; these records do not constitute independent experimental
  replication. Phase fractions and thermal mass losses are not isolated
  mineral recovery yields, and no microbial transformation is established.
