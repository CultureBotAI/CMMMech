      display anchor (INP) in the engineered INP-silaffin fusion expressed in Escherichia coli BL21(DE3)/pET28a-INP-silaffin.
    annotation_note: Recombinant INP-silaffin fusion expressed in Escherichia coli BL21(DE3) (NCBITaxon:469008);
      N-terminal INP anchor originates from Pseudomonas syringae pv. syringae InaZ (UniProtKB:P06620,
      NCBITaxon:321).
    evidence:
    - source_ref: ping2016
      supports: support
      explanation: Provides the outer-membrane anchor domain displaying the fused silaffin peptide on
        the surface of recombinant E. coli cells for Ti precursor mineralization.
  - uniprot_accession: UniProtKB:Q9SE35
    entry_name: SIL1_CYLFU
    protein_name: Silaffin-1
