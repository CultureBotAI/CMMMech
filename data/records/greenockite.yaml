        description: Unsequenced enzymatic thiosulfate (10 mM) and sulfite (10 mM) reduction system active in anaerobic Thermoanaerobacter sp. X513 cultures at 65 C with 10 mM glucose (Moon et al., 2013); left UNGROUNDED because strain X513 has no proteome in UniProtKB and Moon et al. (2013) did not identify the specific thiosulfate/sulfite reductase genes.
        protein_grounding_status: UNGROUNDED
