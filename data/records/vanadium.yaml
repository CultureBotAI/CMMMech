      explanation: In the Shewanella oneidensis MR-1 bioelectrochemical reactor poised at -800 mV vs Ag/AgCl (T1_TableDefinitions.csv, T2_pH.csv), outer-membrane decaheme cytochrome OmcA (SO_1779) provides parallel extracellular electron transfer capacity at the cell/electrode interface during partial reduction and electrode partitioning of the dissolved V(V) feed (44.1 mg/kg V at Vbrr_0 to 34 mg/kg V at BESV.brr_END in T3_AqueousICPOES.csv).
  - source: oxidized_metal_substrate
    target: reduced_metal_product
    predicate: transforms_into
    relationship: reductive valence transformation and phase formation
    description: Bioelectrochemical reduction in the Shewanella oneidensis MR-1 reactor poised at -800 mV vs Ag/AgCl converts the dissolved V(V) feed into partially depleted aqueous V (34 mg/kg V at BESV.brr_END) and electrode-extractable V (Vbrr_WE) without an assigned endpoint solid phase in kane_2026_bes.
    evidence:
    - source_ref: kane_2026_bes
      supports: partial
      explanation: In kane_2026_bes, aqueous ICP-OES (T3_AqueousICPOES.csv) records partial vanadium depletion from 44.1 mg/kg V at post-equilibration baseline Vbrr_0 to 34 mg/kg V at biotic endpoint BESV.brr_END alongside working-electrode nitric-acid-extractable V (Vbrr_WE in T6), while abiotic poised-electrode controls depleted aqueous V from 19.1 mg/kg (BESVarr_0) to 12.2 mg/kg (BESVarr_END) and SEM-EDS on page 7 of the 7-page T9_SEM.pdf (labelled solids from V phosphate-buffered culturing medium rather than the BES electrode) detected C, O, Na, Cl, Ca, and Pt without a labelled V peak.
