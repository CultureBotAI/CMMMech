mechanisms:
- id: immobilized_lanmodulin_scandium_separation
  name: Cell-free lanmodulin capture and malonate elution of scandium
  process: separation
  microbial: true
  organisms:
  - id: NCBITaxon:408
    label: Methylorubrum extorquens
  description: Purified M. extorquens lanmodulin with a C-terminal GSGC addition, covalently attached
    to maleimide-functionalized agarose, retained Sc(III) from a synthetic rare-earth mixture. Malonate
    subsequently released Sc selectively. Microbial involvement denotes the bacterial origin and recombinant
    production of the protein; the separation itself was cell-free and chemically driven, without growth
    or metabolism.
  context: The cited preparation method expressed LanM-GSGC in Escherichia coli BL21(DE3), followed by
    protein purification and thiol-maleimide coupling; the expression host is distinct from the protein-origin
    species. Figure 5 used chloride-salt mixtures at pH 3, a 5 cm by 0.5 cm column, 0.9 mL bed volume,
    loading to a reported 70% capacity, a five-bed-volume water wash and the default 0.5 mL/min flow.
    The malonate scheme used 30 then 50 mM at pH 5. Mixed-metal effluents were analyzed by ICP-MS. Column
    breakthrough tests used one run; triplicate feed analyses quantify analytical variation rather than
    independent process replication. Column temperature was not specified in the inspected methods. This
    was a synthetic solution resembling selected leachate compositions, not a real ore, waste treatment
    run or industrial operation.
  evidence:
  - source_ref: dong2024
    supports: support
    explanation: Section 3.4 and Figure 5E-F report Sc elution above 99 mol% purity among REEs and above
      99% yield for the two-step malonate process. The Methods define yield as recovered target REE divided
      by total target REE loaded. This is an aqueous Sc fraction, not isolated metal or oxide. Figure
      3C independently shows selective Sc release from an approximately equimolar mixture at 30 mM malonate.
      Figure 4 uses soluble-protein fluorescence and circular dichroism as supporting binding assays;
      the reported picomolar affinity is a fitted, model-dependent apparent constant, not a recovery yield.
  - source_ref: dong2024
    supports: partial
    explanation: The citrate comparator in Section 3.4 gave about 96 mol% Sc purity at 78% yield and required
      stronger citrate for tailing Sc. Performance therefore depends on the desorption chemistry. Figure
      5 names a nominal 0.4 mM total-REE feed and refers to Table S9, but the appended supplement labels
      that feed Table S10; its 16 mean concentrations sum to 0.2430 mM, including Sc at 23.8 +/- 1.1 micromolar.
      These source inconsistencies are unresolved and no reconciled feed concentration or independently
      recomputed mass balance is asserted. A matched Sc-only resin-without-LanM column was not reported
      in the inspected study, limiting attribution of every contribution to binding. No general Sc separation
      efficiency across feedstocks is established.
  - source_ref: dong2021
    supports: context_only
    explanation: Supplement pages S2-S4 establish the recombinant expression, purification and immobilization
      protocol expressly referenced by Dong2024. Its maleimide-resin comparator and Nd experiments are
      methodological context, not a direct Sc control or Sc yield.
