    label: Aspergillus niger
  protein_examples:
  - uniprot_accession: UniProtKB:A0A254TZW7
    entry_name: CEXA_ASPNG
    protein_name: Citrate exporter A
    gene_symbol: cexA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:5061
      label: Aspergillus niger
    interpro_ids:
    - InterPro:IPR011701
    - InterPro:IPR020846
    - InterPro:IPR036259
    pfam_ids:
    - Pfam:PF07690
    functional_role: Plasma-membrane MFS citrate exporter CexA that secretes intracellularly synthesized citric acid into the extracellular medium, driving organic-acid acidification and metal mobilization.
    annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:A0A254TZW7 (CEXA_ASPNG) for Aspergillus niger (NCBITaxon:5061).
    evidence:
    - source_ref: king_1985
      supports: partial
      explanation: Representative Aspergillus niger citrate exporter CexA for organic-acid excretion during surface pitting and Al mobilization from Bancroft nepheline discs in King (1985); transporter genes were not characterized in the 1985 thesis.
  evidence:
  - source_ref: king_1985
    supports: support
    explanation: Section 2.3.4, printed pages 125-133 (PDF pages 133-141), and Figures 2.21-2.25 show fungal mats, hyphae associated with the altered surface, greater pitting for the CMI 31821 Bancroft treatment than the near-zero blank trace, and a positive relationship between pitting and aluminium release. Section 2.2 and Tables 2.4/2.7 establish the specimen's nepheline-rich but mixed mineralogy. No plotted values are digitized or asserted as exact yields.
  - source_ref: king_1985
    supports: partial
    explanation: One destructively sampled disc per time point and a single stated blank per material do not establish replicated effect sizes or uncertainty intervals. Figure 2.25 presents one generic blank trace without separately resolving the materials' blanks. The second strain is CMI 243400 in Table 2.8 and section 2.3.4, but the Figure 2.25 legend prints CMI 234300. Its identity is unresolved; no exact second-strain performance claim is adopted. Nepheline fraction estimates differ between analytical methods, and other Al-bearing phases occur, so whole-disc aluminium release is not a nepheline-specific mass balance.
  - source_ref: king_1985
    supports: partial
    explanation: Organic-acid production and mineral-contact observations motivate an acid-mediated weathering interpretation, but this disc experiment does not isolate proton attack, ligand effects and physical interaction using matched acid, pH or killed-biomass controls. The reported gel coating and attached hyphae are not independent proof of a particular molecular pathway. Other thesis chapters' kinetic models, semi-continuous equipment and economic projections are outside this curated assay and do not establish industrial deployment.
  - source_ref: ncbi_niger
    supports: context_only
    explanation: Taxon 5061 resolves the source's species name, not the historical strain stocks. CMI 31821 is retained as reported; no genome, strain-specific taxonomy identifier or modern sequence authentication is inferred.
