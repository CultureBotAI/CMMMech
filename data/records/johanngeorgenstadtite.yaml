id: cmmmech:johanngeorgenstadtite
name: Johanngeorgenstadtite
material_kind: mineral
description: >-
  Johanngeorgenstadtite (IMA 2019-122) is an IMA-accepted anhydrous nickel(II)
  arsenate mineral with September 2026 IMA-CNMNC Master List ideal formula
  Ni2+4.5(AsO4)3 (PDF p. 105, status A; ideal composition NiO 49.37 wt%, As2O5
  50.63 wt%, total 100 wt%), representing the monoclinic unprotonated
  alluaudite-type dimorph of tetragonal garnet-like niasite (IMA 2019-105,
  Ni2+4.5(AsO4)3, I-42d) and the natural analogue of synthetic Ni4.5(AsO4)3.
  Described by Kampf, Nash, Plášil, Smith, and Feinglos (2020) on a single museum
  specimen (American Museum of Natural History holotype catalogue no. 17956,
  approximately 4.5 x 4 x 2.5 cm, also cotype of niasite) from Johanngeorgenstadt,
  Erzgebirge, Saxony, Germany, where it formed as a secondary oxidation product
  from the breakdown of primary nickeline (niccolite) under dry, oxidizing
  conditions (possibly influenced by 17th-century underground fire-setting) in
  association with niasite, aerugite, bunsenite, quartz, rooseveltite, and
  xanthiosite (pp. 373–375, Fig. 4). Occurs as sugary aggregates of pink-orange
  irregular, rounded grains or short prisms about 70 um in diameter with no
  discernible crystal forms or twinning, pale-pink streak, transparent with
  resinous to subadamantine lustre, non-fluorescent under long- or short-wave UV,
  estimated Mohs hardness ~5, brittle tenacity with curved and stepped fracture,
  multiple cleavage planes probably corresponding to {010}, {110}, and {1-10} by
  analogy with other alluaudite-group minerals, rapid loss of colour and slow
  dissolution in dilute HCl at room temperature, and calculated density Dcalc =
  4.801 g/cm3 for the empirical formula and 4.808 g/cm3 for the ideal formula on
  the single-crystal unit cell (Section 3.2, p. 376; Table 3 on p. 380 reports Dx =
  4.880 g/cm3 for the refined cell contents Ni4.61(AsO4)3). Optically biaxial (–)
  in white light with refractive indices alpha = 1.83(1), beta = 1.86(1), gamma =
  1.88(1), 2Vmeas = 78(1)°, 2Vcalc = 77.3°, distinct pleochroism X violet > Y
  light olive > Z yellow, and Gladstone–Dale compatibility 1 - (Kp/Kc) = -0.056
  (good) for the empirical formula and -0.055 (good) for the ideal formula
  (Section 3.2, p. 376). Micro-Raman spectroscopy (532 nm laser, Section 4, pp.
  376–377, Fig. 5) confirms the absence of O–H/H2O bands (featureless from 4000
  to 1000 cm-1) and exhibits a dominant doublet at 850 and 802 cm-1 (overlapping
  nu3 antisymmetric and nu1 symmetric AsO4 stretching; weak shoulder at 723
  cm-1), broad bands at 608 and 525 cm-1 (split nu4 AsO4 bending), low-intensity
  bands at 481 and 397 cm-1 (nu2 AsO4 bending), a composite band at ~318 cm-1
  (Ni–O stretching), and lattice/M–Ox modes at 253, 210, 182, 150, and 103 cm-1.
  Mean of 5 WDS electron-microprobe point analyses on 4 crystals (Cameca SX-50,
  15 kV, 20 nA, 5 um beam; Section 5, p. 377, Table 1) yielded NiO 39.12 wt%
  (range 38.71–39.60, SD 0.34), CoO 8.23 (7.84–8.52, SD 0.28), CuO 1.54
  (1.47–1.61, SD 0.05), As2O5 51.12 (49.74–52.12, SD 0.94), with Na2O, Ag2O,
  FeO, and Al2O3 below detection limit, total 100.01 wt%, giving on the basis of
  12 O apfu the empirical formula (Ni2+3.56Co2+0.75Cu2+0.13)Sigma4.44As3.02O12
  and simplified formula (Ni2+,Co2+,Cu2+)4.5(AsO4)3. Monoclinic, space group C2/c
  (no. 15), Z = 4 (Sections 6 and 7.2, pp. 377–385, Tables 2b, 3, 4b, 5b, 6b,
  Fig. 8): single-crystal MoKalpha XRD refinement on a 40 x 30 x 20 um crystal
  (Rigaku R-Axis Rapid II; printed as "40 mm x 30 mm x 20 mm" in Table 3 on p.
  380 via a mm-for-um unit typo; 355 reflections with Io > 2sigma(I) out of 438
  unique, 1868 collected, Rint = 0.086, R1 = 0.0375, wR2 = 0.0869, R1(all) =
  0.0494, wR2(all) = 0.0957, GoF = 1.067) yields a = 11.933(3) Å, b = 12.753(3)
  Å, c = 6.6956(17) Å, beta = 113.302(8)°, V = 935.9(4) Å3, with kinked chains of
  edge-sharing M1O6 (<M1–O> = 2.113 Å, BVS = 1.85 v.u.) and M2O6 (<M2–O> = 2.061
  Å, BVS = 2.16 v.u.; six-bond octahedral averages printed as "<M1–O4>" and
  "<M2–O4>" in Table 5b on p. 382) octahedra cross-linked by As1O4 (<As1–O> =
  1.690 Å, BVS = 4.97 v.u.) and As2O4 (<As2–O> = 1.692 Å, BVS = 4.95 v.u.)
  tetrahedra to form [001] channels hosting fully occupied A1' (4e, square-planar
  <A1'–O> = 1.999 Å, BVS = 2.04 v.u. in Table 6b on p. 383 vs 2.03 v.u. in
  Section 7.2 prose on p. 384) and partially occupied A2 (occupancy 0.140(15), 8
  bonds, <A2–O> = 2.596 Å, BVS = 0.14 v.u.) and A2' (occupancy 0.470(16), 4+2
  bonds, <A2'–O> = 2.178 Å, BVS = 0.50 v.u. in Table 6b vs 0.49 v.u. in Section
  7.2 prose); Gandolfi-like MoKalpha powder XRD (Table 2b, p. 379) shows eight
  strongest observed reflections [d in Å (Iobs; hkl)] at 2.660 (100; -241, 400),
  3.162 (54; -131, -312), 3.095 (44; 221), 2.559 (43; -402, -222, -332), 1.621
  (36; -552, -711, -334), 3.428 (34; 310), 1.547 (33; 442, -713, 550, -643), and
  4.236 (29; 220). Distinct from tetragonal dimorph niasite, aerugite,
  xanthiosite, and elemental nickel, cobalt, or arsenic; no criticality
  designation for johanngeorgenstadtite itself, no microbial or biological
  mechanism, and no industrial recovery yield are asserted.
