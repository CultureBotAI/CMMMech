mechanisms:
  - id: tk2d_sr_biomineralization
    name: Culture-associated strontium removal into carbonate-rich precipitates
    process: biomineralization
    description: Bacillus sp. TK2d cultures removed Sr from the filtered liquid fraction and produced extracellular Sr- and Ca-bearing precipitates. Electron diffraction supported aragonite-like carbonate material, while Sr XANES fits supported a changing mixture of SrCl2-like and SrCO3-like local environments. Ureolysis and cell-surface association are consistent contributors, but an obligatory molecular pathway and a pure strontianite product are not established. The result concerns a defined laboratory salt medium, not treatment of radioactive wastewater or an isolated strontium product.
    context: 'Horiike et al., Medium and cultivation conditions and Sr removal test: marine broth 2216 at 3.74 g/L (described as 10% broth), final NaCl 30 g/L, autoclaved then filtered through 0.45 micrometre pores, supplemented with urea at 20 g/L and 1.0 mM Sr as SrCl2. A 0.5 mL, OD600 0.1 preculture inoculated 50 mL in a 100 mL flask, incubated at 30 degrees Celsius and 120 rpm in triplicate. Parallel salinity tests used source-labelled 0.3%, 3%, 5% and 10% NaCl. The isolation plate was set to pH 7.6; the paper does not provide a time-resolved broth pH series or a pH-matched abiotic arm. Daily aliquots were centrifuged at 21,000 x g for 5 min; the ICP-AES procedure included 0.2 micrometre filtration and triplicate analytical readings per sample. The two centrifugation descriptions specify 4 and 20 degrees Celsius, respectively; their relationship is not resolved. Uninoculated Sr-containing medium was the negative control. Microscopy, diffraction and XANES examined collected solids at
      different times; these are not measurements of one identical final sample. Reagent SrCl2 was used with no radionuclide activity stated; the Discussion explicitly leaves actual contaminated seawater and 90Sr tests for future work.'
    microbial: true
