mechanisms:
- id: brine_vaterite_mixed_precipitate
  name: Vaterite assigned in ureolytic geothermal-brine treatment solids
  process: biomineralization
  microbial: true
  organisms:
  - id: NCBITaxon:1474
    label: Sporosarcina pasteurii
  description: Prepared S. pasteurii DSM 33 biomass with urea generated mixed carbonate-bearing solids
    during treatment of one natural geothermal brine. The authors assigned vaterite together with calcite
    and magnesite by powder XRD. This mineral-level observation shares the Rehmanji2025 experiment with
    cmmmech:calcite and cmmmech:lithium-bearing-geothermal-brine; those records are not independent replications.
    It does not identify the proportion of Ca, Mg, Mn or Sr entering vaterite, demonstrate a pure vaterite
    yield, establish a vaterite-to-calcite transformation sequence, or recover lithium into a separate
    product.
  context: 'DSM 33 cells were grown in TSB with 500 mM urea at 28 degrees C and 180 rpm, harvested in
    mid-log phase at 3200 g for 15 min and PBS-washed. Unsterilized natural brine from an unnamed Cornish
    geothermal project was treated under reported non-growth conditions: 100 mL in 250 mL flasks, initial
    OD600 0.05-0.4, 500 mM added urea, 28 degrees C, static for 24 h, in triplicate. The source-designated
    B. subtilis ATCC-2385 comparator and a separate brine-plus-urea/no-added-cell arm provide treatment
    comparisons, but no matched-pH chemical or killed-cell phase-control series is reported. The comparator
    strain designation remains unverified. Section 4.6 sampled 15 mL at 24 h, centrifuged at 3200 g for
    15 min and dried the pellet at 60 degrees C for 24 h for XRD; the reported dry-pellet quantity is
    not a mass-balance mineral yield. Phase assignments concern processed mixed solids, without quantitative
    refinement or an in situ phase time course. Cow-urine/CaCl2 assays and spent-yeast biomass cultivation
    are separate arms. Laboratory flask treatment and slurry tests do not establish industrial deployment.'
  evidence:
  - source_ref: rehmanji2025
    supports: support
    explanation: Sections 2.1-2.2, 4.1-4.2 and 4.5-4.7 and Figures 1-2 support prepared biomass, the natural-brine
      experiment, carbonate-bearing solids and ex situ characterization. The narrow claim is vaterite's
      source-assigned presence in the mixed treatment product; morphology of an individual particle alone
      does not identify its polymorph.
  - source_ref: rehmanji2025_si
    supports: support
    explanation: Figure S7 (p. 24) explicitly labels vaterite as phase 1 alongside calcite and magnesite.
      Table S1 describes the brine composition; the XRD operating table is on p. 5 with its S5 caption
      on p. 6. Figure S5 (pp. 21-22) is the separate no-added-cell comparison. These observations are
      not pure-phase mineral yields.
  - source_ref: rehmanji2025
    supports: partial
    explanation: The main text misreferences the XRD plot as S6, which actually shows growth and pH. Its
      initial 10-minute claim conflicts with Figure 1's hour axis and Section 4.2's hour sampling schedule.
      Mg/Mn percentage claims do not consistently match Figure 1, whose B. subtilis Mn series also declines.
      No removal percentage or ten-minute rate is assigned to vaterite. Section 4.4 does not clearly specify
      solid/liquid separation for each ICP-OES metal aliquot, preventing a stronger dissolved-only interpretation.
  - source_ref: rehmanji2025_si
    supports: partial
    explanation: Figure S5's inoculated Mn/Sr series differs from Figure 1 and is not pooled with it.
      Table S7 saturation indices differ from the ranges quoted in Section 2.2, including negative magnesite
      entries; modeled saturation cannot confirm a mineral phase. Table S2 omits the Li wavelength and
      S9 labels aqueous Li retention as recovery. No lithium product, mineral-specific incorporation or
      conversion between mg/L and mg/kg is inferred.
