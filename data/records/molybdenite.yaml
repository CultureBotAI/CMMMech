  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. PDF page 146, Molybdenite row; page 1 column definitions and page 2 distribution terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: francisco2007
  title: Francisco Jr., Bevilaqua and Garcia Jr. (2007). Estudo da dissolucao oxidativa microbiologica de uma complexa amostra mineral contendo pirita (FeS2), pirrotita (Fe1-xS) e molibdenita (MoS2). Quimica Nova 30(5), 1095-1099. Complete publisher PDF, experimental methods and Figures 1-6.
