    relationship: inferred lower-potential inner-membrane cytochrome step in G. sulfurreducens extracellular electron transfer
    description: By analogy to established Geobacter sulfurreducens PCA EET physiology, CbcL is represented as a candidate lower-potential inner-membrane cytochrome pathway operating as redox potential shifts during progressive Fe(III) oxyhydroxide reduction; Cutting et al. (2009) did not test cbcL mutants.
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: Cutting et al. (2009) demonstrated progressive transformation of akaganeite to magnetite and goethite by wild-type Geobacter sulfurreducens with 10 microM AQDS but did not perform genetic or biochemical characterization of CbcL (GSU0274).
  - source: cbcl_cytochrome
    target: synthetic_akaganeite_substrate
    predicate: reduces
    relationship: AQDS-mediated microbial electron transfer reduces structural Fe(III) in synthetic akaganeite
    description: Extracellular electron transfer from Geobacter sulfurreducens in the presence of 10 microM AQDS reduces structural Fe(III) in synthetic akaganeite (~20% total Fe reduced to 0.5 N HCl-extractable Fe(II) over 19 days); because all biological incubations contained 10 microM AQDS, the assay does not isolate direct unshuttle-assisted electron transfer.
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: Cutting et al. (2009) Table 2 and Figure 2 show Fe(II) accumulation (~20% of total Fe at 19 days) in synthetic akaganeite suspensions incubated with G. sulfurreducens, 20 mM acetate, and 10 microM AQDS relative to abiotic controls, without an AQDS-free biological control.
  - source: synthetic_akaganeite_substrate
    target: acid_extractable_fe2
    predicate: produces
    relationship: Biogenic Fe(II) and reductive dissolution transform akaganeite into magnetite and minor goethite
    description: Reductive dissolution and Fe(II)-catalyzed recrystallization of synthetic akaganeite produce crystalline magnetite as the primary secondary mineral alongside minor goethite (~14% goethite and ~86% magnetite by 77 K Mossbauer spectroscopy at 9 weeks), without proving a purely solid-state topotactic pathway.
    evidence:
    - source_ref: levar_2017
      supports: partial
      explanation: XRD, TEM, and 77 K Mossbauer spectroscopy in Cutting et al. (2009) Table 2 and Figures 3-5 document conversion of synthetic akaganeite to magnetite (major) and goethite (minor), while dissolution-reprecipitation versus solid-state conversion contributions remain partially unresolved.
