id: cmmmech:cryptomelane
name: Cryptomelane
material_kind: mineral
description: Cryptomelane is a potassium-bearing manganese oxide mineral, with ideal formula K(Mn4+7Mn3+)O16
  in the September 2026 IMA list. The list marks it approved (A), with the literal number/year field
  "1982 s.p. ?"; this special-procedure notation is not a verified YYYY-NNN approval accession. It
  is distinct from manganese as an element, manganese ore as a mixed resource, and other tunnel manganese
  oxides. This record separates chemically prepared potassium-bearing cryptomelane-assigned products
  from the cryptomelane-like domains of a sodium-rich synthetic analogue. Neither experiment below
  establishes microbial cryptomelane production. No manganese or nickel commodity criticality is
  inherited.
