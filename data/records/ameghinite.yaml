id: cmmmech:ameghinite
name: Ameghinite
material_kind: mineral
description: >-
  Ameghinite is the approved sodium-borate mineral NaB3O3(OH)4,
  IMA1966-034, in the September 2026 IMA-CNMNC list. The original
  Tincalayu, Salta, Argentina specimens contained ameghinite nodules
  separated from surrounding borax by tincalconite. The 1967 chemical
  aliquot retained an optically estimated two percent tincalconite;
  its analysis is not a pure end-member composition. Dal Negro,
  Martin Pozas and Ungaretti's 1975 single-crystal study established
  a C2/c structure with isolated triborate units, each containing
  one boron tetrahedron and two triangles, linked through sodium
  coordination and hydrogen bonds. Hydrogen positions were found
  in difference-Fourier maps; the study did not supply a new bulk
  chemical assay of its fragment. The distinct sodium hexaborate
  tetrahydrate produced in Xiong et al.'s 2017 borax experiments
  was described as an ameghinite polymorph and possible precursor,
  not as experimentally demonstrated formation of ameghinite.
  This mineral species is distinct from elemental boron and the
  borates commodity; criticality and microbial activity are not inferred.
