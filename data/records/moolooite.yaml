id: cmmmech:moolooite
name: Moolooite
material_kind: mineral
description: >-
  Moolooite is an approved copper oxalate mineral, IMA 1980-082, listed as
  Cu(C2O4).nH2O in the September 2026 IMA compilation. The variable hydration
  is retained rather than treating every specimen as a measured monohydrate.
  It is distinct from elemental copper, other copper oxalates such as
  wheatleyite, and the heterogeneous ore used in the experiment below.
  No criticality designation is inherited from copper.
sources:
- id: ima_2026_09
  title: >-
    IMA-CNMNC. The New IMA List of Minerals, September 2026. Moolooite row,
    PDF page 147; introductory column definitions and distribution terms.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: frank_kamenetskaya2021
  title: >-
    Frank-Kamenetskaya et al. (2021). Copper oxalate formation by lichens and
    fungi. Scientific Reports 11:24239. Complete nine-page article, Materials
    and methods, Results, Discussion, Figures 1-6 and Supplementary Tables S1-S3.
  url: https://doi.org/10.1038/s41598-021-03600-5
  accessed_on: '2026-10-11'
- id: ncbi_niger
  title: NCBI Taxonomy 5061. Aspergillus niger, species node.
