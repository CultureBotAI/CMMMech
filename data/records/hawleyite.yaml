mechanisms:
  - id: x513_cds_formation
    name: X513-associated formation of a hawleyite-assigned CdS component
    process: biomineralization
    description: 'Thermoanaerobacter sp. X513 cultures formed synthetic CdS with a cubic hawleyite-assigned component. In the thiosulfate time course, the initial cubic product was followed by a cubic/hexagonal mixture, while the displayed cysteine preparation was assigned only to the cubic phase. Sulfide generation by the culture and precipitation from cadmium salts are distinguished from a claim of unique biological mineral formation: the separate inorganic sulfide reference also formed cubic CdS.'
    context: 'Moon2013 Materials and methods, Synthesis of CdS NP, and Results, Mechanism of CdS NP formation: the displayed experiments used Thermoanaerobacter sp. X513, not the separately mentioned TOR-39. Anaerobic modified TOR-39 medium at 65 degrees C contained 10 mM glucose, 10 mM thiosulfate or sulfite and normally 2% by volume mid-log culture. Bicarbonate was kept low to limit otavite, but the complete modified medium recipe is not reproduced. The duplicate 10-mL time course used 24 h pre-growth with thiosulfate, then 0.4 mM CdCl2 per day for ten days, sampling from 5 min through 240 h after dosing began. Separate phase comparisons used total nominal Cd doses of 4.45 or 8.90 mM over ten days. These are supplied soluble cadmium salts, not leaching of natural CdS ore. General methods add 24 h after the final dose before harvest; this is not substituted for the explicitly sampled time-course endpoints. XRD samples were repeatedly washed/centrifuged, with cell pellets scraped off, then
      mixed with methanol on a silicon plate. Some suspensions received dithionite during preparation/storage. Live cells are present during production, but washing does not prove a sterile product. NCBITaxon:573062 is the X513-labelled entry at species rank, not a general species-level claim about all Thermoanaerobacter or an authentication assay on this experimental culture.'
