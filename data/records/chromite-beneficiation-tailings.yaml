mechanisms:
- id: thiooxidans_acid_associated_leaching
  name: Sulfur-fed culture-associated acidification and element release
  process: bioleaching
  description: Living source-labelled A. thiooxidans DSM 9463 cultures maintained acidic conditions and were associated with release of Fe, Ni, Mn and Al from the mixed fresh tailings. Sulfur oxidation and resulting acid production are the proposed principal explanation. This is not evidence of selective chromite destruction, direct microbial iron oxidation or an isolated chromium recovery product. Initial Cr mobilization also occurred without inoculation and is associated with medium phosphate.
  context: Laboratory duplicate batches at 5, 10 and 30 g tailings/L, in cotton-plugged 500 mL reactors at 30 degrees C and 190 rpm, with 1% v/v pregrown culture. Material was autoclaved at 121 degrees C for 20 min. The medium contained, per litre, 2 g (NH4)2SO4, 0.25 g MgSO4.7H2O, 0.1 g K2HPO4 and 0.1 g KCl, with elemental sulfur printed as 11% wt/v; that unusual reported dose is retained without correction. The medium was initially adjusted to pH 3.5; inoculated reactors subsequently shown in Figure 3 average about pH 1.6, whereas uninoculated medium controls have higher, loading-dependent pH. Controls contained sterile tailings and medium, and blanks sterile tailings and distilled water; both received sodium azide. Separate chemical comparisons used acidified water at initial pH 2 and 30 g/L. Each 20 mL sample withdrawal was replaced with fresh sterile medium. Filtered 0.45 micrometre leachates were acidified with 16 N HNO3 reagent and analyzed by ICP-AES/HR-ICP-MS; final acid concentration
    is not given. Fe speciation used ferrozine. Reported errors are standard deviations of duplicate experiments. Methods list sampling through day 30, whereas results and supplementary tables use day 34; exact scheduling remains inconsistent. Working liquid volume, tested particle-size distribution and cumulative withdrawal/replacement correction are not established. Reported mg element/kg tailings quantities are extraction-normalized results, not recovery yields or leachate mg/L.
