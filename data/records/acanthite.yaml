    functional_role: Assimilatory/dissimilatory-type hemoprotein sulfite reductase beta-subunit CysI (PST_2236) catalyzing reduction of sulfite to sulfide (H2S), representing endogenous sulfide generation in Stutzerimonas stutzeri.
    annotation_note: 'Grounded to Stutzerimonas stutzeri A1501 reference proteome UP000000233 (NCBITaxon:379731; UniProtKB organism string: Stutzerimonas stutzeri (strain A1501); cysI / PST_2236) as an orthologous species-level proxy for unsequenced historical silver-mine isolate AG259 (mechanisms[].organisms[].id NCBITaxon:316) in Klaus et al. (1999).'
    evidence:
    - source_ref: klaus1999
      supports: partial
      explanation: Klaus et al. (1999) interpret the small number of periplasmic monoclinic Ag2S (acanthite) particles in Figure 3b as arising from reaction of silver with bacterially produced H2S, but H2S flux, sulfur source, and cysI activity were not measured in this experiment.
  evidence:
  - source_ref: klaus1999
    supports: support
    explanation: Results and Discussion and Figure 3b identify a periplasmic particle type with an Ag-to-S atomic proportion of about 2 to 1 by EDX and diffraction spots assigned to the 030 and minus-1 minus-2 4 planes near the 401 zone axis of monoclinic acanthite. The authors report that the different crystal types were found in both whole cells and thin sections. Phase assignment uses diffraction together with composition; particle shape or nominal Ag2S composition alone is not the basis of this record. Figures 1 and 2 show cellular association and diverse particle morphologies, without assigning every visible particle to acanthite.
  - source_ref: klaus1999
    supports: partial
    explanation: The paragraph describing Figure 3b calls the Ag2S particles a small number, without a counted fraction, bulk phase quantification, isolated product mass or silver mass balance. Figure 3a supports elemental Ag, whereas Figure 3c remains structurally unresolved despite an Ag-rich EDX spectrum. The reported overall particle size range is shared across crystal types and is not an acanthite-specific size distribution. The paper's introductory 25% dry-biomass silver figure comes from another study and is not a yield for AG259 in this experiment.
  - source_ref: klaus1999
    supports: partial
    explanation: The proposed reaction of silver particles with bacterially produced H2S is an interpretation relying on an earlier reference; H2S production, its sulfur source and a causal enzymatic pathway are not measured here. Efflux and silver-binding explanations are also proposed. The absence of a matched chemical-control series and a native-state time course prevents isolating a biological increment or excluding effects of sample processing. Fixed-cell microscopy does not establish that inactive biomass alone produces acanthite. Prospective coating applications and preliminary mixed-particle coating observations do not demonstrate acanthite-specific functionality or industrial recovery.
