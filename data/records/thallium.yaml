mechanisms:
- id: cn32_associated_tl_mobilization
  name: Thallium mobilization accompanying CN32-associated jarosite reduction
  process: redox_transformation
  description: Washed living CN32 cells were associated with ferrous-iron production and greater aqueous thallium release from synthetic Tl-bearing jarosite than cell-free and autoclaved-cell mineral controls. The reduced element demonstrated by the ferrozine assay is iron; direct thallium reduction is not established. Substantial thallium also dissolved abiotically. This supports a laboratory mobilization process, not thallium immobilization or isolated-product recovery.
  context: Synthetic nonideal Tl-jarosite, 0.0561 +/- 0.0097 g per tube, was exposed to 15 mL modified M1 medium in 20 mL tubes at 28 degrees C with 20 rpm end-over-end rotation in a 95% nitrogen/5% hydrogen anaerobic chamber. Medium contained 24 mM sodium lactate and 20 mM PIPES, initially pH 7.3, without added phosphate. Cells were grown aerobically at 32 degrees C, washed and divided into viable and autoclaved preparations; the reported 1.65 g wet cells per 2 L is not dry biomass. Mineral-containing tubes were sampled destructively in triplicate through nominal 893 hours; mineral-free live and cell-free controls were sampled in duplicate. Replicate tubes share prepared inoculum and do not establish independent culture-batch replication. Thallium was measured by ICP-OES after 0.2 micrometre filtration; this is a filtered elemental concentration, not a recovered product or a direct oxidation-state measurement.
