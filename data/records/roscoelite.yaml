mechanisms:
- id: abiotic_hydrothermal_synthesis
  name: Abiotic hydrothermal formation of a roscoelite-assigned mica
  process: other
  microbial: false
  description: Ito (1965) produced pale green micaceous material from chemically prepared potassium
    silicate and vanadium-aluminium silicate starting mixtures in sealed gold capsules. Table 3 assigns
    roscoelite by X-ray diffraction in seven runs between 300 and 600 degrees C, at the separately
    tabulated pressures and durations. For example, run 1 used 300 degrees C, 18,000 psi and 48 hours;
    its powder pattern in Table 6 was indexed assuming a 1M mica structure. These are laboratory
    synthesis observations, not measurements of extraction from ore or isolated vanadium recovery.
  context: The general method used coprecipitated gels containing initially V4+, dried below 100
    degrees C, in electrically sealed gold tubing 2-5 mm in diameter. No additional water was introduced
    because the starting materials retained water. The author states that precise atmospheric control
    was impossible and residual organic matter and ammonium chloride made the intended inert system
    weakly reducing. The remaining Table 3 runs are 400 degrees C/20,000 psi/25 hours, 450/36,000/48,
    500/38,000/48, 500/33,000/48, 500/24,000/24 and 600/35,000/72. These are distinct conditions
    within one study, not independent replication. Detailed gel proportions, quantitative phase fractions
    and mass-balanced yields are not reported for these runs. Bulk wet chemistry used a different
    synthetic sample, run 4, so its valence measurements do not describe every run.
  evidence:
  - source_ref: ito1965
    supports: support
    explanation: Methods pages 300-301, Table 3 page 304 and Table 6 page 307 support formation of
      the diffraction-assigned mica under the individually reported synthetic conditions. Table 6
      compares synthetic run 1 with published natural powder data; the comparison is identification
      evidence rather than a fresh experiment on natural ore.
  - source_ref: ito1965
    supports: partial
    explanation: Pages 311-312 and Table 8 report wet-chemical V3+/V4+ estimates for synthetic run
      4, with oxidation during chemical treatment requiring a correction step. Page 314 notes minute
      opaque vanadium-oxide spots at some flake fringes despite no other phase being detected by
      powder X-ray diffraction. Bulk valence is therefore not an unequivocal site-specific mica measurement,
      and no phase-purity percentage is assigned. The page 314 prose gives a broader 300-700 degrees
      C and 10,000-40,000 psi synthesis envelope than the seven Table 3 entries; that wider envelope
      is not treated as additional verified runs. Proposed oxygen-pressure control and natural paragenetic
      relations were not established by precise atmosphere measurements or reversible equilibrium
      experiments.
