  evidence:
  - source_ref: fritze2026
    supports: support
    explanation: Section 3.2 and Figure 3 report 68% of feed arsenic in solution after eight days in the 3% sludge biotic assay. The figure presents biotic means and SD, without numeric SD transcribed here. The authors associate arsenic release with dissolution of ferrihydrite; this is a host-dissolution interpretation, not evidence for microbial reduction of arsenate. Industrial feed provenance does not establish industrial operation of this laboratory process.
  - source_ref: fritze2026
    supports: partial
    explanation: The same Section 3.2 reports 66% arsenic leaching in the acid-adjusted abiotic comparator and describes simplified controls requiring replicate confirmation. The small reported difference therefore does not establish arsenic-specific microbial benefit. Its statement placing initial 24% As at day 1 conflicts with Figure 3, which places that point at day 0; no initial value or derived arsenic rate is curated. Section 3.4 discusses subsequent chemical arsenic removal prospectively, not a tested microbial recovery or detoxification result. Methods and Table 2 specify Al:F, whereas the abstract says Al:Fe; this record follows the flask-specific Table 2 ratio.
