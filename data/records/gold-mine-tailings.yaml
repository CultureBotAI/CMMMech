    annotation_note: Grounded to reference-proteome entry UP000363590 for type strain Acidithiobacillus thiooxidans ATCC 19377 (NCBITaxon:637390), representing Acidithiobacillus thiooxidans PTCC 1717 (NCBITaxon:930) in Fereydouni et al. (2025).
    evidence:
    - source_ref: fereydouni2025
      supports: partial
      explanation: Representative Acidithiobacillus thiooxidans ATCC 19377 tetrathionate hydrolase (tth) for sulfur-oxidizing medium conditioning and culture-associated Pr, Ce, and Eu mobilization from oxalic-acid-pretreated gold-mine tailings by Acidithiobacillus thiooxidans PTCC 1717 in Fereydouni et al. (2025); individual sqr/tth genes were not mutated or directly assayed.
  evidence:
  - source_ref: fereydouni2025
    supports: support
    explanation: 'Results Extraction of metals (p. 4) and original Figure 2 (p. 5) report increased solution-extraction endpoints between days 3 and 7 in the pretreated culture assay: Pr 57% to 76%, Ce 31% to 46% and Eu 5% to 14%. Figure 2 includes a seven-day untreated-feed culture comparator with lower bars. These are the authors'' reported percentages, not curator-recalculated yields. Equation 1 (p. 3) defines the numerator as leachate concentration Cs (mg/L) times solution volume Vs (L), divided by feed content Cf (mg/g) times feed mass Mf. It does not measure an isolated product. The publication does not provide the solid loading or post-pretreatment inventories needed to reconstruct the denominator and closed mass balance across both stages.'
  - source_ref: fereydouni2025
    supports: partial
    explanation: The original Figure 2 bar heights and Results compare pretreated with untreated bacterial cultures. Abstract reports increases of 24.4%, 14.4% and 9.1% for Pr, Ce, Eu; Results rounds these to 24, 14, 9%. The plotted comparison is consistent with differences in extraction percentage points, not established relative-percent gains or a factorial synergy estimate. The Results says uninoculated controls under the same conditions gave near-zero extraction but explicitly omits their data from Figure 2; numerical control trajectories, uncertainties and pH/sulfuric-acid matching are not provided. This is an asserted control result, not independently reconstructable evidence that biological chemistry outperforms matched abiotic acid. Dead-cell, cell-free-liquor and acid-matched comparisons are not shown.
  - source_ref: fereydouni2025
    supports: partial
    explanation: Figure 1a (p. 4) begins with a cell-count point around 4 x 10^8 cells/mL and declines over a 14-day axis, whereas p. 3 states an initial 4 x 10^6 cells/mL and describes maximum growth/log-phase onset at day 12. Figure 1b spans seven days, with pH approximately 0.8 to 0.6 and back to 0.8, not a plotted 3.5-to-0.7 preculture trajectory. The graph/text do not unambiguously align propagation, addition and assay times. Hemocytometry does not establish the prose assertion that cells eventually died. Sulfate/pH/Eh observations are compatible with changing medium chemistry, but do not demonstrate a specific metabolic flux or iron oxidation-state ratio.
  - source_ref: fereydouni2025
    supports: partial
    explanation: Methods p. 2 reports bulk ICP-OES feed concentrations in mg/kg, including Fe 322743, Al 527, Pr 100, Eu 213 and Ce 112; p. 5 later repeats 322743 for Fe with an incompatible mg/L label. Figure 6 EDX tables are explicitly Wt.% and list Fe 15.65, 5.12, 1.71 across stages, while p. 6 calls these v/v. The middle two-entry table sums to 89.47%, and EDX Al values 84.35–98.29% differ greatly from the stated bulk Al assay. These EDX values cannot substitute for bulk feed inventories, absolute iron removal or a closed mass balance. Figure 2 plots Fe on a Recovery(%) axis, whereas p. 4 describes an iron content falling to 1%; those quantities are not equated here.
  - source_ref: fereydouni2025
    supports: partial
    explanation: Figure 7/Table 1 (p. 9) present fitted shrinking-core comparisons, not direct rate-limiting-step measurements. The text on p. 10 gives Eu conventional chemical-reaction R-squared as 0.9168, but Table 1/Figure 7e assign 0.9168 to diffusion and 0.9611 to chemical reaction. Its claim that sulfate-adjusted models predict better conflicts with the lower reported R-squared values, including 0.4012 for Ce and 0.2617 for Eu. These fits do not establish a unique mechanism. Single-batch shake-flask data and qualitative surface images provide no isolated-REE product, gold-recovery result, demonstrated industrial deployment or universal gold-tailings performance.
  - source_ref: ncbi_thiooxidans
    supports: context_only
    explanation: NCBI Taxonomy 930 resolves to Acidithiobacillus thiooxidans at species rank. This supports the stated species mapping only; PTCC 1717 remains the publication's culture-collection attribution and is not independently authenticated by the species record.
