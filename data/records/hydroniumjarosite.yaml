id: cmmmech:hydroniumjarosite
name: Hydroniumjarosite
material_kind: mineral
description: Hydroniumjarosite is the hydronium-dominant ferric sulfate hydroxide mineral, ideally (H3O)Fe3(SO4)2(OH)6.
  It is distinct from potassium jarosite, natrojarosite, ammoniojarosite and an industrial jarosite-bearing
  residue. The September 2026 IMA list records a 1987 redefinition by special procedure; this is not
  an individual approval accession. Basciano and Peterson (2007) characterized synthetic material and
  a hydronium-dominant natural sample from Rio Tinto, Spain, using chemical analyses and powder-diffraction
  refinement. Their natural sample 7-13-2-1 also contained quartz and minor potassium and sodium. It
  does not represent a pure endmember or a demonstrated microbial product. The study supports specimen-specific
  identity and laboratory abiotic formation, not isolated iron recovery, long-term contaminant retention,
  or industrial deployment of the preparation. Constituent-element criticality is not inherited.
