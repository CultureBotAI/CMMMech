id: cmmmech:electroplating-bath-effluents
name: Electroplating-bath effluents
material_kind: secondary_resource
description: Metal-bearing liquids originating from industrial electroplating baths, represented by five
  Cu, Ni, Pd and Au bath effluents supplied by Galvanica Aricci Srl, Ghisalba, Italy, in Ciani et al.
  (2026). These compositionally different process liquids are distinct from electroplating wastewater-treatment
  sludge, metallic electroforming scrap and laboratory metal-salt solutions. The study's Ni(1)+Cu mixture
  is an experimental combination of two supplied liquids, not a sixth independently sampled waste stream.
  No criticality designation is inherited from constituent metals.
