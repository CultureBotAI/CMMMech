id: cmmmech:roquesite
name: Roquesite
material_kind: mineral
description: >-
  Roquesite is the copper-indium sulfide mineral species CuInS2, listed by
  IMA-CNMNC in September 2026 with renamed status (Rn) and IMA number
  1962-001. Picot and Pierrot's original description concerns natural
  material from Charrier, Allier, France, observed as inclusions in bornite.
  Powder diffraction, reflected-light microscopy and electron-microprobe
  observations support its distinction from the associated host minerals.
  The paper compares this natural material with a separately supplied
  synthetic CuInS2 specimen; that comparator is not the natural mineral
  specimen or a microbial product. The synthetic powder pattern contains
  additional broad central lines whose origin the authors could not test
  because material was scarce. The natural specimen has reported traces
  of iron and zinc, so qualitative element-map contrast is not evidence
  of absolute chemical purity. Both natural and synthetic microprobe
  analyses total above 100 percent; the authors attribute the excess
  mainly to sulfur-standard and correction difficulties and also discuss
  possible reference-metal surface oxidation. Those analyses support the
  mineral assignment without establishing a closed recovery balance.
  This record identifies the mineral species, not elemental indium, the
  entire polymetallic ore or every manufactured material of nominal
  CuInS2 composition. No microbial mechanism, isolated-metal yield,
  industrial recovery or constituent-derived criticality is asserted.
