id: cmmmech:seawater
name: Seawater
material_kind: primary_resource
description: >-
  Naturally occurring marine saline water considered as a dissolved-material
  extraction feed. It is a variable aqueous resource, distinct from elemental
  uranium, a mineral species, a manufactured salt product and desalination
  concentrate. The curated study used natural seawater in a laboratory dialysis
  experiment with nutrient-supported bacterial growth. Its composition and
  response do not define all seawater. No criticality designation or external
  material identifier is inferred from its constituents.
sources:
  - id: yuan2019
    title: >-
      Yuan, Yu, Yang, Wen, Guo, Wang and Wang (2019). Ultrafast Recovery of
      Uranium from Seawater by Bacillus velezensis Strain UUS-1 with Innate
      Anti-Biofouling Activity. Advanced Science 6(18):1900961;
      DOI 10.1002/advs.201900961. Full published XML, Sections 2.1-2.5 and 4,
      Figures 2-6; PMC6755527, PMID 31559134.
    url: https://doi.org/10.1002/advs.201900961
    accessed_on: '2026-10-15'
  - id: yuan2019_si
    title: >-
      Supporting Information to Yuan et al. (2019), DOI 10.1002/advs.201900961;
      nine-page ADVS-6-1900961-s001.pdf from EuropePMC supplementaryFiles.
      Figure S2 (p. 4), Table S1 (p. 8), Table S2 (p. 9).
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6755527/supplementaryFiles
    accessed_on: '2026-10-15'
  - id: ncbi492670
    title: >-
      NCBI Taxonomy 492670, Bacillus velezensis, species; current authority
      checked 2026-10-15. Species identifier does not identify strain UUS-1.
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=492670&mode=info
    accessed_on: '2026-10-15'
  - id: mk092976
    title: >-
      GenBank MK092976.1, Bacillus velezensis strain UUS-1 partial 16S ribosomal
