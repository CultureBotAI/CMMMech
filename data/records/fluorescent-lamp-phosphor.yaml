    functional_role: Membrane-bound PQQ-dependent glucose dehydrogenase (EC 1.1.5.2) that oxidizes D-glucose
      to D-glucono-1,5-lactone/gluconic acid in the periplasm, generating the organic-acid biolixiviant.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000006375 for Gluconobacter
      oxydans 621H (NCBITaxon:290633; locus GOX0265).
    evidence:
    - source_ref: schmitz2021
      supports: support
      explanation: Glucose oxidation by membrane-bound PQQ-dependent glucose dehydrogenase generates the
        gluconic acid-dominated acidic biolixiviant used to leach the mineral/feed.
  - uniprot_accession: UniProtKB:Q9L3B2
