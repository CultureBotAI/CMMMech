  evidence:
  - source_ref: pereira2025
    supports: partial
    explanation: 'Sections 4.2–4.4 and 5.1.4.1.2, printed pages 15–22 and 33–34, with Figures 5.12–5.14: after nine days there was no visible color distinction, pH/redox trajectories largely overlapped the control, and the author reported very low overall metal leaching without a demonstrated biological advantage. This is a negative result for transferring the crushed-pyrite model, not validation of an ash-specific optimum. Solution measurements do not establish isolated-metal recovery. The separate slag''s favorable recoveries and the crushed-pyrite model predictions are not ash outcomes.'
  - source_ref: pereira2025
    supports: partial
    explanation: Printed page 34 says Mn and Sb leaching was no higher than the chemical control, yet Figure 5.14 shows the day-nine inoculated Sb bar visibly above the control and a smaller difference for Mn. No error bars or ash-specific significance analysis reconcile this discrepancy; the record retains the author's limited conclusion without asserting exact equality or a statistically proven null. Figure 5.13B also shows a large day-two ferrous-iron excursion, whereas the nominal addition was 54 mM. Equation 5 reverses the concentration/absorbance variable description relative to the calibration axes in Figure 4.4. Equation 7's leach-liquor mg/g basis and solid-composition denominator are incompletely specified; its Table 4.11 reference and the ash section's Table 4.10 reference do not match the actual composition Table 4.9. No exact ash recovery percentage or independently validated mass balance is adopted.
