id: cmmmech:behoite
name: Behoite
material_kind: mineral
description: >-
  Behoite (IMA 1969-031) is an IMA-accepted beryllium hydroxide mineral, the
  natural orthorhombic beta-Be(OH)2 polymorph, with IMA September 2026 Master
  List formula Be(OH)2. Described by Ehlmann and Mitchell (1970) from the Rode
  Ranch rare-earth pegmatite, Llano County, Texas, USA (and also recognized in
  hydrated Vitro-tuff at Honeycomb Hills, Juab County, Utah, USA), where it
  occurs as colorless, pseudo-octahedral crystals ({011} prism with {110}
  prism faces) in white to tan powdery alteration rinds replacing brown
  gadolinite in association with tengerite, bastnaesite, albite, and quartz.
  Orthorhombic (space group P212121), with a = 4.64(2) Å, b = 7.05(2) Å, c =
  4.55(3) Å, Z = 4, SGmeas = 1.92, Dcalc = 1.94 g/cm3, Mohs hardness ~4, and
  biaxial (–) optics with alpha = 1.533(3), beta = 1.544(3), gamma = 1.548(3),
  and 2V = 82°.
identifiers:
  - id: IMA:1969-031
    label: Behoite
sources:
  - id: ima_2026_09
    title: >-
      IMA-CNMNC (Pasero M., 2026), The New IMA List of Minerals – A Work in
      Progress (Updated: September 2026), PDF p. 23, Behoite row: status A, IMA
      1969-031, formula Be(OH)2, reference Ehlmann A.J., Mitchell R.S. (1970)
      American Mineralogist 55, 1-9.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-24'
  - id: ehlmann_1970_behoite
    title: >-
      Ehlmann AJ and Mitchell RS (1970), Behoite, beta-Be(OH)2, from the Rode
      Ranch pegmatite, Llano County, Texas, American Mineralogist 55:1-9.
      Primary species description of behoite (IMA 1969-031), natural
      beta-Be(OH)2, from the Rode Ranch pegmatite, Llano County, Texas, USA;
      reports Fresenius wet-chemical analysis (Table 1: BeO 56.86, H2O+ 41.36,
      H2O- 0.27, SiO2 0.75, Al2O3 + Fe2O3 0.45, MgO 0.08, CaO 0.25, total 100.02
      wt%, empirical BeO·0.99H2O), orthorhombic unit cell (P212121; a = 4.64(2)
      Å, b = 7.05(2) Å, c = 4.55(3) Å, Z = 4), SGmeas = 1.92, Dcalc = 1.94
      g/cm3, Mohs hardness ~4, biaxial (–) optical constants (alpha = 1.533(3),
      beta = 1.544(3), gamma = 1.548(3), 2V = 82°), infrared absorption bands,
      and DuPont 900 differential thermal analysis (DTA) showing two-step
      endothermic dehydroxylation beginning at ~265 °C and ~290 °C and peaking
      at 310 °C.
    url: https://www.rruff.net/doclib/am/vol55/AM55_1.pdf
    accessed_on: '2026-10-24'
mechanisms:
  - id: abiotic_dta_dehydroxylation
    name: Abiotic two-step endothermic DTA dehydroxylation of behoite
    process: other
    description: >-
      Two-step endothermic thermal dehydroxylation of natural orthorhombic
      beta-Be(OH)2 (behoite) to BeO and H2O, exhibiting initial endothermic
      inflections near 265 °C and 290 °C and a principal endothermic peak at
      310 °C.
    context: >-
      Abiotic laboratory differential thermal analysis (DTA) on Rode Ranch
      behoite using a DuPont 900 thermal analyzer in air at 20 °C/min; no
      microbial, enzymatic, or bioleaching mechanism was tested or reported in
      Ehlmann and Mitchell (1970).
    microbial: false
    evidence:
      - source_ref: ehlmann_1970_behoite
        supports: support
        explanation: >-
          Differential thermal analysis (DTA) of Rode Ranch behoite on a DuPont
          900 analyzer in air at 20 °C/min shows a two-step endothermic
          dehydroxylation reaction of beta-Be(OH)2 with inflections beginning at
          approximately 265 °C and 290 °C and reaching an endothermic peak at
          310 °C (p. 7, Fig. 4).
