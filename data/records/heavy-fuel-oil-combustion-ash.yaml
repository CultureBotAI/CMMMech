id: cmmmech:heavy-fuel-oil-combustion-ash
name: Heavy-fuel-oil combustion ash
material_kind: secondary_resource
description: Heterogeneous ash generated by burning heavy fuel oil, represented here by an oil-fired thermal-power-plant residue. This combustion resource is distinct from coal fly ash, petroleum coke, refinery catalysts and its constituent elements. The selected study does not establish the collection fraction needed to identify its sample specifically as fly ash. No constituent-element criticality status is inherited by this resource.
sources:
- id: rasoulnia_mousavi_2016
  title: Rasoulnia and Mousavi (2016). Bioleaching of Precious Metals from an Oil-Fired Ash Using Organic Acids Produced by Aspergillus Niger in Shake Flasks and Bioreactor. International Journal of Chemical Engineering and Applications 7(6):365-368. DOI 10.18178/ijcea.2016.7.6.606; complete four-page publisher PDF, Sections II-IV and Figures 1-4.
  url: https://www.ijcea.org/vol7/606-G0007.pdf
  accessed_on: '2026-10-11'
- id: ncbi_niger
  title: NCBI Taxonomy 5061, Aspergillus niger, species-level identity. This mapping does not independently authenticate the reported PTCC culture.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=5061&mode=Info
  accessed_on: '2026-10-11'
mechanisms:
- id: niger_spent_medium_leaching
  name: Reported metal extraction with Aspergillus niger spent medium
  process: bioleaching
  description: Rasoulnia and Mousavi report vanadium and nickel extraction after contact of oil-fired ash with culture liquid from Aspergillus niger PTCC 5210 following biomass separation. Organic-acid measurements establish production of potential lixiviants, but the study does not isolate a unique causal metabolite or establish a microbial enhancement over matched abiotic leaching. This is a laboratory spent-medium observation, not evidence for fungal growth at the leaching temperature or industrial metal recovery.
  context: The paper describes ash supplied by a thermal power plant in Tehran, Iran, ground and screened below 75 micrometres. Its exact plant name, collection location and fly-ash versus other residual fraction are not specified. The fungus is source-reported as PTCC 5210 purchased from IROST; its current collection entry was not independently resolved. Seven-day potato-dextrose-agar cultures supplied a spore suspension. The paper states 10^7 spores without an explicit volume denominator or final inoculum fraction. Culture medium contained, per litre, 100 g sucrose, 1.5 g NaNO3, 0.5 g KH2PO4, 0.025 g MgSO4.7H2O, 0.025 g KCl and 1.6 g yeast extract. Flask cultivation lasted fourteen days at 30 degrees C and 130 rpm. A bubble column with 1-L working culture volume operated for seven days at 30 degrees C and 760 mL/min aeration. Biomass separation is stated without a specified separation procedure or residual-cell assessment. Both spent media subsequently contacted ash at 3% w/v, 60 degrees
    C for seven days. Leaching-vessel volume and agitation are not specified; the 1-L value describes culture production. Organic acids were analyzed by HPLC and feed composition by XRF. Sterilized conditions are stated, but no matched sterile-medium, pure-acid or pH-controlled ash-leaching comparison is reported.
  microbial: true
  organisms:
  - id: NCBITaxon:5061
    label: Aspergillus niger
