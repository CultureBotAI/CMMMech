mechanisms:
- id: tessaracoccus_siderite_formation
  name: Culture-associated siderite formation with vivianite from an Fe(II) medium
  process: biomineralization
  description: Living Tessaracoccus lapidicaptus cultures formed a precipitate whose X-ray diffraction
    pattern was assigned to siderite together with dominant vivianite. Microscopy shows carbonate-bearing
    aggregates around cells and extracellular polymeric substances. Culture-associated precipitation
    is supported, while the proposed mineral sequence, surface nucleation and metabolic carbonate
    supply are not separately quantified causal pathways.
  context: Living Tessaracoccus lapidicaptus CECT 8385 (= DSM 27266; type strain IPBSL-7) was cultured
    anaerobically at 30 degrees C in reported 100-mL bottles containing 100 mL FE medium, examined
    for mineral formation for up to 45 days. Inoculum OD600 was 0.5; inoculum volume and replicate
    count are not specified. FE medium was initially pH 6 and autoclaved at 121 degrees C for 20
    min. Its reported w/v composition was 0.25% NaCl, 0.04% NH4Cl, 0.003% MgCl2.6H2O, 0.005% CaCl2.2H2O,
    0.2% FeCl2.4H2O, 0.01% yeast extract, 0.085% NaNO3, 0.1% glucose, 0.1% succinic anhydride, 0.05%
    KH2PO4, 0.025% NaHCO3, 0.05% cysteine hydrochloride and 0.01% resazurin. Iron was supplied as
    Fe(II), so this selected experiment does not establish microbial Fe(III) reduction. The organism
    identifier is species-level; the paper and taxonomy authority link the culture collection strains.
    The paper also uses the spelling Tessarococcus, whereas NCBI and LPSN accept Tessaracoccus.
  microbial: true
  organisms:
  - id: NCBITaxon:1427523
    label: Tessaracoccus lapidicaptus
  evidence:
  - source_ref: sanchez_roman_2015
    supports: support
    explanation: Methods and Results on PDF pages 2-3 describe the live cultures and controls. Figure
      1 on page 4 labels multiple siderite reflections in a pattern dominated by vivianite. Figure
      4 on page 6 shows assigned siderite aggregates and Fe-C-O-bearing regions, including an EDX
      spectrum with a small phosphorus signal and a nearby vivianite crystal. The complementary bulk
      diffraction and microscopy support a siderite-containing mixture; EDX alone would not identify
      a carbonate mineral species.
  - source_ref: sanchez_roman_2015
    supports: partial
    explanation: Uninoculated and nonviable-cell controls reportedly showed neither mineral precipitation
      nor pH change; the nonviable-cell preparation and viability check are not specified. Live-culture
      final pH is approximately 7.5 in Results but 7.8 in Discussion. No matched-pH abiotic control
      or direct phosphatase/EPS perturbation isolates the proposed nucleation mechanism. Table 1
      gives modelled initial supersaturation, not observed abiotic precipitation. Reported Fe(II)
      decline from 0.56 to 0.01 g/L has no specified filtration/fraction protocol and cannot be assigned
      to either mineral or converted to a recovery yield. Mixed-phase formation, without quantified
      phase abundance, product purity, isolated mass balance or fertilizer testing, is limited to
      this laboratory medium; no industrial deployment is established.
