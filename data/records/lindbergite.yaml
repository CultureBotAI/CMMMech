id: cmmmech:lindbergite
name: Lindbergite
material_kind: mineral
description: >-
  Lindbergite is the approved manganese oxalate dihydrate mineral,
  Mn(C2O4)(H2O)2, IMA 2003-029. The authoritative mineral description
  assigns monoclinic symmetry and space group C2/c. It is distinct from
  elemental manganese, natural manganese nodules, the orthorhombic
  manganese oxalate dihydrate polymorph, and the trihydrate falottaite.
  No criticality designation is inherited from manganese.
