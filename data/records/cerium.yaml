mechanisms:
- id: fungal_leachate_cerium_precipitation
  name: Cerium precipitation using pretreated biomass-free fungal struvite leachate
  process: biomineralization
  description: Pretreated culture filtrate from Aspergillus niger ATCC 1015 growth on struvite-bearing
    material precipitated cerium-bearing phosphate and, at higher Ce loading, oxalate phases. Microbial
    involvement denotes upstream leachate production; the cerium reaction itself was cell-free.
  context: Laboratory leachate came from 14-day fungal growth at 25 degrees C and 125 rpm in darkness,
    with 1% w/v pulverized natural struvite/dittmarite feed oven-treated at 105 degrees C for 48 h. Modified
    Czapek-Dox medium contained 1 g/L Na2HPO4 as background phosphate, with a 1 x 10^6 spores/mL inoculum.
    Biomass was removed by filtration. Leachate was treated with 0.5 g H-form AG 50W-X8 cation-exchange
    resin per 5 mL for 24 h, adjusted to pH 7.5 using 4 M NaOH, and filtered at 0.25 micrometers. CeCl3
    at final 5, 20, 40 or 50 mM Ce3+ was mixed with treated leachate in 10 mL reactions for 24 h on a
    roller at room temperature, in triplicate. Solids were centrifuged, washed three times and dried.
    This is a laboratory precipitation experiment with synthetic cerium solution, not live-cell cerium
    reduction, isolated elemental-metal yield or industrial deployment.
  microbial: true
  organisms:
  - id: NCBITaxon:380704
    label: Aspergillus niger ATCC 1015
  evidence:
  - source_ref: kang_2022
    supports: support
    explanation: Results and Figure 3 report greater than 99% removal of Ce from solution at the tested
      loadings. At 50 mM input, residual Ce was 27.34 +/- 1.91 micromolar; caption errors are SEM for
      at least three replicates. Supernatant Ce was measured by Arsenazo III colorimetry at 658 nm. Reported
      apparent complete removal at lower loadings does not establish literal zero residual concentration;
      the inspected method does not give a detection limit. Solution removal and weighed precipitate mass
      are not a pure-cerium yield.
  - source_ref: kang_2022
    supports: support
    explanation: Figure 6 XRD with Table 2 Rietveld fits assigns CePO4.H2O at 20 mM CeCl3 and phosphate
      plus Ce2(C2O4)3.10H2O at 50 mM. Figure 9 FTIR supports phosphate and higher-loading oxalate assignments.
      Fitted phase proportions are not recovery percentages or proof of absolute phase purity. Subsequent
      high-temperature calcination results are separate from the microbial-associated step.
  - source_ref: kang_2022
    supports: partial
    explanation: Resin treatment and alkaline adjustment are material process steps. The inspected full
      text does not report a matched synthetic phosphate/oxalate mixture or untreated-filtrate control
      for the cerium stage. Background medium phosphate prevents assigning all precipitate phosphorus
      to struvite. The study supports this prepared leachate's precipitation performance, not microbial
      necessity for precipitation, REE selectivity or performance on real cerium wastes.
