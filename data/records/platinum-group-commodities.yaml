id: cmmmech:platinum-group-commodities
name: Platinum-group commodities
material_kind: commodity
description: >-
  This collective commodity family comprises ruthenium, rhodium, palladium,
  osmium, iridium and platinum. The USGS platinum-group-elements category
  identifies these six related metals; Australia's 20 February 2024 Critical
  Minerals List explicitly includes the same six in its platinum-group-elements
  entry. This is a grouped commodity scope, overlapping the individual element
  records, rather than a single element, mineral species, fixed-composition alloy
  or waste feedstock. The dated designation below applies to Australia's
  explicitly enumerated six-member group. Identity and designation are curated here;
  no shared microbial recovery performance is asserted for all six metals.
sources:
