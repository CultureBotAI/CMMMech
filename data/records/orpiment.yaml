    interpro_ids:
    - InterPro:IPR036188
    - InterPro:IPR023753
    - InterPro:IPR051169
    pfam_ids:
    - Pfam:PF07992
    functional_role: Membrane-bound sulfide-quinone reductase (EC 1.8.5.4; AFE_1792) catalyzing oxidation of sulfide to elemental sulfur/polysulfide coupled to quinone reduction during acidophilic sulfur/sulfide bioleaching.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000001362 for Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159).
    evidence:
    - source_ref: liu2019
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 sulfide-quinone reductase (AFE_1792) for reduced-sulfur oxidation during arsenopyrite culture leaching with secondary orpiment formation in Liu et al. (2019); individual sqr/tth genes were not mutated.
  - uniprot_accession: UniProtKB:B7J3C9
    entry_name: TTH_ACIF2
    protein_name: Tetrathionate hydrolase
    gene_symbol: tth
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:243159
      label: Acidithiobacillus ferrooxidans ATCC 23270
    reference_proteome_id: UP000001362
    ec_numbers:
    - EC:3.12.1.-
    interpro_ids:
    - InterPro:IPR018391
    - InterPro:IPR002372
    - InterPro:IPR011047
    - InterPro:IPR015943
    pfam_ids:
    - Pfam:PF13360
    functional_role: Periplasmic tetrathionate hydrolase (EC 3.12.1.-; tth / AFE_0029) hydrolyzing tetrathionate into thiosulfate, elemental sulfur, and sulfate, generating sulfuric acid protons.
    annotation_note: Grounded to reviewed Swiss-Prot reference-proteome entry UP000001362 for Acidithiobacillus ferrooxidans ATCC 23270 (NCBITaxon:243159).
    evidence:
    - source_ref: liu2019
      supports: partial
      explanation: Representative Acidithiobacillus ferrooxidans ATCC 23270 tetrathionate hydrolase (tth / AFE_0029) for polythionate disproportionation and sulfuric-acid generation during arsenopyrite culture leaching with secondary orpiment formation in Liu et al. (2019); individual sqr/tth genes were not mutated.
  evidence:
  - source_ref: liu2019
    supports: support
    explanation: Sections 3.2-3.3 and 4.1.2, Figure 2a-b, identify orpiment alongside realgar, sulfur, jarosite and residual arsenopyrite in a time series including days 1, 3, 5, 9 and 19. The source describes early orpiment formation and declining relative content as leaching progresses. The normalized solid-phase proportions do not quantify absolute orpiment production or destruction. Source phase assignment is based on the diffraction analysis, not inferred here from As2S3 formula or EDS alone.
  - source_ref: liu2019
    supports: partial
    explanation: Figures 4-5 and Table 1 show a dense As/S-rich early surface film on separate cubes, with cracks attributed to drying, and a later porous jarosite-associated overlayer. The proposed orpiment-containing passivating film combines particle XRD with cube morphology/EDS; it is not an orpiment-specific causal intervention. Figure 6 and Table 2 are a proposed pathway and thermodynamic reactions, not directly measured reaction fluxes. The 25 degrees C equilibrium calculation differs from the 30 degrees C culture and the authors acknowledge disagreement with early-stage phase observations. Neither a unique passivating role nor a microbial increment over abiotic orpiment formation is isolated.
  - source_ref: newman1997
    supports: context_only
    explanation: The distinct Desulfotomaculum auripigmentum precipitation experiment is not accepted as crystalline orpiment evidence. Page 2023 explicitly reports electron diffraction showing an amorphous precipitate; elemental proportions and Figure 2 support As2S3 composition without establishing the orpiment crystal structure. Its microbial precipitation and aqueous arsenic-removal measurements are not transferred to this mineral-specific mechanism.
