      vote are on page 568. Natural and synthetic structures in Table 2
      have separate provenance.
    url: https://doi.org/10.1180/minmag.1989.053.373.07
    accessed_on: '2026-10-12'
  - id: bellatreccia_1999
    title: >-
      Bellatreccia F, Della Ventura G, Caprilli E, Williams CT and Parodi GC
      (1999). Crystal-chemistry of zirconolite and calzirtite from Jacupiranga,
      São Paulo (Brazil). Mineralogical Magazine 63(5), 649-660.
      DOI 10.1180/002646199548817. Complete twelve-page original, seven
      figures and three tables inspected. Specimen/methods page 650;
      zoning and provenance pages 651-654 and Figure 1; new analyses
      Table 3; derived substitutions Figures 4-6 and pages 654-658.
      No article-specific supplementary file was identified in the
      acquired original or publisher landing inventory.
    url: https://doi.org/10.1180/002646199548817
    accessed_on: '2026-10-12'
  - id: handbook_zirconolite
    title: >-
      Handbook of Mineralogy. Zirconolite, version 1, copyright 2001-2005.
      Complete two-page original entry inspected. General identity and
      natural-occurrence context; its listed powder pattern is from an
      annealed Afrikanda specimen and is not a pattern measured from
      the unheated Jacupiranga specimen.
    url: https://handbookofmineralogy.org/pdfs/zirconolite.pdf
    accessed_on: '2026-10-12'
