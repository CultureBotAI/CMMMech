    FeO n.d., Na2O 9.14, K2O 5.36, H2O 11.40, total 99.82 wt%, empirical formula (Na4.50K1.80)(Y1.85Ca0.20Mg0.06Ba0.04)(Si15.87Al0.15)O38·10.02H2O
