id: cmmmech:okanoganite-y
name: Okanoganite-(Y)
material_kind: mineral
description: 'Yttrium-dominant rare-earth fluoro-borosilicate mineral of the vicanite group
  with current September 2026 IMA-CNMNC approved formula (Y,REE,Ca,Na,Th)16(Fe3+,Ti)(Si,B,P)10(O,OH)38F10,
  status Rn (renamed), and special-procedure tag 1987 s.p. (originally approved as okanoganite
  under IMA 1979-048 and suffixed in 1987; listed under 1987 s.p. in the IMA Master List rather
  than a numbered CURIE). Boggs (1980) described the type specimens (UCSB 8256-8257 and Smithsonian
  NMNH 142512-142514) from miarolitic cavities in arfvedsonite granite of the Golden Horn
  batholith near Washington Pass, Okanogan County, Washington, USA, reporting EMPA + carminic-acid
  spectrophotometric B2O3 analysis (Table 2, p. 1141) and provisional formula (Na,Ca)3(Y,Ce,Nd,La)12Si6B2O27F14.
  Boiocchi, Callegari, Ottolini, and Maras (2004) re-examined a type-locality crystal from
  the Golden Horn batholith by combined WDS electron microprobe, SIMS light-element quantification
  (H, Li, Be, B, F), and single-crystal X-ray diffraction in acentric trigonal space group
  R3m (a = 10.7108(5), c = 27.0398(11) A, V = 2686.5(3) A3, Z = 3, Robs = 0.0323 for 1857
  observed reflections with I > 3sigma(I) out of 1957 unique reflections; Table 6, p. 1542:
  Y2O3 18.94, Ce2O3 14.37, La2O3 7.60, Nd2O3 7.52, Dy2O3 3.23, Gd2O3 2.69, Sm2O3 2.07, Pr2O3
  1.88, Er2O3 1.88, Yb2O3 0.87, Tb2O3 0.48 calc, Tm2O3 0.20 calc, Eu2O3 0.01, CaO 5.50, Na2O
  1.87, ThO2 1.87, UO2 0.08, SrO 0.08, BaO 0.08, PbO2 0.01, Fe2O3 2.18, TiO2 0.56, Li2O 0.02,
  SiO2 14.94, B2O3 3.80, P2O5 0.83, BeO <0.01, H2O 1.33, F 7.07, less O=F 2.98, total 98.99
  wt%), establishing isostructurality with vicanite-(Ce) and the revised crystal-chemical
  formula (Y4.52REE6.82Ca2.65Na1.63Th0.19Sr0.02Ba0.01U0.01)Sigma15.85(Fe3+0.74Ti0.19Li0.04)Sigma0.97(Si6.71P0.32B2.94Be0.01)Sigma9.98(O34.02OH3.98)Sigma38F10.04.
  Distinct from vicanite-(Ce), hundholmenite-(Y), hellandite-(Y), and elemental yttrium or
  boron; no criticality designation, microbial mechanism, or industrial recovery yield is
  asserted.'
