id: cmmmech:luxembourgite
name: Luxembourgite
material_kind: mineral
ima_symbol: Lux
description: >-
  IMA-approved silver-copper-lead-bismuth selenide sulfosalt-like mineral (IMA 2018-154;
  symbol Lux in the September 2026 IMA Master List, PDF p. 129; status A, Approved 2019; full
  description published August 2020) with ideal end-member formula AgCuPbBi4Se8 (reported on
  p. 450 as requiring Ag 5.58 wt%, Cu 3.44 wt%, Pb 11.22 wt%, Bi 45.28 wt%, and Se 34.22 wt%
  for a total of 100.00 wt%, where Ag 5.58 wt% is a digit-transposition misprint for the true
  stoichiometric value 5.84 wt% so the printed ideal values sum to 99.74 wt%; Philippo et al.,
  2020, European Journal of Mineralogy 32:449-455). Represents the ordered Ag-Cu analogue of
  watkinsonite, Cu2PbBi4Se8 (with Ag ordered at the octahedral Ag1 site and Cu ordered at the
  tetrahedral Cu2 site, and closely related to litochlebite, Ag2PbBi4Se8, with which it shows
  very limited solid solution), and is named after the city and Grand Duchy of Luxembourg as
  the first new mineral species discovered in Luxembourg. Discovered during winter 2012 tunnel
  excavation works by the Societe Electrique de l'Our at Bivels in the Oesling (Ardennes)
  region of northern Luxembourg (49 deg 57 min 8 sec N, 6 deg 10 min 41 sec E), where it
  occurs in hydrothermal veins cutting Lower Devonian reddish schists Affected by Variscan
  metamorphism, deposited as tiny acicular fibres on translucent rhombohedral dolomite
  crystals (up to 2 mm) associated with siderite; cotype specimens are deposited in the
  mineralogical collection of the Natural History Museum of Luxembourg (Musee National
  d'Histoire Naturelle, catalogue number FD040; portion used for EPMA) and the Laboratory of
  Mineralogy, University of Liege, Belgium (catalogue number 21302; portion used for SCXRD).
  Forms grey metallic millerite-like fibres up to 200 um in length and 5 um in diameter
  (Figure 1) with a black streak, metallic lustre, opaque diaphaneity, brittle tenacity, no
  observed cleavage, Mohs hardness 3 (estimated by comparison with litochlebite), and
  calculated density reported as 8.00 g/cm3 in the Abstract (p. 449), Section 3 (p. 450), and
  Table 6 (p. 454) from the chemical analysis and unit-cell parameters vs Dcalc = 7.397 g/cm3
  in Table 3 (p. 452; optical properties not determined due to the 5 um fibre diameter).
  Wavelength-dispersive electron microprobe analysis (average of 5 point analyses, JEOL
  JXA-8200, 15 kV, 5 nA, 1 um beam; Table 1) yielded Bi 43.73 wt% (range 42.66-44.26), Se
  31.04 wt% (30.37-32.04), Pb 11.95 wt% (10.50-12.79), Ag 6.60 wt% (5.68-9.04), Cu 2.66 wt%
  (2.23-2.81), Fe 0.02 wt% (0.00-0.05), S 0.01 wt% (0.00-0.02), and As 0.00 wt%, total
  96.01 wt%, corresponding on the basis of 15 atoms per formula unit to the empirical formula
  Ag1.00(Cu0.82Ag0.20Fe0.01)Sigma1.03Pb1.13Bi4.11(Se7.72S0.01)Sigma7.73. Crystallizes in the
  monoclinic system, space group P21/m (#11), with single-crystal X-ray diffraction unit-cell
  parameters a = 13.002(1) A, b = 4.1543(3) A, c = 15.312(2) A, beta = 108.92(1) deg, V =
  782.4(2) A3, and Z = 2 (refined to R1 = 0.0476 for F2 > 2sigma(F2), R1(all) = 0.0730, wR2 =
  0.1069, and GoF = 1.077 for 2117 unique reflections from 5904 measured at 293(2) K on a
  0.005 x 0.005 x 0.150 mm fibre using a Rigaku Xcalibur diffractometer with MoKalpha
  radiation, Table 3; powder unit cell refined with LCLSQ is a = 13.01(13) A, b = 4.15(2) A,
  c = 15.36(14) A, beta = 109.4(6) deg, V = 783(16) A3, Table 2). The crystal structure
  (Tables 4-5) alternates four-anion-thick PbS-like pseudotetragonal Se layers hosting
  octahedral Bi1 (<Bi1-Se> = 2.9885 A), Bi2 (<Bi2-Se> = 2.9370 A), Bi3 (<Bi3-Se> = 2.9554 A;
  BVS = 3.08-3.25 v.u.), and Ag1 (<Ag1-Se> = 2.9219 A; BVS = 1.33 v.u.) with one-anion-thick
  pseudohexagonal Se layers, between which lie distorted [3+1]-tetrahedral Cu2 (refined s.o.
  0.965(10) Cu, <Cu2-Se> = 2.5438 A, BVS = 1.00 v.u.; note that Section 6 on p. 454
  misprints "average M-O bond lengths = 2.544 A" for M-Se), 8-coordinated Pb (refined s.o.
  0.989(4) Pb, <Pb-Se> = 3.2361 A, BVS = 2.08 v.u.), and 7-coordinated Bi4 (refined s.o.
  0.977(4) Bi, <Bi4-Se> = 3.0923 A). The nine observed powder X-ray diffraction lines (dobs
  in A (Iobs; hkl), MoKalpha, Table 2 and Table 6) are 2.984 (100; 3 1 -1), 2.085 (60; 0 2 0),
  1.355 (30; 6 2 -7 / 8 1 -8), 1.188 (30; 0 2 10), 4.61 (20; 2 0 -3), 3.59 (20; 0 1 2), 2.425
  (20; 2 1 -5), 1.916 (20; 3 1 -7 / 6 1 -1), and 1.490 (20; 6 2 -3). No biological or
  microbial interaction data are reported in the type mineralogical description.
