mechanisms:
  - id: adapted_consortium_black_mass_bioleaching
    name: Acidophilic consortium bioleaching of battery black mass
    process: bioleaching
    description: >-
      An adapted Lake Hromnice acidophilic consortium mobilized cobalt from
      pretreated spent nickel-manganese-cobalt lithium-ion battery black mass.
      Sulfur oxidation supplied acidity; iron cycling may also contribute.
      This is community-level laboratory evidence, not a pure-strain mechanism
      or industrial deployment.
    context: >-
      Two-step flask assay: 10% (v/v) inoculum, 50 mL FeS medium (50 mM ferrous
      sulfate; 1% w/v elemental sulfur; initial pH 2.0), seven-day preculture,
      then 1% w/v black mass for seven days at 30 degrees C and 150 rpm.
      Feed pretreatment included discharging, dismantling, thermal treatment,
      crushing and sorting. The original enrichment was dominated by
      Acidithiobacillus thiooxidans (95%); Alicyclobacillus comprised 3%.
      Post-adaptation composition was not established here. Adaptation used
      dissolved-metal mixtures in three 14-day stages; Table 2 doses do not
      consistently match Table 1 black-mass equivalents, limiting reproducibility.
    microbial: true
    evidence:
      - source_ref: lalropuia_2024
        supports: support
        explanation: >-
          Sections 2.1-2.5 and 3.1-3.3; Figures 4-6: dissolved Co peaked by day 2
          and was higher with adapted culture than non-adapted and sterile-medium
          controls. ICP-OES measures mobilization, not isolated product recovery.
          The abiotic control differed in pH and iron speciation, so it does not
          isolate acidity from other microbial contributions.
