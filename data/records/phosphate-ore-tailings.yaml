  evidence:
  - source_ref: somasundaran2018
    supports: support
    explanation: Methods pp.54-55 and Figures 3-4 support the narrow observation that the authors tested the two named cultures separately on Florida phosphate tailings and reported rare earth signal in clarified liquid. The species labels are the authors' assignments; neither a strain accession nor sequence-based identification is supplied for the experimental organisms.
  - source_ref: somasundaran2018
    supports: partial
    explanation: Figure 3 and the accompanying text report approximately 45% leached from tailings by day three in the bacterial arm, whereas Figure 4 and text report approximately 22.5% in the fungal arm. These are source-reported assay-based fractions, not independently validated yields or isolated-product recovery. The corresponding concentrate results, 70% and 42.5%, do not belong to tailings. Different media and pH and the absence of matched sterile leaching arms prevent interpreting the comparison as intrinsic species efficiency or proof of microbial necessity. Figure 3's caption identifies duplicate experiments; this does not establish the replication of every other experimental series.
  - source_ref: somasundaran2018
    supports: partial
    explanation: Table 1 prints total tailings REE content as 304 ppm, while its listed elemental cells sum to 305 ppm; the concentrate cells sum to 889 ppm versus a printed total of 826 ppm. No corrected total is inferred. Separate particle-size and pulp-density experiments report tailings maxima of 48% and 38%, but Figure 8 labels pulp density mg/50 mL while methods and prose use g/50 mL. Together with inconsistent timing and inoculum wording, these discrepancies prevent adopting a single verified optimized recipe. The record preserves the reported time-series observations with these limits.
  - source_ref: somasundaran2018
    supports: context_only
    explanation: Equations and discussion propose iron oxidation, ferric hydrolysis and fungal organic-acid complexation. They do not directly measure the relevant metabolites or isolate their causal contributions in these tailings experiments. Discussion p.60 also refers to monazite isolates ML3-1 and WE3-F in wording not reconciled with this study's stated methods; those strains, feed and concentrations are not attributed to the Florida tailings experiment.
causal_graphs:
- id: culture_associated_ree_leaching_graph
  name: Separate Acidithiobacillus ferrooxidans (9K pH 1.7) and Aspergillus niger (Czapek-Dox pH 7.5) shake-flask rare earth leaching from Florida phosphate tailings
  description: Causal pathway linking representative Acidithiobacillus ferrooxidans rus-operon Fe(II)-oxidation proteins (Cyc2 AFE_3153/DN052_11975, Swiss-Prot rusticyanin AFE_3146, and Cyc1 AFE_3152 in reference proteomes UP000001362 and UP000248886) in the bacterial shake-flask arm (250 mL ferrous sulfate 9K medium at leaching pH 1.7, 1 mL inoculum at ~5 x 10^8 cells/mL, 1% pulp density of 75 um ground Florida clay-bearing phosphate tailings [304 ppm printed total REE in Table 1 vs 305 ppm cell sum], 30 C, 150 rpm) and reviewed Swiss-Prot Aspergillus niger citrate exporter CexA (UniProtKB:A0A254TZW7 and UniProtKB:G3Y4N5) in the separate fungal shake-flask arm (250 mL modified Czapek-Dox medium at pH 7.5, 1 mL culture vs 2 mL spore inoculum in methods, 1% pulp density of 75 um tailings, 30 C, 150 rpm) to clarified-leachate Arsenazo I colorimetric (~520 nm) aggregate rare earth signals of ~45% by day 3 in the bacterial arm (Figure 3; up to 48% in optimization plots) and ~22.5% in the fungal
    arm (Figure 4; up to 38% in optimization plots) in Somasundaran et al. (2018), while preserving the absence of matched sterile leaching controls, unmeasured metabolite concentrations, and method/figure timing and unit discrepancies.
  scope: REPRESENTATIVE_EXAMPLE
  mechanism_ref: culture_associated_ree_leaching
