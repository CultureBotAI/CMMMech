mechanisms:
- id: abiotic-heating-cooling-crystallization
  name: Kornelite crystallization during cooling of a ferric-sulfate preparation
  process: other
  microbial: false
  description: >-
    An aqueous ferric-sulfate preparation first produced an XRD-assigned
    ferricopiapite precipitate at 75 degrees C. After further heating,
    opening the vessel and slow cooling, pale-violet kornelite crystals
    appeared. Single-crystal and powder diffraction support the final
    product identity. The sequence does not establish a direct solid-state
    ferricopiapite-to-kornelite pathway or a mass-balanced iron recovery.
  context: >-
    Ackermann et al., page 1621: 2.5 g of analytical-grade,
    X-ray-amorphous ferric sulfate was dissolved in 1.17 mL deionized
    water. Closed polyethylene flasks were held at 75 degrees C for
    48 hours, then nine additional days. The oven was switched off,
    the vessel lid removed and the contents cooled slowly in the oven
    to room temperature. Cooling duration, exact final temperature,
    solution pH, replicate synthesis count and product yield are not
    reported. This is a chemical laboratory synthesis; no organism or
    biological treatment is involved. The source also supports the
    existing paracoquimbite record through a different preparation;
    two material records do not constitute independent replication.
  evidence:
  - source_ref: ackermann2009
    supports: support
    explanation: >-
      Page 1621 describes the preparation, and Figure 1a/page 1622
      shows the resulting elongated crystals. Table 1 reports a
      monoclinic P21/n single-crystal refinement at 293 K. The electron
      microprobe Fe/S ratio, 0.62(5), averages 35 spots rather than
      35 independent syntheses; the authors acknowledge measurement
      difficulty and compare it with theoretical 0.66.
  - source_ref: ackermann2009
    supports: partial
    explanation: >-
      Pages 1622-1625 and Tables 2/4 distinguish model-dependent channel
      water from fixed stoichiometry. Single-crystal models yield
      1.71(5) or 1.75(5) channel waters per formula unit, compared with
      1.55(2) from powder refinement; thermogravimetry gives total
      hydration estimates of 7.47 or 7.98 depending on the plateau
      endpoint. Disordered and incommensurate water arrangements were
      not distinguished. Deposit AM-09-052 could not be acquired, so
      detailed-coordinate reproducibility remains unchecked.
  - source_ref: ackermann2009
    supports: partial
    explanation: >-
      Figure 6/pages 1626-1627 demonstrates strong sensitivity of
      calculated phase boundaries to estimated entropies. These are
      not measured universal stability fields. Table 6 prints a
      6.53-water coefficient in the kornelite Hess-cycle expression,
      inconsistent with the 6.75 implied by its adopted 7.75-water
      formula and Table 5 reaction; no formation-enthalpy value is
      adopted here. Thermal-peak labels also do not establish an
      isolated product or an ore-treatment yield.
- id: ay5-provisional-phase-assignment
  name: Provisional kornelite assignment in mixed AY5 culture precipitates
  process: biomineralization
  microbial: true
  organisms:
  - id: NCBITaxon:876
    label: Desulfovibrio desulfuricans
  description: >-
    Karnachuk et al. label some peaks in precipitates from living
    Desulfovibrio desulfuricans AY5 cultures as kornelite using a powder
    diffraction database match. This is a provisional culture-associated
    phase observation, not proof that sulfate-reducing metabolism
    directly precipitates ferric sulfate. The mineral products are mixed,
    and neither kornelite abundance nor a recovered iron fraction was
    measured.
  context: >-
    Sections 2.1-2.4 describe glycerol-fed Widdel-Bak medium with sulfate,
    phosphate, nutrients and reductant; the one-litre bioreactor received
    100 mg/L iron as FeSO4 and operated at 28 degrees C, 100 rpm and
    25 mL/min nitrogen sparging. Its pH was progressively decreased
    from 7 using HCl or NaHCO3, with medium replacement and transfers
    to closed, dark batch bottles at 28 degrees C. Thus the successive
    pH arms share a reactor history rather than independent fresh
    inoculations. Solids were centrifuged at 13,100 g for 15 minutes
    at 15 degrees C and washed in distilled water for 10 minutes
    before powder XRD. Oxygen exclusion during washing, any drying
    conditions and an uninoculated mineralogical control are not
    reported. These are laboratory observations, without clinical
    or industrial inference.
  evidence:
  - source_ref: karnachuk2021
    supports: partial
    explanation: >-
      Figure 5A/page 6 labels kornelite peaks in the day-two pH-7
      bioreactor pattern; Figure 6A/page 7 labels them at days three
      and four for pH 6. Supplementary Figure S2A labels kornelite
      at days two/four for pH 6.5, and S3A at days one/two for pH 5.5.
      These are mixed patterns with broad backgrounds and other phases;
      no kornelite-specific refinement, hydration analysis or isolated
      crystal chemistry is supplied. The database's seven-water formula
      in captions is not a measured hydration value.
  - source_ref: karnachuk2021
    supports: partial
    explanation: >-
      Later bioreactor patterns and the displayed batch patterns do not
      carry the same kornelite labels; absence of a label is not a
      quantified disappearance or a detection-limit-based absence.
      Section 3.2 calls the pH-6.5 bioreactor phases unpronounced,
      while supplementary Figure S2A assigns small peaks. Phase
      identity and timing therefore remain qualified. No matched sterile
      or killed-cell arm separates biological effects from solution
      chemistry or sample-workup oxidation/precipitation. Fe/S maps
      in Figure 4/S1 identify elements, not kornelite or Fe(III).
