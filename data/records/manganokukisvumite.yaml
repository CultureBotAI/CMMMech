id: cmmmech:manganokukisvumite
name: Manganokukisvumite
material_kind: mineral
description: Hydrated sodium-manganese(II)-titanium chain silicate mineral with current September
  2026 IMA-CNMNC approved formula Na6MnTi4Si8O28·4H2O, status A, and approval number IMA 2002-029.
  Gault, Ercit, Grice, and Van Velthuizen (2004) described the cotype specimens (CMNMC 83392
  and CMNMC 83393, Canadian Museum of Nature, Ottawa, formerly cataloged as unknown UK 112)
  from small cavities in an albite-rich syenite breccia block at the Poudrette quarry, Mont
  Saint-Hilaire, Rouville County, Quebec, Canada, where it occurs with albite, aegirine, epididymite,
  elpidite, ankerite, calcite, nenadkevichite, polylithionite, quartz, and rhodochrosite (and
  also verified Mn-dominant core zones in zoned kukisvumite from Mount Kukisvumchorr, Khibina
  alkaline massif, Kola Peninsula, Russia). JEOL 733 WDS electron-microprobe analysis of the
  Mont Saint-Hilaire cotype (mean of 2 analyses, Table 1, p. 783, with H2O calculated for
  4 H2O by analogy with kukisvumite and lintisite) yielded SiO2 41.74, TiO2 26.90, Nb2O5 0.68,
  Al2O3 0.16, Ce2O3 0.18, FeO 0.57, MnO 5.48, MgO 0.26, CaO 0.08, Na2O 15.61, K2O 0.21, H2O
  6.25 (calc), total 98.12 wt%, corresponding on the basis of 32 O atoms to the empirical
  formula (Na5.81K0.05Ca0.02Ce0.01)Sigma5.89(Mn0.89Fe0.09Mg0.07Al0.04)Sigma1.09(Ti3.88Nb0.06)Sigma3.94Si8.01O28·4H2O.
  114.6-mm Debye-Scherrer powder X-ray diffraction (Table 2, p. 784) indexed in orthorhombic
  space group Pccn with a = 29.05(2), b = 8.612(6), c = 5.220(4) A, V = 1305.9(3) A3, Z =
  2, Dmeas = 2.86(1) g/cm3 (heavy liquids), Dcalc = 2.88 g/cm3, Mohs hardness 5.5-6, and biaxial
  negative optics (alpha(calc) = 1.657, beta = 1.744(3), gamma = 1.792(3), 2Vmeas = 70 degrees).
  Distinct from kukisvumite (the Zn-dominant analogue Na6ZnTi4Si8O28·4H2O), lintisite (Na3LiTi2Si4O14·2H2O),
  elpidite, and elemental manganese, titanium, or niobium; no criticality designation, microbial
  mechanism, or industrial recovery yield is asserted.
