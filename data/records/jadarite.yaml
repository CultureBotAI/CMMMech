- id: acidophile_jadarite_bearing_material_leaching_graph
  name: Acidithiobacillus ferrooxidans inoculation and sulfuric-acid-dosed leaching of Jadar Valley jadarite-bearing material
  description: Causal pathway linking representative Acidithiobacillus ferrooxidans rus-operon proteins (Cyc2 AFE_3153/DN052_11975, Swiss-Prot rusticyanin AFE_3146, and Cyc1 AFE_3152 in reference proteomes UP000001362 and UP000248886) for the ferrous-sulfate-grown Bor sulfide-ore isolate (10 mL inoculum in 190 mL sterile basal nutrient solution with 2 g ball-milled ~0.5 um Jadar Valley jadarite-bearing powder [containing jadarite, dolomite, and probertite by qualitative XRD; labeled 2% w/v though 2 g in 200 mL total liquid implies 1% w/v, so no normalized recovery yield is calculated] in triplicate 250 mL flasks at static 23 C for 30 days) and repeated 1 N (0.5 M) H2SO4 additions during the first three weeks targeting pH 1.8 to transient mid-course acceleration of lithium release and day-30 convergence with the uninoculated acid control (while sulfuric-acid-only leaching remained higher, and post-treatment XRD showed loss of jadarite, dolomite, and probertite peaks with a reflection near
    2-theta 27.9 degrees in both conditions whose boric-acid interpretation is not treated as an unambiguous phase identification) in Kirk et al. (2024).
  scope: REPRESENTATIVE_EXAMPLE
  mechanism_ref: acidophile_jadarite_bearing_material_leaching
