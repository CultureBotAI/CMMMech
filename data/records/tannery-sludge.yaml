    - source_ref: wang2019
      supports: partial
      explanation: Wang et al. (2019) report 97.1% Cr extraction after 7 days at final pH 1.65 (outperforming single-strain and uninoculated runs) and a residual solid Cr content of 531 mg/kg; support is partial because 97.1% is computed via the Equation 4 aqueous-inventory denominator (whereas 531 mg/kg vs 15.890 g/kg dry weight does not equal 97.1% by unchanged-solid-mass subtraction), uninoculated sludge was non-sterile, and no matched-pH abiotic acid control was included.
