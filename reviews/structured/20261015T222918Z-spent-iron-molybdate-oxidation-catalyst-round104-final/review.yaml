assessments:
- assessment_id: identity
  area: identity
  topic: Process-defined secondary resource
  outcome: supported
  summary: Used oxidation-catalyst identity is distinct and supported.
  details: Russo describes formaldehyde/methanol oxidation catalyst from Orim; Farhan
    describes a separate unnamed chemical-industry end-user feed. Iron molybdate and
    excess molybdenum oxide are constituents, not justification for an IMA species
    ID. Elemental Mo, molybdenite, fresh catalyst and spent refinery hydroprocessing
    catalysts remain separate. No external material/taxon identifier is asserted.
  target_ids:
  - cmmmech:spent-iron-molybdate-oxidation-catalyst
  evidence_ids:
  - owner
  - russo
  - farhan
- assessment_id: criticality
  area: scope
  topic: Criticality and organism scope
  outcome: supported
  summary: Generic source criticality wording and acid origin are not overextended.
  details: No criticality claim is assigned without jurisdiction/list/edition evidence.
    Tartaric acid recovered from winery waste is an abiotic reagent in these experiments;
    no microbial taxon, biomass, enzymatic process or microbial recovery is claimed.
  target_ids:
  - cmmmech:spent-iron-molybdate-oxidation-catalyst
  evidence_ids:
  - owner
  - russo
  - farhan
- assessment_id: russo_feed
  area: evidence
  topic: Russo feed and selected conditions
  outcome: supported
  summary: Composition, denominators and conditions are source-specific.
  details: Total-digestion ICP-OES reports 58.01 +/-2.71 wt% Mo and 13.81 +/-0.54
    wt% Fe; Table 1 is EDX atom%, not bulk wt%. Three aqua-regia digestion trials
    and a 350-degree-C hotplate setting are not leach replicates or measured leach
    temperature. Selected leaching is 1.3 M tartaric acid, 75 g/L, 25 degrees C, 60
    min, 300 rpm in a 25 mL flask with condenser. Acid is 99.90% and blanks Mo/Fe
    below LOD.
  target_ids:
  - cmmmech:spent-iron-molybdate-oxidation-catalyst
  evidence_ids:
  - owner
  - russo
- assessment_id: russo_outcome
  area: quantity
  topic: Dissolution, uncertainty and proposed downstream route
  outcome: supported
  summary: Reported leaching is retained without product-yield inflation.
  details: 87.36 +/-2.94% Mo is reported at selected conditions. Figure 5 caption
    defines analytical error; three digestions do not prove three replicates per arm.
    Iron tracks Mo and text explicitly rejects selectivity. Lower loading bound differs
    33 versus 30 g/L. Equation 1 lacks an explicit feed-mass denominator, so no independent
    reconstruction is claimed. Proposed calcium tartrate at pH 7 and NH4Cl/HCl at
    pH 2 plus 90 degrees C do not supply isolated-product purity or a closed balance.
  target_ids:
  - cmmmech:spent-iron-molybdate-oxidation-catalyst
  evidence_ids:
  - owner
  - russo
- assessment_id: russo_models
  area: evidence
  topic: Kinetics and feed characterization
  outcome: supported
  summary: Model fit and characterization are bounded.
  details: The paper fits chemical-reaction, product-layer and film-diffusion equations;
    similar fits are not unique molecular proof. The SI reports 1.72% C and 0.67%
    H, C-H bands, heating to 400 degrees C and changed diffraction; this does not
    identify each organic species. Figure S4 and thermal prose differ in the interval
    associated with 4.65% loss. The owner expressly avoids assigning a threshold or
    exact organic fraction.
  target_ids:
  - cmmmech:spent-iron-molybdate-oxidation-catalyst
  evidence_ids:
  - owner
  - russo
  - russo_si
- assessment_id: farhan_feed
  area: evidence
  topic: Separate ammoniacal experiment
  outcome: supported
  summary: Feed, controls and preparation are traceable.
  details: Farhan pellets below 200 mesh have 52.59 +/-0.80 wt% Mo, 12.98 +/-0.43
    Fe and 0.07 +/-0.03 Al from duplicate digestions. Experiments use 1.5 g in 15
    mL, 30 mL vials, 20 degrees C, 300 rpm, 60 min, duplicate conditions. Leach liquor
    plus NH4OH washes enter analysis. Water (~11% Mo/~8% Fe), ammonia alone (64-89%
    Mo at 1-5 M, Fe below 1.5%) and mixed system (>91% Mo at total 2 M, about 4.5%
    Fe at nominal 1:1) are separate arms.
  target_ids:
  - cmmmech:spent-iron-molybdate-oxidation-catalyst
  evidence_ids:
  - owner
  - farhan
- assessment_id: farhan_ratios
  area: quantity
  topic: Reagent and result conflicts
  outcome: supported
  summary: Conflicts prevent an invented exact transferable recipe.
  details: The paper interchanges NH4OH:(NH4)2SO4 and NH3:NH4+ despite two ammonium
    ions per salt. Figure 4/ratio section gives ~95% Mo at >=3:1 while abstract/discussion
    summarize ~92%. The 500 mL liquor at reported total NH3 2 M and reagent ratio
    3:1 is settled for 12 h and filtered; 48.2 g/L Mo and <7 mg/L Fe characterize
    this liquor. Iron settling is observed, but the proposed iron pentaammine and
    printed reaction equations are not directly verified stoichiometry.
  target_ids:
  - cmmmech:spent-iron-molybdate-oxidation-catalyst
  evidence_ids:
  - owner
  - farhan
- assessment_id: asc
  area: quantity
  topic: Antisolvent outcome and product characterization
  outcome: supported
  summary: Crystallization-step depletion and unresolved purity are distinguished.
  details: 12 mL total aqueous/ethanol, 20 degrees C, ethanol at zero time; maximum
    95.3% at 45 min/400 rpm, then 30 min settle, 5 mL ethanol wash and overnight 30-degree-C
    drying. Equation 2 computes initial-versus-mother-liquor Mo inventories, not overall
    spent-feed recovery. Duplicate ASC means carry standard error. Abstract A/O 1:2,
    Results selects 2 and Figure 5 time/speed/product captions use 1.5. XRD assigns
    ammonium heptamolybdate tetrahydrate. SEM-EDX-associated >99.9% purity is not
    accepted as an independently verified bulk assay.
  target_ids:
  - cmmmech:spent-iron-molybdate-oxidation-catalyst
  evidence_ids:
  - owner
  - farhan
- assessment_id: scale
  area: scope
  topic: Transfer and industrial deployment
  outcome: supported
  summary: Laboratory scope and independent feeds are retained.
  details: Industry supplied feed; no industrial recovery deployment, scale-up economic
    demonstration or closed ammonia/ethanol/acid recycling loop was measured. Russo
    and Farhan use distinct feeds and conditions, so percentages cannot be combined
    or ranked as matched controls. No additional harvest/product ratio is calculated.
  target_ids:
  - cmmmech:spent-iron-molybdate-oxidation-catalyst
  evidence_ids:
  - owner
  - russo
  - farhan
- assessment_id: provenance
  area: provenance
  topic: Source objects and curation history
  outcome: supported
  summary: Exact source state and independent authorship are explicit.
  details: Reviewer did not author or edit this owner. Native inspect captured owner/CREATE/schema
    before assessment. Current bytes are verified unchanged before save. Institutional
    Russo early-online A-G object is identified accurately; five-page official SI
    is companion evidence, not an independent experiment. Source publication chronology
    and actual access are separate. Canonical CREATE and inline event agree.
  target_ids:
  - cmmmech:spent-iron-molybdate-oxidation-catalyst
  evidence_ids:
