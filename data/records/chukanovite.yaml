      explanation: During 1060-day anoxic incubations of 80 mM Fe(III) as synthetic goethite with 75 mM formate and ~5 x 10^9 cells/mL Shewanella putrefaciens CN-32 without added phosphate (without or with 100 micromolar AQDS; oloughlin_2021 Sections 2.1-2.3, 3.3 and 4.1-4.3, Tables 2-3, and Figures 6-8), extracellular electron transfer reduces goethite Fe(III) to Fe(II).
  - source: goethite_substrate
    target: chukanovite_product
    predicate: transforms_into
    relationship: reductive dissolution and secondary ferrous hydroxycarbonate precipitation
    description: Microbially generated Fe(II) and carbonate/hydroxide alkalinity from formate-coupled goethite reduction nucleate platy chukanovite (Fe2(OH)2CO3) alongside residual goethite.
    evidence:
    - source_ref: oloughlin_2021
      supports: support
      explanation: XRD, SEM, and Mossbauer spectroscopy at day 1060 (oloughlin_2021 Sections 3.3 and 4.1-4.3, Tables 2-3, and Figures 6-8) show chukanovite accounting for 20.0% (no AQDS) and 27.4% (+100 micromolar AQDS) of 140 K fitted spectral area alongside residual goethite; the 500 micromolar phosphate + 100 micromolar AQDS day-744 condition is retained as internally inconsistent between Section 3.3, Table 2, and Section 4.3.
    - source_ref: oloughlin_2019
      supports: partial
      explanation: Section 4.2 of oloughlin_2019 explicitly reports that chukanovite was not observed in any of that study's commercial Bayferrox 943 lepidocrocite bioreduction systems (which formed carbonate green rust and transient sulfate green rust in the 62-day formate/AQDS chloride and sulfate arms and siderite in other electron-donor arms), bounding cross-mineral extrapolation of the 2021 goethite result.
