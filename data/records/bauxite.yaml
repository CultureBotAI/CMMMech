id: cmmmech:bauxite
name: Bauxite
material_kind: commodity
description: >-
  Naturally occurring, heterogeneous aluminium ore used as a commercial raw
  material. Bauxite contains varying proportions of aluminium hydroxide minerals,
  principally gibbsite, boehmite and diaspore, together with silica, iron oxides,
  titania and other constituents. Commercial uses include metallurgical feed,
  abrasives and refractories. This commodity is distinct from a single mineral
  species, refined alumina, aluminium metal and the red-mud residue of alumina
  production. The EU designations explicitly name bauxite within the combined
  bauxite/alumina/aluminium value chain. No microbial mechanism is asserted here.
