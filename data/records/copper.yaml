mechanisms:
  - id: acidophile_chalcopyrite_copper_release
    name: Acidophile-dependent copper release from chalcopyrite concentrate
    process: bioleaching
    description: >-
      Defined acidophile cultures promoted copper release from chalcopyrite
      concentrate in laboratory flasks. The Acidithiobacillus caldus plus
      Sulfobacillus thermosulfidooxidans combination produced the largest
      reported copper concentration in the initial experiment. Adding the
      strong iron oxidizer Leptospirillum ferriphilum did not maximize copper
      release: all binary combinations outperformed the three-species mixture.
      This is a conditional leaching result, not isolated copper recovery
      or demonstrated deployment of a designed consortium at industrial scale.
    context: >-
      Aitik-mine flotation concentrate, reported as 29.5% Cu, sieved to
      50-100 micrometres; EDTA/NaOH and acetone washes, overnight drying at
      60 degrees C and 10 hours at 120 degrees C under nitrogen preceded
      inoculation. The source notes accompanying bornite may occur at the
      deposit; this is not an assay on an elemental copper feed. Living
      A. caldus DSM 8584, S. thermosulfidooxidans DSM 9293 and L. ferriphilum
      DSM 14647 were tested singly and in all two- and three-species
      combinations, with uninoculated controls. Species-level identifiers
      below do not replace these experimental strain designations.
      Four flasks per treatment contained 100 mL MAC medium, initially pH
      1.8, and 2% w/v concentrate in 250 mL vessels; inocula were 10^7 cells
      per mL per species. Incubation was at 38 +/- 2 degrees C and 120 rpm.
      Inoculated runs ended 14 days after the onset of iron oxidation
      (redox potential above 400 mV versus Ag/AgCl), giving 14-20 days total
      incubation. Endpoints are therefore not a common elapsed-time rate.
      AAS after heated HCl digestion of slurry measured total released
      copper, including dissolved and precipitated fractions.
    microbial: true
    organisms:
      - id: NCBITaxon:33059
        label: Acidithiobacillus caldus
      - id: NCBITaxon:28034
        label: Sulfobacillus thermosulfidooxidans
      - id: NCBITaxon:178606
        label: Leptospirillum ferriphilum
    evidence:
      - source_ref: christel_2018
        supports: support
        explanation: >-
          Methods and Bioleaching of Chalcopyrite Concentrate results, Figure
          1C, support composition-dependent copper release. The initial
          A. caldus/S. thermosulfidooxidans treatment reached 14.2 +/- 0.3 mM
          total released Cu; Figure 1 identifies means +/- SD with n=4.
          Uninoculated controls released 2.4 +/- 0.3 mM Cu after 15 days.
          The record preserves the authors' concentration assay, without
          converting it to a recovery percentage or a purified metal yield.
      - source_ref: christel_2018
        supports: partial
        explanation: >-
          The same results section reports marginal leaching by A. caldus
          alone and attributes its late iron oxidation to possible surviving
          environmental contaminants. It also reports variable run lengths
          and lower performance of the three-species mixture than the binary
          mixtures. These observations limit generalization to arbitrary
          acidophile mixtures and unsterilized ores. Low-redox and cell-
          attachment explanations, candidate iron-oxidation genes and scale-up
          feasibility remain interpretations or future tests, not demonstrated
          molecular causes or industrial performance.
