limitations:
- Unaccessioned brewery material permits species-level annotation only.
- The primary source has conflicting pH descriptions, a chemically inconsistent printed
  nitrate formula, and no explicit method for the final aqueous concentration in its
  removal equation.
- No matched biomass-free solution-control result or ion-exchange mass balance was
  found in the full methods/results or relevant supplement; all apparent removal cannot
  be assigned uniquely to a resolved binding mechanism.
- Measured and fitted capacities are separate, and no selective recovery, regeneration,
  purified product or industrial operation is demonstrated.
- Reviewer live ChEBI retrieval failed; the dated retained original authority HTML
  was independently decoded and hashed. No raw replicate dataset was available; published
  values and figures were assessed.
