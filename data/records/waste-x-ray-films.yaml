mechanisms:
- id: fungal_supernatant_emulsion_stripping
  name: Gelatin-silver layer stripping by fungal cell-free culture supernatant
  process: separation
  description: Crude cell-free supernatant from the source-designated Conidiobolus coronatus ATCC PTA-4132 culture removed the gelatin layer and released silver-bearing material. Dose dependence, a low zero-enzyme response and protein/hydroxyproline release support proteolytic stripping; microbial silver reduction, metal solubilization or a purified enzyme mechanism was not demonstrated. Living fungus was used to produce the preparation, not applied directly to the films.
  context: Shankar2010 obtained used films from a local medical centre, washed them with water and ethanol, dried them at 40 degrees C for 30 min and cut 2 by 2 cm pieces. Enzyme preparation used 72 h growth in MGYP broth with 2% w/v soybean meal, then centrifugation at 8000 g for 20 min at 4 degrees C. The paper refers culture-production details to prior work; no independent strain authentication was performed here. Stripping assays generally used 1 g film in 10 mL crude preparation at pH 10 and 40 degrees C with shaking. The separate silver assay used 5 g in 50 mL, 1.35 U/mL protease and 200 rpm, followed by acid digestion of the slurry and atomic absorption analysis. Activity units are source assay units, not an enzyme mass or units directly comparable across studies. Independent replicate counts and variability are not reported.
  microbial: true
  organisms:
  - id: NCBITaxon:34488
    label: Conidiobolus coronatus
  protein_examples:
  - uniprot_accession: UniProtKB:A0A137NYV2
    entry_name: A0A137NYV2_CONC2
    protein_name: Subtilisin-like protease
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:796925
      label: Conidiobolus coronatus NRRL 28638
    reference_proteome_id: UP000070444
    interpro_ids:
    - InterPro:IPR034193
    - InterPro:IPR000209
    - InterPro:IPR036852
    - InterPro:IPR023827
    - InterPro:IPR022398
    - InterPro:IPR023828
    - InterPro:IPR050131
    - InterPro:IPR015500
    pfam_ids:
    - Pfam:PF00082
    functional_role: Secreted subtilisin-like serine alkaline protease (peptidase S8 family; locus CONCODRAFT_77703) in Conidiobolus coronatus capable of hydrolyzing extracellular protein/gelatin substrates.
    annotation_note: Grounded to reference-proteome entry UP000070444 (UniProtKB:A0A137NYV2; locus CONCODRAFT_77703) for Conidiobolus coronatus NRRL 28638 (NCBITaxon:796925), representing the extracellular alkaline protease activity in crude supernatant of experimental strain Conidiobolus coronatus ATCC PTA-4132 (NCBITaxon:34488).
    evidence:
    - source_ref: shankar2010
      supports: partial
      explanation: Shankar et al. (2010) used crude cell-free alkaline protease supernatant from Conidiobolus coronatus ATCC PTA-4132 to strip gelatin-silver emulsion without sequencing or purifying the specific subtilisin-like protease isoform.
  evidence:
  - source_ref: shankar2010
    supports: support
    explanation: Methods pp.61-63 and Figures 1-3 support the conditions and temperature, pH and dose responses; Figure 3 includes a 0 U/mL comparator that remains near baseline. The pH/temperature series reports complete layer removal at 40 degrees C and pH 10 in 6 min with 1.35 U/mL. This is an operational stripping endpoint; percentage hydrolysis is normalized to maximum turbidity, not a measured percentage of silver recovered.
  - source_ref: shankar2010
    supports: partial
    explanation: The time-course Methods p.62 specifies 0.9 U/mL whereas Figure 4a labels 1.35 and 2.7 U/mL; the disputed dose-specific series is not combined with the other arms. Figure 3 was sampled every 5 min, so its text's proposed 6-min completion was explicitly not measured in that arm. Table 1 separately reports four successive film batches at 0.90 U/mL taking 6, 10, 14 and 20 min, including the first use; lower-dose preparations lose stripping capacity sooner. This does not establish four additional reuses or constant performance.
  - source_ref: shankar2010
    supports: partial
    explanation: Silver analysis p.68 reports 3.87% w/w of solid sludge and 0.2% w/w relative to starting film mass. These denominators differ from recovery of initial silver inventory, which was not independently established for the tested feed. The introduction's 1.5-2% silver range is background, not its feed assay. The statement that metal or AgCl was recovered has no corresponding isolation protocol or product characterization in this paper; the accepted result is silver-bearing hydrolysate and stripped film. No whole-process mass balance, comparative energy assessment or deployment follows.
- id: bacterial_stripping_then_smelting
  name: Bacterial enzyme stripping followed by separate abiotic silver smelting
  process: recovery
  description: Culture-derived cell-free enzyme extract stripped the gelatin-silver layer, after which drying and borax-assisted smelting produced a silver product. Microbial involvement concerns enzyme production and stripping; the high-temperature metal isolation was abiotic. The source calls the culture Bacillus subtilis ATCC 6633; current ATCC and NCBI records map that designation to Bacillus spizizenii, without reauthenticating the historical Ege University stock.
  context: Nakiboglu2001 used films from Ege University's medical-faculty hospital radiology department. The culture was grown in modified Horikoshi medium supplemented with 1% gelatin, at 30 degrees C and 200 rpm for 24 h; a further transfer is described without an independently specified final culture volume. Centrifugation at 10000 rpm for 10 min at 4 degrees C provided the cell-free extract. Film pieces were washed with water/ethanol, dried at 40 degrees C for 30 min and cut to 4 by 4 cm. The reported recovery run treated 70 pieces successively in 100 mL stock extract at pH 8 and 50 degrees C with stirring, then dried the slurry and smelted it with borax at 1100 degrees C. The preparation's measured casein-assay activity was 22.35 U/mL. No enzyme-free film comparator or initial silver-inventory assay is reported, and the downstream furnace hold time and borax loading are not specified.
  microbial: true
  organisms:
  - id: NCBITaxon:703612
    label: Bacillus spizizenii ATCC 6633 = JCM 2499
