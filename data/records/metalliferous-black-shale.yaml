  title: Anjum F, Bhatti HN and Ambreen A. Bioleaching of Black Shale by Acidithiobacillus ferrooxidans. Asian Journal of Chemistry 21(7):5251-5266, printed 2009; publisher landing metadata lists 2010. Primary PDF, especially pp5252-5253, 5257, 5262 and Table 3 on p5264. No DOI verified.
  url: https://asianpubs.org/index.php/ajchem/article/view/18301/18250
  accessed_on: '2026-10-11'
- id: farbiszewska_2004
  title: Farbiszewska-Kiczma J, Farbiszewska T and Bak M (2004). Bioleaching of metals from Polish black shale in neutral medium. Physicochemical Problems of Mineral Processing 38:273-280, as printed; publisher landing metadata starts at 272. Primary methods pp274-276, Figures 1-4 and Table 1.
  url: https://www.journalssystem.com/ppmp/pdf-79493-15545?filename=Bioleaching-of-metals-fro.pdf
  accessed_on: '2026-10-11'
- id: lu_2026
  title: Lu Y, Wen J, Mo X, Yang X, Shang H, Liu X, Sun J and Yang H (2026). Influence and Mechanism of Vanadium, Nickel, and Molybdenum Bioleaching from Black Shale by Energy Substrates. Minerals 16(2):197. doi:10.3390/min16020197; published 13 February 2026.
