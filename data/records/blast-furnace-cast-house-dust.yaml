id: cmmmech:blast-furnace-cast-house-dust
name: Blast-furnace cast-house dust
material_kind: secondary_resource
description: >-
  Dust generated during periodic tapping and casting of liquid iron and slag
  from a blast furnace, represented by an iron-rich, zinc-bearing sample from
  an Austrian steelmaker. This process-defined secondary resource is distinct
  from blast-furnace flue-gas dust, electric-arc-furnace dust, slag, natural ore
  and its constituent elements or mineral phases. The selected sample does
  not establish a universal dust composition or inherit elemental criticality.
