id: cmmmech:pharmaceutical-blister-packaging-waste
name: Pharmaceutical blister packaging waste
material_kind: secondary_resource
description: Discarded multilayer pharmaceutical blister packaging containing aluminium, polymers and adhesives, represented by hospital-collected transparent, white and silver-coloured fractions. This manufactured waste resource is distinct from aluminium as an element, beverage cans, beverage-carton hydropulping reject and the sulfur feed used to produce its leaching acid. Its composition varies with packaging construction; no element-level criticality is inherited.
sources:
- id: kremser2023
  title: 'Kremser, Schön, Gerl, Valera Gómez, Ramirez Espinosa, Morandini, Pérez Argilés, Monje Martínez and Guebitz (2023). Pharmaceutical blister waste recycling using biogenic sulfuric acid: Effect of sulfur source and blister material on bioleaching efficiency. Hydrometallurgy 221:106124. DOI 10.1016/j.hydromet.2023.106124; published journal version, Sections 2-4, Figures 1-5 and supplementary Figures S1-S4.'
  url: https://doi.org/10.1016/j.hydromet.2023.106124
  accessed_on: '2026-10-11'
- id: kremser2022_acid
  title: Kremser et al. (2022). Optimized biogenic sulfuric acid production and application in the treatment of waste incineration residues. Waste Management 144:182-190. DOI 10.1016/j.wasman.2022.03.025; Sections 2.2-2.4 provide the acid-production method referenced by the blister study. Incineration-residue outcomes are not blister measurements.
  url: https://doi.org/10.1016/j.wasman.2022.03.025
  accessed_on: '2026-10-11'
