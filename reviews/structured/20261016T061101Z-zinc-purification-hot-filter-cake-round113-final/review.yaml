- assessment_id: outcomes
  area: evidence
  topic: Solution concentrations and practical selections
  outcome: supported
  summary: The accepted outcome is empirical aqueous mobilization, not isolated-product
    yield.
  details: Figures1-4 support rapid zinc mobilization with a near-two-minute plateau
    and increased Co/Mn with peroxide. Practical30g/Lacid selection reflects filtration/iron
    concerns above that concentration; later50g/Lacid and diminished response above5g/LH2O2
    are source-specific choices. Curves are not a closed100percent metal balance or
    universal optimum. Figure5 and solvent-extraction discussion do not demonstrate
    characterized purified metal products.
  target_ids:
  - cmmmech:zinc-purification-hot-filter-cake
  evidence_ids:
  - owner
  - primary
