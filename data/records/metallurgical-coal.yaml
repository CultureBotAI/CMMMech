id: cmmmech:metallurgical-coal
name: Metallurgical coal commodity family
material_kind: commodity
description: >-
  Coal products used in steelmaking, scoped here to the broader commodity family
  recognized by the EIA glossary and the IEA Coal 2020 report. EIA includes
  coking coal and pulverized coal consumed in steelmaking; IEA includes coking,
  semi-soft blending coal and pulverised coal injection (PCI) coal. This family
  explicitly overlaps cmmmech:coking-coal as a narrower coke-making subset;
  it is not a second disjoint coking-coal identity. IEA excludes anthracite from
  its metallurgical category even when used in metallurgy. In contrast, USGS
  Fact Sheet 2026-3061 uses metallurgical coal and coking coal interchangeably
  within its coke-production scope. These source-dependent boundaries are
  retained rather than asserted to be a universal coal classification. The
  record denotes an end-use commodity, not elemental carbon, a mineral species,
  manufactured coke or every coal burned industrially. No numerical grade
  threshold, criticality designation or microbial mechanism is generalized
  across this family.
