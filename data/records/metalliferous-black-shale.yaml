id: cmmmech:metalliferous-black-shale
name: Metalliferous black shale
material_kind: primary_resource
description: >-
  Metal-bearing, organic-matter-containing sedimentary shale considered as a
  geological resource. This heterogeneous rock is distinct from its constituent
  elements, individual mineral species, a standardized traded concentrate and
  processing-generated waste. The cited Pakistani, Polish and incompletely
  localized experimental feeds are not interchangeable. The Polish neutral-stage
  experiment used a previously acid-bioleached and washed derivative of the ore;
  its remaining-metal denominator is not the original geological feed inventory.
  No constituent's criticality designation or industrial recovery performance
  is inherited by this resource family.
sources:
  - id: anjum_2009
    title: >-
      Anjum F, Bhatti HN and Ambreen A. Bioleaching of Black Shale by
      Acidithiobacillus ferrooxidans. Asian Journal of Chemistry 21(7):5251-5266,
      printed 2009; publisher landing metadata lists 2010. Primary PDF,
      especially pp5252-5253, 5257, 5262 and Table 3 on p5264. No DOI verified.
    url: https://asianpubs.org/index.php/ajchem/article/view/18301/18250
    accessed_on: '2026-10-11'
  - id: farbiszewska_2004
    title: >-
      Farbiszewska-Kiczma J, Farbiszewska T and Bak M (2004). Bioleaching of
      metals from Polish black shale in neutral medium. Physicochemical
      Problems of Mineral Processing 38:273-280, as printed; publisher landing
      metadata starts at 272. Primary methods pp274-276, Figures 1-4 and Table 1.
    url: https://www.journalssystem.com/ppmp/pdf-79493-15545?filename=Bioleaching-of-metals-fro.pdf
    accessed_on: '2026-10-11'
  - id: lu_2026
    title: >-
      Lu Y, Wen J, Mo X, Yang X, Shang H, Liu X, Sun J and Yang H (2026).
      Influence and Mechanism of Vanadium, Nickel, and Molybdenum Bioleaching
      from Black Shale by Energy Substrates. Minerals 16(2):197.
      doi:10.3390/min16020197; published 13 February 2026.
    url: https://doi.org/10.3390/min16020197
    accessed_on: '2026-10-11'
  - id: ncbi_ferrooxidans
    title: NCBI Taxonomy 920 — Acidithiobacillus ferrooxidans, species rank
    url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=920&mode=Info
    accessed_on: '2026-10-11'
mechanisms:
  - id: heap1_acid_leaching_comparison
    name: Conditional acidophile-associated leaching with copper null results
    process: bioleaching
    description: >-
      Source-labelled Acidithiobacillus ferrooxidans Heap-1 cultures were
      associated with changed iron and manganese concentrations during acidic
      treatment of M-921 shale. The day-20 comparison does not show a copper
      advantage over abiotic treatment, and manganese enhancement depends on
      initial pH. These are solution observations, not isolated-metal yields
      or proof of a particular mineral-dissolution pathway.
    context: >-
      Anjum et al. obtained ore from PIEAS, originally from the source-spelled
      Turbella area, Pakistan. Oven-dried, ground material of source-reported
      particle size at or below 200 mesh was tested at 1% w/v in 250-mL shake
      flasks, 30 degrees C and 100 rpm, with uninoculated chemical controls.
      Table 3 compares initial pH 1.5, 2.0 and 2.5 with and without added
      ferrous iron; some media used 160 mM ferrous sulfate, but assignment
      of that dose to every endpoint arm is not explicit. Samples were
      centrifuged and filtered before metal analysis by atomic absorption;
      iron-speciation time courses used phenanthroline. Heap-1 is the ore
      assay culture, distinct from the three-strain growth comparison.
      The species identifier does not authenticate this local isolate.
      Leaching-flask replication, detection limits and a closed metal balance
      are not reported. Final pH and iron chemistry differ between arms.
    microbial: true
    organisms:
      - id: NCBITaxon:920
        label: Acidithiobacillus ferrooxidans
    evidence:
      - source_ref: anjum_2009
        supports: support
        explanation: >-
          Table 3, day 20: iron-supplemented manganese concentrations at
          initial pH 2.0 were 25.3 mg/dm3 inoculated versus 19.5 in the control;
          at pH 1.5 they were 26.8 versus 24.0. In the medium without added
          iron, the pH-1.5 pair reported 103.00 versus 74.25 mg/dm3 iron.
          These observations support conditional culture-associated changes;
          neither matched acidity nor exclusive microbial causation follows.
      - source_ref: anjum_2009
        supports: partial
        explanation: >-
          The same table reports 1.75 mg/dm3 copper in every iron-supplemented
          culture and control, and less manganese in the pH-2.5 culture
          (15.8 versus 17.85 mg/dm3). Thus the broad concluding improvement
          claim is not supported for copper or all manganese conditions.
          Unsupplemented non-iron cells marked ND cannot be treated as zero:
          p5262 says only iron was analyzed in that medium. Added medium iron
          prevents assigning all dissolved iron to the ore. Table 1 reports
          acid-digest concentrations in mg/L, not solid mg/kg; it is not used
          as an extraction denominator. Jarosite and gypsum are reported in
          both biotic and abiotic residues, not as uniquely microbial products.
  - id: neutral_stage_bacillus_leaching
    name: Neutral-stage culture-associated leaching of acid-pretreated shale
    process: bioleaching
    description: >-
      A source-identified Bacillus mixture was associated with additional
      copper and nickel release from previously acid-bioleached Lubin shale
      at near-neutral pH. Chemical differences between culture and thymol
      controls prevent isolating the biological contribution. The proposed
      cleavage of organometallic bonds is an interpretation, not directly
      demonstrated molecular chemistry.
    context: >-
      Farbiszewska-Kiczma et al. extensively water-washed the acid-preleached
      ore before this second stage. Prepared feed contained 1.58% Cu,
      0.67% Pb, 0.27% Zn and 0.006% Ni. The source identified B. cereus
      B.c.-04 and B. amyloliquefaciens B.a.-04 using phenotype-based methods;
      no sequence or collection accession authenticates either strain here.
      The 1:1 mixture was tested in a 24-day, 25-degrees-C aerated reactor
      at 300 rpm using 400 g feed, 3400 mL mineral medium and 600 mL
      inoculated broth. pH was brought near 7 with 10% NaOH. Controls used
      400 g feed, 4000 mL mineral medium and 20 g thymol, without matched
      uninoculated broth. Copper and nickel were measured by atomic absorption.
      Companion 28-day flasks at 10, 20 and 40 degrees C had pH checked
      twice daily and adjusted near 7. Replicate experiments and analytical
      uncertainty are not specified; three temperatures are not three replicates.
    microbial: true
    evidence:
      - source_ref: farbiszewska_2004
        supports: support
        explanation: >-
          Reactor methods pp275-276, Figure 4 and Table 1: reported extraction
          percentages were 2.5% Cu and 9.3% Ni in the culture treatment,
          versus 0.15% and 0.22% in the thymol comparison. These concern
          metals remaining in pretreated feed, not overall recovery from raw
          shale; no isolated metal product or industrial deployment is shown.
          Flask Figure 3 also retains very low zinc concentrations with
          nonzero control release, rather than universal efficient leaching.
      - source_ref: farbiszewska_2004
        supports: partial
        explanation: >-
          Flask methods print a solid-to-liquid ratio of 5:1, inconsistent
          with interpreting the published concentration/percentage pairs
          using that literal loading; no corrected ratio is asserted.
          Figure 1's temperature legend conflicts with the prose: the
          highest final copper curve is labelled 10, whereas p277 assigns
          90 mg/dm3 to 40 degrees C. No temperature optimum is curated.
          Thymol effects and the unmatched reactor broth remain confounders.
          Leaching kinetics and phenotypic identification alone do not prove
          particular metal-organic bonds, enzyme action or strain identity.
  - id: wzq_energy_substrate_comparison
    name: Substrate-dependent extraction estimates during mixed-culture leaching
    process: bioleaching
    description: >-
      The adapted WZ-Q microbial community was used in laboratory assays of
      vanadium-, nickel- and molybdenum-bearing shale. Added ferrous substrate
      increased the reported molybdenum extraction estimate while lowering
      vanadium and nickel estimates relative to the inoculated unamended arm.
      Pyrite gave lower estimates for all three metals. The comparison does
      not establish a microbial advantage over chemical leaching.
    context: >-
      Lu et al. used the mixed WZ-Q community, derived by ore and molybdenum
      adaptation of WZ-Y and described at genus level as dominated by
      Leptospirillum and Acidithiobacillus. No member-specific causal role or
      authenticated strain is assigned. Black-shale origin and particle size
      are unspecified in the inspected methods. Conditions were 10% w/v
      solids, 10% v/v inoculum, 0K salts medium, 30 degrees C, initial pH 1.4
      and 150 rpm, with trajectories shown through day 30. Triplicate
      experiments are reported per condition. WZ-1 had no additive, WZ-2
      ferrous sulfate, WZ-3 elemental sulfur at 1 g/L, and WZ-4 pyrite at
      1 g/L. Table 3 prints Fe2+ at 44.6 g/L, whereas the culture-medium
      recipe specifies FeSO4.7H2O at 44.6 g/L; the ferrous-dose basis remains
      unresolved. WZ-1 is inoculated, and no abiotic black-shale comparator
      is reported. Separate molybdenite-concentrate assays are not this feed.
    microbial: true
    evidence:
      - source_ref: lu_2026
        supports: support
        explanation: >-
          Sections 2.3-2.4 and 4.1, Table 3 and Figures 5-7: source-annotated
          extraction values for WZ-1/WZ-2/WZ-3/WZ-4 are 66.0/59.5/66.5/65.3%
          V, 82.4/80.6/82.5/80.8% Ni and 9.7/29.7/12.9/7.7% Mo. Methods
          describe ICP-OES analysis of digested post-leach residues, without
          an explicit extraction equation or complete residual-mass balance.
          These are reported extraction estimates, not independently verified
          dissolved inventories or recovered-product yields.
      - source_ref: lu_2026
        supports: partial
        explanation: >-
          Figures 5-7 include error bars without defining their statistical
          meaning; some axes run from 0 to 1 while labelled percent. The
          curated values follow the explicit percentage annotations, not
          a reconstructed axis conversion. The small sulfur-arm differences
          from WZ-1 (0.5 percentage points V and 0.1 Ni) do not establish
          statistically demonstrated enhancement. Acid/redox differences,
          missing abiotic arms and the uncertain iron dose constrain causal
          attribution. Community annotations and operational chemical
          fractionation do not prove a taxon-specific pathway or uniquely
          identify each host phase; no industrial demonstration is reported.
