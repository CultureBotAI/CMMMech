id: cmmmech:adamsite-y
name: Adamsite-(Y)
material_kind: mineral
description: >-
  Hydrated sodium-yttrium carbonate mineral with current September 2026
  IMA-CNMNC approved formula NaY(CO3)2(H2O)3·3H2O and approval number
  IMA 1999-020. Grice, Gault, Roberts, and Cooper (2000) described the cotype
  specimens (CMNMC 82939 and CMNMC 82940, formerly provisional phases UK 96 and
  UK 106) from the Poudrette dike, Poudrette quarry, Mont Saint-Hilaire,
  Rouville County, Quebec, Canada, where it occurs with Petersenite-(Ce),
  shomiokite-(Y), thomasclarkite-(Y), donnayite-(Y), and rhodochrosite.
  Electron-microprobe WDS analysis (7 analyses on 3 crystals, p. 1460) combined
  with thermogravimetric analysis yielded Na2O 8.64, CaO 0.05, Y2O3 22.88, Ce2O3
  0.37, Nd2O3 1.41, Sm2O3 1.02, Gd2O3 1.92, Tb2O3 0.56, Dy2O3 3.28, Ho2O3 0.90,
  Er2O3 2.83, Tm2O3 0.27, Yb2O3 1.04, CO2 25.10 (12.9 wt% evolved in TGA plus
  12.2 wt% ideal non-evolved), H2O 29.90, total 100.17 wt%, corresponding on the
  basis of 12 O atoms to the empirical formula
  Na1.00(Y0.72Dy0.06Er0.05Gd0.04Nd0.03Yb0.02Sm0.02Ho0.02Ce0.01Tb0.01Tm0.01)Sigma0.99C2.04H11.87O12.
  Single-crystal X-ray diffraction refined in triclinic space group P-1
  (a = 6.2592(4), b = 13.0838(7), c = 13.2271(5) A, alpha = 91.130(1),
  beta = 103.554(1), gamma = 90.188(1) degrees, V = 1052.8(1) A3, Z = 4,
  R = 0.046, wR = 0.058 for 3338 observed reflections with |Fo| > 5sigma(Fo);
  powder XRD cell a = 6.262(2), b = 13.047(6), c = 13.220(5) A,
  alpha = 91.17(4), beta = 103.70(4), gamma = 89.99(4) degrees, V = 1049.1(5) A3)
  established a layered [Y(CO3)2(H2O)]- sheet structure alternating with
  [Na(H2O)5]+ polyhedra and unbonded interstitial H2O molecules; hydrogen
  positions were inferred from O...O distances rather than refined directly.
  Thermogravimetric analysis under dry nitrogen demonstrated two major multi-step
  weight-loss intervals up to 590 degrees C, and the mineral readily dissolves
  with strong effervescence in 10% HCl and decrepitates in acetone or alcohol.
  Distinct from shomiokite-(Y), thomasclarkite-(Y), piilonenite-(Nd), and
  elemental yttrium; no criticality designation, microbial mechanism, or
  industrial recovery process is asserted.
