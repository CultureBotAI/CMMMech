  - ima
  - weeks1953
  - evans1955
- assessment_id: weathering
  area: evidence
  topic: Natural intergrowths versus experiment
  outcome: supported
  summary: The natural alteration mechanism is appropriately qualified as inferred.
  details: The Bitter Creek study used two altered crystals, reused the earlier montroseite
    intensities and estimated 99/34 reflections visually without absorption correction.
    Parallel lattices and Table 4 bond geometry support the authors’ oxidation/hydrogen-loss
    interpretation; atoms were not tracked. Below 50 degrees C is a proposed weathering
    setting, not a measured threshold. Unresolved diffuse A and possible Fe-rich alternative
    are retained; evidence is partial, not a claimed controlled assay.
  target_ids:
  - cmmmech:paramontroseite
  evidence_ids:
  - owner
  - evans1955
  - structure1953
- assessment_id: historic_composition
  area: quantity
  topic: Mixed specimens, calculation and published correction
  outcome: supported
  summary: Historical quantitative statements retain their denominator and uncertainty.
  details: Bitter Creek, Matchless and Whitney separates have different impurities.
    Matchless approximately 35 percent substituted oxyhydroxide/65 percent VO2 is
    calculated bulk interpretation, not conversion yield. Historical Fe charge compensation
    is not direct valence measurement. The original 1955 footnote corrects k-odd calculated
    factors and R from 0.21 to 0.11; the owner points to that correction.
  target_ids:
  - cmmmech:paramontroseite
  evidence_ids:
  - owner
  - weeks1953
  - structure1953
  - evans1955
- assessment_id: heating
  area: scope
  topic: Specimen, pretreatment and separate protocols
  outcome: supported
  summary: The laboratory transformation is restricted to the studied natural material
    and protocol.
  details: Prachovice material is compositionally zoned, Fe/Al-bearing and associated
    with U-rich material. Powder selected from mapped U-free areas retained about
    8 wt% calcite. The Pt-holder powder protocol was 20 degrees C/min, 50-degree steps,
    two-hour holds before approximately 150-minute scans; six hours at 400 degrees
    C applies to separate crystals. No pure-VO2 comparison or specified gas flow/fugacity
    supports a universal threshold.
  target_ids:
  - cmmmech:paramontroseite
  evidence_ids:
  - owner
  - curetti2023
- assessment_id: thermal_outcome
  area: quantity
  topic: Phase persistence, product disagreement and mass balance
  outcome: supported
  summary: Qualitative phase change is supported while disputed fractions remain unresolved.
  details: Table 3 and Figure 7 retain parent at 400 and 450 degrees C; the 500-degree
    plotted assemblage lacks parent, while methods state measurements up to 550. The
    prose assigns about 65/35 wt% to Fe2V4O13/V2O5 but the Figure 7 labels show V2O5
    larger and calcite retained. No exact yield is selected. The approximate Al-free
    reaction formula differs from measured average and refined occupancy. Calcite-based
    lack-of-glass reasoning is an internal-reference inference; no separate glass
    quantification or recovered-product mass balance is asserted.
  target_ids:
  - cmmmech:paramontroseite
  evidence_ids:
  - owner
  - curetti2023
- assessment_id: structural_raman
  area: evidence
  topic: Refinement and laser-sensitive Raman
  outcome: supported
  summary: The proposed cation sites and spectroscopy remain qualified.
  details: Table 1 M/T occupancy 0.762(3)V/0.196(2)Fe differs from average V0.84Fe0.19Al0.03O2;
    the T-site model is supported for this specimen but Al is omitted and valences
    are not all directly assayed. Figure 9 and section 3.3 show laser-induced alteration;
    no Fe2V4O13 reference and overlapping peaks prevent unique Raman assignment. No
    rutile-type product is observed under this protocol, without proving impossibility
    elsewhere. CCDC original deposits were unavailable to this review and were not
    independently refined.
  target_ids:
  - cmmmech:paramontroseite
  evidence_ids:
  - owner
  - curetti2023
- assessment_id: boundaries
  area: scope
  topic: Criticality, biology and deployment
  outcome: supported
  summary: No unsupported constituent criticality or microbial/industrial claim is
    present.
  details: Material kind mineral is correct. Criticality is unrecorded, not a claim
    of noncriticality. Every mechanism is explicitly microbial:false; no organism,
    strain, biomass state or causal biological role is fabricated. Geological inference
    and laboratory oxidative breakdown are not extraction, dissolved-metal yield,
    isolated recovery or industrial deployment.
  target_ids:
  - cmmmech:paramontroseite
  evidence_ids:
  - owner
  - ima
  - evans1955
  - curetti2023
- assessment_id: provenance
  area: provenance
  topic: Exact-state capture and actual CREATE
  outcome: supported
  summary: The exact inputs and actual changes are auditable.
  details: Native inspect captured the trusted e8cfa60 base, uncommitted state and
    owner/history/dossier/schema hashes before assessment. The separate vanadium curator
