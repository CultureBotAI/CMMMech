id: cmmmech:lithium-bearing-geothermal-brine
name: Lithium-bearing geothermal brine
material_kind: primary_resource
description: Naturally occurring geothermal saline water containing dissolved lithium, considered as a geological extraction feed. The resource is a variable aqueous mixture, distinct from elemental lithium, a mineral species, manufactured lithium carbonate and waste-derived secondary resources. The curated experiment used one unsterilized brine from an unnamed Cornish geothermal project; its composition and laboratory response do not define all geothermal brines. No criticality designation or external material identifier is inferred from the lithium constituent.
