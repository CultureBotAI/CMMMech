- Historical ramp/product-identification conflicts remain unresolved; current veatchite
  formula is an identity constraint, not proof of the actual heated phase.
- No separate ADI8113/CISTI structure factors or verified authority CIF acquired;
  published tables and constrained hydrogen model are the accepted evidence.
- Atmosphere/replication and powder-heating hold duration are not fully specified;
  no kinetic coefficient or recovery fraction accepted.
- Shared source acquisition is disclosed. Bounded correction and hidden/ignored dedup
  searches do not establish exhaustive absence.
- Working-tree review at the retained base. Record validation is separate from scientific
  truth; native review-check and committed-head/hosted publication remain separate.
