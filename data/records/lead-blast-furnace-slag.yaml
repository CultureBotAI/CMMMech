    ncbifam_ids:
    - NCBIfam:TIGR01786
    functional_role: Outer-membrane TonB-dependent ferripyoverdine receptor FpvA (PA2398) mediating uptake and cell-surface association of metal-pyoverdine complexes in Pseudomonas aeruginosa.
    annotation_note: 'Grounded to reviewed Swiss-Prot entry UniProtKB:P48632 (FPVA_PSEAE; fpvA / PA2398) in Pseudomonas aeruginosa PAO1 reference proteome UP000002438 (NCBITaxon:208964; UniProtKB organism string: Pseudomonas aeruginosa (strain ATCC 15692 / DSM 22644 / CIP 104116 / JCM 14847 / LMG 12228 / 1C / PRS 101 / PAO1)) as a species-level ortholog proxy for strain CIP 105094 (mechanisms[].organisms[].id NCBITaxon:287) in Yin (2014) / van Hullebusch et al. (2015).'
    evidence:
    - source_ref: yin2014_thesis
      supports: partial
      explanation: Yin (2014) Sections 8.3.1, 8.4.1, and 8.4.3 and Figures 8.7 and 8.9 propose siderophore chelation and cell/biofilm metal association to explain differences between H2O2/heat-digested and filtered biotic liquids (though filtration also removes neoformed precipitates and fpvA was not directly assayed).
  evidence:
  - source_ref: yin2014_thesis
    supports: support
    explanation: Sections 8.2.1-8.2.3 establish feed origin, medium, duplicate control arms and ICP-AES measurement. Figures 8.1 and 8.7 and Table 8.3 support greater cumulative release in digested biotic liquid than in sterile medium under the reported conditions. This is a treatment-level comparison, not a demonstrated molecular mechanism. Figure 8.6 shows bacterial colonization of the slag surface; the neighboring abiotic images also show glass and lead-droplet alteration.
  - source_ref: yin2014_thesis
    supports: partial
    explanation: Table 8.3 reports 128-day cumulative Zn release of 260.4 micrograms per gram of slag in digested biotic liquid and 257.0 micrograms per gram in ultrapure water, versus 42.6 in sterile medium. The water arm therefore precludes describing Zn release as universally or exclusively microbially driven. The filtered biotic Zn value is 136.8 micrograms per gram of slag; it represents a different sampled fraction, not a lower total extraction experiment. The source does not establish statistical superiority over water or a recovered-metal yield.
  - source_ref: yin2014_thesis
    supports: partial
    explanation: Sections 8.3.1 and 8.4.1 and Figure 8.7 attribute differences between digested and filtered liquid to metal association with cells or biofilm. Filtration also removes neoformed precipitates, so that difference alone cannot distinguish biosorption, intracellular accumulation and noncellular particulate metal. The narrative's 28% dissolved and 72% associated Fe are not arithmetically consistent with Table 8.3 values 91.1 and 270.1 micrograms per gram. No corrected fraction or exclusive biosorption yield is adopted.
  - source_ref: yin2014_thesis
    supports: context_only
    explanation: Section 8.4.3 and schematic Figure 8.9 propose siderophore complexation and cell-surface binding to explain enhanced mobilization. They do not directly identify or quantify those ligands in this experiment. Table 8.4 extrapolates complete leaching times while neglecting protective secondary layers; these are model extrapolations, not observed field lifetimes or industrial treatment times. Neither criticality nor a separated product recovery is established.
