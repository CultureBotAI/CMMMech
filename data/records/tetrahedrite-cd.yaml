id: cmmmech:tetrahedrite-cd
name: Tetrahedrite-(Cd)
material_kind: mineral
ima_symbol: Ttr-Cd
description: >-
  IMA-approved copper-cadmium antimony sulfosalt mineral of the tetrahedrite series within
  the tetrahedrite group (IMA 2022-115; symbol Ttr-Cd; status A, Approved 2023; full
  description published November 2023) with ideal end-member formula Cu6(Cu4Cd2)Sb4S13
  (requiring Cu 36.02 wt%, Sb 27.61 wt%, S 23.63 wt%, Cd 12.74 wt%, total 100.00 wt%; Sejkora
  et al., 2023, European Journal of Mineralogy 35:897-907). Represents the Cd-dominant C-site
  member of the tetrahedrite series and the Sb-isotype of tennantite-(Cd) and Cu-isotype of
  argentotetrahedrite-(Cd). Discovered in low-temperature hydrothermal quartz and (Pb-Mn)-rich
  calcite gangue from the 7th and 8th levels of the S-1 vein at the Radetice shaft, 300 m
  east of Radetice and 5 km southeast of Pribram, central Bohemia, Czech Republic
  (49 deg 38 min 20.44 sec N, 14 deg 05 min 13.66 sec E), hosted in Carboniferous coarse-
  grained granodiorite of the central Bohemian plutonic complex and associated with galena,
  bournonite, sphalerite, pyrite, geocronite, native silver, stromeyerite, tetrahedrite-(Zn),
  tetrahedrite-(Fe), Pb- and Cd-rich tetrahedrite-(Cu), and an unknown Pb-rich tetrahedrite-
  like phase (with a second documented occurrence in 1930 museum specimen MH-00683 from the
  Zmeinogorsk Mine, Altai Krai, Western Siberia, Russia); the holotype polished section is
  deposited in the Department of Mineralogy and Petrology, National Museum in Prague, Czech
  Republic (catalogue number P1P 43/2022), and the single-crystal X-ray diffraction grain is
  deposited in the Museo di Storia Naturale of the Universita di Pisa, Calci (PI), Italy
  (catalogue number 20025). Forms black metallic anhedral grains up to 200 um in size (or up
  to 50 x 50 um domains in Zmeinogorsk tetrahedrite-(Zn)) with a black streak, metallic
  lustre, opaque diaphaneity, estimated Mohs hardness ~4, brittle tenacity, conchoidal
  fracture, indistinct cleavage, and calculated density Dcalc = 5.094 g/cm3 from the holotype
  empirical formula and single-crystal unit cell. In reflected light it is isotropic and grey
  with greenish tints (Radetice) or greenish-brownish tints (Zmeinogorsk) without internal
  reflections; Commission on Ore Mineralogy (COM) reflectance values in air for the Radetice
  holotype (and Zmeinogorsk sample; Table 1) are 30.8% (30.3%) at 470 nm, 31.1% (31.2%) at
  546 nm, 31.1% (31.6%) at 589 nm, and 28.8% (29.7%) at 650 nm. Wavelength-dispersive
  electron microprobe analysis of the Radetice holotype (n = 13 spot analyses, Cameca SX100,
  25 kV, 20 nA, 1 um beam; Table 2) yielded Cu 34.85(26) wt% (range 34.32-35.16), Sb
  28.07(26) wt% (27.52-28.34), S 23.38(18) wt% (23.00-23.70), Cd 11.03(47) wt% (10.37-11.76),
  Ag 2.09(42) wt% (1.57-3.00), Hg 0.75(18) wt% (0.47-0.98), Pb 0.31(24) wt% (0.00-0.90), Zn
  0.26(13) wt% (0.10-0.49), and Fe 0.18(6) wt% (0.10-0.31), total 100.92(35) wt% (range
  100.17-101.36), corresponding on the basis of SigmaMe = 16 apfu to the empirical formula
  Cu9.65(4)Ag0.34(7)Cd1.73(7)Zn0.07(4)Hg0.07(2)Fe0.06(2)Pb0.03(2)Sb4.06(3)S12.84(10) (or
  Cu9.52(4)Ag0.34(7)Cd1.70(7)Zn0.07(3)Hg0.06(2)Fe0.06(2)Pb0.03(2)Sb4.00S12.65(10) on the
  basis of Sb = 4 apfu) and simplified formula (Cu,Ag)6[Cu4(Cd,Zn,Hg,Fe)2]Sb4S13; the
  Zmeinogorsk cotype-like occurrence (n = 5, Tescan Solaris FEG-SEM WDS, 25 kV, 10 nA, 2 um
  beam; Table 2) yielded Cu 35.12(75) wt%, S 23.92(83) wt%, Sb 22.79(86) wt%, Ag 6.93(78) wt%,
  Cd 6.72(122) wt%, As 2.63(146) wt%, Mn 0.81(36) wt%, Zn 0.38(21) wt%, and Fe 0.14(11) wt%,
  total 99.44(68) wt%, giving
  Cu9.59(12)Ag1.12(14)Cd1.04(19)Mn0.26(11)Zn0.10(5)Fe0.04(3)Sb3.25(17)As0.61(33)S12.95(62).
  Crystallizes in the cubic system, space group I-43m (#217), with single-crystal X-ray
  diffraction unit-cell parameters a = 10.504(3) A, V = 1158.9(9) A3, and Z = 2 (misprinted
  in the Abstract on p. 897 as "Tennantite-(Cd) is cubic, I-43m, with unit-cell parameters
  a = 10.504(3) A, V = 1158.9(9) A3, and Z = 2"; refined with racemic twinning to R1 =
  0.0252 for 257 reflections with Fo > 4sigma(Fo) and R1(all) = 0.0283, wR2 = 0.0645, GoF =
  1.158, Flack parameter 0.05(11) for 272 unique reflections from 1594 measured at 293(2) K
  on a 0.100 x 0.040 x 0.035 mm grain using MoKalpha radiation, Table 4). In the isotypic
  tetrahedrite-group structure (Tables 5-7), the M(2) site (populated by Cu0.95Ag0.05, MANobs
  = 29.3 e-, BVS = 1.01 v.u.) is split into triangular planar M(2a) (<M(2a)-S> = 2.268 A) and
  flat trigonal pyramidal M(2b) (<M(2b)-S> = 2.302 A) separated by 0.43(6) A, the tetrahedral
  M(1) site (populated by Cu+0.68Cd2+0.29Zn2+0.01Hg2+0.01Fe3+0.01, refined s.o.
  Cu0.731(17)Cd0.269(17), MANobs = 34.1(6) e-) has M(1)-S(1) = 2.391(2) A x 4 (BVS = 1.60
  v.u.), and the trigonal pyramidal X(3) site (Sb1.00, BVS = 3.12 v.u.) has X(3)-S(1) =
  2.435(3) A x 3 in Table 6 (referred to as "2.434 A" in the text on p. 903). The five
  strongest calculated powder X-ray diffraction lines (dcalc in A (Icalc; hkl), Table 3; note
  that Table 3 misprints dcalc for 4 4 4 without a decimal point as "1516" for 1.516 A) are
  3.032 (100; 2 2 2), 1.857 (40; 4 4 0), 2.626 (24; 4 0 0), 1.584 (21; 6 2 2), and 3.714 (7;
  2 2 0) / 1.918 (7; 5 2 1). No biological or microbial interaction data are reported in the
  type mineralogical description.
