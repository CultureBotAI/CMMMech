mechanisms:
- id: mr1_selenite_reduction
  name: Non-growing MR-1 selenite reduction with conditional FccA and CymA involvement
  process: redox_transformation
  description: Washed Shewanella oneidensis MR-1 cells transformed selenite to selenium-associated particles, with XPS supporting elemental Se in the analyzed cell fraction. Gene-deletion phenotypes support FccA and CymA involvement under the tested conditions; they do not prove an exclusive pathway or direct catalysis by purified FccA.
  context: Laboratory cells grown in LB at 30 degrees C were washed twice and added at OD600 1.0 to 40 mL anaerobic mineral medium under nitrogen, with 0.5 mM selenite and 20 mM lactate at 30 degrees C. The medium contains HEPES/NaOH but the paper does not state a measured pH. Fumarate at 20 mM was added only in the separate competition assay. The authors report no growth and declining protein-based biomass. Kinetic rates refer to the initial 12 h; XPS sampled washed, lyophilized cells after 48 h. These are laboratory transformations, not demonstrated purified-product recovery or industrial deployment.
  microbial: true
  organisms:
  - id: NCBITaxon:211586
    label: Shewanella oneidensis MR-1
  protein_examples:
  - uniprot_accession: UniProtKB:P83223
    entry_name: FCCA_SHEON
    protein_name: Fumarate reductase (cytochrome)
    gene_symbol: fccA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:211586
      label: Shewanella oneidensis MR-1
    reference_proteome_id: UP000008186
    ec_numbers:
    - EC:1.3.2.4
    interpro_ids:
    - InterPro:IPR003953
    - InterPro:IPR050315
    - InterPro:IPR036188
    - InterPro:IPR010960
    - InterPro:IPR036280
    - InterPro:IPR027477
    - InterPro:IPR012286
    pfam_ids:
    - Pfam:PF14537
    - Pfam:PF00890
    functional_role: Periplasmic tetraheme flavocytochrome c fumarate reductase FccA (EC 1.3.2.4; SO_0970) implicated by gene-deletion kinetics and fumarate competition as the principal periplasmic contributor to early selenite Se(IV) reduction in washed non-growing Shewanella oneidensis MR-1 cell suspensions.
    evidence:
    - source_ref: li_2014
      supports: partial
      explanation: In Li et al. (2014) Figure 2 and Results, deleting fccA in washed non-growing Shewanella oneidensis MR-1 suspensions (OD600 1.0 in 40 mL anaerobic mineral medium under N2 with 0.5 mM selenite and 20 mM lactate at 30 degrees C; declining Micro BCA protein biomass in Supporting Figures S2/S4) reduced the initial 12 h selenite-depletion rate from 1.35 +/- 0.05 micromol/h in wild type to 0.54 +/- 0.13 micromol/h in delta-fccA (standard errors of triplicate cultures), and 20 mM fumarate competitively inhibited selenite reduction; however, substantial residual reduction persisted and no genetic complementation or purified-FccA enzyme assay was reported.
  - uniprot_accession: UniProtKB:Q8E8S0
    entry_name: CYMA_SHEON
    protein_name: Tetraheme c-type cytochrome CymA
    gene_symbol: cymA
    entry_status: SWISS_PROT
    target_organism:
      id: NCBITaxon:211586
      label: Shewanella oneidensis MR-1
    reference_proteome_id: UP000008186
    ec_numbers:
    - EC:7.1.1.8
    interpro_ids:
    - InterPro:IPR051174
    - InterPro:IPR036280
    - InterPro:IPR024717
    - InterPro:IPR005126
    - InterPro:IPR038266
    pfam_ids:
    - Pfam:PF03264
    functional_role: Inner-membrane tetraheme c-type menaquinol dehydrogenase CymA (EC 7.1.1.8; SO_4591) implicated by deletion-mutant kinetics in transferring electrons from the menaquinol pool to periplasmic electron acceptors including FccA during selenite reduction in non-growing S. oneidensis MR-1.
    evidence:
    - source_ref: li_2014
      supports: partial
      explanation: In Li et al. (2014) Figure 4, deleting cymA slowed early selenite reduction in washed non-growing Shewanella oneidensis MR-1 suspensions (0.5 mM selenite, 20 mM lactate, 30 degrees C) while preserving substantial later residual selenite reduction, and Klonowska et al. (2005) similarly reported that a cymA-deletion mutant still reduced selenite in LB growth medium (data not shown), indicating conditional involvement without an exclusive CymA requirement or genetic complementation.
  - uniprot_accession: UniProtKB:Q8EG34
    entry_name: Q8EG34_SHEON
    protein_name: Extracellular iron oxide respiratory system surface decaheme cytochrome c component MtrC
    gene_symbol: mtrC
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:211586
      label: Shewanella oneidensis MR-1
    reference_proteome_id: UP000008186
    interpro_ids:
    - InterPro:IPR020014
    - InterPro:IPR054337
    - InterPro:IPR054334
    - InterPro:IPR036280
    pfam_ids:
    - Pfam:PF22113
    - Pfam:PF22111
    functional_role: Outer-membrane decaheme c-type cytochrome MtrC (SO_1778) evaluated as an outer-membrane electron-transfer comparator during selenite reduction.
    evidence:
    - source_ref: li_2014
      supports: partial
      explanation: Evaluated alongside delta-fccA and delta-cymA in Li et al. (2014) washed non-growing S. oneidensis MR-1 suspensions (0.5 mM selenite, 20 mM lactate, 30 degrees C), where outer-membrane Mtr-pathway deletion mutants retained most selenite-reduction activity compared with delta-fccA, indicating only a minor parallel contribution under the tested conditions.
  evidence:
  - source_ref: li_2014
    supports: support
    explanation: Figure 2 and Results report initial selenite-depletion rates of 0.54 +/- 0.13 micromol/h for delta-fccA and 1.35 +/- 0.05 for WT; the caption specifies standard errors of triplicate cultures. Figure 4 preserves substantial later residual reduction in delta-cymA. Thus reduced rates support involvement, not absolute necessity. No complementation or purified-FccA assay is reported.
  - source_ref: li_2014
    supports: support
    explanation: Figure 5 shows predominantly intracellular and smaller surface particles. EDX establishes elemental composition; the 48 h Se 3d XPS peak supports the Se(0) assignment. Neither proves exclusive periplasmic localization or a phase-pure isolated product. Supernatant selenite was assayed by acid/ascorbate colorimetry; Table 1 provides a separate digestion/ICP-AES selenium balance, not an isolated recovery yield.
  - source_ref: li_2014_supplement
    supports: support
    explanation: Figure S1 caption identifies autoclaved cells as the adsorption comparison; main Results report negligible adsorption. Figure S2 caption and S4 describe a BSA-equivalent Micro BCA protein assay for biomass, rather than a viable-cell count. Supplement captions and methods were read; embedded graph pixels were not rendered, so no supplementary numeric points are transcribed.
  - source_ref: klonowska_2005
    supports: partial
    explanation: In a different LB growth context, the paper describes extracellular or cell-attached selenium deposits (Figure 1, 2 mM selenite) and reports that a cymA-deletion mutant still reduces selenite (data not shown). These observations limit universal localization and pathway claims. They are not a matched quantitative refutation of Li's rate defect. The older EDX assignment alone does not resolve selenium oxidation state.
