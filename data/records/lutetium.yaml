  evidence:
  - source_ref: breuker_2020_supp
    supports: support
    explanation: Table S1, experiment 2, Lu column, reports means of two parallel assays of 74% at two and four hours. Experiment 1 and Figure S1 contain La, Nd, Dy and Yb, without Lu; their biomass-loading and time patterns are not lutetium measurements. The percentage is calculated by the main paper's Section 2.2 formula (control minus sample)/control.
  - source_ref: breuker_2020
    supports: support
    explanation: Methods 2.1–2.2, Table 1 and Figure 2a locate the ATCC 7003 preparation and the Lu-specific bar for the eight-REE, 5 g/L, two-hour assay. The pattern shows greater fractional depletion for Lu than the lighter members of this mixture, without establishing universal selectivity across different feeds or proving a particular binding ligand.
  - source_ref: breuker_2020
    supports: partial
    explanation: Figure 1 shows lower relative Lu biosorption at higher REE loading, while Figure 7 shows lower Lu depletion with autoclaved than untreated biomass under its separate 4 g/L conditions. Autoclaving changes cell integrity and does not by itself prove metabolically driven uptake. Section 3.1 explicitly leaves the dominant acidic-pH binding chemistry unresolved. Figure 4's separate Fe/Zr competition assay has different Lu percentages from Figure 2; its similar paired outcomes do not establish that all competing ions are harmless. The wastewater application concerns gadolinium, not lutetium.
causal_graphs:
- id: bsubtilis_acidic_mixture_biosorption_graph
  name: Bacillus subtilis lipoteichoic acid (LtaS) cell-wall synthesis and selective heavy-lanthanide Lu(III) biosorption at pH 2.51
  description: 'Causal pathway linking reviewed Swiss-Prot Bacillus subtilis subsp. subtilis str. 168 (NCBITaxon:224308; reference proteome UP000001570) lipoteichoic acid synthases LtaS2 (UniProtKB:O34952), LtaS1 (UniProtKB:Q797B3), YqgS (UniProtKB:P54496), and YvgJ (UniProtKB:O32206) (EC:2.7.8.40; GO:0052642, GO:0070395) to cell-wall poly(glycerol phosphate) teichoic/lipoteichoic acid phosphodiester site formation in stationary-phase Bacillus subtilis ATCC 7003 (NCBITaxon:1423; 64 h LB growth, washed in 0.01 M HClO4 + 0.1 M NaNO3 at pH 2.0) and selective heavy-lanthanide lutetium (CHEBI:33381) biosorption from a 16-element rare earth solution (~1 mg/L [~5.7 uM] per REE in 50 mL at room temperature and 150 rpm for 2 h): removing 93.3 +/- 2.1% of dissolved Lu(III) at pH 2.51 and OD600 = 1.0 (0.38 +/- 0.04 g/L dry weight, n = 3; second highest after Yb at 94.2 +/- 1.9% and contrasting with La at 1.2 +/- 6.3% in Figure 4 / Table S3) and 16.4 +/- 4.2% of Lu(III) at pH 2.48 and OD600 = 0.6 (0.22
    g/L dry weight in Figure 3 / Table S2) in Breuker et al. (2020).'
