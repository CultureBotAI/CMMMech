  details: Real-brine SM1–SM6 differing nutrient recipes,18g/Lagar,pH7.2,112C20min
    sterilization, aerobic25C30d. Triplicate/repeated experiments and uninoculated/dead-cell
    controls are reported; equivalent control diffractograms and isolate-specific
