id: cmmmech:strengite
name: Strengite
material_kind: mineral
description: Strengite is the orthorhombic ferric phosphate dihydrate mineral Fe3+(PO4)(H2O)2, conventionally
  FePO4·2H2O. The September 2026 IMA-CNMNC list records grandfathered status G and original-description
  year 1877, which is not an approval identifier. It is distinct from its monoclinic dimorph phosphosiderite,
  ferrous phosphate vivianite, amorphous iron phosphate and iron metal. The curated mechanism is an abiotic
  foundation for phosphate-phase transformation; no microbial mechanism or constituent-derived criticality
  is assigned.
