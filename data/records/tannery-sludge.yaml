    target: chromium_rich_tannery_sludge
    predicate: solubilizes
    relationship: acidophilic FeSO4/S0-assisted bioleaching and acidification of pre-acidified Xiamen tannery sludge from pH 6.50 to pH 1.65 over 7 days
    description: 1:1 co-inoculation of sludge-acclimatized A. ferrooxidans CGMCC NO.0727 and A. thiooxidans CGMCC NO.0759 with 4.0 g/L FeSO4 and 3.0 g/L elemental sulfur at 28 C and 180 rpm lowers pre-acidified (pH 6.50) Xiamen tannery-sludge pH to 1.65 over 7 days and solubilizes sludge-bound chromium.
    evidence:
    - source_ref: wang2019
      supports: partial
      explanation: Wang, Gao, Li & Gao (2019) (Desalination and Water Treatment 165:134-140) report that the 1:1 mixed culture supplemented with 4.0 g/L FeSO4 and 3.0 g/L S0 lowered sludge pH from 6.50 (after H2SO4 pre-acidification from pH 7.10) to 1.65 over 7 days at 28 C and 180 rpm; support is partial because the uninoculated sludge was not sterile, no matched-pH acid-only control was tested, and the inoculum fraction is reported as 15% v/v in Section 2.3 versus 10% v/v in Figures 1-2.
