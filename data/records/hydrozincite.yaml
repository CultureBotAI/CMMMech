mechanisms:
  - id: photosynthetic_mat_associated_precipitation
    name: Hydrozincite precipitation associated with a photosynthetic field mat
    process: biomineralization
    microbial: true
    description: >-
      Hydrozincite-bearing precipitates encrusted filamentous microbial
      structures in the Rio Naracauli mine-drainage stream in Sardinia.
      The source interprets photosynthetic alkalinization and binding by
      acidic extracellular polysaccharides as promoting precipitation.
      Diffraction, microscopy and recovery of viable phototrophs support
      this field association, but do not independently prove the necessity
      or separate causal contribution of either community member.
    context: >-
      Podda et al. sampled white mats at stations 3 and 4 in April 1997
      during a photosynthetic bloom and surveyed 14 water stations along
      3.4 km. Table 2 gives station 3 at 17 degrees C and pH 7.1 and
      station 4 at 20 degrees C and pH 7.7; these are field observations,
      not controlled incubation settings. About 2 g of year-old dried
      precipitate was incubated at room temperature in dim light with
      tenfold-diluted BG-11 medium to recover associated organisms.
      Morphological identification assigned Scytonema sp. ING-1 and
      Chlorella sp. SA-1; no sequence- or collection-authenticated species
      mapping is asserted. This resuscitation assay does not measure new
      hydrozincite production. No matched sterile field system or
      controlled isolate-by-isolate precipitation assay is reported.
    evidence:
      - source_ref: podda2000
        supports: support
        explanation: >-
          Hydrozincite determination and distribution, Figure 2, assigns
          hydrozincite in the station 4 solid with quartz and calcite;
          hydrozincite decreases downstream and is not detected at station 8.
          Microbiological evidence of hydrozincite formation, Figures 3-4,
          documents mineral-encrusted tubing, Zn-rich EDX signals and
          phototroph growth from stored precipitate. These observations
          support mineral identity and organism association, not phase purity
          or proof that all mineralization was biological.
      - source_ref: podda2000
        supports: partial
        explanation: >-
          Table 1 is bulk mixed-sediment chemistry, not a hydrozincite lattice
          substitution analysis. Table 2 and Water analysis show concurrent
          downstream changes in pH, dissolved metals and bicarbonate, but
          also acknowledge dilution and bicarbonate-rich inflows. Reported
          percentage decreases between stations therefore are not adopted
          as microbial removal efficiencies or phase-specific recovery.
          Conclusions propose surface alkalinization and polysaccharide
          binding; their individual causal contributions were not isolated.
      - source_ref: ngwenya2014
        supports: partial
        explanation: >-
          Sections 2 and 3.1, Figures 1-2, examine May 2006 samples from the
          same stream system, not a replication of the 1997 sampling event.
          Mineral spheroids are associated with organic strands interpreted
          as EPS. Sections 3.2-5 and Figures 3-6 also show similar structures
          in sterile organic-amended solutions and acknowledge comparable
          morphologies in abiotic systems. Morphology alone is therefore
          not a unique biosignature; proposed protection against entombment
          and metabolite exchange were not measured survival outcomes.
  - id: sterile_organic_mediated_precipitation
    name: Sterile hydrozincite precipitation with organic morphology modifiers
    process: other
    microbial: false
    description: >-
      In a separate laboratory experiment, hydrozincite was assigned to
      precipitates from sterile zinc sulfate-bicarbonate solutions with
      ammonium-carbonate gas diffusion. Organic additives altered aggregate
      morphology relative to no-additive controls. This demonstrates an
      abiotic organic-associated route and does not establish active
      microbial secretion or a necessary living-cell mechanism.
    context: >-
      Ngwenya et al. used 100 mL of autoclaved equimolar 20 mM ZnSO4 and
      NaHCO3 in 250 mL triple-neck flasks connected to a flask containing
      about 10 g ammonium carbonate. Initial pH was adjusted to about 6
      with nitric acid. L-aspartic acid, L-glutamic acid or L-cysteine was
      added at 1 mg/mL, or xanthan at 0.25 mg/mL; no-organic controls were
      included. Incubation lasted just over a week. The paper does not
      specify incubation temperature or independent replicate counts.
      These artificial solutions are not the natural stream samples.
    evidence:
      - source_ref: ngwenya2014
        supports: support
        explanation: >-
          Sections 2 and 3.2, Figure 3a-j, distinguish mostly flat control
          discs from additive-associated aggregates, with botryoidal
          structures particularly evident for aspartic and glutamic acids.
          Sections 3.3-3.4 and Figures 4-5 provide vibrational spectra and
          pH trajectories. XRD confirmation is stated as data not shown;
          spectroscopy supports the assignment without a supplied diffraction
          pattern or quantitative phase fraction. No isolated mineral yield
          or metal recovery percentage is established.
      - source_ref: ngwenya2014
        supports: partial
        explanation: >-
          Sections 4-5 acknowledge that natural specimens lacked diagnostic
          organic vibrational bands despite visible organic strands, and
          cysteine-associated bands could reflect separate solid cysteine.
          Figure 6 is a conceptual and thermodynamic model, not a measured
          survival or transport experiment. These limitations prevent a
          unique molecular nucleation or self-preservation claim.
