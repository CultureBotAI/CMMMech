id: cmmmech:scorodite
name: Scorodite
material_kind: mineral
description: Scorodite is the ferric arsenate mineral FeAsO4.2H2O, listed as Fe3+(AsO4)(H2O)2 in the September 2026 IMA list. It is grandfathered, with original-description year 1818; that year is not an approval number. Scorodite is distinct from its dimorph parascorodite, amorphous ferric arsenate, elemental arsenic or iron, and mixed arsenic-bearing wastes. Laboratory culture-associated precipitation can transfer arsenic from solution into scorodite-bearing solids. The evidence below does not establish permanent environmental sequestration, a saleable recovery product or industrial deployment. No criticality designation is inherited from a constituent element.
