  title: Sklute et al. (2023). Fe(III) (oxyhydr)oxide reduction by the thermophilic iron-reducing bacterium Desulfovulcanus ferrireducens. Frontiers in Microbiology 14:1272245. Methods, Cell growth on akaganeite and lepidocrocite, Figures 5-8, Discussion; previously acquired original XML and supplement reinspected for bounded comparative context.
