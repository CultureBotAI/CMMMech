  - id: ima_2026_09
    title: >-
      IMA-CNMNC, The New IMA List of Minerals, September 2026, PDF page 233,
      Weeksite row: formula (K)2(UO2)2(Si5O13)(H2O)2·2H2O, status A, year
      1962 s.p., country USA, first reference American Mineralogist 45 (1960),
      39, second reference Mineralogical Magazine 90 (2026), 653; column
      definitions on PDF page 1.
    url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
    accessed_on: '2026-10-18'
  - id: outerbridge_1960_weeksite
    title: >-
      Outerbridge WF, Staatz MH, Meyrowitz R, Pommer AM (1960), Weeksite, a new
      uranium silicate from the Thomas Range, Juab County, Utah, American
      Mineralogist 45:39-52. Complete 14-page primary PDF visually inspected:
      Autunite No. 8 holotype and nine additional localities pp. 39-43; physical
      and optical properties Table 1 pp. 43-44; spectrographic and microchemical
      analyses of natural weeksite (100 mg) and synthetic Na-analogue (35 mg) in
      Tables 2-3 pp. 44-47; hydrothermal synthesis at 150 degrees C in sealed
      Pyrex tubes in Table 4 pp. 47-48; X-ray powder and precession data Table 5
      pp. 48-51.
    url: https://www.rruff.net/doclib/am/vol45/AM45_39.pdf
    accessed_on: '2026-10-18'
mechanisms:
  - id: abiotic_hydrothermal_pyrex_synthesis
    name: Laboratory hydrothermal synthesis of weeksite and its sodium analogue in sealed Pyrex tubes
    process: other
    description: >-
      Heating alkaline uranyl nitrate solutions adjusted to pH 10.0 or 11.2 with
      KOH or NaOH inside sealed Pyrex glass tubes at 150 degrees C (~70 lbs/in2)
      for at least three days crystallized synthetic weeksite (with KOH) or its
      isostructural sodium analogue (with NaOH), using the etched Pyrex tube
      wall as the sole source of dissolved silica. In several runs boltwoodite
      co-precipitated with weeksite or its Na analogue.
    context: >-
      Experiments by A. M. Pommer reported in Outerbridge et al. (1960),
      pp. 46-48 and Tables 3-4, tested 16 runs (G-33 through G-188) in sealed
      Pyrex tubes at 150 degrees C (calculated internal pressure ~70 psi) for at
      least 3 days. Solutions contained 0.025 M or 0.05 M uranyl nitrate (with
      0.05 M vanadyl sulfate present only in the first four exploratory NaOH
      runs G-33, G-52, G-53, G-55), adjusted to pH 10.0 or 11.2 with NaOH (runs
      G-33 to G-166) or pH 11.2 with KOH (runs G-167 to G-188), with or without
      sodium/potassium carbonate buffer and wood shavings. Reaction products
      were identified by X-ray powder diffraction (Table 4 footnote 1 and
      Table 5). Only 35 mg of the synthetic Na analogue (run G-143) was
      chemically analyzed (Table 3, column 2); there was insufficient synthetic
      K-weeksite for wet-chemical analysis, and fractional uranium conversion
      yields were not reported.
    microbial: false
    evidence:
      - source_ref: outerbridge_1960_weeksite
        supports: support
        explanation: >-
          Pages 47-48 and Table 4 document that KOH runs at pH 11.2 with 0.05 M
          uranyl nitrate yielded X-ray-verified weeksite as the sole crystalline
          product in runs G-170, G-174, G-182, G-184, G-187, and G-188 (both
          with and without carbonate buffer and wood), whereas runs G-167 and
          G-179 yielded dominant boltwoodite with minor weeksite. Parallel NaOH
          runs (G-55, G-143, G-166) yielded the pure sodium analogue of weeksite,
          whose 35 mg chemical analysis (Table 3, G-143: SiO2 33.9, UO3 52.0,
          Na2O 7.2, H2O 8.1, C from wood 0.3, total 101.5 wt%) and powder XRD
          pattern (Table 5) matched natural weeksite.
      - source_ref: outerbridge_1960_weeksite
        supports: partial
        explanation: >-
          Because silica was supplied by alkaline attack on the Pyrex reaction
          vessel rather than a metered silicate reagent, dissolved silica
          activity, solid-product mass yields, and chemical composition of the
          synthetic K-phase were not quantitatively determined.
