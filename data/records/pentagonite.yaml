id: cmmmech:pentagonite
name: Pentagonite
material_kind: mineral
description: Pentagonite is a hydrated calcium vanadyl silicate mineral, CaV4+OSi4O10(H2O)3·H2O, approved
  as IMA 1971-039 and retained in the September 2026 IMA list. It is a distinct mineral species from cavansite,
  with a six-membered-ring silicate-sheet topology and an ambient orthorhombic Ccm21 structure in the
  inspected primary studies. The historical Oregon description and later Wagholi studies concern different
  natural specimens. Laboratory heating and pressure experiments support abiotic structural changes, with
  protocol-dependent hydration and reversibility. These experiments do not establish a natural formation
  temperature, microbial activity, vanadium extraction, an isolated recovered product or industrial deployment.
  No criticality designation is inherited from vanadium or other constituents.
