    annotation_note: Grounded to reviewed Swiss-Prot entry UniProtKB:A4YHQ8 (SLAA_METS5, slaA / Msed_1806) in reference proteome UP000000242 for Metallosphaera sedula DSM 5348 (NCBITaxon:399549), matching the experimental strain DSM 5348 (species NCBITaxon:43687) in Blazevic et al. (2019).
