id: cmmmech:coal-beneficiation-waste
name: Coal beneficiation waste
material_kind: secondary_resource
description: >-
  Heterogeneous discarded material generated by coal beneficiation, represented
  by gravity/flotation processing dumps of the Lviv-Volyn coal basin and the
  Chervonogradska central concentrating factory. This secondary resource is
  distinct from natural coal, coal combustion ash, mine-drainage treatment
  solids, a particular germanium mineral and elemental germanium. The studies
  describe native-community-associated laboratory leaching and an enlarged
  experimental cascade using selected dump samples; their compositions and outcomes are not universal waste properties.
  Constituent criticality, selective metal products and industrial deployment
  are not inferred.
sources:
