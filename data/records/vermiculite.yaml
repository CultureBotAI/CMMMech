mechanisms:
- id: paxillus_k_exchanged_vermiculite
  name: Fungal-associated potassium acquisition and alteration of potassium-exchanged vermiculite
  process: bioleaching
  microbial: true
  organisms:
  - id: NCBITaxon:71150
    label: Paxillus involutus
  description: Paxillus involutus grown with potassium-exchanged vermiculite had greater potassium concentration
    in harvested mycelium than the potassium-depleted mineral-free fungal control, and the exposed flakes
    showed surface furrows, localized erosion and adhering hyphae. This supports conditional fungal-associated
    potassium acquisition and surface alteration. It does not establish how much potassium release was
    uniquely caused by the fungus, distinguish abiotic cation exchange from biological enhancement, or
    quantify recovery of an isolated potassium product.
  context: Pinzari2024 used the source-reported ATCC 200175 strain, whose ITS identity-checking procedure
    is described in SI S2. The natural vermiculite was NHM specimen BM 1941,89, reported as collected
    north of Loole Kop, Palaboroa, Pietersburg, Transvaal. SI S3 gives SEM-EDX/microprobe composition
    and reports no other minerals detected by XRD, without a quantitative trace-phase detection limit.
    Potassium exchange used KCl at 4.42 g per 100 mL for 14 days under agitation; this deliberate loading
    is distinct from native mineral potassium. Flakes of approximately 2 cm2 were ultrasonically cleaned
    in deionized water and autoclaved at 121 degrees C for 15 minutes. Each 100-by-20 mm Petri dish contained
    30 mL modified Melin–Norkrans agar, a sterile cellophane membrane and mineral flakes, with three 5
    mm plugs from seven-day cultures. Incubation was 21 days at 25 degrees C in darkness. The mineral
    and negative-control arms omitted KH2PO4; ammonium phosphate was adjusted to balance phosphorus against
    complete-medium positive controls, not to establish identical nitrogen conditions. Agar and cellophane
    retained potassium, so depleted does not mean potassium-free. Five biological replicates per condition
    supplied elemental and biomass measurements. This plant-free laboratory assay is not an industrial
    process or demonstrated transfer of mineral nutrients to a plant.
  evidence:
  - source_ref: pinzari_2024
    supports: support
    explanation: Table 3 reports potassium at 25.11 ± 4.31 micrograms per gram dry mycelium for K-vermiculite,
      versus 5.52 ± 1.69 in the depleted control and 304.11 ± 11.05 in the complete-medium control (means
      ± SD, n=5). Their distinct statistical groups b, c and a support the reported ANOVA/Tukey contrast.
      Methods 2.3 removed mineral flakes before digestion, but these harvested-material concentrations
      are not a mineral-release fraction or total recovered potassium; microscopic carryover and intracellular
      versus surface-associated potassium were not separately resolved. Figure 1c1–c3 compares initial
      and fungus-exposed flakes and shows the surface changes.
  - source_ref: pinzari_2024_si
    supports: support
    explanation: Methods S1–S3 and Figure S1 establish distinct mineral and fungal-control arms, the strain-identification
      procedure, specimen provenance, KCl pretreatment and preparation. SI S3 assigns the exchanged material
      structural formula (Si2.96Al0.81Fe3+0.23)(Mg2.86Fe3+0.09Ti0.05Cr0.01)(Mg0.23Ca0.01K0.38)O10(OH)2,
      with tetrahedral, octahedral and interlayer groups, respectively. This specimen-specific formula
      does not define every member of the vermiculite grouping.
  - source_ref: pinzari_2024
    supports: partial
    explanation: The five-condition experiment has fungal mineral-free positive/negative controls but
      no reported matched aged fungus-free K-vermiculite arm. Before-exposure images do not supply that
      control. Abiotic release of the deliberately exchanged potassium and dissolution caused by acidified
      medium therefore remain alternatives to a uniquely fungal extraction contribution. Table 1 gives
      initial pH 5.6 ± 0.1 and final vermiculite-arm pH 2.27 ± 0.33; its statistical group overlaps the
      depleted control. Table 2 also gives overlapping dry-biomass groups for vermiculite and both controls,
      so increased potassium concentration is not proof of increased dry biomass.
  - source_ref: pinzari_2024
    supports: partial
    explanation: Discussion 4.1 says aluminium in vermiculite-grown mycelium was significantly greater
      than in controls, but Table 3 assigns vermiculite and both controls the same aluminium group b.
      No significant aluminium-acquisition claim is accepted here. Figures 2–5, Table 5 and Discussion
      4.2 show expression responses, but no knockout or enzyme-specific intervention demonstrates the
      proposed exchange, physical-pressure or redox pathways. The paper reports no significant upregulation
      of its identified potassium-transporter genes versus the depleted control. Related Pinzari2022 work
      is not counted as an independently verified replication.
  - source_ref: ncbi_paxillus
    supports: context_only
    explanation: Current taxon 71150 establishes the species name. ATCC 200175 remains the strain reported
      by the original paper, not an independently authenticated culture stock or strain-specific NCBI
      identifier.
