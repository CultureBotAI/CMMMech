    functional_role: Reviewed Swiss-Prot plasma-membrane MFS citrate exporter CexA (cexA, locus ASPNIDRAFT_44471; CEXA_ASPNA) in the citric-acid-producing reference strain Aspergillus niger ATCC 1015 (UP000006706).
    annotation_note: Reviewed Swiss-Prot reference-proteome entry (CEXA_ASPNA; UP000006706; NCBITaxon:380704) paired with species-level UniProtKB:A0A254TZW7 (NCBITaxon:5061) as a strain-resolved reference proteome example for Aspergillus niger organic-acid export. Represents the wild-type Aspergillus niger strain (Industrial Microbiology Laboratory, Ege University, Izmir, Turkey) secreting citric, oxalic, and gluconic acids during 45-day one-step and two-step bioleaching of Espey boron-ore concentration tailings in Ertan (2026).
    evidence:
    - source_ref: ertan2026
      supports: partial
      explanation: Reviewed Swiss-Prot Aspergillus niger plasma-membrane MFS citrate exporter CexA (cexA) mediating extracellular citric acid secretion by wild-type A. niger (1 x 10^7 spores in 100 mL sucrose medium at 30 C and 120 rpm for 45 days; accumulating 1006.9 mg/L citric acid alongside 512.9 mg/L gluconic and 252.8 mg/L oxalic acid in two-step bioleaching at 0.5% w/v pulp density [60.2% Li and 50.0% Mg extraction], and 6.5 mg/L citric alongside 889.8 mg/L oxalic and 91.6 mg/L gluconic acid in one-step bioleaching at 0.5% w/v [76.5% Li and 37.2% K extraction]) on <72 um Espey boron-ore concentration tailings in Ertan (2026); the Ege University A. niger isolate lacks a genome accession and CexA expression was not directly assayed.
  evidence:
  - source_ref: ertan2026
    supports: support
    explanation: Materials pp. 2-3 establishes concentrator-waste origin and preparation; Table 1 reports the feed's measured Li, Rb and Cs concentrations. Figure 2 and Bioleaching Kinetic p. 4 show increasing assayed release over time, with reported day-31 extraction of approximately 79% Li, 37% Rb and 30% Cs. These are feed-relative leachate percentages, not isolated-product yields or exact dated mg/kg observations.
  - source_ref: ertan2026
    supports: partial
    explanation: Methods and Figure 2 provide no uninoculated or matched organic-acid leaching series. Figure 1 labels its complexes as possible; solution speciation, mineral-specific metal release and causal contributions of individual metabolites were not directly resolved. The pH account on p. 3 explicitly cites Ertan 2023. This later article is not treated as independent replication of the earlier fungal study; its exact experimental overlap remains unresolved.
  - source_ref: ertan2026
    supports: partial
    explanation: The p. 4 text gives 43.71% Li at day 24, whereas Figure 2 plots that point near 35%; no exact intermediate yield is adopted. Table 2 and Figure 3 compare fitted shrinking-core models, which do not independently prove a controlling biochemical mechanism. Figure 3d's rubidium diffusion ordinate is inconsistent with the printed equation and Figure 2 endpoint, so kinetic coefficients and a definitive chemical-control conclusion are not adopted. The experiment did not vary temperature to establish Arrhenius behavior.
causal_graphs:
- id: fungal_alkali_metal_mobilization_graph
  name: Aspergillus niger CexA-associated organic acid secretion and one-step versus two-step alkali/alkaline-earth metal bioleaching from Espey boron-ore concentration tailings
  description: Causal pathway linking reviewed Swiss-Prot Aspergillus niger plasma-membrane MFS citrate exporter CexA (UniProtKB:A0A254TZW7 in NCBITaxon:5061 and UniProtKB:G3Y4N5 in ATCC 1015 UP000006706) and co-secreted fungal oxalic/gluconic acids (1 x 10^7 spores inoculated into 100 mL sucrose-based medium [100 g/L sucrose, initial pH 5.5] in 250-mL flasks at 30 C and 120 rpm over 45 days with 0.5%, 1%, or 2% w/v of <72 um Espey boron-ore concentration tailings [12.23 wt% B2O3, 0.21 wt% Li2O (~975 mg/kg Li), 2.70 wt% K2O, 9.29 wt% CaO, 8.72 wt% MgO]) to mode-dependent acid accumulation (889.8 mg/L oxalic, 91.6 mg/L gluconic, and 6.5 mg/L citric acid at pH ~2.15 in one-step 0.5% w/v vs 1006.9 mg/L citric, 512.9 mg/L gluconic, and 252.8 mg/L oxalic acid at pH ~2.8-3.5 in two-step 0.5% w/v; Figures 5-6) and day-45 mobilization of Li (76.5% one-step vs 60.2% two-step at 0.5% w/v; 82.1% in 50 mM abiotic oxalic acid control), K (37.2% vs 28.5%), Mg (26.8% vs 50.0%), Ca (34.2% vs 30.8%), Rb
    (22.5% vs 21.2%), Cs (12.6% vs 11.5%), Al (9.4% vs 7.2%), and Fe (7.9% vs 6.1%) in Ertan (2026), while noting that dissolved boron (B) extraction was not reported.
