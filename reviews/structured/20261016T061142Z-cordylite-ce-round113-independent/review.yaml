limitations:
- The beam-damaged original crystal has no quantitative chemical analysis; qualitative
  EDX does not establish a Na concentration.
- Calculated CO2, DCP Na and unavailable reliable H2O must remain separate from microprobe
  measurements.
- The 1998 Ce proxy and Na/Ca/vacancy model are not identical to the broader current
  IMA formula.
- Deposited anisotropic displacement Table 3 AM-98-005 was not acquired; printed coordinates/distances
  were checked without independent rerefinement or exhaustive verification of earlier
  originals.
- Bounded notice and identity searches do not establish exhaustive literature coverage.
  Shared source acquisition is not independent experimental replication.
- No criticality claim is made; omission does not mean the material is absent from
  every criticality list.
- Native whole-corpus review validation and exact-head publication checks are separate
  later gates.
