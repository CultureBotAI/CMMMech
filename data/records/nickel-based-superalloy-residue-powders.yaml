id: cmmmech:nickel-based-superalloy-residue-powders
name: Nickel-based superalloy residue powders
material_kind: secondary_resource
description: Source-designated industrial superalloy residue powders considered as secondary metal feeds, distinct from nickel or cobalt elements, certified alloy grades and recovered metal products. The accepted primary study tested three supplied stocks SAR-Ni 30167, SAR-In 32083 and SAR-Re 30168 within one resource family. Their feed compositions and leaching responses remain separate; no one stock represents all superalloys. Laboratory culture-filtrate experiments do not establish post-consumer provenance, industrial deployment or complete feed recovery.
sources:
- id: constantin_2025
  title: Constantin AD, Hall S, Pourhossein F, Farnaud S (2025). Strategies for Nickel and Cobalt Mobilisation from Ni-Based Superalloy Residue Powders Using a Sustainable and Cost-Effective Bioleaching Method. Processes 13(7):2157. DOI 10.3390/pr13072157; complete 21-page original, Sections 2–4, Tables 1–3 and Figures 1–9.
  url: https://doi.org/10.3390/pr13072157
  accessed_on: '2026-10-14'
- id: ncbi_930
  title: NCBI Taxonomy 930, current species name Acidithiobacillus thiooxidans. Species-level context only; not authentication of the source's unnamed culture or identification of its separate iron/sulfur-oxidizing consortium.
  url: https://www.ncbi.nlm.nih.gov/datasets/taxonomy/930/
  accessed_on: '2026-10-14'
mechanisms:
- id: biogenic_lixiviant_mobilization
  name: Nickel and cobalt mobilization with biogenic acid and ferric filtrates
  process: bioleaching
  description: Filtered culture media containing biogenic acid, ferric iron or both mobilized nickel and cobalt from three superalloy residue stocks. The acid-containing arms generally gave greater measured release than the less acidic ferric-only arm. Proton attack and ferric oxidation are proposed contributors, but differing initial pH and the absence of matched sterile chemical controls prevent a unique causal allocation or quantified microbial increment. The accepted result is laboratory dissolution into sampled liquor, not isolation of nickel or cobalt products.
  context: AAS Ltd., Sheffield, UK supplied residues sourced from nickel- and cobalt-based superalloy bars. Exact commercial grades, prior service histories and manufacturing operations for each stock are not identified. Approximately 35 g per stock was ball-milled with stainless-steel balls at 300 rpm for ten minutes; the fraction below 250 micrometres was used. The Bangor Acidophile Culture Collection supplied source-named A. thiooxidans for Bio-acid production and an unresolved iron/sulfur oxidizing consortium for Bio-ferric and combined media. No strain accessions or consortium-member identities are reported. Culture production used mineral medium, sulfur and/or ferrous iron, initial pH adjusted to 1.8 with sulfuric acid, 30 degrees C and 130 rpm, followed by 0.2 micrometre filtration. The opening medium description and the subsequent arm-specific recipes are not completely aligned; no single inferred recipe is substituted for them. Comparisons used 1% w/v powder in 100 mL filtrate in
    250 mL flasks at 30 degrees C and 130 rpm for seven days. Bio-acid and combined arms began at nominal pH 1.0, while Bio-ferric had 45 mM ferric iron at pH 1.8. Separate Bio-acid series tested 130, 200 and 270 rpm. Triplicate assays, evaporation replacement with sterile water, 0.22 micrometre leachate filtration, ICP-OES, pH, redox potential and ferrozine iron measurements are described. Sampling-loss correction is not explicit. The 0.1 M acid label in Table 3 is not an independent measurement of total biogenic acid or the fraction added chemically.
