mechanisms:
- id: pasteurii_pla_coating
  name: Culture-associated strontianite coating of printed PLA
  process: biomineralization
  description: Sporosarcina pasteurii DSM 33 cultures produced a carbonate coating on vertically suspended printed polylactide surfaces in a strontium-supplemented urea medium. Powder X-ray diffraction assigned the detached coating to orthorhombic strontianite, with supporting carbonate FTIR bands. The proposed ureolytic setting and coating formation are distinguished from the unresolved molecular nucleation pathway at the polymer surface; the study does not establish lattice-pure product or a strontium extraction efficiency.
  context: The source identifies the purchased DSMZ organism as S. pasteurii 33, type strain. Black FDM-printed PLA coupons measured 1.5 x 1.5 x 0.1 cm. Initial culture density was reported as 10^8 cells/mL, with 333 mM urea and medium adjusted to pH 8.0 using NaOH. The medium contained casein peptone, soybean peptone and NaCl; the masses listed for those ingredients lack an explicit volume basis. Strontium chloride hexahydrate supplied Sr. The source describes a final alkali-earth-metal concentration of 25 g/L, but its wording does not resolve hydrated-salt mass versus elemental-ion mass; no Sr molarity is inferred. Incubation was static at 30 degrees C for one week in 100 mL sterile flasks; working liquid volume is not specified. Uninoculated controls used the corresponding medium, ions and polymer. Samples were washed in distilled water and air-dried at room temperature; detached coatings were characterized by Cu-Kalpha1 powder XRD, FTIR, SEM and polarized microscopy. The study reports
    triplicate coating-mass experiments, but does not define the uncertainty convention for its reported plus/minus values. Reagent-salt flasks and small coupons are laboratory materials synthesis, not ore processing, radionuclide remediation or industrial deployment.
