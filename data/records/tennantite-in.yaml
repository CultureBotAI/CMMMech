id: cmmmech:tennantite-in
name: Tennantite-(In)
material_kind: mineral
description: >-
  Tennantite-(In) is the approved tetrahedrite-group mineral species with
  ideal formula Cu6(Cu5In)As4S13 and IMA number 2023-011. It is distinct
  from elemental indium, other members of the tennantite series and
  the entire polymetallic ore. Voudouris and colleagues describe natural
  anhedral grains from the Pefka epithermal deposit in Greece, associated
  with roquesite, galena and tennantite-(Fe) in quartz. Their study reuses
  the sample investigated by Voudouris and colleagues in 2022, rather
  than establishing an independent occurrence. Backscattered-electron
  imaging, wavelength-dispersive electron-microprobe analyses and
  single-crystal X-ray diffraction support the mineral assignment.
  The seven selected chemical spot analyses near the extracted crystal
  are part of 86 analyses of the zoned specimen, not seven independent
  deposits or a bulk ore grade. The refined structural model supports
  indium at the tetrahedrally coordinated M(1) site; its formal trivalent
  state is interpreted from chemical and structural constraints rather
  than measured by a separate valence-sensitive assay. The natural
  compositions include substitutions and do not equal the ideal
  end-member formula. Possible intergrowths with lead-bearing phases
  limit interpretation of minor lead as lattice substitution. The
  reported powder diffraction pattern and density are calculated;
  powder diffraction and hardness were not measured on this scarce
  material. The proposed crystallization sequence and changing fluid
  conditions are geological interpretations, not controlled reaction
  experiments. Abstract and Table 3 uncertainties for lead and arsenic
  differ, so those conflicting uncertainties are not adopted as precise
  measurements here. No microbial mechanism, extraction yield,
  industrial recovery or constituent-derived criticality is assigned.
