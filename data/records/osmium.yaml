id: cmmmech:osmium
name: Osmium
material_kind: element
description: >-
  Osmium (Os), distinct from osmium chlorides, oxides, coordination complexes
  and platinum-group ores or commodities. Australia's 20 February 2024
  critical-minerals list includes osmium through its explicitly enumerated
  platinum-group-elements entry; this grouped designation is not a separate
  unqualified listing of every osmium-bearing material. Curated microbial
  evidence is a historical cell-extract experiment with qualified product
  assignments, not a demonstrated industrial recovery process.
