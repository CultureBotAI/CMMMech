id: cmmmech:skutterudite
name: Skutterudite
material_kind: mineral
description: >-
  Skutterudite is the cobalt arsenide mineral species listed as CoAs3 with
  grandfathered status G and original-description year 1845 in the September
  2026 IMA compilation. The year is not an approval identifier. The Handbook
  describes cubic Im-3 symmetry and natural nickel and iron substitution.
  This species is distinct from nickelskutterudite, cobaltite, elemental cobalt
  and engineered skutterudite-type materials. Accepted microbial evidence
  concerns a phase-characterized, mixed Bou Azzer concentrate dominated by
  skutterudite; it does not establish a pure-endmember extraction rate or
  transfer constituent-element criticality to this mineral.
