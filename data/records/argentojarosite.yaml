mechanisms:
- id: culture_conditioned_argentojarosite_precipitation
  name: Silver-driven precipitation after biological ferric-sulfate preparation
  process: other
  description: A composite mixed culture described as A. ferrooxidans oxidized ferrous sulfate before silver nitrate was added. Subsequent aging produced diffraction-assigned argentojarosite together with possible poorly crystalline residual ferric phases. Microbial involvement here denotes upstream iron oxidation in the combined two-stage route; Figure 5 labels the silver-addition stage abiotic, and the thesis leaves any direct bacterial contribution to precipitation unresolved.
  context: 'Mukherjee2013 sections 2.1-2.2, printed pages 28-29: 100 mL cultures in 250 mL flasks at 22 plus/minus 2 degrees C and 180 rpm used 120 mM FeSO4.7H2O, 1.9 mM MgSO4.7H2O and 4.0 mM H2SO4, with phosphate supplied as 3.6 mM H3PO4 and nitrogen as 7.6 mM HNO3 instead of potassium and ammonium salts. The stock-culture method states 5% inoculum and pH 2.0 plus/minus 0.1; a separately measured modified-culture pH trajectory is not reported. AgNO3 supplied 0, 5, 20 or 40 mM Ag after the dark-red color was taken as evidence of completed Fe(II) oxidation at five to seven days. Products were sampled eight hours, five days or fourteen days after silver addition, centrifuged at 15000 g, washed twice with 1 mM H2SO4 and air-dried at room temperature for 72 hours. Cell viability after silver addition, accession-resolved community membership and independent replicate numbers were not established. Initial dissolved reagents are not an ore or waste feed.'
