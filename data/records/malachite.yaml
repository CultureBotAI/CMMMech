mechanisms:
- id: brown_rot_surface_transformation
  name: Culture-associated copper oxalate formation on synthetic malachite
  process: biomineralization
  description: The brown-rot cultures Serpula himantioides LE-BIN 1368, Coniophora puteana LE-BIN 1370 and source-named Antrodia xantha LE-BIN 1029 formed surface deposits assigned to moolooite on synthetic malachite. Powder diffraction and microscopy support source-assigned copper oxalate formation during these laboratory incubations. They do not quantify malachite dissolution, a copper recovery yield, complete conversion or industrial deployment.
  context: Table 3 describes a homogeneous synthetic malachite substrate, Cu2(CO3)(OH)2, with possible Fe up to 3.06 wt%. That is a source-reported impurity bound, not a separately measured concentration for every block. The cited synthesis patent is not evidence of natural-mineral provenance or current commercial deployment. Methods 2.2 describes approximately 1 x 0.5 x 0.5 cm blocks in plastic Petri dishes with 20 mL liquid glucose-peptone medium, initial pH 5.5, room temperature and 30 days, in triplicate. Mycelial fragments came from ten-day cultures on glucose-peptone agar. Inoculum amount, substrate sterilization and a separate complete liquid-medium formulation are not specified. The paper names Antrodia xantha; current NCBI taxonomy and its cited ribosomal accession use Amyloporia xantha for LE-BIN 1029. The organisms list includes the tested comparator S. lacrymans; it does not assert identical mineral formation by every listed culture.
