id: cmmmech:gallium
name: Gallium
material_kind: element
description: >-
  Gallium (Ga), grounded by the neutral-atom ChEBI identifier. This element
  record is distinct from gallium ions, gallium arsenide semiconductor material
  and the heterogeneous hydroxide sludge used in the experiment. The US 2025
  designation maps its gallium commodity to this element; it does not designate
  every gallium-bearing waste. The arsenic record describes co-mobilization in
  the same experiment, not an independent replication.
