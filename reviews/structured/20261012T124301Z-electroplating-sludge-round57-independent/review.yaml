limitations:
- Independent review covers the stated narrow observations, not experimental reproduction
  or reconstruction of unavailable mass balances.
- 2015 isolate and2026 culture lack strain authentication; controls do not separate
  acidity/ferric chemistry from a unique microbial contribution.
- Source percentage calculations, regression conflicts, medium formulas and toxicity
  comparator scope remain unresolved and explicit.
- The2024 pickling-liquor study sharing an ambient percentage triple was identified
  as a lead but its original was not assessed here; no independent replication or
  misconduct claim is made.
- Main PDFs were read completely as text; original graphic pages were visually checked
  as specified above. SI original media/XML were inspected, not rendered DOCX pagination.
- New-cohort full checks and structured-review coverage are coordinator publication
  gates still pending at this review; the named record/history checks above were actually
  run.
- Original Documents checkout is inaccessible; hidden/ignored-inclusive absence claims
  are limited to the stated accessible roots.
