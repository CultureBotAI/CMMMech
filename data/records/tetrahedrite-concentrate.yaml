mechanisms:
  - id: acidophile_associated_metal_mobilization
    name: Acidophile-associated metal mobilization from mixed tetrahedrite concentrate
    process: bioleaching
    microbial: true
    organisms:
      - id: NCBITaxon:920
        label: Acidithiobacillus ferrooxidans
      - id: NCBITaxon:160808
        label: Acidithiobacillus ferrivorans
    description: >-
      Separate inoculated laboratory cultures showed greater copper mobilization
      and sulfate accumulation than the uninoculated acidic control. The two
      organisms denote separate culture arms, not a consortium. Dissolved copper
      and sulfate trajectories, oxygen consumption and altered grain surfaces
      support culture-associated oxidative leaching, while iron cycling is the
      authors' mechanistic interpretation. No enzyme-specific or genetic cause
      was established. The response was element dependent: dissolved antimony
      rose early and subsequently declined, and the abiotic treatment released
      more iron and manganese than the inoculated treatments in the reported
      day-35 comparison. Copper and sulfur depletion with antimony and iron
      enrichment in selected alteration rims does not demonstrate a pure
      secondary mineral product or complete dissolution of every grain.
    context: >-
      Ore was crushed, milled nominally below 100 micrometres and upgraded by
      froth flotation; occasional larger quartz grains are described. The
      source-labelled A. ferrooxidans DSM 14882 and A. ferrivorans SS3 DSM 17398
      were pre-grown at 25 degrees C with 120 mM FeSO4, harvested in late
      exponential phase on 0.4-micrometre filters, washed with 0.025 M sulfuric
      acid and resuspended in fresh iron-free basal medium. The leaching medium
      contained 0.4 g/L MgSO4·7H2O, 0.1 g/L (NH4)2SO4 and 0.04 g/L K2HPO4,
      initially adjusted to pH 1.5 with sulfuric acid. Triplicate aerobic flask
      assays used 2% pulp density, 25 degrees C and 150 rpm for 120 days.
      The percentage basis, working volume, inoculum density and inoculum
      volume are not specified. No external iron was added to the leaching
      medium, but the concentrate supplied iron, including from siderite.
      The abiotic control used medium and concentrate autoclaved at 105 degrees C
      for 15 minutes; matching heat pretreatment of the inoculated feed is not
      explicit. The medium was unbuffered and pH diverged among treatments,
      so neither pH nor ferric-iron exposure was matched independently of cells.
      Filtered 0.2-micrometre samples were analyzed for total dissolved elements
      and sulfate; these measurements do not identify all aqueous oxidation
      states or isolated products. Sampling-volume and replacement corrections
      are not specified. Figures 2b-c have concentration units inconsistent
      with Figure 2a and the prose, so this record retains qualitative trends
      without a reconciled copper concentration or extraction percentage.
      There is no demonstrated isolated metal recovery, complete mass balance,
      universal optimum or industrial deployment; the authors acknowledge
      that observed rates may be too low for practical application.
    evidence:
      - source_ref: kupka_2025
        supports: support
        explanation: >-
          Materials and Methods, Tables 1-2, Figures 2-5 and Figure S12 support
          the stated mixed feed, separate inocula, laboratory conditions and
          contrasting liquid-phase trajectories. Figure 3 is specifically the
          day-35 Fe/Mn comparison. Figure 5 presents zinc and silver only for
          A. ferrooxidans versus abiotic treatment and does not establish that
          arm's behavior for A. ferrivorans. Silver is plotted in micrograms/L,
          zinc in milligrams/L; these are concentrations rather than isolated
          recovery yields. The generic prose claim of more than 80% copper
          extraction is not applied equally to both cultures here because the
          plotted endpoints differ and the panel units are inconsistent.
      - source_ref: kupka_2025
        supports: partial
        explanation: >-
          Figure 2a labels Cu/Fe in g/L, whereas Figures 2b-c label them in mg/L
          despite similar numerical scales and g/L discussion. The article's
          approximate quartz abundance conflicts with Table 1's 1.00 wt% SiO2;
          neither discrepancy is silently corrected. Discussion locators calling
          the As/Sb profiles Figure 5b are inconsistent with the actual Figure 4a-b.
          Different pH, iron speciation and possibly thermal pretreatment limit
          attribution to a direct cellular effect. Mixed sulfides and sulfate
          already in the medium also preclude assigning every liquid analyte
          exclusively to the tetrahedrite phase.
      - source_ref: kupka_2025
        supports: partial
        explanation: >-
          Figures 1, 6-7 and S3-S11 provide XRD, microscopy, microanalysis and
          surface spectroscopy. Residual primary cores and heterogeneous rims
          persist; selected associated chalcopyrite grains lack alteration rims.
          Surface XPS assignments do not establish bulk conversion, dissolved
          speciation or a phase-pure recovered product. Scorodite was explicitly
          not detected, and discussion of tripuhyite remains a possible
          interpretation rather than an identified product. The SI's Fe-XPS
          cross-reference to S2 actually corresponds to S9; S2 instead shows
          a starting ore specimen with secondary covellite. Main Figure 7 and
          SI Figures S6-S7 reuse images, not independent replication. Figure 8
          relates measured oxygen use to tetrahedrite oxidation inferred from
          copper release and a selected composition; it is not a direct phase
          dissolution or product-yield measurement. The respirometry discussion
          describes four parallel experiments, distinct from the stated
          triplicate flask protocol, and does not supply a full carbon balance.
      - source_ref: ncbi_ferrooxidans
        supports: context_only
        explanation: Resolves the species name without identifying a sequenced experimental stock.
      - source_ref: ncbi_ferrivorans
        supports: context_only
        explanation: Resolves the species name; its listed type strain is not the study's SS3 strain.
      - source_ref: dsm_14882
        supports: context_only
        explanation: >-
          Links the reported DSM 14882 culture designation to the named species;
          catalogue culture guidance is not a replication of this mineral assay.
      - source_ref: dsm_17398
        supports: context_only
        explanation: Links the reported DSM 17398 and SS3 designations without authenticating the study stock.
