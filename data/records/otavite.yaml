    evidence:
      - source_ref: yang2026
        supports: partial
        explanation: Section 3.3.4 and Figure 7B compare C7-12 before and after Cd treatment at 48 hours. The authors assign two weak reflections at 23.49 and 30.28 degrees to CdCO3 using a reference pattern they label ICSD 01-072-1939, and describe the surface substance as most likely otavite. The displayed signal occurs on a substantial bacterial background. No phase fraction, refined structure, isolated pure product or raw diffraction dataset is supplied. Figure 6 shows particles and C, N, O and Cd by SEM-EDS, while Figure 7A shows FTIR changes; these observations alone do not distinguish a crystalline mineral species. The record retains the source's provisional assignment rather than treating CdCO3 composition as conclusive identification.
      - source_ref: yang2026
        supports: support
        explanation: Sections 2.5-2.6 and 3.2, Figures 2-3 and Table 2 support dissolved-Cd removal under the stated culture conditions. Table 2 reports 84.61 plus or minus 5.81 percent removal for the optimized single-Cd treatment. The denominator is initial solution Cd, compared with Cd remaining in the centrifuged supernatant measured by flame atomic absorption, not a mass of purified otavite or recovered cadmium. Other one-factor screening percentages refer to different conditions and are not substituted for this table result. No field or industrial deployment is demonstrated.
      - source_ref: yang2026
        supports: partial
        explanation: Figures 2-5 compare Cd concentrations and urea doses, including zero-urea treatment with residual Cd removal; Figures 6-7 include cells without added Cd. The inspected complete main and supplement do not describe matched uninoculated, pH-matched chemical, killed-cell or urease-inhibited precipitation controls. Urea-related trends and correlations therefore do not isolate a uniquely biological contribution or demonstrate that viable cells are required at the moment of precipitation. Section 4.2 itself calls for bacterial survival measurements. Enzyme-specific causation and a measured intracellular transport pathway are not established.
      - source_ref: yang2026
        supports: partial
        explanation: Section 2.7, Figure 4 and supplementary Figure S2 define operational fractions from supernatant, flask-wall wash, EDTA-labelled surface extraction and digested pellet. Extracellular precipitation is calculated by subtraction from total Cd; it is not a direct otavite-specific measurement. Section 4.2 acknowledges nonselective extraction and possible speciation changes. These fractions do not establish intracellular localization or quantify how much removed Cd entered otavite. Sections 3.4-3.5 and Figures 8-11 concern distinct soil-solution arms with other source-assigned phases and possible inherited microminerals; their removal rates are not otavite yields. Although Section 3.3.4 invokes a solubility product to suggest environmental stability, Section 4.3 identifies long-term stability testing as future work, so durability is not treated as measured here.
