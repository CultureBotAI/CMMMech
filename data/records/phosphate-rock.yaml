id: cmmmech:phosphate-rock
name: Phosphate rock
material_kind: commodity
description: Phosphate-bearing rock considered as a mined and beneficiated industrial raw material for
  phosphorus products, including phosphoric acid and fertilizers. The USGS marketable-product definition
  concerns beneficiated phosphate rock suitable for acid or elemental-phosphorus production; it does not
  identify one apatite species or a pure phosphate ion. The original EU 2024 list names phosphate rock
  separately from phosphorus. The US 2025 list names phosphate; its mapping here follows the USGS 2026
  phosphate-rock chapter, which explicitly describes phosphate rock as the addition to that list. This
  mapping does not equate all chemical phosphates with phosphate rock. The microbial evidence concerns
  one characterized Araxa rock feed and does not establish a commodity-wide extraction yield.
