id: cmmmech:manganite
name: Manganite
material_kind: mineral
description: >-
  Manganite is the manganese(III) oxide hydroxide mineral MnO(OH), listed
  as grandfathered in the September 2026 IMA-CNMNC list. The year 1826
  is its historical date, not an IMA approval accession. It is distinct
  from elemental manganese, manganese ore, the MnO2 minerals pyrolusite
  and ramsdellite, and other MnOOH polymorphs. The experiment below used
  laboratory-prepared material assigned to manganite by the source, not
  natural ore or a certified phase-pure mineral reference. No criticality
  designation is inherited from manganese.
