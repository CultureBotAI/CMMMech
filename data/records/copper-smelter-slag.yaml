    annotation_note: Grounded to reference-proteome entry UP000363590 for type strain Acidithiobacillus thiooxidans ATCC 19377 (NCBITaxon:637390), representing Acidithiobacillus thiooxidans DSM 9463 (NCBITaxon:930) in Potysz & Kierczak (2019).
    evidence:
    - source_ref: potysz2019
      supports: partial
      explanation: Representative Acidithiobacillus thiooxidans ATCC 19377 sulfide-quinone reductase (sqr) for sulfur-oxidizing acidification and Cu/Zn/Fe bioleaching from crystalline and amorphous copper-smelter slags by Acidithiobacillus thiooxidans DSM 9463 in Potysz & Kierczak (2019); individual sqr/tth genes were not mutated or directly assayed.
  - uniprot_accession: UniProtKB:A0A5P9XPU3
    entry_name: A0A5P9XPU3_ACITH
    protein_name: Tetrathionate hydrolase
    gene_symbol: tth
    entry_status: TREMBL
    target_organism:
      id: NCBITaxon:637390
      label: Acidithiobacillus thiooxidans ATCC 19377
    reference_proteome_id: UP000363590
    interpro_ids:
    - InterPro:IPR018391
    - InterPro:IPR002372
    - InterPro:IPR011047
    - InterPro:IPR015943
    pfam_ids:
    - Pfam:PF13360
    functional_role: Periplasmic tetrathionate hydrolase (tth) in Acidithiobacillus thiooxidans ATCC 19377 disproportionating tetrathionate into thiosulfate, elemental sulfur, sulfate, and sulfuric acid protons during sulfur bioleaching.
    annotation_note: Grounded to reference-proteome entry UP000363590 for type strain Acidithiobacillus thiooxidans ATCC 19377 (NCBITaxon:637390), representing Acidithiobacillus thiooxidans DSM 9463 (NCBITaxon:930) in Potysz & Kierczak (2019).
    evidence:
    - source_ref: potysz2019
      supports: partial
      explanation: Representative Acidithiobacillus thiooxidans ATCC 19377 tetrathionate hydrolase (tth) for sulfur-oxidizing acidification and Cu/Zn/Fe bioleaching from crystalline and amorphous copper-smelter slags by Acidithiobacillus thiooxidans DSM 9463 in Potysz & Kierczak (2019); individual sqr/tth genes were not mutated or directly assayed.
  evidence:
  - source_ref: potysz2019
    supports: support
    explanation: Sections 2.1-2.3, Table 1 and Figure 1 establish two actual copper slags, their distinct phases and the purchased DSM 9463 inoculum. Figure 6 and Section 3.4 support culture-associated mobilization. For AS at 1% loading and 21 days, Section 3.4.2 reports 98.7% Cu and 73.0% Zn extraction. These are source-reported feed-relative values, not a universal slag yield or independent replication.
  - source_ref: potysz2019
    supports: partial
    explanation: Table 2 gives final pH 0.90 versus 3.98 for CS and 0.62 versus 4.83 for AS, comparing inoculated and sterile-medium arms at 1% loading. There is no matched-acidity time course isolating a direct cell effect. The post-assay sulfur-settling activity test was positive for biotic leachates and negative for controls; this qualitative proxy does not establish cell counts or exclude every contaminant.
  - source_ref: potysz2019
    supports: partial
    explanation: 'Quantitative discrepancies remain unresolved: CS Cu extraction is 52.1% in the abstract and Section 3.5 but 52.7% with 1981 mg/kg in Section 3.4.1; Section 3.4.3 instead gives 2257 mg/kg for that endpoint. The highest bioleaching loading is 5% in Methods and prose but 3% in Table 2 and Figure 6. The reported 31-fold AS enhancement also conflicts with the Figure 6 control trajectory. None is silently reconciled or used as a precise comparative effect size.'
  - source_ref: potysz2019
    supports: partial
    explanation: Figures 7-8 show stronger surface alteration after biotic treatment and gypsum-associated AS residue, but selected images and elemental ratios do not quantify complete phase dissolution, a pure gypsum product or residue safety. Chemical acids also mobilized substantial metal in separate 24-48 h assays (Figures 2-5); unlike durations and acidity prevent a blanket microbial-superiority claim. Table 3 is theoretical metal-value accounting, not measured profit, lifecycle performance or an operating recovery plant.
