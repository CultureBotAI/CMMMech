id: cmmmech:niobium
name: Niobium
material_kind: element
description: >-
  The element Nb, also called columbium, distinct from niobium ions, oxides,
  host minerals, alloys and niobium-bearing furnace wastes. The United States
  2025 list's Niobium entry is mapped to this element; it does not automatically
  designate a waste feed as critical. The curated experiment reports
  condition-dependent niobium release in an activated-sludge-derived culture,
  with unresolved controls and analytical preparation limiting causal inference.
