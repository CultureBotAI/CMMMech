    functional_role: NAD-dependent malate dehydrogenase (EC 1.1.1.37; locus CONPUDRAFT_126646) catalyzing oxidation of (S)-malate to oxaloacetate, supplying the direct oxaloacetate precursor for brown-rot fungal oxalic-acid biosynthesis and surface transformation of cerussite (PbCO3) into anhydrous lead oxalate (PbC2O4).
    annotation_note: Grounded to reference-proteome entry in UP000053558 for Coniophora puteana RWD-64-598-SS2 (NCBITaxon:741705) as the sequenced strain representative for mechanism species Coniophora puteana (NCBITaxon:80637; tested isolate LE-BIN 1370). Serpula himantioides (NCBITaxon:80602) and Amyloporia xantha (NCBITaxon:1333629) lack UniProtKB proteomes, and basidiomycete oxaloacetate acetylhydrolase (oahA) homologs in TrEMBL (e.g., UniProtKB:A0A5M3MM75, UniProtKB:F8PSW8) are auto-annotated as Isocitrate lyase (EC 4.1.3.1) by PROSITE-ProRule PRU10119 due to shared PF13714 superfamily membership.
    evidence:
    - source_ref: vlasov2023
      supports: partial
      explanation: Representative Coniophora puteana reference-proteome oxaloacetate-forming malate dehydrogenase supporting the brown-rot oxalate biosynthesis pathway during transformation of cerussite (PbCO3) to anhydrous lead oxalate (PbC2O4) in Vlasov et al. (2023), which performed mineralogical assays without gene-level perturbation.
