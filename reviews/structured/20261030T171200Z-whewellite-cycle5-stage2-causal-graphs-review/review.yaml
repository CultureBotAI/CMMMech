  summary: 'Growing A. niger cultures were associated with whewellite crystallization on mixed apatite-nepheline
    rock. Diffraction and microscopy support a calcium-oxalate product; fungal acid secretion and host
    dissolution are proposed explanations rather than independently isolated causal steps. Substrate-edge
    evidence (frank_kamenetskaya_2019, supports: partial): Frank-Kamenetskaya et al. (2019) document culture
    pH reduction from 5.5 to 4.0–4.5 and dissolution textures on apatite-nepheline rock, though no matched
    uninoculated control, killed-biomass arm, or organic-acid concentration series was reported for this
    rock experiment. Product-edge evidence (frank_kamenetskaya_2019, supports: support): Sections 2.2
    and 3.4, powder XRD at day 5 (Figure 3 trace 3), and SEM at days 5 and 12 (Figure 7) identify whewellite
    (CaC2O4·H2O) in all three experimental culture replicates.'
