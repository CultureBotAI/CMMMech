mechanisms:
  - id: lactilyticus_extract_osmium_reduction
    name: Hydrogen-coupled osmium transformation in bacterial crude extracts
    process: redox_transformation
    description: >-
      Crude cell-free extracts reported as Micrococcus lactilyticus consumed
      molecular hydrogen in separate assays with OsO4, OsO2 or Os(III)
      chloride. The authors interpreted the products as osmate from OsO4
      and elemental osmium from OsO2 or Os(III) chloride. The stoichiometry
      supports redox transformation under the assay conditions, but the
      product identities and biological necessity remain less well resolved
      than an independently characterized phase or purified-enzyme result.
    context: >-
      The paper uses the historical organism name Micrococcus lactilyticus
      and notes classification as Veillonella alcalescens; no strain or
      culture accession is provided. No modern strain identifier is inferred.
      Cells grown in a cited complex lactate medium were harvested, washed
      with water, sonicated for 20-45 min and centrifuged cold at 25000 g for
      20 min; the supernatant was the crude extract. Warburg assays were
      run at 30 degrees C under oxygen-scrubbed hydrogen, routinely in
      2.2 mL with 150 micromol Tris buffer pH 7.0 and 1 mL extract containing
      approximately 30 mg protein. Stoichiometry endpoints were taken after
      hydrogen uptake ceased; Os-specific elapsed times are not supplied.
      Table 4 reports 15.6 micromol OsO4 with 12.0 micromol H2 uptake,
      12.7 micromol OsO2 with 25.0 micromol H2 uptake, and 7.3 micromol
      Os(III) chloride with 10.7 micromol H2 uptake. These are source
      substrate and gas-uptake amounts, not isolated osmium yields. OsO2
      was added as a suspension; other relevant substrates were commercial.
      Os(III) solution titration assumed oxidation to OsO4.
    microbial: true
    evidence:
      - source_ref: woolfolk_whiteley_1962
        supports: support
        explanation: >-
          Table 4 and pages 651-652 establish substrate-associated H2 uptake
          with bacterial extract. The approximate two-H2-per-OsO2 and
          one-and-a-half-H2-per-Os(III) stoichiometries are consistent with
          the authors' Os(0) assignment. Table 5 separately summarizes
          OsO2-to-Os and OsO4-to-osmate reactions. The OsO4 endpoint must
          not be rewritten as complete reduction to metal.
      - source_ref: woolfolk_whiteley_1962
        supports: partial
        explanation: >-
          Osmate was inferred from H2 uptake and the absence of the black
          appearance attributed to OsO2; the OsO4 uptake is below the stated
          one-H2-per-substrate stoichiometry. The inspected paper gives no
          Os-specific diffraction, spectroscopy, isolated-product assay,
          numerical uncertainty or replicate count. It also does not report
          an Os-specific no-extract, heat-inactivated-extract or no-H2
          comparison. Thus quantitative product conversion, exclusive
          enzymatic causality and complete recovery are not established.
      - source_ref: woolfolk_whiteley_1962
        supports: context_only
        explanation: >-
          Discussion on pages 655-656 explicitly considers nonspecific
          reactions of enzymes or electron carriers with other physiological
          functions. The Os assay does not identify a particular protein,
          gene or purified hydrogenase as necessary, and it does not show
          growth using osmium as an electron acceptor. Whole-cell respiration,
          natural-environment prevalence and industrial deployment remain
          outside this experiment's demonstrated scope.
