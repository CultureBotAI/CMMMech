  evidence:
  - source_ref: wang2007
    supports: support
    explanation: Sections 2.1-3.1, Tables 1 and 3 and Figures 1-2 show schwertmannite as the only identified phase at 5.4 and 9.4 mM ammonium, mixed schwertmannite and ammoniojarosite at 11.5-85.4 mM, and ammoniojarosite as the only identified crystalline phase in the tested 165-805 mM arms at 36 degrees C. The abstract/conclusion says above 165 mM, whereas Table 3 already assigns sample 3.5.12 at 165 mM to ammoniojarosite. These are tested conditions, not a universal precipitation threshold or quantified purity measurement.
  - source_ref: wang2007
    supports: support
    explanation: Section 3.2, Table 4 and Figures 4-8 identify the temperature-series ammoniojarosites by powder diffraction, unit-cell refinement and elemental chemistry. All products were nitrogen-deficient relative to the ideal endmember; hydronium substitution was inferred from composition and diffraction trends. Nitrogen retained in biomass could also contribute to bulk analysis. Mineral stoichiometry is therefore not assumed from the ideal formula, and neither fitted cell parameters nor bulk nitrogen quantify a microbial mineral-production yield.
  - source_ref: wang2007
    supports: partial
    explanation: 'Section 2.1 explicitly states that abiotic syntheses were not matched controls: ferric rather than ferrous sulfate, ammonium concentrations, temperature and contact time differed (36 degrees C for 27 days, 65 degrees C for eight days, and 95 degrees C for 24 hours). Sample 6.6 is 65 degrees C in Methods, Tables 1 and 4 and the Figure 4 plotted label, but 45 degrees C in Table 3 and Figures 4 and 9 captions. Figure 7 labels the low-temperature abiotic trace 35 degrees C although Tables 1 and 4 give 36 degrees C. No exact matched-temperature biological advantage is inferred across these inconsistent labels.'
  - source_ref: wang2007
    supports: partial
    explanation: 'Sections 3.1-3.3 and Figure 9 retain causal limits: precipitation rates and ammonium consumption were not measured, proposed precipitation order was not demonstrated, and living-versus-inactive intact-cell comparisons were absent. Biological and chemical products could not consistently be distinguished by diffraction, chemistry, color or surface area. More rounded or aggregated biological particles do not establish a unique biosignature, extracellular-polymer mechanism or metabolic necessity.'
