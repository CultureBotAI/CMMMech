- id: westland2012
  title: >-
    Westland, R. E. (2012). New Phases in the Hydrous Ferric Sulfate
    System, a Supporting Argument That the Mineral Lausenite is of
    Formula Fe2(SO4)3·5H2O and the Crystal Structure Refinement and
    Hydrogen Bonding Scheme of the Minerals Quenstedtite and Romerite.
    MSc thesis, Queen's University; August 2012 title page, repository
    issued September 4, 2012. Sections 2.2.1/2.2.5-2.2.7/2.3.1.2/2.4,
    Tables 2.11-2.20, Figures 2.4-2.8/2.12-2.14 and Appendices D-E.
    Table 2.11 angles conflict with Table 2.12 and the printed CIF;
    text names SMART CCD 1000 while CIF names APEX-II CCD. The
    checkCIF sheet says structure factors were not supplied, so its
    full test set was not run. No raw diffraction refinement reproduced.
  url: https://hdl.handle.net/1974/7411
  accessed_on: '2026-10-15'
