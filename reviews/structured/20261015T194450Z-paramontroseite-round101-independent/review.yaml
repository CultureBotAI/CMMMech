limitations:
- Natural alteration is inferred from related phases; the record does not establish
  measured kinetics, a universal below-50-C threshold or directly observed hydrogen
  migration.
- Historical diffuse-phase data are limited and shared across the 1953/1955 studies;
  the two material records do not create independent replications.
- Searches and source acquisition are bounded. No universal absence of corrections,
  conflicting studies or microbial mechanisms is claimed.
- The 2023 product proportions/denominator conflict remains unresolved; no recovery
  fraction is accepted.
- CIF/FCF deposit bytes were not acquired or independently refined. Published tables
  support the bounded model, not an independent structure solution.
- One Fe/Al-bearing natural sample with calcite and unspecified heating atmosphere
  does not establish pure-VO2 thermal behavior or industrial processing.
notes:
- Shared primary acquisitions are disclosed; this reviewer independently inspected
  the originals, not only the curator dossier.
- A separate redox category display wording defect is recorded in reviews/publication/20261015-round101/20261015T193803Z-redox-display-initial.json.
