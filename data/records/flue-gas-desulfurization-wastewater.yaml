id: cmmmech:flue-gas-desulfurization-wastewater
name: Flue-gas-desulfurization wastewater
material_kind: secondary_resource
description: Liquid residual streams generated by wet flue-gas desulfurization and associated
  wastewater treatment, distinct from solid FGD gypsum, coal ash, elemental selenium and natural
  mineral resources. The accepted experiment concerns a particular coal-power-plant effluent after
  physical/chemical pretreatment and dilution, not an invariant composition or all FGD streams.
  Its selenium-bearing residuals were investigated for treatment; no marketable recovered selenium
  product or inherited criticality is asserted.
sources:
- id: epri_2017_pilot
  title: 'EPRI (2017). Biological Treatment of Flue Gas Desulfurization Wastewater at a Power
    Plant Burning Powder River Basin Coal: Pilot Demonstration with the ABMet Technology. Final
    Report March 2017, report 3002006089. CH2M Hill primary pilot report; Chapters 1–5 and Appendices
    A–C.'
  url: https://restservice.epri.com/publicdownload/000000003002006089/0/Product
  accessed_on: '2026-10-15'
- id: epri_2017_embedded_data
  title: 'EPRI report 3002006089, Appendix C embedded original workbook: Worksheet in 3002006089_test.xlsx.
    Twenty sheets; especially S7 selenium qc, S7 ABMet 2nd stage effl and S7 Brooks Applied Labs.
    Same pilot lineage, not independent replication.'
  url: https://restservice.epri.com/publicdownload/000000003002006089/0/Product
