  description: 'In data/records/brushite.yaml (cmmmech:brushite, mineral, Heveran
    et al. 2019 Scientific Reports 9:14721, DOI:10.1038/s41598-019-51133-9; causal_graphs[0]
    ureolytic_brushite_calcite_phase_transition_graph, lines 187-339), nodes[2].description
