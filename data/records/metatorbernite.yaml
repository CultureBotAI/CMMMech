mechanisms:
- id: abiotic_thermal_transformation
  name: Specimen-dependent abiotic dehydration and thermal structural change
  process: other
  microbial: false
  description: Heating changes the interlayer geometry and diffraction of natural metatorbernite and its
    synthetic analogue. The natural powder experiment reports stepwise dehydration, whereas a separate
    sealed-capillary synthetic experiment becomes poorly crystalline or X-ray amorphous at its high-temperature
    endpoint and recrystallizes on cooling. These observations have different specimen preparation and
    environmental conditions and do not establish a universal dehydration threshold or uranium recovery
    process.
  context: Nazarchuk et al. used natural sample 1 from Old Gunnislake Mine, Cornwall, UK; semiquantitative
    EDS gave Cu:U:P = 0.89:2.11:1.99 with no detected As admixture, not a quantitative water assay. Single-crystal
    measurements covered 100-300 K. Ground powder was prepared from heptane suspension on Pt; the metatorbernite
    plot is the air-heating arm. Methods specify 293-673 K, 10 K steps, 2 K/min and approximately 30 min
    collection per step; Figure 4 caption starts at 313 K while the plot also labels 303 K. Several runs
    are stated without a numerical replicate count. Separately, Kulaszewska et al. precipitated the synthetic
    phosphate end member from uranyl nitrate, copper chloride and phosphoric acid, settled it for 48 h,
    vacuum-filtered and washed it, then dried it at 40 degrees C to constant weight. High-resolution synchrotron
    diffraction used a 0.5-mm borosilicate capillary secured with Kapton tape, described as sealed in
    Discussion, initially at 293 K, cooled to 105 K and subsequently heated. Methods give nominal 50 K
    steps and 30 min collections; the plotted temperatures are not uniformly 50 K apart. The mixed phosphate-arsenate
    member and natural South Terras spoil samples are separate arms.
  evidence:
  - source_ref: nazarchuk2023
    supports: support
    explanation: Sections 3.2 and 4 and Figure 4 report diffraction changes attributed to dehydration
      at approximately 353, 373 and 483 K for natural sample 1 in air, with strongest expansion normal
      to its autunite-type layers. Table 1 and Section 2.3 support the P4/nmm refinement of this natural
      crystal; the authors explicitly tested alternative models and did not obtain an equivalent satisfactory
      P4/n refinement. The geometric thermal-expansion fits and powder patterns are complementary measurements,
      not independent metal-recovery trials.
  - source_ref: nazarchuk2023
    supports: partial
    explanation: The extra transitions in mixtures of pristine and partly dehydrated metatorbernite are
      given as 313 and 463 K in Section 3.2 but 303 and 473 K in Section 4; neither pair is adopted as
      a corrected threshold. The article does not provide a matched water mass balance for these diffraction
      arms, and instability can begin during handling or irradiation. Its fitted bond-length changes and
      proposed interlayer explanation do not identify every dehydration product. The cited crystallographic
      deposits remain unacquired, so no independent re-refinement is claimed.
  - source_ref: kulaszewska2019
    supports: support
    explanation: Section 3 and Figure 4 show the synthetic phosphate end member retaining tetragonal indexing
      on cooling, expanding anisotropically on heating, and developing a high-temperature amorphous signature
      followed by an unidentified crystalline product on cooling. The source distinguishes this sealed-capillary
      behavior from earlier natural specimens heated in open systems. Its room-temperature synthetic solid-solution
      series supports phosphate-arsenate substitution as another experimental variable; it does not prove
      all natural samples are pure end members.
  - source_ref: kulaszewska2019_si
    supports: support
    explanation: Figure S5 displays distinct synthetic metatorbernite traces through 423 K, a largely
      diffuse 473 K trace, and a changed 293 K trace after cooling; S6 shows departure from the preceding
      a/c trend above approximately 373 K. These figures support the qualitative sequence, without assigning
      a sharp transition temperature from coarse sampling.
  - source_ref: kulaszewska2019
    supports: partial
    explanation: The abstract places amorphization at 473 K, Results says greater than 473 K, a later
      discussion says greater than 423 K, and Conclusion says above 373 K. Those wordings are retained
      as inconsistent bounds, not combined into one precise threshold; S5 distinguishes the plotted 423
      and 473 K states. The study does not directly establish water stoichiometry at every temperature,
      and the high-temperature and cooled products are not completely identified. Its natural spoil compositions
      were inferred from a synthetic lattice-parameter calibration after 80-degree-C drying; they are
      not direct assays of untreated in-situ hydration or mineral-specific uranium retention.
