id: cmmmech:kutnohorite
name: Kutnohorite
material_kind: mineral
description: >-
  Kutnohorite is the CaMn2+(CO3)2 mineral species listed by IMA-CNMNC in its
  September 2026 master list (PDF page 119). Its status is grandfathered;
  1903 is the original-description year, not an IMA approval number. The
  Handbook of Mineralogy places it in the dolomite group and describes
  ordered calcium and manganese in approximately equal proportions, commonly
  with magnesium and ferrous-iron substitution. Its generalized formula
  Ca(Mn2+,Mg,Fe2+)(CO3)2 and natural-specimen analyses describe compositional
  variation around the IMA endmember, not an invariant manganese grade.
  The Handbook reports occurrence in deposits associated with manganese-bearing
  sediments and identifies analyzed material from Kutna Hora in the Czech
  Republic and Franklin, New Jersey. The spelling kutnahorite appears in a
  historical reference title; the accepted species name used here is
  kutnohorite. This mineral is distinct from the dolomite group as a whole,
  bulk manganese ore, elemental manganese and manganese oxalates. No microbial
  mechanism or criticality designation is assigned here.
