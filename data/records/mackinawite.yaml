id: cmmmech:mackinawite
name: Mackinawite
material_kind: mineral
description: Mackinawite is the FeS mineral species listed as approved, with the designation 1967 s.p., in the September 2026 IMA compilation. The phase is distinct from unspecified iron monosulfide, pyrrhotite, greigite, pyrite and elemental iron. The evidence below concerns laboratory precipitation from dissolved reagents and direct crystallographic identification, not extraction from a natural mackinawite ore. No constituent-element criticality designation is inherited.
sources:
- id: ima_2026_09
  title: IMA-CNMNC. The New IMA List of Minerals, September 2026. Mackinawite row, PDF page 130; column definitions and distribution terms on pages 1-2.
  url: https://cnmnc.units.it/files/editor/IMA_Master_List_(2026-09).pdf
  accessed_on: '2026-10-11'
- id: picard2018
  title: Picard, Gartman, Clarke and Girguis (2018). Sulfate-reducing bacteria influence the nucleation and growth of mackinawite and greigite. Geochimica et Cosmochimica Acta 220:367-384. Sections 2-4, Tables 1-3, Figures 1-7 and original supplementary Figures S1-S3.
  url: https://doi.org/10.1016/j.gca.2017.10.006
  accessed_on: '2026-10-11'
- id: ncbi_am13
  title: NCBI Taxonomy 1121451. Maridesulfovibrio hydrothermalis AM13 = DSM 14728; source-name synonym Desulfovibrio hydrothermalis AM13 = DSM 14728.
  url: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=1121451&mode=Info
  accessed_on: '2026-10-11'
mechanisms:
- id: am13_sulfide_precipitation_and_biomass_associated_growth
  name: Mackinawite precipitation with sulfate-reducing AM13 and inactive-cell comparators
  process: biomineralization
  description: Sulfide generated by live sulfate-reducing AM13 cultures reacted with supplied dissolved Fe(II), producing solids identified as mackinawite by powder X-ray diffraction. Mackinawite also formed in cell-free chemical controls. Crystalline domains were larger when live cells, or separately gamma-inactivated cells supplied with reagent sulfide, encountered Fe(II) before sulfide production or addition. The comparison supports an influence of microbial biomass on nucleation and growth, including a nonmetabolic contribution from inactive cells. It does not establish a specific enzyme, prove that microorganisms are necessary for mackinawite formation, or quantify recovery of a purified mineral product.
  context: Picard et al. obtained Desulfovibrio hydrothermalis AM13 from DSMZ as DSM 14728; the verified strain node now uses Maridesulfovibrio. Washed stationary-phase cells were inoculated into an anoxic, bicarbonate-buffered marine medium containing sulfate and lactate, in 50 mL aliquots in 110 mL serum vials. FeCl2 supplied nominally 4 mM Fe(II), with measured mean 3.81 +/- 0.17 mM; initial pH was 7.03 and incubation was at 35 degrees C. Live-cell arms began at approximately 10^6 or 10^8 cells/mL. Cell-free arms received Na2S either as one addition or as daily additions over six days; a lactate-plus-acetate comparator was also tested. A separate arm received Fe(II) only after a live culture had already produced sulfide. Inactive-cell experiments used stationary-phase cells irradiated at 2 Gy/min for 48-72 hours, washed and resuspended in Fe medium; absence of sulfide production was the reported inactivation check. Those cells spent two weeks in Fe medium before reagent sulfide addition,
    a distinct pretreatment from the live-cell arm. Samples were prepared anaerobically for chemistry, diffraction and microscopy, with brief transfers to analytical instruments. Early phase comparisons used one week and two months; longer incubations extended to eleven months for live-cell experiments. Table 3 pools 10 live-cell, 5 inactive-cell, 11 abiotic and 5 post-growth Fe-addition results over unequal month ranges, rather than supplying those replicate counts at every time point. These are laboratory reagent-based mineralization experiments, not industrial deployment.
