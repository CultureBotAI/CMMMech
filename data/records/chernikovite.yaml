  evidence:
  - source_ref: hu2018
    supports: support
    explanation: 'Experimental design on pages 13460-13461 and the XRD results on pages 13463-13464 distinguish three arms: rock dissolution, whole-culture biomineralization and mineralization with filtered fermentation broth. Figure 7b and its embedded Table 2 compare the last arm''s precipitate with chernikovite reference pattern PDF 29-0670, including the low-angle 001 reflection and multiple higher-angle reflections. Figure 4 supplies its infrared spectrum; Figures 5c and 6c show the filtered-broth solid and its uranium/phosphorus signals. This supports the authors'' phase assignment beyond elemental co-occurrence alone. Their H2(UO2)2(PO4)2·8H2O notation has the same overall elemental composition as the doubled hydronium formula in the Handbook; the experiment does not independently refine hydrogen positions or quantify phase purity.'
  - source_ref: hu2018
    supports: partial
    explanation: Figure 3 and the corresponding results on pages 13462-13463 show decreasing soluble phosphate and low residual uranium at lower additions, with appreciably more residual uranium at the highest addition. Neither solution depletion nor this diffraction assignment provides an isolated chernikovite yield, a mineral mass balance or proof that every uranium-loading arm made the same phase. The filtered-broth arm lacks a reported matched inorganic-phosphate or pH-matched unconditioned-broth comparator; its replicate count is not separately specified. Specific phosphatase, organic-acid and autolysis mechanisms were proposed, rather than established by direct enzyme, metabolite or pathway measurements. Filtration is described as removing hyphae and particles; independent sterility verification is unreported.
  - source_ref: hu2018
    supports: context_only
    explanation: Figure 2 concerns a different arm with live fungus, rock and initially 25 mg/L uranium, compared with a sterilized-spore control labelled heat-killed hypha in the figure. Both arms initially lost substantial aqueous uranium; only the live arm subsequently showed the larger decline, with a transient rebound near day 12 as pH fell. The text reports 47.3 micrograms/L supernatant uranium at day 22, but this is not a chernikovite yield and cannot be transferred to the filtered-broth experiment. Figures 5b and 6b show associated solids without a corresponding whole-culture phase-specific diffraction assignment. Long-term stability, environmental deployment and regulatory compliance are not established by these laboratory observations.
