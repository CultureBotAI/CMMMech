limitations:
- Synthetic preparations contain minor boehmite and substituted apatites; no independent
  synthesis replicate counts, absolute phase purity, isolated-product yield or closed
  phase mass balance is established.
- Thermal peak position depends on sample mass, heating mode, composition and crystal
  size; a single universal decomposition threshold is not inferred.
- Shared Gilkes study supplies both species records; this is explicit shared lineage,
  not independent replication.
- Bounded correction/conflict search and source inspection do not establish universal
  absence of later evidence or laboratory reproducibility.
- Natural goyazite refinement is identity evidence only; synthetic endmember gel composition
  is not independently measured occupancy.
notes:
- No owner, history or source-dossier edits by this reviewer.
- Initial inspect attempts referenced unavailable schema/cmmmech.yaml and were preserved
  externally. Successful native target captures preceded assessment; additional capture
  binds the actual src/cmmmech/schema/cmmmech.yaml and final dossier.
- The initial unsaved save attempts used mineral for shared ReviewTarget.kind and
  were rejected; draft bytes and error were preserved externally. Canonical maintained
  kind was captured with the same owner hashes before the sole successful saves.
- No separate SI was announced in the complete originals/inspected landing pages;
  this is bounded access coverage, not universal absence.
