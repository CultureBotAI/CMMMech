    scheme discredits ferrisicklerite and sicklerite; Table 3 recalculates the same 2013 samples rather
    than reporting a new oxidation experiment.
  url: https://doi.org/10.5194/ejm-35-427-2023
  accessed_on: '2026-10-15'
mechanisms:
- id: conditional-null-for-abiotic-oxidative-phase-conversion
  name: No detected phase conversion in one abiotic oxidation treatment
  process: redox_transformation
  description: A synthetic, diffraction-assigned lithiophilite powder retained its reported phase and
    lattice parameters after a particular permanganate-acid hydrothermal treatment. The finding limits
    an oxidation claim for this arm; it does not demonstrate that no lithium entered solution, that no
    minor surface reaction occurred, or that all lithiophilite is chemically inert. The same study's natural-triphylite
    transformation is curated separately in cmmmech:triphylite, with unmatched conditions explicitly preserved.
  context: Methods page 502 describes synthesis from Li3PO4, Mn2P2O7 and MnO and powder-diffraction identification
    of LiMnPO4. The stated 700 degrees C for 2 days refers to preparation of the Li3PO4 precursor, not
    an established final LiMnPO4 firing schedule. Table 1 assigns Tri-74 to 49.7 mg of synthetic powder,
    10.5 mg KMnO4 and 1 mL of 0.1 N HCl in a closed 3-cm3 Teflon-lined vessel at 120 degrees C for 28
    days, without oxygen buffering. The source describes the fine synthetic grains as less than 10 micrometres.
    Products were separated, water-washed and dried at 50 degrees C. No microbes, matched acid-only control,
    independent replicate number or before/after dissolved-lithium balance is reported.
  microbial: false
  evidence:
  - source_ref: schmid_beurmann2013
    supports: refute
    explanation: This evidence refutes detected bulk phase conversion in Tri-74, not every possible redox
      or dissolution process. Table 1 (page 503), Table 4 (page 506), Results page 511 and Discussion
      page 513 report retained lithiophilite, no detected phase-composition or lattice-parameter change,
      and a Rietveld fit with Rwp of 12.4%. The authors infer that manganese was not oxidized to the trivalent
      state under their test. No direct Mn-valence measurement or solution lithium assay is presented
      for this arm, so that inference is not strengthened into proof of zero oxidation or zero lithium
      release.
  - source_ref: schmid_beurmann2013
    supports: partial
    explanation: The natural-triphylite Tri-77/Tri-87 arms used approximately 20-21 mg KMnO4 for 8 days,
      compared with 10.5 mg for 28 days in Tri-74; particle form and composition also differed. Their
      outcomes therefore cannot establish a matched intrinsic species effect. The lithiophilite reference-card
      numbers differ between Methods and Table 1, and its b parameter differs slightly between Tables
      4 and 5; no exact lattice value or phase-purity percentage is adopted here. The absence of detected
      bulk changes does not supply a lithium extraction denominator or product yield.
  - source_ref: losey2004
    supports: context_only
    explanation: Tables 1-2 (pages 1107 and 1108), Figures 1-7 and Methods pages 1108-1109 establish the
      natural-crystal structural series. The Mn-rich Trip06 and Trip27 specimens are distinct from the
      synthesized Tri-74 powder. Assumed Li2O and fixed Li occupancy limit independent lithium quantification;
      the near-equal Fe/Mn Trip50 crystal is not treated as an unambiguous lithiophilite endmember. These
      crystal refinements are identity evidence, not a measured biological mechanism or lithium diffusion
      assay.
  - source_ref: lyalina2023
    supports: context_only
    explanation: Tables 1-3 and the approved classification algorithm preserve lithiophilite as the Li-Mn2+
      species while discrediting historical sicklerite/ferrisicklerite intermediate names. Valence and
      lithium-site occupancy matter for oxidized members, so total Fe/Mn composition or a commercial LiMnPO4
      label alone does not assign every specimen. This nomenclatural assessment is separate from the 2013
      experimental null.
