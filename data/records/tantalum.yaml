id: cmmmech:tantalum
name: Tantalum
material_kind: element
description: >-
  The element Ta, distinct from tantalum ions, oxides, mineral species,
  capacitor components and mixed electronic scrap. The United States 2025
  list's Tantalum entry is mapped to this element; that designation is not
  inherited by every capacitor or waste feed. The curated primary study
  documents an unsuccessful acidophile leaching attempt for Ta under specified
  conditions, preserving a useful limitation rather than asserting recovery.
