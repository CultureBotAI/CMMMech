actions: []
limitations:
- The holotype is zoned; the selected rim crystal, six microprobe analyses and qualitative
  IR cannot be treated as uniform bulk composition.
- H2O and CO2 were not measured, and the poor-quality structure model lacks reliable
  hydrogen positions and uses cation proxies.
- Prose/table/CIF occupancy and agreement differences remain unresolved; no independent
  diffraction refinement was performed.
- Natural replacement relations and unquantified HCl dissolution do not establish
  a controlled extraction or recovery process.
- Bounded notice and identity searches do not establish exhaustive literature coverage.
  Shared source acquisition is not independent experimental replication.
- No criticality claim is made; omission does not mean the material is absent from
  every criticality list.
- Native whole-corpus review validation and exact-head publication checks are separate
  later gates.
