mechanisms:
- id: san_carlos_olivine_bioleaching
  name: Bioleaching of magnesium-rich San Carlos olivine with secondary oxalate formation
  process: bioleaching
  description: The authors' selected olivine-only powder released Mg and Ni in both cell-containing and cell-free Gluconobacter oxydans biolixiviant experiments. Direct cultures had higher final filtrate Mg than the cell-free arm. Residues contained author-assigned Mg-oxalate and amorphous silica; this is conditional transformation of the tested magnesium-rich olivine, not proof of a response shared by every group member.
  context: 'The selected San Carlos powder was reported as 100% olivine by XRD after removal of pyroxene grains. That phase-purity statement is distinct from pure-endmember chemistry: Table S1 assumes 90.68% Fo from earlier commercial material. The separate 69/31 olivine/enstatite experiment is not pooled with this arm. The strain was Gluconobacter oxydans B58 delta-pstS, P112:mgdh, propagated from one colony; triplicate flasks per arm and sampling day were technical replicates from that shared culture. YPM growth and glucose-based biolixiviant production each lasted two days at 30 degrees C and 200 rpm. Prepared cell-containing cultures and centrifuged, 0.2-micrometre-filtered biolixiviant were tested separately. Each 100-mL flask contained 10 mL liquid and 0.5 g powder (5% pulp), incubated statically at 30 degrees C for 0, 5, 10 or 15 days. The Methods temperature takes precedence over the Introduction''s room-temperature shorthand. Powders had typical particle size 40 micrometres after
    20 minutes of tungsten-carbide milling; visibly carbonate-coated/altered grains were removed and a 60-minute deionized-water ultrasonic wash preceded milling. Powder sterilization was 135 degrees C for three minutes. Controls contained 20% glucose and mineral without cells or biolixiviant, with no acid or pH matching. Species taxon 442 does not identify the engineered genotype.'
