id: cmmmech:montebrasite
name: Montebrasite
material_kind: mineral
description: 'Montebrasite is the hydroxyl-dominant lithium aluminium phosphate mineral with ideal formula
  LiAl(PO4)(OH), distinct from fluorine-dominant amblygonite. The September 2026 IMA list records grandfathered
  status and original-description year 1871. Groat2003 Methods (pages 197-199), Table 2 (page 198), Table
  11 (page 206) and neutron/NMR figures establish the natural substituted series: the Dunton specimen
  has neutron-derived F/(F+OH)=0.04, whereas estimates for the near-boundary Tanco specimen differ by
  technique and are not treated as a pure endmember. Triclinic primitive P-1 and centered C-1 are alternative
  settings, not evidence for separate polymorphs. In the Shirose thesis, Figures 13-16 (printed pages
  29-31, PDF pages 36-38) show co-oriented lacroixite patches and low-fluorine montebrasite in a natural
  host; Figure 12 (page 25, PDF page 32) shows secondary montebrasite veins without lacroixite. Section
  5.3 and Figure 19 (pages 34-36) interpret an exsolution sequence, but do not reproduce that sequence
  by controlled synthesis. Figure 21 and Table 5 (pages 38 and 39) include gem-quality XS110 with no observed
  lacroixite, so the patch texture is not universal. Lithium and water in the thesis microprobe tables
  were calculated stoichiometrically. These are primary identity and natural-texture observations; no
  microbial mechanism, measured lithium extraction, isolated recovery yield or mineral criticality is
  asserted. The studies are also used in cmmmech:amblygonite and are not independent experiments for each
  owner; the ambiguous XN163 heating arm is not transferred here as a montebrasite-specific threshold.'
