mechanisms:
  - id: putida_catechol_associated_accumulation
    name: Catechol-associated germanium accumulation by Pseudomonas putida
    process: other
    description: >-
      Living ATCC 33015 cells accumulated germanium from GeO2-supplemented
      laboratory media. Catechol-associated accumulation included an
      intracellular component alongside envelope binding. An inducible
      catechol-transport explanation remains proposed. The two papers are
      companion studies from the same laboratory, not independent replication.
      Bioaccumulation is represented as other rather than isolated-product recovery.
    context: >-
      NCBITaxon:303 identifies the species, not ATCC 33015. The kinetic study
      used acetate-grown inocula, aerated mineral medium at pH 7.3, 2 mM GeO2,
      and 4 mM catechol or 5/10 mM acetate; cultivation used 30 degrees C and
      reciprocating shaking. Washed, sonicated pellets were measured by
      71Ge scintillation, normalized to dry cell mass, over approximately
      15 hours. The separate localization/fractionation study used 10 mM
      GeO2, 4 mM catechol or 10 mM acetate, and 30 degrees C shaking;
      its fractionation assay used 300 mL with about 0.15 g initial dry
      cells and 12 hours. Cells were washed with distilled water before
      sonication, differential centrifugation and radiometric fraction analysis.
    microbial: true
    organisms:
      - id: NCBITaxon:303
        label: Pseudomonas putida
    evidence:
      - source_ref: chmielowski1986
        supports: support
        explanation: >-
          Pages 1100-1103 and Figures 1-4 report approximately 22 micromol
          Ge/g dry cells with catechol versus an approximately 10 micromol/g
          acetate plateau. Mixed substrates delayed the second accumulation
          phase. Medium germanium decreased only about 5%, despite catechol
          consumption; this is not efficient solution depletion or a recovery yield.
      - source_ref: chmielowski1986
        supports: partial
        explanation: >-
          The kinetic association supports substrate-dependent uptake but
          does not identify a transporter experimentally. The methods report
          two separate 4 mL aliquots of each sonicated suspension for
          scintillation counting; biological-replicate counts, statistical
          uncertainty and matched killed-cell or cell-free controls are not
          reported. Surface binding also contributes to the pellet signal.
      - source_ref: klapcinska1986
        supports: support
        explanation: >-
          Table 1 reports 2.46 versus 0.81 mg Ge/g dry cells with catechol
          versus acetate, respectively, and 83.4% versus 58.0% of accumulated
          Ge in the soluble fraction. Figures 1-3 compare Ge-free controls
          with loaded cells: envelope contrast and catechol-associated
          cytoplasmic deposits support localization. The 10 mM assay is
          distinct from the companion 2 mM kinetic experiment.
      - source_ref: klapcinska1986
        supports: partial
        explanation: >-
          Fractionation and microscopy support intracellular accumulation,
          but electron contrast does not identify a germanium mineral phase
          or oxidation state. Replication and uncertainty are not reported.
          Neither study establishes transporter causality, selective product
          isolation, a full mass balance or industrial deployment.
