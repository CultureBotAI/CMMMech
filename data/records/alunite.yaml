id: cmmmech:alunite
name: Alunite
material_kind: mineral
description: Alunite is the potassium aluminium hydroxysulfate mineral KAl3(SO4)2(OH)6, listed by IMA-CNMNC
  in September 2026 as redefined, 1987 s.p. It is a distinct species within the alunite group, not a label
  for every aluminium sulfate or mixed mining residue. Zhong et al. (2019) examined a natural alunite-bearing
  ore containing quartz and kaolinite. Their laboratory CaO-assisted thermal treatment followed by water
  leaching increased soluble potassium under selected conditions; the separate evaporation product remained
  a mixture of potassium/calcium sulfate phases. The accepted experiment is abiotic and does not establish
  microbial extraction, a pure potassium product, complete aluminium recovery, or industrial deployment.
  No constituent-element criticality is inherited.
